  var PA = '<div class="passage"><h4>Heat on the Practice Field</h4><div class="by">A short article</div>' +
    '<p><span class="pn">1</span>Florida summers are hot, and high school football practice starts in late July, during some of the hottest weeks of the year.</p>' +
    '<p><span class="pn">2</span>Players wear heavy pads and helmets. Because the gear covers so much of the body, it traps heat inside. As a result, a player can lose a lot of water through sweat in a single practice.</p>' +
    '<p><span class="pn">3</span>When players don’t drink enough water, their muscles can cramp and they may feel dizzy or sick. That is why many schools now practice early in the morning and stop often for water breaks.</p>' +
    '<p><span class="pn">4</span>These changes have made a difference. Since the new routines started, many coaches say fewer players have had to sit out because of the heat.</p></div>';
