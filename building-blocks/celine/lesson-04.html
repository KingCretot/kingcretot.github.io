<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce&#x27;Line · Lesson 4: Solve It, Estimate It and The Last S&#x27;more</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L04", "label": "Lesson 4", "title": "Solve It, Estimate It and The Last S'more", "goal": "I can find the clue word, add or subtract, estimate to check, and tell the lesson a story teaches.", "date": "2026-12-01", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Solve It, Estimate It: On Your Own", "text": "Welcome back! Now you practice what you learned in class.<br>Keep paper and a pencil next to you.", "visual": {"kind": "emoji", "text": "🔎➕➖🔥"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["Name 2 clue words that mean <b>add</b>. Name 2 that mean <b>subtract</b>.", "How do you <b>estimate</b> 238 + 451?", "What is the <b>theme</b> of “The Last S'more”?"], "starters": ["Add words are … Subtract words are …", "I round each number to …", "The theme is …"]}, {"type": "vocab", "kick": "Word Power", "title": "Review your words", "text": "Say the meaning out loud first. Then flip the card to check.", "words": [{"word": "word problem", "pos": "noun", "meaning": "A math problem told as a story.", "example": "“Ali has 5 pens. He gets 3 more. How many pens now?” is a <b>word problem</b>.", "emoji": "📖"}, {"word": "clue word", "pos": "noun", "meaning": "A word in a word problem that tells you to add or subtract.", "example": "<b>Left</b> is a <b>clue word</b>. It tells me to subtract.", "emoji": "🔎"}, {"word": "total", "pos": "noun", "meaning": "The whole amount after you add everything.", "example": "136 books and 285 books make a <b>total</b> of 421 books.", "emoji": "🧺"}, {"word": "estimate", "pos": "noun or verb", "meaning": "A close, smart guess. You round first, then add or subtract.", "example": "238 + 451 is about 200 + 500. My <b>estimate</b> is 700.", "emoji": "🎯"}, {"word": "reasonable", "pos": "adjective", "meaning": "Makes sense. It is close to what you expect.", "example": "689 is <b>reasonable</b> for 238 + 451. 89 is not.", "emoji": "👍"}, {"word": "theme", "pos": "noun", "meaning": "The big lesson about life that a story teaches.", "example": "The <b>theme</b> of a story can be “Never give up.”", "emoji": "💡"}, {"word": "lesson", "pos": "noun", "meaning": "Something important you learn.", "example": "Sam learned a <b>lesson</b>: practice helps.", "emoji": "🎒"}, {"word": "moral", "pos": "noun", "meaning": "The lesson at the end of a fable.", "example": "The <b>moral</b> of a fable can be “Slow and steady wins the race.”", "emoji": "🦊"}, {"word": "kindness", "pos": "noun", "meaning": "Being caring and giving to other people.", "example": "Sharing your snack is an act of <b>kindness</b>.", "emoji": "💛"}]}, {"type": "learn", "kick": "Remember", "title": "Detective steps", "text": "Do these steps on every word problem.", "steps": [{"text": "<b>1. Read</b> the whole problem."}, {"text": "<b>2. Find</b> the clue word."}, {"text": "<b>3. Decide:</b> add or subtract?"}, {"text": "<b>4. Estimate:</b> round to the nearest hundred."}, {"text": "<b>5. Solve</b> on paper. <b>6. Check:</b> is it close to the estimate?"}], "tip": "Theme: ask, “What lesson does this story teach?”"}, {"type": "tap", "kick": "Try it", "title": "Add or subtract?", "text": "Find the clue word first.", "items": [{"type": "fill", "q": "A farm had 364 hens. 127 hens went to a new barn. How many hens <b>remain</b>? Add or subtract? Type <b>add</b> or <b>subtract</b>.", "answers": ["subtract", "subtraction", "subtracting", "minus", "take away", "-"], "why": "The clue words ask what is <b>left</b> or the <b>gap</b>, so you <b>subtract</b>.", "no": "Find the clue word first. Does it ask for a total, or for what is left or the gap?", "placeholder": "add or subtract"}, {"type": "fill", "q": "Lila sold 215 tickets on Friday and 187 on Saturday. How many tickets did she sell <b>in all</b>? Add or subtract? Type <b>add</b> or <b>subtract</b>.", "answers": ["add", "addition", "adding", "plus", "+"], "why": "The clue words ask for the <b>total</b>, so you <b>add</b>.", "no": "Find the clue word first. Does it ask for a total, or for what is left or the gap?", "placeholder": "add or subtract"}, {"q": "Which clue words tell you to <b>subtract</b>?", "choices": ["sum", "altogether", "how many more", "how many in all"], "a": 2, "why": "<b>How many more</b> asks for the gap between two numbers. Subtract.", "no": ["Sum means add.", "Altogether means add.", null, "In all means add."]}]}, {"type": "tap", "kick": "Try it", "title": "Round and estimate", "text": "Look at the tens digit.", "items": [{"type": "fill", "q": "Round <b>583</b> to the nearest hundred: ____", "answers": ["600"], "why": "Look at the tens digit: <b>8</b>. 5 or more rounds up. So 583 rounds to <b>600</b>.", "no": "Look at the tens digit. 5 or more rounds up. Less than 5 rounds down.", "hint": "583 is between 500 and 600. Which is it closer to?", "placeholder": "Type a number"}, {"type": "fill", "q": "Round each number to the nearest hundred. Then add. Estimate <b>247 + 318</b>: ____", "answers": ["500", "about 500"], "why": "247 rounds to 200. 318 rounds to 300. 200 + 300 = <b>500</b>.", "no": "Round first: 247 → ?, 318 → ?. Then add the round numbers.", "hint": "247 rounds to 200.", "placeholder": "Type a number"}, {"type": "fill", "q": "Round each number to the nearest hundred. Then subtract. Estimate <b>806 − 391</b>: ____", "answers": ["400", "about 400"], "why": "806 rounds to 800. 391 rounds to 400. 800 − 400 = <b>400</b>.", "no": "Round first: 806 → ?, 391 → ?. Then subtract the round numbers.", "hint": "806 rounds to 800.", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Try it", "title": "Solve it", "text": "Solve on paper first. Then type the number.", "items": [{"type": "fill", "q": "The zoo had <b>254</b> visitors in the morning. <b>179</b> more came in the afternoon. How many visitors in all?", "answers": ["433", "about 433"], "why": "The clue word means add. <b>254 + 179 = 433</b> visitors.", "no": "Add 254 + 179. Line up the ones. Regroup when a column makes 10 or more.", "hint": "Ones first: 4 + 9 = 13.", "placeholder": "Type a number"}, {"type": "fill", "q": "A box had <b>500</b> crayons. The class used <b>264</b>. How many crayons are left?", "answers": ["236", "about 236"], "why": "The clue word means subtract. <b>500 − 264 = 236</b> crayons.", "no": "Subtract 500 − 264. Start with the ones. Borrow when the top digit is too small.", "hint": "Check: 236 + 264 should make 500.", "placeholder": "Type a number"}, {"type": "fill", "q": "Mia found <b>145</b> shells. Theo found <b>213</b> shells. How many more shells did Theo find?", "answers": ["68", "about 68"], "why": "The clue word means subtract. <b>213 − 145 = 68</b> more shells.", "no": "Subtract 213 − 145. Start with the ones. Borrow when the top digit is too small.", "hint": "Check: 68 + 145 should make 213.", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Try it", "title": "Does it make sense?", "text": "Estimate first. Then choose.", "items": [{"q": "Estimate first: <b>271 + 534</b> is about 300 + 500 = <b>800</b>. Which answer is <b>reasonable</b>?", "choices": ["805", "8,050", "263"], "a": 0, "why": "271 + 534 = <b>805</b>. It is close to the estimate, 800.", "no": [null, "8,050 is about ten times too big. It is not close to 800.", "263 is what you get if you subtract. This problem adds."]}, {"q": "Estimate first: <b>723 − 348</b> is about 700 − 300 = <b>400</b>. Which answer is <b>reasonable</b>?", "choices": ["1,071", "3,750", "375"], "a": 2, "why": "723 − 348 = <b>375</b>. It is close to the estimate, 400.", "no": ["1,071 is what you get if you add. This problem subtracts, so the answer must be smaller than 723.", "3,750 is about ten times too big. It is not close to 400.", null]}]}, {"type": "tap", "kick": "Read", "title": "Leo and the Kite", "text": "Read the story. Then answer.", "visual": {"kind": "passage", "text": "Leo borrowed his friend Max's kite. A big wind blew. The kite hit a tree and tore. Leo hid the kite under his bed. All week, his tummy felt bad. On Friday, Leo told Max the truth. “Thank you for telling me,” Max said. They fixed the kite together."}, "items": [{"type": "fill", "q": "Where did Leo hide the kite?", "answers": ["under his bed", "under the bed", "his bed", "bed", "under bed"], "why": "Leo hid it <b>under his bed</b>.", "no": "Look at the fourth sentence.", "placeholder": "Type a few words"}, {"q": "What is the <b>theme</b> of this story?", "choices": ["Leo hid the kite under his bed.", "Kites can tear in the wind.", "Telling the truth is better than hiding a mistake.", "You should never borrow anything from a friend, not even a kite."], "a": 2, "why": "Leo felt bad when he hid it. He felt better when he told the truth. That is the <b>theme</b>.", "no": ["That is plot. It tells what happens.", "That is a small detail, not the big lesson.", null, "That does not fit. Max was glad Leo told him."]}, {"type": "fill", "q": "“Leo told Max the truth.” Is this the <b>plot</b> or the <b>theme</b>? Type <b>plot</b> or <b>theme</b>.", "answers": ["plot"], "why": "It tells <b>what happens</b>, so it is <b>plot</b>.", "no": "Plot is what happens. Theme is a lesson about life.", "placeholder": "plot or theme"}]}, {"type": "tap", "kick": "Read", "title": "Sam's Swim", "text": "Read the story. Then answer.", "visual": {"kind": "passage", "text": "Sam could not swim across the pool. On Monday, he sank and swallowed water. He wanted to quit. His coach said, “Try one more time.” Sam practiced every day. On Friday, Sam swam all the way across! Everyone cheered."}, "items": [{"q": "Why did Sam want to quit?", "choices": ["He sank and swallowed water.", "His coach yelled at him.", "The other kids at the pool laughed at him."], "a": 0, "why": "On Monday, Sam <b>sank and swallowed water</b>.", "no": [null, "The coach said, “Try one more time.” That is kind, not yelling.", "The story does not say anyone laughed."]}, {"q": "What is the <b>theme</b> of this story?", "choices": ["On Friday, Sam swam all the way across the pool.", "If you keep trying, you can get better.", "Pools are dangerous.", "Sam"], "a": 1, "why": "Sam kept practicing and did it. The lesson: <b>keep trying</b>.", "no": ["That is plot. It tells what happens.", null, "That does not fit. Sam learned to swim!", "A theme is a whole idea, not one name."]}, {"type": "fill", "q": "Sam's lesson in 2 words: Don't give ____.", "answers": ["up"], "why": "<b>Don't give up!</b>", "no": "What do you say to a friend who wants to quit?", "placeholder": "Type one word"}]}, {"type": "recall", "kick": "Remember", "title": "Weeks 1–3", "text": "Skills from before the break.", "items": [{"type": "fill", "q": "Round <b>452</b> to the nearest <b>ten</b>: ____", "answers": ["450"], "why": "The ones digit is 2. Less than 5 rounds down. <b>450</b>.", "no": "Look at the ones digit this time.", "hint": "452 is between 450 and 460.", "placeholder": "Type a number"}, {"type": "fill", "q": "Type <b>&gt;</b> or <b>&lt;</b>: &nbsp; 671 ____ 617", "answers": [">", "greater than", "is greater than"], "why": "Hundreds are the same. Tens: 7 is more than 1. <b>671 &gt; 617</b>.", "no": "Compare the hundreds, then the tens.", "hint": "The open side faces the bigger number.", "placeholder": "Type > or <"}, {"type": "fill", "q": "<b>347 + 286 = ____</b>", "answers": ["633"], "why": "7 + 6 = 13: write 3, carry 1. 4 + 8 + 1 = 13: write 3, carry 1. 3 + 2 + 1 = 6. <b>633</b>.", "no": "Carry 1 ten from the ones. Then carry 1 hundred from the tens.", "placeholder": "Type a number"}, {"q": "First, Theo's family pitched the tent. Next, they built a fire. Then they cooked chili. Telling events in order is called …", "choices": ["setting", "sequence", "conflict"], "a": 1, "why": "Putting events in order is the <b>sequence</b>.", "no": ["Setting is where and when.", null, "Conflict is the problem."]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "A theater had 520 seats. 285 people sat down. How many seats are <b>left</b>? Add or subtract? Type <b>add</b> or <b>subtract</b>.", "answers": ["subtract", "subtraction", "subtracting", "minus", "take away", "-"], "why": "The clue words ask what is <b>left</b> or the <b>gap</b>, so you <b>subtract</b>.", "no": "Find the clue word first. Does it ask for a total, or for what is left or the gap?", "placeholder": "add or subtract"}, {"type": "fill", "q": "Round <b>461</b> to the nearest hundred: ____", "answers": ["500"], "why": "Look at the tens digit: <b>6</b>. 5 or more rounds up. So 461 rounds to <b>500</b>.", "no": "Look at the tens digit. 5 or more rounds up. Less than 5 rounds down.", "hint": "461 is between 400 and 500. Which is it closer to?", "placeholder": "Type a number"}, {"type": "fill", "q": "Round each number to the nearest hundred. Then add. Estimate <b>236 + 417</b>: ____", "answers": ["600", "about 600"], "why": "236 rounds to 200. 417 rounds to 400. 200 + 400 = <b>600</b>.", "no": "Round first: 236 → ?, 417 → ?. Then add the round numbers.", "hint": "236 rounds to 200.", "placeholder": "Type a number"}, {"type": "fill", "q": "A store sold <b>268</b> red balloons and <b>354</b> blue balloons. What is the total?", "answers": ["622", "about 622"], "why": "The clue word means add. <b>268 + 354 = 622</b> balloons.", "no": "Add 268 + 354. Line up the ones. Regroup when a column makes 10 or more.", "hint": "Ones first: 8 + 4 = 12.", "placeholder": "Type a number"}, {"type": "fill", "q": "A farmer picked <b>425</b> peaches. He sold <b>168</b>. How many peaches remain?", "answers": ["257", "about 257"], "why": "The clue word means subtract. <b>425 − 168 = 257</b> peaches.", "no": "Subtract 425 − 168. Start with the ones. Borrow when the top digit is too small.", "hint": "Check: 257 + 168 should make 425.", "placeholder": "Type a number"}, {"q": "Estimate first: <b>314 + 389</b> is about 300 + 400 = <b>700</b>. Which answer is <b>reasonable</b>?", "choices": ["75", "703", "7,030"], "a": 1, "why": "314 + 389 = <b>703</b>. It is close to the estimate, 700.", "no": ["75 is what you get if you subtract. This problem adds.", null, "7,030 is about ten times too big. It is not close to 700."]}, {"q": "Read <b>Nia's Lunch</b>. What is the <b>theme</b>?", "choices": ["Ava picked up her lunch tray and sat down right next to Nia.", "Lunch is the best part of school.", "Ava", "A small act of kindness can make someone feel welcome."], "a": 3, "why": "Ava was kind, and Nia felt welcome. That is the <b>theme</b>.", "no": ["That is plot. It tells what happens.", "The story does not teach that.", "A theme is a whole idea, not one name.", null], "visual": {"kind": "passage", "text": "Nia was new at school. At lunch, she sat all alone. Ava saw her. Ava picked up her tray and sat next to Nia. “Do you like puzzles?” Ava asked. Nia smiled. Now they do puzzles together every day."}}, {"type": "fill", "q": "“Practice helps you get better.” Is this the <b>plot</b> or the <b>theme</b>? Type <b>plot</b> or <b>theme</b>.", "answers": ["theme"], "why": "It is a <b>lesson about life</b>, so it is a <b>theme</b>.", "no": "Plot is what happens. Theme is a lesson about life.", "placeholder": "plot or theme"}], [{"type": "fill", "q": "Ms. Lee's class collected 236 cans. Mr. Ray's class collected 198 cans. How many cans did both classes collect <b>altogether</b>? Add or subtract? Type <b>add</b> or <b>subtract</b>.", "answers": ["add", "addition", "adding", "plus", "+"], "why": "The clue words ask for the <b>total</b>, so you <b>add</b>.", "no": "Find the clue word first. Does it ask for a total, or for what is left or the gap?", "placeholder": "add or subtract"}, {"type": "fill", "q": "Round <b>347</b> to the nearest hundred: ____", "answers": ["300"], "why": "Look at the tens digit: <b>4</b>. Less than 5 rounds down. So 347 rounds to <b>300</b>.", "no": "Look at the tens digit. 5 or more rounds up. Less than 5 rounds down.", "hint": "347 is between 300 and 400. Which is it closer to?", "placeholder": "Type a number"}, {"type": "fill", "q": "Round each number to the nearest hundred. Then add. Estimate <b>381 + 446</b>: ____", "answers": ["800", "about 800"], "why": "381 rounds to 400. 446 rounds to 400. 400 + 400 = <b>800</b>.", "no": "Round first: 381 → ?, 446 → ?. Then add the round numbers.", "hint": "381 rounds to 400.", "placeholder": "Type a number"}, {"type": "fill", "q": "Dev counted <b>179</b> cars on Monday and <b>246</b> cars on Tuesday. How many cars in all?", "answers": ["425", "about 425"], "why": "The clue word means add. <b>179 + 246 = 425</b> cars.", "no": "Add 179 + 246. Line up the ones. Regroup when a column makes 10 or more.", "hint": "Ones first: 9 + 6 = 15.", "placeholder": "Type a number"}, {"type": "fill", "q": "You need <b>610</b> points to win a game. Jo has <b>234</b> points. How many more points does she need?", "answers": ["376", "about 376"], "why": "The clue word means subtract. <b>610 − 234 = 376</b> points.", "no": "Subtract 610 − 234. Start with the ones. Borrow when the top digit is too small.", "hint": "Check: 376 + 234 should make 610.", "placeholder": "Type a number"}, {"q": "Estimate first: <b>456 + 238</b> is about 500 + 200 = <b>700</b>. Which answer is <b>reasonable</b>?", "choices": ["6,940", "218", "694"], "a": 2, "why": "456 + 238 = <b>694</b>. It is close to the estimate, 700.", "no": ["6,940 is about ten times too big. It is not close to 700.", "218 is what you get if you subtract. This problem adds.", null]}, {"q": "Read <b>Max's Tower</b>. What is the <b>theme</b>?", "choices": ["Max stacked the blocks fast, and his tower fell down.", "Careful work is better than rushing.", "Blocks are fun to stack.", "Always build as fast as you can."], "a": 1, "why": "Rushing made the tower fall. Careful work made it stand. That is the <b>theme</b>.", "no": ["That is plot. It tells what happens.", null, "That is a detail, not the lesson.", "That does not fit. The fast tower fell!"], "visual": {"kind": "passage", "text": "Max wanted to build the tallest block tower, fast. He stacked the blocks as quickly as he could. Crash! The tower fell. Next, Max set each block down slowly and carefully. His new tower stood tall."}}, {"type": "fill", "q": "“Max set each block down slowly.” Is this the <b>plot</b> or the <b>theme</b>? Type <b>plot</b> or <b>theme</b>.", "answers": ["plot"], "why": "It tells <b>what happens</b>, so it is <b>plot</b>.", "no": "Plot is what happens. Theme is a lesson about life.", "placeholder": "plot or theme"}], [{"type": "fill", "q": "Jay's team scored 412 points. Kim's team scored 375 points. What is the <b>difference</b> between the scores? Add or subtract? Type <b>add</b> or <b>subtract</b>.", "answers": ["subtract", "subtraction", "subtracting", "minus", "take away", "-"], "why": "The clue words ask what is <b>left</b> or the <b>gap</b>, so you <b>subtract</b>.", "no": "Find the clue word first. Does it ask for a total, or for what is left or the gap?", "placeholder": "add or subtract"}, {"type": "fill", "q": "Round <b>682</b> to the nearest hundred: ____", "answers": ["700"], "why": "Look at the tens digit: <b>8</b>. 5 or more rounds up. So 682 rounds to <b>700</b>.", "no": "Look at the tens digit. 5 or more rounds up. Less than 5 rounds down.", "hint": "682 is between 600 and 700. Which is it closer to?", "placeholder": "Type a number"}, {"type": "fill", "q": "Round each number to the nearest hundred. Then add. Estimate <b>529 + 184</b>: ____", "answers": ["700", "about 700"], "why": "529 rounds to 500. 184 rounds to 200. 500 + 200 = <b>700</b>.", "no": "Round first: 529 → ?, 184 → ?. Then add the round numbers.", "hint": "529 rounds to 500.", "placeholder": "Type a number"}, {"type": "fill", "q": "A shop sold <b>385</b> hot dogs and <b>137</b> hamburgers. How many did it sell altogether?", "answers": ["522", "about 522"], "why": "The clue word means add. <b>385 + 137 = 522</b> hot dogs and hamburgers.", "no": "Add 385 + 137. Line up the ones. Regroup when a column makes 10 or more.", "hint": "Ones first: 5 + 7 = 12.", "placeholder": "Type a number"}, {"type": "fill", "q": "A rope is <b>352</b> inches long. Dad cuts off <b>179</b> inches. How many inches are left?", "answers": ["173", "about 173"], "why": "The clue word means subtract. <b>352 − 179 = 173</b> inches.", "no": "Subtract 352 − 179. Start with the ones. Borrow when the top digit is too small.", "hint": "Check: 173 + 179 should make 352.", "placeholder": "Type a number"}, {"q": "Estimate first: <b>627 − 195</b> is about 600 − 200 = <b>400</b>. Which answer is <b>reasonable</b>?", "choices": ["822", "432", "4,320"], "a": 1, "why": "627 − 195 = <b>432</b>. It is close to the estimate, 400.", "no": ["822 is what you get if you add. This problem subtracts, so the answer must be smaller than 627.", null, "4,320 is about ten times too big. It is not close to 400."]}, {"q": "Read <b>Rosa's Garden</b>. What is the <b>theme</b>?", "choices": ["Give up if nothing happens fast.", "Rosa watered her seeds every day, even when she saw only dirt.", "Good things can take time, so be patient.", "Flowers are red."], "a": 2, "why": "Rosa waited and kept watering, and the flowers came. That is the <b>theme</b>.", "no": ["That does not fit. Rosa did not give up.", "That is plot. It tells what happens.", null, "That is a detail, not the lesson."], "visual": {"kind": "passage", "text": "Rosa planted flower seeds. Every day she looked for flowers. Every day she saw only dirt. She kept watering anyway. After three weeks, tiny green sprouts popped up. Soon there were red flowers everywhere."}}, {"type": "fill", "q": "“Being patient pays off.” Is this the <b>plot</b> or the <b>theme</b>? Type <b>plot</b> or <b>theme</b>.", "answers": ["theme"], "why": "It is a <b>lesson about life</b>, so it is a <b>theme</b>.", "no": "Plot is what happens. Theme is a lesson about life.", "placeholder": "plot or theme"}]]}], "win": "Clue words, estimates and themes: you came back strong! 🔥", "prev": "bb-celine-L03", "prevTitle": "Lesson 3"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&
