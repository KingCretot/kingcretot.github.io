<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce&#x27;Line · Lesson 7: Pricing Day and The Grumpy Hiker</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L07", "label": "Lesson 7", "title": "Pricing Day and The Grumpy Hiker", "goal": "I can skip-count by 5s and 10s to find price totals, and I can compare two characters' points of view.", "date": "2026-12-29", "mastery": 85, "color": "#D35400", "slides": [{"type": "hello", "title": "On Your Own: Views and Prices", "text": "You learned two big skills in class. Now try them on your own. Take your time. 👀🏷️", "visual": {"kind": "emoji", "text": "👀💭🏷️"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["What is a <b>point of view</b>?", "Why did Theo and Mia see the hiker in two different ways?", "How do you find the <b>total</b> when every item costs $5?"], "starters": ["A point of view is …", "Theo felt … but Mia noticed …", "I multiply the … by the …"]}, {"type": "vocab", "kick": "Word Power", "title": "Your 9 words", "text": "Tap each card. Say the word. Say what it means.", "words": [{"word": "point of view", "pos": "noun", "meaning": "The way <b>one person</b> sees a moment.", "example": "From Theo's <b>point of view</b>, the hiker was rude.", "emoji": "👀"}, {"word": "perspective", "pos": "noun", "meaning": "A person's <b>own way</b> of seeing or understanding something.", "example": "Mia's <b>perspective</b> was different from Theo's.", "emoji": "🔭"}, {"word": "empathy", "pos": "noun", "meaning": "Understanding and <b>caring</b> about how someone else feels.", "example": "Mia showed <b>empathy</b> for the tired hiker.", "emoji": "💙"}, {"word": "interpret", "pos": "verb", "meaning": "To <b>explain</b> what something means to you.", "example": "Theo and Mia <b>interpreted</b> the same moment in two ways.", "emoji": "💭"}, {"word": "skip-count", "pos": "verb", "meaning": "To count by a number that is <b>not 1</b>.", "example": "<b>Skip-count</b> by 10s: 10, 20, 30, 40.", "emoji": "🦘"}, {"word": "multiple", "pos": "noun", "meaning": "A number you <b>land on</b> when you skip-count.", "example": "25 is a <b>multiple</b> of 5.", "emoji": "📍"}, {"word": "factor", "pos": "noun", "meaning": "A number that you <b>multiply</b>.", "example": "In 2 × 10 = 20, the <b>factors</b> are 2 and 10.", "emoji": "🔢"}, {"word": "price", "pos": "noun", "meaning": "How much <b>one</b> thing costs.", "example": "The <b>price</b> of one comb is $5.", "emoji": "🏷️"}, {"word": "quantity", "pos": "noun", "meaning": "<b>How many</b> things there are.", "example": "Gus buys 3 caps. The <b>quantity</b> is 3.", "emoji": "🧮"}]}, {"type": "learn", "kick": "Remember", "title": "Two points of view", "text": "Two people can see the <b>same moment</b> in two ways.<br>What each person <b>notices</b> and <b>feels</b> shapes their view.<br>Use <b>clues</b> to infer what someone feels.", "visual": {"kind": "passage", "text": "🧑 <b>Theo</b> felt hurt.<br>👧 <b>Mia</b> saw the clues.<br><i>Both views can be true.</i>"}, "tip": "Ask: What clue makes me think that?"}, {"type": "tap", "kick": "Try it", "title": "A chewed sneaker", "text": "Read the story. Then answer.", "visual": {"kind": "passage", "text": "Nora and her brother Felix made a paper boat. They put it in the pond. It sank.<br>Felix groaned. “All that work!”<br>Nora giggled. “Now the fish have a boat!”"}, "items": [{"type": "fill", "q": "How did <b>Felix</b> feel? Type one word.", "answers": ["upset", "mad", "angry", "sad", "annoyed", "grumpy", "frustrated", "unhappy", "disappointed", "bad", "bummed"], "why": "Felix groaned about all his work. He felt <b>upset</b>.", "no": "Look at the clue: he groaned.", "placeholder": "Type a feeling"}, {"q": "How did <b>Nora</b> feel?", "choices": ["She was mad at Felix.", "She was scared of the pond.", "She thought it was funny."], "a": 2, "why": "Nora <b>giggled</b>. She thought it was funny.", "no": ["The story does not say she was mad.", "She giggled. That is not scared.", null]}, {"type": "fill", "q": "Felix and Nora saw the same moment in two ways. They had two points of ____.", "answers": ["view"], "why": "Two people, two <b>points of view</b>.", "no": "Points of v…", "placeholder": "Type a word"}]}, {"type": "sort", "kick": "Sort it", "title": "Is Oscar cold?", "text": "Which details are <b>clues</b> that Oscar is cold? Tap a card. Then tap a box.", "buckets": ["🔍 Clue<br><small>he is cold</small>", "🚫 Not a clue"], "items": [{"text": "His teeth are chattering.", "b": 0, "why": "Teeth chatter when you are <b>cold</b>.", "hint": "Does this happen when you are cold?"}, {"text": "He has a red backpack.", "b": 1, "why": "A backpack does not tell how he feels.", "hint": "Does this tell you anything about cold?"}, {"text": "He rubs his hands together.", "b": 0, "why": "People rub their hands to <b>warm</b> them.", "hint": "Why do people rub their hands?"}, {"text": "His sister's name is Hazel.", "b": 1, "why": "A name is not a clue about cold.", "hint": "Does a name tell you he is cold?"}, {"text": "He zips his coat up to his chin.", "b": 0, "why": "He wants to stay <b>warm</b>.", "hint": "Why would he zip his coat so high?"}, {"text": "He likes math class.", "b": 1, "why": "Liking math does not tell you he is cold.", "hint": "Is this about cold?"}], "done": "Good readers use the <b>clues</b> that matter. That is how you infer."}, {"type": "tap", "kick": "Try it", "title": "Infer it", "text": "Read. Use the clues.", "visual": {"kind": "passage", "text": "Joel came in from the yard. His knees had green grass stains. He held a muddy ball. His face was red and sweaty. He was grinning."}, "items": [{"q": "What can you <b>infer</b> about Joel?", "choices": ["He was playing outside.", "He was sleeping in his bed.", "He was reading a book."], "a": 0, "why": "Grass stains, a muddy ball and a sweaty face are clues. He was <b>playing outside</b>.", "no": [null, "Sleeping would not give him grass stains.", "Reading would not make him sweaty."]}, {"type": "fill", "q": "To figure something out from clues is to ____.", "answers": ["infer", "make an inference", "inference"], "why": "To figure something out from clues is to <b>infer</b>.", "no": "It starts with <b>in</b>. Mia did it in the hiker story.", "placeholder": "Type a word"}, {"type": "fill", "q": "Was Joel happy or sad? Type <b>happy</b> or <b>sad</b>.", "answers": ["happy"], "why": "He was <b>grinning</b>. That is a clue that he was happy.", "no": "Look at the last sentence. What was his face doing?", "placeholder": "happy or sad"}]}, {"type": "learn", "kick": "Remember", "title": "Skip-count and multiply", "text": "Skip-count by 5s: 5, 10, 15, 20, 25 …<br>Skip-count by 10s: 10, 20, 30, 40, 50 …<br><b>Price × quantity = total</b>.", "visual": {"kind": "bigtext", "text": "$10 × 3 = $30", "sub": "3 jumps of 10: 10, 20, 30"}, "tip": "Each, per and every are clues to <b>multiply</b>."}, {"type": "tap", "kick": "Try it", "title": "Skip-count", "items": [{"type": "fill", "q": "Skip-count by 5s: 60, 65, 70, ____", "answers": ["75"], "why": "70 + 5 = <b>75</b>.", "no": "Add 5 to the last number.", "placeholder": "Type a number"}, {"q": "Which number is <b>not</b> a multiple of 10?", "choices": ["30", "70", "85", "100"], "a": 2, "why": "Multiples of 10 end in <b>0</b>. 85 ends in 5. It is a multiple of 5, not 10.", "no": ["30 ends in 0. It is 3 jumps of 10.", "70 ends in 0. It is 7 jumps of 10.", null, "100 ends in 0. It is 10 jumps of 10."]}, {"type": "fill", "q": "Skip-count by 10s: 40, 50, 60, ____", "answers": ["70"], "why": "60 + 10 = <b>70</b>.", "no": "Add 10 to the last number.", "placeholder": "Type a number"}, {"type": "fill", "q": "How many jumps of 5 does it take to get to <b>35</b>?", "answers": ["7", "seven"], "why": "5, 10, 15, 20, 25, 30, 35. That is <b>7</b> jumps.", "no": "Count by 5s. Hold up a finger for each jump.", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Try it", "title": "Price problems", "text": "Find the price. Find the quantity. Multiply.", "items": [{"type": "fill", "q": "Whistles cost <b>$5</b> each. Tariq buys <b>7</b>. What is the total?", "answers": ["35", "35 dollars"], "why": "<b>7 × 5 = 35</b>. The total is <b>$35</b>.", "no": "Skip-count by 5s, 7 jumps.", "placeholder": "Type a number"}, {"type": "fill", "q": "Tin cups cost <b>$10</b> each. A troop buys <b>9</b>. What is the total?", "answers": ["90", "90 dollars"], "why": "<b>9 × 10 = 90</b>. The total is <b>$90</b>.", "no": "Skip-count by 10s, 9 jumps.", "placeholder": "Type a number"}, {"q": "Esme says 4 bags at <b>$5</b> each cost <b>$9</b>. What did she do wrong?", "choices": ["She added 4 + 5.", "She counted by 10s.", "She left out one bag."], "a": 0, "why": "4 + 5 = 9. She should multiply: <b>4 × 5 = 20</b>. The total is <b>$20</b>.", "no": [null, "By 10s, 4 jumps land on 40, not 9.", "3 bags would cost $15, not $9."]}]}, {"type": "tap", "kick": "Try it", "title": "Multiply, add or subtract?", "text": "Read carefully. Not every problem is a times problem!", "items": [{"type": "fill", "q": "Bandanas cost <b>$5</b> each. Sadie buys <b>8</b>. What is the total?", "answers": ["40", "40 dollars"], "why": "Same price, 8 items: <b>8 × 5 = 40</b>. The total is <b>$40</b>.", "no": "Each bandana is $5. Skip-count by 5s, 8 jumps.", "placeholder": "Type a number"}, {"q": "Uma has $50. She spends $10. How much is <b>left</b>? What do you do?", "choices": ["subtract", "multiply", "add"], "a": 0, "why": "<b>Left</b> means take away. 50 − 10 = 40.", "no": [null, "There are no equal groups here.", "She spends money, so she has less, not more."]}, {"type": "fill", "q": "Toby buys a <b>$10</b> kite and a <b>$5</b> ball. How much does he spend in all?", "answers": ["15", "15 dollars"], "why": "Two different prices, so <b>add</b>: 10 + 5 = <b>15</b>.", "no": "The prices are not the same. Add them.", "placeholder": "Type a number"}]}, {"type": "recall", "kick": "Remember", "title": "From Weeks 1 to 6", "items": [{"q": "Which one is <b>true</b>?", "choices": ["531 > 513", "531 < 513", "531 = 513"], "a": 0, "why": "Both have 5 hundreds. 531 has 3 tens. 513 has 1 ten. So <b>531 > 513</b>.", "no": [null, "531 has 3 tens and 513 has 1 ten. 531 is bigger.", "The digits are in a different order, so they are not equal."]}, {"type": "fill", "q": "<b>702 − 296 = ____</b>", "answers": ["406"], "why": "You can't take 6 from 2, and there are 0 tens. Regroup a hundred into 10 tens, then a ten into 10 ones. 12 − 6 = 6. 9 − 9 = 0. 6 − 2 = 4. <b>406</b>.", "no": "There are 0 tens. Regroup from the hundreds first.", "placeholder": "Type a number", "hint": "Check: 406 + 296 should make 702."}, {"type": "fill", "q": "The <b>problem</b> in a story is called the ____.", "answers": ["conflict"], "why": "The problem in a story is the <b>conflict</b>.", "no": "It starts with <b>con</b>.", "placeholder": "Type a word"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Skip-count by 5s: 70, 75, 80, ____", "answers": ["85"], "why": "80 + 5 = <b>85</b>.", "no": "Add 5 to the last number.", "placeholder": "Type a number"}, {"q": "Mia skip-counts by 5s: <b>5, 10, 15, 21, 25</b>. Which number is a mistake?", "choices": ["10", "15", "21", "25"], "a": 2, "why": "15 + 5 = 20, not 21. Multiples of 5 end in <b>0 or 5</b>.", "no": ["10 is right. 5 + 5 = 10.", "15 is right. 10 + 5 = 15.", null, "25 is right. 20 + 5 = 25."]}, {"type": "fill", "q": "Postcards cost <b>$5</b> each. Vera buys <b>10</b>. What is the total?", "answers": ["50", "50 dollars"], "why": "<b>10 × 5 = 50</b>. The total is <b>$50</b>.", "no": "Skip-count by 5s, 10 jumps.", "placeholder": "Type a number"}, {"type": "fill", "q": "In <b>6 × 10 = 60</b>, the 6 and the 10 are called ____.", "answers": ["factors", "factor"], "why": "Numbers you multiply are <b>factors</b>.", "no": "They are the numbers you multiply. It starts with <b>f</b>.", "placeholder": "Type a word"}, {"type": "fill", "q": "The way one person sees a moment is their point of ____.", "answers": ["view"], "why": "That is their <b>point of view</b>.", "no": "Point of v…", "placeholder": "Type a word"}, {"q": "What can you <b>infer</b> about Lucia?", "choices": ["She is excited.", "She is hungry.", "She is sleepy."], "a": 2, "why": "Yawning and closing eyes are clues. She is <b>sleepy</b>.", "no": ["An excited person would not put her head down.", "No clue is about food.", null], "visual": {"kind": "passage", "text": "Lucia yawned. Her eyes kept closing. She put her head down on her desk."}}, {"q": "How did <b>Iris</b> feel about the drill?", "choices": ["scared of the loud bell", "glad she learned the way out", "angry that the drill was so long"], "a": 1, "why": "Iris clapped and said she knew the way out. She was <b>glad</b>.", "no": ["That was Ezra's point of view, not Iris's.", null, "The story does not say the drill was long."], "visual": {"kind": "passage", "text": "The school had a fire drill. The bell was very loud. Little Ezra cried and covered his ears.<br>His big sister Iris clapped. “Now I know the way out!” she said."}}, {"type": "fill", "q": "In <i>The Grumpy Hiker</i>, the strap on the hiker's pack was ____.", "answers": ["torn", "ripped", "broken", "torn up", "ripped up"], "why": "The strap was <b>torn</b>. It was a clue that he had a rough hike.", "no": "Mia saw the strap. It was not whole.", "placeholder": "Type a word"}], [{"type": "fill", "q": "Skip-count by 10s: 60, 70, 80, ____", "answers": ["90"], "why": "80 + 10 = <b>90</b>.", "no": "Add 10 to the last number.", "placeholder": "Type a number"}, {"q": "Which number is a <b>multiple of 5</b>?", "choices": ["41", "45", "52", "54"], "a": 1, "why": "Multiples of 5 end in <b>0 or 5</b>. 45 ends in 5.", "no": ["41 ends in 1.", null, "52 ends in 2.", "54 ends in 4."]}, {"type": "fill", "q": "Walking sticks cost <b>$10</b> each. A shop orders <b>8</b>. What is the total?", "answers": ["80", "80 dollars"], "why": "<b>8 × 10 = 80</b>. The total is <b>$80</b>.", "no": "Skip-count by 10s, 8 jumps.", "placeholder": "Type a number"}, {"type": "fill", "q": "The number on a price tag tells how much <b>one</b> thing costs. That number is the ____.", "answers": ["price", "cost"], "why": "How much one thing costs is its <b>price</b>.", "no": "It goes on a price tag. It starts with <b>p</b>.", "placeholder": "Type a word"}, {"type": "fill", "q": "Dina's friend was sad. Dina thought about how her friend felt and sat with her. Dina showed ____.", "answers": ["empathy"], "why": "Caring about how someone else feels is <b>empathy</b>.", "no": "It is one of your reading words. It starts with <b>em</b>.", "placeholder": "Type a lesson word"}, {"q": "What can you <b>infer</b> about the weather?", "choices": ["It is raining outside.", "He spilled his juice.", "It is a hot, sunny day."], "a": 0, "why": "A wet shirt, dripping hair and an umbrella are clues. It is <b>raining</b>.", "no": [null, "Juice would not make his hair drip, and it does not explain the umbrella.", "A sunny day would not need an umbrella."], "visual": {"kind": "passage", "text": "Reggie came inside. His shirt was wet. His hair dripped on the floor. He shook a wet umbrella."}}, {"q": "How did <b>Gwen</b> feel about the snake?", "choices": ["excited to hold it", "bored by the snake", "nervous about it"], "a": 2, "why": "Gwen stepped back and held her breath. She was <b>nervous</b>.", "no": ["That was Kenji's point of view.", "Stepping back is not a clue for bored.", null], "visual": {"kind": "passage", "text": "The class got a pet snake. Kenji's eyes lit up. He ran to the tank.<br>Gwen stepped back and held her breath."}}, {"type": "fill", "q": "In <i>The Grumpy Hiker</i>, Theo felt ____ when the hiker left.", "answers": ["hurt", "sad", "upset", "mad", "bad"], "why": "Theo felt <b>hurt</b>. He thought the hiker was rude.", "no": "Theo's feelings were hurt.", "placeholder": "Type a feeling"}], [{"type": "fill", "q": "Skip-count by 5s: 85, 90, 95, ____", "answers": ["100"], "why": "95 + 5 = <b>100</b>.", "no": "Add 5 to the last number.", "placeholder": "Type a number"}, {"q": "Theo skip-counts by 10s: <b>30, 45, 50, 60, 70</b>. Which number is a mistake?", "choices": ["30", "45", "60", "70"], "a": 1, "why": "30 + 10 = 40, not 45. Multiples of 10 end in <b>0</b>.", "no": ["30 is where he started. It ends in 0.", null, "60 is right. 50 + 10 = 60.", "70 is right. 60 + 10 = 70."]}, {"type": "fill", "q": "Bird baths cost <b>$10</b> each. Milo buys <b>4</b>. What is the total?", "answers": ["40", "40 dollars"], "why": "<b>4 × 10 = 40</b>. The total is <b>$40</b>.", "no": "Skip-count by 10s, 4 jumps.", "placeholder": "Type a number"}, {"type": "fill", "q": "10, 20 and 30 are numbers you land on when you skip-count by 10. They are ____ of 10.", "answers": ["multiples", "multiple"], "why": "They are <b>multiples</b> of 10.", "no": "It starts with <b>m</b>.", "placeholder": "Type a word"}, {"type": "fill", "q": "Mia saw the hiker in her own way. Her own way of seeing is her ____.", "answers": ["perspective", "point of view", "view"], "why": "That is her <b>perspective</b>.", "no": "It starts with <b>per</b>.", "placeholder": "Type a word"}, {"q": "What can you <b>infer</b> about Hattie?", "choices": ["She is baking.", "She is painting.", "She is at the beach."], "a": 0, "why": "Flour, a warm smell and a timer are clues. She is <b>baking</b>.", "no": [null, "Paint is not flour, and paint does not smell warm.", "The story is in a kitchen."], "visual": {"kind": "passage", "text": "Hattie's hands were white with flour. A warm smell filled the kitchen. Then the oven timer beeped."}}, {"q": "How did <b>Wade</b> feel about the move?", "choices": ["happy about his own new room", "sad to leave his friends", "excited to unpack"], "a": 1, "why": "Wade cried when he said goodbye. He was <b>sad</b>.", "no": ["That was Yara's point of view.", null, "The story does not say that."], "visual": {"kind": "passage", "text": "The family moved to a new town. Wade cried when he said goodbye to his friends.<br>His little sister Yara jumped on her new bed. “I have my own room!” she said."}}, {"type": "fill", "q": "In <i>The Grumpy Hiker</i>, Mia saw that the hiker's water bottle was ____.", "answers": ["empty"], "why": "His water bottle was <b>empty</b>. He was thirsty and tired.", "no": "He had nothing left to drink.", "placeholder": "Type a word"}]]}], "win": "You saw the hiker through Theo's eyes and Mia's eyes, and you priced Grandpa's shelves. Happy New Year!", "prev": "bb-celine-L06", "prevTitle": "Lesson 6"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserve
