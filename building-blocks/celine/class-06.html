<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ce&#x27;Line · Lesson 6: Stocking the Shelves and the Storm</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L06", "label": "Lesson 6", "title": "Stocking the Shelves and the Storm", "goal": "I can use equal groups, arrays and repeated addition to multiply, and I can trace a chain of causes and effects in a story.", "date": "2026-12-15", "mastery": 85, "color": "#16A085", "slides": [{"type": "hello", "title": "Stocking the Shelves and the Storm", "text": "Grandpa's trading post opens soon. Today you help in two ways.<br>You find out <b>why</b> the stockroom got wet.<br>Then you learn a <b>fast way to count</b> equal groups. 🛒⛈️", "visual": {"kind": "emoji", "text": "⛈️🛒✖️"}, "notes": {"do": "Before class: about 40 counters (beans or cubes), 6 small paper cups, 10 index cards, whiteboard and 2 marker colors, pencil. Open this class lesson with code 9110 on the library table so you both see the screen.", "say": "Today has two parts. First, a story about a storm and everything it caused. Then math: a fast way to count groups that are the same size.", "ask": "Have you ever seen one small thing cause a big mess?", "listen": "Any real example (a cup tipped over, the dog knocked something down). Praise it: that is cause and effect, today's reading skill."}}, {"type": "recall", "kick": "Warm-up", "title": "Remember Weeks 1 to 4", "text": "Four quick ones from your fall lessons.", "items": [{"type": "fill", "q": "Round <b>562</b> to the nearest <b>hundred</b>: ____", "answers": ["600"], "why": "562 is between 500 and 600. The tens digit is 6. 6 is 5 or more, so round up to <b>600</b>.", "no": "Look at the tens digit. Is it 5 or more?", "hint": "The tens digit is 6. Round up.", "placeholder": "Type a number"}, {"q": "Which one is <b>true</b>?", "choices": ["570 > 507", "507 > 570", "507 = 570"], "a": 0, "why": "Both have 5 hundreds. 570 has 7 tens. 507 has 0 tens. So <b>570 > 507</b>.", "no": [null, "507 has 0 tens. 570 has 7 tens. So 507 is the smaller one.", "The digits are in different places, so they are not equal."]}, {"type": "fill", "q": "<b>256 + 178 = ____</b>", "answers": ["434"], "why": "6 + 8 = 14: write 4, regroup 1 ten. 5 + 7 + 1 = 13 tens: write 3, regroup 1 hundred. 2 + 1 + 1 = 4. <b>434</b>.", "no": "Line up the ones, tens and hundreds. Did you regroup two times?", "hint": "6 + 8 = 14. Write 4. Regroup the 1 ten.", "placeholder": "Type a number"}, {"type": "fill", "q": "A story ends: <i>Being honest is always best.</i> That big lesson is the story's ____.", "answers": ["theme"], "why": "The lesson a story teaches is the <b>theme</b>.", "no": "It is the big lesson of the story. It starts with <b>th</b>.", "placeholder": "Type a word"}], "notes": {"do": "She answers out loud first, then types or taps. These are Weeks 1–4 skills from her Checkpoint, so they stay fresh over the holidays.", "listen": "600, 570 > 507, 434, theme. If she gets 424 or 334 for 256 + 178, she lost a regrouped ten or hundred: have her write it in columns on the whiteboard."}}, {"type": "talk", "kick": "Story Talk", "title": "The Storm in the Stockroom", "text": "Read Mia's story with Mr. Jonathan. Take turns, one line each.", "visual": {"kind": "passage", "text": "A big storm hit Grandpa's trading post at night.<br>In the morning, <b>Mia</b> found puddles on the stockroom floor. The room smelled musty.<br>Mia wanted to know <b>why</b>. She looked around like a detective.<br>She traced the puddles back to a <b>loose shutter</b> on the stockroom window.<br>The shutter cracked in the wind. Rain got inside. The boxes got soaked. The wet boxes collapsed (fell down). The goods spilled and were ruined.<br>Now the store has less <b>inventory</b> for opening day. (<b>Inventory</b> means all the things a store has to sell.)<br><b>Theo</b> boarded up the broken shutter."}, "prompts": ["What did Mia find in the morning?", "Why did Mia act like a <b>detective</b>?", "What was the <b>first</b> thing that went wrong? What was the <b>last</b>?"], "starters": ["In the morning, Mia found …", "She wanted to know …", "The first thing was … The last thing was …"], "notes": {"do": "6 minutes. Take turns reading lines aloud. On the whiteboard, draw a puddle and write WHY? next to it.", "say": "Mia saw a problem and asked WHY. That is what good readers do with cause and effect.", "ask": "What was the very first thing that went wrong? What was the very last?", "listen": "First: the loose shutter. Last: less inventory for opening day. If she says the puddles, say: the puddles are what Mia SAW first. Did something happen before the puddles? Check that she knows inventory = the things a store has to sell."}}, {"type": "vocab", "kick": "Word Power", "title": "Reading words", "text": "Tap each card to flip it. Read the word. Then say what it means in your own words.", "words": [{"word": "cause", "pos": "noun", "meaning": "The reason <b>why</b> something happens.", "example": "The storm was the <b>cause</b> of the puddles.", "emoji": "🌧️"}, {"word": "effect", "pos": "noun", "meaning": "<b>What happens</b> because of a cause.", "example": "Puddles on the floor were an <b>effect</b> of the storm.", "emoji": "💧"}, {"word": "chain reaction", "pos": "noun", "meaning": "Effects in a row. Each one causes the <b>next</b> one.", "example": "Falling dominoes are a <b>chain reaction</b>.", "emoji": "⛓️"}, {"word": "consequence", "pos": "noun", "meaning": "A result of an action. It is often a <b>bad</b> result.", "example": "Ruined goods were a <b>consequence</b> of the wet boxes.", "emoji": "😟"}, {"word": "trace", "pos": "verb", "meaning": "To follow a chain <b>back</b> to where it started.", "example": "Mia <b>traced</b> the puddles back to the shutter.", "emoji": "🔍"}], "notes": {"do": "Flip each card. She reads the word and meaning, then says it in her own words. Write CAUSE and EFFECT big on two index cards; you hold them up on the next slides.", "ask": "Which word answers WHY? Which word answers WHAT HAPPENED?", "listen": "Cause = why. Effect = what happened. Pathways asks her to TYPE cause, effect and trace, so have her spell consequence and trace out loud too."}}, {"type": "learn", "kick": "Learn", "title": "Why? What happened?", "text": "A <b>cause</b> is <b>why</b> something happens.<br>An <b>effect</b> is <b>what happens</b>.<br>The cause always happens <b>first</b>.", "visual": {"kind": "bigtext", "text": "cause ➡️ effect", "sub": "why ➡️ what happened"}, "steps": [{"text": "Storm at night ➡️ puddles on the floor. The storm is the <b>cause</b>. The puddles are the <b>effect</b>."}, {"text": "To find a cause, ask: <b>Why did this happen?</b>"}, {"text": "To find an effect, ask: <b>What happened because of this?</b>"}, {"text": "Clue words like <b>because</b> and <b>so</b> can help. Some stories do not use them. You can still ask why."}], "tip": "Mia saw the puddles first. But the storm still <b>happened</b> first.", "notes": {"do": "Hold up the CAUSE card in your left hand and the EFFECT card in your right. Reveal one step at a time.", "say": "A story can tell the effect first. Mia saw the puddles first. But the cause still happened first in time.", "ask": "The stockroom smelled musty. Is the smell a cause or an effect? What caused it?", "listen": "Effect. The water from the storm caused it. If she says cause, ask: did the smell make the water, or did the water make the smell?"}}, {"type": "sort", "kick": "Sort it", "title": "Cause or effect?", "text": "Read the sentence. Look at the <b>bold</b> part. Is it the cause or the effect? Tap a card. Then tap a box.", "buckets": ["🌱 Cause<br><small>why it happened</small>", "💥 Effect<br><small>what happened</small>"], "items": [{"text": "<b>The dog ran through the mud</b>, so the rug got dirty.", "b": 0, "why": "The mud is <b>why</b> the rug got dirty.", "hint": "Ask: is the bold part why, or what happened?"}, {"text": "The dog ran through the mud, so <b>the rug got dirty</b>.", "b": 1, "why": "A dirty rug is <b>what happened</b>.", "hint": "Ask: is the bold part why, or what happened?"}, {"text": "<b>Nia forgot her umbrella</b>, so she got wet.", "b": 0, "why": "Forgetting the umbrella is <b>why</b> she got wet.", "hint": "What happened first?"}, {"text": "The milk spilled because <b>the cup tipped over</b>.", "b": 0, "why": "The cup tipped first. That is <b>why</b> the milk spilled.", "hint": "The word <b>because</b> comes right before the cause."}, {"text": "Because the bus was late, <b>Sam missed the bell</b>.", "b": 1, "why": "Missing the bell is <b>what happened</b> because the bus was late.", "hint": "What happened first: the late bus, or the missed bell?"}, {"text": "<b>The ice melted</b> because the sun came out.", "b": 1, "why": "The sun came out first. The ice melting is <b>what happened</b>.", "hint": "The word <b>because</b> comes right before the cause."}], "done": "Ask <b>why?</b> to find the cause. Ask <b>what happened?</b> to find the effect.", "notes": {"do": "She reads each sentence aloud and asks both questions before she taps. Point at your CAUSE and EFFECT cards as she decides.", "ask": "In 'The milk spilled because the cup tipped over', which happened first?", "listen": "The cup tipped first, so it is the cause even though it comes second in the sentence. That is the sentence that trips readers up."}}, {"type": "order", "kick": "Hands-on", "title": "Mia's storm chain", "text": "Tap the events in the order they happened.", "steps": ["The shutter was loose.", "The shutter cracked in the wind.", "Rain got inside.", "The boxes got soaked.", "The boxes collapsed.", "The goods spilled and were ruined.", "There was less inventory for opening day."], "why": "Each event caused the next one. That is a <b>chain reaction</b>.", "hint": "Not yet. Ask: what had to happen before this?", "notes": {"do": "Hands-on first: she writes each event on an index card in short words (loose, cracked, rain in, soaked, collapsed, ruined, less to sell) and lines them up on the table with arrows between them. Then she taps the order on screen.", "say": "Each card pushes the next one, like a row of dominoes.", "ask": "Take away the 'rain got inside' card. Can the boxes still get soaked?", "listen": "No. If one step is missing, the chain breaks. Keep the cards on the table for the next slide."}}, {"type": "learn", "kick": "Learn", "title": "One event, two jobs", "text": "In the <b>middle</b> of a chain, an event has <b>two jobs</b>.<br>It is an <b>effect</b> of what came before.<br>It is a <b>cause</b> of what comes next.", "visual": {"kind": "bigtext", "text": "rain got inside ➡️ <b>boxes got soaked</b> ➡️ boxes collapsed"}, "steps": [{"text": "Look back: <b>What caused this?</b> Rain got inside."}, {"text": "Look ahead: <b>What did this cause?</b> The boxes collapsed."}, {"text": "The <b>first</b> event is only a cause. The <b>last</b> event is only an effect."}], "tip": "Middle events are <b>both</b> a cause and an effect.", "notes": {"do": "Point to her 'soaked' card. Touch the card before it, then the card after it.", "ask": "'The goods spilled and were ruined.' What caused it? What did it cause?", "listen": "Caused by the boxes collapsing. It caused less inventory for opening day. So it is both."}}, {"type": "tap", "kick": "Your turn", "title": "Trace a new chain", "text": "Read this new story. Then answer.", "visual": {"kind": "passage", "text": "Kayla left her crayons on the hot car seat. The crayons melted. The wax dripped on the seat. Mom had to scrub the seat. They were late for the game."}, "items": [{"q": "What was the <b>first</b> cause?", "choices": ["The crayons melted.", "Mom had to scrub the seat.", "Kayla left her crayons out.", "They were late for the game."], "a": 2, "why": "Everything started when Kayla left the crayons on the hot seat.", "no": ["The crayons melted because of something that happened before.", "That happened near the end of the chain.", null, "That is the very last effect."]}, {"type": "fill", "q": "<b>The crayons melted.</b> Is that a cause, an effect, or both? Type <b>cause</b>, <b>effect</b> or <b>both</b>.", "answers": ["both"], "why": "It is an <b>effect</b> of the hot seat. It is the <b>cause</b> of the dripping wax. It is <b>both</b>.", "no": "Ask two questions: What caused it? What did it cause?", "placeholder": "cause, effect or both"}, {"q": "What was the <b>last</b> effect?", "choices": ["The wax dripped on the seat.", "Mom had to scrub the seat.", "Kayla left her crayons on the seat.", "They were late for the game."], "a": 3, "why": "Scrubbing took time, so they were <b>late for the game</b>. Nothing comes after that.", "no": ["The wax dripping caused something else.", "Scrubbing the seat caused one more thing.", "That is the first cause, not the last effect.", null]}], "notes": {"do": "She reads the story aloud, then draws the chain on the whiteboard with arrows before she answers.", "ask": "Why were they late for the game? Trace it all the way back.", "listen": "Kayla left the crayons, both, late for the game. Tracing back: late ← scrubbing ← wax dripped ← crayons melted ← left on the hot seat."}}, {"type": "tap", "kick": "Exit ticket", "title": "Reading check", "text": "On your own. No looking back!", "items": [{"type": "fill", "q": "Who looked for the cause of the puddles?", "answers": ["Mia"], "why": "<b>Mia</b> traced the puddles back to the loose shutter.", "no": "She found the puddles in the morning.", "placeholder": "Type a name"}, {"type": "fill", "q": "Mia found the problem. Then who put boards over the shutter?", "answers": ["Theo"], "why": "<b>Theo</b> boarded up the shutter.", "no": "Mia found the problem. Who fixed it?", "placeholder": "Type a name"}, {"q": "Mia followed the puddles back. Where did the chain <b>start</b>?", "choices": ["the puddles", "the soaked boxes", "a loose shutter", "the ruined goods"], "a": 2, "why": "Mia traced it back to a <b>loose shutter</b>.", "no": ["The puddles are what she saw. Something came before them.", "The soaked boxes are in the middle of the chain.", null, "The ruined goods came near the end."]}, {"type": "fill", "q": "Mia started at the puddles. She went back, step by step, to the start of the chain. The word for this is ____.", "answers": ["trace", "traced", "tracing"], "why": "To <b>trace</b> a chain is to follow it back to the start.", "no": "Mia did this with the puddles. It starts with <b>tr</b>.", "placeholder": "Type a word"}], "notes": {"do": "On her own. Note her first answers.", "listen": "Mia, Theo, a loose shutter, trace. If she mixes up Mia and Theo, say: Mia found it, Theo fixed it."}}, {"type": "vocab", "kick": "Word Power", "title": "Math words", "text": "Tap each card to flip it. Read the word. Then spell <b>array</b> and <b>product</b> out loud.", "words": [{"word": "multiply", "pos": "verb", "meaning": "To put <b>equal groups</b> together fast.", "example": "3 groups of 4? <b>Multiply</b>: 3 × 4 = 12.", "emoji": "✖️"}, {"word": "equal groups", "pos": "noun", "meaning": "Groups with the <b>same</b> number in each one.", "example": "3 bags with 5 nuts in each bag are <b>equal groups</b>.", "emoji": "🫙"}, {"word": "repeated addition", "pos": "noun", "meaning": "Adding the <b>same</b> number again and again.", "example": "5 + 5 + 5 is <b>repeated addition</b>.", "emoji": "➕"}, {"word": "array", "pos": "noun", "meaning": "Things set in equal <b>rows</b> and <b>columns</b>.", "example": "2 rows of 6 cans make an <b>array</b>.", "emoji": "🥫"}, {"word": "product", "pos": "noun", "meaning": "The <b>answer</b> when you multiply.", "example": "In 3 × 4 = 12, the <b>product</b> is 12.", "emoji": "🎯"}], "notes": {"do": "Flip each card. She reads it. Then she spells array and product out loud while you write them on the whiteboard. Pathways asks her to TYPE these words.", "ask": "In 5 × 2 = 10, what is the product?", "listen": "10. If she says 5 or 2, say: those are the numbers we multiply. The product is the answer."}}, {"type": "build", "kick": "Hands-on", "title": "Grandpa's lanterns", "text": "Grandpa has <b>5 crates</b>. He puts <b>3 lanterns</b> in each crate. Make the groups.", "groups": 5, "each": 3, "emoji": "🏮", "why": "5 groups of 3. 3 + 3 + 3 + 3 + 3 = 15. <b>5 × 3 = 15</b> lanterns.", "hint": "Each <b>crate</b> is one group. Set <b>Groups</b> to the number of crates. Set <b>In each group</b> to the lanterns in one crate.", "notes": {"do": "Hands-on first: 5 paper cups, 3 counters in each. She skip counts by 3s while touching each cup: 3, 6, 9, 12, 15. Then she builds it on screen.", "ask": "Are the groups equal? How do you know?", "listen": "Yes, every cup has 3. If she counts every counter by ones, model the skip count once, then have her do it."}}, {"type": "learn", "kick": "Learn", "title": "Add it, or multiply it", "text": "When groups are <b>equal</b>, you can add the same number again and again.<br>Or you can <b>multiply</b>. You get the same answer.", "visual": {"kind": "groups", "groups": 4, "each": 5, "emoji": "🥫", "label": "4 groups of 5"}, "steps": [{"text": "Repeated addition: 5 + 5 + 5 + 5 = <b>20</b>."}, {"text": "Count the groups: <b>4</b>. Count in one group: <b>5</b>."}, {"text": "Multiply: <b>4 × 5 = 20</b>."}, {"text": "Say it: <b>4 groups of 5</b> is 4 × 5."}], "tip": "Number of groups × number in each group = the <b>product</b>.", "notes": {"do": "Write 5 + 5 + 5 + 5 on the whiteboard. Under it, write 4 × 5. Circle the 4 (how many groups) and the 5 (how many in each).", "say": "Multiplication is a shortcut for adding the same number again and again.", "ask": "How many 5s did we add? So what is the first number?", "listen": "Four 5s, so 4 × 5. If she writes 5 × 4, it is still 20 (turn-around fact), but have her say '4 groups of 5'."}}, {"type": "tap", "kick": "Your turn", "title": "Add or multiply", "text": "Use counters or draw circles if it helps.", "items": [{"type": "fill", "q": "Write <b>6 + 6 + 6</b> as multiplication: ____", "answers": ["3 × 6", "3 times 6", "6 × 3", "6 times 3", "3 × 6 = 18", "3 times 6 = 18", "6 × 3 = 18", "6 times 3 = 18", "3 groups of 6"], "why": "Three 6s: <b>3 × 6 = 18</b>.", "no": "Count how many 6s you see. That is the number of groups.", "hint": "There are three 6s. 3 × ___", "placeholder": "Like this: 10 x 10"}, {"type": "fill", "q": "<b>2 × 7</b> means 7 + 7. What is <b>2 × 7</b>?", "answers": ["14"], "why": "7 + 7 = 14, so <b>2 × 7 = 14</b>.", "no": "2 groups of 7. Add 7 + 7.", "placeholder": "Type a number"}, {"q": "Which addition matches <b>4 × 3</b>?", "choices": ["4 + 3", "3 + 3 + 3 + 3", "4 + 4 + 4 + 4", "3 + 3 + 3"], "a": 1, "why": "4 × 3 is 4 groups of 3: <b>3 + 3 + 3 + 3 = 12</b>.", "no": ["4 + 3 = 7. That adds 4 and 3 only one time.", null, "That is four 4s, or 16.", "That is only three 3s, or 9."]}, {"type": "fill", "q": "Jo has 3 bags. They have <b>4, 5 and 4</b> nuts. Are they equal groups? Type <b>equal</b> or <b>not equal</b>.", "answers": ["not equal", "unequal", "not equal groups"], "why": "One bag has 5. The groups are <b>not equal</b>, so Jo must add: 4 + 5 + 4 = 13.", "no": "Look at each bag. Do they all have the same number?", "placeholder": "equal or not equal"}], "notes": {"do": "She builds each one with counters or draws circles on the whiteboard before she answers.", "ask": "Why can't Jo multiply to find the total?", "listen": "3 × 6 (6 × 3 is fine too), 14, 3 + 3 + 3 + 3, not equal. Multiplying only works when every group is the same size."}}, {"type": "learn", "kick": "Learn", "title": "Arrays: rows and columns", "text": "An <b>array</b> puts things in equal <b>rows</b>.<br>Rows go across ➡️. Columns go up and down ⬇️.", "visual": {"kind": "array", "rows": 4, "cols": 6, "emoji": "🥫", "label": "4 rows of 6"}, "steps": [{"text": "Count the rows: <b>4</b>."}, {"text": "Count how many in one row: <b>6</b>."}, {"text": "Multiply rows × how many in each row: <b>4 × 6 = 24</b>."}, {"text": "Check: skip count by 6s. 6, 12, 18, <b>24</b>."}], "tip": "The <b>first</b> number tells how many <b>rows</b>.", "notes": {"do": "Hands-on: she builds 4 rows of 6 counters on the table. Then turn the paper a quarter turn: now it is 6 rows of 4. Same counters.", "say": "Turn an array and the product stays the same: 4 × 6 and 6 × 4 are both 24.", "ask": "Which number tells how many rows?", "listen": "The first number, 4. Watch that she counts rows across, not columns."}}, {"type": "tap", "kick": "Your turn", "title": "Read the array", "items": [{"type": "fill", "q": "This array has <b>2 rows of 9</b>. How many baskets in all?", "visual": {"kind": "array", "rows": 2, "cols": 9, "emoji": "🧺"}, "answers": ["18"], "why": "2 rows of 9: 9 + 9 = 18. <b>2 × 9 = 18</b>.", "no": "Add one row of 9 to another row of 9.", "placeholder": "Type a number"}, {"q": "Which fact matches this array?", "visual": {"kind": "array", "rows": 5, "cols": 3, "emoji": "🕯️"}, "choices": ["5 + 3", "5 × 5", "3 × 3", "5 × 3"], "a": 3, "why": "5 rows with 3 in each row: <b>5 × 3 = 15</b>.", "no": ["5 + 3 = 8. There are more than 8 candles.", "Each row has 3, not 5.", "There are 5 rows, not 3.", null]}, {"type": "fill", "q": "An array has <b>3 rows</b>. Each row has <b>4</b> lanterns. <b>3 × 4 = ____</b>", "answers": ["12"], "why": "4 + 4 + 4 = 12. <b>3 × 4 = 12</b>.", "no": "Skip count by 4s three times.", "placeholder": "Type a number"}], "notes": {"do": "She touches each row on the screen and skip counts out loud.", "listen": "18, 5 × 3, 12. If she picks 5 + 3, she is adding the two numbers instead of multiplying: build it with counters."}}, {"type": "tap", "kick": "Exit ticket", "title": "Math check", "text": "On your own. Use counters or draw if you need to.", "items": [{"type": "fill", "q": "Grandpa fills <b>3 shelves</b>. Each shelf has <b>6 boxes</b>. How many boxes?", "answers": ["18"], "why": "3 groups of 6: 6 + 6 + 6 = 18. <b>3 × 6 = 18</b>.", "no": "Each shelf is a group. Skip count by 6s, once for each shelf.", "placeholder": "Type a number"}, {"type": "fill", "q": "In <b>6 × 3 = 18</b>, the 18 is called the ____.", "answers": ["product"], "why": "The answer when you multiply is the <b>product</b>.", "no": "It is the answer to a times fact. It starts with <b>p</b>.", "placeholder": "Type a word"}, {"q": "Mia puts <b>2 rows of 8</b> seed packets on a shelf. How many packets?", "choices": ["10", "16", "18", "82"], "a": 1, "why": "2 rows of 8: 8 + 8 = 16. <b>2 × 8 = 16</b>.", "no": ["That is 2 + 8. Two rows of 8 is 8 + 8.", null, "Count again: 8 + 8 = 16.", "82 just puts the digits side by side."]}, {"type": "fill", "q": "Write <b>3 + 3 + 3 + 3 + 3 + 3</b> as multiplication: ____", "answers": ["6 × 3", "6 times 3", "3 × 6", "3 times 6", "6 × 3 = 18", "6 times 3 = 18", "3 × 6 = 18", "3 times 6 = 18", "6 groups of 3"], "why": "Six 3s: <b>6 × 3 = 18</b>.", "no": "Count the 3s. That is the number of groups.", "placeholder": "Li
