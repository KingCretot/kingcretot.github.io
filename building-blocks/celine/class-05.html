<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ce&#x27;Line · Lesson 5: Unit 1 Checkpoint Review</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L05", "label": "Lesson 5", "title": "Unit 1 Checkpoint Review", "goal": "I can use what I learned in Weeks 1 to 4, in math and reading, to get ready for my Checkpoint.", "date": "2026-12-08", "mastery": 85, "color": "#C9A84C", "slides": [{"type": "hello", "title": "Checkpoint Review Day", "text": "Today we look back at <b>Weeks 1 to 4</b>. No new skill today! We review math and reading. Then you will be ready for your <b>Checkpoint</b>.", "visual": {"kind": "emoji", "text": "🏁🧮📖⭐"}, "notes": {"do": "Before class: look at her Lesson 4 Show What You Know score (Formspree) and any Pathways Week 1–4 retake scores. Write the weakest week on a sticky note for yourself. Set out the whiteboard, two marker colors, 6 index cards, a highlighter and pencil and paper.", "say": "Today is a review day. Everything today is something you already learned. You know more than you think!", "ask": "What is one thing you remember from our lessons so far, math or reading?", "listen": "Any real answer. Praise it and write it in the corner of the whiteboard. She needs a confident start."}}, {"type": "talk", "kick": "Story Talk", "title": "Theo's trail stories", "text": "All month, you read about <b>Theo</b>. Tell me his stories in your own words.", "visual": {"kind": "emoji", "text": "🥾🧭🏕️🤝"}, "prompts": ["Who is Theo? Where did his first hike take place?", "What was Theo's problem when the trail split in two?", "How did he fix it? Where did he end up?", "What did his family do <b>first</b> at the campsite?", "What did Theo do with the last marshmallow? Why?"], "starters": ["Theo is …", "His problem was …", "He fixed it by …", "First they …", "Theo shared because …"], "notes": {"do": "7 minutes. She tells it first, no help. Then ask the prompts she skipped. Draw a simple trail on the whiteboard with 4 stops: Hike, Missing Sign, Camping, Marshmallow. Add one word at each stop as she talks.", "say": "The Checkpoint asks about Theo's stories. Let's remember them together.", "ask": "Who gave Theo the compass? Who told him about the valley view?", "listen": "His father gave him the old brass compass. His grandfather used to describe the view. The sign was gone and the trail split; he used the compass and map, went right (the open rock path) and reached Lookout Peak. Camping: tent first, then fire, then chili, last the stars. Marshmallow: he broke it in half and gave Mia the bigger piece. If she mixes up the stories, point to the trail stops."}}, {"type": "learn", "kick": "The plan", "title": "What the Checkpoint checks", "text": "The Checkpoint has <b>math</b> and <b>reading</b> from Weeks 1 to 4.", "visual": {"kind": "bigtext", "text": "4 weeks · 8 skills", "sub": "Weeks 1, 2, 3 and 4"}, "steps": [{"text": "<b>Week 1:</b> place value and rounding · <b>character</b> and <b>setting</b>."}, {"text": "<b>Week 2:</b> comparing and ordering numbers · <b>conflict</b>, attempt and resolution."}, {"text": "<b>Week 3:</b> adding and subtracting with <b>regrouping</b> · <b>sequence</b>: beginning, middle, end."}, {"text": "<b>Week 4:</b> word problems and <b>estimating</b> · <b>theme</b>, the lesson of a story."}], "tip": "On the Checkpoint you get 2 tries. Only your <b>first try</b> earns points. So slow down and work on paper first.", "notes": {"do": "Read each step with her. Let her tap to show the next one.", "say": "There is nothing new today. Today is about getting each one right on the FIRST try.", "ask": "Which week feels easiest for you? Which one feels hardest?", "listen": "Write her hardest week on the whiteboard. Spend one extra minute there today."}}, {"type": "vocab", "kick": "Word Power", "title": "Six Checkpoint words", "text": "Tap each card to flip it. Read the word and the meaning out loud.", "words": [{"word": "place value", "pos": "noun", "meaning": "What a digit is worth because of where it sits in a number.", "example": "In 862, the 8 is in the hundreds place. It is worth 800.", "emoji": "🏠"}, {"word": "regroup", "pos": "verb", "meaning": "To trade 10 of one place for 1 of the next place.", "example": "8 + 7 = 15 ones. <b>Regroup</b>: write 5 and carry 1 ten.", "emoji": "🔄"}, {"word": "estimate", "pos": "noun", "meaning": "A close guess. You round the numbers first.", "example": "236 + 187 is about 200 + 200. My <b>estimate</b> is 400.", "emoji": "🎯"}, {"word": "conflict", "pos": "noun", "meaning": "The problem a character has in a story.", "example": "Zuri's kite is stuck in a tree. That is the <b>conflict</b>.", "emoji": "⚡"}, {"word": "sequence", "pos": "noun", "meaning": "The order that things happen in.", "example": "First, next, then and last show the <b>sequence</b>.", "emoji": "🔢"}, {"word": "theme", "pos": "noun", "meaning": "The lesson or big idea a story teaches.", "example": "Zuri's story <b>theme</b>: stay calm and think when you have a problem.", "emoji": "💡"}], "notes": {"do": "She reads each card out loud. Then she covers it and says the meaning in her own words. She writes each word on the front of an index card. She finishes the backs at home.", "say": "These six words are on the Checkpoint. Three are math words. Three are reading words.", "ask": "Which word means the order things happen in?", "listen": "Sequence. If she says theme, read both cards again: theme is the lesson, sequence is the order."}}, {"type": "learn", "kick": "Week 1", "title": "Place value and rounding", "text": "Every digit has a <b>place</b>. Its place tells what it is worth.", "visual": {"kind": "placevalue", "n": 862}, "steps": [{"text": "In <b>862</b>, the 8 is worth <b>800</b>. The 6 is worth <b>60</b>. The 2 is worth <b>2</b>."}, {"text": "<b>Expanded form:</b> 862 = 800 + 60 + 2."}, {"text": "<b>Round to the nearest ten:</b> look at the ones digit. 862 → the 2 is 4 or less → <b>860</b>."}, {"text": "<b>Round to the nearest hundred:</b> look at the tens digit. 862 → the 6 is 5 or more → <b>900</b>."}], "tip": "5 or more? Round up. 4 or less? Round down.", "notes": {"do": "Write 862 on the whiteboard in a place value chart. She points to each digit and says what it is worth.", "ask": "For the nearest hundred, which digit do we look at?", "listen": "The tens digit (the one to the RIGHT of the hundreds). A common mistake is looking at the ones digit. Point to the place you are rounding to, then the digit just to its right."}}, {"type": "tap", "kick": "Your turn", "title": "Week 1 on paper", "text": "Write it on paper first. Then type.", "items": [{"type": "fill", "q": "In <b>491</b>, what is the <b>9</b> worth?", "answers": ["90", "9 tens", "ninety"], "why": "The 9 is in the tens place. 9 tens = <b>90</b>.", "no": "Find the place. Is the 9 in the hundreds, tens or ones?", "hint": "The 4 is worth 400. The 9 comes next.", "placeholder": "Type a number"}, {"type": "fill", "q": "Write <b>705</b> in expanded form: 705 = ____", "answers": ["700 + 5", "700 + 0 + 5"], "why": "7 hundreds and 5 ones. The 0 tens is worth 0. <b>700 + 5</b> (or 700 + 0 + 5).", "no": "Write what each digit is worth, with plus signs.", "hint": "The 7 is worth 700.", "placeholder": "Example: 300 + 40 + 5"}, {"type": "fill", "q": "Round <b>765</b> to the nearest <b>hundred</b>: ____", "answers": ["800"], "why": "765 is between 700 and 800. Look at the tens digit: 6. That is 5 or more, so round <b>up</b>. <b>800</b>", "no": "Look at the tens digit. 5 or more rounds up. 4 or less stays.", "hint": "765 is between 700 and 800. Which one is it closer to?", "placeholder": "Type a number"}], "notes": {"do": "Paper first. She says the place out loud before she types.", "ask": "Why is 705 not 70 + 5?", "listen": "The 7 is in the hundreds place, so it is worth 700. The 0 holds the tens place."}}, {"type": "learn", "kick": "Week 2", "title": "Compare and order", "text": "Start with the <b>biggest place</b>. If it ties, move to the next place.", "visual": {"kind": "bigtext", "text": "746 &lt; 764", "sub": "Hundreds tie. Tens: 4 is less than 6."}, "steps": [{"text": "<b>746 and 764.</b> Hundreds: 7 and 7. A tie! Keep going."}, {"text": "Tens: 4 and 6. 6 is bigger. So <b>746 &lt; 764</b>."}, {"text": "<b>&gt;</b> means greater than. <b>&lt;</b> means less than. The open side faces the bigger number."}, {"text": "<b>Order</b> 391, 319, 913 from least to greatest: <b>319, 391, 913</b>."}, {"text": "In a <b>race</b>, the smallest time wins. Smallest time = fastest."}], "tip": "Read the question. Does it want least first, or greatest first?", "notes": {"do": "Write 746 and 764 on the whiteboard, one on top of the other. She circles the first place where they are different.", "ask": "Which way does the open side of &lt; face?", "listen": "Toward the bigger number. If she mixes them up, draw a mouth that wants to eat the bigger number."}}, {"type": "tap", "kick": "Your turn", "title": "Week 2 on paper", "text": "Line the numbers up on paper. Then type.", "items": [{"type": "fill", "q": "Type <b>&gt;</b>, <b>&lt;</b> or <b>=</b>.<br><b>508 ____ 580</b>", "answers": ["<", "less than", "is less than", "less"], "why": "Hundreds tie. Tens: 0 and 8. 8 is bigger, so 580 is bigger. 508 &lt; 580 means 508 is less than 580. <b>&lt;</b>", "no": "Start with the hundreds. If they tie, look at the tens. The open side faces the bigger number.", "hint": "The point of the sign touches the smaller number.", "placeholder": "> or < or ="}, {"type": "fill", "q": "Put these in order from <b>greatest to least</b>: <b>547, 574, 457</b>.<br>Type them with commas: ____", "answers": ["574, 547, 457", "574 > 547 > 457"], "why": "Compare the hundreds first. If two tie, compare the tens. From greatest to least: <b>574, 547, 457</b>", "no": "Look at the hundreds digits first. If two numbers have the same hundreds digit, look at the tens.", "hint": "Which number is biggest?", "placeholder": "Example: 100, 200, 300"}, {"type": "fill", "q": "Hana ran 214 seconds. Rafi ran 241 seconds. Cara ran 209 seconds. Who was <b>fastest</b>? Type the name.", "answers": ["Cara"], "why": "In a race, the smallest time wins. 209 is the smallest. <b>Cara</b> was fastest.", "no": "Fastest means the SMALLEST time.", "hint": "All three have 2 hundreds. Look at the tens.", "placeholder": "Type a name"}], "notes": {"do": "She writes the numbers in a column on paper, lined up by place.", "ask": "Why is the smallest number the winner in a race?", "listen": "A smaller time means it took less time, so that runner finished first."}}, {"type": "learn", "kick": "Week 3", "title": "Add with regrouping", "text": "Add the <b>ones</b> first. If a column makes 10 or more, <b>regroup</b>.", "visual": {"kind": "longdiv", "text": "  1 1\n  2 7 9\n+ 1 8 6\n-------\n  4 6 5"}, "steps": [{"text": "<b>Ones:</b> 9 + 6 = 15. Write 5. Carry 1 to the tens."}, {"text": "<b>Tens:</b> 7 + 8 + 1 = 16. Write 6. Carry 1 to the hundreds."}, {"text": "<b>Hundreds:</b> 2 + 1 + 1 = 4."}, {"text": "<b>279 + 186 = 465</b>"}], "tip": "Write the little 1 on top of the next column. Then add it in!", "notes": {"do": "Work it on the whiteboard. Write the carried 1s in the second marker color.", "say": "Ones first, then tens, then hundreds. Always right to left.", "ask": "Why can't we write 15 in the ones place?", "listen": "Only one digit fits in a place. 15 ones is 1 ten and 5 ones, so we regroup."}}, {"type": "learn", "kick": "Week 3", "title": "Subtract with regrouping", "text": "If the top digit is too small, <b>borrow</b> 1 from the next place.", "visual": {"kind": "longdiv", "text": "  4 5 1\n- 1 7 6\n-------\n  2 7 5"}, "steps": [{"text": "<b>Ones:</b> 1 − 6? Too small. Borrow 1 ten. Now 11 − 6 = <b>5</b>. The tens go from 5 to 4."}, {"text": "<b>Tens:</b> 4 − 7? Too small. Borrow 1 hundred. Now 14 − 7 = <b>7</b>. The hundreds go from 4 to 3."}, {"text": "<b>Hundreds:</b> 3 − 1 = <b>2</b>. So 451 − 176 = <b>275</b>."}, {"text": "<b>Check:</b> 275 + 176 = 451. ✅"}, {"text": "<b>A 0 on top?</b> 500 − 237: borrow from the hundreds first. 5 hundreds become 4, and the 0 tens become 10. Then borrow 1 ten. The answer is <b>263</b>."}], "tip": "Never flip the digits! 1 − 6 is NOT 6 − 1.", "notes": {"do": "Work 451 − 176 on the whiteboard. Cross out and rewrite each borrowed digit. Then show 500 − 237 slowly.", "ask": "How can you check a subtraction answer?", "listen": "Add the answer to the number you took away. You should get the top number back."}}, {"type": "tap", "kick": "Your turn", "title": "Week 3 on paper", "text": "Stack each one on paper. Then type.", "items": [{"type": "fill", "q": "<b>379 + 146 = ____</b>", "answers": ["525"], "why": "Ones: 9 + 6 = 15. Write 5, carry 1. Tens: 7 + 4 + 1 = 12. Write 2, carry 1. Hundreds: 3 + 1 + 1 = 5. <b>525</b>", "no": "Start with the ones. If a column makes 10 or more, write the ones digit and carry the 1 to the next column.", "hint": "Ones first: 9 + 6 = 15.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>634 − 258 = ____</b>", "answers": ["376"], "why": "Ones: 4 − 8? Too small. Borrow 1 ten: 3 tens become 2, and 4 ones become 14 ones. 14 − 8 = 6. Tens: 2 − 5? Too small. Borrow 1 hundred: 6 hundreds become 5, and 2 tens become 12. 12 − 5 = 7. Hundreds: 5 − 2 = 3. <b>376</b>", "no": "Start with the ones. If the top digit is too small, borrow 1 from the next place. Never flip the digits.", "hint": "Ones first: 4 − 8? You need to borrow.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>700 − 346 = ____</b>", "answers": ["354"], "why": "Ones: 0 − 6? Too small. The tens place has 0, so first take 1 hundred: 7 hundreds become 6, and 0 tens become 10 tens. Now take 1 ten: 10 tens become 9, and 0 ones become 10 ones. 10 − 6 = 4. Tens: 9 − 4 = 5. Hundreds: 6 − 3 = 3. <b>354</b>", "no": "Start with the ones. If the top digit is too small, borrow 1 from the next place. Never flip the digits.", "hint": "Ones first: 0 − 6? You need to borrow.", "placeholder": "Type a number"}], "notes": {"do": "Hands off. She does each one on paper. Praise every correct column out loud.", "ask": "On 700 − 346, where do you borrow from first?", "listen": "The hundreds, because the tens place has 0. 7 hundreds become 6, the tens become 10, then 9. Answer 354. If she writes 446 (she flipped the digits instead of borrowing), go back to the ones."}}, {"type": "learn", "kick": "Week 4", "title": "Word problems and estimates", "text": "Find the <b>clue words</b>. They tell you to add or subtract.", "visual": {"kind": "bigtext", "text": "➕ or ➖ ?", "sub": "Add: in all, altogether, total. Subtract: left, how many more, difference."}, "steps": [{"text": "“A shelf has 236 books. The library gets 187 more. How many books <b>in all</b>?” <b>In all</b> means add: 236 + 187 = <b>423</b>."}, {"text": "“There are 450 pencils. Kids use 176. How many are <b>left</b>?” <b>Left</b> means subtract: 450 − 176 = <b>274</b>."}, {"text": "<b>Estimate:</b> round each number to the nearest hundred. Then add. 236 → 200. 187 → 200. 200 + 200 = <b>400</b>."}, {"text": "423 is close to 400. So 423 is a <b>reasonable</b> answer."}], "tip": "“How many more” means subtract. Find the difference.", "notes": {"do": "She underlines the clue word in each story on the whiteboard.", "ask": "When you estimate 236 + 187, do you add 236 + 187?", "listen": "No. You add the ROUNDED numbers: 200 + 200 = 400. The Checkpoint asks for estimates, and adding the exact numbers is the most common mistake."}}, {"type": "sort", "kick": "Week 4", "title": "Add or subtract?", "text": "Tap a card. Then tap <b>Add</b> or <b>Subtract</b>. Look for the clue words.", "buckets": ["Add ➕", "Subtract ➖"], "items": [{"text": "Wren has 125 stickers. She gets 140 more. How many in all?", "b": 0, "why": "“In all” means put together: add.", "hint": "Is she getting more?"}, {"text": "A bus has 48 seats. 29 are taken. How many are left?", "b": 1, "why": "“Left” means take away: subtract.", "hint": "Find the clue word at the end."}, {"text": "Liam read 214 pages. Mia read 186 pages. How many pages altogether?", "b": 0, "why": "“Altogether” means add.", "hint": "Are we putting the pages together?"}, {"text": "Jen has 418 beads. Remy has 263. How many more does Jen have?", "b": 1, "why": "“How many more” means find the difference: subtract.", "hint": "We are finding a difference."}, {"text": "A farm has 156 hens and 238 ducks. What is the total?", "b": 0, "why": "“Total” means add.", "hint": "Total is a clue word."}, {"text": "There were 300 cups. Kids used 145. How many cups remain?", "b": 1, "why": "“Remain” means what is left: subtract.", "hint": "Remain is like left."}], "done": "Add: in all, altogether, total. Subtract: left, remain, how many more.", "notes": {"do": "She reads each card out loud and says the clue word BEFORE she taps.", "ask": "Is “more” always add?", "listen": "No. “She gets 140 more” is add, but “how many MORE does Jen have” is subtract (compare). Read the whole question."}}, {"type": "tap", "kick": "Your turn", "title": "Week 4 on paper", "text": "Underline the clue word on paper. Then solve.", "items": [{"type": "fill", "q": "The library has <b>318</b> kids' books and <b>275</b> grown-up books. How many books <b>altogether</b>?", "answers": ["593"], "why": "Ones: 8 + 5 = 13. Write 3, carry 1. Tens: 1 + 7 + 1 = 9. Hundreds: 3 + 2 = 5. <b>593</b>", "no": "Start with the ones. If a column makes 10 or more, write the ones digit and carry the 1 to the next column.", "hint": "Ones first: 8 + 5 = 13.", "placeholder": "Type a number"}, {"type": "fill", "q": "A jar had <b>605</b> beads. Nell used <b>248</b>. How many beads are <b>left</b>?", "answers": ["357"], "why": "Ones: 5 − 8? Too small. The tens place has 0, so first take 1 hundred: 6 hundreds become 5, and 0 tens become 10 tens. Now take 1 ten: 10 tens become 9, and 5 ones become 15 ones. 15 − 8 = 7. Tens: 9 − 4 = 5. Hundreds: 5 − 2 = 3. <b>357</b>", "no": "Start with the ones. If the top digit is too small, borrow 1 from the next place. Never flip the digits.", "hint": "Ones first: 5 − 8? You need to borrow.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>Estimate</b> 381 + 442. Round each number to the nearest hundred first. Then add. Estimate: ____", "answers": ["800"], "why": "381 rounds to 400. 442 rounds to 400. 400 + 400 = <b>800</b>", "no": "Round each number to the nearest hundred first. Then add the rounded numbers. Do not add the exact numbers.", "hint": "381 rounds to 400.", "placeholder": "Type a number"}], "notes": {"do": "She says the clue word out loud before she computes.", "ask": "For 381 + 442, what does 381 round to?", "listen": "400 (the tens digit is 8). 442 rounds to 400. Estimate 800."}}, {"type": "learn", "kick": "Reading", "title": "The shape of a story", "text": "Most stories have the same shape.", "visual": {"kind": "bigtext", "text": "Problem → Try → Fix", "sub": "conflict → attempt → resolution"}, "steps": [{"text": "<b>Character</b>: who the story is about. <b>Setting</b>: where and when it happens."}, {"text": "<b>Conflict</b>: the problem. <b>Attempt</b>: a try to fix it. <b>Resolution</b>: how it gets fixed."}, {"text": "<b>Sequence</b>: beginning, middle, end. First, next, then and last are <b>transition words</b>."}, {"text": "<b>Plot</b> is what happens. <b>Theme</b> is the lesson. Ask: what did the character learn?"}], "tip": "A theme must match what really happens in the story.", "notes": {"do": "Write PROBLEM → TRY → FIX on the whiteboard. Leave it up for the next slides.", "say": "This is Theo's story shape too: missing sign, compass, Lookout Peak.", "ask": "What is the difference between plot and theme?", "listen": "Plot is what happens (Theo shared a marshmallow). Theme is the lesson (sharing with someone you love feels good)."}}, {"type": "tap", "kick": "Read", "title": "Zuri's Red Kite", "text": "Read it out loud. Highlight the problem in one color.", "visual": {"kind": "passage", "text": "<b>Zuri's Red Kite</b><br>It was a windy Saturday at the park by the lake. Zuri had a new red kite. First, Grandpa helped her unroll the string. Next, Zuri ran, and the kite flew up high. Then a big gust of wind blew the kite into a tall oak tree! Zuri jumped for the string, but it was too high. She wanted to cry. “Let's stop and think,” said Grandpa. Zuri took a slow, deep breath. She gave the string a soft tug, then another. The kite wiggled free and floated down. Last, they flew it again, far away from the trees."}, "items": [{"q": "What is the <b>setting</b>?", "choices": ["Zuri's school yard on a rainy Saturday", "A park by the lake on a windy Saturday", "Grandpa's backyard on a calm, quiet night", "A sandy beach by the lake on a hot summer day"], "a": 1, "why": "The story says “a windy Saturday at the park by the lake.” That is where and when.", "no": ["The story is at a park, and it is windy, not rainy.", null, "They are at the park, in the day, and it is windy.", "There is a lake, but they are at a park, not a beach."]}, {"type": "fill", "q": "What is the <b>conflict</b>? The kite got stuck in a tall oak ____.", "answers": ["tree", "oak tree", "an oak tree", "a tree"], "why": "The kite stuck in the <b>tree</b> is Zuri's problem: the conflict.", "no": "Look at the sentence that starts with “Then.”", "hint": "It has branches and leaves.", "placeholder": "Type a word"}, {"q": "What was Zuri's <b>first attempt</b>, the one that did NOT work?", "choices": ["She gave the string soft tugs", "Grandpa climbed the tree", "She jumped for the string", "She bought a new kite"], "a": 2, "why": "She jumped for the string, but it was too high. That try did not work.", "no": ["That was her second try, and it worked.", "Grandpa never climbs. He says, “Let's stop and think.”", null, "She never buys a new kite."]}, {"q": "What is the <b>theme</b>?", "choices": ["A red kite can fly higher than a tall oak tree", "Never fly a kite at the park when it is windy", "When you have a problem, stay calm and think", "Grandpas should climb trees to get kites down"], "a": 2, "why": "Zuri stopped, took a breath and thought. Then she fixed it. The lesson: <b>stay calm and think</b>.", "no": ["That is about the kite. It is not a lesson for people.", "Zuri fixed the problem and flew it again. The story does not teach that.", null, "Grandpa never climbs. He says, “Let's stop and think.”"]}], "notes": {"do": "She reads it aloud. She highlights the conflict. Then she points to PROBLEM → TRY → FIX on the whiteboard and fills it in for Zuri.", "ask": "What clue shows Zuri was upset?", "listen": "“She wanted to cry.” That is a clue to her feelings, an inference."}}, {"type": "order", "kick": "Sequence", "title": "Put Zuri's story in order", "text": "Tap the events in the order they happened.", "steps": ["Grandpa helped Zuri unroll the string.", "The kite flew up high.", "Wind blew the kite into a tree.", "Zuri took a slow, deep breath.", "The kite floated down."], "why": "First the string, next the kite flew, then the tree, then the breath, and last the kite came down.", "hint": "Look for first, next, then and last in the story.", "notes": {"do": "She finds each transition word in the story first, then taps.", "ask": "Which words in the story told you the order?", "listen": "First, Next, Then, Last. Those are transition words."}}, {"type": "tap", "kick": "Exit ticket", "title": "Words from memory", "text": "No peeking. Type the word.", "items": [{"type": "fill", "q": "When you trade 10 ones for 1 ten, you ____.", "answers": ["regroup", "regrouping", "carry", "carry the 1"], "why": "That is to <b>regroup</b>.", "no": "It starts with r-e.", "hint": "It is one of our six words.", "placeholder": "Type a word"}, {"type": "fill", "q": "A close guess made by rounding first is an ____.", "answers": ["estimate", "estimation"], "why": "That is an <b>estimate</b>.", "no": "It starts with e-s-t.", "hint": "236 + 187 is about 400.", "placeholder": "Type a word"}, {"type": "fill", "q": "The lesson or big idea a story teaches is the ____.", "answers": ["theme"], "why": "That is the <b>theme</b>.", "no": "It starts with t-h.", "hint": "It is not the plot.", "placeholder": "Type a word"}], "notes": {"do": "If she misses a word, she says it three times, spells it out loud, then types it again.", "listen": "Spelling: r-e-g-r-o-u-p, e-s-t-i-m-a-t-e, t-h-e-m-e."}}, {"type": "learn", "kick": "Wrap-up", "title": "Your Checkpoint game plan", "text": "You reviewed all four weeks. You are ready!", "steps": [{"text": "<b>Math:</b> work on paper first. Ones first. Regroup when you need to."}, {"text": "<b>Word problems:</b> find the clue word. Estimate means round first."}, {"text": "<b>Reading:</b> problem → try → fix. First, next, then, last. Theme = the lesson."}, {"text": "<b>This week:</b> the after-class lesson tonight. Then Practice and the Packet. The Checkpoint is on Sunday."}], "tip": "Only your first try earns points on the Checkpoint. Slow and right beats fast and wrong.", "notes": {"do": "Open her course page together. Read the task list one day at a time. She takes her 6 index cards home.", "say": "Tonight: the after-class lesson and Show What You Know. Sunday: the real Checkpoint. Print the Pre/Post sheet first.", "ask": "What will you do before you type every math answer?", "listen": "Work it on paper first."}}], "win": "You reviewed all of Unit 1. You are ready for the Checkpoint!", "prev": "bb-celine-L04", "prevTitle": "Lesson 4"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete
