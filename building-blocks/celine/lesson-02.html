<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce&#x27;Line · Lesson 2: Bigger or Smaller? Theo’s Big Problem</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L02", "label": "Lesson 2", "title": "Bigger or Smaller? Theo’s Big Problem", "goal": "I can compare and order numbers, and I can find the problem, the try and the fix in a story.", "date": "2026-11-03", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "On Your Own: Bigger or Smaller?", "text": "In class you compared numbers and found Theo’s problem.<br>Now you do it on your own.<br>Keep a pencil and paper close.", "visual": {"kind": "emoji", "text": "🧭🔢🥾"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["How do you compare two numbers? Where do you start?", "What does <b>&lt;</b> mean? What does <b>&gt;</b> mean?", "What was Theo’s <b>conflict</b>? What was the <b>resolution</b>?"], "starters": ["I start at …", "&lt; means … and &gt; means …", "Theo’s problem was … In the end, …"]}, {"type": "learn", "kick": "Remember", "title": "Line up, start left", "text": "Compare <b>647</b> and <b>652</b>.", "visual": {"kind": "longdiv", "text": "  H  T  O\n  6  4  7\n  6  5  2"}, "steps": [{"text": "Hundreds: 6 and 6. A <b>tie</b>. Move right."}, {"text": "Tens: 4 and 5. 5 is more."}, {"text": "So <b>647 &lt; 652</b>. 647 is less than 652."}], "tip": "The open side faces the bigger number."}, {"type": "tap", "kick": "Try it", "title": "Compare", "text": "Line up the places on paper first.", "items": [{"type": "fill", "q": "<b>283 ____ 238</b><br>Type &lt;, &gt; or =.", "answers": [">", "greater than", "is greater than", "more than"], "why": "Hundreds tie. Tens: 8 is more than 3. So <b>283 &gt; 238</b>. 283 is greater than 238.", "no": "Hundreds tie. Look at the tens.", "hint": "The open side faces the bigger number.", "placeholder": "Type <, > or ="}, {"type": "fill", "q": "<b>459 ____ 495</b><br>Type &lt;, &gt; or =.", "answers": ["<", "less than", "is less than"], "why": "Hundreds tie. Tens: 9 is more than 5. So <b>459 &lt; 495</b>. 459 is less than 495.", "no": "Hundreds tie. Look at the tens.", "hint": "The open side faces the bigger number.", "placeholder": "Type <, > or ="}, {"type": "fill", "q": "<b>806 ____ 860</b><br>Type &lt;, &gt; or =.", "answers": ["<", "less than", "is less than"], "why": "Hundreds tie. Tens: 6 is more than 0. So <b>806 &lt; 860</b>. 806 is less than 860.", "no": "Hundreds tie. Look at the tens.", "hint": "The open side faces the bigger number.", "placeholder": "Type <, > or ="}, {"q": "Which one is <b>true</b>?", "choices": ["519 &gt; 591", "915 &lt; 591", "591 &gt; 519", "519 = 591"], "a": 2, "why": "Hundreds tie. Tens: 9 is more than 1. So <b>591 &gt; 519</b>.", "no": ["Hundreds tie. Tens: 1 is less than 9. So 519 is smaller.", "9 hundreds is more than 5 hundreds. 915 is bigger.", null, "Same digits, different places. They are not equal."]}]}, {"type": "order", "kick": "Put in order", "title": "Least to greatest", "text": "Tap the numbers from <b>least</b> to <b>greatest</b>.", "steps": ["357", "375", "537", "573"], "why": "Hundreds first: 3 hundreds come before 5 hundreds. Then tens: 357 before 375, and 537 before 573.", "hint": "Two numbers have 3 hundreds. Which of them has fewer tens?"}, {"type": "tap", "kick": "Try it", "title": "Order and race", "text": "Read what wins before you answer.", "items": [{"type": "fill", "q": "Which is the <b>greatest</b>: 640, 604, 460? Type it.", "answers": ["640"], "why": "Hundreds: 6, 6, 4. 640 and 604 tie. Tens: 4 is more than 0. <b>640</b> is greatest.", "no": "Two numbers have 6 hundreds. Compare their tens.", "hint": "640 or 604?", "placeholder": "Type a number"}, {"q": "Ana swam in <b>205</b> seconds. Rob swam in <b>250</b> seconds. Who was <b>faster</b>?", "choices": ["Rob", "They tied", "Ana"], "a": 2, "why": "205 &lt; 250. Ana’s time is smaller, so Ana was <b>faster</b>.", "no": ["250 is the bigger time. A bigger time is slower.", "205 and 250 are not equal. The tens are different.", null]}, {"type": "fill", "q": "Put <b>481, 418, 841</b> in order from <b>least</b> to <b>greatest</b>. Type them with commas: ____", "answers": ["418, 481, 841", "418 481 841", "418481841", "418 < 481 < 841"], "why": "Hundreds: 4, 4, 8. 841 is last. 418 and 481 tie. Tens: 1 is less than 8. So: <b>418, 481, 841</b>.", "no": "Least to greatest means smallest first.", "hint": "Two numbers have 4 hundreds. Which has fewer tens?", "placeholder": "Type the 3 numbers"}]}, {"type": "learn", "kick": "Remember", "title": "Conflict, attempt, resolution", "text": "Every story has a <b>plot</b>. The plot has three big parts.", "visual": {"kind": "bigtext", "text": "conflict → attempt → resolution"}, "steps": [{"text": "<b>Conflict:</b> the problem."}, {"text": "<b>Attempt:</b> a try to fix it. Sometimes the first try does not work!"}, {"text": "<b>Resolution:</b> how it gets fixed in the end."}], "tip": "Theo: the sign is gone → he uses the compass → he reaches the top."}, {"type": "tap", "kick": "Read", "title": "Tess’s Library Book", "text": "Read the story. Then answer.", "visual": {"kind": "passage", "text": "<b>Tess’s Library Book</b><br>Tess’s library book was due today. She looked on her shelf. It was not there. Her heart thumped. She looked under her bed. She found only one old sock. Then Tess sat down and thought. “Where did I read it last?” she said. She remembered! She read it in the car. Tess ran outside and opened the car door. The book was under the seat. Tess smiled and hugged it. She took it back to the library just in time."}, "items": [{"q": "What is Tess’s <b>conflict</b>?", "choices": ["She finds only one old sock under her bed.", "Her book is due, and she cannot find it.", "She does not want to read her library book."], "a": 1, "why": "Tess’s problem: the book is due today, and it is lost.", "no": ["The sock is not her problem. What is she looking for?", null, "The story never says that."]}, {"type": "fill", "q": "Tess’s first try does not work. Where does she look <b>after</b> the shelf? Type it.", "answers": ["bed", "under her bed", "under the bed", "under bed", "her bed"], "why": "She looks <b>under her bed</b>. She finds only a sock.", "no": "Read the sentence after “Her heart thumped.”", "hint": "She finds a sock there."}, {"type": "fill", "q": "Where does Tess find the book? Under the car ____.", "answers": ["seat", "the seat", "car seat"], "why": "The book was under the <b>seat</b> in the car.", "no": "Read the part where she opens the car door.", "hint": "You sit on it."}, {"q": "Which words show Tess is <b>worried</b>?", "choices": ["Her heart thumped.", "Tess smiled and hugged it.", "She looked on her shelf."], "a": 0, "why": "“Her heart thumped” is a body clue. It shows she is worried.", "no": [null, "Smiling shows she is happy, at the end.", "That is what she does. It does not show a feeling."]}]}, {"type": "sort", "kick": "Sort it", "title": "Sort Tess’s story", "text": "Tap a card. Then tap the box where it belongs.", "buckets": ["Conflict (problem)", "Attempt (try)", "Resolution (fix)"], "items": [{"text": "Tess cannot find her library book.", "b": 0, "why": "This is Tess’s problem.", "hint": "Is this the problem, the try, or the fix?"}, {"text": "The book is due today.", "b": 0, "why": "This makes the problem big. She needs the book today.", "hint": "Does this fix anything?"}, {"text": "Tess looks under her bed.", "b": 1, "why": "Looking is a try. This try does not work.", "hint": "She is trying something."}, {"text": "Tess sits and thinks: Where did I read it last?", "b": 1, "why": "Thinking back is another try. This one works!", "hint": "She is trying something new."}, {"text": "Tess finds the book under the car seat.", "b": 2, "why": "The book is found. The problem is fixed.", "hint": "Is the problem fixed?"}, {"text": "Tess takes the book back just in time.", "b": 2, "why": "This is how the story ends.", "hint": "Is this the end?"}], "done": "Problem, then try, then fix. You found the plot!"}, {"type": "tap", "kick": "Try it", "title": "Cause and effect", "text": "A <b>cause</b> makes something happen. The <b>effect</b> is what happens.", "items": [{"q": "Tess remembered she read the book in the car. What was the <b>effect</b>?", "choices": ["Her heart began to thump.", "She looked under her bed.", "She ran out to the car."], "a": 2, "why": "Because she remembered the car, she <b>ran out to the car</b>.", "no": ["That happened before she remembered.", "That happened before she remembered.", null]}, {"type": "fill", "q": "Theo’s sign was gone, <b>so</b> he did not know which ____ to take. Type one word.", "answers": ["path", "way", "trail", "the path", "the way"], "why": "The sign was gone (cause), so Theo did not know which <b>path</b> to take (effect).", "no": "Think about the fork in the trail.", "hint": "The trail split into two of these."}, {"type": "fill", "q": "In cause and effect, what happens <b>because</b> of the cause is the ____.", "answers": ["effect", "the effect"], "why": "What happens because of the cause is the <b>effect</b>.", "no": "Cause and ____.", "hint": "It starts with e."}]}, {"type": "recall", "kick": "Remember", "title": "From last lesson", "text": "Place value, rounding and story words.", "items": [{"type": "fill", "q": "What is the <b>5</b> worth in <b>582</b>?", "answers": ["500", "5 hundreds", "five hundred"], "why": "The 5 is in the <b>hundreds</b> place. It is worth <b>500</b>.", "no": "Find the place of the 5.", "hint": "5 hundreds = 500.", "placeholder": "Type a number", "visual": {"kind": "placevalue", "n": 582}}, {"type": "fill", "q": "Round <b>73</b> to the nearest ten: ____", "answers": ["70", "seventy"], "why": "73 is between 70 and 80. The ones digit is 3. Less than 5 rounds down: <b>70</b>.", "no": "Look at the ones digit. Is it 5 or more?", "hint": "70 or 80?", "placeholder": "Type a number"}, {"q": "Which is the <b>expanded form</b> of 805?", "choices": ["80 + 5", "8 + 0 + 5", "800 + 5", "800 + 50"], "a": 2, "why": "The 8 is worth 800, the 0 is worth 0, and the 5 is worth 5. <b>800 + 5</b> = 805.", "no": ["80 + 5 = 85. The 8 is in the hundreds place.", "Those are just the digits. Use what each digit is worth.", null, "800 + 50 = 850. The 5 is in the ones place."]}, {"type": "fill", "q": "A word that tells what a character is like (brave, shy, kind) is a ____.", "answers": ["trait", "a trait", "character trait"], "why": "That is a <b>trait</b>. Theo’s traits: brave and careful.", "no": "It is a story word from last lesson.", "hint": "It starts with t-r."}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "<b>734 ____ 743</b><br>Type &lt;, &gt; or =.", "answers": ["<", "less than", "is less than"], "why": "Hundreds tie. Tens: 4 is more than 3. So <b>734 &lt; 743</b>. 734 is less than 743.", "no": "Hundreds tie. Look at the tens.", "hint": "The open side faces the bigger number.", "placeholder": "Type <, > or ="}, {"type": "fill", "q": "Which is the <b>greatest</b>: 385, 538, 358? Type it.", "answers": ["538"], "why": "Hundreds: 3, 5, 3. 5 is the biggest. <b>538</b> is greatest.", "no": "Look at the hundreds first.", "hint": "Which number has the most hundreds?", "placeholder": "Type a number"}, {"q": "Which list goes from <b>least</b> to <b>greatest</b>?", "choices": ["162, 216, 261, 612", "216, 162, 261, 612", "162, 261, 216, 612", "612, 261, 216, 162"], "a": 0, "why": "162 &lt; 216 &lt; 261 &lt; 612. Smallest first.", "no": [null, "216 is bigger than 162. 1 hundred comes before 2 hundreds.", "261 is bigger than 216. Hundreds tie, tens: 1 is less than 6.", "That list goes from greatest to least."]}, {"q": "Kim biked the trail in <b>427</b> seconds. Lou biked it in <b>472</b> seconds. Who was <b>faster</b>?", "choices": ["Lou", "Kim", "They tied"], "a": 1, "why": "427 &lt; 472. Kim’s time is smaller, so Kim was <b>faster</b>.", "no": ["472 is the bigger time. A bigger time is slower.", null, "427 and 472 are not equal. The tens are different."]}, {"type": "fill", "q": "What is Ivy’s <b>conflict</b>? The lid on the jar is ____.", "answers": ["stuck"], "why": "Ivy’s problem: the lid is <b>stuck</b>, so she cannot get a pickle.", "no": "Read the second sentence.", "hint": "It will not open.", "visual": {"kind": "passage", "text": "<b>Ivy’s Stuck Jar</b><br>Ivy wanted a pickle. The lid on the jar was stuck. Ivy twisted and twisted. It would not open. Then she ran the lid under hot water. She twisted again. Pop! The lid came off. Ivy ate a big pickle."}}, {"q": "Which of Ivy’s attempts <b>works</b>?", "choices": ["She twists the lid again and again.", "She eats a big pickle at the end.", "She runs hot water on the lid."], "a": 2, "why": "The hot water works. Then the lid comes off. That fixes the problem.", "no": ["She twists, but it will not open. That try does not work.", "Eating the pickle is the end. It is not a try.", null], "visual": {"kind": "passage", "text": "<b>Ivy’s Stuck Jar</b><br>Ivy wanted a pickle. The lid on the jar was stuck. Ivy twisted and twisted. It would not open. Then she ran the lid under hot water. She twisted again. Pop! The lid came off. Ivy ate a big pickle."}}, {"type": "fill", "q": "Ivy runs hot water on the lid to open it. A try like that is called an ____.", "answers": ["attempt", "an attempt"], "why": "A try at doing something hard is an <b>attempt</b>.", "no": "It means a try at doing something hard.", "hint": "It starts with a-t-t."}, {"type": "fill", "q": "How a story’s problem gets fixed at the end is the ____.", "answers": ["resolution", "the resolution"], "why": "That is the <b>resolution</b>.", "no": "It is the last part of the plot.", "hint": "It starts with r-e-s."}], [{"type": "fill", "q": "<b>861 ____ 816</b><br>Type &lt;, &gt; or =.", "answers": [">", "greater than", "is greater than", "more than"], "why": "Hundreds tie. Tens: 6 is more than 1. So <b>861 &gt; 816</b>. 861 is greater than 816.", "no": "Hundreds tie. Look at the tens.", "hint": "The open side faces the bigger number.", "placeholder": "Type <, > or ="}, {"type": "fill", "q": "Which is the <b>smallest</b>: 196, 169, 619? Type it.", "answers": ["169"], "why": "Hundreds: 1, 1, 6. 196 and 169 tie. Tens: 6 is less than 9. <b>169</b> is smallest.", "no": "Two numbers have 1 hundred. Compare their tens.", "hint": "196 or 169?", "placeholder": "Type a number"}, {"q": "Which one is <b>true</b>?", "choices": ["593 &lt; 539", "359 &gt; 539", "539 &lt; 593", "593 = 539"], "a": 2, "why": "Hundreds tie. Tens: 3 is less than 9. So <b>539 &lt; 593</b>.", "no": ["593 is the bigger one. Hundreds tie, tens: 9 is more than 3.", "3 hundreds is less than 5 hundreds. 359 is smaller.", null, "Same digits, different places. They are not equal."]}, {"q": "Which list goes from <b>greatest</b> to <b>least</b>?", "choices": ["907, 970, 709, 790", "970, 907, 790, 709", "709, 790, 907, 970", "970, 790, 907, 709"], "a": 1, "why": "970 &gt; 907 &gt; 790 &gt; 709. Biggest first.", "no": ["970 is bigger than 907, so 970 goes first.", null, "That list goes from least to greatest.", "907 is bigger than 790. It must come before 790."]}, {"q": "What is Rosa’s <b>conflict</b>?", "choices": ["Rain may get her cookies wet.", "She does not have any cookies to sell.", "Nobody wants to buy her cookies."], "a": 0, "why": "Rosa’s problem: rain is falling on her cookie table.", "no": [null, "She has a whole table of cookies.", "People buy every one at the end."], "visual": {"kind": "passage", "text": "<b>Rosa’s Bake Sale</b><br>Rosa set up her cookie table outside. Then dark clouds rolled in. Big drops began to fall. “My cookies will get wet!” Rosa cried. She tried to cover them with a napkin. It was too small. So she carried her table under the library porch. People came to the dry porch to buy cookies. Rosa sold every one."}}, {"type": "fill", "q": "Rosa’s first attempt does not work. What does she try to cover the cookies with? Type one word.", "answers": ["napkin", "a napkin"], "why": "She tries a <b>napkin</b>. It is too small.", "no": "Read the sentence after “Rosa cried.”", "hint": "It was too small.", "visual": {"kind": "passage", "text": "<b>Rosa’s Bake Sale</b><br>Rosa set up her cookie table outside. Then dark clouds rolled in. Big drops began to fall. “My cookies will get wet!” Rosa cried. She tried to cover them with a napkin. It was too small. So she carried her table under the library porch. People came to the dry porch to buy cookies. Rosa sold every one."}}, {"type": "fill", "q": "Rain falls (cause), <b>so</b> Rosa moves her table under the ____ (effect).", "answers": ["porch", "library porch", "the porch", "the library porch"], "why": "She carries her table under the library <b>porch</b>, where it is dry.", "no": "Where is it dry?", "hint": "It is at the library.", "visual": {"kind": "passage", "text": "<b>Rosa’s Bake Sale</b><br>Rosa set up her cookie table outside. Then dark clouds rolled in. Big drops began to fall. “My cookies will get wet!” Rosa cried. She tried to cover them with a napkin. It was too small. So she carried her table under the library porch. People came to the dry porch to buy cookies. Rosa sold every one."}}, {"type": "fill", "q": "A problem a character faces in a story is a ____.", "answers": ["conflict", "a conflict"], "why": "That is a <b>conflict</b>.", "no": "Rosa’s rain is one.", "hint": "It starts with c-o-n."}], [{"type": "fill", "q": "<b>620 ____ 602</b><br>Type &lt;, &gt; or =.", "answers": [">", "greater than", "is greater than", "more than"], "why": "Hundreds tie. Tens: 2 is more than 0. So <b>620 &gt; 602</b>. 620 is greater than 602.", "no": "Hundreds tie. Look at the tens.", "hint": "The open side faces the bigger number.", "placeholder": "Type <, > or ="}, {"type": "fill", "q": "Which is the <b>greatest</b>: 719, 791, 197? Type it.", "answers": ["791"], "why": "Hundreds: 7, 7, 1. 719 and 791 tie. Tens: 9 is more than 1. <b>791</b> is greatest.", "no": "Two numbers have 7 hundreds. Compare their tens.", "hint": "719 or 791?", "placeholder": "Type a number"}, {"q": "Four trails are 354, 345, 435 and 453 feet long. Which list goes from <b>least</b> to <b>greatest</b>?", "choices": ["354, 345, 435, 453", "453, 435, 354, 345", "345, 354, 435, 453", "345, 435, 354, 453"], "a": 2, "why": "345 &lt; 354 &lt; 435 &lt; 453. Smallest first.", "no": ["345 is smaller than 354. It should come first.", "That list goes from greatest to least.", null, "435 is bigger than 354. 4 hundreds come after 3 hundreds."]}, {"q": "Max hiked for <b>316</b> minutes. Bea hiked for <b>361</b> minutes. Who took <b>more</b> time?", "choices": ["Bea", "Max", "They tied"], "a": 0, "why": "361 &gt; 316. Bea’s time is bigger, so Bea took <b>more</b> time.", "no": [null, "316 is the smaller time. Max took less time.", "316 and 361 are not equal. The tens are different."]}, {"type": "fill", "q": "What is Kai’s <b>conflict</b>? His bike tire goes ____.", "answers": ["flat"], "why": "Kai’s problem: his tire goes <b>flat</b>, so he cannot ride.", "no": "Read the second sentence.", "hint": "It has no air.", "visual": {"kind": "passage", "text": "<b>Kai’s Flat Tire</b><br>Kai rode his bike to the park. Halfway there, his tire went flat. Kai could not ride it. He pumped the tire up. Soon it went flat again. Kai walked his bike to his uncle’s shop. Uncle Ray put a patch on the tire. Kai rode to the park with a big grin."}}, {"q": "Kai pumps up the tire, and it goes flat again. What does this tell you?", "choices": ["This part is the resolution of the story.", "Kai’s first attempt does not work.", "Kai gives up and walks home instead."], "a": 1, "why": "Pumping the tire is a try. It does not work, so Kai has to try again.", "no": ["The problem is not fixed yet. The tire goes flat again.", null, "Kai does not give up. He walks to his uncle’s shop."], "visual": {"kind": "passage", "text": "<b>Kai’s Flat Tire</b><br>Kai rode his bike to the park. Halfway there, his tire went flat. Kai could not ride it. He pumped the tire up. Soon it went flat again. Kai walked his bike to his uncle’s shop. Uncle Ray put a patch on the tire. Kai rode to the park with a big grin."}}, {"type": "fill", "q": "What is the <b>resolution</b>? Uncle Ray puts a ____ on the tire.", "answers": ["patch", "a patch"], "why": "Uncle Ray puts a <b>patch</b> on the tire. Kai can ride again.", "no": "Read the sentence about Uncle Ray.", "hint": "It covers the hole.", "visual": {"kind": "passage", "text": "<b>Kai’s Flat Tire</b><br>Kai rode his bike to the park. Halfway there, his tire went flat. Kai could not ride it. He pumped the tire up. Soon it went flat again. Kai walked his bike to his uncle’s shop. Uncle Ray put a patch on the tire. Kai rode to the park with a big grin."}}, {"type": "fill", "q": "In cause and effect, what happens because of the cause is called the ____.", "answers": ["effect", "the effect"], "why": "That is the <b>effect</b>.", "no": "Cause and ____.", "hint": "It starts with e."}]]}], "win": "You compared, put numbers in order, and found the whole plot. Great work, Ce'Line!", "prev": "bb-celine-L01", "prevTitle": "Lesson 1"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
