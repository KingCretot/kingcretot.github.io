<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce&#x27;Line · Lesson 5: Unit 1 Checkpoint Review</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L05", "label": "Lesson 5", "title": "Unit 1 Checkpoint Review", "goal": "I can use what I learned in Weeks 1 to 4, in math and reading, to get ready for my Checkpoint.", "date": "2026-12-08", "mastery": 85, "color": "#C9A84C", "slides": [{"type": "hello", "title": "Checkpoint Review: On Your Own", "text": "In class we reviewed Weeks 1 to 4. Now you practice on your own. Keep paper and a pencil next to you.", "visual": {"kind": "emoji", "text": "🏁✏️📖"}}, {"type": "talk", "kick": "Say it", "title": "Theo's stories out loud", "text": "Say these to a grown-up, or out loud to yourself.", "prompts": ["What was Theo's <b>conflict</b> on his first hike? How did he fix it?", "Tell what Theo's family did at the campsite. Use <b>first</b>, <b>next</b>, <b>then</b> and <b>last</b>.", "What is the <b>theme</b> of the marshmallow story?"], "starters": ["Theo's problem was …", "First, they … Next, …", "The lesson is …"]}, {"type": "learn", "kick": "Remember", "title": "Theo's trail story map", "text": "Read Theo's four stories. The Checkpoint asks about them.", "visual": {"kind": "emoji", "text": "🥾🧭🏕️🤝"}, "steps": [{"text": "<b>Week 1: Theo's First Hike.</b> Theo's first real hike. A forest trail on a misty, early morning. He brought his father's old brass compass."}, {"text": "<b>Week 2: The Missing Sign.</b> The trail split in two, and the sign was gone. That was the <b>conflict</b>. He used his compass and his map. He went right and reached Lookout Peak."}, {"text": "<b>Week 3: Camping.</b> Theo, Dad and his little sister Mia went camping. <b>First</b> the tent, <b>next</b> the fire, <b>then</b> chili. <b>Last</b>, they looked at the stars."}, {"text": "<b>Week 4: The Last Marshmallow.</b> One marshmallow was left. Theo broke it in half. He gave Mia the bigger piece. The <b>theme</b>: sharing with someone you love can feel better than keeping it."}], "tip": "Character and setting, problem → try → fix, sequence and theme. Theo's stories have them all!"}, {"type": "vocab", "kick": "Word Power", "title": "Review your words", "text": "Say the meaning out loud first. Then flip the card to check.", "words": [{"word": "place value", "pos": "noun", "meaning": "What a digit is worth because of where it sits in a number.", "example": "In 862, the 8 is in the hundreds place. It is worth 800.", "emoji": "🏠"}, {"word": "regroup", "pos": "verb", "meaning": "To trade 10 of one place for 1 of the next place.", "example": "8 + 7 = 15 ones. <b>Regroup</b>: write 5 and carry 1 ten.", "emoji": "🔄"}, {"word": "estimate", "pos": "noun", "meaning": "A close guess. You round the numbers first.", "example": "236 + 187 is about 200 + 200. My <b>estimate</b> is 400.", "emoji": "🎯"}, {"word": "conflict", "pos": "noun", "meaning": "The problem a character has in a story.", "example": "Zuri's kite is stuck in a tree. That is the <b>conflict</b>.", "emoji": "⚡"}, {"word": "sequence", "pos": "noun", "meaning": "The order that things happen in.", "example": "First, next, then and last show the <b>sequence</b>.", "emoji": "🔢"}, {"word": "theme", "pos": "noun", "meaning": "The lesson or big idea a story teaches.", "example": "Zuri's story <b>theme</b>: stay calm and think when you have a problem.", "emoji": "💡"}]}, {"type": "learn", "kick": "Remember", "title": "One rule for each week", "text": "Read each rule out loud.", "visual": {"kind": "bigtext", "text": "Paper first!", "sub": "Every math problem"}, "steps": [{"text": "<b>Week 1:</b> a digit's place tells its value. To round, look one place to the right. 5 or more rounds up."}, {"text": "<b>Week 2:</b> compare the hundreds first. If they tie, look at the tens."}, {"text": "<b>Week 3:</b> ones first. Regroup when a column makes 10 or more. Borrow when the top digit is too small."}, {"text": "<b>Week 4:</b> find the clue word. To estimate, round first, then add."}, {"text": "<b>Reading:</b> character and setting. Problem → try → fix. First, next, then, last. Theme = the lesson."}]}, {"type": "tap", "kick": "Try it", "title": "Weeks 1 and 2", "text": "Work on paper. Then type.", "items": [{"type": "fill", "q": "In <b>258</b>, what is the <b>5</b> worth?", "answers": ["50", "5 tens", "fifty"], "why": "The 5 is in the tens place. 5 tens = <b>50</b>.", "no": "Is the 5 in the hundreds, tens or ones place?", "hint": "The 2 is worth 200. The 5 comes next.", "placeholder": "Type a number"}, {"type": "fill", "q": "Round <b>731</b> to the nearest <b>hundred</b>: ____", "answers": ["700"], "why": "731 is between 700 and 800. Look at the tens digit: 3. That is 4 or less, so round <b>down</b>. <b>700</b>", "no": "Look at the tens digit. 5 or more rounds up. 4 or less stays.", "hint": "731 is between 700 and 800. Which one is it closer to?", "placeholder": "Type a number"}, {"type": "fill", "q": "Type <b>&gt;</b>, <b>&lt;</b> or <b>=</b>.<br><b>409 ____ 490</b>", "answers": ["<", "less than", "is less than", "less"], "why": "Hundreds tie. Tens: 0 and 9. 9 is bigger, so 490 is bigger. 409 &lt; 490 means 409 is less than 490. <b>&lt;</b>", "no": "Start with the hundreds. If they tie, look at the tens. The open side faces the bigger number.", "hint": "The point of the sign touches the smaller number.", "placeholder": "> or < or ="}]}, {"type": "tap", "kick": "Try it", "title": "Week 3: regroup", "text": "Stack each one on paper. Ones first.", "items": [{"type": "fill", "q": "<b>467 + 285 = ____</b>", "answers": ["752"], "why": "Ones: 7 + 5 = 12. Write 2, carry 1. Tens: 6 + 8 + 1 = 15. Write 5, carry 1. Hundreds: 4 + 2 + 1 = 7. <b>752</b>", "no": "Start with the ones. If a column makes 10 or more, write the ones digit and carry the 1 to the next column.", "hint": "Ones first: 7 + 5 = 12.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>713 − 456 = ____</b>", "answers": ["257"], "why": "Ones: 3 − 6? Too small. Borrow 1 ten: 1 tens become 0, and 3 ones become 13 ones. 13 − 6 = 7. Tens: 0 − 5? Too small. Borrow 1 hundred: 7 hundreds become 6, and 0 tens become 10. 10 − 5 = 5. Hundreds: 6 − 4 = 2. <b>257</b>", "no": "Start with the ones. If the top digit is too small, borrow 1 from the next place. Never flip the digits.", "hint": "Ones first: 3 − 6? You need to borrow.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>600 − 274 = ____</b>", "answers": ["326"], "why": "Ones: 0 − 4? Too small. The tens place has 0, so first take 1 hundred: 6 hundreds become 5, and 0 tens become 10 tens. Now take 1 ten: 10 tens become 9, and 0 ones become 10 ones. 10 − 4 = 6. Tens: 9 − 7 = 2. Hundreds: 5 − 2 = 3. <b>326</b>", "no": "Start with the ones. If the top digit is too small, borrow 1 from the next place. Never flip the digits.", "hint": "Ones first: 0 − 4? You need to borrow.", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Try it", "title": "Week 4: word problems", "text": "Find the clue word. Then solve on paper.", "items": [{"type": "fill", "q": "The Sharks sold <b>168</b> hot dogs and <b>254</b> drinks at the game. How many things did they sell <b>in all</b>?", "answers": ["422"], "why": "Ones: 8 + 4 = 12. Write 2, carry 1. Tens: 6 + 5 + 1 = 12. Write 2, carry 1. Hundreds: 1 + 2 + 1 = 4. <b>422</b>", "no": "Start with the ones. If a column makes 10 or more, write the ones digit and carry the 1 to the next column.", "hint": "Ones first: 8 + 4 = 12.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>Estimate</b> 147 + 362. Round each number to the nearest hundred first. Then add. Estimate: ____", "answers": ["500"], "why": "147 rounds to 100. 362 rounds to 400. 100 + 400 = <b>500</b>", "no": "Round each number to the nearest hundred first. Then add the rounded numbers. Do not add the exact numbers.", "hint": "147 rounds to 100.", "placeholder": "Type a number"}, {"q": "Kiara has <b>652</b> shells. Jude has <b>375</b> shells. How many <b>more</b> shells does Kiara have?", "choices": ["1027", "377", "277", "323"], "a": 2, "why": "“How many more” means subtract: 652 − 375. Ones: 2 − 5? Borrow: 12 − 5 = 7. Tens: 4 − 7? Borrow: 14 − 7 = 7. Hundreds: 5 − 3 = 2. <b>277</b>", "no": ["1027 is 652 + 375. “How many more” means subtract.", "Did you forget that the 6 hundreds became 5? Cross it out when you borrow.", null, "Did you flip 2 − 5 into 5 − 2? Borrow instead: 12 − 5 = 7."]}]}, {"type": "sort", "kick": "Week 4 reading", "title": "Plot or theme?", "text": "Tap a card. Is it <b>plot</b> (what happens) or <b>theme</b> (the lesson)?", "buckets": ["Plot: what happens", "Theme: the lesson"], "items": [{"text": "Theo broke the marshmallow in half.", "b": 0, "why": "That is something that happens: plot.", "hint": "Is it an event or a lesson?"}, {"text": "Sharing with someone you love can feel good.", "b": 1, "why": "That is a lesson about life: theme.", "hint": "Could this lesson fit your own life?"}, {"text": "Zuri's kite got stuck in a tree.", "b": 0, "why": "That is an event in the story: plot.", "hint": "Did it happen in the story?"}, {"text": "Stay calm and think when you have a problem.", "b": 1, "why": "That is a lesson: theme.", "hint": "Is it advice for anyone?"}, {"text": "The family cooked chili over the fire.", "b": 0, "why": "That happens in the story: plot.", "hint": "Is it something that happened?"}, {"text": "Being brave means you try, even when you are scared.", "b": 1, "why": "That is a big idea about life: theme.", "hint": "Is it a lesson?"}], "done": "Plot = what happens. Theme = the lesson the story teaches."}, {"type": "tap", "kick": "Read", "title": "Dante's Big Game", "text": "Read the story. Then answer.", "visual": {"kind": "passage", "text": "<b>Dante's Big Game</b><br>It was the last soccer game of the fall at Oak Park. Dante's team, the Sharks, was tied with the Hawks. Dante wanted to score the winning goal. First, he kicked the ball hard, but it flew past the net. Next, he tried again and missed. Dante's face felt hot. Then he saw his friend Lia, all alone by the net. Dante passed the ball to her. Lia kicked it in. Goal! The Sharks won! Last, the whole team cheered, and Lia hugged Dante. “That was the best pass ever,” she said."}, "items": [{"type": "fill", "q": "Who is the <b>main character</b>? Type the name.", "answers": ["Dante"], "why": "The story is mostly about <b>Dante</b>.", "no": "Whose story is it? Look at the title.", "hint": "It is in the title.", "placeholder": "Type a name"}, {"q": "What is Dante's <b>conflict</b>?", "choices": ["His friend Lia is playing for the other team", "He wants to score, but he keeps missing", "The game is canceled because of the rain", "He cannot find his soccer ball before the game"], "a": 1, "why": "He wants the winning goal, but his first two kicks miss. That is his problem.", "no": ["Lia IS on his team. She scores for the Sharks.", null, "The game is played. The Sharks win.", "Nothing in the story says that."]}, {"type": "fill", "q": "What did Dante do <b>after</b> he saw Lia alone by the net? He ____ the ball to her.", "answers": ["passed", "pass", "passes", "kicked", "kicks"], "why": "He <b>passed</b> the ball to Lia. That attempt worked: she scored.", "no": "Look at the sentence after “Then he saw his friend Lia.”", "hint": "It starts with p.", "placeholder": "Type a word"}, {"q": "What is the <b>theme</b>?", "choices": ["Soccer is the best sport, and everyone should play it", "Always kick the ball as hard as you can to score", "Helping your team can matter more than being the star", "Never play soccer outside when the weather is cold"], "a": 2, "why": "Dante gave up his own goal to help Lia score, and the team won. The lesson is about <b>teamwork</b>.", "no": ["That is an opinion. It is not the lesson of the story.", "His hard kicks missed! The story does not teach that.", null, "The story never talks about cold weather."]}]}, {"type": "tap", "kick": "Theo", "title": "Theo's trail details", "text": "Think back to Theo's story map. Answer from memory.", "items": [{"q": "When the trail split, which way did Theo go?", "choices": ["Left, into the shadowy trees", "Back down the trail toward home", "Right, onto the open rock path", "He sat down and waited for help"], "a": 2, "why": "His compass showed north was through the open rock path. He turned <b>right</b>, toward the sunlight.", "no": ["The shadowy trees were the wrong way.", "He thought about it, but he did not give up.", null, "He used his compass and kept going."]}, {"type": "fill", "q": "At camp, the tent went up <b>first</b>. What did the family build <b>next</b>? Type one word.", "answers": ["fire", "a fire", "the fire", "campfire", "a campfire", "fire ring", "a fire ring"], "why": "First the tent, <b>next</b> the <b>fire</b>, then the chili.", "no": "Look at the Week 3 stop: first, next, then.", "hint": "They cooked chili on it.", "placeholder": "Type a word"}, {"type": "fill", "q": "Theo broke the last marshmallow in half. Was the piece he gave Mia <b>bigger</b> or <b>smaller</b>? Type one word.", "answers": ["bigger", "the bigger one", "the bigger piece", "larger", "big"], "why": "He gave Mia the <b>bigger</b> piece. He put her feelings first.", "no": "Look at the Week 4 stop on the story map.", "hint": "Theo was being extra kind.", "placeholder": "bigger or smaller"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Week 1. Round <b>463</b> to the nearest <b>hundred</b>: ____", "answers": ["500"], "why": "463 is between 400 and 500. Look at the tens digit: 6. That is 5 or more, so round <b>up</b>. <b>500</b>", "no": "Look at the tens digit. 5 or more rounds up. 4 or less stays.", "hint": "463 is between 400 and 500. Which one is it closer to?", "placeholder": "Type a number"}, {"q": "Week 2. Which list is in order from <b>least to greatest</b>?", "choices": ["752, 725, 572", "572, 725, 752", "725, 572, 752", "572, 752, 725"], "a": 1, "why": "Hundreds first: 5, 7, 7. 572 is least. 725 and 752 tie on hundreds, so look at the tens: 2 is less than 5. <b>572, 725, 752</b>", "no": ["That is greatest to least, backward.", null, "725 is bigger than 572, so 725 can't come first.", "752 and 725 are switched. Look at the tens."]}, {"type": "fill", "q": "Week 3. <b>259 + 374 = ____</b>", "answers": ["633"], "why": "Ones: 9 + 4 = 13. Write 3, carry 1. Tens: 5 + 7 + 1 = 13. Write 3, carry 1. Hundreds: 2 + 3 + 1 = 6. <b>633</b>", "no": "Start with the ones. If a column makes 10 or more, write the ones digit and carry the 1 to the next column.", "hint": "Ones first: 9 + 4 = 13.", "placeholder": "Type a number"}, {"type": "fill", "q": "Week 4. The library had <b>604</b> stickers. Kids took <b>358</b>. How many stickers are <b>left</b>?", "answers": ["246"], "why": "Ones: 4 − 8? Too small. The tens place has 0, so first take 1 hundred: 6 hundreds become 5, and 0 tens become 10 tens. Now take 1 ten: 10 tens become 9, and 4 ones become 14 ones. 14 − 8 = 6. Tens: 9 − 5 = 4. Hundreds: 5 − 3 = 2. <b>246</b>", "no": "Start with the ones. If the top digit is too small, borrow 1 from the next place. Never flip the digits.", "hint": "Ones first: 4 − 8? You need to borrow.", "placeholder": "Type a number"}, {"q": "Week 1 reading. What is the <b>setting</b>?", "choices": ["Talia's kitchen on a Saturday night", "The library after school lets out", "The science fair at school", "On top of a real, smoking volcano"], "a": 2, "why": "Talia is at “the science fair at school.” That is where it happens.", "no": ["The story happens on the big day of the fair, not at home.", "That is not in this story.", null, "Her volcano is made of clay. It is a project."], "visual": {"kind": "passage", "text": "<b>Talia's Volcano</b><br>Talia built a clay volcano for the science fair at school. On the big day, she poured in the vinegar. Nothing happened! A few kids laughed. Talia's cheeks turned red, but she did not quit. First, she checked her notes. Next, she saw that she forgot the baking soda. Then she added two big spoons of it. Whoosh! Red foam bubbled over the top. Last, the judges clapped and gave her a blue ribbon."}}, {"type": "fill", "q": "Week 2 reading. How did Talia fix the problem? She added the baking ____.", "answers": ["soda", "baking soda"], "why": "She added the baking <b>soda</b> she forgot. That fixed it: the resolution.", "no": "Look at the sentence that starts with “Then.”", "hint": "It goes with vinegar.", "placeholder": "Type a word", "visual": {"kind": "passage", "text": "<b>Talia's Volcano</b><br>Talia built a clay volcano for the science fair at school. On the big day, she poured in the vinegar. Nothing happened! A few kids laughed. Talia's cheeks turned red, but she did not quit. First, she checked her notes. Next, she saw that she forgot the baking soda. Then she added two big spoons of it. Whoosh! Red foam bubbled over the top. Last, the judges clapped and gave her a blue ribbon."}}, {"q": "Week 3 reading. What did Talia do <b>first</b>, after nothing happened?", "choices": ["She checked her notes", "She added baking soda", "She got a blue ribbon", "She went home"], "a": 0, "why": "“<b>First</b>, she checked her notes.” Then she found the mistake.", "no": [null, "That came after. She had to find the mistake first.", "That was last.", "She did not quit or go home."], "visual": {"kind": "passage", "text": "<b>Talia's Volcano</b><br>Talia built a clay volcano for the science fair at school. On the big day, she poured in the vinegar. Nothing happened! A few kids laughed. Talia's cheeks turned red, but she did not quit. First, she checked her notes. Next, she saw that she forgot the baking soda. Then she added two big spoons of it. Whoosh! Red foam bubbled over the top. Last, the judges clapped and gave her a blue ribbon."}}, {"q": "Week 4 reading. What is the <b>theme</b> of Talia's story?", "choices": ["Clay volcanoes always win a blue ribbon", "Science fairs are boring if nothing happens", "Kids who laugh at others get in trouble", "Don't quit. Find your mistake and fix it."], "a": 3, "why": "Talia did not quit. She checked, found her mistake and fixed it. That is the <b>lesson</b>.", "no": ["That is about one fair. It is not a lesson about life.", "The story does not say that.", "The kids who laughed are a small detail. Nothing happens to them.", null], "visual": {"kind": "passage", "text": "<b>Talia's Volcano</b><br>Talia built a clay volcano for the science fair at school. On the big day, she poured in the vinegar. Nothing happened! A few kids laughed. Talia's cheeks turned red, but she did not quit. First, she checked her notes. Next, she saw that she forgot the baking soda. Then she added two big spoons of it. Whoosh! Red foam bubbled over the top. Last, the judges clapped and gave her a blue ribbon."}}], [{"q": "Week 1. Which is <b>509</b> in expanded form?", "choices": ["50 + 9", "5 + 0 + 9", "500 + 9", "500 + 90"], "a": 2, "why": "The 5 is worth 500. The 0 tens is worth 0. The 9 is worth 9. <b>500 + 9</b>", "no": ["The 5 is in the hundreds place. It is worth 500, not 50.", "The 5 is in the hundreds place. It is worth 500, not 5.", null, "The 9 is in the ones place. It is worth 9, not 90."]}, {"type": "fill", "q": "Week 2. Type <b>&gt;</b>, <b>&lt;</b> or <b>=</b>.<br><b>761 ____ 716</b>", "answers": [">", "greater than", "is greater than", "greater"], "why": "Hundreds tie. Tens: 6 and 1. 6 is bigger, so 761 is bigger. 761 &gt; 716 means 761 is greater than 716. <b>&gt;</b>", "no": "Start with the hundreds. If they tie, look at the tens. The open side faces the bigger number.", "hint": "The point of the sign touches the smaller number.", "placeholder": "> or < or ="}, {"type": "fill", "q": "Week 3. <b>642 − 375 = ____</b>", "answers": ["267"], "why": "Ones: 2 − 5? Too small. Borrow 1 ten: 4 tens become 3, and 2 ones become 12 ones. 12 − 5 = 7. Tens: 3 − 7? Too small. Borrow 1 hundred: 6 hundreds become 5, and 3 tens become 13. 13 − 7 = 6. Hundreds: 5 − 3 = 2. <b>267</b>", "no": "Start with the ones. If the top digit is too small, borrow 1 from the next place. Never flip the digits.", "hint": "Ones first: 2 − 5? You need to borrow.", "placeholder": "Type a number"}, {"type": "fill", "q": "Week 4. <b>Estimate</b> 318 + 471. Round each number to the nearest hundred first. Then add. Estimate: ____", "answers": ["800"], "why": "318 rounds to 300. 471 rounds to 500. 300 + 500 = <b>800</b>", "no": "Round each number to the nearest hundred first. Then add the rounded numbers. Do not add the exact numbers.", "hint": "318 rounds to 300.", "placeholder": "Type a number"}, {"type": "fill", "q": "Week 1 reading. Who is the <b>main character</b>? Type the name.", "answers": ["Nico"], "why": "The story is mostly about <b>Nico</b>.", "no": "Pepper is the dog. Who is the story about?", "hint": "Look at the first word of the story.", "placeholder": "Type a name",
