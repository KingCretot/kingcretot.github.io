<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ce&#x27;Line · Lesson 2: Bigger or Smaller? Theo’s Big Problem</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L02", "label": "Lesson 2", "title": "Bigger or Smaller? Theo’s Big Problem", "goal": "I can compare and order numbers, and I can find the problem, the try and the fix in a story.", "date": "2026-11-03", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "Bigger or Smaller? Theo’s Big Problem", "text": "Today you learn two big things.<br>In math, you <b>compare</b> numbers and put them in <b>order</b>.<br>In reading, Theo’s hike hits a big <b>problem</b>.", "visual": {"kind": "emoji", "text": "🧭🔢🥾"}, "notes": {"do": "Before class: 12 blank index cards, a dry-erase board with 2 marker colors, a pencil, and her printed Week 2 Packet (keep it until the end of class). Ce'Line taps and types on the laptop herself today. Sit beside her, not across.", "say": "Last week you learned what each digit is worth. Today we use that to find which number is bigger. Then we find out what goes wrong on Theo's hike.", "ask": "What is the 4 worth in 452?", "listen": "400, or 4 hundreds. If she says 4, point to the hundreds place and ask again: what is a 4 worth when it sits in the hundreds place?"}}, {"type": "talk", "kick": "Book Talk", "title": "Theo’s hike so far", "text": "Remember <b>Theo’s First Hike</b> from last week?", "visual": {"kind": "emoji", "text": "🥾🌲⛰️"}, "prompts": ["Who is the story about? What is he like?", "Where is Theo? When does the story happen?", "What does Theo want to see at the top?"], "starters": ["The story is about … He is …", "The setting is …", "Theo wants to see …"], "notes": {"do": "5 minutes. She answers out loud in full sentences. Praise every detail she remembers by name: \"Yes! You remembered the compass.\"", "ask": "Who is the story about? Where and when is it? What does Theo want to see at the top?", "listen": "Theo; brave, careful, a little nervous (his hands were shaky). A hiking trail in the early morning: pine trees, a rocky creek, mist over the valley. He wants to see the whole valley from Lookout Peak, like his grandfather described. If she forgets, tell her: Theo has his father's old brass compass. It matters today."}}, {"type": "recall", "kick": "Remember", "title": "From last week", "text": "Quick warm-up. Type each answer.", "items": [{"type": "fill", "q": "What is the <b>7</b> worth in <b>374</b>?", "answers": ["70", "7 tens", "seventy"], "why": "The 7 is in the <b>tens</b> place. It is worth <b>70</b>.", "no": "Find the place of the 7. Is it ones, tens or hundreds?", "hint": "7 tens = 70.", "placeholder": "Type a number", "visual": {"kind": "placevalue", "n": 374}}, {"type": "fill", "q": "Round <b>46</b> to the nearest ten: ____", "answers": ["50", "fifty"], "why": "46 is between 40 and 50. The ones digit is 6. 5 or more rounds up: <b>50</b>.", "no": "Look at the ones digit. Is it 5 or more?", "hint": "40 or 50? 6 ones is 5 or more.", "placeholder": "Type a number"}, {"q": "Round <b>350</b> to the nearest hundred.", "choices": ["300", "400", "350"], "a": 1, "why": "Look at the tens digit: 5. 5 or more rounds up. 350 rounds to <b>400</b>.", "no": ["300 is rounding down. The tens digit is 5, so round up.", null, "350 is not a hundred. It must be 300 or 400."]}, {"type": "fill", "q": "Where and when a story happens is the ____.", "answers": ["setting", "the setting"], "why": "The <b>setting</b> is where and when. Theo’s setting is a hiking trail early in the morning.", "no": "It is a story word from last week. It tells where and when.", "hint": "It starts with s-e-t."}], "notes": {"do": "She types each answer herself. Quick and confident is the goal. Celebrate each right answer.", "listen": "70, 50, 400, setting. If she says 7, she named the digit, not its worth: put her finger on the tens place. If she says 300 for 350, ask: is the tens digit 5 or more?"}}, {"type": "vocab", "kick": "Word Power", "title": "Math words for today", "text": "Tap each card to flip it. Read the word and the meaning out loud.", "words": [{"word": "compare", "pos": "verb", "meaning": "To look at two numbers and find which is bigger, which is smaller, or if they are the same.", "example": "<b>Compare</b> 520 and 389. 520 is bigger.", "emoji": "⚖️"}, {"word": "greater than (>)", "pos": "symbol", "meaning": "Shows the first number is <b>bigger</b>.", "example": "520 &gt; 389 means 520 is greater than 389.", "emoji": "⬆️"}, {"word": "less than (<)", "pos": "symbol", "meaning": "Shows the first number is <b>smaller</b>.", "example": "389 &lt; 520 means 389 is less than 520.", "emoji": "⬇️"}, {"word": "equal (=)", "pos": "symbol", "meaning": "Shows two numbers are the <b>same</b>.", "example": "615 = 615", "emoji": "🟰"}, {"word": "order", "pos": "verb", "meaning": "To put numbers in a line, from smallest to biggest or from biggest to smallest.", "example": "In <b>order</b> from smallest: 213, 312, 321.", "emoji": "📶"}], "notes": {"do": "She reads each card out loud, then covers it and says the meaning in her own words.", "say": "The open side of the symbol always faces the bigger number.", "ask": "Which word means to put numbers in a line? Which symbol means less than?", "listen": "Order. The less-than symbol has its point on the left: the first number is smaller."}}, {"type": "learn", "kick": "Learn", "title": "Start with the biggest place", "text": "Which number is bigger, <b>463</b> or <b>389</b>?", "visual": {"kind": "longdiv", "text": "  H  T  O\n  4  6  3\n  3  8  9"}, "steps": [{"text": "Line up the numbers. Hundreds over hundreds."}, {"text": "Look at the <b>hundreds</b> first: 4 and 3."}, {"text": "4 is more than 3. So <b>463 is bigger</b>. You can stop!"}, {"text": "Do not be tricked by the 8 and the 9. The hundreds win first."}], "tip": "Start at the left. The biggest place decides first.", "notes": {"do": "Hands-on: she writes 463 and 389 on two index cards and lines them up on the table, hundreds over hundreds. She points to the two hundreds digits.", "say": "463 has 4 hundreds. 389 has only 3 hundreds. Even with 8 tens and 9 ones, 389 can't catch up.", "ask": "Why don't we need to look at the 8 and the 9?", "listen": "Because 4 hundreds is already more than 3 hundreds. If she says 389 is bigger because 8 and 9 are big digits, draw 4 big squares (hundreds) next to 3 big squares and ask which side has more."}}, {"type": "learn", "kick": "Learn", "title": "A tie? Move to the right.", "text": "Compare <b>274</b> and <b>281</b>.", "visual": {"kind": "longdiv", "text": "  H  T  O\n  2  7  4\n  2  8  1"}, "steps": [{"text": "Hundreds: 2 and 2. A <b>tie</b>! Move one place to the right."}, {"text": "Tens: 7 and 8. 8 is more. So <b>281 is bigger</b>."}, {"text": "Now try <b>536</b> and <b>532</b>. Hundreds tie. Tens tie, too (3 and 3)."}, {"text": "Ones: 6 and 2. 6 is more. So <b>536 is bigger</b>."}, {"text": "If every place ties, the numbers are <b>equal</b>."}], "tip": "Tie? Move right. Keep going until one digit wins.", "notes": {"do": "She makes cards for 274, 281, 536 and 532. For each pair she slides her finger from left to right and says \"tie\" or \"wins\" at each place.", "ask": "In 536 and 532, which place decides?", "listen": "The ones place: 6 is more than 2. If she stops at the hundreds and says \"they're the same,\" ask: did EVERY place tie?"}}, {"type": "learn", "kick": "Learn", "title": "The symbols", "text": "We use symbols to show a compare.", "visual": {"kind": "bigtext", "text": "463 &gt; 389", "sub": "463 is greater than 389"}, "steps": [{"text": "<b>&gt;</b> means <b>greater than</b>. <b>&lt;</b> means <b>less than</b>."}, {"text": "The open side faces the <b>bigger</b> number. It is like a hungry mouth. It wants the bigger number."}, {"text": "The point faces the <b>smaller</b> number."}, {"text": "<b>389 &lt; 463</b> reads: 389 is less than 463."}, {"text": "<b>615 = 615</b> reads: 615 is equal to 615."}], "tip": "Read it left to right, like a sentence.", "notes": {"do": "On the whiteboard write 463 ___ 389, then 389 ___ 463. She draws each symbol and reads the whole thing out loud as a sentence.", "ask": "Which way does the open side face? Why?", "listen": "Toward 463, the bigger number. She must also READ it: \"463 is greater than 389.\" Saying only \"alligator\" is not enough; the Pathways retake uses the words greater than and less than."}}, {"type": "tap", "kick": "Your turn", "title": "Compare", "text": "Line up the places. Start at the left.", "items": [{"type": "fill", "q": "<b>547 ____ 574</b><br>Type &lt;, &gt; or =.", "answers": ["<", "less than", "is less than"], "why": "Hundreds tie. Tens: 7 is more than 4. So <b>547 &lt; 574</b>. 547 is less than 574.", "no": "Hundreds tie. Look at the tens.", "hint": "The open side faces the bigger number.", "placeholder": "Type <, > or ="}, {"type": "fill", "q": "<b>802 ____ 799</b><br>Type &lt;, &gt; or =.", "answers": [">", "greater than", "is greater than", "more than"], "why": "Hundreds: 8 is more than 7. So <b>802 &gt; 799</b>. 802 is greater than 799.", "no": "Start at the left. Look at the hundreds first.", "hint": "The open side faces the bigger number.", "placeholder": "Type <, > or ="}, {"type": "fill", "q": "<b>615 ____ 615</b><br>Type &lt;, &gt; or =.", "answers": ["=", "equal", "equals", "equal to", "is equal to"], "why": "Every place ties. 615 and 615 are <b>equal</b>: <b>615 = 615</b>.", "no": "Check each place: hundreds, tens, ones. Is any digit different?", "hint": "The open side faces the bigger number.", "placeholder": "Type <, > or ="}, {"q": "Which one is <b>true</b>?", "choices": ["362 &gt; 623", "623 &lt; 362", "362 &lt; 623", "362 = 623"], "a": 2, "why": "3 hundreds is less than 6 hundreds. So <b>362 &lt; 623</b>.", "no": ["The open side must face the bigger number. 623 is bigger.", "623 is bigger, so it is not less than 362.", null, "They have the same digits, but in different places. They are not equal."]}], "notes": {"do": "She says each answer as a sentence BEFORE she types: \"547 is less than 574.\"", "ask": "Which place decided 547 and 574?", "listen": "<, >, =, and 362 < 623. If she types > for 547 ____ 574, she compared the ones (7 and 4). Ask: which place do we look at first? Then, after the hundreds tie, which place comes next?"}}, {"type": "tap", "kick": "Your turn", "title": "Read the symbols", "text": "Read each one out loud first.", "items": [{"type": "fill", "q": "Is this true? <b>708 &gt; 780</b><br>Type <b>true</b> or <b>false</b>.", "answers": ["false"], "why": "Hundreds tie. Tens: 0 is less than 8. So 708 is <b>less</b> than 780. The sentence is <b>false</b>.", "no": "Hundreds tie. Compare the tens.", "hint": "0 tens or 8 tens: which is more?", "placeholder": "true or false"}, {"type": "fill", "q": "A sign says <b>419 &lt; 491</b>. Which number is <b>bigger</b>? Type it.", "answers": ["491"], "why": "The open side faces 491. <b>491</b> is bigger.", "no": "The open side faces the bigger number.", "hint": "Hundreds tie. Tens: 1 or 9?", "placeholder": "Type a number"}, {"q": "How do you read <b>256 &lt; 265</b>?", "choices": ["256 is greater than 265", "256 is equal to 265", "256 is less than 265"], "a": 2, "why": "The point faces 256, so 256 is smaller. Read it: <b>256 is less than 265</b>.", "no": ["Greater than is &gt;. This symbol is &lt;.", "Equal is =. These numbers are not the same.", null]}], "notes": {"do": "She reads each sentence out loud with the words greater than / less than before answering.", "listen": "false, 491, less than. If she says true for 708 > 780, cover the ones and compare 70 and 78 first."}}, {"type": "learn", "kick": "Learn", "title": "Put numbers in order", "text": "Put <b>524, 342, 435</b> in order from <b>least</b> to <b>greatest</b>.", "steps": [{"text": "<b>Least</b> means smallest. <b>Greatest</b> means biggest."}, {"text": "Look at the hundreds: 5, 3, 4."}, {"text": "3 is the smallest. <b>342</b> goes first."}, {"text": "Then 4 hundreds: <b>435</b>. Then 5 hundreds: <b>524</b>."}, {"text": "In order: <b>342, 435, 524</b>.", "visual": {"kind": "numberline", "start": 300, "jump": 100, "jumps": 3}}], "tip": "Least to greatest: smallest first. Greatest to least: biggest first.", "notes": {"do": "Hands-on: she writes the three numbers on index cards, then slides the cards into a line on the table, smallest on the left. On the last step, she points to where each number sits on the number line (342 just past 300, 435 just past 400, 524 just past 500).", "ask": "Which digit did you look at first? What would greatest to least look like?", "listen": "The hundreds. Greatest to least is the same cards flipped: 524, 435, 342."}}, {"type": "order", "kick": "Put in order", "title": "Line up the cards", "text": "Tap the numbers from <b>least</b> to <b>greatest</b>.", "steps": ["409", "490", "904", "940"], "why": "All four use 4, 9 and 0. Hundreds first: 4 hundreds come before 9 hundreds. Then tens: 0 tens come before 9 tens.", "hint": "Look at the hundreds digit first. Two numbers start with 4. Which of those two has fewer tens?", "notes": {"do": "First she builds it with 4 index cards on the table. Then she taps it on the screen.", "ask": "409 and 490 both have 4 hundreds. How did you decide?", "listen": "\"Tie in the hundreds, so I looked at the tens: 0 is less than 9.\" Same for 904 and 940."}}, {"type": "tap", "kick": "Read carefully", "title": "When smaller wins", "text": "In a race, the <b>smallest</b> time is the <b>fastest</b>. Read what wins before you answer!", "visual": {"kind": "emoji", "text": "🏃‍♀️⏱️🏁"}, "items": [{"q": "Jada ran the trail in <b>318</b> seconds. Omar ran it in <b>381</b> seconds. Who was <b>faster</b>?", "choices": ["Omar", "Jada", "They tied"], "a": 1, "why": "318 &lt; 381. Jada’s time is smaller, so Jada was <b>faster</b>.", "no": ["381 is the bigger time. A bigger time means slower.", null, "318 and 381 are not equal. The tens are different."]}, {"type": "fill", "q": "Three hikers carried packs that weigh <b>264</b>, <b>246</b> and <b>426</b> ounces. Which pack is the <b>lightest</b>? Type its weight.", "answers": ["246"], "why": "Hundreds: 2, 2, 4. Two packs tie with 2 hundreds. Tens: 4 is less than 6. <b>246</b> is the lightest.", "no": "Lightest means smallest. Two numbers have 2 hundreds. Compare their tens.", "hint": "264 or 246?", "placeholder": "Type a number"}, {"type": "fill", "q": "Put <b>732, 723, 327</b> in order from <b>greatest</b> to <b>least</b>. Type them with commas: ____", "answers": ["732, 723, 327", "732 723 327", "732723327", "732 > 723 > 327"], "why": "Hundreds: 7, 7, 3. 327 is last. 732 and 723 tie in the hundreds. Tens: 3 is more than 2. So: <b>732, 723, 327</b>.", "no": "Greatest to least means biggest first.", "hint": "Two numbers have 7 hundreds. Which has more tens?", "placeholder": "Type the 3 numbers"}], "notes": {"do": "She reads each question out loud and circles the key word on the whiteboard (faster, lightest, greatest) before answering.", "ask": "In a race, does the bigger number win? Why not?", "listen": "No. A bigger time means it took longer. Jada, 246, then 732, 723, 327. This is the trap on the Pathways retake: read whether the bigger or the smaller number wins."}}, {"type": "tap", "kick": "Exit ticket", "title": "Math check", "text": "On your own this time.", "items": [{"type": "fill", "q": "<b>693 ____ 639</b><br>Type &lt;, &gt; or =.", "answers": [">", "greater than", "is greater than", "more than"], "why": "Hundreds tie. Tens: 9 is more than 3. So <b>693 &gt; 639</b>. 693 is greater than 639.", "no": "Hundreds tie. Look at the tens.", "hint": "The open side faces the bigger number.", "placeholder": "Type <, > or ="}, {"type": "fill", "q": "Which is the <b>smallest</b>: 580, 508, 850? Type it.", "answers": ["508"], "why": "Hundreds: 5, 5, 8. 580 and 508 tie. Tens: 0 is less than 8. <b>508</b> is smallest.", "no": "Two numbers have 5 hundreds. Compare their tens.", "hint": "580 or 508?", "placeholder": "Type a number"}, {"q": "Which list goes from <b>least</b> to <b>greatest</b>?", "choices": ["417, 471, 714, 741", "471, 417, 714, 741", "417, 471, 741, 714", "741, 714, 471, 417"], "a": 0, "why": "417 &lt; 471 &lt; 714 &lt; 741. Smallest first.", "no": [null, "471 is bigger than 417. Hundreds tie, then tens: 1 is less than 7.", "741 is bigger than 714. It should come last.", "That list goes from greatest to least."]}], "notes": {"do": "Hands off. She works alone. Note her FIRST answers on the teacher plan.", "listen": "693 > 639, 508, and the first list. All three right on the first try means the math is ready for the Pathways Week 2 Math retake on Monday."}}, {"type": "vocab", "kick": "Word Power", "title": "Reading words for today", "text": "Tap each card. Read the word and the meaning out loud.", "words": [{"word": "conflict", "pos": "noun", "meaning": "A problem a character faces in a story.", "example": "Theo’s <b>conflict</b> starts when the trail splits in two.", "emoji": "⚠️"}, {"word": "solve", "pos": "verb", "meaning": "To find an answer or fix a problem.", "example": "Theo wants to <b>solve</b> his problem on his own.", "emoji": "🔧"}, {"word": "attempt", "pos": "noun", "meaning": "A try at doing something hard.", "example": "Using a map is a smart <b>attempt</b> to find the way.", "emoji": "💪"}, {"word": "resolution", "pos": "noun", "meaning": "How the story’s problem gets fixed by the end.", "example": "In the <b>resolution</b>, the problem is fixed.", "emoji": "🏁"}, {"word": "cause and effect", "pos": "noun", "meaning": "What happens (effect) because of something that happened first (cause).", "example": "It rained (cause), so the trail got muddy (effect).", "emoji": "➡️"}], "notes": {"do": "She reads each card out loud and covers it. Spend extra time on attempt and resolution: they are new words.", "say": "Now we switch to reading. Every good story has a problem. Today, Theo's hike gets tricky.", "ask": "What is the difference between a conflict and a resolution?", "listen": "Conflict = the problem. Resolution = how it gets fixed at the end."}}, {"type": "tap", "kick": "Read", "title": "The trail sign is missing", "text": "Read this part out loud.", "visual": {"kind": "passage", "text": "<b>Theo’s First Hike (continued)</b><br>Near the top of the climb, the trail suddenly split into two paths, and the wooden sign that should have pointed the way was gone. Wind had knocked it over, and it lay half-buried in pine needles at Theo’s feet. His stomach tightened. To the left, the path curved into thick, shadowy trees. To the right, it opened onto bare rock. He had no idea which way led to Lookout Peak, and for a moment, he thought about turning around and heading back down."}, "items": [{"type": "fill", "q": "Theo’s problem: the trail splits, and the ____ that should point the way is gone. Type one word.", "answers": ["sign", "trail sign", "wooden sign", "the sign"], "why": "The wooden <b>sign</b> is gone. Theo does not know which path to take.", "no": "Look at the first sentence. What should have pointed the way?", "hint": "It is made of wood."}, {"q": "Which words show that Theo is <b>worried</b>?", "choices": ["His stomach tightened.", "To the right, it opened onto bare rock.", "Near the top of the climb"], "a": 0, "why": "“His stomach tightened” is a body clue. It shows Theo feels <b>worried</b>.", "no": [null, "That tells about the path, not about how Theo feels.", "That tells where he is, not how he feels."]}, {"q": "Why is this a <b>conflict</b>?", "choices": ["The trees on the left path are shadowy and dark.", "The path on the right opens onto bare rock.", "He does not know which path is the right one."], "a": 2, "why": "A conflict is a problem the character must face. Theo must pick a path, and he does not know which one is right.", "no": ["The trees are part of the setting. The problem is not knowing which way to go.", "That tells about the path. The problem is not knowing which way to go.", null]}], "notes": {"do": "She reads aloud. Stop after \"His stomach tightened\" and ask how she would feel. Help with knocked, half-buried and shadowy if needed.", "ask": "What is Theo's problem, in your own words? What does he think about doing?", "listen": "\"The sign is gone and he doesn't know which path goes to the peak.\" He thinks about turning around and going back down."}}, {"type": "tap", "kick": "Read", "title": "Theo tries to solve it", "text": "Read this part out loud.", "visual": {"kind": "passage", "text": "<b>Theo’s First Hike (continued)</b><br>Theo took a breath and thought about what to do. He could guess and hope he picked right. He could turn back and give up on seeing the valley. Or he could try something else. He remembered the old brass compass clipped to his belt, the one his father had given him that morning. He unclipped it, held it flat and steady in his palm, and watched the needle settle, pointing firmly north. Even the wind seemed to go still as he waited. Then he pulled out the folded trail map from his backpack and matched it against the compass. Lookout Peak, the map showed, was almost due north from where he stood."}, "items": [{"type": "fill", "q": "Theo thinks of <b>three</b> choices: guess, turn back, or try something else. What tool does he unclip from his belt? Type one word.", "answers": ["compass", "the compass", "his compass", "brass compass", "a compass"], "why": "Theo uses his <b>compass</b>. Then he matches it with his map.", "no": "He unclips something from his belt.", "hint": "It has a needle that points north."}, {"q": "Why is guessing a <b>risky</b> choice for Theo?", "choices": ["Guessing takes too long.", "He might pick the wrong path.", "His father told him not to guess."], "a": 1, "why": "If Theo guesses, he might take the wrong path and not reach the peak.", "no": ["Guessing is fast. The trouble is it could be wrong.", null, "The story does not say that."]}, {"type": "fill", "q": "Who gave Theo the compass? Type one word.", "answers": ["father", "his father", "dad", "his dad", "theos father", "theos dad", "daddy"], "why": "The story says his <b>father</b> gave it to him that morning.", "no": "Look at the sentence about the old brass compass.", "hint": "It is a family member."}], "notes": {"do": "She reads aloud. On the whiteboard, write Theo's three choices in a list. She puts a star by the one he picks.", "ask": "Why is using the compass a better attempt than guessing or giving up?", "listen": "Guessing could be wrong. Giving up means he never sees the valley. The compass and map help him find the right way. Theo uses a tool he got at the START of the story to solve a NEW problem."}}, {"type": "tap", "kick": "Read", "title": "The resolution", "text": "Read the last part out loud.", "visual": {"kind": "passage", "text": "<b>Theo’s First Hike (continued)</b><br>According to the compass, north pointed straight through the open rock path, not the shadowy trees. Theo clipped the compass back onto his belt, took one more breath, and turned right, toward the sunlight. Fifteen minutes later, the trees thinned out completely, and there it was: the whole valley, spread out below him just like his grandfather always said it would be, mist rising gold in the early sun. Theo grinned. He hadn’t just followed a trail today. He’d solved his first real problem, all on his own."}, "items": [{"type": "fill", "q": "Which way does Theo turn? Type <b>left</b> or <b>right</b>.", "answers": ["right"], "why": "Theo turns <b>right</b>, toward the sunlight and the open rock path.", "no": "The compass points through the open rock path. Which side was the rock on?", "hint": "Not the shadowy trees.", "placeholder": "left or right"}, {"q": "How does Theo feel at the end?", "choices": ["scared and lost", "bored and tired", "proud and happy"], "a": 2, "why": "Theo <b>grinned</b>. He solved his first real problem all on his own. He feels proud and happy.", "no": ["He found the way. He is not lost anymore.", "He grinned. He is not bored or tired.", null]}, {"type": "fill", "q": "The resolution is how the problem gets ____. Type one word.", "answers": ["fixed", "solved", "fix", "solve"], "why": "The <b>resolution</b> is how the problem gets <b>fixed</b> (or solved).", "no": "Think about the meaning card.", "hint": "It starts with f or s."}], "notes": {"do": "She reads aloud. Ask her to show you Theo's grin.", "ask": "What does Theo see at the top? Who told him about it?", "listen": "The whole valley, just like his grandfather said. The ending connects back to Theo's goal from the first part of the story."}}, {"type": "sort", "kick": "Sort it", "title": "Problem, try or fix?", "text": "Tap a card. Then tap the box where it belongs.", "buckets": ["Conflict (problem)", "Attempt (try)", "Resolution (fix)"], "items": [{"text": "The trail splits, and the sign is gone.", "b": 0, "why": "This is the problem Theo faces.", "hint": "Is this the problem, the try, or the fix?"}, {"text": "Theo does not know which path is right.", "b": 0, "why": "Not knowing the way is the problem.", "hint": "Does this fix anything yet?"}, {"text": "Theo holds the compass flat and watches the needle.", "b": 1, "why": "Using the compass is his try to fix the problem.", "hint": "He is trying something."}, {"text": "Theo matches the map to the compass.", "b": 1, "why": "This is part of his try.", "hint": "Is the problem fixed yet?"}, {"text": "Theo turns right and reaches the top.", "b": 2, "why": "He picked the right path. The problem is fixed.", "hint": "Is this the end?"}, {"text": "Theo sees the whole valley and grins.", "b": 2, "why": "This is how the story ends. The problem is fixed.", "hint": "Is this the end?"}], "done": "Problem, then try, then fix. That is the plot!", "notes": {"do": "She sorts. Then lay three index cards on the table: CONFLICT → ATTEMPT → RESOLUTION, with arrows between them.", "ask": "Which card comes first in a story? Which comes last?", "listen": "Conflict first, then attempt, then resolution."}}, {"type": "learn", "kick": "Learn", "title": "Cause and effect", "text": "One thing <b>causes</b> the next. That links the plot together.", "visual": {"kind": "bigtext", "text": "conflict → attempt → resolution"}, "steps": [{"text": "<b>Cause:</b> The sign is gone. → <b>Effect:</b> Theo does not know the way."}, {"text": "<b>Cause:</b> Theo does not know the way. → <b>Effect:</b> He uses his compass and map."}, {"text": "<b>Cause:</b> The compass shows north is the rock path. → <b>Effect:</b> He turns right."}, {"text": "<b>Cause:</b> He turns right. → <b>Effect:</b> He reaches the top and sees the valley."}], "tip": "Clue words: <b>because</b> and <b>so</b>.", "notes": {"do": "Point to the three index cards from the sort as you click each step.", "say": "The cause comes first. The effect is what happens because of it.", "a
