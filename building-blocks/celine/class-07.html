<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ce&#x27;Line · Lesson 7: Pricing Day and The Grumpy Hiker</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L07", "label": "Lesson 7", "title": "Pricing Day and The Grumpy Hiker", "goal": "I can skip-count by 5s and 10s to find price totals, and I can compare two characters' points of view.", "date": "2026-12-29", "mastery": 85, "color": "#D35400", "slides": [{"type": "hello", "title": "Welcome Back, Ce'Line!", "text": "Welcome back! I hope you had a happy holiday. 🎉<br>Today Grandpa's trading post opens.<br>A grumpy hiker walks in. Is he <b>rude</b>, or is something else going on?<br>Then you help make <b>price tags</b>. 🏷️", "visual": {"kind": "emoji", "text": "👋🥾🏷️"}, "notes": {"do": "Before class: laptop open to this class lesson (code 9110). Whiteboard and 2 marker colors. 2 index cards that say THEO and MIA. 20 paper money slips cut from index cards: 10 say $5 and 10 say $10. 6 blank index cards for price tags. Her printed Packet for Lesson 7. Take her Lesson 6 Packet page 2 and look at it while she settles in.", "say": "Welcome back! I missed you. Today has two parts: a story about a grumpy hiker, then price tags for Grandpa's shelves.", "ask": "What was the best part of your break?", "listen": "Any answer. Keep it to 1–2 minutes and let her talk. Glance at her Lesson 6 packet and her Pathways Week 6 scores now; fix only what takes a minute."}}, {"type": "recall", "kick": "Warm-up", "title": "Remember Weeks 1 to 6", "text": "Five quick ones from your fall lessons.", "items": [{"type": "fill", "q": "Round <b>817</b> to the nearest <b>hundred</b>: ____", "answers": ["800"], "why": "817 is between 800 and 900. The tens digit is 1. 1 is less than 5, so round down to <b>800</b>.", "no": "Look at the tens digit. Is it 5 or more?", "hint": "The tens digit is 1. Round down.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>388 + 484 = ____</b>", "answers": ["872"], "why": "8 + 4 = 12: write 2, regroup 1 ten. 8 + 8 + 1 = 17 tens: write 7, regroup 1 hundred. 3 + 4 + 1 = 8. <b>872</b>.", "no": "Line up the places. Did you regroup two times?", "hint": "8 + 4 = 12. Write 2. Regroup the 1 ten.", "placeholder": "Type a number"}, {"type": "fill", "q": "Estimate <b>63 + 79</b>. Round each number to the nearest ten, then add: ____", "answers": ["140"], "why": "63 rounds to 60. 79 rounds to 80. 60 + 80 = <b>140</b>.", "no": "Round first: 63 is close to 60. 79 is close to 80.", "placeholder": "Type a number"}, {"type": "fill", "q": "Write <b>7 + 7 + 7 + 7 + 7</b> as multiplication: ____", "answers": ["5 × 7", "5 times 7", "7 × 5", "7 times 5"], "why": "Five 7s: <b>5 × 7 = 35</b>.", "no": "Count the 7s. That is the number of groups.", "placeholder": "Example: 2 × 5"}, {"q": "<i>The road was icy, so the bus drove slowly.</i> What is the <b>cause</b>?", "choices": ["The bus drove slowly.", "The road was icy.", "The bus was late."], "a": 1, "why": "The ice is <b>why</b> the bus went slowly. It is the <b>cause</b>.", "no": ["Driving slowly is what happened. That is the effect.", null, "The sentence does not say that."]}], "notes": {"do": "She says each answer out loud first, then types or taps. These are skills from Weeks 1–6, so they stay fresh.", "listen": "800, 872, 140, 5 × 7 (7 × 5 is fine), the road was icy. If she gets 862 or 772 for 388 + 484, she lost a regrouped ten or hundred: write it in columns on the whiteboard."}}, {"type": "talk", "kick": "Story Talk", "title": "The Grumpy Hiker", "text": "Read the story with Mr. Jonathan. Take turns, one line each.", "visual": {"kind": "passage", "text": "It was opening day at Grandpa's trading post.<br>A hiker walked in. He looked around for a minute.<br>Then he left. He did not buy anything.<br><b>Theo</b> felt hurt. He thought the hiker was being <b>rude</b>.<br><b>Mia</b> looked closer. The hiker's boots were caked in <b>mud</b>. The strap on his pack was <b>torn</b>. His water bottle was <b>empty</b>.<br>Mia <b>inferred</b> that the hiker was not rude. He was <b>exhausted</b> (very, very tired).<br>Mia told Theo what she saw. Theo's hurt feelings were real. Mia's idea was probably true too."}, "prompts": ["What did the hiker do?", "How did <b>Theo</b> feel? What did he think?", "What did <b>Mia</b> notice?"], "starters": ["The hiker …", "Theo felt … He thought …", "Mia noticed …"], "notes": {"do": "6 minutes. Take turns reading lines aloud. Put the THEO card on the left and the MIA card on the right.", "say": "Same hiker, same moment. But Theo and Mia saw it in two different ways.", "ask": "Was the hiker rude? How do you know?", "listen": "Theo thought he was rude. Mia noticed muddy boots, a torn strap and an empty water bottle, so she thought he was exhausted. Check that she knows exhausted means very, very tired. Pathways asks her to type rude and exhausted."}}, {"type": "vocab", "kick": "Word Power", "title": "Reading words", "text": "Tap each card to flip it. Read the word. Then say what it means in your own words.", "words": [{"word": "point of view", "pos": "noun", "meaning": "The way <b>one person</b> sees a moment.", "example": "From Theo's <b>point of view</b>, the hiker was rude.", "emoji": "👀"}, {"word": "perspective", "pos": "noun", "meaning": "A person's <b>own way</b> of seeing or understanding something.", "example": "Mia's <b>perspective</b> was different from Theo's.", "emoji": "🔭"}, {"word": "empathy", "pos": "noun", "meaning": "Understanding and <b>caring</b> about how someone else feels.", "example": "Mia showed <b>empathy</b> for the tired hiker.", "emoji": "💙"}, {"word": "interpret", "pos": "verb", "meaning": "To <b>explain</b> what something means to you.", "example": "Theo and Mia <b>interpreted</b> the same moment in two ways.", "emoji": "💭"}], "notes": {"do": "Flip each card. She reads the word and the meaning, then says it in her own words. Write POINT OF VIEW and EMPATHY on the whiteboard.", "ask": "Which word means caring about how someone else feels?", "listen": "Empathy. Pathways asks her to TYPE point of view, perspective, empathy and interpret, so have her spell empathy and perspective out loud."}}, {"type": "learn", "kick": "Learn", "title": "Same moment, two views", "text": "<b>Point of view</b> is the way one person sees a moment.<br>It is like a <b>camera</b>. Each person has their own camera.<br>Two people can see the same moment in two ways.", "visual": {"kind": "passage", "text": "🧑 <b>Theo:</b> “He is rude.”<br>👧 <b>Mia:</b> “He is exhausted.”<br><i>Same moment, two points of view.</i>"}, "steps": [{"text": "The moment: the hiker left and did not buy anything."}, {"text": "Theo's view: he felt <b>hurt</b>. He thought the hiker was <b>rude</b>."}, {"text": "Mia's view: she saw clues. She thought the hiker was <b>exhausted</b>."}, {"text": "What a person <b>notices</b> and <b>feels</b> shapes their point of view."}], "tip": "A different point of view is not automatically <b>wrong</b>. It is just a different angle.", "notes": {"do": "Reveal one step at a time. Hold up the THEO card, then the MIA card.", "say": "Point of view is like a camera angle. Theo's camera saw a man leave. Mia's camera zoomed in on his boots, his pack and his bottle.", "ask": "What moment did Theo and Mia see in two different ways?", "listen": "The hiker left without buying anything. Pathways asks about this moment as a typed question, so have her say the whole thing."}}, {"type": "learn", "kick": "Learn", "title": "Clues help you infer", "text": "The story never says the hiker was tired.<br>Mia used <b>clues</b>. She <b>inferred</b> it.<br>To <b>infer</b> is to figure something out from clues.", "visual": {"kind": "passage", "text": "🥾 muddy boots + 🎒 torn strap + 🧴 empty bottle<br>➡️ The hiker is <b>exhausted</b>, not rude."}, "steps": [{"text": "Clue 1: his boots were caked in <b>mud</b>. He walked a long way."}, {"text": "Clue 2: the strap on his pack was <b>torn</b>. It was a rough hike."}, {"text": "Clue 3: his water bottle was <b>empty</b>. He was thirsty."}, {"text": "Clues + what you know = an <b>inference</b>. It is not a wild guess."}], "tip": "Ask: <b>What clue makes me think that?</b>", "notes": {"do": "Reveal one clue at a time. She points to each clue in the story on the previous slide if she needs it.", "say": "You learned the word infer in Lesson 1. Mia did not guess. She used real clues.", "ask": "Which clue do you think is the strongest? Why?", "listen": "Any clue with a reason (the empty bottle means he ran out of water on the trail). If she says 'he was sad', ask: which clue tells you that?"}}, {"type": "sort", "kick": "Sort it", "title": "Theo's view or Mia's view?", "text": "Who would say this? Tap a card. Then tap a box.", "buckets": ["🧑 Theo<br><small>felt hurt</small>", "👧 Mia<br><small>saw the clues</small>"], "items": [{"text": "“That hiker was rude!”", "b": 0, "why": "Theo thought the hiker was <b>rude</b>.", "hint": "Who felt hurt when the hiker left?"}, {"text": "“His boots are caked in mud.”", "b": 1, "why": "Mia noticed the <b>muddy boots</b>.", "hint": "Who looked closer at the hiker?"}, {"text": "“My feelings are hurt.”", "b": 0, "why": "Theo felt <b>hurt</b> when the hiker left.", "hint": "Who felt hurt?"}, {"text": "“The strap on his pack is torn.”", "b": 1, "why": "Mia saw the <b>torn strap</b>.", "hint": "Who noticed small details?"}, {"text": "“He is not rude. He is exhausted.”", "b": 1, "why": "Mia <b>inferred</b> the hiker was exhausted.", "hint": "Who used the clues?"}, {"text": "“His water bottle is empty.”", "b": 1, "why": "Mia noticed the <b>empty water bottle</b>.", "hint": "Who looked closer?"}], "done": "Theo saw a man leave. Mia saw the clues. Same moment, <b>two points of view</b>.", "notes": {"do": "She reads each card aloud in the voice of the person who would say it.", "ask": "Why did Theo not notice the boots?", "listen": "He was busy feeling hurt (any reasonable answer). Then say: our feelings can change what we notice."}}, {"type": "learn", "kick": "Learn", "title": "Both views are real", "text": "Mia told Theo about the clues.<br>Theo's hurt feelings were <b>real</b>.<br>Mia's idea was <b>probably true</b> too.<br>Put both views together. You get a <b>fuller</b> understanding.", "visual": {"kind": "bigtext", "text": "🧑 + 👧 = 🖼️", "sub": "Theo's view + Mia's view = the whole picture"}, "steps": [{"text": "Ask: What does <b>each</b> person notice?"}, {"text": "Ask: How does <b>each</b> person feel?"}, {"text": "You do not have to pick a winner. Both can be true."}, {"text": "Caring about how someone else feels is <b>empathy</b>."}], "tip": "<b>Fuller</b> means more complete. You see more of the picture.", "notes": {"do": "Put the THEO and MIA cards side by side, touching.", "say": "Theo was not wrong to feel hurt. Mia was not wrong either. Together they see the whole picture.", "ask": "How did Mia show empathy for the hiker?", "listen": "She thought about how tired and thirsty he was instead of being upset. Pathways asks her to type fuller and empathy."}}, {"type": "tap", "kick": "Your turn", "title": "A rainy Saturday", "text": "Read this new story. Then answer.", "visual": {"kind": "passage", "text": "Rain fell all day Saturday. Kiko's soccer game was called off. She sat by the window and sighed.<br>Her grandpa grinned at the rain. “My tomato plants were so dry!” he said."}, "items": [{"type": "fill", "q": "How did <b>Kiko</b> feel about the rain? Type one word.", "answers": ["sad", "upset", "disappointed", "unhappy", "mad", "grumpy", "bummed", "angry", "bored", "frustrated", "down", "blue", "bad", "gloomy"], "why": "Her game was called off and she <b>sighed</b>. She felt sad or disappointed.", "no": "Look at the clues: no game, and she sighed.", "placeholder": "Type a feeling"}, {"q": "Why was <b>Grandpa</b> happy about the rain?", "choices": ["His game was called off.", "He wanted to stay inside all day.", "His plants needed water."], "a": 2, "why": "His tomato plants were <b>dry</b>. Rain gives them water.", "no": ["Kiko's game was called off, not Grandpa's.", "The story does not say that.", null]}, {"type": "fill", "q": "Can both points of view be true at the same time? Type <b>yes</b> or <b>no</b>.", "answers": ["yes"], "why": "<b>Yes.</b> Kiko is sad, and Grandpa is glad. Both feelings are real.", "no": "Kiko's feeling is real. Is Grandpa's feeling real too?", "placeholder": "yes or no"}], "notes": {"do": "She reads it aloud. On the whiteboard, draw two faces: KIKO and GRANDPA. She writes one feeling and one clue under each.", "ask": "Same rain. Why do they feel so differently?", "listen": "Sad (or disappointed), his plants needed water, yes. Kiko cared about soccer, Grandpa cared about his plants."}}, {"type": "tap", "kick": "Exit ticket", "title": "Reading check", "text": "On your own. No looking back!", "items": [{"type": "fill", "q": "Theo's point of view: the hiker was being ____.", "answers": ["rude", "mean", "grumpy", "impolite"], "why": "Theo thought the hiker was being <b>rude</b>.", "no": "Theo felt hurt. He thought the hiker was being r…", "placeholder": "Type a word"}, {"q": "Which clue did <b>Mia</b> notice?", "choices": ["a big smile on his face", "a torn strap on his pack", "a new map in his hand", "a shiny new hat on his head"], "a": 1, "why": "Mia saw the <b>torn strap</b>, the muddy boots and the empty water bottle.", "no": ["The story does not say he smiled.", null, "The story does not say he had a map.", "The story does not say he had a hat."]}, {"type": "fill", "q": "Mia's point of view: the hiker was not rude. He was ____.", "answers": ["exhausted", "tired", "very tired", "worn out", "exausted", "exhusted"], "why": "Mia inferred the hiker was <b>exhausted</b>, not rude.", "no": "Think of the empty bottle and the muddy boots. He was very, very tired.", "placeholder": "Type a word"}, {"type": "fill", "q": "Understanding and caring about how someone else feels is called ____.", "answers": ["empathy"], "why": "That is <b>empathy</b>.", "no": "It starts with <b>em</b>.", "placeholder": "Type a word"}], "notes": {"do": "On her own. Note her first answers.", "listen": "Rude, a torn strap, exhausted (tired is OK here, but Pathways wants exhausted), empathy. Watch the spelling of exhausted and empathy."}}, {"type": "vocab", "kick": "Word Power", "title": "Math words", "text": "Tap each card to flip it. Read the word. Then spell <b>price</b> and <b>factor</b> out loud.", "words": [{"word": "skip-count", "pos": "verb", "meaning": "To count by a number that is <b>not 1</b>.", "example": "<b>Skip-count</b> by 10s: 10, 20, 30, 40.", "emoji": "🦘"}, {"word": "multiple", "pos": "noun", "meaning": "A number you <b>land on</b> when you skip-count.", "example": "25 is a <b>multiple</b> of 5.", "emoji": "📍"}, {"word": "factor", "pos": "noun", "meaning": "A number that you <b>multiply</b>.", "example": "In 2 × 10 = 20, the <b>factors</b> are 2 and 10.", "emoji": "🔢"}, {"word": "price", "pos": "noun", "meaning": "How much <b>one</b> thing costs.", "example": "The <b>price</b> of one comb is $5.", "emoji": "🏷️"}, {"word": "quantity", "pos": "noun", "meaning": "<b>How many</b> things there are.", "example": "Gus buys 3 caps. The <b>quantity</b> is 3.", "emoji": "🧮"}], "notes": {"do": "Flip each card. She reads it. Then she spells price and factor out loud while you write them on the whiteboard. Pathways asks her to TYPE price, multiple, factor and total.", "ask": "In 4 × 10 = 40, which numbers are the factors?", "listen": "4 and 10. If she says 40, say: 40 is the product, the answer. Factors are the numbers we multiply."}}, {"type": "learn", "kick": "Learn", "title": "Skip-count by 5s and 10s", "text": "When you <b>skip-count</b>, you jump by the same number each time.<br>Every number you land on is a <b>multiple</b>.", "visual": {"kind": "numberline", "start": 0, "jump": 5, "jumps": 9}, "steps": [{"text": "Count by 5s: 5, 10, 15, 20, 25, 30, 35, 40, <b>45</b>."}, {"text": "That is <b>9 jumps</b> of 5. So <b>9 × 5 = 45</b>."}, {"text": "Count by 10s: 10, 20, 30, 40, 50, <b>60</b>. That is 6 jumps, so <b>6 × 10 = 60</b>."}, {"text": "Multiples of 5 end in <b>0 or 5</b>. Multiples of 10 end in <b>0</b>."}], "tip": "The number of jumps tells you the <b>factor</b>. Where you land is the answer.", "notes": {"do": "Hands-on first: she lays down nine $5 slips one at a time and says the total each time: 5, 10, 15 … 45. Then six $10 slips: 10, 20 … 60.", "say": "Skip-counting and times facts are the same skill. The 9th jump by 5 lands on 45, and 9 × 5 = 45.", "ask": "Is 72 a multiple of 5? How do you know?", "listen": "No, it ends in 2. Multiples of 5 end in 0 or 5."}}, {"type": "tap", "kick": "Your turn", "title": "Skip-count", "text": "Use your money slips if it helps.", "items": [{"type": "fill", "q": "Skip-count by 5s: 55, 60, 65, ____", "answers": ["70"], "why": "65 + 5 = <b>70</b>.", "no": "Add 5 to the last number.", "placeholder": "Type a number"}, {"q": "Which number is a <b>multiple of 10</b>?", "choices": ["35", "54", "90", "101"], "a": 2, "why": "Multiples of 10 end in <b>0</b>. 90 is 9 jumps of 10.", "no": ["35 ends in 5. It is a multiple of 5, not 10.", "54 does not end in 0.", null, "101 ends in 1, not 0."]}, {"type": "fill", "q": "How many jumps of 10 does it take to get to <b>70</b>?", "answers": ["7", "seven"], "why": "10, 20, 30, 40, 50, 60, 70. That is <b>7</b> jumps. 7 × 10 = 70.", "no": "Count by 10s and hold up a finger for each jump.", "placeholder": "Type a number"}, {"type": "fill", "q": "Skip-count by 10s: 50, 60, 70, 80, ____", "answers": ["90"], "why": "80 + 10 = <b>90</b>.", "no": "Add 10 to the last number.", "placeholder": "Type a number"}], "notes": {"do": "She says each skip-count out loud and touches a slip for each jump.", "listen": "70, 90, 7, 90. If she says 75 for 55, 60, 65 …, she added 10: point to the jumps of 5."}}, {"type": "learn", "kick": "Learn", "title": "Price × quantity = total", "text": "Grandpa sells bags of <b>nuts</b> for <b>$5</b> each.<br>A hiker buys <b>8</b> bags. How much is that?", "visual": {"kind": "bigtext", "text": "$5 × 8 = $40", "sub": "price × quantity = total"}, "steps": [{"text": "Find the <b>price</b> of one: $5."}, {"text": "Find the <b>quantity</b>, how many: 8 bags."}, {"text": "Multiply: <b>5 × 8 = 40</b>."}, {"text": "Check by skip-counting 8 jumps: 5, 10, 15, 20, 25, 30, 35, <b>40</b>. The total is <b>$40</b>."}], "tip": "Clue words <b>each</b>, <b>per</b> and <b>every</b> often mean multiply.", "notes": {"do": "She writes a price tag on an index card: NUTS $5 EACH. Then she counts out eight $5 slips and skip-counts them.", "say": "The full amount is the total. You learned total in Lesson 4. Price times quantity equals the total.", "ask": "What would 8 bags cost if the price were $10 each?", "listen": "$80. If she says $18, she added: ask, are there 8 equal groups of $10?"}}, {"type": "sort", "kick": "Sort it", "title": "Multiply, or add or subtract?", "text": "Read each problem. Do you <b>multiply</b>? Or do you <b>add or subtract</b>? Tap a card. Then tap a box.", "buckets": ["✖️ Multiply<br><small>same price, many items</small>", "➕➖ Add or subtract<br><small>not equal groups</small>"], "items": [{"text": "Bird feeders cost $5 each. Ines buys 6. How much?", "b": 0, "why": "Same price for each one: <b>multiply</b>. 6 × 5 = 30.", "hint": "Look for <b>each</b>."}, {"text": "Otis had $40. He spent $10. How much is left?", "b": 1, "why": "<b>Left</b> means take away: 40 − 10 = 30.", "hint": "Is it equal groups, or is money taken away?"}, {"text": "Pens cost $10 per box. Mom buys 3 boxes. How much?", "b": 0, "why": "<b>Per</b> box, 3 boxes: <b>multiply</b>. 3 × 10 = 30.", "hint": "Look for <b>per</b>."}, {"text": "A hat costs $10. A scarf costs $5. How much for both?", "b": 1, "why": "Two different prices: <b>add</b>. 10 + 5 = 15.", "hint": "Are the prices the same?"}, {"text": "Every bag of rice costs $5. Pearl buys 7 bags. How much?", "b": 0, "why": "<b>Every</b> bag costs the same: <b>multiply</b>. 7 × 5 = 35.", "hint": "Look for <b>every</b>."}, {"text": "Quinn has $25. Esther has $30. How much more does Esther have?", "b": 1, "why": "<b>How much more</b> means compare. Subtract: 30 − 25 = 5.", "hint": "Is anything repeated in equal groups?"}], "done": "Same price, many items: <b>multiply</b>. Different prices or money taken away: <b>add or subtract</b>.", "notes": {"do": "She reads each problem aloud and circles the clue word on the whiteboard before she taps.", "ask": "In the hat and scarf problem, why can't you multiply?", "listen": "The prices are not the same, so there are no equal groups. If she multiplies 10 × 5, ask: is it 5 hats at $10?"}}, {"type": "tap", "kick": "Your turn", "title": "Price tags", "text": "Find the price. Find the quantity. Then multiply.", "items": [{"type": "fill", "q": "Wool socks cost <b>$5</b> a pair. A hiker buys <b>6</b> pairs. What is the total?", "answers": ["30", "30 dollars"], "why": "5, 10, 15, 20, 25, 30. <b>6 × 5 = 30</b>. The total is <b>$30</b>.", "no": "Skip-count by 5s, 6 jumps.", "placeholder": "Type a number"}, {"type": "fill", "q": "Flashlights cost <b>$10</b> each. A camp buys <b>7</b>. What is the total?", "answers": ["70", "70 dollars"], "why": "10, 20, 30, 40, 50, 60, 70. <b>7 × 10 = 70</b>. The total is <b>$70</b>.", "no": "Skip-count by 10s, 7 jumps.", "placeholder": "Type a number"}, {"q": "Lamps cost <b>$10</b> each. Mabel buys <b>3</b>. Which number sentence finds the total?", "choices": ["10 + 3", "10 × 3", "10 − 3"], "a": 1, "why": "Same price for each lamp, 3 lamps: <b>10 × 3 = 30</b>. The total is <b>$30</b>.", "no": ["That adds the price and the quantity. 3 lamps at $10 each are 3 equal groups.", null, "Nothing is taken away."]}, {"type": "fill", "q": "In <b>$10 × 4 = $40</b>, the $40 is the full amount. It is called the ____.", "answers": ["total", "product"], "why": "The full amount is the <b>total</b>.", "no": "It is the full amount. It starts with <b>t</b>.", "placeholder": "Type a word"}], "notes": {"do": "For each one she writes the price tag on an index card, then counts out the money slips.", "listen": "$30, $70, 10 × 3, total. If she adds (5 + 6 = 11), say: 6 pairs, and each pair costs $5. Lay down a $5 slip for each pair."}}, {"type": "tap", "kick": "Exit ticket", "title": "Math check", "text": "On your own. Skip-count on paper if you need to.", "items": [{"type": "fill", "q": "Skip-count by 5s: 75, 80, 85, ____", "answers": ["90"], "why": "85 + 5 = <b>90</b>.", "no": "Add 5 to the last number.", "placeholder": "Type a number"}, {"type": "fill", "q": "Bug spray costs <b>$5</b> a can. Grandpa buys <b>9</b> cans. What is the total?", "answers": ["45", "45 dollars"], "why": "<b>9 × 5 = 45</b>. The total is <b>$45</b>.", "no": "Skip-count by 5s, 9 jumps.", "placeholder": "Type a number"}, {"q": "Which number is a <b>multiple of 5</b>?", "choices": ["47", "53", "58", "65"], "a": 3, "why": "Multiples of 5 end in <b>0 or 5</b>. 65 ends in 5.", "no": ["47 ends in 7.", "53 ends in 3.", "58 ends in 8.", null]}, {"q": "In <b>8 × 5 = 40</b>, which numbers are the <b>factors</b>?", "choices": ["8 and 40", "5 and 40", "8 and 5"], "a": 2, "why": "Factors are the numbers you <b>multiply</b>: 8 and 5. The 40 is the product.", "no": ["40 is the answer, the product. It is not a factor.", "40 is the answer, the product. It is not a factor.", null]}], "notes": {"do": "On her own. Note her first answers.", "listen": "90, $45, 65, 8 and 5. If she picks 47 or 53, remind her: multiples of 5 end in 0 or 5. If she picks 40 as a factor, say: 40 is the answer, the product."}}, {"type": "learn", "kick": "Wrap-up", "title": "Two big skills", "text": "<b>Reading:</b> two people can see one moment in two ways. Look for <b>clues</b>.<br><b>Math:</b> skip-count by 5s and 10s. <b>Price × quantity = total</b>.", "visual": {"kind": "emoji", "text": "👀💭  🏷️✖️"}, "tip": "Friday is New Year's Day. No work that day! Read your list with Mr. Jonathan.", "notes": {"do": "Open the course page. Read the task list with her, one line at a time. Hand her the printed packet.", "say": "Great start to the new year. Your next lesson is next Tuesday.", "ask": "Tell me one time you and someone else saw the same thing in two different ways.", "listen": "Any real example, with how each person felt."}}], "win": "You saw the hiker through Theo's eyes and Mia's eyes, and you priced Grandpa's shelves. Happy New Year!", "prev": "bb-celine-L06", "prevTitle": "Lesson 6"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=docum
