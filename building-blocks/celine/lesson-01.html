<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce&#x27;Line · Lesson 1: Numbers and Stories</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L01", "label": "Lesson 1", "title": "Numbers and Stories", "goal": "I can tell what each digit is worth, round numbers, and find the character and setting in a story.", "date": "2026-10-27", "mastery": 85, "color": "#2E86DE", "slides": [{"type": "hello", "title": "On Your Own: Numbers and Stories", "text": "You learned this in class with Mr. Jonathan. Now you try it on your own. Keep a pencil and paper close. 🧱", "visual": {"kind": "emoji", "text": "🔢📖✏️"}}, {"type": "talk", "kick": "Story Corner", "title": "Think about Theo", "text": "Read each question. Tell a grown-up your answer, or say it out loud.", "visual": {"kind": "passage", "text": "<b>Theo's First Hike (part 1, short)</b><br>Theo laced up his brand-new hiking boots. He checked his backpack twice. He clipped his father's old compass to his belt loop. Theo had never been on a real trail before. His hands were a little shaky. But he could not stop smiling. Today was different. Today was real."}, "prompts": ["Who is the <b>main character</b>?", "What is one thing Theo <b>does</b>?", "How does Theo <b>feel</b>? What clue tells you?"], "starters": ["The main character is …", "Theo …", "Theo feels … because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Your words", "text": "Say the meaning out loud first. Then flip the card to check.", "words": [{"word": "digit", "pos": "noun", "meaning": "One number symbol: 0, 1, 2, 3, 4, 5, 6, 7, 8 or 9.", "example": "547 has three <b>digits</b>: 5, 4 and 7.", "emoji": "🔢"}, {"word": "place value", "pos": "noun", "meaning": "What a digit is <b>worth</b> because of the place where it sits.", "example": "In 547, the 5 is in the hundreds place. Its <b>place value</b> is 500.", "emoji": "🏠"}, {"word": "standard form", "pos": "noun", "meaning": "A number written the usual way.", "example": "547 is in <b>standard form</b>.", "emoji": "✏️"}, {"word": "expanded form", "pos": "noun", "meaning": "A number split into what each digit is worth, with plus signs.", "example": "500 + 40 + 7 is the <b>expanded form</b> of 547.", "emoji": "🧩"}, {"word": "round", "pos": "verb", "meaning": "To change a number to the nearest ten or hundred. It makes the number easier to use.", "example": "47 <b>rounds</b> up to 50.", "emoji": "🎯"}, {"word": "character", "pos": "noun", "meaning": "A person or animal in a story. The <b>main character</b> is who the story is mostly about.", "example": "Theo is the main <b>character</b> in Theo's First Hike.", "emoji": "🧒"}, {"word": "setting", "pos": "noun", "meaning": "<b>Where</b> and <b>when</b> a story happens.", "example": "The <b>setting</b> is a forest trail in the early morning.", "emoji": "🏞️"}, {"word": "trait", "pos": "noun", "meaning": "A word that tells what a character is like inside.", "example": "Kind, brave and curious are <b>traits</b>.", "emoji": "⭐"}, {"word": "narrator", "pos": "noun", "meaning": "The voice that tells the story.", "example": "The <b>narrator</b> tells us that Theo's hands were shaky.", "emoji": "🗣️"}, {"word": "infer", "pos": "verb", "meaning": "To use clues to figure out something the story does not say.", "example": "The story never says \"brave.\" I <b>infer</b> it from what Theo does.", "emoji": "🔍"}]}, {"type": "learn", "kick": "Remember", "title": "Place value and rounding", "text": "<b>538</b> = 500 + 30 + 8.", "visual": {"kind": "placevalue", "n": 538}, "steps": [{"text": "Nearest <b>ten</b>: look at the <b>ones</b> digit. 538 → <b>540</b>."}, {"text": "Nearest <b>hundred</b>: look at the <b>tens</b> digit. 538 → <b>500</b>."}], "tip": "5 or more, go up. 4 or less, stay down."}, {"type": "tap", "kick": "Try it", "title": "Place value", "text": "Say the place. Then type the answer.", "items": [{"type": "fill", "q": "In <b>172</b>, what is the <b>value</b> of the <b>7</b>?", "answers": ["70", "seventy", "7 tens"], "why": "The 7 is in the <b>tens</b> place. It is worth <b>70</b>.", "no": "Find the 7. Which place is it in? Ones, tens or hundreds?", "hint": "7 tens = 70.", "placeholder": "Type a number"}, {"type": "fill", "q": "In <b>905</b>, which <b>digit</b> is in the <b>tens</b> place?", "answers": ["0", "zero"], "why": "905: 9 hundreds, 0 tens, 5 ones. The tens digit is <b>0</b>.", "no": "Say the places from the left: hundreds, tens, ones.", "hint": "Type just one digit.", "placeholder": "Type one digit"}, {"q": "Which number has a <b>3</b> that is worth <b>30</b>?", "choices": ["831", "357", "503"], "a": 0, "why": "In 831, the 3 is in the <b>tens</b> place. It is worth <b>30</b>.", "no": [null, "In 357, the 3 is in the hundreds place. It is worth 300.", "In 503, the 3 is in the ones place. It is worth 3."]}]}, {"type": "tap", "kick": "Try it", "title": "Expanded form", "text": "Write what each digit is worth.", "items": [{"type": "fill", "q": "Write <b>694</b> in expanded form: 600 + 90 + ____", "answers": ["4", "four"], "why": "694 = 600 + 90 + 4. The missing part is <b>4</b>.", "no": "Write what each digit is <b>worth</b>, not just the digit.", "hint": "Which place is missing? What is that digit worth?", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>700 + 0 + 1 = ____</b><br>Write it in standard form.", "answers": ["701", "seven hundred one", "seven hundred and one"], "why": "7 hundreds, 0 tens, 1 one = <b>701</b>.", "no": "Put one digit in each place: hundreds, tens, ones.", "hint": "A 0 tens still needs a 0 in the tens place.", "placeholder": "Type a number"}, {"q": "Which is the <b>expanded form</b> of <b>460</b>?", "choices": ["4 + 6 + 0", "400 + 6 + 0", "400 + 60 + 0", "400 + 600 + 0"], "a": 2, "why": "460 = <b>400 + 60 + 0</b>.", "no": ["That only lists the digits. Write what each digit is <b>worth</b>.", "That makes 406, not 460. Check what the middle digit is worth.", null, "That makes 1,000, not 460. The 6 is in the <b>tens</b> place, so it is worth 60."]}]}, {"type": "tap", "kick": "Try it", "title": "Round it", "text": "Ten: look at the ones. Hundred: look at the tens.", "items": [{"type": "fill", "q": "Round <b>53</b> to the nearest <b>ten</b>.<br>53 → ____", "answers": ["50", "fifty"], "why": "53 is between 50 and 60. The ones digit is 3. 4 or less, so stay <b>down</b>: <b>50</b>.", "no": "Look at the <b>ones</b> digit. 5 or more goes up. 4 or less stays.", "hint": "It is between 50 and 60. Which one is it closer to?", "placeholder": "Type a number"}, {"type": "fill", "q": "Round <b>146</b> to the nearest <b>ten</b>.<br>146 → ____", "answers": ["150", "one hundred fifty", "one hundred and fifty"], "why": "146 is between 140 and 150. The ones digit is 6. 5 or more, so round <b>up</b>: <b>150</b>.", "no": "Look at the <b>ones</b> digit. 5 or more goes up. 4 or less stays.", "hint": "It is between 140 and 150. Which one is it closer to?", "placeholder": "Type a number"}, {"type": "fill", "q": "Round <b>729</b> to the nearest <b>hundred</b>.<br>729 → ____", "answers": ["700", "seven hundred"], "why": "729 is between 700 and 800. The tens digit is 2. 4 or less, so stay <b>down</b>: <b>700</b>.", "no": "For hundreds, look at the <b>tens</b> digit.", "hint": "It is between 700 and 800. Look at the tens digit.", "placeholder": "Type a number"}, {"q": "A park trail is <b>285</b> feet long. About how long is it, rounded to the nearest hundred?", "choices": ["300", "200", "290"], "a": 0, "why": "285 is between 200 and 300. The tens digit is 8, so it rounds to <b>300</b>.", "no": [null, "The tens digit is 8. That is 5 or more, so round <b>up</b>.", "290 is 285 rounded to the nearest <b>ten</b>. This one asks for the nearest <b>hundred</b>."]}]}, {"type": "learn", "kick": "Remember", "title": "Story words", "text": "<b>Character</b> = who the story is about.<br><b>Setting</b> = where and when it happens.", "steps": [{"text": "A <b>trait</b> tells what a character is like: kind, brave, careful."}, {"text": "To <b>infer</b>, use clues: what the character <b>does</b>, <b>says</b> and <b>feels</b>."}], "tip": "Look back at the story. The clues are always in the words."}, {"type": "tap", "kick": "Try it", "title": "Owen's Snow Day", "text": "Read the story. Then answer.", "visual": {"kind": "passage", "text": "<b>Owen's Snow Day</b><br>Snow covered the farm. It was early morning, and the barn roof was white. Owen pulled on his red boots. He grabbed a shovel and cleared a path to the goat pen. He did not stop until the path was done."}, "items": [{"type": "fill", "q": "Who is the <b>main character</b>? Type his name.", "answers": ["Owen"], "why": "The story is about <b>Owen</b>.", "no": "Who does the most in the story?", "placeholder": "Type a name"}, {"q": "Which is the <b>setting</b>?", "choices": ["Owen's red boots", "a farm on a snowy morning", "the shovel Owen used to clear a path"], "a": 1, "why": "Setting = where and when: a <b>farm</b> on a <b>snowy morning</b>.", "no": ["Boots are something Owen wears. They are not where or when.", null, "A shovel is something Owen uses. It is not where or when."]}, {"q": "Which <b>trait</b> fits Owen best?", "choices": ["lazy", "scared of the snow", "hardworking"], "a": 2, "why": "He shovels a whole path and does not stop until it is done. He is <b>hardworking</b>.", "no": ["Lazy people stop early. Owen does not stop until the path is done.", "Nothing in the story shows he is scared. He goes right out into the snow.", null]}, {"type": "fill", "q": "The story says <b>the barn roof was white</b>. Is that a clue about the character or the setting? Type <b>character</b> or <b>setting</b>.", "answers": ["setting", "settings", "setting clue"], "why": "The white barn roof tells about the <b>place</b>. It is a <b>setting</b> clue.", "no": "Character = <b>who</b>. Setting = <b>where</b> and <b>when</b>.", "hint": "Is it a person or animal? Or is it a place or a time?", "placeholder": "Type a word"}]}, {"type": "sort", "kick": "Sort it", "title": "Ava's Bus Ride", "text": "Character clue or setting clue? Tap a card. Then tap the right box.", "buckets": ["🧒 Character clue", "🏞️ Setting clue"], "items": [{"text": "Ava waves to the bus driver.", "b": 0, "why": "That is something Ava <b>does</b>.", "hint": "Who is doing something?"}, {"text": "a crowded city bus", "b": 1, "why": "That is <b>where</b> Ava is.", "hint": "Is it a place?"}, {"text": "Ava gives her seat to an older man.", "b": 0, "why": "That shows what Ava is <b>like</b>: kind.", "hint": "Is it an action?"}, {"text": "a cold, windy afternoon", "b": 1, "why": "That tells <b>when</b> and the weather.", "hint": "Is it a time?"}, {"text": "Ava feels sleepy.", "b": 0, "why": "That is how Ava <b>feels</b>.", "hint": "Is it a feeling?"}, {"text": "tall buildings out the window", "b": 1, "why": "That is part of the <b>place</b>.", "hint": "Can you see it around Ava?"}], "done": "Character = who. Setting = where and when. You sorted them all!"}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "In <b>284</b>, what is the <b>value</b> of the <b>8</b>?", "answers": ["80", "eighty", "8 tens"], "why": "The 8 is in the <b>tens</b> place. It is worth <b>80</b>.", "no": "Find the 8. Which place is it in? Ones, tens or hundreds?", "hint": "8 tens = 80.", "placeholder": "Type a number"}, {"type": "fill", "q": "Write <b>407</b> in expanded form: 400 + ____ + 7", "answers": ["0", "zero"], "why": "407 = 400 + 0 + 7. The missing part is <b>0</b>. There are <b>0 tens</b>, so we write a 0.", "no": "Look at the <b>tens</b> place. What digit is there?", "hint": "Look at the digit in that place. A 0 is worth 0.", "placeholder": "Type a number"}, {"type": "fill", "q": "Round <b>173</b> to the nearest <b>ten</b>.<br>173 → ____", "answers": ["170", "one hundred seventy", "one hundred and seventy"], "why": "173 is between 170 and 180. The ones digit is 3. 4 or less, so stay <b>down</b>: <b>170</b>.", "no": "Look at the <b>ones</b> digit. 5 or more goes up. 4 or less stays.", "hint": "It is between 170 and 180. Which one is it closer to?", "placeholder": "Type a number"}, {"q": "A school has <b>651</b> students. About how many is that, rounded to the nearest hundred?", "choices": ["600", "650", "700"], "a": 2, "why": "651 is between 600 and 700. The tens digit is 5, so it rounds to <b>700</b>.", "no": ["The tens digit is 5. That is 5 or more, so round <b>up</b>.", "650 is 651 rounded to the nearest <b>ten</b>. This one asks for the nearest <b>hundred</b>.", null]}, {"type": "fill", "q": "A story has a girl named <b>Rosa</b> and her dog <b>Pip</b>. Rosa and Pip are both ____ in the story.", "answers": ["characters", "character"], "why": "People and animals in a story are <b>characters</b>.", "no": "Which story word means who is in the story?", "hint": "It starts with ch.", "placeholder": "Type a story word"}, {"q": "Read <i>The Rainy Campout</i>. Which is the <b>setting</b>?", "choices": ["Jamal's flashlight", "a wet campground in the morning", "Jamal unzipping the door of his tent"], "a": 1, "why": "Where and when: a <b>wet campground</b> in the <b>morning</b>.", "no": ["A flashlight is something Jamal carries. It is not where or when.", null, "That is something Jamal does. It is a character clue."], "visual": {"kind": "passage", "text": "<b>The Rainy Campout</b><br>Rain tapped on the tent all night. In the morning, Jamal unzipped the door. The campground was wet and quiet. Jamal grabbed his flashlight. He went to look for frogs by the pond."}}, {"q": "Read the story again. Which <b>trait</b> fits Jamal best?", "choices": ["curious", "grumpy", "careless"], "a": 0, "why": "He gets up and goes to look for frogs. He wants to find out things. He is <b>curious</b>.", "no": [null, "Nothing in the story shows he is grumpy. He gets up and goes exploring.", "Nothing in the story shows he is careless. He just goes to look for frogs."], "visual": {"kind": "passage", "text": "<b>The Rainy Campout</b><br>Rain tapped on the tent all night. In the morning, Jamal unzipped the door. The campground was wet and quiet. Jamal grabbed his flashlight. He went to look for frogs by the pond."}}, {"type": "fill", "q": "In The Rainy Campout, is <b>by the pond</b> a clue about the character or the setting? Type <b>character</b> or <b>setting</b>.", "answers": ["setting", "settings", "setting clue"], "why": "By the pond tells <b>where</b>. It is a <b>setting</b> clue.", "no": "Character = <b>who</b>. Setting = <b>where</b> and <b>when</b>.", "hint": "Is it a person or animal? Or is it a place or a time?", "placeholder": "Type a word"}], [{"type": "fill", "q": "In <b>719</b>, what is the <b>value</b> of the <b>7</b>?", "answers": ["700", "seven hundred", "7 hundreds"], "why": "The 7 is in the <b>hundreds</b> place. It is worth <b>700</b>.", "no": "Find the 7. Which place is it in? Ones, tens or hundreds?", "hint": "7 hundreds = 700.", "placeholder": "Type a number"}, {"type": "fill", "q": "Write <b>806</b> in expanded form: 800 + ____ + 6", "answers": ["0", "zero"], "why": "806 = 800 + 0 + 6. The missing part is <b>0</b>. There are <b>0 tens</b>, so we write a 0.", "no": "Look at the <b>tens</b> place. What digit is there?", "hint": "Look at the digit in that place. A 0 is worth 0.", "placeholder": "Type a number"}, {"type": "fill", "q": "Round <b>238</b> to the nearest <b>ten</b>.<br>238 → ____", "answers": ["240", "two hundred forty", "two hundred and forty"], "why": "238 is between 230 and 240. The ones digit is 8. 5 or more, so round <b>up</b>: <b>240</b>.", "no": "Look at the <b>ones</b> digit. 5 or more goes up. 4 or less stays.", "hint": "It is between 230 and 240. Which one is it closer to?", "placeholder": "Type a number"}, {"q": "A farm has <b>349</b> chickens. About how many is that, rounded to the nearest hundred?", "choices": ["400", "300", "350"], "a": 1, "why": "349 is between 300 and 400. The tens digit is 4, so it rounds to <b>300</b>.", "no": ["The tens digit is 4. That is 4 or less, so stay <b>down</b>.", null, "350 is 349 rounded to the nearest <b>ten</b>. This one asks for the nearest <b>hundred</b>."]}, {"type": "fill", "q": "<i>Funny</i>, <i>honest</i> and <i>careful</i> all tell what a character is like inside. Each word is a character ____.", "answers": ["trait", "traits"], "why": "A word for what a character is like is a <b>trait</b>.", "no": "Which story word means what a character is like?", "hint": "It starts with t.", "placeholder": "Type a story word"}, {"q": "Read <i>Soup Night</i>. Which is the <b>setting</b>?", "choices": ["Zoe standing on a stool, stirring the soup", "a sunny beach in summer", "Grandma's kitchen on a winter night"], "a": 2, "why": "Where and when: <b>Grandma's kitchen</b> on a <b>cold winter night</b>.", "no": ["That is what Zoe does. It is a character clue.", "The story does not happen at a beach. Look at the first two sentences.", null], "visual": {"kind": "passage", "text": "<b>Soup Night</b><br>It was a cold winter night. Grandma's kitchen smelled like warm bread. Zoe stood on a stool by the stove. She stirred the soup slowly so it would not spill. She checked the pot again and again."}}, {"q": "Read the story again. Which <b>trait</b> fits Zoe best?", "choices": ["careful", "forgetful", "angry"], "a": 0, "why": "She stirs slowly so it will not spill, and she checks again and again. She is <b>careful</b>.", "no": [null, "Nothing shows she forgets. She checks the pot again and again.", "Nothing in the story shows she is angry."], "visual": {"kind": "passage", "text": "<b>Soup Night</b><br>It was a cold winter night. Grandma's kitchen smelled like warm bread. Zoe stood on a stool by the stove. She stirred the soup slowly so it would not spill. She checked the pot again and again."}}, {"type": "fill", "q": "In Soup Night, <b>Zoe stirred the soup slowly</b>. Is that a clue about the character or the setting? Type <b>character</b> or <b>setting</b>.", "answers": ["character", "characters", "character clue"], "why": "Stirring slowly is something Zoe <b>does</b>. It is a <b>character</b> clue.", "no": "Character = <b>who</b>. Setting = <b>where</b> and <b>when</b>.", "hint": "Is it a person or animal? Or is it a place or a time?", "placeholder": "Type a word"}], [{"type": "fill", "q": "In <b>593</b>, what is the <b>value</b> of the <b>9</b>?", "answers": ["90", "ninety", "9 tens"], "why": "The 9 is in the <b>tens</b> place. It is worth <b>90</b>.", "no": "Find the 9. Which place is it in? Ones, tens or hundreds?", "hint": "9 tens = 90.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>200 + 0 + 9 = ____</b><br>Write it in standard form.", "answers": ["209", "two hundred nine", "two hundred and nine"], "why": "2 hundreds, 0 tens, 9 ones = <b>209</b>.", "no": "Put one digit in each place: hundreds, tens, ones.", "hint": "A 0 tens still needs a 0 in the tens place.", "placeholder": "Type a number"}, {"type": "fill", "q": "Round <b>314</b> to the nearest <b>ten</b>.<br>314 → ____", "answers": ["310", "three hundred ten", "three hundred and ten"], "why": "314 is between 310 and 320. The ones digit is 4. 4 or less, so stay <b>down</b>: <b>310</b>.", "no": "Look at the <b>ones</b> digit. 5 or more goes up. 4 or less stays.", "hint": "It is between 310 and 320. Which one is it closer to?", "placeholder": "Type a number"}, {"q": "A park has <b>450</b> trees. About how many is that, rounded to the nearest hundred?", "choices": ["450", "500", "400"], "a": 1, "why": "450 is between 400 and 500. The tens digit is 5, so it rounds to <b>500</b>.", "no": ["450 is 450 rounded to the nearest <b>ten</b>. This one asks for the nearest <b>hundred</b>.", null, "The tens digit is 5. That is 5 or more, so round <b>up</b>."]}, {"type": "fill", "q": "The story never says <i>Rosa is tired</i>. But Rosa yawns and rubs her eyes. You use those clues to ____ that she is tired. Type a story word.", "answers": ["infer", "make an inference"], "why": "Using clues to figure something out is to <b>infer</b>.", "no": "Which story word means to use clues to figure something out?", "hint": "It starts with in.", "placeholder": "Type a story word"}, {"q": "Read <i>The New Girl</i>. Which is the <b>setting</b>?", "choices": ["a school playground after the bell", "Ben asking the new girl to play tag", "a game of tag"], "a": 0, "why": "Where and when: the <b>playground</b> at Sunny Lake School, <b>after the bell</b>.", "no": [null, "That is what Ben does. It is a character clue.", "Tag is a game Ben wants to play. It is not where or when."], "visual": {"kind": "passage", "text": "<b>The New Girl</b><br>The bell rang at Sunny Lake School. Kids ran out to the playground. Ben saw a new girl sitting alone on a bench. He walked over. \"Do you want to play tag with us?\" he asked."}}, {"q": "Read the story again. What can you <b>infer</b> about Ben?", "choices": ["He is bored.", "He is angry at the girl.", "He is friendly."], "a": 2, "why": "He walks over to a girl sitting alone and asks her to play. He is <b>friendly</b>.", "no": ["He is not bored. He goes to talk to someone new.", "He asks her to play. That is not angry.", null], "visual": {"kind": "passage", "text": "<b>The New Girl</b><br>The bell rang at Sunny Lake School. Kids ran out to the playground. Ben saw a new girl sitting alone on a bench. He walked over. \"Do you want to play tag with us?\" he asked."}}, {"type": "fill", "q": "In The New Girl, <b>Ben asked the new girl to play</b>. Is that a clue about the character or the setting? Type <b>character</b> or <b>setting</b>.", "answers": ["character", "characters", "character clue"], "why": "Asking her to play is something Ben <b>does</b>. It is a <b>character</b> clue.", "no": "Character = <b>who</b>. Setting = <b>where</b> and <b>when</b>.", "hint": "Is it a person or animal? Or is it a place or a time?", "placeholder": "Type a word"}]]}], "win": "You found every digit's value and every story clue. Great first lesson, Ce'Line!", "prev": null, "prevTitle": ""});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedSt
