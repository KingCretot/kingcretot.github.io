<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ce&#x27;Line · Lesson 3: Regrouping and Theo&#x27;s Camping Trip</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L03", "label": "Lesson 3", "title": "Regrouping and Theo's Camping Trip", "goal": "I can add and subtract with regrouping. I can tell what happens first, next, then and last in a story.", "date": "2026-11-10", "mastery": 85, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Regrouping and Theo's Camping Trip", "text": "Today you learn to <b>carry</b> and to <b>borrow</b>. Then you go camping with Theo! ⛺", "visual": {"kind": "emoji", "text": "➕ ➖ ⛺ ⭐"}, "notes": {"do": "Before class (library table): base-ten pieces (real blocks, or paper ones cut from grid paper: 5 hundred flats, 20 ten strips, 20 ones), a place-value mat (a sheet of paper with three columns: H, T, O), whiteboard and marker, pencil and scrap paper, 3 index cards (BEGINNING, MIDDLE, END), 4 sticky notes (First, Next, Then, Last), and the printed Packet for her to take home.", "say": "Today has two parts. First, math: adding and subtracting big numbers when a column needs help. Then reading: Theo goes camping, and we put his trip in order.", "ask": "How are you feeling about math today, from 1 to 5?", "listen": "Any answer is fine. If she says 1 or 2, tell her: today we go one column at a time, and I will do the first ones with you."}}, {"type": "talk", "kick": "Book Talk", "title": "Theo's next trip", "text": "Last week, Theo used his compass to find the right trail. This week, Theo goes <b>camping overnight</b>.", "visual": {"kind": "emoji", "text": "🧭 ➡️ ⛺🌙"}, "prompts": ["Have you ever camped or slept outside? What would you bring?", "When you get to a campsite, what should you do <b>first</b>? Why first?", "Which camp job do you think comes <b>before</b> dinner? Why?"], "starters": ["I would bring …", "First, I would … because …", "Before dinner, they need to … because …"], "notes": {"do": "5 minutes, talk only. Tap the gold button for each full-sentence answer.", "say": "Order matters when you camp. Order matters in a story too. That is our reading skill today.", "ask": "Which has to come first at camp, the fire or the hot food? Why?", "listen": "The fire, because there is nothing to cook on without it. Praise any answer with \"because\"."}}, {"type": "recall", "kick": "Remember", "title": "Weeks 1 and 2", "text": "Quick review of the last two weeks.", "items": [{"type": "fill", "q": "Round <b>278</b> to the nearest <b>ten</b>: ____", "answers": ["280"], "why": "278 is between 270 and 280. The ones digit is 8, which is 5 or more, so round up to <b>280</b>.", "no": "Look at the ones digit. Is it 5 or more?", "hint": "8 is 5 or more. Round up.", "placeholder": "Type a number"}, {"type": "fill", "q": "Type <b>&lt;</b>, <b>&gt;</b> or <b>=</b>: &nbsp;736 ____ 763", "answers": ["<", "less than", "is less than", "less", "smaller than"], "why": "Hundreds are the same (7 and 7). Tens: 3 is less than 6. So <b>736 &lt; 763</b>.", "no": "Hundreds are the same. Now look at the tens.", "hint": "3 tens is less than 6 tens.", "placeholder": "< > or ="}, {"q": "A story takes place at a <b>beach</b> on a <b>hot morning</b>. The beach and the morning are the …", "choices": ["characters", "conflict", "setting"], "a": 2, "why": "Where and when a story happens is the <b>setting</b>.", "no": ["Characters are the people or animals in a story.", "The conflict is the problem in the story.", null]}, {"type": "fill", "q": "Theo could not find the trail sign. That <b>problem</b> is the story's ____.", "answers": ["conflict"], "why": "A problem in a story is the <b>conflict</b>. Theo's conflict was the missing trail sign.", "no": "It is a Week 2 word. It starts with c.", "hint": "c-o-n-…", "placeholder": "Type a word"}], "notes": {"do": "She answers out loud first, then taps or types. 4 minutes.", "ask": "How did you know to round 278 up?", "listen": "280 (8 is 5 or more), &lt;, setting, conflict. If she misses one, say the rule once and move on. We review again next week."}}, {"type": "vocab", "kick": "Word Power", "title": "Math words for today", "text": "Tap each card to flip it. Read the word and the meaning out loud.", "words": [{"word": "regroup", "pos": "verb", "meaning": "To trade 10 of one place for 1 of the next place.", "example": "10 ones = 1 ten. I <b>regroup</b> 10 ones as 1 ten.", "emoji": "🔄"}, {"word": "carry", "pos": "verb", "meaning": "To move a regrouped ten (or hundred) to the next column when you add.", "example": "7 + 5 = 12. I write 2 and <b>carry</b> the 1 ten.", "emoji": "🎒"}, {"word": "borrow", "pos": "verb", "meaning": "To take 1 ten from the next column so you have 10 more ones to subtract.", "example": "In 42 − 8, 2 is too small. I <b>borrow</b> 1 ten.", "emoji": "🤝"}, {"word": "sum", "pos": "noun", "meaning": "The answer when you add.", "example": "In 20 + 5 = 25, the <b>sum</b> is 25.", "emoji": "➕"}, {"word": "difference", "pos": "noun", "meaning": "The answer when you subtract.", "example": "In 20 − 5 = 15, the <b>difference</b> is 15.", "emoji": "➖"}], "notes": {"do": "She reads each card aloud, then covers it and says the meaning in her own words.", "say": "Pathways asks you to TYPE these words, so we say them and spell them today. The word is regroup, not regrouping.", "ask": "Which word is the answer to an adding problem? Which is the answer to a subtracting problem?", "listen": "Sum for adding, difference for subtracting. Carry goes with adding; borrow goes with subtracting."}}, {"type": "learn", "kick": "Hands-on", "title": "Trade 10 for 1", "text": "In each place, you can only have <b>0 to 9</b>. When you get <b>10 or more</b>, you trade.", "visual": {"kind": "bigtext", "text": "10 ones = 1 ten", "sub": "10 tens = 1 hundred"}, "steps": [{"text": "You have <b>14 ones</b>. That is too many for the ones place."}, {"text": "Trade 10 ones for <b>1 ten</b>. Now you have 1 ten and <b>4 ones</b>.", "visual": {"kind": "placevalue", "n": 14}}, {"text": "You have <b>12 tens</b>. Trade 10 tens for <b>1 hundred</b>. Now you have 1 hundred and <b>2 tens</b>.", "visual": {"kind": "placevalue", "n": 120}}, {"text": "When you make this trade, you <b>regroup</b>. Adding and subtracting use it all the time."}], "tip": "Only 0 to 9 can live in one place. 10 or more? Trade!", "notes": {"do": "Hands-on: she counts out 14 ones on the mat, then trades 10 of them for 1 ten strip. Then 12 ten strips: she trades 10 for 1 hundred flat.", "say": "Ten ones and one ten are the same amount. We just make it neat.", "ask": "If you have 17 ones, how many tens and ones after you trade? If you have 11 tens?", "listen": "17 ones = 1 ten and 7 ones. 11 tens = 1 hundred and 1 ten. If she says 17 tens, put the pieces in her hand and count again."}}, {"type": "learn", "kick": "Learn", "title": "Adding: carry the ten", "text": "<b>147 + 236</b>. Line up the places. Start with the <b>ones</b>.", "steps": [{"text": "Stack the numbers. Ones under ones, tens under tens.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">3</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">7</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">6</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">+</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"178\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/><rect x=\"133\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/><rect x=\"88\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/></svg>"}}, {"text": "<b>Ones:</b> 7 + 6 = 13. That is 10 or more! Write <b>3</b>. <b>Carry</b> the 1 ten to the tens.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"150\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">1</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">3</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">7</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">6</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">+</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><text x=\"195\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">3</text></svg>"}}, {"text": "<b>Tens:</b> 4 + 3 + the carried 1 = <b>8</b>.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"150\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">1</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">3</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">7</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">6</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">+</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><text x=\"195\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">3</text><text x=\"150\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">8</text></svg>"}}, {"text": "<b>Hundreds:</b> 1 + 2 = <b>3</b>. The sum is <b>383</b>.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"150\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">1</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">3</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">7</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">6</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">+</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><text x=\"195\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">3</text><text x=\"150\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">8</text><text x=\"105\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">3</text></svg>"}}], "tip": "Always start with the ones. Go right to left.", "notes": {"do": "She builds 147 and 236 with pieces on the mat. She pushes the 13 ones together, trades 10 for a ten strip, and moves it to the tens column. Then she writes it on paper.", "say": "The little red 1 is the ten we traded. Don't forget to add it in the tens.", "ask": "Why can't we write 13 in the ones place?", "listen": "Only one digit fits in a place. 13 ones is 1 ten and 3 ones."}}, {"type": "tap", "kick": "Your turn", "title": "Carry the ten", "text": "Work on paper first. Then type.", "items": [{"q": "Adding 349 + 126: the ones are 9 + 6 = <b>15</b>. What do you do?", "choices": ["Write 15 in the ones place", "Write 1 and carry the 5", "Write 5 and carry 1 ten"], "a": 2, "why": "15 ones = 1 ten and 5 ones. Write <b>5</b>, carry the <b>1 ten</b>.", "no": ["Only one digit fits in the ones place.", "It is the other way. The 5 stays in the ones. The 1 is a ten.", null]}, {"type": "fill", "q": "<b>258 + 117 = ____</b>", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">5</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">8</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">7</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">+</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"178\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/><rect x=\"133\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/><rect x=\"88\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/></svg>"}, "answers": ["375"], "why": "Ones: 8 + 7 = 15. Write 5, carry 1. Tens: 5 + 1 + 1 = 7. Hundreds: 2 + 1 = 3. <b>375</b>.", "no": "Did you add the carried 1 in the tens?", "hint": "8 + 7 = 15. Write 5. Carry 1.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>64 + 29 = ____</b>", "answers": ["93"], "why": "Ones: 4 + 9 = 13. Write 3, carry 1. Tens: 6 + 2 + 1 = 9. <b>93</b>.", "no": "Start with the ones: 4 + 9.", "hint": "4 + 9 = 13. Write 3. Carry 1.", "placeholder": "Type a number"}], "notes": {"do": "She writes each one stacked on paper with the carried 1 in red (or circled).", "ask": "Show me your carried 1. Which column did it go to?", "listen": "375 and 93. If she gets 365, she forgot the carried 1. If she gets 3615, she wrote 15 in the ones place: go back to the pieces."}}, {"type": "learn", "kick": "Learn", "title": "Carry two times", "text": "Sometimes you carry in the ones <b>and</b> in the tens. <b>276 + 158</b>.", "steps": [{"text": "Stack it. Ones first.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 2 /b>.", "no": "Borrow 1 ten. Now you have 14 ones.", "hint": "14 − 8 = 6. The 7 tens became 6 tens.", "placeholder": "Type a number"}, {"type": "fill", "q": "In <b>563 − 248</b> you borrow 1 ten. The <b>3</b> ones become ____ ones.", "answers": ["13", "thirteen"], "why": "1 ten = 10 ones. 3 + 10 = <b>13</b> ones. Then 13 − 8 = 5.", "no": "You get 10 more ones. 3 + 10 = ?", "placeholder": "Type a number"}], "notes": {"do": "She writes the crossed-out digit and the new digit above it every time.", "ask": "What happens to the tens digit when it lends 1 ten?", "listen": "Borrow, 315, 36, 13. The tens digit gets 1 less (Pathways asks this; the answer it wants is <b>1 less</b>)."}}, {"type": "learn", "kick": "Learn", "title": "Borrow two times, and zeros", "text": "Sometimes you borrow in the ones <b>and</b> in the tens.", "steps": [{"text": "<b>532 − 274</b>. Ones: 2 − 4? Borrow. 12 − 4 = <b>8</b>. The 3 tens become 2.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">5</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">3</text><line x1=\"137\" y1=\"106\" x2=\"163\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"150\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">2</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">7</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><line x1=\"182\" y1=\"106\" x2=\"208\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"195\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">12</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">−</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><text x=\"195\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">8</text></svg>"}}, {"text": "Tens: 2 − 7? Borrow again! 12 − 7 = <b>5</b>. The 5 hundreds become 4. Hundreds: 4 − 2 = <b>2</b>. So <b>258</b>.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">5</text><line x1=\"92\" y1=\"106\" x2=\"118\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"105\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">4</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">3</text><line x1=\"137\" y1=\"106\" x2=\"163\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"150\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">12</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">7</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><line x1=\"182\" y1=\"106\" x2=\"208\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"195\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">12</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">−</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><text x=\"195\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">8</text><text x=\"150\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">5</text><text x=\"105\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">2</text></svg>"}}, {"text": "<b>405 − 168</b>. Ones: 5 − 8? Borrow. But the tens are <b>0</b>. Zero has nothing to lend!", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">0</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">6</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">5</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">8</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">−</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"178\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/><rect x=\"133\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/><rect x=\"88\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/></svg>"}}, {"text": "Go to the hundreds. 4 hundreds become 3. The 0 tens become 10 tens. Lend 1 ten to the ones: 10 tens become <b>9</b>. The ones become <b>15</b>.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><line x1=\"92\" y1=\"106\" x2=\"118\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"105\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">3</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">0</text><line x1=\"137\" y1=\"106\" x2=\"163\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"150\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">9</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">6</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">5</text><line x1=\"182\" y1=\"106\" x2=\"208\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"195\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">15</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">8</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">−</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/></svg>"}}, {"text": "15 − 8 = <b>7</b>. 9 − 6 = <b>3</b>. 3 − 1 = <b>2</b>. So 405 − 168 = <b>237</b>.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><line x1=\"92\" y1=\"106\" x2=\"118\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"105\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">3</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">0</text><line x1=\"137\" y1=\"106\" x2=\"163\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"150\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">9</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">6</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">5</text><line x1=\"182\" y1=\"106\" x2=\"208\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"195\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">15</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">8</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">−</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><text x=\"195\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">7</text><text x=\"150\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">3</text><text x=\"105\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">2</text></svg>"}}], "tip": "Zero in the tens? Borrow from the hundreds first. The 0 becomes 9.", "notes": {"do": "For 405 − 168 she builds 405 with pieces: 4 flats and 5 ones, no ten strips. She trades 1 flat for 10 ten strips, then 1 ten strip for 10 ones.", "say": "A zero can't lend. So it borrows from its neighbor first, then it lends. That is why it ends up as 9.", "ask": "Why does the 0 become 9 and not 10?", "listen": "It got 10 tens, then gave 1 ten to the ones, so 9 are left. If she writes 247, she left the tens at 10: show the pieces again."}}, {"type": "tap", "kick": "Your turn", "title": "Borrow two times", "text": "Work on paper first. Cross out and write the new digits.", "items": [{"type": "fill", "q": "<b>621 − 385 = ____</b>", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">6</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">3</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">8</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">5</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">−</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"178\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/><rect x=\"133\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/><rect x=\"88\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/></svg>"}, "answers": ["236"], "why": "Ones: 1 − 5? Borrow. 11 − 5 = 6. Tens: 1 − 8? Borrow. 11 − 8 = 3. Hundreds: 5 − 3 = 2. <b>236</b>.", "no": "You need to borrow two times.", "hint": "11 − 5 = 6. Then the tens: 1 − 8? Borrow again.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>500 − 138 = ____</b>", "answers": ["362"], "why": "Borrow across the zeros: 5 hundreds → 4, tens → 9, ones → 10. 10 − 8 = 2. 9 − 3 = 6. 4 − 1 = 3. <b>362</b>.", "no": "Zero can't lend. Start at the hundreds.", "hint": "The tens become 9. The ones become 10.", "placeholder": "Type a number"}, {"type": "fill", "q": "Check it: add back. <b>362 + 138 = ____</b>", "answers": ["500"], "why": "362 + 138 = <b>500</b>. We get back the top number, so 500 − 138 = 362 is right!", "no": "Add the ones first: 2 + 8 = 10. Carry 1.", "hint": "2 + 8 = 10. 6 + 3 + 1 = 10. 3 + 1 + 1 = 5.", "placeholder": "Type a number"}], "notes": {"do": "She checks the 500 − 138 answer by adding back on paper.", "say": "Adding back is your checker. If you get the top number again, you are right.", "listen": "236, 362, 500. For 500 − 138, 372 or 472 means the zeros did not become 9s."}}, {"type": "tap", "kick": "Find the mistake", "title": "Be the checker", "text": "Mia and Theo did these on paper. Find the mistake.", "items": [{"q": "Mia wrote <b>362 − 147 = 225</b>. What went wrong?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">3</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">6</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">7</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">−</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/></svg>"}, "choices": ["Nothing is wrong. 362 − 147 is 225.", "She flipped 2 − 7 to 7 − 2. It is 215.", "She should have added instead. It is 509."], "a": 1, "why": "2 is smaller than 7, so borrow: 12 − 7 = 5. The 6 tens become 5. 5 − 4 = 1. 3 − 1 = 2. <b>215</b>.", "no": ["Check the ones: 2 − 7. Can you do that without borrowing?", null, "The problem says minus. We subtract."]}, {"q": "Theo wrote <b>259 + 168 = 417</b>. What went wrong?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">5</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">6</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">9</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">8</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">+</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/></svg>"}, "choices": ["He forgot the carried 1. It is 427.", "Nothing is wrong. 417 is the sum.", "He should not carry at all. It is 317."], "a": 0, "why": "Ones: 9 + 8 = 17, carry 1. Tens: 5 + 6 + 1 = <b>12</b>, carry 1. Hundreds: 2 + 1 + 1 = 4. <b>427</b>.", "no": [null, "Look at the tens: 5 + 6 + the carried 1.", "Only one digit fits in a place. You must carry."]}], "notes": {"do": "She redoes each problem on the whiteboard and circles the step that went wrong.", "say": "These are the two biggest mistakes. Flipping the numbers to subtract, and forgetting the carried 1.", "ask": "How can you check Mia's answer?", "listen": "Add back: 215 + 147 = 362. Mia's 225 + 147 = 372, which is not 362."}}, {"type": "tap", "kick": "Exit ticket", "title": "Math on your own", "text": "Do these on your own. Paper first.", "items": [{"type": "fill", "q": "<b>248 + 376 = ____</b>", "answers": ["624"], "why": "Ones: 8 + 6 = 14, carry 1. Tens: 4 + 7 + 1 = 12, carry 1. Hundreds: 2 + 3 + 1 = <b>6</b>. <b>624</b>.", "no": "Two carries in this one.", "hint": "14, then 12, then 6.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>514 − 279 = ____</b>", "answers": ["235"], "why": "Ones: 4 − 9? Borrow. 14 − 9 = 5. Tens: 0 − 7? Borrow. 10 − 7 = 3. Hundreds: 4 − 2 = 2. <b>235</b>.", "no": "You borrow two times.", "hint": "14 − 9 = 5. The 1 ten became 0, so borrow again.", "placeholder": "Type a number"}], "notes": {"do": "On her own, no help. Note her FIRST answers.", "listen": "624 and 235. Both right on the first try means she is ready for the Pathways Week 3 Math retake. If not, start Lesson 4's math with 5 minutes on the pieces."}}, {"type": "vocab", "kick": "Word Power", "title": "Reading words for today", "text": "Tap each card to flip it. Read it out loud.", "words": [{"word": "sequence", "pos": "noun", "meaning": "The order that things happen in.", "example": "Wake up, eat breakfast, go to school. That is the <b>sequence</b> of my morning.", "emoji": "🔢"}, {"word": "beginning", "pos": "noun", "meaning": "The start of a story. We meet the characters and learn what they will do.", "example": "In the <b>beginning</b>, Theo asks to go camping.", "emoji": "🚦"}, {"word": "middle", "pos": "noun", "meaning": "The main part of a story. Most of the action happens here.", "example": "In the <b>middle</b>, they set up camp.", "emoji": "🏕️"}, {"word": "end", "pos": "noun", "meaning": "The last part of a story. It wraps everything up.", "example": "At the <b>end</b>, they look at the stars.", "emoji": "🏁"}, {"word": "transition word", "pos": "noun", "meaning": "A word like first, next, then or last. It shows the order.", "example": "<b>First</b> we pitch the tent. <b>Next</b> we build a fire.", "emoji": "➡️"}], "notes": {"do": "Lay out the BEGINNING, MIDDLE, END index cards and the First, Next, Then, Last sticky notes.", "say": "Pathways asks you to type these words too. When it asks \"words like first, next, then and last are called ___ words,\" you type transition.", "ask": "What is the sequence of your morning? Use first, next and last.", "listen": "A short sequence with transition words: First I woke up, next I ate, last I went to school."}}, {"type": "tap", "kick": "Read", "title": "The beginning", "text": "Read it out loud with Mr. Jonathan.", "visual": {"kind": "passage", "text": "<b>The Beginning</b><br>“Dad, can we camp overnight this time?” Theo asked, spreading the trail map across the kitchen table. His father grinned. “I was hoping you'd ask.” They packed the tent, the sleeping bags, and a box of matches. Theo's little sister Mia begged to come too, and this time, their parents said yes."}, "items": [{"q": "What does this <b>beginning</b> tell us?", "choices": ["How the camping trip ends that night", "Who is in it and what they will do", "What they cook over the fire"], "a": 1, "why": "A beginning tells <b>who</b> is in the story and <b>what</b> they are about to do: Theo, Dad and Mia are going camping overnight.", "no": ["The ending has not happened yet.", null, "Dinner comes later, in the middle."]}, {"type": "fill", "q": "Mia asked to come. What did her parents say this time? Type <b>yes</b> or <b>no</b>.", "answers": ["yes"], "why": "“This time, their parents said <b>yes</b>.”", "no": "Look at the last sentence.", "placeholder": "yes or no"}], "notes": {"do": "You read the first two sentences; she reads the rest. She puts the BEGINNING card next to the screen.", "ask": "Who are the characters? What are they about to do?", "listen": "Theo, Dad and Mia; camp overnight. Words to help with: grinned (a big smile), overnight (stay all night)."}}, {"type": "tap", "kick": "Read", "title": "The middle", "text": "Look for the <b>transition words</b>.", "visual": {"kind": "passage", "text": "<b>The Middle</b><br><b>FIRST</b>, they found a flat clearing near the stream and pitched the tent, hammering each stake into the ground. <b>NEXT</b>, Theo gathered dry branches while Dad built a ring of stones for the fire. <b>THEN</b>, once the fire crackled to life, Mia helped stir a pot of chili bubbling over the flames."}, "items": [{"type": "fill", "q": "Which word tells you the fire came <b>after</b> the tent? Type it.", "answers": ["next"], "why": "<b>Next</b>, Theo gathered branches for the fire. Next means after the tent.", "no": "Look at the start of the second sentence.", "placeholder": "Type a word"}, {"q": "Why did Theo gather dry branches?", "choices": ["To build the tent", "To make a fire", "To stir the chili"], "a": 1, "why": "Dry branches burn. Theo gathered them for the <b>fire</b>.", "no": ["They hammered stakes for the tent. Branches were for something else.", null, "Mia stirred the chili with a spoon, after the fire was lit."]}, {"type": "fill", "q": "How many transition words are in this part? Type a number.", "answers": ["3", "three"], "why": "FIRST, NEXT and THEN. That is <b>3</b>.", "no": "Look for the big capital words.", "placeholder": "Type a number"}], "notes": {"do": "She puts the First, Next, Then sticky notes in a row as she reads each sentence.", "ask": "Could Mia stir the chili before the fire? Why not?", "listen": "No, there was nothing to cook on yet. Pathways asks for the three words; tell her it wants them typed as <b>first, next, then</b>."}}, {"type": "tap", "kick": "Read", "title": "The end", "text": "How does the story wrap up?", "visual": {"kind": "passage", "text": "<b>The End</b><br><b>LAST</b>, after the dishes were washed in the stream, the family lay back on a blanket and looked up. The sky above the campsite had no city lights to compete with, just thousands of stars, more than Theo had ever counted. Mia fell asleep first, her head on Dad's shoulder. Theo stayed awake a little longer, thinking that some things, like counting stars with your family, are worth staying up for."}, "items": [{"q": "Why could Theo see so many stars?", "choices": ["There were no city lights", "It was the middle of the day", "Dad turned on a light"], "a": 0, "why": "“The sky … had <b>no city lights</b> to compete with.” Without city lights, you can see more stars.", "no": [null, "They lay back at night, after dinner.", "There was no light. That is why the stars were so bright."]}, {"type": "fill", "q": "Who stayed awake longer, <b>Theo</b> or <b>Mia</b>?", "answers": ["theo"], "why": "Mia fell asleep first. <b>Theo</b> stayed awake a little longer.", "no": "Who fell asleep first?", "placeholder": "Theo or Mia"}], "notes": {"do": "She reads it. She puts the Last sticky note and the END card down.", "ask": "How do you think Theo feels at the end? Which words tell you?", "listen": "Happy, thankful (Pathways wants <b>grateful</b>): \"some things are worth staying up for.\" The action slows down. That is how we know it is the end."}}, {"type": "order", "kick": "Sequence", "title": "Put Theo's trip in order", "text": "Tap the events in the order they happened.", "steps": ["Theo asks Dad to camp overnight.", "They pitch the tent near the stream.", "Theo gathers dry branches.", "Mia stirs the chili.", "They wash the dishes in the stream.", "Mia falls asleep on Dad's shoulder."], "why": "That is the sequence: plan, tent, fire, chili, dishes, sleep.", "hint": "Not yet. Think: what has to happen before this one?", "notes": {"do": "She says a transition word out loud before each tap: First, Next, Then, Then, Then, Last.", "ask": "Why does the tent come before the chili?", "listen": "They set up camp first. You need the fire before you can cook."}}, {"type": "sort", "kick": "Story parts", "title": "Beginning, middle or end?", "text": "Tap a card. Then tap the part of the story where it goes.", "buckets": ["Beginning", "Middle", "End"], "items": [{"text": "Theo spreads the trail map on the table.", "b": 0, "why": "This is at the start, before the trip.", "hint": "Are they at the campsite yet?"}, {"text": "Mia begs to come too.", "b": 0, "why": "We meet Mia at the start.", "hint": "When do we meet the characters?"}, {"text": "Dad builds a ring of stones.", "b": 1, "why": "Setting up camp is the main action.", "hint": "This is part of setting up camp."}, {"text": "The fire crackles to life.", "b": 1, "why": "This is part of setting up camp.", "hint": "Is this the start, or the main action?"}, {"text": "The family looks up at thousands of stars.", "b": 2, "why": "The action slows down. This is the end.", "hint": "Is the work done here?"}, {"text": "Theo thinks some things are worth staying up for.", "b": 2, "why": "The story wraps up with a feeling.", "hint": "This is the last thought in the story."}], "done": "Beginning: who and what. Middle: the action. End: it wraps up.", "notes": {"do": "She sorts all six and says why before each tap.", "ask": "How do you know the stars are the end?", "listen": "The work is done, the action slows down, and the story leaves us with a feeling."}}, {"type": "learn", "kick": "Wrap-up", "title": "Two big skills", "text": "You learned two big skills today.", "steps": [{"text": "<b>Add:</b> ones first. 10 or more? Write the ones digit and <b>carry</b> the 1."}, {"text": "<b>Subtract:</b> ones first. Top digit too small? <b>Borrow</b> 1 ten. A zero borrows from its neighbor first."}, {"text": "<b>Sequence:</b> beginning, middle, end. <b>First, next, then, last</b> show the order."}], "tip": "Your task list has the after-class lesson for tonight. Your next class is in three weeks, so do a little each week.", "notes": {"do": "Open the course page and read the task list together. Give her the printed Packet.", "say": "Our next class is in three weeks, after the break. A little each week keeps it fresh. Your next lesson is Lesson 4.", "ask": "Tell me the steps for 405 − 168.", "listen": "Ones first; zero can't lend, so borrow from the hundreds; the 0 becomes 9; 15 − 8, 9 − 6, 3 − 1 = 237."}}], "win": "You carried, you borrowed, and you put Theo's camping trip in order. Great work, Ce'Line!", "prev": "bb-celine-L02", "prevTitle": "Lesson 2"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;
