<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce&#x27;Line · Practice 5</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Unit 1 Checkpoint Review</h1><p style="margin:0 0 12px;color:#5b6578">Three tries on each one. Only your first try counts. Work every math problem on paper first.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Ce'Line", "label": "Lesson 5", "title": "Unit 1 Checkpoint Review", "mastery": 85, "color": "#C9A84C", "questions": [{"type": "fill", "q": "Week 1. Write <b>640</b> in expanded form: 640 = ____", "answers": ["600 + 40", "600 + 40 + 0", "600+40"], "why": "6 hundreds and 4 tens. The 0 ones is worth 0. <b>600 + 40</b>", "no": "Write what each digit is worth, with plus signs.", "hint": "The 6 is worth 600.", "placeholder": "Example: 300 + 40 + 5"}, {"type": "fill", "q": "Week 1. Round <b>248</b> to the nearest <b>ten</b>: ____", "answers": ["250"], "why": "248 is between 240 and 250. Look at the ones digit: 8. That is 5 or more, so round <b>up</b>. <b>250</b>", "no": "Look at the ones digit. 5 or more rounds up. 4 or less stays.", "hint": "248 is between 240 and 250. Which one is it closer to?", "placeholder": "Type a number"}, {"q": "Week 2. Which one is <b>true</b>?", "choices": ["356 &gt; 365", "356 &lt; 365", "356 = 365"], "a": 1, "why": "Hundreds tie: 3 and 3. Tens: 5 and 6. 5 is less, so <b>356 &lt; 365</b>.", "no": ["&gt; means greater than. 356 is NOT greater than 365. Look at the tens.", null, "The digits are mixed up, so they are not equal."]}, {"type": "fill", "q": "Week 2. Put these in order from <b>greatest to least</b>: <b>573, 357, 537</b>.<br>Type them with commas: ____", "answers": ["573, 537, 357", "573 > 537 > 357"], "why": "Compare the hundreds first. If two tie, compare the tens. From greatest to least: <b>573, 537, 357</b>", "no": "Look at the hundreds digits first. If two numbers have the same hundreds digit, look at the tens.", "hint": "Which number is biggest?", "placeholder": "Example: 100, 200, 300"}, {"type": "fill", "q": "Week 3. <b>395 + 236 = ____</b>", "answers": ["631"], "why": "Ones: 5 + 6 = 11. Write 1, carry 1. Tens: 9 + 3 + 1 = 13. Write 3, carry 1. Hundreds: 3 + 2 + 1 = 6. <b>631</b>", "no": "Start with the ones. If a column makes 10 or more, write the ones digit and carry the 1 to the next column.", "hint": "Ones first: 5 + 6 = 11.", "placeholder": "Type a number"}, {"type": "fill", "q": "Week 3. <b>805 − 469 = ____</b>", "answers": ["336"], "why": "Ones: 5 − 9? Too small. The tens place has 0, so first take 1 hundred: 8 hundreds become 7, and 0 tens become 10 tens. Now take 1 ten: 10 tens become 9, and 5 ones become 15 ones. 15 − 9 = 6. Tens: 9 − 6 = 3. Hundreds: 7 − 4 = 3. <b>336</b>", "no": "Start with the ones. If the top digit is too small, borrow 1 from the next place. Never flip the digits.", "hint": "Ones first: 5 − 9? You need to borrow.", "placeholder": "Type a number"}, {"q": "Week 4. A theater has <b>420</b> seats. <b>236</b> kids sit down. How many seats are still empty?", "choices": ["656", "184", "226", "284"], "a": 1, "why": "Seats still empty = what is left: subtract. 420 − 236. Ones: 0 − 6? Borrow: 10 − 6 = 4. Tens: 1 − 3? Borrow: 11 − 3 = 8. Hundreds: 3 − 2 = 1. <b>184</b>", "no": ["656 is 420 + 236. Empty seats are what is LEFT: subtract.", null, "Did you flip 0 − 6 and 1 − 3? Borrow instead.", "Did you forget that the 4 hundreds became 3?"]}, {"type": "fill", "q": "Week 4. <b>Estimate</b> 293 + 608. Round each number to the nearest hundred first. Then add. Estimate: ____", "answers": ["900"], "why": "293 rounds to 300. 608 rounds to 600. 300 + 600 = <b>900</b>", "no": "Round each number to the nearest hundred first. Then add the rounded numbers. Do not add the exact numbers.", "hint": "293 rounds to 300.", "placeholder": "Type a number"}, {"type": "fill", "q": "Where was the bake sale? In the school ____.", "answers": ["gym"], "why": "The bake sale was “in the school <b>gym</b>.” That is part of the setting.", "no": "Look at the first sentence.", "hint": "It starts with g.", "placeholder": "Type a word", "visual": {"kind": "passage", "text": "<b>Imani and the Lost Money</b><br>On Friday, Imani's class had a bake sale in the school gym. Imani sold lemon bars at the first table. First, she set out the bars. Next, she saw a five-dollar bill on the floor. Nobody was looking. Imani wanted to keep it for a new book. Then she thought of a little boy by the door. He was crying and looking at the floor. Imani ran to him. “Did you drop this?” she asked. The boy smiled and bought two lemon bars with it. Last, Imani's teacher gave her a gold star for being honest."}}, {"q": "What was Imani's <b>conflict</b>?", "choices": ["She ran out of lemon bars to sell at the sale", "She wanted to keep money that was not hers", "Her teacher was mad that she left her table", "She lost the money she brought for a new book"], "a": 1, "why": "She found the money and wanted to keep it for a new book. But it was not hers. That is her problem.", "no": ["Nothing says she ran out.", null, "Her teacher gave her a gold  "answers": ["560"], "why": "563 is between 560 and 570. Look at the ones digit: 3. That is 4 or less, so round <b>down</b>. <b>560</b>", "no": "Look at the ones digit. 5 or more rounds up. 4 or less stays.", "hint": "563 is between 560 and 570. Which one is it closer to?", "placeholder": "Type a number"}, {"q": "Week 2. Which one is <b>true</b>?", "choices": ["953 &lt; 935", "953 = 935", "953 &gt; 935"], "a": 2, "why": "Hundreds tie: 9 and 9. Tens: 5 and 3. 5 is bigger, so <b>953 &gt; 935</b>.", "no": ["&lt; means less than. 953 is NOT less than 935. Look at the tens.", "The digits are mixed up, so they are not equal.", null]}, {"type": "fill", "q": "Week 2. Put these in order from <b>least to greatest</b>: <b>627, 276, 672</b>.<br>Type them with commas: ____", "answers": ["276, 627, 672", "276 < 627 < 672"], "why": "Compare the hundreds first. If two tie, compare the tens. From least to greatest: <b>276, 627, 672</b>", "no": "Look at the hundreds digits first. If two numbers have the same hundreds digit, look at the tens.", "hint": "Which number is smallest?", "placeholder": "Example: 100, 200, 300"}, {"type": "fill", "q": "Week 3. <b>486 + 237 = ____</b>", "answers": ["723"], "why": "Ones: 6 + 7 = 13. Write 3, carry 1. Tens: 8 + 3 + 1 = 12. Write 2, carry 1. Hundreds: 4 + 2 + 1 = 7. <b>723</b>", "no": "Start with the ones. If a column makes 10 or more, write the ones digit and carry the 1 to the next column.", "hint": "Ones first: 6 + 7 = 13.", "placeholder": "Type a number"}, {"type": "fill", "q": "Week 3. <b>902 − 548 = ____</b>", "answers": ["354"], "why": "Ones: 2 − 8? Too small. The tens place has 0, so first take 1 hundred: 9 hundreds become 8, and 0 tens become 10 tens. Now take 1 ten: 10 tens become 9, and 2 ones become 12 ones. 12 − 8 = 4. Tens: 9 − 4 = 5. Hundreds: 8 − 5 = 3. <b>354</b>", "no": "Start with the ones. If the top digit is too small, borrow 1 from the next place. Never flip the digits.", "hint": "Ones first: 2 − 8? You need to borrow.", "placeholder": "Type a number"}, {"q": "Week 4. A bakery made <b>470</b> rolls. It sold <b>289</b>. How many rolls are left?", "choices": ["759", "181", "219", "281"], "a": 1, "why": "“Left” means subtract: 470 − 289. Ones: 0 − 9? Borrow: 10 − 9 = 1. Tens: 6 − 8? Borrow: 16 − 8 = 8. Hundreds: 3 − 2 = 1. <b>181</b>", "no": ["759 is 470 + 289. “Left” means subtract.", null, "Did you flip the digits instead of borrowing? Borrow when the top digit is too small.", "Did you forget that the 4 hundreds became 3?"]}, {"type": "fill", "q": "Week 4. <b>Estimate</b> 353 + 529. Round each number to the nearest hundred first. Then add. Estimate: ____", "answers": ["900"], "why": "353 rounds to 400. 529 rounds to 500. 400 + 500 = <b>900</b>", "no": "Round each number to the nearest hundred first. Then add the rounded numbers. Do not add the exact numbers.", "hint": "353 rounds to 400.", "placeholder": "Type a number"}, {"type": "fill", "q": "Where did Eli go fishing? At the river ____.", "answers": ["dock"], "why": "They fished “at the river <b>dock</b>.” That is part of the setting.", "no": "Look at the first sentence.", "hint": "It starts with d.", "placeholder": "Type a word", "visual": {"kind": "passage", "text": "<b>Eli's Fishing Trip</b><br>On a sunny morning, Eli and his mom went fishing at the river dock. First, Eli put a worm on his hook. Next, he dropped his line into the water. Then he waited, and waited. Nothing bit. Eli wanted to go home. “Fish like it quiet,” Mom said. Eli sat still and watched his red bobber. At last, the bobber dipped down! Eli pulled in a big, shiny fish. He grinned all the way home."}}, {"q": "What was Eli's <b>conflict</b>?", "choices": ["He could not find a worm to put on his hook", "No fish would bite, and he wanted to quit", "His mom fell off the dock into the river", "It started to rain on the river dock"], "a": 1, "why": "He waited and waited, but nothing bit. He wanted to go home. That is his problem.", "no": ["He put a worm on his hook. Nothing says he could not find one.", null, "Nobody falls in.", "It was a sunny morning."], "visual": {"kind": "passage", "text": "<b>Eli's Fishing Trip</b><br>On a sunny morning, Eli and his mom went fishing at the river dock. First, Eli put a worm on his hook. Next, he dropped his line into the water. Then he waited, and waited. Nothing bit. Eli wanted to go home. “Fish like it quiet,” Mom said. Eli sat still and watched his red bobber. At last, the bobber dipped down! Eli pulled in a big, shiny fish. He grinned all the way home."}}, {"q": "What happened right <b>after</b> the bobber dipped down?", "choices": ["Eli put a worm on his hook", "Eli pulled in a big fish", "Mom said fish like it quiet", "Eli dropped his line"], "a": 1, "why": "“At last, the bobber dipped down! Eli pulled in a big, shiny fish.”", "no": ["That was first.", null, "That came before he sat still.", "That was next, near the start."], "visual": {"kind": "passage", "text": "<b>Eli's Fishing Trip</b><br>On a sunny morning, Eli and his mom went fishing at the river dock. First, Eli put a worm on his hook. Next, he dropped his line into the water. Then he waited, and waited. Nothing bit. Eli wanted to go home. “Fish like it quiet,” Mom said. Eli sat still and watched his red bobber. At last, the bobber dipped down! Eli pulled in a big, shiny fish. He grinned all the way home."}}, {"type": "fill", "q": "Eli waited and caught a fish. The theme is: good things can come if you are ____.", "answers": ["patient", "patience", "calm", "still", "quiet"], "why": "Eli sat still and waited, and he caught a fish. The lesson: <b>be patient</b>.", "no": "What did Eli have to do to catch the fish?", "hint": "It starts with p.", "placeholder": "Type a word", "visual": {"kind": "passage", "text": "<b>Eli's Fishing Trip</b><br>On a sunny morning, Eli and his mom went fishing at the river dock. First, Eli put a worm on his hook. Next, he dropped his line into the water. Then he waited, and waited. Nothing bit. Eli wanted
