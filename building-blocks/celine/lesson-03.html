"Tell the <b>middle</b> in order. Use first, next and then.", "How does the story <b>end</b>? How does Theo feel?"], "starters": ["In the beginning, …", "First, … Next, … Then, …", "Last, … Theo feels …"]}, {"type": "recall", "kick": "Remember", "title": "Weeks 1 and 2", "items": [{"type": "fill", "q": "Round <b>649</b> to the nearest <b>hundred</b>: ____", "answers": ["600"], "why": "649 is between 600 and 700. Look at the tens digit: 4 is less than 5. Round down to <b>600</b>.", "no": "For hundreds, look at the tens digit.", "hint": "4 is less than 5. Round down.", "placeholder": "Type a number"}, {"type": "fill", "q": "Type <b>&lt;</b>, <b>&gt;</b> or <b>=</b>: &nbsp;842 ____ 824", "answers": [">", "greater than", "is greater than", "greater", "more than", "bigger than"], "why": "Hundreds are the same. Tens: 4 is more than 2. So <b>842 &gt; 824</b>.", "no": "Hundreds are the same. Look at the tens.", "placeholder": "< > or ="}, {"type": "fill", "q": "Theo reached Lookout Peak. His problem was <b>fixed</b>. That part of the story is the ____.", "answers": ["resolution"], "why": "The part where the problem gets fixed is the <b>resolution</b>.", "no": "It is a Week 2 word. It starts with r.", "hint": "r-e-s-o-…", "placeholder": "Type a word"}]}, {"type": "learn", "kick": "Remember", "title": "Add: carry the ten", "text": "<b>159 + 274</b>. Ones first. 10 or more? Carry!", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"150\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">1</text><text x=\"105\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">1</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">5</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">7</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">9</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">+</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><text x=\"195\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">3</text><text x=\"150\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">3</text><text x=\"105\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">4</text></svg>"}, "steps": [{"text": "Ones: 9 + 4 = 13. Write 3, carry 1."}, {"text": "Tens: 5 + 7 + 1 = 13. Write 3, carry 1."}, {"text": "Hundreds: 1 + 2 + 1 = 4. The sum is <b>433</b>."}], "tip": "The red 1 is a ten (or a hundred) you carried. Always add it in."}, {"type": "tap", "kick": "Try it", "title": "Add with regrouping", "text": "Use paper. Stack the numbers. Then type.", "items": [{"type": "fill", "q": "<b>236 + 145 = ____</b>", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">3</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">6</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">5</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">+</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"178\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/><rect x=\"133\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/><rect x=\"88\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/></svg>"}, "answers": ["381"], "why": "Ones: 6 + 5 = 11. Write 1, carry 1. Tens: 3 + 4 + 1 = 8. Hundreds: 2 + 1 = 3. <b>381</b>.", "no": "Did you add the carried 1?", "hint": "6 + 5 = 11. Write 1. Carry 1.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>458 + 267 = ____</b>", "answers": ["725"], "why": "Ones: 8 + 7 = 15, carry 1. Tens: 5 + 6 + 1 = 12, carry 1. Hundreds: 4 + 2 + 1 = 7. <b>725</b>.", "no": "You carry two times.", "hint": "15, then 12, then 7.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>86 + 57 = ____</b>", "answers": ["143"], "why": "Ones: 6 + 7 = 13, carry 1. Tens: 8 + 5 + 1 = 14. 14 tens = 1 hundred and 4 tens. <b>143</b>.", "no": "The tens make 14. That is 1 hundred and 4 tens.", "hint": "6 + 7 = 13. Then 8 + 5 + 1 = 14.", "placeholder": "Type a number"}]}, {"type": "learn", "kick": "Remember", "title": "Subtract: borrow a ten", "text": "<b>443 − 168</b>. Ones first. Top digit too small? Borrow!", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><line x1=\"92\" y1=\"106\" x2=\"118\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"105\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">3</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><line x1=\"137\" y1=\"106\" x2=\"163\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"150\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">13</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">6</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">3</text><line x1=\"182\" y1=\"106\" x2=\"208\" y2=\"78\" stroke=\"#DB2F30\" stroke-width=\"3\"/><text x=\"195\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#DB2F30\">13</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">8</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">−</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><text x=\"195\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">5</text><text x=\"150\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">7</text><text x=\"105\" y=\"210\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"700\" fill=\"#0047BA\">2</text></svg>"}, "steps": [{"text": "Ones: 3 − 8? Borrow. The 4 tens become 3. 13 − 8 = 5."}, {"text": "Tens: 3 − 6? Borrow again. The 4 hundreds become 3. 13 − 6 = 7."}, {"text": "Hundreds: 3 − 1 = 2. The difference is <b>275</b>."}], "tip": "Never flip it! If the top digit is too small, borrow."}, {"type": "tap", "kick": "Try it", "title": "Subtract with regrouping", "text": "Use paper. Cross out and write the new digits.", "items": [{"type": "fill", "q": "<b>372 − 145 = ____</b>", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 250 232\" width=\"100%\" style=\"max-width:260px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">H</text><text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">T</text><text x=\"195\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5b6578\">O</text><text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">3</text><text x=\"105\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">1</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">7</text><text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">4</text><text x=\"195\" y=\"104\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">2</text><text x=\"195\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">5</text><text x=\"50\" y=\"150\" text-anchor=\"middle\" font-size=\"36\" fill=\"#0A1F3D\">−</text><line x1=\"32\" y1=\"166\" x2=\"222\" y2=\"166\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><rect x=\"178\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/><rect x=\"133\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/><rect x=\"88\" y=\"180\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"2\"/></svg>"}, "answers": ["227"], "why": "Ones: 2 − 5? Borrow. 12 − 5 = 7. Tens: 6 − 4 = 2. Hundreds: 3 − 1 = 2. <b>227</b>.", "no": "The 7 tens become 6 after you borrow.", "hint": "12 − 5 = 7. Then 6 − 4.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>624 − 358 = ____</b>", "answers": ["266"], "why": "Ones: 4 − 8? Borrow. 14 − 8 = 6. Tens: 1 − 5? Borrow. 11 − 5 = 6. Hundreds: 5 − 3 = 2. <b>266</b>.", "no": "You borrow two times.", "hint": "14 − 8 = 6. The tens are now 1, so borrow again.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>400 − 172 = ____</b>", "answers": ["228"], "why": "The zeros: 4 hundreds → 3, tens → 9, ones → 10. 10 − 2 = 8. 9 − 7 = 2. 3 − 1 = 2. <b>228</b>.", "no": "Zero can't lend. Start at the hundreds.", "hint": "The tens become 9. The ones become 10.", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Try it", "title": "Camp stories", "text": "Is it <b>in all</b> (add) or <b>left</b> (subtract)?", "items": [{"q": "The camp store had <b>325</b> marshmallows. Campers bought <b>148</b>. How many are <b>left</b>?", "choices": ["473", "223", "177"], "a": 2, "why": "Left means subtract. 325 − 148: 15 − 8 = 7, 11 − 4 = 7, 2 − 1 = 1. <b>177</b>.", "no": ["That is 325 + 148. Left means subtract.", "In the ones you did 8 − 5. 5 is too small, so borrow.", null]}, {"type": "fill", "q": "Theo saw <b>47</b> birds in the morning. He saw <b>85</b> birds in the afternoon. How many birds <b>in all</b>?", "answers": ["132"], "why": "In all means add. 47 + 85: 7 + 5 = 12, carry 1. 4 + 8 + 1 = 13. <b>132</b>.", "no": "In all means add. Ones first.", "hint": "7 + 5 = 12. Then 4 + 8 + 1 = 13.", "placeholder": "Type a number"}]}, {"type": "learn", "kick": "Remember", "title": "Story order", "text": "A story has a <b>beginning</b>, a <b>middle</b> and an <b>end</b>.", "visual": {"kind": "bigtext", "text": "First → Next → Then → Last", "sub": "transition words show the order"}, "tip": "The order things happen in is called the <b>sequence</b>."}, {"type": "tap", "kick": "Read", "title": "Jada's Pancakes", "text": "Read the story. Then answer.", "visual": {"kind": "passage", "text": "<b>Jada's Pancakes</b><br>Jada and her grandma wanted a special breakfast. <b>First</b>, they got out a big bowl. <b>Next</b>, they mixed flour, eggs and milk. <b>Then</b>, Grandma poured the batter on the hot pan. <b>Last</b>, they ate the pancakes with strawberries. Jada said it was the best breakfast ever!"}, "items": [{"q": "What did they do right <b>after</b> they mixed flour, eggs and milk?", "choices": ["They got out a big bowl.", "They ate pancakes with strawberries.", "Grandma poured the batter."], "a": 2, "why": "<b>Then</b>, Grandma poured the batter on the hot pan. That comes right after mixing.", "no": ["That happened <b>first</b>, before the mixing.", "Eating came <b>last</b>.", null]}, {"type": "fill", "q": "Which transition word tells you the <b>final</b> step? Type it.", "answers": ["last", "lastly"], "why": "<b>Last</b>, they ate the pancakes.", "no": "Look at the last sentence that starts with a bold word.", "placeholder": "Type a word"}, {"type": "fill", "q": "“Jada said it was the best breakfast ever!” Is this the <b>beginning</b>, <b>middle</b> or <b>end</b>?", "answers": ["end", "the end", "ending"], "why": "It wraps up the story with a feeling. It is the <b>end</b>.", "no": "Is the cooking still going on?", "placeholder": "Type one word"}]}, {"type": "order", "kick": "Sequence", "title": "Ben's library trip", "text": "Tap the events in order.", "steps": ["Ben and Mom walked into the library.", "He picked out three books about sharks.", "He checked out the books at the desk.", "He carried the books home in his backpack.", "At home, he read the first shark book in bed."], "why": "Get there, pick the books, check them out, carry them home, read.", "hint": "Not that one yet. What has to happen first?"}, {"type": "tap", "kick": "Word Power", "title": "Words from memory", "text": "No peeking! Type each word.", "items": [{"type": "fill", "q": "Theo has 12 tens. He trades 10 tens for 1 hundred. What is this trade called? Type the math word.", "answers": ["regroup", "regrouping", "regrouped"], "why": "Trading 10 of one place for 1 of the next place is called <b>regroup</b> (regrouping).", "no": "It starts with r-e-g.", "placeholder": "Type a word"}, {"type": "fill", "q": "<b>Sum</b> or <b>difference</b>? The answer to 90 − 30 is the ____.", "answers": ["difference"], "why": "90 − 30 is subtracting. The answer when you subtract is the <b>difference</b>.", "no": "Sum is for adding. What is it for subtracting?", "hint": "d-i-f-…", "placeholder": "Type a word"}, {"type": "fill", "q": "Put on socks. Then put on shoes. Then tie the laces. The order of these steps is the ____.", "answers": ["sequence"], "why": "The order things happen in is the <b>sequence</b>.", "no": "It starts with s-e-q.", "placeholder": "Type a word"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "<b>357 + 238 = ____</b>", "answers": ["595"], "why": "Ones: 7 + 8 = 15, write 5, carry 1. Tens: 5 + 3 + 1 = 9. Hundreds: 3 + 2 = 5. <b>595</b>.", "no": "Ones first: 7 + 8. Then add the carried 1 in the tens.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>469 + 284 = ____</b>", "answers": ["753"], "why": "Ones: 9 + 4 = 13, write 3, carry 1. Tens: 6 + 8 + 1 = 15, write 5, carry 1. Hundreds: 4 + 2 + 1 = 7. <b>753</b>.", "no": "You carry two times. Add each carried 1.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>543 − 276 = ____</b>", "answers": ["267"], "why": "Ones: 3 − 6? Borrow. 13 − 6 = 7. Tens: 3 − 7? Borrow. 13 − 7 = 6. Hundreds: 4 − 2 = 2. <b>267</b>.", "no": "Top digit too small? Borrow. You borrow two times here.", "placeholder": "Type a number"}, {"q": "The camp store had <b>300</b> granola bars. It sold <b>146</b>. How many are <b>left</b>?", "choices": ["446", "246", "154", "164"], "a": 2, "why": "300 − 146: the zeros become 2 hundreds, 9 tens and 10 ones. 10 − 6 = 4, 9 − 4 = 5, 2 − 1 = 1. <b>154</b>.", "no": ["That is 300 + 146. Left means subtract.", "You took the small digit from the big one (6 − 0). Borrow instead.", null, "The tens became 10, but they lend 1 to the ones. They should be 9."]}, {"type": "fill", "q": "Add 40 + 6. The answer, 46, is called the ____.", "answers": ["sum"], "why": "The answer when you add is the <b>sum</b>.", "no": "It is a short word. Difference is for subtracting.", "placeholder": "Type a word"}, {"q": "What did they do right after they rolled out the dough?", "visual": {"kind": "passage", "text": "<b>Pizza Night</b><br>Nia and her mom made a pizza. <b>First</b>, they rolled out the dough. <b>Next</b>, they spread red sauce on top. <b>Then</b>, they added cheese and peppers. <b>Last</b>, the pizza baked in the oven until it bubbled. Nia ate two slices."}, "choices": ["They spread red sauce on top.", "They added cheese and peppers.", "The pizza baked in the oven."], "a": 0, "why": "<b>Next</b>, they spread red sauce on top.", "no": [null, "The cheese came <b>then</b>, after the sauce.", "Baking came <b>last</b>."]}, {"type": "fill", "q": "Which transition word comes before “the pizza baked in the oven”? Type it.", "visual": {"kind": "passage", "text": "<b>Pizza Night</b><br>Nia and her mom made a pizza. <b>First</b>, they rolled out the dough. <b>Next</b>, they spread red sauce on top. <b>Then</b>, they added cheese and peppers. <b>Last</b>, the pizza baked in the oven until it bubbled. Nia ate two slices."}, "answers": ["last", "lastly"], "why": "<b>Last</b>, the pizza baked in the oven.", "no": "Which bold word is in the last part?", "placeholder": "Type a word"}, {"type": "fill", "q": "“Nia and her mom made a pizza.” Is this the <b>beginning</b>, <b>middle</b> or <b>end</b>?", "visual": {"kind": "passage", "text": "<b>Pizza Night</b><br>Nia and her mom made a pizza. <b>First</b>, they rolled out the dough. <b>Next</b>, they spread red sauce on top. <b>Then</b>, they added cheese and peppers. <b>Last</b>, the pizza baked in the oven until it bubbled. Nia ate two slices."}, "answers": ["beginning", "the beginning"], "why": "It tells who is in the story and what they will do. It is the <b>beginning</b>.", "no": "Is this the first sentence?", "placeholder": "Type one word"}], [{"type": "fill", "q": "<b>239 + 146 = ____</b>", "answers": ["385"], "why": "Ones: 9 + 6 = 15, write 5, carry 1. Tens: 3 + 4 + 1 = 8. Hundreds: 2 + 1 = 3. <b>385</b>.", "no": "Ones first: 9 + 6. Then add the carried 1 in the tens.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>387 + 245 = ____</b>", "answers": ["632"], "why": "Ones: 7 + 5 = 12, write 2, carry 1. Tens: 8 + 4 + 1 = 13, write 3, carry 1. Hundreds: 3 + 2 + 1 = 6. <b>632</b>.", "no": "You carry two times. Add each carried 1.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>732 − 458 = ____</b>", "answers": ["274"], "why": "Ones: 2 − 8? Borrow. 12 − 8 = 4. Tens: 2 − 5? Borrow. 12 − 5 = 7. Hundreds: 6 − 4 = 2. <b>274</b>.", "no": "Top digit too small? Borrow. You borrow two times here.", "placeholder": "Type a number"}, {"q": "A farm had <b>500</b> apples. It sold <b>263</b>. How many apples are <b>left</b>?", "choices": ["763", "237", "363", "247"], "a": 1, "why": "500 − 263: the zeros become 4 hundreds, 9 tens and 10 ones. 10 − 3 = 7, 9 − 6 = 3, 4 − 2 = 2. <b>237</b>.", "no": ["That is 500 + 263. Left means subtract.", null, "You took the small digit from the big one (3 − 0). Borrow instead.", "The tens became 10, but they lend 1 to the ones. They should be 9."]}, {"type": "fill", "q": "In 52 − 7, the 2 is too small. You ____ 1 ten from the tens. Type the math word.", "answers": ["borrow", "borrowed", "regroup"], "why": "You <b>borrow</b> 1 ten. Now you have 12 ones. 12 − 7 = 5.", "no": "This word goes with subtracting.", "placeholder": "Type a word"}, {"q": "What di
