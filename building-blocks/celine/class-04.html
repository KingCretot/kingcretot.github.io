<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ce&#x27;Line · Lesson 4: Solve It, Estimate It and The Last S&#x27;more</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L04", "label": "Lesson 4", "title": "Solve It, Estimate It and The Last S'more", "goal": "I can find the clue word, add or subtract, estimate to check, and tell the lesson a story teaches.", "date": "2026-12-01", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Welcome Back, Ce'Line!", "text": "It has been three weeks. I am so glad you are here! 🎉<br>First, a quick look back. Then two new skills: <b>word problems</b> and the <b>theme</b> of a story.", "visual": {"kind": "emoji", "text": "👋🧭🔥"}, "notes": {"do": "Before class: laptop open to this class lesson (code 9110), small whiteboard and 2 markers, a highlighter, 8 index cards (4 say ADD on green, 4 say SUBTRACT on orange), scrap paper and a pencil, and her printed Packet for Lesson 4. Sit side by side so she can tap and type herself.", "say": "Welcome back! We had a long break, so today we warm up first. Then you learn two new things. You are going to do great.", "ask": "How was your break? What was the best part?", "listen": "Any answer. Smile, keep it short (1–2 minutes), and let her talk. This lesson is about confidence first."}}, {"type": "talk", "kick": "Welcome Back", "title": "What do you remember?", "text": "Before the break, you followed <b>Theo</b> on his hike and his camping trip. You also worked with big numbers.", "visual": {"kind": "emoji", "text": "🥾⛺🔢"}, "prompts": ["Tell me one thing about your break.", "What do you remember about <b>Theo</b>?", "What do you remember about <b>regrouping</b>?"], "starters": ["Over the break, I …", "I remember Theo …", "When I regroup, I …"], "notes": {"do": "2–3 minutes. She answers out loud in full sentences. Do not correct yet; just listen for what she kept.", "ask": "Who is Mia? What did Theo use to find the way when the sign was gone?", "listen": "Mia is Theo's little sister. Theo used his compass and the trail map. If she remembers neither, that is fine: the next two slides review it."}}, {"type": "recall", "kick": "Remember", "title": "Number skills from Weeks 1–3", "text": "Work on paper, then type.", "items": [{"type": "fill", "q": "Round <b>368</b> to the nearest <b>ten</b>: ____", "answers": ["370"], "why": "The ones digit is 8. 5 or more rounds up. 368 rounds to <b>370</b>.", "no": "Look at the ones digit. 5 or more rounds up.", "hint": "368 is between 360 and 370.", "placeholder": "Type a number"}, {"q": "Which sign makes this true? <b>826 ___ 862</b>", "choices": [">", "<", "="], "a": 1, "why": "Hundreds are the same (8). Tens: 2 is less than 6. So <b>826 &lt; 862</b>.", "no": ["That says 826 is bigger. Compare the tens: 2 tens and 6 tens.", null, "= means the same. These numbers are not the same."]}, {"type": "fill", "q": "<b>246 + 178 = ____</b>", "answers": ["424"], "why": "6 + 8 = 14: write 4, carry 1. 4 + 7 + 1 = 12: write 2, carry 1. 2 + 1 + 1 = 4. <b>424</b>.", "no": "Ones first: 6 + 8 = 14. Write 4 and carry 1 ten.", "hint": "Tens: 4 + 7 + the carried 1.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>432 − 157 = ____</b>", "answers": ["275"], "why": "2 − 7: borrow, 12 − 7 = 5. 2 − 5: borrow, 12 − 5 = 7. 3 − 1 = 2. <b>275</b>.", "no": "Ones: 2 − 7 needs a borrow. Make it 12 − 7.", "hint": "Check: 275 + 157 = 432.", "placeholder": "Type a number"}], "notes": {"do": "She works each one on scrap paper first, then types. Praise every correct step out loud.", "ask": "On 246 + 178: what did you carry, and where did it go?", "listen": "370, &lt;, 424, 275. If she gets 314 for the addition she did not carry; if she gets 325 for the subtraction she took the small digit from the big one. Fix it on the whiteboard in 1 minute and move on; today's word problems use these skills again."}}, {"type": "recall", "kick": "Remember", "title": "Story skills from Weeks 1–3", "text": "Think about Theo's hike and his camping trip.", "items": [{"q": "Theo hiked on a misty morning, up the trail to Lookout Peak. That is the story's …", "choices": ["character", "setting", "conflict"], "a": 1, "why": "<b>Setting</b> is where and when a story happens: the trail, a misty morning.", "no": ["A character is a person or animal, like Theo.", null, "The conflict is the problem. This sentence tells where and when."]}, {"type": "fill", "q": "The trail sign was gone, and Theo did not know which way to go. The problem in a story is called the ____.", "answers": ["conflict", "the conflict"], "why": "The problem a character faces is the <b>conflict</b>.", "no": "It is a Week 2 word. It starts with c-o-n.", "hint": "c-o-n-f-…", "placeholder": "Type one word"}, {"q": "How did Theo solve his problem?", "choices": ["He turned around and went home.", "He used his compass and his map.", "He sat down and waited for someone to help him."], "a": 1, "why": "Theo used the <b>compass</b> and the <b>map</b> to find north. That is the <b>resolution</b>.", "no": ["He thought about turning back, but he did not.", null, "No. Theo solved the problem all on his own."]}, {"type": "fill", "q": "“FIRST, they pitched the tent. ____, Theo gathered branches.” Type the missing order word.", "answers": ["next", "then", "second", "after that", "later", "afterward", "afterwards"], "why": "<b>Next</b> (or <b>then</b>) shows the order. Words like these are transition words.", "no": "Use an order word like first, next, then or last.", "placeholder": "Type one word"}], "notes": {"do": "She reads each one out loud before she answers.", "ask": "What is the beginning, middle and end of Theo's camping trip?", "listen": "Beginning: they pack and Mia gets to come. Middle: tent, fire, chili. End: dishes in the stream and the stars. If she cannot say it, tell it in three sentences and have her repeat it. Today's story happens at that same campfire."}}, {"type": "vocab", "kick": "Word Power", "title": "Math words for today", "text": "Tap each card to flip it. Read the word and the meaning out loud.", "words": [{"word": "word problem", "pos": "noun", "meaning": "A math problem told as a story.", "example": "“Ali has 5 pens. He gets 3 more. How many pens now?” is a <b>word problem</b>.", "emoji": "📖"}, {"word": "clue word", "pos": "noun", "meaning": "A word in a word problem that tells you to add or subtract.", "example": "<b>Left</b> is a <b>clue word</b>. It tells me to subtract.", "emoji": "🔎"}, {"word": "total", "pos": "noun", "meaning": "The whole amount after you add everything.", "example": "136 books and 285 books make a <b>total</b> of 421 books.", "emoji": "🧺"}, {"word": "estimate", "pos": "noun or verb", "meaning": "A close, smart guess. You round first, then add or subtract.", "example": "238 + 451 is about 200 + 500. My <b>estimate</b> is 700.", "emoji": "🎯"}, {"word": "reasonable", "pos": "adjective", "meaning": "Makes sense. It is close to what you expect.", "example": "689 is <b>reasonable</b> for 238 + 451. 89 is not.", "emoji": "👍"}], "notes": {"do": "She reads each card aloud, then says the meaning in her own words.", "say": "These five words are the tools for word problems. You will type some of them from memory later.", "ask": "What is the difference between an estimate and the exact answer?", "listen": "An estimate is close, made with round numbers. The exact answer is the real answer. Both matter: the estimate checks the exact answer."}}, {"type": "learn", "kick": "Learn", "title": "Clue words tell you what to do", "text": "A <b>word problem</b> is a math story. The <b>clue words</b> tell you to <b>add</b> or <b>subtract</b>.", "steps": [{"text": "<b>Add</b> clue words: <b>in all</b>, <b>altogether</b>, <b>total</b>, <b>sum</b>, <b>both</b>.", "visual": {"kind": "bigtext", "text": "➕ in all · altogether · total"}}, {"text": "“The library has <b>136</b> picture books and <b>285</b> chapter books. How many books <b>in all</b>?”"}, {"text": "<b>In all</b> means add. 136 + 285 = <b>421</b> books.", "visual": {"kind": "bigtext", "text": "136 + 285 = 421"}}, {"text": "<b>Subtract</b> clue words: <b>left</b>, <b>remain</b>, <b>how many more</b>, <b>difference</b>.", "visual": {"kind": "bigtext", "text": "➖ left · remain · how many more"}}, {"text": "“The library has <b>400</b> bookmarks. Kids took <b>162</b>. How many are <b>left</b>?”"}, {"text": "<b>Left</b> means subtract. 400 − 162 = <b>238</b> bookmarks.", "visual": {"kind": "bigtext", "text": "400 − 162 = 238"}}], "tip": "Find the clue word first. Then decide: add or subtract?", "notes": {"do": "Click the steps one at a time. She highlights the clue word on a scrap-paper copy of each story. Work 136 + 285 and 400 − 162 on the whiteboard together, with her saying each step.", "say": "Adding and subtracting is not the hard part. You already know how. The hard part is choosing. The clue word chooses for you.", "ask": "In 400 − 162, the ones are 0 − 2. What do we do?", "listen": "Borrow. 400 has no tens, so she borrows from the hundreds first: 3 hundreds, 9 tens, 10 ones. 10 − 2 = 8, 9 − 6 = 3, 3 − 1 = 2: 238. If she freezes, show it with the whiteboard, step by step."}}, {"type": "sort", "kick": "Sort it", "title": "Add or subtract?", "text": "Tap a card. Then tap the right box.", "buckets": ["➕ Add", "➖ Subtract"], "items": [{"text": "How many pets in all?", "b": 0, "why": "<b>In all</b> asks for the total. Add.", "hint": "Is it asking for the whole amount?"}, {"text": "How many cookies are left?", "b": 1, "why": "<b>Left</b> means some went away. Subtract.", "hint": "Did some go away?"}, {"text": "What is the total cost?", "b": 0, "why": "<b>Total</b> means put it all together. Add.", "hint": "Total is the whole amount."}, {"text": "How many more seats do we need?", "b": 1, "why": "<b>How many more</b> asks for the gap. Subtract.", "hint": "It asks for the gap between two numbers."}, {"text": "How many stickers altogether?", "b": 0, "why": "<b>Altogether</b> means all together. Add.", "hint": "All together means the whole amount."}, {"text": "How many apples remain?", "b": 1, "why": "<b>Remain</b> means what is still there. Subtract.", "hint": "Remain means what is still there after some are gone."}, {"text": "What is the difference between the two scores?", "b": 1, "why": "<b>Difference</b> is the answer when you subtract.", "hint": "Difference was a Week 3 word."}, {"text": "How many books did both girls read?", "b": 0, "why": "<b>Both</b> puts two amounts together. Add.", "hint": "Both girls together."}], "done": "In all, total, altogether, both: add. Left, remain, how many more, difference: subtract.", "notes": {"do": "Hand her the 8 index cards first: she sorts the paper cards into ADD and SUBTRACT piles, then does it on screen.", "ask": "Why is “how many more” a subtract clue, even though it says “more”?", "listen": "It asks for the gap between two numbers. “More” tricks a lot of students into adding. If she puts it in Add, have her find the gap between 5 and 8 with her fingers: 3, which is 8 − 5."}}, {"type": "tap", "kick": "Your turn", "title": "Be a word problem detective", "text": "Find the clue word. Decide. Then solve on paper.", "items": [{"type": "fill", "q": "The pet shop had 341 fish. It sold 156 fish. How many fish are <b>left</b>? Add or subtract? Type <b>add</b> or <b>subtract</b>.", "answers": ["subtract", "subtraction", "subtracting", "minus", "take away", "-"], "why": "The clue words ask what is <b>left</b> or the <b>gap</b>, so you <b>subtract</b>.", "no": "Find the clue word first. Does it ask for a total, or for what is left or the gap?", "placeholder": "add or subtract"}, {"type": "fill", "q": "The pet shop had <b>341</b> fish. It sold <b>156</b> fish. How many fish are left?", "answers": ["185", "about 185"], "why": "The clue word means subtract. <b>341 − 156 = 185</b> fish.", "no": "Subtract 341 − 156. Start with the ones. Borrow when the top digit is too small.", "hint": "Check: 185 + 156 should make 341.", "placeholder": "Type a number"}, {"type": "fill", "q": "Rosa's team picked <b>167</b> apples. Kim's team picked <b>258</b> apples. How many apples did they pick <b>altogether</b>?", "answers": ["425", "about 425"], "why": "The clue word means add. <b>167 + 258 = 425</b> apples.", "no": "Add 167 + 258. Line up the ones. Regroup when a column makes 10 or more.", "hint": "Ones first: 7 + 8 = 15.", "placeholder": "Type a number"}], "notes": {"do": "She reads each problem out loud, puts her finger on the clue word, and says “add” or “subtract” BEFORE she touches the pencil.", "say": "Detective steps: read it, find the clue word, decide, then solve.", "ask": "What is the clue word in the apple problem?", "listen": "subtract; 185; altogether, 425. If she types 497 for the fish, she added: point back to “left.” If she types 215, she took the small digit from the big digit in each column: redo it with borrowing on the whiteboard."}}, {"type": "learn", "kick": "Learn", "title": "Estimate: round first", "text": "An <b>estimate</b> is a close, smart guess. Round each number to the nearest <b>hundred</b>. Then add or subtract.", "steps": [{"text": "Estimate <b>238 + 451</b>."}, {"text": "238: the tens digit is <b>3</b>. Less than 5, so round <b>down</b> to <b>200</b>."}, {"text": "451: the tens digit is <b>5</b>. 5 or more, so round <b>up</b> to <b>500</b>."}, {"text": "200 + 500 = <b>700</b>. So 238 + 451 is <b>about 700</b>.", "visual": {"kind": "bigtext", "text": "238 + 451 ≈ 700", "sub": "≈ means about"}}, {"text": "It works for subtracting too. <b>612 − 389</b>: 600 − 400 = <b>200</b>.", "visual": {"kind": "bigtext", "text": "612 − 389 ≈ 200"}}], "tip": "To round to the nearest hundred, look at the <b>tens</b> digit.", "notes": {"do": "Draw a number line from 200 to 300 on the whiteboard. Mark 238 and ask which hundred it is closer to. Then do 451 between 400 and 500.", "say": "Estimating is fast. Round, then do easy math with zeros.", "ask": "What is the exact answer to 238 + 451? Is it close to 700?", "listen": "689. Yes, it is close to 700. That is the point: the estimate tells you about how big the answer should be."}}, {"type": "tap", "kick": "Try it", "title": "Round and estimate", "text": "Look at the tens digit. Then round.", "items": [{"type": "fill", "q": "Round <b>274</b> to the nearest hundred: ____", "answers": ["300"], "why": "Look at the tens digit: <b>7</b>. 5 or more rounds up. So 274 rounds to <b>300</b>.", "no": "Look at the tens digit. 5 or more rounds up. Less than 5 rounds down.", "hint": "274 is between 200 and 300. Which is it closer to?", "placeholder": "Type a number"}, {"type": "fill", "q": "Round <b>639</b> to the nearest hundred: ____", "answers": ["600"], "why": "Look at the tens digit: <b>3</b>. Less than 5 rounds down. So 639 rounds to <b>600</b>.", "no": "Look at the tens digit. 5 or more rounds up. Less than 5 rounds down.", "hint": "639 is between 600 and 700. Which is it closer to?", "placeholder": "Type a number"}, {"type": "fill", "q": "Round each number to the nearest hundred. Then add. Estimate <b>326 + 481</b>: ____", "answers": ["800", "about 800"], "why": "326 rounds to 300. 481 rounds to 500. 300 + 500 = <b>800</b>.", "no": "Round first: 326 → ?, 481 → ?. Then add the round numbers.", "hint": "326 rounds to 300.", "placeholder": "Type a number"}, {"type": "fill", "q": "Round each number to the nearest hundred. Then subtract. Estimate <b>715 − 292</b>: ____", "answers": ["400", "about 400"], "why": "715 rounds to 700. 292 rounds to 300. 700 − 300 = <b>400</b>.", "no": "Round first: 715 → ?, 292 → ?. Then subtract the round numbers.", "hint": "715 rounds to 700.", "placeholder": "Type a number"}], "notes": {"do": "She says the tens digit out loud before every answer.", "ask": "For 715 − 292: why does 292 round up to 300?", "listen": "300, 600, 800, 400. The tens digit of 292 is 9, and 9 is 5 or more, so it rounds up. If she rounds 274 to 270, she rounded to the nearest ten: say, “Hundreds today. Look at the tens digit.”"}}, {"type": "learn", "kick": "Learn", "title": "Is my answer reasonable?", "text": "A <b>reasonable</b> answer is close to your estimate. Use the estimate to check your work.", "steps": [{"text": "<b>352 + 417</b>. Estimate: 400 + 400 = <b>800</b>."}, {"text": "Ana got <b>769</b>. That is close to 800. ✅ Reasonable."}, {"text": "Ben got <b>65</b>. That is way too small. ❌ He subtracted instead of adding."}, {"text": "Another check: when you <b>add</b>, the answer is <b>bigger</b> than both numbers. When you take some away, the answer is <b>smaller</b> than the start."}], "visual": {"kind": "bigtext", "text": "352 + 417 ≈ 800"}, "tip": "If your answer is far from the estimate, go back and check.", "notes": {"do": "She solves 352 + 417 on paper first, to see 769 for herself.", "say": "Your estimate is your alarm. If the answer is far away, the alarm rings.", "ask": "Why can't the answer to an “in all” problem be smaller than the numbers you started with?", "listen": "Because adding puts things together, so you get more. If she says it can, show 3 cards plus 2 cards on the table: 5, more than either pile."}}, {"type": "tap", "kick": "Your turn", "title": "Does it make sense?", "text": "Estimate first. Then choose.", "items": [{"q": "Estimate first: <b>409 + 288</b> is about 400 + 300 = <b>700</b>. Which answer is <b>reasonable</b>?", "choices": ["121", "697", "6,970"], "a": 1, "why": "409 + 288 = <b>697</b>. It is close to the estimate, 700.", "no": ["121 is what you get if you subtract. This problem adds.", null, "6,970 is about ten times too big. It is not close to 700."]}, {"q": "A school has <b>512</b> students. <b>238</b> ride the bus home. How many students do <b>not</b> ride the bus?", "choices": ["750", "326", "274"], "a": 2, "why": "Some students go on the bus, so subtract: 512 − 238 = <b>274</b>. Estimate: 500 − 200 = 300. 274 is close.", "no": ["750 is 512 + 238. But the answer must be smaller than 512, because some students are on the bus.", "326 came from taking the small digit from the big digit in each column. 2 − 8 needs a borrow.", null]}], "notes": {"do": "She says the estimate out loud first. For the bus problem, she does 512 − 238 on paper.", "ask": "Which wrong answer would the estimate catch right away?", "listen": "697, then 274. 121 and 6,970 are far from 700; 750 is bigger than 512, which cannot happen when some students leave. 326 is a borrowing mistake: the estimate does not catch it, so she has to check her work."}}, {"type": "tap", "kick": "Exit ticket", "title": "Math check", "text": "On your own. Clue word, estimate, solve, check.", "items": [{"type": "fill", "q": "A bakery made <b>430</b> muffins. It sold <b>276</b> muffins. How many muffins are left?", "answers": ["154", "about 154"], "why": "The clue word means subtract. <b>430 − 276 = 154</b> muffins.", "no": "Subtract 430 − 276. Start with the ones. Borrow when the top digit is too small.", "hint": "Check: 154 + 276 should make 430.", "placeholder": "Type a number"}, {"type": "fill", "q": "Round each number to the nearest hundred. Then subtract. Estimate <b>430 − 276</b>: ____", "answers": ["100", "about 100"], "why": "430 rounds to 400. 276 rounds to 300. 400 − 300 = <b>100</b>.", "no": "Round first: 430 → ?, 276 → ?. Then subtract the round numbers.", "hint": "430 rounds to 400.", "placeholder": "Type a number"}, {"type": "fill", "q": "Jamal read <b>186</b> pages in May and <b>247</b> pages in June. How many pages did he read in all?", "answers": ["433", "about 433"], "why": "The clue word means add. <b>186 + 247 = 433</b> pages.", "no": "Add 186 + 247. Line up the ones. Regroup when a column makes 10 or more.", "hint": "Ones first: 6 + 7 = 13.", "placeholder": "Type a number"}], "notes": {"do": "Hands off. She works alone on paper and types. Write down her first answers.", "listen": "154, 100, 433. All three right on the first try means the math half of the Pathways Week 4 retake is in reach. A wrong operation means 2 more minutes with the ADD/SUBTRACT cards at the start of next week."}}, {"type": "vocab", "kick": "Word Power", "title": "Reading words for today", "text": "Tap each card to flip it. Read the word and the meaning out loud.", "words": [{"word": "theme", "pos": "noun", "meaning": "The big lesson about life that a story teaches.", "example": "The <b>theme</b> of a story can be “Never give up.”", "emoji": "💡"}, {"word": "lesson", "pos": "noun", "meaning": "Something important you learn.", "example": "Sam learned a <b>lesson</b>: practice helps.", "emoji": "🎒"}, {"word": "moral", "pos": "noun", "meaning": "The lesson at the end of a fable.", "example": "The <b>moral</b> of a fable can be “Slow and steady wins the race.”", "emoji": "🦊"}, {"word": "kindness", "pos": "noun", "meaning": "Being caring and giving to other people.", "example": "Sharing your snack is an act of <b>kindness</b>.", "emoji": "💛"}], "notes": {"do": "She reads each card aloud and gives one example from her own life for “lesson” and “kindness.”", "say": "Every story tells what happens. Many stories also teach a lesson. That lesson is the theme.", "ask": "What is a lesson you learned the hard way?", "listen": "Any real example (“I learned to save my work”). Connect it: a story's theme is the same kind of lesson."}}, {"type": "talk", "kick": "Book Talk", "title": "The Last S'more, Part 1", "text": "Back at the campfire, Theo has a choice to make. Read it with Mr. Jonathan.", "visual": {"kind": "passage", "text": "After dinner, Theo and Mia roasted marshmallows over the campfire. There was only ONE marshmallow left in the bag. Theo reached for it first. His fingers were almost touching it when he glanced at Mia. She was staring at the empty bag with a small, disappointed frown, trying hard not to show it."}, "prompts": ["How does <b>Mia</b> feel? What clue tells you?", "What do you think Theo will do?", "What would <b>you</b> do?"], "starters": ["I think Mia feels … because …", "I think Theo will … because …", "If I were Theo, I would …"], "notes": {"do": "Read it together: you read the first sentence, she reads the next, and so on. 5 minutes in all.", "say": "The story never says how Mia feels. We figure it out from clues. That is called inferring.", "ask": "Why does the author spend so many words on one little marshmallow?", "listen": "Mia wants it too but is trying to hide it (clue: the small, disappointed frown). Something important is about to happen. Accept any reasonable prediction with a “because.”"}}, {"type": "tap", "kick": "Read", "title": "Clues in Part 1", "visual": {"kind": "passage", "text": "After dinner, Theo and Mia roasted marshmallows over the campfire. There was only ONE marshmallow left in the bag. Theo reached for it first. His fingers were almost touching it when he glanced at Mia. She was staring at the empty bag with a small, disappointed frown, trying hard not to show it."}, "items": [{"type": "fill", "q": "What was Mia staring at?", "answers": ["the empty bag", "empty bag", "an empty bag", "the bag", "bag", "the marshmallow bag", "marshmallow bag", "the empty marshmallow bag", "empty marshmallow bag", "the bag of marshmallows"], "why": "Mia was staring at <b>the empty bag</b>.", "no": "Look at the last sentence of the story.", "placeholder": "Type a few words"}, {"q": "Which clue shows how Mia feels?", "choices": ["“After dinner”", "“over the campfire”", "“a small, disappointed frown”", "“His fingers were almost touching it”"], "a": 2, "why": "The <b>frown</b> is a clue. Mia wants the marshmallow too, but she tries not to show it.", "no": ["That tells when, not how Mia feels.", "That tells where, not how Mia feels.", null, "That is about Theo, not how Mia feels."]}, {"type": "fill", "q": "Who reached for the last marshmallow first?", "answers": ["Theo"], "why": "<b>Theo</b> reached for it first.", "no": "Look at the third sentence.", "placeholder": "Type a name"}], "notes": {"do": "She answers on her own, then points to the words in the story that prove it.", "ask": "Point to the words that prove your answer.", "listen": "the empty bag; the frown; Theo. Praise “pointing to the proof” every time. That habit wins points on the Pathways retake."}}, {"type": "learn", "kick": "Read", "title": "The Last S'more, Part 2", "text": "Now see what Theo decides.", "visual": {"kind": "passage", "text": "Theo's hand hovered over the marshmallow. He could hear his stomach thinking about how good it would taste. But he kept looking at Mia's face. He remembered how she'd begged for weeks to come on this trip. Slowly, Theo picked up the marshmallow and broke it in half. “Here,” he said, holding out the bigger piece to Mia. “Race you to see who can make theirs melt the gooiest.”"}, "steps": [{"text": "Theo <b>could</b> have kept the whole marshmallow. Nobody would stop him."}, {"text": "Theo <b>chose</b> to break it in half and give Mia the <b>bigger</b> piece."}, {"text": "He made it a fun race, so Mia would not feel bad."}], "tip": "When a character makes a choice, ask: What does this teach me?", "notes": {"do": "She reads Part 2 out loud. Then click the steps one at a time.", "say": "This is the big moment of the story. Theo had a choice.", "ask": "Why did Theo give Mia the bigger piece, and not just half?", "listen": "He was really thinking about her feelings. He remembered how much she wanted to come on the trip."}}, {"type": "tap", "kick": "Read", "title": "Theo's choice", "visual": {"kind": "passage", "text": "Theo's hand hovered over the marshmallow. He could hear his stomach thinking about how good it would taste. But he kept looking at Mia's face. He remembered how she'd begged for weeks to come on this trip. Slowly, Theo picked up the marshmallow and broke it in half. “Here,” he said, holding out the bigger piece to Mia. “Race you to see who can make theirs melt the gooiest.”"}, "items": [{"type": "fill", "q": "What did Theo do with the marshmallow? He ____ it in half.", "answers": ["broke", "split", "snapped", "tore", "cut"], "why": "Theo <b>broke</b> it in half.", "no": "Look for the word right before “in half.”", "placeholder": "Type one word"}, {"q": "What clue shows Theo really cared about Mia's feelings?", "choices": ["His stomach wanted the marshmallow.", "He picked it up slowly.", "He gave Mia the bigger piece.", "It was after dinner."], "a": 2, "why": "He gave Mia the <b>bigger</b> piece. That shows he put her first.", "no": ["That shows Theo wanted it himself.", "Slowly shows he was thinking, but the bigger piece shows he cared.", null, "That tells when, not what Theo felt."]}, {"type": "fill", "q": "Theo remembered something about Mia. She had ____ for weeks to come on this trip.", "answers": ["begged", "asked", "pleaded", "wanted"], "why": "Mia had <b>begged</b> for weeks. Theo remembered how much this trip meant to her.", "no": "Look at the fourth sentence.", "placeholder": "Type one word"}], "notes": {"do": "She answers, then says why in one sentence.", "listen": "broke; the bigger piece; begged. If she picks the stomach, ask: “Does wanting it yourself show you care about Mia?”"}}, {"type": "learn", "kick": "Learn", "title": "Plot or theme?", "text": "<b>Plot</b> is what happens. <b>Theme</b> is the lesson about life.", "steps": [{"text": "<b>Plot:</b> Theo shared the last marshmallow with Mia.", "visual": {"kind": "bigtext", "text": "Plot = what happens"}}, {"text": "To find the theme, ask: <b>What did the character learn?</b> What does the story teach <b>me</b>?"}, {"text": "<b>Theme:</b> Being kind to someone you love can feel better than keeping it all.", "visual": {"kind": "bigtext", "text": "Theme = the lesson"}}, {"text": "A theme is a whole idea, not one name. “Theo” is not a theme."}, {"text": "A theme must fit the story. “Always listen to your stomach” does <b>not</b> fit. Theo did the opposite!"}], "tip": "Plot tells about the story. Theme tells about life.", "notes": {"do": "Draw a T-chart on the whiteboard: PLOT | THEME. Write each step's example in the right column as you click.", "say": "The plot is only about Theo. The theme is about everybody, even you and me.", "ask": "Say the theme in your own words.", "listen": "Something like “Sharing with people you love feels good” or “Kindness matters more than a treat.” Any version about kindness or sharing is right. If she retells the plot, ask: “What does this teach YOU?”"}}, {"type": "sort", "kick": "Sort it", "title": "Plot or theme?", "text": "Tap a card. Then tap the right box.", "buckets": ["📖 Plot (what happens)", "💡 Theme (the lesson)"], "items": [{"text": "Theo and Mia roast marshmallows.", "b": 0, "why": "This tells what happens.", "hint": "Is it only about Theo and Mia?"}, {"text": "Sharing can make a moment better for everyone.", "b": 1, "why": "This is a lesson about life.", "hint": "Could this be true for anyone?"}, {"text": "Only one marshmallow is left.", "b": 0, "why": "This tells what happens.", "hint": "Is it something that happens in the story?"}, {"text": "Thinking about others' feelings is a kind choice.", "b": 1, "why": "This is a lesson about life.", "hint": "Is this a lesson for everyone?"}, {"text": "Theo breaks the marshmallow in half.", "b": 0, "why": "This tells what happens.", "hint": "Is it an action in the story?"}, {"text": "Kindness can matter more than a treat.", "b": 1, "why": "This is a lesson about life.", "hint": "Does it teach something?"}], "done": "Plot is what happens. Theme is the lesson. Great sorting!", "notes": {"do": "She reads each card out loud before she taps it.", "ask": "How can you tell a theme card fast?", "listen": "Theme cards do not name Theo or Mia; they could be true for anybody."}}, {"type": "tap", "kick": "Exit ticket", "title": "Find the moral", "text": "A <b>fable</b> is a short story that teaches a lesson.", "visual": {"kind": "passage", "text": "<b>The Ant and the Grasshopper</b><br>All summer, the ant carried food to her home. The grasshopper sang and played in the sun. “Why work so hard?” he asked. Then winter came. The ant had plenty of food. The grasshopper had nothing to eat."}, "items": [{"q": "What is the <b>moral</b> of this fable?", "choices": ["All summer long, the grasshopper sang and played in the sun.", "Singing is better than working.", "Work hard now, and you will be ready later.", "The ant"], "a": 2, "why": "The ant worked and was ready for winter. The lesson: <b>work hard now, and you will be ready later</b>.", "no": ["That is plot. It tells what happens.", "That does not fit. The grasshopper had nothing to eat!", null, "A theme is a whole idea, not one name."]}, {"type": "fill", "q": "The lesson at the end of a fable is called the ____.", "answers": ["moral", "the moral"], "why": "It is the <b>moral</b>.", "no": "It is one of today's reading words. It starts with m.", "placeholder": "Type one word"}, {"type": "fill", "q": "“The ant had plenty of food.” Is this the <b>plot</b> or the <b>theme</b>? Type <b>plot</b> or <b>theme</b>.", "answers": ["plot"], "why": "It tells <b>what happens</b>, so it is <b>plot</b>.", "no": "Plot is what happens. Theme is a lesson about life.", "placeholder": "plot or theme"}], "notes": {"do": "On her own. She reads the fable out loud first.", "listen": "Work hard now…; moral; plot. If she picks “Singing is better,” ask: “What happened to the grasshopper in winter? Does that sound better?”"}}, {"type": "learn", "kick": "Wrap-up", "title": "Two big skills", "text": "You came back strong today! 💪", "steps": [{"text": "<b>Word problems:</b> find the clue word, then add or subtract."}, {"text": "<b>Estimate:</b> round to the nearest hundred. Is the answer reasonable?"}, {"text": "<b>Theme:</b> ask, “What lesson does this story teach?”"}], "tip": "Tonight: the after-class lesson. It ends with Show What You Know. Aim for 85.", "notes": {"do": "Open the course page together and read the task list, one day at a time. Point to the two Pathways Week 4 retakes (Friday and Monday).", "say": "Tonight, just the after-class lesson. A little each day after that.", "ask": "Tell me the add clue words and the subtract clue words without looking.", "listen": "In all, altogether, total, both. Left, remain, how many more, difference. Then one sentence: what is a theme?"}}], "win": "Clue words, estimates and themes: you came back strong! 🔥", "prev": "bb-celine-L03", "prevTitle": "Lesson 3"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.get
