<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce&#x27;Line · Lesson 6: Stocking the Shelves and the Storm</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L06", "label": "Lesson 6", "title": "Stocking the Shelves and the Storm", "goal": "I can use equal groups, arrays and repeated addition to multiply, and I can trace a chain of causes and effects in a story.", "date": "2026-12-15", "mastery": 85, "color": "#16A085", "slides": [{"type": "hello", "title": "On Your Own: Shelves and Storms", "text": "You learned two big skills in class. Now try them on your own. Take your time. 🛒⛈️", "visual": {"kind": "emoji", "text": "⛈️🛒✖️"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["What is a <b>cause</b>? What is an <b>effect</b>?", "In Mia's stockroom, what was the <b>first</b> thing that went wrong?", "How is 5 + 5 + 5 the same as 3 × 5?"], "starters": ["A cause is … An effect is …", "The first thing was …", "They are the same because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Your 10 words", "text": "Tap each card. Say the word. Say what it means.", "words": [{"word": "cause", "pos": "noun", "meaning": "The reason <b>why</b> something happens.", "example": "The storm was the <b>cause</b> of the puddles.", "emoji": "🌧️"}, {"word": "effect", "pos": "noun", "meaning": "<b>What happens</b> because of a cause.", "example": "Puddles on the floor were an <b>effect</b> of the storm.", "emoji": "💧"}, {"word": "chain reaction", "pos": "noun", "meaning": "Effects in a row. Each one causes the <b>next</b> one.", "example": "Falling dominoes are a <b>chain reaction</b>.", "emoji": "⛓️"}, {"word": "consequence", "pos": "noun", "meaning": "A result of an action. It is often a <b>bad</b> result.", "example": "Ruined goods were a <b>consequence</b> of the wet boxes.", "emoji": "😟"}, {"word": "trace", "pos": "verb", "meaning": "To follow a chain <b>back</b> to where it started.", "example": "Mia <b>traced</b> the puddles back to the shutter.", "emoji": "🔍"}, {"word": "multiply", "pos": "verb", "meaning": "To put <b>equal groups</b> together fast.", "example": "3 groups of 4? <b>Multiply</b>: 3 × 4 = 12.", "emoji": "✖️"}, {"word": "equal groups", "pos": "noun", "meaning": "Groups with the <b>same</b> number in each one.", "example": "3 bags with 5 nuts in each bag are <b>equal groups</b>.", "emoji": "🫙"}, {"word": "repeated addition", "pos": "noun", "meaning": "Adding the <b>same</b> number again and again.", "example": "5 + 5 + 5 is <b>repeated addition</b>.", "emoji": "➕"}, {"word": "array", "pos": "noun", "meaning": "Things set in equal <b>rows</b> and <b>columns</b>.", "example": "2 rows of 6 cans make an <b>array</b>.", "emoji": "🥫"}, {"word": "product", "pos": "noun", "meaning": "The <b>answer</b> when you multiply.", "example": "In 3 × 4 = 12, the <b>product</b> is 12.", "emoji": "🎯"}]}, {"type": "learn", "kick": "Remember", "title": "Cause and effect chains", "text": "Ask <b>why?</b> to find the cause. Ask <b>what happened?</b> to find the effect.<br>In a chain, each effect causes the next thing.", "visual": {"kind": "passage", "text": "loose shutter ➡️ shutter cracked ➡️ rain got inside ➡️ boxes got soaked ➡️ boxes collapsed ➡️ goods ruined ➡️ less inventory"}, "tip": "Middle events are <b>both</b> a cause and an effect."}, {"type": "tap", "kick": "Try it", "title": "Cause or effect?", "text": "Look at the <b>bold</b> part.", "items": [{"type": "fill", "q": "<b>The wind blew hard</b>, so the hat flew away. Is the bold part the cause or the effect? Type <b>cause</b> or <b>effect</b>.", "answers": ["cause"], "why": "The wind is <b>why</b> the hat flew away. It is the <b>cause</b>.", "no": "Ask: is the bold part why, or what happened?", "placeholder": "cause or effect"}, {"type": "fill", "q": "The oven was too hot, so <b>the cookies burned</b>. Is the bold part the cause or the effect? Type <b>cause</b> or <b>effect</b>.", "answers": ["effect"], "why": "Burned cookies are <b>what happened</b>. It is the <b>effect</b>.", "no": "Which happened first: the hot oven or the burned cookies?", "placeholder": "cause or effect"}, {"q": "Jada studied every night. She got 100 on her test. Which part is the <b>effect</b>?", "choices": ["Jada studied every night.", "Jada likes her teacher.", "Jada got 100 on her test."], "a": 2, "why": "Getting 100 is <b>what happened</b> because she studied.", "no": ["Studying is <b>why</b> she got 100. That is the cause.", "The story does not say that.", null]}]}, {"type": "order", "kick": "Order it", "title": "Max's sticky morning", "text": "Max had a bad morning. Tap what happened, in order.", "steps": ["Max knocked over his cup.", "Juice spilled on the table.", "The juice ran onto his homework.", "His homework got sticky.", "He had to write it again."], "why": "Each event caused the next one. That is a <b>chain reaction</b>.", "hint": "Not yet. Ask: what had to happen before this?"}, {"type": "tap", "kick": "Read", "title": "The power went out", "text": "Read the story. Then trace the chain.", "visual": {"kind": "passage", "text": "A storm knocked down a tree. The tree hit a power line. The power went out at Kim's house. The fridge stopped working. The ice cream got soft. So Kim's family ate it all for dessert!"}, "items": [{"type": "fill", "q": "What knocked down the tree?", "answers": ["storm", "a storm", "the storm"], "why": "<b>A storm</b> knocked down the tree. That is the first cause.", "no": "Look at the first sentence.", "placeholder": "Type a word"}, {"q": "The tree hit a power line. What did <b>that</b> cause?", "choices": ["The storm came.", "The power went out.", "The family ate dessert."], "a": 1, "why": "Right after the tree hit the line, <b>the power went out</b>.", "no": ["The storm came first. It is a cause, not this effect.", null, "That happened at the very end."]}, {"type": "fill", "q": "<b>The fridge stopped working.</b> Is that a cause, an effect, or both? Type <b>cause</b>, <b>effect</b> or <b>both</b>.", "answers": ["both"], "why": "The power going out caused it. It caused the soft ice cream. It is <b>both</b>.", "no": "Ask two questions: What caused it? What did it cause?", "placeholder": "cause, effect or both"}, {"q": "What was the <b>last</b> effect?", "choices": ["The ice cream got soft.", "The power went out.", "Kim's family ate it all.", "The tree hit a power line."], "a": 2, "why": "Eating the ice cream is the end of the chain.", "no": ["Soft ice cream caused one more thing.", "That is in the middle of the chain.", null, "That is near the start."]}]}, {"type": "learn", "kick": "Remember", "title": "Equal groups", "text": "<b>Equal groups</b> have the same number in each group.<br>Count the groups. Count in one group. Then <b>multiply</b>.<br>6 + 6 + 6 = 18, so <b>3 × 6 = 18</b>.", "visual": {"kind": "groups", "groups": 3, "each": 6, "emoji": "🍪", "label": "3 groups of 6"}, "tip": "Groups × how many in each group = the <b>product</b>."}, {"type": "build", "kick": "Build it", "title": "Grandpa's candle boxes", "text": "Grandpa has <b>3 boxes</b>. Each box has <b>7 candles</b>. Make the groups.", "groups": 3, "each": 7, "emoji": "🕯️", "why": "3 groups of 7. 7 + 7 + 7 = 21. <b>3 × 7 = 21</b> candles.", "hint": "Each <b>box</b> is one group. Set <b>Groups</b> to the number of boxes. Set <b>In each group</b> to the candles in one box."}, {"type": "tap", "kick": "Try it", "title": "Add or multiply", "items": [{"type": "fill", "q": "Write <b>8 + 8 + 8</b> as multiplication: ____", "answers": ["3 × 8", "3 times 8", "8 × 3", "8 times 3", "3 × 8 = 24", "3 times 8 = 24", "8 × 3 = 24", "8 times 3 = 24", "3 groups of 8"], "why": "Three 8s: <b>3 × 8 = 24</b>.", "no": "Count the 8s. That is the number of groups.", "hint": "There are three 8s. 3 × ___", "placeholder": "Like this: 10 x 10"}, {"type": "fill", "q": "<b>5 + 5 + 5 + 5 + 5 + 5 = ____</b>", "answers": ["30"], "why": "Six 5s: 5, 10, 15, 20, 25, 30. <b>6 × 5 = 30</b>.", "no": "Skip count by 5s. Touch each 5.", "placeholder": "Type a number"}, {"q": "Which addition matches <b>2 × 6</b>?", "choices": ["2 + 6", "6 + 6", "2 + 2 + 2", "6 + 6 + 6"], "a": 1, "why": "2 × 6 is 2 groups of 6: <b>6 + 6 = 12</b>.", "no": ["2 + 6 = 8. Two groups of 6 is 6 + 6.", null, "That is three 2s, or 6.", "That is three 6s, or 18."]}]}, {"type": "tap", "kick": "Try it", "title": "Arrays", "items": [{"type": "fill", "q": "This array has <b>3 rows of 8</b>. How many carrots in all?", "visual": {"kind": "array", "rows": 3, "cols": 8, "emoji": "🥕"}, "answers": ["24"], "why": "8 + 8 + 8 = 24. <b>3 × 8 = 24</b>.", "no": "Skip count by 8s, one time for each row.", "hint": "8, 16, …", "placeholder": "Type a number"}, {"q": "Which fact matches this array?", "visual": {"kind": "array", "rows": 4, "cols": 2, "emoji": "🧴"}, "choices": ["4 × 2", "4 + 2", "2 × 2", "4 × 4"], "a": 0, "why": "4 rows with 2 in each row: <b>4 × 2 = 8</b>.", "no": [null, "4 + 2 = 6. Count: there are 8 bottles.", "There are 4 rows, not 2.", "Each row has 2, not 4."]}, {"type": "fill", "q": "In an array, the things that go <b>across</b> make a ____.", "answers": ["row", "rows"], "why": "Across ➡️ is a <b>row</b>. Up and down ⬇️ is a column.", "no": "Across is a r…. Up and down is a column.", "placeholder": "Type a word"}]}, {"type": "tap", "kick": "Try it", "title": "Shelf problems", "text": "Are the groups equal? Then pick: multiply or add.", "items": [{"type": "fill", "q": "Mia puts <b>6 jars</b> on each shelf. She fills <b>2 shelves</b>. How many jars?", "answers": ["12"], "why": "2 groups of 6: <b>2 × 6 = 12</b>.", "no": "Each shelf is a group. 6 + 6.", "placeholder": "Type a number"}, {"q": "Theo has 4 bags of apples. The bags have <b>3, 5, 2 and 4</b> apples. How many apples?", "choices": ["12", "14", "16"], "a": 1, "why": "The bags are <b>not equal</b>, so add: 3 + 5 + 2 + 4 = <b>14</b>.", "no": ["4 × 3 = 12. But the bags are not equal! Add them.", null, "4 × 4 = 16. But the bags are not equal! Add them."]}, {"type": "fill", "q": "Grandpa stacks <b>5 rows</b> of logs. Each row has <b>5 logs</b>. How many logs?", "answers": ["25"], "why": "5 rows of 5: 5, 10, 15, 20, 25. <b>5 × 5 = 25</b>.", "no": "Skip count by 5s, one time for each row.", "placeholder": "Type a number"}]}, {"type": "recall", "kick": "Remember", "title": "From Weeks 1 to 4", "items": [{"type": "fill", "q": "Round <b>68</b> to the nearest <b>ten</b>: ____", "answers": ["70"], "why": "The ones digit is 8. 8 is 5 or more, so round up to <b>70</b>.", "no": "Look at the ones digit. Is it 5 or more?", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>832 − 568 = ____</b>", "answers": ["264"], "why": "Regroup a ten: 12 − 8 = 4. Regroup a hundred: 12 − 6 = 6. 7 − 5 = 2. <b>264</b>.", "no": "You can't take 8 from 2. Regroup first.", "hint": "Check: 264 + 568 should make 832.", "placeholder": "Type a number"}, {"q": "A story's <b>setting</b> tells ____.", "choices": ["who is in the story", "the lesson it teaches", "the problem the characters must solve", "where and when it happens"], "a": 3, "why": "The <b>setting</b> is where and when a story happens.", "no": ["Who is in the story are the characters.", "The lesson is the theme.", "The problem is the conflict.", null]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "There are <b>4 crates</b>. Each crate has <b>6 jugs</b>. How many jugs?", "answers": ["24"], "why": "4 groups of 6: 6 + 6 + 6 + 6 = 24. <b>4 × 6 = 24</b>.", "no": "Each crate is a group. Skip count by 6s, once for each crate.", "placeholder": "Type a number"}, {"type": "fill", "q": "Write <b>9 + 9 + 9</b> as multiplication: ____", "answers": ["3 × 9", "3 times 9", "9 × 3", "9 times 3", "3 × 9 = 27", "3 times 9 = 27", "9 × 3 = 27", "9 times 3 = 27", "3 groups of 9"], "why": "Three 9s: <b>3 × 9 = 27</b>.", "no": "Count the 9s. That is the number of groups.", "placeholder": "Like this: 10 x 10"}, {"q": "Which fact matches this array of bread loaves?", "visual": {"kind": "array", "rows": 3, "cols": 5, "emoji": "🍞"}, "choices": ["3 + 5", "5 × 5", "3 × 5", "8 × 3"], "a": 2, "why": "3 rows with 5 in each row: <b>3 × 5 = 15</b>.", "no": ["3 + 5 = 8. There are more than 8 loaves.", "Count the rows. There are 3 rows, not 5.", null, "Count again: 3 rows, 5 in each row."]}, {"type": "fill", "q": "In <b>4 × 5 = 20</b>, the 20 is called the ____.", "answers": ["product"], "why": "The answer when you multiply is the <b>product</b>.", "no": "It is the answer to a times fact.", "placeholder": "Type a word"}, {"type": "fill", "q": "<b>The puppy chewed the shoe</b>, so the shoe had holes. Is the bold part the cause or the effect? Type <b>cause</b> or <b>effect</b>.", "answers": ["cause"], "why": "Chewing is <b>why</b> the shoe had holes. It is the <b>cause</b>.", "no": "Ask: is the bold part why, or what happened?", "placeholder": "cause or effect"}, {"q": "Read: <i>Dad forgot to close the window. Rain came in through the window. The rug got wet. The rug smelled bad.</i><br>What was the <b>first</b> cause?", "choices": ["The rug got wet.", "Rain came in through the window.", "The rug smelled bad.", "Dad forgot to close the window."], "a": 3, "why": "It all started when <b>Dad forgot to close the window</b>.", "no": ["The rug got wet because rain came in first.", "Rain came in because of something before it.", "That is the last effect.", null]}, {"type": "fill", "q": "In the storm story, who boarded up the broken shutter?", "answers": ["Theo"], "why": "<b>Theo</b> boarded up the shutter. Mia found the cause.", "no": "Mia found the problem. Who fixed it?", "placeholder": "Type a name"}, {"q": "A row of falling dominoes is a ____.", "choices": ["theme", "character trait", "chain reaction"], "a": 2, "why": "Each domino knocks down the next one. That is a <b>chain reaction</b>.", "no": ["The theme is the lesson of a story.", "A character trait tells what a character is like.", null]}], [{"type": "fill", "q": "There are <b>5 boxes</b>. Each box has <b>6 candles</b>. How many candles?", "answers": ["30"], "why": "5 groups of 6: 6 + 6 + 6 + 6 + 6 = 30. <b>5 × 6 = 30</b>.", "no": "Each box is a group. Skip count by 6s, once for each box.", "placeholder": "Type a number"}, {"type": "fill", "q": "Write <b>4 + 4 + 4 + 4 + 4</b> as multiplication: ____", "answers": ["5 × 4", "5 times 4", "4 × 5", "4 times 5", "5 × 4 = 20", "5 times 4 = 20", "4 × 5 = 20", "4 times 5 = 20", "5 groups of 4"], "why": "Five 4s: <b>5 × 4 = 20</b>.", "no": "Count the 4s. That is the number of groups.", "placeholder": "Like this: 10 x 10"}, {"q": "Which fact matches this array of cheese blocks?", "visual": {"kind": "array", "rows": 2, "cols": 7, "emoji": "🧀"}, "choices": ["2 × 7", "2 + 7", "7 × 7", "2 × 2"], "a": 0, "why": "2 rows with 7 in each row: <b>2 × 7 = 14</b>.", "no": [null, "2 + 7 = 9. Count: there are more than 9.", "There are only 2 rows.", "Each row has 7, not 2."]}, {"type": "fill", "q": "Things set in equal rows and columns make an ____.", "answers": ["array"], "why": "Equal rows and columns make an <b>array</b>.", "no": "It starts with <b>a</b>. Rows of cans on a shelf make one.", "placeholder": "Type a word"}, {"type": "fill", "q": "Because it was cold, <b>Rosa wore her coat</b>. Is the bold part the cause or the effect? Type <b>cause</b> or <b>effect</b>.", "answers": ["effect"], "why": "Wearing the coat is <b>what happened</b> because it was cold. It is the <b>effect</b>.", "no": "Ask: is the bold part why, or what happened?", "placeholder": "cause or effect"}, {"q": "Read: <i>Kai left his bike in the rain. The chain got rusty. The bike would not ride. Kai had to walk to school.</i><br>What was the <b>last</b> effect?", "choices": ["The chain got rusty.", "The bike would not ride.", "Kai had to walk to school.", "Kai left his bike in the rain."], "a": 2, "why": "The chain ends with <b>Kai had to walk to school</b>. Nothing comes after it.", "no": ["The rusty chain caused more things to happen.", "A bike that won't ride caused one more thing.", null, "That is the first cause."]}, {"type": "fill", "q": "In the storm story, who traced the puddles back to the shutter?", "answers": ["Mia"], "why": "<b>Mia</b> traced the puddles back. Theo fixed the shutter.", "no": "She found the puddles in the morning.", "placeholder": "Type a name"}, {"q": "The goods were ruined because the boxes got wet. A bad result of an action is a ____.", "choices": ["main character", "cause", "consequence"], "a": 2, "why": "A result, often a bad one, is a <b>consequence</b>.", "no": ["A main character is a person in a story, not a result.", "A cause is why something happens. Ruined goods are a result.", null]}], [{"type": "fill", "q": "There are <b>4 shelves</b>. Each shelf has <b>7 cans</b>. How many cans?", "answers": ["28"], "why": "4 groups of 7: 7 + 7 + 7 + 7 = 28. <b>4 × 7 = 28</b>.", "no": "Each shelf is a group. Add 7 four times: 7, 14, …", "placeholder": "Type a number"}, {"type": "fill", "q": "Write <b>8 + 8 + 8 + 8</b> as multiplication: ____", "answers": ["4 × 8", "4 times 8", "8 × 4", "8 times 4", "4 × 8 = 32", "4 times 8 = 32", "8 × 4 = 32", "8 times 4 = 32", "4 groups of 8"], "why": "Four 8s: <b>4 × 8 = 32</b>.", "no": "Count the 6s. That is the number of groups.", "placeholder": "Like this: 10 x 10"}, {"q": "Which fact matches this array of eggs?", "visual": {"kind": "array", "rows": 3, "cols": 6, "emoji": "🥚"}, "choices": ["3 + 6", "6 × 6", "9 × 3", "3 × 6"], "a": 3, "why": "3 rows with 6 in each row: <b>3 × 6 = 18</b>.", "no": ["3 + 6 = 9. There are more than 9 eggs.", "There are 3 rows, not 6.", "Count the rows again. There are 3.", null]}, {"type": "fill", "q": "Adding 2 + 2 + 2 + 2 is called repeated ____.", "answers": ["addition", "adding"], "why": "Adding the same number again and again is <b>repeated addition</b>.", "no": "You add the same number again and again. Repeated …", "placeholder": "Type a word"}, {"type": "fill", "q": "Sam ate too fast, so <b>he got a tummy ache</b>. Is the bold part the cause or the effect? Type <b>cause</b> or <b>effect</b>.", "answers": ["effect"], "why": "The tummy ache is <b>what happened</b>. It is the <b>effect</b>.", "no": "Ask: is the bold part why, or what happened?", "placeholder": "cause or effect"}, {"q": "Read: <i>The cat jumped on the shelf. A vase fell off. The vase broke. Grandma swept up the pieces.</i><br>Which event is <b>both</b> a cause and an effect?", "choices": ["The cat jumped on the shelf.", "The vase broke.", "Grandma swept up the pieces."], "a": 1, "why": "The vase broke because it fell. Then it made Grandma sweep. It does <b>both</b> jobs.", "no": ["The cat jumping is the first cause. Nothing caused it in the story.", null, "Sweeping is the last effect. It does not cause anything."]}, {"type": "fill", "q": "In the storm story, the boxes got soaked. Then the wet boxes ____.", "answers": ["collapsed", "fell", "fell down", "fell over", "fell apart", "caved in", "broke", "broke down"], "why": "The soaked boxes <b>collapsed</b> (fell down). Then the goods spilled.", "no": "Think of the index cards: soaked, then …", "placeholder": "Type a word"}, {"q": "Mia followed the puddles back to the loose shutter. She ____ the chain.", "choices": ["traced", "multiplied", "rounded", "ruined"], "a": 0, "why": "Following a chain back to the start is to <b>trace</b> it.", "no": [null, "Multiply is a math word.", "Rounding is a math word.", "Ruined means spoiled. Mia did not spoil the chain."]}]]}], "win": "You traced the whole storm chain and stocked the shelves with equal groups. Grandpa's trading post is ready!", "prev": "bb-celine-L05", "prevTitle": "Lesson 5"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.vis
