<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ce&#x27;Line · Lesson 1: Numbers and Stories</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "celine", "studentName": "Ce'Line", "id": "bb-celine-L01", "label": "Lesson 1", "title": "Numbers and Stories", "goal": "I can tell what each digit is worth, round numbers, and find the character and setting in a story.", "date": "2026-10-27", "mastery": 85, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Welcome to Your Building Blocks!", "text": "This course is just for you, Ce'Line. 🧱<br>We meet <b>one time each week</b>.<br>Today we learn about <b>numbers</b> and <b>stories</b>.", "visual": {"kind": "emoji", "text": "🧱🔢📖"}, "notes": {"do": "Before class: laptop with this class lesson open (code 9110), her printed Packet (2 pages), a paper place-value mat (three columns: Hundreds, Tens, Ones), base-ten pieces or paper cut-outs (9 hundred squares, 9 ten strips, 9 ones), a small whiteboard and marker, and a pencil. Sit side by side so she can see the screen.", "say": "Welcome, Ce'Line! This is your very own course. It is called Building Blocks because we build one block at a time. Every Tuesday we learn one new week together.", "ask": "What is one thing you want to get better at this year?", "listen": "Any honest answer. Write it on the whiteboard corner and come back to it at the end. Praise her for answering; today is about confidence."}}, {"type": "learn", "kick": "Your Course", "title": "How your course works", "text": "Your <b>course page</b> has one card for each lesson. Here is what is on a card.", "steps": [{"text": "📘 <b>Class lesson.</b> We do it together, right now."}, {"text": "💻 <b>After-class lesson.</b> You do it at home on the day of class. It ends with <b>Show What You Know</b>."}, {"text": "🎯 Get <b>85 or more</b> on Show What You Know. Then your next lesson opens. You can try again. You get new questions each time."}, {"text": "📝 <b>Practice.</b> More questions during the week. You get a new set each time."}, {"text": "🖨️ <b>Packet.</b> Two pages to print. You use a pencil. Do one page at a time."}, {"text": "✅ <b>Task list.</b> One small job each day. Check the box when you finish it."}], "tip": "Three tries on each question. Only your <b>first try</b> counts. So slow down and check.", "notes": {"do": "Open her course page in a new tab and show her the Lesson 1 card while you click through the steps. Point to each button: Class Lesson, After-Class Lesson, Practice, Packet. Then point to the task list and the Also do links.", "say": "You never have to guess what to do. The task list tells you one small job for each day.", "ask": "Where do you look to see what to do on Thursday?", "listen": "The task list on her course card. If she says \"I don't know\", point to it again and have her read the Thursday line out loud."}}, {"type": "tap", "kick": "Quick check", "title": "Do you know your course?", "text": "Answer each one.", "items": [{"type": "fill", "q": "What score on Show What You Know opens your next lesson? Type the number.", "answers": ["85", "85 or more", "eighty-five"], "why": "<b>85</b> or more opens the next lesson.", "no": "Look back at the step with the 🎯.", "placeholder": "Type a number"}, {"type": "fill", "q": "Where do you find your one small job for each day? The ____ list.", "answers": ["task", "task list", "tasks", "the task list"], "why": "The <b>task list</b> tells you one job for each day.", "no": "It has a box to check for each job.", "hint": "It starts with t.", "placeholder": "Type one word"}, {"q": "How many of your tries <b>count</b> for your score?", "choices": ["all three of my tries", "only the first try", "only the last try"], "a": 1, "why": "Only your <b>first try</b> counts. That is why we slow down and check.", "no": ["You get three tries, but only the first one counts.", null, "The last try does not count. The first one does."]}], "notes": {"do": "She types. Let her find the answers on her own by looking back if she needs to.", "ask": "Why is it smart to check your answer before you press Check?", "listen": "Because only the first try counts. If she says she will just try again, remind her: tries 2 and 3 help you learn, but they do not count."}}, {"type": "vocab", "kick": "Word Power", "title": "Number words", "text": "Tap each card to flip it. Read the word and the meaning out loud.", "words": [{"word": "digit", "pos": "noun", "meaning": "One number symbol: 0, 1, 2, 3, 4, 5, 6, 7, 8 or 9.", "example": "547 has three <b>digits</b>: 5, 4 and 7.", "emoji": "🔢"}, {"word": "place value", "pos": "noun", "meaning": "What a digit is <b>worth</b> because of the place where it sits.", "example": "In 547, the 5 is in the hundreds place. Its <b>place value</b> is 500.", "emoji": "🏠"}, {"word": "standard form", "pos": "noun", "meaning": "A number written the usual way.", "example": "547 is in <b>standard form</b>.", "emoji": "✏️"}, {"word": "expanded form", "pos": "noun", "meaning": "A number split into what each digit is worth, with plus signs.", "example": "500 + 40 + 7 is the <b>expanded form</b> of 547.", "emoji": "🧩"}, {"word": "round", "pos": "verb", "meaning": "To change a number to the nearest ten or hundred. It makes the number easier to use.", "example": "47 <b>rounds</b> up to 50.", "emoji": "🎯"}], "notes": {"do": "She reads each card aloud, flips it, then covers it and says the meaning in her own words.", "say": "These five words are on your Pathways Week 1 Math lesson too. Learn them today and that lesson gets easier.", "ask": "What is the difference between a digit and its value?", "listen": "The digit is the symbol (5). The value is what it is worth (500). If she mixes them up, that is normal; the next slide fixes it."}}, {"type": "learn", "kick": "Learn", "title": "Every digit has a place", "text": "Look at <b>547</b>. Each digit sits in a place.", "visual": {"kind": "placevalue", "n": 547}, "steps": [{"text": "The <b>5</b> is in the <b>hundreds</b> place. It is worth <b>500</b>."}, {"text": "The <b>4</b> is in the <b>tens</b> place. It is worth <b>40</b>."}, {"text": "The <b>7</b> is in the <b>ones</b> place. It is worth <b>7</b>."}, {"text": "500 + 40 + 7 = <b>547</b>."}], "tip": "Read the places from the left: <b>hundreds, tens, ones</b>.", "notes": {"do": "Hands-on: she builds 547 on the place-value mat with 5 hundred squares, 4 ten strips and 7 ones. Then click the steps one at a time.", "say": "The digit 5 is just a symbol. Where it sits tells us it is worth 500.", "ask": "How many ones are in one ten strip? How many ones in one hundred square?", "listen": "10 and 100. If she counts, let her count one strip, then say: every strip is the same."}}, {"type": "learn", "kick": "Learn", "title": "Same digit, new value", "text": "The digit <b>4</b> is in all three numbers. But it is worth something different each time.", "steps": [{"text": "In <b>481</b>, the 4 is in the hundreds place. It is worth <b>400</b>.", "visual": {"kind": "placevalue", "n": 481}}, {"text": "In <b>148</b>, the 4 is in the tens place. It is worth <b>40</b>.", "visual": {"kind": "placevalue", "n": 148}}, {"text": "In <b>814</b>, the 4 is in the ones place. It is worth just <b>4</b>.", "visual": {"kind": "placevalue", "n": 814}}], "tip": "The <b>place</b> tells the <b>value</b>.", "notes": {"do": "She moves the same three digit cards (4, 8, 1) into new spots on the mat for each number.", "ask": "Which 4 is worth the most? Which is worth the least?", "listen": "The 4 in 481 (400) is worth the most; the 4 in 814 (4) the least. She should say the value, not just the digit."}}, {"type": "tap", "kick": "Try it", "title": "What is it worth?", "text": "Say it out loud first. Then type.", "items": [{"type": "fill", "q": "In <b>362</b>, what is the <b>value</b> of the <b>6</b>?", "answers": ["60", "sixty", "6 tens"], "why": "The 6 is in the <b>tens</b> place. It is worth <b>60</b>.", "no": "Find the 6. Which place is it in? Ones, tens or hundreds?", "hint": "6 tens = 60.", "placeholder": "Type a number"}, {"type": "fill", "q": "In <b>815</b>, which <b>digit</b> is in the <b>hundreds</b> place?", "answers": ["8", "eight"], "why": "815: 8 hundreds, 1 ten, 5 ones. The hundreds digit is <b>8</b>.", "no": "Say the places from the left: hundreds, tens, ones.", "hint": "Type just one digit.", "placeholder": "Type one digit"}, {"q": "Which number has a <b>9</b> that is worth <b>900</b>?", "choices": ["498", "962", "239"], "a": 1, "why": "In 962, the 9 is in the <b>hundreds</b> place. It is worth <b>900</b>.", "no": ["In 498, the 9 is in the tens place. It is worth 90.", null, "In 239, the 9 is in the ones place. It is worth 9."]}], "notes": {"do": "She says the place and the value out loud before she types: \"The 6 is in the tens place, so it is worth 60.\"", "listen": "60, 8, and 962. If she types 6 for the first one, ask: which place is the 6 in? What is one ten strip worth?"}}, {"type": "learn", "kick": "Learn", "title": "Standard form and expanded form", "text": "<b>486</b> is in <b>standard form</b>. That is the usual way.<br><b>Expanded form</b> splits it into what each digit is worth.", "visual": {"kind": "bigtext", "text": "486 = 400 + 80 + 6"}, "steps": [{"text": "4 hundreds = <b>400</b>. 8 tens = <b>80</b>. 6 ones = <b>6</b>."}, {"text": "Now look at <b>609</b>. There are <b>0 tens</b>.", "visual": {"kind": "placevalue", "n": 609}}, {"text": "We still write the 0: 609 = 600 + <b>0</b> + 9."}, {"text": "A 0 holds the place. Without it, 609 would turn into 69!"}], "tip": "Expanded form always has <b>three parts</b> for a 3-digit number, even when one part is 0.", "notes": {"do": "She builds 609 on the mat: 6 hundred squares, nothing in the tens column, 9 ones. Point to the empty tens column.", "say": "The tens column is empty, so we write 0 there. The 0 is a place holder.", "ask": "What number do you get if you forget the 0 in 609?", "listen": "69. That is a much smaller number. This is the mistake Pathways tests with numbers like 900 + 0 + 6."}}, {"type": "tap", "kick": "Try it", "title": "Expand it", "text": "Use your mat if you need it.", "items": [{"type": "fill", "q": "Write <b>273</b> in expanded form: 200 + ____ + 3", "answers": ["70", "seventy"], "why": "273 = 200 + 70 + 3. The missing part is <b>70</b>.", "no": "Write what each digit is <b>worth</b>, not just the digit.", "hint": "Which place is missing? What is that digit worth?", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>500 + 0 + 2 = ____</b><br>Write it in standard form.", "answers": ["502", "five hundred two", "five hundred and two"], "why": "5 hundreds, 0 tens, 2 ones = <b>502</b>.", "no": "Put one digit in each place: hundreds, tens, ones.", "hint": "A 0 tens still needs a 0 in the tens place.", "placeholder": "Type a number"}, {"q": "Which is the <b>expanded form</b> of <b>830</b>?", "choices": ["800 + 300 + 0", "800 + 30 + 0", "8 + 3 + 0", "800 + 3 + 0"], "a": 1, "why": "830 = <b>800 + 30 + 0</b>.", "no": ["That makes 1,100, not 830. The 3 is in the <b>tens</b> place, so it is worth 30.", null, "That only lists the digits. Write what each digit is <b>worth</b>.", "That makes 803, not 830. Check what the middle digit is worth."]}], "notes": {"do": "For the second one she builds 500 + 0 + 2 on the mat before typing.", "listen": "70, 502, and 800 + 30 + 0. If she types 52 for the second one, she skipped the 0 tens: point to the empty tens column."}}, {"type": "learn", "kick": "Learn", "title": "Round to the nearest ten", "text": "<b>Rounding</b> finds the closest ten. Look at the <b>ones</b> digit.", "visual": {"kind": "numberline", "start": 30, "jump": 5, "jumps": 2}, "steps": [{"text": "<b>36</b> is between 30 and 40. The ones digit is <b>6</b>. 6 is 5 or more, so round <b>up</b> to <b>40</b>."}, {"text": "<b>33</b> is between 30 and 40. The ones digit is <b>3</b>. 3 is 4 or less, so stay <b>down</b> at <b>30</b>."}, {"text": "<b>35</b> is right in the middle. The rule says 5 goes <b>up</b>: <b>40</b>."}, {"text": "Bigger numbers work the same way. <b>128</b> is between 120 and 130. The ones digit is 8, so round up to <b>130</b>."}], "tip": "<b>5 or more</b>, go up. <b>4 or less</b>, stay down.", "notes": {"do": "Draw a hill on the whiteboard: 30 at the bottom left, 35 at the top, 40 at the bottom right. Numbers past the top roll down to 40; numbers before it roll back to 30.", "say": "When we round, we only change to a ten. 36 cannot round to 35. It has to be 30 or 40.", "ask": "Which two tens is 128 between? How do you know?", "listen": "120 and 130, because there are 12 tens. If she says 100 and 200, she is rounding to the hundred; remind her: nearest ten means the tens next door."}}, {"type": "tap", "kick": "Try it", "title": "Round to the nearest ten", "text": "Find the two tens. Look at the ones digit. Then type.", "items": [{"type": "fill", "q": "Round <b>64</b> to the nearest <b>ten</b>.<br>64 → ____", "answers": ["60", "sixty"], "why": "64 is between 60 and 70. The ones digit is 4. 4 or less, so stay <b>down</b>: <b>60</b>.", "no": "Look at the <b>ones</b> digit. 5 or more goes up. 4 or less stays.", "hint": "It is between 60 and 70. Which one is it closer to?", "placeholder": "Type a number"}, {"type": "fill", "q": "Round <b>25</b> to the nearest <b>ten</b>.<br>25 → ____", "answers": ["30", "thirty"], "why": "25 is between 20 and 30. The ones digit is 5. 5 or more, so round <b>up</b>: <b>30</b>.", "no": "Look at the <b>ones</b> digit. 5 or more goes up. 4 or less stays.", "hint": "It is between 20 and 30. Which one is it closer to?", "placeholder": "Type a number"}, {"type": "fill", "q": "Round <b>237</b> to the nearest <b>ten</b>.<br>237 → ____", "answers": ["240", "two hundred forty", "two hundred and forty"], "why": "237 is between 230 and 240. The ones digit is 7. 5 or more, so round <b>up</b>: <b>240</b>.", "no": "Look at the <b>ones</b> digit. 5 or more goes up. 4 or less stays.", "hint": "It is between 230 and 240. Which one is it closer to?", "placeholder": "Type a number"}], "notes": {"do": "Before each answer she says the two tens out loud: \"64 is between 60 and 70.\"", "listen": "60, 30, 240. If she types 65 or 25, she kept the number or rounded to a 5; remind her: rounding always lands on a ten."}}, {"type": "learn", "kick": "Learn", "title": "Round to the nearest hundred", "text": "Same rule. But now look at the <b>tens</b> digit.", "visual": {"kind": "numberline", "start": 400, "jump": 50, "jumps": 2}, "steps": [{"text": "<b>437</b> is between 400 and 500. The tens digit is <b>3</b>. Stay <b>down</b>: <b>400</b>."}, {"text": "<b>462</b> is between 400 and 500. The tens digit is <b>6</b>. Round <b>up</b>: <b>500</b>."}, {"text": "<b>650</b> is between 600 and 700. The tens digit is <b>5</b>. 5 goes <b>up</b>: <b>700</b>."}], "tip": "Nearest <b>ten</b>: look at the ones. Nearest <b>hundred</b>: look at the tens.", "notes": {"do": "Cover the ones digit with a finger for each number, so only the hundreds and tens show.", "say": "For hundreds, the ones digit does not matter. Only the tens digit decides.", "ask": "Why does 437 round to 400 and not 440?", "listen": "440 is the nearest ten. We asked for the nearest hundred, so it has to be 400 or 500."}}, {"type": "tap", "kick": "Try it", "title": "Round to the nearest hundred", "text": "Cover the ones digit. Look at the tens digit.", "items": [{"type": "fill", "q": "Round <b>318</b> to the nearest <b>hundred</b>.<br>318 → ____", "answers": ["300", "three hundred"], "why": "318 is between 300 and 400. The tens digit is 1. 4 or less, so stay <b>down</b>: <b>300</b>.", "no": "For hundreds, look at the <b>tens</b> digit.", "hint": "It is between 300 and 400. Look at the tens digit.", "placeholder": "Type a number"}, {"type": "fill", "q": "Round <b>581</b> to the nearest <b>hundred</b>.<br>581 → ____", "answers": ["600", "six hundred"], "why": "581 is between 500 and 600. The tens digit is 8. 5 or more, so round <b>up</b>: <b>600</b>.", "no": "For hundreds, look at the <b>tens</b> digit.", "hint": "It is between 500 and 600. Look at the tens digit.", "placeholder": "Type a number"}, {"q": "The DeSoto library has <b>352</b> picture books. About how many is that, rounded to the nearest hundred?", "choices": ["350", "300", "400"], "a": 2, "why": "352 is between 300 and 400. The tens digit is 5, so it rounds to <b>400</b>.", "no": ["350 is 352 rounded to the nearest <b>ten</b>. This one asks for the nearest <b>hundred</b>.", "The tens digit is 5. That is 5 or more, so round <b>up</b>.", null]}], "notes": {"do": "She says which two hundreds each number is between before she types.", "listen": "300, 600, 400. If she picks 350 for the books, she rounded to the nearest ten; ask: is 350 a hundred?"}}, {"type": "talk", "kick": "Story Talk", "title": "Theo's First Hike", "text": "This is the story from your Pathways Week 1 Reading lesson. Read it with me.", "visual": {"kind": "passage", "text": "<b>Theo's First Hike (part 1, short)</b><br>Theo laced up his brand-new hiking boots. He checked his backpack twice. He clipped his father's old compass to his belt loop. Theo had never been on a real trail before. His hands were a little shaky. But he could not stop smiling. Today was different. Today was real."}, "prompts": ["Who is this story about?", "What does Theo do to get ready?", "How does Theo feel? Which words tell you?"], "starters": ["This story is about …", "To get ready, Theo …", "Theo feels … because …"], "notes": {"do": "Open the real Pathways Week 1 Reading story if you want her to see the full version. Read this short part together: you read a sentence, she reads the next. Give her 4 to 5 minutes to talk. Tap the gold button for each strong answer.", "say": "This is the story you will see again when you retake Pathways Week 1 Reading. Today we read it like detectives.", "ask": "His hands are shaky, but he is smiling. What does each clue tell you about how he feels?", "listen": "Yes: nervous (shaky hands) and excited (smiling). She scored 56 on this lesson, so take it slow and praise every clue she finds."}}, {"type": "vocab", "kick": "Word Power", "title": "Story words", "text": "Tap each card to flip it. Read the word and the meaning out loud.", "words": [{"word": "character", "pos": "noun", "meaning": "A person or animal in a story. The <b>main character</b> is who the story is mostly about.", "example": "Theo is the main <b>character</b> in Theo's First Hike.", "emoji": "🧒"}, {"word": "setting", "pos": "noun", "meaning": "<b>Where</b> and <b>when</b> a story happens.", "example": "The <b>setting</b> is a forest trail in the early morning.", "emoji": "🏞️"}, {"word": "trait", "pos": "noun", "meaning": "A word that tells what a character is like inside.", "example": "Kind, brave and curious are <b>traits</b>.", "emoji": "⭐"}, {"word": "narrator", "pos": "noun", "meaning": "The voice that tells the story.", "example": "The <b>narrator</b> tells us that Theo's hands were shaky.", "emoji": "🗣️"}, {"word": "infer", "pos": "verb", "meaning": "To use clues to figure out something the story does not say.", "example": "The story never says \"brave.\" I <b>infer</b> it from what Theo does.", "emoji": "🔍"}], "notes": {"do": "Same routine: read, flip, cover, say it in her own words.", "ask": "Is a trait the same as a feeling? (Close: a feeling can change fast; a trait is what someone is like most of the time.)", "listen": "Setting must include WHEN as well as WHERE. If she only says \"the woods\", ask: what time of day was it?"}}, {"type": "learn", "kick": "Learn", "title": "Character clues", "text": "Good readers look for 3 kinds of clues about a character.", "steps": [{"text": "👟 What the character <b>does</b>. Theo laces his boots. He checks his backpack <b>twice</b>."}, {"text": "💭 What the character <b>says or thinks</b>. Theo thinks: <i>Today was different. Today was real.</i>"}, {"text": "❤️ What the character <b>feels</b>. Shaky hands = <b>nervous</b>. Big smile = <b>excited</b>."}, {"text": "Put the clues together: Theo is nervous <b>and</b> excited about his first hike."}], "tip": "<b>Does, says, feels.</b> Look for all three.", "notes": {"do": "Draw a 3-column chart on the whiteboard: DOES / SAYS-THINKS / FEELS. She fills it in from the Theo passage with you.", "ask": "Why do you think he checked his backpack twice?", "listen": "He wants to be ready, or he is a little nervous. Either is a good inference if she gives the clue."}}, {"type": "learn", "kick": "Learn", "title": "Setting: where and when", "text": "The setting is <b>where</b> and <b>when</b> the story happens.", "visual": {"kind": "passage", "text": "<b>Theo's First Hike (part 2, short)</b><br>The trail went through tall pine trees. It dipped down past a rocky creek. Then it climbed up toward Lookout Peak. It was early morning. A soft mist hung low over the valley."}, "steps": [{"text": "📍 <b>Where:</b> a trail with tall pine trees, a rocky creek and Lookout Peak."}, {"text": "⏰ <b>When:</b> early morning."}, {"text": "🌫️ <b>Weather:</b> misty. The mist makes the story feel quiet and a little mysterious."}], "tip": "Things a character carries, like a compass, are <b>not</b> the setting.", "notes": {"do": "She underlines (points to) every WHERE word in one color and every WHEN word in another as you read the passage aloud together.", "ask": "Is Theo's compass part of the setting?", "listen": "No. It is something Theo has. The setting is the place and the time. This is a Boss Battle question type in Pathways."}}, {"type": "sort", "kick": "Sort it", "title": "Character or setting?", "text": "A new story: <b>Nia's Big Game</b>. Tap a card. Then tap the right box.", "buckets": ["🧒 Character clue<br><small>who and what they are like</small>", "🏞️ Setting clue<br><small>where and when</small>"], "items": [{"text": "Nia ties her soccer cleats tight.", "b": 0, "why": "That is something Nia <b>does</b>.", "hint": "Is it a person doing something, or a place or time?"}, {"text": "a muddy soccer field", "b": 1, "why": "That is <b>where</b> the story happens.", "hint": "Is it a place?"}, {"text": "on a rainy Saturday morning", "b": 1, "why": "That tells <b>when</b>.", "hint": "Does it tell a time?"}, {"text": "Nia cheers for her team.", "b": 0, "why": "That is something Nia <b>does</b>.", "hint": "Who is doing it?"}, {"text": "Nia feels nervous before the game.", "b": 0, "why": "That is how Nia <b>feels</b>.", "hint": "Is it a feeling?"}, {"text": "bleachers full of parents", "b": 1, "why": "That is part of the <b>place</b>.", "hint": "Can you stand in it or see it around you?"}], "done": "Character = who. Setting = where and when.", "notes": {"do": "She reads each card out loud before she sorts it.", "ask": "Which card was the hardest? Why?", "listen": "Often \"bleachers full of parents\": the parents are people, but here they are part of the place around Nia, not the main character."}}, {"type": "learn", "kick": "Learn", "title": "Infer a trait", "text": "A story does not always say what a character is like. We <b>infer</b> it from clues.", "visual": {"kind": "passage", "text": "<b>Theo's First Hike (part 3, short)</b><br>Halfway up, Theo's legs began to ache. He wondered if he should turn back. Then he remembered his grandfather. He took a breath and kept climbing."}, "steps": [{"text": "Clue 1: His legs <b>ache</b>. The hike is hard."}, {"text": "Clue 2: He thinks about <b>turning back</b>."}, {"text": "Clue 3: He <b>keeps climbing</b> anyway."}, {"text": "The story never says \"brave\" or \"determined.\" But the clues show it. Theo is <b>determined</b>: he keeps going when it is hard."}], "tip": "One clue is a guess. <b>Many clues</b> make a strong inference.", "notes": {"do": "She holds up one finger for each clue as you reveal it.", "say": "Determined means you keep going even when something is hard.", "ask": "Do you know someone who is determined? What do they do?", "listen": "A real example with an action (\"my mom keeps trying\"). Connect it: you can be determined on your Pathways retake too."}}, {"type": "tap", "kick": "Your turn", "title": "Be a story detective", "text": "Read the story. Then answer.", "visual": {"kind": "passage", "text": "<b>At the Park</b><br>Marcus was at the park after school. A little boy dropped his ice cream. The boy started to cry. Marcus walked over. He gave the boy half of his own cone."}, "items": [{"q": "Which <b>trait</b> fits Marcus best?", "choices": ["kind", "lazy", "bossy"], "a": 0, "why": "Marcus shares his own cone with a crying boy. That shows he is <b>kind</b>.", "no": [null, "Lazy means not wanting to do things. Marcus walks over to help.", "Bossy means telling others what to do. Marcus does not do that."]}, {"q": "Which clue shows that trait?", "choices": ["Marcus was at the park.", "He gave the boy half of his own cone.", "The little boy dropped his ice cream and started to cry."], "a": 1, "why": "Giving away half of his own cone is what Marcus <b>does</b>. It shows he is kind.", "no": ["That is the setting. It does not tell what Marcus is like.", null, "That is what the little boy did, not Marcus."]}, {"type": "fill", "q": "Is <b>the park after school</b> a clue about the character or the setting? Type <b>character</b> or <b>setting</b>.", "answers": ["setting", "settings", "setting clue"], "why": "The park after school tells <b>where</b> and <b>when</b>. It is the <b>setting</b>.", "no": "Character = <b>who</b>. Setting = <b>where</b> and <b>when</b>.", "hint": "Is it a person or animal? Or is it a place or a time?", "placeholder": "Type a word"}], "notes": {"do": "She reads the story aloud first. Then she answers on her own.", "listen": "kind; the cone clue; setting. If she picks \"Marcus was at the park\" as the clue, ask: does being at the park tell us he is kind?"}}, {"type": "tap", "kick": "Exit ticket", "title": "Check for understanding", "text": "On your own now. No help.", "items": [{"type": "fill", "q": "In <b>726</b>, what is the <b>value</b> of the <b>2</b>?", "answers": ["20", "twenty", "2 tens"], "why": "The 2 is in the <b>tens</b> place. It is worth <b>20</b>.", "no": "Find the 2. Which place is it in? Ones, tens or hundreds?", "hint": "2 tens = 20.", "placeholder": "Type a number"}, {"type": "fill", "q": "Round <b>465</b> to the nearest <b>hundred</b>.<br>465 → ____", "answers": ["500", "five hundred"], "why": "465 is between 400 and 500. The tens digit is 6. 5 or more, so round <b>up</b>: <b>500</b>.", "no": "For hundreds, look at the <b>tens</b> digit.", "hint": "It is between 400 and 500. Look at the tens digit.", "placeholder": "Type a number"}, {"type": "fill", "q": "A story happens <b>at a zoo on a hot afternoon</b>. The zoo and the afternoon are the story's ____.", "answers": ["setting", "the setting"], "why": "The zoo is <b>where</b>. The hot afternoon is <b>when</b>. Where and when = the <b>setting</b>.", "no": "Which story word means where and when?", "hint": "It starts with s.", "placeholder": "Type a story word"}, {"q": "Read: <i>Lena's hands shook as she held the puppy for the first time. Then she smiled. She hugged the puppy close.</i><br>How does Lena feel?", "choices": ["angry, then sad", "bored the whole time", "nervous, then happy"], "a": 2, "why": "Shaking hands are a clue for <b>nervous</b>. Smiling and hugging are clues for <b>happy</b>.", "no": ["Nothing in the story shows angry or sad. Look at her hands and her smile.", "She is not bored. Her hands shake, then she smiles.", null]}], "notes": {"do": "Hands off. Note her first answers on paper.", "listen": "20, 500, setting, nervous then happy. All four right means she is ready for the after-class lesson tonight. Two or more wrong: go back to that slide for 3 minutes before wrap-up."}}, {"type": "learn", "kick": "Wrap-up", "title": "Your week", "text": "Here is your plan. One small job each day.", "steps": [{"text": "<b>Tonight:</b> the after-class lesson. It ends with Show What You Know."}, {"text": "<b>Wednesday:</b> Practice. <b>Thursday:</b> Packet page 1."}, {"text": "<b>Friday:</b> retake Pathways Week 1 Reading, Theo's First Hike. Look back at the story before you answer."}, {"text": "<b>Saturday:</b> Packet page 2. <b>Sunday:</b> Practice again."}, {"text": "<b>Monday:</b> Pathways Week 1 Math."}], "tip": "Check the box on your task list each time you finish a job.", "notes": {"do": "Open her course page and read the task list together, one day at a time. Have her check off nothing yet; show her where the boxes are. Point out the two OPTIONAL Science and Social Studies links and say they are only if she wants more.", "say": "You did great today. Look at the goal you told me at the start. This week is your first block toward it.", "ask": "What do you do tonight? What do you do on Friday?", "listen": "Tonight: the after-class lesson. Friday: the Pathways reading retake. Tell her to aim for 85 and to type 1111 if a Pathways lesson is locked."}}], "win": "You found every digit's value and every story clue. Great first lesson, Ce'Line!", "prev": null, "prevTitle": ""});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
