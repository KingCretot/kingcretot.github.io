<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 3</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Double, Double, Double: The 8s</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Count your doubles on your fingers. Get 90 or more!</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 3", "title": "Double, Double, Double: The 8s", "mastery": 90, "color": "#10AC84", "questions": [{"q": "<b>4 × 8</b>: 8 → 16 → ?", "choices": ["24", "32", "40"], "a": 1, "why": "Double 16: 16 + 16 = 32. So 4 × 8 = 32.", "no": ["16 + 8 = 24 adds another 8. Doubling 16 means 16 + 16.", null, "40 is 5 × 8. Double 16 instead."]}, {"q": "Which doubling chain gives <b>8 × 3</b>?", "choices": ["3 → 6 → 9 → 12", "3 → 6 → 12", "3 → 6 → 12 → 24"], "a": 2, "why": "Three doubles: 3 → 6 → 12 → 24.", "no": ["That chain adds 3 each time. 12 is only 4 × 3.", "Two doubles make ×4, so 12 is 4 × 3. Double one more time.", null]}, {"q": "What is <b>8 × 9</b>?", "choices": ["63", "81", "72", "64"], "a": 2, "why": "9 → 18 → 36 → 72.", "no": ["63 is 7 × 9. You need one more group of 9.", "81 is 9 × 9. That is one group too many.", null, "64 is 8 × 8. Check: 9 → 18 → 36 → 72."]}, {"q": "Hiccup starts with 7 and doubles <b>three times</b>. Which fact did he find?", "choices": ["3 × 7 = 21", "8 × 7 = 56", "6 × 7 = 42"], "a": 1, "why": "Three doubles multiply by 2 × 2 × 2 = 8. 7 → 14 → 28 → 56.", "no": ["Three doubles is not ×3. Each double is ×2, and 2 × 2 × 2 = 8.", null, "Doubling three times multiplies by 8, not 6."]}, {"q": "Which sentence uses <b>hoard</b> correctly?", "choices": ["Hiccup hoarded across the beach to catch the boat.", "The dragon guarded its hoard of gold deep in the cave.", "The hoard of the song was too loud."], "a": 1, "why": "A <b>hoard</b> is a big pile of saved, hidden things, like a dragon's gold.", "no": ["Hoard is not a way of moving. A hoard is a pile of saved things.", null, "A song does not have a hoard. A hoard is a hidden pile of treasure or supplies."]}, {"q": "What is <b>4 × 6</b>?", "choices": ["24", "18", "20", "12"], "a": 0, "why": "6 → 12 → 24. Two doubles.", "no": [null, "18 is 3 × 6. You added 6 three times. Double, double instead.", "20 is 4 × 5. Use 6 as your start number.", "12 is only one double (2 × 6). Double once more."]}, {"q": "There are <b>8 dragon nests</b> on the cliff. Each nest holds <b>6 eggs</b>. How many eggs?", "choices": ["14", "42", "54", "48"], "a": 3, "why": "8 × 6: 6 → 12 → 24 → 48.", "no": ["You added 8 + 6. Every nest has 6 eggs, so multiply.", "42 is 7 × 6. There are 8 nests.", "54 is 9 × 6. Count the nests again: 8.", null]}, {"q": "<b>8 × 9</b>: 9 → 18 → ___ → 72. What goes in the blank?", "choices": ["27", "36", "45"], "a": 1, "why": "Double 18: 18 + 18 = 36. Then double 36 to get 72.", "no": ["18 + 9 = 27 is adding, not doubling. Double 18.", null, "45 is 5 × 9. Double 18 instead."]}, {"q": "A Viking had 5 coins. Then he <b>quadrupled</b> them. How many coins does he have now?", "choices": ["9", "10", "20", "15"], "a": 2, "why": "Quadruple means 4 times as many: 5 × 4 = 20 (5 → 10 → 20).", "no": ["Quadruple does not mean add 4. It means 4 times as many.", "10 is only doubled. Quadruple is double, then double again.", null, "15 is 3 times as many. Quadruple means 4 times."]}, {"q": "Bailey knows 8 × 7 = 56. She <b>halves</b> 56. Which fact does she get?", "choices": ["8 × 3 = 24", "7 × 7 = 49", "4 × 7 = 28"], "a": 2, "why": "Half of 56 is 28. Half of 8 groups is 4 groups, so 4 × 7 = 28.", "no": ["Half of 8 is 4, so the 8 becomes 4 and the 7 stays.", "Halving 56 gives 28, not 49.", null]}, {"q": "Fishlegs says, \"8 × 6 is 6, 12, 18. So 8 × 6 = 18.\" What should he have done?", "choices": ["Doubled four times", "Doubled three times: 12, 24, 48", "Started with 8 instead of 6"], "a": 1, "why": "6 → 12 → 24 → 48. He added 6 instead of doubling 12. 8 × 6 = 48.", "no": ["Four doubles is ×16. Three doubles is ×8.", null, "Starting with 6 is fine. The mistake is adding 6 instead of doubling."]}, {"q": "Which sentence uses <b>amplify</b> correctly?", "choices": ["The horn will amplify the chief's call so the whole island hears it.", "Toothless amplified the fish because it was too big.", "Fishlegs amplified into the room on tiptoe."], "a": 0, "why": "<b>Amplify</b> means make bigger, louder, or stronger. A horn makes a call louder.", "no": [null, "If the fish was too big, making it bigger makes no sense. Amplify means make bigger or louder.", "Amplify is not a way of walking. It means make louder or stronger."]}]});</script></body></html>
