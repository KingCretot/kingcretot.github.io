<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Bonus Lesson: Inside Amazon: From Click to Doorstep</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-A1", "label": "Bonus Lesson", "title": "Inside Amazon: From Click to Doorstep", "goal": "I can explain how an order moves through a fulfillment center and around the world.", "date": "2026-11-08", "mastery": 90, "color": "#C9A84C", "slides": [{"type": "hello", "title": "Inside Amazon", "text": "On Monday you get to go inside Amazon! 🎉 Today you find out how one order travels through a giant building and out to the whole world.", "visual": {"kind": "emoji", "text": "🏭📦🤖🌍"}, "notes": {"do": "Share your screen. This is a bonus lesson to get her ready for Monday's Amazon visit. Today is Zoom, so she writes and types nothing in class: she says every answer, and you type or tap exactly what she says. Ask Tia before class to set out paper and a pencil.", "say": "On Monday you will see one of the biggest buildings you have ever been in. Today you become the expert first.", "ask": "What is something your family ordered that came really fast?", "listen": "A real example. Ask: how do you think it got there so fast?"}}, {"type": "talk", "kick": "Predict", "title": "Make a prediction", "text": "Make a prediction. You will check it at the end.", "prompts": ["How many items do you think one fulfillment center can hold?", "Do robots or people do most of the work? Why do you think so?", "How could a package get from Florida to a family in Japan?"], "starters": ["I predict … because …", "I think … do most of the work because …", "First the package … then …"], "notes": {"do": "4 minutes. Write her three predictions on the whiteboard and keep them on camera. You check them on slide 12.", "listen": "Predictions with a reason (because …)."}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Read each card out loud. Then use it in your own sentence.", "words": [{"word": "fulfillment center", "pos": "noun", "emoji": "🏭", "meaning": "A giant building where orders are stored, packed and sent out.", "example": "The <b>fulfillment center</b> is as big as many football fields."}, {"word": "inventory", "pos": "noun", "emoji": "🗄️", "meaning": "All the items a business has ready to sell.", "example": "Computers keep track of every item in the <b>inventory</b>."}, {"word": "logistics", "pos": "noun", "emoji": "🧭", "meaning": "Planning how to move things to the right place at the right time.", "example": "Good <b>logistics</b> gets a package to you in one or two days."}, {"word": "automated", "pos": "adjective", "emoji": "🤖", "meaning": "Done by machines that run by themselves.", "example": "The label machine is <b>automated</b>: no one has to stick labels on by hand."}, {"word": "global", "pos": "adjective", "emoji": "🌍", "meaning": "Having to do with the whole world.", "example": "Amazon is a <b>global</b> company that ships to many countries."}, {"word": "efficient", "pos": "adjective", "emoji": "⚡", "meaning": "Doing a job well without wasting time or energy.", "example": "Robots make picking more <b>efficient</b> because workers walk less."}], "notes": {"do": "She tells you which card to flip and reads each word aloud. She makes a sentence about Monday with two of the words.", "ask": "Use logistics and efficient in one sentence.", "listen": "Logistics = planning how things move; efficient = no wasted time."}}, {"type": "learn", "kick": "Learn", "title": "How one order moves", "text": "Inside a fulfillment center, every order follows the same path.", "steps": [{"text": "📥 Receive: trucks unload boxes of new items into the building."}, {"text": "🗄️ Stow: workers put items into any open bin on a yellow pod, and the computer remembers exactly where each one is."}, {"text": "🛒 Pick: a robot drives the pod to a worker, who takes out the ordered item and puts it in a yellow tote."}, {"text": "📦 Pack: a computer suggests the right box size, and a machine measures just enough tape."}, {"text": "🏷️ SLAM: the box rolls under a machine that Scans, Labels, Applies and Manifests it. The package is weighed to check that everything is inside."}, {"text": "🚚 Ship: a sorter reads the label and sends the package down the slide to the right truck."}], "tip": "Receive, stow, pick, pack, SLAM, ship.", "notes": {"do": "Go one step at a time. After each step, she says it back in her own words.", "say": "Stowing looks messy on purpose: a toy can sit next to a toothbrush. The computer remembers every spot, so any open space can be used.", "ask": "Why would putting items in any open bin be more efficient than giving every type of item its own shelf?", "listen": "No wasted space, and workers stow faster."}}, {"type": "order", "kick": "Put in order", "title": "Follow the order", "text": "Say the steps in order. Jonathan taps them.", "steps": ["📥 Receive: trucks unload boxes of new items into the building.", "🗄️ Stow: workers put items into any open bin on a yellow pod, and the computer remembers exactly where each one is.", "🛒 Pick: a robot drives the pod to a worker, who takes out the ordered item and puts it in a yellow tote.", "📦 Pack: a computer suggests the right box size, and a machine measures just enough tape.", "🏷️ SLAM: the box rolls under a machine that Scans, Labels, Applies and Manifests it. The package is weighed to check that everything is inside.", "🚚 Ship: a sorter reads the label and sends the package down the slide to the right truck."], "why": "Receive, stow, pick, pack, SLAM, ship.", "hint": "The label goes on after the box is packed.", "notes": {"do": "She says the order from memory; you tap the steps in her order.", "listen": "SLAM comes after pack and before ship."}}, {"type": "learn", "kick": "Learn", "title": "Robots and people", "text": "Amazon put its <b>one-millionth robot</b> to work in 2025. But people are still part of every order.", "visual": {"kind": "emoji", "text": "🤖 + 🙋 = 📦"}, "steps": [{"text": "<b>Robots</b> slide under the yellow pods and drive them to workers, so workers do not have to walk miles of aisles."}, {"text": "<b>People</b> pick and stow items, check the work, and fix problems, like a robot that gets stuck."}, {"text": "<b>Automated machines</b> measure tape, print labels and sort packages to the right trucks."}], "tip": "Robots bring the shelf to the person. That makes the work more efficient.", "notes": {"do": "On Monday the robots work in a fenced area so people stay safe.", "ask": "Why is it more efficient for the shelf to come to the person?", "listen": "It saves walking time, so orders move faster."}}, {"type": "sort", "kick": "Sort it", "title": "Robot, machine or person?", "text": "Tap a job. Then tap the box.", "buckets": ["🤖 Robot or automated machine", "🙋 Person"], "items": [{"text": "Drive a pod to the pick station", "b": 0, "why": "Robots drive the pods.", "hint": "Who lifts the pods?"}, {"text": "Print and stick the shipping label", "b": 0, "why": "The SLAM machine labels the box automatically.", "hint": "It happens on the moving belt."}, {"text": "Choose the right item from a crowded bin", "b": 1, "why": "A person looks at the screen and picks the item.", "hint": "Who uses their hands to grab it?"}, {"text": "Reset a robot that stopped on the floor", "b": 1, "why": "A floor monitor fixes stuck robots.", "hint": "Can a stuck robot fix itself?"}, {"text": "Send each package down the right slide", "b": 0, "why": "An automated sorter reads the label and picks the slide.", "hint": "The sorter reads the label."}], "notes": {"do": "She tells you the job and the box; you tap. Ask her to explain two of them."}}, {"type": "tap", "kick": "Amazon math", "title": "Estimate, then multiply", "text": "Estimate first. Then solve on paper and say the answer. Jonathan types it.", "items": [{"q": "A truck holds <b>236 packages</b>. Which is the best estimate for <b>4 trucks</b>?", "choices": ["between 800 and 1,200", "between 80 and 120", "between 8,000 and 12,000"], "a": 0, "why": "200 × 4 = 800 and 300 × 4 = 1,200.", "no": [null, "236 is more than 100, so 4 trucks hold more than 400.", "Too many zeros. 300 × 4 = 1,200."]}, {"type": "fill", "q": "Now solve it: <b>236 × 4</b> = ____ packages", "answers": ["944"], "why": "200 × 4 = 800, 30 × 4 = 120, 6 × 4 = 24. 800 + 120 + 24 = 944. It is between 800 and 1,200 ✔.", "no": "Use three boxes: 200, 30 and 6. Multiply each by 4, then add.", "hint": "800 + 120 + 24", "visual": {"kind": "area", "b": 4, "split": [200, 30, 6], "show": false}}, {"type": "fill", "q": "A pick station gets <b>24 pods</b> an hour. Each pod has <b>12 bins</b>. How many bins in an hour? <b>24 × 12</b> = ____", "answers": ["288"], "why": "20 × 10 = 200, 20 × 2 = 40, 4 × 10 = 40, 4 × 2 = 8. 200 + 40 + 40 + 8 = 288.", "no": "Use four boxes: 20 and 4 across, 10 and 2 down.", "hint": "200 + 40 + 40 + 8"}, {"type": "fill", "q": "<b>56 totes</b> are shared equally among <b>8 workers</b>. How many totes does each worker get?", "answers": ["7"], "why": "8 × 7 = 56, so 56 ÷ 8 = 7 totes.", "no": "Think: 8 times what is 56?", "hint": "8 × ? = 56"}], "notes": {"do": "She works on paper, holds it up, and says each answer; you type it. The estimate always comes first.", "ask": "Does your answer match your estimate?", "listen": "She checks the answer against the estimate without being asked."}}, {"type": "learn", "kick": "Learn", "title": "A global network", "text": "Amazon sends packages to customers in more than <b>100 countries</b>. Good logistics plans every trip.", "visual": {"kind": "emoji", "text": "🚚 ✈️ 🚢 🛸"}, "steps": [{"text": "🚢 <b>Ships</b> carry huge containers of items across oceans to fulfillment centers."}, {"text": "✈️ <b>Amazon cargo planes</b> fly packages between faraway cities."}, {"text": "🚚 <b>Trucks and vans</b> bring packages from delivery stations to front doors."}, {"text": "🛸 Amazon is even testing <b>drones</b> that fly small packages to some homes."}], "tip": "Amazon has fulfillment centers in many countries, so many orders never cross an ocean at all.", "notes": {"do": "Hold up a globe or map if you have one. Trace a route: a factory overseas → ship → fulfillment center in Florida → truck → her house.", "ask": "Why would Amazon build fulfillment centers in many countries instead of one giant one?", "listen": "Packages arrive faster and travel less."}}, {"type": "tap", "kick": "Think about it", "title": "Logistics puzzles", "text": "Say the answer and your reason. Jonathan taps it.", "items": [{"q": "A family in Japan orders a book. What is the most <b>efficient</b> plan?", "choices": ["ship it from a fulfillment center in Japan", "fly one book from Florida", "send it by boat from Florida"], "a": 0, "why": "If the book is already in a nearby fulfillment center, it travels the shortest distance.", "no": [null, "That works, but it travels much farther than it needs to.", "That would take weeks."]}, {"q": "Why does the SLAM machine <b>weigh</b> every package?", "choices": ["to check that everything is inside", "to make the box lighter", "to pick a color"], "a": 0, "why": "If the weight is wrong, something may be missing.", "no": [null, "Weighing does not change the box.", "Weight has nothing to do with color."]}, {"q": "What does <b>inventory</b> mean?", "choices": ["all the items a business has ready to sell", "the trucks a business owns", "the people who work there"], "a": 0, "why": "Inventory is the stock of items ready to sell.", "no": [null, "Trucks are part of shipping, not inventory.", "Those are the workers."]}], "notes": {"do": "She explains each reason before you tap."}}, {"type": "talk", "kick": "Get ready", "title": "Be a smart visitor", "text": "Think about Monday.", "prompts": ["The tour asks for closed shoes and long hair tied back. Why do those rules matter in a busy building?", "Write one question for the guide. Make it one you cannot answer yet.", "What will you count or measure on the tour?"], "starters": ["Those rules matter because …", "My question is …", "I will count …"], "notes": {"do": "Help her choose a strong question for the guide and write it on Field Notes page 1. Remind her that photos are allowed only at the marked spots.", "ask": "What is your question for the guide?", "listen": "A question that needs the guide, like 'How many items can this building hold?'"}}, {"type": "learn", "kick": "Check your predictions", "title": "Were you right?", "text": "Look at your predictions from the start.", "steps": [{"text": "A big fulfillment center can hold <b>millions</b> of items at once."}, {"text": "Robots and people work <b>together</b>: robots carry, people pick and check."}, {"text": "Amazon has fulfillment centers in Japan, so many orders there ship from <b>nearby</b>."}], "tip": "On Monday, see if you can find proof!", "notes": {"do": "Hold up the whiteboard. She checks each prediction: right, close, or changed her mind.", "ask": "Which prediction surprised you most?"}}, {"type": "learn", "kick": "Your plan", "title": "Before and after the trip", "steps": [{"text": "<b>Tonight:</b> do the After-class lesson. It ends with Show What You Know."}, {"text": "<b>Monday at Amazon:</b> bring your <b>Field Notes</b> (page 1). Fill it in on the trip."}, {"text": "<b>Tuesday:</b> bring your Field Notes to class and tell me one fact you learned."}], "tip": "Have fun on Monday!", "notes": {"do": "Show her the Field Notes on the course page. Ask Tia to print page 1 for the trip.", "ask": "What will you do tonight? What will you bring on Monday?"}}], "win": "You are an Amazon expert now. Have an amazing trip!", "prev": null, "prevTitle": ""});</script><script type="module" src="../../kce-progress/kce-progress.js" data-course="bb-bailey"></script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==
