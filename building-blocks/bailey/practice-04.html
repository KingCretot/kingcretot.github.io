<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 4</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Break It Apart: The 7s</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Break the 7 into 5 + 2. Get 90 or more!</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 4", "title": "Break It Apart: The 7s", "mastery": 90, "color": "#10AC84", "questions": [{"q": "<b>7 × 3</b> = (5 × 3) + (2 × 3) = 15 + 6. What is 7 × 3?", "choices": ["17", "21", "24"], "a": 1, "why": "15 + 6 = 21.", "no": ["17 is 15 + 2. The second part is 2 × 3, which is 6.", null, "24 is 8 × 3. Add 15 + 6."]}, {"q": "Which shows <b>7 × 6</b> broken apart correctly?", "choices": ["(5 × 6) + 2", "(5 + 6) × 2", "(5 × 6) + (2 × 6)"], "a": 2, "why": "Both parts of the 7 get multiplied by 6: 30 + 12 = 42.", "no": ["The 2 must be multiplied by 6 too.", "That is 11 × 2 = 22. The 7 is what gets broken apart, not the 6.", null]}, {"q": "What is <b>7 × 9</b>?", "choices": ["63", "54", "47", "72"], "a": 0, "why": "(5 × 9) + (2 × 9) = 45 + 18 = 63.", "no": [null, "54 is 6 × 9. You need 7 groups of 9.", "47 is 45 + 2. The 2 means 2 groups of 9, which is 18.", "72 is 8 × 9. One group too many."]}, {"q": "What is <b>7 × 8</b>? Remember: 5, 6, 7, 8.", "choices": ["54", "58", "64", "56"], "a": 3, "why": "56 = 7 × 8. Check: 40 + 16 = 56.", "no": ["54 is 6 × 9. Say it: 5, 6, 7, 8.", "Check with a break-apart: 40 + 16.", "64 is 8 × 8. You need one less group of 8.", null]}, {"q": "Which is a way to <b>decompose</b> 7 for multiplying?", "choices": ["7 + 7", "5 + 2", "7 × 7"], "a": 1, "why": "To decompose is to break into smaller parts. 7 = 5 + 2.", "no": ["7 + 7 doubles the 7. It makes it bigger instead of breaking it apart.", null, "7 × 7 makes 49. Decompose means break into smaller parts."]}, {"q": "For <b>7 × 7</b>, using 7 = 5 + 2, what are the two <b>partial products</b>?", "choices": ["35 and 14", "35 and 7", "25 and 14"], "a": 0, "why": "5 × 7 = 35 and 2 × 7 = 14. 35 + 14 = 49.", "no": [null, "7 is only one seven. The bottom part is 2 sevens.", "25 is 5 × 5. The top part is 5 × 7."]}, {"q": "Stoick's tribe has <b>7 longships</b>. Each longship has <b>6 oars</b> on each side, so 12 oars per ship. How many oars in all?", "choices": ["19", "84", "42", "72"], "a": 1, "why": "7 × 12 = (7 × 10) + (7 × 2) = 70 + 14 = 84. You can break apart the 12 too!", "no": ["19 is 7 + 12. Every ship has 12 oars, so multiply.", null, "42 is 7 × 6. That counts only one side of each ship.", "72 is 6 × 12. There are 7 ships."]}, {"q": "Hiccup has to wait <b>3 weeks</b> for his dragon egg to hatch. How many days is that?", "choices": ["10", "21", "24", "18"], "a": 1, "why": "3 × 7 = 15 + 6 = 21 days.", "no": ["10 is 3 + 7. Each week has 7 days, so multiply.", null, "24 is 3 × 8. A week has 7 days.", "18 is 3 × 6. A week has 7 days."]}, {"q": "Which sentence uses <b>fragment</b> correctly?", "choices": ["A sharp fragment of the broken cup cut my finger.", "The fragment roared and flew over the village.", "Hiccup fragmented happily all the way home."], "a": 0, "why": "A <b>fragment</b> is a small broken piece, like a piece of a cup.", "no": [null, "A fragment is a piece of something, not an animal that can roar.", "Fragment is not a way to travel. It is a small broken piece."]}, {"q": "Which sentence uses <b>tactic</b> correctly?", "choices": ["Fishlegs wore a warm tactic on his head.", "The tactic swam under the boat.", "Breaking 7 into 5 and 2 is a smart tactic for hard facts."], "a": 2, "why": "A <b>tactic</b> is a planned move to reach a goal.", "no": ["A tactic is not something you wear. It is a planned move.", "A tactic cannot swim. It is a plan or move.", null]}, {"q": "Bailey writes: 7 × 8 = 35 + 16 = 51. What went wrong?", "choices": ["She should have doubled 16.", "She used 5 × 7 instead of 5 × 8 for the first part.", "Nothing. 51 is right."], "a": 1, "why": "The top part is 5 × 8 = 40, not 35. 40 + 16 = 56.", "no": ["16 is already 2 × 8, which is correct. Look at the first part.", null, "7 × 8 is 56. Look at the first partial product."]}, {"q": "Which is <b>NOT</b> a correct way to find 7 × 6?", "choices": ["(5 × 6) + (2 × 6)", "(7 × 5) + (7 × 1)", "(5 × 6) + 2"], "a": 2, "why": "(5 × 6) + 2 = 32. The 2 was never multiplied by 6. The other two both make 42.", "no": ["This one works: 30 + 12 = 42.", "This one works too. It breaks the 6 into 5 + 1: 35 + 7 = 42.", null]}]});</script></body></html>
