. It is a planned move.", "A tactic cannot swim. It is a plan or move.", null]}, {"q": "Bailey writes: 7 × 8 = 35 + 16 = 51. What went wrong?", "choices": ["She should have doubled 16.", "She used 5 × 7 instead of 5 × 8 for the first part.", "Nothing. 51 is right."], "a": 1, "why": "The top part is 5 × 8 = 40, not 35. 40 + 16 = 56.", "no": ["16 is already 2 × 8, which is correct. Look at the first part.", null, "7 × 8 is 56. Look at the first partial product."]}, {"q": "Which is <b>NOT</b> a correct way to find 7 × 6?", "choices": ["(5 × 6) + (2 × 6)", "(7 × 5) + (7 × 1)", "(5 × 6) + 2"], "a": 2, "why": "(5 × 6) + 2 = 32. The 2 was never multiplied by 6. The other two both make 42.", "no": ["This one works: 30 + 12 = 42.", "This one works too. It breaks the 6 into 5 + 1: 35 + 7 = 42.", null]}], "id": "bailey-L04", "sets": [[{"type": "fill", "q": "<b>7 × 3</b> = (5 × 3) + (2 × 3) = 15 + 6. What is 7 × 3?", "answers": ["21"], "why": "15 + 6 = 21.", "no": "Add the two partial products: 15 + 6."}, {"q": "Which shows <b>7 × 6</b> broken apart correctly?", "choices": ["(5 × 6) + 2", "(5 + 6) × 2", "(5 × 6) + (2 × 6)"], "a": 2, "why": "Both parts of the 7 get multiplied by 6: 30 + 12 = 42.", "no": ["The 2 must be multiplied by 6 too.", "That is 11 × 2 = 22. Break the 7 into 5 and 2, and multiply each piece by 6.", null]}, {"type": "fill", "q": "What is <b>7 × 4</b>? Break the 7 apart.", "answers": ["28"], "why": "(5 × 4) + (2 × 4) = 20 + 8 = 28.", "no": "Find 5 × 4 and 2 × 4. Then add."}, {"type": "fill", "q": "Say 5, 6, 7, 8. So 7 × ____ = 56.", "answers": ["8"], "why": "5, 6, 7, 8: 56 = 7 × 8. Check: 40 + 16 = 56.", "no": "Say it: 5, 6, 7, 8. Which number comes after the 7?"}, {"q": "Which is a way to <b>decompose</b> 7 for multiplying?", "choices": ["5 × 2", "5 + 2", "7 + 7", "3 + 3"], "a": 1, "why": "To decompose is to break into smaller parts. 7 = 5 + 2.", "no": ["5 × 2 makes 10, not 7. The parts must add up to 7.", null, "7 + 7 doubles the 7. It makes it bigger inste  × 8)"], "a": 1, "why": "(5 × 8) + (2 × 7) = 40 + 14 = 54. The 2 should be multiplied by 8. The other two both make 56.", "no": ["This one works. It breaks the 8 into 4 + 4: 28 + 28 = 56.", null, "This one works: 40 + 16 = 56."]}], [{"type": "fill", "q": "<b>7 × 17</b> = (5 × 17) + (2 × 17) = 85 + 34. What is 7 × 17?", "answers": ["119", "one hundred nineteen", "one hundred and nineteen"], "why": "85 + 34 = 119.", "no": "Add the two partial products: 85 + 34."}, {"q": "Which shows <b>7 × 14</b> broken apart correctly?", "choices": ["(5 × 7) + (2 × 7)", "(5 × 14) + 14", "(5 × 14) + (2 × 14)"], "a": 2, "why": "Both parts of the 7 get multiplied by 14: 70 + 28 = 98.", "no": ["That is 7 × 7. Keep the 14 and break the 7 into 5 + 2.", "That adds only one 14, which makes 6 × 14. The bottom part needs 2 × 14.", null]}, {"type": "fill", "q": "What is <b>7 × 19</b>? Break the 7 apart.", "answers": ["133", "one hundred thirty-three", "one hundred and thirty-three", "one hundred thirty three", "one hundred and thirty three"], "why": "(5 × 19) + (2 × 19) = 95 + 38 = 133.", "no": "Find 5 × 19 and 2 × 19. Then add."}, {"type": "fill", "q": "Say 5, 6, 7, 8. Use it to find <b>56 ÷ 8</b> = ____.", "answers": ["7", "seven"], "why": "5, 6, 7, 8 means 56 = 7 × 8. So 56 ÷ 8 = 7. Check: 40 + 16 = 56.", "no": "Say it: 5, 6, 7, 8. 8 times what is 56?"}, {"q": "Which sentence uses <b>decompose</b> correctly?", "choices": ["Fishlegs decomposed a new song for the dragons.", "Bailey decomposed 7 into 5 and 2 to find 7 × 8.", "Astrid decomposed 7 into 3 and 3.", "Hiccup decomposed 5 and 2 into one big 7."], "a": 1, "why": "To decompose is to break a number into smaller parts. 5 + 2 = 7.", "no": ["You compose a song. Decompose means break a number into smaller parts.", null, "3 + 3 makes 6, not 7. The parts must add up to 7.", "Putting parts together is the opposite of decomposing."]}, {"q": "For <b>7 × 22</b>, using 7 = 5 + 2, what are the two <b>partial products</b>?", "choices": ["110 and 44",
