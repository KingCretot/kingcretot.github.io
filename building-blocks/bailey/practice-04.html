<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 4</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Break It Apart: The 7s</h1><p style="margin:0 0 12px;color:#5b6578">Three tries on each one. Only your first try counts. Type most answers. Break the 7 into 5 + 2.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 4", "title": "Break It Apart: The 7s", "mastery": 90, "color": "#10AC84", "questions": [{"type": "fill", "q": "<b>7 × 3</b> = (5 × 3) + (2 × 3) = 15 + 6. What is 7 × 3?", "answers": ["21"], "why": "15 + 6 = 21.", "no": "Add the two partial products: 15 + 6."}, {"q": "Which shows <b>7 × 6</b> broken apart correctly?", "choices": ["(5 × 6) + 2", "(5 + 6) × 2", "(5 × 6) + (2 × 6)"], "a": 2, "why": "Both parts of the 7 get multiplied by 6: 30 + 12 = 42.", "no": ["The 2 must be multiplied by 6 too.", "That is 11 × 2 = 22. Break the 7 into 5 and 2, and multiply each piece by 6.", null]}, {"type": "fill", "q": "What is <b>7 × 4</b>? Break the 7 apart.", "answers": ["28"], "why": "(5 × 4) + (2 × 4) = 20 + 8 = 28.", "no": "Find 5 × 4 and 2 × 4. Then add."}, {"type": "fill", "q": "Say 5, 6, 7, 8. So 7 × ____ = 56.", "answers": ["8"], "why": "5, 6, 7, 8: 56 = 7 × 8. Check: 40 + 16 = 56.", "no": "Say it: 5, 6, 7, 8. Which number comes after the 7?"}, {"q": "Which is a way to <b>decompose</b> 7 for multiplying?", "choices": ["5 × 2", "5 + 2", "7 + 7", "3 + 3"], "a": 1, "why": "To decompose is to break into smaller parts. 7 = 5 + 2.", "no": ["5 × 2 makes 10, not 7. The parts must add up to 7.", null, "7 + 7 doubles the 7. It makes it bigger instead of breaking it apart.", "3 + 3 makes 6, not 7. The parts must add up to 7."]}, {"q": "For <b>7 × 7</b>, using 7 = 5 + 2, what are the two <b>partial products</b>?", "choices": ["35 and 14", "35 and 7", "25 and 14"], "a": 0, "why": "5 × 7 = 35 and 2 × 7 = 14. 35 + 14 = 49.", "no": [null, "7 is only one seven. The bottom part is 2 sevens.", "25 is 5 × 5. The top part is 5 × 7."]}, {"type": "fill", "q": "Stoick's tribe has 7 longships. Each longship has 12 oars. How many oars in all?", "answers": ["84", "84 oars"], "why": "7 × 12 = (7 × 10) + (7 × 2) = 70 + 14 = 84. You can break apart the 12 too!", "no": "Break the 12 into 10 + 2. Find 7 × 10 and 7 × 2.", "hint": "70 + 14 = ?"}, {"type": "fill", "q": "Fishlegs practices sword fighting for 3 weeks. How many days is that?", "answers": ["21", "21 days"], "why": "3 × 7 = 15 + 6 = 21 days.", "no": "Each week has 7 days. 3 groups of 7."}, {"type": "fill", "q": "Use one of your new words: a sharp ____ of the broken cup cut my finger.", "answers": ["fragment"], "why": "A <b>fragment</b> is a small broken piece.", "no": "Which word means a small broken piece? It starts with <b>f</b>."}, {"q": "Which sentence uses <b>tactic</b> correctly?", "choices": ["Fishlegs wore a warm tactic on his head.", "The tactic swam under the boat.", "Breaking 7 into 5 and 2 is a smart tactic for hard facts."], "a": 2, "why": "A <b>tactic</b> is a planned move to reach a goal.", "no": ["A tactic is not something you wear. It is a planned move.", "A tactic cannot swim. It is a plan or move.", null]}, {"q": "Bailey writes: 7 × 8 = 35 + 16 = 51. What went wrong?", "choices": ["She should have doubled 16.", "She used 5 × 7 instead of 5 × 8 for the first part.", "Nothing. 51 is right."], "a": 1, "why": "The top part is 5 × 8 = 40, not 35. 40 + 16 = 56.", "no": ["16 is already 2 × 8, which is correct. Look at the first part.", null, "7 × 8 is 56. Look at the first partial product."]}, {"q": "Which is <b>NOT</b> a correct way to find 7 × 6?", "choices": ["(5 × 6) + (2 × 6)", "(7 × 5) + (7 × 1)", "(5 × 6) + 2"], "a": 2, "why": "(5 × 6) + 2 = 32. The 2 was never multiplied by 6. The other two both make 42.", "no": ["This one works: 30 + 12 = 42.", "This one works too. It breaks the 6 into 5 + 1: 35 + 7 = 42.", null]}]});</script></body></html>
