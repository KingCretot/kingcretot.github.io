<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 3: Double, Double, Double: The 8s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L03", "label": "Lesson 3", "title": "Double, Double, Double: The 8s", "goal": "I can find any ×8 fact by doubling three times.", "date": "2026-10-26", "mastery": 90, "color": "#10AC84", "slides": [{"type": "hello", "title": "Double, Double, Double on Your Own", "text": "In class you learned to double your way to the 4s and 8s. Now do it on your own. You will <b>type</b> most answers. Finish with Show What You Know.", "visual": {"kind": "emoji", "text": "✌️ ✌️ ✌️ ⌨️"}}, {"type": "learn", "kick": "Quick reminder", "title": "Count the doubles", "text": "Read this once. Then you are ready.", "visual": {"kind": "passage", "text": "✌️ <b>×2</b>: double once. 2 × 9 → 18<br>✌️✌️ <b>×4</b>: double twice. 4 × 9 → 18 → 36<br>✌️✌️✌️ <b>×8</b>: double three times. 8 × 9 → 18 → 36 → 72<br>➕ Big doubles: tens, then ones. 36 + 36 → 60 + 12 = 72"}, "tip": "Doubling means add the number to <b>itself</b>. 14 doubled is 14 + 14, not 14 + 7."}, {"type": "vocab", "kick": "Word Power", "title": "Your 7 words", "text": "Flip each card one more time. Next you will <b>type</b> these words from memory.", "words": [{"word": "double", "pos": "verb", "meaning": "to make something two times as big; to multiply by 2", "example": "If you <b>double</b> 14, you get 28.", "emoji": "✌️"}, {"word": "halve", "pos": "verb", "meaning": "to cut something into two equal parts; to divide by 2", "example": "If you <b>halve</b> 56, you get 28.", "emoji": "✂️"}, {"word": "quadruple", "pos": "verb", "meaning": "to make something four times as big", "example": "When you <b>quadruple</b> 6, you get 24.", "emoji": "🍀"}, {"word": "hoard", "pos": "noun", "meaning": "a large pile of things someone has saved and hidden", "example": "The dragon slept on a <b>hoard</b> of gold coins.", "emoji": "💰"}, {"word": "gargantuan", "pos": "adjective", "meaning": "huge; far bigger than usual", "example": "A <b>gargantuan</b> sea dragon rose out of the waves.", "emoji": "🐉"}, {"word": "formidable", "pos": "adjective", "meaning": "so strong or powerful that people are afraid of it or respect it", "example": "The Viking chief was a <b>formidable</b> warrior.", "emoji": "🛡️"}, {"word": "amplify", "pos": "verb", "meaning": "to make something bigger, louder, or stronger", "example": "Hiccup cupped his hands to <b>amplify</b> his voice.", "emoji": "📣"}]}, {"type": "tap", "kick": "Word Power", "title": "Type the word", "text": "Type the word that fits. Spell it carefully.", "items": [{"type": "fill", "q": "Which word means <i>to make something four times as big</i>?", "answers": ["quadruple"], "why": "<b>Quadruple</b> means four times as big. It is double, then double again.", "no": "Think of a quad bike: four wheels.", "hint": "quad-ru-ple"}, {"type": "fill", "q": "Which word means <i>to make something bigger, louder, or stronger</i>?", "answers": ["amplify"], "why": "To <b>amplify</b> is to make bigger, louder, or stronger.", "no": "Look back at the word cards. It starts with <b>a</b>.", "hint": "am-pli-fy"}, {"type": "fill", "q": "Fishlegs kept a secret ____ of honey cakes under his bed.", "answers": ["hoard"], "why": "A <b>hoard</b> is a big pile of things someone has saved and hidden.", "no": "Which word means a pile of saved, hidden things?", "hint": "It starts with <b>h</b>."}, {"type": "fill", "q": "Halve 30 and you get 15. ____ 15 and you get 30 again.", "answers": ["double"], "why": "To <b>double</b> is to make two times as big: 15 + 15 = 30. Double undoes halve.", "no": "Which word is the opposite of halve?"}]}, {"type": "tap", "kick": "Doubling chains", "title": "Finish the chain", "text": "Type the missing number.", "items": [{"type": "fill", "q": "8 × 5: 5 → 10 → 20 → ____", "answers": ["40"], "why": "Double 20: 20 + 20 = 40. So 8 × 5 = 40.", "no": "Double 20 means 20 + 20."}, {"type": "fill", "q": "4 × 9: 9 → 18 → ____", "answers": ["36"], "why": "Double 18: 18 + 18 = 36. So 4 × 9 = 36.", "no": "Double 18: 10 + 10, then 8 + 8."}, {"type": "fill", "q": "8 × 2: 2 → 4 → 8 → ____", "answers": ["16"], "why": "Double 8: 8 + 8 = 16. So 8 × 2 = 16.", "no": "Double 8 means 8 + 8."}, {"type": "fill", "q": "8 × 6: 6 → 12 → ____ → 48", "answers": ["24"], "why": "Double 12: 12 + 12 = 24. Then 24 + 24 = 48.", "no": "Double 12 means 12 + 12."}]}, {"type": "sort", "kick": "Sort it", "title": "How many doubles?", "text": "Tap a fact. Then tap the box for how many times you double the other number. Turn it around if you need to.", "buckets": ["Double once<br><small>×2</small>", "Double twice<br><small>×4</small>", "Double three times<br><small>×8</small>"], "items": [{"text": "4 × 5", "b": 1, "why": "×4 is two doubles: 5 → 10 → 20.", "hint": "The 4 tells you how many doubles. How many doubles make ×4?"}, {"text": "9 × 8", "b": 2, "why": "Turn it around: 8 × 9. Three doubles: 9 → 18 → 36 → 72.", "hint": "Turn it around to 8 × 9. How many doubles make ×8?"}, {"text": "7 × 2", "b": 0, "why": "×2 is one double: 7 → 14.", "hint": "The 2 tells you how many doubles. ×2 is double one time."}, {"text": "3 × 4", "b": 1, "why": "Turn it around: 4 × 3. Two doubles: 3 → 6 → 12.", "hint": "Turn it around to 4 × 3. How many doubles make ×4?"}, {"text": "8 × 6", "b": 2, "why": "×8 is three doubles: 6 → 12 → 24 → 48.", "hint": "The 8 tells you how many doubles. How many doubles make ×8?"}, {"text": "5 × 2", "b": 0, "why": "Turn it around: 2 × 5. One double: 5 → 10.", "hint": "Turn it around to 2 × 5. ×2 is double one time."}], "done": "×2 = one double. ×4 = two doubles. ×8 = three doubles."}, {"type": "talk", "kick": "Say it out loud", "title": "Teach someone at home", "text": "Find someone at home. Teach them for two minutes.", "prompts": ["Show them how to find <b>8 × 9</b> with three doubles. Count the doubles on your fingers.", "Show them how to double 36 with tens and ones.", "Tell them about something <b>gargantuan</b> or <b>formidable</b> in your book."], "starters": ["Start with 9. Double it …", "Double the tens: … Double the ones: …", "In my book, … is formidable because …"]}, {"type": "tap", "kick": "Word problems", "title": "Doubling on Berk", "text": "Find the equal groups. Then double.", "items": [{"type": "fill", "q": "8 dragons each breathe 7 fireballs. How many fireballs in all?", "answers": ["56"], "why": "8 × 7: 7 → 14 → 28 → 56 fireballs.", "no": "8 equal groups of 7. Double 7 three times."}, {"type": "fill", "q": "Hiccup has 4 baskets with 8 eggs in each. 5 eggs crack. How many eggs are <b>not</b> cracked?", "answers": ["27"], "why": "4 × 8: 8 → 16 → 32 eggs. Then 32 − 5 = 27.", "no": "First find all the eggs (4 × 8). Then take away 5.", "hint": "4 × 8 = 32. Now take away 5."}, {"q": "A rowboat is 9 feet long. A <b>gargantuan</b> sea dragon is <b>8 times</b> as long. Which chain finds its length?", "choices": ["9 + 8 = 17", "9 → 18 → 36 → 72", "9 → 18 → 27 → 36", "8 → 16 → 32"], "a": 1, "why": "8 times as long is 8 × 9. Three doubles of 9: 18, 36, 72 feet.", "no": ["\"Times as long\" means multiply, not add.", null, "That adds 9 each time. Double 18 means 18 + 18.", "That is 4 × 8 = 32. Double the 9 three times."]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "8 × 7 = ____", "answers": ["56"], "why": "7 → 14 → 28 → 56.", "no": "Double 7 three times."}, {"q": "Which chain shows <b>4 × 8</b>?", "choices": ["8 → 16 → 24", "8 → 16 → 32 → 64", "8 → 16 → 32", "4 → 8 → 12 → 16"], "a": 2, "why": "Two doubles: 8 → 16 → 32. So 4 × 8 = 32.", "no": ["16 + 8 = 24 adds an 8. Doubling 16 is 16 + 16.", "That is three doubles. ×4 is only two.", null, "That adds 4 each time. ×4 means double the 8 twice."]}, {"type": "fill", "q": "8 × 8 = ____", "answers": ["64"], "why": "8 → 16 → 32 → 64.", "no": "Double 8 three times."}, {"q": "A <b>gargantuan</b> sea dragon rose from the waves. Which word means almost the same as <b>gargantuan</b>?", "choices": ["enormous", "angry", "ancient", "silent"], "a": 0, "why": "Gargantuan means giant-sized, so enormous is closest.", "no": [null, "Gargantuan is about size, not mood.", "Gargantuan is about size, not age.", "Gargantuan is about size, not sound."]}, {"type": "fill", "q": "Each Viking shield has 4 iron studs. Hiccup polishes 9 shields. How many studs does he polish?", "answers": ["36"], "why": "9 × 4: double 9 twice: 18, 36.", "no": "9 shields with 4 studs each. ×4 is double, double."}, {"q": "What is <b>8 × 3</b>?", "choices": ["11", "21", "32", "24"], "a": 3, "why": "3 → 6 → 12 → 24.", "no": ["11 is 8 + 3. Multiply.", "21 is 7 × 3. One more 3.", "32 is 8 × 4.", null]}, {"type": "fill", "q": "Which word means <i>so strong or powerful that people fear or respect it</i>?", "answers": ["formidable"], "why": "<b>Formidable</b>: so powerful that people fear or respect it.", "no": "It starts with <b>f</b>."}, {"type": "fill", "q": "8 × ____ = 48", "answers": ["6"], "why": "6 → 12 → 24 → 48, so 8 × 6 = 48.", "no": "8 times what is 48? Try doubling a number three times."}, {"q": "Bailey knows 8 × 9 = 72. She <b>halves</b> 72. Which fact does she get?", "choices": ["8 × 4 = 32", "9 × 9 = 81", "4 × 9 = 36", "8 × 8 = 64"], "a": 2, "why": "Half of 8 groups is 4 groups. 4 × 9 = 36, and 36 is half of 72.", "no": ["Half of 72 is 36, not 32.", "Halving makes it smaller, not bigger.", null, "64 is not half of 72."]}, {"type": "fill", "q": "The tribe has 8 longships with 9 Vikings on each. Then 6 Vikings stay home sick. How many Vikings sail?", "answers": ["66"], "why": "8 × 9: 9 → 18 → 36 → 72. Then 72 − 6 = 66.", "no": "First find all the Vikings (8 × 9). Then take away 6."}], [{"type": "fill", "q": "8 × 6 = ____", "answers": ["48"], "why": "6 → 12 → 24 → 48.", "no": "Double 6 three times."}, {"q": "Which chain shows <b>4 × 7</b>?", "choices": ["7 → 14 → 21", "7 → 14 → 28", "7 → 14 → 28 → 56", "4 → 8 → 12"], "a": 1, "why": "Two doubles: 7 → 14 → 28. So 4 × 7 = 28.", "no": ["14 + 7 = 21 adds a 7. Doubling 14 is 14 + 14.", null, "That is three doubles, which is ×8.", "That adds 4 each time. Double the 7 twice."]}, {"type": "fill", "q": "8 × 9 = ____", "answers": ["72"], "why": "9 → 18 → 36 → 72.", "no": "Double 9 three times. 36 + 36 = ?"}, {"q": "The dragon slept on its <b>hoard</b>. What is a hoard?", "choices": ["a soft bed of leaves", "a big pile of saved, hidden treasure", "a loud roar", "a tall mountain"], "a": 1, "why": "A hoard is a large pile of things someone has saved and hidden.", "no": ["A hoard is a pile of saved things, not a bed.", null, "A hoard is a pile, not a sound.", "A hoard is a pile of saved things, not a mountain."]}, {"type": "fill", "q": "The Berk blacksmith makes 4 swords a day for 7 days. How many swords does he make?", "answers": ["28"], "why": "4 × 7: 7 → 14 → 28 swords.", "no": "7 days with 4 swords each. ×4 is double, double."}, {"q": "What is <b>8 × 4</b>?", "choices": ["12", "36", "32", "28"], "a": 2, "why": "4 → 8 → 16 → 32.", "no": ["12 is 8 + 4. Multiply.", "36 is 9 × 4.", null, "28 is 7 × 4."]}, {"type": "fill", "q": "Which word means <i>huge; far bigger than usual</i>?", "answers": ["gargantuan"], "why": "<b>Gargantuan</b> means huge, far bigger than usual.", "no": "It starts with <b>g</b>."}, {"type": "fill", "q": "8 × ____ = 56", "answers": ["7"], "why": "7 → 14 → 28 → 56, so 8 × 7 = 56.", "no": "8 times what is 56?"}, {"q": "Bailey knows 8 × 4 = 32. She <b>halves</b> the 8 to get 4 × 4. What is 4 × 4?", "choices": ["16", "64", "8", "28"], "a": 0, "why": "Half of 32 is 16. Check: 4 → 8 → 16.", "no": [null, "64 is double 32. Halving makes it smaller.", "8 is 2 × 4. 4 × 4 is two doubles: 8, 16.", "28 is 4 × 7."]}, {"type": "fill", "q": "Stoick has 8 crates with 7 apples in each crate. The dragons eat 9 apples. How many apples are left?", "answers": ["47"], "why": "8 × 7 = 56 apples. Then 56 − 9 = 47.", "no": "First find all the apples (8 × 7). Then take away 9."}], [{"type": "fill", "q": "9 × 8 = ____", "answers": ["72"], "why": "Turn it around: 8 × 9. 9 → 18 → 36 → 72.", "no": "Turn it around to 8 × 9. Double 9 three times."}, {"q": "Which chain shows <b>8 × 5</b>?", "choices": ["5 → 10 → 15 → 20", "5 → 10 → 20", "5 → 10 → 20 → 40", "8 → 16 → 32 → 64"], "a": 2, "why": "Three doubles: 5 → 10 → 20 → 40. So 8 × 5 = 40.", "no": ["That adds 5 each time. Double means add the number to itself.", "That is only two doubles, which is ×4.", null, "That is 8 × 8. Double the 5, not the 8."]}, {"type": "fill", "q": "6 × 8 = ____", "answers": ["48"], "why": "Turn it around: 8 × 6. 6 → 12 → 24 → 48.", "no": "Turn it around to 8 × 6. Double 6 three times."}, {"q": "Hiccup cupped his hands to <b>amplify</b> his voice. What happened to his voice?", "choices": ["It got quieter.", "It got louder.", "It got higher.", "It stayed a secret."], "a": 1, "why": "To amplify is to make bigger, louder, or stronger.", "no": ["Amplify makes something bigger or louder, not quieter.", null, "Amplify is about bigger or louder, not higher.", "A louder voice is the opposite of a secret."]}, {"type": "fill", "q": "Fishlegs reads 4 pages each night for 8 nights. How many pages does he read?", "answers": ["32"], "why": "8 × 4 (or 4 × 8): 8 → 16 → 32 pages.", "no": "8 nights with 4 pages each. Double 8 twice."}, {"q": "What is <b>4 × 6</b>?", "choices": ["24", "18", "20", "12"], "a": 0, "why": "6 → 12 → 24.", "no": [null, "18 is 3 × 6. Double, double.", "20 is 4 × 5.", "12 is only one double."]}, {"type": "fill", "q": "Which word means <i>to cut into two equal parts</i>?", "answers": ["halve"], "why": "To <b>halve</b> is to cut into two equal parts, or divide by 2.", "no": "It starts with <b>h</b>. It is the opposite of double."}, {"type": "fill", "q": "____ × 8 = 24", "answers": ["3"], "why": "3 → 6 → 12 → 24, so 3 × 8 = 24.", "no": "What times 8 is 24?"}, {"q": "Toothless had 3 fish. Hiccup <b>quadrupled</b> them. How many fish does Toothless have now?", "choices": ["7", "6", "9", "12"], "a": 3, "why": "Quadruple means 4 times as many: 3 → 6 → 12.", "no": ["Quadruple does not mean add 4.", "6 is only doubled once.", "9 is 3 times as many. Quadruple is 4 times.", null]}, {"type": "fill", "q": "The Berk blacksmith makes 8 shields with 9 studs on each. 10 studs fall off. How many studs are still on?", "answers": ["62"], "why": "8 × 9 = 72 studs. Then 72 − 10 = 62.", "no": "First find all the studs (8 × 9). Then take away 10."}]]}], "win": "Three doubles and done. You are a formidable fact finder!", "prev": "bb-bailey-L02", "prevTitle": "Lesson 2"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribu
