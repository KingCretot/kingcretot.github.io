<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 3: Double, Double, Double: The 8s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L03", "label": "Lesson 3", "title": "Double, Double, Double: The 8s", "goal": "I can find any ×8 fact by doubling three times.", "date": "2026-10-26", "mastery": 90, "color": "#10AC84", "slides": [{"type": "hello", "title": "Double, Double, Double: The 8s", "text": "Last week you tamed the 9s and the 6s. Today you get a new tool: <b>doubling</b>. With three quick doubles you can find <b>every ×8 fact</b> without adding 8 over and over.", "visual": {"kind": "bigtext", "text": "8 × 7 = ?", "sub": "Three doubles will get you there."}}, {"type": "talk", "kick": "Book Talk", "title": "How does Hiccup solve problems?", "text": "Think about the part of <i>How to Train Your Dragon</i> you read since our last lesson.", "prompts": ["Tell me what happened, in order: beginning, middle, end.", "What is the biggest problem Hiccup faces right now? Is it with another character, with himself, or with nature?", "Hiccup is not the biggest or strongest Viking. What does he use instead of muscles?"], "starters": ["First, … Then, … At the end, …", "Hiccup's biggest problem is … because …", "Instead of muscles, Hiccup uses …"]}, {"type": "recall", "kick": "Remember?", "title": "Last week's shortcuts", "text": "Use your ×9 and ×6 tools. No adding over and over!", "items": [{"q": "What is <b>9 × 7</b>? Use ×10 minus one group.", "choices": ["72", "63", "61", "56"], "a": 1, "why": "10 × 7 = 70. Take away one group of 7: 70 − 7 = <b>63</b>.", "no": ["72 is 9 × 8. Start from 70 and take away one 7.", null, "You took away 9. Take away one group of <b>7</b>: 70 − 7.", "You took away two 7s. Nine groups is only one group less than ten."]}, {"q": "<b>6 × ? = 48</b>. Use ×5 plus one group to test each choice.", "choices": ["7", "9", "8"], "a": 2, "why": "5 × 8 = 40, plus one more 8 is 48. So 6 × <b>8</b> = 48.", "no": ["6 × 7 = 35 + 7 = 42, not 48.", "6 × 9 = 45 + 9 = 54, not 48.", null]}, {"q": "Bailey says 9 × 6 = 54. Which is a way to <b>verify</b> it?", "choices": ["5 + 4 = 9, and 60 − 6 = 54. Both checks work.", "54 looks about right.", "9 + 6 = 15, so it must be 54."], "a": 0, "why": "To <b>verify</b> is to check that it is true. The digits of a 9s fact add to 9, and the ×10 shortcut gives 54 too.", "no": [null, "Looking right is a guess, not a check.", "9 + 6 = 15 adds the factors. It does not check 54 at all."]}]}, {"type": "vocab", "kick": "Word Power", "title": "Seven words for today", "text": "Tap each card to flip it. Read the meaning and the example out loud. Then use the word in your own sentence.", "words": [{"word": "double", "pos": "verb", "meaning": "to make something two times as big; to multiply by 2", "example": "If you <b>double</b> 14, you get 28.", "emoji": "✌️"}, {"word": "halve", "pos": "verb", "meaning": "to cut something into two equal parts; to divide by 2", "example": "If you <b>halve</b> 56, you get 28.", "emoji": "✂️"}, {"word": "quadruple", "pos": "verb", "meaning": "to make something four times as big", "example": "When you <b>quadruple</b> 6, you get 24.", "emoji": "🍀"}, {"word": "hoard", "pos": "noun", "meaning": "a large pile of things someone has saved and hidden", "example": "The dragon slept on a <b>hoard</b> of gold coins.", "emoji": "💰"}, {"word": "gargantuan", "pos": "adjective", "meaning": "huge; far bigger than usual", "example": "A <b>gargantuan</b> sea dragon rose out of the waves.", "emoji": "🐉"}, {"word": "formidable", "pos": "adjective", "meaning": "so strong or powerful that people are afraid of it or respect it", "example": "The Viking chief was a <b>formidable</b> warrior.", "emoji": "🛡️"}, {"word": "amplify", "pos": "verb", "meaning": "to make something bigger, louder, or stronger", "example": "Hiccup cupped his hands to <b>amplify</b> his voice.", "emoji": "📣"}]}, {"type": "tap", "kick": "Word Work", "title": "Use the words", "items": [{"q": "Which sentence uses <b>formidable</b> correctly?", "choices": ["The tiny kitten was formidable, so nobody noticed it.", "Fishlegs ate a formidable breakfast of toast.", "The Vikings stepped back from the formidable dragon."], "a": 2, "why": "<b>Formidable</b> means powerful enough to make people afraid or respectful. Stepping back shows that.", "no": ["Something formidable gets noticed and makes people careful. A tiny kitten nobody noticed is the opposite.", "Toast cannot make anyone afraid or respectful. Formidable is about power.", null]}, {"q": "Hiccup had 7 fish. Then he <b>quadrupled</b> them. Which shows the new number?", "choices": ["7 + 4 = 11", "7 × 4 = 28", "7 × 2 = 14", "7 × 8 = 56"], "a": 1, "why": "<b>Quadruple</b> means four times as many: 7 × 4 = 28. That is double (14), then double again (28).", "no": ["Quadruple does not mean add 4. It means four times as many.", null, "14 is only doubled once. Quadruple is double, then double again.", "56 is three doubles. Quadruple is only two doubles."]}]}, {"type": "learn", "kick": "Learn", "title": "Stepping stone: ×4 is double, double", "text": "Doubling means ×2. If you double, and then double again, you have multiplied by <b>4</b>, because 2 × 2 = 4.", "visual": {"kind": "array", "rows": 4, "cols": 6, "emoji": "🥚", "label": "4 rows of 6 dragon eggs"}, "steps": [{"text": "<b>Start</b> with 6 (one row).", "visual": {"kind": "bigtext", "text": "6"}}, {"text": "<b>Double</b> it: 6 + 6 = 12. That is <b>2 × 6</b> (two rows).", "visual": {"kind": "bigtext", "text": "6 → 12"}}, {"text": "<b>Double again</b>: 12 + 12 = 24. That is <b>4 × 6</b> (four rows).", "visual": {"kind": "bigtext", "text": "6 → 12 → 24"}}], "tip": "Two doubles = ×4. Say it while you count on two fingers: \"double, double.\""}, {"type": "tap", "kick": "Try it", "title": "Double, double", "items": [{"q": "What is <b>4 × 7</b>? Double, then double again.", "choices": ["21", "28", "24", "14"], "a": 1, "why": "7 → 14 → <b>28</b>. Two doubles, so 4 × 7 = 28.", "no": ["21 is 7 + 7 + 7. That is only 3 groups.", null, "Double 14 means 14 + 14. Try that again.", "14 is only one double (2 × 7). Double once more."]}, {"q": "Which chain shows <b>4 × 9</b>?", "choices": ["9 → 18 → 27", "9 → 18 → 36 → 72", "9 → 18 → 36"], "a": 2, "why": "Two doubles: 9 → 18 → <b>36</b>. So 4 × 9 = 36.", "no": ["18 + 9 = 27 adds a 9. Doubling 18 means 18 + 18.", "That chain doubles three times. That is ×8, not ×4.", null]}]}, {"type": "learn", "kick": "Learn", "title": "The big one: ×8 is double, double, double", "text": "Double three times and you have multiplied by <b>8</b>, because 2 × 2 × 2 = 8. Watch 8 × 7.", "visual": {"kind": "array", "rows": 8, "cols": 7, "emoji": "🔥", "label": "8 rows of 7 dragon flames"}, "steps": [{"text": "<b>Start</b> with 7.", "visual": {"kind": "bigtext", "text": "7"}}, {"text": "<b>Double 1:</b> 7 + 7 = 14. That is 2 × 7.", "visual": {"kind": "bigtext", "text": "7 → 14"}}, {"text": "<b>Double 2:</b> 14 + 14 = 28. That is 4 × 7.", "visual": {"kind": "bigtext", "text": "7 → 14 → 28"}}, {"text": "<b>Double 3:</b> 28 + 28 = 56. That is <b>8 × 7 = 56</b>.", "visual": {"kind": "bigtext", "text": "7 → 14 → 28 → 56"}}], "tip": "Count the doubles on three fingers. Three doubles is only three steps. Adding 7 eight times is seven steps, with seven chances to lose your place."}, {"type": "build", "kick": "Build it", "title": "Eight nests on the cliff", "text": "On a cliff near Berk there are <b>8 dragon nests</b>. Each nest holds <b>6 eggs</b>. Build the nests.", "groups": 8, "each": 6, "emoji": "🥚", "why": "8 groups of 6. Look at the top 4 nests: 4 × 6 = 24. The bottom 4 nests are the same, so <b>double 24</b>: 8 × 6 = <b>48</b>.", "hint": "How many nests? How many eggs in each nest?"}, {"type": "order", "kick": "Put it in order", "title": "Find 8 × 9 by doubling", "text": "Tap the steps in the right order.", "steps": ["Start with 9", "Double: 18 (that is 2 × 9)", "Double again: 36 (that is 4 × 9)", "Double a third time: 72 (that is 8 × 9)", "Check: three doubles, so 8 × 9 = 72"], "why": "9 → 18 → 36 → 72. Three doubles make ×8.", "hint": "Each double uses the number you just made. What comes next?"}, {"type": "sort", "kick": "Sort it", "title": "How many doubles?", "text": "Tap a fact. Then tap the box that tells how many times you double the other number. Turn-around facts count too!", "buckets": ["Double once<br><small>×2</small>", "Double twice<br><small>×4</small>", "Double three times<br><small>×8</small>"], "items": [{"text": "8 × 3", "b": 2, "why": "×8 means three doubles: 3 → 6 → 12 → 24.", "hint": "Which number is 8? That tells you how many doubles."}, {"text": "4 × 3", "b": 1, "why": "Double 3 twice: 3 → 6 → 12.", "hint": "Which number is 4? Double the other number."}, {"text": "2 × 9", "b": 0, "why": "×2 is one double: 9 → 18.", "hint": "×2 is the smallest one."}, {"text": "7 × 4", "b": 1, "why": "Turn it around: 4 × 7. Two doubles: 7 → 14 → 28.", "hint": "Turn it around. Which number is 4?"}, {"text": "5 × 8", "b": 2, "why": "Turn it around: 8 × 5. Three doubles: 5 → 10 → 20 → 40.", "hint": "Turn it around. Which number is 8?"}, {"text": "2 × 6", "b": 0, "why": "One double: 6 → 12.", "hint": "×2 means double just one time."}], "done": "×2 = one double. ×4 = two doubles. ×8 = three doubles."}, {"type": "tap", "kick": "Try it", "title": "Doubling on Berk", "items": [{"q": "Fishlegs tries 8 × 7. He writes: <b>7, 14, 21, 28</b>. He says 8 × 7 = 28. What went wrong?", "choices": ["He started with the wrong number.", "He doubled too many times.", "He added 7 each time instead of doubling."], "a": 2, "why": "14 + 7 = 21 adds one more 7. Doubling 14 is 14 + 14 = 28, then 28 + 28 = <b>56</b>.", "no": ["Starting with 7 is right. Look at the step from 14 to 21.", "He only made three jumps. The problem is how he jumped: adding 7, not doubling.", null]}, {"q": "The Hooligan tribe has <b>8 longships</b>. Each longship carries <b>8 Vikings</b>. How many Vikings sail?", "choices": ["16", "64", "56", "72"], "a": 1, "why": "8 equal groups of 8. 8 → 16 → 32 → <b>64</b>.", "no": ["16 is 8 + 8. That counts only two ships.", null, "56 is 8 × 7. Check: 8 → 16 → 32 → 64.", "72 is 8 × 9. There are 8 Vikings on each ship."]}, {"q": "Every dragon has <b>4 legs</b>. Hiccup counts the legs on <b>8 dragons</b>. How many legs?", "choices": ["12", "16", "32", "36"], "a": 2, "why": "8 × 4. Double 4 three times: 4 → 8 → 16 → <b>32</b>.", "no": ["12 is 8 + 4. Each dragon has 4 legs, so these are equal groups. Multiply.", "16 is only two doubles. ×8 needs three.", null, "36 is 9 × 4. There are 8 dragons."]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "What is <b>8 × 7</b>?", "choices": ["54", "56", "49", "63"], "a": 1, "why": "7 → 14 → 28 → 56."}, {"q": "Which chain shows <b>4 × 8</b>?", "choices": ["8 → 16 → 24", "8 → 16 → 32 → 64", "8 → 16 → 32", "4 → 8 → 12 → 16"], "a": 2, "why": "Two doubles: 8 → 16 → 32. So 4 × 8 = 32."}, {"q": "What is <b>8 × 8</b>?", "choices": ["64", "72", "56", "16"], "a": 0, "why": "8 → 16 → 32 → 64."}, {"q": "A <b>gargantuan</b> sea dragon rose from the waves. Which word means almost the same as <b>gargantuan</b>?", "choices": ["angry", "ancient", "enormous", "silent"], "a": 2, "why": "Gargantuan means giant-sized, so enormous is closest."}, {"q": "Each Viking shield has <b>4 iron studs</b>. Hiccup polishes <b>9 shields</b>. How many studs does he polish?", "choices": ["13", "36", "32", "45"], "a": 1, "why": "9 × 4: double 9 twice, 18, 36."}, {"q": "What is <b>8 × 3</b>?", "choices": ["11", "21", "32", "24"], "a": 3, "why": "3 → 6 → 12 → 24."}, {"q": "Stoick the Vast is a <b>formidable</b> chief. What does that tell you about him?", "choices": ["He is small and quiet.", "He is forgetful but kind.", "People fear and respect his power.", "He is new to the tribe."], "a": 2, "why": "Formidable means powerful enough that people fear or respect you."}, {"q": "<b>8 × ? = 48</b>. What is the missing number?", "choices": ["5", "6", "7", "8"], "a": 1, "why": "6 → 12 → 24 → 48, so 8 × 6 = 48."}, {"q": "Bailey knows 8 × 9 = 72. She <b>halves</b> 72. Which fact does she get?", "choices": ["8 × 4 = 32", "4 × 9 = 36", "9 × 9 = 81", "8 × 8 = 64"], "a": 1, "why": "Half of 8 groups is 4 groups. 4 × 9 = 36, and 36 is half of 72."}, {"q": "The tribe has <b>8 longships</b> with <b>9 Vikings</b> on each. Then <b>6 Vikings</b> stay home sick. How many Vikings sail?", "choices": ["66", "72", "78", "57"], "a": 0, "why": "8 × 9: 9 → 18 → 36 → 72. Then 72 − 6 = 66."}]}], "win": "Three doubles and done. You are a formidable fact finder!", "prev": "bb-bailey-L02", "prevTitle": "Lesson 2"});</script></body></html>
