<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 17: What Do I Do with the Remainder?</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L17", "label": "Lesson 17", "title": "What Do I Do with the Remainder?", "goal": "I can decide what a remainder means in a story: round up, drop it, or make it the answer.", "date": "2026-12-15", "mastery": 90, "color": "#00A8A8", "slides": [{"type": "hello", "title": "On Your Own: What Do I Do with the Remainder?", "text": "In class you learned three things a remainder can mean in a story. Now practice on your own with paper and a pencil. It takes about 25 minutes and ends with <b>Show What You Know</b>.", "visual": {"kind": "emoji", "text": "⛵🍪"}}, {"type": "talk", "kick": "Say it out loud", "title": "Teach it to someone", "text": "Find someone at home. Teach them. Say it out loud before you go on.", "prompts": ["Tell them the three things you can do with a remainder. Give a dragon example of each.", "Explain why \"6 R 2 boats\" is not a <b>practical</b> answer.", "Tell them about a <b>voyage</b> or a trip in <i>How to Train Your Dragon</i>, or one you would like to take."], "starters": ["You can round up when …", "It is not practical because …", "A voyage I would like to take is …"]}, {"type": "vocab", "kick": "Word Power", "title": "Remember the words", "text": "Tap each card. Say the meaning before you flip it. Then flip to check yourself.", "words": [{"word": "context", "pos": "noun", "emoji": "🧭", "meaning": "The words and facts around something that help explain what it means.", "example": "The <b>context</b> of the story tells you what to do with the remainder."}, {"word": "capacity", "pos": "noun", "emoji": "🛶", "meaning": "The most that something can hold.", "example": "Each longship has a <b>capacity</b> of 8 Vikings."}, {"word": "round up", "pos": "verb", "emoji": "⬆️", "meaning": "In a remainder story, to go up to the next whole number so that everyone or everything fits.", "example": "50 Vikings, 8 to a boat: 6 R 2, so <b>round up</b> to 7 boats."}, {"word": "discard", "pos": "verb", "emoji": "🗑️", "meaning": "To throw away or not use something.", "example": "For full barrels only, <b>discard</b> the remainder."}, {"word": "adequate", "pos": "adjective", "emoji": "👌", "meaning": "Enough for what is needed.", "example": "6 boats are not <b>adequate</b> for 50 Vikings. They need 7."}, {"word": "practical", "pos": "adjective", "emoji": "🧰", "meaning": "Sensible and useful in real life.", "example": "\"6 R 2 boats\" is not a <b>practical</b> answer. You can't rent part of a boat."}, {"word": "voyage", "pos": "noun", "emoji": "⛵", "meaning": "A long trip, especially by sea.", "example": "The Vikings packed their longships for a <b>voyage</b> across the sea."}]}, {"type": "learn", "kick": "Remember", "title": "Three choices", "text": "Solve first. Then read the question again.", "steps": [{"text": "⬆️ <b>Round up</b> when everyone or everything must fit: boats, trips, tables, pens."}, {"text": "🗑️ <b>Drop it</b> when only full groups count: full boxes, how many you can buy or make."}, {"text": "🍪 <b>The remainder is the answer</b> when the question asks what is left over."}], "tip": "The context decides. Same division, different answers."}, {"type": "sort", "kick": "Sort it", "title": "What does the context say?", "text": "Read each story. Tap it, then tap the box. You do not need to solve it.", "buckets": ["⬆️ Round up", "🗑️ Drop it", "🍪 Remainder is the answer"], "items": [{"text": "A van holds 7 kids. How many vans for 30 kids?", "b": 0, "why": "Every kid must ride, so round up.", "hint": "Can some kids stay home?"}, {"text": "A bow needs 8 inches of ribbon. How many bows from 50 inches?", "b": 1, "why": "Leftover ribbon cannot make a whole bow, so drop it.", "hint": "Can the leftover ribbon make a full bow?"}, {"text": "52 beads are shared equally among 5 friends. How many beads are left?", "b": 2, "why": "The question asks what is left: the remainder.", "hint": "What does the question ask for?"}, {"text": "Egg boxes hold 6. How many boxes to pack all 40 eggs?", "b": 0, "why": "All the eggs must be packed, so round up.", "hint": "Can some eggs stay out of a box?"}, {"text": "A page holds 9 stamps. How many pages can be filled with 60 stamps?", "b": 1, "why": "Only full pages count, so drop it.", "hint": "Does the question say filled?"}, {"text": "Hiccup splits 47 fish equally among 3 other dragons and gives the rest to Toothless. How many fish does Toothless get?", "b": 2, "why": "Toothless gets what is left over: the remainder.", "hint": "What does Toothless get?"}], "done": "Everyone must fit: round up. Only full groups: drop it. What is left: the remainder."}, {"type": "tap", "kick": "Your turn", "title": "Solve and decide", "text": "Solve on paper. Then decide. Type the answer.", "items": [{"type": "fill", "q": "Each longship holds <b>9</b> Vikings. How many longships do <b>76 Vikings</b> need?", "answers": ["9", "nine", "9 longships"], "why": "76 ÷ 9 = 8 R 4. 8 is not enough: 4 would be left out. Round up: <b>9 longships</b>.", "no": "Divide first: 76 ÷ 9. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"type": "fill", "q": "Stoick hangs <b>61 shields</b> in rows of <b>7</b>. How many full rows can he make?", "answers": ["8", "eight", "8 rows"], "why": "61 ÷ 7 = 8 R 5. Only 8 are full; the 5 left over cannot make another one. Drop the remainder: <b>8 rows</b>.", "no": "Divide first: 61 ÷ 7. Then read the question again: what does it ask for?", "hint": "Can the leftover make a full one? If not, do not count it."}, {"type": "fill", "q": "Stoick shares <b>94 coins</b> equally among <b>9</b> warriors and keeps the rest. How many coins does he keep?", "answers": ["4", "four", "4 coins"], "why": "94 ÷ 9 = 10 R 4. The question asks what is left over, so the answer is the remainder: <b>4 coins</b>.", "no": "Divide first: 94 ÷ 9. Then read the question again: what does it ask for?", "hint": "The question asks how many are LEFT. Which part of the answer is that?"}]}, {"type": "tap", "kick": "Your turn", "title": "Bigger numbers", "items": [{"type": "fill", "q": "A boat carries <b>6</b> sheep. How many trips to carry <b>152 sheep</b>?", "answers": ["26", "26 trips"], "why": "152 ÷ 6 = 25 R 2. 25 is not enough: 2 would be left out. Round up: <b>26 trips</b>.", "no": "Divide first: 152 ÷ 6. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"type": "fill", "q": "Hiccup has <b>345 arrows</b>. A quiver holds <b>8</b>. How many quivers can he fill?", "answers": ["43", "43 quivers"], "why": "345 ÷ 8 = 43 R 1. Only 43 are full; the 1 left over cannot make another one. Drop the remainder: <b>43 quivers</b>.", "no": "Divide first: 345 ÷ 8. Then read the question again: what does it ask for?", "hint": "Can the leftover make a full one? If not, do not count it."}, {"q": "<b>114 eggs</b> are shared equally among <b>4</b> nests. How many eggs are left over? <br>114 ÷ 4 = 28 R 2. Which answer makes sense?", "choices": ["29 eggs", "2 eggs", "28 eggs", "28 R 2 eggs"], "a": 1, "why": "114 ÷ 4 = 28 R 2. The question asks what is left over: 2.", "no": ["29 is not left over. The left over part is the remainder.", null, "28 is how many full groups, not how many are left.", "You cannot have 28 R 2 eggs. A story answer needs a whole number that makes sense."]}]}, {"type": "tap", "kick": "Your turn", "title": "Which answer makes sense?", "items": [{"q": "<b>140 fish</b> go into barrels that hold <b>6</b>. How many barrels are needed to hold all the fish? What do you do with the remainder?", "choices": ["Drop the remainder: use only the quotient", "The remainder is the answer", "Round up: add 1 to the quotient"], "a": 2, "why": "Everyone or everything must fit, so the leftovers need one more group. Round up.", "no": ["Read the question again: does it ask for full groups only?", "Read the question again: does it ask how many are left over?", null]}, {"q": "Toothless can carry <b>7</b> logs at a time. How many trips to move <b>80 logs</b>? <br>80 ÷ 7 = 11 R 3. Which answer makes sense?", "choices": ["3 trips", "11 trips", "11 R 3 trips", "12 trips"], "a": 3, "why": "80 ÷ 7 = 11 R 3. Everyone must fit, so round up to 12.", "no": ["3 is the remainder, not the answer to this question.", "With only 11, the 3 left over would not fit.", "You cannot have 11 R 3 trips. A story answer needs a whole number that makes sense.", null]}]}, {"type": "tap", "kick": "Word work", "title": "Words in action", "text": "Type the word.", "items": [{"type": "fill", "q": "The most that something can hold is its ____. (Use a word from your word cards.)", "answers": ["capacity"], "why": "<i>Capacity</i> is the most something can hold.", "no": "It starts with cap-."}, {"type": "fill", "q": "The words and facts around something that help explain it are the ____. (Use a word from your word cards.)", "answers": ["context"], "why": "The <i>context</i> helps explain what something means.", "no": "It starts with con-."}, {"q": "Stoick had <b>adequate</b> food for the voyage. What does that mean?", "choices": ["He had too little.", "He had enough.", "He had no food.", "He discarded it."], "a": 1, "why": "<i>Adequate</i> means enough for what is needed.", "no": ["Too little is not adequate.", null, "None is not adequate.", "Discarding means throwing away."]}]}, {"type": "recall", "kick": "Remember?", "title": "Earlier lessons", "items": [{"type": "fill", "q": "Use long division: <b>853 ÷ 4</b> = ____ &nbsp; (use R for the remainder)", "answers": ["213 R 1", "213R1", "213 r 1", "213 remainder 1", "213 rem 1", "213 r1"], "why": "853 ÷ 4 = 213 R 1. Check: 213 × 4 + 1 = 853.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 4s fit in 8?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n4 ) 853"}}, {"type": "fill", "q": "Use long division: <b>306 ÷ 9</b> = ____", "answers": ["34"], "why": "306 ÷ 9 = 34. Check: 34 × 9 = 306.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "9 does not fit in 3, so start with 30: how many 9s fit in 30?", "visual": {"kind": "longdiv", "text": "\n   ____\n9 ) 306"}}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "<b>83 Vikings</b> row to the island. Each boat holds <b>9</b>. How many boats do they need?", "answers": ["10", "ten", "10 boats"], "why": "83 ÷ 9 = 9 R 2. 9 is not enough: 2 would be left out. Round up: <b>10 boats</b>.", "no": "Divide first: 83 ÷ 9. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"type": "fill", "q": "<b>59 eggs</b> are packed in cartons of <b>6</b>. How many cartons are full?", "answers": ["9", "nine", "9 cartons"], "why": "59 ÷ 6 = 9 R 5. Only 9 are full; the 5 left over cannot make another one. Drop the remainder: <b>9 cartons</b>.", "no": "Divide first: 59 ÷ 6. Then read the question again: what does it ask for?", "hint": "Can the leftover make a full one? If not, do not count it."}, {"type": "fill", "q": "<b>47 berries</b> are shared equally among <b>5</b> dragons. How many berries are left over?", "answers": ["2", "two", "2 berries"], "why": "47 ÷ 5 = 9 R 2. The question asks what is left over, so the answer is the remainder: <b>2 berries</b>.", "no": "Divide first: 47 ÷ 5. Then read the question again: what does it ask for?", "hint": "The question asks how many are LEFT. Which part of the answer is that?"}, {"type": "fill", "q": "<b>205 dragons</b> need pens. Each pen holds <b>4</b>. How many pens are needed?", "answers": ["52", "52 pens"], "why": "205 ÷ 4 = 51 R 1. 51 is not enough: 1 would be left out. Round up: <b>52 pens</b>.", "no": "Divide first: 205 ÷ 4. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"q": "A bag holds <b>8</b> rocks. Fishlegs has <b>70 rocks</b>. How many bags can he fill completely? What do you do with the remainder?", "choices": ["Round up: add 1 to the quotient", "Drop the remainder: use only the quotient", "The remainder is the answer"], "a": 1, "why": "Only full groups count, so the leftovers are dropped.", "no": ["Read the question again: does it ask about everything fitting, or only full groups?", null, "Read the question again: does it ask how many are left over?"]}, {"q": "<b>148 Vikings</b> go to the feast. Each table seats <b>6</b>. How many tables are needed? <br>148 ÷ 6 = 24 R 4. Which answer makes sense?", "choices": ["24 tables", "24 R 4 tables", "25 tables", "4 tables"], "a": 2, "why": "148 ÷ 6 = 24 R 4. Everyone must fit, so round up to 25.", "no": ["With only 24, the 4 left over would not fit.", "You cannot have 24 R 4 tables. A story answer needs a whole number that makes sense.", null, "4 is the remainder, not the answer to this question."]}, {"type": "fill", "q": "Use long division: <b>457 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["76 R 1", "76R1", "76 r 1", "76 remainder 1", "76 rem 1", "76 r1"], "why": "457 ÷ 6 = 76 R 1. Check: 76 × 6 + 1 = 457.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: 6 does not fit in 4, so start with 45.", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 457"}}, {"type": "fill", "q": "The most that something can hold is its ____. (Use a word from your word cards.)", "answers": ["capacity"], "why": "<i>Capacity</i> is the most something can hold.", "no": "It starts with cap-."}, {"q": "Which word means <i>sensible and useful in real life</i>?", "choices": ["practical", "context", "voyage", "discard"], "a": 0, "why": "<i>Practical</i> means sensible and useful in real life.", "no": [null, "Context is the facts around something.", "A voyage is a long trip.", "Discard means throw away."]}, {"q": "For a remainder story, the <b>context</b> tells you…", "choices": ["how to do long division", "what to do with the remainder", "the capacity of a boat", "how many digits to bring down"], "a": 1, "why": "The <i>context</i> (the facts in the story) tells you whether to round up, drop it, or use the remainder.", "no": ["Long division is the same in every story.", null, "Capacity is a number in some stories, not what context tells you.", "That is part of the algorithm, not the context."]}], [{"type": "fill", "q": "<b>67 kids</b> go on a field trip. Each van holds <b>8</b>. How many vans are needed?", "answers": ["9", "nine", "9 vans"], "why": "67 ÷ 8 = 8 R 3. 8 is not enough: 3 would be left out. Round up: <b>9 vans</b>.", "no": "Divide first: 67 ÷ 8. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"type": "fill", "q": "Gobber cuts <b>92 inches</b> of rope into <b>7</b>-inch pieces. How many whole pieces does he get?", "answers": ["13", "13 pieces"], "why": "92 ÷ 7 = 13 R 1. Only 13 are full; the 1 left over cannot make another one. Drop the remainder: <b>13 pieces</b>.", "no": "Divide first: 92 ÷ 7. Then read the question again: what does it ask for?", "hint": "Can the leftover make a full one? If not, do not count it."}, {"type": "fill", "q": "<b>58 coins</b> are shared equally among <b>6</b> Vikings. How many coins are left over?", "answers": ["4", "four", "4 coins"], "why": "58 ÷ 6 = 9 R 4. The question asks what is left over, so the answer is the remainder: <b>4 coins</b>.", "no": "Divide first: 58 ÷ 6. Then read the question again: what does it ask for?", "hint": "The question asks how many are LEFT. Which part of the answer is that?"}, {"type": "fill", "q": "<b>315 nails</b> go in bags of <b>4</b>. How many bags are full?", "answers": ["78", "78 bags"], "why": "315 ÷ 4 = 78 R 3. Only 78 are full; the 3 left over cannot make another one. Drop the remainder: <b>78 bags</b>.", "no": "Divide first: 315 ÷ 4. Then read the question again: what does it ask for?", "hint": "Can the leftover make a full one? If not, do not count it."}, {"q": "<b>89 Vikings</b> must cross the river. A raft holds <b>7</b>. How many rafts? What do you do with the remainder?", "choices": ["The remainder is the answer", "Round up: add 1 to the quotient", "Drop the remainder: use only the quotient"], "a": 1, "why": "Everyone or everything must fit, so the leftovers need one more group. Round up.", "no": ["Read the question again: does it ask how many are left over?", null, "Read the question again: does it ask for full groups only?"]}, {"q": "<b>123 fish</b> are shared equally among <b>9</b> dragons. How many fish are left over? <br>123 ÷ 9 = 13 R 6. Which answer makes sense?", "choices": ["13 R 6 fish", "14 fish", "6 fish", "13 fish"], "a": 2, "why": "123 ÷ 9 = 13 R 6. The question asks what is left over: 6.", "no": ["You cannot have 13 R 6 fish. A story answer needs a whole number that makes sense.", "14 is not left over. The left over part is the remainder.", null, "13 is how many full groups, not how many are left."]}, {"type": "fill", "q": "Use long division: <b>689 ÷ 5</b> = ____ &nbsp; (use R for the remainder)", "answers": ["137 R 4", "137R4", "137 r 4", "137 remainder 4", "137 rem 4", "137 r4"], "why": "689 ÷ 5 = 137 R 4. Check: 137 × 5 + 4 = 689.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 5s fit in 6?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n5 ) 689"}}, {"type": "fill", "q": "To throw away or not use something is to ____ it. (Use a word from your word cards.)", "answers": ["discard"], "why": "To <i>discard</i> is to throw away or not use.", "no": "It starts with dis-."}, {"q": "Which sentence uses <b>voyage</b> correctly?", "choices": ["The Vikings set off on a long voyage across the sea.", "Hiccup voyaged the remainder.", "The voyage of 50 ÷ 8 is 6.", "Toothless ate a voyage."], "a": 0, "why": "A <i>voyage</i> is a long trip, especially by sea.", "no": [null, "Voyage is not something you do to a number.", "That is a quotient, not a voyage.", "A voyage is a trip, not food."]}, {"q": "6 boats are not <b>adequate</b> for 50 Vikings. What does that mean?", "choices": ["6 boats are too many.", "6 boats are not enough.", "6 boats are the capacity.", "6 boats are practical."], "a": 1, "why": "<i>Adequate</i> means enough. Not adequate means not enough.", "no": ["Not adequate means not enough, not too many.", null, "Capacity is how much one boat holds.", "Not enough boats is not practical."]}], [{"type": "fill", "q": "<b>98 sheep</b> cross the sea. A boat carries <b>8</b>. How many trips does it take?", "answers": ["13", "13 trips"], "why": "98 ÷ 8 = 12 R 2. 12 is not enough: 2 would be left out. Round up: <b>13 trips</b>.", "no": "Divide first: 98 ÷ 8. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"type": "fill", "q": "A fish costs <b>9 cents</b>. Snotlout has <b>77 cents</b>. How many fish can he buy?", "answers": ["8", "eight", "8 fish"], "why": "77 ÷ 9 = 8 R 5. Only 8 are full; the 5 left over cannot make another one. Drop the remainder: <b>8 fish</b>.", "no": "Divide first: 77 ÷ 9. Then read the question again: what does it ask for?", "hint": "Can the leftover make a full one? If not, do not count it."}, {"type": "fill", "q": "<b>89 shells</b> are shared equally among <b>7</b> friends. How many shells are left over?", "answers": ["5", "five", "5 shells"], "why": "89 ÷ 7 = 12 R 5. The question asks what is left over, so the answer is the remainder: <b>5 shells</b>.", "no": "Divide first: 89 ÷ 7. Then read the question again: what does it ask for?", "hint": "The question asks how many are LEFT. Which part of the answer is that?"}, {"type": "fill", "q": "<b>461 apples</b> are shared equally among <b>6</b> barrels. How many apples are left over?", "answers": ["5", "five", "5 apples"], "why": "461 ÷ 6 = 76 R 5. The question asks what is left over, so the answer is the remainder: <b>5 apples</b>.", "no": "Divide first: 461 ÷ 6. Then read the question again: what does it ask for?", "hint": "The question asks how many are LEFT. Which part of the answer is that?"}, {"q": "<b>52 Vikings</b> sit at tables of <b>6</b>. How many tables are needed so everyone sits? What do you do with the remainder?", "choices": ["Drop the remainder: use only the quotient", "The remainder is the answer", "Round up: add 1 to the quotient"], "a": 2, "why": "Everyone or everything must fit, so the leftovers need one more group. Round up.", "no": ["Read the question again: does it ask for full groups only?", "Read the question again: does it ask how many are left over?", null]}, {"q": "A box holds <b>8</b> candles. How many boxes can be filled with <b>132 candles</b>? <br>132 ÷ 8 = 16 R 4. Which answer makes sense?", "choices": ["17 boxes", "4 boxes", "16 boxes", "16 R 4 boxes"], "a": 2, "why": "132 ÷ 8 = 16 R 4. Only full groups count: 16.", "no": ["There is no 17th full group: only 4 are left, not 8.", "4 is the remainder, not the answer to this question.", null, "You cannot have 16 R 4 boxes. A story answer needs a whole number that makes sense."]}, {"type": "fill", "q": "Use long division: <b>526 ÷ 3</b> = ____ &nbsp; (use R for the remainder)", "answers": ["175 R 1", "175R1", "175 r 1", "175 remainder 1", "175 rem 1", "175 r1"], "why": "526 ÷ 3 = 175 R 1. Check: 175 × 3 + 1 = 526.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 3s fit in 5?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n3 ) 526"}}, {"type": "fill", "q": "In a remainder story, to go up to the next whole number so everyone fits is to ____ ____. (Type the two words.)", "answers": ["round up"], "why": "To <i>round up</i> means to go up to the next whole number.", "no": "It starts with r and u."}, {"q": "Which word means <i>the words and facts around something that help explain it</i>?", "choices": ["context", "capacity", "adequate", "voyage"], "a": 0, "why": "The <i>context</i> helps explain what something means.", "no": [null, "Capacity is the most something can hold.", "Adequate means enough.", "A voyage is a long trip."]}, {"q": "For full boxes only, you should…", "choices": ["round up the remainder", "discard the remainder", "add the remainder to the quotient", "make the remainder the answer"], "a": 1, "why": "Only full boxes count, so <i>discard</i> (drop) the remainder.", "no": ["Rounding up is for when everything must fit.", null, "Adding
