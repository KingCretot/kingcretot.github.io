<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 4: Break It Apart: The 7s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L04", "label": "Lesson 4", "title": "Break It Apart: The 7s", "goal": "I can break 7 into 5 + 2 to find any ×7 fact.", "date": "2026-10-27", "mastery": 90, "color": "#10AC84", "slides": [{"type": "hello", "title": "Break It Apart: The 7s", "text": "The 7s are tricky because 7 is not easy to double. So today you use a different <b>tactic</b>: break the 7 into two friendly numbers you already know, <b>5</b> and <b>2</b>.", "visual": {"kind": "bigtext", "text": "7 = 5 + 2", "sub": "Two friendly facts make one hard fact."}}, {"type": "talk", "kick": "Book Talk", "title": "Big problems, smaller pieces", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What happened in the part you read since Monday's lesson?", "Think of a big, scary job Hiccup faces. How could he break it into smaller steps? What would step one be?", "Which character has changed the most so far? What made them change?"], "starters": ["Since Monday, …", "Hiccup could start by … Then he could …", "… has changed the most because …"]}, {"type": "recall", "kick": "Remember?", "title": "Doubles and last week's tools", "items": [{"q": "What is <b>8 × 6</b>? Double three times.", "choices": ["46", "54", "42", "48"], "a": 3, "why": "6 → 12 → 24 → <b>48</b>.", "no": ["Check your last double: 24 + 24 is 48, not 46.", "54 is 9 × 6. Three doubles of 6: 12, 24, 48.", "42 is 7 × 6. You need 8 groups.", null]}, {"q": "What is <b>9 × 3</b>? Use ×10 minus one group.", "choices": ["33", "27", "24", "21"], "a": 1, "why": "10 × 3 = 30. Take away one group of 3: 30 − 3 = <b>27</b>.", "no": ["33 is 30 + 3. For ×9 you take one group <b>away</b>.", null, "24 is 8 × 3. Start from 30 and take away 3.", "21 is 7 × 3. Take away only one group of 3 from 30."]}, {"q": "Which word means <b>to cut into two equal parts</b>?", "choices": ["quadruple", "amplify", "halve", "double"], "a": 2, "why": "To <b>halve</b> means to divide by 2. Halve 56 and you get 28.", "no": ["Quadruple means make four times as big.", "Amplify means make bigger, louder, or stronger.", null, "Double is the opposite: multiply by 2."]}]}, {"type": "vocab", "kick": "Word Power", "title": "Seven words for today", "text": "Tap each card to flip it. Read it out loud. Then tell Jonathan a sentence of your own.", "words": [{"word": "decompose", "pos": "verb", "meaning": "to break a number into smaller parts", "example": "I can <b>decompose</b> 7 into 5 and 2.", "emoji": "🧩"}, {"word": "addend", "pos": "noun", "meaning": "a number that is added to another number", "example": "In 30 + 12 = 42, the <b>addends</b> are 30 and 12.", "emoji": "➕"}, {"word": "distributive", "pos": "adjective", "meaning": "describes the rule that lets you break a factor apart, multiply each part, and add", "example": "The <b>distributive</b> property says 7 × 6 = (5 × 6) + (2 × 6).", "emoji": "🔀"}, {"word": "fragment", "pos": "noun", "meaning": "a small piece that has broken off something", "example": "Hiccup found a <b>fragment</b> of a dragon eggshell.", "emoji": "🥚"}, {"word": "reassemble", "pos": "verb", "meaning": "to put the pieces of something back together", "example": "The Vikings had to <b>reassemble</b> the broken longship.", "emoji": "🔧"}, {"word": "cunning", "pos": "adjective", "meaning": "clever at planning, especially at tricking others", "example": "The <b>cunning</b> dragon hid behind the rocks to surprise the boys.", "emoji": "🦊"}, {"word": "tactic", "pos": "noun", "meaning": "a planned move you use to reach a goal", "example": "Breaking 7 into 5 and 2 is a smart <b>tactic</b>.", "emoji": "♟️"}]}, {"type": "tap", "kick": "Word Work", "title": "Use the words", "items": [{"q": "Bailey <b>decomposes</b> 7 × 8 into 5 × 8 and 2 × 8. What are the two <b>partial products</b>?", "choices": ["35 and 16", "5 and 2", "40 and 16", "56 and 0"], "a": 2, "why": "5 × 8 = 40 and 2 × 8 = 16. Those are the partial products. 40 + 16 = 56.", "no": ["35 is 5 × 7. The part is 5 × 8.", "5 and 2 are the pieces of the 7, not the products.", null, "56 is the whole answer. Partial products are the two parts."]}, {"q": "Which sentence shows a <b>cunning</b> plan?", "choices": ["Snotlout shouted and ran straight at the dragon.", "Hiccup left a trail of fish so the dragon would follow it into the cave.", "Fishlegs fell asleep during the lesson."], "a": 1, "why": "<b>Cunning</b> means clever at planning or tricking. A fish trail is a sneaky, clever plan.", "no": ["Running straight at a dragon is brave (or silly), but there is no clever plan.", null, "Falling asleep is not a plan at all."]}]}, {"type": "learn", "kick": "Learn", "title": "7 × 6: break the 7", "text": "You know your 5s, and ×2 is just a double. So break 7 rows into <b>5 rows</b> and <b>2 rows</b>.", "visual": {"kind": "array", "rows": 7, "cols": 6, "emoji": "🛡️", "label": "7 rows of 6 shields"}, "steps": [{"text": "<b>Decompose</b> the 7: 7 = 5 + 2."}, {"text": "Top 5 rows: <b>5 × 6 = 30</b>. (You know your 5s!)"}, {"text": "Bottom 2 rows: <b>2 × 6 = 12</b>. (Just double 6.)"}, {"text": "<b>Reassemble</b>: 30 + 12 = 42. So <b>7 × 6 = 42</b>.", "visual": {"kind": "area", "b": 6, "split": [5, 2], "show": true}}], "tip": "The two pieces, 30 and 12, are called <b>partial products</b>. Add them to get the whole product."}, {"type": "learn", "kick": "Hands-on", "title": "Split the 7 × 8 array", "text": "Build <b>7 rows of 8 counters</b>. Lay a pencil under row 5. Count what is above and below the pencil.", "steps": [{"text": "Above the pencil: 5 × 8 = 40. Below the pencil: 2 × 8 = 16.", "visual": {"kind": "area", "b": 8, "split": [5, 2], "show": true}}, {"text": "Here is a trick to remember it. Say the numbers in order: <b>5, 6, 7, 8</b>.", "visual": {"kind": "bigtext", "text": "56 = 7 × 8", "sub": "five, six, seven, eight"}}], "tip": "If you forget the trick, break it apart: 40 + 16 = 56."}, {"type": "tap", "kick": "Try it", "title": "Break it apart", "items": [{"q": "<b>7 × 9</b> = (5 × 9) + (2 × 9) = 45 + 18. What is 7 × 9?", "choices": ["47", "54", "64", "63"], "a": 3, "why": "45 + 18 = <b>63</b>. So 7 × 9 = 63.", "no": ["47 is 45 + 2. The bottom part is 2 <b>groups of 9</b>, which is 18.", "54 is 6 × 9. Add 45 + 18 again.", "Check your adding: 45 + 18. 45 + 15 = 60, then 3 more.", null]}, {"q": "Which break-apart matches <b>7 × 4</b>?", "choices": ["(5 × 4) + 2", "(5 × 4) + (2 × 4)", "(7 × 5) + (7 × 2)", "(5 + 2) + 4"], "a": 1, "why": "Break the 7 into 5 + 2 and multiply <b>both</b> parts by 4: 20 + 8 = 28.", "no": ["The 2 must be multiplied by 4 too. Every piece of the 7 gets multiplied.", null, "That breaks a 7 into 5 + 2 but multiplies by 7. It equals 7 × 7.", "That only adds. There is no multiplying at all."]}]}, {"type": "build", "kick": "Build it", "title": "Hiccup's shield piles", "text": "Hiccup stacks <b>7 piles</b> of shields. Each pile has <b>7 shields</b>. Build the piles.", "groups": 7, "each": 7, "emoji": "🛡️", "why": "7 piles of 7. The first 5 piles: 5 × 7 = 35. The last 2 piles: 2 × 7 = 14. Reassemble: 35 + 14 = <b>49</b>.", "hint": "How many piles? How many shields in each pile?"}, {"type": "sort", "kick": "Sort it", "title": "Whole or broken?", "text": "Some of these break-aparts are correct. Some are broken. Tap a card, then tap the right box.", "buckets": ["✅ Correct break-apart", "❌ Broken break-apart"], "items": [{"text": "7 × 3 = 15 + 6", "b": 0, "why": "5 × 3 = 15 and 2 × 3 = 6. 15 + 6 = 21.", "hint": "Find 5 × 3 and 2 × 3. Do they match?"}, {"text": "7 × 6 = 30 + 2", "b": 1, "why": "The 2 was never multiplied. It should be 30 + 12.", "hint": "Is the second part 2 × 6?"}, {"text": "7 × 9 = 45 + 18", "b": 0, "why": "5 × 9 = 45 and 2 × 9 = 18. 45 + 18 = 63.", "hint": "Check 5 × 9 and 2 × 9."}, {"text": "7 × 8 = 35 + 16", "b": 1, "why": "35 is 5 × 7, not 5 × 8. It should be 40 + 16.", "hint": "Is 35 really 5 × 8?"}, {"text": "7 × 4 = 20 + 8", "b": 0, "why": "5 × 4 = 20 and 2 × 4 = 8. 20 + 8 = 28.", "hint": "Check 5 × 4 and 2 × 4."}, {"text": "7 × 7 = 35 + 7", "b": 1, "why": "The bottom part is 2 sevens, which is 14, not 7. It should be 35 + 14.", "hint": "How many sevens are in the bottom part?"}], "done": "A break-apart only works when <b>every</b> piece gets multiplied."}, {"type": "learn", "kick": "Big idea", "title": "You have been breaking apart all along", "text": "Breaking a factor into friendly parts, multiplying each part, then adding is called the <b>distributive</b> property. All your shortcuts use it.", "visual": {"kind": "passage", "text": "<b>×6</b> → 6 = 5 + 1 &nbsp;→&nbsp; 5 groups + 1 more group<br><b>×7</b> → 7 = 5 + 2 &nbsp;→&nbsp; 5 groups + 2 more groups<br><b>×9</b> → 9 = 10 − 1 &nbsp;→&nbsp; 10 groups − 1 group<br><b>×8</b> → three doubles (2 × 2 × 2)"}, "tip": "Next week you will use this same idea on big numbers like 75 × 8. Today's tactic is the key."}, {"type": "tap", "kick": "Try it", "title": "Sevens on Berk", "items": [{"q": "A week has 7 days. Toothless eats <b>8 fish every day</b>. How many fish does he eat in one week?", "choices": ["15", "54", "56", "48"], "a": 2, "why": "7 × 8. Think 5, 6, 7, 8: <b>56</b> fish. (Or 40 + 16 = 56.)", "no": ["15 is 7 + 8. He eats 8 fish on each of 7 days, so multiply.", "54 is 6 × 9. Break it apart: 40 + 16.", null, "48 is 6 × 8. A week has 7 days, not 6."]}, {"q": "Hiccup has <b>4 weeks</b> until the big dragon test. How many days is that?", "choices": ["11", "24", "21", "28"], "a": 3, "why": "4 weeks × 7 days. (5 × 4) + (2 × 4) = 20 + 8 = <b>28</b> days.", "no": ["11 is 4 + 7. Each week has 7 days, so these are equal groups.", "24 is 4 × 6. A week has 7 days.", "21 is only 3 weeks. Add one more week of 7.", null]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "What is <b>7 × 6</b>?", "choices": ["42", "36", "48", "13"], "a": 0, "why": "(5 × 6) + (2 × 6) = 30 + 12 = 42."}, {"q": "Which break-apart matches <b>7 × 9</b>?", "choices": ["(5 × 9) + 2", "(7 × 5) + (7 × 2)", "(5 × 9) + (2 × 9)", "(5 + 2) + 9"], "a": 2, "why": "Break 7 into 5 + 2 and multiply both parts by 9."}, {"q": "What is <b>7 × 8</b>?", "choices": ["54", "64", "56", "48"], "a": 2, "why": "5, 6, 7, 8: 56 = 7 × 8. Or 40 + 16 = 56."}, {"q": "Hiccup found a <b>fragment</b> of an old map. What did he find?", "choices": ["a whole new map", "a small broken piece of the map", "a box full of maps", "a map drawn by Stoick"], "a": 1, "why": "A fragment is a small piece broken off something."}, {"q": "How many days are in <b>9 weeks</b>?", "choices": ["16", "56", "72", "63"], "a": 3, "why": "9 × 7 = (5 × 9) + (2 × 9) = 45 + 18 = 63."}, {"q": "<b>7 × 4</b> = (5 × 4) + (2 × 4) = 20 + ___. What goes in the blank?", "choices": ["2", "8", "14", "4"], "a": 1, "why": "2 × 4 = 8. Then 20 + 8 = 28."}, {"q": "Which sentence shows a <b>cunning</b> plan?", "choices": ["Snotlout yelled and charged at the dragon.", "Fishlegs sat down and ate his lunch.", "Gobber taught the boys how to swim.", "Hiccup hid a basket of fish to lure the dragon into a trap."], "a": 3, "why": "Cunning means clever at planning or tricking. A hidden lure is a cunning trap."}, {"q": "Snotlout says 7 × 7 = 35 + 7 = 42. What is his mistake?", "choices": ["He needs two more sevens, not one: 35 + 14 = 49.", "5 × 7 is really 30, not 35.", "He should take 7 away: 35 − 7 = 28.", "There is no mistake."], "a": 0, "why": "7 = 5 + 2, so after 5 sevens (35) there are 2 more sevens (14). 7 × 7 = 49."}, {"q": "Bailey splits 7 × 9 into 45 and 18. Then she <b>reassembles</b> them. What does she do?", "choices": ["She multiplies them.", "She adds them: 45 + 18 = 63.", "She subtracts: 45 − 18 = 27.", "She throws away the 18."], "a": 1, "why": "To reassemble is to put the pieces back together. For partial products, that means add."}, {"q": "Gobber has <b>7 racks</b> with <b>8 swords</b> on each rack. He gives away <b>10 swords</b>. How many swords are left?", "choices": ["66", "56", "46", "38"], "a": 2, "why": "7 × 8 = 56 swords. Then 56 − 10 = 46."}]}], "win": "You broke the 7s apart and put them back together. Cunning work!", "prev": "bb-bailey-L03", "prevTitle": "Lesson 3"});</script></body></html>
