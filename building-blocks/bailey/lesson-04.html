<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 4: Break It Apart: The 7s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L04", "label": "Lesson 4", "title": "Break It Apart: The 7s", "goal": "I can break 7 into 5 + 2 to find any ×7 fact.", "date": "2026-10-27", "mastery": 90, "color": "#10AC84", "slides": [{"type": "hello", "title": "Break It Apart on Your Own", "text": "In class you broke the 7s into 5s and 2s. Now do it on your own. You will <b>type</b> most answers. Finish with Show What You Know.", "visual": {"kind": "bigtext", "text": "7 = 5 + 2", "sub": "Two friendly facts make one hard fact."}}, {"type": "learn", "kick": "Quick reminder", "title": "Break, multiply, reassemble", "text": "Read this once. Then you are ready.", "visual": {"kind": "area", "b": 9, "split": [5, 2], "show": true}, "tip": "7 × 9 = (5 × 9) + (2 × 9) = 45 + 18 = 63. <b>Every</b> piece gets multiplied. And 7 × 8 = 56: 5, 6, 7, 8."}, {"type": "vocab", "kick": "Word Power", "title": "Your 7 words", "text": "Flip each card one more time. Next you will <b>type</b> these words from memory.", "words": [{"word": "decompose", "pos": "verb", "meaning": "to break a number into smaller parts", "example": "I can <b>decompose</b> 7 into 5 and 2.", "emoji": "🧩"}, {"word": "addend", "pos": "noun", "meaning": "a number that is added to another number", "example": "In 30 + 12 = 42, the <b>addends</b> are 30 and 12.", "emoji": "➕"}, {"word": "distributive", "pos": "adjective", "meaning": "describes the rule that lets you break a factor apart, multiply each part, and add", "example": "The <b>distributive</b> property says 7 × 6 = (5 × 6) + (2 × 6).", "emoji": "🔀"}, {"word": "fragment", "pos": "noun", "meaning": "a small piece that has broken off something", "example": "Hiccup found a <b>fragment</b> of a dragon eggshell.", "emoji": "🥚"}, {"word": "reassemble", "pos": "verb", "meaning": "to put the pieces of something back together", "example": "The Vikings had to <b>reassemble</b> the broken longship.", "emoji": "🔧"}, {"word": "cunning", "pos": "adjective", "meaning": "clever at planning, especially at tricking others", "example": "The <b>cunning</b> dragon hid behind the rocks to surprise the boys.", "emoji": "🦊"}, {"word": "tactic", "pos": "noun", "meaning": "a planned move you use to reach a goal", "example": "Breaking 7 into 5 and 2 is a smart <b>tactic</b>.", "emoji": "♟️"}]}, {"type": "tap", "kick": "Word Power", "title": "Type the word", "text": "Type the word that fits. Spell it carefully.", "items": [{"type": "fill", "q": "Which word means <i>to break a number into smaller parts</i>?", "answers": ["decompose"], "why": "To <b>decompose</b> 7 is to break it into 5 + 2.", "no": "Look back at the word cards. It starts with <b>d</b>.", "hint": "de-com-pose"}, {"type": "fill", "q": "Which word means <i>a planned move you use to reach a goal</i>?", "answers": ["tactic"], "why": "A <b>tactic</b> is a planned move. Breaking 7 into 5 + 2 is a tactic.", "no": "It starts with <b>t</b>.", "hint": "tac-tic"}, {"type": "fill", "q": "In 40 + 16 = 56, the numbers 40 and 16 are each an ____.", "answers": ["addend", "addends"], "why": "An <b>addend</b> is a number that is added to another number.", "no": "Which word names a number you add?", "hint": "It starts with <b>a</b>."}, {"type": "fill", "q": "The rule that lets you break a factor apart, multiply each part, and add is the ____ property.", "answers": ["distributive"], "why": "The <b>distributive</b> property: 7 × 6 = (5 × 6) + (2 × 6).", "no": "It starts with <b>d</b> and ends with <b>-tive</b>.", "hint": "dis-trib-u-tive"}]}, {"type": "tap", "kick": "Break it apart", "title": "Type the missing piece", "text": "Break the 7 into 5 + 2. Type the missing number.", "items": [{"type": "fill", "q": "7 × 8 = 40 + ____", "answers": ["16"], "why": "2 × 8 = 16. Then 40 + 16 = 56.", "no": "The bottom part is 2 groups of 8."}, {"type": "fill", "q": "7 × 6 = ____ + 12", "answers": ["30"], "why": "5 × 6 = 30. Then 30 + 12 = 42.", "no": "The top part is 5 groups of 6."}, {"type": "fill", "q": "7 × 9 = ____", "answers": ["63"], "why": "(5 × 9) + (2 × 9) = 45 + 18 = 63.", "no": "Find 5 × 9 and 2 × 9. Then add.", "hint": "45 + 18 = ?"}, {"type": "fill", "q": "7 × 3 = ____", "answers": ["21"], "why": "(5 × 3) + (2 × 3) = 15 + 6 = 21.", "no": "Find 5 × 3 and 2 × 3. Then add."}]}, {"type": "sort", "kick": "Sort it", "title": "Correct or broken?", "text": "Tap a card, then tap the right box. Check <b>both</b> pieces.", "buckets": ["✅ Correct break-apart", "❌ Broken break-apart"], "items": [{"text": "7 × 5 = 25 + 10", "b": 0, "why": "5 × 5 = 25 and 2 × 5 = 10. 25 + 10 = 35.", "hint": "Check 5 × 5 and 2 × 5."}, {"text": "7 × 8 = 40 + 14", "b": 1, "why": "2 × 8 is 16, not 14. It should be 40 + 16 = 56.", "hint": "Is 14 really 2 × 8?"}, {"text": "7 × 2 = 10 + 4", "b": 0, "why": "5 × 2 = 10 and 2 × 2 = 4. 10 + 4 = 14.", "hint": "Check 5 × 2 and 2 × 2."}, {"text": "7 × 6 = 35 + 12", "b": 1, "why": "35 is 5 × 7, not 5 × 6. It should be 30 + 12 = 42.", "hint": "Is 35 really 5 × 6?"}, {"text": "7 × 10 = 50 + 20", "b": 0, "why": "5 × 10 = 50 and 2 × 10 = 20. 50 + 20 = 70.", "hint": "Check 5 × 10 and 2 × 10."}, {"text": "7 × 4 = 20 + 4", "b": 1, "why": "The 2 has to be multiplied too: 2 × 4 = 8. It should be 20 + 8 = 28.", "hint": "Is the second part 2 × 4?"}], "done": "A break-apart only works when <b>every</b> piece gets multiplied."}, {"type": "talk", "kick": "Say it out loud", "title": "Teach someone at home", "text": "Find someone at home. Teach them for two minutes.", "prompts": ["Show them how to break apart <b>7 × 6</b>. Draw it if you can.", "Teach them the 7 × 8 trick: 5, 6, 7, 8.", "Tell them about a <b>cunning</b> plan in your book."], "starters": ["First I decompose 7 into …", "Say 5, 6, 7, 8 …", "A cunning plan was …"]}, {"type": "tap", "kick": "Word problems", "title": "Sevens on Berk", "text": "Find the equal groups. Break the 7 apart.", "items": [{"type": "fill", "q": "Toothless sleeps 9 hours each night for 7 nights. How many hours does he sleep?", "answers": ["63"], "why": "7 × 9 = 45 + 18 = 63 hours.", "no": "7 equal groups of 9. Break the 7 into 5 + 2."}, {"type": "fill", "q": "Gobber has 7 boxes with 6 nails in each box. He uses 12 nails. How many nails are left?", "answers": ["30"], "why": "7 × 6 = 30 + 12 = 42 nails. Then 42 − 12 = 30.", "no": "First find all the nails (7 × 6). Then take away 12.", "hint": "7 × 6 = 42. Now take away 12."}, {"q": "Gobber has 7 racks with 8 swords on each. Which break-apart finds how many swords?", "choices": ["(5 × 8) + 2", "(5 × 7) + (2 × 8)", "(5 × 8) + (2 × 8)", "7 + 8"], "a": 2, "why": "Break the 7 racks into 5 + 2. Multiply both by 8: 40 + 16 = 56 swords.", "no": ["The 2 racks have 8 swords each. Multiply the 2 by 8 too.", "The first part should be 5 × 8, not 5 × 7.", null, "Each rack has 8 swords. That is equal groups, so multiply."]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "7 × 6 = ____", "answers": ["42"], "why": "(5 × 6) + (2 × 6) = 30 + 12 = 42.", "no": "Break the 7 into 5 + 2."}, {"q": "Which break-apart matches <b>7 × 9</b>?", "choices": ["(5 × 9) + 2", "(7 × 5) + (7 × 2)", "(5 × 9) + (2 × 9)", "(5 + 2) + 9"], "a": 2, "why": "Break 7 into 5 + 2 and multiply both parts by 9.", "no": ["The 2 must be multiplied by 9 too.", "That is 7 × 7. The 9 should stay whole.", null, "That only adds. Nothing is multiplied."]}, {"type": "fill", "q": "7 × 8 = ____", "answers": ["56"], "why": "5, 6, 7, 8: 56 = 7 × 8. Or 40 + 16 = 56.", "no": "Say 5, 6, 7, 8."}, {"q": "Hiccup found a <b>fragment</b> of an old map. What did he find?", "choices": ["a whole new map", "a small broken piece of the map", "a box full of maps", "a map drawn by Stoick"], "a": 1, "why": "A fragment is a small piece broken off something.", "no": ["A fragment is only a piece, not the whole thing.", null, "A fragment is one small piece, not a box of maps.", "Fragment is about a broken piece, not who drew it."]}, {"type": "fill", "q": "How many days are in 9 weeks?", "answers": ["63"], "why": "9 × 7 = (5 × 9) + (2 × 9) = 45 + 18 = 63.", "no": "Each week has 7 days. 9 groups of 7."}, {"type": "fill", "q": "7 × 4 = (5 × 4) + (2 × 4) = 20 + ____", "answers": ["8"], "why": "2 × 4 = 8. Then 20 + 8 = 28.", "no": "What is 2 × 4?"}, {"type": "fill", "q": "Which word means <i>clever at planning, especially at tricking others</i>?", "answers": ["cunning"], "why": "<b>Cunning</b> means clever at planning, especially at tricking others.", "no": "It starts with <b>c</b>."}, {"q": "Snotlout says 7 × 6 = 35 + 12 = 47. What is his mistake?", "choices": ["He used 5 × 7 for the first part. It should be 5 × 6 = 30, so 30 + 12 = 42.", "2 × 6 is really 14.", "He should subtract: 35 − 12.", "There is no mistake."], "a": 0, "why": "7 = 5 + 2, and both parts are multiplied by 6: 30 + 12 = 42.", "no": [null, "2 × 6 = 12, so that part is right.", "Partial products are added, not subtracted.", "7 × 6 = 42, not 47."]}, {"q": "Bailey splits 7 × 9 into 45 and 18. Then she <b>reassembles</b> them. What does she do?", "choices": ["She multiplies them.", "She adds them: 45 + 18 = 63.", "She subtracts: 45 − 18 = 27.", "She throws away the 18."], "a": 1, "why": "To reassemble is to put the pieces back together. For partial products, that means add.", "no": ["45 × 18 is far too big. Put the pieces together by adding.", null, "Subtracting takes a piece away. Reassemble puts them together.", "Every piece is needed to reassemble the whole."]}, {"type": "fill", "q": "Gobber has 7 racks with 8 swords on each rack. He gives away 10 swords. How many swords are left?", "answers": ["46"], "why": "7 × 8 = 56 swords. Then 56 − 10 = 46.", "no": "First find all the swords (7 × 8). Then take away 10."}], [{"type": "fill", "q": "7 × 7 = ____", "answers": ["49"], "why": "(5 × 7) + (2 × 7) = 35 + 14 = 49.", "no": "Break one 7 into 5 + 2."}, {"q": "Which break-apart matches <b>7 × 6</b>?", "choices": ["(5 × 6) + 2", "(7 × 5) + (7 × 2)", "(5 + 2) + 6", "(5 × 6) + (2 × 6)"], "a": 3, "why": "Break 7 into 5 + 2 and multiply both parts by 6: 30 + 12 = 42.", "no": ["The 2 must be multiplied by 6 too.", "That is 7 × 7 = 49. The 6 should stay whole.", "That only adds. Nothing is multiplied.", null]}, {"type": "fill", "q": "8 × 7 = ____", "answers": ["56"], "why": "Turn it around: 7 × 8. 5, 6, 7, 8: 56.", "no": "Turn it around. Say 5, 6, 7, 8."}, {"q": "Which is the best example of a <b>tactic</b>?", "choices": ["Breaking 7 × 9 into 45 + 18", "A dragon's shiny scales", "Feeling sleepy after lunch", "A loud horn"], "a": 0, "why": "A tactic is a planned move you use to reach a goal. Breaking a fact apart is a plan.", "no": [null, "Scales are a thing, not a planned move.", "A feeling is not a plan.", "A horn is a thing. A tactic is a plan."]}, {"type": "fill", "q": "How many days are in 6 weeks?", "answers": ["42"], "why": "6 × 7 = 35 + 7 = 42 (or 30 + 12 = 42).", "no": "Each week has 7 days. 6 groups of 7."}, {"type": "fill", "q": "7 × 9 = (5 × 9) + (2 × 9) = 45 + ____", "answers": ["18"], "why": "2 × 9 = 18. Then 45 + 18 = 63.", "no": "What is 2 × 9?"}, {"type": "fill", "q": "Which word means <i>to put the pieces of something back together</i>?", "answers": ["reassemble"], "why": "To <b>reassemble</b> is to put the pieces back together.", "no": "It starts with <b>re</b>."}, {"q": "Fishlegs says 7 × 9 = 45 + 9 = 54. What is his mistake?", "choices": ["45 should be 35.", "He should subtract: 45 − 9.", "The bottom part is 2 × 9 = 18, not 9. 45 + 18 = 63.", "There is no mistake."], "a": 2, "why": "Two rows of 9 is 18. 45 + 18 = 63.", "no": ["45 is 5 × 9, which is right.", "Partial products are added.", null, "7 × 9 = 63, not 54."]}, {"q": "In 35 + 14 = 49, which numbers are the <b>addends</b>?", "choices": ["49 only", "35 and 14", "7 and 7", "5 and 2"], "a": 1, "why": "Addends are the numbers you add: 35 and 14.", "no": ["49 is the sum, the answer.", null, "7 and 7 are the factors of 7 × 7.", "5 and 2 are the pieces of the 7, not what you add."]}, {"type": "fill", "q": "Hiccup feeds Toothless 7 fish a day for 6 days. On the last day he adds 5 extra fish. How many fish in all?", "answers": ["47"], "why": "6 × 7 = 42 fish. Then 42 + 5 = 47.", "no": "First find 6 days of 7 fish. Then add the 5 extra."}], [{"type": "fill", "q": "7 × 3 = ____", "answers": ["21"], "why": "(5 × 3) + (2 × 3) = 15 + 6 = 21.", "no": "Break the 7 into 5 + 2."}, {"q": "Which break-apart matches <b>7 × 8</b>?", "choices": ["(5 × 8) + 2", "(5 × 8) + (2 × 8)", "(5 × 7) + (2 × 8)", "(5 + 2) + 8"], "a": 1, "why": "Break 7 into 5 + 2 and multiply both by 8: 40 + 16 = 56.", "no": ["The 2 must be multiplied by 8 too.", null, "The first part should be 5 × 8, not 5 × 7.", "That only adds. Nothing is multiplied."]}, {"type": "fill", "q": "9 × 7 = ____", "answers": ["63"], "why": "Turn it around: 7 × 9 = 45 + 18 = 63. (Or 70 − 7.)", "no": "Use a break-apart or ×10 take away one group."}, {"q": "Bailey <b>decomposes</b> 7. What does she do?", "choices": ["She breaks 7 into 5 and 2.", "She multiplies 7 by 7.", "She hides the 7.", "She adds 7 over and over."], "a": 0, "why": "To decompose is to break a number into smaller parts.", "no": [null, "That is multiplying, not breaking apart.", "Decompose is not about hiding.", "That is the slow road. Decompose means break apart."]}, {"type": "fill", "q": "How many days are in 8 weeks?", "answers": ["56"], "why": "8 × 7 = 56. Say 5, 6, 7, 8.", "no": "Each week has 7 days. 8 groups of 7."}, {"type": "fill", "q": "7 × 6 = (5 × 6) + (2 × 6) = ____ + 12", "answers": ["30"], "why": "5 × 6 = 30. Then 30 + 12 = 42.", "no": "What is 5 × 6?"}, {"type": "fill", "q": "Which word means <i>a small piece that has broken off something</i>?", "answers": ["fragment"], "why": "A <b>fragment</b> is a small broken piece.", "no": "It starts with <b>f</b>."}, {"q": "Snotlout writes 7 × 4 = 20 + 2 = 22. What went wrong?", "choices": ["He should have used 5 × 7.", "Nothing. 22 is right.", "He never multiplied the 2 by 4. It should be 20 + 8 = 28.", "He should have subtracted."], "a": 2, "why": "Both pieces get multiplied: 2 × 4 = 8. 20 + 8 = 28.", "no": ["5 × 4 = 20 is right. Look at the second piece.", "7 × 4 = 28, not 22.", null, "Partial products are added."]}, {"q": "Which shows the <b>distributive</b> property?", "choices": ["7 × 8 = 8 × 7", "7 + 8 = 15", "56 − 8 = 48", "7 × 8 = (5 × 8) + (2 × 8)"], "a": 3, "why": "Break a factor apart, multiply each part, and add. That is the distributive property.", "no": ["That switches the factors. That is the commutative property.", "That only adds.", "That subtracts. Nothing is broken apart.", null]}, {"type": "fill", "q": "Stoick's 7 ships each carry 9 sheep. 8 sheep jump off. How many sheep are left?", "answers": ["55"], "why": "7 × 9 = 63 sheep. Then 63 − 8 = 55.", "no": "First find all the sheep (7 × 9). Then take away 8."}]]}], "win": "You broke the 7s apart and put them back together. Cunning work!", "prev": "bb-bailey-L03", "prevTitle": "Lesson 3"});</script></body></html>
