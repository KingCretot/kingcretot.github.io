<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 3: Double, Double, Double: The 8s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L03", "label": "Lesson 3", "title": "Double, Double, Double: The 8s", "goal": "I can find any ×8 fact by doubling three times.", "date": "2026-10-26", "mastery": 90, "color": "#10AC84", "slides": [{"type": "hello", "title": "Double, Double, Double: The 8s", "text": "Last week you tamed the 9s and the 6s. Today you get a new tool: <b>doubling</b>. With three quick doubles you can find <b>every ×8 fact</b> without adding 8 over and over.", "visual": {"kind": "bigtext", "text": "8 × 7 = ?", "sub": "Three doubles will get you there."}, "notes": {"do": "Zoom: share your screen with this class lesson. Before you start, check that she has at home: about 60 dried beans (or cereal pieces), a sheet of paper, a pencil, and paper or a small whiteboard to hold up to the camera.", "say": "\"Last week you tamed the 9s and the 6s. This week we take on the 8s. Today's tool is doubling, and you already know how to double.\"", "ask": "\"What is 7 + 7? What is 14 + 14?\"", "listen": "14 and 28 quickly. If 14 + 14 is slow, plan extra time on class slide 9 (doubling bigger numbers)."}}, {"type": "talk", "kick": "Book Talk", "title": "How does Hiccup solve problems?", "text": "Think about the part of <i>How to Train Your Dragon</i> you read since our last lesson.", "prompts": ["Tell me what happened, in order: beginning, middle, end.", "What is the biggest problem Hiccup faces right now? Is it with another character, with himself, or with nature?", "Hiccup is not the biggest or strongest Viking. What does he use instead of muscles?"], "starters": ["First, … Then, … At the end, …", "Hiccup's biggest problem is … because …", "Instead of muscles, Hiccup uses …"], "notes": {"do": "5–7 minutes. She holds the book up to the camera and finds the page where she stopped.", "say": "\"Hiccup is not the biggest Viking. Today we are going to be like Hiccup: use a smart tool instead of muscles.\"", "ask": "\"What is Hiccup's biggest problem right now? Is it with another character, with himself, or with nature?\"", "listen": "Retelling with order words (first, then, at the end) and a named conflict type with a reason. If she says only \"a dragon,\" ask \"What makes it hard for HIM?\""}}, {"type": "recall", "kick": "Remember?", "title": "Last week's shortcuts", "text": "Use your ×9 and ×6 tools. No adding over and over!", "items": [{"q": "What is <b>9 × 7</b>? Use ×10 minus one group.", "choices": ["72", "63", "61", "56"], "a": 1, "why": "10 × 7 = 70. Take away one group of 7: 70 − 7 = <b>63</b>.", "no": ["72 is 9 × 8. Start from 70 and take away one 7.", null, "You took away 9. Take away one group of <b>7</b>: 70 − 7.", "You took away two 7s. Nine groups is only one group less than ten."]}, {"q": "<b>6 × ? = 48</b>. Use ×5 plus one group to test each choice.", "choices": ["7", "9", "8"], "a": 2, "why": "5 × 8 = 40, plus one more 8 is 48. So 6 × <b>8</b> = 48.", "no": ["6 × 7 = 35 + 7 = 42, not 48.", "6 × 9 = 45 + 9 = 54, not 48.", null]}, {"q": "Bailey says 9 × 6 = 54. Which is a way to <b>verify</b> it?", "choices": ["5 + 4 = 9, and 60 − 6 = 54. Both checks work.", "54 looks about right.", "9 + 6 = 15, so it must be 54."], "a": 0, "why": "To <b>verify</b> is to check that it is true. The digits of a 9s fact add to 9, and the ×10 shortcut gives 54 too.", "no": [null, "Looking right is a guess, not a check.", "9 + 6 = 15 adds the factors. It does not check 54 at all."]}], "notes": {"do": "She says the tool out loud before she taps (\"70 take away 7\").", "ask": "\"What does <b>verify</b> mean? How did you verify 9 × 6 = 54?\"", "listen": "\"Check that it's true.\" Two checks: digits add to 9, and 60 − 6. If she starts adding 9s, stop her: \"What is 10 groups?\""}}, {"type": "vocab", "kick": "Word Power", "title": "Seven words for today", "text": "Jonathan teaches each word. Flip the card, read the meaning, and make your own sentence.", "words": [{"word": "double", "pos": "verb", "meaning": "to make something two times as big; to multiply by 2", "example": "If you <b>double</b> 14, you get 28.", "emoji": "✌️"}, {"word": "halve", "pos": "verb", "meaning": "to cut something into two equal parts; to divide by 2", "example": "If you <b>halve</b> 56, you get 28.", "emoji": "✂️"}, {"word": "quadruple", "pos": "verb", "meaning": "to make something four times as big", "example": "When you <b>quadruple</b> 6, you get 24.", "emoji": "🍀"}, {"word": "hoard", "pos": "noun", "meaning": "a large pile of things someone has saved and hidden", "example": "The dragon slept on a <b>hoard</b> of gold coins.", "emoji": "💰"}, {"word": "gargantuan", "pos": "adjective", "meaning": "huge; far bigger than usual", "example": "A <b>gargantuan</b> sea dragon rose out of the waves.", "emoji": "🐉"}, {"word": "formidable", "pos": "adjective", "meaning": "so strong or powerful that people are afraid of it or respect it", "example": "The Viking chief was a <b>formidable</b> warrior.", "emoji": "🛡️"}, {"word": "amplify", "pos": "verb", "meaning": "to make something bigger, louder, or stronger", "example": "Hiccup cupped his hands to <b>amplify</b> his voice.", "emoji": "📣"}], "notes": {"do": "Teach one word at a time (about 1 minute each). She writes each word on paper at home to start a new word list for this week.", "say": "\"<b>Double</b> means two times as many. <b>Halve</b> is the opposite: cut into two equal parts. <b>Quadruple</b> has <i>quad</i> in it, like a quad bike with four wheels: four times as big. A <b>hoard</b> is a hidden pile, like a dragon's gold. <b>Gargantuan</b> means giant-sized. <b>Formidable</b> means so powerful people respect or fear it. <b>Amplify</b> means make bigger or louder, like a speaker.\"", "ask": "\"How are double and quadruple related?\" \"Who in the book is formidable?\" \"What would a dragon keep in its hoard?\"", "listen": "\"Quadruple is double, then double again.\" Book sentences like \"Stoick is formidable.\""}}, {"type": "tap", "kick": "Word Work", "title": "Use the words", "items": [{"q": "Which sentence uses <b>formidable</b> correctly?", "choices": ["The tiny kitten was formidable, so nobody noticed it.", "Fishlegs ate a formidable breakfast of toast.", "The Vikings stepped back from the formidable dragon."], "a": 2, "why": "<b>Formidable</b> means powerful enough to make people afraid or respectful. Stepping back shows that.", "no": ["Something formidable gets noticed and makes people careful. A tiny kitten nobody noticed is the opposite.", "Toast cannot make anyone afraid or respectful. Formidable is about power.", null]}, {"q": "Hiccup had 7 fish. Then he <b>quadrupled</b> them. Which shows the new number?", "choices": ["7 + 4 = 11", "7 × 4 = 28", "7 × 2 = 14", "7 × 8 = 56"], "a": 1, "why": "<b>Quadruple</b> means four times as many: 7 × 4 = 28. That is double (14), then double again (28).", "no": ["Quadruple does not mean add 4. It means four times as many.", null, "14 is only doubled once. Quadruple is double, then double again.", "56 is three doubles. Quadruple is only two doubles."]}, {"type": "fill", "q": "Halve is the opposite of which word? Type it.", "answers": ["double"], "why": "To <b>double</b> is to make two times as big. To <b>halve</b> is to cut in two. They undo each other.", "no": "Halve means cut into two equal parts. What is its opposite?"}], "notes": {"do": "She reads each sentence out loud first and tells you why the wrong choices are wrong.", "ask": "\"Why can't toast be formidable?\" \"If I quadruple 7 and you double 7, who has more? How many more?\"", "listen": "\"Toast isn't powerful.\" \"You have 28 and I have 14, so 14 more.\""}}, {"type": "learn", "kick": "Learn", "title": "Stepping stone: ×4 is double, double", "text": "Doubling means ×2. If you double, and then double again, you have multiplied by <b>4</b>, because 2 × 2 = 4.", "visual": {"kind": "array", "rows": 4, "cols": 6, "emoji": "🥚", "label": "4 rows of 6 dragon eggs"}, "steps": [{"text": "<b>Start</b> with 6 (one row).", "visual": {"kind": "bigtext", "text": "6"}}, {"text": "<b>Double</b> it: 6 + 6 = 12. That is <b>2 × 6</b> (two rows).", "visual": {"kind": "bigtext", "text": "6 → 12"}}, {"text": "<b>Double again</b>: 12 + 12 = 24. That is <b>4 × 6</b> (four rows).", "visual": {"kind": "bigtext", "text": "6 → 12 → 24"}}], "tip": "Two doubles = ×4. Say it while you count on two fingers: \"double, double.\"", "notes": {"do": "Hands-on at home: she puts 1 row of 6 beans on her paper. \"Double it\": she makes a second row (12). \"Double again\": she copies both rows (24 in 4 rows).", "say": "\"Each double is ×2. Two doubles is ×2 ×2, and that is ×4.\"", "ask": "\"How many rows do you have now? How many beans? So what is 4 × 6?\"", "listen": "\"4 rows, 24 beans, 4 × 6 = 24.\" Have her hold the paper up to the camera."}}, {"type": "tap", "kick": "Try it", "title": "Double, double", "items": [{"q": "What is <b>4 × 7</b>? Double, then double again.", "choices": ["21", "28", "24", "14"], "a": 1, "why": "7 → 14 → <b>28</b>. Two doubles, so 4 × 7 = 28.", "no": ["21 is 7 + 7 + 7. That is only 3 groups.", null, "Double 14 means 14 + 14. Try that again.", "14 is only one double (2 × 7). Double once more."]}, {"q": "Which chain shows <b>4 × 9</b>?", "choices": ["9 → 18 → 27", "9 → 18 → 36 → 72", "9 → 18 → 36"], "a": 2, "why": "Two doubles: 9 → 18 → <b>36</b>. So 4 × 9 = 36.", "no": ["18 + 9 = 27 adds a 9. Doubling 18 means 18 + 18.", "That chain doubles three times. That is ×8, not ×4.", null]}], "notes": {"do": "She says each double out loud while holding up a finger for each one.", "ask": "\"Why is 9 → 18 → 27 wrong for 4 × 9?\"", "listen": "\"18 + 9 adds a 9. Doubling 18 is 18 + 18.\""}}, {"type": "learn", "kick": "Learn", "title": "The big one: ×8 is double, double, double", "text": "Double three times and you have multiplied by <b>8</b>, because 2 × 2 × 2 = 8. Watch 8 × 7.", "visual": {"kind": "array", "rows": 8, "cols": 7, "emoji": "🔥", "label": "8 rows of 7 dragon flames"}, "steps": [{"text": "<b>Start</b> with 7.", "visual": {"kind": "bigtext", "text": "7"}}, {"text": "<b>Double 1:</b> 7 + 7 = 14. That is 2 × 7.", "visual": {"kind": "bigtext", "text": "7 → 14"}}, {"text": "<b>Double 2:</b> 14 + 14 = 28. That is 4 × 7.", "visual": {"kind": "bigtext", "text": "7 → 14 → 28"}}, {"text": "<b>Double 3:</b> 28 + 28 = 56. That is <b>8 × 7 = 56</b>.", "visual": {"kind": "bigtext", "text": "7 → 14 → 28 → 56"}}], "tip": "Count the doubles on three fingers. Three doubles is only three steps. Adding 7 eight times is seven steps, with seven chances to lose your place.", "notes": {"do": "Reveal one step at a time. She says each double BEFORE you click to show it. Three fingers up by the end.", "say": "\"Three doubles is ×8, because 2 × 2 × 2 = 8. Three steps instead of adding 7 eight times.\"", "ask": "\"How many steps is adding 7 eight times? How many steps is doubling?\"", "listen": "\"Seven adds\" versus \"three doubles.\" Point out: fewer steps means fewer places to lose count."}}, {"type": "learn", "kick": "Learn", "title": "Doubling bigger numbers", "text": "The third double is often a 2-digit number, like 28 + 28. Double the tens, double the ones, then put them together.", "visual": {"kind": "bigtext", "text": "28 + 28", "sub": "tens: 20 + 20 · ones: 8 + 8"}, "steps": [{"text": "Double the tens: 20 + 20 = <b>40</b>."}, {"text": "Double the ones: 8 + 8 = <b>16</b>."}, {"text": "Put them together: 40 + 16 = <b>56</b>. So 8 × 7 = 56."}, {"text": "Try 36 + 36: 30 + 30 = 60, 6 + 6 = 12, 60 + 12 = <b>72</b>. So 8 × 9 = 72.", "visual": {"kind": "bigtext", "text": "36 + 36 = 72"}}], "tip": "Tens first, then ones. It is the same trick every time.", "notes": {"do": "Write 28 + 28 on your whiteboard and split it into tens and ones. Then say 24 + 24 and 32 + 32 and she does them on her paper and holds them up.", "ask": "\"What is 24 + 24? What is 32 + 32?\"", "listen": "48 and 64, with \"40 and 8\" or \"60 and 4\" said out loud. These are the third doubles for 8 × 6 and 8 × 8."}}, {"type": "build", "kick": "Build it", "title": "Eight nests on the cliff", "text": "On a cliff near Berk there are <b>8 dragon nests</b>. Each nest holds <b>6 eggs</b>. Build the nests.", "groups": 8, "each": 6, "emoji": "🥚", "why": "8 groups of 6. Look at the top 4 nests: 4 × 6 = 24. The bottom 4 nests are the same, so <b>double 24</b>: 8 × 6 = <b>48</b>.", "hint": "How many nests? How many eggs in each nest?", "notes": {"do": "On screen she builds 8 nests of 6. At home she makes 8 small piles of 6 beans.", "say": "\"Look at the top 4 nests. That is 4 × 6. The bottom 4 are the same.\"", "ask": "\"What is 4 × 6? Why can we just double 24?\"", "listen": "\"24, and the bottom half is another 24, so 48.\""}}, {"type": "order", "kick": "Put it in order", "title": "Find 8 × 9 by doubling", "text": "Tap the steps in the right order.", "steps": ["Start with 9", "Double: 18 (that is 2 × 9)", "Double again: 36 (that is 4 × 9)", "Double a third time: 72 (that is 8 × 9)", "Check: three doubles, so 8 × 9 = 72"], "why": "9 → 18 → 36 → 72. Three doubles make ×8.", "hint": "Each double uses the number you just made. What comes next?", "notes": {"do": "She taps the steps and reads each one out loud.", "ask": "\"Which step is the hardest? How do you double 36?\"", "listen": "\"The last double. 30 + 30 = 60, 6 + 6 = 12, 72.\""}}, {"type": "tap", "kick": "How many doubles?", "title": "Count the doubles", "text": "Find the 2, 4 or 8. Turn the fact around if you need to.", "items": [{"type": "fill", "q": "8 × 3: how many times do you double? Type a number.", "answers": ["3"], "why": "×8 means three doubles: 3 → 6 → 12 → 24.", "no": "Which number is 8? ×8 is three doubles."}, {"type": "fill", "q": "7 × 4: how many times do you double? Type a number.", "answers": ["2"], "why": "Turn it around: 4 × 7. Two doubles: 7 → 14 → 28.", "no": "Turn it around. ×4 is two doubles."}, {"type": "fill", "q": "2 × 9: how many times do you double? Type a number.", "answers": ["1"], "why": "×2 is one double: 9 → 18.", "no": "×2 is the smallest one."}, {"type": "fill", "q": "5 × 8: how many times do you double? Type a number.", "answers": ["3"], "why": "Turn it around: 8 × 5. Three doubles: 5 → 10 → 20 → 40.", "no": "Turn it around. Which number is 8?"}], "notes": {"do": "She holds up fingers for the number of doubles before she types, then says the whole chain.", "ask": "\"For 5 × 8, which number do you double? Why not double the 8?\"", "listen": "\"Double the 5 three times, because the 8 tells me how many doubles.\""}}, {"type": "tap", "kick": "Try it", "title": "Doubling on Berk", "items": [{"q": "Fishlegs tries 8 × 7. He writes: <b>7, 14, 21, 28</b>. He says 8 × 7 = 28. What went wrong?", "choices": ["He started with the wrong number.", "He doubled too many times.", "He added 7 each time instead of doubling."], "a": 2, "why": "14 + 7 = 21 adds one more 7. Doubling 14 is 14 + 14 = 28, then 28 + 28 = <b>56</b>.", "no": ["Starting with 7 is right. Look at the step from 14 to 21.", "He only made three jumps. The problem is how he jumped: adding 7, not doubling.", null]}, {"q": "The Hooligan tribe has <b>8 longships</b>. Each longship carries <b>8 Vikings</b>. How many Vikings sail?", "choices": ["16", "64", "56", "72"], "a": 1, "why": "8 equal groups of 8. 8 → 16 → 32 → <b>64</b>.", "no": ["16 is 8 + 8. That counts only two ships.", null, "56 is 8 × 7. Check: 8 → 16 → 32 → 64.", "72 is 8 × 9. There are 8 Vikings on each ship."]}, {"q": "Every dragon has <b>4 legs</b>. Hiccup counts the legs on <b>8 dragons</b>. How many legs?", "choices": ["12", "16", "32", "36"], "a": 2, "why": "8 × 4. Double 4 three times: 4 → 8 → 16 → <b>32</b>.", "no": ["12 is 8 + 4. Each dragon has 4 legs, so these are equal groups. Multiply.", "16 is only two doubles. ×8 needs three.", null, "36 is 9 × 4. There are 8 dragons."]}], "notes": {"do": "She reads each problem aloud, names the equal groups, and writes the chain on her paper before she taps.", "ask": "For Fishlegs: \"Where did he go wrong? Fix it out loud.\"", "listen": "\"14 + 7 adds a 7. He should do 14 + 14 = 28, then 56.\""}}, {"type": "talk", "kick": "Say It Out Loud", "title": "Teach it back", "text": "Now you are the teacher. Explain it to Jonathan.", "prompts": ["Why is doubling three times the same as ×8?", "Make up a dragon problem for <b>8 × 4</b>. Use the word <b>gargantuan</b> or <b>formidable</b>.", "8 × 7 = 56. If you <b>halve</b> the 8, what fact do you get?"], "starters": ["Each double is ×2, so …", "A formidable dragon …", "Half of 8 is 4, so …"], "notes": {"do": "She holds up her paper with her dragon problem and the doubling chain.", "say": "\"If you can teach it, you own it.\"", "listen": "\"2 × 2 × 2 = 8.\" A problem with 8 equal groups of 4 (or 4 groups of 8) and the answer 32. \"4 × 7 = 28, half of 56.\""}}, {"type": "learn", "kick": "Wrap-up", "title": "Three doubles and done", "text": "Today you learned that <b>×4 is double, double</b> and <b>×8 is double, double, double</b>.", "visual": {"kind": "passage", "text": "▶ <b>After-Class Lesson</b>: on your own tonight. It ends with Show What You Know.<br>📚 Read 10 minutes.<br>That's all for tonight!"}, "tip": "Tomorrow is in person. Bring your book.", "notes": {"do": "Show the task list on the course page. Tonight is light: the After-Class Lesson and 10 minutes of reading.", "ask": "\"What is 8 × 6? Show me the chain on your fingers.\"", "say": "\"Tonight you need 90 on Show What You Know. A retake gives you new questions.\""}}], "win": "Three doubles and done. You are a formidable fact finder!", "prev": "bb-bailey-L02", "prevTitle": "Lesson 2"});</script></body></html>
