<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 4: Break It Apart: The 7s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L04", "label": "Lesson 4", "title": "Break It Apart: The 7s", "goal": "I can break 7 into 5 + 2 to find any ×7 fact.", "date": "2026-10-27", "mastery": 90, "color": "#10AC84", "slides": [{"type": "hello", "title": "Break It Apart: The 7s", "text": "The 7s are tricky because doubling jumps from 4 groups straight to 8 groups and skips 7. So today you use a different <b>tactic</b>: break the 7 into two friendly numbers you already know, <b>5</b> and <b>2</b>.", "visual": {"kind": "bigtext", "text": "7 = 5 + 2", "sub": "Two friendly facts make one hard fact."}, "notes": {"do": "Before you start, look at her Lesson 3 after-class score on the course page. Have about 60 counters (or dried beans), a pencil and the whiteboard ready.", "say": "\"The 7s are tricky because doubling goes 2, 4, 8 and skips right over 7. So today we use a different tactic: break the 7 into two numbers you already know.\"", "ask": "\"What is 7 made of? Which two numbers would be friendly to multiply by?\"", "listen": "\"5 and 2\" (or 5 + 2). If she says 3 + 4, accept it as true, then ask which pair has the easier facts."}}, {"type": "talk", "kick": "Book Talk", "title": "Big problems, smaller pieces", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What happened in the part you read since Monday's lesson?", "Think of a big, scary job Hiccup faces. How could he break it into smaller steps? What would step one be?", "Which character has changed the most so far? What made them change?"], "starters": ["Since Monday, …", "Hiccup could start by … Then he could …", "… has changed the most because …"], "notes": {"do": "5–7 minutes. Book open to where she stopped.", "say": "\"Big scary jobs are easier in small pieces. That is today's math too.\"", "ask": "\"Think of a big job Hiccup faces. What would step one be? Step two?\" Then: \"Who has changed the most so far?\"", "listen": "A real job from the book broken into 2–3 ordered steps, and a character change with a cause (\"… changed because …\")."}}, {"type": "recall", "kick": "Remember?", "title": "Doubles and last week's tools", "items": [{"q": "What is <b>8 × 6</b>? Double three times.", "choices": ["46", "54", "42", "48"], "a": 3, "why": "6 → 12 → 24 → <b>48</b>.", "no": ["Check your last double: 24 + 24 is 48, not 46.", "54 is 9 × 6. Three doubles of 6: 12, 24, 48.", "42 is 7 × 6. You need 8 groups.", null]}, {"q": "What is <b>9 × 5</b>? Use ×10 minus one group.", "choices": ["50", "45", "41", "54"], "a": 1, "why": "10 × 5 = 50. Take away one group of 5: 50 − 5 = <b>45</b>.", "no": ["50 is 10 × 5. Nine groups is one group less, so take away 5.", null, "You took away 9. Take away one group of <b>5</b>: 50 − 5.", "54 is 9 × 6. Start from 50 and take away 5."]}, {"q": "Which word means <b>to cut into two equal parts</b>?", "choices": ["quadruple", "amplify", "halve", "double"], "a": 2, "why": "To <b>halve</b> means to divide by 2. Halve 56 and you get 28.", "no": ["Quadruple means make four times as big.", "Amplify means make bigger, louder, or stronger.", null, "Double is the opposite: multiply by 2."]}], "notes": {"do": "She says each double or shortcut out loud before she taps.", "ask": "\"What is the opposite of halve?\" \"For 9 × 5, which group do you take away?\"", "listen": "\"Double.\" \"One group of 5: 50 − 5 = 45.\" If she misses 8 × 6, have her count the doubles on her fingers again."}}, {"type": "vocab", "kick": "Word Power", "title": "Seven words for today", "text": "Jonathan teaches each word. Flip the card, read the meaning, and make your own sentence.", "words": [{"word": "decompose", "pos": "verb", "meaning": "to break a number into smaller parts", "example": "I can <b>decompose</b> 7 into 5 and 2.", "emoji": "🧩"}, {"word": "addend", "pos": "noun", "meaning": "a number that is added to another number", "example": "In 30 + 12 = 42, the <b>addends</b> are 30 and 12.", "emoji": "➕"}, {"word": "distributive", "pos": "adjective", "meaning": "describes the rule that lets you break a factor apart, multiply each part, and add", "example": "The <b>distributive</b> property says 7 × 6 = (5 × 6) + (2 × 6).", "emoji": "🔀"}, {"word": "fragment", "pos": "noun", "meaning": "a small piece that has broken off something", "example": "Hiccup found a <b>fragment</b> of a dragon eggshell.", "emoji": "🥚"}, {"word": "reassemble", "pos": "verb", "meaning": "to put the pieces of something back together", "example": "The Vikings had to <b>reassemble</b> the broken longship.", "emoji": "🔧"}, {"word": "cunning", "pos": "adjective", "meaning": "clever at planning, especially at tricking others", "example": "The <b>cunning</b> dragon hid behind the rocks to surprise the boys.", "emoji": "🦊"}, {"word": "tactic", "pos": "noun", "meaning": "a planned move you use to reach a goal", "example": "Breaking 7 into 5 and 2 is a smart <b>tactic</b>.", "emoji": "♟️"}], "notes": {"do": "Teach one word at a time (about 1 minute each). Write each word on an index card for this week's pile.", "say": "\"<b>Decompose</b> means break a number into smaller parts. An <b>addend</b> is a number you add. <b>Distributive</b> is the rule that lets you break a factor apart, multiply each part, and add. A <b>fragment</b> is a broken piece. <b>Reassemble</b>: re- means again, so assemble again, put it back together. <b>Cunning</b> means clever at tricking. A <b>tactic</b> is a planned move to reach a goal.\"", "ask": "\"In 30 + 12 = 42, what are the addends?\" \"What is a cunning thing a dragon could do?\" \"What is one tactic you use when a fact is hard?\"", "listen": "\"30 and 12.\" Book sentences for fragment, cunning and reassemble. For tactic: any real strategy (flip it, double, ×10 take away)."}}, {"type": "tap", "kick": "Word Work", "title": "Use the words", "items": [{"q": "Bailey <b>decomposes</b> 7 × 8 into 5 × 8 and 2 × 8. Which two <b>addends</b> does she add to get 7 × 8?", "choices": ["35 and 16", "5 and 2", "40 and 16", "56 and 0"], "a": 2, "why": "5 × 8 = 40 and 2 × 8 = 16. Those are the addends: 40 + 16 = 56.", "no": ["35 is 5 × 7. The part is 5 × 8.", "5 and 2 are the pieces of the 7. Each piece still has to be multiplied by 8.", null, "56 is the whole answer (the sum). The addends are the two parts you add."]}, {"q": "Which sentence shows a <b>cunning</b> plan?", "choices": ["Snotlout shouted and ran straight at the dragon.", "Hiccup left a trail of fish so the dragon would follow it into the cave.", "Fishlegs fell asleep during the lesson."], "a": 1, "why": "<b>Cunning</b> means clever at planning or tricking. A fish trail is a sneaky, clever plan.", "no": ["Running straight at a dragon is brave (or silly), but there is no clever plan.", null, "Falling asleep is not a plan at all."]}, {"type": "fill", "q": "To put the broken pieces back together is to ____ them. Type the word.", "answers": ["reassemble"], "why": "<b>Reassemble</b> means put the pieces back together.", "no": "re- means again. Which word means put together again?", "hint": "re-as-sem-ble"}], "notes": {"do": "She answers out loud first and explains each wrong choice.", "ask": "\"Why are 5 and 2 not the addends for 7 × 8?\"", "listen": "\"They are the pieces of the 7. Each piece still gets multiplied by 8, so the addends are 40 and 16.\""}}, {"type": "learn", "kick": "Learn", "title": "7 × 6: break the 7", "text": "You know your 5s, and ×2 is just a double. So break 7 rows into <b>5 rows</b> and <b>2 rows</b>.", "visual": {"kind": "array", "rows": 7, "cols": 6, "emoji": "🛡️", "label": "7 rows of 6 shields"}, "steps": [{"text": "<b>Decompose</b> the 7: 7 = 5 + 2."}, {"text": "Top 5 rows: <b>5 × 6 = 30</b>. (You know your 5s!)"}, {"text": "Bottom 2 rows: <b>2 × 6 = 12</b>. (Just double 6.)"}, {"text": "<b>Reassemble</b>: 30 + 12 = 42. So <b>7 × 6 = 42</b>.", "visual": {"kind": "area", "b": 6, "split": [5, 2], "show": true}}], "tip": "The two pieces, 30 and 12, are called <b>partial products</b>. Add them to get the whole product.", "notes": {"do": "Hands-on: she builds 7 rows of 6 counters, then lays a pencil under row 5. Reveal each step only after she counts that part.", "say": "\"Above the pencil is a fact you know: 5 × 6. Below the pencil is a double: 2 × 6. Two easy facts make one hard fact.\"", "ask": "\"How many above the pencil? How many below? How many in all?\"", "listen": "\"30 above, 12 below, 42 in all.\" Have her say \"partial products\" for 30 and 12."}}, {"type": "learn", "kick": "Hands-on", "title": "Split the 7 × 8 array", "text": "Build <b>7 rows of 8 counters</b>. Lay a pencil under row 5. Count what is above and below the pencil.", "steps": [{"text": "Above the pencil: 5 rows of 8 = <b>40</b>. Below the pencil: 2 rows of 8 = <b>16</b>. In this box picture, the 5 rows are the left box and the 2 rows are the right box.", "visual": {"kind": "area", "b": 8, "split": [5, 2], "show": true}}, {"text": "Here is a trick to remember it. Say the numbers in order: <b>5, 6, 7, 8</b>.", "visual": {"kind": "bigtext", "text": "56 = 7 × 8", "sub": "five, six, seven, eight"}}], "tip": "If you forget the trick, break it apart: 40 + 16 = 56.", "notes": {"do": "She builds 7 rows of 8 counters and splits it with the pencil under row 5. Then chant \"5, 6, 7, 8\" together three times.", "ask": "\"What is above the pencil? Below? Now say the trick: what is 7 × 8?\"", "listen": "\"40 and 16, so 56.\" \"5, 6, 7, 8: 56 = 7 × 8.\""}}, {"type": "tap", "kick": "Try it", "title": "Break it apart", "items": [{"q": "<b>7 × 9</b> = (5 × 9) + (2 × 9) = 45 + 18. What is 7 × 9?", "choices": ["47", "54", "64", "63"], "a": 3, "why": "45 + 18 = <b>63</b>. So 7 × 9 = 63.", "no": ["47 is 45 + 2. The bottom part is 2 <b>groups of 9</b>, which is 18.", "54 is 6 × 9. Add 45 + 18 again.", "Check your adding: 45 + 18. 45 + 15 = 60, then 3 more.", null]}, {"q": "Which break-apart matches <b>7 × 4</b>?", "choices": ["(5 × 4) + 2", "(5 × 4) + (2 × 4)", "(7 × 5) + (7 × 2)", "(5 + 2) + 4"], "a": 1, "why": "Break the 7 into 5 + 2 and multiply <b>both</b> parts by 4: 20 + 8 = 28.", "no": ["The 2 must be multiplied by 4 too. Every piece of the 7 gets multiplied.", null, "That breaks a 7 into 5 + 2 but multiplies by 7. It equals 7 × 7.", "That only adds. There is no multiplying at all."]}], "notes": {"do": "Cover the choices. She writes the break-apart on the whiteboard first, then taps.", "ask": "\"For 7 × 4, why is (5 × 4) + 2 wrong?\"", "listen": "\"The 2 has to be multiplied by 4 too. Every piece gets multiplied.\""}}, {"type": "build", "kick": "Build it", "title": "Hiccup's shield piles", "text": "Hiccup stacks <b>7 piles</b> of shields. Each pile has <b>7 shields</b>. Build the piles.", "groups": 7, "each": 7, "emoji": "🛡️", "why": "7 piles of 7. The first 5 piles: 5 × 7 = 35. The last 2 piles: 2 × 7 = 14. Reassemble: 35 + 14 = <b>49</b>.", "hint": "How many piles? How many shields in each pile?", "notes": {"do": "She builds 7 piles of 7 on screen, and 7 piles of 7 counters on the table. Slide the pencil between pile 5 and pile 6.", "ask": "\"How many in the first 5 piles? In the last 2 piles? Reassemble them.\"", "listen": "\"35 and 14, so 49.\""}}, {"type": "tap", "kick": "Correct or broken?", "title": "Check the break-aparts", "text": "Say which piece you checked. Then type <b>correct</b> or <b>broken</b>.", "items": [{"type": "fill", "q": "7 × 3 = 15 + 6. Is this break-apart correct or broken? Type <b>correct</b> or <b>broken</b>.", "answers": ["correct"], "why": "5 × 3 = 15 and 2 × 3 = 6. 15 + 6 = 21. Correct!", "no": "Find 5 × 3 and 2 × 3."}, {"type": "fill", "q": "7 × 6 = 30 + 2. Is this break-apart correct or broken? Type <b>correct</b> or <b>broken</b>.", "answers": ["broken"], "why": "The 2 was never multiplied. It should be 30 + 12. Broken.", "no": "Is the second part 2 × 6?"}, {"type": "fill", "q": "7 × 8 = 35 + 16. Is this break-apart correct or broken? Type <b>correct</b> or <b>broken</b>.", "answers": ["broken"], "why": "35 is 5 × 7, not 5 × 8. It should be 40 + 16. Broken.", "no": "Is 35 really 5 × 8?"}, {"type": "fill", "q": "7 × 7 = 35 + 7. Is this break-apart correct or broken? Type <b>correct</b> or <b>broken</b>.", "answers": ["broken"], "why": "The bottom part is 2 sevens, which is 14. It should be 35 + 14. Broken.", "no": "How many sevens are in the bottom part?"}], "notes": {"do": "Before she types, she must say WHICH piece is wrong and what it should be.", "ask": "\"Which piece was not multiplied? What should it be?\"", "listen": "\"The 2 was not multiplied by 6. It should be 12.\""}}, {"type": "learn", "kick": "Big idea", "title": "You have been breaking apart all along", "text": "Breaking a factor into friendly parts, multiplying each part, then putting them back together is called the <b>distributive</b> property. Your ×6, ×7 and ×9 shortcuts all use it.", "visual": {"kind": "passage", "text": "<b>×6</b> → 6 = 5 + 1 &nbsp;→&nbsp; 5 groups + 1 more group<br><b>×7</b> → 7 = 5 + 2 &nbsp;→&nbsp; 5 groups + 2 more groups<br><b>×9</b> → 9 = 10 − 1 &nbsp;→&nbsp; 10 groups − 1 group"}, "tip": "Your ×8 tool is different: it doubles three times. Keep both kinds of tools.", "notes": {"do": "Point at each line and have her say the tool in her own words.", "say": "\"Your 6s, 7s and 9s shortcuts are the same big idea: break a factor into friendly parts, multiply each part, put them back together.\"", "ask": "\"Which tool breaks 6 apart? Which one breaks 9 apart with a take-away? Is the ×8 tool a break-apart?\"", "listen": "\"6 is 5 + 1.\" \"9 is 10 − 1.\" \"No, ×8 is doubling three times.\""}}, {"type": "learn", "kick": "Learn", "title": "You can break either factor", "text": "The <b>distributive</b> property works on <b>either</b> factor. Pick the one that gives the friendliest parts.", "visual": {"kind": "bigtext", "text": "7 × 6", "sub": "break the 7, or break the 6"}, "steps": [{"text": "Break the 7: (5 × 6) + (2 × 6) = 30 + 12 = <b>42</b>."}, {"text": "Break the 6: (7 × 5) + (7 × 1) = 35 + 7 = <b>42</b>. Same product!"}, {"text": "Bigger numbers too: 7 × 12 = (7 × 10) + (7 × 2) = 70 + 14 = <b>84</b>.", "visual": {"kind": "area", "b": 7, "split": [10, 2], "show": true}}], "tip": "Next week you use this on numbers like 75 × 8. Today's tactic is the key.", "notes": {"do": "Write 7 × 6 both ways on the whiteboard side by side. Then try 7 × 11 together: (7 × 10) + (7 × 1).", "ask": "\"Which way was easier for you? What is 7 × 11?\"", "listen": "Either choice with a reason. \"70 + 7 = 77.\""}}, {"type": "tap", "kick": "Try it", "title": "Sevens on Berk", "items": [{"q": "A week has 7 days. Toothless eats <b>8 fish every day</b>. How many fish does he eat in one week?", "choices": ["15", "54", "56", "48"], "a": 2, "why": "7 × 8. Think 5, 6, 7, 8: <b>56</b> fish. (Or 40 + 16 = 56.)", "no": ["15 is 7 + 8. He eats 8 fish on each of 7 days, so multiply.", "54 is 6 × 9. Break it apart: 40 + 16.", null, "48 is 6 × 8. A week has 7 days, not 6."]}, {"q": "Hiccup trains Toothless for <b>4 weeks</b>. How many days is that?", "choices": ["11", "24", "21", "28"], "a": 3, "why": "4 weeks × 7 days. (5 × 4) + (2 × 4) = 20 + 8 = <b>28</b> days.", "no": ["11 is 4 + 7. Each week has 7 days, so these are equal groups.", "24 is 4 × 6. A week has 7 days.", "21 is only 3 weeks. Add one more week of 7.", null]}], "notes": {"do": "She reads each problem aloud and names the equal groups before tapping.", "ask": "\"Why do weeks make equal groups?\"", "listen": "\"Every week has the same number of days: 7.\""}}, {"type": "talk", "kick": "Say It Out Loud", "title": "Teach it back", "text": "Now you are the teacher. Explain it to Jonathan.", "prompts": ["Teach me 7 × 9 with a break-apart. Name the partial products.", "Snotlout wrote 7 × 6 = 30 + 2. Explain his mistake like a teacher would.", "Tell me about a <b>cunning</b> plan in your book. Was it a good <b>tactic</b>?"], "starters": ["First I decompose 7 into …", "Snotlout forgot to …", "A cunning plan was when …"], "notes": {"do": "She uses the counters or the whiteboard to show her answer.", "listen": "\"45 and 18 are the partial products; 45 + 18 = 63.\" \"He didn't multiply the 2 by 6.\" A real plan from the book with a reason."}}, {"type": "learn", "kick": "Wrap-up", "title": "Break it, then reassemble it", "text": "Today you learned <b>×7 = ×5 + ×2</b>, the 5, 6, 7, 8 trick, and that your 6s, 7s and 9s shortcuts all use the <b>distributive</b> property.", "visual": {"kind": "passage", "text": "<b>Tonight:</b> ▶ After-Class Lesson (ends with Show What You Know) · 📝 Lesson 3 Practice<br><b>Wednesday:</b> 📝 Lesson 4 Practice · 🖨 Lesson 3 Packet · 🖨 Lesson 4 Packet page 1<br>📚 Read 15 minutes each day."}, "tip": "This is the busiest homework of the week. Split it the way the list says.", "notes": {"do": "Go through the task list on the course page and hand her the printed Lesson 3 and Lesson 4 packets.", "say": "\"Tonight: the After-Class Lesson and Lesson 3 Practice. Wednesday: the rest. Thursday we prove it all.\"", "ask": "\"What is 7 × 8? Say the trick.\""}}], "win": "You broke the 7s apart and put them back together. Cunning work!", "prev": "bb-bailey-L03", "prevTitle": "Lesson 3"});</script></body></html>
