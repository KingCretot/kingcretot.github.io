<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 5: Pick the Fastest Path: 6s to 9s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L05", "label": "Lesson 5", "title": "Pick the Fastest Path: 6s to 9s", "goal": "I can pick the fastest shortcut for any 6, 7, 8 or 9 fact and prove my answer.", "date": "2026-10-29", "mastery": 90, "color": "#10AC84", "slides": [{"type": "hello", "title": "Pick the Fastest Path: 6s to 9s", "text": "In two weeks you collected <b>four tools</b> for the hard facts. Today you prove you can pick the <b>right tool</b> for each fact, fast, and explain why it works.", "visual": {"kind": "emoji", "text": "🧰 🐉 🏆"}, "notes": {"do": "Check her Lesson 3 packet and Lesson 4 packet page 1 before you start: praise one thing, fix one thing. Look at her Lesson 4 after-class score.", "say": "\"Two weeks, four tools. Today you prove you can pick the right tool fast and explain why it works.\"", "ask": "\"Name your four tools. Which number does each one go with?\"", "listen": "\"9: ten groups take one away. 6: five groups add one. 8: double three times. 7: five groups plus two groups.\""}}, {"type": "talk", "kick": "Book Talk", "title": "Which plan worked better?", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What happened in the part you read since Tuesday's lesson?", "Think of two different plans or ways characters tried to solve a problem. Which one worked better? Why?", "Hiccup does not have big muscles. What does he have instead that helps him most? Give a reason from the book."], "starters": ["Since Tuesday, …", "The better plan was … because …", "Hiccup's best tool is … For example, …"], "notes": {"do": "5–7 minutes. Today's reading skill matches today's math skill: <b>evaluate</b> which plan is better.", "ask": "\"Think of two different plans characters tried. Which worked better? Why?\" \"What does Hiccup have instead of muscles?\"", "listen": "Two real plans compared with a reason (\"… worked better because …\"). For Hiccup: brains, watching, planning, kindness, with an example."}}, {"type": "recall", "kick": "Remember?", "title": "Doubles and break-aparts", "items": [{"q": "What is <b>7 × 7</b>? Break the 7 into 5 + 2.", "choices": ["42", "45", "56", "49"], "a": 3, "why": "(5 × 7) + (2 × 7) = 35 + 14 = <b>49</b>.", "no": ["42 is 6 × 7. The bottom part is <b>2</b> sevens, so add 14, not 7.", "45 is 5 × 9. Use 35 + 14.", "56 is 8 × 7. That is one seven too many.", null]}, {"q": "Bailey knows 8 groups of 6 is 48. She takes <b>half of the groups</b>. Which fact does she get?", "choices": ["4 × 6 = 24", "4 × 3 = 12", "6 × 6 = 36"], "a": 0, "why": "Half of 8 groups is 4 groups of 6: <b>4 × 6 = 24</b>, which is half of 48.", "no": [null, "Only the number of groups was halved. Each group still has 6.", "Half of 8 groups is 4 groups, not 6. And half of 48 is 24, not 36."]}, {"q": "Which word means <b>to break a number into smaller parts</b>?", "choices": ["reassemble", "decompose", "fragment"], "a": 1, "why": "To <b>decompose</b> 7 is to break it into 5 + 2.", "no": ["Reassemble is the opposite: putting the parts back together.", null, "A fragment is a broken piece, but the action word for breaking a number apart is decompose."]}], "notes": {"do": "She says the tool out loud before each tap.", "ask": "\"Why is 42 wrong for 7 × 7?\"", "listen": "\"42 is 6 × 7. The bottom part is 2 sevens, 14, so 35 + 14 = 49.\""}}, {"type": "vocab", "kick": "Word Power", "title": "Seven words for today", "text": "Jonathan teaches each word. Flip the card, read the meaning, and make your own sentence.", "words": [{"word": "missing factor", "pos": "noun", "meaning": "the factor you have to find when the product is already given", "example": "In 9 × ? = 63, the <b>missing factor</b> is 7.", "emoji": "❓"}, {"word": "operation", "pos": "noun", "meaning": "a math action: add, subtract, multiply, or divide", "example": "Equal groups tell me the <b>operation</b> is multiplication.", "emoji": "➕"}, {"word": "versatile", "pos": "adjective", "meaning": "able to be used in many different ways", "example": "Doubling is a <b>versatile</b> tool: it works for ×2, ×4 and ×8.", "emoji": "🔧"}, {"word": "evaluate", "pos": "verb", "meaning": "to judge how good something is, or which choice is best", "example": "Hiccup had to <b>evaluate</b> each plan before he picked one.", "emoji": "⚖️"}, {"word": "demonstrate", "pos": "verb", "meaning": "to show clearly how something works or why it is true", "example": "I can <b>demonstrate</b> 8 × 6 = 48: 6, 12, 24, 48.", "emoji": "🧑‍🏫"}, {"word": "inventive", "pos": "adjective", "meaning": "good at thinking of new and clever ideas", "example": "An <b>inventive</b> Viking made a fish trap from a stick and a rope.", "emoji": "💡"}, {"word": "victorious", "pos": "adjective", "meaning": "having won a fight, a game, or a contest", "example": "The boys marched home <b>victorious</b> after the dragon test.", "emoji": "🏆"}], "notes": {"do": "Teach one word at a time (about 1 minute each). Add 7 index cards to the pile; it now has 35 words. Shuffle 5 old cards in for a quick review at the end.", "say": "\"A <b>missing factor</b> is the factor you have to find. An <b>operation</b> is a math action: add, subtract, multiply or divide. <b>Versatile</b> means it can do many jobs, like a Swiss army knife. To <b>evaluate</b> is to judge which is best. To <b>demonstrate</b> is to show clearly. <b>Inventive</b> people think of new ideas. <b>Victorious</b> means you won.\"", "ask": "\"Which of your four tools is the most versatile? Why?\" \"Demonstrate 8 × 6 for me.\" \"When were you victorious?\"", "listen": "\"Doubling, because it works for ×2, ×4 and ×8.\" \"6, 12, 24, 48.\" A real personal win."}}, {"type": "tap", "kick": "Word Work", "title": "Use the words", "items": [{"q": "Hiccup's knife can cut rope, carve wood, and open shells. Which word best describes the knife?", "choices": ["victorious", "versatile", "operation", "inventive"], "a": 1, "why": "<b>Versatile</b> means it can be used in many different ways.", "no": ["Victorious describes someone who won. A knife cannot win.", null, "An operation is a math action like add or multiply.", "Inventive describes a <b>person</b> who thinks of new ideas. The knife is a tool that can do many jobs."]}, {"q": "Bailey says 7 × 9 = 63. Which answer best <b>demonstrates</b> that it is true?", "choices": ["\"I am pretty sure.\"", "\"63 is a big number, so it fits.\"", "\"7 tens is 70. Take away one 7: 70 − 7 = 63.\""], "a": 2, "why": "To <b>demonstrate</b> is to show clearly why it is true. The ×9 tool shows it.", "no": ["Being sure is a feeling, not a reason. Show how you know.", "Lots of facts are big numbers. That does not prove 63 is right.", null]}, {"type": "fill", "q": "Hiccup is good at thinking of new and clever ideas. Which word describes him? Type it.", "answers": ["inventive"], "why": "<b>Inventive</b> means good at thinking of new and clever ideas.", "no": "It starts with <b>in</b>.", "hint": "in-ven-tive"}], "notes": {"do": "She answers out loud first and explains each wrong choice.", "ask": "\"Why is the knife versatile but not inventive?\"", "listen": "\"A knife can do many jobs, but only a person can think of new ideas.\""}}, {"type": "learn", "kick": "Learn", "title": "Your toolbox", "text": "Look at the factors first. Find the hard one (6, 7, 8 or 9). Then pick its tool.", "visual": {"kind": "passage", "text": "🔟 <b>×9</b>: ×10, then take away one group. &nbsp;9 × 4 → 40 − 4 = 36<br>🖐️ <b>×6</b>: ×5, then add one group. &nbsp;6 × 3 → 15 + 3 = 18<br>✌️ <b>×8</b>: double, double, double. &nbsp;8 × 5 → 10, 20, 40<br>🧩 <b>×7</b>: ×5 plus ×2. &nbsp;7 × 3 → 15 + 6 = 21"}, "tip": "If a fact has <b>two</b> hard factors, like 7 × 9, pick the tool with the <b>fewest steps</b>. A 9 is usually fastest: just one subtraction.", "notes": {"do": "Hands-on: spread 16 index cards, one 6–9 fact on each. She sorts them into 4 piles by tool, then answers each card out loud.", "say": "\"Look at the factors first. Find the hard one. Then pick its tool.\"", "ask": "For 7 × 9 and 6 × 8: \"Both factors are hard. Which tool is shorter? Why?\"", "listen": "\"7 × 9: use the 9, 70 − 7, one step.\" \"6 × 8: three doubles of 6, or 40 + 8.\" Either is fine with a reason."}}, {"type": "tap", "kick": "Quick-fire", "title": "Tool, then answer", "text": "Say the tool out loud. Then type the product.", "items": [{"type": "fill", "q": "9 × 6 = ____", "answers": ["54"], "why": "×10 take away one group: 60 − 6 = 54. 9 × 6 = 54.", "no": "Say the tool first. Then use it."}, {"type": "fill", "q": "7 × 7 = ____", "answers": ["49"], "why": "Break it apart: 35 + 14 = 49. 7 × 7 = 49.", "no": "Say the tool first. Then use it."}, {"type": "fill", "q": "8 × 4 = ____", "answers": ["32"], "why": "Three doubles of 4: 8, 16, 32. 8 × 4 = 32.", "no": "Say the tool first. Then use it."}, {"type": "fill", "q": "6 × 6 = ____", "answers": ["36"], "why": "×5 plus one group: 30 + 6 = 36. 6 × 6 = 36.", "no": "Say the tool first. Then use it."}], "notes": {"do": "Time it on your phone for fun: can she do all four in under a minute while naming each tool?", "ask": "\"Which one took you the longest? Which tool would make it faster?\"", "listen": "Tool names before answers. If she goes silent and starts counting, say \"Which tool?\""}}, {"type": "tap", "kick": "Evaluate", "title": "Pick the fastest path", "text": "All of these facts have more than one road. Evaluate each path and pick the best one.", "items": [{"q": "Which is the best path for <b>8 × 6</b>?", "choices": ["6 + 6 + 6 + 6 + 6 + 6 + 6 + 6", "6 → 12 → 24 → 48", "60 − 6 = 54"], "a": 1, "why": "Three doubles: 6 → 12 → 24 → <b>48</b>. Three steps, and you can check each one.", "no": ["That adds to 48, but it takes seven steps. That is where counting goes wrong.", null, "60 − 6 is the ×9 tool. It finds 9 × 6, not 8 × 6."]}, {"q": "<b>7 × 9</b> has a 7 <b>and</b> a 9. Which path is fastest?", "choices": ["(5 × 9) + (2 × 9) = 45 + 18", "7, 14, 21, 28, 35, 42, 49, 56, 63", "70 − 7 = 63"], "a": 2, "why": "Use the 9: seven tens is 70, take away one 7. One step: <b>63</b>.", "no": ["This works too and gives 63! But it needs two facts and a harder add. 70 − 7 is one step.", "Skip counting nine times works, but it is the slowest road and easy to lose your place.", null]}, {"q": "Which is the best path for <b>6 × 7</b>?", "choices": ["35 + 7 = 42", "36 + 7 = 43", "6 + 7 = 13"], "a": 0, "why": "Use the 6: five 7s is 35, plus one more 7 is <b>42</b>.", "no": [null, "36 is 6 × 6, not 5 × 7. Start with five 7s: 35.", "6 + 7 adds the factors. You need 6 groups of 7."]}], "notes": {"do": "Before she taps, she evaluates each path out loud: Does it work? How many steps?", "ask": "\"Path A for 7 × 9 also gives 63. So why isn't it the best?\"", "listen": "\"It works, but it needs two facts and a hard add. 70 − 7 is one step.\""}}, {"type": "learn", "kick": "Preview", "title": "Fact families", "text": "Three numbers can make <b>four facts</b>. That group is called a <b>fact family</b>. Division undoes multiplication.", "visual": {"kind": "triangle", "a": 7, "b": 8, "c": 56}, "steps": [{"text": "<b>7 × 8 = 56</b>"}, {"text": "<b>8 × 7 = 56</b> (the commutative property: switch the factors)"}, {"text": "<b>56 ÷ 8 = 7</b> (56 shared into 8 equal groups gives 7 in each)"}, {"text": "<b>56 ÷ 7 = 8</b> (56 shared into 7 equal groups gives 8 in each)"}], "tip": "Every multiplication fact you know is also a division fact you know. In two weeks you will use this a lot.", "notes": {"do": "Build 7 rows of 8 counters. Turn the array to show 8 × 7. Then share 56 counters into 8 equal rows to show 56 ÷ 8 = 7. Keep it a preview: division is Week 4.", "say": "\"Three numbers, four facts. Division undoes multiplication.\"", "ask": "\"If 7 × 8 = 56, what is 56 ÷ 7?\"", "listen": "\"8.\" Point at the triangle: the top number is the product."}}, {"type": "tap", "kick": "Try it", "title": "Families and missing numbers", "items": [{"q": "Which fact belongs to the <b>6, 9, 54</b> fact family?", "choices": ["54 ÷ 6 = 8", "9 + 6 = 15", "54 ÷ 9 = 6", "54 − 9 = 45"], "a": 2, "why": "54 ÷ 9 = 6 uses the same three numbers, and 9 × 6 = 54 proves it.", "no": ["54 ÷ 6 is 9, not 8. Check: 6 × 9 = 54.", "Fact families here are multiplication and division, not addition.", null, "That is true math, but subtraction is not part of this fact family, and 45 is not one of the three numbers."]}, {"q": "<b>7 × ? = 42</b>. What is the missing factor?", "choices": ["5", "6", "7", "8"], "a": 1, "why": "7 × 6 = 30 + 12 = 42. So the missing factor is <b>6</b>. (And 42 ÷ 7 = 6.)", "no": ["7 × 5 = 35. You need one more 7.", null, "7 × 7 = 49. That is too many.", "7 × 8 = 56. That is too many."]}, {"q": "Bailey knows 8 × 9 = 72. What does the <b>commutative</b> property give her for free?", "choices": ["72 ÷ 8 = 9", "9 × 8 = 72", "8 + 9 = 17"], "a": 1, "why": "Commutative means switch the order of the factors: <b>9 × 8 = 72</b>.", "no": ["That is in the same fact family, but it is division. Commutative means switching the factors.", null, "That adds. The commutative property here switches the factors in a multiplication."]}], "notes": {"do": "She uses the triangle on the slide to check each answer.", "ask": "\"Why isn't 54 − 9 = 45 in the family?\"", "listen": "\"45 isn't one of the three numbers, and the family is × and ÷.\""}}, {"type": "order", "kick": "Put it in order", "title": "Solve like a pro", "text": "Stoick sends <b>6 ships</b>. Each ship carries <b>9 sheep</b>. How many sheep? Tap the steps in order.", "steps": ["Read it and find the equal groups: 6 ships, 9 sheep each", "Write the fact: 6 × 9", "Pick the tool: it has a 9, so ×10 and take away one group", "Solve: 60 − 6 = 54", "Check with another tool, then label: 45 + 9 = 54 ✔, so 54 sheep"], "why": "Read, write the fact, pick the tool, solve, check, label. Two tools gave the same answer, so you know it is right.", "hint": "What do you do before you can write a fact? You have to read and find the groups.", "notes": {"do": "She taps each step and says it out loud.", "ask": "\"Why check with a second tool?\"", "listen": "\"If two tools give the same answer, I know it's right.\""}}, {"type": "tap", "kick": "Try it", "title": "Problems from Berk", "items": [{"q": "Fishlegs collects <b>6 dragon scales</b> a day for <b>7 days</b>. How many scales?", "choices": ["13", "48", "42", "36"], "a": 2, "why": "6 groups of 7: 35 + 7 = <b>42</b>. (Or 7 groups of 6: 30 + 12 = 42.)", "no": ["13 is 6 + 7. He collects 6 each day, so these are equal groups.", "48 is 6 × 8. There are 7 days.", null, "36 is 6 × 6. Count the days again: 7."]}, {"q": "Toothless ate <b>8 crabs</b>. A gargantuan sea dragon ate <b>7 times as many</b>. How many crabs did the sea dragon eat?", "choices": ["15", "56", "64", "49"], "a": 1, "why": "7 times as many as 8 is 7 × 8 = <b>56</b>.", "no": ["15 is 8 + 7. \"Times as many\" means multiply.", null, "64 is 8 × 8. The dragon ate 7 times as many.", "49 is 7 × 7. Toothless ate 8 crabs, not 7."]}, {"q": "Hiccup has <b>9 fish</b>. Fishlegs has <b>8 fish</b>. How many fish do they have in all?", "choices": ["72", "1", "81", "17"], "a": 3, "why": "These are not equal groups. It is two amounts put together, so add: 9 + 8 = <b>17</b>.", "no": ["72 is 9 × 8. Nobody has 9 groups of 8. Read again: two boys, two amounts.", "1 is 9 − 8. That tells how many more Hiccup has, not how many in all.", "81 is 9 × 9. There are no equal groups here.", null]}], "notes": {"do": "She reads each problem aloud and says \"equal groups or not?\" before she taps.", "ask": "On the 9 + 8 fish problem: \"Are there equal groups?\"", "listen": "\"No, it's two different amounts put together, so add.\""}}, {"type": "tap", "kick": "Choose the operation", "title": "Add or multiply?", "text": "Ask: equal groups or not? Then type the <b>operation</b>.", "items": [{"type": "fill", "q": "Gobber has 6 racks with 9 helmets on each rack. Which operation finds how many helmets? Type <b>add</b>, <b>subtract</b>, <b>multiply</b> or <b>divide</b>.", "answers": ["multiply", "multiplication", "times"], "why": "6 racks with 9 on EACH rack are equal groups, so multiply: 6 × 9 = 54.", "no": "Each rack has the same number. Equal groups or not?"}, {"type": "fill", "q": "Toothless caught 7 fish in the morning and 8 fish at night. Which operation finds how many fish in all? Type <b>add</b>, <b>subtract</b>, <b>multiply</b> or <b>divide</b>.", "answers": ["add", "addition", "plus"], "why": "Two different amounts put together. Not equal groups, so add: 7 + 8 = 15.", "no": "Is it equal groups, or two amounts put together?"}, {"type": "fill", "q": "A gargantuan dragon ate 9 times as many crabs as Toothless. Toothless ate 6. Which operation finds the gargantuan dragon's crabs? Type <b>add</b>, <b>subtract</b>, <b>multiply</b> or <b>divide</b>.", "answers": ["multiply", "multiplication", "times"], "why": "\"9 times as many\" means multiply: 9 × 6 = 54.", "no": "What does \"times as many\" tell you?"}], "notes": {"do": "She says \"equal groups or not?\" out loud for every story, then types the operation, then solves it on the whiteboard.", "ask": "\"What words in the story told you?\"", "listen": "\"each\" or \"times as many\" for multiply; \"and\" or \"in all\" with two different amounts for add."}}, {"type": "talk", "kick": "Evaluate It", "title": "Defend your tool", "text": "Jonathan picks a fact. You pick a tool and defend it.", "prompts": ["For <b>8 × 7</b>, which tool would you use? <b>Evaluate</b> two paths and pick one.", "<b>Demonstrate</b> that 6 × 9 = 54 in two different ways.", "Which of your four tools is the most <b>versatile</b>? Justify your answer."], "starters": ["I would use … because …", "One way is … Another way is …", "The most versatile tool is … because …"], "notes": {"do": "Use three index cards from the sort pile. She holds up the card and argues for her tool.", "say": "\"There can be more than one good path. I want your reason.\"", "listen": "Any correct path with a reason about the number of steps. \"60 − 6\" and \"45 + 9\" for 6 × 9."}}, {"type": "learn", "kick": "Wrap-up", "title": "Victorious over the hard facts", "text": "In two weeks you collected four tools, learned to pick the fastest one, and met fact families.", "visual": {"kind": "passage", "text": "▶ <b>After-Class Lesson</b> tonight (ends with Show What You Know)<br>📝 <b>Practice</b> on Friday<br>🖨 <b>Packet</b> this weekend, plus Lesson 4 Packet page 2<br>🧭 Times Table Trail Lessons 5 and 8<br>📚 Read 15 minutes every day"}, "tip": "Monday's lesson is on Zoom. Next week: the area model.", "notes": {"do": "Go through the task list on the course page and show the two Times Table Trail links. Hand her the printed Lesson 5 packet.", "say": "\"Celebrate! Two weeks ago 9 × 7 was 'I can't.' Now you have four tools.\"", "ask": "\"Which tool do you trust the most now?\""}}], "win": "Victorious! You picked the fastest path every time.", "prev": "bb-bailey-L04", "prevTitle": "Lesson 4"});</script></body></html>
