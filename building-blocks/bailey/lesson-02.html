<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 2: Prove It: Every ×9 and ×6 Fact</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L02", "label": "Lesson 2", "title": "Prove It: Every ×9 and ×6 Fact", "goal": "I can solve any ×9 or ×6 fact, find a missing factor, and fix a wrong fact.", "date": "2026-10-22", "mastery": 90, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Prove It on Your Own: ×9 and ×6", "text": "In class you proved you own the ×9 and ×6 facts. Now do it on your own. You will <b>type</b> most answers. Finish with Show What You Know.", "visual": {"kind": "emoji", "text": "🛡️ 9️⃣ 6️⃣ ⌨️"}}, {"type": "learn", "kick": "Quick reminder", "title": "Your four tools", "text": "Read these once. Then you are ready.", "visual": {"kind": "passage", "text": "🔟 <b>×9</b>: ×10, take away one group. 9 × 6 → 60 − 6 = 54<br>🖐️ <b>×6</b>: ×5, add one group. 6 × 7 → 35 + 7 = 42<br>🔄 <b>Flip it</b>: 8 × 6 = 6 × 8 (commutative)<br>❓ <b>Missing factor</b>: say \"9 times <i>what</i> is 63?\" Then verify."}, "tip": "A 6s answer is always even. In a 9s answer (9 × 2 up to 9 × 10), the tens digit is one less than the other factor."}, {"type": "vocab", "kick": "Word Power", "title": "Your 7 words", "text": "Flip each card one more time. Next you will <b>type</b> these words from memory.", "words": [{"word": "multiple", "pos": "noun", "emoji": "🔁", "meaning": "The product of a number and 1, 2, 3, and so on.", "example": "18, 27 and 36 are multiples of 9."}, {"word": "equation", "pos": "noun", "emoji": "⚖️", "meaning": "A number sentence with an equal sign. Both sides are worth the same.", "example": "9 × 7 = 63 is an equation."}, {"word": "commutative", "pos": "adjective", "emoji": "🔄", "meaning": "You can switch the order of the factors and get the same answer.", "example": "6 × 9 = 9 × 6, so multiplication is commutative."}, {"word": "justify", "pos": "verb", "emoji": "🧑‍⚖️", "meaning": "To give reasons that prove you are right.", "example": "Justify your answer with a fact or a picture."}, {"word": "flawed", "pos": "adjective", "emoji": "💔", "meaning": "Having a mistake or a weak spot.", "example": "The fact 9 × 6 = 56 is flawed."}, {"word": "reluctant", "pos": "adjective", "emoji": "😬", "meaning": "Not wanting to do something.", "example": "Toothless was reluctant to do what Hiccup told him."}, {"word": "persevere", "pos": "verb", "emoji": "🧗", "meaning": "To keep trying even when it is hard.", "example": "Hiccup kept trying to train Toothless. He persevered."}]}, {"type": "tap", "kick": "Word Power", "title": "Type the word", "text": "Type the word that fits. Spell it carefully.", "items": [{"type": "fill", "q": "Fishlegs got stuck on a hard puzzle. He kept trying and did not quit. He chose to ____.", "answers": ["persevere"], "why": "To <b>persevere</b> is to keep trying even when it is hard.", "no": "Which word means to keep trying when it is hard? Look back at the word cards.", "hint": "per-se-vere"}, {"type": "fill", "q": "27, 36 and 45 are all ____ of 9.", "answers": ["multiples", "multiple"], "why": "Answers on the 9s list are <b>multiples</b> of 9.", "no": "Which word names the answers on a times list?", "hint": "It starts with <b>m</b>."}, {"type": "fill", "q": "You can switch the factors and get the same product. Which word describes that?", "answers": ["commutative"], "why": "<b>Commutative</b>: 8 × 6 = 6 × 8.", "no": "It means you can switch the order.", "hint": "com-mu-ta-tive"}, {"type": "fill", "q": "Fishlegs wrote 9 × 5 = 54. His fact has a mistake. It is ____.", "answers": ["flawed"], "why": "A fact with a mistake is <b>flawed</b>. 9 × 5 = 45.", "no": "Which word means having a mistake?", "hint": "It starts with <b>f</b>."}]}, {"type": "tap", "kick": "Facts", "title": "Type the product", "text": "Use a shortcut, not adding over and over.", "items": [{"type": "fill", "q": "6 × 8 = ____", "answers": ["48"], "why": "5 × 8 = 40, plus one more 8: 40 + 8 = 48.", "no": "Use ×5 plus one group: 40 + one more 8."}, {"type": "fill", "q": "9 × 7 = ____", "answers": ["63"], "why": "10 × 7 = 70, take away one 7: 70 − 7 = 63.", "no": "Use ×10, then take away one group of 7."}, {"type": "fill", "q": "7 × 6 = ____", "answers": ["42"], "why": "Flip it to 6 × 7: 35 + 7 = 42.", "no": "Flip it to 6 × 7. Then use ×5 plus one group."}, {"type": "fill", "q": "What is the turn-around fact for <b>8 × 9</b>? Type it.", "answers": ["9 × 8", "9 × 8 = 72", "72 = 9 × 8", "9 times 8", "9 times 8 = 72"], "why": "Switch the factors: 9 × 8. Both equal 72.", "no": "Switch the two factors. Keep the × sign.", "placeholder": "like 3 × 4"}]}, {"type": "tap", "kick": "Missing factors", "title": "9 times what?", "text": "Say it as a question. Type the missing factor. Then verify.", "items": [{"type": "fill", "q": "9 × ____ = 45", "answers": ["5"], "why": "9 × 5 = 50 − 5 = 45.", "no": "9 times what is 45? The tens digit 4 is one less than the factor."}, {"type": "fill", "q": "____ × 6 = 36", "answers": ["6"], "why": "6 × 6 = 30 + 6 = 36.", "no": "What times 6 is 36? Try ×5 plus one group."}, {"type": "fill", "q": "6 × ____ = 9 × 2", "answers": ["3"], "why": "9 × 2 = 18, and 6 × 3 = 18. Both sides are 18.", "no": "First find 9 × 2. Then: 6 times what is that?"}]}, {"type": "sort", "kick": "Sort it", "title": "True or flawed?", "text": "Tap a fact, then tap the right box. Use a pattern or a shortcut.", "buckets": ["✅ True", "💔 Flawed"], "items": [{"text": "9 × 6 = 54", "b": 0, "why": "60 − 6 = 54. True!", "hint": "Use ×10 take away one group: 60 − 6."}, {"text": "6 × 4 = 26", "b": 1, "why": "20 + 4 = 24, not 26.", "hint": "Use ×5 plus one group: 20 + 4."}, {"text": "9 × 5 = 45", "b": 0, "why": "50 − 5 = 45. True!", "hint": "Use ×10 take away one group: 50 − 5."}, {"text": "8 × 6 = 46", "b": 1, "why": "Flip it to 6 × 8: 40 + 8 = 48, not 46.", "hint": "Flip it to 6 × 8."}, {"text": "9 × 3 = 27", "b": 0, "why": "30 − 3 = 27, and 2 + 7 = 9. True!", "hint": "Use ×10 take away one group: 30 − 3."}, {"text": "6 × 9 = 63", "b": 1, "why": "63 is 9 × 7. 6 × 9 = 60 − 6 = 54. Also, 63 is odd, and 6s answers are even.", "hint": "Is a 6s answer ever odd?"}], "done": "Patterns and shortcuts catch every flawed fact."}, {"type": "tap", "kick": "Fix it", "title": "Catch the mistake", "items": [{"type": "fill", "q": "Hiccup wrote 9 × 7 = 56. What is the correct product?", "answers": ["63"], "why": "70 − 7 = 63. Also, 5 + 6 = 11, not 9, so 56 can't be a 9s answer. (56 is 7 × 8.)", "no": "Use ×10, then take away one group of 7."}, {"q": "Snotlout wrote 9 × 8 = 81. Which check proves it is flawed?", "choices": ["8 + 1 = 9, so it is right.", "81 is odd.", "The tens digit should be 7, one less than 8. 9 × 8 = 72.", "9s answers always end in 1."], "a": 2, "why": "For 9 × 2 up to 9 × 10, the tens digit is one less than the other factor. 9 × 8 = 80 − 8 = 72.", "no": ["The digit sum passes, but 81 is 9 × 9. Use the tens-digit check too.", "Some 9s answers are odd (27, 63, 81). Odd doesn't prove it wrong.", null, "9 × 2 = 18 ends in 8. That rule is false."]}]}, {"type": "talk", "kick": "Say it out loud", "title": "Teach someone at home", "text": "Find someone at home. Teach them for two minutes.", "prompts": ["Show them how to find <b>9 × ? = 63</b>. Then verify it.", "Justify that 6 × 6 = 36. Use the word <b>because</b>.", "Tell them one time Hiccup was <b>reluctant</b>, or one time he <b>persevered</b>."], "starters": ["9 times what is 63? …", "6 × 6 = 36 because …", "Hiccup was reluctant when …"]}, {"type": "tap", "kick": "Word problems", "title": "Problems from Berk", "text": "Find the equal groups. Watch for a second step!", "items": [{"type": "fill", "q": "Stoick has 6 crates with 9 shields in each crate. 7 shields are cracked. How many shields are <b>not</b> cracked?", "answers": ["47"], "why": "6 × 9 = 54 shields. Then 54 − 7 = 47.", "no": "First find all the shields (6 × 9). Then take away the cracked ones.", "hint": "6 × 9 = 54. Now take away 7."}, {"type": "fill", "q": "Fishlegs has 54 fish. He puts 9 fish in each basket. How many baskets does he fill?", "answers": ["6"], "why": "9 × ? = 54. 9 × 6 = 60 − 6 = 54, so 6 baskets.", "no": "9 times what is 54?"}, {"q": "Hiccup reads 6 pages a day for 9 days. Which equation tells how many pages he reads?", "choices": ["6 + 9 = 15", "9 × 6 = 54", "60 − 9 = 51", "9 × 9 = 81"], "a": 1, "why": "9 days with 6 pages each is 9 equal groups of 6: 9 × 6 = 54.", "no": ["He reads 6 pages EACH day. That is equal groups, so multiply.", null, "For ×9 take away one group of 6, not 9: 60 − 6.", "He reads 6 pages a day, not 9."]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "9 × ____ = 72", "answers": ["8"], "why": "The tens digit 7 is one less than 8. Verify: 80 − 8 = 72.", "no": "9 times what is 72?"}, {"type": "fill", "q": "Hiccup draws 6 dragons on each page. He fills 7 pages. How many dragons does he draw?", "answers": ["42"], "why": "7 pages of 6 is 7 × 6. Flip it: 6 × 7 = 35 + 7 = 42.", "no": "Each page has 6. There are 7 pages. Multiply."}, {"q": "Which equation is <b>true</b>?", "choices": ["6 × 8 = 6 + 8", "9 − 6 = 6 − 9", "6 × 8 = 8 × 6", "6 × 9 = 5 × 9 + 6"], "a": 2, "why": "Multiplication is commutative, so 6 × 8 = 8 × 6. Both are 48.", "no": ["6 × 8 = 48, but 6 + 8 = 14.", "Subtraction is not commutative. 9 − 6 = 3.", null, "5 × 9 + 6 = 51. The extra group is 9, not 6."]}, {"type": "fill", "q": "Stoick buys 7 bags with 9 arrows in each bag. 5 arrows break. How many arrows are left?", "answers": ["58"], "why": "7 × 9 = 70 − 7 = 63 arrows. Then 63 − 5 = 58.", "no": "First find all the arrows. Then take away the broken ones."}, {"type": "fill", "q": "____ × 6 = 54", "answers": ["9"], "why": "9 × 6 = 60 − 6 = 54.", "no": "What times 6 is 54?"}, {"q": "Hiccup wrote 9 × 4 = 45. How do you know it is <b>flawed</b>?", "choices": ["4 + 5 = 9, so it is correct.", "The tens digit should be 3, so 9 × 4 = 36.", "9s facts always end in 9.", "45 is too small."], "a": 1, "why": "The tens digit is one less than the other factor. One less than 4 is 3: 9 × 4 = 36.", "no": ["The digits add to 9, but the tens digit is wrong. Use both checks.", null, "9 × 2 = 18 ends in 8, so that rule is false.", "45 is too big, not too small."]}, {"type": "fill", "q": "6 × 9 = 9 × 6. You can switch the factors. So multiplication is ____.", "answers": ["commutative"], "why": "<b>Commutative</b>: switch the factors, same product.", "no": "Which word means you can switch the order?"}, {"q": "Which number is a <b>multiple</b> of 9?", "choices": ["48", "56", "63", "42"], "a": 2, "why": "63 = 9 × 7. Verify: 6 + 3 = 9.", "no": ["48 is 6 × 8. 4 + 8 = 12, not 9.", "56 is 7 × 8. 5 + 6 = 11.", null, "42 is 6 × 7. 4 + 2 = 6."]}, {"type": "fill", "q": "Which word means <i>not wanting to do something</i>?", "answers": ["reluctant"], "why": "<b>Reluctant</b> means not wanting to do something.", "no": "It starts with <b>r</b>."}, {"q": "You say 6 × 7 = 42. Which is the best way to <b>justify</b> it?", "choices": ["Because I said so.", "6 + 7 = 13.", "It looks right.", "5 × 7 = 35, and 35 + 7 = 42."], "a": 3, "why": "To justify is to give a reason that proves it. The ×6 shortcut proves 42.", "no": ["That is not a reason.", "That adds the factors. It doesn't prove 42.", "Looking right is not proof.", null]}], [{"type": "fill", "q": "9 × ____ = 36", "answers": ["4"], "why": "9 × 4 = 40 − 4 = 36.", "no": "9 times what is 36?"}, {"type": "fill", "q": "Gobber hangs 9 helmets on each of 6 racks. How many helmets?", "answers": ["54"], "why": "6 racks of 9 is 6 × 9 = 60 − 6 = 54.", "no": "6 equal groups of 9. Use a shortcut."}, {"q": "Which equation shows the <b>commutative</b> property?", "choices": ["7 × 9 = 7 + 9", "7 × 9 = 9 × 7", "9 − 7 = 7 − 9", "7 × 9 = 70 − 9"], "a": 1, "why": "The factors switched places and the product stayed 63.", "no": ["7 × 9 = 63, but 7 + 9 = 16. That is false.", null, "Subtraction can't switch: 9 − 7 = 2, 7 − 9 is not 2.", "70 − 9 = 61, not 63. And it doesn't switch the factors."]}, {"type": "fill", "q": "Toothless catches 6 fish a day for 8 days. He gives 9 fish to Hiccup. How many fish does he keep?", "answers": ["39"], "why": "8 × 6 = 48 fish. Then 48 − 9 = 39.", "no": "First find all the fish (8 days of 6). Then take away 9."}, {"type": "fill", "q": "6 × ____ = 42", "answers": ["7"], "why": "6 × 7 = 35 + 7 = 42.", "no": "6 times what is 42?"}, {"q": "Fishlegs wrote 6 × 8 = 42. Why is it flawed?", "choices": ["It is not flawed: 4 + 2 = 6.", "6s answers are always odd.", "It should be 6 + 8 = 14.", "42 is 6 × 7. 6 × 8 = 40 + 8 = 48."], "a": 3, "why": "6 × 8 = 40 + 8 = 48. 42 is one group short.", "no": ["The digit check is for 9s, not 6s. 6 × 8 = 48.", "6s answers are always even.", "6 × 8 means 6 groups of 8. Don't add.", null]}, {"type": "fill", "q": "Which word means <i>to keep trying even when it is hard</i>? Type it.", "answers": ["persevere", "persevering"], "why": "To <b>persevere</b> is to keep trying even when it is hard.", "no": "It starts with <b>p</b>."}, {"q": "Which number is a multiple of 6 but <b>not</b> a multiple of 9?", "choices": ["18", "27", "54", "30"], "a": 3, "why": "30 = 6 × 5, and 3 + 0 = 3, so it is not on the 9s list.", "no": ["18 is on both lists: 6 × 3 and 9 × 2.", "27 is odd, so it is not a multiple of 6.", "54 is on both lists: 6 × 9 and 9 × 6.", null]}, {"type": "fill", "q": "A number sentence with an equal sign, like 6 × 4 = 24, is called an ____.", "answers": ["equation"], "why": "An <b>equation</b> has an equal sign. Both sides are worth the same.", "no": "It starts with <b>e</b>."}, {"q": "A young Viking is <b>reluctant</b> to go into the dragon arena. Which sentence shows that?", "choices": ["He runs to the arena before anyone else.", "He drags his feet and looks for reasons not to go.", "He wins the fight in one minute.", "He sings a loud victory song."], "a": 1, "why": "Reluctant means not wanting to do something. Dragging his feet shows he doesn't want to go.", "no": ["Running there first is eager, the opposite of reluctant.", null, "Winning fast is about skill, not about wanting to go.", "Singing is happy. It doesn't show he doesn't want to go."]}], [{"type": "fill", "q": "____ × 9 = 27", "answers": ["3"], "why": "3 × 9 = 27. Verify: 30 − 3 = 27.", "no": "What times 9 is 27?"}, {"type": "fill", "q": "Stoick sets 9 tables with 9 plates on each table. How many plates?", "answers": ["81"], "why": "9 × 9 = 90 − 9 = 81.", "no": "9 groups of 9. Take one group of 9 away from 90."}, {"q": "Bailey knows 6 × 7 = 42. Which fact does the commutative property give her for free?", "choices": ["6 × 6 = 36", "42 − 6 = 36", "7 × 6 = 42", "6 + 7 = 13"], "a": 2, "why": "Switch the factors: 7 × 6 = 42.", "no": ["That changes a factor. Commutative only switches the order.", "That subtracts. Switch the factors instead.", null, "That adds. Switch the factors in the multiplication."]}, {"type": "fill", "q": "Hiccup has 4 bags with 9 apples in each bag. He finds 7 more apples. How many apples does he have now?", "answers": ["43"], "why": "4 × 9 = 40 − 4 = 36. Then 36 + 7 = 43.", "no": "First find the apples in the bags. Then add the 7 he found."}, {"type": "fill", "q": "____ × 6 = 48", "answers": ["8"], "why": "8 × 6 = 6 × 8 = 40 + 8 = 48.", "no": "What times 6 is 48?"}, {"q": "Snotlout says 9 × 7 = 72 because 7 + 2 = 9. What is wrong?", "choices": ["Nothing. The digits add to 9.", "The tens digit should be 6, one less than 7. 9 × 7 = 63.", "He should add: 9 + 7 = 16.", "9 × 7 must end in 9."], "a": 1, "why": "The tens digit is one less than 7, so it is 6: 9 × 7 = 70 − 7 = 63. 72 is 9 × 8.", "no": ["The digit sum passes, but the tens digit is wrong. Use both checks.", null, "9 × 7 is 7 groups of 9. Multiply, don't add.", "9 × 7 = 63 ends in 3."]}, {"type": "fill", "q": "Which word means <i>having a mistake or a weak spot</i>?", "answers": ["flawed"], "why": "<b>Flawed</b> means having a mistake or a weak spot.", "no": "It starts with <b>f</b>."}, {"q": "Which list shows <b>only</b> multiples of 6?", "choices": ["12, 21, 30", "16, 26, 36", "6, 15, 24", "12, 24, 36"], "a": 3, "why": "6 × 2 = 12, 6 × 4 = 24, 6 × 6 = 36.", "no": ["21 is odd, so it is not a multiple of 6.", "16 and 26 are not on the 6s list.", "15 is odd, so it is not a multiple of 6.", null]}, {"type": "fill", "q": "Jonathan asks, \"How do you know?\" He wants you to ____ your answer.", "answers": ["justify"], "why": "To <b>justify</b> is to give reasons that prove you are right.", "no": "It starts with <b>j</b>."}, {"q": "Hiccup keeps trying to train Toothless, even when Toothless will not listen. Which word fits Hiccup?", "choices": ["He is reluctant.", "He perseveres.", "He is flawed.", "He is commutative."], "a": 1, "why": "He keeps trying even when it is hard. That is <b>persevering</b>.", "no": ["Reluctant means not wanting to try. Hiccup keeps trying!", null, "Flawed describes a mistake, not a person who keeps trying.", "Commutative describes switching factors, not a person."]}]]}], "win": "You persevered and proved it. Every ×9 and ×6 fact is yours!", "prev": "bb-bailey-L01", "prevTitle": "Lesson 1"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
