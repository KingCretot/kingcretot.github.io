<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 2: Prove It: Every ×9 and ×6 Fact</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L02", "label": "Lesson 2", "title": "Prove It: Every ×9 and ×6 Fact", "goal": "I can solve any ×9 or ×6 fact, find a missing factor, and fix a wrong fact.", "date": "2026-10-22", "mastery": 90, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Prove It: Every ×9 and ×6 Fact", "text": "On Tuesday you learned two shortcuts. Today you <b>prove</b> you own them: flip facts around, find missing numbers, and catch mistakes like a dragon detective. 🐉🔍", "visual": {"kind": "emoji", "text": "🛡️ 9️⃣ 6️⃣ 🏆"}}, {"type": "talk", "kick": "Book Talk", "title": "Talk about your book", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What happened in the part you read since Tuesday?", "How has Hiccup changed since the start of the book? Give one example.", "Use Tuesday's words: what is one <b>ingenious</b> thing Hiccup did, or one <b>strategy</b> he used?"], "starters": ["Since Tuesday, …", "At first Hiccup …, but now he …", "One ingenious thing Hiccup did was …"]}, {"type": "recall", "kick": "Remember", "title": "Tuesday's shortcuts", "text": "Quick review. Show me you remember!", "items": [{"q": "Which one is the ×9 shortcut for 9 × 9?", "choices": ["81 − 9", "90 − 1", "90 − 9", "100 − 9"], "a": 2, "why": "10 × 9 = 90, then take away one group of 9: 90 − 9 = 81.", "no": ["81 is already the answer. Start with 10 × 9 = 90.", "Take away a whole group of 9, not 1.", null, "100 is 10 × 10. Start with 10 × 9."]}, {"q": "Use ×5 plus one group. What is 6 × 9?", "choices": ["45 + 6 = 51", "45 + 9 = 54", "50 + 9 = 59", "54 − 9 = 45"], "a": 1, "why": "5 × 9 = 45, plus one more group of 9: 45 + 9 = 54.", "no": ["The extra group has 9 in it, not 6.", null, "5 × 9 is 45, not 50.", "That takes a group away. For ×6 you add one."]}, {"q": "Adding 6 + 6 + 6 + 6 + 6 + 6 + 6 + 6 + 6 instead of doing 60 − 6 is…", "choices": ["efficient", "tedious", "ingenious", "a factor"], "a": 1, "why": "Nine 6s added one at a time is long, slow and boring: <b>tedious</b>. 60 − 6 is the efficient way.", "no": ["Efficient means fast with no wasted steps. Adding nine times is the opposite.", null, "Ingenious means very clever. The shortcut is the clever way.", "A factor is a number you multiply."]}]}, {"type": "vocab", "kick": "Word Power", "title": "7 new words", "text": "Tap each card to flip it. Read it, then use the word in your own sentence out loud.", "words": [{"word": "multiple", "pos": "noun", "emoji": "🔁", "meaning": "The product of a number and 1, 2, 3, and so on.", "example": "18, 27 and 36 are multiples of 9."}, {"word": "equation", "pos": "noun", "emoji": "⚖️", "meaning": "A number sentence with an equal sign. Both sides are worth the same.", "example": "9 × 7 = 63 is an equation."}, {"word": "commutative", "pos": "adjective", "emoji": "🔄", "meaning": "You can switch the order of the factors and get the same answer.", "example": "6 × 9 = 9 × 6, so multiplication is commutative."}, {"word": "justify", "pos": "verb", "emoji": "🧑‍⚖️", "meaning": "To give reasons that prove you are right.", "example": "Justify your answer with a fact or a picture."}, {"word": "flawed", "pos": "adjective", "emoji": "💔", "meaning": "Having a mistake or a weak spot.", "example": "The fact 9 × 6 = 56 is flawed."}, {"word": "reluctant", "pos": "adjective", "emoji": "😬", "meaning": "Not wanting to do something.", "example": "Hiccup was a reluctant hero at first."}, {"word": "persevere", "pos": "verb", "emoji": "🧗", "meaning": "To keep trying even when it is hard.", "example": "Hiccup perseveres when the other Vikings doubt him."}]}, {"type": "learn", "kick": "Learn", "title": "All the ×6 and ×9 facts", "text": "Here is every 6s and 9s fact up to ×10. These products are the <b>multiples</b> of 6 and 9.", "visual": {"kind": "passage", "text": "<b>6s:</b> 6, 12, 18, 24, 30, 36, 42, 48, 54, 60<br><b>9s:</b> 9, 18, 27, 36, 45, 54, 63, 72, 81, 90"}, "steps": [{"text": "<b>Pattern 1.</b> Every multiple of 6 is <b>even</b>. So 6 × 7 can't be 41 or 43."}, {"text": "<b>Pattern 2.</b> 6 times 2, 4, 6 or 8 ends in that same digit: 6 × 2 = 12, 6 × 4 = 24, 6 × 6 = 36, 6 × 8 = 48."}, {"text": "<b>Pattern 3.</b> 18, 36 and 54 are on <b>both</b> lists. They are multiples of 6 AND of 9."}], "tip": "Use the patterns to catch mistakes fast. If a 6s answer is odd, it is wrong."}, {"type": "learn", "kick": "Learn", "title": "Turn-around facts", "text": "Multiplication is <b>commutative</b>: you can switch the factors and the product stays the same.", "visual": {"kind": "array", "rows": 6, "cols": 9, "emoji": "🐉", "label": "6 rows of 9 = 54. Turn it sideways: 9 rows of 6 = 54."}, "steps": [{"text": "6 × 9 and 9 × 6 are the <b>same array</b>, just turned. Both are 54.", "visual": {"kind": "bigtext", "text": "6 × 9 = 9 × 6"}}, {"text": "Stuck on 7 × 9? Flip it to <b>9 × 7</b> and use the ×9 shortcut: 70 − 7 = 63."}, {"text": "Stuck on 8 × 6? Flip it to <b>6 × 8</b> and use the ×6 shortcut: 40 + 8 = 48."}], "tip": "Every fact you learn gives you a second fact for free."}, {"type": "learn", "kick": "Learn", "title": "Find the missing factor", "text": "Sometimes a factor is missing: <b>9 × ? = 63</b>. Ask: 9 times what number makes 63?", "visual": {"kind": "triangle", "a": 9, "b": "?", "c": 63}, "steps": [{"text": "<b>Use a pattern.</b> For 9 × 2 up to 9 × 10, the tens digit of the product is one less than the other factor. 63 has a tens digit of 6, so the factor is <b>7</b>."}, {"text": "<b>Verify.</b> 9 × 7 = 70 − 7 = 63 ✔. So ? = 7.", "visual": {"kind": "bigtext", "text": "9 × 7 = 63"}}, {"text": "<b>Try a 6s one:</b> 6 × ? = 48. Guess 8 and check: 5 × 8 = 40, and 40 + 8 = 48 ✔. So ? = 8."}], "tip": "Always verify a missing factor by multiplying it back."}, {"type": "tap", "kick": "Try it", "title": "Missing factors", "items": [{"q": "9 × ? = 54", "visual": {"kind": "triangle", "a": 9, "b": "?", "c": 54}, "choices": ["5", "7", "6", "8"], "a": 2, "why": "The tens digit of 54 is 5, so the factor is 6. Verify: 60 − 6 = 54.", "no": ["9 × 5 = 45, not 54.", "9 × 7 = 63, not 54.", null, "9 × 8 = 72, not 54."]}, {"q": "? × 6 = 42", "choices": ["8", "6", "9", "7"], "a": 3, "why": "7 × 6 = 42. Verify with the ×6 shortcut: 35 + 7 = 42.", "no": ["8 × 6 = 48, not 42.", "6 × 6 = 36, not 42.", "9 × 6 = 54, not 42.", null]}, {"q": "6 × ? = 9 × 4", "choices": ["4", "5", "6", "9"], "a": 2, "why": "First, 9 × 4 = 36. Then 6 × ? = 36, so ? = 6. Both sides equal 36.", "no": ["6 × 4 = 24, but 9 × 4 = 36. The sides don't match.", "6 × 5 = 30, not 36.", null, "6 × 9 = 54, not 36."]}]}, {"type": "sort", "kick": "Sort it", "title": "True or flawed?", "text": "Tap a fact, then tap the right box. Use the patterns and your shortcuts.", "buckets": ["✅ True", "💔 Flawed"], "items": [{"text": "6 × 7 = 42", "b": 0, "why": "35 + 7 = 42. True!", "hint": "Try ×5 plus one group."}, {"text": "6 × 9 = 56", "b": 1, "why": "45 + 9 = 54, not 56.", "hint": "Use ×5 plus one group: 45 + 9."}, {"text": "8 × 9 = 72", "b": 0, "why": "Flip it to 9 × 8: 80 − 8 = 72. True!", "hint": "Flip it to 9 × 8."}, {"text": "4 × 9 = 32", "b": 1, "why": "3 + 2 = 5, not 9. 4 × 9 = 36.", "hint": "Add the digits. Do you get 9?"}, {"text": "7 × 6 = 36", "b": 1, "why": "36 is 6 × 6. 7 × 6 = 35 + 7 = 42.", "hint": "Flip it to 6 × 7. Use ×5 plus one group."}, {"text": "7 × 9 = 63", "b": 0, "why": "Flip it to 9 × 7: 70 − 7 = 63. True!", "hint": "Flip it to 9 × 7."}, {"text": "6 × 3 = 16", "b": 1, "why": "15 + 3 = 18, not 16.", "hint": "Use ×5 plus one group: 15 + 3."}], "done": "Patterns + shortcuts = a flawed fact can't hide from you."}, {"type": "tap", "kick": "Fix it", "title": "Find the mistake", "items": [{"q": "Hiccup wrote 7 × 9 = 70 − 9 = 61. What did he do wrong?", "choices": ["He took away 9. He should take away 7: 70 − 7 = 63.", "He should add: 70 + 9 = 79.", "He should use ×5: 35 + 9 = 44.", "Nothing. It is correct."], "a": 0, "why": "7 × 9 = 9 × 7. That is 10 groups of 7 minus one group of 7: 70 − 7 = 63.", "no": [null, "Adding makes 11 groups. Take one group away.", "The ×6 shortcut doesn't fit a ×9 fact.", "Verify: 6 + 1 = 7, not 9. It is flawed."]}, {"q": "Fishlegs wrote 6 × 9 = 45 + 6 = 51. Which equation fixes it?", "choices": ["60 + 9 = 69", "45 − 9 = 36", "45 + 9 = 54", "50 + 6 = 56"], "a": 2, "why": "5 × 9 = 45. Add one more group of <b>9</b>: 45 + 9 = 54.", "no": ["Start at 5 × 9 = 45, not 60.", "For ×6, add a group. Don't take one away.", null, "5 × 9 is 45, not 50, and the extra group is 9, not 6."]}, {"q": "Stoick says 9 × 3 = 72 because 7 + 2 = 9. Why is his answer flawed?", "choices": ["The digits add to 9, so it is right.", "The tens digit should be 2, so 9 × 3 = 27.", "He should add: 9 + 3 = 12.", "9s facts are never even."], "a": 1, "why": "The digits add to 9, but the tens digit must be one less than 3. 9 × 3 = 27. 72 is 9 × 8.", "no": ["The digit check isn't enough. Use the tens-digit check too.", null, "9 × 3 is 3 groups of 9. Multiply, don't add.", "9 × 2 = 18 and 9 × 8 = 72 are even, so that rule is false."]}]}, {"type": "order", "kick": "Step by step", "title": "Solve a word problem", "text": "Stoick has <b>54 shields</b>. He puts <b>6 shields</b> on each longship. How many longships? Tap the steps in order.", "steps": ["Read it: 54 shields in all, 6 on each ship.", "Find the equal groups: each ship gets 6.", "Write the equation: 6 × ? = 54.", "Use a fact you know: 6 × 9 = 45 + 9 = 54.", "Answer and verify: 9 longships. 9 × 6 = 60 − 6 = 54 ✔"], "why": "Read, find the groups, write the equation, use a fact, then verify. That is a strategy you can use on any problem.", "hint": "What do you always do first with a word problem?"}, {"type": "tap", "kick": "Prove it", "title": "Word problems", "items": [{"q": "Hiccup catches 9 baskets of fish with 6 fish in each. Toothless eats 8 of them. How many fish are left?", "visual": {"kind": "groups", "groups": 9, "each": 6, "emoji": "🐟"}, "choices": ["62", "46", "54", "48"], "a": 1, "why": "9 × 6 = 60 − 6 = 54 fish. Then 54 − 8 = <b>46</b> left.", "no": ["62 is 54 + 8. Toothless ate them, so subtract.", null, "54 is how many he caught. Don't forget Toothless ate 8.", "48 is 6 × 8. The 8 fish were eaten, not a group."]}, {"q": "The Vikings set up 63 benches in 9 equal rows. How many benches are in each row?", "choices": ["54", "6", "8", "7"], "a": 3, "why": "9 × ? = 63. The tens digit is 6, so ? = 7. Verify: 70 − 7 = 63.", "no": ["54 is a total, not one row. You need 9 × ? = 63.", "9 × 6 = 54, not 63.", "9 × 8 = 72, not 63.", null]}, {"q": "Fishlegs knows 9 × 8 = 72. Which fact does the commutative idea give him for free?", "choices": ["9 × 9 = 81", "8 + 9 = 17", "8 × 9 = 72", "72 − 8 = 64"], "a": 2, "why": "Switch the factors: 8 × 9 = 72. Same product!", "no": ["That is true, but it is a different fact. Flipping 9 × 8 doesn't give it.", "That is adding, not multiplying.", null, "That is subtracting. Commutative means switching the factors."]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "9 × ? = 72", "choices": ["7", "9", "8", "6"], "a": 2, "why": "The tens digit 7 is one less than 8. Verify: 80 − 8 = 72.", "no": ["9 × 7 = 63.", "9 × 9 = 81.", null, "9 × 6 = 54."]}, {"q": "Hiccup draws 6 dragons on each page of his notebook. He fills 7 pages. How many dragons did he draw?", "choices": ["13", "36", "42", "48"], "a": 2, "why": "7 pages with 6 dragons each is 7 × 6. Flip it to 6 × 7: 35 + 7 = <b>42</b> dragons.", "no": ["13 is 7 + 6. Each page has 6 dragons, so multiply.", "36 is 6 × 6. Count the pages again: there are 7.", null, "48 is 6 × 8. There are 7 pages, not 8."]}, {"q": "Which equation is <b>true</b>?", "choices": ["6 × 8 = 8 × 6", "6 × 8 = 6 + 8", "9 − 6 = 6 − 9", "6 × 9 = 5 × 9 + 6"], "a": 0, "why": "Multiplication is commutative, so 6 × 8 = 8 × 6. Both are 48.", "no": [null, "6 × 8 = 48, but 6 + 8 = 14.", "Subtraction is not commutative.", "5 × 9 + 6 = 51. The extra group is 9."]}, {"q": "Stoick buys 7 bags with 9 arrows in each bag. 5 arrows break. How many arrows are left?", "choices": ["63", "68", "56", "58"], "a": 3, "why": "7 × 9 = 9 × 7 = 70 − 7 = 63. Then 63 − 5 = 58.", "no": ["63 is how many he bought. 5 broke.", "68 adds the 5. Broken arrows are taken away.", "56 is 63 − 7. Take away 5.", null]}, {"q": "? × 6 = 54", "choices": ["8", "9", "7", "6"], "a": 1, "why": "9 × 6 = 60 − 6 = 54.", "no": ["8 × 6 = 48.", null, "7 × 6 = 42.", "6 × 6 = 36."]}, {"q": "Hiccup wrote 9 × 4 = 45. How do you know it is <b>flawed</b>?", "choices": ["4 + 5 = 9, so it is correct", "The tens digit should be 3, so 9 × 4 = 36", "9s facts always end in 9", "45 is too small"], "a": 1, "why": "For 9 × 2 up to 9 × 10, the tens digit is one less than the other factor. One less than 4 is 3, so 9 × 4 = 36.", "no": ["The digits add to 9, but the tens digit is wrong. Use both checks.", null, "9 × 2 = 18 ends in 8, so that rule is false.", "45 is too big, not too small. 9 × 4 = 36."]}, {"q": "6 × 9 = 9 × 6. This shows multiplication is…", "choices": ["commutative", "flawed", "reluctant", "tedious"], "a": 0, "why": "Commutative means you can switch the factors and get the same product.", "no": [null, "Flawed means it has a mistake. This is true!", "Reluctant describes a person who doesn't want to do something.", "Tedious means long and boring."]}, {"q": "Which number is a <b>multiple</b> of 9?", "choices": ["48", "56", "63", "42"], "a": 2, "why": "63 = 9 × 7. Verify: 6 + 3 = 9.", "no": ["48 is a multiple of 6 (6 × 8), not 9.", "56 is 7 × 8. 5 + 6 = 11.", null, "42 is a multiple of 6 (6 × 7), not 9."]}, {"q": "A <b>reluctant</b> dragon rider…", "choices": ["can't wait to ride", "doesn't really want to ride", "rides very fast", "has never seen a dragon"], "a": 1, "why": "Reluctant means not wanting to do something.", "no": ["That is eager, the opposite of reluctant.", null, "Reluctant is about wanting, not speed.", "Reluctant is about wanting, not seeing."]}, {"q": "You say 6 × 7 = 42. Which is the best way to <b>justify</b> it?", "choices": ["Because I said so", "6 + 7 = 13", "It looks right", "5 × 7 = 35, and 35 + 7 = 42"], "a": 3, "why": "To justify is to give a reason that proves it. The ×6 shortcut proves 42.", "no": ["That is not a reason.", "That is adding, and it doesn't prove 42.", "Looking right is not proof.", null]}]}], "win": "You persevered and proved it. Every ×9 and ×6 fact is yours!", "prev": "bb-bailey-L01", "prevTitle": "Lesson 1"});</script></body></html>
