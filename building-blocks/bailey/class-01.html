<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 1: Smart Shortcuts for ×9 and ×6</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L01", "label": "Lesson 1", "title": "Smart Shortcuts for ×9 and ×6", "goal": "I can use ×10 and ×5 facts to find ×9 and ×6 facts fast.", "date": "2026-10-20", "mastery": 90, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Smart Shortcuts for ×9 and ×6", "text": "Hiccup isn't the strongest Viking on Berk, but he wins by thinking smart. 🐉 Today you will multiply smart too: two <b>shortcuts</b> that turn facts you already know (×10 and ×5) into ×9 and ×6 facts.", "visual": {"kind": "emoji", "text": "🐉 🧠 ✖️"}, "notes": {"do": "Before she sits down: about 80 dried beans, 6 paper cups, the whiteboard and marker, and 7 index cards with one vocabulary word on each (factor, product, strategy, efficient, tedious, ingenious, verify). Keep the beans in a bowl out of reach until slide 6.", "say": "\"Today you are going to stop adding the same number over and over. Hiccup isn't the biggest Viking on Berk, but he wins because he thinks smart. Today we multiply smart.\"", "ask": "\"Read the goal out loud. What do you think <i>fast</i> means in math?\"", "listen": "If she says \"rushing\" or \"just knowing it,\" say: \"Fast in math means <b>fewer steps</b>, not hurrying. By the end you'll find 9 × 7 in one step.\""}}, {"type": "talk", "kick": "Book Talk", "title": "Talk about your book", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What happened in the part you read last? Tell it in order.", "What problem, or conflict, is Hiccup facing right now?", "Hiccup isn't big or loud like the other Vikings. How does he solve problems instead?"], "starters": ["In the part I read, …", "Hiccup's problem is …", "Instead of fighting, Hiccup …"], "notes": {"do": "Book closed. Let her retell first; only open the book if she gets stuck. 6–7 minutes.", "say": "\"Tell me what happened in the part you read last, in order: first, next, then.\"", "ask": "After the retell: \"What is Hiccup's problem right now?\" Then: \"Hiccup isn't big or loud. So how does he solve problems instead?\"", "listen": "Strong: she names a real conflict (for example, Hiccup has to train a dragon and doesn't fit in with the other Vikings) and says he uses his brain, plans or words. If she only says \"he's nice,\" push: \"What does he <i>do</i> that the other Vikings don't?\" End with: \"That's today's math too: think smart, not long.\""}}, {"type": "vocab", "kick": "Word Power", "title": "7 words for today", "text": "We'll learn these together. Read the word, flip the card, then say your own sentence.", "words": [{"word": "factor", "pos": "noun", "emoji": "🔢", "meaning": "A number you multiply.", "example": "In 9 × 7, the factors are 9 and 7."}, {"word": "product", "pos": "noun", "emoji": "🎯", "meaning": "The answer to a multiplication problem.", "example": "The product of 6 and 8 is 48."}, {"word": "strategy", "pos": "noun", "emoji": "🗺️", "meaning": "A plan you choose to solve a problem.", "example": "Hiccup needs a smart strategy, not big muscles."}, {"word": "efficient", "pos": "adjective", "emoji": "⚡", "meaning": "Gets the job done fast, with no wasted steps.", "example": "70 − 7 is more efficient than adding 7 nine times."}, {"word": "tedious", "pos": "adjective", "emoji": "🐌", "meaning": "Long, slow and boring.", "example": "Adding 9 + 9 + 9 + 9 + 9 + 9 is tedious."}, {"word": "ingenious", "pos": "adjective", "emoji": "💡", "meaning": "Very clever and creative.", "example": "Hiccup thinks up an ingenious plan to save Berk."}, {"word": "verify", "pos": "verb", "emoji": "🔍", "meaning": "To check that something is true.", "example": "To verify 9 × 7 = 63, add the digits: 6 + 3 = 9 ✔."}], "notes": {"do": "Hand her one index card at a time in this order: factor, product, strategy, efficient, tedious, ingenious, verify. She reads the word on the card, flips the slide card, reads the meaning and the example out loud. Write <b>9 × 7 = 63</b> on the whiteboard and keep it up for the first two words.", "say": "<b>factor / product:</b> \"The factors go in, the product comes out.\" Point: 9 and 7 are factors, 63 is the product. <b>strategy:</b> \"A strategy is a plan you choose. Hiccup's strategy is to think, not fight.\" <b>efficient / tedious:</b> \"These are opposites. Tedious is long, slow and boring, like adding 7 nine times. Efficient is fast with no wasted steps.\" (Act it out: yawn for tedious, snap for efficient.) <b>ingenious:</b> \"Very clever and creative. In-GEE-nee-us.\" <b>verify:</b> \"To check that something is true. Scientists verify. Mathematicians verify.\"", "ask": "After each word: \"Give me your own sentence.\" Then: \"Tell me one chore that is tedious.\" \"Which is more efficient, walking to the kitchen or crawling?\" \"In 6 × 4 = 24, which numbers are the factors?\"", "listen": "Mix-ups to fix right away: calling 63 a factor (it's the product), or using <i>ingenious</i> to mean \"nice.\" Every time she uses a word correctly during the lesson, she keeps that index card."}}, {"type": "tap", "kick": "Word check", "title": "Do you know your words?", "text": "Read each one out loud. Say the answer first, then type it.", "items": [{"type": "fill", "q": "In 9 × 7 = 63, the numbers 9 and 7 are called ____.", "answers": ["factors", "factor"], "why": "9 and 7 are the numbers you multiply, so they are the <b>factors</b>. 63 is the product.", "no": "9 and 7 are not the answer. They are the numbers you multiply. The word starts with <b>f</b>.", "hint": "It starts with <b>f</b>: f _ _ _ _ _ s"}, {"type": "fill", "q": "Adding 7 + 7 + 7 + 7 + 7 + 7 + 7 + 7 + 7 is long, slow and boring. It is ____.", "answers": ["tedious"], "why": "Long, slow and boring is <b>tedious</b>.", "no": "Which word did we yawn for?", "hint": "It starts with <b>t</b>: t _ _ _ _ _ s"}, {"type": "fill", "q": "Hiccup's very clever, creative plan is ____.", "answers": ["ingenious"], "why": "Very clever and creative is <b>ingenious</b>.", "no": "Which word means very clever?", "hint": "It starts with <b>in</b>: in _ _ _ _ _ _ s"}, {"q": "Which one <b>verifies</b> that 6 × 8 = 48?", "choices": ["Say it again louder", "Write 48 bigger", "Check that 5 × 8 = 40 and 40 + 8 = 48", "Ask someone to guess"], "a": 2, "why": "To verify is to check that it is true. 5 × 8 = 40, plus one more 8 is 48, so it is true.", "no": ["Saying it louder does not check it.", "Writing it bigger does not check it.", null, "A guess is not a check."]}], "notes": {"do": "She reads each item aloud and says her answer before typing. This is discussion, not a test: help on the second try.", "ask": "After the factor item: \"So what is 63 called?\" (product). After the tedious item: \"What's the opposite of tedious?\" (efficient).", "listen": "If she types <i>products</i> for the first one, ask: \"Is 9 the answer, or a number we multiply?\""}}, {"type": "learn", "kick": "Learn", "title": "Why adding over and over is slow", "text": "Here is 9 × 7 the long way: nine 7s, added one at a time.", "visual": {"kind": "numberline", "start": 0, "jump": 7, "jumps": 9}, "steps": [{"text": "Nine 7s means <b>8 additions</b>: 7, 14, 21, 28, 35, 42, 49, 56, 63."}, {"text": "One slip in the middle (like 28 + 7 = 34) and <b>every number after it is wrong</b>. That is <b>tedious</b> and risky."}, {"text": "Smart mathematicians ask: <b>Is there a more efficient strategy?</b> For 9s and 6s, there is!"}], "tip": "You already know your 10s and 5s cold. Today's shortcuts start there.", "notes": {"do": "Race. She adds 7 nine times on the whiteboard and writes every running total. You wait 5 seconds, then say \"70 minus 7 is 63\" out loud. Then show the number line and reveal the steps.", "say": "\"Ready? Go!\" When she finishes: \"I was done before you wrote your third number. Which way was more <b>efficient</b>? Which was <b>tedious</b>?\"", "ask": "\"If you made a mistake at 28 + 7, what happens to every number after it?\"", "listen": "She should say every number after the slip is wrong too. That is the reason we want fewer steps, not just speed."}}, {"type": "learn", "kick": "Shortcut 1", "title": "×9 = ×10, then take away one group", "text": "9 groups is just <b>one group less than 10 groups</b>. Let's find 9 × 7.", "visual": {"kind": "array", "rows": 10, "cols": 7, "emoji": "🐟", "label": "10 rows of 7 fish = 70"}, "steps": [{"text": "<b>Step 1.</b> Pretend it is ×10: 10 × 7 = <b>70</b>.", "visual": {"kind": "bigtext", "text": "10 × 7 = 70"}}, {"text": "<b>Step 2.</b> That is one row of 7 too many. Take it away: <b>70 − 7</b>."}, {"text": "<b>Step 3.</b> 70 − 7 = <b>63</b>. So 9 × 7 = 63.", "visual": {"kind": "bigtext", "text": "9 × 7 = 63"}}], "tip": "Take away the <b>other factor</b> (the 7), not 9. 70 − 9 = 61 is a trap!", "notes": {"do": "BEFORE you tap through the steps: she builds 10 rows of 7 beans on the table. Ask how many (70). Then she slides one whole row away. Now tap \"Show me the next step\" to show steps 2 and 3. Leave the 9 rows of beans out for the next slide.", "say": "\"You know 10 × 7 cold. It's 70. But we only need 9 rows. So take ONE row away. How many beans are in one row? 7. So 70 − 7.\"", "ask": "\"How many rows now?\" (9) \"How many beans did you take away?\" (7, not 9.) \"So 9 × 7 is…?\"", "listen": "Right: \"70 take away 7 is 63.\" Wrong: \"70 take away 9.\" Point at the row she removed and say: \"Count that row. How many beans are in it?\""}}, {"type": "tap", "kick": "Try it together", "title": "Use the ×9 shortcut", "text": "Say the two steps out loud first. Then type the answer.", "items": [{"type": "fill", "q": "Use the ×9 shortcut. What is 9 × 6?", "answers": ["54"], "why": "10 × 6 = 60. Take away one group of 6: 60 − 6 = <b>54</b>.", "no": "Start with 10 × 6. Then take away one group of 6.", "hint": "60 − 6 = ?", "visual": {"kind": "bigtext", "text": "9 × 6"}}, {"q": "Which one shows the ×9 shortcut for 9 × 8?", "choices": ["90 − 9", "80 − 9", "80 − 8", "72 + 8"], "a": 2, "why": "10 × 8 = 80. Then take away one group of 8: 80 − 8 = 72.", "no": ["90 − 9 is the shortcut for 9 × 9. Start with 10 × <b>8</b>.", "Each group has 8 in it, so take away 8, not 9.", null, "72 + 8 adds a group. That gets you to 10 × 8, not 9 × 8."]}, {"type": "fill", "q": "Stoick packs 9 crates. Each crate holds 4 helmets. How many helmets?", "answers": ["36", "36 helmets"], "why": "9 equal groups of 4: 40 − 4 = <b>36</b> helmets.", "no": "Each crate holds 4. Start with 10 × 4 = 40, then take away one group of 4.", "hint": "40 − 4 = ?", "visual": {"kind": "groups", "groups": 9, "each": 4, "emoji": "⛑️"}}], "notes": {"do": "She says both steps out loud before she types (\"10 × 6 is 60, take away 6\"). For the crates, have her point to one crate and say how many are in ONE group.", "ask": "\"What do you take away, and why?\"", "listen": "The words \"one group of…\" followed by the OTHER factor. If she says \"take away 9,\" go back to the beans."}}, {"type": "learn", "kick": "Watch out", "title": "The ×9 trap", "text": "Fishlegs tried the shortcut: <b>9 × 7 = 70 − 9 = 61</b>. Something went wrong.", "visual": {"kind": "bigtext", "text": "70 − 9 = 61 ❌", "sub": "70 − 7 = 63 ✅"}, "steps": [{"text": "Each group has <b>7</b> in it. Taking away 9 takes away the wrong amount."}, {"text": "Take away <b>one group</b>, and one group is the <b>other factor</b>: 70 − 7 = <b>63</b>."}, {"text": "<b>Rule:</b> for ×9, start at ×10 and take away the number you are multiplying 9 by."}], "tip": "Ask yourself: How many are in ONE group?", "notes": {"do": "Point at the 9 rows of beans still on the table. Push one more row away, then pull it back.", "say": "\"Fishlegs knew to take something away. He just took away the wrong thing. One group of 7 is 7 beans, not 9.\"", "ask": "\"Fishlegs does 9 × 5 = 50 − 9. What should he take away?\" (5) \"9 × 8 = 80 − ?\" (8)", "listen": "Quick, confident answers mean she has it. Hesitation means one more bean example: 10 rows of 5, take a row away."}}, {"type": "learn", "kick": "Learn", "title": "Three ways to verify a 9s fact", "text": "The 9s facts from 9 × 2 up to 9 × 10 have patterns. Use them to <b>verify</b> your answer.", "visual": {"kind": "passage", "text": "9 × 2 = 18 · 9 × 3 = 27 · 9 × 4 = 36<br>9 × 5 = 45 · 9 × 6 = 54 · 9 × 7 = 63<br>9 × 8 = 72 · 9 × 9 = 81 · 9 × 10 = 90"}, "steps": [{"text": "<b>Check 1: The digits add to 9.</b> 63 → 6 + 3 = 9 ✔. 72 → 7 + 2 = 9 ✔."}, {"text": "<b>Check 2: The tens digit is one less than the other factor.</b> In 9 × 7, the tens digit is 6 (one less than 7). 6 and 3 make 9, so the answer is 63."}, {"text": "<b>Finger check.</b> Hold up 10 fingers. For 9 × 7, count from the left and fold down finger number 7. Fingers to the left of it: <b>6</b> (tens). Fingers to the right: <b>3</b> (ones). That is 63!", "visual": {"kind": "emoji", "text": "🖐️🖐️"}}], "tip": "These checks work for 9 × 2 up to 9 × 10. Use Check 1 AND Check 2: the digits of 45 add to 9, but 9 × 6 = 45 is wrong. The tens digit should be 5, so 9 × 6 = 54.", "notes": {"do": "Clear the beans. Show Check 1, then Check 2. Then tap to the finger check and teach it with her hands, not just the slide: hands flat, fold down finger 7 for 9 × 7.", "say": "\"These are ways to <b>verify</b> a 9s fact. They work from 9 × 2 up to 9 × 10. Check 1: the digits add to 9. Check 2: the tens digit is one less than the other factor.\"", "ask": "\"Use Check 1 on 9 × 6 = 45. Does it pass?\" (Yes, 4 + 5 = 9.) \"Is it right?\" (No!) \"Which check catches it?\" (Check 2: the tens digit should be 5.)", "listen": "She needs to see that Check 1 alone can be fooled. If she says \"45 is right because 4 + 5 = 9,\" do the finger check for 9 × 6 together."}}, {"type": "tap", "kick": "Verify it", "title": "Correct or wrong?", "text": "Use both checks on each fact. Say which check you used. Then type <b>correct</b> or <b>wrong</b>.", "items": [{"type": "fill", "q": "Is <b>9 × 6 = 54</b> correct or wrong?", "answers": ["correct", "right"], "why": "5 + 4 = 9, and 5 is one less than 6. <b>Correct.</b>", "no": "Add the digits. Then look at the tens digit."}, {"type": "fill", "q": "Is <b>9 × 8 = 74</b> correct or wrong?", "answers": ["wrong", "incorrect", "not correct", "not right"], "why": "7 + 4 = 11, not 9. <b>Wrong.</b> The real answer is 72.", "no": "Add the digits. Do you get 9?"}, {"type": "fill", "q": "Is <b>9 × 7 = 54</b> correct or wrong?", "answers": ["wrong", "incorrect", "not correct", "not right"], "why": "5 + 4 = 9 passes Check 1, but the tens digit should be 6. <b>Wrong.</b> The real answer is 63.", "no": "The digits add to 9. Now use Check 2: what should the tens digit be?"}, {"type": "fill", "q": "Is <b>9 × 4 = 36</b> correct or wrong?", "answers": ["correct", "right"], "why": "3 + 6 = 9, and 3 is one less than 4. <b>Correct.</b>", "no": "Try both checks."}], "notes": {"do": "Four facts. Before each answer she says which check she used out loud (\"Check 1: the digits add to 9\" or \"Check 2: the tens digit\").", "ask": "On 9 × 7 = 54: \"The digits add to 9. So why is it wrong?\"", "listen": "\"The tens digit should be 6, not 5.\" Praise her by name if she catches it."}}, {"type": "learn", "kick": "Shortcut 2", "title": "×6 = ×5, then add one group", "text": "6 groups is <b>one group more than 5 groups</b>. Let's find 6 × 8.", "visual": {"kind": "array", "rows": 6, "cols": 8, "emoji": "🛡️", "label": "6 rows of 8 shields"}, "steps": [{"text": "<b>Step 1.</b> Start with ×5: 5 × 8 = <b>40</b>.", "visual": {"kind": "bigtext", "text": "5 × 8 = 40"}}, {"text": "<b>Step 2.</b> That is one row short. Add one more row of 8: <b>40 + 8</b>."}, {"text": "<b>Step 3.</b> 40 + 8 = <b>48</b>. So 6 × 8 = 48.", "visual": {"kind": "bigtext", "text": "6 × 8 = 48"}}], "tip": "Add the <b>other factor</b> (the 8), not 6. 40 + 6 = 46 is a trap!", "notes": {"do": "Rebuild with beans: 5 rows of 8 first (40). Then she adds one more row of 8. Reveal steps 1–3.", "say": "\"×9 was one row less than ×10. ×6 is one row MORE than ×5. You know 5 × 8 = 40. Add one more row of 8.\"", "ask": "\"Is 6 more or less than 5?\" (more) \"So do we add or take away?\" (add) \"Add how many?\" (8, the other factor)", "listen": "Trap: 40 + 6 = 46. If she says it, ask: \"How many beans are in the row you just added?\""}}, {"type": "build", "kick": "Build it", "title": "Toothless's fish baskets", "text": "Hiccup fills <b>6 baskets</b> with <b>7 fish</b> in each for Toothless. Build it. Before you tap Check, say the total with the ×6 shortcut.", "groups": 6, "each": 7, "emoji": "🐟", "why": "6 groups of 7. Shortcut: 5 × 7 = 35, plus one more group of 7: 35 + 7 = <b>42</b> fish.", "hint": "Groups = the number of baskets. In each group = the fish in ONE basket. Check both numbers.", "notes": {"do": "Hands-on first: she puts 7 beans in each of 6 cups. Then she builds it on the slide. She says \"35 + 7 = 42\" BEFORE she taps Check.", "ask": "\"Take one cup away. How many fish in 5 cups?\" (35) \"Put the cup back. Now how many?\" (42)", "listen": "If she counts the beans one by one, stop her: \"No counting. What's 5 × 7?\""}}, {"type": "tap", "kick": "Try it together", "title": "Use the ×6 shortcut", "text": "Say the two steps out loud first.", "items": [{"q": "You start 6 × 9 with 5 × 9 = 45. What is your next step?", "choices": ["Add 6 to get 51", "Add 9 to get 54", "Take away 9 to get 36", "Add 5 to get 50"], "a": 1, "why": "One more group of 9: 45 + 9 = <b>54</b>. So 6 × 9 = 54.", "no": ["Adding 6 is the trap. The extra group has <b>9</b> in it, not 6.", null, "Taking away is the ×9 shortcut. For ×6 you need one <b>more</b> group.", "The extra group has 9 in it, not 5."]}, {"type": "fill", "q": "What is 6 × 6?", "answers": ["36"], "why": "5 × 6 = 30, plus one more group of 6: 30 + 6 = <b>36</b>.", "no": "Start with 5 × 6 = 30. Then add one more group of 6.", "hint": "30 + 6 = ?"}, {"type": "fill", "q": "There are 6 dragon stables on Berk. Each stable has 4 stalls. How many stalls?", "answers": ["24", "24 stalls"], "why": "6 groups of 4: 5 × 4 = 20, plus 4 more = <b>24</b> stalls.", "no": "Each stable has 4 stalls. Start with 5 × 4.", "hint": "20 + 4 = ?", "visual": {"kind": "groups", "groups": 6, "each": 4, "emoji": "🚪", "label": "6 stables, 4 stalls in each"}}], "notes": {"do": "Same routine as the ×9 practice: two steps out loud, then answer.", "ask": "On the first item, if she picks \"Add 6\": \"How many are in ONE group of 6 × 9?\"", "listen": "\"5 times 4 is 20, plus one more 4 is 24.\" Any counting by 1s means go back to the cups."}}, {"type": "tap", "kick": "Speed round", "title": "Mix them up", "text": "Which shortcut? Say it, then type the answer. Your teacher writes your steps on the whiteboard.", "items": [{"type": "fill", "q": "What is 9 × 5?", "answers": ["45"], "why": "10 × 5 = 50, take away one group of 5: 50 − 5 = <b>45</b>.", "no": "Is it the ×9 or the ×6 shortcut? Start with 10 × 5.", "hint": "50 − 5 = ?"}, {"type": "fill", "q": "What is 6 × 3?", "answers": ["18"], "why": "5 × 3 = 15, plus one more group of 3: 15 + 3 = <b>18</b>.", "no": "Start with 5 × 3 = 15. Then add one more group.", "hint": "15 + 3 = ?"}, {"type": "fill", "q": "What is 9 × 9?", "answers": ["81"], "why": "10 × 9 = 90, take away one group of 9: 90 − 9 = <b>81</b>. Verify: 8 + 1 = 9 ✔.", "no": "Start with 10 × 9 = 90.", "hint": "90 − 9 = ?"}], "notes": {"do": "She names the shortcut first (\"×9: start at 10, take away\" or \"×6: start at 5, add one\"). You write her two steps on the whiteboard as she says them.", "ask": "After 9 × 9: \"Verify it two ways.\"", "listen": "Mixing the directions (adding for ×9, subtracting for ×6). Ask: \"Is 9 more or less than 10? Is 6 more or less than 5?\""}}, {"type": "tap", "kick": "Think smart", "title": "Pick the smart strategy", "items": [{"q": "Which is the most <b>efficient</b> way to find 9 × 8?", "choices": ["Add 8 nine times", "Count by 1s to 72", "80 − 8", "Add 9 eight times"], "a": 2, "why": "One step: 10 × 8 = 80, then 80 − 8 = 72. That is efficient!", "no": ["That works, but it is 8 additions: tedious and easy to lose your place.", "Counting 72 ones is the slowest way of all.", null, "That is still 7 additions. The ×10 shortcut takes one step."]}, {"q": "Fishlegs says 9 × 5 = 50 − 9 = 41. What is his mistake?", "choices": ["There is no mistake.", "He should add 9 to get 59.", "He should start with 90.", "He should take away 5 to get 45."], "a": 3, "why": "Take away one group of <b>5</b>: 50 − 5 = 45. Verify: 4 + 5 = 9 ✔.", "no": ["Verify it: 4 + 1 = 5, not 9. Something is wrong.", "Adding a group makes 11 groups. For ×9 you take one group away.", "90 is 10 × 9. Start with 10 × 5 = 50.", null]}, {"type": "fill", "q": "Adding 7 six times (7 + 7 + 7 + 7 + 7 + 7) takes how many additions? Type the number.", "answers": ["5", "five"], "why": "Six 7s need <b>5</b> plus signs. 35 + 7 needs only 1. That is why 35 + 7 is more <b>efficient</b>.", "no": "Count the plus signs.", "hint": "7 + 7 + 7 + 7 + 7 + 7 has how many + signs?"}], "notes": {"do": "She reads each item aloud and says which strategy she would use before answering.", "ask": "On the Fishlegs item: \"Verify his answer. What do the digits add to?\"", "listen": "She uses the words <i>efficient</i>, <i>tedious</i> or <i>verify</i> on her own. When she does, hand her that index card."}}, {"type": "talk", "kick": "Teach it back", "title": "You be the teacher", "text": "Explain it to your teacher like you are teaching Fishlegs.", "prompts": ["Explain the ×9 shortcut for 9 × 8. Use the words <b>factor</b> and <b>product</b>.", "Explain the ×6 shortcut for 6 × 8. Why do you add 8, not 6?", "Why is 70 − 7 more <b>efficient</b> than adding 7 nine times? Use the word <b>tedious</b>."], "starters": ["First I start with …", "Then I take away / add one group of …", "Adding over and over is tedious because …"], "notes": {"do": "She talks; you only listen. Tap the star button for each clear explanation. 3 minutes.", "say": "\"I'm Fishlegs and I keep getting 9s wrong. Teach me.\"", "ask": "If she stops: \"What do you start with? Then what?\"", "listen": "A strong answer: \"10 × 8 is 80, take away one group of 8, the product is 72.\" For ×6: \"Each group has 8, so the extra group is 8.\""}}, {"type": "learn", "kick": "Wrap-up", "title": "Your plan after class", "text": "You learned two shortcuts today. Now you practice them on your own.", "visual": {"kind": "emoji", "text": "🐉 ✅ 🏠"}, "steps": [{"text": "<b>Tonight:</b> the After-class lesson. It ends with Show What You Know. You need 90 to open Lesson 2. Then read your book for 15 minutes."}, {"text": "<b>Wednesday:</b> the Practice set, packet page 1, and 15 minutes of reading."}, {"text": "<b>Tonight and Wednesday:</b> say your 9s and 6s out loud once, using the shortcuts."}], "tip": "Stuck at home? Say: \"What do I already know? 10s and 5s.\"", "notes": {"do": "Open the course page and read the task list with her. She checks nothing off yet. She takes the 7 vocabulary index cards home and brings them back Thursday.", "say": "\"You found 9 × 7 in one step today. That's efficient. Thursday you prove you can do every 9 and every 6.\"", "ask": "\"What will you do tonight? What will you do Wednesday?\"", "listen": "She can name the After-class lesson tonight and the Practice set plus packet page 1 on Wednesday."}}], "win": "Hiccup would call that ingenious. You found the shortcut!", "prev": null, "prevTitle": ""});</script></body></html>
