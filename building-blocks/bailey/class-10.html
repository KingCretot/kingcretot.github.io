<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 10: Fact Families and Leftovers</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L10", "label": "Lesson 10", "title": "Fact Families and Leftovers", "goal": "I can write all the facts in a fact family and tell what is left over when things don't share evenly.", "date": "2026-11-10", "mastery": 90, "color": "#E67E22", "slides": [{"type": "hello", "title": "Fact Families and Leftovers", "text": "Yesterday you learned that division undoes multiplication. Today three numbers make a whole <b>family</b> of four facts. Then you find out what happens when things do not share evenly.", "visual": {"kind": "emoji", "text": "🔺👨‍👩‍👧‍👦🐟"}, "notes": {"do": "Set out before she sits down: about 50 dried beans, 7 cups, whiteboard and marker, 5 blank index cards, and ask her to bring her three triangle cards from Monday.", "say": "\"Monday you learned the big idea: division asks a multiplication question. Today you get two new tools: fact families, and what to do with leftovers.\"", "ask": "\"How did Show What You Know go last night? Which question surprised you?\" (Check her Formspree score before class.)"}}, {"type": "talk", "kick": "Book Talk", "title": "Characters on Berk", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["How has Hiccup changed since the start of the book? Give one example.", "What does Toothless want? Does Hiccup want the same thing? How does that cause conflict?", "Read me one sentence that shows how another Viking feels about Hiccup. What words give the feeling away?"], "starters": ["At the start, Hiccup … but now …", "Toothless wants … but Hiccup wants …", "The words … show that …"], "notes": {"do": "7 minutes. She keeps the book open and finds the sentence for the third prompt herself.", "ask": "\"How has Hiccup changed? Give one example from early in the book and one from now.\" \"What does Toothless want? Is that the same as what Hiccup wants?\"", "listen": "Every answer backed by a detail from the book. If she gives an opinion only, ask: \"What happened that makes you think so?\""}}, {"type": "recall", "kick": "Remember?", "title": "Monday's big idea", "items": [{"type": "fill", "q": "What number is hiding in this fact triangle? Type it.", "answers": ["9", "nine"], "why": "8 × 9 = 72, so 72 ÷ 8 = 9.", "no": "Ask: 8 × what = 72?", "visual": {"kind": "triangle", "a": 8, "b": "?", "c": 72}}, {"q": "In <b>56 ÷ 8 = 7</b>, what is the 8 called?", "choices": ["the dividend", "the quotient", "the divisor"], "a": 2, "why": "The divisor is the number you divide by.", "no": ["The dividend is 56, the number being divided.", "The quotient is 7, the answer.", null]}, {"q": "Stoick packed <b>provisions</b> for the trip. Then he had to <b>ration</b> them. What happened?", "choices": ["He threw the supplies overboard.", "He gave out the supplies in small amounts so they would last.", "He ate everything on the first day.", "He bought more supplies."], "a": 1, "why": "Provisions are packed supplies; to ration is to give them out in small, set amounts.", "no": ["Rationing keeps supplies, it does not throw them away.", null, "That is the opposite of rationing.", "Rationing means making what you have last longer."]}], "notes": {"do": "Before the slide, 2 minutes with her Monday triangle cards: she quizzes you on one, then you quiz her on two.", "ask": "\"Say the multiplication question for the triangle before you type.\"", "listen": "She should still say \"8 times what is 72\" without prompting. If not, spend one more minute on it before new material."}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read it out loud. Then tell me where you could use the word outside of math.", "words": [{"word": "fact family", "pos": "noun", "emoji": "🔺", "meaning": "A set of related multiplication and division facts made from the same three numbers.", "example": "6 × 8 = 48, 8 × 6 = 48, 48 ÷ 6 = 8 and 48 ÷ 8 = 6 are one <b>fact family</b>."}, {"word": "remainder", "pos": "noun", "emoji": "🍪", "meaning": "The amount left over when a number cannot be split into equal groups.", "example": "30 ÷ 7 = 4 R 2. The <b>remainder</b> is 2."}, {"word": "evenly", "pos": "adverb", "emoji": "⚖️", "meaning": "In equal parts, with nothing left over.", "example": "48 fish split <b>evenly</b> among 6 dragons: 8 each."}, {"word": "surplus", "pos": "noun", "emoji": "📦", "meaning": "An extra amount, more than what is needed.", "example": "After every dragon was fed, there was a <b>surplus</b> of 3 fish."}, {"word": "scarce", "pos": "adjective", "emoji": "🏜️", "meaning": "Hard to find because there is very little of it.", "example": "In the middle of winter, fresh food was <b>scarce</b>."}, {"word": "hesitate", "pos": "verb", "emoji": "⏸️", "meaning": "To stop or wait for a moment before doing something, because you are unsure.", "example": "Do not <b>hesitate</b>: if you know 7 × 8 = 56, you know 56 ÷ 8."}, {"word": "negotiate", "pos": "verb", "emoji": "🤝", "meaning": "To talk with someone to reach an agreement.", "example": "Instead of fighting, the two tribes agreed to <b>negotiate</b>."}], "notes": {"do": "She reads each card aloud and gives a use outside math. Write <b>fact family</b> and <b>remainder</b> on the whiteboard; you will add to them later.", "say": "\"Two math words, five story words. Two of the story words are opposites. Find them.\" (surplus and scarce.)", "ask": "\"Use <i>hesitate</i> about a moment in your book.\" \"When would two Viking tribes <i>negotiate</i> instead of fight?\" \"What would a <i>surplus</i> of fish look like on our cups?\"", "listen": "Surplus = extra, scarce = very little. For <i>evenly</i>, she must say \"nothing left over\", not just \"equal\"."}}, {"type": "learn", "kick": "Learn", "title": "Three numbers, four facts", "text": "The numbers <b>6, 8 and 48</b> make a <b>fact family</b>. From one triangle you get four facts.", "visual": {"kind": "triangle", "a": 6, "b": 8, "c": 48}, "steps": [{"text": "<b>6 × 8 = 48</b>"}, {"text": "<b>8 × 6 = 48</b> (the turn-around fact)"}, {"text": "<b>48 ÷ 6 = 8</b>"}, {"text": "<b>48 ÷ 8 = 6</b>"}], "tip": "In both division facts, the biggest number (the top of the triangle) comes first.", "notes": {"do": "Hands-on: she writes the four facts for 6, 8, 48 on four blank index cards, one fact per card, and lines them up under her triangle.", "ask": "Before each step: \"What is the next fact in the family?\" After all four: \"Which number starts both division facts? Why?\"", "listen": "\"48 comes first because it is the total, the biggest number.\""}}, {"type": "learn", "kick": "Learn", "title": "A family with only two facts", "text": "Look at the numbers <b>7, 7 and 49</b>. Try to write four facts.", "visual": {"kind": "triangle", "a": 7, "b": 7, "c": 49}, "steps": [{"text": "7 × 7 = 49. Turn it around: 7 × 7 = 49. <b>Same fact!</b>"}, {"text": "49 ÷ 7 = 7. The other division: 49 ÷ 7 = 7. <b>Same fact again!</b>"}, {"text": "So the 7, 7, 49 family has only <b>2 different facts</b>."}], "tip": "When the two bottom numbers are the same, the family has 2 facts, not 4.", "notes": {"do": "Give her a blank card: \"Write the 7, 7, 49 family.\" Let her discover the repeats before you reveal the steps.", "ask": "\"Look at your four cards. Are any of them exactly the same?\" \"Which other families would only have two facts?\" (6, 6, 36; 8, 8, 64; 9, 9, 81.)", "listen": "She explains WHY: the turn-around of 7 × 7 is itself."}}, {"type": "tap", "kick": "Try it", "title": "Who belongs in the family?", "items": [{"q": "Which fact belongs in the same family as <b>9 × 7 = 63</b>?", "choices": ["63 − 7 = 56", "7 ÷ 63 = 9", "63 ÷ 9 = 7", "9 × 8 = 72"], "a": 2, "why": "63 ÷ 9 = 7 uses the same three numbers: 7, 9 and 63.", "no": ["Subtraction facts are not in a multiplication and division family.", "Backward! The biggest number must come first in division.", null, "That fact uses 8 and 72, not 7 and 63."]}, {"type": "fill", "q": "Finish the family: 6 × 9 = 54, 9 × 6 = 54, 54 ÷ 6 = 9, and 54 ÷ 9 = ____", "answers": ["6", "six"], "why": "9 × 6 = 54, so 54 ÷ 9 = 6.", "no": "Which number is not used yet in the division facts?"}, {"q": "Which list is a <b>complete</b> fact family?", "choices": ["8 × 9 = 72, 9 × 8 = 72, 72 ÷ 8 = 9, 72 ÷ 6 = 12", "8 × 9 = 72, 72 ÷ 9 = 8, 9 ÷ 72 = 8, 8 + 9 = 17", "8 × 9 = 72, 9 × 8 = 72, 72 ÷ 8 = 9, 72 ÷ 9 = 8", "8 × 9 = 72, 9 × 9 = 81, 72 ÷ 8 = 9, 81 ÷ 9 = 9"], "a": 2, "why": "All four facts use only 8, 9 and 72.", "no": ["72 ÷ 6 = 12 is true, but 6 and 12 are not in this family.", "9 ÷ 72 is backward, and adding is not in the family.", null, "81 is a different family."]}], "notes": {"say": "\"A fact belongs only if it uses the same three numbers AND it is true.\"", "ask": "For every wrong choice she rejects: \"Why doesn't it belong?\"", "listen": "Three reasons a fact does not belong: wrong numbers, backward division, or the wrong operation (+ or −)."}}, {"type": "tap", "kick": "Talk it through", "title": "In or out of the 6, 9, 54 family?", "text": "Type <b>in</b> or <b>out</b>. Then say why.", "items": [{"type": "fill", "q": "54 ÷ 6 = 8. &nbsp; Is it <b>in</b> or <b>out</b>?", "answers": ["out"], "why": "6 × 8 = 48, not 54. A false fact is not in any family.", "no": "Check it: 6 × 8 = ?"}, {"type": "fill", "q": "6 ÷ 54 = 9. &nbsp; Is it <b>in</b> or <b>out</b>?", "answers": ["out"], "why": "Backward. In division the biggest number comes first.", "no": "Which number should come first in division?"}, {"type": "fill", "q": "9 × 6 = 54. &nbsp; Is it <b>in</b> or <b>out</b>?", "answers": ["in"], "why": "The turn-around fact uses the same three numbers, and it is true.", "no": "Same three numbers? True?"}, {"type": "fill", "q": "45 ÷ 9 = 5. &nbsp; Is it <b>in</b> or <b>out</b>?", "answers": ["out"], "why": "45 is not 54. The digits got switched.", "no": "Read the first number carefully: 45 or 54?"}], "notes": {"do": "She can lay her 6, 9, 54 triangle card next to the screen while she decides.", "ask": "\"Why?\" after every answer, even the right ones.", "listen": "45 ÷ 9 = 5 is the trap: it is a true fact but uses different numbers. Praise her if she catches the switched digits."}}, {"type": "learn", "kick": "Learn", "title": "When it does not share evenly", "text": "Hiccup has <b>30 fish</b> for <b>7 dragons</b>. Every dragon must get the same number. How many does each dragon get?", "visual": {"kind": "groups", "groups": 7, "each": 4, "emoji": "🐟", "label": "7 dragons get 4 fish each. That uses 28 fish."}, "steps": [{"text": "Ask: 7 × what gets close to 30 <b>without going over</b>?"}, {"text": "7 × 4 = 28 ✔ (7 × 5 = 35 is too many)."}, {"text": "30 − 28 = <b>2 fish left over</b>. That is the <b>remainder</b>."}, {"text": "Write it like this:", "visual": {"kind": "bigtext", "text": "30 ÷ 7 = 4 R 2", "sub": "4 fish each, 2 left over"}}], "tip": "The remainder must be <b>smaller than the divisor</b>. If 7 or more were left over, every dragon could get one more fish!", "notes": {"do": "Hands-on first, slide second: give her 30 beans and 7 cups. She deals one bean per cup per round until she cannot do a full round. Then reveal the steps.", "ask": "\"How many in each cup?\" (4). \"How many in your hand?\" (2). \"Why can't the 2 go in?\" (Not enough for every cup.) \"Which fact did your rounds make?\" (7 × 4 = 28.)", "listen": "\"There aren't enough for every dragon to get one more.\" That sentence is the whole idea of a remainder."}}, {"type": "learn", "kick": "Learn", "title": "Too many left? One more group fits!", "text": "Fishlegs tried <b>38 ÷ 6</b>. He wrote <b>5 R 8</b>. Find his mistake.", "visual": {"kind": "bigtext", "text": "38 ÷ 6 = 5 R 8 ?"}, "steps": [{"text": "6 × 5 = 30. 38 − 30 = 8 left over."}, {"text": "But <b>8 is bigger than 6</b>. Every group can get one more!"}, {"text": "6 × 6 = 36. 38 − 36 = 2. So <b>38 ÷ 6 = 6 R 2</b>.", "visual": {"kind": "bigtext", "text": "38 ÷ 6 = 6 R 2"}}], "tip": "Always ask: is my remainder smaller than the divisor?", "notes": {"do": "She builds it: 38 beans, 6 cups, but she stops after 5 rounds like Fishlegs. Then she looks at the 8 beans in her hand.", "ask": "\"Can every cup get one more bean?\" (Yes, 8 is at least 6.) \"So was 5 the biggest fact that fits?\"", "listen": "She connects \"leftover too big\" with \"I picked a fact that was too small\"."}}, {"type": "build", "kick": "Build it", "title": "Dinner for six dragons", "text": "Hiccup has <b>26 fish</b> and <b>6 dragons</b>. Give every dragon the same number of fish, as many as you can. Make the groups.", "groups": 6, "each": 4, "emoji": "🐟", "why": "6 × 4 = 24 fish handed out. 26 − 24 = 2 left over. So <b>26 ÷ 6 = 4 R 2</b>.", "hint": "6 dragons means 6 groups. Is 6 × 5 = 30 more than 26? Then try 4 in each.", "notes": {"do": "She predicts the answer with a fact first (6 × 4 = 24, 2 left), then sets the counters. Beans only if her prediction is wrong.", "ask": "\"Which 6s fact is the biggest that fits under 26?\"", "listen": "She rejects 6 × 5 = 30 because it is over 26."}}, {"type": "tap", "kick": "Guided practice", "title": "Leftovers", "text": "Type the answer with R for the remainder, like <b>4 R 2</b>.", "items": [{"type": "fill", "q": "<b>45 ÷ 7</b> = ____", "answers": ["6 R 3", "6 remainder 3", "6 rem 3"], "why": "7 × 6 = 42 and 45 − 42 = 3. So 45 ÷ 7 = 6 R 3.", "no": "Find the biggest 7s fact that fits under 45 without going over.", "hint": "7 × 6 = 42. How many are left?", "placeholder": "like 4 R 2"}, {"q": "Fishlegs says <b>50 ÷ 9 = 4 R 14</b>. What is wrong?", "choices": ["Nothing. 9 × 4 + 14 = 50.", "14 left over is enough for one more group of 9. It should be 5 R 5.", "The remainder should be 0."], "a": 1, "why": "9 × 5 = 45 and 50 − 45 = 5. So 50 ÷ 9 = 5 R 5.", "no": ["The math adds up, but a remainder can never be as big as the divisor.", null, "9 × 5 = 45, so 5 are left over, not 0."]}, {"q": "Which division has <b>no remainder</b>?", "choices": ["52 ÷ 8", "43 ÷ 6", "60 ÷ 7", "63 ÷ 9"], "a": 3, "why": "9 × 7 = 63 exactly, so nothing is left over.", "no": ["8 × 6 = 48, so 4 are left over.", "6 × 7 = 42, so 1 is left over.", "7 × 8 = 56, so 4 are left over.", null]}], "notes": {"do": "She works on the whiteboard first, then types.", "say": "\"Three questions for every leftover problem: which fact fits, how many are left, is the remainder smaller than the divisor?\"", "listen": "On 45 ÷ 7 she should reject 7 × 7 = 49 (over) and pick 7 × 6 = 42."}}, {"type": "order", "kick": "Put in order", "title": "Steps for 50 ÷ 8", "text": "Tap the steps in the right order.", "steps": ["Ask: 8 × what gets close to 50 without going over?", "8 × 6 = 48 (8 × 7 = 56 is too big)", "Subtract: 50 − 48 = 2", "Check: 2 is smaller than 8, so no more groups fit", "So write the answer: 50 ÷ 8 = 6 R 2"], "why": "Find the biggest fact that fits, subtract, check the remainder, then write it.", "hint": "You can't subtract until you know which fact fits. What comes first?", "notes": {"do": "She says all five steps out loud from memory BEFORE tapping. Then she taps.", "ask": "\"Why do we check that 2 is smaller than 8?\"", "listen": "Find the fact, subtract, check, write. Those four words are what you want her to keep."}}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"type": "fill", "q": "The amount left over after dividing is called the ____.", "answers": ["remainder", "the remainder"], "why": "The <i>remainder</i> is the part left over.", "no": "It starts with r. On paper we write just its first letter."}, {"q": "Fresh water was <b>scarce</b> on the long voyage. What does that tell you?", "choices": ["There was a surplus of water.", "There was very little water.", "The water was salty.", "The water was shared evenly."], "a": 1, "why": "<i>Scarce</i> means hard to find because there is very little.", "no": ["A surplus is extra. Scarce is the opposite.", null, "Scarce tells how much, not how it tastes.", "Scarce does not tell how it was shared."]}, {"q": "Hiccup <b>hesitated</b> at the edge of the cliff. Which word means the <b>opposite</b> of hesitated?", "choices": ["paused", "worried", "rushed ahead", "looked down"], "a": 2, "why": "To <i>hesitate</i> is to stop for a moment; rushing ahead is the opposite.", "no": ["Paused means almost the same as hesitated.", "Worry might be why he hesitated, but it is not the opposite.", null, "Looking down is a different action, not the opposite."]}], "notes": {"ask": "\"What clue word helped?\" Then: \"Use <i>surplus</i> and <i>remainder</i> in one sentence about our beans.\"", "listen": "Something like: \"We had a surplus of 2 beans, which was the remainder.\""}}, {"type": "tap", "kick": "Exit ticket", "title": "Show me before you go", "text": "On your own. No help this time.", "items": [{"type": "fill", "q": "Finish the family: 7 × 8 = 56, 8 × 7 = 56, 56 ÷ 7 = 8, and 56 ÷ 8 = ____", "answers": ["7", "seven"], "why": "8 × 7 = 56, so 56 ÷ 8 = 7.", "no": "Which number is not used yet?"}, {"type": "fill", "q": "<b>35 ÷ 8</b> = ____", "answers": ["4 R 3", "4 remainder 3", "4 rem 3"], "why": "8 × 4 = 32 and 35 − 32 = 3. So 35 ÷ 8 = 4 R 3.", "no": "Find the biggest 8s fact that fits under 35 without going over.", "hint": "8 × 4 = 32. How many are left?", "placeholder": "like 4 R 2"}, {"type": "fill", "q": "How many <b>different</b> facts are in the 9, 9, 81 family? Type a number.", "answers": ["2", "two"], "why": "9 × 9 = 81 and 81 ÷ 9 = 9. The turn-arounds are the same facts.", "no": "Write them. Are any the same?"}], "notes": {"do": "She types these herself. Do not help. Note what she misses: that is where to start Thursday.", "listen": "If she misses the remainder item, she does the after-class lesson tonight anyway; the leftovers slide there reminds her of the steps."}}, {"type": "learn", "kick": "Wrap-up", "title": "Two nights, one plan", "text": "You have two nights before Thursday. Here is the plan.", "steps": [{"text": "<b>Tonight:</b> the After-class lesson for Lesson 10 (ends with Show What You Know), then the Lesson 10 Practice."}, {"text": "<b>Wednesday:</b> the Lesson 9 Practice, the Lesson 9 Packet, and page 1 of the Lesson 10 Packet."}, {"text": "<b>Both nights:</b> read for 15 minutes."}], "tip": "Bring your fact family cards on Thursday.", "notes": {"do": "Open the course page and walk through the Lesson 10 task list with her. Show her the links to the Lesson 9 practice and packet.", "say": "\"It looks like a lot, but it is split into two nights. Tonight is the after-class lesson and one practice. Wednesday is paper work.\"", "ask": "\"What is the first thing you will do tonight?\""}}], "win": "Fact families and leftovers: you handled both like a pro!", "prev": "bb-bailey-L09", "prevTitle": "Lesson 9"});</script></body></html>
