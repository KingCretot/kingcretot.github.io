<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 8</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Pick the Smartest Method</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Pick the optimal method, then scrutinize your answer.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 8", "title": "Pick the Smartest Method", "mastery": 90, "color": "#8E44AD", "questions": [{"q": "Which problem can you just <b>know</b> as a basic fact?", "choices": ["18 × 9", "80 × 19", "8 × 9", "89 × 8"], "a": 2, "why": "8 × 9 = 72 is a basic fact.", "no": ["18 is bigger than 10. Break it apart.", "Both numbers are too big for a basic fact.", null, "89 needs boxes."]}, {"q": "Break apart in your head: <b>13 × 8 = 80 + ___ = ?</b>", "choices": ["24, so 13 × 8 = 104", "14, so 13 × 8 = 94", "3, so 13 × 8 = 83", "24, so 13 × 8 = 114"], "a": 0, "why": "10 × 8 = 80 and 3 × 8 = 24. 80 + 24 = <b>104</b>.", "no": [null, "3 × 8 is 24, not 14.", "The 3 must be multiplied by 8.", "80 + 24 = 104. Add again."]}, {"q": "What is <b>456 × 3</b>?", "choices": ["459", "1,358", "1,350", "1,368"], "a": 3, "why": "1,200 + 150 + 18 = <b>1,368</b>.", "no": ["You added 456 + 3.", "150 + 18: 5 tens + 1 ten = 6 tens. 168, so 1,368.", "You left out the ones box: 6 × 3 = 18.", null]}, {"q": "What is <b>34 × 25</b>?", "choices": ["620", "850", "59", "770"], "a": 1, "why": "600 + 80 + 150 + 20 = <b>850</b>.", "no": ["600 + 20 uses only two of the four boxes.", null, "You added 34 + 25.", "You left out the 80 box (4 × 20)."]}, {"q": "Fishlegs wrote <b>91 × 7 = 630 + 7 = 637</b>. Is his work valid?", "choices": ["No. It should be 63 + 7 = 70.", "No. 1 × 7 is 8, so it is 638.", "Yes. 90 × 7 = 630 and 1 × 7 = 7."], "a": 2, "why": "Every box is right: <b>637</b>.", "no": ["90 × 7 is 630. Keep the zero.", "1 × 7 = 7.", null]}, {"q": "Hiccup wrote <b>58 × 7 = 350 + 54 = 404</b>. What is the blunder?", "choices": ["8 × 7 is 56, not 54. The answer is 406.", "50 × 7 is 35, not 350.", "There is no blunder.", "He should add 58 + 7."], "a": 0, "why": "350 + 56 = <b>406</b>. Remember 5, 6, 7, 8: 56 = 7 × 8.", "no": [null, "50 × 7 = 350 is correct.", "Check the ones box: 8 × 7.", "The sign says multiply."]}, {"q": "Snotlout added 6 again and again for <b>14 × 6</b> and got 78. What happened?", "choices": ["He added one 6 too many. The answer is 72.", "He added only thirteen 6s. 14 × 6 = 60 + 24 = 84.", "There is no blunder. 78 is right."], "a": 1, "why": "One more 6 makes <b>84</b>.", "no": ["78 is thirteen 6s. That is one too <b>few</b>.", null, "14 × 6 = 60 + 24 = 84."]}, {"q": "The tribe has <b>7</b> boats with <b>36</b> rowers each and <b>4</b> boats with <b>18</b> rowers each. How many rowers in all?", "choices": ["252", "324", "65"], "a": 1, "why": "7 × 36 = 252 and 4 × 18 = 72. 252 + 72 = <b>324</b>.", "no": ["That is only the 7 big boats. Add the 4 smaller boats too.", null, "You added all the numbers. Equal groups means multiply first."]}, {"q": "Which answer is reasonable for <b>48 × 21</b>?", "choices": ["108", "10,080", "1,008"], "a": 2, "why": "It is between 800 and 1,500. (800 + 160 + 40 + 8 = 1,008.)", "no": ["Too small: 40 × 20 is already 800.", "Too big: 50 × 30 is only 1,500.", null]}, {"q": "A <b>deliberate</b> choice is one you make …", "choices": ["by accident", "very loudly", "without looking", "on purpose, after thinking"], "a": 3, "why": "Deliberate means done on purpose, after careful thought.", "no": ["That is the opposite of deliberate.", "Deliberate is about thinking, not sound.", "Deliberate means you thought about it.", null]}, {"q": "Which sentence uses <b>method</b> correctly?", "choices": ["My method for ×9 facts is ×10 minus one group.", "The method of 6 × 7 is 42.", "A method is a mistake you find in someone's work."], "a": 0, "why": "A method is a way of doing something.", "no": [null, "42 is the answer, not the method.", "That is a blunder."]}, {"q": "Which word means <b>a careless mistake</b>?", "choices": ["optimal", "valid", "blunder", "triumphant"], "a": 2, "why": "A blunder is a careless mistake.", "no": ["Optimal means the best choice.", "Valid means correct.", null, "Triumphant means proud after winning."]}]});</script></body></html>
