<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 17: What Do I Do with the Remainder?</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L17", "label": "Lesson 17", "title": "What Do I Do with the Remainder?", "goal": "I can decide what a remainder means in a story: round up, drop it, or make it the answer.", "date": "2026-12-15", "mastery": 90, "color": "#00A8A8", "slides": [{"type": "hello", "title": "What Do I Do with the Remainder?", "text": "Yesterday you found remainders. Today you decide what a remainder <b>means</b> in a story. Sometimes you round up, sometimes you drop it, and sometimes the remainder is the answer.", "visual": {"kind": "emoji", "text": "⛵➗🐉"}, "notes": {"do": "Set out: 50 dried beans, 8 cups (the boats), 3 sticky notes labeled <b>Round up</b>, <b>Drop it</b> and <b>Remainder is the answer</b>, whiteboard and marker, paper and pencil, her book.", "say": "\"Same division, three different answers. Today the story decides, and you are the one who reads the story.\"", "ask": "\"How did last night's Show What You Know go? What is the maximum remainder when you divide by 8?\" (7.)"}}, {"type": "talk", "kick": "Book Talk", "title": "Back to Berk", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["Tell what happened in the part you read since Monday.", "The Vikings of Berk live by the sea. How does the sea matter in the story? Give one example.", "Which part of the book would you like to see as a picture? Describe it with three details."], "starters": ["Since Monday, …", "The sea matters because …", "I would picture … It has …"], "notes": {"do": "6 minutes. She holds the book and finds pages.", "ask": "\"How does the sea matter in the story?\"", "listen": "A real detail from the book. The last prompt builds description skills: three specific details, not \"it was cool\"."}}, {"type": "recall", "kick": "Warm-up", "title": "Yesterday's long division", "text": "Solve on paper. Type the answer with R.", "items": [{"type": "fill", "q": "Use long division: <b>85 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["14 R 1", "14R1", "14 r 1", "14 remainder 1", "14 rem 1", "14 r1"], "why": "85 ÷ 6 = 14 R 1. Check: 14 × 6 + 1 = 85.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 6s fit in 8?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n6 ) 85"}}, {"type": "fill", "q": "Check <b>73 ÷ 2 = 36 R 1</b>: &nbsp; 36 × 2 + 1 = ____", "answers": ["73"], "why": "36 × 2 = 72, and 72 + 1 = 73. It matches the dividend, so the answer is right.", "no": "Multiply 36 × 2 first. Then add the remainder 1."}], "notes": {"do": "She types the answers herself.", "say": "Praise each step out loud as she writes it.", "listen": "85 ÷ 6 = 14 R 1. Check 36 × 2 + 1 = 73."}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read it out loud. Then use it in your own sentence.", "words": [{"word": "context", "pos": "noun", "emoji": "🧭", "meaning": "The words and facts around something that help explain what it means.", "example": "The <b>context</b> of the story tells you what to do with the remainder."}, {"word": "capacity", "pos": "noun", "emoji": "🛶", "meaning": "The most that something can hold.", "example": "Each longship has a <b>capacity</b> of 8 Vikings."}, {"word": "round up", "pos": "verb", "emoji": "⬆️", "meaning": "In a remainder story, to go up to the next whole number so that everyone or everything fits.", "example": "50 Vikings, 8 to a boat: 6 R 2, so <b>round up</b> to 7 boats."}, {"word": "discard", "pos": "verb", "emoji": "🗑️", "meaning": "To throw away or not use something.", "example": "For full barrels only, <b>discard</b> the remainder."}, {"word": "adequate", "pos": "adjective", "emoji": "👌", "meaning": "Enough for what is needed.", "example": "6 boats are not <b>adequate</b> for 50 Vikings. They need 7."}, {"word": "practical", "pos": "adjective", "emoji": "🧰", "meaning": "Sensible and useful in real life.", "example": "\"6 R 2 boats\" is not a <b>practical</b> answer. You can't rent part of a boat."}, {"word": "voyage", "pos": "noun", "emoji": "⛵", "meaning": "A long trip, especially by sea.", "example": "The Vikings packed their longships for a <b>voyage</b> across the sea."}], "notes": {"do": "She reads each card and makes her own sentence. Write <b>Round up · Drop it · Remainder is the answer</b> on the whiteboard.", "say": "\"Context is the most important word today. The context tells you what to do with the remainder.\"", "ask": "\"What is the capacity of your water bottle?\" \"Where would you go on a voyage?\"", "listen": "<i>Capacity</i>: the most it can hold. <i>Practical</i>: makes sense in real life."}}, {"type": "learn", "kick": "Learn", "title": "One division, three answers", "text": "Every story below is <b>50 ÷ 8 = 6 R 2</b>. Read the context. The answer changes!", "visual": {"kind": "uneven", "sets": [8, 8, 8, 8, 8, 8, 2], "emoji": "🫘"}, "steps": [{"text": "<b>50 Vikings</b> sail. Each boat has a capacity of <b>8</b>. How many boats so everyone can go? 6 boats leave 2 Vikings on the beach. <b>Round up: 7 boats.</b>"}, {"text": "<b>50 fish</b> go into barrels of <b>8</b>. How many barrels are <b>full</b>? The 2 extra fish do not fill a barrel. <b>Drop it: 6 full barrels.</b>"}, {"text": "<b>50 cookies</b> are shared equally among <b>8</b> friends. How many cookies are <b>left over</b>? <b>The remainder is the answer: 2 cookies.</b>"}], "tip": "Solve first. Then read the question again and ask: what does it want?", "notes": {"do": "Hands-on: 50 beans into the 8 cups, 8 per cup, until she runs out (6 full cups, 2 beans in her hand). Leave it on the table for all three stories. She sticks the matching sticky note on the table for each story.", "say": "Praise each one she gets: \"Yes! The Vikings can't stay on the beach.\"", "ask": "For each: \"Can those 2 be left behind? Do they make a full group? Or is the question asking about them?\"", "listen": "The same beans give 7, 6 or 2. She explains why with the context."}}, {"type": "tap", "kick": "Talk it through", "title": "Your turn: 38 ÷ 5 = 7 R 3", "text": "All three use <b>38 ÷ 5 = 7 R 3</b>. Read the context. Type the answer.", "items": [{"type": "fill", "q": "<b>38 Vikings</b> row across the fjord. Each boat holds <b>5</b>. How many boats do they need so everyone gets across?", "answers": ["8", "eight", "8 boats"], "why": "38 ÷ 5 = 7 R 3. 7 is not enough: 3 would be left out. Round up: <b>8 boats</b>.", "no": "Divide first: 38 ÷ 5. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"type": "fill", "q": "Fishlegs packs <b>38 eggs</b> into nests of <b>5</b>. How many nests are <b>full</b>?", "answers": ["7", "seven", "7 nests"], "why": "38 ÷ 5 = 7 R 3. Only 7 are full; the 3 left over cannot make another one. Drop the remainder: <b>7 nests</b>.", "no": "Divide first: 38 ÷ 5. Then read the question again: what does it ask for?", "hint": "Can the leftover make a full one? If not, do not count it."}, {"type": "fill", "q": "Stoick shares <b>38 apples</b> equally among <b>5</b> dragons. How many apples are <b>left over</b>?", "answers": ["3", "three", "3 apples"], "why": "38 ÷ 5 = 7 R 3. The question asks what is left over, so the answer is the remainder: <b>3 apples</b>.", "no": "Divide first: 38 ÷ 5. Then read the question again: what does it ask for?", "hint": "The question asks how many are LEFT. Which part of the answer is that?"}], "notes": {"do": "She types each one. Before she types, she says which sticky note fits.", "say": "Praise the decision first, then the answer.", "listen": "8 boats, 7 nests, 3 apples."}}, {"type": "learn", "kick": "Learn", "title": "Round up", "text": "When <b>everyone or everything must fit</b> (boats, trips, tables, vans), the leftovers still need a place. Add 1 to the quotient.", "steps": [{"text": "<b>130 Vikings</b> sail on a voyage. Each longship has a capacity of <b>8</b>. How many longships?"}, {"text": "Solve: 130 ÷ 8 = 16 R 2.", "visual": {"kind": "longdiv", "text": "     16 R2\n   ____\n8 ) 130\n    -8\n    --\n     50\n    -48\n    ---\n      2"}}, {"text": "16 longships are not adequate: 2 Vikings would stay home. <b>Round up: 17 longships.</b>"}], "tip": "Clue words: \"so everyone\", \"all of them\", \"how many trips\".", "notes": {"do": "She solves 130 ÷ 8 on paper before you reveal Step 2. Praise each long division step.", "ask": "\"Would 16 R 2 longships be a practical answer?\" (No. You can't sail part of a ship.)", "listen": "\"Everyone must go, so I round up.\""}}, {"type": "learn", "kick": "Learn", "title": "Drop it", "text": "When the question asks for <b>full</b> groups (full boxes, whole sets, how many you can buy), the leftovers cannot make another one. Discard the remainder.", "steps": [{"text": "Hiccup has <b>100 arrows</b>. A quiver holds <b>6</b>. How many quivers can he fill?"}, {"text": "Solve: 100 ÷ 6 = 16 R 4.", "visual": {"kind": "longdiv", "text": "     16 R4\n   ____\n6 ) 100\n    -6\n    --\n     40\n    -36\n    ---\n      4"}}, {"text": "4 arrows cannot fill a quiver. <b>Drop it: 16 full quivers.</b>"}], "tip": "Clue words: \"full\", \"complete\", \"how many can he buy / make\".", "notes": {"do": "She solves 100 ÷ 6 on paper first.", "ask": "\"Why not 17?\" (The 17th quiver would have only 4 arrows; it is not full.)", "listen": "\"Only full ones count, so I drop the 4.\""}}, {"type": "learn", "kick": "Learn", "title": "The remainder is the answer", "text": "When the question asks how many are <b>left over</b>, the answer is the remainder itself.", "steps": [{"text": "Gobber shares <b>75 nails</b> equally among <b>4</b> workers. He keeps the nails that are left over. How many does he keep?"}, {"text": "Solve: 75 ÷ 4 = 18 R 3.", "visual": {"kind": "longdiv", "text": "    18 R3\n   ___\n4 ) 75\n   -4\n   --\n    35\n   -32\n   ---\n     3"}}, {"text": "Each worker gets 18. <b>Gobber keeps 3 nails.</b> The remainder is the answer."}], "tip": "Clue words: \"left over\", \"keeps the rest\", \"how many are left\".", "notes": {"ask": "\"What does the 18 tell you here?\" (How many each worker gets. It is not what the question asks.)", "listen": "She can say what BOTH numbers mean in the context."}}, {"type": "sort", "kick": "Sort it", "title": "What does the context say?", "text": "Read each story. Tap it, then tap the box. You do not need to solve it.", "buckets": ["⬆️ Round up", "🗑️ Drop it", "🍪 Remainder is the answer"], "items": [{"text": "45 Vikings sit at tables of 6. How many tables are needed?", "b": 0, "why": "Every Viking needs a seat, so round up.", "hint": "Can some Vikings stand all night?"}, {"text": "45 pickles go in jars of 6. How many jars are full?", "b": 1, "why": "Only full jars count, so drop the remainder.", "hint": "Does the question ask for full jars?"}, {"text": "45 stickers are shared equally among 6 kids. How many are left?", "b": 2, "why": "The question asks what is left, so the remainder is the answer.", "hint": "Does the question ask how many are left?"}, {"text": "Toothless carries 4 fish per trip. How many trips to carry 29 fish?", "b": 0, "why": "All the fish must be carried, so one more trip: round up.", "hint": "Can some fish be left behind?"}, {"text": "Fish cost 9 cents. Hiccup has 58 cents. How many fish can he buy?", "b": 1, "why": "He cannot buy part of a fish, so drop the remainder.", "hint": "Can he buy a fish with the cents left over?"}, {"text": "Stoick shares 70 coins equally among 8 warriors and keeps the rest. How many does he keep?", "b": 2, "why": "He keeps what is left over: the remainder.", "hint": "What does Stoick keep?"}], "done": "Everyone must fit: round up. Only full groups: drop it. What is left: the remainder.", "notes": {"do": "She reads each story out loud and points to the sticky note on the table before she taps.", "say": "Praise each decision: \"Yes, the Vikings all need a seat.\"", "listen": "She uses the clue words: \"needed\", \"full\", \"left\"."}}, {"type": "tap", "kick": "Guided practice", "title": "Solve and decide", "text": "Solve on paper. Decide what to do with the remainder. Type the answer.", "items": [{"type": "fill", "q": "<b>93 Vikings</b> are going on a voyage. Each ship holds <b>8</b>. How many ships do they need?", "answers": ["12", "twelve", "12 ships"], "why": "93 ÷ 8 = 11 R 5. 11 is not enough: 5 would be left out. Round up: <b>12 ships</b>.", "no": "Divide first: 93 ÷ 8. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"type": "fill", "q": "Fishlegs has <b>87 dragon cards</b>. <b>6</b> cards fill a page. How many pages can he fill completely?", "answers": ["14", "14 pages"], "why": "87 ÷ 6 = 14 R 3. Only 14 are full; the 3 left over cannot make another one. Drop the remainder: <b>14 pages</b>.", "no": "Divide first: 87 ÷ 6. Then read the question again: what does it ask for?", "hint": "Can the leftover make a full one? If not, do not count it."}, {"type": "fill", "q": "Gobber puts <b>66 nails</b> equally into <b>4</b> boxes. How many nails are left over?", "answers": ["2", "two", "2 nails"], "why": "66 ÷ 4 = 16 R 2. The question asks what is left over, so the answer is the remainder: <b>2 nails</b>.", "no": "Divide first: 66 ÷ 4. Then read the question again: what does it ask for?", "hint": "The question asks how many are LEFT. Which part of the answer is that?"}], "notes": {"do": "She does the long division on paper, then says which sticky note, then types.", "say": "Praise the long division steps AND the decision.", "listen": "93 ÷ 8 = 11 R 5 → 12 ships; 87 ÷ 6 = 14 R 3 → 14 pages; 66 ÷ 4 = 16 R 2 → 2 nails."}}, {"type": "tap", "kick": "Guided practice", "title": "Which answer makes sense?", "items": [{"q": "<b>200 Vikings</b> sail. Each longship holds <b>9</b>. How many longships are needed? <br>200 ÷ 9 = 22 R 2. Which answer makes sense?", "choices": ["22 R 2 longships", "23 longships", "2 longships", "22 longships"], "a": 1, "why": "200 ÷ 9 = 22 R 2. Everyone must fit, so round up to 23.", "no": ["You cannot have 22 R 2 longships. A story answer needs a whole number that makes sense.", null, "2 is the remainder, not the answer to this question.", "With only 22, the 2 left over would not fit."]}, {"q": "Hiccup has <b>60 cents</b>. A map costs <b>7 cents</b>. How many maps can he buy? What do you do with the remainder?", "choices": ["The remainder is the answer", "Round up: add 1 to the quotient", "Drop the remainder: use only the quotient"], "a": 2, "why": "Only full groups count, so the leftovers are dropped.", "no": ["Read the question again: does it ask how many are left over?", "Read the question again: does it ask about everything fitting, or only full groups?", null]}], "notes": {"ask": "\"Why is 22 R 2 longships not practical?\"", "listen": "23 longships; drop it for the maps (8 maps, 4 cents left)."}}, {"type": "order", "kick": "Put in order", "title": "Remainder story steps", "text": "Tap the steps in the order you use them.", "steps": ["Read the whole story.", "Write the division.", "Solve it with long division: quotient and remainder.", "Read the question again: what does it ask for?", "Decide: round up, drop it, or the remainder is the answer.", "Write the answer with a label."], "why": "Read, divide, solve, reread, decide, label.", "hint": "You solve first, then read the question again to decide.", "notes": {"do": "She says all six steps from memory before tapping.", "listen": "Reread before deciding."}}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"q": "A longship can hold at most 30 Vikings. What is that number called?", "choices": ["its voyage", "its capacity", "its context", "its remainder"], "a": 1, "why": "The <i>capacity</i> is the most something can hold.", "no": ["A voyage is a long trip.", null, "Context is the facts around something.", "A remainder is what is left over in a division."]}, {"type": "fill", "q": "\"16 R 4 quivers\" is not a ____ answer, because you count quivers in whole numbers. (Use a word from your word cards that means <i>sensible in real life</i>.)", "answers": ["practical"], "why": "<i>Practical</i> means sensible and useful in real life.", "no": "It starts with pr-."}, {"q": "Which word means <i>to throw away or not use</i>?", "choices": ["round up", "adequate", "discard", "voyage"], "a": 2, "why": "To <i>discard</i> is to throw away or not use.", "no": ["Round up means go up to the next whole number.", "Adequate means enough.", null, "A voyage is a long trip."]}], "notes": {"ask": "\"Use <i>adequate</i> in a sentence about food for a trip.\" \"Use <i>context</i> in a sentence about reading.\"", "listen": "She uses each word correctly in her own sentence."}}, {"type": "tap", "kick": "Exit ticket", "title": "Show me before you go", "text": "On your own. No help this time.", "items": [{"type": "fill", "q": "<b>74 dragons</b> need pens. Each pen holds <b>6</b>. How many pens are needed?", "answers": ["13", "13 pens"], "why": "74 ÷ 6 = 12 R 2. 12 is not enough: 2 would be left out. Round up: <b>13 pens</b>.", "no": "Divide first: 74 ÷ 6. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"type": "fill", "q": "<b>97 fish</b> are packed in barrels of <b>8</b>. How many barrels are full?", "answers": ["12", "twelve", "12 barrels"], "why": "97 ÷ 8 = 12 R 1. Only 12 are full; the 1 left over cannot make another one. Drop the remainder: <b>12 barrels</b>.", "no": "Divide first: 97 ÷ 8. Then read the question again: what does it ask for?", "hint": "Can the leftover make a full one? If not, do not count it."}, {"type": "fill", "q": "<b>86 apples</b> are shared equally among <b>7</b> dragons. How many apples are left over?", "answers": ["2", "two", "2 apples"], "why": "86 ÷ 7 = 12 R 2. The question asks what is left over, so the answer is the remainder: <b>2 apples</b>.", "no": "Divide first: 86 ÷ 7. Then read the question again: what does it ask for?", "hint": "The question asks how many are LEFT. Which part of the answer is that?"}], "notes": {"do": "She works alone on paper and types each answer.", "listen": "13 pens; 12 barrels; 2 apples. Note which kind she misses."}}, {"type": "learn", "kick": "Wrap-up", "title": "Your plan until Thursday", "text": "Solve first. Then the <b>context</b> tells you what to do with the remainder.", "steps": [{"text": "<b>Tonight:</b> the After-class lesson (ends with Show What You Know, you need 90) and the Lesson 17 Practice."}, {"text": "<b>Wednesday:</b> the Lesson 16 Practice, the Lesson 16 Packet, page 1 of the Lesson 17 Packet, and the Pathways reading lesson."}, {"text": "<b>Tuesday and Wednesday:</b> read 15 minutes each night."}], "tip": "Thursday is the last lesson before the break. Bring your best long division!", "notes": {"do": "Open the course page and go through the Lesson 17 task list with her (and with Tia if she is there).", "say": "\"It looks like a lot, so we split it over two nights.\"", "ask": "\"What are the three things you can do with a remainder?\""}}], "win": "You let the context decide, and every answer made sense!", "prev": "bb-bailey-L16", "prevTitle": "Lesson 16"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTim
