<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 10: Fact Families and Leftovers</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L10", "label": "Lesson 10", "title": "Fact Families and Leftovers", "goal": "I can write all the facts in a fact family and tell what is left over when things don't share evenly.", "date": "2026-11-10", "mastery": 90, "color": "#E67E22", "slides": [{"type": "hello", "title": "Fact Families and Leftovers", "text": "Yesterday you learned that division undoes multiplication. Today three numbers make a whole <b>family</b> of four facts. Then you find out what happens when things do not share evenly.", "visual": {"kind": "emoji", "text": "🔺👨‍👩‍👧‍👦🐟"}}, {"type": "talk", "kick": "Book Talk", "title": "Characters on Berk", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["How has Hiccup changed since the start of the book? Give one example.", "What does Toothless want? Does Hiccup want the same thing? How does that cause conflict?", "Read me one sentence that shows how another Viking feels about Hiccup. What words give the feeling away?"], "starters": ["At the start, Hiccup … but now …", "Toothless wants … but Hiccup wants …", "The words … show that …"]}, {"type": "recall", "kick": "Remember?", "title": "Yesterday's big idea", "items": [{"q": "What number is hiding in this fact triangle?", "choices": ["8", "9", "64", "80"], "a": 1, "why": "8 × 9 = 72, so 72 ÷ 8 = 9.", "no": ["8 × 8 = 64, not 72.", null, "64 is 72 − 8.", "80 is 72 + 8."], "visual": {"kind": "triangle", "a": 8, "b": "?", "c": 72}}, {"q": "In <b>56 ÷ 8 = 7</b>, what is the 8 called?", "choices": ["the dividend", "the quotient", "the divisor"], "a": 2, "why": "The divisor is the number you divide by.", "no": ["The dividend is 56, the number being divided.", "The quotient is 7, the answer.", null]}, {"q": "Stoick packed <b>provisions</b> for the trip. Then he had to <b>ration</b> them. What happened?", "choices": ["He gave out the supplies in small amounts so they would last.", "He threw the supplies overboard.", "He ate everything on the first day.", "He bought more supplies."], "a": 0, "why": "Provisions are packed supplies; to ration is to give them out in small, set amounts.", "no": [null, "Rationing keeps supplies, it does not throw them away.", "That is the opposite of rationing.", "Rationing means making what you have last longer."]}]}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read it out loud. Then tell me where you could use the word outside of math.", "words": [{"word": "fact family", "pos": "noun", "emoji": "🔺", "meaning": "A set of related multiplication and division facts made from the same three numbers.", "example": "6 × 8 = 48, 8 × 6 = 48, 48 ÷ 6 = 8 and 48 ÷ 8 = 6 are one <b>fact family</b>."}, {"word": "remainder", "pos": "noun", "emoji": "🍪", "meaning": "The amount left over when a number cannot be split into equal groups.", "example": "30 ÷ 7 = 4 R 2. The <b>remainder</b> is 2."}, {"word": "evenly", "pos": "adverb", "emoji": "⚖️", "meaning": "In equal parts, with nothing left over.", "example": "48 fish split <b>evenly</b> among 6 dragons: 8 each."}, {"word": "surplus", "pos": "noun", "emoji": "📦", "meaning": "An extra amount, more than what is needed.", "example": "After every dragon was fed, there was a <b>surplus</b> of 3 fish."}, {"word": "scarce", "pos": "adjective", "emoji": "🏜️", "meaning": "Hard to find because there is very little of it.", "example": "In the middle of winter, fresh food was <b>scarce</b>."}, {"word": "hesitate", "pos": "verb", "emoji": "⏸️", "meaning": "To stop or wait for a moment before doing something, because you are unsure.", "example": "Do not <b>hesitate</b>: if you know 7 × 8 = 56, you know 56 ÷ 8."}, {"word": "negotiate", "pos": "verb", "emoji": "🤝", "meaning": "To talk with someone to reach an agreement.", "example": "Instead of fighting, the two tribes agreed to <b>negotiate</b>."}]}, {"type": "learn", "kick": "Learn", "title": "Three numbers, four facts", "text": "The numbers <b>6, 8 and 48</b> make a <b>fact family</b>. From one triangle you get four facts.", "visual": {"kind": "triangle", "a": 6, "b": 8, "c": 48}, "steps": [{"text": "<b>6 × 8 = 48</b>"}, {"text": "<b>8 × 6 = 48</b> (the turn-around fact)"}, {"text": "<b>48 ÷ 6 = 8</b>"}, {"text": "<b>48 ÷ 8 = 6</b>"}], "tip": "In both division facts, the biggest number (the top of the triangle) comes first."}, {"type": "tap", "kick": "Try it", "title": "Who belongs in the family?", "items": [{"q": "Which fact belongs in the same family as <b>9 × 7 = 63</b>?", "choices": ["63 − 7 = 56", "7 ÷ 63 = 9", "63 ÷ 9 = 7", "9 × 8 = 72"], "a": 2, "why": "63 ÷ 9 = 7 uses the same three numbers: 7, 9 and 63.", "no": ["Subtraction facts are not in a multiplication and division family.", "Backward! The biggest number must come first in division.", null, "That fact uses 8 and 72, not 7 and 63."]}, {"q": "How many <b>different</b> facts are in this fact family?", "choices": ["4", "2", "3", "1"], "a": 1, "why": "7 × 7 = 49 and 49 ÷ 7 = 7. Turning them around gives the same facts, so there are only 2.", "no": ["Try writing them. 7 × 7 turned around is still 7 × 7.", null, "Multiplication gives one fact and division gives one fact. Count again.", "There is a division fact too: 49 ÷ 7 = 7."], "visual": {"kind": "triangle", "a": 7, "b": 7, "c": 49}}, {"q": "Which list is a <b>complete</b> fact family?", "choices": ["8 × 9 = 72, 9 × 8 = 72, 72 ÷ 8 = 9, 72 ÷ 6 = 12", "8 × 9 = 72, 72 ÷ 9 = 8, 9 ÷ 72 = 8, 8 + 9 = 17", "8 × 9 = 72, 9 × 9 = 81, 72 ÷ 8 = 9, 81 ÷ 9 = 9", "8 × 9 = 72, 9 × 8 = 72, 72 ÷ 8 = 9, 72 ÷ 9 = 8"], "a": 3, "why": "All four facts use only 8, 9 and 72.", "no": ["72 ÷ 6 = 12 is true, but 6 and 12 are not in this family.", "9 ÷ 72 is backward, and adding is not in the family.", "81 is a different family.", null]}]}, {"type": "sort", "kick": "Sort it", "title": "The 6, 9, 54 family", "text": "Tap a fact. Does it belong in the <b>6, 9, 54</b> fact family?", "buckets": ["✅ In the 6, 9, 54 family", "❌ Not in this family"], "items": [{"text": "54 ÷ 6 = 9", "b": 0, "why": "Uses 6, 9 and 54, and it is true.", "hint": "Which three numbers does it use? Is it true?"}, {"text": "54 ÷ 6 = 8", "b": 1, "why": "6 × 8 = 48, not 54. A false fact is not in any family.", "hint": "Check it: 6 × 8 = ?"}, {"text": "6 × 9 = 54", "b": 0, "why": "Same three numbers, and it is true.", "hint": "Look at the three numbers."}, {"text": "6 ÷ 54 = 9", "b": 1, "why": "Backward. In division the biggest number comes first.", "hint": "Which number should come first in division?"}, {"text": "45 ÷ 9 = 5", "b": 1, "why": "45 is not 54. The digits got switched.", "hint": "Read the first number carefully: 45 or 54?"}, {"text": "54 ÷ 9 = 6", "b": 0, "why": "Uses 6, 9 and 54, and it is true.", "hint": "9 × 6 = 54?"}, {"text": "9 × 6 = 54", "b": 0, "why": "The turn-around fact belongs too.", "hint": "Does turning it around change the numbers?"}], "done": "A fact belongs only if it uses the same three numbers AND it is true."}, {"type": "learn", "kick": "Learn", "title": "When it does not share evenly", "text": "Hiccup has <b>30 fish</b> for <b>7 dragons</b>. Every dragon must get the same number. How many does each dragon get?", "visual": {"kind": "groups", "groups": 7, "each": 4, "emoji": "🐟", "label": "7 dragons get 4 fish each. That uses 28 fish."}, "steps": [{"text": "Ask: 7 × what gets close to 30 <b>without going over</b>?"}, {"text": "7 × 4 = 28 ✔ (7 × 5 = 35 is too many)."}, {"text": "30 − 28 = <b>2 fish left over</b>. That is the <b>remainder</b>."}, {"text": "Write it like this:", "visual": {"kind": "bigtext", "text": "30 ÷ 7 = 4 R 2", "sub": "4 fish each, 2 left over"}}], "tip": "The remainder must be <b>smaller than the divisor</b>. If 7 or more were left over, every dragon could get one more fish!"}, {"type": "build", "kick": "Build it", "title": "Dinner for six dragons", "text": "Hiccup has <b>26 fish</b> and <b>6 dragons</b>. Give every dragon the same number of fish, as many as you can. Make the groups.", "groups": 6, "each": 4, "emoji": "🐟", "why": "6 × 4 = 24 fish handed out. 26 − 24 = 2 left over. So <b>26 ÷ 6 = 4 R 2</b>.", "hint": "6 dragons means 6 groups. Is 6 × 5 = 30 more than 26? Then try 4 in each."}, {"type": "tap", "kick": "Try it", "title": "Leftovers", "items": [{"q": "<b>45 ÷ 7</b> = ?", "choices": ["6 R 2", "6 R 3", "5 R 10", "6"], "a": 1, "why": "7 × 6 = 42 and 45 − 42 = 3. So 45 ÷ 7 = 6 R 3.", "no": ["Check the subtraction: 45 − 42 = 3.", null, "10 left over is more than 7. One more group fits.", "You forgot the leftovers. 7 × 6 = 42, not 45."]}, {"q": "Fishlegs says <b>38 ÷ 6 = 5 R 8</b>. What is wrong?", "choices": ["8 left over is enough for one more group of 6. It should be 6 R 2.", "Nothing. 6 × 5 + 8 = 38.", "He should have multiplied 38 × 6.", "The remainder should be 0."], "a": 0, "why": "6 × 6 = 36 and 38 − 36 = 2. So 38 ÷ 6 = 6 R 2.", "no": [null, "The math adds up, but a remainder can never be as big as the divisor.", "Multiplying makes a bigger number. This is a division problem.", "6 × 6 = 36, so 2 is left over, not 0."]}, {"q": "Which division has <b>no remainder</b>?", "choices": ["52 ÷ 8", "43 ÷ 6", "63 ÷ 9", "60 ÷ 7"], "a": 2, "why": "9 × 7 = 63 exactly, so nothing is left over.", "no": ["8 × 6 = 48, so 4 are left over.", "6 × 7 = 42, so 1 is left over.", null, "7 × 8 = 56, so 4 are left over."]}]}, {"type": "order", "kick": "Put in order", "title": "Steps for 50 ÷ 8", "text": "Tap the steps in the right order.", "steps": ["Ask: 8 × what gets close to 50 without going over?", "8 × 6 = 48 (8 × 7 = 56 is too big)", "Subtract: 50 − 48 = 2", "Check: 2 is smaller than 8, so no more groups fit", "So write the answer: 50 ÷ 8 = 6 R 2"], "why": "Find the biggest fact that fits, subtract, check the remainder, then write it.", "hint": "You can't subtract until you know which fact fits. What comes first?"}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"q": "Which is the <b>math</b> word for the amount left over after dividing?", "choices": ["quotient", "remainder", "dividend", "fact family"], "a": 1, "why": "The <i>remainder</i> is the part left over.", "no": ["The quotient is the answer, not the leftovers.", null, "The dividend is the number you start with.", "A fact family is a set of related facts."]}, {"q": "Fresh water was <b>scarce</b> on the long voyage. What does that tell you?", "choices": ["There was very little water.", "There was a surplus of water.", "The water was salty.", "The water was shared evenly."], "a": 0, "why": "<i>Scarce</i> means hard to find because there is very little.", "no": [null, "A surplus is extra. Scarce is the opposite.", "Scarce tells how much, not how it tastes.", "Scarce does not tell how it was shared."]}, {"q": "Hiccup <b>hesitated</b> at the edge of the cliff. Which word means the <b>opposite</b> of hesitated?", "choices": ["paused", "worried", "looked down", "rushed ahead"], "a": 3, "why": "To <i>hesitate</i> is to stop for a moment; rushing ahead is the opposite.", "no": ["Paused means almost the same as hesitated.", "Worry might be why he hesitated, but it is not the opposite.", "Looking down is a different action, not the opposite.", null]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "Which fact is in the same family as <b>7 × 8 = 56</b>?", "choices": ["63 ÷ 7 = 9", "8 ÷ 56 = 7", "56 ÷ 8 = 7", "56 − 8 = 48"], "a": 2, "why": "56 ÷ 8 = 7 uses the same three numbers: 7, 8 and 56.", "no": ["True, but 63 and 9 are not in this family.", "Backward. The biggest number comes first.", null, "Subtraction is not in a multiplication and division family."]}, {"q": "What is the missing number?", "choices": ["6", "7", "30", "5"], "a": 0, "why": "6 × 6 = 36, so 36 ÷ 6 = 6. A square like this has only two facts.", "no": [null, "6 × 7 = 42, not 36.", "30 is 36 − 6.", "6 × 5 = 30, not 36."], "visual": {"kind": "triangle", "a": "?", "b": 6, "c": 36}}, {"q": "Which list is the <b>complete</b> fact family for 6, 7 and 42?", "choices": ["6 × 7 = 42, 7 × 6 = 42, 42 ÷ 6 = 7, 6 ÷ 42 = 7", "6 × 7 = 42, 7 × 6 = 42, 42 ÷ 6 = 7, 42 ÷ 7 = 6", "6 × 7 = 42, 42 ÷ 7 = 6, 6 + 7 = 13, 13 − 7 = 6", "6 × 7 = 42, 7 × 7 = 49, 42 ÷ 7 = 6, 49 ÷ 7 = 7"], "a": 1, "why": "Two multiplication facts and two division facts, all using 6, 7 and 42.", "no": ["6 ÷ 42 is backward.", null, "Adding and subtracting are not in this family.", "49 belongs to a different family."]}, {"q": "<b>30 ÷ 8</b> = ?", "choices": ["4 R 2", "3", "3 R 6", "2 R 14"], "a": 2, "why": "8 × 3 = 24 and 30 − 24 = 6. So 30 ÷ 8 = 3 R 6.", "no": ["8 × 4 = 32. That is more than 30, so 4 groups do not fit.", "8 × 3 = 24. You forgot the 6 left over.", null, "14 left over is more than 8. Another group fits."]}, {"q": "<b>40 ÷ 6</b> = ?", "choices": ["7 R 2", "6", "5 R 10", "6 R 4"], "a": 3, "why": "6 × 6 = 36 and 40 − 36 = 4. So 40 ÷ 6 = 6 R 4.", "no": ["6 × 7 = 42. That is more than 40.", "6 × 6 = 36. You forgot the 4 left over.", "10 left over is more than 6. Another group fits.", null]}, {"q": "Stoick has <b>33 arrows</b> for <b>8 archers</b>. Each archer gets the same number. How many does each get, and how many are left over?", "choices": ["3 each, 9 left over", "4 each, 1 left over", "4 each, 0 left over", "25 each, 0 left over"], "a": 1, "why": "8 × 4 = 32 and 33 − 32 = 1. So 33 ÷ 8 = 4 R 1.", "no": ["9 left over is more than 8. Each archer can get one more.", null, "8 × 4 = 32, not 33. One arrow is left.", "25 is 33 − 8. That is subtracting, not dividing."]}, {"q": "Which remainder is <b>impossible</b> when you divide by 7?", "choices": ["0", "3", "6", "8"], "a": 3, "why": "A remainder must be smaller than the divisor. With 8 left over, another group of 7 fits.", "no": ["0 is possible: 56 ÷ 7 = 8 has no remainder.", "3 is possible: 24 ÷ 7 = 3 R 3.", "6 is possible: 20 ÷ 7 = 2 R 6.", null]}, {"q": "What is a <b>fact family</b>?", "choices": ["related × and ÷ facts made from the same three numbers", "all the facts in the 7s table", "facts that have the same answer", "the number left over after dividing"], "a": 0, "why": "A fact family uses one set of three numbers, like 6, 8 and 48.", "no": [null, "The 7s table uses many different numbers.", "6 × 8 and 4 × 12 both make 48, but they are not one family.", "That is the remainder."]}, {"q": "After the feast there was a <b>surplus</b> of bread. That means…", "choices": ["there was extra bread left", "there was not enough bread", "the bread was shared evenly", "the bread was hidden"], "a": 0, "why": "A <i>surplus</i> is an extra amount, more than needed.", "no": [null, "That would make bread scarce, the opposite.", "Surplus tells about the amount, not how it was shared.", "Surplus does not mean hidden."]}, {"q": "Which sentence uses <b>evenly</b> correctly?", "choices": ["26 fish split evenly among 6 dragons, 4 each.", "Evenly, the dragon flew away.", "24 fish split evenly among 6 dragons, 4 each.", "The fish were evenly left over."], "a": 2, "why": "6 × 4 = 24 exactly, so nothing is left over. That is splitting evenly.", "no": ["26 ÷ 6 = 4 R 2. Two are left over, so it is not even.", "Evenly tells about equal parts. This sentence makes no sense.", null, "Evenly means nothing is left over."]}]}], "win": "Fact families and leftovers: you handled both like a pro!", "prev": "bb-bailey-L09", "prevTitle": "Lesson 9"});</script></body></html>
