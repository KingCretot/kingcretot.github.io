<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 10: Fact Families and Leftovers</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L10", "label": "Lesson 10", "title": "Fact Families and Leftovers", "goal": "I can write all the facts in a fact family and tell what is left over when things don't share evenly.", "date": "2026-11-10", "mastery": 90, "color": "#E67E22", "slides": [{"type": "hello", "title": "On Your Own: Fact Families and Leftovers", "text": "In class you built fact families and dealt beans into cups. Now you do it on your own. It takes about 25 minutes and ends with <b>Show What You Know</b>.", "visual": {"kind": "emoji", "text": "🔺🐟"}}, {"type": "talk", "kick": "Say it out loud", "title": "Teach it to someone", "text": "Find someone at home. Teach them. Say it out loud before you go on.", "prompts": ["Show them the 6, 8, 48 family. Say all four facts.", "Explain why the 7, 7, 49 family has only two facts.", "Explain a remainder with 30 fish and 7 dragons. Why can't the 2 extra fish be shared?"], "starters": ["The four facts are …", "It has only two facts because …", "Each dragon gets … and … are left because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Remember the words", "text": "Tap each card. Say the meaning before you flip it. Then flip to check yourself.", "words": [{"word": "fact family", "pos": "noun", "emoji": "🔺", "meaning": "A set of related multiplication and division facts made from the same three numbers.", "example": "6 × 8 = 48, 8 × 6 = 48, 48 ÷ 6 = 8 and 48 ÷ 8 = 6 are one <b>fact family</b>."}, {"word": "remainder", "pos": "noun", "emoji": "🍪", "meaning": "The amount left over when a number cannot be split into equal groups.", "example": "30 ÷ 7 = 4 R 2. The <b>remainder</b> is 2."}, {"word": "evenly", "pos": "adverb", "emoji": "⚖️", "meaning": "In equal parts, with nothing left over.", "example": "48 fish split <b>evenly</b> among 6 dragons: 8 each."}, {"word": "surplus", "pos": "noun", "emoji": "📦", "meaning": "An extra amount, more than what is needed.", "example": "After every dragon was fed, there was a <b>surplus</b> of 3 fish."}, {"word": "scarce", "pos": "adjective", "emoji": "🏜️", "meaning": "Hard to find because there is very little of it.", "example": "In the middle of winter, fresh food was <b>scarce</b>."}, {"word": "hesitate", "pos": "verb", "emoji": "⏸️", "meaning": "To stop or wait for a moment before doing something, because you are unsure.", "example": "Do not <b>hesitate</b>: if you know 7 × 8 = 56, you know 56 ÷ 8."}, {"word": "negotiate", "pos": "verb", "emoji": "🤝", "meaning": "To talk with someone to reach an agreement.", "example": "Instead of fighting, the two tribes agreed to <b>negotiate</b>."}]}, {"type": "learn", "kick": "Remember", "title": "Two big ideas", "text": "A <b>fact family</b> is all the × and ÷ facts made from three numbers. A <b>remainder</b> is what is left when things do not share evenly.", "visual": {"kind": "triangle", "a": 7, "b": 8, "c": 56}, "steps": [{"text": "7 × 8 = 56 · 8 × 7 = 56 · 56 ÷ 7 = 8 · 56 ÷ 8 = 7"}, {"text": "Leftovers: find the biggest fact that fits, subtract, and check that the remainder is <b>smaller than the divisor</b>."}]}, {"type": "tap", "kick": "Your turn", "title": "Fact families", "items": [{"type": "fill", "q": "Finish the family: 8 × 9 = 72, 9 × 8 = 72, 72 ÷ 8 = 9, and 72 ÷ 9 = ____", "answers": ["8"], "why": "8 × 9 = 72, so 72 ÷ 9 = 8.", "no": "Which number has not been the answer yet?"}, {"type": "fill", "q": "How many <b>different</b> facts are in the 6, 6, 36 family? Type a number.", "answers": ["2"], "why": "6 × 6 = 36 and 36 ÷ 6 = 6. Turning them around gives the same facts.", "no": "Write them. Are any the same?"}, {"type": "fill", "q": "What number is missing from this fact triangle? Type it.", "answers": ["7"], "why": "7 × 9 = 63, so 63 ÷ 9 = 7.", "no": "Ask: 9 × what = 63?", "visual": {"kind": "triangle", "a": "?", "b": 9, "c": 63}}, {"q": "Which fact is <b>NOT</b> in the 7, 8, 56 family?", "choices": ["56 ÷ 7 = 8", "8 × 7 = 56", "56 ÷ 8 = 7", "8 ÷ 56 = 7"], "a": 3, "why": "8 ÷ 56 is backward. In division the biggest number comes first.", "no": ["That one uses 7, 8 and 56, and it is true.", "The turn-around fact belongs.", "That one uses 7, 8 and 56, and it is true.", null]}]}, {"type": "sort", "kick": "Sort it", "title": "The 7, 8, 56 family", "text": "Tap a fact. Does it belong in the <b>7, 8, 56</b> fact family?", "buckets": ["✅ In the 7, 8, 56 family", "❌ Not in this family"], "items": [{"text": "56 ÷ 7 = 8", "b": 0, "why": "Uses 7, 8 and 56, and it is true.", "hint": "Which three numbers? Is it true?"}, {"text": "56 ÷ 8 = 6", "b": 1, "why": "8 × 6 = 48, not 56. A false fact is not in any family.", "hint": "Check it: 8 × 6 = ?"}, {"text": "7 × 8 = 56", "b": 0, "why": "Same three numbers, and it is true.", "hint": "Look at the three numbers."}, {"text": "7 ÷ 56 = 8", "b": 1, "why": "Backward. In division the biggest number comes first.", "hint": "Which number should come first in division?"}, {"text": "65 ÷ 8 = 7", "b": 1, "why": "65 is not 56. The digits got switched, and the fact is not true either.", "hint": "Read the first number carefully: 65 or 56?"}, {"text": "8 × 7 = 56", "b": 0, "why": "The turn-around fact belongs too.", "hint": "Does turning it around change the numbers?"}, {"text": "56 − 8 = 48", "b": 1, "why": "Subtraction is not in a multiplication and division family.", "hint": "Which operations are in a fact family?"}], "done": "A fact belongs only if it uses the same three numbers, the right operation, AND it is true."}, {"type": "build", "kick": "Build it", "title": "Toothless shares his catch", "text": "Toothless caught <b>31 fish</b> for <b>7 dragons</b>. Every dragon gets the same number, as many as possible. Make the groups.", "groups": 7, "each": 4, "emoji": "🐟", "why": "7 × 4 = 28 fish handed out. 31 − 28 = 3 left over. So <b>31 ÷ 7 = 4 R 3</b>.", "hint": "7 dragons means 7 groups. Is 7 × 5 = 35 more than 31? Then try 4 in each."}, {"type": "tap", "kick": "Your turn", "title": "Leftovers", "text": "Type the answer with R for the remainder, like <b>4 R 2</b>.", "items": [{"type": "fill", "q": "<b>52 ÷ 9</b> = ____", "answers": ["5 R 7", "5R7", "5 R7", "5R 7", "5 remainder 7", "5 rem 7"], "why": "9 × 5 = 45 and 52 − 45 = 7. So 52 ÷ 9 = 5 R 7.", "no": "Find the biggest 9s fact that fits under 52 without going over.", "hint": "9 × 5 = 45. How many are left?", "placeholder": "like 4 R 2"}, {"type": "fill", "q": "<b>44 ÷ 8</b> = ____", "answers": ["5 R 4", "5R4", "5 R4", "5R 4", "5 remainder 4", "5 rem 4"], "why": "8 × 5 = 40 and 44 − 40 = 4. So 44 ÷ 8 = 5 R 4.", "no": "Find the biggest 8s fact that fits under 44 without going over.", "hint": "8 × 5 = 40. How many are left?", "placeholder": "like 4 R 2"}, {"type": "fill", "q": "Stoick has <b>40 arrows</b> for <b>6 archers</b>. Each archer gets the same number. How many arrows are <b>left over</b>?", "answers": ["4", "4 arrows"], "why": "6 × 6 = 36 and 40 − 36 = 4. So 40 ÷ 6 = 6 R 4: 4 arrows left over.", "no": "Find the biggest 6s fact under 40 first.", "hint": "6 × 6 = 36. How many are left?"}, {"q": "Which division has a remainder?", "choices": ["36 ÷ 9", "42 ÷ 7", "50 ÷ 8", "48 ÷ 6"], "a": 2, "why": "8 × 6 = 48, so 50 ÷ 8 = 6 R 2.", "no": ["9 × 4 = 36 exactly.", "7 × 6 = 42 exactly.", null, "6 × 8 = 48 exactly."]}]}, {"type": "order", "kick": "Put in order", "title": "Steps for 47 ÷ 6", "text": "Tap the steps in the right order.", "steps": ["Ask: 6 × what gets close to 47 without going over?", "6 × 7 = 42 (6 × 8 = 48 is too big)", "Subtract: 47 − 42 = 5", "Check: 5 is smaller than 6, so no more groups fit", "So write the answer: 47 ÷ 6 = 7 R 5"], "why": "Find the biggest fact that fits, subtract, check the remainder, then write it.", "hint": "You need the fact before you can subtract. What comes first?"}, {"type": "tap", "kick": "Word work", "title": "Words in action", "text": "Type the word.", "items": [{"type": "fill", "q": "After every dragon was fed, there were 5 extra fish. There was a ____ of fish.", "answers": ["surplus"], "why": "A <i>surplus</i> is an extra amount, more than what is needed.", "no": "It means extra. It is the opposite of scarce."}, {"type": "fill", "q": "54 beans split into 6 cups with nothing left over. They split ____.", "answers": ["evenly"], "why": "<i>Evenly</i> means in equal parts with nothing left over.", "no": "It ends in -ly."}, {"q": "The two tribes sat down to <b>negotiate</b>. What did they do?", "choices": ["They talked until they agreed.", "They ran away.", "They had a battle."], "a": 0, "why": "To <i>negotiate</i> is to talk with someone to reach an agreement.", "no": [null, "Running away is not talking it out.", "Negotiating is what you do INSTEAD of fighting."]}]}, {"type": "recall", "kick": "Remember?", "title": "Monday's words and facts", "items": [{"type": "fill", "q": "In <b>63 ÷ 9 = 7</b>, the 9 is called the ____.", "answers": ["divisor", "the divisor"], "why": "The divisor is the number you divide by.", "no": "It is the number you divide BY."}, {"type": "fill", "q": "<b>48 ÷ 8</b> = ____", "answers": ["6"], "why": "8 × 6 = 48, so 48 ÷ 8 = 6.", "no": "Ask: 8 × what = 48?"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"q": "Which fact is in the same family as <b>7 × 8 = 56</b>?", "choices": ["63 ÷ 7 = 9", "8 ÷ 56 = 7", "56 ÷ 8 = 7", "56 − 8 = 48"], "a": 2, "why": "56 ÷ 8 = 7 uses the same three numbers: 7, 8 and 56.", "no": ["True, but 63 and 9 are not in this family.", "Backward. The biggest number comes first.", null, "Subtraction is not in a multiplication and division family."]}, {"type": "fill", "q": "Which number is missing from this fact triangle? Type it.", "answers": ["6"], "why": "9 × 6 = 54, so 54 ÷ 9 = 6.", "no": "Ask: 9 × what = 54?", "visual": {"kind": "triangle", "a": "?", "b": 9, "c": 54}}, {"q": "Which list is the <b>complete</b> fact family for 6, 7 and 42?", "choices": ["6 × 7 = 42, 7 × 6 = 42, 42 ÷ 6 = 7, 6 ÷ 42 = 7", "6 × 7 = 42, 7 × 6 = 42, 42 ÷ 6 = 7, 42 ÷ 7 = 6", "6 × 7 = 42, 42 ÷ 7 = 6, 6 + 7 = 13, 13 − 7 = 6", "6 × 7 = 42, 7 × 7 = 49, 42 ÷ 7 = 6, 49 ÷ 7 = 7"], "a": 1, "why": "Two multiplication facts and two division facts, all using 6, 7 and 42.", "no": ["6 ÷ 42 is backward.", null, "Adding and subtracting are not in this family.", "49 belongs to a different family."]}, {"type": "fill", "q": "<b>30 ÷ 8</b> = ____ &nbsp; (use R for the remainder)", "answers": ["3 R 6", "3R6", "3 R6", "3R 6", "3 remainder 6", "3 rem 6"], "why": "8 × 3 = 24 and 30 − 24 = 6. So 30 ÷ 8 = 3 R 6.", "no": "Find the biggest 8s fact that fits under 30 without going over.", "hint": "8 × 3 = 24. How many are left?", "placeholder": "like 4 R 2"}, {"type": "fill", "q": "<b>40 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["6 R 4", "6R4", "6 R4", "6R 4", "6 remainder 4", "6 rem 4"], "why": "6 × 6 = 36 and 40 − 36 = 4. So 40 ÷ 6 = 6 R 4.", "no": "Find the biggest 6s fact that fits under 40 without going over.", "hint": "6 × 6 = 36. How many are left?", "placeholder": "like 4 R 2"}, {"type": "fill", "q": "Stoick has <b>33 arrows</b> for <b>8 archers</b>. Each archer gets the same number. What is 33 ÷ 8? Use R for what is left.", "answers": ["4 R 1", "4R1", "4 R1", "4R 1", "4 remainder 1", "4 rem 1"], "why": "8 × 4 = 32 and 33 − 32 = 1. So 33 ÷ 8 = 4 R 1.", "no": "Find the biggest 8s fact that fits under 33 without going over.", "hint": "8 × 4 = 32. How many are left?", "placeholder": "like 4 R 2"}, {"q": "Which remainder is <b>impossible</b> when you divide by 7?", "choices": ["0", "3", "6", "8"], "a": 3, "why": "A remainder must be smaller than the divisor. With 8 left over, another group of 7 fits.", "no": ["0 is possible: 56 ÷ 7 = 8 has no remainder.", "3 is possible: 24 ÷ 7 = 3 R 3.", "6 is possible: 20 ÷ 7 = 2 R 6.", null]}, {"type": "fill", "q": "Related × and ÷ facts made from the same three numbers are called a fact ____.", "answers": ["family", "fact family"], "why": "A <i>fact family</i> uses one set of three numbers, like 6, 8 and 48.", "no": "Three numbers, four facts, like parents and kids."}, {"type": "fill", "q": "The amount left over after dividing is called the ____.", "answers": ["remainder", "the remainder"], "why": "The <i>remainder</i> is the part left over.", "no": "On paper we write just its first letter: R."}, {"q": "Hiccup did not <b>hesitate</b>: he jumped on Toothless right away. What does <i>hesitate</i> mean?", "choices": ["to stop for a moment because you are unsure", "to shout for help", "to move very fast", "to agree with someone"], "a": 0, "why": "To <i>hesitate</i> is to stop or wait for a moment because you are unsure.", "no": [null, "Shouting is not stopping to think.", "That is the opposite of hesitating.", "Agreeing is not stopping to think."]}], [{"q": "Which fact is in the same family as <b>6 × 9 = 54</b>?", "choices": ["54 ÷ 6 = 9", "9 ÷ 54 = 6", "54 − 9 = 45", "6 × 8 = 48"], "a": 0, "why": "54 ÷ 6 = 9 uses the same three numbers: 6, 9 and 54.", "no": [null, "Backward. The biggest number comes first.", "Subtraction is not in this family.", "That uses 8 and 48, a different family."]}, {"type": "fill", "q": "What number goes in the empty corner of this fact triangle? Type it.", "answers": ["8"], "why": "8 × 8 = 64, so 64 ÷ 8 = 8.", "no": "Ask: 8 × what = 64?", "visual": {"kind": "triangle", "a": 8, "b": "?", "c": 64}}, {"type": "fill", "q": "Finish the family: 7 × 6 = 42, 6 × 7 = 42, 42 ÷ 6 = 7, and 42 ÷ 7 = ____", "answers": ["6"], "why": "7 × 6 = 42, so 42 ÷ 7 = 6.", "no": "Which number has not been the answer yet?"}, {"type": "fill", "q": "<b>50 ÷ 7</b> = ____ &nbsp; (use R for the remainder)", "answers": ["7 R 1", "7R1", "7 R1", "7R 1", "7 remainder 1", "7 rem 1"], "why": "7 × 7 = 49 and 50 − 49 = 1. So 50 ÷ 7 = 7 R 1.", "no": "Find the biggest 7s fact that fits under 50 without going over.", "hint": "7 × 7 = 49. How many are left?", "placeholder": "like 4 R 2"}, {"type": "fill", "q": "<b>35 ÷ 9</b> = ____ &nbsp; (use R for the remainder)", "answers": ["3 R 8", "3R8", "3 R8", "3R 8", "3 remainder 8", "3 rem 8"], "why": "9 × 3 = 27 and 35 − 27 = 8. So 35 ÷ 9 = 3 R 8.", "no": "Find the biggest 9s fact that fits under 35 without going over.", "hint": "9 × 3 = 27. How many are left?", "placeholder": "like 4 R 2"}, {"type": "fill", "q": "Hiccup has <b>46 fish</b> for <b>8 dragons</b>. Each dragon gets the same number. How many fish are <b>left over</b>?", "answers": ["6", "6 fish"], "why": "8 × 5 = 40 and 46 − 40 = 6. So 46 ÷ 8 = 5 R 6: 6 fish left over.", "no": "Find the biggest 8s fact under 46 first.", "hint": "8 × 5 = 40. How many are left?"}, {"q": "Fishlegs says <b>52 ÷ 9 = 4 R 16</b>. What is wrong?", "choices": ["Nothing. 9 × 4 + 16 = 52.", "He should have added 52 + 9.", "16 left over is enough for another group of 9. It should be 5 R 7.", "The remainder should be 0."], "a": 2, "why": "9 × 5 = 45 and 52 − 45 = 7. So 52 ÷ 9 = 5 R 7.", "no": ["The math adds up, but a remainder can never be as big as the divisor.", "Adding makes more. This is a division problem.", null, "9 × 5 = 45, so 7 are left over, not 0."]}, {"type": "fill", "q": "When things split into equal parts with nothing left over, they split ____.", "answers": ["evenly"], "why": "<i>Evenly</i> means in equal parts, with nothing left over.", "no": "It ends in -ly."}, {"q": "Which division has <b>no remainder</b>?", "choices": ["58 ÷ 8", "48 ÷ 8", "50 ÷ 6", "62 ÷ 7"], "a": 1, "why": "8 × 6 = 48 exactly, so nothing is left over.", "no": ["8 × 7 = 56, so 2 are left over.", null, "6 × 8 = 48, so 2 are left over.", "7 × 8 = 56, so 6 are left over."]}, {"q": "After the feast, there was a <b>surplus</b> of bread. What does that mean?", "choices": ["There was not enough bread.", "All the bread was eaten.", "The bread was shared evenly.", "There was extra bread, more than needed."], "a": 3, "why": "A <i>surplus</i> is an extra amount, more than what is needed.", "no": ["That is scarce, the opposite of surplus.", "If it was all eaten, nothing is extra.", "Surplus tells how much, not how it was shared.", null]}], [{"q": "Which list is the <b>complete</b> fact family for 7, 8 and 56?", "choices": ["7 × 8 = 56, 8 × 7 = 56, 56 ÷ 7 = 8, 56 ÷ 8 = 7", "7 × 8 = 56, 8 × 7 = 56, 56 ÷ 7 = 8, 7 ÷ 56 = 8", "7 × 8 = 56, 56 ÷ 8 = 7, 7 + 8 = 15, 15 − 8 = 7", "7 × 8 = 56, 8 × 8 = 64, 56 ÷ 8 = 7, 64 ÷ 8 = 8"], "a": 0, "why": "All four facts use only 7, 8 and 56.", "no": [null, "7 ÷ 56 is backward.", "Adding and subtracting are not in this family.", "64 belongs to a different family."]}, {"type": "fill", "q": "A fact triangle has <b>9</b> and <b>63</b> on it. What is the third number?", "answers": ["7"], "why": "9 × 7 = 63, so the family is 7, 9 and 63.", "no": "Ask: 9 × what = 63?"}, {"type": "fill", "q": "Finish the family: 8 × 6 = 48, 6 × 8 = 48, 48 ÷ 8 = 6, and 48 ÷ 6 = ____", "answers": ["8"], "why": "6 × 8 = 48, so 48 ÷ 6 = 8.", "no": "Which number has not been the answer yet?"}, {"type": "fill", "q": "<b>59 ÷ 8</b> = ____ &nbsp; (use R for the remainder)", "answers": ["7 R 3", "7R3", "7 R3", "7R 3", "7 remainder 3", "7 rem 3"], "why": "8 × 7 = 56 and 59 − 56 = 3. So 59 ÷ 8 = 7 R 3.", "no": "Find the biggest 8s fact that fits under 59 without going over.", "hint": "8 × 7 = 56. How many are left?", "placeholder": "like 4 R 2"}, {"type": "fill", "q": "<b>44 ÷ 9</b> = ____ &nbsp; (use R for the remainder)", "answers": ["4 R 8", "4R8", "4 R8", "4R 8", "4 remainder 8", "4 rem 8"], "why": "9 × 4 = 36 and 44 − 36 = 8. So 44 ÷ 9 = 4 R 8.", "no": "Find the biggest 9s fact that fits under 44 without going over.", "hint": "9 × 4 = 36. How many are left?", "placeholder": "like 4 R 2"}, {"q": "Stoick has <b>39 shields</b> for <b>6 ships</b>. Each ship gets the same number. Which answer is right?", "choices": ["5 R 9", "7 R 3", "6 R 3", "33"], "a": 2, "why": "6 × 6 = 36 and 39 − 36 = 3. So 39 ÷ 6 = 6 R 3.", "no": ["9 left over is more than 6. Each ship can get one more.", "6 × 7 = 42. That is more shields than he has.", null, "33 is 39 − 6. That is subtracting, not dividing."]}, {"q": "When you divide by 9, which remainder is <b>impossible</b>?", "choices": ["8", "9", "0", "5"], "a": 1, "why": "A remainder must be smaller than the divisor. With 9 left over, one more group of 9 fits.", "no": ["8 is possible: 17 ÷ 9 = 1 R 8.", null, "0 is possible: 63 ÷ 9 = 7 has no remainder.", "5 is possible: 32 ÷ 9 = 3 R 5."]}, {"type": "fill", "q": "Fresh fish were very hard to find in winter. Fish were ____.", "answers": ["scarce"], "why": "<i>Scarce</i> means hard to find because there is very little of it.", "no": "It is the opposite of surplus."}, {"type": "fill", "q": "To talk together until you reach an agreement is to ____.", "answers": ["negotiate"], "why": "To <i>negotiate</i> is to talk with someone to reach an agreement.", "no": "Tribes do it instead of fighting. It starts with n."}, {"q": "Which division has a remainder?", "choices": ["54 ÷ 9", "56 ÷ 7", "58 ÷ 9", "64 ÷ 8"], "a": 2, "why": "9 × 6 = 54, so 58 ÷ 9 = 6 R 4.", "no": ["9 × 6 = 54 exactly.", "7 × 8 = 56 exactly.", null, "8 × 8 = 64 exactly."]}]]}], "win": "Fact families and leftovers: you handled both like a pro!", "prev": "bb-bailey-L09", "prevTitle": "Lesson 9"});</script></body></html>
