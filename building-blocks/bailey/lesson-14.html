": "Find someone at home. Teach them. Say it out loud before you go on.", "prompts": ["Show them 618 ÷ 6 on paper. Explain why the 0 in 103 is a <b>placeholder</b>.", "Tell them how you know 184 ÷ 8 has only 2 digits in the answer.", "Who is called <b>Vast</b> in <i>How to Train Your Dragon</i>, and why does the name fit?"], "starters": ["The 0 holds the tens place, so …", "8 does not fit in 1, so …", "… is called the Vast because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Remember the words", "text": "Tap each card. Say the meaning before you flip it. Then flip to check yourself.", "words": [{"word": "placeholder", "pos": "noun", "emoji": "0️⃣", "meaning": "A zero that holds a place so the other digits stay in the right places.", "example": "In 103, the 0 is a <b>placeholder</b> in the tens place."}, {"word": "align", "pos": "verb", "emoji": "📏", "meaning": "To line things up in a straight row or column.", "example": "<b>Align</b> each digit of the quotient above its place in the dividend."}, {"word": "insufficient", "pos": "adjective", "emoji": "🪫", "meaning": "Not enough.", "example": "1 hundred is <b>insufficient</b> to give each of 8 plates a hundred."}, {"word": "omit", "pos": "verb", "emoji": "✂️", "meaning": "To leave something out.", "example": "If you <b>omit</b> the zero, 103 turns into 13."}, {"word": "accurate", "pos": "adjective", "emoji": "✅", "meaning": "Correct, with no mistakes.", "example": "Multiply to check that your quotient is <b>accurate</b>."}, {"word": "vigilant", "pos": "adjective", "emoji": "👀", "meaning": "Watching carefully for problems or danger.", "example": "A <b>vigilant</b> Viking lookout watches the sea all night."}, {"word": "vast", "pos": "adjective", "emoji": "🏔️", "meaning": "Very, very large.", "example": "Hiccup's father is called Stoick the <b>Vast</b>, a name that tells you he is huge."}]}, {"type": "learn", "kick": "Remember", "title": "Three things to watch", "text": "Same four steps. Watch for these three things.", "visual": {"kind": "longdiv", "text": "    102\n   ____\n8 ) 816\n   -8\n   --\n    01\n    -0\n    --\n     16\n    -16\n    ---\n      0"}, "steps": [{"text": "<b>Hundreds first.</b> 816 ÷ 8: 8 fits in 8 once. The quotient starts above the 8 and has 3 digits."}, {"text": "<b>Placeholder zero.</b> Bring down the 1. 8 does not fit in 1, so write <b>0</b> above the 1. Then bring down the 6: 16 ÷ 8 = 2. So 816 ÷ 8 = 102."}, {"text": "<b>First digit too small.</b> In 216 ÷ 9, 9 does not fit in 2, so start with 21. The quotient has only 2 digits: 24."}], "tip": "Estimate first, and check by multiplying: 102 × 8 = 816."}, {"type": "sort", "kick": "Sort it", "title": "2 digits or 3 digits?", "text": "Tap a problem. Then tap the box.", "buckets": ["2️⃣ The quotient has 2 digits", "3️⃣ The quotient has 3 digits"], "items": [{"text": "402 ÷ 6", "b": 0, "why": "6 does not fit in 4, so the quotient starts in the tens place: 402 ÷ 6 = 67, 2 digits.", "hint": "Does 6 fit in 4?"}, {"text": "624 ÷ 3", "b": 1, "why": "3 fits in 6 (the hundreds), so the quotient starts in the hundreds place: 624 ÷ 3 = 208, 3 digits.", "hint": "Does 3 fit in 6?"}, {"text": "207 ÷ 9", "b": 0, "why": "9 does not fit in 2, so the quotient starts in the tens place: 207 ÷ 9 = 23, 2 digits.", "hint": "Does 9 fit in 2?"}, {"text": "909 ÷ 9", "b": 1, "why": "9 fits in 9 (the hundreds), so the quotient starts in the hundreds place: 909 ÷ 9 = 101, 3 digits.", "hint": "Does 9 fit in 9?"}, {"text": "224 ÷ 7", "b": 0, "why": "7 does not fit in 2, so the quotient starts in the tens place: 224 ÷ 7 = 32, 2 digits.", "hint": "Does 7 fit in 2?"}, {"text": "505 ÷ 5", "b": 1, "why": "5 fits in 5 (the hundreds), so the quotient starts in the hundreds place: 505 ÷ 5 = 101, 3 digits.", "hint": "Does 5 fit in 5?"}], "done": "Look at the first digit before you start. It tells you how many digits the answer has."}, {"type": "tap", "kick": "Your turn", "title": "What comes next?", "items": [{"q": "<b>624 ÷ 6</b>. Look at the work so far. Which step comes next?", "choices": ["Divide", "Multiply", "Subtract", "Bring down"], "a": 1, "why": "You just wrote a digit in the quotient. Now multiply it by the divisor.", "no": ["You divide right after you bring down a new digit, or at the very start.", null, "You subtract right after you write the product underneath.", "You bring down right after you subtract, when a digit is still waiting."], "visual": {"kind": "longdiv", "text": "    10\n   ____\n6 ) 624\n   -6\n   --\n    02"}}, {"type": "fill", "q": "<b>624 ÷ 6</b>. What digit goes in the quotient next?", "answers": ["0", "zero"], "why": "How many 6s fit in 2? 0, because 6 × 0 = 0.", "no": "How many 6s fit in 2?", "visual": {"kind": "longdiv", "text": "    1\n   ____\n6 ) 624\n   -6\n   --\n    02"}}, {"type": "fill", "q": "<b>344 ÷ 8</b>. What digit goes in the quotient next?", "answers": ["3", "three"], "why": "How many 8s fit in 24? 3, because 8 × 3 = 24.", "no": "How many 8s fit in 24?", "visual": {"kind": "longdiv", "text": "     4\n   ____\n8 ) 344\n   -32\n   ---\n     24"}}]}, {"type": "tap", "kick": "Your turn", "title": "Solve on paper", "text": "Copy each problem on your paper. Solve it one step at a time. Type the quotient.", "items": [{"type": "fill", "q": "Use long division: <b>945 ÷ 7</b> = ____", "answers": ["135"], "why": "945 ÷ 7 = 135. Check: 135 × 7 = 945.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 7s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ____\n7 ) 945"}}, {"type": "fill", "q": "Use long division: <b>654 ÷ 6</b> = ____", "answers": ["109"], "why": "654 ÷ 6 = 109. Check: 109 × 6 = 654.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 6s fit in 6?", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 654"}}, {"type": "fill", "q": "Use long division: <b>378 ÷ 6</b> = ____", "answers": ["63"], "why": "378 ÷ 6 = 63. Check: 63 × 6 = 378.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "6 does not fit in 3, so start with 37: how many 6s fit in 37?", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 378"}}]}, {"type": "tap", "kick": "Your turn", "title": "Be vigilant", "items": [{"q": "Fishlegs found <b>515 ÷ 5</b> and got <b>13</b>. Check: 13 × 5 = 65, not 515. What went wrong?", "choices": ["He should have added instead.", "Nothing. 13 is right.", "He skipped the 0 in the tens place. The answer is 103.", "He forgot to bring down the 5."], "a": 2, "why": "5 does not fit in 1 in the tens place, so the 0 is a placeholder: 515 ÷ 5 = 103. Check: 103 × 5 = 515.", "no": ["Division is the right operation.", "Check: 13 × 5 = 65, not 515.", null, "He did bring down all the digits. The problem is the tens place: 5 does not fit in 1, so a 0 goes there."]}, {"q": "<b>162 ÷ 6</b>. Where does the first digit of the quotient go?", "choices": ["above the 6 (tens place)", "above the 2 (ones place)", "to the left of the whole number", "above the 1 (hundreds place)"], "a": 0, "why": "6 does not fit in 1, so the quotient starts in the tens place: 162 ÷ 6 = 27, 2 digits.", "no": [null, "The ones place comes last, not first.", "Quotient digits always go above the dividend, lined up by place value.", "6 does not fit in 1. Nothing goes above the 1."], "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 162"}}, {"type": "fill", "q": "Is <b>654 ÷ 6 = 109</b> accurate? Check it: 109 × 6 = ____", "answers": ["654"], "why": "100 × 6 = 600 and 9 × 6 = 54. 600 + 54 = 654, so 654 ÷ 6 = 109 is accurate.", "no": "100 × 6 = 600. Now add 9 × 6."}]}, {"type": "tap", "kick": "Word work", "title": "Words in action", "text": "Type the word.", "items": [{"type": "fill", "q": "A zero that holds a place, like the 0 in 105, is a ____. (Use a word from your word cards.)", "answers": ["placeholder", "place holder"], "why": "A <i>placeholder</i> zero keeps the other digits in the right places.", "no": "It starts with place-."}, {"type": "fill", "q": "If you leave out the 0, you ____ it. (Use a word from your word cards.)", "answers": ["omit"], "why": "To <i>omit</i> is to leave something out.", "no": "It has 4 letters and starts with o."}, {"q": "The sea around Berk stretches farther than anyone can see. Which word describes it?", "choices": ["vast", "accurate", "insufficient", "vigilant"], "a": 0, "why": "<i>Vast</i> means very, very large.", "no": [null, "Accurate means correct.", "Insufficient means not enough.", "Vigilant describes a person who watches carefully."]}]}, {"type": "recall", "kick": "Remember?", "title": "Earlier lessons", "items": [{"type": "fill", "q": "Use long division: <b>38 ÷ 2</b> = ____", "answers": ["19"], "why": "38 ÷ 2 = 19. Check: 19 × 2 = 38.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 2s fit in 3?", "visual": {"kind": "longdiv", "text": "\n   ___\n2 ) 38"}}, {"type": "fill", "q": "<b>9 × 7</b> = ____", "answers": ["63"], "why": "70 − 7 = 63.", "no": "Use ×10 minus one group."}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Use long division: <b>868 ÷ 7</b> = ____", "answers": ["124"], "why": "868 ÷ 7 = 124. Check: 124 × 7 = 868.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 7s fit in 8?", "visual": {"kind": "longdiv", "text": "\n   ____\n7 ) 868"}}, {"type": "fill", "q": "Use long division: <b>912 ÷ 3</b> = ____", "answers": ["304"], "why": "912 ÷ 3 = 304. Check: 304 × 3 = 912.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 3s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ____\n3 ) 912"}}, {"type": "fill", "q": "Use long division: <b>392 ÷ 7</b> = ____", "answers": ["56"], "why": "392 ÷ 7 = 56. Check: 56 × 7 = 392.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "7 does not fit in 3, so start with 39: how many 7s fit in 39?", "visual": {"kind": "longdiv", "text": "\n   ____\n7 ) 392"}}, {"q": "<b>945 ÷ 9</b>. Look at the work so far. Which step comes next?", "choices": ["Divide", "Multiply", "Subtract", "Bring down"], "a": 1, "why": "You just wrote a digit in the quotient. Now multiply it by the divisor.", "no": ["You divide right after you bring down a new digit, or at the very start.", null, "You subtract right after you write the product underneath.", "You bring down right after you subtract, when a digit is still waiting."], "visual": {"kind": "longdiv", "text": "    10\n   ____\n9 ) 945\n   -9\n   --\n    04"}}, {"type": "fill", "q": "<b>816 ÷ 4</b>. What digit goes in the quotient next?", "answers": ["0", "zero"], "why": "How many 4s fit in 1? 0, because 4 × 0 = 0.", "no": "How many 4s fit in 1?", "visual": {"kind": "longdiv", "text": "    2\n   ____\n4 ) 816\n   -8\n   --\n    01"}}, {"q": "<b>288 ÷ 6</b>. Where does the first digit of the quotient go?", "choices": ["to the left of the whole number", "above the 2 (hundreds place)", "above the 8 (tens place)", "above the 8 (ones place)"], "a": 2, "why": "6 does not fit in 2, so the quotient starts in the tens place: 288 ÷ 6 = 48, 2 digits.", "no": ["Quotient digits always go above the dividend, lined up by place value.", "6 does not fit in 2. Nothing goes above the 2.", null, "The ones place comes last, not first."], "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 288"}}, {"q": "Snotlout found <b>927 ÷ 9</b> and got <b>13</b>. Check: 13 × 9 = 117, not 927. What went wrong?", "choices": ["He forgot to bring down the 7.", "He should have added instead.", "Nothing. 13 is right.", "He skipped the 0 in the tens place. The answer is 103."], "a": 3, "why": "9 does not fit in 2 in the tens place, so the 0 is a placeholder: 927 ÷ 9 = 103. Check: 103 × 9 = 927.", "no": ["He did bring down all the digits. The problem is the tens place: 9 does not fit in 2, so a 0 goes there.", "Division is the right operation.", "Check: 13 × 9 = 117, not 927.", null]}, {"type": "fill", "q": "Check <b>104 × 6</b> = ____", "answers": ["624"], "why": "100 × 6 = 600 and 4 × 6 = 24. 600 + 24 = 624.", "no": "100 × 6 = 600. Now add 4 × 6."}, {"type": "fill", "q": "To leave something out is to ____ it. (Use a word from your word cards.)", "answers": ["omit"], "why": "To <i>omit</i> is to leave something out.", "no": "It has 4 letters and starts with o."}, {"q": "Which word means <i>correct, with no mistakes</i>?", "choices": ["vast", "align", "vigilant", "accurate"], "a": 3, "why": "<i>Accurate</i> means correct, with no mistakes.", "no": ["Vast means very large.", "Align means to line up.", "Vigilant means watching carefully.", null]}], [{"type": "fill", "q": "Use long division: <b>984 ÷ 8</b> = ____", "answers": ["123"], "why": "984 ÷ 8 = 123. Check: 123 × 8 = 984.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 8s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ____\n8 ) 984"}}, {"type": "fill", "q": "Use long division: <b>836 ÷ 4</b> = ____", "answers": ["209"], "why": "836 ÷ 4 = 209. Check: 209 × 4 = 836.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 4s fit in 8?", "visual": {"kind": "longdiv", "text": "\n   ____\n4 ) 836"}}, {"type": "fill", "q": "Use long division: <b>315 ÷ 7</b> = ____", "answers": ["45"], "why": "315 ÷ 7 = 45. Check: 45 × 7 = 315.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "7 does not fit in 3, so start with 31: how many 7s fit in 31?", "visual": {"kind": "longdiv", "text": "\n   ____\n7 ) 315"}}, {"q": "<b>627 ÷ 3</b>. Look at the work so far. Which step comes next?", "choices": ["Divide", "Multiply", "Subtract", "Bring down"], "a": 3, "why": "You subtracted and there is still a digit u "], "visual": {"kind": "longdiv", "text": "     5\n   ____\n9 ) 477"}}, {"type": "fill", "q": "<b>636 ÷ 6</b>. What digit goes in the quotient next?", "answers": ["0", "zero"], "why": "How many 6s fit in 3? 0, because 6 × 0 = 0.", "no": "How many 6s fit in 3?", "visual": {"kind": "longdiv", "text": "    1\n   ____\n6 ) 636\n   -6\n   --\n    03"}}, {"q": "<b>896 ÷ 7</b>. Where does the first digit of the quotient go?", "choices": ["above the 8 (hundreds place)", "above the 9 (tens place)", "above the 6 (ones place)", "to the left of the whole number"], "a": 0, "why": "7 fits in 8 (the hundreds), so the quotient starts in the hundreds place: 896 ÷ 7 = 128, 3 digits.", "no": [null, "7 fits in 8, so the first digit goes above the 8.", "The ones place comes last, not first.", "Quotient digits always go above the dividend, lined up by place value."], "visual": {"kind": "longdiv", "text": "\n   ____\n7 ) 896"}}, {"q": "Fishlegs found <b>424 ÷ 4</b> and got <b>16</b>. Check: 16 × 4 = 64, not 424. What went wrong?", "choices": ["He skipped the 0 in the tens place. The answer is 106.", "He forgot to bring down the 4.", "He should have added instead.", "Nothing. 16 is right."], "a": 0, "why": "4 does not fit in 2 in the tens place, so the 0 is a placeholder: 424 ÷ 4 = 106. Check: 106 × 4 = 424.", "no": [null, "He did bring down all the digits. The problem is the tens place: 4 does not fit in 2, so a 0 goes there.", "Division is the right operation.", "Check: 16 × 4 = 64, not 424."]}, {"type": "fill", "q": "Check <b>210 × 4</b> = ____", "answers": ["840"], "why": "200 × 4 = 800 and 10 × 4 = 40. 800 + 40 = 840.", "no": "200 × 4 = 800. Now add 10 × 4."}, {"type": "fill", "q": "A zero that keeps the other digits in their places is a ____. (Use a word from your word cards.)", "answers": ["placeholder", "place holder"], "why": "A <i>placeholder</i> zero holds a place.", "no": "It starts with place-."}, {"q": "Which person is being <b>vigilant</b>?", "choices": ["Toothless naps on t
