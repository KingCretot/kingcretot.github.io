<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 11: Share or Group? Prove It!</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L11", "label": "Lesson 11", "title": "Share or Group? Prove It!", "goal": "I can tell if a story is sharing or grouping, find the missing number, and confirm my answer by multiplying.", "date": "2026-11-12", "mastery": 90, "color": "#E67E22", "slides": [{"type": "hello", "title": "Share or Group? Prove It!", "text": "This week you learned that division undoes multiplication, met fact families, and found leftovers. Today you <b>prove it</b>: figure out what a story is asking, find missing numbers, and check every answer by multiplying.", "visual": {"kind": "emoji", "text": "🕵️🐉✔️"}}, {"type": "talk", "kick": "Book Talk", "title": "The big problem", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What is the biggest problem in the part you read? Who or what is Hiccup up against?", "Hiccup is not the biggest or strongest Viking. What does he use instead to solve problems? Give an example.", "Pick a word from this week (ration, provisions, scarce, surplus, hesitate, negotiate) that fits a moment in the story. Explain why it fits."], "starters": ["The biggest problem is …", "Instead of strength, Hiccup uses …", "The word … fits when … because …"]}, {"type": "recall", "kick": "Remember?", "title": "This week so far", "items": [{"q": "<b>34 ÷ 8</b> = ?", "choices": ["4 R 2", "3 R 10", "5 R 6", "4"], "a": 0, "why": "8 × 4 = 32 and 34 − 32 = 2.", "no": [null, "10 left over is more than 8. One more group fits.", "8 × 5 = 40. That is more than 34.", "8 × 4 = 32. You forgot the 2 left over."]}, {"q": "Which word means <i>an extra amount, more than needed</i>?", "choices": ["scarce", "surplus", "quotient", "hesitate"], "a": 1, "why": "A <i>surplus</i> is extra.", "no": ["Scarce means very little, the opposite.", null, "The quotient is the answer to a division.", "Hesitate means to stop for a moment."]}, {"q": "72 ÷ 9 = 8 is in a fact family. Which fact is in the same family?", "choices": ["9 ÷ 72 = 8", "72 − 9 = 63", "72 ÷ 8 = 9", "8 × 8 = 64"], "a": 2, "why": "The family is 8, 9 and 72: 72 ÷ 8 = 9.", "no": ["Backward. The biggest number comes first.", "Subtraction is not in this family.", null, "That uses 64, not 72."]}]}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read it out loud. Then use it to describe something you did this week.", "words": [{"word": "confirm", "pos": "verb", "emoji": "✔️", "meaning": "To show for sure that something is true or right.", "example": "I <b>confirm</b> 72 ÷ 8 = 9 by multiplying: 9 × 8 = 72."}, {"word": "unknown", "pos": "noun", "emoji": "❓", "meaning": "The missing number you need to find in a problem.", "example": "In ? ÷ 8 = 9, the <b>unknown</b> is 72."}, {"word": "divisible", "pos": "adjective", "emoji": "🧩", "meaning": "Able to be divided by a number with nothing left over.", "example": "56 is <b>divisible</b> by 8, but 58 is not."}, {"word": "interpret", "pos": "verb", "emoji": "🔍", "meaning": "To figure out what something means.", "example": "<b>Interpret</b> the story: is it sharing, or making groups?"}, {"word": "decipher", "pos": "verb", "emoji": "🗝️", "meaning": "To figure out something that is hard to read or understand, like a code.", "example": "Hiccup could <b>decipher</b> Dragonese, the language of dragons."}, {"word": "precise", "pos": "adjective", "emoji": "🎯", "meaning": "Exactly right, with every detail correct.", "example": "Be <b>precise</b>: 45 ÷ 6 is 7 R 3, not just \"about 7\"."}, {"word": "daunting", "pos": "adjective", "emoji": "⛰️", "meaning": "Seeming hard or scary to do, before you start.", "example": "Big division problems look <b>daunting</b>, but one fact at a time makes them easy."}]}, {"type": "learn", "kick": "Learn", "title": "Two kinds of division stories", "text": "A division story gives you the <b>total</b> and one more number. <b>Interpret</b> the story: what does the other number tell you?", "steps": [{"text": "<b>Sharing:</b> 42 dragon eggs are shared equally among 7 nests. You know the number of <b>groups</b> (7 nests). Find how many in <b>each</b>.", "visual": {"kind": "groups", "groups": 7, "each": 6, "emoji": "🥚", "label": "7 nests, 6 eggs in each"}}, {"text": "<b>Grouping:</b> 42 dragon eggs, 7 in each nest. You know how many go in <b>each</b> (7). Find how many <b>groups</b>.", "visual": {"kind": "groups", "groups": 6, "each": 7, "emoji": "🥚", "label": "6 nests, 7 eggs in each"}}, {"text": "Both are <b>42 ÷ 7 = 6</b>. Only the label changes: 6 eggs in each nest, or 6 nests."}], "tip": "Sharing story? The answer is <b>how many in each</b>. Grouping story? The answer is <b>how many groups</b>."}, {"type": "sort", "kick": "Sort it", "title": "Sharing or grouping?", "text": "Tap a story. Then tap the box that tells what the story asks.", "buckets": ["🤲 Sharing<br><small>find how many in EACH</small>", "📦 Grouping<br><small>find how many GROUPS</small>"], "items": [{"text": "Stoick splits 54 arrows equally among 9 warriors. How many does each warrior get?", "b": 0, "why": "You know the groups (9 warriors). You find how many each gets.", "hint": "Do you know how many warriors there are? Then you are finding how many each gets."}, {"text": "Hiccup ties 54 arrows into bundles of 9. How many bundles?", "b": 1, "why": "You know the size of each bundle (9). You find how many bundles.", "hint": "Is 9 the number of bundles, or how many go in each bundle?"}, {"text": "Fishlegs reads 48 pages, 8 pages a night. How many nights?", "b": 1, "why": "8 pages in each night. You find how many nights (groups).", "hint": "Is 8 the number of nights, or the pages in each night?"}, {"text": "48 Vikings form 6 equal teams. How many on each team?", "b": 0, "why": "You know there are 6 teams. You find how many on each.", "hint": "Do you know how many teams there are?"}, {"text": "Toothless eats 7 fish a day. How many days will 63 fish last?", "b": 1, "why": "Each day is a group of 7 fish. You find how many days (groups).", "hint": "7 fish go in each day. What are you finding?"}, {"text": "63 fish are split evenly over 7 days. How many fish each day?", "b": 0, "why": "You know there are 7 days (groups). You find how many in each.", "hint": "Do you know how many days there are?"}], "done": "Same division, different question. Interpret the story before you solve it."}, {"type": "learn", "kick": "Learn", "title": "Confirm it: check by multiplying", "text": "A good mathematician does not trust an answer until it is <b>confirmed</b>. Multiply the quotient by the divisor. You should get back the dividend.", "visual": {"kind": "bigtext", "text": "quotient × divisor (+ remainder) = dividend"}, "steps": [{"text": "<b>72 ÷ 8 = 9?</b> 9 × 8 = 72 ✔ It matches, so it is right."}, {"text": "Snotlout wrote <b>54 ÷ 6 = 8</b>. Check: 8 × 6 = 48. 48 is not 54 ✘. Try 9: 9 × 6 = 54 ✔. So 54 ÷ 6 = 9."}, {"text": "With a remainder: <b>43 ÷ 8 = 5 R 3</b>. Check: 5 × 8 = 40, then 40 + 3 = 43 ✔", "visual": {"kind": "bigtext", "text": "5 × 8 + 3 = 43"}}], "tip": "If the check does not give you the dividend, the answer is wrong. Fix it before you move on."}, {"type": "tap", "kick": "Try it", "title": "Check it, fix it", "items": [{"q": "Hiccup says <b>56 ÷ 7 = 9</b>. Check it by multiplying. What do you find?", "choices": ["He is right: 9 × 7 = 56", "He is wrong: 9 × 7 = 63, so 56 ÷ 7 = 8", "He is wrong: 56 ÷ 7 = 7", "He is right: 56 − 7 = 49"], "a": 1, "why": "9 × 7 = 63, not 56. 8 × 7 = 56, so 56 ÷ 7 = 8.", "no": ["Check that fact: 9 × 7 = 63.", null, "7 × 7 = 49, not 56.", "Subtracting does not check division."]}, {"q": "Only one of these is correct. Check each one. Which is it?", "choices": ["48 ÷ 8 = 7", "36 ÷ 6 = 7", "63 ÷ 7 = 9", "54 ÷ 9 = 7"], "a": 2, "why": "9 × 7 = 63, so 63 ÷ 7 = 9 is confirmed.", "no": ["Check: 7 × 8 = 56, not 48.", "Check: 7 × 6 = 42, not 36.", null, "Check: 7 × 9 = 63, not 54."]}, {"q": "Fishlegs wrote <b>44 ÷ 7 = 6 R 2</b>. Check it: 6 × 7 + 2 = ?", "choices": ["42, so he is wrong", "46, so he is wrong", "15, so he is wrong", "44, so he is right"], "a": 3, "why": "6 × 7 = 42 and 42 + 2 = 44. It matches the dividend.", "no": ["You forgot to add the remainder: 42 + 2 = 44.", "6 × 7 = 42, and 42 + 2 = 44, not 46.", "15 is 6 + 7 + 2. You must multiply 6 × 7 first.", null]}]}, {"type": "tap", "kick": "Try it", "title": "Find the unknown", "items": [{"q": "<b>? ÷ 8 = 9</b>. What is the unknown?", "choices": ["17", "1", "72", "64"], "a": 2, "why": "The dividend is quotient × divisor: 9 × 8 = 72. Check: 72 ÷ 8 = 9.", "no": ["17 is 8 + 9. Multiply instead.", "1 is 9 − 8. Multiply instead.", null, "64 is 8 × 8. You need 8 × 9."]}, {"q": "<b>63 ÷ ? = 9</b>. What is the unknown?", "choices": ["7", "54", "8", "72"], "a": 0, "why": "9 × 7 = 63, so 63 ÷ 7 = 9.", "no": [null, "54 is 63 − 9.", "8 × 9 = 72, not 63.", "72 is 63 + 9."]}, {"q": "A fact family has the numbers <b>7</b> and <b>56</b>. What is the third number?", "choices": ["49", "8", "63", "392"], "a": 1, "why": "7 × 8 = 56, so the family is 7, 8 and 56.", "no": ["49 is 56 − 7.", null, "63 is 56 + 7.", "392 is 7 × 56. The big number is already 56."]}]}, {"type": "order", "kick": "Put in order", "title": "Division detective steps", "text": "Tap the steps in the order you use them for a division story.", "steps": ["Read the whole story.", "Interpret: is it sharing or grouping?", "Write the division: total ÷ the number you know", "Think of the multiplication fact", "Confirm by multiplying", "Write the confirmed answer with a label (fish, nests, days)"], "why": "Read, interpret, divide, use a fact, confirm, then label the confirmed answer. That is the whole routine.", "hint": "You cannot divide until you know what the story asks. What comes before writing the division?"}, {"type": "tap", "kick": "Try it", "title": "Story problems", "items": [{"q": "The Hooligans have <b>72 shields</b>. They hang <b>8</b> on each ship. How many ships get shields?", "choices": ["9", "64", "80", "576"], "a": 0, "why": "Grouping: 72 ÷ 8 = 9 ships. Confirm: 9 × 8 = 72.", "no": [null, "64 is 72 − 8.", "80 is 72 + 8.", "576 is 72 × 8. Division gives a smaller number."]}, {"q": "Hiccup trains <b>9 dragons</b>. He has <b>81 treats</b> to share equally. How many treats does each dragon get?", "choices": ["72", "90", "8", "9"], "a": 3, "why": "Sharing: 81 ÷ 9 = 9 treats each. Confirm: 9 × 9 = 81.", "no": ["72 is 81 − 9.", "90 is 81 + 9.", "9 × 8 = 72, not 81.", null]}, {"q": "Fishlegs has <b>59 rocks</b>. He puts <b>9</b> in each bag. How many bags can he fill, and how many rocks are left?", "choices": ["7 bags, 4 left", "5 bags, 14 left", "6 bags, 5 left", "50 bags, 0 left"], "a": 2, "why": "9 × 6 = 54 and 59 − 54 = 5. So 59 ÷ 9 = 6 R 5.", "no": ["9 × 7 = 63. That is more rocks than he has.", "14 left is more than 9. Another bag can be filled.", null, "50 is 59 − 9. That is subtracting, not dividing."]}]}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"q": "Hiccup worked hard to <b>decipher</b> what the dragon was saying. What was he doing?", "choices": ["figuring out what it meant", "making it louder", "copying it word for word", "ignoring it"], "a": 0, "why": "To <i>decipher</i> is to figure out something hard to understand.", "no": [null, "Deciphering is about understanding, not volume.", "Copying does not mean you understand it.", "Ignoring is the opposite of working to understand."]}, {"q": "Which sentence uses <b>divisible</b> correctly?", "choices": ["54 is divisible by 7, because 7 × 8 = 54.", "54 is divisible by 9, because 9 × 6 = 54.", "54 is divisible by 8, with 6 left over.", "Divisible means the answer to a division."], "a": 1, "why": "9 × 6 = 54 with nothing left over, so 54 is divisible by 9.", "no": ["Check: 7 × 8 = 56. 54 ÷ 7 = 7 R 5, so 54 is not divisible by 7.", null, "If something is left over, it is not divisible.", "That is the quotient."]}, {"q": "The test looked <b>daunting</b>, but Bailey started with the first question. What does <i>daunting</i> mean?", "choices": ["very easy", "exactly right", "finished", "seeming hard or scary to do"], "a": 3, "why": "<i>Daunting</i> means it looks hard or scary before you begin.", "no": ["That is the opposite.", "That is what precise means.", "Daunting describes how it feels before you start.", null]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "<b>? ÷ 7 = 8</b>. What is the unknown?", "choices": ["56", "15", "1", "49"], "a": 0, "why": "8 × 7 = 56, so 56 ÷ 7 = 8.", "no": [null, "15 is 7 + 8. Multiply instead.", "1 is 8 − 7. Multiply instead.", "49 is 7 × 7. You need 7 × 8."]}, {"q": "<b>72 ÷ ? = 8</b>. What is the unknown?", "choices": ["64", "8", "9", "80"], "a": 2, "why": "8 × 9 = 72, so 72 ÷ 9 = 8.", "no": ["64 is 72 − 8.", "8 × 8 = 64, not 72.", null, "80 is 72 + 8."]}, {"q": "Only one division is correct. Check each one. Which is it?", "choices": ["56 ÷ 8 = 6", "42 ÷ 7 = 6", "54 ÷ 6 = 8", "63 ÷ 9 = 8"], "a": 1, "why": "6 × 7 = 42, so 42 ÷ 7 = 6 is confirmed.", "no": ["Check: 6 × 8 = 48, not 56.", null, "Check: 8 × 6 = 48, not 54.", "Check: 8 × 9 = 72, not 63."]}, {"q": "Stoick shares <b>48 fish</b> equally among <b>6 dragons</b>. What kind of story is it, and what is the answer?", "choices": ["Grouping: 8 groups of dragons", "Sharing: 42 fish for each dragon", "Grouping: 54 dragons", "Sharing: 8 fish for each dragon"], "a": 3, "why": "6 dragons are the groups, so it is sharing: 48 ÷ 6 = 8 fish each.", "no": ["The 6 dragons are the groups. You are finding how many fish each one gets.", "42 is 48 − 6. That is subtracting.", "54 is 48 + 6. That is adding.", null]}, {"q": "Hiccup puts <b>63 arrows</b> into quivers. Each quiver holds <b>9</b>. How many quivers does he fill?", "choices": ["7", "54", "72", "8"], "a": 0, "why": "Grouping: 63 ÷ 9 = 7 quivers. Confirm: 7 × 9 = 63.", "no": [null, "54 is 63 − 9.", "72 is 63 + 9.", "9 × 8 = 72, not 63."]}, {"q": "Snotlout wrote <b>38 ÷ 7 = 5 R 3</b>. Check it. What do you find?", "choices": ["Wrong: 5 × 7 is 38", "Right: 5 × 7 + 3 = 38", "Wrong: it should be 6 R 0", "Wrong: the remainder should be 4"], "a": 1, "why": "5 × 7 = 35 and 35 + 3 = 38. It is confirmed.", "no": ["5 × 7 = 35. Then add the remainder 3.", null, "7 × 6 = 42. That is more than 38.", "38 − 35 = 3, not 4."]}, {"q": "Three facts from one family: <b>8 × 7 = 56</b>, <b>56 ÷ 7 = 8</b>, <b>56 ÷ 8 = 7</b>. Which fact is missing?", "choices": ["7 ÷ 56 = 8", "56 − 7 = 49", "7 × 8 = 56", "8 × 8 = 64"], "a": 2, "why": "The family is 7, 8 and 56. The missing fact is the turn-around: 7 × 8 = 56.", "no": ["Backward. The biggest number comes first in division.", "Subtraction is not in this family.", null, "That uses 64, not 56. It is a different family."]}, {"q": "Which number is <b>divisible</b> by 7?", "choices": ["54", "48", "58", "63"], "a": 3, "why": "7 × 9 = 63, so 63 ÷ 7 = 9 with nothing left over.", "no": ["54 ÷ 7 = 7 R 5. Something is left over.", "48 ÷ 7 = 6 R 6. Something is left over.", "58 ÷ 7 = 8 R 2. Something is left over.", null]}, {"q": "To <b>confirm</b> that 81 ÷ 9 = 9, you should…", "choices": ["multiply 9 × 9 and see if you get 81", "add 81 + 9 and see if you get 90", "divide 9 ÷ 81", "ask a friend for the answer"], "a": 0, "why": "Quotient × divisor = dividend: 9 × 9 = 81.", "no": [null, "Adding does not check a division.", "That is backward and does not check anything.", "Confirming means checking it yourself with math."]}, {"q": "Fishlegs gave a <b>precise</b> answer to 61 ÷ 9. Which answer is precise?", "choices": ["about 7", "6 R 7", "6", "a little less than 7"], "a": 1, "why": "9 × 6 = 54 and 61 − 54 = 7. 6 R 7 is exactly right.", "no": ["\"About\" is an estimate, not precise.", null, "That leaves out the remainder, so it is not exact.", "That is close, but not exact."]}]}], "win": "You proved it: division undoes multiplication, and you can check every answer!", "prev": "bb-bailey-L10", "prevTitle": "Lesson 10"});</script></body></html>
