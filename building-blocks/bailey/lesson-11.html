<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 11: Share or Group? Prove It!</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L11", "label": "Lesson 11", "title": "Share or Group? Prove It!", "goal": "I can tell if a story is sharing or grouping, find the missing number, and confirm my answer by multiplying.", "date": "2026-11-12", "mastery": 90, "color": "#E67E22", "slides": [{"type": "hello", "title": "On Your Own: Share or Group? Prove It!", "text": "In class you sorted sharing and grouping stories and confirmed answers by multiplying. Now you prove it on your own. It takes about 25 minutes and ends with <b>Show What You Know</b>.", "visual": {"kind": "emoji", "text": "🕵️✔️"}}, {"type": "talk", "kick": "Say it out loud", "title": "Teach it to someone", "text": "Find someone at home. Teach them. Say it out loud before you go on.", "prompts": ["Tell them the difference between a <b>sharing</b> story and a <b>grouping</b> story. Make up a dragon example of each.", "Show them how to <b>confirm</b> 43 ÷ 8 = 5 R 3 by multiplying.", "What is one thing in <i>How to Train Your Dragon</i> that Hiccup had to <b>decipher</b> or <b>interpret</b>?"], "starters": ["A sharing story … A grouping story …", "To confirm it, I multiply … then add …", "Hiccup had to … because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Remember the words", "text": "Tap each card. Say the meaning before you flip it. Then flip to check yourself.", "words": [{"word": "confirm", "pos": "verb", "emoji": "✔️", "meaning": "To show for sure that something is true or right.", "example": "I <b>confirm</b> 72 ÷ 8 = 9 by multiplying: 9 × 8 = 72."}, {"word": "unknown", "pos": "noun", "emoji": "❓", "meaning": "The missing number you need to find in a problem.", "example": "In ? ÷ 8 = 9, the <b>unknown</b> is 72."}, {"word": "divisible", "pos": "adjective", "emoji": "🧩", "meaning": "Able to be divided by a number with nothing left over.", "example": "56 is <b>divisible</b> by 8, but 58 is not."}, {"word": "interpret", "pos": "verb", "emoji": "🔍", "meaning": "To figure out what something means.", "example": "<b>Interpret</b> the story: is it sharing, or making groups?"}, {"word": "decipher", "pos": "verb", "emoji": "🗝️", "meaning": "To figure out something that is hard to read or understand, like a code.", "example": "Hiccup could <b>decipher</b> Dragonese, the language of dragons."}, {"word": "precise", "pos": "adjective", "emoji": "🎯", "meaning": "Exactly right, with every detail correct.", "example": "Be <b>precise</b>: 45 ÷ 6 is 7 R 3, not just \"about 7\"."}, {"word": "daunting", "pos": "adjective", "emoji": "⛰️", "meaning": "Seeming hard or scary to do, before you start.", "example": "Big division problems look <b>daunting</b>, but one fact at a time makes them easy."}]}, {"type": "learn", "kick": "Remember", "title": "Interpret, solve, confirm", "text": "<b>Sharing</b>: you know the number of groups, find how many in each. <b>Grouping</b>: you know how many in each, find the number of groups.", "visual": {"kind": "bigtext", "text": "quotient × divisor (+ remainder) = dividend"}, "tip": "Never trust an answer until you confirm it."}, {"type": "sort", "kick": "Sort it", "title": "Sharing or grouping?", "text": "Tap a story. Then tap the box that tells what the story asks.", "buckets": ["🤲 Sharing<br><small>find how many in EACH</small>", "📦 Grouping<br><small>find how many GROUPS</small>"], "items": [{"text": "Fishlegs puts 48 eggs into nests of 8. How many nests?", "b": 1, "why": "You know how many in each nest (8). You find how many nests.", "hint": "Is 8 the number of nests, or the eggs in each nest?"}, {"text": "56 Vikings sit at 7 tables, the same number at each. How many at each table?", "b": 0, "why": "You know the groups (7 tables). You find how many at each.", "hint": "Do you know how many tables there are?"}, {"text": "Hiccup reads 9 pages a night. How many nights to read 72 pages?", "b": 1, "why": "Each night is a group of 9 pages. You find how many nights.", "hint": "9 pages go in each night. What are you finding?"}, {"text": "Stoick shares 36 apples equally among 6 children. How many apples does each child get?", "b": 0, "why": "You know the groups (6 children). You find how many each gets.", "hint": "Do you know how many children there are?"}, {"text": "Toothless carries 6 fish per trip. How many trips to move 54 fish?", "b": 1, "why": "Each trip is a group of 6 fish. You find how many trips.", "hint": "6 fish go in each trip. What are you finding?"}, {"text": "63 shields are hung evenly on 9 walls. How many on each wall?", "b": 0, "why": "You know the groups (9 walls). You find how many on each.", "hint": "Do you know how many walls there are?"}], "done": "Same division, different question. Interpret the story before you solve it."}, {"type": "tap", "kick": "Your turn", "title": "Confirm it", "text": "Type the number you get when you check.", "items": [{"type": "fill", "q": "Check <b>63 ÷ 9 = 7</b>: 7 × 9 = ____", "answers": ["63"], "why": "7 × 9 = 63. It matches the dividend, so 63 ÷ 9 = 7 is confirmed.", "no": "Use the ×9 shortcut: 70 − 7."}, {"type": "fill", "q": "Check <b>45 ÷ 6 = 7 R 3</b>: 7 × 6 + 3 = ____", "answers": ["45"], "why": "7 × 6 = 42 and 42 + 3 = 45. It matches, so the answer is confirmed.", "no": "Multiply 7 × 6 first, then add the 3."}, {"type": "fill", "q": "Snotlout wrote <b>48 ÷ 6 = 7</b>. Check: 7 × 6 = 42, not 48. What is the right quotient?", "answers": ["8", "eight"], "why": "6 × 8 = 48, so 48 ÷ 6 = 8.", "no": "Try one more: 8 × 6 = ?"}, {"q": "Fishlegs wrote <b>60 ÷ 8 = 7 R 4</b>. Check it. What do you find?", "choices": ["Right: 7 × 8 + 4 = 60", "Wrong: it should be 8 R 0", "Wrong: it should be 6 R 12"], "a": 0, "why": "7 × 8 = 56 and 56 + 4 = 60. It is confirmed.", "no": [null, "8 × 8 = 64. That is more than 60.", "12 left over is more than 8. One more group fits."]}]}, {"type": "tap", "kick": "Your turn", "title": "Find the unknown", "items": [{"type": "fill", "q": "<b>? ÷ 8 = 7</b>. What is the unknown?", "answers": ["56"], "why": "7 × 8 = 56. Confirm: 56 ÷ 8 = 7.", "no": "The dividend is missing. Multiply."}, {"type": "fill", "q": "<b>54 ÷ ? = 9</b>. What is the unknown?", "answers": ["6", "six"], "why": "9 × 6 = 54, so 54 ÷ 6 = 9.", "no": "Ask: 9 × what = 54?"}, {"type": "fill", "q": "A fact family has <b>6</b> and <b>42</b>. The biggest number is 42. What is the third number?", "answers": ["7", "seven"], "why": "6 × 7 = 42, so the family is 6, 7 and 42.", "no": "Ask: 6 × what = 42?"}]}, {"type": "tap", "kick": "Your turn", "title": "Story problems", "text": "Interpret, solve, confirm. Type the number.", "items": [{"type": "fill", "q": "Stoick has <b>64 fish</b>. He gives <b>8</b> to each dragon. How many dragons does he feed?", "answers": ["8", "8 dragons", "eight"], "why": "Grouping: 64 ÷ 8 = 8 dragons. Confirm: 8 × 8 = 64.", "no": "Is 8 the dragons, or the fish for each dragon?"}, {"type": "fill", "q": "<b>49 Vikings</b> row in <b>7 boats</b>, the same number in each boat. How many Vikings in each boat?", "answers": ["7", "7 Vikings", "seven"], "why": "Sharing: 49 ÷ 7 = 7 in each boat. Confirm: 7 × 7 = 49.", "no": "Ask: 7 × what = 49?"}, {"q": "Hiccup has <b>58 arrows</b>. He puts <b>8</b> in each quiver. How many quivers can he fill, and how many arrows are left?", "choices": ["8 quivers, 0 left", "7 quivers, 2 left", "6 quivers, 10 left"], "a": 1, "why": "8 × 7 = 56 and 58 − 56 = 2. So 58 ÷ 8 = 7 R 2.", "no": ["8 × 8 = 64. That is more arrows than he has.", null, "10 left is more than 8. Another quiver can be filled."]}]}, {"type": "tap", "kick": "Word work", "title": "Words in action", "text": "Type the word.", "items": [{"type": "fill", "q": "To figure out what a story means and what it asks is to ____ it. (Use a word from your word cards.)", "answers": ["interpret"], "why": "To <i>interpret</i> is to figure out what something means.", "no": "It starts with i."}, {"type": "fill", "q": "56 can be divided by 8 with nothing left over. 56 is ____ by 8. (Use a word from your word cards.)", "answers": ["divisible"], "why": "<i>Divisible</i> means able to be divided with nothing left over.", "no": "It starts with d and ends with -ible."}, {"q": "The mountain looked <b>daunting</b>, but Hiccup began the climb. Which word means almost the same as <i>daunting</i>?", "choices": ["easy", "scary to start", "finished"], "a": 1, "why": "<i>Daunting</i> means it seems hard or scary before you begin.", "no": ["That is the opposite.", null, "Daunting describes how it feels before you start."]}]}, {"type": "recall", "kick": "Remember?", "title": "Earlier lessons", "items": [{"type": "fill", "q": "<b>38 ÷ 9</b> = ____ &nbsp; (use R for the remainder)", "answers": ["4 R 2", "4 remainder 2", "4 rem 2"], "why": "9 × 4 = 36 and 38 − 36 = 2. So 38 ÷ 9 = 4 R 2.", "no": "Find the biggest 9s fact under 38.", "placeholder": "like 4 R 2"}, {"type": "fill", "q": "Use the area model: <b>47 × 6</b> = ____", "answers": ["282"], "why": "40 × 6 = 240 and 7 × 6 = 42. 240 + 42 = 282.", "no": "40 × 6 = 240. Now add 7 × 6.", "visual": {"kind": "area", "b": 6, "split": [40, 7], "show": false}}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "<b>? ÷ 9 = 4</b>. What is the unknown?", "answers": ["36"], "why": "4 × 9 = 36, so 36 ÷ 9 = 4.", "no": "The dividend is missing. Multiply."}, {"type": "fill", "q": "<b>72 ÷ ? = 8</b>. What is the unknown?", "answers": ["9", "nine"], "why": "8 × 9 = 72, so 72 ÷ 9 = 8.", "no": "Ask: 8 × what = 72?"}, {"q": "Only one division is correct. Check each one. Which is it?", "choices": ["56 ÷ 8 = 6", "42 ÷ 7 = 6", "54 ÷ 6 = 8", "63 ÷ 9 = 8"], "a": 1, "why": "6 × 7 = 42, so 42 ÷ 7 = 6 is confirmed.", "no": ["Check: 6 × 8 = 48, not 56.", null, "Check: 8 × 6 = 48, not 54.", "Check: 8 × 9 = 72, not 63."]}, {"type": "fill", "q": "Stoick shares 48 fish equally among 6 dragons. What kind of story is it? Type <b>sharing</b> or <b>grouping</b>.", "answers": ["sharing", "share"], "why": "You know the groups (6 dragons). You find how many fish each gets: 48 ÷ 6 = 8.", "no": "Is 6 the number of dragons, or the fish for each dragon?"}, {"type": "fill", "q": "Hiccup puts <b>63 arrows</b> into quivers. Each quiver holds <b>9</b>. How many quivers does he fill?", "answers": ["7", "7 quivers", "seven"], "why": "Grouping: 63 ÷ 9 = 7 quivers. Confirm: 7 × 9 = 63.", "no": "Ask: 9 × what = 63?"}, {"q": "Snotlout wrote <b>38 ÷ 7 = 5 R 3</b>. Check it. What do you find?", "choices": ["Wrong: 5 × 7 is 38", "Right: 5 × 7 + 3 = 38", "Wrong: it should be 6 R 0", "Wrong: the remainder should be 4"], "a": 1, "why": "5 × 7 = 35 and 35 + 3 = 38. It is confirmed.", "no": ["5 × 7 = 35. Then add the remainder 3.", null, "7 × 6 = 42. That is more than 38.", "38 − 35 = 3, not 4."]}, {"type": "fill", "q": "Three facts from one family: 8 × 7 = 56, 56 ÷ 7 = 8, 56 ÷ 8 = 7. Which multiplication fact is missing? Type it.", "answers": ["7 × 8 = 56", "7 × 8", "7 times 8 = 56", "7 times 8 is 56", "7 times 8", "56 = 7 × 8"], "why": "The missing fact is the turn-around: 7 × 8 = 56.", "no": "Turn 8 × 7 = 56 around.", "placeholder": "like 2 × 3 = 6"}, {"q": "Which number is <b>divisible</b> by 7?", "choices": ["54", "48", "58", "63"], "a": 3, "why": "7 × 9 = 63, so 63 ÷ 7 = 9 with nothing left over.", "no": ["54 ÷ 7 = 7 R 5. Something is left over.", "48 ÷ 7 = 6 R 6. Something is left over.", "58 ÷ 7 = 8 R 2. Something is left over.", null]}, {"type": "fill", "q": "To show for sure that an answer is right is to ____ it. (Use a word from your word cards.)", "answers": ["confirm"], "why": "To <i>confirm</i> is to show for sure that something is true or right.", "no": "It starts with c."}, {"q": "To <b>confirm</b> that 42 ÷ 6 = 7, you should…", "choices": ["multiply 7 × 6 and see if you get 42", "add 42 + 6 and see if you get 48", "divide 6 ÷ 42", "ask a friend for the answer"], "a": 0, "why": "Quotient × divisor = dividend: 7 × 6 = 42.", "no": [null, "Adding does not check a division.", "That is backward and does not check anything.", "Confirming means checking it yourself with math."]}], [{"type": "fill", "q": "<b>? ÷ 9 = 7</b>. What is the unknown?", "answers": ["63"], "why": "7 × 9 = 63, so 63 ÷ 9 = 7.", "no": "The dividend is missing. Multiply."}, {"type": "fill", "q": "<b>48 ÷ ? = 6</b>. What is the unknown?", "answers": ["8", "eight"], "why": "6 × 8 = 48, so 48 ÷ 8 = 6.", "no": "Ask: 6 × what = 48?"}, {"q": "Check each division. Only one is correct. Which one?", "choices": ["72 ÷ 8 = 8", "49 ÷ 7 = 6", "64 ÷ 8 = 8", "54 ÷ 9 = 7"], "a": 2, "why": "8 × 8 = 64, so 64 ÷ 8 = 8 is confirmed.", "no": ["Check: 8 × 8 = 64, not 72.", "Check: 6 × 7 = 42, not 49.", null, "Check: 7 × 9 = 63, not 54."]}, {"type": "fill", "q": "Fishlegs ties 56 arrows into bundles of 8. What kind of story is it? Type <b>sharing</b> or <b>grouping</b>.", "answers": ["grouping", "group", "groups"], "why": "You know how many go in each bundle (8). You find how many bundles: 56 ÷ 8 = 7.", "no": "Is 8 the number of bundles, or the arrows in each bundle?"}, {"type": "fill", "q": "Stoick shares <b>81 fish</b> equally among <b>9 dragons</b>. How many fish does each dragon get?", "answers": ["9", "9 fish", "nine"], "why": "Sharing: 81 ÷ 9 = 9 fish each. Confirm: 9 × 9 = 81.", "no": "Ask: 9 × what = 81?"}, {"q": "Hiccup wrote <b>50 ÷ 6 = 8 R 2</b>. Check it. What do you find?", "choices": ["Wrong: 8 × 6 is 50", "Wrong: it should be 7 R 8", "Right: 8 × 6 + 2 = 50", "Wrong: the remainder should be 0"], "a": 2, "why": "8 × 6 = 48 and 48 + 2 = 50. It is confirmed.", "no": ["8 × 6 = 48. Then add the remainder 2.", "8 left over is more than 6. One more group fits.", null, "8 × 6 = 48, so 2 are left over."]}, {"type": "fill", "q": "Two facts in a family are 9 × 6 = 54 and 54 ÷ 9 = 6. Finish this one: 54 ÷ 6 = ____", "answers": ["9", "nine"], "why": "6 × 9 = 54, so 54 ÷ 6 = 9.", "no": "Which number has not been the answer yet?"}, {"q": "Which number is <b>divisible</b> by 8?", "choices": ["60", "56", "50", "44"], "a": 1, "why": "8 × 7 = 56 with nothing left over.", "no": ["60 ÷ 8 = 7 R 4. Something is left over.", null, "50 ÷ 8 = 6 R 2. Something is left over.", "44 ÷ 8 = 5 R 4. Something is left over."]}, {"type": "fill", "q": "The missing number you need to find in a problem is the ____. (Use a word from your word cards.)", "answers": ["unknown", "the unknown"], "why": "The <i>unknown</i> is the missing number you need to find.", "no": "It means not known yet. It starts with u."}, {"q": "The test looked <b>daunting</b>. How did it seem before Bailey started?", "choices": ["hard or scary to start", "exactly right", "already finished", "very easy"], "a": 0, "why": "<i>Daunting</i> means it seems hard or scary before you begin.", "no": [null, "That is what precise means.", "Daunting describes how it feels before you start.", "That is the opposite."]}], [{"type": "fill", "q": "<b>? ÷ 6 = 8</b>. What is the unknown?", "answers": ["48"], "why": "8 × 6 = 48, so 48 ÷ 6 = 8.", "no": "The dividend is missing. Multiply."}, {"type": "fill", "q": "<b>40 ÷ ? = 5</b>. What is the unknown?", "answers": ["8", "eight"], "why": "5 × 8 = 40, so 40 ÷ 8 = 5.", "no": "Ask: 5 × what = 40?"}, {"q": "Snotlout checked four answers. Which one is confirmed?", "choices": ["42 ÷ 6 = 8", "56 ÷ 7 = 7", "45 ÷ 9 = 6", "35 ÷ 7 = 5"], "a": 3, "why": "5 × 7 = 35, so 35 ÷ 7 = 5 is confirmed.", "no": ["Check: 8 × 6 = 48, not 42.", "Check: 7 × 7 = 49, not 56.", "Check: 6 × 9 = 54, not 45.", null]}, {"type": "fill", "q": "63 fish are split evenly among 7 dragons. What kind of story is it? Type <b>sharing</b> or <b>grouping</b>.", "answers": ["sharing", "share"], "why": "You know the groups (7 dragons). You find how many each gets: 63 ÷ 7 = 9.", "no": "Is 7 the number of dragons, or the fish for each dragon?"}, {"type": "fill", "q": "Toothless eats <b>6 fish</b> a day. How many days will <b>54 fish</b> last?", "answers": ["9", "9 days", "nine"], "why": "Grouping: 54 ÷ 6 = 9 days. Confirm: 9 × 6 = 54.", "no": "Each day is a group of 6. Ask: 6 × what = 54?"}, {"q": "Fishlegs wrote <b>61 ÷ 8 = 7 R 6</b>. Check it. What do you find?", "choices": ["Right: 7 × 8 + 6 = 61", "Wrong: 7 × 8 + 6 = 62, so it should be 7 R 5", "Wrong: it should be 8 R 0", "Wrong: it should be 6 R 13"], "a": 1, "why": "7 × 8 = 56 and 61 − 56 = 5. So 61 ÷ 8 = 7 R 5.", "no": ["7 × 8 = 56 and 56 + 6 = 62, not 61.", null, "8 × 8 = 64. That is more than 61.", "13 left over is more than 8. One more group fits."]}, {"type": "fill", "q": "A fact family has <b>8</b> and <b>72</b>. The biggest number is 72. What is the third number?", "answers": ["9", "nine"], "why": "8 × 9 = 72, so the family is 8, 9 and 72.", "no": "Ask: 8 × what = 72?"}, {"q": "Which number is <b>divisible</b> by 9?", "choices": ["56", "27", "48", "60"], "a": 1, "why": "9 × 3 = 27 with nothing left over.", "no": ["56 ÷ 9 = 6 R 2. Something is left over.", null, "48 ÷ 9 = 5 R 3. Something is left over.", "60 ÷ 9 = 6 R 6. Something is left over."]}, {"type": "fill", "q": "To figure out a code or something hard to read is to ____ it. (Use a word from your word cards.)", "answers": ["decipher"], "why": "To <i>decipher</i> is to figure out something hard to read or understand, like a code.", "no": "Hiccup did it with Dragonese. It starts with d."}, {"q": "Be <b>precise</b>. What is 52 ÷ 7?", "choices": ["about 7", "7", "7 R 3", "8 R 4"], "a": 2, "why": "7 × 7 = 49 and 52 − 49 = 3. Precise means the exact answer: 7 R 3.", "no": ["\"About\" is not precise. Give the exact answer.", "You left out the 3 left over.", null, "7 × 8 = 56. That is more than 52."]}]]}], "win": "You proved it: division undoes multiplication, and you can check every answer!", "prev": "bb-bailey-L10", "prevTitle": "Lesson 10"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
