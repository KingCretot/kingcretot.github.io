<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 6: Stop Adding, Start Multiplying</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L06", "label": "Lesson 6", "title": "Stop Adding, Start Multiplying", "goal": "I can use an area model to multiply a 2-digit number by a 1-digit number.", "date": "2026-11-02", "mastery": 90, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Stop Adding, Start Multiplying", "text": "Your 6, 7, 8 and 9 facts are getting fast. Today they become <b>power tools</b> for big problems like <b>75 × 8</b>. Have your whiteboard, grid paper, 2 colored pencils, 3 cups and a handful of beans ready.", "visual": {"kind": "bigtext", "text": "75 × 8 = ?", "sub": "No more adding 8 over and over!"}, "notes": {"do": "Screen-share this slide on Zoom. Before you start, have her hold up each item to the camera: whiteboard and marker, grid paper, 2 colored pencils, 3 cups, about 50 dry beans, and her book.", "say": "Today we are going to stop doing something slow and start doing something smart. By the end of class you will find 75 × 8 with just two facts and one addition.", "ask": "Without working it out, do you think 75 × 8 is closer to 60, 600 or 6,000?", "listen": "Right: about 600 (75 is close to 80, and 80 × 8 = 640). If she says 60 or 6,000, do not correct yet; say: hold on to that guess and we will check it."}}, {"type": "talk", "kick": "Book Talk", "title": "Brains or muscles?", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What happened in the part you read last? Tell it in order: first, next, then.", "Hiccup is not the biggest or strongest Viking on Berk. What does he use instead to solve problems?", "Find a time someone in the book did something the hard way. What would have been a smarter way?"], "starters": ["In the part I read, first …", "Hiccup uses his … instead of …", "A smarter way would be … because …"], "notes": {"do": "5–6 minutes. She talks; you only ask follow-ups. Tap the gold star button for a strong, detailed answer.", "say": "Tell me what happened in the part you read, in order. Use first, next, then.", "ask": "Hiccup is not the strongest Viking. So what does he use to win? Can you think of a time someone in the book did something the hard way?", "listen": "A strong answer names a real event and uses a sequence word. For prompt 2 listen for brains, ideas, tricks, planning. Connect it: today we stop using math muscles (adding 8 over and over) and start using math brains (multiplying)."}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read the word, the meaning and the example out loud.", "words": [{"word": "area model", "pos": "noun", "meaning": "A rectangle split into boxes that helps you multiply a big number one part at a time.", "example": "I drew an <b>area model</b> for 75 × 8 with two boxes.", "emoji": "🟪"}, {"word": "partial product", "pos": "noun", "meaning": "The answer from one box of an area model. You add the partial products to get the final answer.", "example": "For 75 × 8, the <b>partial products</b> are 560 and 40.", "emoji": "🧩"}, {"word": "expanded form", "pos": "noun", "meaning": "A number written as the sum of the values of its digits.", "example": "The <b>expanded form</b> of 75 is 70 + 5.", "emoji": "🔢"}, {"word": "dimensions", "pos": "noun", "meaning": "The measurements of the sides of a shape: how long and how wide it is.", "example": "The <b>dimensions</b> of my rectangle are 75 and 8.", "emoji": "📏"}, {"word": "laborious", "pos": "adjective", "meaning": "Needing a lot of slow, hard work.", "example": "Adding 8 seventy-five times is <b>laborious</b>.", "emoji": "😩"}, {"word": "resourceful", "pos": "adjective", "meaning": "Good at finding clever ways to solve a problem with what you have.", "example": "Hiccup cannot win with muscles, so he has to be <b>resourceful</b>.", "emoji": "💡"}, {"word": "immense", "pos": "adjective", "meaning": "Extremely large; huge.", "example": "Next to an <b>immense</b> sea dragon, a Viking ship looks like a toy.", "emoji": "🐉"}, {"word": "abandon", "pos": "verb", "meaning": "To leave something behind and stop using it.", "example": "Today we <b>abandon</b> the slow adding method.", "emoji": "🚪"}], "notes": {"do": "She flips all 8 cards and reads each one aloud. After each math word, she points to it on the next slides later. After each book word, she makes her own sentence.", "say": "Four of these words are math words we will use all class. Four are strong words for your book and your writing.", "ask": "Use <b>laborious</b> in a sentence about chores. Use <b>immense</b> in a sentence about a dragon. What is something you would <b>abandon</b> if it was not working?", "listen": "Laborious = slow, hard work (not just hard). Immense = huge. If she says 'immense means scary', ask: could a tiny spider be immense? No, so immense is about size."}}, {"type": "learn", "kick": "Learn", "title": "Why adding is so slow", "text": "The old way to find <b>75 × 8</b>: add 8 again and again.", "visual": {"kind": "bigtext", "text": "8 + 8 + 8 + 8 + 8 + …", "sub": "That is 75 eights to add!"}, "steps": [{"text": "That is <b>75 numbers</b> to add. If you lose count once, the answer is wrong."}, {"text": "It is <b>laborious</b>, and it hides how big the answer really is."}, {"text": "Today you <b>abandon</b> that method. You will use just <b>two facts</b> and <b>one addition</b>."}], "tip": "Multiplying is a shortcut for adding equal groups. Big numbers need a smart shortcut too.", "notes": {"do": "Hands-on race first: start a 30-second timer and have her write 8 + 8 + 8 + … on her whiteboard and keep a running total. Stop her at 30 seconds.", "say": "Stop! How many eights did you get through? To find 75 × 8 that way you would need 75 of them, with no mistakes.", "ask": "If you lose count at the 40th eight, what happens to your answer? Why is this method laborious?", "listen": "She should say the answer would be wrong and it takes too long. Then click through the 3 steps and have her read them aloud."}}, {"type": "learn", "kick": "Learn", "title": "Facts with a zero", "text": "You know <b>7 × 8 = 56</b>. So what is <b>70 × 8</b>?", "steps": [{"text": "70 is <b>7 tens</b>."}, {"text": "7 tens × 8 = <b>56 tens</b>."}, {"text": "56 tens is <b>560</b>.", "visual": {"kind": "bigtext", "text": "70 × 8 = 560"}}], "tip": "Do the fact first. Then keep the zero: tens times a number still gives tens.", "notes": {"do": "Click through the steps one at a time. Have her write 7 tens × 8 = 56 tens on her whiteboard and hold it up.", "say": "70 is not seventy ones. It is 7 tens. 7 tens times 8 is 56 tens. 56 tens is 560.", "ask": "If 6 × 9 = 54, what is 60 × 9? How many zeros does the answer get, and why?", "listen": "Right: 540, one zero because only one factor is a tens number. Wrong: 54 (dropped the zero) or 5,400 (too many zeros). Say it again in tens: 6 tens × 9 = 54 tens."}}, {"type": "tap", "kick": "Try it", "title": "Tens times a fact", "items": [{"q": "What is <b>60 × 7</b>?", "choices": ["42", "4,200", "420", "67"], "a": 2, "why": "6 × 7 = 42, so 6 tens × 7 = 42 tens = <b>420</b>.", "no": ["That is 6 × 7. But 60 is 6 <b>tens</b>, so the answer is 42 tens.", "Too many zeros. Only one factor has a zero, so the answer gets one zero.", null, "You wrote the digits side by side. Multiply 6 × 7 first."]}, {"q": "What is <b>90 × 6</b>?", "choices": ["540", "96", "450", "5,400"], "a": 0, "why": "9 × 6 = 54, so 90 × 6 = <b>540</b>.", "no": [null, "You added 90 + 6. The sign says multiply.", "That is 90 × 5. One more group of 90 makes 540.", "Too many zeros. 9 × 6 = 54, and 90 has one zero."]}, {"q": "Which one shows how to find <b>80 × 9</b>?", "choices": ["8 + 9 = 17, so 80 × 9 = 170", "8 × 9 = 72, so 80 × 9 = 720", "8 × 9 = 72, so 80 × 9 = 7,200"], "a": 1, "why": "8 tens × 9 = 72 tens = <b>720</b>.", "no": ["That is adding. You need the fact 8 × 9.", null, "Only one zero. 80 has one zero, so the answer has one more zero than 72."]}], "notes": {"do": "She says each fact in tens out loud BEFORE she taps. Example: '6 tens times 7 is 42 tens, so 420.'", "ask": "Before you tap: what is the basic fact hiding in this problem?", "listen": "If she taps 42 or 4,200, have her say the tens sentence and try again. The third item is about reasoning: ask why 7,200 has one zero too many."}}, {"type": "learn", "kick": "Hands-on", "title": "Why splitting works", "text": "Put <b>14</b> beans in each of <b>3</b> cups. That is <b>3 × 14</b>.", "visual": {"kind": "groups", "groups": 3, "each": 14, "emoji": "🫘", "label": "3 cups of 14 beans"}, "steps": [{"text": "In each cup, split the beans into a pile of <b>10</b> and a pile of <b>4</b>."}, {"text": "All the 10-piles: 3 × 10 = <b>30</b>. All the 4-piles: 3 × 4 = <b>12</b>.", "visual": {"kind": "area", "b": 3, "split": [10, 4], "show": true}}, {"text": "30 + 12 = <b>42</b>. Splitting did not change the beans. It just made them <b>easier to count</b>."}], "tip": "That is exactly what an area model does: split the big number, multiply each part, add.", "notes": {"do": "At home on camera: she counts 14 beans into each of the 3 cups. Then she pours each cup out and pushes the beans into a pile of 10 and a pile of 4. Click the steps as she does it.", "say": "We did not add or remove a single bean. We only split each group into tens and ones. Splitting makes the counting easy.", "ask": "How many beans are in all the 10-piles together? In all the 4-piles? So how many beans in all?", "listen": "30, 12, 42. If she starts counting beans one by one, stop her: use the fact 3 × 10 and the fact 3 × 4."}}, {"type": "learn", "kick": "Learn", "title": "Meet the area model", "text": "Let's find <b>75 × 8</b> with an <b>area model</b>.", "steps": [{"text": "<b>Step 1.</b> Write 75 in <b>expanded form</b>: 70 + 5.", "visual": {"kind": "bigtext", "text": "75 = 70 + 5"}}, {"text": "<b>Step 2.</b> Draw a rectangle. Split it into a <b>70</b> box and a <b>5</b> box. The other side is <b>8</b>.", "visual": {"kind": "area", "b": 8, "split": [70, 5], "show": false}}, {"text": "<b>Step 3.</b> Multiply each box. 70 × 8 = 560 and 5 × 8 = 40. These are the <b>partial products</b>.", "visual": {"kind": "area", "b": 8, "split": [70, 5], "show": true}}, {"text": "<b>Step 4.</b> Add the partial products: 560 + 40 = <b>600</b>.", "visual": {"kind": "bigtext", "text": "75 × 8 = 600"}}], "tip": "Two facts (7 × 8 and 5 × 8) and one addition. That beats 75 additions!", "notes": {"do": "Click one step at a time. At step 2, she draws a long rectangle on grid paper, colors the 70 part one color and the 5 part another, and holds it up to the camera.", "say": "Step 1: expanded form. Step 2: draw the boxes. Step 3: multiply each box. Step 4: add. That is two facts and one addition instead of 75 additions.", "ask": "Why is the 70 box so much bigger than the 5 box? Which basic fact do you need for each box? Now look back: was your guess of 600 from the start of class right?", "listen": "She should say 7 × 8 and 5 × 8. The 70 box is bigger because 70 is bigger than 5. 560 + 40 = 600 matches the guess from slide 1."}}, {"type": "tap", "kick": "Try it", "title": "Fill the boxes: 46 × 7", "items": [{"q": "This is the area model for <b>46 × 7</b>. What goes in the <b>40</b> box?", "visual": {"kind": "area", "b": 7, "split": [40, 6], "show": false}, "choices": ["28", "47", "240", "280"], "a": 3, "why": "4 × 7 = 28, so 40 × 7 = <b>280</b>.", "no": ["40 is 4 <b>tens</b>. 4 × 7 = 28, so 40 × 7 = 280.", "You added 40 + 7. Each box is multiplied.", "That is 40 × 6. The side of the rectangle is 7, so do 40 × 7.", null]}, {"q": "The partial products for <b>46 × 7</b> are 280 and 42. What is 46 × 7?", "choices": ["322", "312", "70"], "a": 0, "why": "280 + 42 = <b>322</b>.", "no": [null, "Check the addition. 80 + 40 = 120 and 2 more is 122, so 280 + 42 = 322.", "You added 28 + 42, but the 40 box holds 280, not 28."]}, {"q": "Which area model is set up correctly for <b>83 × 6</b>?", "choices": ["Boxes 8 and 3. The side is 6.", "Boxes 80 and 6. The side is 3.", "Boxes 80 and 3. The side is 6."], "a": 2, "why": "83 = 80 + 3, and the side of the rectangle is 6.", "no": ["The 8 in 83 is really 80. Use expanded form: 80 + 3.", "Split 83 into 80 + 3. The 6 is the other side of the rectangle.", null]}], "notes": {"do": "She draws the 46 × 7 rectangle on her paper and writes the partial products inside BEFORE tapping.", "ask": "What goes in the 40 box? What goes in the 6 box? Now add them.", "listen": "280 and 42, total 322. If she says 240 she multiplied by 6 instead of 7: point to the side of the rectangle. For item 3 she must say why 8 and 3 is wrong (the 8 is really 80)."}}, {"type": "order", "kick": "Put it in order", "title": "Area model steps: 57 × 8", "text": "Tap the steps in the order you would do them.", "steps": ["Write 57 as 50 + 7", "Draw a 50 box and a 7 box with side 8", "Multiply each box: 50 × 8 = 400 and 7 × 8 = 56", "Add the partial products: 400 + 56", "Write the answer: 57 × 8 = 456"], "why": "57 × 8 = <b>456</b>. Two facts and one addition.", "hint": "Start by breaking 57 into tens and ones. You need the boxes before you can multiply them, and the partial products before you can add.", "notes": {"do": "She says each step aloud as she taps it.", "ask": "Why can't you add the partial products before you multiply the boxes?", "listen": "Because you need the boxes before you can multiply them, and the partial products before you can add. Answer: 456."}}, {"type": "tap", "kick": "Guided practice", "title": "Your turn, out loud: 38 × 9", "text": "Draw it on your whiteboard first. Tell me each box before you type.", "items": [{"type": "fill", "q": "38 × 9: what goes in the <b>30</b> box?", "visual": {"kind": "area", "b": 9, "split": [30, 8], "show": false}, "answers": ["270"], "why": "3 × 9 = 27, so 30 × 9 = <b>270</b>.", "no": "30 is 3 tens. Do 3 × 9, then keep the zero.", "hint": "3 tens × 9 = 27 tens."}, {"type": "fill", "q": "What goes in the <b>8</b> box?", "answers": ["72"], "why": "8 × 9 = <b>72</b>. Shortcut: 10 × 8 − 8 = 72.", "no": "Multiply 8 by the side of the rectangle, 9.", "hint": "Ten 8s is 80. Take away one 8."}, {"type": "fill", "q": "Add the partial products. <b>38 × 9 = ____</b>", "answers": ["342"], "why": "270 + 72 = <b>342</b>.", "no": "Add 270 and 72. 7 tens + 7 tens = 14 tens.", "hint": "270 + 72: 200 + 140 + 2."}], "notes": {"do": "She leads this one. You only ask the questions. Her whiteboard goes up to the camera after each box.", "say": "You are the teacher now. Tell me every step.", "ask": "What is 38 in expanded form? Which side is the 9 on? Which fact gives the 8 box?", "listen": "She should say 30 + 8, then 270, then 72, then 342. If she freezes on 8 × 9, ask: what is ten 8s? Take away one 8."}}, {"type": "tap", "kick": "Try it", "title": "Problems on Berk", "items": [{"q": "Gobber hangs <b>8</b> rows of shields in the Great Hall. Each row has <b>36</b> shields. How many shields?", "choices": ["44", "288", "248", "268"], "a": 1, "why": "30 × 8 = 240 and 6 × 8 = 48. 240 + 48 = <b>288</b> shields.", "no": ["You added 36 + 8. There are 8 equal rows of 36, so multiply.", null, "The tens box is right (240), but the ones box is 6 × 8 = 48, not 8.", "Check 6 × 8. It is 48, not 28. 240 + 48 = 288."]}, {"q": "Fishlegs wants to find <b>64 × 9</b>. Which way is fast <b>and</b> correct?", "choices": ["60 × 9 + 4 × 9 = 540 + 36 = 576", "Add 9 + 9 + 9 … sixty-four times", "60 × 9 + 4 = 544", "64 + 9 = 73"], "a": 0, "why": "Two partial products: 540 + 36 = <b>576</b>.", "no": [null, "That works, but it is laborious: 64 numbers to add, and one slip ruins it.", "The 4 box must be multiplied by 9 too: 4 × 9 = 36.", "That is adding, not multiplying."]}], "notes": {"do": "For each story she draws the area model on her whiteboard first, then taps.", "ask": "What are the equal groups in this story? How many groups, and how many in each?", "listen": "8 rows of 36 shields. If she adds 36 + 8, ask: are there 8 equal rows? Then it is multiplication. For Fishlegs, she must say why the other ways are slow or wrong."}}, {"type": "recall", "kick": "Remember", "title": "Your fact shortcuts", "text": "These shortcuts from the last two weeks make the boxes fast.", "items": [{"q": "Which shortcut gives <b>9 × 8</b>?", "choices": ["10 × 8 + 8 = 88", "9 × 10 − 9 = 81", "10 × 8 − 8 = 72"], "a": 2, "why": "Ten 8s is 80. Take away one 8: <b>72</b>.", "no": ["Nine groups is one group <b>less</b> than ten groups, so subtract.", "That is 9 × 9. Take away one group of 8, not 9.", null]}, {"q": "Double, double, double: 7 → 14 → 28 → ___. This gives 8 × 7.", "choices": ["42", "56", "54"], "a": 1, "why": "28 + 28 = <b>56</b>, so 8 × 7 = 56.", "no": ["42 is 28 + 14. Doubling 28 means 28 + 28.", null, "28 + 28 = 56. Remember 5, 6, 7, 8: 56 = 7 × 8."]}, {"q": "<b>6 × 7</b> is 5 × 7 plus one more group. Which is right?", "choices": ["35 + 7 = 42", "35 + 6 = 41", "35 + 1 = 36"], "a": 0, "why": "5 × 7 = 35, plus one more 7 is <b>42</b>.", "no": [null, "One more group of <b>7</b>, not 6.", "Add one whole group of 7, not just 1."]}], "notes": {"do": "Quick and out loud. She names the shortcut before tapping.", "say": "Every box in an area model needs a fact. These shortcuts make the boxes fast.", "ask": "Which shortcut works for 9s? For 8s? For 6s?", "listen": "9s: ten groups minus one group. 8s: double, double, double. 6s: five groups plus one group."}}, {"type": "tap", "kick": "Word Power", "title": "Use your new words", "items": [{"q": "Which sentence uses <b>laborious</b> correctly?", "choices": ["The race was so laborious that it ended in two seconds.", "Toothless gave a laborious roar that made everyone jump.", "The laborious answer to 75 × 8 is 600.", "Counting 600 grains of sand one by one is laborious."], "a": 3, "why": "Counting one by one is slow, hard work. That is laborious.", "no": ["Laborious means slow, hard work. A two-second race is the opposite.", "A roar that makes people jump is loud or fierce, not slow, hard work.", "An answer is not slow, hard work. The adding <b>method</b> is laborious.", null]}, {"q": "In the area model for 75 × 8, which numbers are the <b>partial products</b>?", "choices": ["70 and 5", "560 and 40", "600", "75 and 8"], "a": 1, "why": "70 × 8 = 560 and 5 × 8 = 40 are the partial products.", "no": ["Those are the parts of 75 in expanded form. Partial products come from multiplying.", null, "600 is the final product. The partial products are the pieces you add to get it.", "Those are the dimensions of the rectangle."]}, {"q": "Hiccup cannot beat a huge dragon with muscles, so he finds a clever way with what he has. Which word describes Hiccup?", "choices": ["immense", "laborious", "resourceful", "abandoned"], "a": 2, "why": "<b>Resourceful</b> means good at finding clever ways to solve a problem with what you have.", "no": ["Immense means huge. Hiccup is not huge; he is clever.", "Laborious describes slow, hard work, not a clever person.", null, "Abandoned means left behind. Hiccup is not left behind."]}], "notes": {"do": "Before tapping, she reads every choice out loud and says why the wrong ones are wrong.", "ask": "Why is 'the laborious answer is 600' a wrong use of the word?", "listen": "An answer is not slow, hard work; the adding method is. For the partial products item, she must say 560 and 40 come from multiplying the boxes."}}, {"type": "tap", "kick": "Exit ticket", "title": "Check for understanding", "text": "On your own. Work on your whiteboard, then type.", "items": [{"type": "fill", "q": "Use an area model. <b>63 × 7 = ____</b>", "answers": ["441"], "why": "60 × 7 = 420 and 3 × 7 = 21. 420 + 21 = <b>441</b>.", "no": "Split 63 into 60 + 3. Multiply each part by 7.", "hint": "60 × 7 is 6 tens × 7 = 42 tens."}, {"q": "The two answers inside the boxes of an area model are called …", "choices": ["dimensions", "partial products", "expanded form"], "a": 1, "why": "Each box gives a <b>partial product</b>. You add them to get the final product.", "no": ["Dimensions are the side lengths of the rectangle, like 63 and 7.", null, "Expanded form is 60 + 3: the parts of the number before you multiply."]}], "notes": {"do": "Stop helping. She does both alone with her camera on and her whiteboard visible.", "say": "This one is just to show me what you know. No hints from me.", "listen": "441 with no help means she is ready for the after-class lesson tonight. If she writes 42 + 21 = 63, she dropped the zero: re-teach slide 5 for one minute and give her 52 × 8 (400 + 16 = 416)."}}, {"type": "learn", "kick": "Wrap-up", "title": "What you can do now", "text": "You can multiply a 2-digit number by a 1-digit number without adding over and over.", "steps": [{"text": "<b>1. Split</b> the big number in expanded form: 75 = 70 + 5."}, {"text": "<b>2. Multiply</b> each box. Do the fact, then keep the zero: 560 and 40."}, {"text": "<b>3. Add</b> the partial products: 560 + 40 = 600."}, {"text": "Tonight: the <b>After-Class Lesson</b> on your own (it ends with Show What You Know), then read for 10 minutes. That is all!"}], "tip": "Two facts and one addition beat 75 additions every time.", "notes": {"do": "Click through the steps. Then stop the screen share, open the course page and show her tonight's two tasks.", "say": "Tonight is short: the after-class lesson and 10 minutes of reading. I will see you in person tomorrow.", "ask": "Tell me the three steps of the area model without looking.", "listen": "Split, multiply each box, add the partial products. If she leaves out 'keep the zero', remind her."}}], "win": "Two facts and one addition. You just abandoned the slow way!", "prev": "bb-bailey-L05", "prevTitle": "Lesson 5"});</script></body></html>
