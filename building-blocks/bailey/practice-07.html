 <b>315</b>.", "no": "Use four boxes: 20 × 10, 1 × 10, 20 × 5 and 1 × 5.", "hint": "Count your boxes: four."}, {"q": "Which estimate fits <b>38 × 17</b>?", "choices": ["between 30 and 80", "between 300 and 800", "between 3,000 and 8,000"], "a": 1, "why": "30 × 10 = 300 and 40 × 20 = 800.", "no": ["30 × 10 is 300, not 30.", null, "Too many zeros: 30 × 10 = 300."]}, {"type": "fill", "q": "The Vikings pull up <b>8</b> nets. Each net holds <b>125</b> fish. How many fish?", "answers": ["1000", "1000 fish"], "why": "800 + 160 + 40 = <b>1,000</b> fish.", "no": "8 equal nets of 125. Use three boxes: 100, 20 and 5.", "hint": "100 × 8, 20 × 8, 5 × 8."}, {"q": "Which sentence uses <b>approximately</b> correctly?", "choices": ["The Great Hall holds approximately 200 Vikings, give or take a few.", "A triangle has approximately 3 sides.", "I will approximately go to bed."], "a": 0, "why": "Approximately is for an amount that is close but not exact.", "no": [null, "A triangle has exactly 3 sides. No guessing needed.", "Approximately goes with an amount, like approximately 300."]}, {"type": "fill", "q": "Stoick studied the dark clouds to <b>________</b> how bad the storm would be. Type the word from this lesson that means <b>to judge</b>.", "answers": ["gauge", "gage"], "why": "To <b>gauge</b> is to judge how big, how much or how good something is.", "no": "Which word from this lesson means to judge how big or how bad something is?", "hint": "It starts with g-a."}, {"type": "fill", "q": "Hiccup got <b>1,926</b> for <b>642 × 3</b>. To check it, finish the estimate: 600 × 3 = 1,800 and 700 × 3 = <b>____</b>.", "answers": ["2100"], "why": "7 × 3 = 21, so 700 × 3 = <b>2,100</b>. 1,926 is between 1,800 and 2,100, so it is reasonable.", "no": "700 is 7 hundreds. Do 7 × 3.", "hint": "7 hundreds × 3 = 21 hundreds."}, {"type": "fill", "q": "Find the missing box: <b>43 × 16 = 400 + 30 + ____ + 18</b>", "answers": ["240"], "why": "The 40 column times the 6 row: 40 × 6 = <b>240</b>.", "no": "Which box is missing? 40 × 10, 3 × 10 and 3 × 6 are there.", "hint": "40 × 6: 4 tens × 6 = 24 tens."}, {"q": "A <b>fearsome</b> dragon is …", "choices": ["frightening to look at or to face", "small and easy to fool", "careful and neat", "close to a number"], "a": 0, "why": "Fearsome means frightening.", "no": [null, "That is the opposite of fearsome.", "That is meticulous.", "That is approximately."]}]});</script></body></html>
