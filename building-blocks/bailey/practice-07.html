<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 7</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Bigger Boxes: Estimate, Then Multiply</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Estimate first, then count your boxes.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 7", "title": "Bigger Boxes: Estimate, Then Multiply", "mastery": 90, "color": "#8E44AD", "questions": [{"q": "Which is the best estimate for <b>615 × 9</b>?", "choices": ["between 5,400 and 6,300", "between 540 and 630", "between 54,000 and 63,000"], "a": 0, "why": "600 × 9 = 5,400 and 700 × 9 = 6,300.", "no": [null, "600 × 9 is 6 hundreds × 9 = 54 hundreds = 5,400.", "Too many zeros."]}, {"q": "What is <b>400 × 7</b>?", "choices": ["280", "2,800", "28,000", "47"], "a": 1, "why": "4 × 7 = 28, so 400 × 7 = <b>2,800</b>.", "no": ["400 is 4 hundreds. 4 × 7 = 28 hundreds = 2,800.", null, "Two zeros, not three.", "Multiply 4 × 7."]}, {"q": "What are the partial products for <b>273 × 9</b>?", "visual": {"kind": "area", "b": 9, "split": [200, 70, 3], "show": false}, "choices": ["180, 63 and 27", "1,800, 630 and 3", "1,800 and 27", "1,800, 630 and 27"], "a": 3, "why": "200 × 9, 70 × 9 and 3 × 9.", "no": ["200 × 9 = 1,800 and 70 × 9 = 630. Keep the zeros.", "The 3 box must be multiplied: 3 × 9 = 27.", "There are three boxes. You left out 70 × 9.", null]}, {"q": "What is <b>273 × 9</b>?", "choices": ["2,457", "2,447", "2,430", "282"], "a": 0, "why": "1,800 + 630 + 27 = <b>2,457</b>.", "no": [null, "630 + 27: 3 tens + 2 tens = 5 tens, so 657, and 1,800 + 657 = 2,457.", "You left out the 27.", "You added 273 + 9."]}, {"q": "What is <b>21 × 15</b>?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">20</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">1</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"82.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">20 × 10</text><text x=\"131.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">200</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"82.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">1 × 10</text><text x=\"266.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">10</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">5</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">20 × 5</text><text x=\"131.0\" y=\"193.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">100</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">1 × 5</text><text x=\"266.0\" y=\"193.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">5</text></svg>"}, "choices": ["205", "36", "315", "305"], "a": 2, "why": "200 + 10 + 100 + 5 = <b>315</b>.", "no": ["200 + 5 uses only two of the four boxes.", "You added 21 + 15.", null, "You left out the 10 box (1 × 10)."]}, {"q": "Which estimate fits <b>38 × 17</b>?", "choices": ["between 30 and 80", "between 300 and 800", "between 3,000 and 8,000"], "a": 1, "why": "30 × 10 = 300 and 40 × 20 = 800.", "no": ["30 × 10 is 300, not 30.", null, "Too many zeros: 30 × 10 = 300."]}, {"q": "The Vikings pull up <b>8</b> nets. Each net holds <b>125</b> fish. How many fish?", "choices": ["133", "960", "1,000"], "a": 2, "why": "800 + 160 + 40 = <b>1,000</b> fish.", "no": ["You added 125 + 8.", "You left out the ones box: 5 × 8 = 40.", null]}, {"q": "Which sentence uses <b>approximately</b> correctly?", "choices": ["There are approximately 300 Vikings on the island, give or take a few.", "A triangle has approximately 3 sides.", "I will approximately go to bed."], "a": 0, "why": "Approximately is for an amount that is close but not exact.", "no": [null, "A triangle has exactly 3 sides. No guessing needed.", "Approximately goes with an amount, like approximately 300."]}, {"q": "Which word means <b>very careful about every small detail</b>?", "choices": ["crafty", "fearsome", "meticulous", "reasonable"], "a": 2, "why": "Meticulous means very careful about every detail.", "no": ["Crafty means sneaky-clever.", "Fearsome means frightening.", null, "Reasonable means it makes sense."]}, {"q": "Hiccup got <b>1,926</b> for <b>642 × 3</b>. Is it reasonable?", "choices": ["No. It should be about 192.", "Yes. 600 × 3 = 1,800 and 700 × 3 = 2,100, and 1,926 is between them.", "No. It should be about 19,000."], "a": 1, "why": "It fits the estimate. (And it is exactly right: 1,800 + 120 + 6 = 1,926.)", "no": ["600 × 3 is 1,800, so 192 is far too small.", null, "Too many zeros: 600 × 3 = 1,800."]}, {"q": "Find the missing box: <b>43 × 16 = 400 + 30 + ___ + 18</b>", "choices": ["24", "60", "2,400", "240"], "a": 3, "why": "The 40 column times the 6 row: 40 × 6 = <b>240</b>.", "no": ["40 × 6 is 4 tens × 6 = 24 tens = 240.", "The box is 40 × 6, not 10 × 6.", "One zero, not two.", null]}, {"q": "A <b>fearsome</b> dragon is …", "choices": ["frightening to look at or to face", "small and easy to fool", "careful and neat", "close to a number"], "a": 0, "why": "Fearsome means frightening.", "no": [null, "That is the opposite of fearsome.", "That is meticulous.", "That is approximately."]}]});</script></body></html>
