<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 5</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Pick the Fastest Path: 6s to 9s</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Pick the fastest tool. Get 90 or more!</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 5", "title": "Pick the Fastest Path: 6s to 9s", "mastery": 90, "color": "#10AC84", "questions": [{"q": "What is <b>7 × 9</b>?", "choices": ["56", "63", "72", "54"], "a": 1, "why": "70 − 7 = 63. (Or 45 + 18 = 63.)", "no": ["56 is 7 × 8. You need one more 7.", null, "72 is 8 × 9. One group too many.", "54 is 6 × 9. One group too few."]}, {"q": "What is <b>8 × 8</b>?", "choices": ["64", "56", "72", "16"], "a": 0, "why": "8 → 16 → 32 → 64.", "no": [null, "56 is 7 × 8. Double 32 to get 64.", "72 is 9 × 8. Use three doubles: 16, 32, 64.", "16 is only one double. You need three."]}, {"q": "What is <b>7 × 4</b>?", "choices": ["24", "32", "11", "28"], "a": 3, "why": "(5 × 4) + (2 × 4) = 20 + 8 = 28. Or double 7 twice: 14, 28.", "no": ["24 is 6 × 4. You need one more 4.", "32 is 8 × 4. One group too many.", "11 is 7 + 4. Multiply, do not add.", null]}, {"q": "<b>9 × ? = 54</b>. What is the missing factor?", "choices": ["5", "7", "6"], "a": 2, "why": "9 × 6 = 60 − 6 = 54.", "no": ["9 × 5 = 45. One more 9 is needed.", "9 × 7 = 63. That is too many.", null]}, {"q": "<b>? × 7 = 49</b>. What is the missing factor?", "choices": ["6", "7", "8"], "a": 1, "why": "7 × 7 = 35 + 14 = 49.", "no": ["6 × 7 = 42. You need one more 7.", null, "8 × 7 = 56. That is one 7 too many."]}, {"q": "Which path for <b>4 × 7</b> uses doubling?", "choices": ["7 → 14 → 28", "7 → 14 → 21 → 28", "4 → 8 → 16 → 32"], "a": 0, "why": "×4 is two doubles: 7 → 14 → 28.", "no": [null, "That adds 7 each time. Doubling 14 jumps straight to 28.", "That is three doubles of 4, which is 8 × 4 = 32."]}, {"q": "Which fact belongs to the <b>8, 6, 48</b> fact family?", "choices": ["48 − 8 = 40", "48 ÷ 6 = 8", "8 + 6 = 14"], "a": 1, "why": "48 ÷ 6 = 8 uses the same three numbers. 6 × 8 = 48 proves it.", "no": ["Subtraction is not part of this fact family, and 40 is not one of the numbers.", null, "Addition is not part of a multiplication fact family."]}, {"q": "Which fact is the <b>commutative</b> partner of 9 × 7?", "choices": ["9 × 9", "63 ÷ 9", "7 × 9"], "a": 2, "why": "Commutative means switch the factors: 7 × 9 = 63.", "no": ["9 × 9 changes a factor. Commutative only switches the order.", "That is in the fact family, but it is division. Switch the factors instead.", null]}, {"q": "To <b>evaluate</b> two plans means to…", "choices": ["copy both plans", "judge which plan is better", "forget about both plans"], "a": 1, "why": "To evaluate is to judge how good something is.", "no": ["Copying is not judging. Evaluate means decide which is better.", null, "You have to think hard about both plans to evaluate them."]}, {"q": "Which sentence describes an <b>inventive</b> person?", "choices": ["Hiccup used a rope and a bent stick to make a fish trap.", "Snotlout waited for someone else to fix the boat.", "Fishlegs gave up when the door was stuck."], "a": 0, "why": "<b>Inventive</b> means good at thinking of new and clever ideas.", "no": [null, "Waiting for someone else is not a new idea at all.", "Giving up is the opposite. An inventive person thinks of a new way."]}, {"q": "A dragon trainer has <b>9 dragons</b>. Each dragon eats <b>6 fish</b> at dinner. How many fish?", "choices": ["15", "48", "54", "63"], "a": 2, "why": "9 × 6 = 60 − 6 = 54.", "no": ["15 is 9 + 6. Each dragon eats 6, so multiply.", "48 is 8 × 6. There are 9 dragons.", null, "63 is 9 × 7. Each dragon eats 6 fish."]}, {"q": "After passing the dragon test, Hiccup was <b>victorious</b>. What does that mean?", "choices": ["He was worried he would fail.", "He was sleepy and bored.", "He had won or succeeded."], "a": 2, "why": "<b>Victorious</b> means having won a fight, a game, or a contest.", "no": ["He already passed, so he is not worried. Victorious means he won.", "Victorious is about winning, not about being bored.", null]}]});</script></body></html>
