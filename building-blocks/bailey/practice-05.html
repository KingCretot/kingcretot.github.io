<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 5</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Pick the Fastest Path: 6s to 9s</h1><p style="margin:0 0 12px;color:#5b6578">Three tries on each one. Only your first try counts. Type most answers. Pick the fastest tool.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 5", "title": "Pick the Fastest Path: 6s to 9s", "mastery": 90, "color": "#10AC84", "questions": [{"type": "fill", "q": "What is <b>4 × 9</b>? Type the product.", "answers": ["36"], "why": "Use the 9: four 10s is 40, take away one 4: 40 − 4 = 36.", "no": "Use the 9: ×10, take away one group of 4."}, {"type": "fill", "q": "What is <b>8 × 3</b>? Type the product.", "answers": ["24"], "why": "Double 3 three times: 6, 12, 24.", "no": "Double 3 three times."}, {"q": "What is <b>7 × 3</b>?", "choices": ["18", "24", "10", "21"], "a": 3, "why": "(5 × 3) + (2 × 3) = 15 + 6 = 21.", "no": ["18 is 6 × 3. You need one more 3.", "24 is 8 × 3. One group too many.", "10 is 7 + 3. Multiply, do not add.", null]}, {"type": "fill", "q": "<b>6 × ? = 36</b>. Type the missing factor.", "answers": ["6"], "why": "6 × 6 = 30 + 6 = 36.", "no": "6 times what is 36? Use ×5 plus one group."}, {"type": "fill", "q": "<b>? × 7 = 49</b>. Type the missing factor.", "answers": ["7"], "why": "7 × 7 = 35 + 14 = 49.", "no": "What times 7 is 49?"}, {"q": "Which path for <b>4 × 7</b> uses doubling?", "choices": ["7 → 14 → 28", "7 → 14 → 21 → 28", "4 → 8 → 16 → 32"], "a": 0, "why": "×4 is two doubles: 7 → 14 → 28.", "no": [null, "That adds 7 each time. Doubling 14 jumps straight to 28.", "That is three doubles of 4, which is 8 × 4 = 32."]}, {"q": "Which fact belongs to the <b>8, 6, 48</b> fact family?", "choices": ["48 − 8 = 40", "48 ÷ 6 = 8", "8 + 6 = 14"], "a": 1, "why": "48 ÷ 6 = 8 uses the same three numbers. 6 × 8 = 48 proves it.", "no": ["Subtraction is not part of this fact family, and 40 is not one of the numbers.", null, "Addition is not part of a multiplication fact family."]}, {"q": "Which fact is the <b>commutative</b> partner of 9 × 7?", "choices": ["9 × 9", "63 ÷ 9", "7 × 9"], "a": 2, "why": "Commutative means switch the factors: 7 × 9 = 63.", "no": ["9 × 9 changes a factor. Commutative only switches the order.", "That is in the fact family, but it is division. Switch the factors instead.", null]}, {"q": "To <b>evaluate</b> two plans means to…", "choices": ["carry out both plans at once", "judge which plan is better", "write both plans down", "mix the two plans together"], "a": 1, "why": "To evaluate is to judge how good something is.", "no": ["Doing both is not judging them. Evaluate means decide which is better.", null, "Writing plans down is a good start, but evaluating means judging which is better.", "Mixing plans is not judging them. Evaluate means decide which is better."]}, {"type": "fill", "q": "Use one of your new words. Hiccup thinks of a brand-new way to cross the river. He is ____.", "answers": ["inventive"], "why": "<b>Inventive</b> means good at thinking of new and clever ideas.", "no": "Which word means good at new ideas? It starts with <b>in</b>."}, {"type": "fill", "q": "A dragon trainer has 9 dragons. Each dragon eats 6 fish at dinner. How many fish?", "answers": ["54", "54 fish"], "why": "9 × 6 = 60 − 6 = 54.", "no": "9 equal groups of 6. Use ×10 take away one group."}, {"q": "After passing the dragon test, Hiccup was <b>victorious</b>. What does that mean?", "choices": ["He was worried he would fail.", "He was sleepy and bored.", "He had won or succeeded."], "a": 2, "why": "<b>Victorious</b> means having won a fight, a game, or a contest.", "no": ["He already passed, so he is not worried. Victorious means he won.", "Victorious is about winning, not about being bored.", null]}]});</script></body></html>
