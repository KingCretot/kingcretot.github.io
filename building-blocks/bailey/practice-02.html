<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 2</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Prove It: Every ×9 and ×6 Fact</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Flip facts, find missing factors, and verify every answer.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 2", "title": "Prove It: Every ×9 and ×6 Fact", "mastery": 90, "color": "#2E86DE", "questions": [{"q": "9 × ? = 81", "choices": ["8", "9", "7", "10"], "a": 1, "why": "The tens digit 8 is one less than 9. Verify: 90 − 9 = 81.", "no": ["9 × 8 = 72.", null, "9 × 7 = 63.", "9 × 10 = 90."]}, {"q": "6 × ? = 36", "choices": ["6", "5", "7", "4"], "a": 0, "why": "6 × 6 = 30 + 6 = 36. It ends in 6, like the pattern says.", "no": [null, "6 × 5 = 30.", "6 × 7 = 42.", "6 × 4 = 24."]}, {"q": "What is 8 × 6?", "choices": ["46", "54", "48", "42"], "a": 2, "why": "Flip it to 6 × 8: 40 + 8 = 48.", "no": ["46 is 40 + 6. Add a group of 8.", "54 is 6 × 9.", null, "42 is 6 × 7."]}, {"q": "What is 4 × 9?", "choices": ["32", "45", "27", "36"], "a": 3, "why": "Flip it to 9 × 4: 40 − 4 = 36.", "no": ["Verify: 3 + 2 = 5, not 9.", "45 is 9 × 5.", "27 is 9 × 3.", null]}, {"q": "An <b>equation</b> needs both sides to be worth the same. Which one is a true equation?", "choices": ["9 × 5 = 50 − 9", "9 × 5", "9 × 5 = 50 − 5", "9 × 5 = 45 + 9"], "a": 2, "why": "9 × 5 = 45 and 50 − 5 = 45. Both sides are worth 45.", "no": ["50 − 9 = 41, but 9 × 5 = 45. The two sides are not worth the same.", "There is no equal sign, so it is not an equation.", null, "45 + 9 = 54, but 9 × 5 = 45. The two sides don't match."]}, {"q": "Fishlegs gets stuck on 7 × 9, but he keeps trying strategies until he solves it. He…", "choices": ["perseveres", "is reluctant", "is flawed", "gives up"], "a": 0, "why": "To persevere is to keep trying even when it is hard.", "no": [null, "Reluctant means not wanting to try. He kept trying!", "Flawed means having a mistake.", "He didn't give up. He kept going."]}, {"q": "Which number is a multiple of 6 <b>and</b> a multiple of 9?", "choices": ["27", "24", "18", "45"], "a": 2, "why": "6 × 3 = 18 and 9 × 2 = 18. It is on both lists.", "no": ["27 is a multiple of 9, but it is odd, so it is not a multiple of 6.", "24 is a multiple of 6, but 2 + 4 = 6, not 9.", null, "45 is a multiple of 9, but it is odd, so it is not a multiple of 6."]}, {"q": "Fishlegs wrote 6 × 7 = 36. Which equation fixes it?", "choices": ["30 + 6 = 36", "35 + 6 = 41", "42 + 7 = 49", "35 + 7 = 42"], "a": 3, "why": "5 × 7 = 35, plus one more group of 7: 35 + 7 = 42.", "no": ["30 + 6 is 6 × 6.", "Add a group of 7, not 6. And a 6s answer can't be odd.", "42 + 7 is 7 × 7.", null]}, {"q": "A dragon trainer has 48 fish. She gives 6 fish to each dragon. How many dragons get fish?", "choices": ["9", "7", "8", "6"], "a": 2, "why": "6 × ? = 48. 6 × 8 = 40 + 8 = 48, so 8 dragons.", "no": ["6 × 9 = 54.", "6 × 7 = 42.", null, "6 × 6 = 36."]}, {"q": "Hiccup has 6 boxes with 9 nails in each. He uses 20 nails. How many nails are left?", "choices": ["44", "34", "74", "54"], "a": 1, "why": "6 × 9 = 45 + 9 = 54 nails. Then 54 − 20 = 34.", "no": ["Check the subtraction: 54 − 20 is 34.", null, "74 adds the 20. He used them, so subtract.", "54 is how many he had. He used 20."]}, {"q": "To <b>justify</b> an answer means to…", "choices": ["guess it quickly", "give reasons that prove it", "erase it", "say it louder"], "a": 1, "why": "To justify is to give reasons that prove you are right.", "no": ["Guessing is not proving.", null, "Erasing doesn't prove anything.", "Saying it louder is not a reason."]}, {"q": "Which fact is <b>flawed</b>?", "choices": ["9 × 7 = 63", "6 × 9 = 54", "9 × 8 = 81", "6 × 5 = 30"], "a": 2, "why": "9 × 8 = 80 − 8 = 72. 81 is 9 × 9.", "no": ["70 − 7 = 63. True.", "45 + 9 = 54. True.", null, "6 × 5 = 30. True."]}]});</script></body></html>
