<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 1</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Smart Shortcuts for ×9 and ×6</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Use your shortcuts: ×9 = ×10 minus one group, ×6 = ×5 plus one group.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 1", "title": "Smart Shortcuts for ×9 and ×6", "mastery": 90, "color": "#2E86DE", "questions": [{"q": "Use the ×9 shortcut. What is 9 × 3?", "visual": {"kind": "bigtext", "text": "9 × 3"}, "choices": ["27", "21", "33", "24"], "a": 0, "why": "10 × 3 = 30. Take away one group of 3: 30 − 3 = 27.", "no": [null, "21 is 30 − 9. Take away one group of 3, not 9.", "33 adds a group. For ×9 you take one away.", "24 is 8 × 3."]}, {"q": "What is 6 × 7?", "choices": ["41", "48", "42", "35"], "a": 2, "why": "5 × 7 = 35, plus one more group of 7: 35 + 7 = 42.", "no": ["41 is 35 + 6. Add a group of 7, not 6.", "48 is 6 × 8.", null, "35 is only 5 × 7. Add one more group."]}, {"q": "What is 9 × 9?", "choices": ["90", "72", "99", "81"], "a": 3, "why": "10 × 9 = 90, then 90 − 9 = 81. Verify: 8 + 1 = 9 ✔.", "no": ["90 is 10 × 9. Take away one group of 9.", "72 is 9 × 8.", "Verify it: 9 + 9 = 18, not 9.", null]}, {"q": "Which is the most <b>efficient</b> way to find 6 × 9?", "choices": ["Add 9 six times", "45 + 9", "Count by 1s to 54", "Draw 54 dots"], "a": 1, "why": "5 × 9 = 45, plus one more 9: 45 + 9 = 54. One step!", "no": ["That works, but it is tedious and easy to lose your place.", null, "Counting by 1s is the slowest way.", "Drawing 54 dots takes a long time."]}, {"q": "A <b>factor</b> is…", "choices": ["a number you multiply", "the answer to a multiplication", "a way to check your answer", "a long, boring job"], "a": 0, "why": "Factors are the numbers you multiply. In 6 × 4, the factors are 6 and 4.", "no": [null, "That is the product.", "That is what verify means.", "That is what tedious means."]}, {"q": "You add 3 + 6 = 9 to <b>verify</b> that 9 × 4 = 36. What does verify mean?", "choices": ["to guess", "to check that it is true", "to make it longer", "to copy it again"], "a": 1, "why": "To verify is to check that something is true.", "no": ["Verifying is the opposite of guessing.", null, "Verifying doesn't change the problem.", "Copying is not checking."]}, {"q": "Fishlegs did 9 × 8 = 80 − 9 = 71. What should he take away from 80?", "choices": ["1", "9", "8", "10"], "a": 2, "why": "Take away one group of 8: 80 − 8 = 72.", "no": ["Take away a whole group of 8, not 1.", "That is his mistake. Each group has 8.", null, "Taking away 10 is too much."]}, {"q": "Which 9s fact is <b>wrong</b>?", "choices": ["9 × 4 = 36", "9 × 8 = 63", "9 × 7 = 63", "9 × 2 = 18"], "a": 1, "why": "6 + 3 = 9 passes Check 1, but the tens digit should be 7 (one less than 8). 9 × 8 = 72. 63 is 9 × 7.", "no": ["Both checks work: 3 + 6 = 9, and 3 is one less than 4.", null, "Both checks work: 6 + 3 = 9, and 6 is one less than 7.", "Both checks work: 1 + 8 = 9, and 1 is one less than 2."]}, {"q": "Fishlegs reads 8 pages of his dragon book every night for 6 nights. How many pages?", "choices": ["14", "46", "40", "48"], "a": 3, "why": "6 nights with 8 pages each is 6 × 8: 40 + 8 = 48 pages.", "no": ["14 is 6 + 8. He reads 8 pages each night, so multiply.", "46 is 40 + 6. Add a group of 8, not 6.", "40 is only 5 × 8. Add one more group of 8.", null]}, {"q": "Which is the same as 6 × 9?", "choices": ["5 × 9 + 6", "9 + 6", "5 × 9 + 9", "6 × 10 + 9"], "a": 2, "why": "6 groups of 9 = 5 groups of 9 plus one more group of 9.", "no": ["The extra group has 9 in it, not 6.", "That adds instead of multiplying.", null, "6 × 10 is already more than 6 × 9. Adding 9 makes it even bigger."]}, {"q": "Hiccup has an <b>ingenious</b> idea. Which word means almost the same as ingenious?", "choices": ["tiny", "angry", "clever", "tedious"], "a": 2, "why": "Ingenious means very clever and creative.", "no": ["Tiny is about size.", "Angry is a feeling.", null, "Tedious means long and boring."]}, {"q": "Use Check 2. What is the tens digit of 9 × 8?", "choices": ["8", "7", "9", "2"], "a": 1, "why": "One less than 8 is 7. Then 7 + 2 = 9, so 9 × 8 = 72.", "no": ["The tens digit is one LESS than 8.", null, "9 is the factor you're multiplying by, not the tens digit.", "2 is the ones digit."]}]});</script></body></html>
