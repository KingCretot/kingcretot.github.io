<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 7: Bigger Boxes: Estimate, Then Multiply</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L07", "label": "Lesson 7", "title": "Bigger Boxes: Estimate, Then Multiply", "goal": "I can estimate first, then use an area model for bigger numbers like 247 × 6 and 23 × 14.", "date": "2026-11-03", "mastery": 90, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Bigger Boxes", "text": "Yesterday you split 75 × 8 into two boxes. Today the boxes grow: <b>three boxes</b> for 3-digit numbers and <b>four boxes</b> for 23 × 14. But first, a smart guess.", "visual": {"kind": "emoji", "text": "🎯🟪🟪🟪🟪"}}, {"type": "talk", "kick": "Book Talk", "title": "Guessing what comes next", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What has happened since the last time we talked about the book?", "Pick a character. Is that character crafty, fearsome, or neither? Prove it with something the character did.", "Hiccup often has to guess what a dragon will do before it does it. Why does a good guess help him?"], "starters": ["Since last time, …", "I think … is crafty because …", "A good guess helps because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read the word, the meaning and the example out loud.", "words": [{"word": "estimate", "pos": "noun or verb", "meaning": "A smart guess that is close to the real answer. To estimate is to make that guess.", "example": "My <b>estimate</b> for 247 × 6 is between 1,200 and 1,800.", "emoji": "🎯"}, {"word": "approximately", "pos": "adverb", "meaning": "Close to, but maybe not exactly.", "example": "There are <b>approximately</b> 300 sheep on Berk, give or take a few.", "emoji": "≈"}, {"word": "reasonable", "pos": "adjective", "meaning": "Makes sense when you think it through.", "example": "1,482 is a <b>reasonable</b> answer for 247 × 6 because it fits my estimate.", "emoji": "🤔"}, {"word": "gauge", "pos": "verb", "meaning": "To judge how big, how much or how good something is.", "example": "Hiccup tried to <b>gauge</b> how angry the dragon was.", "emoji": "🌡️"}, {"word": "meticulous", "pos": "adjective", "meaning": "Very careful about every small detail.", "example": "A <b>meticulous</b> mathematician checks all four boxes.", "emoji": "🔍"}, {"word": "fearsome", "pos": "adjective", "meaning": "Frightening to look at or to face.", "example": "The Vikings banged their shields to look <b>fearsome</b>.", "emoji": "😱"}, {"word": "crafty", "pos": "adjective", "meaning": "Clever in a sneaky, tricky way.", "example": "The <b>crafty</b> dragon pretended to sleep, then grabbed the fish.", "emoji": "🦊"}]}, {"type": "learn", "kick": "Learn", "title": "Estimate first", "text": "Before you multiply, <b>estimate</b>. It tells you about how big the answer should be.", "steps": [{"text": "<b>247 × 6</b>. 247 is between <b>200</b> and <b>300</b>."}, {"text": "200 × 6 = <b>1,200</b> and 300 × 6 = <b>1,800</b>. (2 × 6 = 12 and 3 × 6 = 18, then two zeros.)"}, {"text": "So 247 × 6 is <b>between 1,200 and 1,800</b>. That is your estimate.", "visual": {"kind": "bigtext", "text": "1,200 &lt; 247 × 6 &lt; 1,800"}}, {"text": "If you get 148 or 14,820, the answer is <b>not reasonable</b>. Your estimate catches the mistake."}], "tip": "Round the big number down and up to whole hundreds. The real answer lands in between."}, {"type": "tap", "kick": "Try it", "title": "Make an estimate", "items": [{"q": "Which estimate fits <b>382 × 7</b>?", "choices": ["between 2,100 and 2,800", "between 210 and 280", "between 21,000 and 28,000", "between 380 and 390"], "a": 0, "why": "300 × 7 = 2,100 and 400 × 7 = 2,800.", "no": [null, "300 × 7 is 3 hundreds × 7 = 21 hundreds = 2,100, not 210.", "Too many zeros. 300 × 7 has two zeros: 2,100.", "That is about 382 itself. Multiplying by 7 makes it much bigger."]}, {"q": "Fishlegs says <b>512 × 8 = 496</b>. Is his answer reasonable?", "choices": ["Yes. 496 is close to 512.", "No. It should be about 400.", "No. 500 × 8 = 4,000, so the answer should be about 4,000."], "a": 2, "why": "5 × 8 = 40, so 500 × 8 = 4,000. 496 is far too small.", "no": ["Multiplying 512 by 8 makes it about 8 times bigger, not smaller.", "500 × 8 is 40 hundreds = 4,000, not 400.", null]}, {"q": "Which product is <b>approximately</b> 3,600?", "choices": ["59 × 6", "590 × 6", "590 × 9"], "a": 1, "why": "590 is close to 600, and 600 × 6 = 3,600.", "no": ["59 × 6 is about 60 × 6 = 360. That is ten times too small.", null, "590 × 9 is about 600 × 9 = 5,400."]}]}, {"type": "learn", "kick": "Learn", "title": "Three boxes for 3 digits", "text": "<b>247 × 6</b>. Write 247 in expanded form: <b>200 + 40 + 7</b>. Now you need three boxes.", "steps": [{"text": "Draw a rectangle with a <b>200</b> box, a <b>40</b> box and a <b>7</b> box. The other side is <b>6</b>.", "visual": {"kind": "area", "b": 6, "split": [200, 40, 7], "show": false}}, {"text": "Multiply each box: 200 × 6 = 1,200, 40 × 6 = 240, 7 × 6 = 42.", "visual": {"kind": "area", "b": 6, "split": [200, 40, 7], "show": true}}, {"text": "Add the partial products: 1,200 + 240 + 42 = <b>1,482</b>."}, {"text": "Check: 1,482 is between 1,200 and 1,800. It is <b>reasonable</b>. ✅"}], "tip": "One box for each place: hundreds, tens and ones."}, {"type": "tap", "kick": "Try it", "title": "Fill the boxes: 368 × 7", "items": [{"q": "This is the area model for <b>368 × 7</b>. What goes in the <b>300</b> box?", "visual": {"kind": "area", "b": 7, "split": [300, 60, 8], "show": false}, "choices": ["210", "2,100", "21,000", "307"], "a": 1, "why": "3 × 7 = 21, so 300 × 7 = <b>2,100</b>.", "no": ["300 is 3 <b>hundreds</b>. 3 × 7 = 21 hundreds = 2,100.", null, "Too many zeros. 300 has two zeros, so 21 gets two zeros.", "Multiply the box, don't add."]}, {"q": "The partial products for <b>368 × 7</b> are 2,100, 420 and 56. What is 368 × 7?", "choices": ["2,576", "2,566", "2,520"], "a": 0, "why": "2,100 + 420 + 56 = <b>2,576</b>.", "no": [null, "Add the tens again: 2 tens + 5 tens = 7 tens, so 420 + 56 = 476, and 2,100 + 476 = 2,576.", "You left out the 56 from the ones box."]}, {"q": "Is 2,576 <b>reasonable</b> for 368 × 7?", "choices": ["No. It should be less than 368.", "No. It should be about 21,000.", "Yes. It is between 300 × 7 = 2,100 and 400 × 7 = 2,800."], "a": 2, "why": "2,576 is between 2,100 and 2,800, so it makes sense.", "no": ["Multiplying by 7 makes the number bigger.", "300 × 7 is 2,100, not 21,000.", null]}]}, {"type": "learn", "kick": "Learn", "title": "Four boxes for 23 × 14", "text": "When <b>both</b> numbers have two digits, split <b>both</b>: 23 = 20 + 3 and 14 = 10 + 4.", "steps": [{"text": "<b>Estimate:</b> 23 × 14 is between 20 × 10 = <b>200</b> and 30 × 20 = <b>600</b>."}, {"text": "Draw 2 columns (20 and 3) and 2 rows (10 and 4). That makes <b>4 boxes</b>.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">20</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">3</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">4</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text></svg>"}}, {"text": "Multiply each box: 20 × 10 = 200, 3 × 10 = 30, 20 × 4 = 80, 3 × 4 = 12.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">20</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">3</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"82.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">20 × 10</text><text x=\"131.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">200</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"82.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">3 × 10</text><text x=\"266.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">30</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">4</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">20 × 4</text><text x=\"131.0\" y=\"193.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">80</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">3 × 4</text><text x=\"266.0\" y=\"193.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">12</text></svg>"}}, {"text": "Add all four: 200 + 30 + 80 + 12 = <b>322</b>. It is between 200 and 600, so it is reasonable. ✅", "visual": {"kind": "bigtext", "text": "23 × 14 = 322"}}], "tip": "Four boxes means four partial products. Count them before you add so none gets lost."}, {"type": "sort", "kick": "Sort it", "title": "Which boxes build 36 × 12?", "text": "36 = 30 + 6 and 12 = 10 + 2. Tap a card, then tap the right box.", "buckets": ["✅ A box in 36 × 12", "❌ Not a box"], "items": [{"text": "300 (30 × 10)", "b": 0, "why": "The 30 column times the 10 row.", "hint": "30 is part of 36 and 10 is part of 12."}, {"text": "60 (6 × 10)", "b": 0, "why": "The 6 column times the 10 row.", "hint": "6 is part of 36 and 10 is part of 12."}, {"text": "60 (30 × 2)", "b": 0, "why": "The 30 column times the 2 row.", "hint": "30 is part of 36 and 2 is part of 12."}, {"text": "12 (6 × 2)", "b": 0, "why": "The 6 column times the 2 row.", "hint": "6 is part of 36 and 2 is part of 12."}, {"text": "36 (30 + 6)", "b": 1, "why": "That is adding the parts of 36, not a box.", "hint": "Every box is a part times a part."}, {"text": "18 (6 × 3)", "b": 1, "why": "There is no 3 in 12 = 10 + 2.", "hint": "Is 3 a part of 12?"}, {"text": "3,000 (30 × 100)", "b": 1, "why": "There is no 100 in 12.", "hint": "Is 100 a part of 12?"}], "done": "36 × 12 = 300 + 60 + 60 + 12 = <b>432</b>."}, {"type": "tap", "kick": "Try it", "title": "Four-box problems", "items": [{"q": "Which four partial products build <b>32 × 15</b>?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">30</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">2</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">5</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text></svg>"}, "choices": ["300, 20, 15, 10", "300, 150, 10", "30, 2, 15, 5", "300, 20, 150, 10"], "a": 3, "why": "30 × 10 = 300, 2 × 10 = 20, 30 × 5 = 150, 2 × 5 = 10.", "no": ["30 × 5 is 3 tens × 5 = 15 tens = 150.", "Only three boxes. You lost 2 × 10 = 20.", "Those are not products. Multiply column times row.", null]}, {"q": "So what is <b>32 × 15</b>?", "choices": ["345", "480", "460"], "a": 1, "why": "300 + 20 + 150 + 10 = <b>480</b>.", "no": ["The 30 × 5 box is 150, not 15.", null, "You left out the 20 box (2 × 10)."]}, {"q": "Berk's training arena has <b>16</b> rows of benches with <b>24</b> Vikings in each row. How many Vikings?", "choices": ["384", "224", "40", "344"], "a": 0, "why": "200 + 40 + 120 + 24 = <b>384</b> Vikings. Estimate check: between 200 and 600. ✅", "no": [null, "You did only 20 × 10 and 6 × 4. There are four boxes: 200 + 40 + 120 + 24.", "You added 16 + 24. Equal rows means multiply.", "You lost the 40 box (4 × 10)."]}]}, {"type": "recall", "kick": "Remember", "title": "From yesterday and before", "items": [{"q": "What is <b>86 × 7</b>?", "choices": ["93", "562", "592", "602"], "a": 3, "why": "80 × 7 = 560 and 6 × 7 = 42. 560 + 42 = <b>602</b>.", "no": ["You added 86 + 7.", "The ones box is 6 × 7 = 42, not 2.", "560 + 42: 6 tens + 4 tens = 10 tens. Regroup to get 602.", null]}, {"q": "Which partial products build <b>59 × 6</b>?", "choices": ["300 and 54", "30 and 54", "300 and 9", "50 and 9"], "a": 0, "why": "50 × 6 = 300 and 9 × 6 = 54.", "no": [null, "50 × 6 is 5 tens × 6 = 30 tens = 300.", "The 9 box gets multiplied too: 9 × 6 = 54.", "Those are the parts of 59. Multiply each one by 6."]}, {"q": "Use 5 × 9 + 2 × 9 to find <b>7 × 9</b>.", "choices": ["45 + 18 = 53", "45 + 18 = 63", "45 + 9 = 54"], "a": 1, "why": "5 nines + 2 nines = 7 nines: 45 + 18 = <b>63</b>.", "no": ["5 + 8 = 13, so regroup: 45 + 18 = 63.", null, "2 × 9 is 18, not 9."]}]}, {"type": "tap", "kick": "Word Power", "title": "Use your new words", "items": [{"q": "Hiccup says the sea dragon is <b>approximately</b> 400 feet long. What does <b>approximately</b> tell you?", "choices": ["The length is exactly 400 feet.", "The real length is close to 400 feet, but maybe not exactly 400.", "The length is more than 400 feet for sure.", "Nobody has any idea how long it is."], "a": 1, "why": "Approximately means close to, but maybe not exactly.", "no": ["Approximately means close to, not exact.", null, "It could be a bit more or a bit less.", "Approximately means we have a close idea."]}, {"q": "A <b>meticulous</b> student solving 23 × 14 would …", "choices": ["count all four boxes and check each fact", "skip the estimate to save time", "add the two biggest boxes and stop", "guess the answer"], "a": 0, "why": "Meticulous means very careful about every small detail.", "no": [null, "Skipping steps is the opposite of meticulous.", "A meticulous student would not leave boxes out.", "Meticulous means careful with every detail."]}, {"q": "Which word fits? <i>The sea dragon was so ______ that the whole tribe hid behind their shields.</i>", "choices": ["fearsome", "crafty", "reasonable", "meticulous"], "a": 0, "why": "People hide from something <b>fearsome</b>: frightening to face.", "no": [null, "Crafty means sneaky-clever. The clue is that everyone hid in fear.", "Reasonable means it makes sense. That does not explain hiding.", "Meticulous means careful with details."]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "Which is the best estimate for <b>438 × 6</b>?", "choices": ["between 240 and 300", "between 24,000 and 30,000", "between 2,400 and 3,000", "between 400 and 500"], "a": 2, "why": "400 × 6 = 2,400 and 500 × 6 = 3,000.", "no": ["400 × 6 is 24 hundreds = 2,400.", "Too many zeros.", null, "Multiplying by 6 makes 438 much bigger."]}, {"q": "This is the area model for <b>529 × 8</b>. What goes in the <b>500</b> box?", "visual": {"kind": "area", "b": 8, "split": [500, 20, 9], "show": false}, "choices": ["400", "4,000", "40,000", "508"], "a": 1, "why": "5 × 8 = 40, so 500 × 8 = 4,000.", "no": ["500 is 5 hundreds. 5 × 8 = 40 hundreds = 4,000.", null, "Too many zeros.", "Multiply, don't add."]}, {"q": "What is <b>529 × 8</b>?", "choices": ["4,232", "4,222", "4,072", "537"], "a": 0, "why": "4,000 + 160 + 72 = 4,232.", "no": [null, "160 + 72: 6 tens + 7 tens = 13 tens. Regroup to get 232.", "You left out the 20 box: 20 × 8 = 160.", "You added 529 + 8."]}, {"q": "Which four partial products build <b>28 × 13</b>?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">20</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">8</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">3</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text></svg>"}, "choices": ["200, 80, 6, 24", "200, 8, 60, 24", "20, 80, 60, 24", "200, 80, 60, 24"], "a": 3, "why": "20 × 10 = 200, 8 × 10 = 80, 20 × 3 = 60 and 8 × 3 = 24.", "no": ["20 × 3 is 2 tens × 3 = 6 tens = 60, not 6.", "8 × 10 is 80, not 8.", "20 × 10 is 200.", null]}, {"q": "What is <b>28 × 13</b>?", "choices": ["224", "354", "364", "41"], "a": 2, "why": "200 + 80 + 60 + 24 = 364.", "no": ["200 + 24 uses only two of the four boxes.", "Add again: 200 + 80 + 60 = 340, and 340 + 24 = 364.", null, "You added 28 + 13."]}, {"q": "Stoick orders <b>6</b> crates of arrows. Each crate holds <b>145</b> arrows. How many arrows?", "choices": ["151", "840", "870"], "a": 2, "why": "600 + 240 + 30 = 870.", "no": ["You added 145 + 6.", "You left out the ones box: 5 × 6 = 30.", null]}, {"q": "Gobber says <b>34 × 12 = 300 + 8 = 308</b>. What went wrong?", "choices": ["He used only 2 boxes. With all 4 boxes, 300 + 40 + 60 + 8 = 408.", "Nothing. 308 is correct.", "He should add: 34 + 12 = 46."], "a": 0, "why": "He forgot 4 × 10 = 40 and 30 × 2 = 60.", "no": [null, "Count the boxes. 34 × 12 needs four.", "The × sign means multiply, not add."]}, {"q": "<b>Reasonable</b> means …", "choices": ["exactly right to the last digit", "makes sense when you think it through", "very fast", "very large"], "a": 1, "why": "A reasonable answer makes sense.", "no": ["An answer can be reasonable and still have a small slip.", null, "Reasonable is about sense, not speed.", "That is not what reasonable means."]}, {"q": "A dragon pretends to be asleep so it can sneak a fish. Which word describes the dragon?", "choices": ["fearsome", "meticulous", "approximately", "crafty"], "a": 3, "why": "Crafty means clever in a sneaky way.", "no": ["Fearsome means scary. Pretending is sneaky.", "Meticulous means careful with details.", "Approximately means close to a number.", null]}, {"q": "To <b>gauge</b> how big an answer will be, you …", "choices": ["add the two factors", "make an estimate to judge its size", "write every partial product twice"], "a": 1, "why": "Gauge means to judge how big something is.", "no": ["Adding does not judge the size of a product.", null, "That does not judge size."]}]}], "win": "You estimated, built every box, and checked your answer. Meticulous work!", "prev": "bb-bailey-L06", "prevTitle": "Lesson 6"});</script></body></html>
