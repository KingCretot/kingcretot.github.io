<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 7: Bigger Boxes: Estimate, Then Multiply</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L07", "label": "Lesson 7", "title": "Bigger Boxes: Estimate, Then Multiply", "goal": "I can estimate first, then use an area model for bigger numbers like 247 × 6 and 23 × 14.", "date": "2026-11-03", "mastery": 90, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Bigger Boxes: On Your Own", "text": "In class you estimated first and built three-box and four-box area models. Now do it on your own. Keep paper and a pencil next to you.", "visual": {"kind": "emoji", "text": "🎯🟪🟪🟪🟪"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["Why do you <b>estimate</b> before you multiply?", "How many boxes does 247 × 6 need? How many does 23 × 14 need? Why?", "Find a <b>crafty</b> or <b>fearsome</b> moment in <i>How to Train Your Dragon</i>. What happened?"], "starters": ["I estimate first because …", "247 × 6 needs … boxes because …", "A crafty moment was when …"]}, {"type": "vocab", "kick": "Word Power", "title": "Review your words", "text": "Say the meaning out loud first. Then flip the card to check yourself.", "words": [{"word": "estimate", "pos": "noun or verb", "meaning": "A smart guess that is close to the real answer. To estimate is to make that guess.", "example": "My <b>estimate</b> for 247 × 6 is between 1,200 and 1,800.", "emoji": "🎯"}, {"word": "approximately", "pos": "adverb", "meaning": "Close to, but maybe not exactly.", "example": "There are <b>approximately</b> 300 sheep on Berk, give or take a few.", "emoji": "≈"}, {"word": "reasonable", "pos": "adjective", "meaning": "Makes sense when you think it through.", "example": "1,482 is a <b>reasonable</b> answer for 247 × 6 because it fits my estimate.", "emoji": "🤔"}, {"word": "gauge", "pos": "verb", "meaning": "To judge how big, how much or how good something is.", "example": "Hiccup tried to <b>gauge</b> how angry the dragon was.", "emoji": "🌡️"}, {"word": "meticulous", "pos": "adjective", "meaning": "Very careful about every small detail.", "example": "A <b>meticulous</b> mathematician checks all four boxes.", "emoji": "🔍"}, {"word": "fearsome", "pos": "adjective", "meaning": "Frightening to look at or to face.", "example": "The Vikings banged their shields to look <b>fearsome</b>.", "emoji": "😱"}, {"word": "crafty", "pos": "adjective", "meaning": "Clever in a sneaky, tricky way.", "example": "The <b>crafty</b> dragon pretended to sleep, then grabbed the fish.", "emoji": "🦊"}]}, {"type": "learn", "kick": "Remember", "title": "Estimate, boxes, add, check", "text": "<b>315 × 6</b>: the estimate is between 300 × 6 = 1,800 and 400 × 6 = 2,400. Then three boxes:", "visual": {"kind": "area", "b": 6, "split": [300, 10, 5], "show": true}, "tip": "1,890 is between 1,800 and 2,400, so it is reasonable."}, {"type": "tap", "kick": "Try it", "title": "Estimate first", "text": "Type the missing number.", "items": [{"type": "fill", "q": "<b>427 × 5</b> is between 2,000 and <b>____</b>.", "answers": ["2500"], "why": "400 × 5 = 2,000 and 500 × 5 = <b>2,500</b>.", "no": "Round 427 up to 500. What is 500 × 5?", "hint": "5 hundreds × 5 = 25 hundreds."}, {"type": "fill", "q": "<b>63 × 18</b> is between 600 and <b>____</b>.", "answers": ["1400"], "why": "60 × 10 = 600 and 70 × 20 = <b>1,400</b>.", "no": "Round both numbers up: 70 and 20.", "hint": "7 × 2 = 14, then two zeros."}, {"q": "Which answer is <b>reasonable</b> for <b>291 × 8</b>?", "choices": ["232", "2,328", "23,280", "299"], "a": 1, "why": "291 × 8 is between 200 × 8 = 1,600 and 300 × 8 = 2,400. Only <b>2,328</b> fits.", "no": ["Too small. 200 × 8 is already 1,600.", null, "Too big. 300 × 8 is only 2,400.", "That is about 291 + 8. Multiplying makes it much bigger."]}]}, {"type": "tap", "kick": "Try it", "title": "Three boxes: 263 × 7", "text": "Draw the three boxes on paper.", "items": [{"type": "fill", "q": "What goes in the <b>200</b> box?", "visual": {"kind": "area", "b": 7, "split": [200, 60, 3], "show": false}, "answers": ["1400"], "why": "2 × 7 = 14, so 200 × 7 = <b>1,400</b>.", "no": "200 is 2 hundreds. Do 2 × 7, then keep two zeros.", "hint": "2 hundreds × 7 = 14 hundreds."}, {"type": "fill", "q": "What goes in the <b>60</b> box?", "answers": ["420"], "why": "6 × 7 = 42, so 60 × 7 = <b>420</b>.", "no": "60 is 6 tens. Do 6 × 7, then keep one zero.", "hint": "6 × 7 = 42."}, {"type": "fill", "q": "Add all three partial products. <b>263 × 7 = ____</b>", "answers": ["1841"], "why": "1,400 + 420 + 21 = <b>1,841</b>.", "no": "Do not forget the 3 box: 3 × 7 = 21.", "hint": "1,400 + 420 = 1,820. Then add 21."}]}, {"type": "tap", "kick": "Try it", "title": "Four boxes: 42 × 13", "text": "Columns are 40 and 2. Rows are 10 and 3.", "items": [{"type": "fill", "q": "What goes in the <b>40 × 3</b> box?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">40</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">2</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">3</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text></svg>"}, "answers": ["120"], "why": "4 × 3 = 12, so 40 × 3 = <b>120</b>.", "no": "40 is 4 tens. 4 tens × 3 = 12 tens.", "hint": "4 × 3 = 12. Keep the zero."}, {"type": "fill", "q": "Add all four boxes. <b>42 × 13 = ____</b>", "answers": ["546"], "why": "400 + 20 + 120 + 6 = <b>546</b>.", "no": "The four boxes are 400, 20, 120 and 6.", "hint": "Count your boxes: you need four."}]}, {"type": "tap", "kick": "Try it", "title": "Problems on Berk", "text": "Estimate, draw the boxes on paper, then type just the number.", "items": [{"type": "fill", "q": "The arena has <b>17</b> rows of seats with <b>24</b> seats in each row. How many seats?", "answers": ["408", "408 seats"], "why": "200 + 40 + 140 + 28 = <b>408</b> seats.", "no": "17 equal rows of 24. Use four boxes: 20 and 4 times 10 and 7.", "hint": "20 × 10, 4 × 10, 20 × 7, 4 × 7."}, {"type": "fill", "q": "Gobber makes <b>7</b> batches of arrows. Each batch has <b>135</b> arrows. How many arrows?", "answers": ["945", "945 arrows"], "why": "700 + 210 + 35 = <b>945</b> arrows.", "no": "7 equal batches of 135. Use three boxes: 100, 30 and 5.", "hint": "100 × 7, 30 × 7, 5 × 7."}]}, {"type": "recall", "kick": "Remember", "title": "From yesterday", "items": [{"type": "fill", "q": "Use two boxes. <b>86 × 9 = ____</b>", "answers": ["774"], "why": "80 × 9 = 720 and 6 × 9 = 54. 720 + 54 = <b>774</b>.", "no": "Split 86 into 80 + 6. Multiply each part by 9.", "hint": "80 × 9: 8 tens × 9 = 72 tens."}, {"q": "Which partial products build <b>49 × 6</b>?", "choices": ["240 and 54", "24 and 54", "240 and 9", "40 and 9"], "a": 0, "why": "40 × 6 = 240 and 9 × 6 = 54. Total: 294.", "no": [null, "40 × 6 is 4 tens × 6 = 24 tens = 240.", "The 9 box gets multiplied too: 9 × 6 = 54.", "Those are the parts of 49. Multiply each one by 6."]}]}, {"type": "tap", "kick": "Word Power", "title": "Use your words", "text": "Type the word from memory.", "items": [{"type": "fill", "q": "A smart guess that is close to the real answer is an <b>________</b>.", "answers": ["estimate", "approximation"], "why": "An <b>estimate</b> is a smart guess close to the real answer.", "no": "It is the first step before you multiply.", "hint": "It starts with e-s-t."}, {"type": "fill", "q": "Fishlegs writes every partial product neatly and checks every fact twice. He is <b>________</b>.", "answers": ["meticulous"], "why": "<b>Meticulous</b> means very careful about every small detail.", "no": "Which word means very careful about every detail?", "hint": "It starts with m-e-t."}, {"q": "<b>Approximately</b> 500 Vikings came to the feast. How many came?", "choices": ["exactly 500", "close to 500, maybe a few more or a few less", "more than 5,000"], "a": 1, "why": "Approximately means close to, but maybe not exactly.", "no": ["Approximately means close to, not exact.", null, "Approximately 500 means close to 500, not ten times more."]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"q": "Which is the best estimate for <b>438 × 6</b>?", "choices": ["between 240 and 300", "between 24,000 and 30,000", "between 2,400 and 3,000", "between 400 and 500"], "a": 2, "why": "400 × 6 = 2,400 and 500 × 6 = 3,000.", "no": ["400 × 6 is 24 hundreds = 2,400.", "Too many zeros.", null, "Multiplying by 6 makes 438 much bigger."]}, {"type": "fill", "q": "This is the area model for <b>529 × 8</b>. What goes in the <b>500</b> box?", "visual": {"kind": "area", "b": 8, "split": [500, 20, 9], "show": false}, "answers": ["4000"], "why": "5 × 8 = 40, so 500 × 8 = <b>4,000</b>.", "no": "500 is 5 hundreds. Do 5 × 8, then keep two zeros."}, {"type": "fill", "q": "What is <b>529 × 8</b>?", "answers": ["4232"], "why": "4,000 + 160 + 72 = <b>4,232</b>.", "no": "Use three boxes: 500 × 8, 20 × 8 and 9 × 8."}, {"q": "Which four partial products build <b>28 × 13</b>?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">20</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">8</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">3</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text></svg>"}, "choices": ["200, 80, 6, 24", "200, 8, 60, 24", "20, 80, 60, 24", "200, 80, 60, 24"], "a": 3, "why": "20 × 10 = 200, 8 × 10 = 80, 20 × 3 = 60 and 8 × 3 = 24.", "no": ["20 × 3 is 2 tens × 3 = 6 tens = 60, not 6.", "8 × 10 is 80, not 8.", "20 × 10 is 200.", null]}, {"type": "fill", "q": "What is <b>28 × 13</b>?", "answers": ["364"], "why": "200 + 80 + 60 + 24 = <b>364</b>.", "no": "Add all four partial products: 200, 80, 60 and 24."}, {"type": "fill", "q": "Stoick orders <b>6</b> crates of arrows. Each crate holds <b>145</b> arrows. How many arrows?", "answers": ["870", "870 arrows"], "why": "600 + 240 + 30 = <b>870</b>.", "no": "6 equal crates of 145. Use three boxes."}, {"type": "fill", "q": "Gobber says <b>34 × 12 = 300 + 8 = 308</b>. He used only 2 boxes. What is 34 × 12 really?", "answers": ["408"], "why": "300 + 40 + 60 + 8 = <b>408</b>. He forgot 4 × 10 = 40 and 30 × 2 = 60.", "no": "34 × 12 needs four boxes: 30 × 10, 4 × 10, 30 × 2, 4 × 2."}, {"q": "<b>Reasonable</b> means …", "choices": ["exactly right to the last digit", "makes sense when you think it through", "very fast", "very large"], "a": 1, "why": "A reasonable answer makes sense.", "no": ["An answer can be reasonable and still have a small slip.", null, "Reasonable is about sense, not speed.", "That is not what reasonable means."]}, {"type": "fill", "q": "A dragon hides behind a rock and fakes a call for help to trick the Vikings into walking the wrong way. Which word from this lesson describes the dragon? Type it.", "answers": ["crafty", "cunning"], "why": "<b>Crafty</b> means clever in a sneaky, tricky way.", "no": "Which word means clever in a sneaky way?"}, {"q": "To <b>gauge</b> how big an answer will be, you …", "choices": ["add the two factors", "make an estimate to judge its size", "write every partial product twice"], "a": 1, "why": "Gauge means to judge how big something is.", "no": ["Adding does not judge the size of a product.", null, "That does not judge size."]}], [{"q": "Which is the best estimate for <b>657 × 7</b>?", "choices": ["between 420 and 490", "between 4,200 and 4,900", "between 42,000 and 49,000", "between 650 and 660"], "a": 1, "why": "600 × 7 = 4,200 and 700 × 7 = 4,900.", "no": ["600 × 7 is 6 hundreds × 7 = 42 hundreds = 4,200.", null, "Too many zeros. 600 × 7 = 4,200.", "That is about 657 itself. Multiplying by 7 makes it much bigger."]}, {"type": "fill", "q": "This is the area model for <b>718 × 6</b>. What goes in the <b>700</b> box?", "visual": {"kind": "area", "b": 6, "split": [700, 10, 8], "show": false}, "answers": ["4200"], "why": "7 × 6 = 42, so 700 × 6 = <b>4,200</b>.", "no": "700 is 7 hundreds. Do 7 × 6, then keep two zeros."}, {"type": "fill", "q": "What is <b>718 × 6</b>?", "answers": ["4308"], "why": "4,200 + 60 + 48 = <b>4,308</b>.", "no": "Use three boxes: 700 × 6, 10 × 6 and 8 × 6."}, {"q": "Which four partial products build <b>37 × 14</b>?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">30</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">7</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">4</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text></svg>"}, "choices": ["300, 70, 120, 28", "300, 70, 12, 28", "30, 70, 120, 28", "300, 28"], "a": 0, "why": "30 × 10 = 300, 7 × 10 = 70, 30 × 4 = 120 and 7 × 4 = 28.", "no": [null, "30 × 4 is 3 tens × 4 = 12 tens = 120.", "30 × 10 is 300, not 30.", "Only two boxes. You need all four."]}, {"type": "fill", "q": "What is <b>37 × 14</b>?", "answers": ["518"], "why": "300 + 70 + 120 + 28 = <b>518</b>.", "no": "Add all four partial products."}, {"type": "fill", "q": "Hiccup's tribe catches <b>236</b> fish a day for <b>9</b> days. How many fish?", "answers": ["2124", "2124 fish"], "why": "1,800 + 270 + 54 = <b>2,124</b>.", "no": "9 equal days of 236 fish. Use three boxes."}, {"type": "fill", "q": "Snotlout says <b>45 × 13 = 400 + 15 = 415</b>. He forgot two boxes. What is 45 × 13 really?", "answers": ["585"], "why": "400 + 50 + 120 + 15 = <b>585</b>.", "no": "45 × 13 needs four boxes: 40 × 10, 5 × 10, 40 × 3, 5 × 3."}, {"q": "Which answer is <b>reasonable</b> for <b>418 × 7</b>?", "choices": ["292", "29,260", "2,926", "425"], "a": 2, "why": "418 × 7 is between 2,800 and 3,500. Only <b>2,926</b> fits.", "no": ["Too small. 400 × 7 is already 2,800.", "Too big. 500 × 7 is only 3,500.", null, "That is about 418 + 7. Multiplying makes it much bigger."]}, {"type": "fill", "q": "Which word means <b>very careful about every small detail</b>? Type it.", "answers": ["meticulous"], "why": "<b>Meticulous</b> means very careful about every small detail.", "no": "It starts with m-e-t."}, {"q": "The Vikings painted scary faces on their shields so they would look …", "choices": ["meticulous", "reasonable", "fearsome", "approximate"], "a": 2, "why": "<b>Fearsome</b> means frightening to look at or to face.", "no": ["Meticulous means careful with details, not scary.", "Reasonable means it makes sense.", null, "Approximate means close to a number."]}], [{"q": "Which is the best estimate for <b>46 × 23</b>?", "choices": ["between 80 and 150", "between 8,000 and 15,000", "between 800 and 1,500", "between 40 and 50"], "a": 2, "why": "40 × 20 = 800 and 50 × 30 = 1,500.", "no": ["40 × 20 is 800, not 80.", "Too many zeros. 40 × 20 = 800.", null, "That is about 46 itself. Multiplying by 23 makes it much bigger."]}, {"type": "fill", "q": "This is the area model for <b>586 × 9</b>. What goes in the <b>500</b> box?", "visual": {"kind": "area", "b": 9, "split": [500, 80, 6], "show": false}, "answers": ["4500"], "why": "5 × 9 = 45, so 500 × 9 = <b>4,500</b>.", "no": "500 is 5 hundreds. Do 5 × 9, then keep two zeros."}, {"type": "fill", "q": "What is <b>586 × 9</b>?", "answers": ["5274"], "why": "4,500 + 720 + 54 = <b>5,274</b>.", "no": "Use three boxes: 500 × 9, 80 × 9 and 6 × 9."}, {"q": "Which four partial products build <b>19 × 24</b>?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">10</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">9</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">20</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">4</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text></svg>"}, "choices": ["200, 180, 40, 36", "200, 18, 40, 36", "200, 36", "20, 180, 40, 36"], "a": 0, "why": "10 × 20 = 200, 9 × 20 = 180, 10 × 4 = 40 and 9 × 4 = 36.", "no": [null, "9 × 20 is 9 × 2 tens = 18 tens = 180.", "Only two boxes. You need all four.", "10 × 20 is 200, not 20."]}, {"type": "fill", "q": "What is <b>19 × 24</b>?", "answers": ["456"], "why": "200 + 180 + 40 + 36 = <b>456</b>.", "no": "Add all four partial products."}, {"type": "fill", "q": "Stoick buys <b>8</b> sacks of grain. Each sack weighs <b>174</b> pounds. How many pounds?", "answers": ["1392", "1392 pounds"], "why": "800 + 560 + 32 = <b>1,392</b>.", "no": "8 equal sacks of 174. Use three boxes."}, {"type": "fill", "q": "Fishlegs says <b>53 × 16 = 500 + 18 = 518</b>. He forgot two boxes. What is 53 × 16 really?", "answers": ["848"], "why": "500 + 30 + 300 + 18 = <b>848</b>.", "no": "53 × 16 needs four boxes: 50 × 10, 3 × 10, 50 × 6, 3 × 6."}, {"q": "Which sentence uses <b>reasonable</b> correctly?", "choices": ["30 is a reasonable answer for 23 × 31.", "713 is a reasonable answer for 23 × 31 because it is between 600 and 1,200.", "The dragon was reasonable and breathed fire on everyone."], "a": 1, "why": "A reasonable answer makes sense with the estimate.", "no": ["23 × 31 must be at least 20 × 30 = 600, so 30 makes no sense.", null, "Reasonable means it makes sense; it is used here for an answer, not a wild dragon."]}, {"type": "fill", "q": "To make a smart guess that is close to the real answer is to <b>________</b>.", "answers": ["estimate", "approximate"], "why": "To <b>estimate</b> is to make a smart guess close to the real answer.", "no": "It is what you do before you multiply."}, {"q": "Hiccup watches the dragon's eyes to <b>gauge</b> its mood. What is he doing?", "choices": ["judging how the dragon feels", "feeding the dragon", "running away from the dragon", "giving the dragon a name"], "a": 0, "why": "<b>Gauge</b> means to judge how big, how much or how good something is.", "no": [null, "Gauge is about judging, not feeding.", "He is watching closely, not running.", "Gauge means to judge how big or how much."]}]]}], "win": "You estimated, built every box, and checked your answer. Meticulous work!", "prev": "bb-bailey-L06", "prevTitle": "Lesson 6"});</script></body></html>
