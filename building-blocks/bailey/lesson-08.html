<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 8: Pick the Smartest Method</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L08", "label": "Lesson 8", "title": "Pick the Smartest Method", "goal": "I can choose the best method for a multiplication problem and find the mistake in someone's work.", "date": "2026-11-05", "mastery": 90, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Pick the Smartest Method: On Your Own", "text": "In class you picked the best tool and hunted blunders. Now prove it on your own. Keep paper and a pencil next to you.", "visual": {"kind": "emoji", "text": "🧠 🔧 📐 🔍"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["How do you choose between a fact, break apart and an area model?", "Name the four blunders. Which one do <b>you</b> need to watch for?", "Was a choice Hiccup made this week <b>deliberate</b>? Tell what happened."], "starters": ["First I ask myself …", "The four blunders are …", "Hiccup's choice was deliberate because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Review your words", "text": "Say the meaning out loud first. Then flip the card to check yourself.", "words": [{"word": "method", "pos": "noun", "meaning": "A way of doing something, step by step.", "example": "The area model is my <b>method</b> for 238 × 7.", "emoji": "🛠️"}, {"word": "optimal", "pos": "adjective", "meaning": "The best possible choice for the job.", "example": "For 9 × 7, the <b>optimal</b> method is just knowing the fact.", "emoji": "🏅"}, {"word": "valid", "pos": "adjective", "meaning": "Correct and based on good reasons.", "example": "Hiccup's answer is <b>valid</b>: every box is right.", "emoji": "✔️"}, {"word": "blunder", "pos": "noun", "meaning": "A careless mistake.", "example": "Writing 42 instead of 420 in the 60 box is a <b>blunder</b>.", "emoji": "🤦"}, {"word": "scrutinize", "pos": "verb", "meaning": "To look at something very closely to find any problem.", "example": "Gobber <b>scrutinized</b> every dragon in the training ring.", "emoji": "🔎"}, {"word": "deliberate", "pos": "adjective", "meaning": "Done on purpose, after careful thinking.", "example": "Choosing the area model was a <b>deliberate</b> choice, not a guess.", "emoji": "🧠"}, {"word": "triumphant", "pos": "adjective", "meaning": "Proud and happy after winning or succeeding.", "example": "The tribe gave a <b>triumphant</b> cheer when the danger was over.", "emoji": "🏆"}]}, {"type": "learn", "kick": "Remember", "title": "Pick the tool, then scrutinize", "text": "🧠 Fact: both numbers 10 or less. 🔧 Break apart: a teen or a tens number. 📐 Area model: bigger numbers.", "visual": {"kind": "bigtext", "text": "17 × 6 = 60 + 42", "sub": "17 is a teen number: break it apart in your head"}, "tip": "Four blunders to scrutinize for: lost zero, wrong fact, missing box, lost count."}, {"type": "tap", "kick": "Try it", "title": "Pick the tool", "text": "Type <b>fact</b>, <b>break apart</b> or <b>area model</b>.", "items": [{"type": "fill", "q": "Which tool is optimal for <b>8 × 7</b>?", "answers": ["fact", "know the fact", "basic fact", "know it"], "why": "Both numbers are 10 or less: just know it. 8 × 7 = 56.", "no": "Are both numbers 10 or less?", "hint": "5, 6, 7, 8."}, {"type": "fill", "q": "Which tool is optimal for <b>53 × 28</b>?", "answers": ["area model", "area", "an area model", "area-model"], "why": "Both numbers have two digits and neither is a teen or tens number: <b>area model</b> with four boxes.", "no": "Is 53 a teen or a tens number?", "hint": "Two 2-digit numbers need four boxes."}, {"type": "fill", "q": "Break apart in your head: <b>17 × 8 = ____</b>", "answers": ["136"], "why": "10 × 8 = 80 and 7 × 8 = 56. 80 + 56 = <b>136</b>.", "no": "Split 17 into 10 + 7. Multiply each part by 8, then add.", "hint": "80 + 56"}]}, {"type": "tap", "kick": "Try it", "title": "Fix the blunder", "text": "Scrutinize the work. Type the right answer.", "items": [{"type": "fill", "q": "Snotlout wrote <b>35 × 8 = 24 + 40 = 64</b>. Fix the blunder. What is 35 × 8?", "answers": ["280"], "why": "30 × 8 is 240, not 24 (lost zero). 240 + 40 = <b>280</b>.", "no": "Check the 30 box. 30 is 3 tens.", "hint": "3 tens × 8 = 24 tens."}, {"type": "fill", "q": "Fishlegs wrote <b>24 × 15 = 200 + 20 = 220</b>. What is 24 × 15 really?", "answers": ["360"], "why": "He left out two boxes. 200 + 40 + 100 + 20 = <b>360</b>.", "no": "24 × 15 needs four boxes: 20 × 10, 4 × 10, 20 × 5, 4 × 5.", "hint": "Missing: 4 × 10 = 40 and 20 × 5 = 100."}, {"type": "fill", "q": "Gobber added 8 again and again for <b>13 × 8</b> and got 96. How many 8s did he really add?", "answers": ["12", "twelve", "12 eights", "twelve eights", "12 8s"], "why": "96 is <b>12</b> eights (12 × 8 = 96). He lost count: 13 × 8 = 104.", "no": "Which number times 8 makes 96?", "hint": "10 × 8 = 80. How many more 8s make 96?"}]}, {"type": "tap", "kick": "Try it", "title": "Two-step problems", "text": "Plan first: what do you do first, and what next? Type just the number.", "items": [{"type": "fill", "q": "Stoick has <b>600</b> coins. He buys <b>7</b> helmets that cost <b>68</b> coins each. How many coins are <b>left</b>?", "answers": ["124", "124 coins"], "why": "68 × 7 = 420 + 56 = 476. 600 − 476 = <b>124</b> coins left.", "no": "First multiply 68 × 7. Then subtract from 600.", "hint": "68 × 7 = 476."}, {"type": "fill", "q": "There are <b>5</b> nests with <b>23</b> eggs each and <b>3</b> nests with <b>17</b> eggs each. How many eggs in all?", "answers": ["166", "166 eggs"], "why": "5 × 23 = 115 and 3 × 17 = 51. 115 + 51 = <b>166</b> eggs.", "no": "Multiply for each kind of nest, then add.", "hint": "5 × 23 = 115."}]}, {"type": "recall", "kick": "Remember", "title": "This week", "items": [{"type": "fill", "q": "Estimate: <b>58 × 22</b> is between 1,000 and <b>____</b>.", "answers": ["1800"], "why": "50 × 20 = 1,000 and 60 × 30 = <b>1,800</b>.", "no": "Round both numbers up: 60 and 30.", "hint": "6 × 3 = 18, then two zeros."}, {"q": "Which partial products build <b>87 × 9</b>?", "choices": ["72 and 63", "720 and 7", "720 and 63", "80 and 7"], "a": 2, "why": "80 × 9 = 720 and 7 × 9 = 63. Total: 783.", "no": ["80 × 9 is 8 tens × 9 = 72 tens = 720.", "The 7 box gets multiplied too: 7 × 9 = 63.", null, "Those are the parts of 87. Multiply each one by 9."]}]}, {"type": "tap", "kick": "Word Power", "title": "Use your words", "text": "Type the word from memory.", "items": [{"type": "fill", "q": "Gobber looked very closely at every box to find mistakes. He <b>________</b> the work.", "answers": ["scrutinized", "scrutinize", "scrutinizes"], "why": "To <b>scrutinize</b> is to look very closely to find any problem.", "no": "Which word means to look very closely for problems?", "hint": "It starts with s-c-r."}, {"type": "fill", "q": "Writing 7 × 8 = 54 is a careless mistake. A careless mistake is a <b>________</b>.", "answers": ["blunder"], "why": "A <b>blunder</b> is a careless mistake.", "no": "Which word means a careless mistake?", "hint": "It starts with b-l."}, {"q": "Which choice is <b>deliberate</b>?", "choices": ["Hiccup trips over a bucket.", "Hiccup plans his words carefully before he speaks to the dragon.", "Hiccup sneezes in the middle of a speech."], "a": 1, "why": "Deliberate means done on purpose, after careful thinking.", "no": ["Tripping is an accident, not on purpose.", null, "A sneeze is not planned."]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"q": "What is the optimal way to find <b>16 × 9</b>?", "choices": ["Add 9 sixteen times", "Break apart: 90 + 54 = 144", "Draw a 4-box area model", "Just know it as a basic fact"], "a": 1, "why": "10 × 9 + 6 × 9 = 90 + 54 = 144.", "no": ["Correct but slow, and easy to lose count.", null, "9 has only one digit, so there are not four boxes.", "16 × 9 is bigger than the basic facts."]}, {"q": "Which problem should you solve with an <b>area model on paper</b>?", "choices": ["7 × 9", "40 × 6", "11 × 7", "367 × 8"], "a": 3, "why": "A 3-digit number needs three boxes.", "no": ["A basic fact: just know it.", "One fact and a zero: 240.", "Break apart in your head: 70 + 7.", null]}, {"type": "fill", "q": "What is <b>367 × 8</b>?", "answers": ["2936"], "why": "2,400 + 480 + 56 = <b>2,936</b>.", "no": "Use three boxes: 300 × 8, 60 × 8 and 7 × 8."}, {"type": "fill", "q": "What is <b>29 × 16</b>?", "answers": ["464"], "why": "200 + 90 + 120 + 54 = <b>464</b>.", "no": "Use four boxes: 20 × 10, 9 × 10, 20 × 6 and 9 × 6."}, {"type": "fill", "q": "Gobber wrote <b>85 × 7 = 560 + 35 = 595</b>. Is his work valid? Type <b>valid</b> or <b>not valid</b>.", "answers": ["valid"], "why": "80 × 7 = 560 and 5 × 7 = 35. Every box is right, so it is <b>valid</b>.", "no": "Check each box: 80 × 7 and 5 × 7."}, {"type": "fill", "q": "Snotlout wrote <b>47 × 6 = 240 + 46 = 286</b>. Fix the blunder. What is 47 × 6?", "answers": ["282"], "why": "7 × 6 is 42, not 46. 240 + 42 = <b>282</b>.", "no": "Check the ones box: 7 × 6."}, {"type": "fill", "q": "A Viking ship makes <b>18</b> trips. Each trip carries <b>25</b> sheep. How many sheep?", "answers": ["450", "450 sheep"], "why": "200 + 160 + 50 + 40 = <b>450</b>.", "no": "18 equal trips of 25. Use four boxes."}, {"type": "fill", "q": "Hiccup reads <b>45</b> pages a day for <b>6</b> days. His book has <b>300</b> pages. How many pages are <b>left</b>?", "answers": ["30", "30 pages"], "why": "45 × 6 = 270. 300 − 270 = <b>30</b> pages left.", "no": "First multiply 45 × 6. Then subtract from 300."}, {"q": "To <b>scrutinize</b> an area model means to …", "choices": ["draw it as fast as you can", "erase the smallest box", "copy a friend's answer", "look at every box very closely for mistakes"], "a": 3, "why": "Scrutinize means to look very closely.", "no": ["Scrutinize is slow and careful.", "That would make a blunder.", "Scrutinize means checking it yourself.", null]}, {"q": "Fishlegs rushed and forgot to multiply the ones box. That careless mistake was a <b>______</b> in his work.", "choices": ["method", "blunder", "deliberate", "triumphant"], "a": 1, "why": "A blunder is a careless mistake.", "no": ["A method is a way of doing something, not a mistake.", null, "Deliberate means on purpose. This was careless.", "Triumphant means proud after winning."]}], [{"q": "What is the optimal way to find <b>18 × 7</b>?", "choices": ["Just know it as a basic fact", "Add 7 eighteen times", "Break apart: 70 + 56 = 126", "Draw a 3-box area model"], "a": 2, "why": "10 × 7 + 8 × 7 = 70 + 56 = 126.", "no": ["18 × 7 is bigger than the basic facts.", "Correct but slow, and easy to lose count.", null, "18 has only two digits, so three boxes makes no sense."]}, {"q": "Which problem can you just <b>know</b> as a basic fact?", "choices": ["6 × 9", "16 × 9", "60 × 19", "69 × 6"], "a": 0, "why": "6 × 9 = 54 is a basic fact.", "no": [null, "16 is bigger than 10. Break it apart.", "Both numbers are too big for a basic fact.", "69 needs two boxes."]}, {"type": "fill", "q": "What is <b>485 × 6</b>?", "answers": ["2910"], "why": "2,400 + 480 + 30 = <b>2,910</b>.", "no": "Use three boxes: 400 × 6, 80 × 6 and 5 × 6."}, {"type": "fill", "q": "What is <b>38 × 26</b>?", "answers": ["988"], "why": "600 + 160 + 180 + 48 = <b>988</b>.", "no": "Use four boxes: 30 × 20, 8 × 20, 30 × 6 and 8 × 6."}, {"type": "fill", "q": "Fishlegs wrote <b>63 × 9 = 540 + 27 = 567</b>. Is his work valid? Type <b>valid</b> or <b>not valid</b>.", "answers": ["valid"], "why": "60 × 9 = 540 and 3 × 9 = 27. Every box is right, so it is <b>valid</b>.", "no": "Check each box: 60 × 9 and 3 × 9."}, {"type": "fill", "q": "Gobber wrote <b>74 × 8 = 56 + 32 = 88</b>. Fix the blunder. What is 74 × 8?", "answers": ["592"], "why": "70 × 8 is 560, not 56 (lost zero). 560 + 32 = <b>592</b>.", "no": "Check the 70 box. 70 is 7 tens."}, {"type": "fill", "q": "Each of <b>14</b> dragons eats <b>35</b> fish. How many fish?", "answers": ["490", "490 fish"], "why": "300 + 50 + 120 + 20 = <b>490</b>.", "no": "14 equal groups of 35. Use four boxes."}, {"type": "fill", "q": "Hiccup has <b>400</b> coins. He buys <b>9</b> maps that cost <b>36</b> coins each. How many coins are <b>left</b>?", "answers": ["76", "76 coins"], "why": "36 × 9 = 270 + 54 = 324. 400 − 324 = <b>76</b> coins left.", "no": "First multiply 36 × 9. Then subtract from 400."}, {"q": "Which moment would make Hiccup feel <b>triumphant</b>?", "choices": ["losing his helmet in the sea", "finally training his dragon after many tries", "waiting in the rain", "forgetting what to say"], "a": 1, "why": "Triumphant means proud and happy after winning or succeeding.", "no": ["That would make him upset, not proud.", null, "Waiting is not winning.", "That is embarrassing, not triumphant."]}, {"q": "A <b>method</b> is …", "choices": ["a careless mistake", "the best possible choice", "a proud cheer", "a way of doing something, step by step"], "a": 3, "why": "A method is a way of doing something, step by step.", "no": ["That is a blunder.", "That is optimal.", "That is triumphant.", null]}], [{"q": "What is the optimal way to find <b>14 × 8</b>?", "choices": ["Break apart: 80 + 32 = 112", "Add 8 fourteen times", "Draw a 4-box area model", "Just know it as a basic fact"], "a": 0, "why": "10 × 8 + 4 × 8 = 80 + 32 = 112.", "no": [null, "Correct but slow, and easy to lose count.", "8 has only one digit, so there are not four boxes.", "14 × 8 is bigger than the basic facts."]}, {"q": "Which problem needs an <b>area model on paper</b>?", "choices": ["8 × 6", "30 × 7", "12 × 6", "58 × 34"], "a": 3, "why": "Two 2-digit numbers need four boxes on paper.", "no": ["A basic fact: just know it (48).", "One fact and a zero: 210.", "Break apart in your head: 60 + 12 = 72.", null]}, {"type": "fill", "q": "What is <b>629 × 7</b>?", "answers": ["4403"], "why": "4,200 + 140 + 63 = <b>4,403</b>.", "no": "Use three boxes: 600 × 7, 20 × 7 and 9 × 7."}, {"type": "fill", "q": "What is <b>43 × 27</b>?", "answers": ["1161"], "why": "800 + 60 + 280 + 21 = <b>1,161</b>.", "no": "Use four boxes: 40 × 20, 3 × 20, 40 × 7 and 3 × 7."}, {"type": "fill", "q": "Snotlout wrote <b>64 × 6 = 360 + 34 = 394</b>. Is his work valid? Type <b>valid</b> or <b>not valid</b>.", "answers": ["not valid", "invalid"], "why": "4 × 6 is 24, not 34. The right answer is 384, so his work is <b>not valid</b>.", "no": "Check each box: 60 × 6 and 4 × 6."}, {"type": "fill", "q": "Fishlegs wrote <b>26 × 17 = 200 + 42 = 242</b>. He left out two boxes. What is 26 × 17?", "answers": ["442"], "why": "200 + 60 + 140 + 42 = <b>442</b>.", "no": "26 × 17 needs four boxes: 20 × 10, 6 × 10, 20 × 7, 6 × 7."}, {"type": "fill", "q": "<b>22</b> Vikings each carry <b>45</b> rocks. How many rocks?", "answers": ["990", "990 rocks"], "why": "800 + 100 + 80 + 10 = <b>990</b>.", "no": "22 equal groups of 45. Use four boxes."}, {"type": "fill", "q": "Gobber needs <b>500</b> nails. He has <b>9</b> bags with <b>47</b> nails each. How many <b>more</b> nails does he need?", "answers": ["77", "77 nails"], "why": "47 × 9 = 360 + 63 = 423. 500 − 423 = <b>77</b> more nails.", "no": "First multiply 47 × 9. Then subtract from 500."}, {"q": "Gobber wants to <b>scrutinize</b> Hiccup's work. What does he do?", "choices": ["He throws it away.", "He looks at every step very closely for mistakes.", "He copies it fast.", "He cheers for it."], "a": 1, "why": "Scrutinize means to look at something very closely to find any problem.", "no": ["That is abandoning it, not scrutinizing it.", null, "Scrutinizing is slow and careful.", "Cheering is not checking."]}, {"q": "Which sentence uses <b>valid</b> correctly?", "choices": ["The valid dragon flew home.", "I ate a valid sandwich for lunch.", "Your answer is valid because each box is correct and it fits the estimate."], "a": 2, "why": "Valid means correct and based on good reasons.", "no": ["Valid describes reasoning or answers, not a dragon.", "A sandwich is not correct or incorrect.", null]}]]}], "win": "You picked the right tool and caught the blunders. That is a triumphant week!", "prev": "bb-bailey-L07", "prevTitle": "Lesson 7"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
