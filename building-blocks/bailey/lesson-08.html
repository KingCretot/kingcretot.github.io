<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 8: Pick the Smartest Method</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L08", "label": "Lesson 8", "title": "Pick the Smartest Method", "goal": "I can choose the best method for a multiplication problem and find the mistake in someone's work.", "date": "2026-11-05", "mastery": 90, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Pick the Smartest Method", "text": "You have three tools now: <b>facts</b>, <b>break apart</b>, and the <b>area model</b>. Today you prove you can pick the right tool and catch a <b>blunder</b> in someone else's work.", "visual": {"kind": "emoji", "text": "🧠 🔧 📐"}}, {"type": "talk", "kick": "Book Talk", "title": "Choices and results", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What is the most exciting thing that has happened so far? Tell it with details.", "Find a choice Hiccup made. Was it a deliberate choice or a quick guess? Use a detail to explain.", "If you could give Hiccup one piece of advice right now, what would it be, and why?"], "starters": ["The most exciting part was …", "Hiccup chose to … I think it was …", "I would tell Hiccup to … because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read the word, the meaning and the example out loud.", "words": [{"word": "method", "pos": "noun", "meaning": "A way of doing something, step by step.", "example": "The area model is my <b>method</b> for 238 × 7.", "emoji": "🛠️"}, {"word": "optimal", "pos": "adjective", "meaning": "The best possible choice for the job.", "example": "For 9 × 7, the <b>optimal</b> method is just knowing the fact.", "emoji": "🏅"}, {"word": "valid", "pos": "adjective", "meaning": "Correct and based on good reasons.", "example": "Hiccup's answer is <b>valid</b>: every box is right.", "emoji": "✔️"}, {"word": "blunder", "pos": "noun", "meaning": "A careless mistake.", "example": "Writing 42 instead of 420 in the 60 box is a <b>blunder</b>.", "emoji": "🤦"}, {"word": "scrutinize", "pos": "verb", "meaning": "To look at something very closely to find any problem.", "example": "Gobber <b>scrutinized</b> every dragon in the training ring.", "emoji": "🔎"}, {"word": "deliberate", "pos": "adjective", "meaning": "Done on purpose, after careful thinking.", "example": "Choosing the area model was a <b>deliberate</b> choice, not a guess.", "emoji": "🧠"}, {"word": "triumphant", "pos": "adjective", "meaning": "Proud and happy after winning or succeeding.", "example": "The tribe gave a <b>triumphant</b> cheer when the danger was over.", "emoji": "🏆"}]}, {"type": "learn", "kick": "Learn", "title": "Three tools: which one?", "text": "Before you start, ask: <b>Which method is optimal?</b>", "steps": [{"text": "🧠 <b>Know the fact.</b> Both numbers are 10 or less. 9 × 7 = 63. Done!"}, {"text": "🔧 <b>Break apart in your head.</b> One number is a teen (11–19) or a tens number. 12 × 8 = 80 + 16 = 96."}, {"text": "📐 <b>Area model on paper.</b> Bigger numbers: 68 × 7, 245 × 6, 23 × 14."}, {"text": "🐢 <b>Adding over and over</b> is never optimal for big numbers. It is slow and easy to lose count."}], "tip": "Ask yourself: Do I know it? Can I split it in my head? If not, draw the boxes."}, {"type": "sort", "kick": "Sort it", "title": "Pick the tool", "text": "Tap a problem, then tap the tool you would use.", "buckets": ["🧠 Know the fact", "🔧 Break apart in my head", "📐 Area model on paper"], "items": [{"text": "9 × 6", "b": 0, "why": "A basic fact: 54.", "hint": "Are both numbers 10 or less?"}, {"text": "8 × 8", "b": 0, "why": "A basic fact: 64.", "hint": "Are both numbers 10 or less?"}, {"text": "13 × 7", "b": 1, "why": "70 + 21 = 91 in your head.", "hint": "13 is a teen number: 10 + 3."}, {"text": "50 × 9", "b": 1, "why": "5 × 9 = 45, so 450. One fact and a zero.", "hint": "50 is a tens number."}, {"text": "11 × 6", "b": 1, "why": "60 + 6 = 66.", "hint": "11 is 10 + 1."}, {"text": "346 × 8", "b": 2, "why": "Three boxes: 2,400 + 320 + 48 = 2,768.", "hint": "A 3-digit number needs boxes."}, {"text": "27 × 14", "b": 2, "why": "Four boxes: 200 + 70 + 80 + 28 = 378.", "hint": "Both numbers have two digits."}, {"text": "78 × 9", "b": 2, "why": "Two big boxes: 630 + 72 = 702.", "hint": "78 is not a teen or a tens number."}], "done": "Facts for small numbers, break apart for teens and tens, area model for the big ones."}, {"type": "tap", "kick": "Try it", "title": "Pick and solve", "items": [{"q": "What is the optimal way to find <b>19 × 6</b>?", "choices": ["Add 6 nineteen times", "20 × 6 − 6 = 114", "Draw a 3-box area model", "10 × 6 + 9 = 69"], "a": 1, "why": "19 sixes is one six less than 20 sixes: 120 − 6 = <b>114</b>.", "no": ["That works but it is slow. 19 is close to 20, so use a shortcut.", null, "19 has only two digits. Three boxes makes no sense here.", "The 9 must be multiplied by 6 too: 9 × 6 = 54."]}, {"q": "Hiccup wants to find <b>238 × 7</b>. Which method makes sense?", "choices": ["Add 7 two hundred thirty-eight times", "Just know it as a fact", "Area model: 1,400 + 210 + 56", "Add 238 + 7"], "a": 2, "why": "A 3-digit number needs three boxes.", "no": ["Far too slow, and easy to lose count.", "238 × 7 is not a basic fact.", null, "That is adding, not multiplying."]}, {"q": "So what is <b>238 × 7</b>?", "choices": ["1,666", "1,656", "245", "1,610"], "a": 0, "why": "1,400 + 210 + 56 = <b>1,666</b>.", "no": [null, "210 + 56: 1 ten + 5 tens = 6 tens, so 266, and 1,400 + 266 = 1,666.", "You added 238 + 7.", "You left out the ones box: 8 × 7 = 56."]}]}, {"type": "learn", "kick": "Learn", "title": "Spot the blunder", "text": "Good mathematicians <b>scrutinize</b> work. Here are four blunders to watch for.", "steps": [{"text": "<b>Blunder 1: the lost zero.</b> 62 × 7 = 42 + 14 = 56 ❌<br>The 60 box is 60 × 7 = <b>420</b>, not 42. Fixed: 420 + 14 = <b>434</b>."}, {"text": "<b>Blunder 2: the wrong fact.</b> 78 × 6 = 420 + 46 = 466 ❌<br>8 × 6 = <b>48</b>. Fixed: 420 + 48 = <b>468</b>.", "visual": {"kind": "area", "b": 6, "split": [70, 8], "show": true}}, {"text": "<b>Blunder 3: the missing box.</b> 25 × 13 = 200 + 15 = 215 ❌<br>There are four boxes. Fixed: 200 + 50 + 60 + 15 = <b>325</b>.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">20</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">5</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"82.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">20 × 10</text><text x=\"131.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">200</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"82.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">5 × 10</text><text x=\"266.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">50</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">3</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">20 × 3</text><text x=\"131.0\" y=\"193.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">60</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">5 × 3</text><text x=\"266.0\" y=\"193.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">15</text></svg>"}}, {"text": "<b>Blunder 4: lost count.</b> Snotlout added 9 again and again for 12 × 9 and got 99 ❌<br>99 is only eleven 9s. Fixed: 90 + 18 = <b>108</b>."}], "tip": "Your estimate catches blunders. 62 × 7 must be between 60 × 7 = 420 and 70 × 7 = 490, so 56 cannot be right."}, {"type": "tap", "kick": "Try it", "title": "Find the blunder", "items": [{"q": "Snotlout found <b>83 × 9</b> like this: 72 + 27 = 99. What is the blunder?", "choices": ["He used the wrong fact. 3 × 9 is 24.", "There is no blunder. 99 is correct.", "He should have added 83 + 9 = 92.", "He lost the zero. 80 × 9 = 720, so the answer is 747."], "a": 3, "why": "720 + 27 = <b>747</b>.", "no": ["3 × 9 really is 27. Look at the 80 box.", "83 × 9 must be more than 80 × 9 = 720, so 99 is far too small.", "The sign says multiply.", null]}, {"q": "Fishlegs added 7 again and again for <b>15 × 7</b> and got 98. What happened?", "choices": ["He added only fourteen 7s. 15 × 7 = 70 + 35 = 105.", "He added one 7 too many. The answer is 91.", "There is no blunder. 98 is correct."], "a": 0, "why": "Fourteen 7s is 98. One more 7 makes <b>105</b>.", "no": [null, "98 is fourteen 7s, so he added one too <b>few</b>, not too many.", "15 × 7 = 70 + 35 = 105."]}, {"q": "This area model for <b>36 × 24</b> has one blunder. Which box is wrong?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">30</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">6</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">20</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"82.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">30 × 20</text><text x=\"131.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">600</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"82.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">6 × 20</text><text x=\"266.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">12</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">4</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">30 × 4</text><text x=\"131.0\" y=\"193.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">120</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">6 × 4</text><text x=\"266.0\" y=\"193.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">24</text></svg>"}, "choices": ["6 × 20 = 12", "30 × 20 = 600", "30 × 4 = 120", "6 × 4 = 24"], "a": 0, "why": "6 × 20 is 6 × 2 tens = 12 tens = <b>120</b>, not 12. Fixed: 600 + 120 + 120 + 24 = 864.", "no": [null, "3 × 2 = 6, and two zeros make 600. Correct.", "3 × 4 = 12, then one zero: 120. Correct.", "That fact is right."]}]}, {"type": "recall", "kick": "Remember", "title": "This week so far", "items": [{"q": "What is <b>92 × 8</b>?", "choices": ["100", "722", "736"], "a": 2, "why": "720 + 16 = <b>736</b>.", "no": ["You added 92 + 8.", "The ones box is 2 × 8 = 16, not 2.", null]}, {"q": "Which is the best estimate for <b>21 × 38</b>?", "choices": ["between 60 and 120", "between 600 and 1,200", "between 6,000 and 12,000"], "a": 1, "why": "20 × 30 = 600 and 30 × 40 = 1,200.", "no": ["20 × 30 is 600, not 60.", null, "Too many zeros."]}, {"q": "Which four partial products build <b>41 × 17</b>?", "choices": ["400 and 7", "400, 10, 28, 7", "40, 10, 28, 7", "400, 10, 280, 7"], "a": 3, "why": "40 × 10, 1 × 10, 40 × 7, 1 × 7. Total: <b>697</b>.", "no": ["Only two boxes. You need all four.", "40 × 7 is 4 tens × 7 = 280.", "Keep the zeros: 40 × 10 = 400 and 40 × 7 = 280.", null]}]}, {"type": "tap", "kick": "Try it", "title": "Harder problems on Berk", "items": [{"q": "Each of <b>9</b> dragons eats <b>8</b> fish a day. How many fish do they eat in <b>a week</b>?", "choices": ["72", "24", "504", "494"], "a": 2, "why": "9 × 8 = 72 fish a day. 72 × 7 = 490 + 14 = <b>504</b>.", "no": ["That is one day. A week has 7 days, so do 72 × 7.", "You added 9 + 8 + 7.", null, "72 × 7 = 490 + 14. Check the ones box."]}, {"q": "Stoick has <b>12</b> ships. Each ship needs <b>16</b> oars. He already has <b>150</b> oars. How many more oars does he need?", "choices": ["42", "192", "342"], "a": 0, "why": "12 × 16 = 100 + 20 + 60 + 12 = 192. 192 − 150 = <b>42</b>.", "no": [null, "That is all the oars he needs. He already has 150, so subtract.", "You added 150 more. He already has those oars, so subtract."]}, {"q": "Fishlegs buys <b>3</b> books that cost <b>124</b> coins each. Hiccup buys <b>4</b> books that cost <b>95</b> coins each. Who spends more, and by how much?", "choices": ["Fishlegs, by 8 coins", "Hiccup, by 29 coins", "They spend the same", "Hiccup, by 8 coins"], "a": 3, "why": "124 × 3 = 372 and 95 × 4 = 380. 380 − 372 = <b>8</b>.", "no": ["Fishlegs spends 372 and Hiccup spends 380. Who has more?", "29 is the difference in one book's price. Compare the totals.", "372 and 380 are not the same.", null]}]}, {"type": "tap", "kick": "Word Power", "title": "Use your new words", "items": [{"q": "The <b>optimal</b> method for a problem is …", "choices": ["the best possible choice for that job", "always the area model", "the longest method, so you are careful", "whatever your friend uses"], "a": 0, "why": "Optimal means the best possible choice.", "no": [null, "For 9 × 7 the area model is not the best choice.", "Long is not the same as best.", "Optimal depends on the problem, not on a friend."]}, {"q": "Which sentence uses <b>valid</b> correctly?", "choices": ["The dragon gave a valid roar and flew away.", "I was so valid that I ate three fish.", "Her answer is valid because every partial product is correct."], "a": 2, "why": "Valid means correct and based on good reasons.", "no": ["Valid means correct and well-reasoned. A roar is not correct or incorrect.", "Valid does not describe hunger or feelings.", null]}, {"q": "When the danger was over, the Vikings gave a <b>triumphant</b> cheer. How did they feel?", "choices": ["scared that it would come back", "proud and happy because they succeeded", "bored and sleepy", "confused about what happened"], "a": 1, "why": "Triumphant means proud and happy after winning.", "no": ["That is fear, not triumph.", null, "A triumphant cheer is full of energy.", "Triumphant people know they won."]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "What is the optimal way to find <b>16 × 9</b>?", "choices": ["Add 9 sixteen times", "Break apart: 90 + 54 = 144", "Draw a 4-box area model", "Just know it as a basic fact"], "a": 1, "why": "10 × 9 + 6 × 9 = 90 + 54 = 144.", "no": ["Correct but slow, and easy to lose count.", null, "9 has only one digit, so there are not four boxes.", "16 × 9 is bigger than the basic facts."]}, {"q": "Which problem should you solve with an <b>area model on paper</b>?", "choices": ["7 × 9", "40 × 6", "11 × 7", "367 × 8"], "a": 3, "why": "A 3-digit number needs three boxes.", "no": ["A basic fact: just know it.", "One fact and a zero: 240.", "Break apart in your head: 70 + 7.", null]}, {"q": "What is <b>367 × 8</b>?", "choices": ["2,936", "2,926", "2,880", "375"], "a": 0, "why": "2,400 + 480 + 56 = 2,936.", "no": [null, "480 + 56: 8 tens + 5 tens = 13 tens. Regroup to get 536.", "You left out the ones box: 7 × 8 = 56.", "You added 367 + 8."]}, {"q": "What is <b>29 × 16</b>?", "choices": ["254", "374", "464", "45"], "a": 2, "why": "200 + 90 + 120 + 54 = 464.", "no": ["200 + 54 uses only two of the four boxes.", "You left out the 90 box (9 × 10).", null, "You added 29 + 16."]}, {"q": "Gobber wrote <b>85 × 7 = 560 + 35 = 595</b>. Is his work valid?", "choices": ["No. 80 × 7 is 56, so the answer is 91.", "Yes. 80 × 7 = 560 and 5 × 7 = 35.", "No. 5 × 7 is 30, so the answer is 590."], "a": 1, "why": "Every box is right. 560 + 35 = 595.", "no": ["80 is 8 tens. 8 × 7 = 56 tens = 560.", null, "5 × 7 = 35."]}, {"q": "Snotlout wrote <b>47 × 6 = 240 + 46 = 286</b>. What is the blunder?", "choices": ["40 × 6 is 24, not 240.", "He should multiply 47 × 6 × 2.", "7 × 6 is 42, not 46. The answer is 282.", "There is no blunder."], "a": 2, "why": "240 + 42 = 282.", "no": ["40 × 6 = 240 is correct.", "There is nothing to double.", null, "Check the ones box: 7 × 6."]}, {"q": "A Viking ship makes <b>18</b> trips. Each trip carries <b>25</b> sheep. How many sheep?", "choices": ["450", "240", "43", "410"], "a": 0, "why": "200 + 160 + 50 + 40 = 450.", "no": [null, "200 + 40 uses only two boxes.", "You added 18 + 25.", "You left out the 40 box (8 × 5)."]}, {"q": "Hiccup reads <b>45</b> pages a day for <b>6</b> days. His book has <b>300</b> pages. How many pages are <b>left</b>?", "choices": ["270", "249", "570", "30"], "a": 3, "why": "45 × 6 = 270. 300 − 270 = 30 pages left.", "no": ["That is how many he read. The question asks how many are left.", "You subtracted 45 + 6 = 51. First multiply: 45 × 6 = 270.", "You added. Pages left means subtract.", null]}, {"q": "To <b>scrutinize</b> an area model means to …", "choices": ["draw it as fast as you can", "erase the smallest box", "copy a friend's answer", "look at every box very closely for mistakes"], "a": 3, "why": "Scrutinize means to look very closely.", "no": ["Scrutinize is slow and careful.", "That would make a blunder.", "Scrutinize means checking it yourself.", null]}, {"q": "Writing 42 instead of 420 in the 60 box was a careless <b>______</b> in Hiccup's work.", "choices": ["method", "blunder", "deliberate", "triumphant"], "a": 1, "why": "A blunder is a careless mistake.", "no": ["A method is a way of doing something, not a mistake.", null, "Deliberate means on purpose. This was careless.", "Triumphant means proud after winning."]}]}], "win": "You picked the right tool and caught the blunders. That is a triumphant week!", "prev": "bb-bailey-L07", "prevTitle": "Lesson 7"});</script></body></html>
