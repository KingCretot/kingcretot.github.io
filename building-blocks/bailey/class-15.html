<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 15: Prove It: Long Division Detective</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L15", "label": "Lesson 15", "title": "Prove It: Long Division Detective", "goal": "I can solve long division word problems, find the mistake in someone's work, and check my answer by multiplying.", "date": "2026-12-10", "mastery": 90, "color": "#E84393", "slides": [{"type": "hello", "title": "Prove It: Long Division Detective", "text": "This week you learned the long division algorithm with 2-digit and 3-digit numbers. Today you <b>prove it</b>: solve word problems, find mistakes in someone else's work, and check every answer by multiplying.", "visual": {"kind": "emoji", "text": "🕵️➗✔️"}, "notes": {"do": "Set out: whiteboard and marker with the four steps written on it, paper and pencil, 3 index cards with the word problems from slide 11 written on them, her book. Base-ten blocks nearby in case she needs them.", "say": "\"Prove-it day. You are the teacher today: you will check other people's work and find their mistakes.\"", "ask": "\"How did Tuesday's Show What You Know go? Did the Lesson 13 packet feel easy or hard?\" (Check her scores and the packet before class.)"}}, {"type": "talk", "kick": "Book Talk", "title": "Hiccup's test", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What test do the young Vikings have to pass to become full members of the tribe? How is Hiccup doing so far?", "What is one mistake Hiccup made? How did he try to fix it?", "Do you think Hiccup will pass? Use a clue from the book to back up your prediction."], "starters": ["The young Vikings have to …", "Hiccup made a mistake when … He tried to fix it by …", "I predict … because …"], "notes": {"do": "6 minutes. Let her find the pages.", "ask": "\"What mistake did Hiccup make, and how did he try to fix it?\" This links to today: finding and fixing mistakes.", "listen": "A prediction backed by a clue from the text, not just a wish. If she only says \"yes he will\", ask: \"What in the book makes you think so?\""}}, {"type": "recall", "kick": "Warm-up", "title": "This week so far", "text": "Solve on paper. Then type the quotient.", "items": [{"type": "fill", "q": "Use long division: <b>95 ÷ 5</b> = ____", "answers": ["19"], "why": "95 ÷ 5 = 19. Check: 19 × 5 = 95.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 5s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ___\n5 ) 95"}}, {"type": "fill", "q": "Use long division: <b>832 ÷ 8</b> = ____", "answers": ["104"], "why": "832 ÷ 8 = 104. Check: 104 × 8 = 832.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 8s fit in 8?", "visual": {"kind": "longdiv", "text": "\n   ____\n8 ) 832"}}], "notes": {"do": "She types the answers herself. Watch the tens step on 832 ÷ 8 (3 ÷ 8 gives a placeholder 0).", "say": "Praise the 0 the moment she writes it: \"Vigilant! There is the placeholder.\"", "listen": "95 ÷ 5 = 19 and 832 ÷ 8 = 104."}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read it out loud. Then use it in your own sentence.", "words": [{"word": "algorithm", "pos": "noun", "emoji": "⚙️", "meaning": "A set of steps that always works when you follow them in order.", "example": "Long division is an <b>algorithm</b>: divide, multiply, subtract, bring down."}, {"word": "discrepancy", "pos": "noun", "emoji": "⚠️", "meaning": "A difference between two things that should match.", "example": "13 × 6 = 78, not 618. That <b>discrepancy</b> tells me there is a mistake."}, {"word": "thorough", "pos": "adjective", "emoji": "🔎", "meaning": "Careful and complete, checking every part.", "example": "A <b>thorough</b> check looks at every step, not just the answer."}, {"word": "rectify", "pos": "verb", "emoji": "🛠️", "meaning": "To fix a mistake and make it right.", "example": "Fishlegs found his subtraction slip and <b>rectified</b> it."}, {"word": "convince", "pos": "verb", "emoji": "🤝", "meaning": "To make someone believe that something is true.", "example": "Show the multiplication check to <b>convince</b> me your answer is right."}, {"word": "initiation", "pos": "noun", "emoji": "🎖️", "meaning": "A test or ceremony a person goes through to become a full member of a group.", "example": "In the book, the young Vikings must train a dragon as part of their <b>initiation</b> into the tribe."}, {"word": "conclude", "pos": "verb", "emoji": "🏁", "meaning": "To decide something after thinking about the facts.", "example": "168 × 4 = 672, so I <b>conclude</b> that my answer is right."}], "notes": {"do": "She reads each card and makes her own sentence. Write <b>discrepancy</b> and <b>rectify</b> on the whiteboard.", "say": "\"Today's words are detective words. You will find a discrepancy, rectify it, and convince me you are right.\"", "ask": "\"Why is long division called an algorithm?\" (It is a set of steps that always works.) \"What is Hiccup's initiation?\"", "listen": "<i>Discrepancy</i>: two things that should match but don't. <i>Thorough</i>: every part checked."}}, {"type": "learn", "kick": "Learn", "title": "Is it a division story?", "text": "A story is division when a <b>total</b> is split into <b>equal</b> groups. Then follow these steps.", "steps": [{"text": "<b>Read:</b> Stoick shares <b>456 fish</b> equally among <b>8 dragons</b>. How many fish does each dragon get?"}, {"text": "<b>Decide:</b> a total (456) is split into equal groups (8 dragons). Divide: <b>456 ÷ 8</b>."}, {"text": "<b>Estimate:</b> 8 × 50 = 400 and 8 × 60 = 480. The answer is between 50 and 60."}, {"text": "<b>Solve:</b> 8 does not fit in 4, so start with 45.", "visual": {"kind": "longdiv", "text": "     57\n   ____\n8 ) 456\n   -40\n   ---\n     56\n    -56\n    ---\n      0"}}, {"text": "<b>Check and label:</b> 57 × 8 = 400 + 56 = 456. Each dragon gets <b>57 fish</b>."}], "tip": "If the story puts equal groups together to find a total, that is multiplication, not division.", "notes": {"do": "She solves 456 ÷ 8 on paper before you reveal Step 4.", "say": "Praise each step she does: \"Estimate, yes.\" \"45 first, yes.\"", "ask": "\"What does the 57 count?\" (fish for each dragon.)", "listen": "She labels the answer. A bare 57 is not an answer to a story."}}, {"type": "tap", "kick": "Guided practice", "title": "Divide or multiply?", "items": [{"q": "Stoick has <b>5 ships</b>. Each ship carries <b>128 Vikings</b>. How many Vikings are there in all? Which number sentence solves it?", "choices": ["128 × 5", "128 + 5", "128 − 5", "128 ÷ 5"], "a": 0, "why": "Equal groups put together: multiply. 128 × 5 = 640 Vikings.", "no": [null, "The groups are equal, so adding the two numbers does not work.", "Nothing is taken away in this story, so do not subtract.", "This story puts groups together to find a total, so multiply."]}, {"type": "fill", "q": "The Hooligans pack <b>738 arrows</b> equally into <b>6 barrels</b>. How many arrows go in each barrel?", "answers": ["123", "123 arrows"], "why": "738 ÷ 6 = 123 arrows. Check: 123 × 6 = 738.", "no": "Write the division, then solve it on paper one step at a time.", "hint": "Divide: 738 ÷ 6."}, {"type": "fill", "q": "Hiccup is reading a book with <b>144 pages</b>. He reads <b>8 pages</b> a night. How many nights will it take?", "answers": ["18", "18 nights"], "why": "144 ÷ 8 = 18 nights. Check: 18 × 8 = 144.", "no": "Write the division, then solve it on paper one step at a time.", "hint": "Divide: 144 ÷ 8."}], "notes": {"do": "She says divide or multiply and why BEFORE she solves. Then she solves on paper.", "ask": "\"Is a total being split, or are groups being put together?\"", "listen": "Ships item: \"Groups are put together, so multiply.\" 738 ÷ 6 = 123 arrows. 144 ÷ 8 = 18 nights (8 does not fit in 1, so start with 14)."}}, {"type": "learn", "kick": "Learn", "title": "Find the mistake", "text": "Fishlegs worked out <b>672 ÷ 4</b> and got <b>165 R 2</b>. Be a thorough detective.", "visual": {"kind": "longdiv", "text": "    165 R2\n   ____\n4 ) 672\n   -4\n   --\n    27\n   -24\n   ---\n     22\n    -20\n    ---\n      2"}, "steps": [{"text": "<b>Check by multiplying:</b> 165 × 4 + 2 = 660 + 2 = 662. But the dividend is 672. That is a <b>discrepancy</b>, so there is a mistake."}, {"text": "<b>Go step by step.</b> 6 − 4 = 2 ✔. Bring down 7: 27 ✔. 6 × 4 = 24 ✔. 27 − 24 = 2 ✘. It should be <b>3</b>."}, {"text": "<b>Rectify it:</b> 3, bring down the 2: 32. 32 ÷ 4 = 8. So 672 ÷ 4 = <b>168</b>.", "visual": {"kind": "longdiv", "text": "    168\n   ____\n4 ) 672\n   -4\n   --\n    27\n   -24\n   ---\n     32\n    -32\n    ---\n      0"}}, {"text": "<b>Check again:</b> 168 × 4 = 400 + 240 + 32 = 672 ✔. Now I can conclude it is right."}], "tip": "The check tells you THAT there is a mistake. Going step by step tells you WHERE.", "notes": {"do": "Before Step 2, let her hunt for the mistake on her own. Give her one full minute.", "say": "When she finds it: \"You found it! That is exactly what a thorough mathematician does.\"", "ask": "\"Was the multiplication check enough to find the mistake?\" (No, it shows there IS one. Then you look step by step.)", "listen": "She checks every subtraction out loud, not just the last one."}}, {"type": "tap", "kick": "Guided practice", "title": "Detective work", "items": [{"q": "Snotlout worked out <b>936 ÷ 9</b> and got <b>14</b>. Check: 14 × 9 = 126, not 936. Find the mistake in the work.", "choices": ["The first digit should be 2.", "Nothing is wrong. The answer is accurate.", "A placeholder 0 is missing in the quotient. The answer is 104.", "The first subtraction is wrong."], "a": 2, "why": "A placeholder 0 is missing in the quotient. The answer is 104. Fix it and finish: 936 ÷ 9 = 104. Check: 104 × 9 = 936.", "no": ["2 × 9 = 18. That is too big.", "Check: 14 × 9 = 126, not 936. That discrepancy means there is a mistake.", null, "Check it: that subtraction is correct."], "visual": {"kind": "longdiv", "text": "    14\n   ____\n9 ) 936\n   -9\n   --\n    036\n    -36\n    ---\n      0"}}, {"q": "Hiccup worked out <b>952 ÷ 7</b> and got <b>131 R 5</b>. Check: 131 × 7 + 5 = 922, not 952. Find the mistake in the work.", "choices": ["A placeholder 0 is missing in the quotient.", "He forgot to bring down a digit.", "Nothing is wrong. The answer is accurate.", "The multiplication is wrong: 3 × 7 = 21, not 24."], "a": 3, "why": "The multiplication is wrong: 3 × 7 = 21, not 24. Fix it and finish: 952 ÷ 7 = 136. Check: 136 × 7 = 952.", "no": ["Every place in the quotient has a digit. Check each multiplication.", "Every digit was brought down. Check each multiplication.", "Check: 131 × 7 + 5 = 922, not 952. That discrepancy means there is a mistake.", null], "visual": {"kind": "longdiv", "text": "    131 R5\n   ____\n7 ) 952\n   -7\n   --\n    25\n   -24\n   ---\n     12\n     -7\n     --\n      5"}}], "notes": {"do": "She reads the work out loud line by line and says ✔ or ✘ for each step.", "say": "Praise every correct ✔ she gives, and cheer loudly when she finds the ✘.", "listen": "936 ÷ 9: Snotlout skipped the 0 when 9 did not fit in 3 (answer 104). 952 ÷ 7: 3 × 7 is 21, not 24 (answer 136)."}}, {"type": "learn", "kick": "Learn", "title": "Convince me: check with the area model", "text": "To check a 3-digit quotient, multiply it back. The area model makes it quick. Check <b>942 ÷ 6 = 157</b>:", "visual": {"kind": "area", "b": 6, "split": [100, 50, 7], "show": true}, "tip": "600 + 300 + 42 = 942. It matches the dividend, so the answer is accurate.", "notes": {"do": "She draws the three boxes on the whiteboard herself.", "ask": "\"Why three boxes?\" (157 = 100 + 50 + 7.)", "listen": "She adds the three parts correctly: 600 + 300 = 900, plus 42 = 942."}}, {"type": "tap", "kick": "Guided practice", "title": "Check these", "items": [{"type": "fill", "q": "Convince me: check <b>738 ÷ 6 = 123</b> by multiplying. 123 × 6 = ____", "answers": ["738"], "why": "100 × 6 + 20 × 6 + 3 × 6 = 600 + 120 + 18 = 738. It matches, so 738 ÷ 6 = 123 is accurate.", "no": "Break 123 apart: 100 + 20 + 3. Multiply each part by 6, then add."}, {"type": "fill", "q": "Convince me: check <b>832 ÷ 8 = 104</b> by multiplying. 104 × 8 = ____", "answers": ["832"], "why": "100 × 8 + 4 × 8 = 800 + 32 = 832. It matches, so 832 ÷ 8 = 104 is accurate.", "no": "Break 104 apart: 100 + 4. Multiply each part by 8, then add."}], "notes": {"say": "Praise each box she multiplies correctly.", "listen": "123 × 6 = 600 + 120 + 18 = 738. 104 × 8 = 800 + 32 = 832."}}, {"type": "tap", "kick": "Hands-on", "title": "Word problem relay", "text": "Pick an index card. Read it out loud. Decide, estimate, solve on paper, check, and label. Then type the answer.", "items": [{"type": "fill", "q": "Gobber stacks <b>630 shields</b> in equal piles of <b>3</b>. How many piles?", "answers": ["210", "210 piles"], "why": "630 ÷ 3 = 210 piles. Check: 210 × 3 = 630.", "no": "Write the division, then solve it on paper one step at a time.", "hint": "Divide: 630 ÷ 3."}, {"type": "fill", "q": "<b>612 eggs</b> are shared equally among <b>6 dragon nests</b>. How many eggs are in each nest?", "answers": ["102", "102 eggs"], "why": "612 ÷ 6 = 102 eggs. Check: 102 × 6 = 612.", "no": "Write the division, then solve it on paper one step at a time.", "hint": "Divide: 612 ÷ 6."}, {"type": "fill", "q": "Toothless eats <b>7 fish</b> a day. How many days will <b>336 fish</b> last?", "answers": ["48", "48 days"], "why": "336 ÷ 7 = 48 days. Check: 48 × 7 = 336.", "no": "Write the division, then solve it on paper one step at a time.", "hint": "Divide: 336 ÷ 7."}], "notes": {"do": "The three stories are on index cards, face down. She picks one at a time and does the whole routine at the whiteboard.", "say": "Praise each part of the routine as she does it: \"Decided, yes. Estimated, yes. Checked, yes!\"", "listen": "630 ÷ 3 = 210 piles (the last 0 must be written). 612 ÷ 6 = 102 eggs (placeholder 0). 336 ÷ 7 = 48 days (7 does not fit in 3)."}}, {"type": "order", "kick": "Put in order", "title": "How to find a mistake", "text": "Tap the steps in the order a thorough detective uses them.", "steps": ["Check the answer by multiplying.", "Notice the discrepancy: it does not match the dividend.", "Go back to the first step of the work.", "Check each divide, multiply, subtract and bring down.", "Rectify the wrong step and finish the problem.", "Check again and conclude."], "why": "Check, notice, go back, look step by step, rectify, check again.", "hint": "You cannot know there is a mistake until you check. What comes first?", "notes": {"do": "She says the steps from memory before tapping.", "listen": "Check first, rectify near the end, check again last."}}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"q": "Fishlegs's answer was 165 R 2, but the check gave 662 instead of 672. What is the difference between 662 and 672 called?", "choices": ["an algorithm", "a discrepancy", "an initiation", "a quotient"], "a": 1, "why": "A <i>discrepancy</i> is a difference between two things that should match.", "no": ["An algorithm is a set of steps.", null, "An initiation is a test to join a group.", "The quotient is the answer to a division."]}, {"type": "fill", "q": "Fishlegs found his mistake and fixed it. He ____ it. (Use a word from your word cards that means <i>fixed</i>. Add -ed.)", "answers": ["rectified"], "why": "To <i>rectify</i> is to fix a mistake. He rectified it.", "no": "It starts with rect- and ends with -ified."}, {"q": "Which is a <b>thorough</b> check?", "choices": ["Looking only at the final answer", "Guessing that it looks right", "Checking every step and then multiplying back", "Asking Snotlout"], "a": 2, "why": "<i>Thorough</i> means careful and complete, checking every part.", "no": ["That skips the steps.", "Guessing is not checking.", null, "Asking someone else is not checking it yourself."]}], "notes": {"ask": "\"Use <i>convince</i> in a sentence about your math.\" \"Use <i>conclude</i> in a sentence about the book.\"", "listen": "She uses each word correctly in her own sentence."}}, {"type": "tap", "kick": "Exit ticket", "title": "Show me before you go", "text": "On your own. No help this time.", "items": [{"type": "fill", "q": "Use long division: <b>864 ÷ 6</b> = ____", "answers": ["144"], "why": "864 ÷ 6 = 144. Check: 144 × 6 = 864.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 6s fit in 8?", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 864"}}, {"type": "fill", "q": "Stoick shares <b>282 apples</b> equally among <b>6 barrels</b>. How many apples go in each barrel?", "answers": ["47", "47 apples"], "why": "282 ÷ 6 = 47 apples. Check: 47 × 6 = 282.", "no": "Write the division, then solve it on paper one step at a time.", "hint": "Divide: 282 ÷ 6."}, {"q": "Snotlout worked out <b>728 ÷ 7</b> and got <b>14</b>. Check: 14 × 7 = 98, not 728. Find the mistake in the work.", "choices": ["Nothing is wrong. The answer is accurate.", "A placeholder 0 is missing in the quotient. The answer is 104.", "The first subtraction is wrong.", "The first digit should be 2."], "a": 1, "why": "A placeholder 0 is missing in the quotient. The answer is 104. Fix it and finish: 728 ÷ 7 = 104. Check: 104 × 7 = 728.", "no": ["Check: 14 × 7 = 98, not 728. That discrepancy means there is a mistake.", null, "Check it: that subtraction is correct.", "2 × 7 = 14. That is too big."], "visual": {"kind": "longdiv", "text": "    14\n   ____\n7 ) 728\n   -7\n   --\n    028\n    -28\n    ---\n      0"}}], "notes": {"do": "She works alone on paper. Note any miss: it tells you what to warm up with on Monday.", "listen": "864 ÷ 6 = 144; 282 ÷ 6 = 47 apples; 728 ÷ 7: the placeholder 0 is missing (104)."}}, {"type": "learn", "kick": "Wrap-up", "title": "Your weekend plan", "text": "You proved it: you can do the long division algorithm, use it in word problems, and find other people's mistakes.", "steps": [{"text": "<b>Tonight:</b> the After-class lesson. It ends with Show What You Know. You need 90."}, {"text": "<b>Friday:</b> the Lesson 15 Practice and page 2 of the Lesson 14 Packet."}, {"text": "<b>Saturday:</b> the Lesson 15 Packet, then Long Division Lane, Lessons 1 and 2."}, {"text": "<b>Sunday:</b> Long Division Lane, Lesson 4, and the reading lesson. <b>Every day:</b> read 15 minutes."}], "tip": "Monday is about remainders: what happens when the last subtraction is not 0.", "notes": {"do": "Open the course page and go through the Lesson 15 task list and the three Long Division Lane links with her (and with Tia if she is there).", "say": "\"You were a thorough detective today. Monday we find out what happens when division does not come out even.\"", "ask": "\"What will you do first tonight?\""}}], "win": "Long division detective: you solved it, checked it, and caught every mistake!", "prev": "bb-bailey-L14", "prevTitle": "Lesson 14"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
