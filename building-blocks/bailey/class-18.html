<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 18: Prove It: Remainders and Checking</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L18", "label": "Lesson 18", "title": "Prove It: Remainders and Checking", "goal": "I can divide with remainders, check my answer two ways, find mistakes, and decide what a remainder means in a story.", "date": "2026-12-17", "mastery": 90, "color": "#00A8A8", "slides": [{"type": "hello", "title": "Prove It: Remainders and Checking", "text": "This week you found remainders, checked them, and decided what they mean in a story. Today you <b>prove it</b>, right before the break. You are becoming a seasoned long divider!", "visual": {"kind": "emoji", "text": "🏆➗🎉"}, "notes": {"do": "Set out: whiteboard and marker, paper and pencil, 40 dried beans and 6 cups, 3 sticky notes (Round up, Drop it, Remainder is the answer), her book.", "say": "\"Last lesson before the break. No new idea today, just showing everything you accomplished this month.\"", "ask": "\"How did Tuesday's Show What You Know go? Did the Lesson 16 packet feel easy or hard?\" (Check her scores and the packet before class.)"}}, {"type": "talk", "kick": "Book Talk", "title": "Before the break", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["Where are you in the book? Tell the most important thing that happened this week.", "How has Hiccup's relationship with Toothless changed since the start of the book? Give two events as proof.", "Predict what will happen next. What clue from the book makes you think so?"], "starters": ["The most important thing this week was …", "At first … but now … For example, …", "I predict … because …"], "notes": {"do": "7 minutes. This is the last book talk before the break, so ask her how far she plans to read before Lesson 19.", "ask": "\"Give me two events that show how they changed.\"", "listen": "Two real events in order, and a prediction backed by a clue."}}, {"type": "recall", "kick": "Warm-up", "title": "This week so far", "items": [{"type": "fill", "q": "<b>53 Vikings</b> sail. Each boat holds <b>6</b>. How many boats are needed?", "answers": ["9", "nine", "9 boats"], "why": "53 ÷ 6 = 8 R 5. 8 is not enough: 5 would be left out. Round up: <b>9 boats</b>.", "no": "Divide first: 53 ÷ 6. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"type": "fill", "q": "Check <b>79 ÷ 6 = 13 R 1</b>: &nbsp; 13 × 6 + 1 = ____", "answers": ["79"], "why": "13 × 6 = 78, and 78 + 1 = 79. It matches the dividend, so the answer is right.", "no": "Multiply 13 × 6 first. Then add the remainder 1."}], "notes": {"do": "She types the answers herself.", "listen": "53 ÷ 6 = 8 R 5 → 9 boats. Check 13 × 6 + 1 = 79."}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read it out loud. Then use it in your own sentence.", "words": [{"word": "expression", "pos": "noun", "emoji": "🧮", "meaning": "In math, numbers and operation signs written together, like 24 × 4 + 1.", "example": "The check for 97 ÷ 4 = 24 R 1 is the <b>expression</b> 24 × 4 + 1."}, {"word": "retrace", "pos": "verb", "emoji": "↩️", "meaning": "To go back over the same steps again.", "example": "When the check does not match, <b>retrace</b> your steps to find the mistake."}, {"word": "diligent", "pos": "adjective", "emoji": "🐝", "meaning": "Working hard and carefully.", "example": "A <b>diligent</b> student checks every remainder."}, {"word": "accomplish", "pos": "verb", "emoji": "🏆", "meaning": "To finish something successfully.", "example": "This month you <b>accomplished</b> long division with remainders."}, {"word": "festive", "pos": "adjective", "emoji": "🎉", "meaning": "Cheerful and full of celebration, like a holiday.", "example": "The house looks <b>festive</b> with lights for the holidays."}, {"word": "momentum", "pos": "noun", "emoji": "🚀", "meaning": "The energy that keeps something moving forward.", "example": "A little practice each week keeps your <b>momentum</b> going over the break."}, {"word": "seasoned", "pos": "adjective", "emoji": "🧭", "meaning": "Having lots of practice and experience.", "example": "Gobber is a <b>seasoned</b> Viking who trains the young Vikings."}], "notes": {"do": "She reads each card and makes her own sentence. Write <b>expression</b> and <b>retrace</b> on the whiteboard.", "say": "\"Two math words, expression and retrace, and five words about you: diligent, accomplish, momentum, seasoned, and festive for the holidays.\"", "ask": "\"What have you accomplished this month?\" \"How will you keep your momentum over the break?\"", "listen": "<i>Expression</i> here is the math meaning: numbers and signs, like 24 × 4 + 1."}}, {"type": "learn", "kick": "You lead", "title": "817 ÷ 4: a zero and a remainder", "text": "Say each step before you click. This one has a placeholder zero <b>and</b> a remainder.", "visual": {"kind": "longdiv", "text": "\n   ____\n4 ) 817"}, "steps": [{"text": "<b>Divide.</b> How many 4s fit in 8? <b>2</b> (4 × 2 = 8). Write 2 above the 8 in the hundreds place."}, {"text": "<b>Multiply.</b> 2 × 4 = 8. Write 8 under the 8."}, {"text": "<b>Subtract.</b> 8 − 8 = 0. Check: 0 is smaller than 4.", "visual": {"kind": "longdiv", "text": "    2\n   ____\n4 ) 817\n   -8\n   --\n    0"}}, {"text": "<b>Bring down.</b> Bring down the 1 from the tens place. The 0 and the 1 make 01, which is just <b>1</b>."}, {"text": "<b>Divide.</b> How many 4s fit in 1? <b>0</b>. Write 0 above the 1 in the tens place. Never skip the zero!"}, {"text": "<b>Multiply.</b> 0 × 4 = 0. Write 0 under the 1."}, {"text": "<b>Subtract.</b> 1 − 0 = 1. Check: 1 is smaller than 4.", "visual": {"kind": "longdiv", "text": "    20\n   ____\n4 ) 817\n   -8\n   --\n    01\n    -0\n    --\n     1"}}, {"text": "<b>Bring down.</b> Bring down the 7 from the ones place. Now you have <b>17</b>."}, {"text": "<b>Divide.</b> How many 4s fit in 17? <b>4</b> (4 × 4 = 16; 4 × 5 = 20 is too big). Write 4 above the 7 in the ones place."}, {"text": "<b>Multiply.</b> 4 × 4 = 16. Write 16 under the 17."}, {"text": "<b>Subtract.</b> 17 − 16 = 1. Check: 1 is smaller than 4. There are no more digits to bring down, so <b>817 ÷ 4 = 204</b> R 1.", "visual": {"kind": "longdiv", "text": "    204 R1\n   ____\n4 ) 817\n   -8\n   --\n    01\n    -0\n    --\n     17\n    -16\n    ---\n      1"}}, {"text": "<b>Check:</b> 204 × 4 + 1 = 816 + 1 = 817 ✔"}], "notes": {"do": "She says each step and number BEFORE you click; she writes it on paper.", "say": "Praise every correct step out loud: \"Divide, 2. Yes!\" \"Zero, you were vigilant!\" \"R 1, and 1 is smaller than 4. Perfect.\"", "listen": "The 0 in the tens place and the final remainder. If she skips the 0, ask: \"Estimate first: about 20 or about 200?\""}}, {"type": "tap", "kick": "Guided practice", "title": "Your turn on paper", "text": "Solve on paper. Say each step. Type the answer with R.", "items": [{"type": "fill", "q": "Use long division: <b>94 ÷ 4</b> = ____ &nbsp; (use R for the remainder)", "answers": ["23 R 2", "23R2", "23 r 2", "23 remainder 2", "23 rem 2", "23 r2"], "why": "94 ÷ 4 = 23 R 2. Check: 23 × 4 + 2 = 94.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 4s fit in 9?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n4 ) 94"}}, {"type": "fill", "q": "Use long division: <b>925 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["154 R 1", "154R1", "154 r 1", "154 remainder 1", "154 rem 1", "154 r1"], "why": "925 ÷ 6 = 154 R 1. Check: 154 × 6 + 1 = 925.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 6s fit in 9?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 925"}}, {"type": "fill", "q": "Use long division: <b>437 ÷ 7</b> = ____ &nbsp; (use R for the remainder)", "answers": ["62 R 3", "62R3", "62 r 3", "62 remainder 3", "62 rem 3", "62 r3"], "why": "437 ÷ 7 = 62 R 3. Check: 62 × 7 + 3 = 437.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: 7 does not fit in 4, so start with 43.", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n7 ) 437"}}], "notes": {"do": "She leads all three.", "say": "Praise each step she gets right.", "listen": "94 ÷ 4 = 23 R 2; 925 ÷ 6 = 154 R 1; 437 ÷ 7 = 62 R 3 (7 does not fit in 4)."}}, {"type": "learn", "kick": "Learn", "title": "Retrace your steps", "text": "Fishlegs worked out <b>853 ÷ 6</b> and got <b>141 R 7</b>. His check works: 141 × 6 + 7 = 853. So is he right?", "visual": {"kind": "longdiv", "text": "    141 R7\n   ____\n6 ) 853\n   -6\n   --\n    25\n   -24\n   ---\n     13\n     -6\n     --\n      7"}, "steps": [{"text": "Look at the remainder: <b>7</b>. The divisor is <b>6</b>. 7 is not smaller than 6, so one more 6 fits."}, {"text": "Retrace the last step: 13 ÷ 6. 6 × 2 = 12 fits, so the digit is <b>2</b>, not 1. 13 − 12 = 1."}, {"text": "Fixed: <b>853 ÷ 6 = 142 R 1</b>. Check: 142 × 6 + 1 = 852 + 1 = 853 ✔ and 1 is smaller than 6 ✔"}], "tip": "A good check has two parts: the expression matches the dividend AND the remainder is smaller than the divisor.", "notes": {"do": "Let her find the problem before you reveal Step 1. Give her a full minute.", "say": "When she finds it: \"Diligent! The check alone did not catch it, but you did.\"", "ask": "\"Why did the multiplication check still work?\" (141 × 6 + 7 is the same total; it just has an extra 6 hiding in the remainder.)", "listen": "She checks BOTH parts: the expression and the remainder rule."}}, {"type": "tap", "kick": "Guided practice", "title": "Detective work", "items": [{"q": "Snotlout worked out <b>817 ÷ 4</b> and got <b>24 R 1</b>. Check: 24 × 4 + 1 = 97, not 817. Find the mistake in the work.", "choices": ["The first digit should be 3.", "Nothing is wrong. The answer is accurate.", "A placeholder 0 is missing in the quotient. The answer is 204 R 1.", "The first subtraction is wrong."], "a": 2, "why": "A placeholder 0 is missing in the quotient. The answer is 204 R 1. Fix it and finish: 817 ÷ 4 = 204 R 1. Check: 204 × 4 + 1 = 817.", "no": ["3 × 4 = 12. That is too big.", "Check: 24 × 4 + 1 = 97, not 817. That discrepancy means there is a mistake.", null, "Check it: that subtraction is correct."], "visual": {"kind": "longdiv", "text": "    24 R1\n   ____\n4 ) 817\n   -8\n   --\n    017\n    -16\n    ---\n      1"}}, {"q": "Hiccup worked out <b>758 ÷ 5</b> and got <b>159 R 3</b>. Check: 159 × 5 + 3 = 798, not 758. Find the mistake in the work.", "choices": ["The subtraction is wrong: 25 − 25 = 0, not 4.", "A placeholder 0 is missing in the quotient.", "The first digit should be 2.", "Nothing is wrong. The answer is accurate."], "a": 0, "why": "The subtraction is wrong: 25 − 25 = 0, not 4. Fix it and finish: 758 ÷ 5 = 151 R 3. Check: 151 × 5 + 3 = 758.", "no": [null, "Look at the quotient: every place has a digit. Look at the subtractions instead.", "2 × 5 = 10. That is too big.", "Check: 159 × 5 + 3 = 798, not 758. That discrepancy means there is a mistake."], "visual": {"kind": "longdiv", "text": "    159 R3\n   ____\n5 ) 758\n   -5\n   --\n    25\n   -25\n   ---\n     48\n    -45\n    ---\n      3"}}], "notes": {"do": "She reads the work out loud line by line and says ✔ or ✘ for each step.", "say": "Cheer when she finds each ✘.", "listen": "Snotlout omitted the placeholder 0 (204 R 1). Hiccup: 25 − 25 = 0, not 4 (758 ÷ 5 = 151 R 3)."}}, {"type": "learn", "kick": "Learn", "title": "The check is an expression", "text": "Write the check as one <b>expression</b>: quotient × divisor + remainder. Multiply first, then add.", "visual": {"kind": "bigtext", "text": "154 × 6 + 1", "sub": "= 924 + 1 = 925 ✔"}, "tip": "Multiply before you add. 154 × 6 + 1 is not 154 × 7.", "notes": {"ask": "\"What would happen if you added first: 6 + 1 = 7, then 154 × 7?\" (1,078. Wrong. Multiply first.)", "listen": "Multiply, then add the remainder."}}, {"type": "tap", "kick": "Guided practice", "title": "Check it", "items": [{"type": "fill", "q": "Check <b>437 ÷ 7 = 62 R 3</b>: &nbsp; 62 × 7 + 3 = ____", "answers": ["437"], "why": "62 × 7 = 434, and 434 + 3 = 437. It matches the dividend, so the answer is right.", "no": "Multiply 62 × 7 first. Then add the remainder 3."}, {"type": "fill", "q": "You divide by <b>9</b>. Your remainder is <b>9</b>. What should you do? Type <b>revise</b> or <b>keep</b>.", "answers": ["revise"], "why": "9 is not smaller than 9, so one more group fits. Revise the quotient.", "no": "Is 9 smaller than 9?"}], "notes": {"listen": "62 × 7 + 3 = 434 + 3 = 437. For the second: revise."}}, {"type": "tap", "kick": "Hands-on", "title": "Remainder story relay", "text": "Solve on paper. Point to the sticky note that fits. Then type the answer.", "items": [{"type": "fill", "q": "<b>40 Vikings</b> sit at tables of <b>6</b>. How many tables are needed?", "answers": ["7", "seven", "7 tables"], "why": "40 ÷ 6 = 6 R 4. 6 is not enough: 4 would be left out. Round up: <b>7 tables</b>.", "no": "Divide first: 40 ÷ 6. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"type": "fill", "q": "A barrel holds <b>8</b> fish. How many barrels can be filled with <b>165 fish</b>?", "answers": ["20", "20 barrels"], "why": "165 ÷ 8 = 20 R 5. Only 20 are full; the 5 left over cannot make another one. Drop the remainder: <b>20 barrels</b>.", "no": "Divide first: 165 ÷ 8. Then read the question again: what does it ask for?", "hint": "Can the leftover make a full one? If not, do not count it."}, {"type": "fill", "q": "Stoick shares <b>230 coins</b> equally among <b>7</b> warriors and keeps the rest. How many coins does he keep?", "answers": ["6", "six", "6 coins"], "why": "230 ÷ 7 = 32 R 6. The question asks what is left over, so the answer is the remainder: <b>6 coins</b>.", "no": "Divide first: 230 ÷ 7. Then read the question again: what does it ask for?", "hint": "The question asks how many are LEFT. Which part of the answer is that?"}], "notes": {"do": "For the first story she acts it out: 40 beans in cups of 6 (6 full cups, 4 beans left, one more cup needed).", "say": "Praise the long division and the decision separately.", "listen": "7 tables; 165 ÷ 8 = 20 R 5 → 20 barrels (watch the 0 in the ones place); 230 ÷ 7 = 32 R 6 → 6 coins."}}, {"type": "order", "kick": "Put in order", "title": "The whole routine", "text": "Tap the steps in the order a seasoned mathematician uses them for a story problem.", "steps": ["Read the story and write the division.", "Estimate the answer.", "Solve with long division.", "Check: the expression matches and the remainder is smaller than the divisor.", "Read the question again and decide what to do with the remainder.", "Write the answer with a label."], "why": "Read, estimate, solve, check, decide, label.", "hint": "You check your long division before you decide what the remainder means.", "notes": {"do": "She says all six from memory before tapping.", "listen": "Estimate before solving; check before deciding."}}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"q": "Bailey worked hard and carefully on every problem this month. Which word describes her?", "choices": ["festive", "diligent", "stubborn", "expression"], "a": 1, "why": "<i>Diligent</i> means working hard and carefully.", "no": ["Festive means full of celebration.", null, "Stubborn means not willing to change your mind.", "An expression is numbers and signs."]}, {"type": "fill", "q": "When the check does not match, go back over your steps. ____ them. (Use a word from your word cards.)", "answers": ["retrace"], "why": "To <i>retrace</i> is to go back over the same steps.", "no": "It starts with re-."}, {"q": "Which is an <b>expression</b>?", "choices": ["Hiccup", "62 × 7 + 3", "remainder", "the break"], "a": 1, "why": "An <i>expression</i> is numbers and operation signs written together.", "no": ["That is a name.", null, "That is a math word, not numbers and signs.", "That is a time of year."]}], "notes": {"ask": "\"Use <i>momentum</i> in a sentence about the break.\" \"Use <i>festive</i> in a sentence about your home.\"", "listen": "She uses each word correctly in her own sentence."}}, {"type": "tap", "kick": "Exit ticket", "title": "Show me before you go", "text": "On your own. No help this time.", "items": [{"type": "fill", "q": "Use long division: <b>719 ÷ 3</b> = ____ &nbsp; (use R for the remainder)", "answers": ["239 R 2", "239R2", "239 r 2", "239 remainder 2", "239 rem 2", "239 r2"], "why": "719 ÷ 3 = 239 R 2. Check: 239 × 3 + 2 = 719.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 3s fit in 7?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n3 ) 719"}}, {"type": "fill", "q": "Check <b>653 ÷ 4 = 163 R 1</b>: &nbsp; 163 × 4 + 1 = ____", "answers": ["653"], "why": "163 × 4 = 652, and 652 + 1 = 653. It matches the dividend, so the answer is right.", "no": "Multiply 163 × 4 first. Then add the remainder 1."}, {"type": "fill", "q": "<b>75 eggs</b> go in cartons of <b>6</b>. How many cartons are needed to hold all of them?", "answers": ["13", "13 cartons"], "why": "75 ÷ 6 = 12 R 3. 12 is not enough: 3 would be left out. Round up: <b>13 cartons</b>.", "no": "Divide first: 75 ÷ 6. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}], "notes": {"do": "She works alone on paper and types each answer. Note any miss for the first January lesson.", "listen": "719 ÷ 3 = 239 R 2; check 653; 75 ÷ 6 = 12 R 3 → 13 cartons."}}, {"type": "learn", "kick": "Wrap-up", "title": "Your break plan", "text": "You accomplished long division this month: 2 and 3 digits, zeros, remainders, checking, and stories. Next is <b>Lesson 19</b> after the break. The <b>Holiday Gazette</b> family project comes first; your math list is light.", "steps": [{"text": "<b>First week of the break:</b> the After-class lesson (ends with Show What You Know), the Lesson 18 Practice, page 2 of the Lesson 17 Packet, a Reading Power lesson, and Long Division Lane, Lesson 3."}, {"text": "<b>Second week of the break:</b> the Lesson 18 Packet, a Pathways reading lesson, and Long Division Lane, Lesson 6."}, {"text": "<b>Every week:</b> read 15 minutes a day."}], "tip": "A little each week keeps your momentum. Enjoy the holidays!", "notes": {"do": "Open the course page and go through the Lesson 18 task list and the two Long Division Lane links with her (and with Tia if she is there). Point out the Holiday Gazette card too.", "say": "\"Look at everything you accomplished. In October you added the same number over and over. Now you do long division with remainders. Proud of you.\"", "ask": "\"What will you do first in the first week of the break?\""}}], "win": "You accomplished long division with remainders. Enjoy a festive break!", "prev": "bb-bailey-L17", "prevTitle": "Lesson 17"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
