<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 7: Bigger Boxes: Estimate, Then Multiply</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L07", "label": "Lesson 7", "title": "Bigger Boxes: Estimate, Then Multiply", "goal": "I can estimate first, then use an area model for bigger numbers like 247 × 6 and 23 × 14.", "date": "2026-11-03", "mastery": 90, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Bigger Boxes", "text": "Yesterday you split 75 × 8 into two boxes. Today the boxes grow: <b>three boxes</b> for 3-digit numbers and <b>four boxes</b> for 23 × 14. But first, a smart guess.", "visual": {"kind": "emoji", "text": "🎯🟪🟪🟪🟪"}, "notes": {"do": "Before class, look up her Lesson 6 score from last night's After-Class Lesson (Formspree). Lay out grid paper, scissors, 2 colored pencils, base-ten blocks (if you have them), whiteboard and her book.", "say": "Yesterday you beat 75 × 8 with two boxes. Today the numbers get bigger, so the boxes grow. And before we multiply, we make a smart guess.", "ask": "How did Show What You Know go last night? Which question was the hardest?", "listen": "If she scored under 90, plan to use the warm-up (slide 4) as a mini re-teach and have her retake Lesson 6 tonight (she gets a new question set)."}}, {"type": "talk", "kick": "Book Talk", "title": "Guessing what comes next", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What has happened since the last time we talked about the book?", "Pick a character. Is that character crafty, fearsome, or neither? Prove it with something the character did.", "Hiccup often has to guess what a dragon will do before it does it. Why does a good guess help him?"], "starters": ["Since last time, …", "I think … is crafty because …", "A good guess helps because …"], "notes": {"do": "5–6 minutes. Let her talk; tap the gold star for a detailed answer with proof from the book.", "ask": "Is that character crafty or fearsome? What did they do that proves it? Why does a good guess help Hiccup?", "listen": "Strong answers name an action from the book as proof. For prompt 3 listen for 'so he is ready' or 'so he is not surprised': that is exactly why we estimate before we multiply."}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read the word, the meaning and the example out loud.", "words": [{"word": "estimate", "pos": "noun or verb", "meaning": "A smart guess that is close to the real answer. To estimate is to make that guess.", "example": "My <b>estimate</b> for 247 × 6 is between 1,200 and 1,800.", "emoji": "🎯"}, {"word": "approximately", "pos": "adverb", "meaning": "Close to, but maybe not exactly.", "example": "There are <b>approximately</b> 300 sheep on Berk, give or take a few.", "emoji": "≈"}, {"word": "reasonable", "pos": "adjective", "meaning": "Makes sense when you think it through.", "example": "1,482 is a <b>reasonable</b> answer for 247 × 6 because it fits my estimate.", "emoji": "🤔"}, {"word": "gauge", "pos": "verb", "meaning": "To judge how big, how much or how good something is.", "example": "Hiccup tried to <b>gauge</b> how angry the dragon was.", "emoji": "🌡️"}, {"word": "meticulous", "pos": "adjective", "meaning": "Very careful about every small detail.", "example": "A <b>meticulous</b> mathematician checks all four boxes.", "emoji": "🔍"}, {"word": "fearsome", "pos": "adjective", "meaning": "Frightening to look at or to face.", "example": "The Vikings banged their shields to look <b>fearsome</b>.", "emoji": "😱"}, {"word": "crafty", "pos": "adjective", "meaning": "Clever in a sneaky, tricky way.", "example": "The <b>crafty</b> dragon pretended to sleep, then grabbed the fish.", "emoji": "🦊"}], "notes": {"do": "She flips all 7 cards and reads them aloud. She acts out <b>fearsome</b> (a fearsome face) and <b>crafty</b> (a sneaky move).", "say": "Three of these words are about checking your math: estimate, approximately, reasonable. One is about being careful: meticulous.", "ask": "What is the difference between an estimate and the exact answer? Give me a sentence with <b>approximately</b>.", "listen": "An estimate is a close, smart guess; the exact answer is the real one. 'Approximately' needs an amount after it (approximately 300 sheep)."}}, {"type": "tap", "kick": "Warm-up", "title": "Two boxes from yesterday", "text": "Whiteboard first, then type.", "items": [{"type": "fill", "q": "Use two boxes. <b>93 × 7 = ____</b>", "answers": ["651"], "why": "90 × 7 = 630 and 3 × 7 = 21. 630 + 21 = <b>651</b>.", "no": "Split 93 into 90 + 3. Multiply each part by 7.", "hint": "90 × 7: 9 tens × 7 = 63 tens."}], "notes": {"do": "She draws the two-box model on the whiteboard and writes both partial products inside the boxes before typing.", "ask": "What are the two boxes? Which facts do you need?", "listen": "90 and 3; 630 and 21; 651. If she writes 63 + 21 = 84, she lost the zero: say '9 tens times 7 is 63 tens' and let her fix it."}}, {"type": "learn", "kick": "Learn", "title": "Estimate first", "text": "Before you multiply, <b>estimate</b>. It tells you about how big the answer should be.", "steps": [{"text": "<b>247 × 6</b>. 247 is between <b>200</b> and <b>300</b>."}, {"text": "200 × 6 = <b>1,200</b> and 300 × 6 = <b>1,800</b>. (2 × 6 = 12 and 3 × 6 = 18, then two zeros.)"}, {"text": "So 247 × 6 is <b>between 1,200 and 1,800</b>. That is your estimate.", "visual": {"kind": "bigtext", "text": "1,200 &lt; 247 × 6 &lt; 1,800"}}, {"text": "If you get 148 or 14,820, the answer is <b>not reasonable</b>. Your estimate catches the mistake."}], "tip": "Round the big number down and up to whole hundreds. The real answer lands in between.", "notes": {"do": "Click the steps one at a time. Write on the whiteboard: 200 &lt; 247 &lt; 300, then 1,200 &lt; 247 × 6 &lt; 1,800.", "say": "An estimate tells you about how big the answer should be. If your final answer is outside your estimate, a box went wrong.", "ask": "Why do we round 247 down to 200 AND up to 300? What is 2 hundreds × 6?", "listen": "12 hundreds = 1,200. If she says 120, say it in words: 2 hundreds times 6 is 12 hundreds."}}, {"type": "tap", "kick": "Try it", "title": "Make an estimate", "items": [{"q": "Which estimate fits <b>382 × 7</b>?", "choices": ["between 2,100 and 2,800", "between 210 and 280", "between 21,000 and 28,000", "between 380 and 390"], "a": 0, "why": "300 × 7 = 2,100 and 400 × 7 = 2,800.", "no": [null, "300 × 7 is 3 hundreds × 7 = 21 hundreds = 2,100, not 210.", "Too many zeros. 300 × 7 has two zeros: 2,100.", "That is about 382 itself. Multiplying by 7 makes it much bigger."]}, {"type": "fill", "q": "Fishlegs says <b>512 × 8 = 496</b>. Is that reasonable? Use an estimate, then type <b>reasonable</b> or <b>not reasonable</b>.", "answers": ["not reasonable", "unreasonable", "no", "not"], "why": "500 × 8 = 4,000, so the answer must be about 4,000. 496 is far too small: <b>not reasonable</b>.", "no": "Estimate first: what is 500 × 8?", "hint": "5 × 8 = 40, so 500 × 8 = 4,000. Is 496 close to that?"}, {"q": "Which product is <b>approximately</b> 3,600?", "choices": ["59 × 6", "590 × 6", "590 × 9"], "a": 1, "why": "590 is close to 600, and 600 × 6 = 3,600.", "no": ["59 × 6 is about 60 × 6 = 360. That is ten times too small.", null, "590 × 9 is about 600 × 9 = 5,400."]}], "notes": {"do": "She says the estimate out loud before each answer.", "ask": "What do you round 382 to, down and up? Is 496 anywhere near 500 × 8?", "listen": "300 and 400, so 2,100 to 2,800. For Fishlegs: 500 × 8 = 4,000, so 496 is not reasonable. Multiplying by 8 should make 512 bigger, not smaller."}}, {"type": "learn", "kick": "Learn", "title": "Three boxes for 3 digits", "text": "<b>247 × 6</b>. Write 247 in expanded form: <b>200 + 40 + 7</b>. Now you need three boxes.", "steps": [{"text": "Draw a rectangle with a <b>200</b> box, a <b>40</b> box and a <b>7</b> box. The other side is <b>6</b>.", "visual": {"kind": "area", "b": 6, "split": [200, 40, 7], "show": false}}, {"text": "Multiply each box: 200 × 6 = 1,200, 40 × 6 = 240, 7 × 6 = 42.", "visual": {"kind": "area", "b": 6, "split": [200, 40, 7], "show": true}}, {"text": "Add the partial products: 1,200 + 240 + 42 = <b>1,482</b>."}, {"text": "Check: 1,482 is between 1,200 and 1,800. It is <b>reasonable</b>. ✅"}], "tip": "One box for each place: hundreds, tens and ones.", "notes": {"do": "Click the steps. She draws a rectangle with three boxes (200, 40, 7) and side 6 on grid paper and writes the partial products inside.", "say": "One box for each place: hundreds, tens and ones. Three digits means three boxes.", "ask": "How many boxes will 368 × 7 need? Why? Does 1,482 fit our estimate?", "listen": "Three boxes, one for each place. Yes: 1,482 is between 1,200 and 1,800."}}, {"type": "learn", "kick": "Hands-on", "title": "Build 247 six times", "text": "Build <b>247</b> with base-ten blocks: 2 hundreds, 4 tens, 7 ones. Now make <b>6</b> of them.", "visual": {"kind": "placevalue", "n": 247}, "steps": [{"text": "6 groups of <b>2 hundreds</b> = 12 hundreds = <b>1,200</b>."}, {"text": "6 groups of <b>4 tens</b> = 24 tens = <b>240</b>."}, {"text": "6 groups of <b>7 ones</b> = <b>42</b>."}, {"text": "Push it all together: 1,200 + 240 + 42 = <b>1,482</b>. Same as the three boxes!", "visual": {"kind": "area", "b": 6, "split": [200, 40, 7], "show": true}}], "tip": "Each box in the area model is one kind of block: hundreds, tens or ones.", "notes": {"do": "If you have base-ten blocks, she builds 247 once, then you both build 5 more. She sorts all the flats, rods and cubes into three piles. No blocks? She draws 6 quick sketches (squares for hundreds, sticks for tens, dots for ones).", "say": "Look: all the hundreds together are the 200 box. All the tens are the 40 box. All the ones are the 7 box.", "ask": "How many hundreds flats do you have in all? How many tens rods? How many ones?", "listen": "12 flats, 24 rods, 42 ones. When she sees 24 rods, ask: how much is 24 tens? (240)."}}, {"type": "tap", "kick": "Try it", "title": "Fill the boxes: 368 × 7", "items": [{"q": "This is the area model for <b>368 × 7</b>. What goes in the <b>300</b> box?", "visual": {"kind": "area", "b": 7, "split": [300, 60, 8], "show": false}, "choices": ["210", "2,100", "21,000", "307"], "a": 1, "why": "3 × 7 = 21, so 300 × 7 = <b>2,100</b>.", "no": ["300 is 3 <b>hundreds</b>. 3 × 7 = 21 hundreds = 2,100.", null, "Too many zeros. 300 has two zeros, so 21 gets two zeros.", "Multiply the box, don't add."]}, {"q": "The partial products for <b>368 × 7</b> are 2,100, 420 and 56. What is 368 × 7?", "choices": ["2,576", "2,566", "2,520"], "a": 0, "why": "2,100 + 420 + 56 = <b>2,576</b>.", "no": [null, "Add the tens again: 2 tens + 5 tens = 7 tens, so 420 + 56 = 476, and 2,100 + 476 = 2,576.", "You left out the 56 from the ones box."]}, {"type": "fill", "q": "Is 2,576 reasonable for 368 × 7? Finish the estimate: 300 × 7 = 2,100 and 400 × 7 = <b>____</b>.", "answers": ["2800"], "why": "4 × 7 = 28, so 400 × 7 = <b>2,800</b>. 2,576 is between 2,100 and 2,800, so it is reasonable.", "no": "400 is 4 hundreds. Do 4 × 7.", "hint": "4 hundreds × 7 = 28 hundreds."}], "notes": {"do": "She writes all three partial products on paper in a column, lined up by place, before tapping.", "ask": "What goes in the 300 box? How many zeros, and why? Now add the column.", "listen": "2,100, 420, 56, total 2,576. If she writes 210, say: 3 hundreds × 7 = 21 hundreds. On item 3 she should check 2,576 against 2,100 and 2,800."}}, {"type": "learn", "kick": "Hands-on", "title": "Cut the rectangle: 23 × 14", "text": "On grid paper, draw a rectangle <b>23 squares across</b> and <b>14 squares down</b>.", "steps": [{"text": "Draw a line after <b>20</b> squares across. Draw a line after <b>10</b> squares down."}, {"text": "Cut along the two lines. You get <b>4 pieces</b>."}, {"text": "Count each piece: 20 × 10, 3 × 10, 20 × 4, 3 × 4.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">20</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">3</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">4</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text></svg>"}}, {"text": "Put the 4 pieces back together. The whole rectangle is 23 × 14."}], "tip": "Four pieces means four partial products. None can be left out.", "notes": {"do": "Give her 1-cm grid paper, a pencil and scissors. She draws the 23 by 14 rectangle, marks the 20/3 line and the 10/4 line, cuts it into 4 pieces and counts each piece using multiplication (not one square at a time).", "say": "Each piece is a box in the area model. If you lose a piece, you lose part of the answer.", "ask": "How many squares are in the big piece? The skinny piece on the right? The bottom strip? The little corner?", "listen": "200, 30, 80 and 12. If she counts squares one by one, stop her: how many rows and how many in each row? Keep the 4 pieces on the table for the next slides."}}, {"type": "learn", "kick": "Learn", "title": "Four boxes for 23 × 14", "text": "When <b>both</b> numbers have two digits, split <b>both</b>: 23 = 20 + 3 and 14 = 10 + 4.", "steps": [{"text": "<b>Estimate:</b> 23 × 14 is between 20 × 10 = <b>200</b> and 30 × 20 = <b>600</b>."}, {"text": "Draw 2 columns (20 and 3) and 2 rows (10 and 4). That makes <b>4 boxes</b>.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">20</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">3</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">4</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text></svg>"}}, {"text": "Multiply each box: 20 × 10 = 200, 3 × 10 = 30, 20 × 4 = 80, 3 × 4 = 12.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">20</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">3</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"82.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">20 × 10</text><text x=\"131.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">200</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"82.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">3 × 10</text><text x=\"266.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">30</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">4</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">20 × 4</text><text x=\"131.0\" y=\"193.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">80</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">3 × 4</text><text x=\"266.0\" y=\"193.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#0A1F3D\">12</text></svg>"}}, {"text": "Add all four: 200 + 30 + 80 + 12 = <b>322</b>. It is between 200 and 600, so it is reasonable. ✅", "visual": {"kind": "bigtext", "text": "23 × 14 = 322"}}], "tip": "Four boxes means four partial products. Count them before you add so none gets lost.", "notes": {"do": "Click the steps. She points to the matching paper piece for each box as you reveal it.", "say": "Both numbers have two digits, so we split both. Two columns times two rows makes four boxes.", "ask": "Which paper piece is 3 × 4? Which is 20 × 10? Is 322 between 200 and 600?", "listen": "The little corner is 3 × 4 = 12; the big piece is 200. Yes, 322 fits the estimate."}}, {"type": "sort", "kick": "Sort it", "title": "Which boxes build 36 × 12?", "text": "36 = 30 + 6 and 12 = 10 + 2. Tap a card, then tap the right box.", "buckets": ["✅ A box in 36 × 12", "❌ Not a box"], "items": [{"text": "300 (30 × 10)", "b": 0, "why": "The 30 column times the 10 row.", "hint": "30 is part of 36 and 10 is part of 12."}, {"text": "60 (6 × 10)", "b": 0, "why": "The 6 column times the 10 row.", "hint": "6 is part of 36 and 10 is part of 12."}, {"text": "60 (30 × 2)", "b": 0, "why": "The 30 column times the 2 row.", "hint": "30 is part of 36 and 2 is part of 12."}, {"text": "12 (6 × 2)", "b": 0, "why": "The 6 column times the 2 row.", "hint": "6 is part of 36 and 2 is part of 12."}, {"text": "36 (30 + 6)", "b": 1, "why": "That is adding the parts of 36, not a box.", "hint": "Every box is a part times a part."}, {"text": "18 (6 × 3)", "b": 1, "why": "There is no 3 in 12 = 10 + 2.", "hint": "Is 3 a part of 12?"}, {"text": "3,000 (30 × 100)", "b": 1, "why": "There is no 100 in 12.", "hint": "Is 100 a part of 12?"}], "done": "36 × 12 = 300 + 60 + 60 + 12 = <b>432</b>.", "notes": {"do": "She says 'column times row' for each card before she taps a box.", "ask": "Is 3 a part of 12? Is 100 a part of 12? Why is 36 not a box?", "listen": "12 = 10 + 2, so 3 and 100 are not parts. 36 is adding the parts of 36, not a part times a part. The total is 432."}}, {"type": "tap", "kick": "Try it", "title": "Four-box problems", "items": [{"q": "Which four partial products build <b>32 × 15</b>?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">30</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">2</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">5</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text></svg>"}, "choices": ["300, 20, 15, 10", "300, 150, 10", "30, 2, 15, 5", "300, 20, 150, 10"], "a": 3, "why": "30 × 10 = 300, 2 × 10 = 20, 30 × 5 = 150, 2 × 5 = 10.", "no": ["30 × 5 is 3 tens × 5 = 15 tens = 150.", "Only three boxes. You lost 2 × 10 = 20.", "Those are not products. Multiply column times row.", null]}, {"q": "So what is <b>32 × 15</b>?", "choices": ["345", "480", "460"], "a": 1, "why": "300 + 20 + 150 + 10 = <b>480</b>.", "no": ["The 30 × 5 box is 150, not 15.", null, "You left out the 20 box (2 × 10)."]}, {"q": "Berk's training arena has <b>16</b> rows of benches with <b>24</b> Vikings in each row. How many Vikings?", "choices": ["384", "224", "40", "344"], "a": 0, "why": "200 + 40 + 120 + 24 = <b>384</b> Vikings. Estimate check: between 200 and 600. ✅", "no": [null, "You did only 20 × 10 and 6 × 4. There are four boxes: 200 + 40 + 120 + 24.", "You added 16 + 24. Equal rows means multiply.", "You lost the 40 box (4 × 10)."]}], "notes": {"do": "She writes all four partial products on paper, counts them (1, 2, 3, 4) and then adds.", "ask": "How many partial products should you have? Did you count them?", "listen": "Four, every time. If she picks 224 for 16 × 24, she did only tens × tens and ones × ones: point to the two boxes she left out."}}, {"type": "tap", "kick": "Guided practice", "title": "You lead: 26 × 13", "text": "Tell me the four boxes, then type.", "items": [{"type": "fill", "q": "26 × 13: what goes in the <b>20 × 3</b> box?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">20</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">6</text><text x=\"36\" y=\"93.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"94.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><text x=\"36\" y=\"182.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">3</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"131.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F7F0FB\" stroke=\"#8E44AD\" stroke-width=\"3\"/><text x=\"266.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#8E44AD\">?</text></svg>"}, "answers": ["60"], "why": "2 × 3 = 6, so 20 × 3 = <b>60</b>.", "no": "20 is 2 tens. 2 tens × 3 = 6 tens.", "hint": "2 × 3 = 6. Keep the zero."}, {"type": "fill", "q": "Add all four boxes. <b>26 × 13 = ____</b>", "answers": ["338"], "why": "200 + 60 + 60 + 18 = <b>338</b>. It is between 200 and 600, so it is reasonable.", "no": "The boxes are 20 × 10, 6 × 10, 20 × 3 and 6 × 3.", "hint": "200 + 60 + 60 + 18"}], "notes": {"do": "She leads. She draws the four boxes on the whiteboard, estimates first (20 × 10 = 200 and 30 × 20 = 600), then fills every box.", "say": "You are the teacher now. Estimate first, then tell me all four boxes.", "ask": "What is your estimate? What are the four partial products? How many did you count?", "listen": "200, 60, 60, 18 = 338. If she has 278 she left out a 60; if she has 218 she did only two boxes."}}, {"type": "recall", "kick": "Remember", "title": "From yesterday and before", "items": [{"q": "What is <b>86 × 7</b>?", "choices": ["93", "562", "592", "602"], "a": 3, "why": "80 × 7 = 560 and 6 × 7 = 42. 560 + 42 = <b>602</b>.", "no": ["You added 86 + 7.", "The ones box is 6 × 7 = 42, not 2.", "560 + 42: 6 tens + 4 tens = 10 tens. Regroup to get 602.", null]}, {"q": "Which partial products build <b>59 × 6</b>?", "choices": ["300 and 54", "30 and 54", "300 and 9", "50 and 9"], "a": 0, "why": "50 × 6 = 300 and 9 × 6 = 54.", "no": [null, "50 × 6 is 5 tens × 6 = 30 tens = 300.", "The 9 box gets multiplied too: 9 × 6 = 54.", "Those are the parts of 59. Multiply each one by 6."]}, {"q": "Use 5 × 9 + 2 × 9 to find <b>7 × 9</b>.", "choices": ["45 + 18 = 53", "45 + 18 = 63", "45 + 9 = 54"], "a": 1, "why": "5 nines + 2 nines = 7 nines: 45 + 18 = <b>63</b>.", "no": ["5 + 8 = 13, so regroup: 45 + 18 = 63.", null, "2 × 9 is 18, not 9."]}], "notes": {"do": "Quick and out loud.", "ask": "What is the shortcut for 7 × 9? Which partial products build 59 × 6?", "listen": "5 nines + 2 nines = 45 + 18 = 63. 300 and 54. For 86 × 7, she must regroup: 560 + 42 = 602."}}, {"type": "tap", "kick": "Word Power", "title": "Use your new words", "items": [{"q": "Hiccup says the sea dragon is <b>approximately</b> 400 feet long. What does <b>approximately</b> tell you?", "choices": ["The length is exactly 400 feet.", "The real length is close to 400 feet, but maybe not exactly 400.", "The length is more than 400 feet for sure.", "Nobody has any idea how long it is."], "a": 1, "why": "Approximately means close to, but maybe not exactly.", "no": ["Approximately means close to, not exact.", null, "It could be a bit more or a bit less.", "Approximately means we have a close idea."]}, {"q": "A <b>meticulous</b> student solving 23 × 14 would …", "choices": ["count all four boxes and check each fact", "skip the estimate to save time", "add the two biggest boxes and stop", "guess the answer"], "a": 0, "why": "Meticulous means very careful about every small detail.", "no": [null, "Skipping steps is the opposite of meticulous.", "A meticulous student would not leave boxes out.", "Meticulous means careful with every detail."]}, {"q": "Which word fits? <i>The sea dragon was so ______ that the whole tribe hid behind their shields.</i>", "choices": ["fearsome", "crafty", "reasonable", "meticulous"], "a": 0, "why": "People hide from something <b>fearsome</b>: frightening to face.", "no": [null, "Crafty means sneaky-clever. The clue is that everyone hid in fear.", "Reasonable means it makes sense. That does not explain hiding.", "Meticulous means careful with details."]}], "notes": {"do": "She reads every choice and says why each wrong one is wrong.", "ask": "Why can a triangle not have 'approximately' 3 sides? What would a meticulous student do on 23 × 14?", "listen": "A triangle has exactly 3 sides. Meticulous = counts all four boxes and checks each fact."}}, {"type": "tap", "kick": "Exit ticket", "title": "Check for understanding", "text": "On your own. No help this time.", "items": [{"type": "fill", "q": "Estimate first: <b>184 × 6</b> is between 600 and <b>____</b>.", "answers": ["1200"], "why": "100 × 6 = 600 and 200 × 6 = <b>1,200</b>.", "no": "Round 184 up to 200. What is 200 × 6?", "hint": "2 hundreds × 6 = 12 hundreds."}, {"type": "fill", "q": "Now use three boxes. <b>184 × 6 = ____</b>", "answers": ["1104"], "why": "600 + 480 + 24 = <b>1,104</b>. It fits the estimate.", "no": "The boxes are 100 × 6, 80 × 6 and 4 × 6.", "hint": "600 + 480 = 1,080. Then add 24."}], "notes": {"do": "She works alone on paper. You watch, but you do not help.", "say": "Show me what you can do by yourself.", "listen": "1,200 and 1,104 with no help means she is ready for tonight. If she writes 1,080, she lost the ones box; if 672, she lost the zero in 80 × 6 (600 + 48 + 24). Fix it together before she leaves."}}, {"type": "learn", "kick": "Wrap-up", "title": "What you can do now", "text": "Big numbers are not scary. They just have more boxes.", "steps": [{"text": "<b>1. Estimate</b>: round down and up to find the two numbers the answer must be between."}, {"text": "<b>2. Boxes</b>: three boxes for 3-digit × 1-digit. Four boxes for 2-digit × 2-digit."}, {"text": "<b>3. Add</b> every partial product. Count them first so none gets lost."}, {"text": "<b>4. Check</b>: is your answer between your two estimate numbers? Then it is reasonable."}], "tip": "Tonight and Wednesday are busy. Look at your task list and do one item at a time.", "notes": {"do": "Click the steps, then open the course page together and read the task list. Show her which items are for tonight and which are for Wednesday.", "say": "Tonight: the After-Class Lesson, Lesson 6 practice and the Lesson 6 packet. Wednesday: Lesson 7 practice and page 1 of the Lesson 7 packet. Read every day.", "ask": "Say the four steps without looking.", "listen": "Estimate, boxes, add, check. If she leaves out the estimate, remind her: the estimate catches mistakes."}}], "win": "You estimated, built every box, and checked your answer. Meticulous work!", "prev": "bb-bailey-L06", "prevTitle": "Lesson 6"});</script></body></html>
