<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 16: Leftovers in Long Division</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L16", "label": "Lesson 16", "title": "Leftovers in Long Division", "goal": "I can do long division with a remainder, make sure the remainder is smaller than the divisor, and check my answer.", "date": "2026-12-14", "mastery": 90, "color": "#00A8A8", "slides": [{"type": "hello", "title": "On Your Own: Leftovers in Long Division", "text": "In class you found remainders in long division and checked by multiplying and adding. Now practice on your own with paper and a pencil. It takes about 25 minutes and ends with <b>Show What You Know</b>.", "visual": {"kind": "emoji", "text": "➗🍪"}}, {"type": "talk", "kick": "Say it out loud", "title": "Teach it to someone", "text": "Find someone at home. Teach them. Say it out loud before you go on.", "prompts": ["Show them 97 ÷ 4 on paper. Tell them what the R 1 means.", "Explain why a remainder can never be bigger than the divisor. Use the word <b>maximum</b>.", "Tell them about a time Toothless was <b>stubborn</b>."], "starters": ["The R 1 means …", "When you divide by 7, the maximum remainder is … because …", "Toothless was stubborn when …"]}, {"type": "vocab", "kick": "Word Power", "title": "Remember the words", "text": "Tap each card. Say the meaning before you flip it. Then flip to check yourself.", "words": [{"word": "leftover", "pos": "noun", "emoji": "🍪", "meaning": "What remains after the rest is used or shared. In division, it is the remainder.", "example": "97 cents on 4 plates: 24 cents each, and 1 cent is the <b>leftover</b>."}, {"word": "exceed", "pos": "verb", "emoji": "📈", "meaning": "To be more than something.", "example": "The remainder can never equal or <b>exceed</b> the divisor."}, {"word": "maximum", "pos": "adjective", "emoji": "🔝", "meaning": "The greatest that is possible or allowed.", "example": "When you divide by 6, the <b>maximum</b> remainder is 5."}, {"word": "revise", "pos": "verb", "emoji": "✏️", "meaning": "To change something to make it correct or better.", "example": "My remainder was too big, so I <b>revised</b> my answer: one more group fit."}, {"word": "remnant", "pos": "noun", "emoji": "🧩", "meaning": "A small part that is left over from something bigger.", "example": "Only a <b>remnant</b> of the fish pile was left after the dragons ate."}, {"word": "stubborn", "pos": "adjective", "emoji": "🐲", "meaning": "Not willing to change your mind or do what others want.", "example": "Toothless is <b>stubborn</b>: he often refuses to do what Hiccup asks."}, {"word": "ample", "pos": "adjective", "emoji": "🧺", "meaning": "More than enough.", "example": "We packed <b>ample</b> snacks, so nobody was hungry on the long trip."}]}, {"type": "learn", "kick": "Remember", "title": "Finish, then check", "text": "Here is <b>734 ÷ 5</b>, finished. Read each line and say the step.", "visual": {"kind": "longdiv", "text": "    146 R4\n   ____\n5 ) 734\n   -5\n   --\n    23\n   -20\n   ---\n     34\n    -30\n    ---\n      4"}, "steps": [{"text": "No more digits to bring down, and 4 is smaller than 5. So 734 ÷ 5 = <b>146 R 4</b>."}, {"text": "<b>Check:</b> 146 × 5 = 730. 730 + 4 = 734 ✔"}], "tip": "The remainder must be smaller than the divisor. Check: quotient × divisor + remainder = dividend."}, {"type": "sort", "kick": "Sort it", "title": "Could this remainder be right?", "text": "Look at the divisor and the remainder. Tap a card, then tap the box.", "buckets": ["✅ Allowed<br><small>smaller than the divisor</small>", "❌ Too big<br><small>revise it</small>"], "items": [{"text": "÷ 6 &nbsp; R 4", "b": 0, "why": "4 is smaller than 6.", "hint": "Is 4 smaller than 6?"}, {"text": "÷ 5 &nbsp; R 5", "b": 1, "why": "5 is not smaller than 5. One more group of 5 fits.", "hint": "Is 5 smaller than 5?"}, {"text": "÷ 8 &nbsp; R 7", "b": 0, "why": "7 is smaller than 8. It is the maximum for ÷ 8.", "hint": "Is 7 smaller than 8?"}, {"text": "÷ 3 &nbsp; R 4", "b": 1, "why": "4 exceeds 3. One more group of 3 fits.", "hint": "Is 4 smaller than 3?"}, {"text": "÷ 9 &nbsp; R 0", "b": 0, "why": "0 is smaller than 9. It came out even.", "hint": "Is 0 smaller than 9?"}, {"text": "÷ 7 &nbsp; R 9", "b": 1, "why": "9 exceeds 7. One more group of 7 fits.", "hint": "Is 9 smaller than 7?"}], "done": "The remainder must be smaller than the divisor."}, {"type": "tap", "kick": "Your turn", "title": "2-digit numbers", "text": "Copy each problem on your paper. Solve it. Type the answer with R for the remainder.", "items": [{"type": "fill", "q": "Use long division: <b>79 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["13 R 1", "13R1", "13 r 1", "13 remainder 1", "13 rem 1", "13 r1"], "why": "79 ÷ 6 = 13 R 1. Check: 13 × 6 + 1 = 79.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 6s fit in 7?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n6 ) 79"}}, {"type": "fill", "q": "Use long division: <b>89 ÷ 5</b> = ____ &nbsp; (use R for the remainder)", "answers": ["17 R 4", "17R4", "17 r 4", "17 remainder 4", "17 rem 4", "17 r4"], "why": "89 ÷ 5 = 17 R 4. Check: 17 × 5 + 4 = 89.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 5s fit in 8?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n5 ) 89"}}, {"type": "fill", "q": "Use long division: <b>71 ÷ 3</b> = ____ &nbsp; (use R for the remainder)", "answers": ["23 R 2", "23R2", "23 r 2", "23 remainder 2", "23 rem 2", "23 r2"], "why": "71 ÷ 3 = 23 R 2. Check: 23 × 3 + 2 = 71.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 3s fit in 7?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n3 ) 71"}}]}, {"type": "tap", "kick": "Your turn", "title": "3-digit numbers", "items": [{"type": "fill", "q": "Use long division: <b>926 ÷ 4</b> = ____ &nbsp; (use R for the remainder)", "answers": ["231 R 2", "231R2", "231 r 2", "231 remainder 2", "231 rem 2", "231 r2"], "why": "926 ÷ 4 = 231 R 2. Check: 231 × 4 + 2 = 926.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 4s fit in 9?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n4 ) 926"}}, {"type": "fill", "q": "Use long division: <b>658 ÷ 8</b> = ____ &nbsp; (use R for the remainder)", "answers": ["82 R 2", "82R2", "82 r 2", "82 remainder 2", "82 rem 2", "82 r2"], "why": "658 ÷ 8 = 82 R 2. Check: 82 × 8 + 2 = 658.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: 8 does not fit in 6, so start with 65.", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n8 ) 658"}}, {"type": "fill", "q": "<b>865 ÷ 7</b>. The work is done. What is the remainder?", "answers": ["4", "four"], "why": "After the last subtraction, 4 is left, and 4 is smaller than 7. So 865 ÷ 7 = 123 R 4.", "no": "Look at the very last number, after the last subtraction.", "visual": {"kind": "longdiv", "text": "    123\n   ____\n7 ) 865\n   -7\n   --\n    16\n   -14\n   ---\n     25\n    -21\n    ---\n      4"}}]}, {"type": "tap", "kick": "Your turn", "title": "Check and revise", "items": [{"type": "fill", "q": "Check <b>94 ÷ 7 = 13 R 3</b>: &nbsp; 13 × 7 + 3 = ____", "answers": ["94"], "why": "13 × 7 = 91, and 91 + 3 = 94. It matches the dividend, so the answer is right.", "no": "Multiply 13 × 7 first. Then add the remainder 3."}, {"type": "fill", "q": "When you divide by <b>9</b>, what is the biggest remainder you can ever have?", "answers": ["8", "eight"], "why": "The remainder must be smaller than the divisor, so the maximum remainder for ÷ 9 is 8. A remainder of 9 would make one more group.", "no": "It must be smaller than 9."}, {"q": "Snotlout wrote <b>62 ÷ 5 = 11 R 7</b>. The remainder is too big. Revise it. What is the right answer?", "choices": ["11 R 0", "12 R 2", "11 R 6", "12 R 7"], "a": 1, "why": "7 is not smaller than 5, so one more 5 fits: 12 × 5 = 60, and 62 − 60 = 2. So 62 ÷ 5 = 12 R 2.", "no": ["Check: 11 × 5 = 55, not 62. You cannot just drop a remainder.", null, "Check: 11 × 5 + 6 = 61, not 62.", "Check: 12 × 5 + 7 = 67, not 62."]}]}, {"type": "tap", "kick": "Word work", "title": "Words in action", "text": "Type the word.", "items": [{"type": "fill", "q": "To be more than something is to ____ it. (Use a word from your word cards.)", "answers": ["exceed"], "why": "To <i>exceed</i> is to be more than something.", "no": "It starts with ex-."}, {"type": "fill", "q": "To change something to make it correct is to ____ it. (Use a word from your word cards.)", "answers": ["revise"], "why": "To <i>revise</i> is to change something to make it correct.", "no": "It starts with re- and ends with -ise."}, {"q": "After the feast, only a small <b>remnant</b> of the bread was left. What is a remnant?", "choices": ["a big new loaf", "a small part that is left over", "a stubborn dragon", "the maximum amount"], "a": 1, "why": "A <i>remnant</i> is a small part left over from something bigger.", "no": ["A remnant is small and left over, not new.", null, "Stubborn describes someone who will not change. It does not mean left over.", "The maximum is the greatest amount, not what is left."]}]}, {"type": "recall", "kick": "Remember?", "title": "Earlier lessons", "items": [{"type": "fill", "q": "Use long division: <b>612 ÷ 6</b> = ____", "answers": ["102"], "why": "612 ÷ 6 = 102. Check: 102 × 6 = 612.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 6s fit in 6?", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 612"}}, {"type": "fill", "q": "<b>8 × 7</b> = ____", "answers": ["56"], "why": "Double 7 is 14, then 28, then 56.", "no": "Double, double, double."}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Use long division: <b>93 ÷ 4</b> = ____ &nbsp; (use R for the remainder)", "answers": ["23 R 1", "23R1", "23 r 1", "23 remainder 1", "23 rem 1", "23 r1"], "why": "93 ÷ 4 = 23 R 1. Check: 23 × 4 + 1 = 93.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 4s fit in 9?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n4 ) 93"}}, {"type": "fill", "q": "Use long division: <b>917 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["152 R 5", "152R5", "152 r 5", "152 remainder 5", "152 rem 5", "152 r5"], "why": "917 ÷ 6 = 152 R 5. Check: 152 × 6 + 5 = 917.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 6s fit in 9?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 917"}}, {"type": "fill", "q": "Use long division: <b>813 ÷ 4</b> = ____ &nbsp; (use R for the remainder)", "answers": ["203 R 1", "203R1", "203 r 1", "203 remainder 1", "203 rem 1", "203 r1"], "why": "813 ÷ 4 = 203 R 1. Check: 203 × 4 + 1 = 813.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 4s fit in 8?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n4 ) 813"}}, {"type": "fill", "q": "When you divide by <b>7</b>, what is the biggest remainder you can ever have?", "answers": ["6", "six"], "why": "The remainder must be smaller than the divisor, so the maximum remainder for ÷ 7 is 6. A remainder of 7 would make one more group.", "no": "It must be smaller than 7."}, {"q": "Look only at the divisor and the remainder. Which answer can <b>not</b> be right?", "choices": ["58 ÷ 3 = 19 R 1", "47 ÷ 6 = 7 R 5", "39 ÷ 4 = 8 R 7", "73 ÷ 8 = 9 R 1"], "a": 2, "why": "In 39 ÷ 4 = 8 R 7, the remainder 7 is not smaller than 4, so another group fits. Revise it: 39 ÷ 4 = 9 R 3.", "no": ["1 is smaller than 3, so this remainder is allowed. Check: 19 × 3 + 1 = 58.", "5 is smaller than 6, so this remainder is allowed. Check: 7 × 6 + 5 = 47.", null, "1 is smaller than 8, so this remainder is allowed. Check: 9 × 8 + 1 = 73."]}, {"type": "fill", "q": "Check <b>85 ÷ 6 = 14 R 1</b>: &nbsp; 14 × 6 + 1 = ____", "answers": ["85"], "why": "14 × 6 = 84, and 84 + 1 = 85. It matches the dividend, so the answer is right.", "no": "Multiply 14 × 6 first. Then add the remainder 1."}, {"q": "Fishlegs wrote <b>50 ÷ 6 = 7 R 8</b>. The remainder is too big. Revise it. What is the right answer?", "choices": ["7 R 7", "8 R 8", "7 R 0", "8 R 2"], "a": 3, "why": "8 is not smaller than 6, so one more 6 fits: 8 × 6 = 48, and 50 − 48 = 2. So 50 ÷ 6 = 8 R 2.", "no": ["Check: 7 × 6 + 7 = 49, not 50.", "Check: 8 × 6 + 8 = 56, not 50.", "Check: 7 × 6 = 42, not 50. You cannot just drop a remainder.", null]}, {"type": "fill", "q": "<b>529 ÷ 4</b>. The work is done. What is the remainder?", "answers": ["1", "one"], "why": "After the last subtraction, 1 is left, and 1 is smaller than 4. So 529 ÷ 4 = 132 R 1.", "no": "Look at the very last number, after the last subtraction.", "visual": {"kind": "longdiv", "text": "    132\n   ____\n4 ) 529\n   -4\n   --\n    12\n   -12\n   ---\n     09\n     -8\n     --\n      1"}}, {"type": "fill", "q": "To be more than something is to ____ it. (Use a word from your word cards.)", "answers": ["exceed"], "why": "To <i>exceed</i> is to be more than something.", "no": "It starts with ex-."}, {"q": "Which word means <i>more than enough</i>?", "choices": ["remnant", "stubborn", "ample", "leftover"], "a": 2, "why": "<i>Ample</i> means more than enough.", "no": ["A remnant is a small part left over.", "Stubborn means not willing to change.", null, "A leftover is what remains."]}], [{"type": "fill", "q": "Use long division: <b>58 ÷ 3</b> = ____ &nbsp; (use R for the remainder)", "answers": ["19 R 1", "19R1", "19 r 1", "19 remainder 1", "19 rem 1", "19 r1"], "why": "58 ÷ 3 = 19 R 1. Check: 19 × 3 + 1 = 58.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 3s fit in 5?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n3 ) 58"}}, {"type": "fill", "q": "Use long division: <b>703 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["117 R 1", "117R1", "117 r 1", "117 remainder 1", "117 rem 1", "117 r1"], "why": "703 ÷ 6 = 117 R 1. Check: 117 × 6 + 1 = 703.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 6s fit in 7?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 703"}}, {"type": "fill", "q": "Use long division: <b>495 ÷ 7</b> = ____ &nbsp; (use R for the remainder)", "answers": ["70 R 5", "70R5", "70 r 5", "70 remainder 5", "70 rem 5", "70 r5"], "why": "495 ÷ 7 = 70 R 5. Check: 70 × 7 + 5 = 495.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: 7 does not fit in 4, so start with 49.", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n7 ) 495"}}, {"type": "fill", "q": "When you divide by <b>4</b>, what is the biggest remainder you can ever have?", "answers": ["3", "three"], "why": "The remainder must be smaller than the divisor, so the maximum remainder for ÷ 4 is 3. A remainder of 4 would make one more group.", "no": "It must be smaller than 4."}, {"q": "One of these answers has a remainder that is too big. Which one?", "choices": ["62 ÷ 9 = 6 R 8", "44 ÷ 7 = 6 R 2", "71 ÷ 8 = 8 R 7", "34 ÷ 5 = 5 R 9"], "a": 3, "why": "In 34 ÷ 5 = 5 R 9, the remainder 9 is not smaller than 5, so another group fits. Revise it: 34 ÷ 5 = 6 R 4.", "no": ["8 is smaller than 9, so this remainder is allowed. Check: 6 × 9 + 8 = 62.", "2 is smaller than 7, so this remainder is allowed. Check: 6 × 7 + 2 = 44.", "7 is smaller than 8, so this remainder is allowed. Check: 8 × 8 + 7 = 71.", null]}, {"type": "fill", "q": "Check <b>99 ÷ 4 = 24 R 3</b>: &nbsp; 24 × 4 + 3 = ____", "answers": ["99"], "why": "24 × 4 = 96, and 96 + 3 = 99. It matches the dividend, so the answer is right.", "no": "Multiply 24 × 4 first. Then add the remainder 3."}, {"q": "Hiccup wrote <b>45 ÷ 7 = 5 R 10</b>. The remainder is too big. Revise it. What is the right answer?", "choices": ["6 R 3", "5 R 9", "6 R 10", "5 R 0"], "a": 0, "why": "10 is not smaller than 7, so one more 7 fits: 6 × 7 = 42, and 45 − 42 = 3. So 45 ÷ 7 = 6 R 3.", "no": [null, "Check: 5 × 7 + 9 = 44, not 45.", "Check: 6 × 7 + 10 = 52, not 45.", "Check: 5 × 7 = 35, not 45. You cannot just drop a remainder."]}, {"type": "fill", "q": "<b>586 ÷ 7</b>. The work is done. What is the remainder?", "answers": ["5", "five"], "why": "After the last subtraction, 5 is left, and 5 is smaller than 7. So 586 ÷ 7 = 83 R 5.", "no": "Look at the very last number, after the last subtraction.", "visual": {"kind": "longdiv", "text": "     83\n   ____\n7 ) 586\n   -56\n   ---\n     26\n    -21\n    ---\n      5"}}, {"type": "fill", "q": "Dividing by 3, the remainder can be 0, 1 or 2. So 2 is the ____ remainder. (Use a word from your word cards.)", "answers": ["maximum"], "why": "The <i>maximum</i> is the greatest amount allowed.", "no": "It starts with max-."}, {"q": "Which sentence uses <b>stubborn</b> correctly?", "choices": ["The stubborn fish was ample.", "The stubborn dragon would not budge from his warm rock.", "I stubborn my homework every night.", "A stubborn is the answer to a division."], "a": 1, "why": "<i>Stubborn</i> describes someone who will not change their mind or do what others want.", "no": ["Stubborn describes someone who refuses to change, not fish on a plate.", null, "Stubborn is an adjective, not an action.", "The answer to a division is the quotient."]}], [{"type": "fill", "q": "Use long division: <b>87 ÷ 5</b> = ____ &nbsp; (use R for the remainder)", "answers": ["17 R 2", "17R2", "17 r 2", "17 remainder 2", "17 rem 2", "17 r2"], "why": "87 ÷ 5 = 17 R 2. Check: 17 × 5 + 2 = 87.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 5s fit in 8?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n5 ) 87"}}, {"type": "fill", "q": "Use long division: <b>974 ÷ 3</b> = ____ &nbsp; (use R for the remainder)", "answers": ["324 R 2", "324R2", "324 r 2", "324 remainder 2", "324 rem 2", "324 r2"], "why": "974 ÷ 3 = 324 R 2. Check: 324 × 3 + 2 = 974.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 3s fit in 9?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n3 ) 974"}}, {"type": "fill", "q": "Use long division: <b>845 ÷ 8</b> = ____ &nbsp; (use R for the remainder)", "answers": ["105 R 5", "105R5", "105 r 5", "105 remainder 5", "105 rem 5", "105 r5"], "why": "845 ÷ 8 = 105 R 5. Check: 105 × 8 + 5 = 845.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 8s fit in 8?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n8 ) 845"}}, {"type": "fill", "q": "When you divide by <b>8</b>, what is the biggest remainder you can ever have?", "answers": ["7", "seven"], "why": "The remainder must be smaller than the divisor, so the maximum remainder for ÷ 8 is 7. A remainder of 8 would make one more group.", "no": "It must be smaller than 8."}, {"q": "All four answers multiply back to the dividend, but one breaks the remainder rule. Which one?", "choices": ["26 ÷ 4 = 5 R 6", "53 ÷ 6 = 8 R 5", "40 ÷ 7 = 5 R 5", "67 ÷ 2 = 33 R 1"], "a": 0, "why": "In 26 ÷ 4 = 5 R 6, the remainder 6 is not smaller than 4, so another group fits. Revise it: 26 ÷ 4 = 6 R 2.", "no": [null, "5 is smaller than 6, so this remainder is allowed. Check: 8 × 6 + 5 = 53.", "5 is smaller than 7, so this remainder is allowed. Check: 5 × 7 + 5 = 40.", "1 is smaller than 2, so this remainder is allowed. Check: 33 × 2 + 1 = 67."]}, {"type": "fill", "q": "Check <b>78 ÷ 7 = 11 R 1</b>: &nbsp; 11 × 7 + 1 = ____", "answers": ["78"], "why": "11 × 7 = 77, and 77 + 1 = 78. It matches the dividend, so the answer is right.", "no": "Multiply 11 × 7 first. Then add the remainder 1."}, {"q": "Snotlout wrote <b>69 ÷ 8 = 7 R 13</b>. The remainder is too big. Revise it. What is the right answer?", "choices": ["8 R 13", "7 R 0", "8 R 5", "7 R 12"], "a": 2, "why": "13 is not smaller than 8, so one more 8 fit
