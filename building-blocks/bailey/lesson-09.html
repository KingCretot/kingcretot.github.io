<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 9: Division Undoes Multiplication</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L09", "label": "Lesson 9", "title": "Division Undoes Multiplication", "goal": "I can solve a division fact by asking the multiplication question, like 56 ÷ 8 means 8 × ? = 56.", "date": "2026-11-09", "mastery": 90, "color": "#E67E22", "slides": [{"type": "hello", "title": "On Your Own: Division Undoes Multiplication", "text": "In class you learned that division asks a <b>multiplication question</b>. Now you do it on your own. It takes about 25 minutes, and it ends with <b>Show What You Know</b>.", "visual": {"kind": "emoji", "text": "🐉➗🔑"}}, {"type": "talk", "kick": "Say it out loud", "title": "Teach it to someone", "text": "Find someone at home. Teach them what you learned. Say it out loud before you go on.", "prompts": ["What does <b>56 ÷ 8</b> mean? Use the words <i>times what</i>.", "Tell them the two kinds of division question, with a dragon example for each.", "In <i>How to Train Your Dragon</i>, who might need to <b>ration</b> food or <b>allot</b> supplies? Why?"], "starters": ["56 ÷ 8 means …", "One kind asks how many in each, like …", "… would need to ration … because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Remember the words", "text": "Tap each card. Say the meaning before you flip it. Then flip to check yourself.", "words": [{"word": "dividend", "pos": "noun", "emoji": "🥧", "meaning": "The number being divided: the total you start with.", "example": "In 56 ÷ 8 = 7, the <b>dividend</b> is 56."}, {"word": "divisor", "pos": "noun", "emoji": "✂️", "meaning": "The number you divide by: the number of groups, or how many go in each group.", "example": "In 56 ÷ 8 = 7, the <b>divisor</b> is 8."}, {"word": "quotient", "pos": "noun", "emoji": "🎯", "meaning": "The answer to a division problem.", "example": "In 56 ÷ 8 = 7, the <b>quotient</b> is 7."}, {"word": "inverse operations", "pos": "noun", "emoji": "🔄", "meaning": "Two operations that undo each other, like multiplication and division.", "example": "8 × 7 = 56, so 56 ÷ 8 = 7. They are <b>inverse operations</b>."}, {"word": "ration", "pos": "verb", "emoji": "🥖", "meaning": "To give out something in small, set amounts so that it lasts longer.", "example": "When the winter was long, the Vikings had to <b>ration</b> their bread."}, {"word": "provisions", "pos": "noun", "emoji": "🧺", "meaning": "Supplies of food and other things people need, packed for later.", "example": "The ship carried <b>provisions</b> for a week at sea."}, {"word": "allot", "pos": "verb", "emoji": "📋", "meaning": "To give each person or group a certain share of something.", "example": "The chief will <b>allot</b> 6 arrows to each archer."}]}, {"type": "learn", "kick": "Remember", "title": "The one big idea", "text": "Turn every division into a multiplication question. Then use a fact you know.", "visual": {"kind": "triangle", "a": 9, "b": "?", "c": 81}, "steps": [{"text": "81 ÷ 9 means <b>9 × ? = 81</b>."}, {"text": "9 × 9 = 81, so <b>81 ÷ 9 = 9</b>. No adding nines!"}], "tip": "dividend ÷ divisor = quotient"}, {"type": "tap", "kick": "Your turn", "title": "Ask the multiplication question", "text": "Type the missing number.", "items": [{"type": "fill", "q": "54 ÷ 9: &nbsp; 9 × ____ = 54", "answers": ["6", "six"], "why": "9 × 6 = 54, so 54 ÷ 9 = 6.", "no": "Use the ×9 shortcut: 10 × 6 − 6 = 54."}, {"type": "fill", "q": "49 ÷ 7: &nbsp; 7 × ____ = 49", "answers": ["7", "seven"], "why": "7 × 7 = 49, so 49 ÷ 7 = 7.", "no": "Which 7s fact makes 49?"}, {"type": "fill", "q": "What number is hiding in this fact triangle? Type it.", "answers": ["9", "nine"], "why": "6 × 9 = 54, so 54 ÷ 6 = 9.", "no": "Ask: 6 × what = 54?", "visual": {"kind": "triangle", "a": 6, "b": "?", "c": 54}}, {"q": "To solve <b>64 ÷ 8</b>, which question should you ask yourself?", "choices": ["64 × 8 = ?", "8 × ? = 64", "64 − 8 = ?", "8 + ? = 64"], "a": 1, "why": "8 × 8 = 64, so 64 ÷ 8 = 8.", "no": ["That makes a much bigger number. Division of 64 gives an answer smaller than 64.", null, "Taking away one 8 leaves 56. You need how many eights fit in 64.", "8 + 56 = 64, so adding gives 56, not the answer."]}]}, {"type": "build", "kick": "Build it", "title": "Eggs in the hatchery", "text": "Fishlegs shares <b>48 dragon eggs</b> equally among <b>8 nests</b>. Make the groups: how many nests, and how many eggs in each one?", "groups": 8, "each": 6, "emoji": "🥚", "why": "8 groups of 6 make 48. So <b>48 ÷ 8 = 6</b> eggs in each nest.", "hint": "8 nests means 8 groups. Then ask: 8 × what = 48?"}, {"type": "tap", "kick": "Your turn", "title": "Each or groups?", "text": "Read the story. Type <b>each</b> if it asks how many in each group. Type <b>groups</b> if it asks how many groups. Then solve it.", "items": [{"type": "fill", "q": "Hiccup has 56 fish. He feeds <b>8 fish</b> to each dragon. How many dragons can he feed? Type <b>each</b> or <b>groups</b>.", "answers": ["groups", "group", "how many groups", "number of groups"], "why": "You know how many go in each (8). The story asks how many groups: how many dragons.", "no": "Is 8 the number of dragons, or the fish for each dragon?"}, {"type": "fill", "q": "Now solve it: Hiccup has 56 fish and feeds 8 fish to each dragon. How many dragons?", "answers": ["7", "7 dragons", "seven"], "why": "8 × 7 = 56, so 56 ÷ 8 = 7 dragons.", "no": "Ask: 8 × what = 56?"}, {"type": "fill", "q": "Stoick splits 54 arrows equally among <b>6 archers</b>. How many arrows does each archer get? Type <b>each</b> or <b>groups</b>.", "answers": ["each", "how many in each", "in each", "each group", "how many in each group", "in each group"], "why": "You know the number of groups (6 archers). The story asks how many in each.", "no": "Is 6 the number of archers, or the arrows for each archer?"}, {"type": "fill", "q": "Now solve it: 54 arrows shared equally among 6 archers. How many arrows each?", "answers": ["9", "9 arrows", "nine"], "why": "6 × 9 = 54, so 54 ÷ 6 = 9 arrows each.", "no": "Ask: 6 × what = 54? Try 5 × 9 = 45, plus one more 9."}]}, {"type": "sort", "kick": "Sort it", "title": "Sort by the quotient", "text": "Tap a division card. Think of the multiplication fact. Then tap the box with its quotient.", "buckets": ["Quotient is <b>7</b>", "Quotient is <b>8</b>", "Quotient is <b>9</b>"], "items": [{"text": "63 ÷ 9", "b": 0, "why": "9 × 7 = 63.", "hint": "9 × what = 63? Try 10 × 7 − 7."}, {"text": "72 ÷ 9", "b": 1, "why": "9 × 8 = 72.", "hint": "9 × what = 72? Try 10 × 8 − 8."}, {"text": "81 ÷ 9", "b": 2, "why": "9 × 9 = 81.", "hint": "9 × what = 81?"}, {"text": "42 ÷ 6", "b": 0, "why": "6 × 7 = 42.", "hint": "6 × what = 42? 5 × 7 = 35, plus one more 7."}, {"text": "56 ÷ 7", "b": 1, "why": "7 × 8 = 56.", "hint": "7 × what = 56? Remember 5, 6, 7, 8."}, {"text": "54 ÷ 6", "b": 2, "why": "6 × 9 = 54.", "hint": "6 × what = 54?"}, {"text": "48 ÷ 6", "b": 1, "why": "6 × 8 = 48.", "hint": "6 × what = 48? 5 × 8 = 40, plus one more 8."}, {"text": "63 ÷ 7", "b": 2, "why": "7 × 9 = 63.", "hint": "7 × what = 63? 7 × 8 = 56 is one 7 short."}], "done": "Every division card was a multiplication fact in disguise."}, {"type": "tap", "kick": "Word work", "title": "Name it", "text": "Type the word.", "items": [{"type": "fill", "q": "In <b>45 ÷ 9 = 5</b>, the 5 is called the ____.", "answers": ["quotient", "the quotient"], "why": "The quotient is the answer to a division problem.", "no": "It is the answer. The word starts with q."}, {"type": "fill", "q": "In <b>45 ÷ 9 = 5</b>, the 9 is called the ____.", "answers": ["divisor", "the divisor"], "why": "The divisor is the number you divide by.", "no": "It is the number you divide BY."}, {"type": "fill", "q": "The ship carried food and supplies for the long trip. Another word for those supplies is ____. (Use a word from your word cards.)", "answers": ["provisions", "provision"], "why": "<i>Provisions</i> are supplies of food and needed things, packed for later.", "no": "It starts with p and ends with s."}, {"q": "Stoick will <b>allot</b> 8 fish to each family. Which word could replace <i>allot</i>?", "choices": ["save", "hand out", "count"], "a": 1, "why": "To <i>allot</i> is to hand out shares.", "no": ["Saving keeps the fish. Allot means to give out.", null, "Counting does not give anyone fish."]}]}, {"type": "recall", "kick": "Remember?", "title": "Your shortcuts still work", "items": [{"type": "fill", "q": "Use the ×7 shortcut (×5 plus ×2). What is <b>7 × 8</b>?", "answers": ["56"], "why": "5 × 8 = 40 and 2 × 8 = 16. 40 + 16 = 56.", "no": "5 × 8 = 40. Now add 2 × 8.", "hint": "40 + 16 = ?"}, {"q": "Use the area model. What is <b>36 × 7</b>?", "choices": ["217", "252", "210", "258"], "a": 1, "why": "30 × 7 = 210 and 6 × 7 = 42. 210 + 42 = 252.", "no": ["You added 7 instead of multiplying 6 × 7 = 42.", null, "You forgot the ones box. Add 6 × 7 = 42.", "Check the small box: 6 × 7 = 42, not 48. (6 × 8 = 48.)"], "visual": {"kind": "area", "b": 7, "split": [30, 6], "show": false}}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "To solve <b>56 ÷ 7</b>, ask: 7 × ____ = 56. Type the missing number.", "answers": ["8", "eight"], "why": "7 × 8 = 56, so 56 ÷ 7 = 8.", "no": "Remember 5, 6, 7, 8: 56 = 7 × 8."}, {"type": "fill", "q": "<b>27 ÷ 9</b> = ____", "answers": ["3", "three"], "why": "9 × 3 = 27, so 27 ÷ 9 = 3.", "no": "Ask: 9 × what = 27?"}, {"q": "What number is hiding in this fact triangle?", "choices": ["3", "5", "21", "4"], "a": 3, "why": "7 × 4 = 28, so 28 ÷ 7 = 4.", "no": ["7 × 3 = 21, not 28.", "7 × 5 = 35, not 28.", "21 is 28 − 7.", null], "visual": {"kind": "triangle", "a": 7, "b": "?", "c": 28}}, {"type": "fill", "q": "<b>36 ÷ 6</b> = ____", "answers": ["6", "six"], "why": "6 × 6 = 36, so 36 ÷ 6 = 6.", "no": "Ask: 6 × what = 36? 5 × 6 = 30, plus one more 6."}, {"q": "In <b>40 ÷ 8 = 5</b>, which number is the <b>divisor</b>?", "choices": ["40", "5", "8"], "a": 2, "why": "The divisor is the number you divide by: 8.", "no": ["40 is the dividend, the number being divided.", "5 is the quotient, the answer.", null]}, {"type": "fill", "q": "Hiccup has <b>70 fish</b>. He gives <b>7 fish</b> to each dragon. How many dragons get fish?", "answers": ["10", "10 dragons", "ten"], "why": "7 × 10 = 70, so 70 ÷ 7 = 10 dragons.", "no": "Ask: 7 × what = 70?"}, {"type": "fill", "q": "Fishlegs shares <b>72 rocks</b> equally into <b>9 bags</b>. How many rocks go in each bag?", "answers": ["8", "8 rocks", "eight"], "why": "9 × 8 = 72, so 72 ÷ 9 = 8 rocks in each bag.", "no": "Ask: 9 × what = 72? Try 10 × 8 − 8."}, {"type": "fill", "q": "The answer to a division problem is called the ____.", "answers": ["quotient", "the quotient"], "why": "The quotient is the answer when you divide.", "no": "It starts with q."}, {"q": "The Vikings had to <b>ration</b> their bread all winter. What did they do?", "choices": ["hid it in a secret pile", "ate all of it on the first day", "gave it out in small, set amounts so it would last", "shared all of it out at one big feast"], "a": 2, "why": "To <i>ration</i> is to give out small, set amounts so supplies last.", "no": ["Hiding a pile is not rationing. Rationing means sharing out small amounts.", "That is the opposite of rationing.", null, "Sharing it all at once means it is gone fast. Rationing makes it last."]}, {"q": "Which one shows <b>inverse operations</b>?", "choices": ["7 × 8 = 56, so 56 ÷ 8 = 7", "8 × 7 = 56 and 8 × 6 = 48", "56 ÷ 8 = 7 and 56 ÷ 7 = 8", "9 × 6 = 54 and 6 × 9 = 54"], "a": 0, "why": "Multiplication and division undo each other: 7 × 8 = 56, so 56 ÷ 8 = 7.", "no": [null, "Both are multiplication. Inverse means one undoes the other.", "Both are division. You need multiplication and division together.", "Those are turn-around facts. Both are multiplication."]}], [{"type": "fill", "q": "To solve <b>63 ÷ 9</b>, ask: 9 × ____ = 63. Type the missing number.", "answers": ["7", "seven"], "why": "9 × 7 = 63, so 63 ÷ 9 = 7.", "no": "Use the ×9 shortcut: 10 × 7 − 7."}, {"type": "fill", "q": "<b>24 ÷ 8</b> = ____", "answers": ["3", "three"], "why": "8 × 3 = 24, so 24 ÷ 8 = 3.", "no": "Ask: 8 × what = 24?"}, {"q": "Which number is missing from this fact triangle?", "choices": ["3", "27", "4", "45"], "a": 2, "why": "9 × 4 = 36, so 36 ÷ 9 = 4.", "no": ["9 × 3 = 27, not 36.", "27 is 36 − 9.", null, "45 is 36 + 9."], "visual": {"kind": "triangle", "a": 9, "b": "?", "c": 36}}, {"type": "fill", "q": "<b>60 ÷ 6</b> = ____", "answers": ["10", "ten"], "why": "6 × 10 = 60, so 60 ÷ 6 = 10.", "no": "Ask: 6 × what = 60?"}, {"q": "In <b>54 ÷ 6 = 9</b>, which number is the <b>dividend</b>?", "choices": ["9", "54", "6"], "a": 1, "why": "The dividend is the number being divided: 54.", "no": ["9 is the quotient, the answer.", null, "6 is the divisor, the number you divide by."]}, {"type": "fill", "q": "Stoick has <b>48 fish</b>. He gives <b>8 fish</b> to each dragon. How many dragons does he feed?", "answers": ["6", "6 dragons", "six"], "why": "8 × 6 = 48, so 48 ÷ 8 = 6 dragons.", "no": "Ask: 8 × what = 48?"}, {"type": "fill", "q": "Hiccup shares <b>64 arrows</b> equally among <b>8 Vikings</b>. How many arrows does each Viking get?", "answers": ["8", "8 arrows", "eight"], "why": "8 × 8 = 64, so 64 ÷ 8 = 8 arrows each.", "no": "Ask: 8 × what = 64? Double, double, double 8."}, {"type": "fill", "q": "The number you divide by is called the ____.", "answers": ["divisor", "the divisor"], "why": "The divisor is the number you divide by.", "no": "It is the number you divide BY. It starts with d."}, {"q": "Before the long voyage, the crew loaded <b>provisions</b> onto the ship. What did they load?", "choices": ["extra oars for rowing", "food and supplies for the trip", "gold to trade", "shields for battle"], "a": 1, "why": "<i>Provisions</i> are supplies of food and needed things, packed for later.", "no": ["Oars are part of the ship, not provisions.", null, "Gold for trading is treasure, not provisions.", "Provisions are what people need to live: food, water, supplies."]}, {"q": "Snotlout says <b>48 ÷ 6 = 9</b> because 6 × 9 = 48. What is wrong?", "choices": ["6 × 9 is 54, not 48. So 48 ÷ 6 = 8.", "Nothing. He is right.", "He should have subtracted 48 − 6.", "You can't check division with multiplication."], "a": 0, "why": "6 × 8 = 48, so 48 ÷ 6 = 8. Snotlout used a wrong fact.", "no": [null, "Check his fact: 6 × 9 = 54.", "Subtracting takes away only one 6.", "You can! They are inverse operations. His fact was just wrong."]}], [{"type": "fill", "q": "To solve <b>42 ÷ 6</b>, ask: 6 × ____ = 42. Type the missing number.", "answers": ["7", "seven"], "why": "6 × 7 = 42, so 42 ÷ 6 = 7.", "no": "Use the ×6 shortcut: 5 × 7 = 35, plus one more 7."}, {"type": "fill", "q": "<b>21 ÷ 7</b> = ____", "answers": ["3", "three"], "why": "7 × 3 = 21, so 21 ÷ 7 = 3.", "no": "Ask: 7 × what = 21?"}, {"q": "Find the hidden corner of this fact triangle.", "choices": ["3", "5", "24", "4"], "a": 3, "why": "8 × 4 = 32, so 32 ÷ 8 = 4.", "no": ["8 × 3 = 24, not 32.", "8 × 5 = 40, not 32.", "24 is 32 − 8.", null], "visual": {"kind": "triangle", "a": "?", "b": 8, "c": 32}}, {"type": "fill", "q": "<b>90 ÷ 9</b> = ____", "answers": ["10", "ten"], "why": "9 × 10 = 90, so 90 ÷ 9 = 10.", "no": "Ask: 9 × what = 90?"}, {"q": "In <b>35 ÷ 7 = 5</b>, which number is the <b>quotient</b>?", "choices": ["5", "35", "7"], "a": 0, "why": "The quotient is the answer: 5.", "no": [null, "35 is the dividend, the number being divided.", "7 is the divisor, the number you divide by."]}, {"type": "fill", "q": "Fishlegs has <b>63 dragon eggs</b>. He puts <b>7 eggs</b> in each nest. How many nests does he fill?", "answers": ["9", "9 nests", "nine"], "why": "7 × 9 = 63, so 63 ÷ 7 = 9 nests.", "no": "Ask: 7 × what = 63? 7 × 8 = 56 is one 7 short."}, {"type": "fill", "q": "Stoick shares <b>81 apples</b> equally among <b>9 families</b>. How many apples does each family get?", "answers": ["9", "9 apples", "nine"], "why": "9 × 9 = 81, so 81 ÷ 9 = 9 apples each.", "no": "Ask: 9 × what = 81?"}, {"type": "fill", "q": "Multiplication and division undo each other. They are ____ operations.", "answers": ["inverse", "inverse operations"], "why": "Operations that undo each other are <i>inverse operations</i>.", "no": "The word starts with i."}, {"q": "The chief will <b>allot</b> 7 fish to each family. What will he do?", "choices": ["keep the fish for himself", "sell the fish", "give each family a share of 7 fish", "cook all the fish"], "a": 2, "why": "To <i>allot</i> is to give each person or group a certain share.", "no": ["That is the opposite: allot means to give out.", "Selling is trading, not giving shares.", null, "Cooking does not give anyone a share."]}, {"q": "Which pair shows that multiplication and division are <b>inverse operations</b>?", "choices": ["9 × 6 = 54 and 6 × 9 = 54", "54 ÷ 9 = 6 and 54 ÷ 6 = 9", "9 × 6 = 54 and 9 × 7 = 63", "9 × 6 = 54, so 54 ÷ 9 = 6"], "a": 3, "why": "The division undoes the multiplication: 9 × 6 = 54, so 54 ÷ 9 = 6.", "no": ["Both are multiplication: turn-around facts.", "Both are division.", "Both are multiplication, and they use different numbers.", null]}]]}], "win": "You turned every division into a multiplication you already know. That is real math thinking!", "prev": "bb-bailey-L08", "prevTitle": "Lesson 8"});</script></body></html>
