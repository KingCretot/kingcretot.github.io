<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 9: Division Undoes Multiplication</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L09", "label": "Lesson 9", "title": "Division Undoes Multiplication", "goal": "I can solve a division fact by asking the multiplication question, like 56 ÷ 8 means 8 × ? = 56.", "date": "2026-11-09", "mastery": 90, "color": "#E67E22", "slides": [{"type": "hello", "title": "Division Undoes Multiplication", "text": "You already know your 6, 7, 8 and 9 facts. Today you find out they can work <b>backward</b>. Division asks a multiplication question with a missing number, so the facts you know are the key.", "visual": {"kind": "emoji", "text": "🐉🐟➗🔑"}}, {"type": "talk", "kick": "Book Talk", "title": "Back to Berk", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["Tell me what happened in the last chapter you read. Keep the events in order.", "What problem is Hiccup facing right now? Is he up against another character, himself, or nature?", "Find one word the author used that was new or interesting to you. What do you think it means, and what clue helped you?"], "starters": ["In the last chapter, …", "Hiccup's problem is … because …", "I think the word … means … because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read the word out loud, then make up your own sentence with it.", "words": [{"word": "dividend", "pos": "noun", "emoji": "🥧", "meaning": "The number being divided: the total you start with.", "example": "In 56 ÷ 8 = 7, the <b>dividend</b> is 56."}, {"word": "divisor", "pos": "noun", "emoji": "✂️", "meaning": "The number you divide by: the number of groups, or how many go in each group.", "example": "In 56 ÷ 8 = 7, the <b>divisor</b> is 8."}, {"word": "quotient", "pos": "noun", "emoji": "🎯", "meaning": "The answer to a division problem.", "example": "In 56 ÷ 8 = 7, the <b>quotient</b> is 7."}, {"word": "inverse operations", "pos": "noun", "emoji": "🔄", "meaning": "Two operations that undo each other, like multiplication and division.", "example": "8 × 7 = 56, so 56 ÷ 8 = 7. They are <b>inverse operations</b>."}, {"word": "ration", "pos": "verb", "emoji": "🥖", "meaning": "To give out something in small, set amounts so that it lasts longer.", "example": "When the winter was long, the Vikings had to <b>ration</b> their bread."}, {"word": "provisions", "pos": "noun", "emoji": "🧺", "meaning": "Supplies of food and other things people need, packed for later.", "example": "The ship carried <b>provisions</b> for a week at sea."}, {"word": "allot", "pos": "verb", "emoji": "📋", "meaning": "To give each person or group a certain share of something.", "example": "The chief will <b>allot</b> 6 arrows to each archer."}]}, {"type": "learn", "kick": "Learn", "title": "Division question 1: How many in each?", "text": "Stoick has <b>24 fish</b> to share equally among <b>6 dragons</b>. How many fish does each dragon get?", "visual": {"kind": "groups", "groups": 6, "each": 4, "emoji": "🐟", "label": "6 dragons. 4 fish for each dragon."}, "steps": [{"text": "We know the number of <b>groups</b>: 6 dragons."}, {"text": "We want to find how many go in <b>each</b> group."}, {"text": "Think: 6 × <b>?</b> = 24. 6 × 4 = 24, so <b>24 ÷ 6 = 4</b> fish for each dragon."}], "tip": "No counting one by one. A multiplication fact you know gives the answer."}, {"type": "learn", "kick": "Learn", "title": "Division question 2: How many groups?", "text": "Fishlegs has <b>24 fish</b>. He puts <b>6 fish</b> in each basket. How many baskets does he fill?", "visual": {"kind": "groups", "groups": 4, "each": 6, "emoji": "🐟", "label": "4 baskets. 6 fish in each basket."}, "steps": [{"text": "We know how many go in <b>each</b> group: 6 fish."}, {"text": "We want to find how many <b>groups</b>."}, {"text": "Think: <b>?</b> × 6 = 24. 4 × 6 = 24, so <b>24 ÷ 6 = 4</b> baskets."}], "tip": "Same numbers, two different questions. Read carefully to see which one the story asks."}, {"type": "learn", "kick": "Learn", "title": "56 ÷ 8 means 8 × ? = 56", "text": "Division and multiplication are <b>inverse operations</b>. Every division fact is a multiplication fact with a missing number.", "visual": {"kind": "bigtext", "text": "56 ÷ 8 = ?", "sub": "means: 8 × ? = 56"}, "steps": [{"text": "<b>Step 1.</b> Turn it into a multiplication question: <b>8 × ? = 56</b>.", "visual": {"kind": "triangle", "a": 8, "b": "?", "c": 56}}, {"text": "<b>Step 2.</b> Try a fact you know. 8 × 6 = 48. Too small. 8 × 7 = 56. Yes!"}, {"text": "<b>Step 3.</b> So <b>56 ÷ 8 = 7</b>.", "visual": {"kind": "triangle", "a": 8, "b": 7, "c": 56}}], "tip": "Do not add 8 + 8 + 8 … until you reach 56. Ask yourself: <b>8 times what is 56?</b>"}, {"type": "learn", "kick": "Learn", "title": "Reading a fact triangle", "text": "A fact triangle holds three numbers that work together. The <b>top</b> number is the biggest: it is the product of the two bottom numbers. Cover one corner and say the fact that finds it.", "visual": {"kind": "triangle", "a": 7, "b": 9, "c": 63}, "steps": [{"text": "Cover <b>63</b>: 7 × 9 = 63."}, {"text": "Cover <b>9</b>: 63 ÷ 7 = 9."}, {"text": "Cover <b>7</b>: 63 ÷ 9 = 7."}], "tip": "In a division fact from a triangle, the top number always comes first."}, {"type": "tap", "kick": "Try it", "title": "Ask the multiplication question", "items": [{"q": "To solve <b>48 ÷ 6</b>, which question should you ask yourself?", "choices": ["48 × 6 = ?", "6 + ? = 48", "6 × ? = 48", "48 − 6 = ?"], "a": 2, "why": "6 × 8 = 48, so 48 ÷ 6 = 8.", "no": ["That makes a much bigger number. Division of 48 gives an answer smaller than 48.", "6 + 42 = 48, so adding gives 42, not the answer. Ask how many sixes make 48.", null, "Taking away one 6 leaves 42. You need how many sixes fit in 48."]}, {"q": "What number is hiding in this fact triangle?", "choices": ["6", "45", "7", "63"], "a": 0, "why": "9 × 6 = 54, so 54 ÷ 9 = 6.", "no": [null, "45 is 54 − 9. Find the hiding number by multiplying or dividing, not subtracting.", "9 × 7 = 63, not 54. Try one less.", "63 is 54 + 9. The top number is already the biggest."], "visual": {"kind": "triangle", "a": 9, "b": "?", "c": 54}}, {"q": "Toothless has <b>63 shiny pebbles</b>. He makes piles with <b>7</b> in each pile. Which fact tells how many piles?", "choices": ["7 × 8 = 63, so 8 piles", "63 − 7 = 56, so 56 piles", "63 + 7 = 70, so 70 piles", "7 × 9 = 63, so 9 piles"], "a": 3, "why": "7 × 9 = 63, so 63 ÷ 7 = 9 piles.", "no": ["Check that fact: 7 × 8 = 56, not 63.", "Subtracting one 7 only makes one pile. How many sevens fit in 63?", "Adding makes more pebbles. Piles split the 63 up.", null]}]}, {"type": "build", "kick": "Build it", "title": "Feeding time on Berk", "text": "Stoick shares <b>42 fish</b> equally among <b>6 dragons</b>. Make the groups: how many dragons, and how many fish for each one?", "groups": 6, "each": 7, "emoji": "🐟", "why": "6 groups of 7 make 42. So <b>42 ÷ 6 = 7</b> fish for each dragon.", "hint": "There are 6 dragons, so make 6 groups. Then ask: 6 × what = 42?"}, {"type": "tap", "kick": "Try it", "title": "Name the parts, spot the mistake", "items": [{"q": "In <b>72 ÷ 8 = 9</b>, which number is the <b>quotient</b>?", "choices": ["72", "8", "9"], "a": 2, "why": "The quotient is the answer: 9.", "no": ["72 is the dividend, the number being divided.", "8 is the divisor, the number you divide by.", null]}, {"q": "Snotlout says <b>63 ÷ 7 = 8</b> because 7 × 8 = 63. What is wrong?", "choices": ["Nothing. He is right.", "7 × 8 is 56, not 63. So 63 ÷ 7 = 9.", "He should have added 63 + 7.", "You can't use multiplication to solve division."], "a": 1, "why": "7 × 9 = 63, so 63 ÷ 7 = 9. Snotlout used a wrong fact.", "no": ["Check his fact: 7 × 8 = 56.", null, "Adding does not undo multiplication. Division does.", "You can! They are inverse operations. His fact was just wrong."]}]}, {"type": "sort", "kick": "Sort it", "title": "Sort by the quotient", "text": "Tap a division card. Think of the multiplication fact. Then tap the box with its quotient.", "buckets": ["Quotient is <b>6</b>", "Quotient is <b>7</b>", "Quotient is <b>8</b>"], "items": [{"text": "42 ÷ 7", "b": 0, "why": "7 × 6 = 42.", "hint": "7 × what = 42? Try 7 × 6."}, {"text": "49 ÷ 7", "b": 1, "why": "7 × 7 = 49.", "hint": "7 × what = 49?"}, {"text": "64 ÷ 8", "b": 2, "why": "8 × 8 = 64.", "hint": "8 × what = 64? Double, double, double 8."}, {"text": "54 ÷ 9", "b": 0, "why": "9 × 6 = 54.", "hint": "9 × what = 54? 9 × 6 = 60 − 6."}, {"text": "63 ÷ 9", "b": 1, "why": "9 × 7 = 63.", "hint": "9 × what = 63? Use 10 × 7 − 7."}, {"text": "48 ÷ 6", "b": 2, "why": "6 × 8 = 48.", "hint": "6 × what = 48? 5 × 8 = 40, plus one more 8."}, {"text": "36 ÷ 6", "b": 0, "why": "6 × 6 = 36.", "hint": "6 × what = 36?"}, {"text": "56 ÷ 8", "b": 1, "why": "8 × 7 = 56.", "hint": "8 × what = 56? Remember 5, 6, 7, 8: 56 = 7 × 8."}], "done": "Every division fact was really a multiplication fact in disguise."}, {"type": "recall", "kick": "Remember?", "title": "Your shortcuts still work", "items": [{"q": "Use the ×7 shortcut (×5 plus ×2). What is <b>7 × 9</b>?", "choices": ["56", "63", "72", "16"], "a": 1, "why": "5 × 9 = 45 and 2 × 9 = 18. 45 + 18 = 63.", "no": ["56 is 7 × 8. You need 7 groups of 9.", null, "72 is 8 × 9, one group too many.", "16 is 7 + 9. That is adding, not multiplying."]}, {"q": "Use the area model. What is <b>36 × 7</b>?", "choices": ["217", "258", "252", "210"], "a": 2, "why": "30 × 7 = 210 and 6 × 7 = 42. 210 + 42 = 252.", "no": ["You added 7 instead of multiplying 6 × 7 = 42.", "Check the small box: 6 × 7 = 42, not 48. (6 × 8 = 48.)", null, "You forgot the ones box. Add 6 × 7 = 42."], "visual": {"kind": "area", "b": 7, "split": [30, 6], "show": false}}]}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"q": "Before the voyage, Stoick packed <b>provisions</b> into the longship. What did he pack?", "choices": ["food and supplies for later", "extra sails only", "treasure to hide", "weapons for battle"], "a": 0, "why": "<i>Provisions</i> are supplies of food and needed things, packed for later.", "no": [null, "Provisions are mostly food and needed supplies, not just one thing.", "That would be a hoard, not provisions.", "Provisions are what people need to live: food, water, supplies."]}, {"q": "The chief had to <b>allot</b> the shields fairly. What does <i>allot</i> mean here?", "choices": ["count them one by one", "lock them away", "polish them", "give each person a share"], "a": 3, "why": "To <i>allot</i> is to give each person a certain share.", "no": ["Counting is not the same as handing out shares.", "That is the opposite: allot means to give out.", "Polishing does not give anyone a shield.", null]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "What does <b>56 ÷ 8</b> ask?", "choices": ["8 × ? = 56", "56 × 8 = ?", "8 + ? = 56", "56 − 8 = ?"], "a": 0, "why": "Division asks: 8 times what is 56? 8 × 7 = 56.", "no": [null, "That makes a bigger number. Division asks for a missing factor.", "Adding does not undo multiplication.", "That only takes away one 8."]}, {"q": "<b>54 ÷ 9</b> = ?", "choices": ["7", "45", "6", "63"], "a": 2, "why": "9 × 6 = 54, so 54 ÷ 9 = 6.", "no": ["9 × 7 = 63, not 54.", "45 is 54 − 9.", null, "63 is 54 + 9."]}, {"q": "What number is hiding in this fact triangle?", "choices": ["6", "8", "42", "7"], "a": 3, "why": "7 × 7 = 49, so 49 ÷ 7 = 7.", "no": ["7 × 6 = 42, not 49.", "7 × 8 = 56, not 49.", "42 is 49 − 7.", null], "visual": {"kind": "triangle", "a": 7, "b": "?", "c": 49}}, {"q": "<b>48 ÷ 8</b> = ?", "choices": ["6", "7", "40", "56"], "a": 0, "why": "8 × 6 = 48, so 48 ÷ 8 = 6.", "no": [null, "8 × 7 = 56, not 48.", "40 is 48 − 8.", "56 is 48 + 8."]}, {"q": "In <b>63 ÷ 7 = 9</b>, which number is the <b>divisor</b>?", "choices": ["63", "9", "7"], "a": 2, "why": "The divisor is the number you divide by: 7.", "no": ["63 is the dividend, the number being divided.", "9 is the quotient, the answer.", null]}, {"q": "Hiccup has <b>36 fish</b>. He gives <b>6 fish</b> to each dragon. How many dragons get fish?", "choices": ["42", "6", "30", "216"], "a": 1, "why": "6 × 6 = 36, so 36 ÷ 6 = 6 dragons.", "no": ["42 is 36 + 6. You need how many sixes are in 36.", null, "30 is 36 − 6. That feeds only one dragon.", "216 is 36 × 6. Division makes it smaller."]}, {"q": "Fishlegs shares <b>72 rocks</b> equally into <b>8 bags</b>. How many rocks go in each bag?", "choices": ["8", "64", "9", "80"], "a": 2, "why": "8 × 9 = 72, so 72 ÷ 8 = 9 rocks in each bag.", "no": ["8 × 8 = 64, not 72.", "64 is 72 − 8.", null, "80 is 72 + 8."]}, {"q": "What is a <b>quotient</b>?", "choices": ["the number you divide by", "the answer to a division problem", "the number being divided", "the answer to an addition problem"], "a": 1, "why": "The quotient is the answer when you divide.", "no": ["That is the divisor.", null, "That is the dividend.", "That is a sum."]}, {"q": "The Vikings had to <b>ration</b> their bread all winter. What did they do?", "choices": ["hid it in a secret pile", "shared all of it out equally at one big feast", "ate all of it on the first day", "gave it out in small, set amounts so it would last"], "a": 3, "why": "To <i>ration</i> is to give out small, set amounts so supplies last.", "no": ["Hiding a pile is not rationing. Rationing means sharing out small amounts.", "Sharing it all at once means it is gone fast. Rationing gives out small amounts over time so it lasts.", "That is the opposite of rationing.", null]}, {"q": "Which one shows <b>inverse operations</b>?", "choices": ["8 × 7 = 56 and 8 × 6 = 48", "56 ÷ 8 = 7 and 56 ÷ 7 = 8", "7 × 8 = 56, so 56 ÷ 8 = 7", "9 × 6 = 54 and 6 × 9 = 54"], "a": 2, "why": "Multiplication and division undo each other: 7 × 8 = 56, so 56 ÷ 8 = 7.", "no": ["Both are multiplication. Inverse means one undoes the other.", "Both are division. You need multiplication and division together.", null, "Those are turn-around facts. Both are multiplication."]}]}], "win": "You turned every division into a multiplication you already know. That is real math thinking!", "prev": "bb-bailey-L08", "prevTitle": "Lesson 8"});</script></body></html>
