<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 13: Divide, Multiply, Subtract, Bring Down</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L13", "label": "Lesson 13", "title": "Divide, Multiply, Subtract, Bring Down", "goal": "I can divide a 2-digit number by a 1-digit number with long division, one step at a time.", "date": "2026-12-07", "mastery": 90, "color": "#E84393", "slides": [{"type": "hello", "title": "Divide, Multiply, Subtract, Bring Down", "text": "Today you learn <b>long division</b>: a way to divide numbers that are too big for one fact. You will do it one step at a time, and every step is a fact you already know.", "visual": {"kind": "emoji", "text": "➗🪜🐉"}, "notes": {"do": "Share your screen. Before you start, check that Bailey has at her table: 9 dimes and about 40 pennies (or 9 paper strips for tens and 40 beans for ones), 6 paper plates, paper, a pencil and her book. Keep your whiteboard in view of your camera.", "say": "\"On Thursday you showed me you kept your facts. Today those facts become a brand-new tool. If it looks big, remember: it is just one small step at a time, and I will be right here for every step.\"", "ask": "\"How many 4s fit in 8?\" (2). \"Hold on to that. It is the very first step today.\""}}, {"type": "talk", "kick": "Book Talk", "title": "Back to Berk", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["Tell what happened in the part you read this weekend, in order: first, next, then, last.", "Stoick is Hiccup's father and the leader of the tribe. How does Stoick feel about Hiccup? Give one clue from the book.", "Training Toothless is hard, but Hiccup keeps trying. Why might slow, careful work beat rushing?"], "starters": ["First … Next … Then … Last …", "I think Stoick feels … because …", "Slow, careful work beats rushing because …"], "notes": {"do": "6 minutes. Let her hold up the book to the camera and read a line if she wants.", "ask": "\"How does Stoick feel about Hiccup? What clue tells you?\"", "listen": "A feeling backed by a clue from the text. The last prompt is a bridge to today: slow, careful, step-by-step work beats rushing. Say so: \"That is exactly how long division works.\""}}, {"type": "recall", "kick": "Warm-up", "title": "Facts you will need today", "text": "Say the answer out loud. Jonathan types it.", "items": [{"type": "fill", "q": "How many 4s fit in 8?", "answers": ["2", "two"], "why": "4 × 2 = 8.", "no": "4 × what = 8?"}, {"type": "fill", "q": "How many 6s fit in 9? (6 × 1 = 6 and 6 × 2 = 12.)", "answers": ["1", "one"], "why": "Only one 6 fits in 9, because 6 × 2 = 12 is too big.", "no": "Is 12 bigger than 9?"}, {"type": "fill", "q": "<b>36 ÷ 6</b> = ____", "answers": ["6", "six"], "why": "6 × 6 = 36.", "no": "6 × what = 36?"}], "notes": {"do": "She says each answer; you type it (she cannot type on your screen on Zoom).", "say": "Praise each right answer: \"Yes! That is a step from today's first problem.\"", "listen": "The middle one is the key idea: \"How many fit\" can be a number that does not divide evenly. If she says 9 ÷ 6 doesn't work, ask: \"How many WHOLE 6s fit?\""}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Read each card out loud. Then use the word in your own sentence.", "words": [{"word": "long division", "pos": "noun", "emoji": "➗", "meaning": "A way to divide big numbers one place at a time with four steps: divide, multiply, subtract, bring down.", "example": "We used <b>long division</b> to find 84 ÷ 4 = 21."}, {"word": "place value", "pos": "noun", "emoji": "🔢", "meaning": "What a digit is worth because of where it sits: ones, tens or hundreds.", "example": "In 84, the 8 has a <b>place value</b> of 8 tens, which is 80."}, {"word": "bring down", "pos": "verb", "emoji": "⬇️", "meaning": "In long division, to move the next digit of the dividend down next to what is left.", "example": "After you subtract, <b>bring down</b> the next digit."}, {"word": "sequence", "pos": "noun", "emoji": "🔗", "meaning": "The order that things happen in.", "example": "The <b>sequence</b> is divide, multiply, subtract, bring down."}, {"word": "methodical", "pos": "adjective", "emoji": "🧱", "meaning": "Doing things carefully, one step at a time, in order.", "example": "A <b>methodical</b> mathematician never skips a step."}, {"word": "chieftain", "pos": "noun", "emoji": "👑", "meaning": "The leader of a tribe or clan.", "example": "Stoick, Hiccup's father, is the <b>chieftain</b> of the Hairy Hooligan Tribe."}, {"word": "cautious", "pos": "adjective", "emoji": "🦺", "meaning": "Careful to avoid mistakes or danger.", "example": "A <b>cautious</b> Viking tests the ice before walking on it."}], "notes": {"do": "Flip one card at a time on your screen. She reads the word and meaning aloud. Write <b>Divide · Multiply · Subtract · Bring down</b> on your whiteboard and keep it on camera all lesson.", "say": "\"Three long-division words, one word about order, and three story words. Methodical is how we will work today.\"", "ask": "\"Who is the chieftain of the Hairy Hooligans?\" (Stoick.) \"Tell me something you are cautious about.\" \"What is the place value of the 9 in 96?\" (9 tens, or 90.)", "listen": "For <i>methodical</i>: careful, in order, no skipping. For <i>sequence</i>: the order of steps."}}, {"type": "learn", "kick": "Learn", "title": "Share it by place value", "text": "There is no times-table fact for <b>84 ÷ 4</b>. So we split 84 by place value: <b>8 tens</b> and <b>4 ones</b>.", "visual": {"kind": "placevalue", "n": 84}, "steps": [{"text": "Share the <b>tens</b> first: 8 dimes on 4 plates. Each plate gets <b>2 dimes</b> (2 tens)."}, {"text": "Now share the <b>ones</b>: 4 pennies on 4 plates. Each plate gets <b>1 penny</b> (1 one)."}, {"text": "Each plate has 2 tens and 1 one: <b>21</b>. So 84 ÷ 4 = 21.", "visual": {"kind": "bigtext", "text": "2 tens + 1 one = 21", "sub": "on each of the 4 plates"}}], "tip": "Long division works the same way: tens first, then ones.", "notes": {"do": "Hands-on at home: she sets out 4 plates, 8 dimes and 4 pennies, and deals the dimes first, then the pennies. Hold each step until she has done it with her coins.", "ask": "\"How much money is on each plate?\" (21 cents.) \"Why did we share the dimes first?\" (Biggest place first.)", "listen": "She sees that each plate has 2 dimes and 1 penny. Praise: \"You just did long division with coins!\""}}, {"type": "learn", "kick": "Learn", "title": "Estimate first", "text": "Before you divide, decide about how big the answer will be. Multiply the divisor by 10, 20, 30…", "steps": [{"text": "<b>84 ÷ 4.</b> 4 × 20 = 80. 84 is a little more than 80, so the answer is a little more than 20."}, {"text": "<b>96 ÷ 6.</b> 6 × 10 = 60 and 6 × 20 = 120. 96 is between 60 and 120, so the answer is <b>between 10 and 20</b>."}], "tip": "If your answer is not near your estimate, check your steps.", "notes": {"ask": "\"Is 84 ÷ 4 closer to 2, to 20 or to 200?\" (20.)", "listen": "She multiplies by tens to bracket the answer. That is the place-value sense that catches a dropped digit later."}}, {"type": "learn", "kick": "Learn", "title": "The four steps", "text": "Long division repeats four steps in the same <b>sequence</b> until there are no digits left to bring down.", "visual": {"kind": "bigtext", "text": "Divide → Multiply → Subtract → Bring down", "sub": "Memory trick: Dad, Mom, Sister, Brother"}, "steps": [{"text": "<b>Divide:</b> how many times does the divisor fit? Write that digit in the quotient."}, {"text": "<b>Multiply:</b> that digit × the divisor. Write the product underneath."}, {"text": "<b>Subtract:</b> find what is left. It must be smaller than the divisor."}, {"text": "<b>Bring down:</b> move the next digit down. Then start again with Divide."}], "notes": {"say": "\"Dad, Mom, Sister, Brother. Divide, multiply, subtract, bring down. Say it with me.\"", "ask": "\"Which step uses the remainder rule from Thursday?\" (Subtract: what is left must be smaller than the divisor.)", "listen": "She can say the four steps in order without looking. Have her say them three times, faster each time."}}, {"type": "learn", "kick": "Watch it", "title": "84 ÷ 4: the tens", "text": "Tap <b>Show me the next step</b>. One step at a time.", "visual": {"kind": "longdiv", "text": "\n   ___\n4 ) 84"}, "steps": [{"text": "<b>Divide.</b> How many 4s fit in 8? <b>2</b> (4 × 2 = 8). Write 2 above the 8 in the tens place.", "visual": {"kind": "longdiv", "text": "    2\n   ___\n4 ) 84"}}, {"text": "<b>Multiply.</b> 2 × 4 = 8. Write 8 under the 8.", "visual": {"kind": "longdiv", "text": "    2\n   ___\n4 ) 84\n   -8\n   --"}}, {"text": "<b>Subtract.</b> 8 − 8 = 0. Check: 0 is smaller than 4.", "visual": {"kind": "longdiv", "text": "    2\n   ___\n4 ) 84\n   -8\n   --\n    0"}}], "notes": {"do": "Before each click, ask her to say the step and the number. Then click to show it. On paper at home, she copies each step as it appears.", "say": "Praise each correct step right away: \"Yes, divide: 2!\" \"Right, 2 × 4 = 8.\" \"Perfect, nothing left.\"", "ask": "\"Why does the 2 go above the 8 and not above the 4?\" (It is 2 tens, so it goes in the tens place.)", "listen": "She names the step before the number. If she freezes, point to the whiteboard: \"Which step comes after divide?\""}}, {"type": "learn", "kick": "Watch it", "title": "84 ÷ 4: the ones", "text": "Keep going. Bring down, then the same steps again.", "steps": [{"text": "<b>Bring down.</b> Bring down the 4 from the ones place. The 0 and the 4 make 04, which is just <b>4</b>.", "visual": {"kind": "longdiv", "text": "    2\n   ___\n4 ) 84\n   -8\n   --\n    04"}}, {"text": "<b>Divide.</b> How many 4s fit in 4? <b>1</b> (4 × 1 = 4). Write 1 above the 4 in the ones place.", "visual": {"kind": "longdiv", "text": "    21\n   ___\n4 ) 84\n   -8\n   --\n    04"}}, {"text": "<b>Multiply.</b> 1 × 4 = 4. Write 4 under the 4.", "visual": {"kind": "longdiv", "text": "    21\n   ___\n4 ) 84\n   -8\n   --\n    04\n    -4\n    --"}}, {"text": "<b>Subtract.</b> 4 − 4 = 0. Check: 0 is smaller than 4. There are no more digits to bring down, so <b>84 ÷ 4 = 21</b>.", "visual": {"kind": "longdiv", "text": "    21\n   ___\n4 ) 84\n   -8\n   --\n    04\n    -4\n    --\n     0"}}, {"text": "<b>Check by multiplying.</b> 21 × 4 = 84. It matches, so 84 ÷ 4 = 21 is right."}], "tip": "The answer matches your estimate (a little more than 20).", "notes": {"do": "Same routine: she says it, you click, she writes it.", "say": "Praise every step: \"Bring down, yes!\" \"1, yes!\" Then: \"You just finished your first long division. 21 is a little more than 20, just like your estimate.\"", "ask": "\"Why did we bring down the 4?\" (There was a digit left at the top.)"}}, {"type": "tap", "kick": "Talk it through", "title": "What comes next?", "text": "Look at the work. Say which step comes next. Jonathan taps it.", "items": [{"q": "<b>68 ÷ 2</b>. Look at the work so far. Which step comes next?", "choices": ["Divide", "Multiply", "Subtract", "Bring down"], "a": 1, "why": "You just wrote a digit in the quotient. Now multiply it by the divisor.", "no": ["You divide right after you bring down a new digit, or at the very start.", null, "You subtract right after you write the product underneath.", "You bring down right after you subtract, when a digit is still waiting."], "visual": {"kind": "longdiv", "text": "    3\n   ___\n2 ) 68"}}, {"q": "<b>93 ÷ 3</b>. Look at the work so far. Which step comes next?", "choices": ["Divide", "Multiply", "Subtract", "Bring down"], "a": 3, "why": "You subtracted and there is still a digit up top that has not been used. Bring it down.", "no": ["You divide right after you bring down a new digit, or at the very start.", "You multiply right after you write a new digit in the quotient.", "You subtract right after you write the product underneath.", null], "visual": {"kind": "longdiv", "text": "    3\n   ___\n3 ) 93\n   -9\n   --\n    0"}}, {"type": "fill", "q": "<b>76 ÷ 4</b>. What digit goes in the quotient next?", "answers": ["9", "nine"], "why": "How many 4s fit in 36? 9, because 4 × 9 = 36.", "no": "How many 4s fit in 36?", "visual": {"kind": "longdiv", "text": "    1\n   ___\n4 ) 76\n   -4\n   --\n    36"}}], "notes": {"do": "She answers out loud; you tap or type for her.", "ask": "After each: \"How do you know?\" (\"I just wrote a digit up top, so I multiply.\")", "listen": "She reads the LAST thing written to decide the next step. On 76 ÷ 4, the digit is 9: 4 × 9 = 36. If she says 8, ask: \"Is anything left if you use 8? Is it smaller than 4?\""}}, {"type": "learn", "kick": "Watch it", "title": "96 ÷ 6: the tens", "text": "This time something is left over after the tens.", "visual": {"kind": "longdiv", "text": "\n   ___\n6 ) 96"}, "steps": [{"text": "<b>Divide.</b> How many 6s fit in 9? <b>1</b> (6 × 1 = 6; 6 × 2 = 12 is too big). Write 1 above the 9 in the tens place.", "visual": {"kind": "longdiv", "text": "    1\n   ___\n6 ) 96"}}, {"text": "<b>Multiply.</b> 1 × 6 = 6. Write 6 under the 9.", "visual": {"kind": "longdiv", "text": "    1\n   ___\n6 ) 96\n   -6\n   --"}}, {"text": "<b>Subtract.</b> 9 − 6 = 3. Check: 3 is smaller than 6.", "visual": {"kind": "longdiv", "text": "    1\n   ___\n6 ) 96\n   -6\n   --\n    3"}}], "notes": {"do": "Hands-on at home: 9 dimes on 6 plates. Each plate gets 1 dime; 3 dimes are left in her hand.", "say": "Praise each step: \"1, yes!\" \"6, yes!\" \"3 left, and 3 is smaller than 6. Perfect.\"", "ask": "\"What are the 3 left over: 3 ones or 3 tens?\" (3 tens: three dimes.)", "listen": "She sees the 3 are tens. That is why we bring the ones down next to them."}}, {"type": "learn", "kick": "Watch it", "title": "96 ÷ 6: the ones", "text": "Bring down the 6. The 3 tens and 6 ones make 36.", "steps": [{"text": "<b>Bring down.</b> Bring down the 6 from the ones place. Now you have <b>36</b>.", "visual": {"kind": "longdiv", "text": "    1\n   ___\n6 ) 96\n   -6\n   --\n    36"}}, {"text": "<b>Divide.</b> How many 6s fit in 36? <b>6</b> (6 × 6 = 36). Write 6 above the 6 in the ones place.", "visual": {"kind": "longdiv", "text": "    16\n   ___\n6 ) 96\n   -6\n   --\n    36"}}, {"text": "<b>Multiply.</b> 6 × 6 = 36. Write 36 under the 36.", "visual": {"kind": "longdiv", "text": "    16\n   ___\n6 ) 96\n   -6\n   --\n    36\n   -36\n   ---"}}, {"text": "<b>Subtract.</b> 36 − 36 = 0. Check: 0 is smaller than 6. There are no more digits to bring down, so <b>96 ÷ 6 = 16</b>.", "visual": {"kind": "longdiv", "text": "    16\n   ___\n6 ) 96\n   -6\n   --\n    36\n   -36\n   ---\n     0"}}, {"text": "<b>Check by multiplying.</b> 16 × 6 = 60 + 36 = 96. It matches!"}], "tip": "16 is between 10 and 20, just like the estimate.", "notes": {"do": "Hands-on: she trades her 3 dimes for 30 pennies, adds the 6 pennies (36 pennies), and deals them onto the 6 plates: 6 each. Each plate: 1 dime + 6 pennies = 16 cents.", "say": "Praise each step out loud. At the end: \"Look at your plates. 16 cents each. The coins and the long division say the same thing.\"", "ask": "\"Where did the 36 come from?\" (3 tens left + 6 ones = 36 ones.)"}}, {"type": "order", "kick": "Put in order", "title": "72 ÷ 3, step by step", "text": "Say the steps in order. Jonathan taps them.", "steps": ["Divide: 3 fits in 7 two times. Write 2.", "Multiply: 2 × 3 = 6.", "Subtract: 7 − 6 = 1.", "Bring down the 2. Now you have 12.", "Divide: 3 fits in 12 four times. Write 4.", "Multiply: 4 × 3 = 12. Subtract: 12 − 12 = 0."], "why": "Divide, multiply, subtract, bring down, then again. 72 ÷ 3 = 24.", "hint": "Start with Divide. After you subtract, bring down.", "notes": {"do": "She says which card comes next; you tap it. Then she writes the whole problem on her paper and holds it up to the camera.", "say": "Praise each card: \"Yes, multiply comes after divide.\"", "listen": "On the paper: the 2 above the 7, the 4 above the 2, and the 12 lined up under the 12."}}, {"type": "tap", "kick": "Guided practice", "title": "Your turn on paper", "text": "Copy each one on your paper. Solve it one step at a time. Say the answer; Jonathan types it.", "items": [{"type": "fill", "q": "Use long division: <b>75 ÷ 5</b> = ____", "answers": ["15"], "why": "75 ÷ 5 = 15. Check: 15 × 5 = 75.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 5s fit in 7?", "visual": {"kind": "longdiv", "text": "\n   ___\n5 ) 75"}}, {"type": "fill", "q": "Use long division: <b>92 ÷ 4</b> = ____", "answers": ["23"], "why": "92 ÷ 4 = 23. Check: 23 × 4 = 92.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 4s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ___\n4 ) 92"}}, {"type": "fill", "q": "Use long division: <b>91 ÷ 7</b> = ____", "answers": ["13"], "why": "91 ÷ 7 = 13. Check: 13 × 7 = 91.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 7s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ___\n7 ) 91"}}], "notes": {"do": "She works on paper and holds it up to the camera after each one. You type her answer.", "say": "Say the step names with her the first time, then let her lead. Praise each step she gets right, out loud.", "listen": "On 91 ÷ 7: 7 fits in 9 once, 2 left, bring down 1 → 21, 7 × 3 = 21 → 13. If she says \"I can't do it\", ask only: \"What is the first step?\" and wait."}}, {"type": "tap", "kick": "Guided practice", "title": "Estimate and check", "items": [{"q": "Estimate first. <b>78 ÷ 6</b> is…", "choices": ["between 10 and 20", "between 20 and 30", "between 30 and 40", "between 40 and 50"], "a": 0, "why": "6 × 10 = 60 and 6 × 20 = 120. 78 is between them, so the answer is between 10 and 20.", "no": [null, "6 × 20 = 120. That is more than 78, so the answer is less than 20.", "6 × 30 = 180. That is more than 78, so the answer is less than 30.", "6 × 40 = 240. That is more than 78, so the answer is less than 40."]}, {"type": "fill", "q": "Bailey got <b>92 ÷ 4 = 23</b>. Check it: 23 × 4 = ____", "answers": ["92"], "why": "23 × 4 = 92. It matches the dividend, so the answer is right.", "no": "Use the area model: 20 × 4 plus 3 × 4."}], "notes": {"ask": "\"How does the estimate help?\" (It tells you if your answer is about right.)", "listen": "For the check she multiplies 23 × 4 with the area model: 80 + 12 = 92."}}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"q": "Fishlegs solves every problem one small step at a time, in order, and never skips a step. Which word describes him?", "choices": ["cautious", "methodical", "chieftain", "sequence"], "a": 1, "why": "<i>Methodical</i> means doing things carefully, one step at a time, in order.", "no": ["Cautious means careful to avoid danger. Methodical is about going step by step in order.", null, "A chieftain is a leader of a tribe.", "Sequence is a noun: the order of things."]}, {"type": "fill", "q": "In 72, the 7 is worth 70 because of its ____ ____. (Use two words from your word cards.)", "answers": ["place value"], "why": "<i>Place value</i> is what a digit is worth because of where it sits.", "no": "It starts with p and v."}, {"q": "Which sentence uses <b>bring down</b> the way it is used in long division?", "choices": ["Bring down the dishes from the shelf.", "Subtract 7 − 6 = 1, then bring down the 2 to make 12.", "Bring down the score by losing.", "The dragon brought down the tree."], "a": 1, "why": "In long division you bring down the next digit of the dividend.", "no": ["That is a different meaning: carrying something lower.", null, "That is a different meaning: making something smaller.", "That is a different meaning: knocking something over."]}], "notes": {"ask": "\"Use <i>cautious</i> in a sentence about long division.\" (Example: I am cautious when I subtract.)", "listen": "She uses each word correctly in her own sentence."}}, {"type": "tap", "kick": "Exit ticket", "title": "Show me before you go", "text": "Solve on your paper. No help this time. Say the answer; Jonathan types it.", "items": [{"type": "fill", "q": "Use long division: <b>78 ÷ 6</b> = ____", "answers": ["13"], "why": "78 ÷ 6 = 13. Check: 13 × 6 = 78.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 6s fit in 7?", "visual": {"kind": "longdiv", "text": "\n   ___\n6 ) 78"}}, {"type": "fill", "q": "Use long division: <b>84 ÷ 7</b> = ____", "answers": ["12", "twelve"], "why": "84 ÷ 7 = 12. Check: 12 × 7 = 84.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 7s fit in 8?", "visual": {"kind": "longdiv", "text": "\n   ___\n7 ) 84"}}, {"type": "fill", "q": "Use long division: <b>87 ÷ 3</b> = ____", "answers": ["29"], "why": "87 ÷ 3 = 29. Check: 29 × 3 = 87.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 3s fit in 8?", "visual": {"kind": "longdiv", "text": "\n   ___\n3 ) 87"}}], "notes": {"do": "She works alone on paper. You stay quiet until she says the answer. Type it.", "listen": "All three right means she is ready for the after-class lesson tonight. Note any step she skipped (usually bring down)."}}, {"type": "learn", "kick": "Wrap-up", "title": "What you learned today", "text": "You learned <b>long division</b>: divide, multiply, subtract, bring down, and repeat.", "steps": [{"text": "<b>Tonight:</b> the After-class lesson. It ends with Show What You Know. You need 90."}, {"text": "<b>Tonight:</b> read <i>How to Train Your Dragon</i> for 10 minutes."}, {"text": "<b>Tuesday or Wednesday:</b> the Pathways reading lesson on your task list."}, {"text": "<b>Tuesday in person:</b> Lesson 14, bigger numbers (3 digits)."}], "tip": "Keep your long division paper. Bring it on Tuesday.", "notes": {"do": "Open the course page on your screen share and show the Lesson 13 card: the After-class lesson button and the short task list.", "say": "\"Tonight is short on purpose. The Lesson 13 practice and packet are on Tuesday's list.\"", "ask": "Exit question out loud: \"What are the four steps, in order?\""}}], "win": "You did long division, one step at a time. Divide, multiply, subtract, bring down!", "prev": "bb-bailey-L12", "prevTitle": "Lesson 12"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?
