<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 9</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Division Undoes Multiplication</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Before you answer, ask yourself the multiplication question.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 9", "title": "Division Undoes Multiplication", "mastery": 90, "color": "#E67E22", "questions": [{"q": "<b>42 ÷ 7</b> = ?", "choices": ["5", "6", "35", "49"], "a": 1, "why": "7 × 6 = 42, so 42 ÷ 7 = 6.", "no": ["7 × 5 = 35, not 42.", null, "35 is 42 − 7.", "49 is 42 + 7."]}, {"q": "Which multiplication fact helps solve <b>81 ÷ 9</b>?", "choices": ["9 × 9 = 81", "8 × 9 = 72", "10 × 9 = 90", "81 − 9 = 72"], "a": 0, "why": "9 × 9 = 81, so 81 ÷ 9 = 9.", "no": [null, "72 is not 81. That fact is one nine too few.", "90 is one nine too many.", "Subtracting is not the multiplication fact you need."]}, {"q": "What number is hiding in this fact triangle?", "choices": ["7", "63", "8", "81"], "a": 2, "why": "9 × 8 = 72, so 72 ÷ 9 = 8.", "no": ["9 × 7 = 63, not 72.", "63 is 72 − 9.", null, "81 is 72 + 9."], "visual": {"kind": "triangle", "a": 9, "b": "?", "c": 72}}, {"q": "What number is hiding in this fact triangle?", "choices": ["6", "9", "49", "8"], "a": 3, "why": "8 × 7 = 56, so 56 ÷ 7 = 8.", "no": ["7 × 6 = 42, not 56.", "7 × 9 = 63, not 56.", "49 is 56 − 7.", null], "visual": {"kind": "triangle", "a": "?", "b": 7, "c": 56}}, {"q": "The tribe has <b>63 shields</b>. They hang <b>9</b> on each wall. How many walls get shields?", "choices": ["54", "7", "72", "8"], "a": 1, "why": "9 × 7 = 63, so 63 ÷ 9 = 7 walls.", "no": ["54 is 63 − 9.", null, "72 is 63 + 9.", "9 × 8 = 72, not 63."]}, {"q": "Fishlegs reads <b>48 pages</b> of his dragon book, the same number each night for <b>6 nights</b>. How many pages each night?", "choices": ["42", "7", "54", "8"], "a": 3, "why": "6 × 8 = 48, so 48 ÷ 6 = 8 pages each night.", "no": ["42 is 48 − 6.", "6 × 7 = 42, not 48.", "54 is 48 + 6.", null]}, {"q": "In <b>54 ÷ 6 = 9</b>, which number is the <b>dividend</b>?", "choices": ["54", "6", "9"], "a": 0, "why": "The dividend is the number being divided: 54.", "no": [null, "6 is the divisor.", "9 is the quotient."]}, {"q": "Which word means <i>supplies of food and needed things, packed for later</i>?", "choices": ["ration", "quotient", "provisions", "divisor"], "a": 2, "why": "<i>Provisions</i> are packed supplies.", "no": ["Ration is a verb: to give out in small amounts.", "Quotient is the answer to division.", null, "Divisor is the number you divide by."]}, {"q": "Snotlout says <b>49 ÷ 7 = 6</b>. Which fact proves him wrong?", "choices": ["7 + 6 = 13", "7 × 8 = 49", "7 × 6 = 42, not 49", "49 − 7 = 42"], "a": 2, "why": "7 × 6 = 42, so 6 is too small. 7 × 7 = 49, so 49 ÷ 7 = 7.", "no": ["Adding does not check division.", "That fact is wrong too: 7 × 8 = 56.", null, "Subtracting one 7 does not check his answer."]}, {"q": "Which is the fastest way to solve <b>72 ÷ 8</b>?", "choices": ["Add 8 + 8 + 8 … and count how many eights until 72", "Think 8 × ? = 72. 8 × 9 = 72, so 9.", "Draw 72 dots and circle groups of 8", "Subtract 72 − 8 = 64"], "a": 1, "why": "Use the inverse operation: 8 × 9 = 72, so 72 ÷ 8 = 9.", "no": ["That works, but it is slow and easy to lose track.", null, "That works, but it takes a long time. Use a fact you know.", "That only takes away one 8."]}, {"q": "Stoick will <b>allot</b> the fish so every family gets some. Which word could replace <i>allot</i>?", "choices": ["save up", "count", "borrow", "hand out"], "a": 3, "why": "To <i>allot</i> is to hand out shares.", "no": ["Saving up keeps the fish. Allot means to give out.", "Counting does not give anyone fish.", "Borrowing means taking for a while.", null]}]});</script></body></html>
