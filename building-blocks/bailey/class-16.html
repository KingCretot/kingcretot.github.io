<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 16: Leftovers in Long Division</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L16", "label": "Lesson 16", "title": "Leftovers in Long Division", "goal": "I can do long division with a remainder, make sure the remainder is smaller than the divisor, and check my answer.", "date": "2026-12-14", "mastery": 90, "color": "#00A8A8", "slides": [{"type": "hello", "title": "Leftovers in Long Division", "text": "Last week every long division came out even. Today some <b>do not</b>. You will find the <b>remainder</b>, make sure it is not too big, and check your answer by multiplying and adding.", "visual": {"kind": "emoji", "text": "➗🍪🐉"}, "notes": {"do": "Share your screen. Before you start, check that Bailey has at her table: 9 dimes and about 40 pennies (or paper strips and beans), 6 paper plates, paper and a pencil, her book. Keep your whiteboard on camera with the four steps on it.", "say": "\"You already know every step of long division. Today there is one new thing at the very end: what is left over. That's it.\"", "ask": "\"What is 50 ÷ 8?\" (6 R 2.) \"You did leftovers with facts in Lesson 10. Today they show up in long division.\""}}, {"type": "talk", "kick": "Book Talk", "title": "Back to Berk", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["Tell what happened in the part you read this weekend.", "Find a moment when Toothless is <b>stubborn</b>. What does Hiccup do about it?", "Does Hiccup give up when things go wrong? Prove it with an event."], "starters": ["This weekend, …", "Toothless is stubborn when … Hiccup …", "Hiccup does / does not give up. For example, …"], "notes": {"do": "6 minutes. Let her hold the book up to the camera and read a line.", "ask": "\"What does Hiccup do when Toothless will not listen?\"", "listen": "A real moment from the book and Hiccup's response. Connect it: \"When a problem is stubborn, you don't quit; you try one step at a time.\""}}, {"type": "recall", "kick": "Warm-up", "title": "Facts you will need today", "text": "Say the answer out loud. Jonathan types it.", "items": [{"type": "fill", "q": "What is the biggest 4s fact that is <b>not more than 17</b>? 4 × 4 = ____", "answers": ["16"], "why": "4 × 4 = 16. 4 × 5 = 20 is more than 17.", "no": "4 × 5 = 20 is too big."}, {"type": "fill", "q": "<b>17 − 16</b> = ____", "answers": ["1", "one"], "why": "17 − 16 = 1.", "no": "Count up from 16 to 17."}, {"type": "fill", "q": "<b>45 ÷ 7</b> = ____ &nbsp; (use R for the remainder)", "answers": ["6 R 3", "6R3", "6 r 3", "6 remainder 3", "6 rem 3", "6 r3"], "why": "7 × 6 = 42 and 45 − 42 = 3. So 45 ÷ 7 = 6 R 3.", "no": "7 × 6 = 42. How many are left?", "placeholder": "like 6 R 3"}], "notes": {"do": "She says each answer; you type it.", "say": "Praise each one: \"Yes! That is a step from today's first problem.\"", "listen": "The first two are exactly the last step of 97 ÷ 4. The third is the Lesson 10 idea she will need."}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Read each card out loud. Then use the word in your own sentence.", "words": [{"word": "leftover", "pos": "noun", "emoji": "🍪", "meaning": "What remains after the rest is used or shared. In division, it is the remainder.", "example": "97 cents on 4 plates: 24 cents each, and 1 cent is the <b>leftover</b>."}, {"word": "exceed", "pos": "verb", "emoji": "📈", "meaning": "To be more than something.", "example": "The remainder can never equal or <b>exceed</b> the divisor."}, {"word": "maximum", "pos": "adjective", "emoji": "🔝", "meaning": "The greatest that is possible or allowed.", "example": "When you divide by 6, the <b>maximum</b> remainder is 5."}, {"word": "revise", "pos": "verb", "emoji": "✏️", "meaning": "To change something to make it correct or better.", "example": "My remainder was too big, so I <b>revised</b> my answer: one more group fit."}, {"word": "remnant", "pos": "noun", "emoji": "🧩", "meaning": "A small part that is left over from something bigger.", "example": "Only a <b>remnant</b> of the fish pile was left after the dragons ate."}, {"word": "stubborn", "pos": "adjective", "emoji": "🐲", "meaning": "Not willing to change your mind or do what others want.", "example": "Toothless is <b>stubborn</b>: he often refuses to do what Hiccup asks."}, {"word": "ample", "pos": "adjective", "emoji": "🧺", "meaning": "More than enough.", "example": "We packed <b>ample</b> snacks, so nobody was hungry on the long trip."}], "notes": {"do": "Flip one card at a time. She reads each one and makes her own sentence. Write <b>remainder &lt; divisor</b> on your whiteboard and keep it on camera.", "say": "\"Leftover, remnant, exceed, maximum and revise are all about remainders. Stubborn and ample are for the book and for life.\"", "ask": "\"What is the maximum number of cookies you could have left if you share with 5 friends equally?\" (4.) \"When is Toothless stubborn?\"", "listen": "<i>Maximum</i>: the greatest allowed. <i>Exceed</i>: more than."}}, {"type": "learn", "kick": "Learn", "title": "When it does not come out even", "text": "Share <b>97 cents</b> on <b>4 plates</b>: 9 dimes and 7 pennies.", "steps": [{"text": "Share the dimes: 9 dimes on 4 plates. Each plate gets <b>2 dimes</b>. 1 dime is left."}, {"text": "Trade that dime for 10 pennies. Now there are 10 + 7 = <b>17 pennies</b>."}, {"text": "Share 17 pennies on 4 plates: <b>4 each</b>. 1 penny is left, and it cannot be shared."}, {"text": "Each plate has 24 cents, and 1 cent is left over: <b>97 ÷ 4 = 24 R 1</b>.", "visual": {"kind": "bigtext", "text": "24 R 1", "sub": "24 on each plate, 1 left over"}}], "tip": "The leftover is the remainder. It is too small to give every plate one more.", "notes": {"do": "Hands-on at home: she does each step with her coins on 4 plates before you reveal it.", "say": "Praise each step: \"2 dimes each, yes!\" \"17 pennies, yes!\"", "ask": "\"Why can't we share the last penny?\" (4 plates, 1 penny: not enough for everyone.)", "listen": "She sees the remainder is what can't be shared equally."}}, {"type": "learn", "kick": "Watch it", "title": "97 ÷ 4: the tens", "text": "Now the same thing with long division. One step at a time.", "visual": {"kind": "longdiv", "text": "\n   ___\n4 ) 97"}, "steps": [{"text": "<b>Divide.</b> How many 4s fit in 9? <b>2</b> (4 × 2 = 8; 4 × 3 = 12 is too big). Write 2 above the 9 in the tens place.", "visual": {"kind": "longdiv", "text": "    2\n   ___\n4 ) 97"}}, {"text": "<b>Multiply.</b> 2 × 4 = 8. Write 8 under the 9.", "visual": {"kind": "longdiv", "text": "    2\n   ___\n4 ) 97\n   -8\n   --"}}, {"text": "<b>Subtract.</b> 9 − 8 = 1. Check: 1 is smaller than 4.", "visual": {"kind": "longdiv", "text": "    2\n   ___\n4 ) 97\n   -8\n   --\n    1"}}], "notes": {"do": "She says each step and number before you click. She writes it on paper.", "say": "Praise each correct step out loud: \"Divide, 2. Yes!\" \"Multiply, 8. Yes!\" \"1 left, smaller than 4. Perfect.\"", "ask": "\"Where are those 2 dimes on your plates?\" (2 tens each.)"}}, {"type": "learn", "kick": "Watch it", "title": "97 ÷ 4: the ones", "text": "Bring down, divide, multiply, subtract. Then look at what is left.", "steps": [{"text": "<b>Bring down.</b> Bring down the 7 from the ones place. Now you have <b>17</b>.", "visual": {"kind": "longdiv", "text": "    2\n   ___\n4 ) 97\n   -8\n   --\n    17"}}, {"text": "<b>Divide.</b> How many 4s fit in 17? <b>4</b> (4 × 4 = 16; 4 × 5 = 20 is too big). Write 4 above the 7 in the ones place.", "visual": {"kind": "longdiv", "text": "    24\n   ___\n4 ) 97\n   -8\n   --\n    17"}}, {"text": "<b>Multiply.</b> 4 × 4 = 16. Write 16 under the 17.", "visual": {"kind": "longdiv", "text": "    24\n   ___\n4 ) 97\n   -8\n   --\n    17\n   -16\n   ---"}}, {"text": "<b>Subtract.</b> 17 − 16 = 1. Check: 1 is smaller than 4. There are no more digits to bring down, so <b>97 ÷ 4 = 24</b> R 1.", "visual": {"kind": "longdiv", "text": "    24 R1\n   ___\n4 ) 97\n   -8\n   --\n    17\n   -16\n   ---\n     1"}}, {"text": "<b>Check:</b> 24 × 4 = 96, and 96 + 1 = 97. It matches the dividend."}], "notes": {"do": "She keeps writing on paper.", "say": "\"Nothing left to bring down, and 1 is smaller than 4. That 1 is the remainder. We write R 1.\" Praise each step.", "listen": "\"There are no more digits, so the 1 is the remainder.\""}}, {"type": "learn", "kick": "Learn", "title": "Check it: multiply, then add", "text": "To check a division with a remainder, multiply the quotient by the divisor. Then <b>add the remainder</b>. You should get the dividend.", "visual": {"kind": "bigtext", "text": "quotient × divisor + remainder = dividend"}, "steps": [{"text": "<b>97 ÷ 4 = 24 R 1.</b> 24 × 4 = 96. 96 + 1 = 97 ✔"}, {"text": "<b>86 ÷ 3 = 28 R 2.</b> 28 × 3 = 84. 84 + 2 = 86 ✔"}], "tip": "Forgetting to add the remainder is the most common slip when checking.", "notes": {"do": "Write the rule on your whiteboard under <b>remainder &lt; divisor</b>.", "ask": "\"Why do we add the remainder back?\" (Those cents were left in your hand. They are still part of the 97.)", "listen": "She says the rule in her own words."}}, {"type": "learn", "kick": "Learn", "title": "The remainder rule", "text": "The remainder must always be <b>smaller than the divisor</b>. If it is not, one more group fits, and you need to revise.", "steps": [{"text": "Dividing by 7? The remainder can be 0, 1, 2, 3, 4, 5 or 6. The <b>maximum</b> is 6."}, {"text": "Snotlout wrote <b>59 ÷ 7 = 7 R 10</b>. 10 exceeds 7, so one more 7 fits."}, {"text": "<b>Revise:</b> 7 × 8 = 56, and 59 − 56 = 3. So 59 ÷ 7 = <b>8 R 3</b>."}], "tip": "Check the remainder after EVERY subtraction, not just the last one.", "notes": {"ask": "\"What is the maximum remainder when you divide by 9?\" (8.) \"By 2?\" (1.)", "listen": "Maximum remainder = divisor − 1. If she says 9 for ÷ 9, ask: \"With 9 left, could you make one more group of 9?\""}}, {"type": "tap", "kick": "Talk it through", "title": "Too big?", "text": "Say the answer out loud. Jonathan types or taps it.", "items": [{"type": "fill", "q": "When you divide by <b>6</b>, what is the biggest remainder you can ever have?", "answers": ["5", "five"], "why": "The remainder must be smaller than the divisor, so the maximum remainder for ÷ 6 is 5. A remainder of 6 would make one more group.", "no": "It must be smaller than 6."}, {"q": "Every answer below checks out when you multiply back. Which one can <b>not</b> be right?", "choices": ["45 ÷ 4 = 11 R 1", "38 ÷ 5 = 6 R 8", "50 ÷ 6 = 8 R 2", "29 ÷ 3 = 9 R 2"], "a": 1, "why": "In 38 ÷ 5 = 6 R 8, the remainder 8 is not smaller than 5, so another group fits. Revise it: 38 ÷ 5 = 7 R 3.", "no": ["1 is smaller than 4, so this remainder is allowed. Check: 11 × 4 + 1 = 45.", null, "2 is smaller than 6, so this remainder is allowed. Check: 8 × 6 + 2 = 50.", "2 is smaller than 3, so this remainder is allowed. Check: 9 × 3 + 2 = 29."]}, {"type": "fill", "q": "Check <b>67 ÷ 5 = 13 R 2</b>: &nbsp; 13 × 5 + 2 = ____", "answers": ["67"], "why": "13 × 5 = 65, and 65 + 2 = 67. It matches the dividend, so the answer is right.", "no": "Multiply 13 × 5 first. Then add the remainder 2."}], "notes": {"do": "She answers out loud; you type or tap.", "ask": "For the second one: \"How did you spot it without dividing?\" (8 is bigger than 5.)", "listen": "Check: 13 × 5 = 65, plus 2 = 67. If she says 65, point to the whiteboard rule: add the remainder."}}, {"type": "learn", "kick": "Watch it", "title": "853 ÷ 6: the hundreds", "text": "Now 3 digits. Same steps.", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 853"}, "steps": [{"text": "<b>Divide.</b> How many 6s fit in 8? <b>1</b> (6 × 1 = 6; 6 × 2 = 12 is too big). Write 1 above the 8 in the hundreds place.", "visual": {"kind": "longdiv", "text": "    1\n   ____\n6 ) 853"}}, {"text": "<b>Multiply.</b> 1 × 6 = 6. Write 6 under the 8.", "visual": {"kind": "longdiv", "text": "    1\n   ____\n6 ) 853\n   -6\n   --"}}, {"text": "<b>Subtract.</b> 8 − 6 = 2. Check: 2 is smaller than 6.", "visual": {"kind": "longdiv", "text": "    1\n   ____\n6 ) 853\n   -6\n   --\n    2"}}], "notes": {"do": "She says each step before you click and writes it on paper.", "say": "Praise each step.", "ask": "\"Estimate: 6 × 100 = 600 and 6 × 200 = 1,200. So the answer is between…?\" (100 and 200.)"}}, {"type": "learn", "kick": "Watch it", "title": "853 ÷ 6: the tens", "text": "Bring down, then the same steps.", "steps": [{"text": "<b>Bring down.</b> Bring down the 5 from the tens place. Now you have <b>25</b>.", "visual": {"kind": "longdiv", "text": "    1\n   ____\n6 ) 853\n   -6\n   --\n    25"}}, {"text": "<b>Divide.</b> How many 6s fit in 25? <b>4</b> (6 × 4 = 24; 6 × 5 = 30 is too big). Write 4 above the 5 in the tens place.", "visual": {"kind": "longdiv", "text": "    14\n   ____\n6 ) 853\n   -6\n   --\n    25"}}, {"text": "<b>Multiply.</b> 4 × 6 = 24. Write 24 under the 25.", "visual": {"kind": "longdiv", "text": "    14\n   ____\n6 ) 853\n   -6\n   --\n    25\n   -24\n   ---"}}, {"text": "<b>Subtract.</b> 25 − 24 = 1. Check: 1 is smaller than 6.", "visual": {"kind": "longdiv", "text": "    14\n   ____\n6 ) 853\n   -6\n   --\n    25\n   -24\n   ---\n     1"}}], "notes": {"say": "Praise each step. When she says 1 is smaller than 6, cheer: \"That check is how you never get a remainder that is too big.\""}}, {"type": "learn", "kick": "Watch it", "title": "853 ÷ 6: the ones", "text": "One more round. Then look at what is left.", "steps": [{"text": "<b>Bring down.</b> Bring down the 3 from the ones place. Now you have <b>13</b>.", "visual": {"kind": "longdiv", "text": "    14\n   ____\n6 ) 853\n   -6\n   --\n    25\n   -24\n   ---\n     13"}}, {"text": "<b>Divide.</b> How many 6s fit in 13? <b>2</b> (6 × 2 = 12; 6 × 3 = 18 is too big). Write 2 above the 3 in the ones place.", "visual": {"kind": "longdiv", "text": "    142\n   ____\n6 ) 853\n   -6\n   --\n    25\n   -24\n   ---\n     13"}}, {"text": "<b>Multiply.</b> 2 × 6 = 12. Write 12 under the 13.", "visual": {"kind": "longdiv", "text": "    142\n   ____\n6 ) 853\n   -6\n   --\n    25\n   -24\n   ---\n     13\n    -12\n    ---"}}, {"text": "<b>Subtract.</b> 13 − 12 = 1. Check: 1 is smaller than 6. There are no more digits to bring down, so <b>853 ÷ 6 = 142</b> R 1.", "visual": {"kind": "longdiv", "text": "    142 R1\n   ____\n6 ) 853\n   -6\n   --\n    25\n   -24\n   ---\n     13\n    -12\n    ---\n      1"}}, {"text": "<b>Check:</b> 142 × 6 = 852, and 852 + 1 = 853. It matches!"}], "notes": {"do": "She finishes on her paper and holds it up to the camera.", "ask": "\"Is 1 smaller than 6? Are there any digits left to bring down?\" (Yes; no. So R 1.)", "listen": "\"142 R 1\" and the check 852 + 1 = 853."}}, {"type": "tap", "kick": "Guided practice", "title": "Your turn on paper", "text": "Solve on paper. Say each step out loud. Then say the answer; Jonathan types it.", "items": [{"type": "fill", "q": "Use long division: <b>75 ÷ 4</b> = ____ &nbsp; (use R for the remainder)", "answers": ["18 R 3", "18R3", "18 r 3", "18 remainder 3", "18 rem 3", "18 r3"], "why": "75 ÷ 4 = 18 R 3. Check: 18 × 4 + 3 = 75.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 4s fit in 7?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n4 ) 75"}}, {"type": "fill", "q": "Use long division: <b>589 ÷ 5</b> = ____ &nbsp; (use R for the remainder)", "answers": ["117 R 4", "117R4", "117 r 4", "117 remainder 4", "117 rem 4", "117 r4"], "why": "589 ÷ 5 = 117 R 4. Check: 117 × 5 + 4 = 589.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 5s fit in 5?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n5 ) 589"}}], "notes": {"do": "She leads; you only ask \"Which step is next?\" if she stops.", "say": "Praise each step she gets right, out loud.", "listen": "75 ÷ 4 = 18 R 3 (check 72 + 3 = 75). 589 ÷ 5 = 117 R 4 (check 585 + 4 = 589)."}}, {"type": "tap", "kick": "Guided practice", "title": "Revise it", "items": [{"q": "Fishlegs wrote <b>83 ÷ 9 = 8 R 11</b>. The remainder is too big. Revise it. What is the right answer?", "choices": ["9 R 11", "8 R 0", "9 R 2", "8 R 10"], "a": 2, "why": "11 is not smaller than 9, so one more 9 fits: 9 × 9 = 81, and 83 − 81 = 2. So 83 ÷ 9 = 9 R 2.", "no": ["Check: 9 × 9 + 11 = 92, not 83.", "Check: 8 × 9 = 72, not 83. You cannot just drop a remainder.", null, "Check: 8 × 9 + 10 = 82, not 83."]}, {"type": "fill", "q": "<b>617 ÷ 3</b>. The work is done. What is the remainder?", "answers": ["2", "two"], "why": "After the last subtraction, 2 is left, and 2 is smaller than 3. So 617 ÷ 3 = 205 R 2.", "no": "Look at the very last number, after the last subtraction.", "visual": {"kind": "longdiv", "text": "    205\n   ____\n3 ) 617\n   -6\n   --\n    01\n    -0\n    --\n     17\n    -15\n    ---\n      2"}}], "notes": {"ask": "On Fishlegs: \"How do you know without dividing that it is wrong?\" (11 is bigger than 9.)", "listen": "617 ÷ 3 has a placeholder 0 AND a remainder: 205 R 2. Praise her if she notices the 0."}}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"q": "A dragon refuses to come down from the roof, no matter what anyone says. The dragon is being…", "choices": ["ample", "stubborn", "maximum", "revised"], "a": 1, "why": "<i>Stubborn</i> means not willing to change your mind or do what others want.", "no": ["Ample means more than enough.", null, "Maximum means the greatest possible or allowed.", "Revised means changed to be correct."]}, {"type": "fill", "q": "When you divide by 8, the ____ remainder is 7. (Use a word from your word cards.)", "answers": ["maximum"], "why": "The <i>maximum</i> is the greatest amount allowed.", "no": "It starts with max-."}, {"q": "The Vikings had <b>ample</b> fish for the feast. What does that mean?", "choices": ["They had no fish.", "They had just a few fish.", "They had more than enough fish.", "Their fish were stubborn."], "a": 2, "why": "<i>Ample</i> means more than enough.", "no": ["Ample is the opposite of none.", "A few is not more than enough.", null, "Fish are not stubborn; that word describes a person or a dragon."]}], "notes": {"ask": "\"Use <i>revise</i> in a sentence about your homework.\" \"Use <i>remnant</i> in a sentence about food.\"", "listen": "She uses each word correctly in her own sentence."}}, {"type": "tap", "kick": "Exit ticket", "title": "Show me before you go", "text": "Solve on your paper. No help this time. Say the answer; Jonathan types it.", "items": [{"type": "fill", "q": "Use long division: <b>86 ÷ 3</b> = ____ &nbsp; (use R for the remainder)", "answers": ["28 R 2", "28R2", "28 r 2", "28 remainder 2", "28 rem 2", "28 r2"], "why": "86 ÷ 3 = 28 R 2. Check: 28 × 3 + 2 = 86.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 3s fit in 8?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n3 ) 86"}}, {"type": "fill", "q": "Use long division: <b>749 ÷ 3</b> = ____ &nbsp; (use R for the remainder)", "answers": ["249 R 2", "249R2", "249 r 2", "249 remainder 2", "249 rem 2", "249 r2"], "why": "749 ÷ 3 = 249 R 2. Check: 249 × 3 + 2 = 749.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 3s fit in 7?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n3 ) 749"}}, {"type": "fill", "q": "Check <b>93 ÷ 4 = 23 R 1</b>: &nbsp; 23 × 4 + 1 = ____", "answers": ["93"], "why": "23 × 4 = 92, and 92 + 1 = 93. It matches the dividend, so the answer is right.", "no": "Multiply 23 × 4 first. Then add the remainder 1."}], "notes": {"do": "She works alone on paper. You stay quiet until she says the answer.", "listen": "86 ÷ 3 = 28 R 2; 749 ÷ 3 = 249 R 2; check 23 × 4 + 1 = 93. All three right means she is ready for tonight."}}, {"type": "learn", "kick": "Wrap-up", "title": "What you learned today", "text": "When long division does not come out even, the last leftover is the <b>remainder</b>. It is always smaller than the divisor. Check by multiplying and adding the remainder.", "steps": [{"text": "<b>Tonight:</b> the After-class lesson. It ends with Show What You Know. You need 90."}, {"text": "<b>Tonight:</b> read <i>How to Train Your Dragon</i> for 10 minutes."}, {"text": "<b>Tuesday or Wednesday:</b> the Reading Power lesson on your task list."}, {"text": "<b>Tuesday in person:</b> Lesson 17, what to do with a remainder in a story."}], "tip": "Keep your paper. Bring it on Tuesday.", "notes": {"do": "Open the course page on your screen share and show the Lesson 16 card and the short task list.", "say": "\"Tonight is short on purpose. The Lesson 16 practice and packet are on Tuesday's list.\"", "ask": "Exit question out loud: \"When you divide by 5, what is the maximum remainder?\" (4.)"}}], "win": "You found every leftover, kept it smaller than the divisor, and checked it!", "prev": "bb-bailey-L15", "prevTitle": "Lesson 15"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
