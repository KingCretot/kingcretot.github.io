<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 5: Pick the Fastest Path: 6s to 9s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L05", "label": "Lesson 5", "title": "Pick the Fastest Path: 6s to 9s", "goal": "I can pick the fastest shortcut for any 6, 7, 8 or 9 fact and prove my answer.", "date": "2026-10-29", "mastery": 90, "color": "#10AC84", "slides": [{"type": "hello", "title": "Pick the Fastest Path: 6s to 9s", "text": "In two weeks you collected <b>four tools</b> for the hard facts. Today you prove you can pick the <b>right tool</b> for each fact, fast, and explain why it works.", "visual": {"kind": "emoji", "text": "🧰 🐉 🏆"}}, {"type": "talk", "kick": "Book Talk", "title": "Which plan worked better?", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What happened in the part you read since Tuesday's lesson?", "Think of two different plans or ways characters tried to solve a problem. Which one worked better? Why?", "Hiccup does not have big muscles. What does he have instead that helps him most? Give a reason from the book."], "starters": ["Since Tuesday, …", "The better plan was … because …", "Hiccup's best tool is … For example, …"]}, {"type": "recall", "kick": "Remember?", "title": "Doubles and break-aparts", "items": [{"q": "What is <b>7 × 7</b>? Break the 7 into 5 + 2.", "choices": ["42", "45", "56", "49"], "a": 3, "why": "(5 × 7) + (2 × 7) = 35 + 14 = <b>49</b>.", "no": ["42 is 6 × 7. The bottom part is <b>2</b> sevens, so add 14, not 7.", "45 is 5 × 9. Use 35 + 14.", "56 is 8 × 7. That is one seven too many.", null]}, {"q": "Bailey knows 8 groups of 6 is 48. She takes <b>half of the groups</b>. Which fact does she get?", "choices": ["4 × 6 = 24", "4 × 3 = 12", "6 × 6 = 36"], "a": 0, "why": "Half of 8 groups is 4 groups of 6: <b>4 × 6 = 24</b>, which is half of 48.", "no": [null, "Only the number of groups was halved. Each group still has 6.", "Half of 8 groups is 4 groups, not 6. And half of 48 is 24, not 36."]}, {"q": "Which word means <b>to break a number into smaller parts</b>?", "choices": ["reassemble", "decompose", "fragment"], "a": 1, "why": "To <b>decompose</b> 7 is to break it into 5 + 2.", "no": ["Reassemble is the opposite: putting the parts back together.", null, "A fragment is a broken piece, but the action word for breaking a number apart is decompose."]}]}, {"type": "vocab", "kick": "Word Power", "title": "Seven words for today", "text": "Tap each card to flip it. Read it out loud. Then tell Jonathan a sentence of your own.", "words": [{"word": "missing factor", "pos": "noun", "meaning": "the factor you have to find when the product is already given", "example": "In 9 × ? = 63, the <b>missing factor</b> is 7.", "emoji": "❓"}, {"word": "operation", "pos": "noun", "meaning": "a math action: add, subtract, multiply, or divide", "example": "Equal groups tell me the <b>operation</b> is multiplication.", "emoji": "➕"}, {"word": "versatile", "pos": "adjective", "meaning": "able to be used in many different ways", "example": "Doubling is a <b>versatile</b> tool: it works for ×2, ×4 and ×8.", "emoji": "🔧"}, {"word": "evaluate", "pos": "verb", "meaning": "to judge how good something is, or which choice is best", "example": "Hiccup had to <b>evaluate</b> each plan before he picked one.", "emoji": "⚖️"}, {"word": "demonstrate", "pos": "verb", "meaning": "to show clearly how something works or why it is true", "example": "I can <b>demonstrate</b> 8 × 6 = 48: 6, 12, 24, 48.", "emoji": "🧑‍🏫"}, {"word": "inventive", "pos": "adjective", "meaning": "good at thinking of new and clever ideas", "example": "An <b>inventive</b> Viking made a fish trap from a stick and a rope.", "emoji": "💡"}, {"word": "victorious", "pos": "adjective", "meaning": "having won a fight, a game, or a contest", "example": "The boys marched home <b>victorious</b> after the dragon test.", "emoji": "🏆"}]}, {"type": "tap", "kick": "Word Work", "title": "Use the words", "items": [{"q": "Hiccup's knife can cut rope, carve wood, and open shells. Which word best describes the knife?", "choices": ["victorious", "versatile", "operation", "inventive"], "a": 1, "why": "<b>Versatile</b> means it can be used in many different ways.", "no": ["Victorious describes someone who won. A knife cannot win.", null, "An operation is a math action like add or multiply.", "Inventive describes a <b>person</b> who thinks of new ideas. The knife is a tool that can do many jobs."]}, {"q": "Bailey says 7 × 9 = 63. Which answer best <b>demonstrates</b> that it is true?", "choices": ["\"I am pretty sure.\"", "\"63 is a big number, so it fits.\"", "\"7 tens is 70. Take away one 7: 70 − 7 = 63.\""], "a": 2, "why": "To <b>demonstrate</b> is to show clearly why it is true. The ×9 tool shows it.", "no": ["Being sure is a feeling, not a reason. Show how you know.", "Lots of facts are big numbers. That does not prove 63 is right.", null]}]}, {"type": "learn", "kick": "Learn", "title": "Your toolbox", "text": "Look at the factors first. Find the hard one (6, 7, 8 or 9). Then pick its tool.", "visual": {"kind": "passage", "text": "🔟 <b>×9</b>: ×10, then take away one group. &nbsp;9 × 4 → 40 − 4 = 36<br>🖐️ <b>×6</b>: ×5, then add one group. &nbsp;6 × 3 → 15 + 3 = 18<br>✌️ <b>×8</b>: double, double, double. &nbsp;8 × 5 → 10, 20, 40<br>🧩 <b>×7</b>: ×5 plus ×2. &nbsp;7 × 3 → 15 + 6 = 21"}, "tip": "If a fact has <b>two</b> hard factors, like 7 × 9, pick the tool with the <b>fewest steps</b>. A 9 is usually fastest: just one subtraction."}, {"type": "tap", "kick": "Evaluate", "title": "Pick the fastest path", "text": "All of these facts have more than one road. Evaluate each path and pick the best one.", "items": [{"q": "Which is the best path for <b>8 × 6</b>?", "choices": ["6 + 6 + 6 + 6 + 6 + 6 + 6 + 6", "6 → 12 → 24 → 48", "60 − 6 = 54"], "a": 1, "why": "Three doubles: 6 → 12 → 24 → <b>48</b>. Three steps, and you can check each one.", "no": ["That adds to 48, but it takes seven steps. That is where counting goes wrong.", null, "60 − 6 is the ×9 tool. It finds 9 × 6, not 8 × 6."]}, {"q": "<b>7 × 9</b> has a 7 <b>and</b> a 9. Which path is fastest?", "choices": ["(5 × 9) + (2 × 9) = 45 + 18", "7, 14, 21, 28, 35, 42, 49, 56, 63", "70 − 7 = 63"], "a": 2, "why": "Use the 9: seven tens is 70, take away one 7. One step: <b>63</b>.", "no": ["This works too and gives 63! But it needs two facts and a harder add. 70 − 7 is one step.", "Skip counting nine times works, but it is the slowest road and easy to lose your place.", null]}, {"q": "Which is the best path for <b>6 × 7</b>?", "choices": ["35 + 7 = 42", "36 + 7 = 43", "6 + 7 = 13"], "a": 0, "why": "Use the 6: five 7s is 35, plus one more 7 is <b>42</b>.", "no": [null, "36 is 6 × 6, not 5 × 7. Start with five 7s: 35.", "6 + 7 adds the factors. You need 6 groups of 7."]}]}, {"type": "learn", "kick": "Preview", "title": "Fact families", "text": "Three numbers can make <b>four facts</b>. That group is called a <b>fact family</b>. Division undoes multiplication.", "visual": {"kind": "triangle", "a": 7, "b": 8, "c": 56}, "steps": [{"text": "<b>7 × 8 = 56</b>"}, {"text": "<b>8 × 7 = 56</b> (the commutative property: switch the factors)"}, {"text": "<b>56 ÷ 8 = 7</b> (56 shared into 8 equal groups gives 7 in each)"}, {"text": "<b>56 ÷ 7 = 8</b> (56 shared into 7 equal groups gives 8 in each)"}], "tip": "Every multiplication fact you know is also a division fact you know. In two weeks you will use this a lot."}, {"type": "tap", "kick": "Try it", "title": "Families and missing numbers", "items": [{"q": "Which fact belongs to the <b>6, 9, 54</b> fact family?", "choices": ["54 ÷ 6 = 8", "9 + 6 = 15", "54 ÷ 9 = 6", "54 − 9 = 45"], "a": 2, "why": "54 ÷ 9 = 6 uses the same three numbers, and 9 × 6 = 54 proves it.", "no": ["54 ÷ 6 is 9, not 8. Check: 6 × 9 = 54.", "Fact families here are multiplication and division, not addition.", null, "That is true math, but subtraction is not part of this fact family, and 45 is not one of the three numbers."]}, {"q": "<b>7 × ? = 42</b>. What is the missing factor?", "choices": ["5", "6", "7", "8"], "a": 1, "why": "7 × 6 = 30 + 12 = 42. So the missing factor is <b>6</b>. (And 42 ÷ 7 = 6.)", "no": ["7 × 5 = 35. You need one more 7.", null, "7 × 7 = 49. That is too many.", "7 × 8 = 56. That is too many."]}, {"q": "Bailey knows 8 × 9 = 72. What does the <b>commutative</b> property give her for free?", "choices": ["72 ÷ 8 = 9", "9 × 8 = 72", "8 + 9 = 17"], "a": 1, "why": "Commutative means switch the order of the factors: <b>9 × 8 = 72</b>.", "no": ["That is in the same fact family, but it is division. Commutative means switching the factors.", null, "That adds. The commutative property here switches the factors in a multiplication."]}]}, {"type": "order", "kick": "Put it in order", "title": "Solve like a pro", "text": "Stoick sends <b>6 ships</b>. Each ship carries <b>9 sheep</b>. How many sheep? Tap the steps in order.", "steps": ["Read it and find the equal groups: 6 ships, 9 sheep each", "Write the fact: 6 × 9", "Pick the tool: it has a 9, so ×10 and take away one group", "Solve: 60 − 6 = 54", "Check with another tool: 5 × 9 = 45, and 45 + 9 = 54 ✔", "Answer with a label: 54 sheep"], "why": "Read, write the fact, pick the tool, solve, check, label. Two tools gave the same answer, so you know it is right.", "hint": "What do you do before you can write a fact? You have to read and find the groups."}, {"type": "tap", "kick": "Try it", "title": "Problems from Berk", "items": [{"q": "Fishlegs collects <b>6 dragon scales</b> a day for <b>7 days</b>. How many scales?", "choices": ["13", "48", "42", "36"], "a": 2, "why": "6 groups of 7: 35 + 7 = <b>42</b>. (Or 7 groups of 6: 30 + 12 = 42.)", "no": ["13 is 6 + 7. He collects 6 each day, so these are equal groups.", "48 is 6 × 8. There are 7 days.", null, "36 is 6 × 6. Count the days again: 7."]}, {"q": "Toothless ate <b>8 crabs</b>. A gargantuan sea dragon ate <b>7 times as many</b>. How many crabs did the sea dragon eat?", "choices": ["15", "56", "64", "49"], "a": 1, "why": "7 times as many as 8 is 7 × 8 = <b>56</b>.", "no": ["15 is 8 + 7. \"Times as many\" means multiply.", null, "64 is 8 × 8. The dragon ate 7 times as many.", "49 is 7 × 7. Toothless ate 8 crabs, not 7."]}, {"q": "Hiccup has <b>9 fish</b>. Fishlegs has <b>8 fish</b>. How many fish do they have in all?", "choices": ["72", "1", "81", "17"], "a": 3, "why": "These are not equal groups. It is two amounts put together, so add: 9 + 8 = <b>17</b>.", "no": ["72 is 9 × 8. Nobody has 9 groups of 8. Read again: two boys, two amounts.", "1 is 9 − 8. That tells how many more Hiccup has, not how many in all.", "81 is 9 × 9. There are no equal groups here.", null]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "What is <b>6 × 7</b>?", "choices": ["42", "36", "48", "49"], "a": 0, "why": "35 + 7 = 42."}, {"q": "What is <b>9 × 8</b>?", "choices": ["81", "72", "63", "64"], "a": 1, "why": "80 − 8 = 72."}, {"q": "<b>? × 8 = 64</b>. What is the missing factor?", "choices": ["7", "9", "8", "6"], "a": 2, "why": "8 × 8 = 64 (8, 16, 32, 64)."}, {"q": "Hiccup's knife can cut rope, carve wood, and open shells. The knife is <b>versatile</b>. What does that mean?", "choices": ["It is very old.", "It is too heavy to carry.", "It belongs to the chief.", "It can be used in many different ways."], "a": 3, "why": "Versatile means able to be used in many ways."}, {"q": "Which is the best path for <b>8 × 3</b>?", "choices": ["3 + 3 + 3 + 3 + 3 + 3 + 3 + 3", "3 → 6 → 12 → 24", "30 − 3 = 27"], "a": 1, "why": "Three doubles: 6, 12, 24. Three short steps."}, {"q": "Which fact is <b>NOT</b> in the <b>7, 9, 63</b> fact family?", "choices": ["9 × 7 = 63", "63 ÷ 7 = 9", "63 ÷ 9 = 7", "7 + 9 = 16"], "a": 3, "why": "7 + 9 = 16 is addition and does not use 63."}, {"q": "There are <b>7 boats</b> with <b>9 Vikings</b> in each boat. Which <b>operation</b> finds how many Vikings in all?", "choices": ["addition", "subtraction", "multiplication", "division"], "a": 2, "why": "Equal groups put together means multiplication: 7 × 9 = 63."}, {"q": "Stoick has <b>6 boxes</b> with <b>8 arrows</b> in each box, plus <b>5 loose arrows</b>. How many arrows in all?", "choices": ["53", "48", "19", "43"], "a": 0, "why": "6 × 8 = 48, then 48 + 5 = 53."}, {"q": "Bailey says 8 × 6 = 48. Which sentence <b>demonstrates</b> that she is right?", "choices": ["\"I just know it.\"", "\"6, 12, 24, 48. Three doubles is ×8.\"", "\"It is a big number.\"", "\"Fishlegs told me.\""], "a": 1, "why": "To demonstrate is to show clearly why it is true. Three doubles shows 8 × 6 = 48."}, {"q": "Snotlout says 7 × 6 = 48. Which is the best way to show he is wrong?", "choices": ["48 is an even number.", "48 is too big for a 7s fact.", "(5 × 6) + (2 × 6) = 30 + 12 = 42, so it is not 48.", "Nobody likes the 7s."], "a": 2, "why": "A break-apart proves 7 × 6 = 42."}]}], "win": "Victorious! You picked the fastest path every time.", "prev": "bb-bailey-L04", "prevTitle": "Lesson 4"});</script></body></html>
