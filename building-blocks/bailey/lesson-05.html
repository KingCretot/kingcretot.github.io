<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 5: Pick the Fastest Path: 6s to 9s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L05", "label": "Lesson 5", "title": "Pick the Fastest Path: 6s to 9s", "goal": "I can pick the fastest shortcut for any 6, 7, 8 or 9 fact and prove my answer.", "date": "2026-10-29", "mastery": 90, "color": "#10AC84", "slides": [{"type": "hello", "title": "Pick the Fastest Path on Your Own", "text": "In class you proved you can pick the right tool for any 6, 7, 8 or 9 fact. Now do it on your own. You will <b>type</b> most answers. Finish with Show What You Know.", "visual": {"kind": "emoji", "text": "🧰 🐉 ⌨️"}}, {"type": "learn", "kick": "Quick reminder", "title": "Your toolbox", "text": "Find the hard factor. Pick its tool.", "visual": {"kind": "passage", "text": "🔟 <b>×9</b>: ×10, take away one group. 9 × 4 → 40 − 4 = 36<br>🖐️ <b>×6</b>: ×5, add one group. 6 × 3 → 15 + 3 = 18<br>✌️ <b>×8</b>: double, double, double. 8 × 5 → 10, 20, 40<br>🧩 <b>×7</b>: ×5 plus ×2. 7 × 3 → 15 + 6 = 21"}, "tip": "Equal groups? Multiply. Two different amounts put together? Add."}, {"type": "vocab", "kick": "Word Power", "title": "Your 7 words", "text": "Flip each card one more time. Next you will <b>type</b> these words from memory.", "words": [{"word": "missing factor", "pos": "noun", "meaning": "the factor you have to find when the product is already given", "example": "In 9 × ? = 63, the <b>missing factor</b> is 7.", "emoji": "❓"}, {"word": "operation", "pos": "noun", "meaning": "a math action: add, subtract, multiply, or divide", "example": "Equal groups tell me the <b>operation</b> is multiplication.", "emoji": "➕"}, {"word": "versatile", "pos": "adjective", "meaning": "able to be used in many different ways", "example": "Doubling is a <b>versatile</b> tool: it works for ×2, ×4 and ×8.", "emoji": "🔧"}, {"word": "evaluate", "pos": "verb", "meaning": "to judge how good something is, or which choice is best", "example": "Hiccup had to <b>evaluate</b> each plan before he picked one.", "emoji": "⚖️"}, {"word": "demonstrate", "pos": "verb", "meaning": "to show clearly how something works or why it is true", "example": "I can <b>demonstrate</b> 8 × 6 = 48: 6, 12, 24, 48.", "emoji": "🧑‍🏫"}, {"word": "inventive", "pos": "adjective", "meaning": "good at thinking of new and clever ideas", "example": "An <b>inventive</b> Viking made a fish trap from a stick and a rope.", "emoji": "💡"}, {"word": "victorious", "pos": "adjective", "meaning": "having won a fight, a game, or a contest", "example": "The boys marched home <b>victorious</b> after the dragon test.", "emoji": "🏆"}]}, {"type": "tap", "kick": "Word Power", "title": "Type the word", "text": "Type the word that fits. Spell it carefully.", "items": [{"type": "fill", "q": "Which word means <i>a math action: add, subtract, multiply, or divide</i>?", "answers": ["operation"], "why": "An <b>operation</b> is a math action.", "no": "Look back at the word cards. It starts with <b>o</b>.", "hint": "op-er-a-tion"}, {"type": "fill", "q": "Which word means <i>to judge how good something is, or which choice is best</i>?", "answers": ["evaluate"], "why": "To <b>evaluate</b> is to judge which choice is best.", "no": "It starts with <b>e</b>.", "hint": "e-val-u-ate"}, {"type": "fill", "q": "Use one of your new words. Hiccup used a rope and a bent stick to make a fish trap. He is ____.", "answers": ["inventive"], "why": "<b>Inventive</b> means good at thinking of new and clever ideas.", "no": "Which word means good at new ideas?", "hint": "It starts with <b>in</b>."}, {"type": "fill", "q": "In 8 × ? = 48, the number you must find is called the ____ ____. (two words)", "answers": ["missing factor", "unknown factor"], "why": "The <b>missing factor</b> is the factor you find when the product is given. Here it is 6.", "no": "Two words. The second word is <b>factor</b>."}]}, {"type": "tap", "kick": "Mixed facts", "title": "Pick a tool, type the product", "text": "Use the fastest tool. No adding over and over!", "items": [{"type": "fill", "q": "9 × 9 = ____", "answers": ["81"], "why": "×10 take away one group: 90 − 9 = 81.", "no": "Use ×10 take away one group."}, {"type": "fill", "q": "6 × 7 = ____", "answers": ["42"], "why": "×5 plus one group: 35 + 7 = 42.", "no": "Use the 6: five 7s plus one more 7."}, {"type": "fill", "q": "8 × 7 = ____", "answers": ["56"], "why": "5, 6, 7, 8. Or 7 → 14 → 28 → 56.", "no": "Say 5, 6, 7, 8."}, {"type": "fill", "q": "7 × 4 = ____", "answers": ["28"], "why": "Double 7 twice: 14, 28. Or 20 + 8.", "no": "×4 is double, double."}]}, {"type": "tap", "kick": "Missing numbers", "title": "Factors and families", "text": "Type the missing number. Then verify it.", "items": [{"type": "fill", "q": "9 × ____ = 72", "answers": ["8"], "why": "9 × 8 = 80 − 8 = 72.", "no": "9 times what is 72?"}, {"type": "fill", "q": "____ × 7 = 42", "answers": ["6"], "why": "6 × 7 = 35 + 7 = 42.", "no": "What times 7 is 42?"}, {"type": "fill", "q": "Finish the family: 6 × 9 = 54, 9 × 6 = 54, 54 ÷ 6 = 9, 54 ÷ 9 = ____", "answers": ["6"], "why": "54 ÷ 9 = 6, because 9 × 6 = 54.", "no": "The family uses only 6, 9 and 54. Which one is missing?"}]}, {"type": "sort", "kick": "Sort it", "title": "Add or multiply?", "text": "Tap a story, then tap the right box. Ask: equal groups or not?", "buckets": ["✖️ Multiply<br><small>equal groups</small>", "➕ Add<br><small>two different amounts</small>"], "items": [{"text": "8 boxes with 6 eggs in each box", "b": 0, "why": "Every box has 6. Equal groups: 8 × 6 = 48.", "hint": "Does every box have the same number?"}, {"text": "Hiccup has 9 coins. Fishlegs has 7 coins.", "b": 1, "why": "Two different amounts: 9 + 7 = 16.", "hint": "Are these equal groups, or two amounts?"}, {"text": "7 weeks, with 7 days in each week", "b": 0, "why": "Every week has 7 days: 7 × 7 = 49.", "hint": "Does every week have the same number of days?"}, {"text": "Stoick has 6 shields and finds 8 more", "b": 1, "why": "Two amounts put together: 6 + 8 = 14.", "hint": "Is anything in equal groups?"}, {"text": "9 dragons with 4 legs each", "b": 0, "why": "Every dragon has 4 legs: 9 × 4 = 36.", "hint": "Does every dragon have the same number of legs?"}, {"text": "8 Vikings in one boat and 9 in another boat", "b": 1, "why": "The boats hold different amounts: 8 + 9 = 17.", "hint": "Do both boats hold the same number?"}], "done": "Equal groups → multiply. Different amounts put together → add."}, {"type": "talk", "kick": "Say it out loud", "title": "Teach someone at home", "text": "Find someone at home. Teach them for two minutes.", "prompts": ["Show them your four tools. Do one fact with each tool.", "<b>Demonstrate</b> the 7, 8, 56 fact family: say all four facts.", "Tell them about a time Hiccup was <b>victorious</b>, or <b>inventive</b>."], "starters": ["For ×9, I …", "7 × 8 = 56, 8 × 7 = 56, …", "Hiccup was victorious when …"]}, {"type": "tap", "kick": "Word problems", "title": "Problems from Berk", "text": "Equal groups or not? Then pick your tool.", "items": [{"type": "fill", "q": "Stoick sends 8 ships. Each ship carries 9 sheep. How many sheep?", "answers": ["72", "72 sheep"], "why": "8 × 9 = 80 − 8 = 72 sheep. (Or 9 → 18 → 36 → 72.)", "no": "8 equal groups of 9."}, {"type": "fill", "q": "Fishlegs has 7 jars with 6 beetles in each jar. Then he finds 9 more beetles. How many beetles now?", "answers": ["51", "51 beetles"], "why": "7 × 6 = 42 beetles. Then 42 + 9 = 51.", "no": "First find the beetles in the jars (7 × 6). Then add 9.", "hint": "7 × 6 = 42. Now add 9."}, {"q": "Which fact is <b>NOT</b> in the <b>8, 7, 56</b> fact family?", "choices": ["56 ÷ 7 = 8", "8 × 7 = 56", "56 ÷ 8 = 7", "56 − 8 = 48"], "a": 3, "why": "A fact family uses only 8, 7 and 56 with × and ÷. 56 − 8 = 48 is subtraction and brings in 48.", "no": ["7 × 8 = 56 proves it. It is in the family.", "It is in the family.", "8 × 7 = 56 proves it. It is in the family.", null]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "7 × 7 = ____", "answers": ["49"], "why": "Break one 7 into 5 + 2: 35 + 14 = 49.", "no": "Use the ×7 tool: five 7s plus two 7s."}, {"type": "fill", "q": "9 × 8 = ____", "answers": ["72"], "why": "80 − 8 = 72.", "no": "Use ×10 take away one group."}, {"type": "fill", "q": "____ × 8 = 64", "answers": ["8"], "why": "8 × 8 = 64 (8, 16, 32, 64).", "no": "What times 8 is 64?"}, {"q": "On a Viking ship, a rope is <b>versatile</b>. What does that mean?", "choices": ["It is very old.", "It is too heavy to carry.", "It belongs to the chief.", "It can be used for many different jobs."], "a": 3, "why": "Versatile means able to be used in many different ways: tying, pulling, climbing.", "no": ["Versatile is about many uses, not age.", "Versatile is about many uses, not weight.", "Versatile is about many uses, not who owns it.", null]}, {"q": "Which is the fastest path for <b>8 × 4</b>?", "choices": ["8 → 16 → 32", "4 + 4 + 4 + 4 + 4 + 4 + 4 + 4", "40 − 4 = 36", "(5 × 4) + 2"], "a": 0, "why": "Turn it around: 4 × 8 is only two doubles: 16, 32.", "no": [null, "That works but takes seven adds.", "That is the ×9 tool. It finds 9 × 4.", "That is not 8 × 4. The 2 was never multiplied."]}, {"q": "Which fact is <b>NOT</b> in the <b>7, 9, 63</b> fact family?", "choices": ["9 × 7 = 63", "63 ÷ 7 = 9", "7 × 63 = 9", "63 ÷ 9 = 7"], "a": 2, "why": "63 is the product, so it is never a factor. 7 × 63 is much bigger than 9.", "no": ["9 × 7 = 63 is in the family.", "63 ÷ 7 = 9 is in the family.", null, "63 ÷ 9 = 7 is in the family."]}, {"type": "fill", "q": "Hiccup shares 63 fish equally among 7 dragons. Which <b>operation</b> finds each dragon's share? Type <b>add</b>, <b>subtract</b>, <b>multiply</b> or <b>divide</b>.", "answers": ["divide", "division"], "why": "Sharing a total into equal groups is division: 63 ÷ 7 = 9, because 7 × 9 = 63.", "no": "He is sharing a total into equal groups."}, {"type": "fill", "q": "Stoick has 6 boxes with 9 arrows in each box, plus 5 loose arrows. How many arrows in all?", "answers": ["59", "59 arrows"], "why": "6 × 9 = 60 − 6 = 54. Then 54 + 5 = 59.", "no": "First find the arrows in the boxes (6 × 9). Then add the 5 loose ones."}, {"type": "fill", "q": "Which word means <i>to show clearly how something works or why it is true</i>?", "answers": ["demonstrate"], "why": "To <b>demonstrate</b> is to show clearly how something works or why it is true.", "no": "It starts with <b>d</b>."}, {"q": "Snotlout says 7 × 6 = 48. Which is the best way to show he is wrong?", "choices": ["48 is an even number.", "48 is too big for a 7s fact.", "(5 × 6) + (2 × 6) = 30 + 12 = 42, so it is not 48.", "48 ends in 8."], "a": 2, "why": "A break-apart proves 7 × 6 = 42.", "no": ["42 is even too. Being even doesn't prove it wrong.", "7 × 8 = 56 is a 7s fact bigger than 48. Size doesn't prove it.", null, "Ending in 8 doesn't prove anything. Work out the fact."]}], [{"type": "fill", "q": "7 × 9 = ____", "answers": ["63"], "why": "Use the 9: 70 − 7 = 63.", "no": "Use the 9: ×10, take away one group of 7."}, {"type": "fill", "q": "9 × 6 = ____", "answers": ["54"], "why": "60 − 6 = 54.", "no": "Use ×10 take away one group."}, {"type": "fill", "q": "7 × ____ = 56", "answers": ["8"], "why": "7 × 8 = 56: 5, 6, 7, 8.", "no": "7 times what is 56?"}, {"q": "Which Viking is the most <b>inventive</b>?", "choices": ["Snotlout copies whatever the others do.", "Gobber builds a brand-new kind of saddle so riders can fly.", "Fishlegs reads the same page again.", "Stoick shouts the loudest."], "a": 1, "why": "Inventive means good at thinking of new and clever ideas. A brand-new saddle is a new idea.", "no": ["Copying is the opposite of a new idea.", null, "Reading again is careful, but it is not a new idea.", "Shouting is loud, not inventive."]}, {"q": "Which is the fastest path for <b>9 × 3</b>?", "choices": ["3 + 3 + 3 + 3 + 3 + 3 + 3 + 3 + 3", "30 − 3 = 27", "3 → 6 → 12 → 24", "(5 × 3) + (2 × 3)"], "a": 1, "why": "Use the 9: ten 3s is 30, take away one 3. One step: 27.", "no": ["That works, but nine adds is the slowest road.", null, "Three doubles is the ×8 tool. That finds 8 × 3 = 24.", "That is the ×7 tool. It finds 7 × 3 = 21."]}, {"q": "Which fact is in the <b>7, 6, 42</b> fact family?", "choices": ["42 ÷ 6 = 7", "42 − 6 = 36", "7 + 6 = 13", "6 × 42 = 7"], "a": 0, "why": "42 ÷ 6 = 7 uses the same three numbers. 6 × 7 = 42 proves it.", "no": [null, "Subtraction is not in this fact family, and 36 is not one of the numbers.", "Addition is not in this fact family.", "42 is the product, so it is never a factor."]}, {"type": "fill", "q": "8 dragons each eat 9 fish. Which <b>operation</b> finds how many fish they eat in all? Type <b>add</b>, <b>subtract</b>, <b>multiply</b> or <b>divide</b>.", "answers": ["multiply", "multiplication", "times"], "why": "Each dragon eats 9: equal groups. Multiply: 8 × 9 = 72.", "no": "Each dragon eats the same amount. Equal groups or not?"}, {"type": "fill", "q": "Fishlegs has 7 bags with 7 rocks in each bag, plus 6 loose rocks. How many rocks in all?", "answers": ["55", "55 rocks"], "why": "7 × 7 = 35 + 14 = 49. Then 49 + 6 = 55.", "no": "First find the rocks in the bags (7 × 7). Then add 6."}, {"type": "fill", "q": "Which word means <i>having won a fight, a game, or a contest</i>?", "answers": ["victorious"], "why": "<b>Victorious</b> means having won.", "no": "It starts with <b>v</b>."}, {"q": "Fishlegs says 9 × 7 = 56. Which is the best way to show he is wrong?", "choices": ["56 is even.", "9 × 7 is a 9s fact, so it must end in 9.", "70 − 7 = 63, so 9 × 7 is 63, not 56.", "56 is too big."], "a": 2, "why": "The ×9 tool proves 9 × 7 = 63. (56 is 7 × 8.)", "no": ["Even numbers can be 9s facts too, like 72. That doesn't prove it.", "9 × 7 = 63 ends in 3. That rule is false.", null, "56 is too small, not too big. 9 × 7 = 63."]}], [{"type": "fill", "q": "6 × 8 = ____", "answers": ["48"], "why": "40 + 8 = 48. Or 6 → 12 → 24 → 48.", "no": "Use ×5 plus one group, or three doubles."}, {"type": "fill", "q": "8 × 8 = ____", "answers": ["64"], "why": "8 → 16 → 32 → 64.", "no": "Double 8 three times."}, {"type": "fill", "q": "____ × 9 = 81", "answers": ["9"], "why": "9 × 9 = 90 − 9 = 81.", "no": "What times 9 is 81? Try the ×9 tool."}, {"q": "Hiccup must <b>evaluate</b> two plans. What does he do?", "choices": ["He tries both plans at the same time.", "He forgets about both plans.", "He writes the plans in a secret code.", "He judges which plan is better."], "a": 3, "why": "To evaluate is to judge how good something is, or which choice is best.", "no": ["Trying both is not judging them.", "Forgetting is not judging.", "Writing in code is not judging.", null]}, {"q": "Which is the fastest path for <b>7 × 8</b>?", "choices": ["8 + 8 + 8 + 8 + 8 + 8 + 8", "Say 5, 6, 7, 8: 56", "70 − 8 = 62", "8 → 16 → 32 → 64"], "a": 1, "why": "5, 6, 7, 8: 56 = 7 × 8. One step to remember.", "no": ["That works but takes six adds.", null, "That mixes up the ×9 tool. It is wrong.", "That doubles the 8, which finds 8 × 8."]}, {"q": "Which fact is <b>NOT</b> in the <b>8, 9, 72</b> fact family?", "choices": ["72 ÷ 9 = 8", "9 × 8 = 72", "72 ÷ 8 = 8", "8 × 9 = 72"], "a": 2, "why": "72 ÷ 8 = 9, not 8. That fact is false.", "no": ["9 × 8 = 72 proves it. It is in the family.", "It is in the family.", null, "It is in the family."]}, {"type": "fill", "q": "Stoick has 7 shields. Gobber has 9 shields. Which <b>operation</b> finds how many shields they have in all? Type <b>add</b>, <b>subtract</b>, <b>multiply</b> or <b>divide</b>.", "answers": ["add", "addition", "plus"], "why": "Two different amounts put together. Not equal groups, so add: 7 + 9 = 16.", "no": "Are these equal groups, or two different amounts?"}, {"type": "fill", "q": "Gobber has 9 racks with 6 axes on each rack. He sells 4 axes. How many axes are left?", "answers": ["50"], "why": "9 × 6 = 54 axes. Then 54 − 4 = 50.", "no": "First find all the axes (9 × 6). Then take away 4."}, {"type": "fill", "q": "Which word means <i>able to be used in many different ways</i>?", "answers": ["versatile"], "why": "<b>Versatile</b> means able to be used in many different ways.", "no": "It starts with <b>v</b>."}, {"q": "In <b>9 × ? = 63</b>, what is the <b>missing factor</b>?", "choices": ["63", "9", "7", "70"], "a": 2, "why": "9 × 7 = 70 − 7 = 63, so the missing factor is 7.", "no": ["63 is the product, not the missing factor.", "9 is the factor you already have.", null, "70 is 7 × 10, the first step of the ×9 tool. Take away one 7 to get 63."]}]]}], "win": "Victorious! You picked the fastest path every time.", "prev": "bb-bailey-L04", "prevTitle": "Lesson 4"});</script></body></html>
