<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 11: Share or Group? Prove It!</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L11", "label": "Lesson 11", "title": "Share or Group? Prove It!", "goal": "I can tell if a story is sharing or grouping, find the missing number, and confirm my answer by multiplying.", "date": "2026-11-12", "mastery": 90, "color": "#E67E22", "slides": [{"type": "hello", "title": "Share or Group? Prove It!", "text": "This week you learned that division undoes multiplication, met fact families, and found leftovers. Today you <b>prove it</b>: figure out what a story is asking, find missing numbers, and check every answer by multiplying.", "visual": {"kind": "emoji", "text": "🕵️🐉✔️"}, "notes": {"do": "Set out: about 65 beans (63 are needed for the Toothless story), 8 cups, whiteboard, her fact family cards from Lessons 9 and 10, and 6 sticky notes (3 say Sharing, 3 say Grouping).", "say": "\"Prove-it day. No new big idea, just one new habit: you never trust an answer until you check it.\"", "ask": "\"How did Tuesday's Show What You Know go? Did the Lesson 9 packet feel easy or hard?\" (Check her scores and the packet before class.)"}}, {"type": "talk", "kick": "Book Talk", "title": "The big problem", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What is the biggest problem in the part you read? Who or what is Hiccup up against?", "Hiccup is not the biggest or strongest Viking. What does he use instead to solve problems? Give an example.", "Pick a word from this week (ration, provisions, scarce, surplus, hesitate, negotiate) that fits a moment in the story. Explain why it fits."], "starters": ["The biggest problem is …", "Instead of strength, Hiccup uses …", "The word … fits when … because …"], "notes": {"do": "7 minutes. This is the last book talk before the break, so ask her where she will be in the book by Lesson 12.", "ask": "\"Hiccup is not the strongest Viking. What does he use instead? Give one example.\" Then the word prompt: she picks a week word that fits a real moment.", "listen": "She names a skill (thinking, studying dragons, talking to Toothless) and backs it with an event. For the word prompt, the moment must actually fit the meaning."}}, {"type": "recall", "kick": "Remember?", "title": "This week so far", "items": [{"type": "fill", "q": "<b>34 ÷ 8</b> = ____ &nbsp; (use R for the remainder)", "answers": ["4 R 2", "4 remainder 2", "4 rem 2"], "why": "8 × 4 = 32 and 34 − 32 = 2. So 34 ÷ 8 = 4 R 2.", "no": "Find the biggest 8s fact under 34.", "placeholder": "like 4 R 2"}, {"q": "Which word means <i>an extra amount, more than needed</i>?", "choices": ["scarce", "surplus", "quotient", "hesitate"], "a": 1, "why": "A <i>surplus</i> is extra.", "no": ["Scarce means very little, the opposite.", null, "The quotient is the answer to a division.", "Hesitate means to stop for a moment."]}, {"q": "72 ÷ 9 = 8 is in a fact family. Which fact is in the same family?", "choices": ["9 ÷ 72 = 8", "72 − 9 = 63", "72 ÷ 8 = 9", "8 × 8 = 64"], "a": 2, "why": "The family is 8, 9 and 72: 72 ÷ 8 = 9.", "no": ["Backward. The biggest number comes first.", "Subtraction is not in this family.", null, "That uses 64, not 72."]}], "notes": {"ask": "\"Why is 2 the remainder and not 10?\" (10 is bigger than 8; another group fits.)", "listen": "She explains every answer out loud. Quick and confident here means Tuesday stuck."}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read it out loud. Then use it to describe something you did this week.", "words": [{"word": "confirm", "pos": "verb", "emoji": "✔️", "meaning": "To show for sure that something is true or right.", "example": "I <b>confirm</b> 72 ÷ 8 = 9 by multiplying: 9 × 8 = 72."}, {"word": "unknown", "pos": "noun", "emoji": "❓", "meaning": "The missing number you need to find in a problem.", "example": "In ? ÷ 8 = 9, the <b>unknown</b> is 72."}, {"word": "divisible", "pos": "adjective", "emoji": "🧩", "meaning": "Able to be divided by a number with nothing left over.", "example": "56 is <b>divisible</b> by 8, but 58 is not."}, {"word": "interpret", "pos": "verb", "emoji": "🔍", "meaning": "To figure out what something means.", "example": "<b>Interpret</b> the story: is it sharing, or making groups?"}, {"word": "decipher", "pos": "verb", "emoji": "🗝️", "meaning": "To figure out something that is hard to read or understand, like a code.", "example": "Hiccup could <b>decipher</b> Dragonese, the language of dragons."}, {"word": "precise", "pos": "adjective", "emoji": "🎯", "meaning": "Exactly right, with every detail correct.", "example": "Be <b>precise</b>: 45 ÷ 6 is 7 R 3, not just \"about 7\"."}, {"word": "daunting", "pos": "adjective", "emoji": "⛰️", "meaning": "Seeming hard or scary to do, before you start.", "example": "Big division problems look <b>daunting</b>, but one fact at a time makes them easy."}], "notes": {"do": "She reads each card and uses it to describe something from this week. Write <b>confirm</b> and <b>unknown</b> on the whiteboard.", "say": "\"Three of these words are about being a detective: interpret, decipher, confirm. That is what you are today.\"", "ask": "\"Which number is <i>divisible</i> by 8: 48 or 50? How do you know?\" \"Tell me something that felt <i>daunting</i> this week, and what you did about it.\"", "listen": "<i>Divisible</i> = nothing left over (connect to Tuesday's remainders). For <i>daunting</i>, steer her to say what she DID, not just that it was hard."}}, {"type": "learn", "kick": "Learn", "title": "Two kinds of division stories", "text": "A division story gives you the <b>total</b> and one more number. <b>Interpret</b> the story: what does the other number tell you?", "steps": [{"text": "<b>Sharing:</b> 42 dragon eggs are shared equally among 7 nests. You know the number of <b>groups</b> (7 nests). Find how many in <b>each</b>.", "visual": {"kind": "groups", "groups": 7, "each": 6, "emoji": "🥚", "label": "7 nests, 6 eggs in each"}}, {"text": "<b>Grouping:</b> 42 dragon eggs, 7 in each nest. You know how many go in <b>each</b> (7). Find how many <b>groups</b>.", "visual": {"kind": "groups", "groups": 6, "each": 7, "emoji": "🥚", "label": "6 nests, 7 eggs in each"}}, {"text": "Both are <b>42 ÷ 7 = 6</b>. Only the label changes: 6 eggs in each nest, or 6 nests."}], "tip": "Sharing story? The answer is <b>how many in each</b>. Grouping story? The answer is <b>how many groups</b>.", "notes": {"do": "Hands-on: 42 beans shared onto 7 plates (she puts a Sharing sticky note on it). Then 42 beans in piles of 7 (Grouping sticky note). Leave both setups on the table.", "say": "\"Monday you called these 'how many in each' and 'how many groups'. Today they get short names: sharing and grouping.\"", "ask": "\"In both setups, what did the 7 tell you?\" (Sharing: 7 groups. Grouping: 7 in each.)", "listen": "\"The other number is either the groups or the size of each group.\""}}, {"type": "tap", "kick": "Talk it through", "title": "Sharing or grouping?", "text": "Read each story out loud. Decide. Then act one out with beans.", "items": [{"type": "fill", "q": "Stoick splits 54 arrows equally among 9 warriors. How many does each warrior get? Type <b>sharing</b> or <b>grouping</b>.", "answers": ["sharing", "share"], "why": "You know the groups (9 warriors). You find how many each gets.", "no": "Is 9 the number of warriors, or the arrows each one gets?"}, {"type": "fill", "q": "Hiccup ties 54 arrows into bundles of 9. How many bundles? Type <b>sharing</b> or <b>grouping</b>.", "answers": ["grouping", "group", "groups"], "why": "You know the size of each bundle (9). You find how many bundles.", "no": "Is 9 the number of bundles, or how many go in each bundle?"}, {"type": "fill", "q": "Toothless eats 7 fish a day. How many days will 63 fish last? Type <b>sharing</b> or <b>grouping</b>.", "answers": ["grouping", "group", "groups"], "why": "Each day is a group of 7 fish. You find how many days (groups).", "no": "7 fish go in each day. What are you finding?"}, {"type": "fill", "q": "63 fish are split evenly over 7 days. How many fish each day? Type <b>sharing</b> or <b>grouping</b>.", "answers": ["sharing", "share"], "why": "You know there are 7 days (groups). You find how many in each.", "no": "Do you know how many days there are?"}], "notes": {"do": "She acts out the Toothless story with beans: 63 beans, one pile of 7 per day. Then the last story with 7 plates. Same beans, two stories.", "ask": "\"What does your answer count: fish, or days?\"", "listen": "The Toothless one is the hardest: \"a day\" hides the group. If she says sharing, ask: \"Do you know how many days? Or how many fish in each day?\""}}, {"type": "learn", "kick": "Learn", "title": "Confirm it: check by multiplying", "text": "A good mathematician does not trust an answer until it is <b>confirmed</b>. Multiply the quotient by the divisor. You should get back the dividend.", "visual": {"kind": "bigtext", "text": "quotient × divisor (+ remainder) = dividend"}, "steps": [{"text": "<b>72 ÷ 8 = 9?</b> 9 × 8 = 72 ✔ It matches, so it is right."}, {"text": "Snotlout wrote <b>54 ÷ 6 = 8</b>. Check: 8 × 6 = 48. 48 is not 54 ✘. Try 9: 9 × 6 = 54 ✔. So 54 ÷ 6 = 9."}, {"text": "With a remainder: <b>43 ÷ 8 = 5 R 3</b>. Check: 5 × 8 = 40, then 40 + 3 = 43 ✔", "visual": {"kind": "bigtext", "text": "5 × 8 + 3 = 43"}}], "tip": "If the check does not give you the dividend, the answer is wrong. Fix it before you move on.", "notes": {"do": "Write the rule on the whiteboard: quotient × divisor (+ remainder) = dividend. Leave it up.", "ask": "On the remainder step: \"Where did the 3 go? Why do we add it back?\" (Those beans were left in your hand; they are still part of the 43.)", "listen": "She can say the rule back in her own words: \"Multiply my answer by what I divided by, add the leftovers, and I should get the start number.\""}}, {"type": "tap", "kick": "Guided practice", "title": "Check it, fix it", "items": [{"q": "Hiccup says <b>56 ÷ 7 = 9</b>. Check it by multiplying. What do you find?", "choices": ["He is right: 9 × 7 = 56", "He is wrong: 9 × 7 = 63, so 56 ÷ 7 = 8", "He is wrong: 56 ÷ 7 = 7", "He is right: 56 − 7 = 49"], "a": 1, "why": "9 × 7 = 63, not 56. 8 × 7 = 56, so 56 ÷ 7 = 8.", "no": ["Check that fact: 9 × 7 = 63.", null, "7 × 7 = 49, not 56.", "Subtracting does not check division."]}, {"type": "fill", "q": "Fishlegs wrote <b>44 ÷ 7 = 6 R 2</b>. Check it: 6 × 7 + 2 = ____", "answers": ["44"], "why": "6 × 7 = 42 and 42 + 2 = 44. It matches the dividend, so he is right.", "no": "Multiply 6 × 7 first, then add the 2."}, {"q": "Only one of these is correct. Check each one. Which is it?", "choices": ["48 ÷ 8 = 7", "36 ÷ 6 = 7", "54 ÷ 9 = 7", "63 ÷ 7 = 9"], "a": 3, "why": "9 × 7 = 63, so 63 ÷ 7 = 9 is confirmed.", "no": ["Check: 7 × 8 = 56, not 48.", "Check: 7 × 6 = 42, not 36.", "Check: 7 × 9 = 63, not 54.", null]}], "notes": {"do": "She writes each check on the whiteboard before she answers.", "say": "\"Out loud, every time: my answer times the divisor, plus the leftovers.\"", "listen": "On the 44 ÷ 7 item, a common slip is forgetting to add the remainder and saying 42. Point to the rule on the board."}}, {"type": "learn", "kick": "Learn", "title": "The unknown can hide anywhere", "text": "In a division fact, the <b>unknown</b> can be the dividend, the divisor or the quotient. Use the fact family to find it.", "steps": [{"text": "<b>? ÷ 8 = 9</b>. The dividend is missing. It is the biggest number: 9 × 8 = <b>72</b>.", "visual": {"kind": "triangle", "a": 8, "b": 9, "c": "?"}}, {"text": "<b>63 ÷ ? = 9</b>. The divisor is missing. Ask: 9 × what = 63? 9 × 7 = 63, so the unknown is <b>7</b>.", "visual": {"kind": "triangle", "a": "?", "b": 9, "c": 63}}, {"text": "Confirm both: 72 ÷ 8 = 9 ✔ and 63 ÷ 7 = 9 ✔"}], "tip": "Ask first: which number is missing, the dividend, the divisor or the quotient?", "notes": {"do": "She covers the matching corner on one of her fact family cards for each step.", "ask": "\"Which part is missing: the dividend, the divisor or the quotient?\" \"If the dividend is missing, do we multiply or divide?\" (multiply).", "listen": "The trap is adding (8 + 9 = 17). If she adds, ask: \"Which number in a family is always the biggest?\""}}, {"type": "tap", "kick": "Guided practice", "title": "Find the unknown", "items": [{"type": "fill", "q": "<b>? ÷ 7 = 6</b>. What is the unknown?", "answers": ["42"], "why": "The dividend is quotient × divisor: 6 × 7 = 42. Confirm: 42 ÷ 7 = 6.", "no": "The dividend is missing. Multiply.", "hint": "6 × 7 = ?"}, {"type": "fill", "q": "<b>56 ÷ ? = 8</b>. What is the unknown?", "answers": ["7", "seven"], "why": "8 × 7 = 56, so 56 ÷ 7 = 8.", "no": "Ask: 8 × what = 56?"}, {"q": "A fact family has the numbers <b>7</b> and <b>56</b>. What is the third number?", "choices": ["49", "63", "8", "392"], "a": 2, "why": "7 × 8 = 56, so the family is 7, 8 and 56.", "no": ["49 is 56 − 7.", "63 is 56 + 7.", null, "392 is 7 × 56. The big number is already 56."]}], "notes": {"ask": "For each: \"Which part is missing?\" before she answers.", "listen": "She names the part and the operation: \"dividend missing, so I multiply.\""}}, {"type": "order", "kick": "Put in order", "title": "Division detective steps", "text": "Tap the steps in the order you use them for a division story.", "steps": ["Read the whole story.", "Interpret: is it sharing or grouping?", "Write the division: total ÷ the number you know", "Think of the multiplication fact", "Confirm by multiplying", "Write the confirmed answer with a label (fish, nests, days)"], "why": "Read, interpret, divide, use a fact, confirm, then label the confirmed answer. That is the whole routine.", "hint": "You cannot divide until you know what the story asks. What comes before writing the division?", "notes": {"do": "She says all six steps from memory before tapping. Write them as she says them on the whiteboard; they stay up for the story problems.", "ask": "\"Why does confirming come before writing the answer with a label?\"", "listen": "Read, interpret, divide, fact, confirm, label."}}, {"type": "tap", "kick": "Guided practice", "title": "Story problems", "text": "Use the detective steps out loud on each one.", "items": [{"type": "fill", "q": "The Hooligans have <b>72 shields</b>. They hang <b>8</b> on each ship. How many ships get shields?", "answers": ["9", "9 ships", "nine"], "why": "Grouping: 72 ÷ 8 = 9 ships. Confirm: 9 × 8 = 72.", "no": "Interpret first: is 8 the ships, or the shields on each ship?"}, {"q": "Hiccup trains <b>9 dragons</b>. He has <b>81 treats</b> to share equally. How many treats does each dragon get?", "choices": ["72", "90", "8", "9"], "a": 3, "why": "Sharing: 81 ÷ 9 = 9 treats each. Confirm: 9 × 9 = 81.", "no": ["72 is 81 − 9.", "90 is 81 + 9.", "9 × 8 = 72, not 81.", null]}, {"q": "Fishlegs has <b>59 rocks</b>. He puts <b>9</b> in each bag. How many bags can he fill, and how many rocks are left?", "choices": ["7 bags, 4 left", "5 bags, 14 left", "6 bags, 5 left", "50 bags, 0 left"], "a": 2, "why": "9 × 6 = 54 and 59 − 54 = 5. So 59 ÷ 9 = 6 R 5.", "no": ["9 × 7 = 63. That is more rocks than he has.", "14 left is more than 9. Another bag can be filled.", null, "50 is 59 − 9. That is subtracting, not dividing."]}], "notes": {"do": "She points to each detective step on the whiteboard as she uses it.", "ask": "\"Sharing or grouping?\" \"How do you confirm it?\" \"What is the label?\"", "listen": "A full answer sounds like: \"Grouping. 72 ÷ 8 = 9. 9 × 8 = 72, confirmed. 9 ships.\""}}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"q": "Hiccup worked hard to <b>decipher</b> what the dragon was saying. What was he doing?", "choices": ["making it louder", "figuring out what it meant", "copying it word for word", "ignoring it"], "a": 1, "why": "To <i>decipher</i> is to figure out something hard to understand.", "no": ["Deciphering is about understanding, not volume.", null, "Copying does not mean you understand it.", "Ignoring is the opposite of working to understand."]}, {"q": "Which sentence uses <b>divisible</b> correctly?", "choices": ["54 is divisible by 7, because 7 × 8 = 54.", "54 is divisible by 8, with 6 left over.", "54 is divisible by 9, because 9 × 6 = 54."], "a": 2, "why": "9 × 6 = 54 with nothing left over, so 54 is divisible by 9.", "no": ["Check: 7 × 8 = 56. 54 ÷ 7 = 7 R 5, so 54 is not divisible by 7.", "If something is left over, it is not divisible.", null]}, {"type": "fill", "q": "Be ____: 45 ÷ 6 is 7 R 3, not just \"about 7\". (Exactly right in every detail.) (Use a word from your word cards.)", "answers": ["precise"], "why": "<i>Precise</i> means exactly right, with every detail correct.", "no": "It starts with p."}], "notes": {"ask": "\"What clue in the sentence helped?\" Then: \"Use <i>daunting</i> in a sentence about the break.\"", "listen": "For <i>divisible</i>, she uses Tuesday's idea: no remainder."}}, {"type": "tap", "kick": "Exit ticket", "title": "Show me before you go", "text": "On your own. No help this time.", "items": [{"type": "fill", "q": "48 Vikings form 6 equal teams. How many on each team? Type <b>sharing</b> or <b>grouping</b>.", "answers": ["sharing", "share"], "why": "You know there are 6 teams (groups). You find how many on each.", "no": "Do you know how many teams there are?"}, {"type": "fill", "q": "<b>? ÷ 9 = 8</b>. What is the unknown?", "answers": ["72"], "why": "8 × 9 = 72. Confirm: 72 ÷ 9 = 8.", "no": "The dividend is missing. Multiply."}, {"type": "fill", "q": "Check <b>50 ÷ 7 = 7 R 1</b>: 7 × 7 + 1 = ____", "answers": ["50"], "why": "7 × 7 = 49 and 49 + 1 = 50. It matches, so the answer is confirmed.", "no": "Multiply 7 × 7 first, then add 1."}], "notes": {"do": "She types these herself. Note any miss: it tells you which part to review in Lesson 12.", "listen": "All three right means she is ready for the after-class lesson and the break work."}}, {"type": "learn", "kick": "Wrap-up", "title": "Your break plan", "text": "The next lesson is <b>Lesson 12</b>, after a three-week break. Here is your plan, one week at a time.", "steps": [{"text": "<b>First week:</b> the After-class lesson for Lesson 11 (ends with Show What You Know), the Lesson 11 Practice, and page 2 of the Lesson 10 Packet."}, {"text": "<b>Second week:</b> the Lesson 11 Packet and Division Station, Lesson 4."}, {"text": "<b>Third week:</b> Division Station, Lesson 5."}, {"text": "<b>Every week:</b> read 15 minutes a day."}], "tip": "Keep your fact family cards. Quiz yourself when you have a spare minute.", "notes": {"do": "Open the course page and go through the Lesson 11 task list and the two Division Station links with her (and with Tia if she is there).", "say": "\"Three weeks, a little each week. Lesson 12 starts with a welcome-back review, so the cards and the practice will keep it fresh.\"", "ask": "\"What is the first thing you will do this week?\""}}], "win": "You proved it: division undoes multiplication, and you can check every answer!", "prev": "bb-bailey-L10", "prevTitle": "Lesson 10"});</script></body></html>
