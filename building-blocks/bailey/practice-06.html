<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 6</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Stop Adding, Start Multiplying</h1><p style="margin:0 0 12px;color:#5b6578">Three tries on each one. Only your first try counts. Do the fact, keep the zero, then add the partial products.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 6", "title": "Stop Adding, Start Multiplying", "mastery": 90, "color": "#8E44AD", "questions": [{"type": "fill", "q": "What is <b>50 × 8</b>?", "answers": ["400"], "why": "5 × 8 = 40, so 50 × 8 = <b>400</b>.", "no": "50 is 5 tens. Do 5 × 8, then keep the zero.", "hint": "5 × 8 = 40."}, {"type": "fill", "q": "What is <b>90 × 7</b>?", "answers": ["630"], "why": "9 × 7 = 63, so 90 × 7 = <b>630</b>.", "no": "90 is 9 tens. Do 9 × 7, then keep the zero.", "hint": "Ten 7s minus one 7: 70 − 7 = 63."}, {"q": "What are the two partial products for <b>68 × 9</b>?", "visual": {"kind": "area", "b": 9, "split": [60, 8], "show": false}, "choices": ["540 and 72", "54 and 72", "540 and 8", "60 and 8"], "a": 0, "why": "60 × 9 = 540 and 8 × 9 = 72.", "no": [null, "The 60 box is 60 × 9 = 540, not 54.", "The 8 box must be multiplied: 8 × 9 = 72.", "Those are the parts of 68. Multiply each one by 9."]}, {"type": "fill", "q": "What is <b>68 × 9</b>?", "answers": ["612"], "why": "540 + 72 = <b>612</b>.", "no": "Add the two partial products: 540 and 72.", "hint": "4 tens + 7 tens = 11 tens. Regroup."}, {"q": "Which is <b>47</b> in expanded form?", "choices": ["4 + 7", "40 + 7", "400 + 7"], "a": 1, "why": "47 = 40 + 7.", "no": ["The 4 in 47 is 4 tens: 40.", null, "47 has no hundreds. The 4 means 40."]}, {"type": "fill", "q": "What is <b>53 × 6</b>?", "answers": ["318"], "why": "50 × 6 = 300 and 3 × 6 = 18. 300 + 18 = <b>318</b>.", "no": "Split 53 into 50 + 3. Multiply each part by 6.", "hint": "Boxes: 50 × 6 and 3 × 6."}, {"type": "fill", "q": "Gobber needs <b>9</b> ropes. Each rope is <b>26</b> feet long. How many feet of rope?", "answers": ["234", "234 feet"], "why": "20 × 9 = 180 and 6 × 9 = 54. 180 + 54 = <b>234</b> feet.", "no": "9 equal ropes of 26 feet. Multiply 26 × 9.", "hint": "Boxes: 20 × 9 and 6 × 9."}, {"q": "Which word means <b>good at finding clever ways to solve a problem</b>?", "choices": ["resourceful", "laborious", "immense", "abandon"], "a": 0, "why": "<b>Resourceful</b> means good at finding clever ways to solve a problem with what you have.", "no": [null, "Laborious means needing slow, hard work.", "Immense means huge.", "Abandon means to leave behind."]}, {"q": "Adding 7 + 7 + 7 … ninety times would be <b>laborious</b>. What does <b>laborious</b> mean here?", "choices": ["fast and fun", "impossible to do", "needing a lot of slow, hard work", "very large"], "a": 2, "why": "Laborious means needing a lot of slow, hard work.", "no": ["It is the opposite: slow, hard work.", "You could do it. It would just take forever.", null, "That is immense."]}, {"type": "fill", "q": "Hiccup writes <b>72 × 8 = 56 + 16 = 72</b>. One box is wrong. What should the 70 box be?", "answers": ["560"], "why": "70 × 8 = 7 tens × 8 = 56 tens = <b>560</b>. Then 560 + 16 = 576.", "no": "He lost a zero. 70 is 7 tens.", "hint": "7 × 8 = 56. Keep the zero."}, {"q": "Which sentence uses <b>expanded form</b> correctly?", "choices": ["The expanded form of 96 is 9 + 6.", "The expanded form of 96 is 90 + 6.", "The expanded form of 96 is 96 × 1."], "a": 1, "why": "96 = 90 + 6.", "no": ["The 9 in 96 means 90.", null, "Expanded form adds the value of each digit."]}, {"type": "fill", "q": "A dragon eats <b>37</b> fish a day. How many fish does it eat in <b>8</b> days?", "answers": ["296", "296 fish"], "why": "30 × 8 = 240 and 7 × 8 = 56. 240 + 56 = <b>296</b> fish.", "no": "8 equal days of 37 fish. Multiply 37 × 8.", "hint": "Boxes: 30 × 8 and 7 × 8."}], "id": "bailey-L06", "sets": [[{"type": "fill", "q": "What is <b>50 × 8</b>?", "answers": ["400"], "why": "5 × 8 = 40, so 50 × 8 = <b>400</b>.", "no": "50 is 5 tens. Do 5 × 8, then keep the zero.", "hint": "5 × 8 = 40."}, {"type": "fill", "q": "What is <b>90 × 7</b>?", "answers": ["630"], "why": "9 × 7 = 63, so 90 × 7 = <b>630</b>.", "no": "90 is 9 tens. Do 9 × 7, then keep the zero.", "hint": "Ten 7s minus one 7: 70 − 7 = 63."}, {"q": "What are the two partial products for <b>68 × 9</b>?", "visual": {"kind": "area", "b": 9, "split": [60, 8], "show": false}, "choices": ["540 and 72", "54 and 72", "540 and 8", "60 and 8"], "a": 0, "why": "60 × 9 = 540 and 8 × 9 = 72.", "no": [null, "The 60 box is 60 × 9 = 540, not 54.", "The 8 box must be multiplied: 8 × 9 = 72.", "Those are the parts of 68. Multiply each one by 9."]}, {"type": "fill", "q": "What is <b>68 × 9</b>?", "answers": ["612"], "why": "540 + 72 = <b>612</b>.", "no": "Add the two partial products: 540 and 72.", "hint": "4 tens + 7 tens = 11 tens. Regroup."}, {"q": "Which is <b>47</b> in expanded form?", "choices": ["4 + 7", "40 + 7", "400 + 7"], "a": 1, "why": "47 = 40 + 7.", "no": ["The 4 in 47 is 4 tens: 40.", null, "47 has no hundreds. The 4 means 40."]}, {"type": "fill", "q": "What is <b>53 × 6</b>?", "answers": ["318"], "why": "50 × 6 = 300 and 3 × 6 = 18. 300 + 18 = <b>318</b>.", "no": "Split 53 into 50 + 3. Multiply each part by 6.", "hint": "Boxes: 50 × 6 and 3 × 6."}, {"type": "fill", "q": "Gobber needs <b>9</b> ropes. Each rope is <b>26</b> feet long. How many feet of rope?", "answers": ["234", "234 feet"], "why": "20 × 9 = 180 and 6 × 9 = 54. 180 + 54 = <b>234</b> feet.", "no": "9 equal ropes of 26 feet. Multiply 26 × 9.", "hint": "Boxes: 20 × 9 and 6 × 9."}, {"q": "Which word means <b>good at finding clever ways to solve a problem</b>?", "choices": ["resourceful", "laborious", "immense", "abandon"], "a": 0, "why": "<b>Resourceful</b> means good at finding clever ways to solve a problem with what you have.", "no": [null, "Laborious means needing slow, hard work.", "Immense means huge.", "Abandon means to leave behind."]}, {"q": "Adding 7 + 7 + 7 … ninety times would be <b>laborious</b>. What does <b>laborious</b> mean here?", "choices": ["fast and fun", "impossible to do", "needing a lot of slow, hard work", "very large"], "a": 2, "why": "Laborious means needing a lot of slow, hard work.", "no": ["It is the opposite: slow, hard work.", "You could do it. It would just take forever.", null, "That is immense."]}, {"type": "fill", "q": "Hiccup writes <b>72 × 8 = 56 + 16 = 72</b>. One box is wrong. What should the 70 box be?", "answers": ["560"], "why": "70 × 8 = 7 tens × 8 = 56 tens = <b>560</b>. Then 560 + 16 = 576.", "no": "He lost a zero. 70 is 7 tens.", "hint": "7 × 8 = 56. Keep the zero."}, {"q": "Which sentence uses <b>expanded form</b> correctly?", "choices": ["The expanded form of 96 is 9 + 6.", "The expanded form of 96 is 90 + 6.", "The expanded form of 96 is 96 × 1."], "a": 1, "why": "96 = 90 + 6.", "no": ["The 9 in 96 means 90.", null, "Expanded form adds the value of each digit."]}, {"type": "fill", "q": "A dragon eats <b>37</b> fish a day. How many fish does it eat in <b>8</b> days?", "answers": ["296", "296 fish"], "why": "30 × 8 = 240 and 7 × 8 = 56. 240 + 56 = <b>296</b> fish.", "no": "8 equal days of 37 fish. Multiply 37 × 8.", "hint": "Boxes: 30 × 8 and 7 × 8."}], [{"type": "fill", "q": "What is <b>60 × 9</b>?", "answers": ["540", "five hundred forty"], "why": "6 × 9 = 54, so 60 × 9 = <b>540</b>.", "no": "60 is 6 tens. Do 6 × 9, then keep the zero.", "hint": "Ten 6s minus one 6: 60 − 6 = 54."}, {"type": "fill", "q": "What is <b>80 × 7</b>?", "answers": ["560", "five hundred sixty"], "why": "8 × 7 = 56, so 80 × 7 = <b>560</b>.", "no": "80 is 8 tens. Do 8 × 7, then keep the zero.", "hint": "5, 6, 7, 8: 56 = 7 × 8."}, {"q": "What are the two partial products for <b>46 × 9</b>?", "visual": {"kind": "area", "b": 9, "split": [40, 6], "show": false}, "choices": ["360 and 54", "36 and 54", "360 and 6", "40 and 6"], "a": 0, "why": "40 × 9 = 360 and 6 × 9 = 54.", "no": [null, "The 40 box is 40 × 9 = 360, not 36. Keep the zero.", "The 6 box must be multiplied: 6 × 9 = 54.", "Those are the parts of 46. Multiply each one by 9."]}, {"type": "fill", "q": "What is <b>46 × 9</b>?", "answers": ["414", "four hundred fourteen"], "why": "360 + 54 = <b>414</b>.", "no": "Add the two partial products: 360 and 54.", "hint": "6 tens + 5 tens = 11 tens. Regroup."}, {"q": "Which is <b>85</b> in expanded form?", "choices": ["80 + 5", "8 + 5", "800 + 5"], "a": 0, "why": "85 = 80 + 5.", "no": [null, "The 8 in 85 is 8 tens: 80.", "85 has no hundreds. The 8 means 80."]}, {"type": "fill", "q": "What is <b>84 × 7</b>?", "answers": ["588", "five hundred eighty-eight", "five hundred eighty eight"], "why": "80 × 7 = 560 and 4 × 7 = 28. 560 + 28 = <b>588</b>.", "no": "Split 84 into 80 + 4. Multiply each part by 7.", "hint": "Boxes: 80 × 7 and 4 × 7."}, {"type": "fill", "q": "Astrid's team builds <b>7</b> dragon stalls. Each stall needs <b>38</b> wooden planks. How many planks?", "answers": ["266", "two hundred sixty-six", "two hundred sixty six", "266 planks"], "why": "30 × 7 = 210 and 8 × 7 = 56. 210 + 56 = <b>266</b> planks.", "no": "7 equal stalls of 38 planks. Multiply 38 × 7.", "hint": "Boxes: 30 × 7 and 8 × 7."}, {"q": "Which word means <b>extremely large</b>?", "choices": ["laborious", "immense", "resourceful", "abandon"], "a": 1, "why": "<b>Immense</b> means extremely large.", "no": ["Laborious means needing slow, hard work.", null, "Resourceful means good at finding clever ways to solve a problem.", "Abandon means to leave something behind."]}, {"q": "The storm grew worse, so Stoick ordered his crew to <b>abandon</b> the sinking ship. What does <b>abandon</b> mean here?", "choices": ["fix it quickly", "steer it faster", "paint it a new color", "leave it behind and stop using it"], "a": 3, "why": "Abandon means to leave something behind and stop using it.", "no": ["Fixing the ship means they keep it. Abandon means they leave it.", "Steering means they are still using the ship.", "Painting has nothing to do with leaving.", null]}, {"type": "fill", "q": "Astrid writes <b>93 × 6 = 54 + 18 = 72</b>. One box is wrong. What should the 90 box be?", "answers": ["540", "five hundred forty"], "why": "90 × 6 = 9 tens × 6 = 54 tens = <b>540</b>. Then 540 + 18 = 558.", "no": "She lost a zero. 90 is 9 tens.", "hint": "9 × 6 = 54. Keep the zero."}, {"q": "Which sentence uses <b>expanded form</b> correctly?", "choices": ["The expanded form of 71 is 7 + 1.", "The expanded form of 71 is 71 + 0.", "The expanded form of 71 is 70 + 1."], "a": 2, "why": "71 = 70 + 1.", "no": ["The 7 in 71 means 70.", "Expanded form shows the value of each digit: tens + ones.", null]}, {"type": "fill", "q": "A Viking sail uses <b>29</b> yards of cloth. How many yards of cloth do <b>8</b> sails use?", "answers": ["232", "two hundred thirty-two", "two hundred thirty two", "232 yards"], "why": "20 × 8 = 160 and 9 × 8 = 72. 160 + 72 = <b>232</b> yards.", "no": "8 equal sails of 29 yards. Multiply 29 × 8.", "hint": "Boxes: 20 × 8 and 9 × 8."}], [{"type": "fill", "q": "What is <b>80 × 8</b>?", "answers": ["640", "six hundred forty"], "why": "8 × 8 = 64, so 80 × 8 = <b>640</b>.", "no": "80 is 8 tens. Do 8 × 8, then keep the zero.", "hint": "Double, double, double 8: 16, 32, 64."}, {"type": "fill", "q": "What is <b>40 × 7</b>?", "answers": ["280", "two hundred eighty"], "why": "4 × 7 = 28, so 40 × 7 = <b>280</b>.", "no": "40 is 4 tens. Do 4 × 7, then keep the zero.", "hint": "Double 7 is 14. Double 14 is 28."}, {"q": "What are the two partial products for <b>88 × 7</b>?", "visual": {"kind": "area", "b": 7, "split": [80, 8], "show": false}, "choices": ["56 and 56", "560 and 8", "560 and 56", "80 and 8"], "a": 2, "why": "80 × 7 = 560 and 8 × 7 = 56.", "no": ["The 80 box is 80 × 7 = 560, not 56. Keep the zero.", "The 8 box must be multiplied: 8 × 7 = 56.", null, "Those are the parts of 88. Multiply each one by 7."]}, {"type": "fill", "q": "What is <b>88 × 7</b>?", "answers": ["616", "six hundred sixteen"], "why": "560 + 56 = <b>616</b>.", "no": "Add the two partial products: 560 and 56.", "hint": "560 + 40 = 600. Then add 16 more."}, {"q": "Which is <b>61</b> in expanded form?", "choices": ["6 + 1", "60 + 10", "60 + 1"], "a": 2, "why": "61 = 60 + 1.", "no": ["The 6 in 61 is 6 tens: 60.", "The 1 in 61 is in the ones place. It means 1, not 10.", null]}, {"type": "fill", "q": "What is <b>62 × 9</b>?", "answers": ["558", "five hundred fifty-eight", "five hundred fifty eight"], "why": "60 × 9 = 540 and 2 × 9 = 18. 540 + 18 = <b>558</b>.", "no": "Split 62 into 60 + 2. Multiply each part by 9.", "hint": "Boxes: 60 × 9 and 2 × 9."}, {"type": "fill", "q": "Fishlegs reads <b>54</b> pages of the Book of Dragons each night. How many pages does he read in <b>6</b> nights?", "answers": ["324", "three hundred twenty-four", "three hundred twenty four", "324 pages"], "why": "50 × 6 = 300 and 4 × 6 = 24. 300 + 24 = <b>324</b> pages.", "no": "6 equal nights of 54 pages. Multiply 54 × 6.", "hint": "Boxes: 50 × 6 and 4 × 6."}, {"q": "Which word means <b>to leave something behind and stop using it</b>?", "choices": ["immense", "resourceful", "laborious", "abandon"], "a": 3, "why": "To <b>abandon</b> something is to leave it behind and stop using it.", "no": ["Immense means extremely large.", "Resourceful means good at finding clever ways to solve a problem.", "Laborious means needing slow, hard work.", null]}, {"q": "Astrid has no tools, so she ties branches together with vines to build a raft. She is <b>resourceful</b>. What does <b>resourceful</b> mean here?", "choices": ["very large and strong", "good at finding clever ways to solve a problem with what she has", "slow and tired from hard work", "ready to give up and leave"], "a": 1, "why": "Resourceful means good at finding clever ways to solve a problem with what you have.", "no": ["That is closer to immense. Resourceful is about clever ideas.", null, "That describes laborious work, not a clever person.", "Giving up and leaving is abandon."]}, {"type": "fill", "q": "Fishlegs writes <b>64 × 7 = 42 + 28 = 70</b>. One box is wrong. What should the 60 box be?", "answers": ["420", "four hundred twenty"], "why": "60 × 7 = 6 tens × 7 = 42 tens = <b>420</b>. Then 420 + 28 = 448.", "no": "He lost a zero. 60 is 6 tens.", "hint": "6 × 7 = 42. Keep the zero."}, {"q": "Which sentence uses <b>expanded form</b> correctly?", "choices": ["The expanded form of 48 is 40 + 8.", "The expanded form of 48 is 4 + 8.", "The expanded form of 48 is 80 + 4."], "a": 0, "why": "48 = 40 + 8.", "no": [null, "The 4 in 48 means 4 tens: 40.", "80 + 4 is 84. In 48 the 4 is in the tens place, so it means 40."]}, {"type": "fill", "q": "Each dragon at the Berk Academy eats <b>45</b> pounds of fish a week. There are <b>7</b> dragons. How many pounds of fish do they eat in a week?", "answers": ["315", "three hundred fifteen", "315 pounds"], "why": "40 × 7 = 280 and 5 × 7 = 35. 280 + 35 = <b>315</b> pounds.", "no": "7 equal dragons eating 45 pounds each. Multiply 45 × 7.", "hint": "Boxes: 40 × 7 and 5 × 7."}]]});</script></body></html>
