<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 6</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Stop Adding, Start Multiplying</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Do the fact, keep the zero, then add the partial products.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 6", "title": "Stop Adding, Start Multiplying", "mastery": 90, "color": "#8E44AD", "questions": [{"q": "What is <b>50 × 8</b>?", "choices": ["400", "40", "4,000", "58"], "a": 0, "why": "5 × 8 = 40, so 50 × 8 = <b>400</b>.", "no": [null, "50 is 5 tens. 5 × 8 = 40 tens = 400.", "Only one zero. 50 has one zero.", "Multiply 5 × 8 first."]}, {"q": "What is <b>90 × 7</b>?", "choices": ["63", "97", "630", "6,300"], "a": 2, "why": "9 × 7 = 63, so 90 × 7 = <b>630</b>.", "no": ["9 tens × 7 = 63 tens = 630.", "You added 90 + 7.", null, "Only one zero."]}, {"q": "What are the two partial products for <b>68 × 9</b>?", "visual": {"kind": "area", "b": 9, "split": [60, 8], "show": false}, "choices": ["540 and 72", "54 and 72", "540 and 8", "60 and 8"], "a": 0, "why": "60 × 9 = 540 and 8 × 9 = 72.", "no": [null, "The 60 box is 60 × 9 = 540, not 54.", "The 8 box must be multiplied: 8 × 9 = 72.", "Those are the parts of 68. Multiply each one by 9."]}, {"q": "What is <b>68 × 9</b>?", "choices": ["602", "612", "77", "126"], "a": 1, "why": "540 + 72 = <b>612</b>.", "no": ["Regroup: 40 + 70 = 110, so 540 + 72 = 612, not 602.", null, "You added 68 + 9.", "The 60 box is 540, not 54."]}, {"q": "Which is <b>47</b> in expanded form?", "choices": ["4 + 7", "40 + 7", "400 + 7"], "a": 1, "why": "47 = 40 + 7.", "no": ["The 4 in 47 is 4 tens: 40.", null, "47 has no hundreds. The 4 means 40."]}, {"q": "What is <b>53 × 6</b>?", "choices": ["59", "303", "318", "308"], "a": 2, "why": "50 × 6 = 300 and 3 × 6 = 18. 300 + 18 = <b>318</b>.", "no": ["You added 53 + 6.", "The ones box is 3 × 6 = 18, not 3.", null, "3 × 6 is 18, not 8. 300 + 18 = 318."]}, {"q": "Gobber needs <b>9</b> ropes. Each rope is <b>26</b> feet long. How many feet of rope?", "choices": ["35", "186", "214", "234"], "a": 3, "why": "20 × 9 = 180 and 6 × 9 = 54. 180 + 54 = <b>234</b> feet.", "no": ["9 equal ropes means multiply, not add.", "The 6 box must be multiplied: 6 × 9 = 54.", "6 × 9 is 54, not 34.", null]}, {"q": "Which word means <b>good at finding clever ways to solve a problem</b>?", "choices": ["resourceful", "laborious", "immense", "abandon"], "a": 0, "why": "<b>Resourceful</b> means good at finding clever ways to solve a problem with what you have.", "no": [null, "Laborious means needing slow, hard work.", "Immense means huge.", "Abandon means to leave behind."]}, {"q": "Adding 7 + 7 + 7 … ninety times would be <b>laborious</b>. What does <b>laborious</b> mean here?", "choices": ["fast and fun", "impossible to do", "needing a lot of slow, hard work", "very large"], "a": 2, "why": "Laborious means needing a lot of slow, hard work.", "no": ["It is the opposite: slow, hard work.", "You could do it. It would just take forever.", null, "That is immense."]}, {"q": "Hiccup writes <b>72 × 8 = 560 + 16 = 576</b>. Is he right?", "choices": ["Yes. 70 × 8 = 560 and 2 × 8 = 16.", "No. It should be 56 + 16 = 72.", "No. It should be 560 + 2 = 562."], "a": 0, "why": "560 + 16 = <b>576</b>. Hiccup is right.", "no": [null, "70 × 8 is 560, not 56. Keep the zero.", "The 2 box is multiplied too: 2 × 8 = 16."]}, {"q": "Which sentence uses <b>expanded form</b> correctly?", "choices": ["The expanded form of 96 is 9 + 6.", "The expanded form of 96 is 90 + 6.", "The expanded form of 96 is 96 × 1."], "a": 1, "why": "96 = 90 + 6.", "no": ["The 9 in 96 means 90.", null, "Expanded form adds the value of each digit."]}, {"q": "A dragon eats <b>37</b> fish a day. How many fish does it eat in <b>8</b> days?", "choices": ["45", "247", "296", "286"], "a": 2, "why": "30 × 8 = 240 and 7 × 8 = 56. 240 + 56 = <b>296</b> fish.", "no": ["8 equal days of 37 fish means multiply.", "The 7 box must be multiplied: 7 × 8 = 56.", null, "Add the tens again: 4 tens + 5 tens = 9 tens, so 240 + 56 = 296."]}]});</script></body></html>
