<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 6</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Stop Adding, Start Multiplying</h1><p style="margin:0 0 12px;color:#5b6578">Three tries on each one. Only your first try counts. Do the fact, keep the zero, then add the partial products.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 6", "title": "Stop Adding, Start Multiplying", "mastery": 90, "color": "#8E44AD", "questions": [{"type": "fill", "q": "What is <b>50 × 8</b>?", "answers": ["400"], "why": "5 × 8 = 40, so 50 × 8 = <b>400</b>.", "no": "50 is 5 tens. Do 5 × 8, then keep the zero.", "hint": "5 × 8 = 40."}, {"type": "fill", "q": "What is <b>90 × 7</b>?", "answers": ["630"], "why": "9 × 7 = 63, so 90 × 7 = <b>630</b>.", "no": "90 is 9 tens. Do 9 × 7, then keep the zero.", "hint": "Ten 7s minus one 7: 70 − 7 = 63."}, {"q": "What are the two partial products for <b>68 × 9</b>?", "visual": {"kind": "area", "b": 9, "split": [60, 8], "show": false}, "choices": ["540 and 72", "54 and 72", "540 and 8", "60 and 8"], "a": 0, "why": "60 × 9 = 540 and 8 × 9 = 72.", "no": [null, "The 60 box is 60 × 9 = 540, not 54.", "The 8 box must be multiplied: 8 × 9 = 72.", "Those are the parts of 68. Multiply each one by 9."]}, {"type": "fill", "q": "What is <b>68 × 9</b>?", "answers": ["612"], "why": "540 + 72 = <b>612</b>.", "no": "Add the two partial products: 540 and 72.", "hint": "4 tens + 7 tens = 11 tens. Regroup."}, {"q": "Which is <b>47</b> in expanded form?", "choices": ["4 + 7", "40 + 7", "400 + 7"], "a": 1, "why": "47 = 40 + 7.", "no": ["The 4 in 47 is 4 tens: 40.", null, "47 has no hundreds. The 4 means 40."]}, {"type": "fill", "q": "What is <b>53 × 6</b>?", "answers": ["318"], "why": "50 × 6 = 300 and 3 × 6 = 18. 300 + 18 = <b>318</b>.", "no": "Split 53 into 50 + 3. Multiply each part by 6.", "hint": "Boxes: 50 × 6 and 3 × 6."}, {"type": "fill", "q": "Gobber needs <b>9</b> ropes. Each rope is <b>26</b> feet long. How many feet of rope?", "answers": ["234", "234 feet"], "why": "20 × 9 = 180 and 6 × 9 = 54. 180 + 54 = <b>234</b> feet.", "no": "9 equal ropes of 26 feet. Multiply 26 × 9.", "hint": "Boxes: 20 × 9 and 6 × 9."}, {"q": "Which word means <b>good at finding clever ways to solve a problem</b>?", "choices": ["resourceful", "laborious", "immense", "abandon"], "a": 0, "why": "<b>Resourceful</b> means good at finding clever ways to solve a problem with what you have.", "no": [null, "Laborious means needing slow, hard work.", "Immense means huge.", "Abandon means to leave behind."]}, {"q": "Adding 7 + 7 + 7 … ninety times would be <b>laborious</b>. What does <b>laborious</b> mean here?", "choices": ["fast and fun", "impossible to do", "needing a lot of slow, hard work", "very large"], "a": 2, "why": "Laborious means needing a lot of slow, hard work.", "no": ["It is the opposite: slow, hard work.", "You could do it. It would just take forever.", null, "That is immense."]}, {"type": "fill", "q": "Hiccup writes <b>72 × 8 = 56 + 16 = 72</b>. One box is wrong. What should the 70 box be?", "answers": ["560"], "why": "70 × 8 = 7 tens × 8 = 56 tens = <b>560</b>. Then 560 + 16 = 576.", "no": "He lost a zero. 70 is 7 tens.", "hint": "7 × 8 = 56. Keep the zero."}, {"q": "Which sentence uses <b>expanded form</b> correctly?", "choices": ["The expanded form of 96 is 9 + 6.", "The expanded form of 96 is 90 + 6.", "The expanded form of 96 is 96 × 1."], "a": 1, "why": "96 = 90 + 6.", "no": ["The 9 in 96 means 90.", null, "Expanded form adds the value of each digit."]}, {"type": "fill", "q": "A dragon eats <b>37</b> fish a day. How many fish does it eat in <b>8</b> days?", "answers": ["296", "296 fish"], "why": "30 × 8 = 240 and 7 × 8 = 56. 240 + 56 = <b>296</b> fish.", "no": "8 equal days of 37 fish. Multiply 37 × 8.", "hint": "Boxes: 30 × 8 and 7 × 8."}], "id": "bailey-L06", "sets": [[{"type": "fill", "q": "What is <b>50 × 8</b>?", "answers": ["400"], "why": "5 × 8 = 40, so 50 × 8 = <b>400</b>.", "no": "50 is 5 tens. Do 5 × 8, then keep the zero.", "hint": "5 × 8 = 40."}, {"type": "fill", "q": "What is <b>90 × 7</b>?", "answers": ["630"], "why": "9 × 7 = 63, so 90 × 7 = <b>630</b>.", "no": "90 is 9 tens. Do 9 × 7, then keep the zero.", "hint": "Ten 7s minus one 7: 70 − 7 = 63."}, {"q": "What are the two partial products for <b>68 × 9</b>?", "visual": {"kind": "area", "b": 9, "split": [60, 8], "show": false}, "choices": ["540 and 72", "54 and 72", "540 and 8", "60 and 8"], "a": 0, "why": "60 × 9 = 540 and 8 × 9 = 72.", "no": [null, "The 60 box is 60 × 9 = 540, not 54.", "The 8 box must be multiplied: 8 × 9 = 72.", "Those are the parts of 68. Multiply each one by 9."]}, {"type": "fill", "q": "What is <b>68 × 9</b>?", "answers": ["612"], "why": "540 + 72 = <b>612</b>.", "no": "Add the two partial products: 540 and 72.", "hint": "4 tens + 7 tens = 11 tens. Regroup."}, {"q": "Which is <b>47</b> in expanded form?", "choices": ["4 + 7", "40 + 7", "400 + 7"], "a": 1, "why": "47 = 40 + 7.", "no": ["The 4 in 47 is 4 tens: 40.", null, "47 has no hundreds. The 4 me
