<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 15: Prove It: Long Division Detective</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L15", "label": "Lesson 15", "title": "Prove It: Long Division Detective", "goal": "I can solve long division word problems, find the mistake in someone's work, and check my answer by multiplying.", "date": "2026-12-10", "mastery": 90, "color": "#E84393", "slides": [{"type": "hello", "title": "On Your Own: Long Division Detective", "text": "In class you solved division stories, found mistakes in other people's work, and checked by multiplying. Now prove it on your own with paper and a pencil. It takes about 25 minutes and ends with <b>Show What You Know</b>.", "visual": {"kind": "emoji", "text": "🕵️✔️"}}, {"type": "talk", "kick": "Say it out loud", "title": "Teach it to someone", "text": "Find someone at home. Teach them. Say it out loud before you go on.", "prompts": ["Tell them how you know a story is a division story. Make up a dragon example.", "Show them how to check 456 ÷ 8 = 57 by multiplying.", "What is the young Vikings' <b>initiation</b> in <i>How to Train Your Dragon</i>?"], "starters": ["It is division when …", "To check it, I multiply …", "Their initiation is …"]}, {"type": "vocab", "kick": "Word Power", "title": "Remember the words", "text": "Tap each card. Say the meaning before you flip it. Then flip to check yourself.", "words": [{"word": "algorithm", "pos": "noun", "emoji": "⚙️", "meaning": "A set of steps that always works when you follow them in order.", "example": "Long division is an <b>algorithm</b>: divide, multiply, subtract, bring down."}, {"word": "discrepancy", "pos": "noun", "emoji": "⚠️", "meaning": "A difference between two things that should match.", "example": "13 × 6 = 78, not 618. That <b>discrepancy</b> tells me there is a mistake."}, {"word": "thorough", "pos": "adjective", "emoji": "🔎", "meaning": "Careful and complete, checking every part.", "example": "A <b>thorough</b> check looks at every step, not just the answer."}, {"word": "rectify", "pos": "verb", "emoji": "🛠️", "meaning": "To fix a mistake and make it right.", "example": "Fishlegs found his subtraction slip and <b>rectified</b> it."}, {"word": "convince", "pos": "verb", "emoji": "🤝", "meaning": "To make someone believe that something is true.", "example": "Show the multiplication check to <b>convince</b> me your answer is right."}, {"word": "initiation", "pos": "noun", "emoji": "🎖️", "meaning": "A test or ceremony a person goes through to become a full member of a group.", "example": "In the book, the young Vikings must train a dragon as part of their <b>initiation</b> into the tribe."}, {"word": "conclude", "pos": "verb", "emoji": "🏁", "meaning": "To decide something after thinking about the facts.", "example": "168 × 4 = 672, so I <b>conclude</b> that my answer is right."}]}, {"type": "learn", "kick": "Remember", "title": "Solve, check, conclude", "text": "Divide, multiply, subtract, bring down. Then multiply back to check.", "visual": {"kind": "longdiv", "text": "    195\n   ____\n5 ) 975\n   -5\n   --\n    47\n   -45\n   ---\n     25\n    -25\n    ---\n      0"}, "steps": [{"text": "<b>975 ÷ 5 = 195.</b> Check: 195 × 5 = 500 + 450 + 25 = 975 ✔."}, {"text": "If the check gives a different number, that is a <b>discrepancy</b>. Go back and check each step."}], "tip": "Division story? A total is split into equal groups."}, {"type": "tap", "kick": "Your turn", "title": "Solve on paper", "text": "Copy each problem on your paper. Solve it one step at a time. Type the quotient.", "items": [{"type": "fill", "q": "Use long division: <b>987 ÷ 7</b> = ____", "answers": ["141"], "why": "987 ÷ 7 = 141. Check: 141 × 7 = 987.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 7s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ____\n7 ) 987"}}, {"type": "fill", "q": "Use long division: <b>535 ÷ 5</b> = ____", "answers": ["107"], "why": "535 ÷ 5 = 107. Check: 107 × 5 = 535.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 5s fit in 5?", "visual": {"kind": "longdiv", "text": "\n   ____\n5 ) 535"}}, {"type": "fill", "q": "Use long division: <b>413 ÷ 7</b> = ____", "answers": ["59"], "why": "413 ÷ 7 = 59. Check: 59 × 7 = 413.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "7 does not fit in 4, so start with 41: how many 7s fit in 41?", "visual": {"kind": "longdiv", "text": "\n   ____\n7 ) 413"}}]}, {"type": "tap", "kick": "Your turn", "title": "Division stories", "items": [{"type": "fill", "q": "<b>712 Vikings</b> sail in <b>8 longships</b>, the same number in each. How many Vikings are in each longship?", "answers": ["89", "89 Vikings"], "why": "712 ÷ 8 = 89 Vikings. Check: 89 × 8 = 712.", "no": "Write the division, then solve it on paper one step at a time.", "hint": "Divide: 712 ÷ 8."}, {"type": "fill", "q": "Fishlegs has <b>264 dragon cards</b>. He puts <b>8 cards</b> on each page of his album. How many pages does he fill?", "answers": ["33", "33 pages"], "why": "264 ÷ 8 = 33 pages. Check: 33 × 8 = 264.", "no": "Write the division, then solve it on paper one step at a time.", "hint": "Divide: 264 ÷ 8."}, {"q": "There are <b>4 dragon pens</b> with <b>136 fish</b> in each pen. How many fish are there in all? Which number sentence solves it?", "choices": ["136 − 4", "136 ÷ 4", "136 × 4", "136 + 4"], "a": 2, "why": "Equal groups put together: multiply. 136 × 4 = 544 fish.", "no": ["Nothing is taken away in this story, so do not subtract.", "This story puts groups together to find a total, so multiply.", null, "The groups are equal, so adding the two numbers does not work."]}]}, {"type": "tap", "kick": "Your turn", "title": "Find the mistake", "text": "Check by multiplying. Then look at each step.", "items": [{"q": "Snotlout worked out <b>852 ÷ 6</b> and got <b>143 R 4</b>. Check: 143 × 6 + 4 = 862, not 852. Find the mistake in the work.", "choices": ["The subtraction is wrong: 25 − 24 = 1, not 2.", "A placeholder 0 is missing in the quotient.", "The first digit should be 2.", "Nothing is wrong. The answer is accurate."], "a": 0, "why": "The subtraction is wrong: 25 − 24 = 1, not 2. Fix it and finish: 852 ÷ 6 = 142. Check: 142 × 6 = 852.", "no": [null, "Look at the quotient: every place has a digit. Look at the subtractions instead.", "2 × 6 = 12. That is too big.", "Check: 143 × 6 + 4 = 862, not 852. That discrepancy means there is a mistake."], "visual": {"kind": "longdiv", "text": "    143 R4\n   ____\n6 ) 852\n   -6\n   --\n    25\n   -24\n   ---\n     22\n    -18\n    ---\n      4"}}, {"q": "Fishlegs worked out <b>642 ÷ 6</b> and got <b>17</b>. Check: 17 × 6 = 102, not 642. Find the mistake in the work.", "choices": ["The first subtraction is wrong.", "The first digit should be 2.", "Nothing is wrong. The answer is accurate.", "A placeholder 0 is missing in the quotient. The answer is 107."], "a": 3, "why": "A placeholder 0 is missing in the quotient. The answer is 107. Fix it and finish: 642 ÷ 6 = 107. Check: 107 × 6 = 642.", "no": ["Check it: that subtraction is correct.", "2 × 6 = 12. That is too big.", "Check: 17 × 6 = 102, not 642. That discrepancy means there is a mistake.", null], "visual": {"kind": "longdiv", "text": "    17\n   ____\n6 ) 642\n   -6\n   --\n    042\n    -42\n    ---\n      0"}}]}, {"type": "tap", "kick": "Your turn", "title": "Convince me", "items": [{"type": "fill", "q": "Convince me: check <b>657 ÷ 3 = 219</b> by multiplying. 219 × 3 = ____", "answers": ["657"], "why": "200 × 3 + 10 × 3 + 9 × 3 = 600 + 30 + 27 = 657. It matches, so 657 ÷ 3 = 219 is accurate.", "no": "Break 219 apart: 200 + 10 + 9. Multiply each part by 3, then add."}, {"type": "fill", "q": "Convince me: check <b>535 ÷ 5 = 107</b> by multiplying. 107 × 5 = ____", "answers": ["535"], "why": "100 × 5 + 7 × 5 = 500 + 35 = 535. It matches, so 535 ÷ 5 = 107 is accurate.", "no": "Break 107 apart: 100 + 7. Multiply each part by 5, then add."}]}, {"type": "tap", "kick": "Word work", "title": "Words in action", "text": "Type the word.", "items": [{"type": "fill", "q": "A set of steps that always works when you follow them in order is an ____. (Use a word from your word cards.)", "answers": ["algorithm"], "why": "An <i>algorithm</i> is a set of steps that always works.", "no": "It starts with al-."}, {"type": "fill", "q": "To make someone believe something is true is to ____ them. (Use a word from your word cards.)", "answers": ["convince"], "why": "To <i>convince</i> is to make someone believe it.", "no": "It starts with con-."}, {"q": "After checking every step, Hiccup decided his plan would work. Which word means <i>decided after thinking about the facts</i>?", "choices": ["rectified", "concluded", "omitted", "convinced"], "a": 1, "why": "To <i>conclude</i> is to decide after thinking about the facts.", "no": ["Rectified means fixed.", null, "Omitted means left out.", "Convinced means made someone believe."]}]}, {"type": "recall", "kick": "Remember?", "title": "Earlier lessons", "items": [{"type": "fill", "q": "Use the area model: <b>86 × 7</b> = ____", "answers": ["602"], "why": "80 × 7 = 560 and 6 × 7 = 42. 560 + 42 = 602.", "no": "80 × 7 = 560. Now add 6 × 7.", "visual": {"kind": "area", "b": 7, "split": [80, 6], "show": false}}, {"type": "fill", "q": "<b>? ÷ 8 = 9</b>. What is the missing number?", "answers": ["72"], "why": "9 × 8 = 72.", "no": "The biggest number is missing. Multiply."}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Use long division: <b>856 ÷ 4</b> = ____", "answers": ["214"], "why": "856 ÷ 4 = 214. Check: 214 × 4 = 856.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 4s fit in 8?", "visual": {"kind": "longdiv", "text": "\n   ____\n4 ) 856"}}, {"type": "fill", "q": "Use long division: <b>981 ÷ 9</b> = ____", "answers": ["109"], "why": "981 ÷ 9 = 109. Check: 109 × 9 = 981.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 9s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ____\n9 ) 981"}}, {"type": "fill", "q": "Use long division: <b>371 ÷ 7</b> = ____", "answers": ["53"], "why": "371 ÷ 7 = 53. Check: 53 × 7 = 371.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "7 does not fit in 3, so start with 37: how many 7s fit in 37?", "visual": {"kind": "longdiv", "text": "\n   ____\n7 ) 371"}}, {"type": "fill", "q": "Stoick shares <b>696 fish</b> equally among <b>8 dragons</b>. How many fish does each dragon get?", "answers": ["87", "87 fish"], "why": "696 ÷ 8 = 87 fish. Check: 87 × 8 = 696.", "no": "Write the division, then solve it on paper one step at a time.", "hint": "Divide: 696 ÷ 8."}, {"q": "Hiccup has <b>945 feathers</b>. He puts the same number into each of <b>7 pillows</b>. How many feathers go in each pillow? Which number sentence solves it?", "choices": ["945 + 7", "945 − 7", "945 ÷ 7", "945 × 7"], "a": 2, "why": "A total split into equal parts: divide. 945 ÷ 7 = 135 feathers.", "no": ["The groups are equal, so adding the two numbers does not work.", "Nothing is taken away in this story, so do not subtract.", null, "This story splits a total into equal parts, so divide."]}, {"q": "Snotlout worked out <b>858 ÷ 3</b> and got <b>289 R 1</b>. Check: 289 × 3 + 1 = 868, not 858. Find the mistake in the work.", "choices": ["Nothing is wrong. The answer is accurate.", "The subtraction is wrong: 25 − 24 = 1, not 2.", "A placeholder 0 is missing in the quotient.", "The first digit should be 3."], "a": 1, "why": "The subtraction is wrong: 25 − 24 = 1, not 2. Fix it and finish: 858 ÷ 3 = 286. Check: 286 × 3 = 858.", "no": ["Check: 289 × 3 + 1 = 868, not 858. That discrepancy means there is a mistake.", null, "Look at the quotient: every place has a digit. Look at the subtractions instead.", "3 × 3 = 9. That is too big."], "visual": {"kind": "longdiv", "text": "    289 R1\n   ____\n3 ) 858\n   -6\n   --\n    25\n   -24\n   ---\n     28\n    -27\n    ---\n      1"}}, {"type": "fill", "q": "Convince me: check <b>828 ÷ 6 = 138</b> by multiplying. 138 × 6 = ____", "answers": ["828"], "why": "100 × 6 + 30 × 6 + 8 × 6 = 600 + 180 + 48 = 828. It matches, so 828 ÷ 6 = 138 is accurate.", "no": "Break 138 apart: 100 + 30 + 8. Multiply each part by 6, then add."}, {"type": "fill", "q": "A difference between two things that should match is a ____. (Use a word from your word cards.)", "answers": ["discrepancy"], "why": "A <i>discrepancy</i> is a difference between two things that should match.", "no": "It starts with dis-."}, {"q": "To <b>rectify</b> a mistake means to…", "choices": ["fix it", "find it", "hide it", "make it again"], "a": 0, "why": "To <i>rectify</i> is to fix a mistake and make it right.", "no": [null, "Finding comes first, but rectify means fixing.", "Hiding a mistake does not fix it.", "Making it again is the opposite."]}, {"q": "Which story is solved by <b>dividing</b>?", "choices": ["5 dragons each eat 112 fish. How many fish in all?", "There are 324 eggs split equally into 9 nests. How many eggs in each nest?", "Hiccup has 128 nails and finds 6 more. How many now?", "A ship has 240 oars and loses 8. How many are left?"], "a": 1, "why": "A total (324) is split into equal groups (9 nests): 324 ÷ 9 = 36.", "no": ["Equal groups put together: multiply.", null, "Finding more: add.", "Losing some: subtract."]}], [{"type": "fill", "q": "Use long division: <b>768 ÷ 6</b> = ____", "answers": ["128"], "why": "768 ÷ 6 = 128. Check: 128 × 6 = 768.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 6s fit in 7?", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 768"}}, {"type": "fill", "q": "Use long division: <b>520 ÷ 5</b> = ____", "answers": ["104"], "why": "520 ÷ 5 = 104. Check: 104 × 5 = 520.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 5s fit in 5?", "visual": {"kind": "longdiv", "text": "\n   ____\n5 ) 520"}}, {"type": "fill", "q": "Use long division: <b>576 ÷ 9</b> = ____", "answers": ["64"], "why": "576 ÷ 9 = 64. Check: 64 × 9 = 576.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "9 does not fit in 5, so start with 57: how many 9s fit in 57?", "visual": {"kind": "longdiv", "text": "\n   ____\n9 ) 576"}}, {"type": "fill", "q": "Gobber has <b>395 rivets</b> to share equally among <b>5 workers</b>. How many rivets does each worker get?", "answers": ["79", "79 rivets"], "why": "395 ÷ 5 = 79 rivets. Check: 79 × 5 = 395.", "no": "Write the division, then solve it on paper one step at a time.", "hint": "Divide: 395 ÷ 5."}, {"q": "Each of <b>6 longships</b> carries <b>124 shields</b>. How many shields are there in all? Which number sentence solves it?", "choices": ["124 ÷ 6", "124 × 6", "124 + 6", "124 − 6"], "a": 1, "why": "Equal groups put together: multiply. 124 × 6 = 744 shields.", "no": ["This story puts groups together to find a total, so multiply.", null, "The groups are equal, so adding the two numbers does not work.", "Nothing is taken away in this story, so do not subtract."]}, {"q": "Fishlegs worked out <b>963 ÷ 9</b> and got <b>17</b>. Check: 17 × 9 = 153, not 963. Find the mistake in the work.", "choices": ["The first digit should be 2.", "Nothing is wrong. The answer is accurate.", "A placeholder 0 is missing in the quotient. The answer is 107.", "The first subtraction is wrong."], "a": 2, "why": "A placeholder 0 is missing in the quotient. The answer is 107. Fix it and finish: 963 ÷ 9 = 107. Check: 107 × 9 = 963.", "no": ["2 × 9 = 18. That is too big.", "Check: 17 × 9 = 153, not 963. That discrepancy means there is a mistake.", null, "Check it: that subtraction is correct."], "visual": {"kind": "longdiv", "text": "    17\n   ____\n9 ) 963\n   -9\n   --\n    063\n    -63\n    ---\n      0"}}, {"type": "fill", "q": "Convince me: check <b>740 ÷ 5 = 148</b> by multiplying. 148 × 5 = ____", "answers": ["740"], "why": "100 × 5 + 40 × 5 + 8 × 5 = 500 + 200 + 40 = 740. It matches, so 740 ÷ 5 = 148 is accurate.", "no": "Break 148 apart: 100 + 40 + 8. Multiply each part by 5, then add."}, {"type": "fill", "q": "Careful and complete, checking every part, is ____. (Use a word from your word cards.)", "answers": ["thorough"], "why": "<i>Thorough</i> means careful and complete.", "no": "It starts with th-."}, {"q": "In <i>How to Train Your Dragon</i>, what is the young Vikings' <b>initiation</b>?", "choices": ["a feast", "a test they must pass to become full members of the tribe", "a long sea voyage home", "a dragon's nap"], "a": 1, "why": "An <i>initiation</i> is a test or ceremony to become a full member of a group.", "no": ["A feast is a celebration, not a test.", null, "A voyage is a trip by sea.", "A nap has nothing to do with joining a group."]}, {"q": "Hiccup checks <b>399 ÷ 7 = 57</b> and gets 57 × 7 = 399. What can he <b>conclude</b>?", "choices": ["The answer is wrong.", "He needs a placeholder zero.", "The answer is right.", "He should add instead."], "a": 2, "why": "The check matches the dividend, so he can conclude the answer is right.", "no": ["The check matches, so it is not wrong.", "57 has no missing place.", null, "Dividing was the right operation."]}], [{"type": "fill", "q": "Use long division: <b>924 ÷ 4</b> = ____", "answers": ["231"], "why": "924 ÷ 4 = 231. Check: 231 × 4 = 924.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 4s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ____\n4 ) 924"}}, {"type": "fill", "q": "Use long division: <b>436 ÷ 4</b> = ____", "answers": ["109"], "why": "436 ÷ 4 = 109. Check: 109 × 4 = 436.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 4s fit in 4?", "visual": {"kind": "longdiv", "text": "\n   ____\n4 ) 436"}}, {"type": "fill", "q": "Use long division: <b>474 ÷ 6</b> = ____", "answers": ["79"], "why": "474 ÷ 6 = 79. Check: 79 × 6 = 474.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "6 does not fit in 4, so start with 47: how many 6s fit in 47?", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 474"}}, {"type": "fill", "q": "<b>928 stones</b> are piled into <b>8 equal piles</b> to build a wall. How many stones are in each pile?", "answers": ["116", "116 stones"], "why": "928 ÷ 8 = 116 stones. Check: 116 × 8 = 928.", "no": "Write the division, then solve it on paper one step at a time.", "hint": "Divide: 928 ÷ 8."}, {"q": "<b>186 Vikings</b> stand in <b>3 equal rows</b>. How many Vikings are in each row? Which number sentence solves it?", "choices": ["186 − 3", "186 ÷ 3", "186 × 3", "186 + 3"], "a": 1, "why": "A total split into equal parts: divide. 186 ÷ 3 = 62 Vikings.", "no": ["Nothing is taken away in this story, so do not subtract.", null, "This story splits a total into equal parts, so divide.", "The groups are equal, so adding the two numbers does not work."]}, {"q": "Hiccup worked out <b>948 ÷ 6</b> and got <b>154 R 4</b>. Check: 154 × 6 + 4 = 928, not 948. Find the mistake in the work.", "choices": ["A placeholder 0 is missing in the quotient.", "He forgot to bring down a digit.", "Nothing is wrong. The answer is accurate.", "The multiplication is wrong: 5 × 6 = 30, not 32."], "a": 3, "why": "The multiplication is wrong: 5 × 6 = 30, not 32. Fix it and finish: 948 ÷ 6 = 158. Check: 158 × 6 = 948.", "no": ["Every place in the quotient has a digit. Check each multiplication.", "Every digit was brought down. Check each multiplication.", "Check: 154 × 6 + 4 = 928, not 948. That discrepancy means there is a mistake.", null], "visual": {"kind": "longdiv", "text": "    154 R4\n   ____\n6 ) 948\n   -6\n   --\n    34\n   -32\n   ---\n     28\n    -24\n    ---\n      4"}}, {"type": "fill", "q": "Convince me: check <b>972 ÷ 9 = 108</b> by multiplying. 108 × 9 = ____", "answers": ["972"], "why": "100 × 9 + 8 × 9 = 900 + 72 = 972. It matches, so 972 ÷ 9 = 108 is accurate.", "no": "Break 108 apart: 100 + 8. Multiply each part by 9, then add."}, {"type": "fill", "q": "Long division is an ____: a set of steps that always works. (Use a word from your word cards.)", "answers": ["algorithm"], "why": "An <i>algorithm</i> is a set of steps that always works in order.", "no": "It starts with al-."}, {"q": "Which sentence uses <b>convince</b> correctly?", "choices": ["I convince the dragon to the cave.", "Convince is the answer to a division.", "The check will convince you my answer is right.", "She convinced 7 × 8 = 56 in her head."], "a": 2, "why": "To <i>convince</i> is to make someone believe something is true.", "no": ["You lead a dragon to a cave; you convince a person of an idea.", "That is the quotient.", null, "You calculate a fact; you convince a person."]}, {"q": "Which story is solved by <b>multiplying</b>?", "choices": ["168 fish shared by 4 dragons", "8 nests with 112 eggs in each nest", "642 arrows packed 6 to a bundle", "305 apples in 5 equal barrels"], "a": 1, "why": "Equal groups put together to find a total: 8 × 112 = 896 eggs.", "no": ["Sharing a total: divide.", null, "Packing a total into equal bundles: divide.", "Splitting a total into equal barrels: divide."]}]]}], "win": "Long division detective: you solved it, checked it, and caught every mistake!", "prev": "bb-bailey-L14", "prevTitle": "Lesson 14"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hid
