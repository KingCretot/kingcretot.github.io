<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 10</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Fact Families and Leftovers</h1><p style="margin:0 0 12px;color:#5b6578">Three tries on each one, but only your first try counts. For leftovers, find the biggest fact that fits first. Type remainders like 4 R 2.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 10", "title": "Fact Families and Leftovers", "mastery": 90, "color": "#E67E22", "questions": [{"q": "Which fact is <b>NOT</b> in the 8, 9, 72 family?", "choices": ["72 ÷ 8 = 9", "9 × 8 = 72", "72 ÷ 9 = 8", "72 ÷ 6 = 12"], "a": 3, "why": "72 ÷ 6 = 12 is true, but it uses 6 and 12. They are not in the 8, 9, 72 family.", "no": ["That one uses 8, 9 and 72, so it belongs.", "The turn-around fact belongs.", "That one uses 8, 9 and 72, so it belongs.", null]}, {"type": "fill", "q": "Finish the family: 7 × 9 = 63, 9 × 7 = 63, 63 ÷ 7 = 9, and 63 ÷ 9 = ____", "answers": ["7"], "why": "9 × 7 = 63, so 63 ÷ 9 = 7.", "no": "Which number has not been the answer yet?"}, {"type": "fill", "q": "What is the missing number in this fact triangle? Type it.", "answers": ["8"], "why": "6 × 8 = 48, so 48 ÷ 6 = 8.", "no": "Ask: 6 × what = 48?", "visual": {"kind": "triangle", "a": 6, "b": "?", "c": 48}}, {"type": "fill", "q": "How many <b>different</b> facts are in the <b>8, 8, 64</b> family? Type a number.", "answers": ["2"], "why": "8 × 8 = 64 and 64 ÷ 8 = 8. Only 2 different facts.", "no": "8 × 8 turned around is still 8 × 8."}, {"type": "fill", "q": "<b>20 ÷ 6</b> = ____", "answers": ["3 R 2", "3R2", "3 R2", "3R 2", "3 remainder 2", "3 rem 2"], "why": "6 × 3 = 18 and 20 − 18 = 2. So 20 ÷ 6 = 3 R 2.", "no": "Find the biggest 6s fact that fits under 20 without going over.", "hint": "6 × 3 = 18. How many are left?", "placeholder": "like 4 R 2"}, {"type": "fill", "q": "<b>47 ÷ 8</b> = ____", "answers": ["5 R 7", "5R7", "5 R7", "5R 7", "5 remainder 7", "5 rem 7"], "why": "8 × 5 = 40 and 47 − 40 = 7. So 47 ÷ 8 = 5 R 7.", "no": "Find the biggest 8s fact that fits under 47 without going over.", "hint": "8 × 5 = 40. How many are left?", "placeholder": "like 4 R 2"}, {"type": "fill", "q": "Hiccup has <b>29 cod</b> to share equally among <b>9 dragons</b>. How many cod are <b>left over</b>?", "answers": ["2", "2 cod"], "why": "9 × 3 = 27 and 29 − 27 = 2. So 29 ÷ 9 = 3 R 2: 2 cod left over.", "no": "Find the biggest 9s fact under 29 first."}, {"q": "Which division has a remainder?", "choices": ["36 ÷ 9", "44 ÷ 6", "42 ÷ 7", "48 ÷ 6"], "a": 1, "why": "6 × 7 = 42, so 44 ÷ 6 = 7 R 2.", "no": ["9 × 4 = 36 exactly.", null, "7 × 6 = 42 exactly.", "6 × 8 = 48 exactly."]}, {"q": "What does <b>evenly</b> mean in \"42 splits evenly into 7 groups\"?", "choices": ["slowly and carefully", "with some left over", "in equal parts with nothing left over", "in groups of 2"], "a": 2, "why": "7 × 6 = 42 exactly, so the groups are equal with nothing left.", "no": ["That is not what evenly means in math.", "That is the opposite.", null, "Evenly is not about even numbers."]}, {"q": "Food was <b>scarce</b>, so the Vikings…", "choices": ["had a surplus of food", "had very little food", "shared it evenly", "threw a giant feast"], "a": 1, "why": "<i>Scarce</i> means there is very little.", "no": ["Surplus is extra, the opposite of scarce.", null, "Scarce tells how much there was, not how it was shared.", "With scarce food, a feast is unlikely."]}, {"type": "fill", "q": "Which word means \"to talk together to reach an agreement\"?", "answers": ["negotiate"], "why": "To <i>negotiate</i> is to talk until you agree.", "no": "It starts with n."}, {"q": "Fishlegs wrote <b>34 ÷ 6 = 4 R 10</b>. Which is the right answer?", "choices": ["4 R 10", "6 R 2", "5 R 4", "5"], "a": 2, "why": "6 × 5 = 30 and 34 − 30 = 4. So 34 ÷ 6 = 5 R 4.", "no": ["That is his answer. 10 left over is more than 6, so one more group fits.", "6 × 6 = 36. That is more than 34.", null, "6 × 5 = 30. You forgot the 4 left over."]}]});</script></body></html>
