<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 10</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Fact Families and Leftovers</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. For leftovers, find the biggest fact that fits first.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 10", "title": "Fact Families and Leftovers", "mastery": 90, "color": "#E67E22", "questions": [{"q": "Which fact is <b>NOT</b> in the 8, 9, 72 family?", "choices": ["72 ÷ 8 = 9", "9 × 8 = 72", "72 ÷ 9 = 8", "72 ÷ 6 = 12"], "a": 3, "why": "72 ÷ 6 = 12 is true, but it uses 6 and 12. They are not in the 8, 9, 72 family.", "no": ["That one uses 8, 9 and 72, so it belongs.", "The turn-around fact belongs.", "That one uses 8, 9 and 72, so it belongs.", null]}, {"q": "Finish the family: 7 × 9 = 63, 9 × 7 = 63, 63 ÷ 7 = 9, and ___", "choices": ["63 ÷ 9 = 7", "7 ÷ 63 = 9", "63 − 9 = 54", "9 ÷ 7 = 63"], "a": 0, "why": "The last fact divides 63 by the other number: 63 ÷ 9 = 7.", "no": [null, "Backward. The biggest number comes first.", "Subtraction does not belong.", "Division of 9 by 7 can't make 63."]}, {"q": "What is the missing number?", "choices": ["7", "8", "42", "54"], "a": 1, "why": "6 × 8 = 48.", "no": ["6 × 7 = 42, not 48.", null, "42 is 48 − 6.", "54 is 48 + 6."], "visual": {"kind": "triangle", "a": 6, "b": "?", "c": 48}}, {"q": "How many <b>different</b> facts are in the <b>8, 8, 64</b> family?", "choices": ["4", "3", "2", "8"], "a": 2, "why": "8 × 8 = 64 and 64 ÷ 8 = 8. Only 2 different facts.", "no": ["8 × 8 turned around is still 8 × 8.", "One multiplication, one division. Count again.", null, "That is one of the numbers, not the number of facts."]}, {"q": "<b>20 ÷ 6</b> = ?", "choices": ["2 R 8", "4 R 4", "3 R 2", "3"], "a": 2, "why": "6 × 3 = 18 and 20 − 18 = 2.", "no": ["8 left over is more than 6. One more group fits.", "6 × 4 = 24. That is more than 20.", null, "6 × 3 = 18. You forgot the 2 left over."]}, {"q": "<b>47 ÷ 8</b> = ?", "choices": ["5 R 7", "6 R 1", "4 R 15", "5"], "a": 0, "why": "8 × 5 = 40 and 47 − 40 = 7.", "no": [null, "8 × 6 = 48. That is more than 47.", "15 left over is more than 8.", "8 × 5 = 40. You forgot the 7 left over."]}, {"q": "Hiccup has <b>29 cod</b> to share equally among <b>9 dragons</b>. How many cod are left over?", "choices": ["3", "20", "11", "2"], "a": 3, "why": "9 × 3 = 27 and 29 − 27 = 2. So 29 ÷ 9 = 3 R 2.", "no": ["3 is how many each dragon gets, not the leftovers.", "20 is 29 − 9.", "11 is more than 9. More cod can be shared.", null]}, {"q": "Which division has a remainder?", "choices": ["36 ÷ 9", "44 ÷ 6", "42 ÷ 7", "48 ÷ 6"], "a": 1, "why": "6 × 7 = 42, so 44 ÷ 6 = 7 R 2.", "no": ["9 × 4 = 36 exactly.", null, "7 × 6 = 42 exactly.", "6 × 8 = 48 exactly."]}, {"q": "What does <b>evenly</b> mean in \"42 splits evenly into 7 groups\"?", "choices": ["in equal parts with nothing left over", "slowly and carefully", "with some left over", "in groups of 2"], "a": 0, "why": "7 × 6 = 42 exactly, so the groups are equal with nothing left.", "no": [null, "That is not what evenly means in math.", "That is the opposite.", "Evenly is not about even numbers."]}, {"q": "Food was <b>scarce</b>, so the Vikings…", "choices": ["had a surplus of food", "had very little food", "shared it evenly", "threw a giant feast"], "a": 1, "why": "<i>Scarce</i> means there is very little.", "no": ["Surplus is extra, the opposite of scarce.", null, "Scarce tells how much there was, not how it was shared.", "With scarce food, a feast is unlikely."]}, {"q": "Which word means \"to talk together to reach an agreement\"?", "choices": ["hesitate", "ration", "surplus", "negotiate"], "a": 3, "why": "To <i>negotiate</i> is to talk until you agree.", "no": ["Hesitate means to stop for a moment.", "Ration means to give out small amounts.", "Surplus means an extra amount.", null]}]});</script></body></html>
