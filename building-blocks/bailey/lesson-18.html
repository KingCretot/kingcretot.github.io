<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 18: Prove It: Remainders and Checking</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L18", "label": "Lesson 18", "title": "Prove It: Remainders and Checking", "goal": "I can divide with remainders, check my answer two ways, find mistakes, and decide what a remainder means in a story.", "date": "2026-12-17", "mastery": 90, "color": "#00A8A8", "slides": [{"type": "hello", "title": "On Your Own: Remainders and Checking", "text": "In class you proved you can divide, check, find mistakes, and decide what a remainder means. Now prove it on your own with paper and a pencil. It takes about 25 minutes and ends with <b>Show What You Know</b>.", "visual": {"kind": "emoji", "text": "🏆✔️"}}, {"type": "talk", "kick": "Say it out loud", "title": "Teach it to someone", "text": "Find someone at home. Teach them. Say it out loud before you go on.", "prompts": ["Show them 817 ÷ 4 on paper. Point to the placeholder zero and the remainder.", "Explain why 141 R 7 is wrong for 853 ÷ 6, even though the check matches.", "Tell them one thing you <b>accomplished</b> this month and how you will keep your <b>momentum</b> over the break."], "starters": ["The 0 is there because …", "It is wrong because the remainder …", "This month I accomplished …"]}, {"type": "vocab", "kick": "Word Power", "title": "Remember the words", "text": "Tap each card. Say the meaning before you flip it. Then flip to check yourself.", "words": [{"word": "expression", "pos": "noun", "emoji": "🧮", "meaning": "In math, numbers and operation signs written together, like 24 × 4 + 1.", "example": "The check for 97 ÷ 4 = 24 R 1 is the <b>expression</b> 24 × 4 + 1."}, {"word": "retrace", "pos": "verb", "emoji": "↩️", "meaning": "To go back over the same steps again.", "example": "When the check does not match, <b>retrace</b> your steps to find the mistake."}, {"word": "diligent", "pos": "adjective", "emoji": "🐝", "meaning": "Working hard and carefully.", "example": "A <b>diligent</b> student checks every remainder."}, {"word": "accomplish", "pos": "verb", "emoji": "🏆", "meaning": "To finish something successfully.", "example": "This month you <b>accomplished</b> long division with remainders."}, {"word": "festive", "pos": "adjective", "emoji": "🎉", "meaning": "Cheerful and full of celebration, like a holiday.", "example": "The house looks <b>festive</b> with lights for the holidays."}, {"word": "momentum", "pos": "noun", "emoji": "🚀", "meaning": "The energy that keeps something moving forward.", "example": "A little practice each week keeps your <b>momentum</b> going over the break."}, {"word": "seasoned", "pos": "adjective", "emoji": "🧭", "meaning": "Having lots of practice and experience.", "example": "Gobber is a <b>seasoned</b> Viking who trains the young Vikings."}]}, {"type": "learn", "kick": "Remember", "title": "Two-part check", "text": "Here is <b>925 ÷ 6</b>, finished.", "visual": {"kind": "longdiv", "text": "    154 R1\n   ____\n6 ) 925\n   -6\n   --\n    32\n   -30\n   ---\n     25\n    -24\n    ---\n      1"}, "steps": [{"text": "<b>Part 1:</b> the expression 154 × 6 + 1 = 924 + 1 = 925 ✔ matches the dividend."}, {"text": "<b>Part 2:</b> the remainder 1 is smaller than the divisor 6 ✔"}], "tip": "Then, in a story, read the question again: round up, drop it, or the remainder is the answer."}, {"type": "tap", "kick": "Your turn", "title": "Solve on paper", "text": "Copy each problem on your paper. Solve it. Type the answer with R.", "items": [{"type": "fill", "q": "Use long division: <b>83 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["13 R 5", "13R5", "13 r 5", "13 remainder 5", "13 rem 5", "13 r5"], "why": "83 ÷ 6 = 13 R 5. Check: 13 × 6 + 5 = 83.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 6s fit in 8?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n6 ) 83"}}, {"type": "fill", "q": "Use long division: <b>758 ÷ 5</b> = ____ &nbsp; (use R for the remainder)", "answers": ["151 R 3", "151R3", "151 r 3", "151 remainder 3", "151 rem 3", "151 r3"], "why": "758 ÷ 5 = 151 R 3. Check: 151 × 5 + 3 = 758.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 5s fit in 7?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n5 ) 758"}}, {"type": "fill", "q": "Use long division: <b>613 ÷ 3</b> = ____ &nbsp; (use R for the remainder)", "answers": ["204 R 1", "204R1", "204 r 1", "204 remainder 1", "204 rem 1", "204 r1"], "why": "613 ÷ 3 = 204 R 1. Check: 204 × 3 + 1 = 613.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 3s fit in 6?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n3 ) 613"}}]}, {"type": "tap", "kick": "Your turn", "title": "Check it", "items": [{"type": "fill", "q": "Check <b>83 ÷ 6 = 13 R 5</b>: &nbsp; 13 × 6 + 5 = ____", "answers": ["83"], "why": "13 × 6 = 78, and 78 + 5 = 83. It matches the dividend, so the answer is right.", "no": "Multiply 13 × 6 first. Then add the remainder 5."}, {"type": "fill", "q": "Check <b>613 ÷ 3 = 204 R 1</b>: &nbsp; 204 × 3 + 1 = ____", "answers": ["613"], "why": "204 × 3 = 612, and 612 + 1 = 613. It matches the dividend, so the answer is right.", "no": "Multiply 204 × 3 first. Then add the remainder 1."}, {"type": "fill", "q": "When you divide by <b>3</b>, what is the biggest remainder you can ever have?", "answers": ["2", "two"], "why": "The remainder must be smaller than the divisor, so the maximum remainder for ÷ 3 is 2. A remainder of 3 would make one more group.", "no": "It must be smaller than 3."}]}, {"type": "tap", "kick": "Your turn", "title": "Find the mistake", "items": [{"q": "Fishlegs worked out <b>467 ÷ 4</b> and got <b>115 R 7</b>. Check: 115 × 4 + 7 = 467. The check matches, but the answer is still wrong. Why?", "choices": ["He forgot to bring down a digit.", "Nothing is wrong. The check matches.", "The remainder 7 is not smaller than 4, so the last digit of the quotient is too small. It should be 6.", "A placeholder 0 is missing in the quotient."], "a": 2, "why": "The remainder 7 is not smaller than 4, so the last digit of the quotient is too small. It should be 6. Fix it and finish: 467 ÷ 4 = 116 R 3. Check: 116 × 4 + 3 = 467.", "no": ["Every digit was brought down.", "The check matches, but a remainder of 7 breaks the rule: it must be smaller than 4.", null, "Every place in the quotient has a digit."], "visual": {"kind": "longdiv", "text": "    115 R7\n   ____\n4 ) 467\n   -4\n   --\n    06\n    -4\n    --\n     27\n    -20\n    ---\n      7"}}, {"q": "Snotlout worked out <b>869 ÷ 6</b> and got <b>143 R 1</b>. Check: 143 × 6 + 1 = 859, not 869. Find the mistake in the work.", "choices": ["Nothing is wrong. The answer is accurate.", "The subtraction is wrong: 26 − 24 = 2, not 1.", "A placeholder 0 is missing in the quotient.", "The first digit should be 2."], "a": 1, "why": "The subtraction is wrong: 26 − 24 = 2, not 1. Fix it and finish: 869 ÷ 6 = 144 R 5. Check: 144 × 6 + 5 = 869.", "no": ["Check: 143 × 6 + 1 = 859, not 869. That discrepancy means there is a mistake.", null, "Look at the quotient: every place has a digit. Look at the subtractions instead.", "2 × 6 = 12. That is too big."], "visual": {"kind": "longdiv", "text": "    143 R1\n   ____\n6 ) 869\n   -6\n   --\n    26\n   -24\n   ---\n     19\n    -18\n    ---\n      1"}}]}, {"type": "tap", "kick": "Your turn", "title": "Remainder stories", "text": "Solve on paper. Decide. Type the answer.", "items": [{"type": "fill", "q": "<b>130 kids</b> go to a show. Each bus holds <b>9</b>. How many buses are needed?", "answers": ["15", "15 buses"], "why": "130 ÷ 9 = 14 R 4. 14 is not enough: 4 would be left out. Round up: <b>15 buses</b>.", "no": "Divide first: 130 ÷ 9. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"type": "fill", "q": "A box holds <b>6</b> dragon eggs. How many boxes can be filled with <b>112 eggs</b>?", "answers": ["18", "18 boxes"], "why": "112 ÷ 6 = 18 R 4. Only 18 are full; the 4 left over cannot make another one. Drop the remainder: <b>18 boxes</b>.", "no": "Divide first: 112 ÷ 6. Then read the question again: what does it ask for?", "hint": "Can the leftover make a full one? If not, do not count it."}, {"q": "<b>77 apples</b> are shared equally among <b>5</b> dragons. How many apples are left over? <br>77 ÷ 5 = 15 R 2. Which answer makes sense?", "choices": ["15 R 2 apples", "16 apples", "2 apples", "15 apples"], "a": 2, "why": "77 ÷ 5 = 15 R 2. The question asks what is left over: 2.", "no": ["You cannot have 15 R 2 apples. A story answer needs a whole number that makes sense.", "16 is not left over. The left over part is the remainder.", null, "15 is how many full groups, not how many are left."]}]}, {"type": "tap", "kick": "Word work", "title": "Words in action", "text": "Type the word.", "items": [{"type": "fill", "q": "To finish something successfully is to ____ it. (Use a word from your word cards.)", "answers": ["accomplish"], "why": "To <i>accomplish</i> is to finish something successfully.", "no": "It starts with ac-."}, {"type": "fill", "q": "Numbers and operation signs written together, like 62 × 7 + 3, make an ____. (Use a word from your word cards.)", "answers": ["expression"], "why": "An <i>expression</i> is numbers and operation signs written together.", "no": "It starts with ex-."}, {"q": "A Viking captain has sailed for forty years and knows every rock in the sea. Which word describes him?", "choices": ["festive", "seasoned", "stubborn", "momentum"], "a": 1, "why": "<i>Seasoned</i> means having lots of practice and experience.", "no": ["Festive means full of celebration.", null, "Stubborn means not willing to change.", "Momentum is energy that keeps you going."]}]}, {"type": "recall", "kick": "Remember?", "title": "Earlier lessons", "items": [{"type": "fill", "q": "Use the area model: <b>67 × 8</b> = ____", "answers": ["536"], "why": "60 × 8 = 480 and 7 × 8 = 56. 480 + 56 = 536.", "no": "60 × 8 = 480. Now add 7 × 8.", "visual": {"kind": "area", "b": 8, "split": [60, 7], "show": false}}, {"type": "fill", "q": "Use long division: <b>728 ÷ 8</b> = ____", "answers": ["91"], "why": "728 ÷ 8 = 91. Check: 91 × 8 = 728.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "8 does not fit in 7, so start with 72: how many 8s fit in 72?", "visual": {"kind": "longdiv", "text": "\n   ____\n8 ) 728"}}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Use long division: <b>89 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["14 R 5", "14R5", "14 r 5", "14 remainder 5", "14 rem 5", "14 r5"], "why": "89 ÷ 6 = 14 R 5. Check: 14 × 6 + 5 = 89.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 6s fit in 8?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n6 ) 89"}}, {"type": "fill", "q": "Use long division: <b>758 ÷ 3</b> = ____ &nbsp; (use R for the remainder)", "answers": ["252 R 2", "252R2", "252 r 2", "252 remainder 2", "252 rem 2", "252 r2"], "why": "758 ÷ 3 = 252 R 2. Check: 252 × 3 + 2 = 758.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 3s fit in 7?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n3 ) 758"}}, {"type": "fill", "q": "Use long division: <b>827 ÷ 4</b> = ____ &nbsp; (use R for the remainder)", "answers": ["206 R 3", "206R3", "206 r 3", "206 remainder 3", "206 rem 3", "206 r3"], "why": "827 ÷ 4 = 206 R 3. Check: 206 × 4 + 3 = 827.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 4s fit in 8?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n4 ) 827"}}, {"type": "fill", "q": "Check <b>89 ÷ 6 = 14 R 5</b>: &nbsp; 14 × 6 + 5 = ____", "answers": ["89"], "why": "14 × 6 = 84, and 84 + 5 = 89. It matches the dividend, so the answer is right.", "no": "Multiply 14 × 6 first. Then add the remainder 5."}, {"q": "Fishlegs worked out <b>593 ÷ 7</b> and got <b>83 R 12</b>. Check: 83 × 7 + 12 = 593. The check matches, but the answer is still wrong. Why?", "choices": ["The remainder 12 is not smaller than 7, so the last digit of the quotient is too small. It should be 4.", "A placeholder 0 is missing in the quotient.", "He forgot to bring down a digit.", "Nothing is wrong. The check matches."], "a": 0, "why": "The remainder 12 is not smaller than 7, so the last digit of the quotient is too small. It should be 4. Fix it and finish: 593 ÷ 7 = 84 R 5. Check: 84 × 7 + 5 = 593.", "no": [null, "Every place in the quotient has a digit.", "Every digit was brought down.", "The check matches, but a remainder of 12 breaks the rule: it must be smaller than 7."], "visual": {"kind": "longdiv", "text": "     83 R12\n   ____\n7 ) 593\n   -56\n   ---\n     33\n    -21\n    ---\n     12"}}, {"type": "fill", "q": "<b>95 Vikings</b> cross the sea. Each ship holds <b>8</b>. How many ships are needed?", "answers": ["12", "twelve", "12 ships"], "why": "95 ÷ 8 = 11 R 7. 11 is not enough: 7 would be left out. Round up: <b>12 ships</b>.", "no": "Divide first: 95 ÷ 8. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"type": "fill", "q": "Stoick shares <b>124 coins</b> equally among <b>9</b> warriors and keeps the rest. How many coins does he keep?", "answers": ["7", "seven", "7 coins"], "why": "124 ÷ 9 = 13 R 7. The question asks what is left over, so the answer is the remainder: <b>7 coins</b>.", "no": "Divide first: 124 ÷ 9. Then read the question again: what does it ask for?", "hint": "The question asks how many are LEFT. Which part of the answer is that?"}, {"q": "A rope is cut into <b>7</b>-foot pieces. How many whole pieces can be cut from <b>60 feet</b>? What do you do with the remainder?", "choices": ["The remainder is the answer", "Round up: add 1 to the quotient", "Drop the remainder: use only the quotient"], "a": 2, "why": "Only full groups count, so the leftovers are dropped.", "no": ["Read the question again: does it ask how many are left over?", "Read the question again: does it ask about everything fitting, or only full groups?", null]}, {"type": "fill", "q": "To go back over the same steps again is to ____. (Use a word from your word cards.)", "answers": ["retrace"], "why": "To <i>retrace</i> is to go back over the same steps.", "no": "It starts with re-."}, {"q": "Which word means <i>the energy that keeps something moving forward</i>?", "choices": ["expression", "festive", "diligent", "momentum"], "a": 3, "why": "<i>Momentum</i> is the energy that keeps something moving forward.", "no": ["An expression is numbers and signs.", "Festive means full of celebration.", "Diligent means working hard and carefully.", null]}], [{"type": "fill", "q": "Use long division: <b>97 ÷ 7</b> = ____ &nbsp; (use R for the remainder)", "answers": ["13 R 6", "13R6", "13 r 6", "13 remainder 6", "13 rem 6", "13 r6"], "why": "97 ÷ 7 = 13 R 6. Check: 13 × 7 + 6 = 97.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 7s fit in 9?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n7 ) 97"}}, {"type": "fill", "q": "Use long division: <b>851 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["141 R 5", "141R5", "141 r 5", "141 remainder 5", "141 rem 5", "141 r5"], "why": "851 ÷ 6 = 141 R 5. Check: 141 × 6 + 5 = 851.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 6s fit in 8?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 851"}}, {"type": "fill", "q": "Use long division: <b>622 ÷ 3</b> = ____ &nbsp; (use R for the remainder)", "answers": ["207 R 1", "207R1", "207 r 1", "207 remainder 1", "207 rem 1", "207 r1"], "why": "622 ÷ 3 = 207 R 1. Check: 207 × 3 + 1 = 622.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 3s fit in 6?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n3 ) 622"}}, {"type": "fill", "q": "Check <b>851 ÷ 6 = 141 R 5</b>: &nbsp; 141 × 6 + 5 = ____", "answers": ["851"], "why": "141 × 6 = 846, and 846 + 5 = 851. It matches the dividend, so the answer is right.", "no": "Multiply 141 × 6 first. Then add the remainder 5."}, {"q": "Snotlout worked out <b>925 ÷ 9</b> and got <b>12 R 7</b>. Check: 12 × 9 + 7 = 115, not 925. Find the mistake in the work.", "choices": ["The first subtraction is wrong.", "The first digit should be 2.", "Nothing is wrong. The answer is accurate.", "A placeholder 0 is missing in the quotient. The answer is 102 R 7."], "a": 3, "why": "A placeholder 0 is missing in the quotient. The answer is 102 R 7. Fix it and finish: 925 ÷ 9 = 102 R 7. Check: 102 × 9 + 7 = 925.", "no": ["Check it: that subtraction is correct.", "2 × 9 = 18. That is too big.", "Check: 12 × 9 + 7 = 115, not 925. That discrepancy means there is a mistake.", null], "visual": {"kind": "longdiv", "text": "    12 R7\n   ____\n9 ) 925\n   -9\n   --\n    025\n    -18\n    ---\n      7"}}, {"type": "fill", "q": "A box holds <b>9</b> candles. How many boxes can be filled with <b>210 candles</b>?", "answers": ["23", "23 boxes"], "why": "210 ÷ 9 = 23 R 3. Only 23 are full; the 3 left over cannot make another one. Drop the remainder: <b>23 boxes</b>.", "no": "Divide first: 210 ÷ 9. Then read the question again: what does it ask for?", "hint": "Can the leftover make a full one? If not, do not count it."}, {"type": "fill", "q": "Toothless carries <b>4</b> logs per trip. How many trips to move <b>58 logs</b>?", "answers": ["15", "15 trips"], "why": "58 ÷ 4 = 14 R 2. 14 is not enough: 2 would be left out. Round up: <b>15 trips</b>.", "no": "Divide first: 58 ÷ 4. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"q": "<b>94 berries</b> are shared equally among <b>8</b> dragons. How many berries are left over? <br>94 ÷ 8 = 11 R 6. Which answer makes sense?", "choices": ["11 berries", "11 R 6 berries", "12 berries", "6 berries"], "a": 3, "why": "94 ÷ 8 = 11 R 6. The question asks what is left over: 6.", "no": ["11 is how many full groups, not how many are left.", "You cannot have 11 R 6 berries. A story answer needs a whole number that makes sense.", "12 is not left over. The left over part is the remainder.", null]}, {"type": "fill", "q": "Working hard and carefully is being ____. (Use a word from your word cards.)", "answers": ["diligent"], "why": "<i>Diligent</i> means working hard and carefully.", "no": "It starts with dil-."}, {"q": "The village looked <b>festive</b>. What does that mean?", "choices": ["dark and empty", "cheerful and full of celebration", "stubborn", "seasoned"], "a": 1, "why": "<i>Festive</i> means cheerful and full of celebration.", "no": ["That is the opposite of festive.", null, "Stubborn describes a person who will not change.", "Seasoned means having lots of experience."]}], [{"type": "fill", "q": "Use long division: <b>79 ÷ 3</b> = ____ &nbsp; (use R for the remainder)", "answers": ["26 R 1", "26R1", "26 r 1", "26 remainder 1", "26 rem 1", "26 r1"], "why": "79 ÷ 3 = 26 R 1. Check: 26 × 3 + 1 = 79.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 3s fit in 7?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ___\n3 ) 79"}}, {"type": "fill", "q": "Use long division: <b>947 ÷ 4</b> = ____ &nbsp; (use R for the remainder)", "answers": ["236 R 3", "236R3", "236 r 3", "236 remainder 3", "236 rem 3", "236 r3"], "why": "947 ÷ 4 = 236 R 3. Check: 236 × 4 + 3 = 947.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: how many 4s fit in 9?", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n4 ) 947"}}, {"type": "fill", "q": "Use long division: <b>458 ÷ 9</b> = ____ &nbsp; (use R for the remainder)", "answers": ["50 R 8", "50R8", "50 r 8", "50 remainder 8", "50 rem 8", "50 r8"], "why": "458 ÷ 9 = 50 R 8. Check: 50 × 9 + 8 = 458.", "no": "Go one step at a time. At the end, whatever is left after the last subtraction is the remainder.", "hint": "Start: 9 does not fit in 4, so start with 45.", "placeholder": "like 12 R 3", "visual": {"kind": "longdiv", "text": "\n   ____\n9 ) 458"}}, {"type": "fill", "q": "Check <b>458 ÷ 9 = 50 R 8</b>: &nbsp; 50 × 9 + 8 = ____", "answers": ["458"], "why": "50 × 9 = 450, and 450 + 8 = 458. It matches the dividend, so the answer is right.", "no": "Multiply 50 × 9 first. Then add the remainder 8."}, {"q": "Hiccup worked out <b>689 ÷ 5</b> and got <b>136 R 9</b>. Check: 136 × 5 + 9 = 689. The check matches, but the answer is still wrong. Why?", "choices": ["Nothing is wrong. The check matches.", "The remainder 9 is not smaller than 5, so the last digit of the quotient is too small. It should be 7.", "A placeholder 0 is missing in the quotient.", "He forgot to bring down a digit."], "a": 1, "why": "The remainder 9 is not smaller than 5, so the last digit of the quotient is too small. It should be 7. Fix it and finish: 689 ÷ 5 = 137 R 4. Check: 137 × 5 + 4 = 689.", "no": ["The check matches, but a remainder of 9 breaks the rule: it must be smaller than 5.", null, "Every place in the quotient has a digit.", "Every digit was brought down."], "visual": {"kind": "longdiv", "text": "    136 R9\n   ____\n5 ) 689\n   -5\n   --\n    18\n   -15\n   ---\n     39\n    -30\n    ---\n      9"}}, {"type": "fill", "q": "<b>87 eggs</b> are shared equally among <b>6</b> nests. How many eggs are left over?", "answers": ["3", "three", "3 eggs"], "why": "87 ÷ 6 = 14 R 3. The question asks what is left over, so the answer is the remainder: <b>3 eggs</b>.", "no": "Divide first: 87 ÷ 6. Then read the question again: what does it ask for?", "hint": "The question asks how many are LEFT. Which part of the answer is that?"}, {"type": "fill", "q": "Each tent sleeps <b>4</b> Vikings. How many tents for <b>150 Vikings</b>?", "answers": ["38", "38 tents"], "why": "150 ÷ 4 = 37 R 2. 37 is not enough: 2 would be left out. Round up: <b>38 tents</b>.", "no": "Divide first: 150 ÷ 4. Then read the question again: what does it ask for?", "hint": "Can the leftover ones be left behind? If not, you need one more."}, {"q": "Hiccup has <b>90 cents</b>. A fish costs <b>8 cents</b>. How many fish can he buy? What do you do with the remainder?", "choices": ["Drop the remainder: use only the quotient", "The remainder is the answer", "Round up: add 1 to the quotient"], "a": 0, "why": "Only full groups count, so the leftovers are dropped.", "no": [null, "Read the question again: does it ask how many are left over?", "Read the question again: does it ask about everything fitting, or only full groups?"]}, {"type": "fill", "q": "Having lots of practice and experience is being ____. (Use a word from your word cards.)", "answers": ["seasoned"], "why": "<i>Seasoned</i> means having lots of practice and experience.", "no": "It starts with sea-."}, {"q": "To <b>accomplish</b> a goal means to…", "choices": ["forget it", "finish it successfully", "start it over", "retrace it"], "a": 1, "why": "To <i>accomplish</i> is to finish something successfully.", "no": ["Forgetting is the opposite.", null, "Starting over is not finishing.", "Retrace means go back over steps."]}]]}], "win": "You accomplished long division with remainders. Enjoy a festive break!", "prev": "bb-bailey-L17", "prevTitle": "Lesson 17"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clie
