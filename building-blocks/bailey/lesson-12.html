<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 12: Welcome Back: What Did You Keep?</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L12", "label": "Lesson 12", "title": "Welcome Back: What Did You Keep?", "goal": "I can show what I remember: fact shortcuts, the area model, division facts and leftovers.", "date": "2026-12-03", "mastery": 90, "color": "#C9A84C", "slides": [{"type": "hello", "title": "On Your Own: Welcome Back!", "text": "In class you presented your poster and showed what you kept from before the break. Now you review on your own. It takes about 25 minutes and ends with <b>Show What You Know</b>.", "visual": {"kind": "emoji", "text": "🧠🐉"}}, {"type": "talk", "kick": "Say it out loud", "title": "Teach it to someone", "text": "Find someone at home. Say each answer out loud before you go on.", "prompts": ["Teach them the ×9 shortcut with 9 × 7. Then the ×6 shortcut with 6 × 8.", "Tell them what you <b>reflected</b> on while you made your Gratitude poster.", "Tell them about a moment in <i>How to Train Your Dragon</i> when a character was <b>resilient</b>."], "starters": ["To do 9 × 7, I …", "While I made my poster, I reflected on …", "… was resilient when …"]}, {"type": "vocab", "kick": "Word Power", "title": "Remember the words", "text": "Tap each card. Say the meaning before you flip it. Then flip to check yourself.", "words": [{"word": "array", "pos": "noun", "emoji": "🔲", "meaning": "Objects set out in equal rows and columns.", "example": "An <b>array</b> with 7 rows of 8 shields shows 7 × 8 = 56."}, {"word": "fluent", "pos": "adjective", "emoji": "⚡", "meaning": "Able to do something quickly, easily and correctly.", "example": "When you are <b>fluent</b> with 9 × 8, you know it is 72 without adding."}, {"word": "retain", "pos": "verb", "emoji": "🧠", "meaning": "To keep something, like keeping a fact in your memory.", "example": "Did you <b>retain</b> your fact shortcuts over the break?"}, {"word": "revisit", "pos": "verb", "emoji": "🔁", "meaning": "To go back to something and look at it again.", "example": "Today we <b>revisit</b> the area model before we learn long division."}, {"word": "reflect", "pos": "verb", "emoji": "🪞", "meaning": "To think carefully about something that happened.", "example": "The Gratitude Project helped me <b>reflect</b> on what my family means to me."}, {"word": "resilient", "pos": "adjective", "emoji": "🌱", "meaning": "Able to bounce back and keep going after something goes wrong.", "example": "A <b>resilient</b> learner tries a hard problem again instead of quitting."}, {"word": "saga", "pos": "noun", "emoji": "📜", "meaning": "A long story about heroes and their adventures, like the old stories about the Vikings.", "example": "Hiccup's adventures with Toothless feel like a Viking <b>saga</b>."}]}, {"type": "learn", "kick": "Remember", "title": "Your math toolbox", "text": "Tap <b>Show me the next step</b> to see each tool.", "steps": [{"text": "<b>×9</b> = ×10 minus one group &nbsp;·&nbsp; <b>×6</b> = ×5 plus one group &nbsp;·&nbsp; <b>×8</b> = double, double, double &nbsp;·&nbsp; <b>×7</b> = ×5 plus ×2"}, {"text": "<b>Area model:</b> 47 × 3 = 40 × 3 + 7 × 3 = 120 + 21 = 141.", "visual": {"kind": "area", "b": 3, "split": [40, 7], "show": true}}, {"text": "<b>Division:</b> 56 ÷ 8 asks 8 × ? = 56. The answer is 7."}, {"text": "<b>Leftovers:</b> 22 ÷ 4 = 5 R 2, because 4 × 5 = 20 and 2 are left. The remainder is smaller than the divisor."}], "tip": "Never add the same number over and over. Pick a tool."}, {"type": "tap", "kick": "Your turn", "title": "Fact shortcuts", "items": [{"type": "fill", "q": "<b>9 × 9</b> = ____", "answers": ["81"], "why": "90 − 9 = 81.", "no": "Use ×10 minus one group: 90 − 9."}, {"type": "fill", "q": "<b>8 × 6</b> = ____", "answers": ["48"], "why": "Double 6 is 12, then 24, then 48.", "no": "Double 6, then double again, then double again."}, {"type": "fill", "q": "<b>7 × 8</b> = ____", "answers": ["56"], "why": "5 × 8 = 40 and 2 × 8 = 16. 40 + 16 = 56.", "no": "Use ×5 plus ×2: 40 + 16."}, {"q": "Which shortcut finds <b>6 × 9</b> correctly?", "choices": ["6 × 10 − 9 = 51", "6 + 9 = 15", "5 × 9 + 9 = 54", "5 × 9 + 6 = 51"], "a": 2, "why": "×6 = ×5 plus one group: 5 × 9 = 45, plus one more 9 is 54.", "no": ["The ×9 shortcut takes away one group of 6, not 9: 60 − 6 = 54.", "That adds instead of multiplying.", null, "The extra group is one more 9, not one more 6."]}]}, {"type": "tap", "kick": "Your turn", "title": "The area model", "items": [{"type": "fill", "q": "Use the area model: <b>73 × 8</b> = ____", "answers": ["584"], "why": "70 × 8 = 560 and 3 × 8 = 24. 560 + 24 = 584.", "no": "70 × 8 = 560. Now add 3 × 8.", "visual": {"kind": "area", "b": 8, "split": [70, 3], "show": false}}, {"type": "fill", "q": "Use the area model: <b>59 × 6</b> = ____", "answers": ["354"], "why": "50 × 6 = 300 and 9 × 6 = 54. 300 + 54 = 354.", "no": "50 × 6 = 300. Now add 9 × 6.", "visual": {"kind": "area", "b": 6, "split": [50, 9], "show": false}}, {"q": "Which shows the area model for <b>46 × 7</b>?", "choices": ["4 × 7 + 6 × 7", "46 + 7", "40 × 7 + 6 × 7", "40 × 7 + 6"], "a": 2, "why": "46 = 40 + 6, so 46 × 7 = 40 × 7 + 6 × 7 = 280 + 42 = 322.", "no": ["The 4 is in the tens place. It means 40.", "That adds instead of multiplying.", null, "The 6 must be multiplied by 7 too."]}]}, {"type": "sort", "kick": "Sort it", "title": "Fact or area model?", "text": "Tap a problem. Then tap the box with the most efficient way to solve it.", "buckets": ["⚡ Just a fact<br><small>one step</small>", "🔲 Area model<br><small>two boxes</small>"], "items": [{"text": "9 × 8", "b": 0, "why": "Both numbers are single digits. It is one fact: 72.", "hint": "Are both numbers single digits?"}, {"text": "38 × 6", "b": 1, "why": "38 has tens and ones: 30 × 6 + 8 × 6.", "hint": "Does one number have tens and ones?"}, {"text": "7 × 6", "b": 0, "why": "One fact: 42.", "hint": "Are both numbers single digits?"}, {"text": "74 × 9", "b": 1, "why": "74 has tens and ones: 70 × 9 + 4 × 9.", "hint": "Does one number have tens and ones?"}, {"text": "8 × 8", "b": 0, "why": "One fact: 64.", "hint": "Are both numbers single digits?"}, {"text": "53 × 7", "b": 1, "why": "53 has tens and ones: 50 × 7 + 3 × 7.", "hint": "Does one number have tens and ones?"}], "done": "Single digits: use a fact. Tens and ones: use the area model."}, {"type": "tap", "kick": "Your turn", "title": "Division and fact families", "items": [{"type": "fill", "q": "<b>54 ÷ 9</b> = ____", "answers": ["6", "six"], "why": "9 × 6 = 54, so 54 ÷ 9 = 6.", "no": "Ask: 9 × what = 54?"}, {"type": "fill", "q": "<b>? ÷ 8 = 8</b>. What is the missing number?", "answers": ["64"], "why": "The biggest number is missing, so multiply: 8 × 8 = 64.", "no": "The biggest number is missing. Multiply."}, {"type": "fill", "q": "Three facts in a family: 7 × 6 = 42, 6 × 7 = 42, 42 ÷ 7 = 6. What is the missing division fact? Type it.", "answers": ["42 ÷ 6 = 7", "42/6=7", "42 / 6 = 7", "42 divided by 6 = 7", "42 divided by 6 is 7"], "why": "The missing fact is 42 ÷ 6 = 7.", "no": "Start with 42, the biggest number. Divide by 6.", "placeholder": "like 12 ÷ 3 = 4"}]}, {"type": "tap", "kick": "Your turn", "title": "Leftovers", "items": [{"type": "fill", "q": "<b>38 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["6 R 2", "6R2", "6 r 2", "6 remainder 2", "6 rem 2", "6 r2"], "why": "6 × 6 = 36 and 38 − 36 = 2. So 38 ÷ 6 = 6 R 2.", "no": "Find the biggest 6s fact that is not more than 38.", "placeholder": "like 4 R 2"}, {"type": "fill", "q": "<b>53 ÷ 7</b> = ____ &nbsp; (use R for the remainder)", "answers": ["7 R 4", "7R4", "7 r 4", "7 remainder 4", "7 rem 4", "7 r4"], "why": "7 × 7 = 49 and 53 − 49 = 4. So 53 ÷ 7 = 7 R 4.", "no": "7 × 7 = 49. How many are left?", "placeholder": "like 4 R 2"}, {"q": "Stoick has <b>45 fish</b> for <b>6 dragons</b>. Each dragon gets the same number. How many fish does each dragon get, and how many are left?", "choices": ["8 each, 0 left", "6 each, 9 left", "7 each, 4 left", "7 each, 3 left"], "a": 3, "why": "6 × 7 = 42 and 45 − 42 = 3. So 45 ÷ 6 = 7 R 3.", "no": ["6 × 8 = 48. That is more fish than Stoick has.", "9 left is more than 6. Each dragon can get one more.", "Check the subtraction: 45 − 42 = 3.", null]}]}, {"type": "tap", "kick": "Word work", "title": "Words in action", "text": "Type the word.", "items": [{"type": "fill", "q": "To keep facts in your memory is to ____ them. (Use a word from your word cards.)", "answers": ["retain"], "why": "To <i>retain</i> is to keep something.", "no": "It starts with r and ends with -ain."}, {"type": "fill", "q": "Objects set out in equal rows and columns make an ____. (Use a word from your word cards.)", "answers": ["array"], "why": "An <i>array</i> has equal rows and columns.", "no": "It starts with a."}, {"q": "Hiccup's plan failed, but he tried again the next day. Which word describes him?", "choices": ["resilient", "fluent", "retained", "revisit"], "a": 0, "why": "<i>Resilient</i> means you bounce back and keep going after something goes wrong.", "no": [null, "Fluent means quick and correct, not bouncing back.", "Retained means kept in memory.", "Revisit means go back and look again."]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "<b>9 × 7</b> = ____", "answers": ["63"], "why": "70 − 7 = 63.", "no": "Use ×10 minus one group: 70 − 7."}, {"type": "fill", "q": "<b>8 × 9</b> = ____", "answers": ["72"], "why": "Double 9 is 18, then 36, then 72.", "no": "Double, double, double: start with 18."}, {"q": "Which shortcut finds <b>7 × 6</b>?", "choices": ["5 × 6 + 2 × 6 = 30 + 12", "7 × 10 − 6 = 64", "5 × 6 + 2 = 32", "7 + 6 = 13"], "a": 0, "why": "×7 = ×5 plus ×2: 30 + 12 = 42.", "no": [null, "×10 minus one group only works for ×9.", "The 2 must be 2 × 6 = 12, not just 2.", "That adds instead of multiplying."]}, {"type": "fill", "q": "Use the area model: <b>65 × 8</b> = ____", "answers": ["520"], "why": "60 × 8 = 480 and 5 × 8 = 40. 480 + 40 = 520.", "no": "60 × 8 = 480. Now add 5 × 8.", "visual": {"kind": "area", "b": 8, "split": [60, 5], "show": false}}, {"q": "Which is the most efficient way to find <b>47 × 6</b>?", "choices": ["Add 47 six times", "4 × 6 + 7 × 6", "Area model: 40 × 6 + 7 × 6", "Count by 6s to 47"], "a": 2, "why": "The area model: 240 + 42 = 282.", "no": ["That works, but it is slow and easy to lose track.", "The 4 is in the tens place. It means 40.", null, "Counting to 47 does not find 47 × 6."]}, {"type": "fill", "q": "<b>63 ÷ 9</b> = ____", "answers": ["7", "seven"], "why": "9 × 7 = 63, so 63 ÷ 9 = 7.", "no": "Ask: 9 × what = 63?"}, {"type": "fill", "q": "<b>48 ÷ ? = 6</b>. What is the missing number?", "answers": ["8", "eight"], "why": "6 × 8 = 48, so 48 ÷ 8 = 6.", "no": "Ask: 6 × what = 48?"}, {"q": "<b>58 ÷ 8</b> = ?", "choices": ["6 R 10", "7 R 2", "8 R 0", "7 R 3"], "a": 1, "why": "8 × 7 = 56 and 58 − 56 = 2. So 58 ÷ 8 = 7 R 2.", "no": ["10 is bigger than 8. Another group fits.", null, "8 × 8 = 64. That is more than 58.", "Check the subtraction: 58 − 56 = 2."]}, {"type": "fill", "q": "Able to do something quickly, easily and correctly is ____. (Use a word from your word cards.)", "answers": ["fluent"], "why": "<i>Fluent</i> means quick, easy and correct.", "no": "It starts with f."}, {"q": "Before the test, Hiccup wants to <b>revisit</b> his notes about dragons. What will he do?", "choices": ["throw them away", "write brand-new notes", "hide them from Snotlout", "look at them again"], "a": 3, "why": "To <i>revisit</i> is to go back and look at something again.", "no": ["That is the opposite of revisiting.", "Revisiting means going back to what is already there.", "Hiding them does not mean looking at them again.", null]}], [{"type": "fill", "q": "<b>9 × 6</b> = ____", "answers": ["54"], "why": "60 − 6 = 54.", "no": "Use ×10 minus one group: 60 − 6."}, {"type": "fill", "q": "<b>7 × 9</b> = ____", "answers": ["63"], "why": "5 × 9 = 45 and 2 × 9 = 18. 45 + 18 = 63.", "no": "Use ×5 plus ×2: 45 + 18."}, {"q": "Which shortcut finds <b>8 × 7</b>?", "choices": ["7 + 7 + 7 = 21", "8 × 10 − 7 = 73", "5 × 8 + 7 = 47", "Double 7 three times: 14, 28, 56"], "a": 3, "why": "×8 = double, double, double: 14, 28, 56.", "no": ["That is only 3 sevens, and it is adding.", "×10 minus one group works for ×9, not ×8.", "×7 = ×5 plus ×2. You need 2 × 8 = 16, not 7.", null]}, {"type": "fill", "q": "Use the area model: <b>48 × 7</b> = ____", "answers": ["336"], "why": "40 × 7 = 280 and 8 × 7 = 56. 280 + 56 = 336.", "no": "40 × 7 = 280. Now add 8 × 7.", "visual": {"kind": "area", "b": 7, "split": [40, 8], "show": false}}, {"q": "Which problem is best solved with just a fact?", "choices": ["93 × 6", "9 × 6", "36 × 9", "69 × 3"], "a": 1, "why": "9 × 6 is one fact: 54. The others have tens and ones, so they need the area model.", "no": ["93 has tens and ones. Use the area model.", null, "36 has tens and ones. Use the area model.", "69 has tens and ones. Use the area model."]}, {"type": "fill", "q": "<b>56 ÷ 7</b> = ____", "answers": ["8", "eight"], "why": "7 × 8 = 56, so 56 ÷ 7 = 8.", "no": "Ask: 7 × what = 56?"}, {"type": "fill", "q": "<b>? ÷ 9 = 7</b>. What is the missing number?", "answers": ["63"], "why": "The biggest number is missing, so multiply: 7 × 9 = 63.", "no": "The biggest number is missing. Multiply."}, {"q": "<b>34 ÷ 6</b> = ?", "choices": ["5 R 4", "4 R 10", "6 R 0", "5 R 3"], "a": 0, "why": "6 × 5 = 30 and 34 − 30 = 4. So 34 ÷ 6 = 5 R 4.", "no": [null, "10 is bigger than 6. Another group fits.", "6 × 6 = 36. That is more than 34.", "Check the subtraction: 34 − 30 = 4."]}, {"type": "fill", "q": "To think carefully about something that happened is to ____. (Use a word from your word cards.)", "answers": ["reflect"], "why": "To <i>reflect</i> is to think carefully about something that happened.", "no": "It starts with r and ends with -ect."}, {"q": "Which is the best example of an <b>array</b>?", "choices": ["5 rows of chairs with 6 chairs in every row", "a pile of 30 chairs", "6 chairs in a line and 4 chairs in a circle", "one chair"], "a": 0, "why": "An <i>array</i> has equal rows and columns: 5 rows of 6.", "no": [null, "A pile has no rows or columns.", "The rows are not equal.", "One chair is not rows and columns."]}], [{"type": "fill", "q": "<b>6 × 8</b> = ____", "answers": ["48"], "why": "5 × 8 = 40, plus one more 8 is 48.", "no": "Use ×5 plus one group: 40 + 8."}, {"type": "fill", "q": "<b>9 × 4</b> = ____", "answers": ["36"], "why": "40 − 4 = 36.", "no": "Use ×10 minus one group: 40 − 4."}, {"q": "Which shortcut finds <b>9 × 8</b>?", "choices": ["90 − 8 = 82", "80 − 8 = 72", "9 + 8 = 17", "80 − 9 = 71"], "a": 1, "why": "×9 = ×10 minus one group: 10 × 8 = 80, then 80 − 8 = 72.", "no": ["Ten 8s is 80, not 90.", null, "That adds instead of multiplying.", "Take away one group of 8, not 9."]}, {"type": "fill", "q": "Use the area model: <b>76 × 5</b> = ____", "answers": ["380"], "why": "70 × 5 = 350 and 6 × 5 = 30. 350 + 30 = 380.", "no": "70 × 5 = 350. Now add 6 × 5.", "visual": {"kind": "area", "b": 5, "split": [70, 6], "show": false}}, {"q": "Snotlout found <b>34 × 7</b> like this: 3 × 7 + 4 × 7 = 21 + 28 = 49. What went wrong?", "choices": ["Nothing. 49 is right.", "He should add 34 + 7.", "He should have done 4 × 7 first.", "The 3 means 30, so the first box is 30 × 7 = 210."], "a": 3, "why": "34 = 30 + 4, so 34 × 7 = 210 + 28 = 238.", "no": ["49 is far too small. 34 × 7 is more than 30 × 7 = 210.", "That adds instead of multiplying.", "The order of the boxes does not matter.", null]}, {"type": "fill", "q": "<b>72 ÷ 8</b> = ____", "answers": ["9", "nine"], "why": "8 × 9 = 72, so 72 ÷ 8 = 9.", "no": "Ask: 8 × what = 72?"}, {"type": "fill", "q": "<b>54 ÷ ? = 9</b>. What is the missing number?", "answers": ["6", "six"], "why": "9 × 6 = 54, so 54 ÷ 6 = 9.", "no": "Ask: 9 × what = 54?"}, {"q": "Toothless has <b>30 fish</b>. He eats <b>4</b> a day. How many full days will the fish last, and how many fish are left?", "choices": ["8 days, 0 left", "6 days, 6 left", "7 days, 2 left", "7 days, 3 left"], "a": 2, "why": "4 × 7 = 28 and 30 − 28 = 2. So 30 ÷ 4 = 7 R 2.", "no": ["4 × 8 = 32. That is more fish than he has.", "6 left is more than 4. There is enough for another day.", null, "Check the subtraction: 30 − 28 = 2."]}, {"type": "fill", "q": "Able to bounce back and keep going after something goes wrong is ____. (Use a word from your word cards.)", "answers": ["resilient"], "why": "<i>Resilient</i> means you bounce back and keep going.", "no": "It starts with r and ends with -ient."}, {"q": "Which would most likely be called a <b>saga</b>?", "choices": ["the long tale of a Viking chief's voyages and battles", "a list of chores", "a math worksheet", "a weather report"], "a": 0, "why": "A <i>saga</i> is a long story about heroes and their adventures.", "no": [null, "A list of chores is not a story.", "A worksheet is not a story.", "A weather report is not a story about heroes."]}]]}], "win": "You kept your tools sharp over the break. You are ready for long division!", "prev": "bb-bailey-L11", "prevTitle": "Lesson 11"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
