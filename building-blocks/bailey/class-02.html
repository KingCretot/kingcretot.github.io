<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 2: Prove It: Every ×9 and ×6 Fact</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L02", "label": "Lesson 2", "title": "Prove It: Every ×9 and ×6 Fact", "goal": "I can solve any ×9 or ×6 fact, find a missing factor, and fix a wrong fact.", "date": "2026-10-22", "mastery": 90, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Prove It: Every ×9 and ×6 Fact", "text": "On Tuesday you learned two shortcuts. Today you <b>prove</b> you own them: flip facts around, find missing numbers, and catch mistakes like a dragon detective. 🐉🔍", "visual": {"kind": "emoji", "text": "🛡️ 9️⃣ 6️⃣ 🏆"}, "notes": {"do": "Collect her Lesson 1 packet page 1 and look at her Lesson 1 after-class score on the course page before you start.", "say": "\"Tuesday you learned the tools. Today you prove you own them. By the end of class you will catch a wrong fact in two seconds.\"", "ask": "\"What are the two shortcuts from Tuesday? Say them in one sentence each.\"", "listen": "\"×9: ten groups, take one group away.\" and \"×6: five groups, add one more group.\" If she says \"add 9 nine times,\" go straight to the recall slide and rebuild with counters."}}, {"type": "talk", "kick": "Book Talk", "title": "Talk about your book", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What happened in the part you read since Tuesday?", "How has Hiccup changed since the start of the book? Give one example.", "Use Tuesday's words: what is one <b>ingenious</b> thing Hiccup did, or one <b>strategy</b> he used?"], "starters": ["Since Tuesday, …", "At first Hiccup …, but now he …", "One ingenious thing Hiccup did was …"], "notes": {"do": "5–7 minutes. Book closed first, then she may open it to find a page.", "say": "\"Tell me what happened since Tuesday, in order. Then tell me how Hiccup is different now.\"", "ask": "\"How has Hiccup changed? Give one example from the book.\" Then: \"Use <b>ingenious</b> or <b>strategy</b> in a sentence about him.\"", "listen": "A real event in order (first, then, after that) and a before/after change (\"At first he … but now he …\"). If she only says \"he's braver,\" ask \"What did he DO that shows it?\""}}, {"type": "recall", "kick": "Remember", "title": "Tuesday's shortcuts", "text": "Quick review. Show me you remember!", "items": [{"q": "Which one is the ×9 shortcut for 9 × 9?", "choices": ["81 − 9", "90 − 1", "90 − 9", "100 − 9"], "a": 2, "why": "10 × 9 = 90, then take away one group of 9: 90 − 9 = 81.", "no": ["81 is already the answer. Start with 10 × 9 = 90.", "Take away a whole group of 9, not 1.", null, "100 is 10 × 10. Start with 10 × 9."]}, {"q": "Use ×5 plus one group. What is 6 × 9?", "choices": ["45 + 6 = 51", "45 + 9 = 54", "50 + 9 = 59", "54 − 9 = 45"], "a": 1, "why": "5 × 9 = 45, plus one more group of 9: 45 + 9 = 54.", "no": ["The extra group has 9 in it, not 6.", null, "5 × 9 is 45, not 50.", "That takes a group away. For ×6 you add one."]}, {"q": "Adding 6 + 6 + 6 + 6 + 6 + 6 + 6 + 6 + 6 instead of doing 60 − 6 is…", "choices": ["efficient", "tedious", "ingenious", "a factor"], "a": 1, "why": "Nine 6s added one at a time is long, slow and boring: <b>tedious</b>. 60 − 6 is the efficient way.", "no": ["Efficient means fast with no wasted steps. Adding nine times is the opposite.", null, "Ingenious means very clever. The shortcut is the clever way.", "A factor is a number you multiply."]}], "notes": {"do": "She says the shortcut out loud BEFORE she taps. If she misses the ×9 or ×6 item, rebuild it with counters right away (10 rows minus one row; 5 rows plus one row).", "ask": "\"Why is 90 − 9 right and 90 − 1 wrong?\"", "listen": "\"Because you take away a whole group of 9, not just 1.\""}}, {"type": "vocab", "kick": "Word Power", "title": "7 new words", "text": "Jonathan reads each word. You flip the card, read the meaning, and make your own sentence.", "words": [{"word": "multiple", "pos": "noun", "emoji": "🔁", "meaning": "The product of a number and 1, 2, 3, and so on.", "example": "18, 27 and 36 are multiples of 9."}, {"word": "equation", "pos": "noun", "emoji": "⚖️", "meaning": "A number sentence with an equal sign. Both sides are worth the same.", "example": "9 × 7 = 63 is an equation."}, {"word": "commutative", "pos": "adjective", "emoji": "🔄", "meaning": "You can switch the order of the factors and get the same answer.", "example": "6 × 9 = 9 × 6, so multiplication is commutative."}, {"word": "justify", "pos": "verb", "emoji": "🧑‍⚖️", "meaning": "To give reasons that prove you are right.", "example": "Justify your answer with a fact or a picture."}, {"word": "flawed", "pos": "adjective", "emoji": "💔", "meaning": "Having a mistake or a weak spot.", "example": "The fact 9 × 6 = 56 is flawed."}, {"word": "reluctant", "pos": "adjective", "emoji": "😬", "meaning": "Not wanting to do something.", "example": "Toothless was reluctant to do what Hiccup told him."}, {"word": "persevere", "pos": "verb", "emoji": "🧗", "meaning": "To keep trying even when it is hard.", "example": "Hiccup kept trying to train Toothless. He persevered."}], "notes": {"do": "Teach the words one at a time (about 1 minute each). Write each word on an index card and add the cards to Tuesday's pile.", "say": "For each word: read it, clap the syllables (com-mu-ta-tive, per-se-vere), read the meaning, read the example, then she makes her own sentence. \"A <b>multiple</b> of 9 is any answer on the 9s list. An <b>equation</b> must have an equal sign. <b>Commutative</b> comes from <i>commute</i>, to switch places. To <b>justify</b> is to prove with a reason. <b>Flawed</b> means it has a crack in it, a mistake.\"", "ask": "\"When have YOU been <b>reluctant</b>? When did you <b>persevere</b>?\" \"Is 9 × 7 an equation? What about 9 × 7 = 63?\"", "listen": "Personal sentences that show the meaning (\"I was reluctant to go to the dentist\"). \"9 × 7 is not an equation because there is no equal sign.\""}}, {"type": "tap", "kick": "Word Work", "title": "Talk it through", "text": "Answer out loud first. Then type or tap.", "notes": {"do": "Bailey answers out loud before she types or taps. Ask her to justify each answer.", "ask": "\"Why are 19 and 29 not multiples of 9?\" \"Which word did you pick for the Viking, and why?\"", "listen": "\"19 and 29 are not on the 9s list: 9 × 2 = 18 and 9 × 3 = 27.\" For the Viking: \"Reluctant, because he didn't want to get in the boat.\""}, "items": [{"q": "Which list shows only <b>multiples</b> of 9?", "choices": ["9, 19, 29", "18, 27, 36", "9, 15, 21", "45, 50, 55"], "a": 1, "why": "9 × 2 = 18, 9 × 3 = 27, 9 × 4 = 36. All three are on the 9s list.", "no": ["19 and 29 end in 9, but they are not on the 9s list (9, 18, 27 …).", null, "15 and 21 are not on the 9s list. 9 × 2 is 18.", "Only 45 is a multiple of 9. 50 and 55 are not."]}, {"type": "fill", "q": "The young Viking dragged his feet and would not get in the boat. He was ____.", "answers": ["reluctant"], "why": "<b>Reluctant</b> means not wanting to do something.", "no": "Which word means not wanting to do something?", "hint": "It starts with <b>r</b>."}]}, {"type": "learn", "kick": "Learn", "title": "All the ×6 and ×9 facts", "text": "Here is every 6s and 9s fact up to ×10. These products are the <b>multiples</b> of 6 and 9.", "visual": {"kind": "passage", "text": "<b>6s:</b> 6, 12, 18, 24, 30, 36, 42, 48, 54, 60<br><b>9s:</b> 9, 18, 27, 36, 45, 54, 63, 72, 81, 90"}, "steps": [{"text": "<b>Pattern 1.</b> Every multiple of 6 is <b>even</b>. So 6 × 7 can't be 41 or 43."}, {"text": "<b>Pattern 2.</b> 6 times 2, 4, 6 or 8 ends in that same digit: 6 × 2 = 12, 6 × 4 = 24, 6 × 6 = 36, 6 × 8 = 48."}, {"text": "<b>Pattern 3.</b> 18, 36 and 54 are on <b>both</b> lists. They are multiples of 6 AND of 9."}], "tip": "Use the patterns to catch mistakes fast. If a 6s answer is odd, it is wrong.", "notes": {"do": "Quick-fire on the whiteboard: you say a ×6 or ×9 fact, she answers and names the shortcut. 8–10 facts in 3 minutes.", "say": "\"These lists are the <b>multiples</b> of 6 and 9. Look for patterns. Patterns catch mistakes.\"", "ask": "\"Can 6 × 7 be 41? How do you know without working it out?\"", "listen": "\"No, because every multiple of 6 is even.\""}}, {"type": "learn", "kick": "Learn", "title": "Turn-around facts", "text": "Multiplication is <b>commutative</b>: you can switch the factors and the product stays the same.", "visual": {"kind": "array", "rows": 6, "cols": 9, "emoji": "🐉", "label": "6 rows of 9 = 54. Turn it sideways: 9 rows of 6 = 54."}, "steps": [{"text": "6 × 9 and 9 × 6 are the <b>same array</b>, just turned. Both are 54.", "visual": {"kind": "bigtext", "text": "6 × 9 = 9 × 6"}}, {"text": "Stuck on 7 × 9? Flip it to <b>9 × 7</b> and use the ×9 shortcut: 70 − 7 = 63."}, {"text": "Stuck on 8 × 6? Flip it to <b>6 × 8</b> and use the ×6 shortcut: 40 + 8 = 48."}], "tip": "Every fact you learn gives you a second fact for free.", "notes": {"do": "Hands-on: lay out 6 rows of 9 counters on a sheet of paper. Turn the paper sideways so it shows 9 rows of 6.", "say": "\"I did not add or take away a single counter. I only turned the paper. That is why multiplication is <b>commutative</b>.\"", "ask": "\"Did any counters change? So what is 9 × 6?\" Then say 7 × 9 and 8 × 6 and have her flip each one to the factor that has a shortcut.", "listen": "\"Same counters, so 9 × 6 is 54 too.\" \"7 × 9: flip it to 9 × 7, 70 − 7 = 63.\""}}, {"type": "learn", "kick": "Learn", "title": "Find the missing factor", "text": "Sometimes a factor is missing: <b>9 × ? = 63</b>. Ask: 9 times what number makes 63?", "visual": {"kind": "triangle", "a": 9, "b": "?", "c": 63}, "steps": [{"text": "<b>Use a pattern.</b> For 9 × 2 up to 9 × 10, the tens digit of the product is one less than the other factor. 63 has a tens digit of 6, so the factor is <b>7</b>."}, {"text": "<b>Verify.</b> 9 × 7 = 70 − 7 = 63 ✔. So ? = 7.", "visual": {"kind": "bigtext", "text": "9 × 7 = 63"}}, {"text": "<b>Try a 6s one:</b> 6 × ? = 48. Guess 8 and check: 5 × 8 = 40, and 40 + 8 = 48 ✔. So ? = 8."}], "tip": "Always verify a missing factor by multiplying it back.", "notes": {"do": "Write 9 × ☐ = 63 on the whiteboard. She must say it as a question before she answers.", "say": "\"A missing factor is a question: 9 times WHAT is 63? Then you verify by multiplying back.\"", "ask": "\"9 times what is 63? How do you verify it?\"", "listen": "\"7, because 70 − 7 = 63.\" If she answers 54 or 72, she is grabbing a nearby fact. Ask: \"Is that the factor or the product?\""}}, {"type": "tap", "kick": "Try it", "title": "Missing factors", "items": [{"q": "9 × ? = 54", "visual": {"kind": "triangle", "a": 9, "b": "?", "c": 54}, "choices": ["5", "7", "6", "8"], "a": 2, "why": "The tens digit of 54 is 5, so the factor is 6. Verify: 60 − 6 = 54.", "no": ["9 × 5 = 45, not 54.", "9 × 7 = 63, not 54.", null, "9 × 8 = 72, not 54."]}, {"q": "? × 6 = 42", "choices": ["8", "6", "9", "7"], "a": 3, "why": "7 × 6 = 42. Verify with the ×6 shortcut: 35 + 7 = 42.", "no": ["8 × 6 = 48, not 42.", "6 × 6 = 36, not 42.", "9 × 6 = 54, not 42.", null]}, {"q": "6 × ? = 9 × 4", "choices": ["4", "5", "6", "9"], "a": 2, "why": "First, 9 × 4 = 36. Then 6 × ? = 36, so ? = 6. Both sides equal 36.", "no": ["6 × 4 = 24, but 9 × 4 = 36. The sides don't match.", "6 × 5 = 30, not 36.", null, "6 × 9 = 54, not 36."]}], "notes": {"do": "She reads each one as a question (\"6 times what is 36?\") and verifies on the whiteboard before tapping.", "ask": "For the last one: \"What do you have to do FIRST before you can find the missing factor?\"", "listen": "\"Work out 9 × 4 = 36 first, then 6 times what is 36.\""}}, {"type": "tap", "kick": "True or flawed?", "title": "Catch the flawed facts", "text": "Say which check you used. Then type <b>true</b> or <b>flawed</b>.", "items": [{"type": "fill", "q": "6 × 9 = 56. Is it true or flawed? Type <b>true</b> or <b>flawed</b>.", "answers": ["flawed", "wrong", "false", "not true"], "why": "45 + 9 = 54, not 56. Flawed.", "no": "Use ×5 plus one group: 45 + 9."}, {"type": "fill", "q": "8 × 9 = 72. Is it true or flawed? Type <b>true</b> or <b>flawed</b>.", "answers": ["true", "correct", "right"], "why": "Flip it to 9 × 8: 80 − 8 = 72. True!", "no": "Flip it to 9 × 8."}, {"type": "fill", "q": "4 × 9 = 32. Is it true or flawed? Type <b>true</b> or <b>flawed</b>.", "answers": ["flawed", "wrong", "false", "not true"], "why": "3 + 2 = 5, not 9. 4 × 9 = 36. Flawed.", "no": "Add the digits. Do you get 9?"}, {"type": "fill", "q": "7 × 6 = 36. Is it true or flawed? Type <b>true</b> or <b>flawed</b>.", "answers": ["flawed", "wrong", "false", "not true"], "why": "36 is 6 × 6. 7 × 6 = 35 + 7 = 42. Flawed.", "no": "Flip it to 6 × 7. Use ×5 plus one group."}], "notes": {"do": "Before each answer she names the check she used: the even rule, the tens-digit rule, the digit-sum rule, or a shortcut. Then she types.", "ask": "\"4 × 9 = 32. Which check catches it fastest?\"", "listen": "\"The digits 3 + 2 make 5, not 9.\" Praise any correct check, then ask for a second one."}}, {"type": "tap", "kick": "Fix it", "title": "Find the mistake", "items": [{"q": "Hiccup wrote 7 × 9 = 70 − 9 = 61. What did he do wrong?", "choices": ["He took away 9. He should take away 7: 70 − 7 = 63.", "He should add: 70 + 9 = 79.", "He should use ×5: 35 + 9 = 44.", "Nothing. It is correct."], "a": 0, "why": "7 × 9 = 9 × 7. That is 10 groups of 7 minus one group of 7: 70 − 7 = 63.", "no": [null, "Adding makes 11 groups. Take one group away.", "The ×6 shortcut doesn't fit a ×9 fact.", "Verify: 6 + 1 = 7, not 9. It is flawed."]}, {"q": "Fishlegs wrote 6 × 9 = 45 + 6 = 51. Which equation fixes it?", "choices": ["60 + 9 = 69", "45 − 9 = 36", "45 + 9 = 54", "50 + 6 = 56"], "a": 2, "why": "5 × 9 = 45. Add one more group of <b>9</b>: 45 + 9 = 54.", "no": ["Start at 5 × 9 = 45, not 60.", "For ×6, add a group. Don't take one away.", null, "5 × 9 is 45, not 50, and the extra group is 9, not 6."]}, {"q": "Stoick says 9 × 3 = 72 because 7 + 2 = 9. Why is his answer flawed?", "choices": ["The digits add to 9, so it is right.", "The tens digit should be 2, so 9 × 3 = 27.", "He should add: 9 + 3 = 12.", "9s facts are never even."], "a": 1, "why": "The digits add to 9, but the tens digit must be one less than 3. 9 × 3 = 27. 72 is 9 × 8.", "no": ["The digit check isn't enough. Use the tens-digit check too.", null, "9 × 3 is 3 groups of 9. Multiply, don't add.", "9 × 2 = 18 and 9 × 8 = 72 are even, so that rule is false."]}], "notes": {"do": "Cover the choices with your hand first. She explains the mistake in her own words, THEN taps.", "say": "\"Don't just find the right answer. Tell me what the person did wrong so you never do it.\"", "ask": "\"What did Hiccup take away? What should he take away?\"", "listen": "\"He took away 9, but he needs to take away one group of 7.\""}}, {"type": "order", "kick": "Step by step", "title": "Solve a word problem", "text": "Stoick has <b>54 shields</b>. He puts <b>6 shields</b> on each longship. How many longships? Tap the steps in order.", "steps": ["Read it: 54 shields in all, 6 on each ship.", "Find the equal groups: each ship gets 6.", "Write the equation: 6 × ? = 54.", "Use a fact you know: 6 × 9 = 45 + 9 = 54.", "Answer and verify: 9 longships. 9 × 6 = 60 − 6 = 54 ✔"], "why": "Read, find the groups, write the equation, use a fact, then verify. That is a strategy you can use on any problem.", "hint": "What do you always do first with a word problem?", "notes": {"do": "She says each step out loud as she taps it.", "ask": "\"Why do we verify at the end? What would you do if it didn't check?\"", "listen": "\"To make sure it's right. If it doesn't check, I try a different factor.\""}}, {"type": "tap", "kick": "Prove it", "title": "Word problems", "items": [{"q": "Hiccup catches 9 baskets of fish with 6 fish in each. Toothless eats 8 of them. How many fish are left?", "visual": {"kind": "groups", "groups": 9, "each": 6, "emoji": "🐟"}, "choices": ["62", "46", "54", "48"], "a": 1, "why": "9 × 6 = 60 − 6 = 54 fish. Then 54 − 8 = <b>46</b> left.", "no": ["62 is 54 + 8. Toothless ate them, so subtract.", null, "54 is how many he caught. Don't forget Toothless ate 8.", "48 is 6 × 8. The 8 fish were eaten, not a group."]}, {"q": "The Vikings set up 63 benches in 9 equal rows. How many benches are in each row?", "choices": ["54", "6", "8", "7"], "a": 3, "why": "9 × ? = 63. The tens digit is 6, so ? = 7. Verify: 70 − 7 = 63.", "no": ["54 is a total, not one row. You need 9 × ? = 63.", "9 × 6 = 54, not 63.", "9 × 8 = 72, not 63.", null]}, {"q": "Fishlegs knows 9 × 8 = 72. Which fact does the commutative idea give him for free?", "choices": ["9 × 9 = 81", "8 + 9 = 17", "8 × 9 = 72", "72 − 8 = 64"], "a": 2, "why": "Switch the factors: 8 × 9 = 72. Same product!", "no": ["That is true, but it is a different fact. Flipping 9 × 8 doesn't give it.", "That is adding, not multiplying.", null, "That is subtracting. Commutative means switching the factors."]}], "notes": {"do": "For the fish problem, cover the choices and let her solve it on the whiteboard first. Then she taps.", "ask": "\"Did anything else happen in the story after the fish were caught?\"", "listen": "\"Toothless ate 8, so I take 8 away.\" If she stops at 54, point to the second sentence."}}, {"type": "talk", "kick": "Justify It", "title": "Prove it out loud", "text": "Use the word <b>justify</b>. Give a reason, not just an answer.", "prompts": ["Justify that 6 × 8 = 48 in <b>two</b> different ways.", "Is 9 × 6 = 56 true or flawed? Justify your answer.", "Make up a word problem about Berk for 6 × 7. Then solve it."], "starters": ["One way is … Another way is …", "It is flawed because …", "On Berk, there are …"], "notes": {"do": "Hands-on: give her three index cards. She writes 6 × 8, 9 × 6 and 6 × 7 on them and holds each one up as she answers.", "say": "\"A justify answer always has the word <i>because</i> in it.\"", "ask": "\"Can you prove 6 × 8 = 48 with the turn-around too?\"", "listen": "\"40 + 8 = 48\" and \"8 × 6 is 6, 12, 24, 48\" or a flip. For the word problem: equal groups of 7 (or 6) and the answer 42 with a label."}}, {"type": "learn", "kick": "Wrap-up", "title": "You proved it. Now practice it.", "text": "Today you flipped facts, found missing factors, caught flawed facts, and solved two-step problems.", "visual": {"kind": "passage", "text": "▶ <b>After-Class Lesson</b>: tonight, on your own. It ends with Show What You Know.<br>📝 <b>Practice</b>: Friday.<br>🖨 <b>Packet</b> (both pages) and <b>Lesson 1 packet page 2</b>: Saturday.<br>🔗 <b>Times Table Trail, Lesson 4</b>: Sunday.<br>📚 Read 15 minutes every day."}, "tip": "Monday's lesson is on Zoom. Have ready: your book, about 60 dried beans, paper and a pencil.", "notes": {"do": "Open the course page and go through the task list with her. Show the Times Table Trail Lesson 4 link and the Lesson 1 packet page 2 link.", "ask": "\"Which word from today was the hardest? Use it in one more sentence.\"", "say": "\"You need 90 on Show What You Know tonight. If you miss, you get brand-new questions on the retake.\""}}], "win": "You persevered and proved it. Every ×9 and ×6 fact is yours!", "prev": "bb-bailey-L01", "prevTitle": "Lesson 1"});</script></body></html>
