<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 9: Division Undoes Multiplication</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L09", "label": "Lesson 9", "title": "Division Undoes Multiplication", "goal": "I can solve a division fact by asking the multiplication question, like 56 ÷ 8 means 8 × ? = 56.", "date": "2026-11-09", "mastery": 90, "color": "#E67E22", "slides": [{"type": "hello", "title": "Division Undoes Multiplication", "text": "You already know your 6, 7, 8 and 9 facts. Today you find out they work <b>backward</b> too. Division asks a multiplication question with a missing number, so the facts you know are the key.", "visual": {"kind": "emoji", "text": "🐉🐟➗🔑"}, "notes": {"do": "Share your screen. Before you start, check that Bailey has at her table: about 45 dried beans, 6 cups or paper plates, 6 index cards, a pencil and her book. Keep your whiteboard in view of your camera.", "say": "\"Last week you stopped adding and started multiplying. This week we run multiplication backward. By the end of today you will solve 56 ÷ 8 without adding a single 8.\"", "ask": "\"What is 8 × 7?\" (56). \"Hold on to that. You will use it in ten minutes.\""}}, {"type": "talk", "kick": "Book Talk", "title": "Back to Berk", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["Tell me what happened in the last chapter you read. Keep the events in order.", "What problem is Hiccup facing right now? Is he up against another character, himself, or nature?", "Find one word the author used that was new or interesting to you. What do you think it means, and what clue helped you?"], "starters": ["In the last chapter, …", "Hiccup's problem is … because …", "I think the word … means … because …"], "notes": {"do": "Give her the whole 7 minutes. Let her hold the book and find pages.", "say": "\"Book first. Tell me the last chapter in order: first, next, then, last.\"", "ask": "After the retell: \"What kind of conflict is Hiccup in: against another character, himself, or nature? Prove it with one event.\" Then: \"Show me one new word and the clue you used.\"", "listen": "A strong answer names the conflict type AND gives an event as proof. If she only says \"he has a problem\", ask: \"With whom or with what?\""}}, {"type": "tap", "kick": "Warm-up", "title": "Facts you will need today", "text": "Say each answer out loud as fast as you can. Jonathan types it in.", "items": [{"type": "fill", "q": "8 × 7 = ____", "answers": ["56"], "why": "8 × 7 = 56. Remember 5, 6, 7, 8: 56 = 7 × 8.", "no": "Use double, double, double: 7, 14, 28, 56."}, {"type": "fill", "q": "9 × 6 = ____", "answers": ["54"], "why": "9 × 6 = 60 − 6 = 54.", "no": "Use the ×9 shortcut: 10 × 6, then take away one 6."}, {"type": "fill", "q": "6 × 7 = ____", "answers": ["42"], "why": "6 × 7 = 35 + 7 = 42.", "no": "Use the ×6 shortcut: 5 × 7, then add one more 7."}, {"type": "fill", "q": "7 × 9 = ____", "answers": ["63"], "why": "7 × 9 = 70 − 7 = 63.", "no": "Use the ×9 shortcut: 10 × 7, then take away one 7."}], "notes": {"do": "Type her spoken answers into the boxes yourself (she is on Zoom, so she says them, you type). Time each one silently.", "say": "\"Four facts. Say the answer, then tell me which shortcut you used.\"", "listen": "Under 3 seconds = automatic. If she starts counting up (8, 16, 24 …), stop her and ask for the shortcut from Lessons 1–4. These four facts are today's answers in disguise."}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read the word out loud, then make up your own sentence with it.", "words": [{"word": "dividend", "pos": "noun", "emoji": "🥧", "meaning": "The number being divided: the total you start with.", "example": "In 56 ÷ 8 = 7, the <b>dividend</b> is 56."}, {"word": "divisor", "pos": "noun", "emoji": "✂️", "meaning": "The number you divide by: the number of groups, or how many go in each group.", "example": "In 56 ÷ 8 = 7, the <b>divisor</b> is 8."}, {"word": "quotient", "pos": "noun", "emoji": "🎯", "meaning": "The answer to a division problem.", "example": "In 56 ÷ 8 = 7, the <b>quotient</b> is 7."}, {"word": "inverse operations", "pos": "noun", "emoji": "🔄", "meaning": "Two operations that undo each other, like multiplication and division.", "example": "8 × 7 = 56, so 56 ÷ 8 = 7. They are <b>inverse operations</b>."}, {"word": "ration", "pos": "verb", "emoji": "🥖", "meaning": "To give out something in small, set amounts so that it lasts longer.", "example": "When the winter was long, the Vikings had to <b>ration</b> their bread."}, {"word": "provisions", "pos": "noun", "emoji": "🧺", "meaning": "Supplies of food and other things people need, packed for later.", "example": "The ship carried <b>provisions</b> for a week at sea."}, {"word": "allot", "pos": "verb", "emoji": "📋", "meaning": "To give each person or group a certain share of something.", "example": "The chief will <b>allot</b> 6 arrows to each archer."}], "notes": {"do": "Flip one card at a time. She reads the word and meaning aloud. On your whiteboard write <b>dividend ÷ divisor = quotient</b> above <b>56 ÷ 8 = 7</b> and draw an arrow from each word to its number. Leave it up for the whole lesson.", "say": "\"Three math words and four story words. The math words are names for the parts of a division. The story words are about sharing food and supplies, which is what division is.\"", "ask": "For <i>ration</i>: \"Why would Vikings ration food in winter?\" For <i>provisions</i>: \"What provisions would Hiccup pack to fly to another island?\" For <i>allot</i>: \"If Stoick allots 6 arrows to each archer, what operation tells how many arrows he needs?\"", "listen": "Her own sentence must show the meaning, not just use the word (\"I rationed\" is not enough; \"We rationed the snacks so they lasted all trip\" is). For <i>inverse operations</i> she should say they <b>undo</b> each other."}}, {"type": "learn", "kick": "Learn", "title": "Division question 1: How many in each?", "text": "Stoick has <b>24 fish</b> to share equally among <b>6 dragons</b>. How many fish does each dragon get?", "visual": {"kind": "groups", "groups": 6, "each": 4, "emoji": "🐟", "label": "6 dragons. 4 fish for each dragon."}, "steps": [{"text": "We know the number of <b>groups</b>: 6 dragons."}, {"text": "We want to find how many go in <b>each</b> group."}, {"text": "Think: 6 × <b>?</b> = 24. 6 × 4 = 24, so <b>24 ÷ 6 = 4</b> fish for each dragon."}], "tip": "No counting one by one. A multiplication fact you know gives the answer.", "notes": {"do": "Hands-on at home: she counts out 24 beans and sets out 6 plates (the dragons). She deals one bean to each plate per round until the beans are gone. Hold the slide on the problem until she finishes, then reveal the steps.", "say": "\"Every plate is a dragon. Deal them like cards: one to each, then again.\"", "ask": "\"How many on each plate?\" (4). \"How many rounds did you deal?\" (4). \"So which fact did you just act out?\" (6 × 4 = 24).", "listen": "She should notice the number of rounds IS the answer. That is why the multiplication fact works."}}, {"type": "learn", "kick": "Learn", "title": "Division question 2: How many groups?", "text": "Fishlegs has <b>24 fish</b>. He puts <b>6 fish</b> in each basket. How many baskets does he fill?", "visual": {"kind": "groups", "groups": 4, "each": 6, "emoji": "🐟", "label": "4 baskets. 6 fish in each basket."}, "steps": [{"text": "We know how many go in <b>each</b> group: 6 fish."}, {"text": "We want to find how many <b>groups</b>."}, {"text": "Think: <b>?</b> × 6 = 24. 4 × 6 = 24, so <b>24 ÷ 6 = 4</b> baskets."}], "tip": "Same numbers, two different questions. Read carefully to see which one the story asks.", "notes": {"do": "She gathers the 24 beans again and this time makes piles of exactly 6, one plate per pile, until the beans run out.", "ask": "\"Same 24 beans, same 6, same answer 4. So what changed?\" Wait for it. Then: \"What does the 4 count this time?\"", "listen": "The answer is the <b>label</b>: last time 4 fish in each, this time 4 baskets. If she says \"nothing changed\", point to the two pictures side by side."}}, {"type": "tap", "kick": "Quick check", "title": "Which question does the story ask?", "items": [{"q": "Hiccup has 30 fish. He gives <b>6 fish</b> to each dragon. What does the story ask?", "choices": ["How many fish in all?", "How many dragons get fish?", "How many fish does each dragon get?"], "a": 1, "why": "You know the size of each group (6 fish). You find how many groups: how many dragons. 30 ÷ 6 = 5 dragons.", "no": ["The story tells you that already: 30 fish.", null, "The story tells you that already: 6 fish each."]}, {"q": "Stoick splits 36 shields equally among <b>9 ships</b>. What does the story ask?", "choices": ["How many shields on each ship?", "How many ships?", "How many shields in all?"], "a": 0, "why": "You know the number of groups (9 ships). You find how many in each: 36 ÷ 9 = 4 shields.", "no": [null, "The story tells you: 9 ships.", "The story tells you: 36 shields."]}], "notes": {"say": "\"Detective question: what number does the story already give me, and what is missing?\"", "ask": "After each one: \"Say the multiplication question for it.\" (6 × ? = 30; 9 × ? = 36.)", "listen": "She should name the known number's job: \"6 is how many in each\" or \"9 is the number of groups\"."}}, {"type": "learn", "kick": "Learn", "title": "56 ÷ 8 means 8 × ? = 56", "text": "Division and multiplication are <b>inverse operations</b>. Every division fact is a multiplication fact with a missing number.", "visual": {"kind": "bigtext", "text": "56 ÷ 8 = ?", "sub": "means: 8 × ? = 56"}, "steps": [{"text": "<b>Step 1.</b> Turn it into a multiplication question: <b>8 × ? = 56</b>.", "visual": {"kind": "triangle", "a": 8, "b": "?", "c": 56}}, {"text": "<b>Step 2.</b> Try a fact you know. 8 × 6 = 48. Too small. 8 × 7 = 56. Yes!"}, {"text": "<b>Step 3.</b> So <b>56 ÷ 8 = 7</b>.", "visual": {"kind": "triangle", "a": 8, "b": 7, "c": 56}}], "tip": "Do not add 8 + 8 + 8 … until you reach 56. Ask yourself: <b>8 times what is 56?</b>", "notes": {"say": "\"This is the big idea of the whole week. Read it with me: fifty-six divided by eight means eight times WHAT is fifty-six.\"", "ask": "Before Step 2: \"Which 8s fact do you know that lands near 56?\" Before Step 3: \"Look back at the warm-up. Did you already say this fact today?\"", "listen": "\"8 × 7 = 56, so it's 7.\" If she starts counting by 8s, say: \"Counting works, but it is the slow road. Which fact jumps straight there?\""}}, {"type": "learn", "kick": "Learn", "title": "Your turn to lead: 72 ÷ 9", "text": "Solve <b>72 ÷ 9</b> the new way. Say each step out loud before you show it.", "visual": {"kind": "bigtext", "text": "72 ÷ 9 = ?"}, "steps": [{"text": "Ask the multiplication question: <b>9 × ? = 72</b>."}, {"text": "Use the ×9 shortcut to test: 9 × 8 = 80 − 8 = <b>72</b>. ✔"}, {"text": "So <b>72 ÷ 9 = 8</b>. Adding nines would have taken 8 steps. The fact took one."}], "notes": {"say": "\"Now you are the teacher. Tell me the first step before I show it.\"", "ask": "\"What is the multiplication question?\" \"Which shortcut helps test 9 × 8?\" \"How many nines would you have added the slow way?\" (8).", "listen": "She says the question first, without prompting. That habit is what we are building today."}}, {"type": "learn", "kick": "Learn", "title": "Reading a fact triangle", "text": "A fact triangle holds three numbers that work together. The <b>top</b> number is the biggest: it is the product of the two bottom numbers. Cover one corner and say the fact that finds it.", "visual": {"kind": "triangle", "a": 7, "b": 9, "c": 63}, "steps": [{"text": "Cover <b>63</b>: 7 × 9 = 63."}, {"text": "Cover <b>9</b>: 63 ÷ 7 = 9."}, {"text": "Cover <b>7</b>: 63 ÷ 9 = 7."}], "tip": "In a division fact from a triangle, the top number always comes first.", "notes": {"do": "Hands-on: she makes three index-card fact triangles while you watch: <b>8, 7, 56</b> · <b>7, 9, 63</b> · <b>6, 9, 54</b>, biggest number at the top. Then you cover a corner on your screen and she says the fact; then she covers a corner on her card and quizzes you.", "ask": "\"Cover the top. Which operation finds it?\" (multiply). \"Cover a bottom corner. Which operation finds it?\" (divide).", "listen": "Division facts that start with the top number: \"63 ÷ 7\", never \"7 ÷ 63\". Tell Tia she keeps these three cards for Tuesday."}}, {"type": "tap", "kick": "Guided practice", "title": "Ask the multiplication question", "text": "Say the multiplication question out loud. Then say the answer.", "items": [{"type": "fill", "q": "48 ÷ 6: &nbsp; 6 × ____ = 48", "answers": ["8", "eight"], "why": "6 × 8 = 48, so 48 ÷ 6 = 8.", "no": "Use the ×6 shortcut: 5 × 8 = 40, plus one more 8."}, {"type": "fill", "q": "63 ÷ 7: &nbsp; 7 × ____ = 63", "answers": ["9", "nine"], "why": "7 × 9 = 63, so 63 ÷ 7 = 9.", "no": "Which 7s fact is near 63? 7 × 8 = 56 is close."}, {"type": "fill", "q": "What number is hiding in this fact triangle?", "answers": ["6", "six"], "why": "9 × 6 = 54, so 54 ÷ 9 = 6.", "no": "Ask: 9 × what = 54?", "visual": {"kind": "triangle", "a": 9, "b": "?", "c": 54}}, {"q": "Toothless has <b>63 shiny pebbles</b>. He makes piles with <b>7</b> in each pile. Which fact tells how many piles?", "choices": ["7 × 8 = 63, so 8 piles", "63 − 7 = 56, so 56 piles", "7 × 9 = 63, so 9 piles", "63 + 7 = 70, so 70 piles"], "a": 2, "why": "7 × 9 = 63, so 63 ÷ 7 = 9 piles.", "no": ["Check that fact: 7 × 8 = 56, not 63.", "Subtracting one 7 only makes one pile. How many sevens fit in 63?", null, "Adding makes more pebbles. Piles split the 63 up."]}], "notes": {"do": "She answers out loud; you type. Do not move on from an item until she has said the full multiplication question, not just the number.", "say": "\"Question first, answer second. Every time.\"", "listen": "\"Six times eight is forty-eight, so it's eight.\" On the pebbles item, ask her to explain why 8 piles is wrong (7 × 8 = 56)."}}, {"type": "build", "kick": "Build it", "title": "Feeding time on Berk", "text": "Stoick shares <b>42 fish</b> equally among <b>6 dragons</b>. Make the groups: how many dragons, and how many fish for each one?", "groups": 6, "each": 7, "emoji": "🐟", "why": "6 groups of 7 make 42. So <b>42 ÷ 6 = 7</b> fish for each dragon.", "hint": "There are 6 dragons, so make 6 groups. Then ask: 6 × what = 42?", "notes": {"do": "Before anyone touches a bean, she predicts the answer with a fact. Then she proves it: 42 beans onto 6 plates. Then you set the counters on screen to her answer.", "ask": "\"Prediction first: 6 times what is 42?\" After the beans: \"Did your fact match your plates?\"", "listen": "\"6 × 7 = 42, so 7 each.\" If she predicts wrong, the beans will show it. Let them."}}, {"type": "tap", "kick": "Talk it through", "title": "Name the parts, spot the mistake", "items": [{"q": "In <b>72 ÷ 8 = 9</b>, which number is the <b>quotient</b>?", "choices": ["72", "8", "9"], "a": 2, "why": "The quotient is the answer: 9.", "no": ["72 is the dividend, the number being divided.", "8 is the divisor, the number you divide by.", null]}, {"type": "fill", "q": "In <b>42 ÷ 7 = 6</b>, the number 42 is called the ____.", "answers": ["dividend"], "why": "The dividend is the number being divided: 42.", "no": "Look at the whiteboard: dividend ÷ divisor = quotient. Which spot is 42 in?"}, {"q": "Snotlout says <b>63 ÷ 7 = 8</b> because 7 × 8 = 63. What is wrong?", "choices": ["You can't use multiplication to solve division.", "7 × 8 is 56, not 63. So 63 ÷ 7 = 9.", "He should have added 63 + 7."], "a": 1, "why": "7 × 9 = 63, so 63 ÷ 7 = 9. Snotlout used a wrong fact.", "no": ["You can! They are inverse operations. His fact was just wrong.", null, "Adding does not undo multiplication. Division does."]}], "notes": {"say": "\"Point to the whiteboard while you answer.\"", "ask": "On the Snotlout item: \"How could he have caught his own mistake?\" (Check 7 × 8 with the ×7 shortcut: 40 + 16 = 56, not 63.)", "listen": "Divisor and quotient are the pair she mixes up. Make her say the sentence: \"The divisor is what I divide BY.\""}}, {"type": "tap", "kick": "Lightning round", "title": "Say the fact, then the quotient", "text": "For each card: say the multiplication fact out loud, then the quotient.", "items": [{"type": "fill", "q": "<b>42 ÷ 7</b> = ____", "answers": ["6", "six"], "why": "7 × 6 = 42.", "no": "7 × what = 42?"}, {"type": "fill", "q": "<b>64 ÷ 8</b> = ____", "answers": ["8", "eight"], "why": "8 × 8 = 64.", "no": "Double, double, double 8."}, {"type": "fill", "q": "<b>54 ÷ 9</b> = ____", "answers": ["6", "six"], "why": "9 × 6 = 54.", "no": "9 × 6 = 60 − 6."}, {"type": "fill", "q": "<b>36 ÷ 6</b> = ____", "answers": ["6", "six"], "why": "6 × 6 = 36.", "no": "6 × what = 36?"}, {"type": "fill", "q": "<b>56 ÷ 8</b> = ____", "answers": ["7", "seven"], "why": "8 × 7 = 56.", "no": "Remember 5, 6, 7, 8: 56 = 7 × 8."}, {"type": "fill", "q": "<b>49 ÷ 7</b> = ____", "answers": ["7", "seven"], "why": "7 × 7 = 49.", "no": "7 × what = 49?"}], "notes": {"do": "She says the fact and the quotient; you type the quotient. Keep the pace quick, like flash cards.", "say": "\"Fact first, then the answer. Ready? Go.\"", "listen": "Fast, confident facts on 42 ÷ 7, 54 ÷ 9 and 56 ÷ 8. A pause on 64 ÷ 8 is fine: prompt \"double, double, double 8\". If she counts up by the divisor, stop and ask for the fact."}}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"q": "Before the voyage, Stoick packed <b>provisions</b> into the longship. What did he pack?", "choices": ["extra sails only", "food and supplies for later", "treasure to hide", "weapons for battle"], "a": 1, "why": "<i>Provisions</i> are supplies of food and needed things, packed for later.", "no": ["Provisions are mostly food and needed supplies, not just one thing.", null, "That would be a hoard, not provisions.", "Provisions are what people need to live: food, water, supplies."]}, {"q": "The chief had to <b>allot</b> the shields fairly. What does <i>allot</i> mean here?", "choices": ["count them one by one", "lock them away", "give each person a share"], "a": 2, "why": "To <i>allot</i> is to give each person a certain share.", "no": ["Counting is not the same as handing out shares.", "That is the opposite: allot means to give out.", null]}, {"type": "fill", "q": "When food is low, you give it out in small, set amounts so it lasts. You ____ it. (Use a word from your word cards.)", "answers": ["ration", "rations"], "why": "To <i>ration</i> is to give out small, set amounts so supplies last.", "no": "It starts with r. The Vikings did it to their bread in winter."}], "notes": {"ask": "\"Which word in the sentence was your clue?\" (packed into the longship; fairly; lasts). Then: \"Which of today's story words is most like division?\" (allot or ration: both split a total into shares.)", "listen": "She connects <i>allot</i> to \"how many in each\". That link is the reason these words were chosen."}}, {"type": "learn", "kick": "Wrap-up", "title": "What you learned today", "text": "Say each idea back in your own words.", "steps": [{"text": "Division asks a <b>multiplication question</b>: 56 ÷ 8 means 8 × ? = 56."}, {"text": "There are two kinds of division: <b>how many in each</b> and <b>how many groups</b>."}, {"text": "dividend ÷ divisor = <b>quotient</b>."}, {"text": "Tonight: the <b>After-class lesson</b> on your own, then read for 10 minutes."}], "tip": "Keep your three fact triangle cards. You need them on Tuesday.", "notes": {"do": "Open the course page on your screen share and show the Lesson 9 card: the After-class lesson button and the task list (only two tasks tonight).", "say": "\"Tonight is short: the after-class lesson ends with Show What You Know. You need 90. If you miss, you get brand-new questions when you try again.\"", "ask": "Exit ticket, out loud: \"What does 54 ÷ 6 ask?\" (6 × ? = 54, so 9). \"Which number is the divisor?\" (6)."}}], "win": "You turned every division into a multiplication you already know. That is real math thinking!", "prev": "bb-bailey-L08", "prevTitle": "Lesson 8"});</script></body></html>
