<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 1: Smart Shortcuts for ×9 and ×6</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L01", "label": "Lesson 1", "title": "Smart Shortcuts for ×9 and ×6", "goal": "I can use ×10 and ×5 facts to find ×9 and ×6 facts fast.", "date": "2026-10-20", "mastery": 90, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Your Turn: ×9 and ×6 Shortcuts", "text": "In class you learned two shortcuts. Now you do them on your own. 🐉 Type your answers. You get 3 tries on each one.", "visual": {"kind": "emoji", "text": "🐉 ⌨️ ✖️"}}, {"type": "talk", "kick": "Book Talk", "title": "Think about Hiccup", "text": "Say your answers out loud, or tell a grown-up.", "prompts": ["Think of a time Hiccup used his brain instead of his muscles. What was his <b>strategy</b>?", "Was his plan <b>ingenious</b>? Why or why not?"], "starters": ["Hiccup's strategy was …", "It was ingenious because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Your 7 words", "text": "Flip each card. Then cover the meaning and say it from memory. You will type these words soon!", "words": [{"word": "factor", "pos": "noun", "emoji": "🔢", "meaning": "A number you multiply.", "example": "In 9 × 7, the factors are 9 and 7."}, {"word": "product", "pos": "noun", "emoji": "🎯", "meaning": "The answer to a multiplication problem.", "example": "The product of 6 and 8 is 48."}, {"word": "strategy", "pos": "noun", "emoji": "🗺️", "meaning": "A plan you choose to solve a problem.", "example": "Hiccup needs a smart strategy, not big muscles."}, {"word": "efficient", "pos": "adjective", "emoji": "⚡", "meaning": "Gets the job done fast, with no wasted steps.", "example": "70 − 7 is more efficient than adding 7 nine times."}, {"word": "tedious", "pos": "adjective", "emoji": "🐌", "meaning": "Long, slow and boring.", "example": "Adding 9 + 9 + 9 + 9 + 9 + 9 is tedious."}, {"word": "ingenious", "pos": "adjective", "emoji": "💡", "meaning": "Very clever and creative.", "example": "Hiccup thinks up an ingenious plan to save Berk."}, {"word": "verify", "pos": "verb", "emoji": "🔍", "meaning": "To check that something is true.", "example": "To verify 9 × 7 = 63, add the digits: 6 + 3 = 9 ✔."}]}, {"type": "learn", "kick": "Remember", "title": "Your two shortcuts", "text": "A quick reminder from class. Tap to see each one.", "steps": [{"text": "<b>×9:</b> start at ×10, then take away one group. 9 × 7 → 70 − 7 = <b>63</b>.", "visual": {"kind": "bigtext", "text": "70 − 7 = 63"}}, {"text": "<b>×6:</b> start at ×5, then add one group. 6 × 8 → 40 + 8 = <b>48</b>.", "visual": {"kind": "bigtext", "text": "40 + 8 = 48"}}, {"text": "<b>Verify a 9s fact</b> (9 × 2 up to 9 × 10): the digits add to 9, AND the tens digit is one less than the other factor. 63 → 6 + 3 = 9, and 6 is one less than 7 ✔."}], "tip": "Take away or add <b>one group</b>. One group is the <b>other factor</b>: in 9 × 7 it is 7, and in 6 × 8 it is 8."}, {"type": "tap", "kick": "Word Power", "title": "Type the word", "text": "Read the meaning. Type the word from memory.", "items": [{"type": "fill", "q": "Which word means <b>a plan you choose to solve a problem</b>? Type it.", "answers": ["strategy"], "why": "A plan you choose is a <b>strategy</b>.", "no": "Hiccup always has one of these.", "hint": "It starts with <b>s</b> and ends with <b>y</b>: s _ _ _ _ _ _ y"}, {"type": "fill", "q": "Which word means <b>long, slow and boring</b>? Type it.", "answers": ["tedious"], "why": "Long, slow and boring is <b>tedious</b>.", "no": "Adding 7 nine times is this.", "hint": "It starts with <b>t</b>: t _ _ _ _ _ s"}, {"type": "fill", "q": "In 6 × 4 = 24, the answer 24 is called the ____.", "answers": ["product"], "why": "The answer to a multiplication is the <b>product</b>.", "no": "6 and 4 are factors. What is the answer called?", "hint": "It starts with <b>p</b>: p _ _ _ _ _ t"}, {"type": "fill", "q": "Which word means <b>gets the job done fast, with no wasted steps</b>? Type it.", "answers": ["efficient"], "why": "Fast with no wasted steps is <b>efficient</b>.", "no": "It is the opposite of tedious.", "hint": "It starts with <b>e</b>: e _ _ _ _ _ _ _ t"}]}, {"type": "tap", "kick": "Your turn", "title": "×9 on your own", "text": "Start at ×10. Take away one group.", "items": [{"type": "fill", "q": "Start with 10 × 5 = 50. What do you take away to get 9 × 5? Type the number.", "answers": ["5", "five"], "why": "Take away one group of <b>5</b>: 50 − 5 = 45.", "no": "One group of 9 × 5 has how many in it?", "hint": "Not 9! Look at the other factor."}, {"type": "fill", "q": "What is 9 × 3?", "answers": ["27"], "why": "10 × 3 = 30. Take away one group of 3: 30 − 3 = <b>27</b>.", "no": "Start with 10 × 3 = 30.", "hint": "30 − 3 = ?", "visual": {"kind": "bigtext", "text": "9 × 3"}}, {"type": "fill", "q": "What is 9 × 10?", "answers": ["90"], "why": "10 × 10 = 100. Take away one group of 10: 100 − 10 = <b>90</b>.", "no": "Start with 10 × 10 = 100.", "hint": "100 − 10 = ?"}, {"type": "fill", "q": "Gobber makes 6 swords every day for 9 days. How many swords does he make?", "answers": ["54", "54 swords"], "why": "9 days with 6 swords each is 9 × 6: 60 − 6 = <b>54</b> swords.", "no": "9 equal groups of 6. Start with 10 × 6 = 60.", "hint": "60 − 6 = ?", "visual": {"kind": "groups", "groups": 9, "each": 6, "emoji": "🗡️"}}]}, {"type": "sort", "kick": "Verify it", "title": "Correct or wrong?", "text": "Use BOTH checks. Tap a fact, then tap the right box.", "buckets": ["✅ Correct", "❌ Wrong"], "items": [{"text": "9 × 5 = 45", "b": 0, "why": "4 + 5 = 9, and 4 is one less than 5.", "hint": "Add the digits. Then check the tens digit. Does it pass both checks?"}, {"text": "9 × 6 = 56", "b": 1, "why": "5 + 6 = 11, not 9. The real answer is 54.", "hint": "Add the digits. Do you get 9?"}, {"text": "9 × 8 = 72", "b": 0, "why": "7 + 2 = 9, and 7 is one less than 8.", "hint": "Add the digits. Then check the tens digit. Does it pass both checks?"}, {"text": "9 × 3 = 36", "b": 1, "why": "3 + 6 = 9 passes Check 1, but the tens digit should be 2. The real answer is 27.", "hint": "The digits add to 9. Now use Check 2: what should the tens digit be?"}, {"text": "9 × 10 = 90", "b": 0, "why": "9 + 0 = 9, and 9 is one less than 10.", "hint": "Add the digits. Then check the tens digit. Does it pass both checks?"}, {"text": "9 × 7 = 73", "b": 1, "why": "7 + 3 = 10, not 9. The real answer is 63.", "hint": "Add the digits. Do you get 9?"}], "done": "You verified like a real mathematician."}, {"type": "tap", "kick": "Your turn", "title": "×6 on your own", "text": "Start at ×5. Add one group.", "items": [{"type": "fill", "q": "Start with 5 × 9 = 45. What do you add to get 6 × 9? Type the number.", "answers": ["9", "nine"], "why": "Add one more group of <b>9</b>: 45 + 9 = 54.", "no": "One group of 6 × 9 has how many in it?", "hint": "Not 6! Look at the other factor."}, {"type": "fill", "q": "What is 6 × 7?", "answers": ["42"], "why": "5 × 7 = 35, plus one more group of 7: 35 + 7 = <b>42</b>.", "no": "Start with 5 × 7 = 35.", "hint": "35 + 7 = ?", "visual": {"kind": "bigtext", "text": "6 × 7"}}, {"type": "fill", "q": "What is 6 × 2?", "answers": ["12"], "why": "5 × 2 = 10, plus one more group of 2: 10 + 2 = <b>12</b>.", "no": "Start with 5 × 2 = 10.", "hint": "10 + 2 = ?"}, {"q": "Which shows the ×6 shortcut for 6 × 5?", "choices": ["25 + 6 = 31", "25 + 5 = 30", "30 + 5 = 35", "25 − 5 = 20"], "a": 1, "why": "5 × 5 = 25, plus one more group of 5: 25 + 5 = 30.", "no": ["Add the other factor, 5, not 6.", null, "Start at 5 × 5 = 25, not 30.", "For ×6 you add a group. Taking away gives 4 × 5."]}]}, {"type": "build", "kick": "Build it", "title": "Snotlout's dragon nests", "text": "Snotlout finds <b>9 nests</b>. Each nest has <b>6 eggs</b>. Build it. Before you tap Check, say the total with a shortcut.", "groups": 9, "each": 6, "emoji": "🥚", "why": "9 groups of 6. Shortcut: 10 × 6 = 60, take away one group of 6: 60 − 6 = <b>54</b> eggs.", "hint": "Groups = the number of nests. In each group = the eggs in ONE nest. Check both numbers."}, {"type": "tap", "kick": "Fix it", "title": "Fix it and solve it", "text": "Find the mistake. Then solve.", "items": [{"type": "fill", "q": "Fishlegs wrote 9 × 4 = 40 − 9 = 31. What should he take away from 40? Type the number.", "answers": ["4", "four"], "why": "Take away one group of <b>4</b>: 40 − 4 = 36.", "no": "How many are in ONE group of 9 × 4?", "hint": "Look at the other factor."}, {"type": "fill", "q": "Snotlout wrote 6 × 9 = 45 + 6 = 51. What is the right answer?", "answers": ["54"], "why": "Add one more group of 9: 45 + 9 = <b>54</b>.", "no": "The extra group has 9 in it, not 6.", "hint": "45 + 9 = ?"}, {"q": "Stoick says 9 × 6 = 45 because 4 + 5 = 9. Which check shows he is wrong?", "choices": ["The digits add to 9, so he is right", "The tens digit should be 5, one less than 6", "The ones digit should be 6", "9s facts always end in 9"], "a": 1, "why": "4 + 5 = 9 passes Check 1, but the tens digit should be 5. So 9 × 6 = 54, not 45.", "no": ["Check 1 can be fooled. Use Check 2 too.", null, "The ones digit is 4 (54). Look at the tens digit.", "Not true. Of the 9s facts up to 9 × 10, only 9 × 1 ends in 9. 9 × 6 = 54."]}, {"type": "fill", "q": "Hiccup fills 6 buckets for Toothless. Each bucket holds 8 fish. How many fish?", "answers": ["48", "48 fish"], "why": "6 groups of 8: 5 × 8 = 40, plus one more group of 8: 40 + 8 = <b>48</b> fish.", "no": "6 equal groups of 8. Start with 5 × 8 = 40.", "hint": "40 + 8 = ?"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Use the ×9 shortcut. What is 9 × 4?", "answers": ["36"], "why": "10 × 4 = 40. Take away one group of 4: 40 − 4 = 36.", "no": "Start with 10 × 4. Take away one group."}, {"type": "fill", "q": "Use the ×6 shortcut. What is 6 × 8?", "answers": ["48"], "why": "5 × 8 = 40, plus one more group of 8: 40 + 8 = 48.", "no": "Start with 5 × 8. Add one group."}, {"q": "Which equation shows the ×6 shortcut for 6 × 4?", "choices": ["20 + 6 = 26", "4 + 4 + 4 + 4 + 4 = 20", "20 + 4 = 24", "24 − 4 = 20"], "a": 2, "why": "5 × 4 = 20, plus one more group of 4: 20 + 4 = 24.", "no": ["Add the other factor, 4, not 6.", "That is only 5 fours, added the tedious way.", null, "That takes a group away. For ×6 you add one."]}, {"q": "Fishlegs wrote 9 × 7 = 64. How can you tell it is wrong?", "choices": ["6 + 4 = 10, not 9", "The tens digit should be 7", "9s facts never end in 4", "It is not wrong"], "a": 0, "why": "For 9 × 2 up to 9 × 10, the digits add to 9. 6 + 4 = 10, so it is wrong. 9 × 7 = 63.", "no": [null, "The tens digit is one LESS than 7. It should be 6.", "9 × 6 = 54 ends in 4, so that rule is false.", "Verify it: 6 + 4 = 10, not 9."]}, {"type": "fill", "q": "Stoick puts 9 shields on each of his 9 longships. How many shields?", "answers": ["81", "81 shields"], "why": "9 equal groups of 9: 90 − 9 = 81 shields.", "no": "Each ship has 9 shields. There are 9 ships. Start with 10 × 9."}, {"type": "fill", "q": "A Viking boat has 6 rows. Each row has 7 oars. How many oars?", "answers": ["42", "42 oars"], "why": "6 groups of 7: 35 + 7 = 42 oars.", "no": "6 equal groups of 7. Start with 5 × 7."}, {"type": "fill", "q": "Snotlout did 9 × 6 = 60 − 9 = 51. What should he take away from 60? Type the number.", "answers": ["6", "six"], "why": "Take away one group of 6: 60 − 6 = 54.", "no": "How many are in ONE group?"}, {"type": "fill", "q": "Adding 8 nine times takes 8 steps. 80 − 8 takes one step, so it is more ____. Type the word from your word list.", "answers": ["efficient"], "why": "Fast with no wasted steps is <b>efficient</b>.", "no": "It is the opposite of tedious."}, {"q": "A <b>strategy</b> is…", "choices": ["a number you multiply", "a plan for solving a problem", "the answer to a multiplication", "a mistake in your work"], "a": 1, "why": "A strategy is a plan you choose to solve a problem.", "no": ["That is a factor.", null, "That is the product.", "A strategy is a plan, not a mistake."]}, {"q": "In 6 × 9 = 54, which number is the <b>product</b>?", "choices": ["6", "9", "15", "54"], "a": 3, "why": "The product is the answer to a multiplication: 54.", "no": ["6 is a factor.", "9 is a factor.", "15 is 6 + 9. It is not in this problem.", null]}], [{"type": "fill", "q": "Use the ×9 shortcut. What is 9 × 8?", "answers": ["72"], "why": "10 × 8 = 80. Take away one group of 8: 80 − 8 = 72.", "no": "Start with 10 × 8. Take away one group."}, {"type": "fill", "q": "Use the ×6 shortcut. What is 6 × 6?", "answers": ["36"], "why": "5 × 6 = 30, plus one more group of 6: 30 + 6 = 36.", "no": "Start with 5 × 6. Add one group."}, {"q": "Which equation shows the ×9 shortcut for 9 × 3?", "choices": ["30 − 9 = 21", "30 + 3 = 33", "27 − 3 = 24", "30 − 3 = 27"], "a": 3, "why": "10 × 3 = 30. Take away one group of 3: 30 − 3 = 27.", "no": ["Take away one group of 3, not 9.", "Adding makes 11 groups of 3. For ×9, take one away.", "Start at 10 × 3 = 30, not 27.", null]}, {"q": "Snotlout wrote 9 × 4 = 45. How can you tell it is wrong?", "choices": ["The digits do not add to 9", "The tens digit should be 3, one less than 4", "9s facts never end in 5", "It is not wrong"], "a": 1, "why": "4 + 5 = 9 passes Check 1, but the tens digit should be 3. 9 × 4 = 36.", "no": ["They do: 4 + 5 = 9. Use Check 2.", null, "9 × 5 = 45 ends in 5, so that rule is false.", "Use Check 2: the tens digit should be 3."]}, {"type": "fill", "q": "Gobber makes 9 swords. Each sword needs 7 nails. How many nails?", "answers": ["63", "63 nails"], "why": "9 equal groups of 7: 70 − 7 = 63 nails.", "no": "9 equal groups of 7. Start with 10 × 7."}, {"type": "fill", "q": "Hiccup draws 6 maps. Each map shows 9 islands. How many islands?", "answers": ["54", "54 islands"], "why": "6 groups of 9: 45 + 9 = 54 islands.", "no": "6 equal groups of 9. Start with 5 × 9."}, {"type": "fill", "q": "Fishlegs did 6 × 7 = 35 + 6 = 41. What should he add to 35? Type the number.", "answers": ["7", "seven"], "why": "Add one more group of 7: 35 + 7 = 42.", "no": "How many are in ONE group?"}, {"type": "fill", "q": "You add the digits of 63 to check that 9 × 7 = 63 is true. Which word from your list means to do this? Type it.", "answers": ["verify"], "why": "To check that something is true is to <b>verify</b>.", "no": "It starts with <b>v</b>."}, {"q": "Hiccup's plan was <b>ingenious</b>. That means it was…", "choices": ["very loud", "very slow", "very clever", "very dangerous"], "a": 2, "why": "<b>Ingenious</b> means very clever and creative.", "no": ["Loud is about sound. Ingenious is about thinking.", "Slow is about speed. Ingenious is about clever thinking.", null, "A plan can be dangerous, but ingenious means clever."]}, {"q": "Which is the most <b>efficient</b> way to find 9 × 6?", "choices": ["60 − 6", "Add 6 nine times", "Add 9 six times", "Count by 1s to 54"], "a": 0, "why": "One step: 10 × 6 = 60, then 60 − 6 = 54. That is efficient!", "no": [null, "That is 8 additions: tedious and easy to lose your place.", "That is still 5 additions. The shortcut takes one step.", "Counting 54 ones is the slowest way of all."]}], [{"type": "fill", "q": "Use the ×9 shortcut. What is 9 × 6?", "answers": ["54"], "why": "10 × 6 = 60. Take away one group of 6: 60 − 6 = 54.", "no": "Start with 10 × 6. Take away one group."}, {"type": "fill", "q": "Use the ×6 shortcut. What is 6 × 7?", "answers": ["42"], "why": "5 × 7 = 35, plus one more group of 7: 35 + 7 = 42.", "no": "Start with 5 × 7. Add one group."}, {"q": "You start 6 × 8 with 5 × 8 = 40. What is your next step?", "choices": ["Add 6 to get 46", "Take away 8 to get 32", "Add 5 to get 45", "Add 8 to get 48"], "a": 3, "why": "One more group of 8: 40 + 8 = 48. So 6 × 8 = 48.", "no": ["The extra group has 8 in it, not 6.", "Taking away is the ×9 shortcut. For ×6 you add one group.", "The extra group has 8 in it, not 5.", null]}, {"q": "Which 9s fact is <b>wrong</b>?", "choices": ["9 × 5 = 45", "9 × 9 = 81", "9 × 7 = 72", "9 × 3 = 27"], "a": 2, "why": "7 + 2 = 9 passes Check 1, but the tens digit should be 6. 9 × 7 = 63. (72 is 9 × 8.)", "no": ["Both checks work: 4 + 5 = 9, and 4 is one less than 5.", "Both checks work: 8 + 1 = 9, and 8 is one less than 9.", null, "Both checks work: 2 + 7 = 9, and 2 is one less than 3."]}, {"type": "fill", "q": "Toothless catches 8 fish on each of 9 trips. How many fish?", "answers": ["72", "72 fish"], "why": "9 equal groups of 8: 80 − 8 = 72 fish.", "no": "9 equal groups of 8. Start with 10 × 8."}, {"type": "fill", "q": "Gobber fixes 6 helmets every day for 6 days. How many helmets?", "answers": ["36", "36 helmets"], "why": "6 groups of 6: 30 + 6 = 36 helmets.", "no": "6 equal groups of 6. Start with 5 × 6."}, {"type": "fill", "q": "Hiccup did 9 × 9 = 90 − 1 = 89. What should he take away from 90? Type the number.", "answers": ["9", "nine"], "why": "Take away one whole group of 9: 90 − 9 = 81.", "no": "How many are in ONE group?"}, {"type": "fill", "q": "Hiccup says, \"7 is a ____ of 63, because 9 × 7 = 63.\" Type the missing word.", "answers": ["factor"], "why": "7 is a number you multiply to get 63, so it is a <b>factor</b> of 63.", "no": "It is not the answer. It is a number that goes in."}, {"q": "Adding 7 + 7 + 7 + 7 + 7 + 7 + 7 + 7 + 7 is <b>tedious</b>. That means it is…", "choices": ["quick and easy", "a secret trick", "long, slow and boring", "always wrong"], "a": 2, "why": "Tedious means long, slow and boring. 70 − 7 is the efficient way.", "no": ["Quick and easy is the opposite of tedious.", "Tedious is not a trick.", null, "It can be right. It is just slow."]}, {"q": "Hiccup used <b>70 − 7</b> to find 9 × 7. The plan he chose is called a…", "choices": ["strategy", "product", "factor", "remainder"], "a": 0, "why": "A plan you choose to solve a problem is a <b>strategy</b>.", "no": [null, "The product is the answer, 63.", "The factors are 9 and 7.", "A remainder is what is left over in division."]}]]}], "win": "Hiccup would call that ingenious. You found the shortcut!", "prev": null, "prevTitle": ""});</script></body></html>
