<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 1: Smart Shortcuts for ×9 and ×6</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L01", "label": "Lesson 1", "title": "Smart Shortcuts for ×9 and ×6", "goal": "I can use ×10 and ×5 facts to find ×9 and ×6 facts fast.", "date": "2026-10-20", "mastery": 90, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Smart Shortcuts for ×9 and ×6", "text": "Hiccup isn't the strongest Viking on Berk, but he wins by thinking smart. 🐉 Today you will multiply smart too: two <b>shortcuts</b> that turn facts you already know (×10 and ×5) into ×9 and ×6 facts.", "visual": {"kind": "emoji", "text": "🐉 🧠 ✖️"}}, {"type": "talk", "kick": "Book Talk", "title": "Talk about your book", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What happened in the part you read last? Tell it in order.", "What problem, or conflict, is Hiccup facing right now?", "Hiccup isn't big or loud like the other Vikings. How does he solve problems instead?"], "starters": ["In the part I read, …", "Hiccup's problem is …", "Instead of fighting, Hiccup …"]}, {"type": "vocab", "kick": "Word Power", "title": "7 words for today", "text": "Tap each card to flip it. Read the word, then use it in your own sentence out loud.", "words": [{"word": "factor", "pos": "noun", "emoji": "🔢", "meaning": "A number you multiply.", "example": "In 9 × 7, the factors are 9 and 7."}, {"word": "product", "pos": "noun", "emoji": "🎯", "meaning": "The answer to a multiplication problem.", "example": "The product of 6 and 8 is 48."}, {"word": "strategy", "pos": "noun", "emoji": "🗺️", "meaning": "A plan you choose to solve a problem.", "example": "Hiccup needs a smart strategy, not big muscles."}, {"word": "efficient", "pos": "adjective", "emoji": "⚡", "meaning": "Gets the job done fast, with no wasted steps.", "example": "70 − 7 is more efficient than adding 7 nine times."}, {"word": "tedious", "pos": "adjective", "emoji": "🐌", "meaning": "Long, slow and boring.", "example": "Adding 9 + 9 + 9 + 9 + 9 + 9 is tedious."}, {"word": "ingenious", "pos": "adjective", "emoji": "💡", "meaning": "Very clever and creative.", "example": "Hiccup thinks up an ingenious plan to save Berk."}, {"word": "verify", "pos": "verb", "emoji": "🔍", "meaning": "To check that something is true.", "example": "To verify 9 × 7 = 63, add the digits: 6 + 3 = 9 ✔."}]}, {"type": "learn", "kick": "Learn", "title": "Why adding over and over is slow", "text": "Here is 9 × 7 the long way: nine 7s, added one at a time.", "visual": {"kind": "numberline", "start": 0, "jump": 7, "jumps": 9}, "steps": [{"text": "Nine 7s means <b>8 additions</b>: 7, 14, 21, 28, 35, 42, 49, 56, 63."}, {"text": "One slip in the middle (like 28 + 7 = 34) and <b>every number after it is wrong</b>. That is <b>tedious</b> and risky."}, {"text": "Smart mathematicians ask: <b>Is there a more efficient strategy?</b> For 9s and 6s, there is!"}], "tip": "You already know your 10s and 5s cold. Today's shortcuts start there."}, {"type": "learn", "kick": "Shortcut 1", "title": "×9 = ×10, then take away one group", "text": "9 groups is just <b>one group less than 10 groups</b>. Let's find 9 × 7.", "visual": {"kind": "array", "rows": 10, "cols": 7, "emoji": "🐟", "label": "10 rows of 7 fish = 70"}, "steps": [{"text": "<b>Step 1.</b> Pretend it is ×10: 10 × 7 = <b>70</b>.", "visual": {"kind": "bigtext", "text": "10 × 7 = 70"}}, {"text": "<b>Step 2.</b> That is one row of 7 too many. Take it away: <b>70 − 7</b>."}, {"text": "<b>Step 3.</b> 70 − 7 = <b>63</b>. So 9 × 7 = 63.", "visual": {"kind": "bigtext", "text": "9 × 7 = 63"}}], "tip": "Take away the <b>other factor</b> (the 7), not 9. 70 − 9 = 61 is a trap!"}, {"type": "tap", "kick": "Try it", "title": "Use the ×9 shortcut", "items": [{"q": "Use the ×9 shortcut. What is 9 × 6?", "visual": {"kind": "bigtext", "text": "9 × 6"}, "choices": ["51", "54", "63", "56"], "a": 1, "why": "10 × 6 = 60. Take away one group of 6: 60 − 6 = <b>54</b>.", "no": ["51 is 60 − 9. Take away one group of <b>6</b>, not 9.", null, "63 is 9 × 7. Start with 10 × 6 = 60.", "56 is 60 − 4. Take away a whole group of 6."]}, {"q": "Which one shows the ×9 shortcut for 9 × 8?", "choices": ["90 − 9", "80 − 9", "80 − 8", "72 + 8"], "a": 2, "why": "10 × 8 = 80. Then take away one group of 8: 80 − 8 = 72.", "no": ["90 − 9 is the shortcut for 9 × 9. Start with 10 × <b>8</b>.", "Each group has 8 in it, so take away 8, not 9.", null, "72 + 8 adds a group. That gets you to 10 × 8, not 9 × 8."]}, {"q": "Stoick packs 9 crates. Each crate holds 4 helmets. How many helmets?", "visual": {"kind": "groups", "groups": 9, "each": 4, "emoji": "⛑️"}, "choices": ["13", "31", "36", "32"], "a": 2, "why": "9 equal groups of 4: 40 − 4 = <b>36</b> helmets.", "no": ["13 is 9 + 4. Each crate has 4, so this is 9 groups of 4. Multiply!", "31 is 40 − 9. Take away one group of 4, not 9.", null, "32 is 8 × 4. Count the crates again: there are 9."]}]}, {"type": "learn", "kick": "Learn", "title": "Three ways to verify a 9s fact", "text": "The 9s facts from 9 × 2 up to 9 × 10 have patterns. Use them to <b>verify</b> your answer.", "visual": {"kind": "passage", "text": "9 × 2 = 18 · 9 × 3 = 27 · 9 × 4 = 36<br>9 × 5 = 45 · 9 × 6 = 54 · 9 × 7 = 63<br>9 × 8 = 72 · 9 × 9 = 81 · 9 × 10 = 90"}, "steps": [{"text": "<b>Check 1: The digits add to 9.</b> 63 → 6 + 3 = 9 ✔. 72 → 7 + 2 = 9 ✔."}, {"text": "<b>Check 2: The tens digit is one less than the other factor.</b> In 9 × 7, the tens digit is 6 (one less than 7). 6 and 3 make 9, so the answer is 63."}, {"text": "<b>Finger check.</b> Hold up 10 fingers. For 9 × 7, count from the left and fold down finger number 7. Fingers to the left of it: <b>6</b> (tens). Fingers to the right: <b>3</b> (ones). That is 63!", "visual": {"kind": "emoji", "text": "🖐️🖐️"}}], "tip": "These checks work for 9 × 2 up to 9 × 10. Use Check 1 AND Check 2: the digits of 45 add to 9, but 9 × 6 = 45 is wrong. The tens digit should be 5, so 9 × 6 = 54."}, {"type": "sort", "kick": "Sort it", "title": "Correct or wrong?", "text": "Use both checks. Tap a fact, then tap the right box.", "buckets": ["✅ Correct", "❌ Wrong"], "items": [{"text": "9 × 6 = 54", "b": 0, "why": "5 + 4 = 9, and 5 is one less than 6.", "hint": "Add the digits. Then look at the tens digit."}, {"text": "9 × 8 = 74", "b": 1, "why": "7 + 4 = 11, not 9. The real answer is 72.", "hint": "Add the digits. Do you get 9?"}, {"text": "9 × 4 = 36", "b": 0, "why": "3 + 6 = 9, and 3 is one less than 4.", "hint": "Try both checks."}, {"text": "9 × 3 = 24", "b": 1, "why": "2 + 4 = 6, not 9. The real answer is 27.", "hint": "Add the digits. Do you get 9?"}, {"text": "9 × 7 = 54", "b": 1, "why": "5 + 4 = 9 passes Check 1, but the tens digit should be 6. The real answer is 63.", "hint": "The digits add to 9. Now use Check 2: what should the tens digit be?"}, {"text": "9 × 9 = 81", "b": 0, "why": "8 + 1 = 9, and 8 is one less than 9.", "hint": "Try both checks."}], "done": "Two checks catch more mistakes than one."}, {"type": "learn", "kick": "Shortcut 2", "title": "×6 = ×5, then add one group", "text": "6 groups is <b>one group more than 5 groups</b>. Let's find 6 × 8.", "visual": {"kind": "array", "rows": 6, "cols": 8, "emoji": "🛡️", "label": "6 rows of 8 shields"}, "steps": [{"text": "<b>Step 1.</b> Start with ×5: 5 × 8 = <b>40</b>.", "visual": {"kind": "bigtext", "text": "5 × 8 = 40"}}, {"text": "<b>Step 2.</b> That is one row short. Add one more row of 8: <b>40 + 8</b>."}, {"text": "<b>Step 3.</b> 40 + 8 = <b>48</b>. So 6 × 8 = 48.", "visual": {"kind": "bigtext", "text": "6 × 8 = 48"}}], "tip": "Add the <b>other factor</b> (the 8), not 6. 40 + 6 = 46 is a trap!"}, {"type": "build", "kick": "Build it", "title": "Toothless's fish baskets", "text": "Hiccup fills <b>6 baskets</b> with <b>7 fish</b> in each for Toothless. Build it. Then use the ×6 shortcut in your head.", "groups": 6, "each": 7, "emoji": "🐟", "why": "6 groups of 7. Shortcut: 5 × 7 = 35, plus one more group of 7: 35 + 7 = <b>42</b> fish.", "hint": "How many baskets are there? How many fish go in each basket?"}, {"type": "tap", "kick": "Try it", "title": "Use the ×6 shortcut", "items": [{"q": "You start 6 × 9 with 5 × 9 = 45. What is your next step?", "choices": ["Add 6 to get 51", "Add 9 to get 54", "Take away 9 to get 36", "Add 5 to get 50"], "a": 1, "why": "One more group of 9: 45 + 9 = <b>54</b>. So 6 × 9 = 54.", "no": ["Adding 6 is the trap. The extra group has <b>9</b> in it, not 6.", null, "Taking away is the ×9 shortcut. For ×6 you need one <b>more</b> group.", "The extra group has 9 in it, not 5."]}, {"q": "What is 6 × 6?", "choices": ["30", "42", "36", "12"], "a": 2, "why": "5 × 6 = 30, plus one more group of 6: 30 + 6 = <b>36</b>.", "no": ["30 is only 5 × 6. You still need one more group of 6.", "42 is 6 × 7.", null, "12 is 6 + 6, or 2 × 6."]}, {"q": "There are 6 dragon stables on Berk. Each stable has 4 stalls. How many stalls?", "visual": {"kind": "array", "rows": 6, "cols": 4, "emoji": "🐉"}, "choices": ["24", "10", "30", "20"], "a": 0, "why": "6 groups of 4: 5 × 4 = 20, plus 4 more = <b>24</b> stalls.", "no": [null, "10 is 6 + 4. Each stable has 4, so multiply.", "30 is 6 × 5. Each stable has 4 stalls, not 5.", "20 is only 5 × 4. Add one more group of 4."]}]}, {"type": "tap", "kick": "Think smart", "title": "Pick the smart strategy", "items": [{"q": "Which is the most <b>efficient</b> way to find 9 × 8?", "choices": ["Add 8 nine times", "Count by 1s to 72", "80 − 8", "Add 9 eight times"], "a": 2, "why": "One step: 10 × 8 = 80, then 80 − 8 = 72. That is efficient!", "no": ["That works, but it is 8 additions: tedious and easy to lose your place.", "Counting 72 ones is the slowest way of all.", null, "That is still 7 additions. The ×10 shortcut takes one step."]}, {"q": "Fishlegs says 9 × 5 = 50 − 9 = 41. What is his mistake?", "choices": ["There is no mistake.", "He should add 9 to get 59.", "He should start with 90.", "He should take away 5 to get 45."], "a": 3, "why": "Take away one group of <b>5</b>: 50 − 5 = 45. Verify: 4 + 5 = 9 ✔.", "no": ["Verify it: 4 + 1 = 5, not 9. Something is wrong.", "Adding a group makes 11 groups. For ×9 you take one group away.", "90 is 10 × 9. Start with 10 × 5 = 50.", null]}, {"q": "Hiccup is not the biggest Viking, but his plans are <b>ingenious</b>. His plans are…", "choices": ["very loud", "very clever", "very slow", "very dangerous"], "a": 1, "why": "<b>Ingenious</b> means very clever and creative.", "no": ["Loud is about sound. Ingenious is about thinking.", null, "Slow is about speed. Ingenious is about clever thinking.", "A plan can be dangerous, but ingenious means clever."]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "Use the ×9 shortcut. Which one is right for 9 × 4?", "choices": ["40 − 9 = 31", "40 + 4 = 44", "40 − 4 = 36", "36 − 4 = 32"], "a": 2, "why": "10 × 4 = 40. Take away one group of 4: 40 − 4 = 36.", "no": ["Take away one group of 4, not 9.", "Adding makes 11 groups of 4. For ×9, take one group away.", null, "Start at 10 × 4 = 40, not 36."]}, {"q": "What is 6 × 8?", "choices": ["46", "48", "54", "42"], "a": 1, "why": "5 × 8 = 40, plus one more group of 8: 40 + 8 = 48.", "no": ["46 is 40 + 6. Add a group of 8, not 6.", null, "54 is 6 × 9.", "42 is 6 × 7."]}, {"q": "Which equation shows the ×6 shortcut for 6 × 4?", "choices": ["20 + 6 = 26", "4 + 4 + 4 + 4 + 4 = 20", "20 + 4 = 24", "24 − 4 = 20"], "a": 2, "why": "5 × 4 = 20, plus one more group of 4: 20 + 4 = 24.", "no": ["Add the other factor, 4, not 6.", "That is only 5 fours. Adding over and over makes it easy to lose count.", null, "That takes a group away. For ×6 you add one."]}, {"q": "Fishlegs wrote 9 × 7 = 64. How can you tell it is wrong?", "choices": ["6 + 4 = 10, not 9", "The tens digit should be 7", "9s facts never end in 4", "It is not wrong"], "a": 0, "why": "For 9 × 2 up to 9 × 10, the digits of the product add to 9. 6 + 4 = 10, so it is wrong. 9 × 7 = 63.", "no": [null, "The tens digit is one LESS than 7. It should be 6.", "9 × 6 = 54 ends in 4, so that rule is false.", "Verify it: 6 + 4 = 10, not 9."]}, {"q": "Stoick puts 6 shields on each of his 9 longships. How many shields?", "choices": ["15", "45", "54", "63"], "a": 2, "why": "9 equal groups of 6: 9 × 6 = 60 − 6 = 54 shields.", "no": ["15 is 9 + 6. Each ship has 6, so multiply.", "45 is 9 × 5. Each ship has 6 shields.", null, "63 is 9 × 7."]}, {"q": "A <b>strategy</b> is…", "choices": ["a number you multiply", "a plan for solving a problem", "the answer to a multiplication", "a mistake in your work"], "a": 1, "why": "A strategy is a plan you choose to solve a problem.", "no": ["That is a factor.", null, "That is the product.", "A strategy is a plan, not a mistake."]}, {"q": "In 6 × 9 = 54, which number is the <b>product</b>?", "choices": ["6", "9", "15", "54"], "a": 3, "why": "The product is the answer to a multiplication: 54.", "no": ["6 is a factor.", "9 is a factor.", "15 is 6 + 9. It is not in this problem.", null]}, {"q": "Adding 8 + 8 + 8 + 8 + 8 + 8 + 8 + 8 + 8 is <b>tedious</b>. That means it is…", "choices": ["quick and easy", "long, slow and boring", "always wrong", "a secret trick"], "a": 1, "why": "Tedious means long, slow and boring. 80 − 8 is the efficient way.", "no": ["Quick and easy is the opposite of tedious.", null, "It can be right. It is just slow.", "Tedious is not a trick."]}, {"q": "Hiccup says 6 × 6 = 30 + 6. Fishlegs says 6 × 6 = 30 + 5. Who is right?", "choices": ["Hiccup: 36", "Fishlegs: 35", "Both of them", "Neither of them"], "a": 0, "why": "5 × 6 = 30, plus one more group of 6: 30 + 6 = 36.", "no": [null, "The extra group has 6 in it, not 5.", "30 + 5 and 30 + 6 are different numbers.", "Hiccup added one more group of 6. He is right."]}, {"q": "A Viking has 9 bags with 7 coins in each bag. Which number sentence fits?", "choices": ["9 + 7 = 16", "9 × 7 = 56", "70 − 9 = 61", "9 × 7 = 63"], "a": 3, "why": "9 equal groups of 7: 70 − 7 = 63.", "no": ["Each bag has 7, so multiply, don't add.", "56 is 8 × 7. Verify: 5 + 6 = 11, not 9.", "Take away a group of 7, not 9.", null]}]}], "win": "Hiccup would call that ingenious. You found the shortcut!", "prev": null, "prevTitle": ""});</script></body></html>
