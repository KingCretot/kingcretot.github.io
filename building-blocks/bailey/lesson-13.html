<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 13: Divide, Multiply, Subtract, Bring Down</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L13", "label": "Lesson 13", "title": "Divide, Multiply, Subtract, Bring Down", "goal": "I can divide a 2-digit number by a 1-digit number with long division, one step at a time.", "date": "2026-12-07", "mastery": 90, "color": "#E84393", "slides": [{"type": "hello", "title": "On Your Own: Divide, Multiply, Subtract, Bring Down", "text": "In class you learned long division with coins and with numbers. Now you practice it on your own. Keep paper and a pencil next to you. It takes about 25 minutes and ends with <b>Show What You Know</b>.", "visual": {"kind": "emoji", "text": "➗✏️"}}, {"type": "talk", "kick": "Say it out loud", "title": "Teach it to someone", "text": "Find someone at home. Teach them. Say it out loud before you go on.", "prompts": ["Tell them the four steps of long division in order. Teach them the memory trick.", "Show them 84 ÷ 4 on paper. Say each step as you write it.", "Who is the <b>chieftain</b> in <i>How to Train Your Dragon</i>? What kind of leader is he?"], "starters": ["The four steps are …", "First I divide: …", "The chieftain is … He is …"]}, {"type": "vocab", "kick": "Word Power", "title": "Remember the words", "text": "Tap each card. Say the meaning before you flip it. Then flip to check yourself.", "words": [{"word": "long division", "pos": "noun", "emoji": "➗", "meaning": "A way to divide big numbers one place at a time with four steps: divide, multiply, subtract, bring down.", "example": "We used <b>long division</b> to find 84 ÷ 4 = 21."}, {"word": "place value", "pos": "noun", "emoji": "🔢", "meaning": "What a digit is worth because of where it sits: ones, tens or hundreds.", "example": "In 84, the 8 has a <b>place value</b> of 8 tens, which is 80."}, {"word": "bring down", "pos": "verb", "emoji": "⬇️", "meaning": "In long division, to move the next digit of the dividend down next to what is left.", "example": "After you subtract, <b>bring down</b> the next digit."}, {"word": "sequence", "pos": "noun", "emoji": "🔗", "meaning": "The order that things happen in.", "example": "The <b>sequence</b> is divide, multiply, subtract, bring down."}, {"word": "methodical", "pos": "adjective", "emoji": "🧱", "meaning": "Doing things carefully, one step at a time, in order.", "example": "A <b>methodical</b> mathematician never skips a step."}, {"word": "chieftain", "pos": "noun", "emoji": "👑", "meaning": "The leader of a tribe or clan.", "example": "Stoick, Hiccup's father, is the <b>chieftain</b> of the Hairy Hooligan Tribe."}, {"word": "cautious", "pos": "adjective", "emoji": "🦺", "meaning": "Careful to avoid mistakes or danger.", "example": "A <b>cautious</b> Viking tests the ice before walking on it."}]}, {"type": "learn", "kick": "Remember", "title": "One more, all the way through", "text": "Here is <b>52 ÷ 4</b>, finished. Read each line of the work and say the step out loud.", "visual": {"kind": "longdiv", "text": "    13\n   ___\n4 ) 52\n   -4\n   --\n    12\n   -12\n   ---\n     0"}, "steps": [{"text": "<b>Divide:</b> 4 fits in 5 one time. <b>Multiply:</b> 1 × 4 = 4. <b>Subtract:</b> 5 − 4 = 1."}, {"text": "<b>Bring down</b> the 2: 12. <b>Divide:</b> 4 fits in 12 three times. <b>Multiply:</b> 3 × 4 = 12. <b>Subtract:</b> 0."}, {"text": "52 ÷ 4 = <b>13</b>. Check: 13 × 4 = 40 + 12 = 52."}], "tip": "Divide, multiply, subtract, bring down. Then again."}, {"type": "tap", "kick": "Your turn", "title": "What comes next?", "items": [{"q": "<b>85 ÷ 5</b>. Look at the work so far. Which step comes next?", "choices": ["Divide", "Multiply", "Subtract", "Bring down"], "a": 2, "why": "You just wrote the product under the number. Now subtract.", "no": ["You divide right after you bring down a new digit, or at the very start.", "You multiply right after you write a new digit in the quotient.", null, "You bring down right after you subtract, when a digit is still waiting."], "visual": {"kind": "longdiv", "text": "    1\n   ___\n5 ) 85\n   -5\n   --"}}, {"q": "<b>64 ÷ 4</b>. Look at the work so far. Which step comes next?", "choices": ["Divide", "Multiply", "Subtract", "Bring down"], "a": 1, "why": "You just wrote a digit in the quotient. Now multiply it by the divisor.", "no": ["You divide right after you bring down a new digit, or at the very start.", null, "You subtract right after you write the product underneath.", "You bring down right after you subtract, when a digit is still waiting."], "visual": {"kind": "longdiv", "text": "    1\n   ___\n4 ) 64"}}, {"q": "<b>98 ÷ 7</b>. Look at the work so far. Which step comes next?", "choices": ["Divide", "Multiply", "Subtract", "Bring down"], "a": 0, "why": "After you bring down a digit, you divide again.", "no": [null, "You multiply right after you write a new digit in the quotient.", "You subtract right after you write the product underneath.", "You bring down right after you subtract, when a digit is still waiting."], "visual": {"kind": "longdiv", "text": "    1\n   ___\n7 ) 98\n   -7\n   --\n    28"}}]}, {"type": "tap", "kick": "Your turn", "title": "What digit goes next?", "text": "Look at the work. Type the next digit of the quotient.", "items": [{"type": "fill", "q": "<b>96 ÷ 4</b>. What digit goes in the quotient next?", "answers": ["2", "two"], "why": "How many 4s fit in 9? 2, because 4 × 2 = 8.", "no": "How many 4s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ___\n4 ) 96"}}, {"type": "fill", "q": "<b>81 ÷ 3</b>. What digit goes in the quotient next?", "answers": ["7", "seven"], "why": "How many 3s fit in 21? 7, because 3 × 7 = 21.", "no": "How many 3s fit in 21?", "visual": {"kind": "longdiv", "text": "    2\n   ___\n3 ) 81\n   -6\n   --\n    21"}}, {"type": "fill", "q": "<b>58 ÷ 2</b>. What digit goes in the quotient next?", "answers": ["9", "nine"], "why": "How many 2s fit in 18? 9, because 2 × 9 = 18.", "no": "How many 2s fit in 18?", "visual": {"kind": "longdiv", "text": "    2\n   ___\n2 ) 58\n   -4\n   --\n    18"}}]}, {"type": "order", "kick": "Put in order", "title": "85 ÷ 5, step by step", "text": "Tap the steps in the right order.", "steps": ["Divide: 5 fits in 8 one time. Write 1.", "Multiply: 1 × 5 = 5.", "Subtract: 8 − 5 = 3.", "Bring down the 5. Now you have 35.", "Divide: 5 fits in 35 seven times. Write 7.", "Multiply: 7 × 5 = 35. Subtract: 35 − 35 = 0."], "why": "85 ÷ 5 = 17. Check: 17 × 5 = 50 + 35 = 85.", "hint": "Divide, multiply, subtract, bring down. Then start again."}, {"type": "tap", "kick": "Your turn", "title": "Solve on paper", "text": "Copy each problem on your paper. Solve it one step at a time. Type the quotient.", "items": [{"type": "fill", "q": "Use long division: <b>64 ÷ 4</b> = ____", "answers": ["16"], "why": "64 ÷ 4 = 16. Check: 16 × 4 = 64.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 4s fit in 6?", "visual": {"kind": "longdiv", "text": "\n   ___\n4 ) 64"}}, {"type": "fill", "q": "Use long division: <b>98 ÷ 7</b> = ____", "answers": ["14"], "why": "98 ÷ 7 = 14. Check: 14 × 7 = 98.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 7s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ___\n7 ) 98"}}, {"type": "fill", "q": "Use long division: <b>81 ÷ 3</b> = ____", "answers": ["27"], "why": "81 ÷ 3 = 27. Check: 27 × 3 = 81.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 3s fit in 8?", "visual": {"kind": "longdiv", "text": "\n   ___\n3 ) 81"}}]}, {"type": "tap", "kick": "Your turn", "title": "Estimate and check", "items": [{"q": "Estimate first. <b>54 ÷ 3</b> is…", "choices": ["between 0 and 10", "between 10 and 20", "between 20 and 30", "between 30 and 40"], "a": 1, "why": "3 × 10 = 30 and 3 × 20 = 60. 54 is between them, so the answer is between 10 and 20.", "no": ["3 × 10 = 30. That is still less than 54, so the answer is more than 10.", null, "3 × 20 = 60. That is more than 54, so the answer is less than 20.", "3 × 30 = 90. That is more than 54, so the answer is less than 30."]}, {"type": "fill", "q": "Bailey got <b>98 ÷ 7 = 14</b>. Check it: 14 × 7 = ____", "answers": ["98"], "why": "14 × 7 = 98. It matches the dividend, so the answer is right.", "no": "Use the area model: 10 × 7 plus 4 × 7."}, {"q": "In <b>96 ÷ 6</b>, after you subtract 9 − 6 = 3, what does the 3 stand for?", "choices": ["3 ones", "3 tens", "3 hundreds", "the answer"], "a": 1, "why": "The 9 in 96 is 9 tens. 9 tens − 6 tens = 3 tens. That is why you bring the ones down next to it: 3 tens and 6 ones make 36.", "no": ["The 9 was in the tens place, so what is left is tens too.", null, "There are no hundreds in 96.", "The answer is 16. The 3 is what is left after the first step."]}]}, {"type": "tap", "kick": "Word work", "title": "Words in action", "text": "Type the word.", "items": [{"type": "fill", "q": "The order that things happen in is the ____. (Use a word from your word cards.)", "answers": ["sequence"], "why": "A <i>sequence</i> is the order things happen in.", "no": "It starts with s."}, {"type": "fill", "q": "Stoick leads the Hairy Hooligan Tribe. He is the tribe's ____. (Use a word from your word cards.)", "answers": ["chieftain"], "why": "A <i>chieftain</i> is the leader of a tribe.", "no": "It starts with ch."}, {"q": "Fishlegs checks every step before he moves on, so he does not make a mistake. Which word describes him best?", "choices": ["fluent", "cautious", "resilient", "chieftain"], "a": 1, "why": "<i>Cautious</i> means careful to avoid mistakes or danger.", "no": ["Fluent means quick and correct.", null, "Resilient means you bounce back after something goes wrong.", "A chieftain is a leader of a tribe."]}]}, {"type": "recall", "kick": "Remember?", "title": "Earlier lessons", "items": [{"type": "fill", "q": "Use the area model: <b>63 × 4</b> = ____", "answers": ["252"], "why": "60 × 4 = 240 and 3 × 4 = 12. 240 + 12 = 252.", "no": "60 × 4 = 240. Now add 3 × 4.", "visual": {"kind": "area", "b": 4, "split": [60, 3], "show": false}}, {"type": "fill", "q": "<b>50 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["8 R 2", "8R2", "8 r 2", "8 remainder 2", "8 rem 2", "8 r2"], "why": "6 × 8 = 48 and 50 − 48 = 2. So 50 ÷ 6 = 8 R 2.", "no": "Find the biggest 6s fact that is not more than 50.", "placeholder": "like 4 R 2"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Use long division: <b>90 ÷ 5</b> = ____", "answers": ["18"], "why": "90 ÷ 5 = 18. Check: 18 × 5 = 90.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 5s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ___\n5 ) 90"}}, {"type": "fill", "q": "Use long division: <b>51 ÷ 3</b> = ____", "answers": ["17"], "why": "51 ÷ 3 = 17. Check: 17 × 3 = 51.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 3s fit in 5?", "visual": {"kind": "longdiv", "text": "\n   ___\n3 ) 51"}}, {"type": "fill", "q": "Use long division: <b>84 ÷ 6</b> = ____", "answers": ["14"], "why": "84 ÷ 6 = 14. Check: 14 × 6 = 84.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 6s fit in 8?", "visual": {"kind": "longdiv", "text": "\n   ___\n6 ) 84"}}, {"q": "<b>56 ÷ 4</b>. Look at the work so far. Which step comes next?", "choices": ["Divide", "Multiply", "Subtract", "Bring down"], "a": 2, "why": "You just wrote the product under the number. Now subtract.", "no": ["You divide right after you bring down a new digit, or at the very start.", "You multiply right after you write a new digit in the quotient.", null, "You bring down right after you subtract, when a digit is still waiting."], "visual": {"kind": "longdiv", "text": "    1\n   ___\n4 ) 56\n   -4\n   --"}}, {"type": "fill", "q": "<b>52 ÷ 2</b>. What digit goes in the quotient next?", "answers": ["6", "six"], "why": "How many 2s fit in 12? 6, because 2 × 6 = 12.", "no": "How many 2s fit in 12?", "visual": {"kind": "longdiv", "text": "    2\n   ___\n2 ) 52\n   -4\n   --\n    12"}}, {"q": "Estimate first. <b>54 ÷ 2</b> is…", "choices": ["between 20 and 30", "between 30 and 40", "between 40 and 50", "between 50 and 60"], "a": 0, "why": "2 × 20 = 40 and 2 × 30 = 60. 54 is between them, so the answer is between 20 and 30.", "no": [null, "2 × 30 = 60. That is more than 54, so the answer is less than 30.", "2 × 40 = 80. That is more than 54, so the answer is less than 40.", "2 × 50 = 100. That is more than 54, so the answer is less than 50."]}, {"type": "fill", "q": "Bailey got <b>90 ÷ 6 = 15</b>. Check it: 15 × 6 = ____", "answers": ["90"], "why": "15 × 6 = 90. It matches the dividend, so the answer is right.", "no": "Use the area model: 10 × 6 plus 5 × 6."}, {"q": "In <b>84 ÷ 4 = 21</b>, what is the 2 in the quotient worth?", "choices": ["2 ones", "2 hundreds", "2 tens", "2 fours"], "a": 2, "why": "The 2 sits in the tens place. It is 2 tens, or 20.", "no": ["The 2 is in the tens place, not the ones place.", "There is no hundreds place in 21.", null, "Place value tells what a digit is worth: tens."]}, {"type": "fill", "q": "Doing things carefully, one step at a time, in order, is being ____. (Use a word from your word cards.)", "answers": ["methodical"], "why": "<i>Methodical</i> means careful, one step at a time, in order.", "no": "It starts with m."}, {"q": "Which word means <i>the order that things happen in</i>?", "choices": ["sequence", "chieftain", "cautious", "place value"], "a": 0, "why": "A <i>sequence</i> is the order things happen in.", "no": [null, "A chieftain is a leader.", "Cautious means careful.", "Place value is what a digit is worth."]}], [{"type": "fill", "q": "Use long division: <b>65 ÷ 5</b> = ____", "answers": ["13"], "why": "65 ÷ 5 = 13. Check: 13 × 5 = 65.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 5s fit in 6?", "visual": {"kind": "longdiv", "text": "\n   ___\n5 ) 65"}}, {"type": "fill", "q": "Use long division: <b>42 ÷ 3</b> = ____", "answers": ["14"], "why": "42 ÷ 3 = 14. Check: 14 × 3 = 42.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 3s fit in 4?", "visual": {"kind": "longdiv", "text": "\n   ___\n3 ) 42"}}, {"type": "fill", "q": "Use long division: <b>98 ÷ 2</b> = ____", "answers": ["49"], "why": "98 ÷ 2 = 49. Check: 49 × 2 = 98.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 2s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ___\n2 ) 98"}}, {"q": "<b>68 ÷ 4</b>. Look at the work so far. Which step comes next?", "choices": ["Divide", "Multiply", "Subtract", "Bring down"], "a": 3, "why": "You subtracted and there is still a digit up top that has not been used. Bring it down.", "no": ["You divide right after you bring down a new digit, or at the very start.", "You multiply right after you write a new digit in the quotient.", "You subtract right after you write the product underneath.", null], "visual": {"kind": "longdiv", "text": "    1\n   ___\n4 ) 68\n   -4\n   --\n    2"}}, {"type": "fill", "q": "<b>45 ÷ 3</b>. What digit goes in the quotient next?", "answers": ["5", "five"], "why": "How many 3s fit in 15? 5, because 3 × 5 = 15.", "no": "How many 3s fit in 15?", "visual": {"kind": "longdiv", "text": "    1\n   ___\n3 ) 45\n   -3\n   --\n    15"}}, {"q": "Estimate first. <b>84 ÷ 3</b> is…", "choices": ["between 0 and 10", "between 10 and 20", "between 20 and 30", "between 30 and 40"], "a": 2, "why": "3 × 20 = 60 and 3 × 30 = 90. 84 is between them, so the answer is between 20 and 30.", "no": ["3 × 10 = 30. That is still less than 84, so the answer is more than 10.", "3 × 20 = 60. That is still less than 84, so the answer is more than 20.", null, "3 × 30 = 90. That is more than 84, so the answer is less than 30."]}, {"type": "fill", "q": "Bailey got <b>76 ÷ 2 = 38</b>. Check it: 38 × 2 = ____", "answers": ["76"], "why": "38 × 2 = 76. It matches the dividend, so the answer is right.", "no": "Use the area model: 30 × 2 plus 8 × 2."}, {"q": "In <b>72 ÷ 3</b>, you subtract 7 − 6 = 1 and bring down the 2. What number do you divide next?", "choices": ["2", "1", "21", "12"], "a": 3, "why": "The 1 left (1 ten) and the 2 you brought down (2 ones) make 12.", "no": ["The 2 joins the 1 that was left over.", "You still need to bring down the 2.", "The 1 is tens and goes first: 1 ten and 2 ones make 12.", null]}, {"type": "fill", "q": "In long division, after you subtract, you ____ ____ the next digit. (Type the two-word step.)", "answers": ["bring down"], "why": "After you subtract, you <i>bring down</i> the next digit.", "no": "It starts with b and d."}, {"q": "A <b>chieftain</b> is…", "choices": ["a kind of dragon", "the leader of a tribe", "a long story about heroes", "a careful worker"], "a": 1, "why": "A <i>chieftain</i> is the leader of a tribe or clan, like Stoick.", "no": ["Stoick is not a dragon. He is the chieftain.", null, "That is a saga.", "That describes someone methodical or cautious."]}], [{"type": "fill", "q": "Use long division: <b>80 ÷ 5</b> = ____", "answers": ["16"], "why": "80 ÷ 5 = 16. Check: 16 × 5 = 80.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 5s fit in 8?", "visual": {"kind": "longdiv", "text": "\n   ___\n5 ) 80"}}, {"type": "fill", "q": "Use long division: <b>69 ÷ 3</b> = ____", "answers": ["23"], "why": "69 ÷ 3 = 23. Check: 23 × 3 = 69.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 3s fit in 6?", "visual": {"kind": "longdiv", "text": "\n   ___\n3 ) 69"}}, {"type": "fill", "q": "Use long division: <b>96 ÷ 8</b> = ____", "answers": ["12", "twelve"], "why": "96 ÷ 8 = 12. Check: 12 × 8 = 96.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the tens: how many 8s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ___\n8 ) 96"}}, {"q": "<b>87 ÷ 3</b>. Look at the work so far. Which step comes next?", "choices": ["Divide", "Multiply", "Subtract", "Bring down"], "a": 1, "why": "You just wrote a digit in the quotient. Now multiply it by the divisor.", "no": ["You divide right after you bring down a new digit, or at the very start.", null, "You subtract right after you write the product underneath.", "You bring down right after you subtract, when a digit is still waiting."], "visual": {"kind": "longdiv", "text": "    2\n   ___\n3 ) 87"}}, {"type": "fill", "q": "<b>72 ÷ 6</b>. What digit goes in the quotient next?", "answers": ["2", "two"], "why": "How many 6s fit in 12? 2, because 6 × 2 = 12.", "no": "How many 6s fit in 12?", "visual": {"kind": "longdiv", "text": "    1\n   ___\n6 ) 72\n   -6\n   --\n    12"}}, {"q": "Estimate first. <b>95 ÷ 5</b> is…", "choices": ["between 10 and 20", "between 20 and 30", "between 30 and 40", "between 40 and 50"], "a": 0, "why": "5 × 10 = 50 and 5 × 20 = 100. 95 is between them, so the answer is between 10 and 20.", "no": [null, "5 × 20 = 100. That is more than 95, so the answer is less than 20.", "5 × 30 = 150. That is more than 95, so the answer is less than 30.", "5 × 40 = 200. That is more than 95, so the answer is less than 40."]}, {"type": "fill", "q": "Bailey got <b>78 ÷ 3 = 26</b>. Check it: 26 × 3 = ____", "answers": ["78"], "why": "26 × 3 = 78. It matches the dividend, so the answer is right.", "no": "Use the area model: 20 × 3 plus 6 × 3."}, {"q": "In <b>94 ÷ 2</b>, the first step divides the 9. What does that 9 stand for?", "choices": ["9 tens", "9 ones", "9 hundreds", "94 ones"], "a": 0, "why": "The 9 sits in the tens place of 94. It is 9 tens, or 90.", "no": [null, "The 9 is in the tens place, not the ones place.", "94 has no hundreds.", "The first step only uses the tens digit."]}, {"type": "fill", "q": "What a digit is worth because of where it sits is its ____ ____. (Type the two words.)", "answers": ["place value"], "why": "<i>Place value</i> is what a digit is worth because of where it sits.", "no": "It starts with p and v."}, {"q": "Which person is being <b>cautious</b>?", "choices": ["Snotlout rushes into the cave without looking.", "Toothless sleeps all day.", "Hiccup checks that the dragon is asleep before he tiptoes past.", "Stoick shouts orders."], "a": 2, "why": "<i>Cautious</i> means careful to avoid danger or mistakes.", "no": ["Rushing without looking is the opposite of cautious.", "Sleeping is not being careful.", null, "Shouting orders is leading, not being careful."]}]]}], "win": "You did long division, one step at a time.
