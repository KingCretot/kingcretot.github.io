<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 12: Welcome Back: What Did You Keep?</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L12", "label": "Lesson 12", "title": "Welcome Back: What Did You Keep?", "goal": "I can show what I remember: fact shortcuts, the area model, division facts and leftovers.", "date": "2026-12-03", "mastery": 90, "color": "#C9A84C", "slides": [{"type": "hello", "title": "Welcome Back: What Did You Keep?", "text": "Welcome back! First, you present your <b>Gratitude Project poster</b>. Then we find out which math tools you kept over the break: fact shortcuts, the area model and division.", "visual": {"kind": "emoji", "text": "🫙📊🐉"}, "notes": {"do": "Have ready: her Gratitude Project poster and worksheet pages 3 and 4, about 50 dried beans, 6 cups or paper plates, whiteboard and marker, and her book. Prop the poster where she can stand beside it.", "say": "\"Welcome back! Today is not about anything new. I want to see what you kept. If something slipped, that is normal after three weeks, and we fix it today.\"", "ask": "\"Did you finish the Lesson 11 work over the break? Which part felt easy and which part felt hard?\""}}, {"type": "talk", "kick": "Gratitude Project", "title": "Present your poster", "text": "Stand next to your poster. Talk to your audience, not to the poster.", "visual": {"kind": "emoji", "text": "🫙📊"}, "prompts": ["Read your title. Then tell what the project was and who was in it.", "Show your bar graph. Which topic had the most slips? What does that tell you about your family?", "Read your Gratitude Report paragraph. Point to your main idea sentence.", "Share your 3 favorite quotes. Which one means the most to you, and why?"], "starters": ["Our family filled a Gratitude Jar for …", "The topic with the most slips was …, which tells me …", "My favorite quote is … because …"], "notes": {"do": "8 minutes. She presents for about 5 minutes; you listen without interrupting. Then ask two questions. Press the gold button for each strong answer.", "say": "When she finishes: \"Thank you. Tell me one thing you did really well, and one thing you would change next time.\"", "ask": "\"How did you make the bar graph from the tally marks?\" \"Which Word Bank words did you use in your paragraph?\"", "listen": "Eye contact, a clear main idea sentence, and a detail from the graph used as evidence. Praise one specific thing out loud (\"You looked up at me when you read your main idea\")."}}, {"type": "talk", "kick": "Book Talk", "title": "Back to Berk", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["Where are you in the book now? Tell the most important thing that happened since Lesson 11.", "How has Hiccup changed since the beginning of the book? Give one event as proof.", "Which character would you like to ask a question? What would you ask?"], "starters": ["Since Lesson 11, the most important thing was …", "At first Hiccup …, but now he …", "I would ask … because …"], "notes": {"do": "6 minutes. Let her hold the book and find pages.", "ask": "\"How has Hiccup changed? Prove it with one thing he did.\"", "listen": "A change (from scared or unsure to braver or more confident) backed by a real event. If she only retells, ask: \"So what is different about him now?\""}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read it out loud. Then use it in your own sentence about the break or about math.", "words": [{"word": "array", "pos": "noun", "emoji": "🔲", "meaning": "Objects set out in equal rows and columns.", "example": "An <b>array</b> with 7 rows of 8 shields shows 7 × 8 = 56."}, {"word": "fluent", "pos": "adjective", "emoji": "⚡", "meaning": "Able to do something quickly, easily and correctly.", "example": "When you are <b>fluent</b> with 9 × 8, you know it is 72 without adding."}, {"word": "retain", "pos": "verb", "emoji": "🧠", "meaning": "To keep something, like keeping a fact in your memory.", "example": "Did you <b>retain</b> your fact shortcuts over the break?"}, {"word": "revisit", "pos": "verb", "emoji": "🔁", "meaning": "To go back to something and look at it again.", "example": "Today we <b>revisit</b> the area model before we learn long division."}, {"word": "reflect", "pos": "verb", "emoji": "🪞", "meaning": "To think carefully about something that happened.", "example": "The Gratitude Project helped me <b>reflect</b> on what my family means to me."}, {"word": "resilient", "pos": "adjective", "emoji": "🌱", "meaning": "Able to bounce back and keep going after something goes wrong.", "example": "A <b>resilient</b> learner tries a hard problem again instead of quitting."}, {"word": "saga", "pos": "noun", "emoji": "📜", "meaning": "A long story about heroes and their adventures, like the old stories about the Vikings.", "example": "Hiccup's adventures with Toothless feel like a Viking <b>saga</b>."}], "notes": {"do": "She reads each card and makes her own sentence. Write <b>retain</b> and <b>fluent</b> on the whiteboard; you will use them all lesson.", "say": "\"Two math words, array and fluent, and five story words. Saga is a Viking word, so it belongs with your book.\"", "ask": "\"What is one thing you <i>retained</i> from the Gratitude Project?\" \"Is a <i>resilient</i> person someone who never fails? Why not?\"", "listen": "For <i>resilient</i>: she should say a resilient person DOES fail or struggle but keeps going. For <i>fluent</i>: quick AND correct."}}, {"type": "learn", "kick": "Revisit", "title": "Four fact shortcuts", "text": "When a fact is not automatic yet, do not add the number over and over. Use a <b>shortcut</b>.", "steps": [{"text": "<b>×9 = ×10 minus one group.</b> 9 × 6: 10 × 6 = 60, then 60 − 6 = <b>54</b>."}, {"text": "<b>×6 = ×5 plus one group.</b> 6 × 7: 5 × 7 = 35, then 35 + 7 = <b>42</b>."}, {"text": "<b>×8 = double, double, double.</b> 8 × 9: 9 doubled is 18, doubled again is 36, doubled again is <b>72</b>."}, {"text": "<b>×7 = ×5 plus ×2.</b> 7 × 9: 5 × 9 = 45 and 2 × 9 = 18, then 45 + 18 = <b>63</b>."}], "tip": "Pick the shortcut that matches the 6, 7, 8 or 9 in the fact.", "notes": {"do": "Before each step, cover the answer and ask her to say the shortcut first. Write each one on the whiteboard as she says it.", "say": "After each correct step: \"Yes! You retained that one.\"", "ask": "\"Which shortcut would you use for 9 × 6?\" before you reveal Step 1, and the same for each step.", "listen": "She names the shortcut, not just the answer. If she starts adding 9 + 9 + 9 …, stop her kindly: \"That works, but it is the slow road. Which shortcut fits a 9?\""}}, {"type": "tap", "kick": "Talk it through", "title": "Which shortcut?", "text": "Say the shortcut out loud first. Then type the answer.", "items": [{"type": "fill", "q": "<b>9 × 8</b> = ____", "answers": ["72"], "why": "80 − 8 = 72.", "no": "Use ×10 minus one group: 10 × 8 = 80. Now take away one 8."}, {"type": "fill", "q": "<b>6 × 6</b> = ____", "answers": ["36"], "why": "5 × 6 = 30, plus one more 6 is 36.", "no": "Use ×5 plus one group: 5 × 6 = 30."}, {"type": "fill", "q": "<b>8 × 8</b> = ____", "answers": ["64"], "why": "Double 8 is 16, double again is 32, double again is 64.", "no": "Double 8, then double again, then double again."}, {"type": "fill", "q": "<b>7 × 7</b> = ____", "answers": ["49"], "why": "5 × 7 = 35 and 2 × 7 = 14. 35 + 14 = 49.", "no": "Use ×5 plus ×2: 35 + 14."}], "notes": {"do": "She types each answer herself. Count silently: under 3 seconds means fluent.", "say": "Praise each one right away: \"Fluent!\" or \"Right, and you used the shortcut.\"", "listen": "Which facts are slow. Write them on an index card for her to keep; they go on her task list as extra practice."}}, {"type": "learn", "kick": "Revisit", "title": "The area model", "text": "For a 2-digit number times a 1-digit number, break the big number into <b>tens and ones</b>. Multiply each part. Add.", "steps": [{"text": "<b>Estimate first.</b> 68 × 7: 68 is close to 70. 70 × 7 = 490, so the answer is about 490."}, {"text": "<b>Break it apart.</b> 68 = 60 + 8. Make one box for 60 and one box for 8.", "visual": {"kind": "area", "b": 7, "split": [60, 8], "show": false}}, {"text": "<b>Multiply each box.</b> 60 × 7 = 420 and 8 × 7 = 56.", "visual": {"kind": "area", "b": 7, "split": [60, 8], "show": true}}, {"text": "<b>Add.</b> 420 + 56 = <b>476</b>. That is close to 490, so it makes sense."}], "tip": "Adding 7 sixty-eight times would take forever. Two boxes take one minute.", "notes": {"do": "Draw the two boxes on the whiteboard while she watches, then let her fill in the numbers.", "ask": "\"Why 60 and not 6?\" (The 6 is in the tens place, so it is 60.) \"Why do we estimate first?\" (To know if the answer makes sense.)", "listen": "The classic slip is 6 × 7 = 42 instead of 60 × 7 = 420. If she says 42, point to the tens place."}}, {"type": "tap", "kick": "Guided practice", "title": "Area model and the smart method", "items": [{"type": "fill", "q": "Use the area model: <b>84 × 6</b> = ____", "answers": ["504"], "why": "80 × 6 = 480 and 4 × 6 = 24. 480 + 24 = 504.", "no": "Fill each box first: 80 × 6, then 4 × 6.", "visual": {"kind": "area", "b": 6, "split": [80, 4], "show": false}}, {"q": "Hiccup needs <b>38 × 9</b>. Which way is the most efficient <i>and</i> correct?", "choices": ["Add 38 nine times", "Multiply 3 × 9 and 8 × 9, then add: 27 + 72 = 99", "Area model: 30 × 9 + 8 × 9 = 270 + 72", "Count by 9s until you get to 38"], "a": 2, "why": "The area model keeps the place value: 270 + 72 = 342.", "no": ["That works, but it is slow, and it is easy to lose track.", "The 3 is in the tens place. It means 30, not 3.", null, "Counting to 38 by 9s does not answer 38 × 9."]}], "notes": {"do": "She draws the 84 × 6 boxes on the whiteboard before she types.", "ask": "On the Hiccup item: \"What is wrong with 27 + 72?\" (It treats 30 like 3.)", "listen": "She explains why the area model wins: it is fast AND keeps the tens as tens."}}, {"type": "learn", "kick": "Revisit", "title": "Division undoes multiplication", "text": "Every division fact asks a multiplication question. <b>63 ÷ 7</b> means <b>7 × ? = 63</b>. 7 × 9 = 63, so 63 ÷ 7 = 9.", "visual": {"kind": "triangle", "a": 6, "b": 8, "c": 48}, "steps": [{"text": "A <b>fact family</b> uses the same three numbers. For 6, 8 and 48: 6 × 8 = 48 and 8 × 6 = 48."}, {"text": "The two division facts start with the biggest number: 48 ÷ 6 = 8 and 48 ÷ 8 = 6."}], "tip": "Division question? Say the multiplication question first.", "notes": {"do": "Point to the triangle: biggest number on top.", "ask": "\"What does 54 ÷ 9 ask?\" (9 × ? = 54.) \"Say all four facts for 6, 8 and 48.\"", "listen": "Division facts that start with the biggest number. If she says \"6 ÷ 48\", ask: \"Can you share 6 beans among 48 plates?\""}}, {"type": "tap", "kick": "Guided practice", "title": "Fact families", "items": [{"type": "fill", "q": "<b>? ÷ 6 = 7</b>. What is the missing number?", "answers": ["42"], "why": "The biggest number is missing, so multiply: 7 × 6 = 42.", "no": "The biggest number is missing. Multiply 7 × 6."}, {"type": "fill", "q": "<b>72 ÷ ? = 9</b>. What is the missing number?", "answers": ["8", "eight"], "why": "9 × 8 = 72, so 72 ÷ 8 = 9.", "no": "Ask: 9 × what = 72?"}, {"q": "Which fact is <b>not</b> in the fact family for 7, 9 and 63?", "choices": ["63 ÷ 9 = 7", "9 × 7 = 63", "63 ÷ 7 = 9", "7 ÷ 63 = 9"], "a": 3, "why": "A division fact in this family starts with 63, the biggest number. 7 ÷ 63 is backward.", "no": ["That one is in the family: 9 × 7 = 63.", "That one is in the family.", "That one is in the family: 7 × 9 = 63.", null]}], "notes": {"ask": "For each: \"Which number is missing: the biggest one or a smaller one? Do you multiply or divide?\"", "listen": "\"The biggest is missing, so I multiply.\" Praise that sentence every time she says it."}}, {"type": "build", "kick": "Hands-on", "title": "Feeding time on Berk", "text": "Stoick shares <b>48 fish</b> equally among <b>6 dragons</b>. Use the buttons to show the dragons and the fish each one gets.", "groups": 6, "each": 8, "emoji": "🐟", "why": "6 dragons with 8 fish each: 6 × 8 = 48, so 48 ÷ 6 = 8.", "hint": "The number of groups is the number of dragons. Then ask: 6 × what = 48?", "notes": {"do": "First she predicts with a fact (6 × ? = 48). Then she deals 48 beans onto 6 plates to prove it. Then she sets the buttons.", "ask": "\"Prediction first: 6 times what is 48?\" After the beans: \"Did your fact match the plates?\"", "listen": "\"6 × 8 = 48, so 8 each.\" If she counts the beans one by one, let her finish, then ask which fact would have told her faster."}}, {"type": "learn", "kick": "Revisit", "title": "Leftovers", "text": "Sometimes things do not share evenly. The amount left over is the <b>remainder</b>.", "steps": [{"text": "<b>50 ÷ 8.</b> Find the biggest 8s fact that is not more than 50: 8 × 6 = 48. (8 × 7 = 56 is too big.)"}, {"text": "Subtract: 50 − 48 = 2. Two are left over."}, {"text": "That makes 6 full groups of 8, and a small pile of 2 is left over. So 50 ÷ 8 = <b>6 R 2</b>.", "visual": {"kind": "uneven", "sets": [8, 8, 8, 8, 8, 8, 2], "emoji": "🫘"}}, {"text": "The remainder must be <b>smaller than the divisor</b>. 2 is smaller than 8, so the answer is right."}], "tip": "If the remainder is as big as the divisor or bigger, another group fits.", "notes": {"do": "Hands-on: she deals 50 beans into piles of 8 and shows the 2 left in her hand.", "ask": "\"Why can't the remainder be 10?\" (Then another pile of 8 would fit.)", "listen": "\"The remainder has to be smaller than what I divide by.\" This rule is the bridge to next week's long division."}}, {"type": "tap", "kick": "Guided practice", "title": "What is left over?", "items": [{"type": "fill", "q": "<b>47 ÷ 6</b> = ____ &nbsp; (use R for the remainder)", "answers": ["7 R 5", "7R5", "7 r 5", "7 remainder 5", "7 rem 5", "7 r5"], "why": "6 × 7 = 42 and 47 − 42 = 5. So 47 ÷ 6 = 7 R 5.", "no": "Find the biggest 6s fact that is not more than 47.", "placeholder": "like 4 R 2"}, {"q": "Fishlegs says <b>60 ÷ 7 = 7 R 11</b>. What is wrong?", "choices": ["Nothing. It is right.", "11 is bigger than 7, so another 7 fits: it is 8 R 4.", "It should be 9 R 0.", "It should be 6 R 18."], "a": 1, "why": "7 × 8 = 56 and 60 − 56 = 4. So 60 ÷ 7 = 8 R 4.", "no": ["A remainder of 11 is bigger than the divisor 7. Another group fits.", null, "7 × 9 = 63. That is more than 60.", "18 is even bigger than 7. Two more groups fit."]}, {"type": "fill", "q": "<b>26 ÷ 3</b> = ____ &nbsp; (use R for the remainder)", "answers": ["8 R 2", "8R2", "8 r 2", "8 remainder 2", "8 rem 2", "8 r2"], "why": "3 × 8 = 24 and 26 − 24 = 2. So 26 ÷ 3 = 8 R 2.", "no": "3 × 8 = 24. How many are left?", "placeholder": "like 4 R 2"}], "notes": {"do": "Beans ready for any item she is unsure of.", "ask": "On the Fishlegs item: \"How could Fishlegs catch his own mistake?\" (11 is bigger than 7.)", "listen": "She checks the remainder against the divisor without being asked. Praise it: \"That check is exactly what you will need next week.\""}}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"q": "Over the break, Bailey still knew every ×9 fact. She <b>retained</b> them. What does that mean?", "choices": ["She forgot them.", "She kept them in her memory.", "She wrote them down.", "She taught them to River."], "a": 1, "why": "To <i>retain</i> is to keep something, like keeping facts in your memory.", "no": ["Forgetting is the opposite of retaining.", null, "Writing is not the same as remembering.", "Teaching is not what retain means. (And River is a dog!)"]}, {"type": "fill", "q": "Toothless can answer 8 × 7 = 56 in one second, every time. He is ____ with that fact. (Use a word from your word cards.)", "answers": ["fluent"], "why": "<i>Fluent</i> means quick, easy and correct.", "no": "It starts with f."}, {"q": "Which is the best example of a <b>saga</b>?", "choices": ["a grocery list", "a long story about a Viking hero's adventures", "a times table", "a short joke"], "a": 1, "why": "A <i>saga</i> is a long story about heroes and their adventures.", "no": ["A list is not a story.", null, "A times table is math, not a story.", "A saga is long, and it is about heroes."]}], "notes": {"ask": "\"Use <i>resilient</i> in a sentence about something hard you did this year.\"", "listen": "She uses the word with a real example from her own life."}}, {"type": "tap", "kick": "Exit ticket", "title": "Show me before you go", "text": "On your own. No help this time.", "items": [{"type": "fill", "q": "<b>7 × 8</b> = ____", "answers": ["56"], "why": "5 × 8 = 40 and 2 × 8 = 16. 40 + 16 = 56.", "no": "Use ×5 plus ×2."}, {"type": "fill", "q": "Use the area model: <b>56 × 4</b> = ____", "answers": ["224"], "why": "50 × 4 = 200 and 6 × 4 = 24. 200 + 24 = 224.", "no": "50 × 4 = 200. Now add 6 × 4.", "visual": {"kind": "area", "b": 4, "split": [50, 6], "show": false}}, {"type": "fill", "q": "<b>45 ÷ 7</b> = ____ &nbsp; (use R for the remainder)", "answers": ["6 R 3", "6R3", "6 r 3", "6 remainder 3", "6 rem 3", "6 r3"], "why": "7 × 6 = 42 and 45 − 42 = 3. So 45 ÷ 7 = 6 R 3.", "no": "Find the biggest 7s fact that is not more than 45.", "placeholder": "like 4 R 2"}], "notes": {"do": "She types these herself. Write down any miss: that is the skill to warm up with on Monday.", "listen": "All three right means the review stuck. Tell her so."}}, {"type": "learn", "kick": "Wrap-up", "title": "What is next", "text": "You kept a lot over the break! Next week is something new: <b>long division</b>. You will use your facts, your subtracting and your remainder rule.", "steps": [{"text": "<b>Tonight:</b> the After-class lesson. It ends with Show What You Know. You need 90."}, {"text": "<b>This weekend:</b> the Lesson 12 Practice, the Lesson 12 Packet, a reading lesson, and 15 minutes of reading each day."}, {"text": "<b>Monday on Zoom:</b> Lesson 13, your first long division lesson."}], "tip": "Keep your index card of slow facts. Quiz yourself for one minute a day.", "notes": {"do": "Open the course page and go through the Lesson 12 task list with her (and with Tia if she is there).", "say": "\"You were resilient today. Long division looks big, but it is just your facts, one step at a time.\"", "ask": "\"Which of the four shortcuts do you want to practice most this weekend?\""}}], "win": "You kept your tools sharp over the break. You are ready for long division!", "prev": "bb-bailey-L11", "prevTitle": "Lesson 11"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
