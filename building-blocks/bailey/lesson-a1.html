<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Bonus Lesson: Inside Amazon: From Click to Doorstep</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-A1", "label": "Bonus Lesson", "title": "Inside Amazon: From Click to Doorstep", "goal": "I can explain how an order moves through a fulfillment center and around the world.", "date": "2026-11-08", "mastery": 90, "color": "#C9A84C", "slides": [{"type": "hello", "title": "Inside Amazon: On Your Own", "text": "In class you followed one order through a fulfillment center and out to the world. Now show what you know. It takes about 20 minutes. Keep paper and a pencil next to you.", "visual": {"kind": "emoji", "text": "🏭📦🌍"}}, {"type": "talk", "kick": "Say it", "title": "Teach it to someone", "text": "Find someone at home. Teach them out loud.", "prompts": ["Explain the six steps an order follows.", "Explain why robots make picking more efficient.", "Explain how a package could travel to another country."], "starters": ["First … next … finally …", "Robots make it efficient because …", "The package could …"]}, {"type": "vocab", "kick": "Word Power", "title": "Remember the words", "text": "Say the meaning before you flip the card. Then flip to check.", "words": [{"word": "fulfillment center", "pos": "noun", "emoji": "🏭", "meaning": "A giant building where orders are stored, packed and sent out.", "example": "The <b>fulfillment center</b> is as big as many football fields."}, {"word": "inventory", "pos": "noun", "emoji": "🗄️", "meaning": "All the items a business has ready to sell.", "example": "Computers keep track of every item in the <b>inventory</b>."}, {"word": "logistics", "pos": "noun", "emoji": "🧭", "meaning": "Planning how to move things to the right place at the right time.", "example": "Good <b>logistics</b> gets a package to you in one or two days."}, {"word": "automated", "pos": "adjective", "emoji": "🤖", "meaning": "Done by machines that run by themselves.", "example": "The label machine is <b>automated</b>: no one has to stick labels on by hand."}, {"word": "global", "pos": "adjective", "emoji": "🌍", "meaning": "Having to do with the whole world.", "example": "Amazon is a <b>global</b> company that ships to many countries."}, {"word": "efficient", "pos": "adjective", "emoji": "⚡", "meaning": "Doing a job well without wasting time or energy.", "example": "Robots make picking more <b>efficient</b> because workers walk less."}]}, {"type": "order", "kick": "Put in order", "title": "Follow the order", "text": "Tap the steps in the right order.", "steps": ["📥 Receive: trucks unload boxes of new items into the building.", "🗄️ Stow: workers put items into any open bin on a yellow pod, and the computer remembers exactly where each one is.", "🛒 Pick: a robot drives the pod to a worker, who takes out the ordered item and puts it in a yellow tote.", "📦 Pack: a co planning how things move.", "no": [null, "Robots are machines, not plans.", "Not a box."]}, {"q": "Which is the best estimate for <b>312 × 3</b>?", "choices": ["about 900", "about 90", "about 9,000"], "a": 0, "why": "300 × 3 = 900.", "no": [null, "312 is about 300, and 300 × 3 = 900.", "Too many zeros."]}, {"type": "fill", "q": "<b>312 × 3</b> = ____", "answers": ["936"], "why": "900 + 30 + 6 = 936.", "no": "Three boxes: 300, 10 and 2.", "hint": "900 + 30 + 6"}, {"type": "fill", "q": "<b>21 × 14</b> = ____", "answers": ["294"], "why": "200 + 80 + 10 + 4 = 294.", "no": "Four boxes: 20 and 1 across, 10 and 4 down.", "hint": "200 + 80 + 10 + 4"}, {"q": "Why does Amazon have fulfillment centers in many countries?", "choices": ["so packages travel a shorter distance", "so every building can be empty", "so trucks are not needed"], "a": 0, "why": "Nearby centers mean faster, shorter trips.", "no": [null, "The buildings are full of inventory.", "Trucks still bring the packages home."]}, {"q": "Which word means <b>done by machines that run by themselves</b>?", "choices": ["automated", "global", "inventory"], "a": 0, "why": "<b>Automated</b> means machines do it.", "no": [null, "Global means about the whole world.", "Inventory is the items for sale."]}], [{"q": "Which step comes right after <b>stow</b>?", "choices": ["pick", "ship", "SLAM"], "a": 0, "why": "Receive, stow, <b>pick</b>, pack, SLAM, ship.", "no": [null, "Ship is last.", "SLAM comes after pack."]}, {"q": "What does the SLAM machine do?", "choices": ["scans, labels and checks each package", "drives the pods", "unloads the trucks"], "a": 0, "why": "SLAM = Scan, Label, Apply, Manifest. It weighs the package too.", "no": [null, "Robots drive the pods.", "Workers unload at the receive step."]}, {"q": "What does <b>global</b> mean?", "choices": ["having to do with the whole world", "very small", "made by hand"], "a": 0, "why": "Global = the whole world.", "no": [null, "Not about size.", "That is the opposite of automated."]}, {"q": "Which is the best estimate for <b>189 × 5</b>?", "choices": ["between 500 and 1,000", "between 50 and 100", "between 5,000 and 10,000"], "a": 0, "why": "100 × 5 = 500 and 200 × 5 = 1,000.", "no": [null, "189 is more than 100, so the answer is more than 500.", "Too many zeros."]}, {"type": "fill", "q": "<b>189 × 5</b> = ____", "answers": ["945"], "why": "500 + 400 + 45 = 945.", "no": "Three boxes: 100, 80 and 9.", "hint": "500 + 400 + 45"}, {"type": "fill", "q": "<b>32 × 13</b> = ____", "answers": ["416"], "why": "300 + 90 + 20 + 6 = 416.", "no": "Four boxes: 30 and 2 across, 10 and 3 down.", "hint": "300 + 90 + 20 + 6"}, {"q": "A family in Florida orders shoes. Where will they most likely come from?", "choices": ["a fulfillment center in the United States", "a center on another continent", "the store's website"], "a": 0, "why": "Most orders ship from a nearby fulfillment center.", "no": [null, "That would be a much longer trip.", "A website cannot ship shoes."]}, {"q": "Which word means <b>doing a job without wasting time or energy</b>?", "choices": ["efficient", "logistics", "fulfillment center"], "a": 0, "why": "<b>Efficient</b> means no wasted time or energy.", "no": [null, "Logistics is planning how things move.", "That is the building."]}]]}], "win": "You are an Amazon expert now. Have an amazing trip!", "prev": null, "prevTitle": ""});</script><script type="module" src="../../kce-progress/kce-progress.js" data-course="bb-bailey"></script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(va
