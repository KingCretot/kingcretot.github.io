<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 14: Bigger Numbers, Same Four Steps</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L14", "label": "Lesson 14", "title": "Bigger Numbers, Same Four Steps", "goal": "I can use long division to divide a 3-digit number by a 1-digit number, even when the quotient needs a zero.", "date": "2026-12-08", "mastery": 90, "color": "#E84393", "slides": [{"type": "hello", "title": "Bigger Numbers, Same Four Steps", "text": "Yesterday you did long division with 2-digit numbers. Today the numbers have <b>3 digits</b>. Good news: the steps are exactly the same. You just do them one more time.", "visual": {"kind": "emoji", "text": "➗💯🐉"}, "notes": {"do": "Set out: base-ten blocks (about 6 flats, 15 rods and 20 units) or play money ($100, $10 and $1 bills), 8 paper plates, whiteboard and marker, paper and pencil, her book. Write Divide · Multiply · Subtract · Bring down on the whiteboard.", "say": "\"You already know every step. Today we just walk a longer road. One step at a time, and I will cheer for every single one.\"", "ask": "\"How did Show What You Know go last night? Which step felt the trickiest?\""}}, {"type": "talk", "kick": "Book Talk", "title": "Back to Berk", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["Tell what happened in the part you read since Monday.", "Find a moment that shows how Hiccup and Toothless get along. Is it getting better or worse? Prove it.", "If you were a Viking on Berk, what would you need to be <b>vigilant</b> about?"], "starters": ["Since Monday, …", "Hiccup and Toothless … I know because …", "I would need to be vigilant about … because …"], "notes": {"do": "6 minutes. She holds the book and finds the page.", "ask": "\"Is their relationship getting better or worse? What is your proof?\"", "listen": "A claim (better or worse) plus an event from the book as proof. If she just retells, ask: \"So, better or worse?\""}}, {"type": "recall", "kick": "Warm-up", "title": "Yesterday's long division", "text": "Solve on paper. Say each step as you write it.", "items": [{"type": "fill", "q": "Use long division: <b>90 ÷ 2</b> = ____", "answers": ["45"], "why": "90 ÷ 2 = 45. Check: 45 × 2 = 90.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 2s fit in 9?", "visual": {"kind": "longdiv", "text": "\n   ___\n2 ) 90"}}, {"type": "fill", "q": "Use long division: <b>70 ÷ 2</b> = ____", "answers": ["35"], "why": "70 ÷ 2 = 35. Check: 35 × 2 = 70.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 2s fit in 7?", "visual": {"kind": "longdiv", "text": "\n   ___\n2 ) 70"}}], "notes": {"do": "She types the answers herself. Watch her paper, not the screen.", "say": "Praise each step you see her do: \"Divide, yes. Multiply, yes.\"", "listen": "Confident steps in order. If she skips bring down, fix it now before 3-digit numbers."}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read it out loud. Then use it in your own sentence.", "words": [{"word": "placeholder", "pos": "noun", "emoji": "0️⃣", "meaning": "A zero that holds a place so the other digits stay in the right places.", "example": "In 103, the 0 is a <b>placeholder</b> in the tens place."}, {"word": "align", "pos": "verb", "emoji": "📏", "meaning": "To line things up in a straight row or column.", "example": "<b>Align</b> each digit of the quotient above its place in the dividend."}, {"word": "insufficient", "pos": "adjective", "emoji": "🪫", "meaning": "Not enough.", "example": "1 hundred is <b>insufficient</b> to give each of 8 plates a hundred."}, {"word": "omit", "pos": "verb", "emoji": "✂️", "meaning": "To leave something out.", "example": "If you <b>omit</b> the zero, 103 turns into 13."}, {"word": "accurate", "pos": "adjective", "emoji": "✅", "meaning": "Correct, with no mistakes.", "example": "Multiply to check that your quotient is <b>accurate</b>."}, {"word": "vigilant", "pos": "adjective", "emoji": "👀", "meaning": "Watching carefully for problems or danger.", "example": "A <b>vigilant</b> Viking lookout watches the sea all night."}, {"word": "vast", "pos": "adjective", "emoji": "🏔️", "meaning": "Very, very large.", "example": "Hiccup's father is called Stoick the <b>Vast</b>, a name that tells you he is huge."}], "notes": {"do": "She reads each card and makes her own sentence. Write <b>placeholder</b> on the whiteboard; you will point to it all lesson.", "say": "\"Placeholder, align and insufficient are about today's long division. Omit is the mistake we will catch. Vigilant is how you catch it.\"", "ask": "\"Why is Stoick called the Vast?\" \"What happens to 103 if you omit the zero?\" (It becomes 13.)", "listen": "For <i>placeholder</i>: the zero holds a place so the other digits stay put."}}, {"type": "learn", "kick": "Learn", "title": "Hundreds first", "text": "With 3 digits, start with the <b>hundreds</b>. Estimate first: multiply the divisor by 100, 200…", "visual": {"kind": "placevalue", "n": 536}, "steps": [{"text": "<b>536 ÷ 4.</b> 536 is 5 hundreds, 3 tens and 6 ones."}, {"text": "<b>Estimate.</b> 4 × 100 = 400 and 4 × 200 = 800. 536 is between them, so the answer is <b>between 100 and 200</b>."}, {"text": "<b>Hands-on.</b> Share 5 hundreds on 4 plates: 1 hundred each, 1 hundred left. Trade it for 10 tens."}], "tip": "The answer to 536 ÷ 4 has 3 digits because 4 fits into the 5 hundreds.", "notes": {"do": "Hands-on: 5 flats, 3 rods, 6 units. She shares the flats onto 4 plates and trades the extra flat for 10 rods (now 13 rods).", "ask": "\"How many hundreds can each plate get?\" (1.) \"What do we do with the one left over?\" (Trade it for 10 tens.)", "listen": "\"Hundreds first.\" She sees the leftover hundred becomes tens, just like the leftover tens became ones yesterday."}}, {"type": "learn", "kick": "Watch it", "title": "536 ÷ 4: the hundreds", "text": "One step at a time.", "visual": {"kind": "longdiv", "text": "\n   ____\n4 ) 536"}, "steps": [{"text": "<b>Divide.</b> How many 4s fit in 5? <b>1</b> (4 × 1 = 4; 4 × 2 = 8 is too big). Write 1 above the 5 in the hundreds place.", "visual": {"kind": "longdiv", "text": "    1\n   ____\n4 ) 536"}}, {"text": "<b>Multiply.</b> 1 × 4 = 4. Write 4 under the 5.", "visual": {"kind": "longdiv", "text": "    1\n   ____\n4 ) 536\n   -4\n   --"}}, {"text": "<b>Subtract.</b> 5 − 4 = 1. Check: 1 is smaller than 4.", "visual": {"kind": "longdiv", "text": "    1\n   ____\n4 ) 536\n   -4\n   --\n    1"}}], "notes": {"do": "She says each step and number before you click. She copies each step on her paper.", "say": "Praise each correct step: \"Divide, 1. Yes!\" \"Multiply, 4. Yes!\" \"1 left, smaller than 4. Perfect.\"", "ask": "\"Why does the 1 go above the 5?\" (It is 1 hundred.)"}}, {"type": "learn", "kick": "Watch it", "title": "536 ÷ 4: the tens", "text": "Bring down, then the same steps.", "steps": [{"text": "<b>Bring down.</b> Bring down the 3 from the tens place. Now you have <b>13</b>.", "visual": {"kind": "longdiv", "text": "    1\n   ____\n4 ) 536\n   -4\n   --\n    13"}}, {"text": "<b>Divide.</b> How many 4s fit in 13? <b>3</b> (4 × 3 = 12; 4 × 4 = 16 is too big). Write 3 above the 3 in the tens place.", "visual": {"kind": "longdiv", "text": "    13\n   ____\n4 ) 536\n   -4\n   --\n    13"}}, {"text": "<b>Multiply.</b> 3 × 4 = 12. Write 12 under the 13.", "visual": {"kind": "longdiv", "text": "    13\n   ____\n4 ) 536\n   -4\n   --\n    13\n   -12\n   ---"}}, {"text": "<b>Subtract.</b> 13 − 12 = 1. Check: 1 is smaller than 4.", "visual": {"kind": "longdiv", "text": "    13\n   ____\n4 ) 536\n   -4\n   --\n    13\n   -12\n   ---\n     1"}}], "notes": {"do": "Hands-on: 13 rods onto 4 plates: 3 each, 1 rod left. Trade it for 10 units.", "say": "Praise every step out loud.", "ask": "\"What does the 13 stand for?\" (13 tens: the 1 hundred we traded plus the 3 tens.)"}}, {"type": "learn", "kick": "Watch it", "title": "536 ÷ 4: the ones", "text": "One more round.", "steps": [{"text": "<b>Bring down.</b> Bring down the 6 from the ones place. Now you have <b>16</b>.", "visual": {"kind": "longdiv", "text": "    13\n   ____\n4 ) 536\n   -4\n   --\n    13\n   -12\n   ---\n     16"}}, {"text": "<b>Divide.</b> How many 4s fit in 16? <b>4</b> (4 × 4 = 16). Write 4 above the 6 in the ones place.", "visual": {"kind": "longdiv", "text": "    134\n   ____\n4 ) 536\n   -4\n   --\n    13\n   -12\n   ---\n     16"}}, {"text": "<b>Multiply.</b> 4 × 4 = 16. Write 16 under the 16.", "visual": {"kind": "longdiv", "text": "    134\n   ____\n4 ) 536\n   -4\n   --\n    13\n   -12\n   ---\n     16\n    -16\n    ---"}}, {"text": "<b>Subtract.</b> 16 − 16 = 0. Check: 0 is smaller than 4. There are no more digits to bring down, so <b>536 ÷ 4 = 134</b>.", "visual": {"kind": "longdiv", "text": "    134\n   ____\n4 ) 536\n   -4\n   --\n    13\n   -12\n   ---\n     16\n    -16\n    ---\n      0"}}, {"text": "<b>Check:</b> 134 × 4 = 400 + 120 + 16 = 536. Accurate!"}], "tip": "134 is between 100 and 200, just like the estimate.", "notes": {"do": "Hands-on: 16 units onto 4 plates: 4 each. Each plate: 1 flat, 3 rods, 4 units = 134.", "say": "\"You just did a 3-digit long division. Look at your plates: 134 each. The blocks and the numbers agree.\"", "listen": "She can say why the check works: quotient × divisor = dividend."}}, {"type": "tap", "kick": "Guided practice", "title": "Your turn on paper", "text": "Solve on paper. Say each step out loud. Then type the quotient.", "items": [{"type": "fill", "q": "Use long division: <b>852 ÷ 6</b> = ____", "answers": ["142"], "why": "852 ÷ 6 = 142. Check: 142 × 6 = 852.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 6s fit in 8?", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 852"}}, {"type": "fill", "q": "Use long division: <b>735 ÷ 5</b> = ____", "answers": ["147"], "why": "735 ÷ 5 = 147. Check: 147 × 5 = 735.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 5s fit in 7?", "visual": {"kind": "longdiv", "text": "\n   ____\n5 ) 735"}}], "notes": {"do": "She leads; you only ask \"Which step is next?\" if she stops.", "say": "Praise each step she gets right, out loud, as she does it.", "listen": "852 ÷ 6: 1, then 25 ÷ 6 = 4 R 1, then 12 ÷ 6 = 2 → 142. 735 ÷ 5: 1, then 23 ÷ 5 = 4 R 3, then 35 ÷ 5 = 7 → 147."}}, {"type": "learn", "kick": "Watch it", "title": "618 ÷ 6: the hundreds", "text": "Watch closely. Something new happens in the tens place.", "visual": {"kind": "longdiv", "text": "\n   ____\n6 ) 618"}, "steps": [{"text": "<b>Divide.</b> How many 6s fit in 6? <b>1</b> (6 × 1 = 6). Write 1 above the 6 in the hundreds place.", "visual": {"kind": "longdiv", "text": "    1\n   ____\n6 ) 618"}}, {"text": "<b>Multiply.</b> 1 × 6 = 6. Write 6 under the 6.", "visual": {"kind": "longdiv", "text": "    1\n   ____\n6 ) 618\n   -6\n   --"}}, {"text": "<b>Subtract.</b> 6 − 6 = 0. Check: 0 is smaller than 6.", "visual": {"kind": "longdiv", "text": "    1\n   ____\n6 ) 618\n   -6\n   --\n    0"}}], "notes": {"do": "Hands-on: 6 flats, 1 rod, 8 units. 6 flats onto 6 plates: 1 each, none left.", "say": "Praise each step.", "ask": "\"Estimate: is the answer about 10, about 100 or about 1,000?\" (About 100: 6 × 100 = 600.)"}}, {"type": "learn", "kick": "Watch it", "title": "618 ÷ 6: the tens", "text": "Only 1 ten. Can 6 plates each get a ten?", "steps": [{"text": "<b>Bring down.</b> Bring down the 1 from the tens place. The 0 and the 1 make 01, which is just <b>1</b>.", "visual": {"kind": "longdiv", "text": "    1\n   ____\n6 ) 618\n   -6\n   --\n    01"}}, {"text": "<b>Divide.</b> How many 6s fit in 1? <b>0</b>. Write 0 above the 1 in the tens place. Never skip the zero!", "visual": {"kind": "longdiv", "text": "    10\n   ____\n6 ) 618\n   -6\n   --\n    01"}}, {"text": "<b>Multiply.</b> 0 × 6 = 0. Write 0 under the 1.", "visual": {"kind": "longdiv", "text": "    10\n   ____\n6 ) 618\n   -6\n   --\n    01\n    -0\n    --"}}, {"text": "<b>Subtract.</b> 1 − 0 = 1. Check: 1 is smaller than 6.", "visual": {"kind": "longdiv", "text": "    10\n   ____\n6 ) 618\n   -6\n   --\n    01\n    -0\n    --\n     1"}}], "tip": "1 ten is insufficient for 6 plates, so each plate gets 0 tens. Write the 0!", "notes": {"do": "Hands-on: she tries to share 1 rod onto 6 plates. She can't. Each plate gets 0 tens. She trades the rod for 10 units (18 units now).", "say": "\"This is the step people skip. You did not skip it. Great job!\"", "ask": "\"How many tens does each plate get?\" (0.) \"So what do we write above the 1?\" (0.)", "listen": "\"6 doesn't fit in 1, so I write 0.\" Point to the word <b>placeholder</b> on the whiteboard."}}, {"type": "learn", "kick": "Watch it", "title": "618 ÷ 6: the ones", "text": "Bring down the 8. The 1 ten and 8 ones make 18.", "steps": [{"text": "<b>Bring down.</b> Bring down the 8 from the ones place. Now you have <b>18</b>.", "visual": {"kind": "longdiv", "text": "    10\n   ____\n6 ) 618\n   -6\n   --\n    01\n    -0\n    --\n     18"}}, {"text": "<b>Divide.</b> How many 6s fit in 18? <b>3</b> (6 × 3 = 18). Write 3 above the 8 in the ones place.", "visual": {"kind": "longdiv", "text": "    103\n   ____\n6 ) 618\n   -6\n   --\n    01\n    -0\n    --\n     18"}}, {"text": "<b>Multiply.</b> 3 × 6 = 18. Write 18 under the 18.", "visual": {"kind": "longdiv", "text": "    103\n   ____\n6 ) 618\n   -6\n   --\n    01\n    -0\n    --\n     18\n    -18\n    ---"}}, {"text": "<b>Subtract.</b> 18 − 18 = 0. Check: 0 is smaller than 6. There are no more digits to bring down, so <b>618 ÷ 6 = 103</b>.", "visual": {"kind": "longdiv", "text": "    103\n   ____\n6 ) 618\n   -6\n   --\n    01\n    -0\n    --\n     18\n    -18\n    ---\n      0"}}, {"text": "<b>Check:</b> 103 × 6 = 600 + 18 = 618. The 0 kept the 1 in the hundreds place."}], "notes": {"do": "Hands-on: 18 units onto 6 plates: 3 each. Each plate: 1 flat, 0 rods, 3 units = 103.", "ask": "\"What would happen if you omitted the 0?\" (You would get 13, and 13 × 6 = 78, not 618.)", "listen": "She can explain the 0 is a placeholder: without it, the 1 slides into the tens place."}}, {"type": "tap", "kick": "Guided practice", "title": "Do not omit the zero", "items": [{"type": "fill", "q": "Use long division: <b>432 ÷ 4</b> = ____", "answers": ["108"], "why": "432 ÷ 4 = 108. Check: 108 × 4 = 432.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 4s fit in 4?", "visual": {"kind": "longdiv", "text": "\n   ____\n4 ) 432"}}, {"q": "Snotlout found <b>824 ÷ 8</b> and got <b>13</b>. Check: 13 × 8 = 104, not 824. What went wrong?", "choices": ["He skipped the 0 in the tens place. The answer is 103.", "He forgot to bring down the 4.", "He should have added instead.", "Nothing. 13 is right."], "a": 0, "why": "8 does not fit in 2 in the tens place, so the 0 is a placeholder: 824 ÷ 8 = 103. Check: 103 × 8 = 824.", "no": [null, "He did bring down all the digits. The problem is the tens place: 8 does not fit in 2, so a 0 goes there.", "Division is the right operation.", "Check: 13 × 8 = 104, not 824."]}], "notes": {"do": "She does 432 ÷ 4 on paper. Watch the tens step: 3 ÷ 4.", "say": "When she writes the 0: \"Yes! You were vigilant.\"", "ask": "On Snotlout's item: \"How could the estimate have warned him?\" (824 ÷ 8 is about 100, not 13.)", "listen": "\"4 doesn't fit in 3, so 0.\" Then 32 ÷ 4 = 8 → 108."}}, {"type": "learn", "kick": "Watch it", "title": "184 ÷ 8: start with two digits", "text": "8 does not fit in 1. What now?", "visual": {"kind": "longdiv", "text": "\n   ____\n8 ) 184"}, "steps": [{"text": "8 does not go into 1, so use the first two digits: <b>18</b>. <b>Divide.</b> How many 8s fit in 18? <b>2</b> (8 × 2 = 16; 8 × 3 = 24 is too big). Write 2 above the 8 in the tens place.", "visual": {"kind": "longdiv", "text": "     2\n   ____\n8 ) 184"}}, {"text": "<b>Multiply.</b> 2 × 8 = 16. Write 16 under the 18.", "visual": {"kind": "longdiv", "text": "     2\n   ____\n8 ) 184\n   -16\n   ---"}}, {"text": "<b>Subtract.</b> 18 − 16 = 2. Check: 2 is smaller than 8.", "visual": {"kind": "longdiv", "text": "     2\n   ____\n8 ) 184\n   -16\n   ---\n     2"}}], "tip": "1 hundred is insufficient for 8 plates. So nothing goes above the 1. Start above the 8.", "notes": {"do": "Hands-on: 1 flat, 8 rods, 4 units. 1 flat cannot go onto 8 plates. Trade it for 10 rods: 18 rods. Now share 18 rods: 2 each, 2 left.", "say": "Praise each step. \"You looked first, before you divided. That is a smart, vigilant mathematician.\"", "ask": "\"How many digits will the answer have?\" (2, because 8 does not fit in 1.)"}}, {"type": "learn", "kick": "Watch it", "title": "184 ÷ 8: the ones", "text": "Bring down and finish.", "steps": [{"text": "<b>Bring down.</b> Bring down the 4 from the ones place. Now you have <b>24</b>.", "visual": {"kind": "longdiv", "text": "     2\n   ____\n8 ) 184\n   -16\n   ---\n     24"}}, {"text": "<b>Divide.</b> How many 8s fit in 24? <b>3</b> (8 × 3 = 24). Write 3 above the 4 in the ones place.", "visual": {"kind": "longdiv", "text": "     23\n   ____\n8 ) 184\n   -16\n   ---\n     24"}}, {"text": "<b>Multiply.</b> 3 × 8 = 24. Write 24 under the 24.", "visual": {"kind": "longdiv", "text": "     23\n   ____\n8 ) 184\n   -16\n   ---\n     24\n    -24\n    ---"}}, {"text": "<b>Subtract.</b> 24 − 24 = 0. Check: 0 is smaller than 8. There are no more digits to bring down, so <b>184 ÷ 8 = 23</b>.", "visual": {"kind": "longdiv", "text": "     23\n   ____\n8 ) 184\n   -16\n   ---\n     24\n    -24\n    ---\n      0"}}, {"text": "<b>Check:</b> 23 × 8 = 160 + 24 = 184. The quotient has only 2 digits, and that is correct."}], "notes": {"do": "Hands-on: 2 rods traded for 20 units, plus 4 = 24 units onto 8 plates: 3 each. Each plate: 2 rods, 3 units = 23.", "ask": "\"Estimate: 8 × 20 = 160, 8 × 30 = 240. Is 23 between 20 and 30?\" (Yes.)"}}, {"type": "sort", "kick": "Sort it", "title": "2 digits or 3 digits?", "text": "Look at the first digit. Does the divisor fit? Tap a problem, then tap the box.", "buckets": ["2️⃣ The quotient has 2 digits", "3️⃣ The quotient has 3 digits"], "items": [{"text": "384 ÷ 4", "b": 0, "why": "4 does not fit in 3, so the quotient starts in the tens place: 384 ÷ 4 = 96, 2 digits.", "hint": "Does 4 fit in 3?"}, {"text": "512 ÷ 4", "b": 1, "why": "4 fits in 5 (the hundreds), so the quotient starts in the hundreds place: 512 ÷ 4 = 128, 3 digits.", "hint": "Does 4 fit in 5?"}, {"text": "245 ÷ 7", "b": 0, "why": "7 does not fit in 2, so the quotient starts in the tens place: 245 ÷ 7 = 35, 2 digits.", "hint": "Does 7 fit in 2?"}, {"text": "714 ÷ 7", "b": 1, "why": "7 fits in 7 (the hundreds), so the quotient starts in the hundreds place: 714 ÷ 7 = 102, 3 digits.", "hint": "Does 7 fit in 7?"}, {"text": "168 ÷ 2", "b": 0, "why": "2 does not fit in 1, so the quotient starts in the tens place: 168 ÷ 2 = 84, 2 digits.", "hint": "Does 2 fit in 1?"}, {"text": "936 ÷ 9", "b": 1, "why": "9 fits in 9 (the hundreds), so the quotient starts in the hundreds place: 936 ÷ 9 = 104, 3 digits.", "hint": "Does 9 fit in 9?"}], "done": "Divisor fits in the first digit: 3 digits. Does not fit: 2 digits.", "notes": {"do": "She taps each one on your screen and says why before she taps the box.", "say": "Praise each one: \"Yes, 4 does not fit in 3, so 2 digits.\"", "listen": "\"Does it fit in the first digit?\" is the question she asks every time."}}, {"type": "tap", "kick": "Guided practice", "title": "Mixed: you lead", "text": "Solve on paper. Watch for a zero and for a first digit that is too small.", "items": [{"type": "fill", "q": "Use long division: <b>756 ÷ 7</b> = ____", "answers": ["108"], "why": "756 ÷ 7 = 108. Check: 108 × 7 = 756.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "Start with the first digit: how many 7s fit in 7?", "visual": {"kind": "longdiv", "text": "\n   ____\n7 ) 756"}}, {"type": "fill", "q": "Use long division: <b>252 ÷ 7</b> = ____", "answers": ["36"], "why": "252 ÷ 7 = 36. Check: 36 × 7 = 252.", "no": "Go one step at a time: divide, multiply, subtract, bring down.", "hint": "7 does not fit in 2, so start with 25: how many 7s fit in 25?", "visual": {"kind": "longdiv", "text": "\n   ____\n7 ) 252"}}], "notes": {"do": "She leads both. You praise each correct step.", "listen": "756 ÷ 7: 1, then 7 does not fit in 5, so 0 (placeholder), then 56 ÷ 7 = 8 → 108. 252 ÷ 7: 7 does not fit in 2, so 25 ÷ 7 = 3 R 4, then 42 ÷ 7 = 6 → 36."}}, {"type": "tap", "kick": "Word work", "title": "Words in action", "items": [{"q": "In <b>107</b>, what job does the 0 do?", "choices":
