<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bailey · Lesson 5: Catch-up: Finish Week 2</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L05", "label": "Catch-up", "title": "Catch-up: Finish Week 2", "goal": "I can pick the fastest shortcut for any 6, 7, 8 or 9 fact and finish my Week 2 work.", "date": "2026-11-02", "mastery": 90, "color": "#10AC84", "slides": [{"type": "hello", "title": "Catch-up: Finish Week 2", "text": "No new lesson today. We go back over your <b>four tools</b> for the 6s, 7s, 8s and 9s until you can pick the fastest one every time.", "visual": {"kind": "emoji", "text": "🧰 ⚡ 💪"}, "notes": {"do": "Zoom with screen share (this Class lesson, teacher code). Ask her to hold up any Lesson 3, 4 and 5 packet pages she finished. Note what is missing.", "say": "Today is a catch-up day. No new skill. We make the four tools fast, because the area model on Tuesday runs on them.", "ask": "What did you finish last week? Show me your packets.", "listen": "Which packet pages are done. Lesson 5 after-class lesson not started yet (no score came in)."}}, {"type": "talk", "kick": "Book Talk", "title": "Which plan worked better?", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What happened in the part you read since our last lesson?", "Think of two different plans or ways characters tried to solve a problem. Which one worked better? Why?", "Hiccup does not have big muscles. What does he have instead that helps him most? Give a reason from the book."], "starters": ["Since our last lesson, …", "The better plan was … because …", "Hiccup's best tool is … For example, …"], "notes": {"do": "4–5 minutes. She retells what happened in the part she read since Thursday, then evaluates two plans the characters tried.", "ask": "\"Think of two different plans characters tried. Which worked better? Why?\"", "listen": "A clear choice with a reason from the book."}}, {"type": "recall", "kick": "Remember?", "title": "Doubles and break-aparts", "items": [{"q": "What is <b>7 × 7</b>? Break the 7 into 5 + 2.", "choices": ["42", "45", "56", "49"], "a": 3, "why": "(5 × 7) + (2 × 7) = 35 + 14 = <b>49</b>.", "no": ["42 is 6 × 7. The bottom part is <b>2</b> sevens, so add 14, not 7.", "45 is 5 × 9. Use 35 + 14.", "56 is 8 × 7. That is one seven too many.", null]}, {"q": "Bailey knows 8 groups of 6 is 48. She takes <b>half of the groups</b>. Which fact does she get?", "choices": ["4 × 6 = 24", "4 × 3 = 12", "6 × 6 = 36"], "a": 0, "why": "Half of 8 groups is 4 groups of 6: <b>4 × 6 = 24</b>, which is half of 48.", "no": [null, "Only the number of groups was halved. Each group still has 6.", "Half of 8 groups is 4 groups, not 6. And half of 48 is 24, not 36."]}, {"q": "Which word means <b>to break a number into smaller parts</b>?", "choices": ["reassemble", "decompose", "fragment"], "a": 1, "why": "To <b>decompose</b> 7 is to break it into 5 + 2.", "no": ["Reassemble is the opposite: putting the parts back together.", null, "A fragment is a broken piece, but the action word for breaking a number apart is decompose."]}], "notes": {"do": "She says the tool out loud before each tap.", "ask": "\"Why is 42 wrong for 7 × 7?\"", "listen": "\"42 is 6 × 7. The bottom part is 2 sevens, 14, so 35 + 14 = 49.\""}}, {"type": "learn", "kick": "Learn", "title": "Your toolbox", "text": "Look at the factors first. Find the hard one (6, 7, 8 or 9). Then pick its tool.", "visual": {"kind": "passage", "text": "🔟 <b>×9</b>: ×10, then take away one group. &nbsp;9 × 4 → 40 − 4 = 36<br>🖐️ <b>×6</b>: ×5, then add one group. &nbsp;6 × 3 → 15 + 3 = 18<br>✌️ <b>×8</b>: double, double, double. &nbsp;8 × 5 → 10, 20, 40<br>🧩 <b>×7</b>: ×5 plus ×2. &nbsp;7 × 3 → 15 + 6 = 21"}, "tip": "If a fact has <b>two</b> hard factors, like 7 × 9, pick the tool with the <b>fewest steps</b>. A 9 is usually fastest: just one subtraction.", "notes": {"do": "Point to each tool on screen. Then read 6–9 facts aloud; she names the tool first, then the answer.", "say": "\"Look at the factors first. Find the hard one. Then pick its tool.\"", "listen": "×9: ×10 take away one group. ×6: ×5 plus one group. ×8: double three times. ×7: ×5 plus ×2."}}, {"type": "tap", "kick": "Quick-fire", "title": "Tool, then answer", "text": "Say the tool out loud. Then type the product.", "items": [{"type": "fill", "q": "9 × 6 = ____", "answers": ["54"], "why": "×10 take away one group: 60 − 6 = 54. 9 × 6 = 54.", "no": "Use the 9: ten 6s is 60. Now take away one 6."}, {"type": "fill", "q": "7 × 7 = ____", "answers": ["49"], "why": "Break it apart: 35 + 14 = 49. 7 × 7 = 49.", "no": "Break one 7 into 5 + 2: five 7s plus two 7s."}, {"type": "fill", "q": "8 × 4 = ____", "answers": ["32"], "why": "Three doubles of 4: 8, 16, 32. 8 × 4 = 32.", "no": "The 8 means three doubles. Start with 4."}, {"type": "fill", "q": "6 × 6 = ____", "answers": ["36"], "why": "×5 plus one group: 30 + 6 = 36. 6 × 6 = 36.", "no": "Use the 6: five 6s plus one more 6."}], "notes": {"do": "She says the tool out loud, then the product; you type it. Time it for fun: all four in under a minute?", "ask": "\"Which one took you the longest? Which tool would make it faster?\"", "listen": "Tool named before every answer."}}, {"type": "tap", "kick": "Evaluate", "title": "Pick the fastest path", "text": "All of these facts have more than one road. Evaluate each path and pick the best one.", "items": [{"q": "Which is the best path for <b>8 × 6</b>?", "choices": ["6 + 6 + 6 + 6 + 6 + 6 + 6 + 6", "6 → 12 → 24 → 48", "60 − 6 = 54"], "a": 1, "why": "Three doubles: 6 → 12 → 24 → <b>48</b>. Three steps, and you can check each one.", "no": ["That adds to 48, but it takes seven steps. That is where counting goes wrong.", null, "60 − 6 is the ×9 tool. It finds 9 × 6, not 8 × 6."]}, {"q": "<b>7 × 9</b> has a 7 <b>and</b> a 9. Which path is fastest?", "choices": ["(5 × 9) + (2 × 9) = 45 + 18", "7, 14, 21, 28, 35, 42, 49, 56, 63", "70 − 7 = 63"], "a": 2, "why": "Use the 9: seven tens is 70, take away one 7. One step: <b>63</b>.", "no": ["This works too and gives 63! But it needs two facts and a harder add. 70 − 7 is one step.", "Skip counting nine times works, but it is the slowest road and easy to lose your place.", null]}, {"q": "Which is the best path for <b>6 × 7</b>?", "choices": ["35 + 7 = 42", "36 + 7 = 43", "6 + 7 = 13"], "a": 0, "why": "Use the 6: five 7s is 35, plus one more 7 is <b>42</b>.", "no": [null, "36 is 6 × 6, not 5 × 7. Start with five 7s: 35.", "6 + 7 adds the factors. You need 6 groups of 7."]}], "notes": {"do": "Before she taps, she evaluates each path out loud: Does it work? How many steps?", "ask": "\"Path A for 7 × 9 also gives 63. So why isn't it the best?\"", "listen": "\"It works, but it needs two facts and a hard add. 70 − 7 is one step.\""}}, {"type": "learn", "kick": "Preview", "title": "Fact families", "text": "Three numbers can make <b>four facts</b>. That group is called a <b>fact family</b>. Division undoes multiplication.", "visual": {"kind": "triangle", "a": 7, "b": 8, "c": 56}, "steps": [{"text": "<b>7 × 8 = 56</b>"}, {"text": "<b>8 × 7 = 56</b> (the commutative property: switch the factors)"}, {"text": "<b>56 ÷ 8 = 7</b> (56 shared into 8 equal groups gives 7 in each)"}, {"text": "<b>56 ÷ 7 = 8</b> (56 shared into 7 equal groups gives 8 in each)"}], "tip": "Every multiplication fact you know is also a division fact you know. In two weeks you will use this a lot.", "notes": {"do": "Click through the steps. Point to the triangle: 7, 8 and 56. Keep it a preview: division is Week 4.", "say": "\"Three numbers, four facts. Division undoes multiplication.\"", "ask": "\"If 7 × 8 = 56, what is 56 ÷ 8?\"", "listen": "\"7.\""}}, {"type": "tap", "kick": "Try it", "title": "Families and missing numbers", "items": [{"q": "Which fact belongs to the <b>6, 9, 54</b> fact family?", "choices": ["54 ÷ 6 = 8", "9 + 6 = 15", "54 ÷ 9 = 6", "54 − 9 = 45"], "a": 2, "why": "54 ÷ 9 = 6 uses the same three numbers, and 9 × 6 = 54 proves it.", "no": ["54 ÷ 6 is 9, not 8. Check: 6 × 9 = 54.", "Fact families here are multiplication and division, not addition.", null, "That is true math, but subtraction is not part of this fact family, and 45 is not one of the three numbers."]}, {"q": "<b>7 × ? = 42</b>. What is the missing factor?", "choices": ["5", "6", "7", "8"], "a": 1, "why": "7 × 6 = 30 + 12 = 42. So the missing factor is <b>6</b>. (And 42 ÷ 7 = 6.)", "no": ["7 × 5 = 35. You need one more 7.", null, "7 × 7 = 49. That is too many.", "7 × 8 = 56. That is too many."]}, {"q": "Bailey knows 8 × 9 = 72. What does the <b>commutative</b> property give her for free?", "choices": ["72 ÷ 8 = 9", "9 × 8 = 72", "8 + 9 = 17"], "a": 1, "why": "Commutative means switch the order of the factors: <b>9 × 8 = 72</b>.", "no": ["That is in the same fact family, but it is division. Commutative means switching the factors.", null, "That adds. The commutative property here switches the factors in a multiplication."]}], "notes": {"do": "She uses the triangle on the slide to check each answer.", "ask": "\"Why isn't 54 − 9 = 45 in the family?\"", "listen": "\"45 isn't one of the three numbers, and the family is × and ÷.\""}}, {"type": "order", "kick": "Put it in order", "title": "Solve like a pro", "text": "Stoick sends <b>6 ships</b>. Each ship carries <b>9 sheep</b>. How many sheep? Tap the steps in order.", "steps": ["Read it and find the equal groups: 6 ships, 9 sheep each", "Write the fact: 6 × 9", "Pick the tool: it has a 9, so ×10 and take away one group", "Solve: 60 − 6 = 54", "Check with another tool, then label: 45 + 9 = 54 ✔, so 54 sheep"], "why": "Read, write the fact, pick the tool, solve, check, label. Two tools gave the same answer, so you know it is right.", "hint": "What do you do before you can write a fact? You have to read and find the groups.", "notes": {"do": "She taps each step and says it out loud.", "ask": "\"Why check with a second tool?\"", "listen": "\"If two tools give the same answer, I know it's right.\""}}, {"type": "tap", "kick": "Try it", "title": "Problems from Berk", "items": [{"q": "Fishlegs collects <b>6 dragon scales</b> a day for <b>7 days</b>. How many scales?", "choices": ["13", "48", "42", "36"], "a": 2, "why": "6 groups of 7: 35 + 7 = <b>42</b>. (Or 7 groups of 6: 30 + 12 = 42.)", "no": ["13 is 6 + 7. He collects 6 each day, so these are equal groups.", "48 is 6 × 8. There are 7 days.", null, "36 is 6 × 6. Count the days again: 7."]}, {"q": "Toothless ate <b>8 crabs</b>. A gargantuan sea dragon ate <b>7 times as many</b>. How many crabs did the sea dragon eat?", "choices": ["15", "56", "64", "49"], "a": 1, "why": "7 times as many as 8 is 7 × 8 = <b>56</b>.", "no": ["15 is 8 + 7. \"Times as many\" means multiply.", null, "64 is 8 × 8. The dragon ate 7 times as many.", "49 is 7 × 7. Toothless ate 8 crabs, not 7."]}, {"q": "Hiccup has <b>9 fish</b>. Fishlegs has <b>8 fish</b>. How many fish do they have in all?", "choices": ["72", "1", "81", "17"], "a": 3, "why": "These are not equal groups. It is two amounts put together, so add: 9 + 8 = <b>17</b>.", "no": ["72 is 9 × 8. Nobody has 9 groups of 8. Read again: two boys, two amounts.", "1 is 9 − 8. That tells how many more Hiccup has, not how many in all.", "81 is 9 × 9. There are no equal groups here.", null]}], "notes": {"do": "She reads each problem aloud and says \"equal groups or not?\" before she taps.", "ask": "On the 9 + 8 fish problem: \"Are there equal groups?\"", "listen": "\"No, it's two different amounts put together, so add.\""}}, {"type": "tap", "kick": "Choose the operation", "title": "Add or multiply?", "text": "Ask: equal groups or not? Then type the <b>operation</b>.", "items": [{"type": "fill", "q": "The Berk blacksmith has 6 racks with 9 helmets on each rack. Which operation finds how many helmets? Type <b>add</b>, <b>subtract</b>, <b>multiply</b> or <b>divide</b>.", "answers": ["multiply", "multiplication", "multiplying", "times"], "why": "6 racks with 9 on EACH rack are equal groups, so multiply: 6 × 9 = 54.", "no": "Each rack has the same number. Equal groups or not?"}, {"type": "fill", "q": "Toothless caught 7 fish in the morning and 8 fish at night. Which operation finds how many fish in all? Type <b>add</b>, <b>subtract</b>, <b>multiply</b> or <b>divide</b>.", "answers": ["add", "addition", "adding", "plus"], "why": "Two different amounts put together. Not equal groups, so add: 7 + 8 = 15.", "no": "Is it equal groups, or two amounts put together?"}, {"type": "fill", "q": "A gargantuan dragon ate 9 times as many crabs as Toothless. Toothless ate 6. Which operation finds the gargantuan dragon's crabs? Type <b>add</b>, <b>subtract</b>, <b>multiply</b> or <b>divide</b>.", "answers": ["multiply", "multiplication", "multiplying", "times"], "why": "\"9 times as many\" means multiply: 9 × 6 = 54.", "no": "What does \"times as many\" tell you?"}], "notes": {"do": "She says \"equal groups or not?\" out loud for every story, then says the operation; you type it. Then she solves it out loud.", "ask": "\"What words in the story told you?\"", "listen": "\"each\" or \"every\" for multiply; two different amounts for add."}}, {"type": "talk", "kick": "Evaluate It", "title": "Defend your tool", "text": "Jonathan picks a fact. You pick a tool and defend it.", "prompts": ["For <b>8 × 7</b>, which tool would you use? <b>Evaluate</b> two paths and pick one.", "<b>Demonstrate</b> that 6 × 9 = 54 in two different ways.", "Which of your four tools is the most <b>versatile</b>? Justify your answer."], "starters": ["I would use … because …", "One way is … Another way is …", "The most versatile tool is … because …"], "notes": {"do": "You name a fact; she picks a tool and argues for it out loud.", "say": "\"There can be more than one good path. I want your reason.\"", "listen": "Any correct path with a reason."}}, {"type": "learn", "kick": "Wrap-up", "title": "Tonight's plan", "text": "Your four tools are getting faster. Tonight you finish Week 2.", "visual": {"kind": "passage", "text": "▶ <b>Tonight:</b> the Lesson 5 After-class lesson. Get <b>90</b> on Show What You Know. It opens Lesson 6.<br>📖 <b>Tonight:</b> read <i>How to Train Your Dragon</i> for 10 minutes.<br>📚 <b>Tuesday or Wednesday:</b> Reading Power: Author's Purpose."}, "tip": "No new lesson until Lesson 5 is done. Then we start the area model.", "notes": {"do": "Open the course page and read the catch-up task list together.", "say": "Tonight is short: the Lesson 5 After-class lesson and your book. Get 90 and Lesson 6 opens for Tuesday.", "ask": "What will you do tonight?", "listen": "\"The Lesson 5 after-class lesson, get 90, and read.\""}}], "win": "Victorious! You picked the fastest path every time.", "prev": null, "prevTitle": ""});</script><script type="module" src="../../kce-progress/kce-progress.js" data-course="bb-bailey"></script><div id="kce-legal"
