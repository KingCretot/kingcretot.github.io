<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 11</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Share or Group? Prove It!</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Interpret the story, solve it, and confirm it by multiplying.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 11", "title": "Share or Group? Prove It!", "mastery": 90, "color": "#E67E22", "questions": [{"q": "Toothless eats <b>8 crabs</b> a day. How many days will <b>64 crabs</b> last?", "choices": ["56", "72", "8", "7"], "a": 2, "why": "Grouping: 64 ÷ 8 = 8 days. Confirm: 8 × 8 = 64.", "no": ["56 is 64 − 8.", "72 is 64 + 8.", null, "8 × 7 = 56, not 64."]}, {"q": "<b>? ÷ 6 = 9</b>. What is the unknown?", "choices": ["15", "3", "48", "54"], "a": 3, "why": "9 × 6 = 54.", "no": ["15 is 6 + 9. Multiply instead.", "3 is 9 − 6. Multiply instead.", "48 is 6 × 8. You need 6 × 9.", null]}, {"q": "<b>48 ÷ ? = 6</b>. What is the unknown?", "choices": ["8", "42", "7", "54"], "a": 0, "why": "6 × 8 = 48, so 48 ÷ 8 = 6.", "no": [null, "42 is 48 − 6.", "6 × 7 = 42, not 48.", "54 is 48 + 6."]}, {"q": "Fishlegs has <b>36 dragon cards</b>. He makes piles of <b>6</b>. What does the story ask?", "choices": ["How many piles?", "How many cards in each pile?", "How many cards in all?", "How many cards are left over?"], "a": 0, "why": "It is grouping: 36 ÷ 6 = 6 piles.", "no": [null, "The story already tells you: 6 in each pile.", "The story already tells you: 36 cards in all.", "6 × 6 = 36 exactly, so nothing is left over. The story asks how many piles."]}, {"q": "<b>42 Vikings</b> form <b>7 equal rows</b>. How many Vikings are in each row?", "choices": ["35", "6", "49", "5"], "a": 1, "why": "Sharing: 42 ÷ 7 = 6 in each row.", "no": ["35 is 42 − 7.", null, "49 is 42 + 7.", "7 × 5 = 35, not 42."]}, {"q": "Only one is correct. Check each one. Which is it?", "choices": ["49 ÷ 7 = 6", "64 ÷ 8 = 7", "72 ÷ 9 = 8", "36 ÷ 6 = 5"], "a": 2, "why": "8 × 9 = 72.", "no": ["Check: 6 × 7 = 42, not 49.", "Check: 7 × 8 = 56, not 64.", null, "Check: 5 × 6 = 30, not 36."]}, {"q": "Check <b>46 ÷ 9 = 5 R 1</b>. What do you find?", "choices": ["Wrong: 5 × 9 is 46", "Right: 5 × 9 + 1 = 46", "Wrong: it should be 4 R 10", "Wrong: the remainder is 9"], "a": 1, "why": "5 × 9 = 45 and 45 + 1 = 46.", "no": ["5 × 9 = 45. Then add the remainder 1.", null, "10 left over is more than 9.", "A remainder must be smaller than the divisor."]}, {"q": "Snotlout says <b>54 ÷ 9 = 7</b>. Check it: 7 × 9 = ?", "choices": ["54, so he is right", "56, so it should be 8", "16, so it should be 9", "63, so it should be 6"], "a": 3, "why": "7 × 9 = 63, too big. 6 × 9 = 54, so 54 ÷ 9 = 6.", "no": ["7 × 9 = 63, not 54.", "7 × 9 is 63. 56 is 7 × 8.", "16 is 7 + 9. Multiply instead.", null]}, {"q": "Which number is <b>divisible</b> by 6?", "choices": ["44", "48", "50", "52"], "a": 1, "why": "6 × 8 = 48 with nothing left over.", "no": ["44 ÷ 6 = 7 R 2.", null, "50 ÷ 6 = 8 R 2.", "52 ÷ 6 = 8 R 4."]}, {"q": "To <b>interpret</b> a word problem means to…", "choices": ["figure out what it means and what it asks", "solve it as fast as you can", "copy it neatly", "skip the hard words"], "a": 0, "why": "To <i>interpret</i> is to figure out what something means.", "no": [null, "Speed is not interpreting.", "Copying is not understanding.", "Interpreting means working out the hard parts."]}, {"q": "Which word means \"to figure out something hard to read, like a code\"?", "choices": ["confirm", "ration", "decipher", "negotiate"], "a": 2, "why": "To <i>decipher</i> is to crack something hard to understand.", "no": ["Confirm means to show something is true.", "Ration means to give out small amounts.", null, "Negotiate means to talk to reach an agreement."]}, {"q": "The climb up the cliff looked <b>daunting</b>. Which word means almost the same?", "choices": ["simple", "precise", "divisible", "scary to try"], "a": 3, "why": "<i>Daunting</i> means it looks hard or scary before you start.", "no": ["Simple is the opposite.", "Precise means exactly right.", "Divisible is a math word about dividing.", null]}]});</script></body></html>
