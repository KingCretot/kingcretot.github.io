<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Practice 11</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Share or Group? Prove It!</h1><p style="margin:0 0 12px;color:#5b6578">Three tries on each one, but only your first try counts. Interpret the story, solve it, and confirm it by multiplying.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bailey", "label": "Lesson 11", "title": "Share or Group? Prove It!", "mastery": 90, "color": "#E67E22", "questions": [{"type": "fill", "q": "Toothless eats <b>9 crabs</b> a day. How many days will <b>63 crabs</b> last?", "answers": ["7", "7 days", "seven"], "why": "Grouping: 63 ÷ 9 = 7 days. Confirm: 7 × 9 = 63.", "no": "Ask: 9 × what = 63?"}, {"type": "fill", "q": "<b>? ÷ 6 = 9</b>. What is the unknown?", "answers": ["54"], "why": "9 × 6 = 54. Confirm: 54 ÷ 6 = 9.", "no": "The dividend is missing. Multiply."}, {"type": "fill", "q": "<b>56 ÷ ? = 8</b>. Find the unknown.", "answers": ["7", "seven"], "why": "8 × 7 = 56, so 56 ÷ 7 = 8.", "no": "Ask: 8 × what = 56?"}, {"q": "Fishlegs has <b>36 dragon cards</b>. He makes piles of <b>6</b>. What does the story <b>not</b> tell you yet?", "choices": ["How many piles?", "How many cards in each pile?", "How many cards in all?"], "a": 0, "why": "It is grouping: 36 ÷ 6 = 6 piles.", "no": [null, "The story already tells you: 6 in each pile.", "The story already tells you: 36 cards in all."]}, {"type": "fill", "q": "<b>42 Vikings</b> form <b>7 equal rows</b>. How many Vikings are in each row?", "answers": ["6", "6 Vikings", "six"], "why": "Sharing: 42 ÷ 7 = 6 in each row. Confirm: 6 × 7 = 42.", "no": "Ask: 7 × what = 42?"}, {"q": "Only one is correct. Check each one. Which is it?", "choices": ["49 ÷ 7 = 6", "64 ÷ 8 = 7", "72 ÷ 9 = 8", "36 ÷ 6 = 5"], "a": 2, "why": "8 × 9 = 72.", "no": ["Check: 6 × 7 = 42, not 49.", "Check: 7 × 8 = 56, not 64.", null, "Check: 5 × 6 = 30, not 36."]}, {"q": "Check <b>46 ÷ 9 = 5 R 1</b>. What do you find?", "choices": ["Wrong: 5 × 9 is 46", "Right: 5 × 9 + 1 = 46", "Wrong: it should be 4 R 10", "Wrong: the remainder is 9"], "a": 1, "why": "5 × 9 = 45 and 45 + 1 = 46.", "no": ["5 × 9 = 45. Then add the remainder 1.", null, "10 left over is more than 9.", "A remainder must be smaller than the divisor."]}, {"type": "fill", "q": "Check <b>53 ÷ 6 = 8 R 5</b>: 8 × 6 + 5 = ____", "answers": ["53"], "why": "8 × 6 = 48 and 48 + 5 = 53. It matches, so it is confirmed.", "no": "Multiply 8 × 6 first, then add 5."}, {"q": "Which number is <b>divisible</b> by 6?", "choices": ["44", "50", "52", "48"], "a": 3, "why": "6 × 8 = 48 with nothing left over.", "no": ["44 ÷ 6 = 7 R 2.", "50 ÷ 6 = 8 R 2.", "52 ÷ 6 = 8 R 4.", null]}, {"type": "fill", "q": "To figure out what a word problem means and what it asks is to ____ it. (Use a word from your word cards.)", "answers": ["interpret"], "why": "To <i>interpret</i> is to figure out what something means.", "no": "It starts with i."}, {"type": "fill", "q": "Exactly right, with every detail correct, is ____. (Use a word from your word cards.)", "answers": ["precise"], "why": "<i>Precise</i> means exactly right, with every detail correct.", "no": "It starts with p."}, {"q": "The climb up the cliff looked <b>daunting</b>. Which word means almost the same?", "choices": ["simple", "precise", "divisible", "scary to try"], "a": 3, "why": "<i>Daunting</i> means it looks hard or scary before you start.", "no": ["Simple is the opposite.", "Precise means exactly right.", "Divisible is a math word about dividing.", null]}]});</script></body></html>
