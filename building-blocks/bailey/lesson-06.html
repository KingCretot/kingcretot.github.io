<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 6: Stop Adding, Start Multiplying</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L06", "label": "Lesson 6", "title": "Stop Adding, Start Multiplying", "goal": "I can use an area model to multiply a 2-digit number by a 1-digit number.", "date": "2026-11-02", "mastery": 90, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Stop Adding, Start Multiplying", "text": "Your 6, 7, 8 and 9 facts are getting fast. Today they become <b>power tools</b> for big problems like <b>75 × 8</b>.", "visual": {"kind": "bigtext", "text": "75 × 8 = ?", "sub": "No more adding 8 over and over!"}}, {"type": "talk", "kick": "Book Talk", "title": "Brains or muscles?", "text": "Think about <i>How to Train Your Dragon</i>.", "prompts": ["What happened in the part you read last? Tell it in order: first, next, then.", "Hiccup is not the biggest or strongest Viking on Berk. What does he use instead to solve problems?", "Find a time someone in the book did something the hard way. What would have been a smarter way?"], "starters": ["In the part I read, first …", "Hiccup uses his … instead of …", "A smarter way would be … because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read the word, the meaning and the example out loud.", "words": [{"word": "area model", "pos": "noun", "meaning": "A rectangle split into boxes that helps you multiply a big number one part at a time.", "example": "I drew an <b>area model</b> for 75 × 8 with two boxes.", "emoji": "🟪"}, {"word": "partial product", "pos": "noun", "meaning": "The answer from one box of an area model. You add the partial products to get the final answer.", "example": "For 75 × 8, the <b>partial products</b> are 560 and 40.", "emoji": "🧩"}, {"word": "expanded form", "pos": "noun", "meaning": "A number written as the sum of the values of its digits.", "example": "The <b>expanded form</b> of 75 is 70 + 5.", "emoji": "🔢"}, {"word": "dimensions", "pos": "noun", "meaning": "The measurements of the sides of a shape: how long and how wide it is.", "example": "The <b>dimensions</b> of my rectangle are 75 and 8.", "emoji": "📏"}, {"word": "laborious", "pos": "adjective", "meaning": "Needing a lot of slow, hard work.", "example": "Adding 8 seventy-five times is <b>laborious</b>.", "emoji": "😩"}, {"word": "resourceful", "pos": "adjective", "meaning": "Good at finding clever ways to solve a problem with what you have.", "example": "Hiccup cannot win with muscles, so he has to be <b>resourceful</b>.", "emoji": "💡"}, {"word": "immense", "pos": "adjective", "meaning": "Extremely large; huge.", "example": "Next to an <b>immense</b> sea dragon, a Viking ship looks like a toy.", "emoji": "🐉"}, {"word": "abandon", "pos": "verb", "meaning": "To leave something behind and stop using it.", "example": "Today we <b>abandon</b> the slow adding method.", "emoji": "🚪"}]}, {"type": "learn", "kick": "Learn", "title": "Why adding is so slow", "text": "The old way to find <b>75 × 8</b>: add 8 again and again.", "visual": {"kind": "bigtext", "text": "8 + 8 + 8 + 8 + 8 + …", "sub": "That is 75 eights to add!"}, "steps": [{"text": "That is <b>75 numbers</b> to add. If you lose count once, the answer is wrong."}, {"text": "It is <b>laborious</b>, and it hides how big the answer really is."}, {"text": "Today you <b>abandon</b> that method. You will use just <b>two facts</b> and <b>one addition</b>."}], "tip": "Multiplying is a shortcut for adding equal groups. Big numbers need a smart shortcut too."}, {"type": "learn", "kick": "Learn", "title": "Facts with a zero", "text": "You know <b>7 × 8 = 56</b>. So what is <b>70 × 8</b>?", "steps": [{"text": "70 is <b>7 tens</b>."}, {"text": "7 tens × 8 = <b>56 tens</b>."}, {"text": "56 tens is <b>560</b>.", "visual": {"kind": "bigtext", "text": "70 × 8 = 560"}}], "tip": "Do the fact first. Then keep the zero: tens times a number still gives tens."}, {"type": "tap", "kick": "Try it", "title": "Tens times a fact", "items": [{"q": "What is <b>60 × 7</b>?", "choices": ["42", "4,200", "420", "67"], "a": 2, "why": "6 × 7 = 42, so 6 tens × 7 = 42 tens = <b>420</b>.", "no": ["That is 6 × 7. But 60 is 6 <b>tens</b>, so the answer is 42 tens.", "Too many zeros. Only one factor has a zero, so the answer gets one zero.", null, "You wrote the digits side by side. Multiply 6 × 7 first."]}, {"q": "What is <b>90 × 6</b>?", "choices": ["540", "96", "450", "5,400"], "a": 0, "why": "9 × 6 = 54, so 90 × 6 = <b>540</b>.", "no": [null, "You added 90 + 6. The sign says multiply.", "That is 90 × 5. One more group of 90 makes 540.", "Too many zeros. 9 × 6 = 54, and 90 has one zero."]}, {"q": "Which one shows how to find <b>80 × 9</b>?", "choices": ["8 + 9 = 17, so 80 × 9 = 170", "8 × 9 = 72, so 80 × 9 = 720", "8 × 9 = 72, so 80 × 9 = 7,200"], "a": 1, "why": "8 tens × 9 = 72 tens = <b>720</b>.", "no": ["That is adding. You need the fact 8 × 9.", null, "Only one zero. 80 has one zero, so the answer has one more zero than 72."]}]}, {"type": "learn", "kick": "Learn", "title": "Meet the area model", "text": "Let's find <b>75 × 8</b> with an <b>area model</b>.", "steps": [{"text": "<b>Step 1.</b> Write 75 in <b>expanded form</b>: 70 + 5.", "visual": {"kind": "bigtext", "text": "75 = 70 + 5"}}, {"text": "<b>Step 2.</b> Draw a rectangle. Split it into a <b>70</b> box and a <b>5</b> box. The other side is <b>8</b>.", "visual": {"kind": "area", "b": 8, "split": [70, 5], "show": false}}, {"text": "<b>Step 3.</b> Multiply each box. 70 × 8 = 560 and 5 × 8 = 40. These are the <b>partial products</b>.", "visual": {"kind": "area", "b": 8, "split": [70, 5], "show": true}}, {"text": "<b>Step 4.</b> Add the partial products: 560 + 40 = <b>600</b>.", "visual": {"kind": "bigtext", "text": "75 × 8 = 600"}}], "tip": "Two facts (7 × 8 and 5 × 8) and one addition. That beats 75 additions!"}, {"type": "tap", "kick": "Try it", "title": "Fill the boxes: 46 × 7", "items": [{"q": "This is the area model for <b>46 × 7</b>. What goes in the <b>40</b> box?", "visual": {"kind": "area", "b": 7, "split": [40, 6], "show": false}, "choices": ["28", "47", "240", "280"], "a": 3, "why": "4 × 7 = 28, so 40 × 7 = <b>280</b>.", "no": ["40 is 4 <b>tens</b>. 4 × 7 = 28, so 40 × 7 = 280.", "You added 40 + 7. Each box is multiplied.", "That is 40 × 6. The side of the rectangle is 7, so do 40 × 7.", null]}, {"q": "The partial products for <b>46 × 7</b> are 280 and 42. What is 46 × 7?", "choices": ["322", "312", "70"], "a": 0, "why": "280 + 42 = <b>322</b>.", "no": [null, "Check the addition. 80 + 40 = 120 and 2 more is 122, so 280 + 42 = 322.", "You added 28 + 42, but the 40 box holds 280, not 28."]}, {"q": "Which area model is set up correctly for <b>83 × 6</b>?", "choices": ["Boxes 8 and 3. The side is 6.", "Boxes 80 and 6. The side is 3.", "Boxes 80 and 3. The side is 6."], "a": 2, "why": "83 = 80 + 3, and the side of the rectangle is 6.", "no": ["The 8 in 83 is really 80. Use expanded form: 80 + 3.", "Split 83 into 80 + 3. The 6 is the other side of the rectangle.", null]}]}, {"type": "order", "kick": "Put it in order", "title": "Area model steps: 57 × 8", "text": "Tap the steps in the order you would do them.", "steps": ["Write 57 as 50 + 7", "Draw a 50 box and a 7 box with side 8", "Multiply each box: 50 × 8 = 400 and 7 × 8 = 56", "Add the partial products: 400 + 56", "Write the answer: 57 × 8 = 456"], "why": "57 × 8 = <b>456</b>. Two facts and one addition.", "hint": "Start by breaking 57 into tens and ones. You need the boxes before you can multiply them, and the partial products before you can add."}, {"type": "tap", "kick": "Try it", "title": "Problems on Berk", "items": [{"q": "Gobber hangs <b>8</b> rows of shields in the Great Hall. Each row has <b>36</b> shields. How many shields?", "choices": ["44", "288", "248", "268"], "a": 1, "why": "30 × 8 = 240 and 6 × 8 = 48. 240 + 48 = <b>288</b> shields.", "no": ["You added 36 + 8. There are 8 equal rows of 36, so multiply.", null, "The tens box is right (240), but the ones box is 6 × 8 = 48, not 8.", "Check 6 × 8. It is 48, not 28. 240 + 48 = 288."]}, {"q": "Fishlegs wants to find <b>64 × 9</b>. Which way is fast <b>and</b> correct?", "choices": ["60 × 9 + 4 × 9 = 540 + 36 = 576", "Add 9 + 9 + 9 … sixty-four times", "60 × 9 + 4 = 544", "64 + 9 = 73"], "a": 0, "why": "Two partial products: 540 + 36 = <b>576</b>.", "no": [null, "That works, but it is laborious: 64 numbers to add, and one slip ruins it.", "The 4 box must be multiplied by 9 too: 4 × 9 = 36.", "That is adding, not multiplying."]}]}, {"type": "recall", "kick": "Remember", "title": "Your fact shortcuts", "text": "These shortcuts from the last two weeks make the boxes fast.", "items": [{"q": "Which shortcut gives <b>9 × 8</b>?", "choices": ["10 × 8 + 8 = 88", "9 × 10 − 9 = 81", "10 × 8 − 8 = 72"], "a": 2, "why": "Ten 8s is 80. Take away one 8: <b>72</b>.", "no": ["Nine groups is one group <b>less</b> than ten groups, so subtract.", "That is 9 × 9. Take away one group of 8, not 9.", null]}, {"q": "Double, double, double: 7 → 14 → 28 → ___. This gives 8 × 7.", "choices": ["42", "56", "54"], "a": 1, "why": "28 + 28 = <b>56</b>, so 8 × 7 = 56.", "no": ["42 is 28 + 14. Doubling 28 means 28 + 28.", null, "28 + 28 = 56. Remember 5, 6, 7, 8: 56 = 7 × 8."]}, {"q": "<b>6 × 7</b> is 5 × 7 plus one more group. Which is right?", "choices": ["35 + 7 = 42", "35 + 6 = 41", "35 + 1 = 36"], "a": 0, "why": "5 × 7 = 35, plus one more 7 is <b>42</b>.", "no": [null, "One more group of <b>7</b>, not 6.", "Add one whole group of 7, not just 1."]}]}, {"type": "tap", "kick": "Word Power", "title": "Use your new words", "items": [{"q": "Which sentence uses <b>laborious</b> correctly?", "choices": ["The race was so laborious that it ended in two seconds.", "Toothless gave a laborious roar that made everyone jump.", "The laborious answer to 75 × 8 is 600.", "Counting 600 grains of sand one by one is laborious."], "a": 3, "why": "Counting one by one is slow, hard work. That is laborious.", "no": ["Laborious means slow, hard work. A two-second race is the opposite.", "A roar that makes people jump is loud or fierce, not slow, hard work.", "An answer is not slow, hard work. The adding <b>method</b> is laborious.", null]}, {"q": "In the area model for 75 × 8, which numbers are the <b>partial products</b>?", "choices": ["70 and 5", "560 and 40", "600", "75 and 8"], "a": 1, "why": "70 × 8 = 560 and 5 × 8 = 40 are the partial products.", "no": ["Those are the parts of 75 in expanded form. Partial products come from multiplying.", null, "600 is the final product. The partial products are the pieces you add to get it.", "Those are the dimensions of the rectangle."]}, {"q": "Hiccup cannot beat a huge dragon with muscles, so he finds a clever way with what he has. Which word describes Hiccup?", "choices": ["immense", "laborious", "resourceful", "abandoned"], "a": 2, "why": "<b>Resourceful</b> means good at finding clever ways to solve a problem with what you have.", "no": ["Immense means huge. Hiccup is not huge; he is clever.", "Laborious describes slow, hard work, not a clever person.", null, "Abandoned means left behind. Hiccup is not left behind."]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "What is <b>70 × 6</b>?", "choices": ["420", "42", "4,200", "76"], "a": 0, "why": "7 × 6 = 42, so 70 × 6 = 420.", "no": [null, "70 is 7 tens. 7 × 6 = 42 tens = 420.", "Only one zero: 70 has one zero.", "Multiply 7 × 6 first."]}, {"q": "Which is <b>58</b> in expanded form?", "choices": ["5 + 8", "50 + 80", "50 + 8"], "a": 2, "why": "58 = 50 + 8.", "no": ["The 5 in 58 means 5 tens, which is 50.", "The 8 is in the ones place. It is just 8.", null]}, {"q": "This is the area model for <b>39 × 7</b>. What goes in the <b>30</b> box?", "visual": {"kind": "area", "b": 7, "split": [30, 9], "show": false}, "choices": ["21", "210", "270", "37"], "a": 1, "why": "3 × 7 = 21, so 30 × 7 = 210.", "no": ["30 is 3 tens. 3 × 7 = 21 tens = 210.", null, "That is 30 × 9. The side is 7.", "Multiply the box, don't add."]}, {"q": "The partial products for <b>39 × 7</b> are 210 and 63. What is 39 × 7?", "choices": ["263", "84", "273"], "a": 2, "why": "210 + 63 = 273.", "no": ["10 + 60 = 70, so 210 + 63 = 273.", "The 30 box is 210, not 21.", null]}, {"q": "What is <b>94 × 9</b>?", "choices": ["103", "814", "836", "846"], "a": 3, "why": "90 × 9 = 810 and 4 × 9 = 36. 810 + 36 = 846.", "no": ["You added 94 + 9.", "The ones box is 4 × 9 = 36, not 4.", "810 + 36 = 846. Check the tens.", null]}, {"q": "Stoick's tribe loads <b>7</b> boats. Each boat carries <b>48</b> barrels. How many barrels?", "choices": ["336", "55", "288", "326"], "a": 0, "why": "40 × 7 = 280 and 8 × 7 = 56. 280 + 56 = 336.", "no": [null, "7 equal boats of 48 means multiply, not add.", "The ones box is 8 × 7 = 56, not 8.", "280 + 56 = 336. Regroup the tens."]}, {"q": "The <b>dimensions</b> of a rectangle are …", "choices": ["the boxes inside it", "how long and how wide it is", "the answer you get when you add the boxes", "the partial products inside it"], "a": 1, "why": "Dimensions are the measurements of the sides.", "no": ["Boxes are parts. Dimensions are side lengths.", null, "That is the product.", "Partial products are the answers inside the boxes. Dimensions are the side lengths."]}, {"q": "Which way finds <b>86 × 6</b> with the fewest steps and the right answer?", "choices": ["Add 6 + 6 + 6 … eighty-six times", "80 × 6 + 6 × 6", "80 × 6 + 6"], "a": 1, "why": "480 + 36 = 516 with two facts and one addition.", "no": ["Correct, but 86 numbers to add is laborious and easy to mess up.", null, "The 6 box must be multiplied: 6 × 6 = 36."]}, {"q": "To <b>abandon</b> a plan means to …", "choices": ["follow it very carefully", "make it bigger", "share it with a friend", "stop using it and leave it behind"], "a": 3, "why": "Abandon means to leave something behind.", "no": ["That is the opposite of abandon.", "Abandon means to leave it.", "Sharing keeps the plan. Abandon means leave it.", null]}, {"q": "The sea dragon was so <b>immense</b> that …", "choices": ["the Viking ship looked tiny next to it", "it fit inside Hiccup's helmet", "it came up with a clever trick"], "a": 0, "why": "Immense means extremely large.", "no": [null, "Immense means huge, not tiny.", "A clever trick shows someone is resourceful, not immense."]}]}], "win": "Two facts and one addition. You just abandoned the slow way!", "prev": "bb-bailey-L05", "prevTitle": "Lesson 5"});</script></body></html>
