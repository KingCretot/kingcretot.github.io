<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bailey · Lesson 6: Stop Adding, Start Multiplying</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bailey", "studentName": "Bailey", "id": "bb-bailey-L06", "label": "Lesson 6", "title": "Stop Adding, Start Multiplying", "goal": "I can use an area model to multiply a 2-digit number by a 1-digit number.", "date": "2026-11-02", "mastery": 90, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Stop Adding, Start Multiplying: On Your Own", "text": "In class you learned the <b>area model</b>. Now show what you can do on your own. Keep paper and a pencil next to you.", "visual": {"kind": "bigtext", "text": "75 × 8 → 560 + 40 = 600", "sub": "Two facts and one addition"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["Explain how to find 75 × 8 without adding 8 seventy-five times.", "What is a <b>partial product</b>? Point to one in an area model you drew in class.", "In <i>How to Train Your Dragon</i>, who is <b>resourceful</b>? What clever thing did that character do?"], "starters": ["First I split 75 into …", "A partial product is …", "… is resourceful because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Review your words", "text": "Say the meaning out loud first. Then flip the card to check yourself.", "words": [{"word": "area model", "pos": "noun", "meaning": "A rectangle split into boxes that helps you multiply a big number one part at a time.", "example": "I drew an <b>area model</b> for 75 × 8 with two boxes.", "emoji": "🟪"}, {"word": "partial product", "pos": "noun", "meaning": "The answer from one box of an area model. You add the partial products to get the final answer.", "example": "For 75 × 8, the <b>partial products</b> are 560 and 40.", "emoji": "🧩"}, {"word": "expanded form", "pos": "noun", "meaning": "A number written as the sum of the values of its digits.", "example": "The <b>expanded form</b> of 75 is 70 + 5.", "emoji": "🔢"}, {"word": "dimensions", "pos": "noun", "meaning": "The measurements of the sides of a shape: how long and how wide it is.", "example": "The <b>dimensions</b> of my rectangle are 75 and 8.", "emoji": "📏"}, {"word": "laborious", "pos": "adjective", "meaning": "Needing a lot of slow, hard work.", "example": "Adding 8 seventy-five times is <b>laborious</b>.", "emoji": "😩"}, {"word": "resourceful", "pos": "adjective", "meaning": "Good at finding clever ways to solve a problem with what you have.", "example": "Hiccup cannot win with muscles, so he has to be <b>resourceful</b>.", "emoji": "💡"}, {"word": "immense", "pos": "adjective", "meaning": "Extremely large; huge.", "example": "Next to an <b>immense</b> sea dragon, a Viking ship looks like a toy.", "emoji": "🐉"}, {"word": "abandon", "pos": "verb", "meaning": "To leave something behind and stop using it.", "example": "Today we <b>abandon</b> the slow adding method.", "emoji": "🚪"}]}, {"type": "learn", "kick": "Remember", "title": "Split, multiply, add", "text": "<b>69 × 7</b>: split 69 into <b>60 + 9</b>. Multiply each box by 7. Add the partial products.", "visual": {"kind": "area", "b": 7, "split": [60, 9], "show": true}, "tip": "Tens box: do the fact, then keep the zero. 6 × 7 = 42, so 60 × 7 = 420."}, {"type": "tap", "kick": "Try it", "title": "Facts with a zero", "text": "Type each answer. Do the fact first, then keep the zero.", "items": [{"type": "fill", "q": "<b>30 × 8 = ____</b>", "answers": ["240"], "why": "3 × 8 = 24, so 3 tens × 8 = 24 tens = <b>240</b>.", "no": "30 is 3 tens. What is 3 × 8?", "hint": "3 × 8 = 24. Now keep the zero."}, {"type": "fill", "q": "<b>80 × 6 = ____</b>", "answers": ["480"], "why": "8 × 6 = 48, so 80 × 6 = <b>480</b>.", "no": "80 is 8 tens. Do 8 × 6 first.", "hint": "8 × 6: double, double, double 6 → 12 → 24 → 48."}, {"type": "fill", "q": "<b>40 × 9 = ____</b>", "answers": ["360"], "why": "4 × 9 = 36, so 40 × 9 = <b>360</b>.", "no": "40 is 4 tens. Do 4 × 9 first.", "hint": "4 × 9 is ten 4s minus one 4: 40 − 4 = 36."}]}, {"type": "tap", "kick": "Try it", "title": "Build an area model: 67 × 8", "text": "Draw it on paper as you go.", "items": [{"q": "Which numbers go across the top of the area model for <b>67 × 8</b>?", "visual": {"kind": "area", "b": 8, "split": [60, 7], "show": false}, "choices": ["6 and 7", "60 and 7", "60 and 8", "67 and 8"], "a": 1, "why": "67 in expanded form is <b>60 + 7</b>. The 8 goes on the side.", "no": ["The 6 in 67 means 6 <b>tens</b>. Write it as 60.", null, "8 is the other side of the rectangle. Split 67 into 60 + 7.", "Split 67 into tens and ones so each box is an easy fact."]}, {"type": "fill", "q": "What goes in the <b>60</b> box?", "answers": ["480"], "why": "6 × 8 = 48, so 60 × 8 = <b>480</b>.", "no": "Multiply 60 by the side, 8. Keep the zero.", "hint": "6 tens × 8 = 48 tens."}, {"type": "fill", "q": "What goes in the <b>7</b> box?", "answers": ["56"], "why": "7 × 8 = <b>56</b>. Remember 5, 6, 7, 8: 56 = 7 × 8.", "no": "Multiply 7 by 8.", "hint": "5, 6, 7, 8: 56 = 7 × 8."}, {"type": "fill", "q": "Add the partial products. <b>67 × 8 = ____</b>", "answers": ["536"], "why": "480 + 56 = <b>536</b>.", "no": "Add 480 and 56.", "hint": "8 tens + 5 tens = 13 tens. Regroup."}]}, {"type": "tap", "kick": "Try it", "title": "Problems on Berk", "text": "Draw an area model on paper. Type just the number.", "items": [{"type": "fill", "q": "Stoick sends out <b>9</b> boats. Each boat brings back <b>43</b> fish. How many fish?", "answers": ["387", "387 fish"], "why": "40 × 9 = 360 and 3 × 9 = 27. 360 + 27 = <b>387</b> fish.", "no": "There are 9 equal groups of 43. Multiply 43 × 9 with two boxes.", "hint": "Boxes: 40 × 9 and 3 × 9."}, {"type": "fill", "q": "Toothless flies <b>78</b> miles each day for <b>4</b> days. How many miles?", "answers": ["312", "312 miles"], "why": "70 × 4 = 280 and 8 × 4 = 32. 280 + 32 = <b>312</b> miles.", "no": "4 equal days of 78 miles. Multiply 78 × 4.", "hint": "Boxes: 70 × 4 and 8 × 4."}]}, {"type": "recall", "kick": "Remember", "title": "Your fact shortcuts", "text": "These shortcuts from earlier lessons make every box fast.", "items": [{"type": "fill", "q": "×9 shortcut: <b>9 × 6 = 10 × 6 − 6 = ____</b>", "answers": ["54"], "why": "Ten 6s is 60. Take away one 6: <b>54</b>.", "no": "Start with 60 and take away one 6.", "hint": "60 − 6"}, {"type": "fill", "q": "×8 shortcut: double, double, double. <b>9 → 18 → 36 → ____</b>", "answers": ["72"], "why": "36 + 36 = <b>72</b>, so 8 × 9 = 72.", "no": "Double 36. That means 36 + 36.", "hint": "30 + 30 = 60 and 6 + 6 = 12."}, {"q": "×7 shortcut: <b>7 × 6 = 5 × 6 + 2 × 6</b>. Which is right?", "choices": ["30 + 12 = 42", "30 + 2 = 32", "35 + 12 = 47"], "a": 0, "why": "5 sixes + 2 sixes = 7 sixes: 30 + 12 = <b>42</b>.", "no": [null, "2 × 6 is 12, not 2. Multiply both parts.", "5 × 6 is 30, not 35. 35 is 5 × 7."]}]}, {"type": "tap", "kick": "Word Power", "title": "Use your words", "text": "Type the word from memory.", "items": [{"type": "fill", "q": "A rectangle split into boxes to help you multiply is an <b>area ______</b>.", "answers": ["model", "area model"], "why": "It is an <b>area model</b>.", "no": "Think of the vocabulary card with the purple box.", "hint": "It starts with m."}, {"type": "fill", "q": "Adding 6 + 6 + 6 … ninety times would be slow, hard work. It would be <b>________</b>.", "answers": ["laborious"], "why": "<b>Laborious</b> means needing a lot of slow, hard work.", "no": "Which word means slow, hard work?", "hint": "It starts with l-a-b."}, {"q": "Which sentence uses <b>immense</b> correctly?", "choices": ["The immense mouse hid under a leaf.", "The immense dragon blocked out the sun.", "Hiccup was immense at solving puzzles."], "a": 1, "why": "Immense means extremely large. A dragon big enough to block out the sun is immense.", "no": ["A mouse under a leaf is tiny. Immense means huge.", null, "Immense is about size. Hiccup is clever, which is resourceful."]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "What is <b>70 × 6</b>?", "answers": ["420"], "why": "7 × 6 = 42, so 70 × 6 = <b>420</b>.", "no": "70 is 7 tens. Do 7 × 6, then keep the zero."}, {"type": "fill", "q": "Write <b>58</b> in expanded form. Type it as ____ + ____ (tens + ones).", "answers": ["50 + 8", "8 + 50", "50 and 8"], "why": "58 = <b>50 + 8</b>.", "no": "The 5 in 58 means 5 tens.", "placeholder": "tens + ones"}, {"type": "fill", "q": "This is the area model for <b>39 × 7</b>. What goes in the <b>30</b> box?", "visual": {"kind": "area", "b": 7, "split": [30, 9], "show": false}, "answers": ["210"], "why": "3 × 7 = 21, so 30 × 7 = <b>210</b>.", "no": "30 is 3 tens. Multiply by the side, 7."}, {"type": "fill", "q": "The partial products for <b>39 × 7</b> are 210 and 63. What is 39 × 7?", "answers": ["273"], "why": "210 + 63 = <b>273</b>.", "no": "Add the two partial products."}, {"type": "fill", "q": "What is <b>94 × 9</b>?", "answers": ["846"], "why": "90 × 9 = 810 and 4 × 9 = 36. 810 + 36 = <b>846</b>.", "no": "Use two boxes: 90 × 9 and 4 × 9."}, {"type": "fill", "q": "Stoick's tribe loads <b>7</b> boats. Each boat carries <b>48</b> barrels. How many barrels?", "answers": ["336", "336 barrels"], "why": "40 × 7 = 280 and 8 × 7 = 56. 280 + 56 = <b>336</b>.", "no": "7 equal boats of 48. Multiply 48 × 7."}, {"q": "The <b>dimensions</b> of a rectangle are …", "choices": ["the boxes inside it", "how long and how wide it is", "the answer you get when you add the boxes", "the partial products inside it"], "a": 1, "why": "Dimensions are the measurements of the sides.", "no": ["Boxes are parts. Dimensions are side lengths.", null, "That is the product.", "Partial products are the answers inside the boxes. Dimensions are the side lengths."]}, {"q": "Which way finds <b>86 × 6</b> with the fewest steps and the right answer?", "choices": ["Add 6 + 6 + 6 … eighty-six times", "80 × 6 + 6 × 6", "80 × 6 + 6"], "a": 1, "why": "480 + 36 = 516 with two facts and one addition.", "no": ["Correct, but 86 numbers to add is laborious and easy to mess up.", null, "The 6 box must be multiplied: 6 × 6 = 36."]}, {"q": "To <b>abandon</b> a plan means to …", "choices": ["follow it very carefully", "make it bigger", "share it with a friend", "stop using it and leave it behind"], "a": 3, "why": "Abandon means to leave something behind.", "no": ["That is the opposite of abandon.", "Abandon means to leave it.", "Sharing keeps the plan. Abandon means leave it.", null]}, {"q": "The sea dragon was so <b>immense</b> that …", "choices": ["the Viking ship looked tiny next to it", "it fit inside Hiccup's helmet", "it came up with a clever trick"], "a": 0, "why": "Immense means extremely large.", "no": [null, "Immense means huge, not tiny.", "A clever trick shows someone is resourceful, not immense."]}], [{"type": "fill", "q": "What is <b>90 × 8</b>?", "answers": ["720"], "why": "9 × 8 = 72, so 90 × 8 = <b>720</b>.", "no": "90 is 9 tens. Do 9 × 8, then keep the zero."}, {"type": "fill", "q": "Write <b>73</b> in expanded form. Type it as ____ + ____ (tens + ones).", "answers": ["70 + 3", "3 + 70", "70 and 3"], "why": "73 = <b>70 + 3</b>.", "no": "The 7 in 73 means 7 tens.", "placeholder": "tens + ones"}, {"type": "fill", "q": "This is the area model for <b>56 × 9</b>. What goes in the <b>50</b> box?", "visual": {"kind": "area", "b": 9, "split": [50, 6], "show": false}, "answers": ["450"], "why": "5 × 9 = 45, so 50 × 9 = <b>450</b>.", "no": "50 is 5 tens. Multiply by the side, 9."}, {"type": "fill", "q": "The partial products for <b>56 × 9</b> are 450 and 54. What is 56 × 9?", "answers": ["504"], "why": "450 + 54 = <b>504</b>.", "no": "Add the two partial products. 5 tens + 5 tens = 10 tens."}, {"type": "fill", "q": "What is <b>87 × 7</b>?", "answers": ["609"], "why": "80 × 7 = 560 and 7 × 7 = 49. 560 + 49 = <b>609</b>.", "no": "Use two boxes: 80 × 7 and 7 × 7."}, {"type": "fill", "q": "Gobber sharpens <b>65</b> swords a week. How many swords does he sharpen in <b>8</b> weeks?", "answers": ["520", "520 swords"], "why": "60 × 8 = 480 and 5 × 8 = 40. 480 + 40 = <b>520</b>.", "no": "8 equal weeks of 65 swords. Multiply 65 × 8."}, {"q": "In the area model for <b>84 × 6</b>, the <b>dimensions</b> of the rectangle are …", "choices": ["80 and 4", "84 and 6", "480 and 24", "504"], "a": 1, "why": "The dimensions are the side lengths: <b>84</b> and <b>6</b>.", "no": ["80 and 4 are the parts of 84. Dimensions are the whole side lengths.", null, "Those are the partial products inside the boxes.", "504 is the final product, not a side length."]}, {"q": "Which way finds <b>79 × 8</b> with the fewest steps and the right answer?", "choices": ["Add 8 + 8 + 8 … seventy-nine times", "70 × 8 + 9", "70 × 8 + 9 × 8", "79 + 8"], "a": 2, "why": "Two facts and one addition: 560 + 72 = 632.", "no": ["That is laborious: 79 numbers to add, and one slip ruins it.", "The 9 box must be multiplied by 8 too: 9 × 8 = 72.", null, "That is adding, not multiplying."]}, {"q": "Something that is <b>laborious</b> …", "choices": ["takes a lot of slow, hard work", "is very large", "is done in one quick step", "is clever and tricky"], "a": 0, "why": "Laborious means needing a lot of slow, hard work.", "no": [null, "That is immense.", "That is the opposite of laborious.", "Laborious is about slow, hard work, not tricks."]}, {"q": "Hiccup has no muscles to beat the dragon, so he uses a rope, a shield and a plan. Which word describes him?", "choices": ["immense", "laborious", "abandoned", "resourceful"], "a": 3, "why": "<b>Resourceful</b> means good at finding clever ways to solve a problem with what you have.", "no": ["Immense means huge. Hiccup is small but clever.", "Laborious describes slow, hard work, not a person who finds clever ways.", "Abandoned means left behind.", null]}], [{"type": "fill", "q": "What is <b>50 × 7</b>?", "answers": ["350"], "why": "5 × 7 = 35, so 50 × 7 = <b>350</b>.", "no": "50 is 5 tens. Do 5 × 7, then keep the zero."}, {"type": "fill", "q": "Write <b>92</b> in expanded form. Type it as ____ + ____ (tens + ones).", "answers": ["90 + 2", "2 + 90", "90 and 2"], "why": "92 = <b>90 + 2</b>.", "no": "The 9 in 92 means 9 tens.", "placeholder": "tens + ones"}, {"type": "fill", "q": "This is the area model for <b>76 × 6</b>. What goes in the <b>70</b> box?", "visual": {"kind": "area", "b": 6, "split": [70, 6], "show": false}, "answers": ["420"], "why": "7 × 6 = 42, so 70 × 6 = <b>420</b>.", "no": "70 is 7 tens. Multiply by the side, 6."}, {"type": "fill", "q": "The partial products for <b>76 × 6</b> are 420 and 36. What is 76 × 6?", "answers": ["456"], "why": "420 + 36 = <b>456</b>.", "no": "Add the two partial products."}, {"type": "fill", "q": "What is <b>59 × 8</b>?", "answers": ["472"], "why": "50 × 8 = 400 and 9 × 8 = 72. 400 + 72 = <b>472</b>.", "no": "Use two boxes: 50 × 8 and 9 × 8."}, {"type": "fill", "q": "Each Viking longhouse has <b>34</b> beds. There are <b>9</b> longhouses. How many beds?", "answers": ["306", "306 beds"], "why": "30 × 9 = 270 and 4 × 9 = 36. 270 + 36 = <b>306</b>.", "no": "9 equal longhouses of 34 beds. Multiply 34 × 9."}, {"q": "Which word names the answer from <b>one box</b> of an area model?", "choices": ["dimensions", "expanded form", "partial product", "final product"], "a": 2, "why": "Each box gives a <b>partial product</b>.", "no": ["Dimensions are the side lengths.", "Expanded form splits a number into tens and ones, like 70 + 6.", null, "The final product comes from adding all the boxes."]}, {"q": "Which plan finds <b>35 × 9</b> correctly?", "choices": ["30 × 9 + 5 × 9", "30 × 9 + 5", "3 × 9 + 5 × 9", "35 + 9"], "a": 0, "why": "270 + 45 = 315.", "no": [null, "The 5 box must be multiplied by 9 too.", "The 3 in 35 is 3 tens: use 30 × 9.", "That is adding, not multiplying."]}, {"q": "Hiccup decides to <b>abandon</b> his old plan. What does he do?", "choices": ["He follows it step by step.", "He stops using it and leaves it behind.", "He tells it to Toothless.", "He makes it bigger."], "a": 1, "why": "Abandon means to leave something behind and stop using it.", "no": ["That is the opposite of abandon.", null, "Telling someone keeps the plan. Abandon means leave it.", "Abandon means to stop using it."]}, {"q": "The dragon was so <b>immense</b> that …", "choices": ["it could sleep in a teacup", "it hid in Hiccup's pocket", "it solved the puzzle first", "its shadow covered the whole village"], "a": 3, "why": "Immense means extremely large.", "no": ["Immense means huge, not tiny.", "Only a tiny dragon fits in a pocket.", "Solving puzzles is clever, not immense.", null]}]]}], "win": "Two facts and one addition. You just abandoned the slow way!", "prev": "bb-bailey-L05", "prevTitle": "Lesson 5"});</script></body></html>
