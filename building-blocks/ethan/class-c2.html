<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ethan · Lesson 2: Lesson 2 Review: Last Class Before the Break</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L02", "label": "Catch-up", "title": "Lesson 2 Review: Last Class Before the Break", "goal": "I can divide with long division, check every answer with multiplication, and use evidence to compare two viewpoints.", "date": "2026-11-11", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "Lesson 2 Review: Long Division, Locked In", "text": "No new lesson today. We make <b>long division</b> solid before the break, on the whiteboards. Then you get the <b>Ferguson Family Feast Planner</b>. 🍽️", "visual": {"kind": "emoji", "text": "➗ ✅ 🍽️"}, "notes": {"do": "In person at the library. Give him a handheld whiteboard and marker; keep one for yourself. Look at his Lesson 2 Packet and 8-word index card. Note what is missing.", "say": "Today is a review day. No new skill. We lock in long division, especially remainders and the check, so Lesson 3 is easy after the break.", "ask": "Show me your Lesson 2 Packet and your index card. What felt hard last week?", "listen": "Which packet pages are done. Lesson 2 Practice came in at 75 (Nov 6); every miss was about remainders. No Show What You Know score has come in yet. Week 7 Math is mastered (85 on Nov 10); no Week 7 Reading score yet."}}, {"type": "talk", "kick": "Whiteboard warm-up", "title": "Four steps, out loud", "text": "On your whiteboard. Say each step out loud as you do it: <b>Divide, Multiply, Subtract, Bring down</b>. Then write the <b>check</b> underneath.", "visual": {"kind": "bigtext", "text": "552 ÷ 6 · 552 ÷ 4", "sub": "Show your board after each one."}, "prompts": ["Solve <b>552 ÷ 6</b>. Say the four steps out loud as you go.", "Write the check under it: <b>divisor × quotient + remainder = dividend</b>.", "Now <b>552 ÷ 4</b>. Same steps, same check."], "starters": ["First I divide … into …", "Then I multiply … and subtract …", "My check is … × … + … = …"], "notes": {"do": "Whiteboards. He holds up his board after each problem. Do not tap or reveal anything on the laptop; this slide is all whiteboard.", "say": "These are from last week. Fast and sure, with the check every time.", "ask": "Why do we start with 55 and not 5?", "listen": "552 ÷ 6 = 92 (check 6 × 92 = 552). 552 ÷ 4 = 138 (check 4 × 138 = 552). 6 does not fit into 5, so start with 55."}}, {"type": "tap", "kick": "Find the mistake", "title": "Your Practice, fixed", "text": "These three came from your own Lesson 2 Practice. Work each one on your whiteboard first, then answer.", "items": [{"q": "<b>437 ÷ 6 = 72 R5.</b> Which multiplication CHECKS this answer?", "choices": ["6 × 72 − 5", "6 × 72 + 5", "6 × 5 + 72", "72 × 5 + 6"], "a": 1, "why": "To check, multiply the divisor by the quotient, then <b>add</b> the remainder back: 6 × 72 = 432, and 432 + 5 = <b>437</b>. ✅", "no": ["The remainder was left over, so you ADD it back, not take it away. 432 − 5 = 427, not 437.", null, "Multiply the divisor by the quotient: 6 × 72, not 6 × 5.", "The divisor is 6 and the quotient is 72: 6 × 72, then add the remainder 5."]}, {"q": "Someone wrote <b>83 ÷ 6 = 12 R11</b>. What went wrong?", "choices": ["Nothing. 12 R11 is right.", "It should be 13 R5", "It should be 12 R1", "83 cannot be divided by 6"], "a": 1, "why": "A remainder must always be <b>smaller than the divisor</b>. 11 is bigger than 6, so one more 6 fits: 11 − 6 = 5. The answer is <b>13 R5</b>. Check: 6 × 13 + 5 = 83. ✅", "no": ["Look at the remainder. Is 11 smaller than 6?", null, "Check it: 6 × 12 + 1 = 73, not 83.", "83 can be divided by 6. It just has a remainder."]}, {"type": "fill", "q": "<b>9 ÷ 12 = ____</b> Type it like 5 R2.", "answers": ["0 R9", "0 r 9", "0r9", "0 remainder 9", "0 rem 9", "0 R 9", "0 remainder of 9", "0 with 9 left over", "0 with 9 left"], "why": "12 does not fit into 9 even once, so the quotient is <b>0</b> and all 9 are left over: <b>0 R9</b>. Check: 12 × 0 + 9 = 9. ✅", "no": "How many 12s fit into 9? Not even one. So the quotient is 0. What is left over?", "hint": "12 is bigger than 9. Zero 12s fit.", "placeholder": "Example: 5 R2"}], "notes": {"do": "He works each problem on his whiteboard and shows you BEFORE he taps. He says the rule out loud.", "say": "These are your three misses from last week's Practice. Today you fix them like a teacher would.", "ask": "What are the two remainder rules?", "listen": "1) In the check, ADD the remainder back. 2) The remainder must be smaller than the divisor. On 9 ÷ 12 he typed .75 last week: in long division the answer is 0 R9."}}, {"type": "vocab", "kick": "Word Power", "title": "Math words for today", "text": "Tap each card to flip it. Read the word, the meaning and the example out loud.", "words": [{"word": "dividend", "pos": "noun", "meaning": "The number being divided. It goes inside the long division box.", "example": "In 552 ÷ 24 = 23, the <b>dividend</b> is 552.", "emoji": "📦"}, {"word": "divisor", "pos": "noun", "meaning": "The number you are dividing BY. It goes outside the box.", "example": "In 552 ÷ 24 = 23, the <b>divisor</b> is 24.", "emoji": "🚪"}, {"word": "quotient", "pos": "noun", "meaning": "The answer to a division problem.", "example": "In 552 ÷ 24 = 23, the <b>quotient</b> is 23.", "emoji": "➗"}, {"word": "remainder", "pos": "noun", "meaning": "What is left over when a number does not divide evenly. It must be smaller than the divisor.", "example": "17 ÷ 5 = 3 R2. The <b>remainder</b> is 2.", "emoji": "🥫"}, {"word": "multiple", "pos": "noun", "meaning": "The answer when you multiply a number by 1, 2, 3, and so on.", "example": "24, 48, 72 and 96 are <b>multiples</b> of 24.", "emoji": "🔢"}], "notes": {"do": "He reads each card aloud, then covers it and says the meaning in his own words. Quick: 3 minutes.", "say": "These words are on your index card. Say each one out loud.", "ask": "Which number goes inside the box? Which goes outside? Which is the answer?", "listen": "Dividend inside, divisor outside, quotient on top."}}, {"type": "learn", "kick": "Learn", "title": "Remainders, and checking with multiplication", "text": "<b>5 more cans</b> arrive. Now it is <b>557 ÷ 6</b>.", "visual": {"kind": "longdiv", "text": "     92 R5\n   ____\n6 ) 557\n   -54\n   ---\n     17\n    -12\n    ---\n      5"}, "steps": [{"text": "Same steps: 55 ÷ 6 → 9, 55 − 54 = 1. Bring down the 7 to make <b>17</b>."}, {"text": "17 ÷ 6 → <b>2</b>. 2 × 6 = 12. 17 − 12 = <b>5</b>. There is nothing left to bring down."}, {"text": "The 5 is the <b>remainder</b>: 557 ÷ 6 = <b>92 R5</b>. The remainder must be <b>smaller than the divisor</b> (5 is less than 6)."}, {"text": "<b>Check with multiplication:</b> divisor × quotient + remainder = dividend. 6 × 92 + 5 = 552 + 5 = <b>557</b>. ✅"}], "tip": "Check every answer: multiply the quotient by the divisor, then add the remainder. You should get the dividend back.", "notes": {"do": "Whiteboard: he copies 557 ÷ 6 and works it step by step as you click through. He writes the check under it every time.", "say": "The check is your Lesson 1 skill doing a job. If the check does not give you the dividend, there is a mistake.", "ask": "What if your remainder came out as 8? What would that tell you?", "listen": "8 is bigger than 6, so another 6 fits. The quotient digit is too small."}}, {"type": "tap", "kick": "Try it", "title": "Remainders and the check", "text": "Whiteboard first. Write the check under every problem.", "items": [{"type": "fill", "q": "<b>389 ÷ 4 = ____</b> Type it like 5 R2.", "answers": ["97 R1", "97 r 1", "97r1", "97 remainder 1", "97 rem 1", "97 R 1", "97 remainder of 1", "97 with 1 left over", "97 with 1 left"], "why": "38 ÷ 4 → 9 (9 × 4 = 36), 2 left. Bring down 9: 29 ÷ 4 → 7 (7 × 4 = 28), 1 left. <b>97 R1</b>. Check: 4 × 97 + 1 = 389.", "no": "Start with 38, since 4 does not fit into 3.", "hint": "4 × 9 = 36. 38 − 36 = 2. Bring down the 9.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "Check your answer: <b>4 × 97 + 1 = ____</b>", "answers": ["389"], "why": "4 × 97 = 388, and 388 + 1 = <b>389</b>. It matches the dividend. ✅", "no": "Multiply 97 × 4 first. Then add 1.", "hint": "97 × 4: 7 × 4 = 28 (write 8, regroup 2), 9 × 4 = 36, then 36 + 2 = 38."}, {"type": "fill", "q": "<b>731 ÷ 8 = ____</b>", "answers": ["91 R3", "91 r 3", "91r3", "91 remainder 3", "91 rem 3", "91 R 3", "91 remainder of 3", "91 with 3 left over", "91 with 3 left"], "why": "73 ÷ 8 → 9 (9 × 8 = 72), 1 left. Bring down 1: 11 ÷ 8 → 1 (1 × 8 = 8), 3 left. <b>91 R3</b>. Check: 8 × 91 + 3 = 731.", "no": "Start with 73, since 8 does not fit into 7.", "hint": "8 × 9 = 72. 73 − 72 = 1. Bring down the 1.", "placeholder": "Example: 5 R2"}], "notes": {"do": "Hands off. He writes the work and the check on his whiteboard and shows you before he types.", "ask": "How did your check prove 91 R3?", "listen": "8 × 91 = 728, and 728 + 3 = 731. Watch for him typing 91.3 or 913: the answer format is 91 R3."}}, {"type": "learn", "kick": "Learn", "title": "Two-digit divisors: 552 ÷ 24", "text": "Back to Deja's real problem. Step 0: make a <b>multiples list</b> for 24. It turns guessing into looking.", "visual": {"kind": "bigtext", "text": "24 · 48 · 72 · 96 · 120", "sub": "multiples of 24 (24 × 1 to 24 × 5)"}, "steps": [{"text": "<b>Estimate.</b> 24 × 20 = 480 and 24 × 30 = 720. So 552 ÷ 24 is <b>between 20 and 30</b>."}, {"text": "<b>Divide.</b> 24 does not fit into 5. Look at <b>55</b>. The list says 48 fits and 72 is too big, so → <b>2</b>.", "visual": {"kind": "longdiv", "text": "      23\n    ____\n24 ) 552\n    -48\n    ---\n      72\n     -72\n     ---\n       0"}}, {"text": "<b>Multiply</b> 2 × 24 = 48. <b>Subtract</b> 55 − 48 = 7. <b>Bring down</b> the 2 to make <b>72</b>."}, {"text": "72 is on the list: 24 × 3 = 72. → <b>3</b>, with 0 left. 552 ÷ 24 = <b>23</b>."}, {"text": "<b>Check:</b> 24 × 23 = 552. ✅ Each pantry gets 23 cans. Is 23 between 20 and 30? Yes."}], "tip": "With a 2-digit divisor, write the multiples list first. Then each step is just looking it up.", "notes": {"do": "He writes the multiples list for 24 across the top of his whiteboard by adding 24 each time, then works 552 ÷ 24 under it as you click through.", "say": "Same four steps as before. The only new thing is the list.", "ask": "Why is 2 the first quotient digit and not 3?", "listen": "24 × 3 = 72 is more than 55. The biggest multiple that fits under 55 is 48."}}, {"type": "tap", "kick": "Try it", "title": "A two-digit divisor with a remainder", "text": "Deja's class ends up with <b>569</b> cans. Now it is <b>569 ÷ 24</b>. Use your multiples list: 24 · 48 · 72 · 96 · 120.", "items": [{"type": "fill", "q": "<b>569 ÷ 24 = ____</b> Type it like 5 R2.", "answers": ["23 R17", "23 r 17", "23r17", "23 remainder 17", "23 rem 17", "23 R 17", "23 remainder of 17", "23 with 17 left over", "23 with 17 left"], "why": "56 ÷ 24 → 2 (48), 56 − 48 = 8. Bring down the 9 to make 89. 89 ÷ 24 → 3 (72), 89 − 72 = 17. <b>23 R17</b>. 17 is smaller than 24. ✅", "no": "Start with 56. Which multiple of 24 fits under 56?", "hint": "48 fits under 56. 56 − 48 = 8. Bring down the 9.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "Check it: <b>24 × 23 + 17 = ____</b>", "answers": ["569"], "why": "24 × 23 = 552, and 552 + 17 = <b>569</b>. It matches the dividend. ✅", "no": "Multiply 24 × 23 first (you know it: Deja's 552). Then add 17.", "hint": "24 × 23 = 552."}, {"q": "Deja splits 569 cans evenly among 24 pantries. What does the <b>17</b> mean?", "choices": ["Each pantry gets 17 cans", "17 cans are left over after every pantry gets 23", "There are 17 pantries", "Deja needs 17 more cans"], "a": 1, "why": "Each pantry gets <b>23</b> cans, and <b>17</b> cans are left over. They cannot be shared evenly, because 17 is less than 24.", "no": ["Each pantry gets the quotient, 23.", null, "There are 24 pantries.", "The remainder is what is left over, not what is missing."]}], "notes": {"do": "Whiteboard first: multiples list at the top, then the long division, then the check. He shows his board before typing.", "say": "Same four steps, plus the list. And the remainder has to be smaller than 24.", "ask": "What does the 17 mean in Deja's story?", "listen": "23 cans for each pantry, 17 cans left over. If he says 'each pantry gets 17', point back to the quotient."}}, {"type": "learn", "kick": "Learn", "title": "Compare and contrast", "text": "Read Malia's and Theo's pieces again. Strong readers do not just pick a side. They notice what each person cares about most.", "visual": {"kind": "passage", "text": "<b>Malia writes (for the hamster):</b><br>“A class hamster would teach us real responsibility. We'd take turns feeding it, cleaning its cage, and learning about how animals live. My cousin's class had a guinea pig, and everyone learned so much about caring for something besides themselves. It made the whole class feel closer, too.”<br><br><b>Theo writes (against the hamster):</b><br>“I love animals, but a classroom isn't the best place for one. Someone has to remember to feed it every single day, including weekends and school breaks. A few kids in our class are allergic to fur, too. I think we should get a class fish tank instead. It's calming, and nobody's allergic to fish.”"}, "steps": [{"text": "<b>Compare (same):</b> Both care about the class. Both like animals. Both actually want some kind of class pet."}, {"text": "<b>Contrast (different):</b> Malia wants a hamster; Theo wants a fish tank."}, {"text": "<b>Contrast (different):</b> Malia focuses on what the class would <b>learn</b>. Theo focuses on <b>practical problems</b>: feeding it every day, even on breaks, and fur allergies."}, {"text": "<b>Why?</b> They weigh different things as most important. That is what makes a <b>viewpoint</b>."}], "tip": "Use clue words. Same: both, also, alike. Different: but, while, instead.", "notes": {"do": "Have him reread both pieces on this slide first. Then a whiteboard T-chart (Same | Different) from the pieces BEFORE you click the steps. This prepares him for Pathways Week 7 Reading on Thursday.", "say": "Compare is same. Contrast is different. Say a sentence with 'both' and a sentence with 'while.'", "ask": "Give me one sentence that compares them and one that contrasts them.", "listen": "'Both Malia and Theo care about the class.' 'Malia focuses on learning, while Theo focuses on daily care.'"}}, {"type": "tap", "kick": "Try it", "title": "Weigh the evidence", "visual": {"kind": "passage", "text": "<b>Malia writes (for the hamster):</b><br>“A class hamster would teach us real responsibility. We'd take turns feeding it, cleaning its cage, and learning about how animals live. My cousin's class had a guinea pig, and everyone learned so much about caring for something besides themselves. It made the whole class feel closer, too.”<br><br><b>Theo writes (against the hamster):</b><br>“I love animals, but a classroom isn't the best place for one. Someone has to remember to feed it every single day, including weekends and school breaks. A few kids in our class are allergic to fur, too. I think we should get a class fish tank instead. It's calming, and nobody's allergic to fish.”"}, "items": [{"q": "Which is the STRONGEST evidence in Theo's piece?", "choices": ["Fish are prettier than hamsters", "Theo just does not feel like it", "A few kids in the class are allergic to fur", "Theo's cousin has a pet"], "a": 2, "why": "It is a real fact that would affect students in the class. That makes it strong evidence.", "no": ["Theo never says that. It would only be a feeling anyway.", "That is not in his piece, and a feeling is weak evidence.", null, "That is Malia's cousin, and Theo never mentions a cousin."]}, {"q": "Why is Theo's fish tank idea a <b>compromise</b>?", "choices": ["It gives the class a pet but avoids the fur allergy problem", "It means the class gets no pet at all", "It means Malia wins the vote", "Fish tanks are required by the school"], "a": 0, "why": "Each side gets something: the class still has a pet (Malia's side), with no fur allergy problem (Theo's side).", "no": [null, "A fish tank IS a class pet.", "Malia wanted a hamster, not a fish tank.", "Nothing in the text says that."]}, {"type": "fill", "q": "Compare them: Malia and Theo BOTH want the class to have some kind of class ________. Type the word.", "answers": ["pet", "pets", "class pet", "animal", "animals"], "why": "Malia wants a hamster and Theo wants a fish tank, so both want a class <b>pet</b>.", "no": "What do a hamster and a fish tank have in common here?", "hint": "Malia wants a hamster. Theo wants fish."}], "notes": {"do": "He reads both pieces again and points to the exact sentence for each answer.", "ask": "Which is stronger evidence: 'my cousin's class loved it' or 'a few kids are allergic'? Why?", "listen": "Both are real details, but the allergy fact affects students in this class right now, so it weighs more."}}, {"type": "talk", "kick": "Over the break", "title": "You are the Head Planner", "text": "From Thursday, you lead the <b>Ferguson Family Feast Planner</b> at home. You plan one special family meal with real prices, a budget, a bigger recipe, fair leftovers and a taste-test.", "visual": {"kind": "emoji", "text": "🍽️ 🛒 🧮 🥧"}, "prompts": ["Read <b>What it is</b> on the Feast Planner together. What is your job?", "Look at Thursday, Friday and Saturday. What will you do each day?", "Which math from Lessons 1 and 2 will you use? Name one place you will multiply and one place you will divide."], "starters": ["My job is …", "On Thursday I will …", "I will multiply when … and divide when …"], "notes": {"do": "Open the Feast Planner page from the course page and hand him the printed packet (for Skyler and Ethan). Go over Thu Nov 12, Fri Nov 13 and Sat Nov 14 so he can lead them. Keep the parent answer key (last page) for Skyler.", "say": "You run this. Mom helps with prices, Dad is the interview guest, Joyce and Clyde have jobs too. On Dec 2 you present your poster to me for 3 to 5 minutes.", "ask": "When is your presentation, and what do you bring?", "listen": "Wed, Dec 2 at Lesson 3: the poster and worksheet pages 1 to 11."}}, {"type": "learn", "kick": "Wrap-up", "title": "Before you go", "text": "Long division is locked in. Here is your plan.", "steps": [{"text": "<b>Tonight, at home:</b> do the <b>Lesson 2 After-class lesson</b> on your own device. It ends with <b>Show What You Know</b>. Get <b>85</b>. It opens Lesson 3."}, {"text": "<b>Thursday:</b> do <b>Pathways Week 7 Reading</b> (The Class Pet Vote). Point to the exact sentence before every answer. Aim for 85."}, {"text": "<b>From Thursday on:</b> lead the <b>Feast Planner</b>, one day at a time. If Show What You Know or Week 7 Reading is under 85, retake it first (one try a day)."}, {"text": "<b>Every problem:</b> Divide, Multiply, Subtract, Bring down. Then the check: divisor × quotient + remainder = dividend."}, {"text": "<b>Wed, Dec 2:</b> Lesson 3. You open with your Feast Report poster (3 to 5 minutes)."}], "tip": "Remainder rules: add it back when you check, and it must be smaller than the divisor.", "notes": {"do": "Open the course page together and read the task list on today's card. Show What You Know is done at home on his own device, so it counts on his record; scores from this laptop are not recorded.", "say": "Tonight, Show What You Know. Thursday, Week 7 Reading. Then you are the Head Planner. See you Dec 2.", "ask": "Say the four division steps and the two remainder rules without looking.", "listen": "Divide, multiply, subtract, bring down; add the remainder back when checking; remainder smaller than the divisor."}}], "win": "You split the cans fairly, checked every answer and weighed both viewpoints. Deja's food drive is ready to deliver, and you are ready for the Feast Planner!", "prev": null, "prevTitle": ""});</script><script type="module" src="../../kce-progress/kce-progress.js" data-course="bb-ethan"></script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
