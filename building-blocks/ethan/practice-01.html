wrote: <b>56 × 27 = 352 + 1,120 = 1,472</b>. What went wrong?", "choices": ["56 × 7 should be 392. The regrouped 4 was never added.", "56 × 20 should be 112", "The rows should not be added", "Nothing. 1,472 is right."], "a": 0, "why": "6 × 7 = 42: write 2, regroup 4. 5 × 7 = 35, plus 4 = 39. So 56 × 7 = 392, and 392 + 1,120 = 1,512.", "no": [null, "56 × 20 = 1,120. It needs the 0.", "You always add the partial products.", "Check 56 × 7 again: 6 × 7 = 42. Where did the 4 go?"]}, {"type": "fill", "q": "<b>231 × 34 = ____</b>", "answers": ["7,854", "7854"], "why": "231 × 4 = 924 and 231 × 30 = 6,930. 924 + 6,930 = <b>7,854</b>.", "no": "Ones row: 231 × 4. Tens row: 0, then 231 × 3.", "hint": "231 × 4 = 924."}, {"q": "Which two partial products build <b>216 × 14</b>?", "choices": ["864 and 216", "844 and 2,160", "864 and 2,160", "2,160 and 8,640"], "a": 2, "why": "216 × 4 = 864 and 216 × 10 = 2,160. Total: 3,024.", "no": ["The second row needs a 0: 216 × 10 = 2,160.", "216 × 4: 6 × 4 = 24, write 4, regroup 2. 1 × 4 = 4 + 2 = 6. So 864.", null, "8,640 is 216 × 40. The ones digit of 14 is 4, so that row is 216 × 4 = 864."]}, {"type": "fill", "q": "The mural's sky is <b>38</b> tiles across and <b>15</b> tiles down. How many sky tiles?", "answers": ["570", "570 tiles"], "why": "38 × 15 = 190 + 380 = <b>570</b> tiles.", "no": "Tiles across × tiles down.", "hint": "38 × 5 = 190. 38 × 10 = 380."}, {"type": "fill", "q": "Paint costs <b>$13</b> a can. Malik buys <b>14</b> cans and pays with <b>$200</b>. How much change does he get?", "answers": ["$18", "18", "18 dollars"], "why": "13 × 14 = $182. $200 − $182 = <b>$18</b> change.", "no": "Two steps: multiply to find the cost, then subtract from $200.", "hint": "13 × 14 = 182."}, {"type": "fill", "q": "In 7 × 6 = 42 in the ones column, you write the 2 and ________ the 4 into the tens column.", "answers": ["regroup", "carry"], "why": "You <b>regroup</b> the 4 tens.", "no": "It means carrying extra value to the next column.", "hint": "It starts with r-e."}], [{"type": "fill", "q": "Round to the nearest ten. Estimate <b>88 × 32</b>: 90 × 30 = ____", "answers": ["2,700", "2700"], "why": "90 × 30 = <b>2,700</b>.", "no": "9 × 3 = 27. Then count the zeros.", "hint": "9 tens × 3 tens = 27 hundreds."}, {"q": "Estimate: 60 × 50 = 3,000. Which answer for <b>61 × 48</b> is reasonable?", "choices": ["109", "2,928", "29,280", "488"], "a": 1, "why": "2,928 is close to 3,000.", "no": ["109 is 61 + 48. That is adding.", null, "29,280 is about ten times too big. Look for an extra zero.", "488 is only 61 × 8. The tens row is missing."]}, {"type": "fill", "q": "Stack <b>54 × 37</b>. What is the first partial product, <b>54 × 7</b>?", "answers": ["378"], "why": "4 × 7 = 28 (write 8, regroup 2). 5 × 7 = 35 + 2 = 37. <b>378</b>.", "no": "Multiply 54 by the ones digit, 7.", "hint": "4 × 7 = 28. Write 8, regroup 2."}, {"type": "fill", "q": "Still <b>54 × 37</b>. What is the second partial product, <b>54 × 30</b>?", "answers": ["1,620", "1620"], "why": "Write the 0. 54 × 3 = 162. <b>1,620</b>.", "no": "Write the 0 first, then 54 × 3.", "hint": "54 × 3 = 162."}, {"type": "fill", "q": "Add the rows. <b>54 × 37 = ____</b>", "answers": ["1,998", "1998"], "why": "378 + 1,620 = <b>1,998</b>.", "no": "Add 378 and 1,620.", "hint": "8 ones; 7 + 2 = 9 tens; 3 + 6 = 9 hundreds; 1 thousand."}, {"type": "fill", "q": "<b>89 × 46 = ____</b>", "answers": ["4,094", "4094"], "why": "89 × 6 = 534 and 89 × 40 = 3,560. 534 + 3,560 = <b>4,094</b>.", "no": "Ones row, then the 0 and the tens row, then add.", "hint": "89 × 6 = 534."}, {"q": "Someone wrote: <b>39 × 52 = 78 + 1,950 = 1,928</b>. What went wrong?", "choices": ["39 × 2 should be 68", "39 × 50 should be 195", "Nothing. 1,928 is right.", "The rows were added wrong: 78 + 1,950 = 2,028"], "a": 3, "why": "39 × 2 = 78 and 39 × 50 = 1,950 are both right. 78 + 1,950 = 2,028.", "no": ["9 × 2 = 18 (write 8, regroup 1). 3 × 2 = 6 + 1 = 7. 78 is right.", "39 × 50 needs the 0: 1,950 is right.", "Add the rows again, one column at a time.", null]}, {"type": "fill", "q": "<b>315 × 24 = ____</b>", "answers": ["7,560", "7560"], "why": "315 × 4 = 1,260 and 315 × 20 = 6,300. 1,260 + 6,300 = <b>7,560</b>.", "no": "Ones row: 315 × 4. Tens row: 0, then 315 × 2.", "hint": "315 × 4 = 1,260."}, {"q": "Which two partial products build <b>132 × 25</b>?", "choices": ["660 and 2,640", "660 and 264", "550 and 2,640", "2,640 and 6,600"], "a": 0, "why": "132 × 5 = 660 and 132 × 20 = 2,640. Total: 3,300.", "no": [null, "The second row needs a 0: 132 × 20 = 2,640.", "132 × 5: 2 × 5 = 10, write 0, regroup 1. 3 × 5 = 15 + 1 = 16, write 6, regroup 1. 1 × 5 = 5 + 1 = 6. So 660.", "6,600 is 132 × 50. The ones digit of 25 is 5, so that row is 132 × 5 = 660."]}, {"type": "fill", "q": "The art room floor is <b>42</b> tiles long and <b>29</b> tiles wide. How many tiles?", "answers": ["1,218", "1218", "1,218 tiles", "1218 tiles"], "why": "42 × 29 = 378 + 840 = <b>1,218</b> tiles.", "no": "Tiles long × tiles wide.", "hint": "42 × 9 = 378. 42 × 20 = 840."}, {"type": "fill", "q": "Brushes cost <b>$11</b> each. Malik buys <b>16</b> brushes and pays with <b>$200</b>. How much change does he get?", "answers": ["$24", "24", "24 dollars"], "why": "11 × 16 = $176. $200 − $176 = <b>$24</b> change.", "no": "Two steps: multiply to find the cost, then subtract from $200.", "hint": "11 × 16 = 176."}, {"type": "fill", "q": "The answer to a division problem is called the ________.", "answers": ["quotient"], "why": "The answer to division is the <b>quotient</b>.", "no": "Product is for multiplying. This word is for dividing.", "hint": "It starts with q-u-o."}]]});</script></body></html>
