<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ethan · Lesson 2: Deja&#x27;s Food Drive and the Class Pet Vote</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L02", "label": "Lesson 2", "title": "Deja's Food Drive and the Class Pet Vote", "goal": "I can divide with long division, check with multiplication, explain what a remainder means, and compare two viewpoints using evidence from the text.", "date": "2026-10-28", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "Deja's Food Drive and the Class Pet Vote", "text": "Deja's class collected <b>552 cans</b> for <b>24 food pantries</b>. Every pantry needs a fair share. Today you learn <b>long division</b> to split big numbers. Then you read two classmates who see a class vote very differently, and you <b>compare</b> their viewpoints.", "visual": {"kind": "emoji", "text": "🥫➗🐹"}, "notes": {"do": "Before class: check his Lesson 1 Show What You Know score (Formspree). Set out base-ten blocks (5 flats, 6 rods, 2 units is enough), an index card, two highlighters (two colors), whiteboard and marker, pencil and paper. Math runs 9:30–10:05 (35 min); reading runs 10:05–10:30 (25 min).", "say": "Two jobs today. First 35 minutes: long division, step by step, with remainders and a check. Last 25 minutes: two kids, one class vote, and how to compare what they think.", "ask": "What do you remember about division with leftovers? What was 45 ÷ 6?", "listen": "7 R3 (6 × 7 = 42, 3 left). If he hesitates, that is fine: today builds that exact skill."}}, {"type": "talk", "kick": "Math Talk", "title": "Deja's problem", "text": "Deja's class has <b>552 cans</b>. There are <b>24 pantries</b>. Each pantry should get the same number of cans.", "visual": {"kind": "bigtext", "text": "552 ÷ 24 = ?", "sub": "cans ÷ pantries"}, "prompts": ["Why does each pantry need the <b>exact same</b> number?", "Is the answer closer to 2, 20 or 200? How do you know?", "What could Deja do if some cans are left over?"], "starters": ["Each pantry needs the same number because …", "I think it is close to … because …", "If cans are left over, Deja could …"], "notes": {"do": "2 to 3 minutes. Write his guess for 552 ÷ 24 in the corner of the whiteboard. We come back to it.", "ask": "How could multiplying help you guess? (24 × 10? 24 × 20?)", "listen": "24 × 20 = 480, so about 20. If he says 'about 20 something,' praise it: that is an estimate with multiplication, and it is exactly how we check today."}}, {"type": "tap", "kick": "Warm-up", "title": "Lesson 1 review and leftovers", "text": "Paper first, then type. The first one is from Lesson 1.", "items": [{"type": "fill", "q": "Lesson 1 skill. Stack it: <b>24 × 23 = ____</b>", "answers": ["552"], "why": "24 × 3 = 72 and 24 × 20 = 480. 72 + 480 = <b>552</b>. That is Deja's number of cans!", "no": "Ones row: 24 × 3. Tens row: write the 0, then 24 × 2. Add.", "hint": "24 × 3 = 72."}, {"type": "fill", "q": "<b>56 ÷ 7 = ____</b>", "answers": ["8"], "why": "7 × 8 = 56, so 56 ÷ 7 = <b>8</b>.", "no": "Think: 7 times what is 56?", "hint": "5, 6, 7, 8: 56 = 7 × 8."}, {"type": "fill", "q": "<b>47 ÷ 6 = ____</b> Type it like 5 R2.", "answers": ["7 R5", "7 r 5", "7r5", "7 remainder 5", "7 rem 5", "7 R 5", "7 remainder of 5", "7 with 5 left over", "7 with 5 left"], "why": "6 × 7 = 42 and 47 − 42 = 5. So <b>7 R5</b>.", "no": "How many 6s fit in 47 without going over?", "hint": "6 × 8 = 48 is too big. Try 6 × 7.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "Check it with multiplication: <b>6 × 7 + 5 = ____</b>", "answers": ["47"], "why": "6 × 7 = 42, and 42 + 5 = <b>47</b>. It matches, so 7 R5 is right.", "no": "Multiply first, then add the remainder.", "hint": "6 × 7 = 42."}], "notes": {"do": "He answers out loud, writes on paper, then types. Circle the 552 on the whiteboard: it comes back in 10 minutes.", "say": "Division and multiplication are a team. If 47 ÷ 6 = 7 R5, then 6 × 7 + 5 has to make 47.", "ask": "Why did you not say 8 R-something for 47 ÷ 6?", "listen": "6 × 8 = 48 is more than 47. The quotient is the biggest number that fits without going over."}}, {"type": "vocab", "kick": "Word Power", "title": "Math words for today", "text": "Tap each card to flip it. Read the word, the meaning and the example out loud.", "words": [{"word": "dividend", "pos": "noun", "meaning": "The number being divided. It goes inside the long division box.", "example": "In 552 ÷ 24 = 23, the <b>dividend</b> is 552.", "emoji": "📦"}, {"word": "divisor", "pos": "noun", "meaning": "The number you are dividing BY. It goes outside the box.", "example": "In 552 ÷ 24 = 23, the <b>divisor</b> is 24.", "emoji": "🚪"}, {"word": "quotient", "pos": "noun", "meaning": "The answer to a division problem.", "example": "In 552 ÷ 24 = 23, the <b>quotient</b> is 23.", "emoji": "➗"}, {"word": "remainder", "pos": "noun", "meaning": "What is left over when a number does not divide evenly. It must be smaller than the divisor.", "example": "569 ÷ 24 = 23 R17. The <b>remainder</b> is 17.", "emoji": "🥫"}, {"word": "multiple", "pos": "noun", "meaning": "The answer when you multiply a number by 1, 2, 3, and so on.", "example": "24, 48, 72 and 96 are <b>multiples</b> of 24.", "emoji": "🔢"}], "notes": {"do": "He reads each card aloud, then covers it and says the meaning in his own words.", "say": "You will type these from memory at the end of class and all week. Say each one out loud now.", "ask": "Which number goes inside the box? Which goes outside? Which is the answer?", "listen": "Dividend inside, divisor outside, quotient on top. Quotient is the word he has missed before: have him spell it out loud (q-u-o-t-i-e-n-t)."}}, {"type": "learn", "kick": "Hands-on", "title": "Long division: 552 ÷ 4", "text": "Deja first splits the 552 cans onto <b>4 carts</b>. Build <b>552</b> with blocks: 5 hundreds, 5 tens, 2 ones. Share them into 4 equal groups.", "visual": {"kind": "longdiv", "text": "    138\n   ____\n4 ) 552\n   -4\n   --\n    15\n   -12\n   ---\n     32\n    -32\n    ---\n      0"}, "steps": [{"text": "<b>Divide.</b> 5 hundreds ÷ 4 → <b>1</b> hundred in each group. Write the 1 above the 5."}, {"text": "<b>Multiply.</b> 1 × 4 = 4. <b>Subtract.</b> 5 − 4 = <b>1</b> hundred left. Trade it for 10 tens."}, {"text": "<b>Bring down</b> the 5: now there are <b>15</b> tens. 15 ÷ 4 → <b>3</b>. 3 × 4 = 12. 15 − 12 = <b>3</b> tens left. Trade them for 30 ones."}, {"text": "<b>Bring down</b> the 2: now there are <b>32</b> ones. 32 ÷ 4 → <b>8</b>. 8 × 4 = 32. 32 − 32 = <b>0</b>."}, {"text": "552 ÷ 4 = <b>138</b>. <b>Check</b> with Lesson 1: 138 × 4 = 552. ✅"}], "tip": "Divide, Multiply, Subtract, Bring down. Then do it again. (Dad, Mom, Sister, Brother.)", "notes": {"do": "Hands-on: he builds 552 with base-ten blocks and shares them into 4 groups on the table. Each trade (1 hundred for 10 tens, 3 tens for 30 ones) is a 'bring down.' He writes each step on paper as he does it with the blocks.", "say": "Every time you trade blocks, that is a bring down on paper. The paper and the blocks do the same thing.", "ask": "Why did we trade the leftover hundred for tens? What does the 3 in 138 mean?", "listen": "One hundred cannot be shared by 4 as a hundred, so it becomes 10 tens. The 3 means 3 tens (30 cans) in each group."}}, {"type": "tap", "kick": "Your turn", "title": "Your turn: 552 ÷ 6", "text": "Now the cans go onto <b>6 trucks</b>. Write it on paper: Divide, Multiply, Subtract, Bring down.", "items": [{"type": "fill", "q": "552 ÷ 6. The 5 is smaller than 6, so start with <b>55</b>. How many 6s fit in 55?", "answers": ["9"], "why": "6 × 9 = 54, and 6 × 10 = 60 is too big. So <b>9</b>.", "no": "Count by 6s: 48, 54, 60. Which is the biggest that fits?", "hint": "6 × 9 = 54."}, {"type": "fill", "q": "Multiply 9 × 6 = 54. Subtract: <b>55 − 54 = ____</b>", "answers": ["1"], "why": "55 − 54 = <b>1</b>. 1 is smaller than 6, so we keep going.", "no": "Subtract the 54 from 55.", "hint": "It is a small number."}, {"type": "fill", "q": "Bring down the 2 to make 12. How many 6s fit in <b>12</b>?", "answers": ["2"], "why": "6 × 2 = 12. So <b>2</b>, with 0 left.", "no": "Think 6 times what is 12?", "hint": "6 × 2 = 12."}, {"type": "fill", "q": "<b>552 ÷ 6 = ____</b>", "answers": ["92", "92 R0", "92 remainder 0"], "why": "55 ÷ 6 → 9 (9 × 6 = 54), 1 left. Bring down 2: 12 ÷ 6 → 2 (2 × 6 = 12), 0 left. <b>92</b>. Check: 6 × 92 = 552.", "no": "Put the two quotient digits together: 9 and 2.", "hint": "The 9 goes over the second 5; the 2 goes over the 2."}], "notes": {"do": "He talks through each step out loud while he writes. You only ask questions.", "ask": "Where does the 9 go on top? Why not over the first 5?", "listen": "6 does not fit into 5, so the first digit goes over the second 5 (the tens place). The answer has 2 digits, not 3."}}, {"type": "learn", "kick": "Learn", "title": "Remainders, and checking with multiplication", "text": "<b>5 more cans</b> arrive. Now it is <b>557 ÷ 6</b>.", "visual": {"kind": "longdiv", "text": "     92 R5\n   ____\n6 ) 557\n   -54\n   ---\n     17\n    -12\n    ---\n      5"}, "steps": [{"text": "Same steps: 55 ÷ 6 → 9, 55 − 54 = 1. Bring down the 7 to make <b>17</b>."}, {"text": "17 ÷ 6 → <b>2</b>. 2 × 6 = 12. 17 − 12 = <b>5</b>. There is nothing left to bring down."}, {"text": "The 5 is the <b>remainder</b>: 557 ÷ 6 = <b>92 R5</b>. The remainder must be <b>smaller than the divisor</b> (5 is less than 6)."}, {"text": "<b>Check with multiplication:</b> divisor × quotient + remainder = dividend. 6 × 92 + 5 = 552 + 5 = <b>557</b>. ✅"}], "tip": "Check every answer: multiply the quotient by the divisor, then add the remainder. You should get the dividend back.", "notes": {"do": "He writes the check under his work every time from now on: 6 × 92 + 5 = 557.", "say": "The check is your Lesson 1 skill doing a job. If the check does not give you the dividend, there is a mistake.", "ask": "What if your remainder came out as 8? What would that tell you?", "listen": "8 is bigger than 6, so another 6 fits. The quotient digit is too small."}}, {"type": "tap", "kick": "Try it", "title": "Remainders and the check", "text": "Paper first. Write the check under every problem.", "items": [{"type": "fill", "q": "<b>389 ÷ 4 = ____</b> Type it like 5 R2.", "answers": ["97 R1", "97 r 1", "97r1", "97 remainder 1", "97 rem 1", "97 R 1", "97 remainder of 1", "97 with 1 left over", "97 with 1 left"], "why": "38 ÷ 4 → 9 (9 × 4 = 36), 2 left. Bring down 9: 29 ÷ 4 → 7 (7 × 4 = 28), 1 left. <b>97 R1</b>. Check: 4 × 97 + 1 = 389.", "no": "Start with 38, since 4 does not fit into 3.", "hint": "4 × 9 = 36. 38 − 36 = 2. Bring down the 9.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "Check your answer: <b>4 × 97 + 1 = ____</b>", "answers": ["389"], "why": "4 × 97 = 388, and 388 + 1 = <b>389</b>. It matches the dividend. ✅", "no": "Multiply 97 × 4 first. Then add 1.", "hint": "97 × 4: 7 × 4 = 28 (write 8, regroup 2), 9 × 4 = 36, then 36 + 2 = 38."}, {"type": "fill", "q": "<b>731 ÷ 8 = ____</b>", "answers": ["91 R3", "91 r 3", "91r3", "91 remainder 3", "91 rem 3", "91 R 3", "91 remainder of 3", "91 with 3 left over", "91 with 3 left"], "why": "73 ÷ 8 → 9 (9 × 8 = 72), 1 left. Bring down 1: 11 ÷ 8 → 1 (1 × 8 = 8), 3 left. <b>91 R3</b>. Check: 8 × 91 + 3 = 731.", "no": "Start with 73, since 8 does not fit into 7.", "hint": "8 × 9 = 72. 73 − 72 = 1. Bring down the 1.", "placeholder": "Example: 5 R2"}], "notes": {"do": "Hands off. He writes the work and the check on paper before he types.", "ask": "How did your check prove 91 R3?", "listen": "8 × 91 = 728, and 728 + 3 = 731. Watch for him typing 91.3 or 913: the answer format is 91 R3."}}, {"type": "learn", "kick": "Learn", "title": "Two-digit divisors: 552 ÷ 24", "text": "Back to Deja's real problem. Step 0: make a <b>multiples list</b> for 24. It turns guessing into looking.", "visual": {"kind": "bigtext", "text": "24 · 48 · 72 · 96 · 120", "sub": "multiples of 24 (24 × 1 to 24 × 5)"}, "steps": [{"text": "<b>Estimate.</b> 24 × 20 = 480 and 24 × 30 = 720. So 552 ÷ 24 is <b>between 20 and 30</b>."}, {"text": "<b>Divide.</b> 24 does not fit into 5. Look at <b>55</b>. The list says 48 fits and 72 is too big, so → <b>2</b>.", "visual": {"kind": "longdiv", "text": "      23\n    ____\n24 ) 552\n    -48\n    ---\n      72\n     -72\n     ---\n       0"}}, {"text": "<b>Multiply</b> 2 × 24 = 48. <b>Subtract</b> 55 − 48 = 7. <b>Bring down</b> the 2 to make <b>72</b>."}, {"text": "72 is on the list: 24 × 3 = 72. → <b>3</b>, with 0 left. 552 ÷ 24 = <b>23</b>."}, {"text": "<b>Check:</b> 24 × 23 = 552. You already did that in the warm-up! ✅ Each pantry gets 23 cans. Is 23 between 20 and 30? Yes."}], "tip": "With a 2-digit divisor, write the multiples list first. Then each step is just looking it up.", "notes": {"do": "He builds the multiples list on an index card by adding 24 each time, then checks 24 × 5 = 120 with multiplication. He keeps the card for the rest of the math.", "say": "Same four steps as before. The only new thing is the list. Look back at your guess from 9:30.", "ask": "Why is 2 the first quotient digit and not 3?", "listen": "24 × 3 = 72 is more than 55. The biggest multiple that fits under 55 is 48."}}, {"type": "tap", "kick": "You lead", "title": "17 late cans: 569 ÷ 24", "text": "A late donor brings <b>17 more cans</b>. Now Deja has <b>569</b>. Use your multiples card. You tell me each step.", "items": [{"type": "fill", "q": "Multiples of 24: 24, 48, 72, 96, ____", "answers": ["120"], "why": "96 + 24 = <b>120</b>. Also 24 × 5 = 120.", "no": "Add 24 to 96.", "hint": "96 + 24."}, {"type": "fill", "q": "569 ÷ 24. How many 24s fit in <b>56</b>?", "answers": ["2"], "why": "48 fits and 72 is too big. So <b>2</b>, and 56 − 48 = 8.", "no": "Look at your multiples list.", "hint": "48 is less than 56. 72 is more."}, {"type": "fill", "q": "<b>569 ÷ 24 = ____</b>", "answers": ["23 R17", "23 r 17", "23r17", "23 remainder 17", "23 rem 17", "23 R 17", "23 remainder of 17", "23 with 17 left over", "23 with 17 left"], "why": "56 ÷ 24 → 2 (2 × 24 = 48), 8 left. Bring down 9: 89 ÷ 24 → 3 (3 × 24 = 72), 17 left. <b>23 R17</b>. Check: 24 × 23 + 17 = 569.", "no": "After 56 − 48 = 8, bring down the 9 to make 89. How many 24s fit in 89?", "hint": "72 fits in 89. 89 − 72 = 17.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "Check: <b>24 × 23 + 17 = ____</b>", "answers": ["569"], "why": "24 × 23 = 552, and 552 + 17 = <b>569</b>. ✅", "no": "You already know 24 × 23.", "hint": "552 + 17."}], "notes": {"do": "He is the teacher. He tells you every step and you write exactly what he says on the whiteboard, even if it is wrong. Let him catch it with the check.", "ask": "Is 17 an OK remainder? Why?", "listen": "Yes, because 17 is smaller than 24. If he gets 22 R41, ask: does another 24 fit in 41?"}}, {"type": "learn", "kick": "Learn", "title": "What does the remainder mean?", "text": "Deja packs <b>170 cans</b> into boxes that hold <b>24</b>. 170 ÷ 24 = <b>7 R2</b>. The answer depends on the question!", "visual": {"kind": "bigtext", "text": "170 ÷ 24 = 7 R2"}, "steps": [{"text": "<b>Round up.</b> How many boxes to pack <b>ALL</b> the cans? 7 boxes leave 2 cans out, so she needs <b>8</b> boxes."}, {"text": "<b>Drop it.</b> How many <b>FULL</b> boxes can she deliver? Only <b>7</b>. The 2 extra cans do not make a full box."}, {"text": "<b>The remainder is the answer.</b> How many cans are <b>left over</b>? <b>2</b> cans."}], "tip": "Read the question again after you divide. Ask: does everything need a place, do only full groups count, or does it want the leftovers?", "notes": {"do": "Write the three questions on the whiteboard. He answers each one before you click the step.", "say": "A remainder is not a mistake. It is information. The question tells you what to do with it.", "ask": "When would you ever round up? (Buses, boxes, tables: everyone or everything needs a spot.)", "listen": "He should say 8, 7 and 2 and explain each. Typing '7 R2' as the number of boxes is the mistake to catch."}}, {"type": "tap", "kick": "Try it", "title": "Use the remainder", "text": "Divide on paper. Then read the question again before you answer.", "items": [{"type": "fill", "q": "Volunteers ride in vans that hold <b>8</b> people. <b>30</b> volunteers are going. How many vans are needed?", "answers": ["4", "4 vans"], "why": "30 ÷ 8 = 3 R6. Three vans leave 6 people behind, so round up: <b>4</b> vans.", "no": "Every volunteer needs a seat. What do you do with the remainder?", "hint": "30 ÷ 8 = 3 R6."}, {"q": "Deja packs <b>90</b> cans in boxes of <b>12</b>. Only <b>FULL</b> boxes go on the truck. How many boxes go on the truck?", "choices": ["7 R6", "8", "6", "7"], "a": 3, "why": "90 ÷ 12 = 7 R6. Only full boxes count, so drop the remainder: <b>7</b> boxes.", "no": ["You can't put 7 R6 boxes on a truck. Use the remainder to decide.", "An 8th box would only have 6 cans, so it is not full.", "6 is the remainder (cans left over), not the number of boxes.", null]}, {"type": "fill", "q": "The class has <b>$95</b>. Bags of rice cost <b>$6</b> each. They buy as many bags as they can. How many dollars are left?", "answers": ["$5", "5", "5 dollars"], "why": "95 ÷ 6 = 15 R5. They buy 15 bags (6 × 15 = $90) and <b>$5</b> is left.", "no": "Divide 95 by 6. What does the remainder stand for here?", "hint": "6 × 15 = 90."}], "notes": {"do": "He says which of the three cases each problem is (round up, drop it, or the remainder is the answer) before he answers.", "listen": "Vans: round up. Truck: drop it. Money left: the remainder is the answer."}}, {"type": "tap", "kick": "Find the mistake", "title": "Be the checker", "text": "Each one has one mistake. Use the check to find it.", "items": [{"q": "Someone wrote: <b>95 ÷ 7 = 12 R11</b>. What went wrong?", "choices": ["7 × 12 is not 84", "Nothing. 12 R11 is right.", "The remainder 11 is bigger than 7, so another 7 fits. It is 13 R4.", "They should have divided 7 by 95"], "a": 2, "why": "A remainder must be smaller than the divisor. 7 × 13 = 91, and 95 − 91 = 4. So <b>13 R4</b>.", "no": ["7 × 12 = 84 is right. Look at the remainder.", "The check works (7 × 12 + 11 = 95), but 11 is bigger than 7. Another 7 fits.", null, "The dividend 95 is divided BY the divisor 7."]}, {"q": "Someone wrote: <b>552 ÷ 6 = 9 R1</b>. What went wrong?", "choices": ["They forgot to bring down the 2. The check gives 6 × 9 + 1 = 55, not 552.", "9 should be 8", "The remainder should be 6", "Nothing. 9 R1 is right."], "a": 0, "why": "After 55 − 54 = 1, bring down the 2 to make 12. 12 ÷ 6 = 2. So <b>92</b>.", "no": [null, "6 × 9 = 54 fits in 55. The 9 is right.", "A remainder of 6 is never OK when dividing by 6.", "Check: 6 × 9 + 1 = 55. That is not 552."]}, {"q": "Someone wrote: <b>696 ÷ 24 = 28 R24</b>. What went wrong?", "choices": ["24 × 28 is too big", "The remainder equals the divisor, so one more 24 fits. It is 29.", "Nothing. 28 R24 is right.", "They should round down to 28"], "a": 1, "why": "A remainder of 24 means another full 24 fits. 24 × 29 = 696, so <b>29</b>.", "no": ["24 × 28 = 672, which fits in 696.", null, "A remainder can never equal the divisor.", "Rounding is not the problem. Another whole 24 fits."]}], "notes": {"do": "He writes the check for each one on paper before he chooses. He must say WHICH step went wrong.", "say": "These are the three big division mistakes: a remainder that is too big, forgetting to bring down, and stopping one group early.", "ask": "Which mistake does the multiplication check catch? Which one needs the 'remainder smaller than divisor' rule?", "listen": "The check catches the forgotten bring-down (55, not 552). 12 R11 and 28 R24 pass the check, so he needs the remainder rule for those."}}, {"type": "tap", "kick": "Exit ticket", "title": "Math check", "text": "On your own. Paper, then the check, then type.", "items": [{"type": "fill", "q": "<b>634 ÷ 5 = ____</b>", "answers": ["126 R4", "126 r 4", "126r4", "126 remainder 4", "126 rem 4", "126 R 4", "126 remainder of 4", "126 with 4 left over", "126 with 4 left"], "why": "6 ÷ 5 → 1 (1 × 5 = 5), 1 left. Bring down 3: 13 ÷ 5 → 2 (2 × 5 = 10), 3 left. Bring down 4: 34 ÷ 5 → 6 (6 × 5 = 30), 4 left. <b>126 R4</b>. Check: 5 × 126 + 4 = 634.", "no": "Start with 6. Divide, multiply, subtract, bring down.", "hint": "6 ÷ 5 → 1, 1 left. Bring down 3: 13.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "<b>768 ÷ 32 = ____</b>", "answers": ["24", "24 R0", "24 remainder 0"], "why": "76 ÷ 32 → 2 (2 × 32 = 64), 12 left. Bring down 8: 128 ÷ 32 → 4 (4 × 32 = 128), 0 left. <b>24</b>. Check: 32 × 24 = 768.", "no": "Make a multiples list for 32 first: 32, 64, 96, 128 …", "hint": "76 ÷ 32 → 2 (64). 76 − 64 = 12. Bring down the 8.", "placeholder": "Example: 5 R2"}], "notes": {"do": "Hands off. Note his first answers. Then switch to reading (10:05).", "listen": "126 R4 and 24. Both right on the first try with the check written means he is ready for the Pathways Week 7 Math lesson on Tuesday."}}, {"type": "vocab", "kick": "Word Power", "title": "Reading words for today", "text": "Tap each card. Read the word, the meaning and the example out loud.", "words": [{"word": "viewpoint", "pos": "noun", "meaning": "The way a person sees or feels about something, based on what matters most to them.", "example": "Malia's <b>viewpoint</b> is that a hamster would teach responsibility.", "emoji": "👀"}, {"word": "compare", "pos": "verb", "meaning": "To look at how two or more things are the SAME.", "example": "When I <b>compare</b> Malia and Theo, I see they both care about the class.", "emoji": "🟰"}, {"word": "contrast", "pos": "verb", "meaning": "To look at how two or more things are DIFFERENT.", "example": "When I <b>contrast</b> them, Malia wants a hamster and Theo wants a fish tank.", "emoji": "↔️"}, {"word": "reasoning", "pos": "noun", "meaning": "The thinking or logic behind why someone believes something.", "example": "Theo's <b>reasoning</b>: a hamster needs care every day, even on breaks.", "emoji": "🧠"}, {"word": "evidence", "pos": "noun", "meaning": "Specific facts or details that support a viewpoint.", "example": "\"A few kids in our class are allergic to fur\" is <b>evidence</b>.", "emoji": "🔎"}, {"word": "persuasive", "pos": "adjective", "meaning": "Meant to convince the reader to agree.", "example": "Malia's piece is <b>persuasive</b> writing: she wants your vote.", "emoji": "📣"}, {"word": "compromise", "pos": "noun", "meaning": "A plan where each side gives up a little so both can agree.", "example": "A fish tank is a <b>compromise</b>: a class pet with no fur.", "emoji": "🤝"}], "notes": {"do": "He reads each card aloud and covers it. Spend extra time on evidence and compromise: he has had trouble typing those from memory.", "say": "Now we switch to reading. Two kids, one class vote, and two very different viewpoints.", "ask": "What is the difference between compare and contrast?", "listen": "Compare = how they are the same. Contrast = how they are different."}}, {"type": "tap", "kick": "Read", "title": "Malia's case", "text": "Mrs. Chen's class is voting on whether to get a class hamster. Read Malia's piece out loud.", "visual": {"kind": "passage", "text": "<b>Malia writes (for the hamster):</b><br>“A class hamster would teach us real responsibility. We'd take turns feeding it, cleaning its cage, and learning about how animals live. My cousin's class had a guinea pig, and everyone learned so much about caring for something besides themselves. It made the whole class feel closer, too.”"}, "items": [{"q": "What does Malia care about MOST in her piece?", "choices": ["How cute hamsters are", "Learning responsibility and bringing the class closer", "Getting out of homework", "Winning the vote no matter what"], "a": 1, "why": "She says a hamster 'would teach us real responsibility' and 'made the whole class feel closer.'", "no": ["She never says hamsters are cute. Look for what she says a pet would TEACH.", null, "Homework is not in her piece.", "She gives reasons. She does not say winning is what matters."]}, {"type": "fill", "q": "Malia's cousin's class had a pet. What kind of animal was it? Type it.", "answers": ["guinea pig", "a guinea pig", "guinea pigs", "a guineapig"], "why": "Malia writes: 'My cousin's class had a <b>guinea pig</b>.'", "no": "Look at the sentence about her cousin.", "hint": "It is two words. It is not a hamster."}, {"type": "fill", "q": "Malia says a class hamster would teach real ________. Type the word.", "answers": ["responsibility", "real responsibility"], "why": "Her first sentence: 'A class hamster would teach us real <b>responsibility</b>.'", "no": "Look at her first sentence.", "hint": "It starts with r-e-s-p."}], "notes": {"do": "He reads aloud and highlights Malia's reasons in color 1 on paper (or points to them on screen).", "ask": "Which sentence is her opinion? Which sentence is a real example?", "listen": "Opinion: a hamster would teach responsibility. Real example: her cousin's class had a guinea pig and everyone learned."}}, {"type": "tap", "kick": "Read", "title": "Theo's case", "text": "Now read Theo's piece out loud.", "visual": {"kind": "passage", "text": "<b>Theo writes (against the hamster):</b><br>“I love animals, but a classroom isn't the best place for one. Someone has to remember to feed it every single day, including weekends and school breaks. A few kids in our class are allergic to fur, too. I think we should get a class fish tank instead. It's calming, and nobody's allergic to fish.”"}, "items": [{"type": "fill", "q": "Theo says a few kids in the class are allergic to ____. Type the word.", "answers": ["fur", "animal fur"], "why": "Theo writes: 'A few kids in our class are allergic to <b>fur</b>.'", "no": "Look for the word allergic.", "hint": "It is a three-letter word."}, {"q": "Theo starts with <b>“I love animals, but…”</b> What does that tell you about his viewpoint?", "choices": ["He dislikes all animals", "He has never seen a hamster", "He likes animals, but thinks a classroom is not the best place for one", "He agrees with Malia completely"], "a": 2, "why": "He says he loves animals. The word <b>but</b> shows his worry is about the classroom, not about animals.", "no": ["He says 'I love animals,' so he does not dislike them.", "Nothing in his piece says that.", null, "He suggests a fish tank instead, so he does not agree completely."]}, {"type": "fill", "q": "What does Theo want the class to get instead of a hamster? Type it.", "answers": ["fish tank", "a fish tank", "a class fish tank", "class fish tank", "fish", "fish tanks", "an aquarium", "aquarium"], "why": "Theo writes: 'I think we should get a class <b>fish tank</b> instead.'", "no": "Look at his last two sentences.", "hint": "It is calming, and nobody is allergic to it."}], "notes": {"do": "He highlights Theo's reasons in color 2.", "ask": "Is Theo against ALL class pets? How do you know?", "listen": "No. He wants a fish tank. He is against a hamster because of daily care and fur allergies."}}, {"type": "learn", "kick": "Learn", "title": "Compare and contrast", "text": "Strong readers do not just pick a side. They notice what each person cares about most.", "visual": {"kind": "bigtext", "text": "compare = SAME · contrast = DIFFERENT"}, "steps": [{"text": "<b>Compare (same):</b> Both care about the class. Both like animals. Both actually want some kind of class pet."}, {"text": "<b>Contrast (different):</b> Malia wants a hamster; Theo wants a fish tank."}, {"text": "<b>Contrast (different):</b> Malia focuses on what the class would <b>learn</b>. Theo focuses on <b>practical problems</b>: feeding it every day, even on breaks, and fur allergies."}, {"text": "<b>Why?</b> They weigh different things as most important. That is what makes a <b>viewpoint</b>."}], "tip": "Use clue words. Same: both, also, alike. Different: but, while, instead.", "notes": {"do": "Hands-on: draw a T-chart on the whiteboard (Same | Different). He fills it from his two highlight colors BEFORE you click the steps. Then compare his chart to the steps.", "say": "Compare is same. Contrast is different. Say a sentence with 'both' and a sentence with 'while.'", "ask": "Give me one sentence that compares them and one that contrasts them.", "listen": "'Both Malia and Theo care about the class.' 'Malia focuses on learning, while Theo focuses on daily care.'"}}, {"type": "tap", "kick": "Try it", "title": "Weigh the evidence", "visual": {"kind": "passage", "text": "<b>Malia writes (for the hamster):</b><br>“A class hamster would teach us real responsibility. We'd take turns feeding it, cleaning its cage, and learning about how animals live. My cousin's class had a guinea pig, and everyone learned so much about caring for something besides themselves. It made the whole class feel closer, too.”<br><br><b>Theo writes (against the hamster):</b><br>“I love animals, but a classroom isn't the best place for one. Someone has to remember to feed it every single day, including weekends and school breaks. A few kids in our class are allergic to fur, too. I think we should get a class fish tank instead. It's calming, and nobody's allergic to fish.”"}, "items": [{"q": "Which is the STRONGEST evidence in Theo's piece?", "choices": ["Fish are prettier than hamsters", "Theo just does not feel like it", "A few kids in the class are allergic to fur", "Theo's cousin has a pet"], "a": 2, "why": "It is a real fact that would affect students in the class. That makes it strong evidence.", "no": ["Theo never says that. It would only be a feeling anyway.", "That is not in his piece, and a feeling is weak evidence.", null, "That is Malia's cousin, and Theo never mentions a cousin."]}, {"q": "Why is Theo's fish tank idea a <b>compromise</b>?", "choices": ["It gives the class a pet but avoids the fur and daily-feeding problems", "It means the class gets no pet at all", "It means Malia wins the vote", "Fish tanks are required by the school"], "a": 0, "why": "Each side gets something: the class still has a pet (Malia's side), with no fur allergy problem (Theo's side).", "no": [null, "A fish tank IS a class pet.", "Malia wanted a hamster, not a fish tank.", "Nothing in the text says that."]}, {"type": "fill", "q": "Compare them: Malia and Theo BOTH want the class to have some kind of class ________. Type the word.", "answers": ["pet", "pets", "class pet", "animal", "animals"], "why": "Malia wants a hamster and Theo wants a fish tank, so both want a class <b>pet</b>.", "no": "What do a hamster and a fish tank have in common here?", "hint": "Malia wants a hamster. Theo wants fish."}], "notes": {"do": "He reads both pieces again (scroll) and points to the exact sentence for each answer.", "ask": "Which is stronger evidence: 'my cousin's class loved it' or 'a few kids are allergic'? Why?", "listen": "Both are real details, but the allergy fact is about THIS class and affects real students, so most kids will weigh it more."}}, {"type": "talk", "kick": "Your viewpoint", "title": "How would you vote?", "text": "Use evidence from BOTH pieces.", "visual": {"kind": "emoji", "text": "🐹 🗳️ 🐠"}, "prompts": ["How would you vote: hamster, fish tank, or no pet? Give one piece of <b>evidence</b> from the text.", "What is the strongest point from the side you did NOT pick?", "Can you think of a different <b>compromise</b>?"], "starters": ["I would vote for … because the text says …", "The strongest point on the other side is …", "A compromise could be …"], "notes": {"do": "Tap the gold star when he quotes the text. Push for exact words from the passage, not just 'because I like fish.'", "ask": "Why is it useful to read BOTH pieces before you vote?", "listen": "Each writer points out things the other one does not. A good decision weighs the benefits AND the problems."}}, {"type": "tap", "kick": "Exit ticket", "title": "Words from memory", "text": "No word list. Type the word.", "items": [{"type": "fill", "q": "In 552 ÷ 24 = 23, the number 23 is the ________.", "answers": ["quotient", "the quotient", "a quotient", "an quotient"], "why": "23 is the answer, so it is the <b>quotient</b>.", "no": "It is the answer to a division problem.", "hint": "It starts with q-u-o."}, {"type": "fill", "q": "“A few kids in our class are allergic to fur” is a fact that supports Theo's viewpoint. A fact like that is called ________.", "answers": ["evidence", "an evidence"], "why": "Facts and details that support a viewpoint are <b>evidence</b>.", "no": "It is what you use to back up a viewpoint.", "hint": "It starts with e-v-i."}, {"type": "fill", "q": "A plan where each side gives up a little so both can agree is a ________.", "answers": ["compromise", "the compromise", "a compromise", "an compromise"], "why": "That is a <b>compromise</b>, like Theo's fish tank.", "no": "Theo's fish tank idea is one.", "hint": "It starts with c-o-m-p-r-o."}], "notes": {"do": "No peeking at the vocab slides. A missed word is said three times, spelled out loud, then typed again.", "listen": "Spelling counts: q-u-o-t-i-e-n-t, e-v-i-d-e-n-c-e, c-o-m-p-r-o-m-i-s-e."}}, {"type": "learn", "kick": "Wrap-up", "title": "Two big skills", "text": "You split big numbers fairly, and you weighed two viewpoints fairly.", "steps": [{"text": "<b>Long division:</b> Divide, Multiply, Subtract, Bring down. Repeat."}, {"text": "<b>Two-digit divisor?</b> Make a multiples list first."}, {"text": "<b>Check:</b> divisor × quotient + remainder = dividend. The remainder must be smaller than the divisor."}, {"text": "<b>Read the question again:</b> round up, drop the remainder, or the remainder is the answer."}, {"text": "<b>Reading:</b> compare (same), contrast (different), and weigh the evidence from BOTH sides."}], "tip": "Slow and right beats fast and wrong. Write the check, then type carefully.", "notes": {"do": "Open the course page together and read this week's task list, one day at a time.", "say": "Tonight: the after-class lesson and Show What You Know. A little each day after that. Tuesday: Pathways Week 7 Math.", "ask": "Say the four division steps and the check without looking.", "listen": "Divide, multiply, subtract, bring down; then divisor × quotient + remainder. If he skips the check, remind him: that is where the points are saved."}}], "win": "You split the cans fairly, checked every answer and weighed both viewpoints. Deja's food drive is ready to deliver!", "prev": "bb-ethan-L01", "prevTitle": "Lesson 1"});</script></body></html>
