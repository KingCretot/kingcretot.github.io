<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ethan · Lesson 1: Catch-up: Finish Lesson 1</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L01", "label": "Catch-up", "title": "Catch-up: Finish Lesson 1", "goal": "I can multiply 2- and 3-digit numbers by 2-digit numbers with no slips, and prove my answer is right.", "date": "2026-11-04", "mastery": 85, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Catch-up: Finish Lesson 1", "text": "No new lesson today. We make your multiplying <b>slip-proof</b>: right rows, every column lined up, rows added carefully. 💪", "visual": {"kind": "emoji", "text": "🧱✖️✅"}, "notes": {"do": "Graph paper, pencil, whiteboard and two marker colors. Look at any Graph Paper Practice, packet pages and index card he brought. Note what is missing.", "say": "Your method is right. Every answer on Friday was close. Today we hunt down the small slips, so close becomes correct.", "ask": "What did you finish this week? Show me your paper work.", "listen": "Which pages are done. He should know Lesson 2 is still locked until 85."}}, {"type": "tap", "kick": "Warm-up", "title": "Facts and tens", "text": "Type each answer. These are the building blocks for today.", "items": [{"type": "fill", "q": "<b>7 × 8 = ____</b>", "answers": ["56"], "why": "7 × 8 = <b>56</b>.", "no": "Think 7 × 7 = 49, plus one more 7.", "hint": "5, 6, 7, 8: 56 = 7 × 8."}, {"type": "fill", "q": "<b>40 × 6 = ____</b>", "answers": ["240"], "why": "4 × 6 = 24, so 4 tens × 6 = 24 tens = <b>240</b>.", "no": "40 is 4 tens. Do 4 × 6, then keep the zero.", "hint": "4 × 6 = 24. Now add one zero."}, {"type": "fill", "q": "<b>18 × 10 = ____</b>", "answers": ["180"], "why": "18 tens = <b>180</b>.", "no": "Times 10 makes each digit worth ten times more.", "hint": "18 tens is 180."}, {"type": "fill", "q": "<b>30 × 20 = ____</b>", "answers": ["600"], "why": "3 × 2 = 6, then two zeros: <b>600</b>.", "no": "Do 3 × 2, then count the zeros in both factors.", "hint": "3 × 2 = 6. There are two zeros in 30 and 20."}], "notes": {"do": "Out loud first, then typed. Fast and sure.", "ask": "Why does 30 × 20 have two zeros?", "listen": "One zero from 30 and one from 20: 3 tens × 2 tens = 6 hundreds."}}, {"type": "tap", "kick": "Your own four", "title": "Find the slip", "text": "These are the four you missed on Friday. Your setup was right every time. Work each one on graph paper, find the one slip, then type the right answer.", "items": [{"type": "fill", "q": "You chose 125 and 900 for <b>45 × 23</b>. What is <b>45 × 3</b>?", "answers": ["135"], "why": "5 × 3 = 15: write 5, regroup 1. 4 × 3 = 12, plus the regrouped 1 makes 13. <b>135</b>.", "no": "Multiply the ones first: 5 × 3 = 15. Write 5, regroup 1.", "hint": "4 × 3 = 12, then add the regrouped 1."}, {"type": "fill", "q": "So <b>45 × 23 = ____</b>", "answers": ["1,035", "1035"], "why": "135 + 900 = <b>1,035</b>. Estimate: 50 × 20 = 1,000. Close, so it is the right size.", "no": "Add the two rows: 135 + 900.", "hint": "135 + 900."}, {"type": "fill", "q": "You typed 1,708. <b>67 × 24 = ____</b>", "answers": ["1,608", "1608"], "why": "67 × 4 = 268 and 67 × 20 = 1,340. 268 + 1,340 = <b>1,608</b>. The slip was in adding the hundreds.", "no": "Rows: 67 × 4 and 67 × 20. Add one column at a time.", "hint": "268 + 1,340."}, {"type": "fill", "q": "You typed 426. <b>28 × 17 = ____</b>", "answers": ["476"], "why": "28 × 7 = 196 and 28 × 10 = 280. 196 + 280 = <b>476</b>.", "no": "28 × 7: 8 × 7 = 56, write 6, regroup 5. 2 × 7 = 14, plus 5 = 19.", "hint": "196 + 280."}, {"type": "fill", "q": "You typed 1,350 on Oct 26 and 1,630 on Friday. <b>135 × 12 = ____</b>", "answers": ["1,620", "1620"], "why": "135 × 2 = 270 and 135 × 10 = 1,350. 270 + 1,350 = <b>1,620</b>. 1,350 was only one row; 1,630 was a slip in the tens column.", "no": "There are two rows: 135 × 2 and 135 × 10. Add both.", "hint": "270 + 1,350."}], "notes": {"do": "He works each one on graph paper, one digit per square, regrouped digits in the second color. Before he types, he says which step slipped: ones row, regroup, or adding the rows.", "say": "Your setup was right on all four. The points were lost in one small step each time.", "ask": "Which step slipped? How would you catch it next time?", "listen": "135 (the regrouped 1 was dropped), 1,035, 1,608, 476, 1,620. Adding the rows is his most common slip: add one column at a time, ones first."}}, {"type": "learn", "kick": "Learn", "title": "Partial products, stacked", "text": "Now write the same two rows in a stack. Same math, less drawing.", "visual": {"kind": "longdiv", "text": "   18\n × 13\n-----\n   54  ← 18 × 3\n+ 180  ← 18 × 10\n-----\n  234"}, "steps": [{"text": "<b>Step 1.</b> Multiply 18 by the <b>ones</b> digit, 3: 18 × 3 = <b>54</b>. Write it on the first row."}, {"text": "<b>Step 2.</b> The 1 in 13 is really <b>1 ten</b>. Write a <b>0</b> in the ones place first. Then 18 × 1 = 18 goes in front of it: <b>180</b>."}, {"text": "<b>Step 3.</b> Add the rows: 54 + 180 = <b>234</b>. Same answer as the area model."}], "tip": "The 0 in the second row is not extra. It is there because you are multiplying by tens.", "notes": {"do": "He copies the stack onto graph paper, one digit per square, ones digits in one column. Regrouped digits go above in the second color.", "say": "First row: times the ones. Second row: write the 0, then times the tens. Then add one column at a time.", "ask": "What happens if you forget the 0?", "listen": "54 + 18 = 72, far from the estimate of 200."}}, {"type": "tap", "kick": "Find the mistake", "title": "Be the checker", "text": "Each problem has one mistake. Find it.", "items": [{"q": "Someone wrote: <b>18 × 13 = 54 + 18 = 72</b>. What went wrong?", "visual": {"kind": "longdiv", "text": "   18\n × 13\n -----\n   54\n + 18\n -----\n   72"}, "choices": ["8 × 3 is not 24", "The second row needs a 0: 18 × 10 = 180", "54 + 18 is not 72", "Nothing. 72 is right."], "a": 1, "why": "The 1 in 13 is 1 ten, so the second row is 180. 54 + 180 = 234.", "no": ["8 × 3 = 24 is right. The mistake is later.", null, "54 + 18 is 72. The adding is fine; the row is wrong.", "Estimate: 20 × 10 = 200. 72 is far too small."]}, {"q": "Someone wrote: <b>34 × 26 = 184 + 680 = 864</b>. What went wrong?", "choices": ["34 × 20 should be 68", "The rows were added wrong", "Nothing. 864 is right.", "34 × 6 should be 204. The regrouped 2 was never added."], "a": 3, "why": "4 × 6 = 24: write 4, regroup 2. 3 × 6 = 18, plus the regrouped 2 makes 20. So 34 × 6 = 204, and 204 + 680 = 884.", "no": ["34 × 20 = 680. It needs the 0.", "184 + 680 is 864. The adding is fine; the first row is wrong.", "Check 34 × 6 again: 4 × 6 = 24. Where did the 2 go?", null]}, {"q": "Someone wrote: <b>47 × 23 = 141 + 940 = 1,181</b>. What went wrong?", "choices": ["The rows were added wrong: 141 + 940 = 1,081", "47 × 3 should be 121", "47 × 20 should be 94", "Nothing. 1,181 is right."], "a": 0, "why": "47 × 3 = 141 and 47 × 20 = 940 are both right. 141 + 940 = 1,081.", "no": [null, "7 × 3 = 21 (write 1, regroup 2). 4 × 3 = 12, plus the regrouped 2 makes 14. 141 is right.", "47 × 20 needs the 0: 940 is right.", "Add the rows again, one column at a time."]}], "notes": {"do": "He checks each row on paper before choosing. He must say WHICH row is wrong and WHY.", "say": "These are the slips you have made: the missing 0, the forgotten regroup, and adding the rows.", "ask": "Which slip would the estimate catch? Which would it miss?", "listen": "The estimate catches the missing 0. It misses 864 vs 884 and 1,181 vs 1,081, so recheck every step."}}, {"type": "tap", "kick": "On your own", "title": "Three in a row", "text": "On your own. Estimate, stack it on graph paper, add one column at a time, then type. Get all three right before the retake.", "items": [{"type": "fill", "q": "<b>39 × 26 = ____</b>", "answers": ["1,014", "1014"], "why": "39 × 6 = 234 and 39 × 20 = 780. 234 + 780 = <b>1,014</b>. Estimate 40 × 30 = 1,200.", "no": "Ones row: 39 × 6. Tens row: write the 0, then 39 × 2.", "hint": "234 + 780."}, {"type": "fill", "q": "<b>58 × 34 = ____</b>", "answers": ["1,972", "1972"], "why": "58 × 4 = 232 and 58 × 30 = 1,740. 232 + 1,740 = <b>1,972</b>. Estimate 60 × 30 = 1,800.", "no": "Ones row: 58 × 4. Tens row: write the 0, then 58 × 3.", "hint": "232 + 1,740."}, {"type": "fill", "q": "<b>146 × 23 = ____</b>", "answers": ["3,358", "3358"], "why": "146 × 3 = 438 and 146 × 20 = 2,920. 438 + 2,920 = <b>3,358</b>. Estimate 150 × 20 = 3,000.", "no": "Ones row: 146 × 3. Tens row: write the 0, then 146 × 2.", "hint": "438 + 2,920."}], "notes": {"do": "Hands off. He works alone on graph paper and types. Note his first answers. All three right means he retakes Show What You Know now; a miss means one more problem with you first.", "listen": "1,014, 1,972, 3,358."}}, {"type": "learn", "kick": "Wrap-up", "title": "Tonight's plan", "text": "Close is not correct. Slow and checked is how you finish Lesson 1.", "visual": {"kind": "passage", "text": "✅ <b>Five steps:</b> estimate · ones row · 0 and tens row · add one column at a time · compare with the estimate.<br>▶ <b>Tonight:</b> if Show What You Know is not 85 yet, retake Lesson 1 one time, on paper first.<br>📝 <b>This week:</b> Lesson 1 Practice (Thursday, Monday) and the Graph Paper Practice.<br>📖 <b>Saturday:</b> Week 3 Reading, if it is under 85."}, "tip": "85 on Lesson 1 opens Lesson 2: long division with Deja's food drive.", "notes": {"do": "Open the course page and read the catch-up task list together, one day at a time.", "say": "No new lesson until Lesson 1 is done. Then long division, which uses everything you fixed today.", "ask": "Say the five steps without looking.", "listen": "Estimate, ones row, zero and tens row, add one column at a time, compare."}}], "win": "You estimated, stacked, regrouped and checked. Malik's mural is ready to order!", "prev": null, "prevTitle": ""});</script><script type="module" src="../../kce-progress/kce-progress.js" data-course="bb-ethan"></script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getCompu
