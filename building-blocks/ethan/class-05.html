<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ethan · Lesson 5: Feast Report and the Unit 2 Checkpoint</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L05", "label": "Lesson 5", "title": "Feast Report and the Unit 2 Checkpoint", "goal": "I can share my Feast Report and use every Unit 2 skill (multiplying, long division, fractions, decimals and four reading skills) to get ready for the Unit 2 Checkpoint.", "date": "2026-12-02", "mastery": 85, "color": "#C9A84C", "slides": [{"type": "hello", "title": "Welcome Back: Feast Report and Unit 2 Review", "text": "Welcome back, Head Planner! First you show off your <b>Feast Report poster</b>. Then we review every Unit 2 skill: multiplying big numbers, long division, fractions, decimals, and four reading skills. By the end of today you will know exactly what the <b>Unit 2 Checkpoint</b> asks, and how to get 85 or more.", "visual": {"kind": "emoji", "text": "🍽️🏆🧮📖"}, "notes": {"do": "Before class: check his Lesson 4 Show What You Know score (Formspree) and any Pathways Week 9 scores. Have him set up the Feast Report poster where you can both see it, with worksheet pages 1 to 11 beside it. Set out the whiteboard and marker, fraction strips (halves, thirds, fourths, sixths, twelfths), 7 index cards, two highlighters (two colors), pencil and paper. Math review runs 9:43–10:10; reading runs 10:10–10:25.", "say": "Two weeks is a long time! I can't wait to see what the Head Planner did. Then we get you ready for the Checkpoint.", "ask": "What was the best part of planning the feast?", "listen": "Any real answer. Let him talk for a minute: he led the whole project, and today starts with that win."}}, {"type": "talk", "kick": "Feast Report", "title": "Present your poster", "text": "You have 3 to 5 minutes. Walk me through your <b>Feast Report</b>, one part at a time.", "visual": {"kind": "emoji", "text": "🧾🥧⭐🗣️"}, "prompts": ["<b>The budget:</b> What was your total? Were you over or under the budget, and by how much?", "<b>The recipe:</b> Show one step of the math you used to make the recipe bigger.", "<b>The leftovers:</b> How did you share them? What did you do with the remainder?", "<b>Two viewpoints:</b> What did Mom think, and what did Dad think? Where did they agree?", "<b>The taste-test:</b> Which dish won, and what was its score out of 25?"], "starters": ["Our total was … and our budget was …, so we were …", "To make the recipe bigger, I …", "Mom said “…” but Dad said “…”", "The winner was … with … out of 25 stars."], "notes": {"do": "6 minutes. He presents first without interruptions (3 to 5 minutes), then you ask the prompts he skipped. Write one number from each part on the whiteboard (budget total, one recipe amount, the leftover remainder, the taste-test score). Praise the work out loud, specifically.", "say": "Every part of this poster is a Unit 2 skill. Your budget was Week 9 decimals. The recipe was multiplying and fractions. The leftovers were Week 7 division. The interview was Week 7 viewpoints.", "ask": "When you added the prices, why did you line up the decimal points?", "listen": "So tenths add to tenths and hundredths to hundredths (cents to cents). If his budget math has a slip, fix it together on the whiteboard and use it as a warm-up, not a correction."}}, {"type": "learn", "kick": "The plan", "title": "What the Checkpoint checks", "text": "The Unit 2 Checkpoint has one math skill and one reading skill from each week, plus questions that use two skills at once.", "visual": {"kind": "bigtext", "text": "4 weeks · 8 skills", "sub": "Weeks 6, 7, 8 and 9"}, "steps": [{"text": "<b>Week 6:</b> multiply big numbers with the standard algorithm (Malik's Mural) · <b>character change</b> (Amara's First Solo)."}, {"text": "<b>Week 7:</b> long division with 2-digit divisors (Deja's Food Drive) · <b>comparing two viewpoints</b> (The Class Pet Vote)."}, {"text": "<b>Week 8:</b> fractions with unlike denominators (Sophia's Garden Plot) · <b>author's purpose</b> (Ravi's Newsletter)."}, {"text": "<b>Week 9:</b> multiplying decimals (Elena's Market Stand) · <b>text structure and using two sources</b> (The Sleep Study)."}, {"text": "<b>Two skills at once:</b> money totals, half a pound, and fractions of a number. These are worth the most points!"}], "tip": "On the Checkpoint you get only 2 tries, and only a first-try answer earns points. Work every math problem on paper before you type.", "notes": {"do": "Point to the four Pathways weeks on the course page as you read each step.", "say": "There are no new skills today. Everything here is something you have already learned. Today is about getting each one right on the FIRST try.", "ask": "Which week do you feel strongest in? Which one feels shakiest?", "listen": "Write his shakiest week on the whiteboard and spend an extra minute there. Most kids name fractions or long division."}}, {"type": "vocab", "kick": "Word Power", "title": "New words for review day", "text": "Tap each card to flip it. Read the word, the meaning and the example out loud.", "words": [{"word": "simplest form", "pos": "noun", "meaning": "A fraction written with the smallest numbers possible. The numerator and the denominator can't both be divided by the same number (except 1).", "example": "6/8 in <b>simplest form</b> is 3/4.", "emoji": "✂️"}, {"word": "multi-step problem", "pos": "noun", "meaning": "A word problem that takes more than one step to solve. You do the steps one at a time, in order.", "example": "Finding the total and then the change from $10 is a <b>multi-step problem</b>.", "emoji": "🪜"}, {"word": "inverse operations", "pos": "noun", "meaning": "Two operations that undo each other, like multiplication and division.", "example": "42 × 23 = 966, so 966 ÷ 42 = 23. Multiplication and division are <b>inverse operations</b>.", "emoji": "🔄"}, {"word": "character change", "pos": "noun", "meaning": "How a character's feelings, beliefs or actions are different at the end of a story than at the start.", "example": "Lena's <b>character change</b>: annoyed by her brother at the start, glad to have him along at the end.", "emoji": "🦋"}, {"word": "turning point", "pos": "noun", "meaning": "The key moment in a story when a character's feelings or choices start to shift.", "example": "Losing Sam at the fair is the <b>turning point</b> for Lena.", "emoji": "↪️"}, {"word": "gradual", "pos": "adjective", "meaning": "Happening slowly, in small steps, not all at once.", "example": "Owen's change was <b>gradual</b>: week by week he joined in more.", "emoji": "🐢"}, {"word": "inference", "pos": "noun", "meaning": "Something you figure out from clues in the text, when the writer doesn't say it straight out.", "example": "Her heart was pounding, so my <b>inference</b> is that Lena was scared.", "emoji": "🕵️"}], "notes": {"do": "He reads each card aloud, then covers it and says the meaning in his own words. Hand him the 7 index cards: he writes one word on the front of each and finishes the backs at home on Friday.", "say": "Three math words and four reading words. Character change and turning point are Week 6 words, and the Checkpoint asks about character change right away.", "ask": "What is the turning point in your favorite movie?", "listen": "A moment where the character's feelings or choices start to shift. If he names the ending instead, ask: where did things START to change?"}}, {"type": "learn", "kick": "Week 6", "title": "Multiply: estimate, stack, add", "text": "Malik's mural skill: the <b>standard algorithm</b>. Estimate first, so you know whether your answer is reasonable.", "visual": {"kind": "longdiv", "text": "     53\n   × 27\n  -----\n    371  ← 53 × 7\n+ 1,060  ← 53 × 20\n  -----\n  1,431"}, "steps": [{"text": "<b>Estimate.</b> 53 is about 50 and 27 is about 30. 50 × 30 = <b>1,500</b>. The answer should be close to 1,500."}, {"text": "<b>Ones row.</b> 53 × 7 = <b>371</b>."}, {"text": "<b>Tens row.</b> Write the 0 first, because the 2 in 27 means 20. 53 × 20 = <b>1,060</b>."}, {"text": "<b>Add the rows.</b> 371 + 1,060 = <b>1,431</b>. That is close to 1,500, so it is <b>reasonable</b>."}, {"text": "<b>3-digit × 1-digit</b> is one row: ones, then tens, then hundreds, regrouping as you go."}], "tip": "Forgetting the 0 in the tens row is the number one Week 6 mistake. Say “write the 0” out loud every time.", "notes": {"do": "He says each step out loud while you write it on the whiteboard. Regrouped numbers go in the second marker color.", "ask": "Why do we write a 0 at the start of the tens row?", "listen": "Because we are multiplying by 20, not 2. Without the 0, the row is 10 times too small."}}, {"type": "tap", "kick": "Your turn", "title": "Week 6 on paper", "text": "Estimate, stack it on paper, then type.", "items": [{"type": "fill", "q": "<b>67 × 43 = ____</b>", "answers": ["2,881", "2881"], "why": "67 × 3 = 201 and 67 × 40 = 2,680. 201 + 2,680 = <b>2,881</b>. Estimate: 70 × 40 = 2,800, so 2,881 is reasonable.", "no": "Ones row first. Then write the 0 for the tens row and multiply by the tens digit. Add the rows.", "hint": "67 × 3 = 201."}, {"type": "fill", "q": "Watch the 0 in the middle: <b>408 × 7 = ____</b>", "answers": ["2,856", "2856"], "why": "408 × 7 = <b>2,856</b>. Estimate: 400 × 7 = 2,800, so 2,856 is reasonable.", "no": "Multiply the ones, then the tens, then the hundreds. Regroup when a column is 10 or more.", "hint": "7 × 8 = 56. Write the 6 and regroup."}], "notes": {"do": "Paper first. He writes his estimate next to each problem before he multiplies.", "ask": "What is 7 × 0, and what do you do with the regrouped number in 408 × 7?", "listen": "7 × 8 = 56: write 6, regroup 5. 7 × 0 = 0, plus the 5 = 5. 7 × 4 = 28. Answer 2,856. A common slip is writing 2,806 (dropping the regrouped 5)."}}, {"type": "learn", "kick": "Week 7", "title": "Long division with a 2-digit divisor", "text": "Deja's skill: Divide, Multiply, Subtract, Bring down, then Check. A <b>multiples list</b> makes the Divide step easy.", "visual": {"kind": "longdiv", "text": "       23\n     ____\n42 ) 966\n    -84\n    ---\n     126\n    -126\n    ----\n       0"}, "steps": [{"text": "<b>Multiples of 42:</b> 42, 84, 126, 168, 210."}, {"text": "<b>96 ÷ 42 → 2.</b> 2 × 42 = 84. 96 − 84 = 12."}, {"text": "<b>Bring down the 6: 126.</b> 126 ÷ 42 → 3 (from the list). 126 − 126 = 0. The answer is <b>23</b>."}, {"text": "<b>Check with the inverse operation.</b> 42 × 23 = 966. ✅ Multiplication undoes division."}, {"text": "<b>Remainders in stories.</b> If everyone must fit (buses, boxes), round UP. If you share things out, the remainder is left over."}], "tip": "The remainder must always be smaller than the divisor. If it isn't, your quotient digit is too small.", "notes": {"do": "He writes the multiples list for 42 on paper first. Then he does 966 ÷ 42 with you, step by step.", "ask": "How do you check 966 ÷ 42 = 23?", "listen": "42 × 23 = 966 (multiplication and division are inverse operations). Push for the word inverse."}}, {"type": "tap", "kick": "Your turn", "title": "Week 7 on paper", "text": "Write a multiples list if it helps. Write the check.", "items": [{"type": "fill", "q": "<b>735 ÷ 21 = ____</b>", "answers": ["35", "35 R0", "35 remainder 0"], "why": "73 ÷ 21 → 3 (3 × 21 = 63), 10 left. Bring down 5: 105 ÷ 21 → 5 (5 × 21 = 105), 0 left. <b>35</b>. Check: 21 × 35 = 735.", "no": "Divide, multiply, subtract, bring down. Then write the check: divisor × quotient (+ remainder).", "hint": "Multiples of 21: 21, 42, 63, 84, 105."}, {"type": "fill", "q": "<b>89 ÷ 17 = ____</b> Type it like 5 R2.", "answers": ["5 R4", "5 r 4", "5r4", "5 remainder 4", "5 rem 4", "5 R 4", "5 remainder of 4", "5 with 4 left over", "5 with 4 left"], "why": "89 ÷ 17 → 5 (5 × 17 = 85), 4 left. <b>5 R4</b>. Check: 17 × 5 + 4 = 89.", "no": "Divide, multiply, subtract, bring down. Then write the check: divisor × quotient (+ remainder).", "hint": "Multiples of 17: 17, 34, 51, 68, 85.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "250 students are going on a field trip. Each bus holds <b>48</b> students. How many buses do they need?", "answers": ["6", "6 buses", "six", "six buses"], "why": "250 ÷ 48 → 5 (5 × 48 = 240), 10 left. 5 R10. The 10 students left over still need a seat, so they need one more bus: <b>6 buses</b>.", "no": "Divide 250 by 48. Then think: can 10 students stay home?", "hint": "250 ÷ 48 = 5 R10.", "placeholder": "Type a number"}], "notes": {"do": "He divides on paper and writes the check under each one.", "ask": "For the buses, why is the answer 6 and not 5?", "listen": "5 buses carry only 240 students; the other 10 still need a bus. Pathways crisis questions love this round-up case."}}, {"type": "learn", "kick": "Week 8", "title": "Fractions: common denominator first", "text": "Sophia's skill. Same four steps for adding, subtracting and comparing.", "visual": {"kind": "bigtext", "text": "3/4 − 2/5 = 7/20", "sub": "15/20 − 8/20"}, "steps": [{"text": "<b>1. Common denominator.</b> Multiples of 4: 4, 8, 12, 16, 20. Multiples of 5: 5, 10, 15, 20. Use <b>20</b>."}, {"text": "<b>2. Rename.</b> 3/4 = 15/20 and 2/5 = 8/20."}, {"text": "<b>3. Subtract the numerators.</b> 15/20 − 8/20 = <b>7/20</b>. Keep the denominator."}, {"text": "<b>4. Simplest form.</b> 7 and 20 can't both be divided by the same number, so 7/20 is done."}, {"text": "<b>Compare 5/6 and 4/5.</b> Use 30: 5/6 = 25/30 and 4/5 = 24/30. 25 is more than 24, so <b>5/6</b> is bigger."}], "tip": "Never add or subtract the denominators. And Pathways wants simplest form unless it says otherwise.", "notes": {"do": "If fractions are his shakiest week, use the strips: 1/2 = 3/6 and 1/3 = 2/6 before the board example.", "ask": "5/6 and 4/5 are each one piece away from a whole. Which missing piece is smaller?", "listen": "1/6 is smaller than 1/5, so 5/6 is closer to 1: bigger. A nice check that agrees with 25/30 vs 24/30."}}, {"type": "tap", "kick": "Your turn", "title": "Week 8 on paper", "text": "Four steps on paper. Then type in simplest form.", "items": [{"type": "fill", "q": "<b>3/8 + 1/6 = ____</b> Type it in simplest form.", "answers": ["13/24"], "why": "Multiples of 8: 8, 16, 24. Multiples of 6: 6, 12, 18, 24. The common denominator is <b>24</b>. 3/8 = 9/24 and 1/6 = 4/24. 9/24 + 4/24 = 13/24. <b>13/24</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>5/6 − 3/10 = ____</b> Type it in simplest form.", "answers": ["8/15"], "why": "Multiples of 6: 6, 12, 18, 24, 30. Multiples of 10: 10, 20, 30. The common denominator is <b>30</b>. 5/6 = 25/30 and 3/10 = 9/30. 25/30 − 9/30 = 16/30. 16 and 30 can both be divided by 2: 16/30 = <b>8/15</b>.", "no": "Did you subtract the bottom numbers too? Never do that. Rename both fractions with a common denominator, then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4", "hint": "Use 30: 5/6 = 25/30 and 3/10 = 9/30. Then simplify."}, {"type": "fill", "q": "Which is bigger, <b>2/3</b> or <b>7/10</b>? Type the bigger fraction.", "answers": ["7/10"], "why": "Common denominator 30: 2/3 = 20/30 and 7/10 = 21/30. 21/30 is more than 20/30, so <b>7/10</b> is bigger.", "no": "Rename both with a common denominator. Then compare the numerators.", "hint": "Use 30: 2/3 = 20/30. What is 7/10 in thirtieths?", "placeholder": "Example: 3/4"}], "notes": {"do": "Hands off unless he is stuck for more than a minute.", "ask": "What common denominator did you use for 3/8 + 1/6? Why not 48?", "listen": "24 is the smallest; 48 works too but then he must simplify 26/48 to 13/24."}}, {"type": "learn", "kick": "Week 9", "title": "Decimals: multiply, then place the point", "text": "Elena's skill. Multiply like whole numbers, then put the decimal point back.", "visual": {"kind": "bigtext", "text": "$3.35 × 6 = $20.10", "sub": "335 × 6 = 2,010 → 2 decimal places"}, "steps": [{"text": "<b>Ignore the point.</b> 335 × 6 = 2,010."}, {"text": "<b>Count decimal places.</b> 3.35 has 2 digits after the point, so the answer has 2: <b>20.10</b>."}, {"text": "<b>Estimate.</b> $3.35 is between $3 and $3.50. $3 × 6 = $18 and $3.50 × 6 = $21. $20.10 is reasonable. (201.0 or 2.01 would not be.)"}, {"text": "<b>Fractions are decimals too.</b> 1/2 = 0.5 · 1/4 = 0.25 · 3/4 = 0.75 · 1/5 = 0.2 · 1/10 = 0.1"}, {"text": "<b>Half a pound</b> is 0.5 lb. Multiplying by 0.5 is the same as finding half: half of $9.40 is <b>$4.70</b>."}], "tip": "Money always has two digits after the point: $20.10, not $20.1.", "notes": {"do": "He writes the five fraction-decimal pairs on an index card and keeps it for the week.", "ask": "How do you know $201.00 can't be right for $3.35 × 6?", "listen": "The estimate is about $20. $201 is ten times too big. The estimate catches a misplaced decimal point every time."}}, {"type": "tap", "kick": "Your turn", "title": "Week 9 on paper", "text": "Multiply, count the decimal places, then check with an estimate.", "items": [{"type": "fill", "q": "Peaches cost <b>$2.15</b> a pound. A customer buys <b>4</b> pounds. What do the peaches cost?", "answers": ["8.60", "8.6", "$8.60", "$8.6"], "why": "Ignore the decimal point: 215 × 4 = 860. 2.15 has 2 decimal places, so the answer has 2: <b>$8.60</b>. Estimate: $2.15 is about $2, and $2 × 4 = $8, so $8.60 is reasonable.", "no": "Multiply like whole numbers first. Then count the digits after the decimal point and put it back. Check with an estimate.", "hint": "215 × 4 = 860.", "placeholder": "Example: 4.50"}, {"type": "fill", "q": "Type 1/5 as a decimal: <b>1/5 = ____</b>", "answers": ["0.20", "0.2", ".20", ".2"], "why": "1/5 means 1 ÷ 5 = <b>0.2</b> (two tenths). 2/10 = 1/5.", "no": "Think: how many tenths is 1/5? 1/5 = 2/10.", "hint": "1/5 = 2/10.", "placeholder": "Example: 0.5"}, {"type": "fill", "q": "Almonds cost <b>$7.80</b> a pound. A customer asks for <b>half a pound</b>. What do they cost?", "answers": ["3.90", "3.9", "$3.90", "$3.9"], "why": "Half a pound is 0.5 lb. Half of $7.80 is <b>$3.90</b> ($7.80 ÷ 2). Same as $7.80 × 0.5.", "no": "Half a pound costs half the price of a whole pound.", "hint": "Half of $7 is $3.50. Half of $0.80 is $0.40.", "placeholder": "Example: 4.50"}], "notes": {"do": "Paper first. He says his estimate before he types.", "ask": "Why does half a pound cost half the price?", "listen": "Because the price is for 1 whole pound, and 0.5 = 1/2 of a pound. Watch for $15.60 (doubling instead of halving)."}}, {"type": "learn", "kick": "Two skills at once", "title": "Fractions of a number and money totals", "text": "The Checkpoint's biggest questions use two weeks at once. Slow down and do one step at a time.", "visual": {"kind": "bigtext", "text": "3/4 of 36 = 27", "sub": "36 ÷ 4 = 9, then 9 × 3 = 27"}, "steps": [{"text": "<b>A fraction of a number.</b> 1/4 of 36 means 36 ÷ 4 = <b>9</b>. For 3/4 of 36, take 3 of those parts: 9 × 3 = <b>27</b>."}, {"text": "<b>Garden problem.</b> A 40-row plot is 1/4 squash and 2/5 beans. Together: 1/4 + 2/5 = 5/20 + 8/20 = <b>13/20</b> of the plot."}, {"text": "13/20 of 40: 40 ÷ 20 = 2, and 2 × 13 = 26 rows used. Empty rows: 40 − 26 = <b>14</b>."}, {"text": "<b>Money problem.</b> 3 lb of apples at $1.80 a pound = $5.40. Half a pound of grapes at $2.60 a pound = $1.30."}, {"text": "Total: $5.40 + $1.30 = <b>$6.70</b> (line up the points). Change from $10.00: $10.00 − $6.70 = <b>$3.30</b>."}], "tip": "Read the question again before you type: does it ask for the part used, the part left, the total, or the change?", "notes": {"do": "Draw the 40-row plot as a rectangle cut into 20 strips of 2 rows. He shades 5 strips for squash and 8 for beans, then counts the 7 empty strips (14 rows).", "say": "These questions are worth the most points on the Checkpoint. Underline what the question asks for before you start.", "ask": "In the garden problem, what does the question want: rows used or rows empty?", "listen": "Empty. The trap is typing 26 (used) instead of 14 (empty)."}}, {"type": "tap", "kick": "You lead", "title": "Two-step problems", "text": "Underline what the question asks for. Then work it on paper.", "items": [{"type": "fill", "q": "A class has <b>32</b> students. <b>3/8</b> of them ride the bus. How many students ride the bus?", "answers": ["12", "12 students", "twelve"], "why": "1/8 of 32 is 32 ÷ 8 = 4. 3/8 is 3 of those parts: 4 × 3 = <b>12</b>.", "no": "Find 1/8 of 32 first (divide by 8). Then multiply by 3.", "hint": "32 ÷ 8 = 4.", "placeholder": "Type a number"}, {"type": "fill", "q": "A 30-row garden is <b>2/5</b> corn and <b>1/3</b> beans. The rest is empty. How many rows are <b>empty</b>?", "answers": ["8", "8 rows", "eight"], "why": "2/5 + 1/3 = 6/15 + 5/15 = 11/15 of the garden is planted. 11/15 of 30: 30 ÷ 15 = 2, and 2 × 11 = 22 rows. Empty: 30 − 22 = <b>8</b>.", "no": "Add the fractions first. Then find that fraction of 30. Then subtract from 30.", "hint": "2/5 + 1/3 = 11/15. 30 ÷ 15 = 2.", "placeholder": "Type a number"}, {"type": "fill", "q": "2 lb of cheese at <b>$4.15</b> a pound and half a pound of olives at <b>$5.80</b> a pound. The customer pays with <b>$20.00</b>. How much change?", "answers": ["8.80", "8.8", "$8.80", "$8.8"], "why": "Cheese: $4.15 × 2 = $8.30. Olives: half of $5.80 = $2.90. Total: $8.30 + $2.90 = $11.20. Change: $20.00 − $11.20 = <b>$8.80</b>.", "no": "Three steps: the cheese cost, the olives cost, then the total. Subtract the total from $20.00.", "hint": "The total is $11.20.", "placeholder": "Example: 4.50"}], "notes": {"do": "He leads: he reads each problem aloud, underlines the question, and tells you the plan BEFORE he computes.", "ask": "What is your plan for the change problem?", "listen": "Cheese, olives, total, then subtract from $20. If he jumps to subtracting $4.15 from $20, stop and reread."}}, {"type": "tap", "kick": "Find the mistake", "title": "Be the checker: one from each week", "text": "Each one has a mistake. Find it.", "items": [{"q": "Someone multiplied <b>39 × 24</b> and wrote the rows <b>156</b> and <b>78</b>, then <b>156 + 78 = 234</b>. What went wrong?", "choices": ["They added the two rows. You should multiply them instead: 156 × 78.", "Nothing. 39 × 4 = 156 and 39 × 2 = 78, so 156 + 78 = 234 is right.", "They forgot the 0 in the tens row. It is 780, so the answer is 936.", "The ones row is wrong. 39 × 4 = 166, so the answer is 166 + 78 = 244."], "a": 2, "why": "39 × 20 is 780, not 78. With the 0: 156 + 780 = <b>936</b>. Estimate: 40 × 20 = 800, so 234 is far too small.", "no": ["The rows are always added. The trouble is the tens row.", "The 2 in 24 means 20, so the tens row is 39 × 20 = 780, not 78. Estimate: 40 × 20 = 800.", null, "39 × 4 = 156, so the ones row is right."]}, {"q": "Someone wrote <b>100 ÷ 16 = 5 R20</b>. What is wrong?", "choices": ["20 is bigger than 16, so 16 fits once more: 6 R4.", "Nothing. The check works: 16 × 5 + 20 = 100.", "The remainder is wrong. 100 − 80 = 2, so it is 5 R2.", "16 does not go into 100, so you can't divide 100 by 16."], "a": 0, "why": "A remainder must be smaller than the divisor. 16 × 6 = 96, and 100 − 96 = 4: <b>6 R4</b>.", "no": [null, "The check works, but 20 is bigger than 16. Another 16 fits inside it.", "100 − 80 is 20, not 2. And 20 is still bigger than 16.", "You can: 16 × 6 = 96, with 4 left over."]}, {"q": "Someone wrote <b>3/4 + 1/8 = 4/12</b>. What went wrong?", "choices": ["It was a subtraction problem, so it should be 3/4 − 1/8 = 5/8.", "4/12 is right, but it must be simplified: 4/12 = 1/3.", "Nothing. 3 + 1 = 4 and 4 + 8 = 12, so 4/12 is right.", "They added the denominators. 3/4 = 6/8, so it is 7/8."], "a": 3, "why": "Rename 3/4 as 6/8. Then 6/8 + 1/8 = <b>7/8</b>. 4/12 = 1/3 is even less than 3/4 by itself, so it can't be right.", "no": ["The problem says add (+). The mistake is HOW they added.", "1/3 is less than 3/4. Adding 1/8 can't make it smaller.", "Never add the denominators. Estimate: 3/4 alone is more than 1/2, but 4/12 is less than 1/2.", null]}, {"q": "Someone wrote <b>$1.35 × 4 = $54.00</b>. What went wrong?", "choices": ["They multiplied wrong: 135 × 4 is 450, so the answer is $4.50.", "The decimal point is in the wrong place. It is $5.40.", "Nothing. 135 × 4 = 540, so $54.00 is right.", "Too many decimal places were counted. It is $0.54."], "a": 1, "why": "135 × 4 = 540, and 1.35 has 2 decimal places, so the answer is <b>$5.40</b>. Estimate: about $1 × 4 = $4, not $54.", "no": ["135 × 4 = 540. The digits are right; the decimal point is not.", null, "Estimate: $1.35 is about $1, and $1 × 4 = $4. $54 is way too much.", "$0.54 is too small: 4 items at more than $1 each cost more than $4."]}], "notes": {"do": "For each one he says which week it is from, then proves the mistake with an estimate or a check.", "say": "These four mistakes cost the most points on Pathways: the missing 0, a too-big remainder, adding denominators, and a lost decimal point.", "ask": "Which of these mistakes would an estimate catch?", "listen": "The first, third and fourth: each answer is far from the estimate. The remainder mistake is caught by the rule: remainder smaller than the divisor."}}, {"type": "learn", "kick": "Reading", "title": "Four reading skills, four questions", "text": "For each reading skill, there is one question to ask yourself.", "visual": {"kind": "bigtext", "text": "Start → Turning point → End", "sub": "character change"}, "steps": [{"text": "<b>Character change (Week 6):</b> How does the character feel or act at the START? At the END? What was the <b>turning point</b>?"}, {"text": "<b>Two viewpoints (Week 7):</b> What does each person care about most? What do they AGREE on? What is each one's main concern?"}, {"text": "<b>Author's purpose (Week 8):</b> WHY was it written: to inform, persuade or entertain?"}, {"text": "<b>Text structure (Week 9):</b> What pattern is it? Cause and effect, problem and solution, sequence, or compare and contrast. Look for the signal words."}, {"text": "<b>Two sources (Week 9):</b> What does each source give that the other doesn't? A strong conclusion uses BOTH and admits any downside."}], "tip": "A careful reader always asks: Why was this written? What might it be leaving out?", "notes": {"do": "Write START → TURNING POINT → END on the whiteboard. Leave it up for the next slide.", "say": "Reading is your strength. The trick on the Checkpoint is choosing the BEST answer, not just a true one.", "ask": "What signal words go with cause and effect?", "listen": "Because, so, as a result. Problem and solution: problem, to solve it, fix. Sequence: first, next, finally. Compare and contrast: both, however, unlike."}}, {"type": "tap", "kick": "Read", "title": "Week 6 skill: Lena's Shadow", "text": "Read it out loud. Highlight how Lena feels at the start in one color, and at the end in the other.", "visual": {"kind": "passage", "text": "<b>Lena's Shadow</b><br>Lena was eleven, and her little brother Sam was six. All summer, Sam followed her everywhere: to the park, to the pool, even to her friend Maya's house. “Go home, Sam,” Lena groaned, again and again. Then, at the county fair, Sam let go of her hand in the crowd. For ten long minutes Lena searched, her heart pounding, until she spotted his red cap by the goat pens. She hugged him so hard his cap fell off. The next Saturday, when Maya called, Lena said, “Can Sam come too? He's really good at finding frogs.”"}, "items": [{"q": "How has Lena CHANGED from the start to the end?", "choices": ["She is still annoyed by Sam and still wants him to stay home", "She went from annoyed by Sam to wanting him along", "She stopped going to Maya's house and plays with Sam instead", "She learned how to find frogs from Sam"], "a": 1, "why": "At the start she groans, “Go home, Sam.” At the end she asks, “Can Sam come too?” Her feelings about Sam changed.", "no": ["Look at the last line: she ASKS for Sam to come.", null, "She still sees Maya; she just wants Sam along now.", "Finding frogs is Sam's skill, and it is a detail, not her change."]}, {"type": "fill", "q": "What is the turning point? Lena loses Sam at the county ________. Type the word.", "answers": ["fair", "county fair", "the fair", "the county fair"], "why": "Losing Sam at the <b>fair</b> is the turning point: her fear shows how much she cares.", "no": "Look at the sentence that starts with “Then.”", "hint": "It has goat pens and crowds."}, {"q": "Which detail is the BEST evidence that Lena was scared when Sam was lost?", "choices": ["“Lena was eleven, and her little brother Sam was six”", "“All summer, Sam followed her everywhere: to the park, to the pool”", "“For ten long minutes Lena searched, her heart pounding”", "“she spotted his red cap by the goat pens”"], "a": 2, "why": "A pounding heart is a clue to fear. That is an <b>inference</b> from the text.", "no": ["That is a fact about their ages, not about Lena's feelings.", "That happens before the fair, and it doesn't show fear.", null, "The cap helps her find him, but it doesn't show her feelings."]}], "notes": {"do": "He reads aloud and highlights. Point to START → TURNING POINT → END on the whiteboard and have him fill it in for Lena.", "ask": "Why does the writer show Lena's heart pounding instead of just saying “she was scared”?", "listen": "So the reader makes the inference. Showing feelings through actions is how authors reveal character change."}}, {"type": "tap", "kick": "Read", "title": "Week 7 skill: two viewpoints", "text": "Read both pieces. Highlight Jada in one color and Mr. Ortiz in the other.", "visual": {"kind": "passage", "text": "<b>Recess First?</b><br><b>Jada writes:</b> “Our school should have recess BEFORE lunch. Right now, kids gulp their food in five minutes so they can run outside. If we played first, we would come in hungry and actually eat our lunches.”<br><br><b>Mr. Ortiz, the cafeteria manager, writes:</b> “I agree that students should eat a real lunch, not just a few bites. But if recess comes first, 300 students arrive at the same moment, and my team of three cannot serve everyone quickly. Let's try recess first one day a week and see how it goes.”"}, "items": [{"q": "What do Jada and Mr. Ortiz AGREE on?", "choices": ["Recess should be longer so kids have more time to play", "Students should eat a real lunch", "The cafeteria needs more food", "Recess should be canceled"], "a": 1, "why": "Mr. Ortiz writes, “I agree that students should eat a real lunch.” That is what they share.", "no": ["Neither one talks about making recess longer.", null, "Nobody says there isn't enough food.", "Jada wants MORE time to play before lunch, not less."]}, {"type": "fill", "q": "How many students would arrive at the cafeteria at the same moment? Type the number.", "answers": ["300", "300 students", "three hundred"], "why": "Mr. Ortiz writes that “<b>300</b> students arrive at the same moment.”", "no": "Look at Mr. Ortiz's second sentence.", "hint": "It is a 3-digit number."}, {"type": "fill", "q": "Mr. Ortiz suggests trying recess first one day a week. Each side gets part of what it wants. That is a ________. Type the word.", "answers": ["compromise", "a compromise"], "why": "Trying it one day a week is a <b>compromise</b>: Jada gets recess first sometimes, and his team gets time to plan.", "no": "It was one of your Lesson 2 words. Both sides give a little.", "hint": "It starts with c-o-m-p."}], "notes": {"do": "He draws a quick T-chart on the whiteboard: Same | Different.", "ask": "What is Mr. Ortiz's main concern, in your own words?", "listen": "Too many students at once for his small team to serve. Note: the Checkpoint asks for a MAIN concern, so push for the biggest reason, not a small detail."}}, {"type": "tap", "kick": "Read", "title": "Week 8 and 9 skills: two sources", "text": "Read both sources. Circle the signal words.", "visual": {"kind": "passage", "text": "<b>Source A · Town Science Report</b><br>Every spring, heavy rain falls on the parking lots around Mill Creek. Because pavement cannot soak up water, the rain rushes straight into the creek. As a result, the creek overflows its banks and floods the walking trail several times a year.<br><br><b>Source B · Parks Department Newsletter</b><br>Flooding on the Mill Creek trail was a growing problem. To solve it, the town planted a rain garden: a low patch of native plants beside the parking lot that soaks up rainwater. Since then, the trail has flooded only once, though the garden took over part of the old picnic area."}, "items": [{"q": "Which signal words show the text structure of <b>Source A</b>?", "choices": ["“Because” and “As a result”", "“First,” “next” and “finally”", "“Both” and “unlike”", "“To solve it”"], "a": 0, "why": "“Because pavement cannot soak up water” and “As a result, the creek overflows” show <b>cause and effect</b>.", "no": [null, "Those words show sequence. Source A doesn't use them.", "Those words show compare and contrast.", "“To solve it” is in Source B, not Source A."]}, {"q": "What does Source B give you that Source A does NOT?", "choices": ["Why the creek floods: pavement can't soak up the rain", "How many inches of rain fall on the parking lots each spring", "The results of the town's fix, including a downside", "Nothing. Both sources give the same facts."], "a": 2, "why": "Source A explains WHY it floods. Source B tells what happened when the town did something about it, including a downside.", "no": ["That is Source A's job: the pavement makes the rain rush into the creek.", "Neither source gives an amount of rain.", null, "Source B adds the results of the rain garden."]}, {"q": "Which is the STRONGEST conclusion using BOTH sources?", "choices": ["Rain gardens fix every flooding problem with no downside at all, so every town should plant one", "Pavement sends rain into the creek; a rain garden cut flooding but took picnic space", "Only Source A matters, because it explains why the creek floods", "The town should pave the picnic area to make more room for parking"], "a": 1, "why": "It uses the cause from Source A and the result from Source B, and it admits the downside. That is synthesizing.", "no": ["Source B admits a downside: less picnic space.", null, "Source A alone can't tell you whether the fix worked.", "More pavement would make the flooding worse, according to Source A."]}, {"type": "fill", "q": "What is the author's purpose of Source B? Type one word.", "answers": ["inform", "to inform", "informs", "informing"], "why": "It reports facts about the problem, the fix and the results, so its purpose is to <b>inform</b>.", "no": "Does it give facts, try to convince you, or make you laugh?", "hint": "It starts with i-n-f."}], "notes": {"do": "He circles the signal words with a pencil before answering: Because, As a result (A); problem, To solve it (B).", "ask": "What structure is Source B?", "listen": "Problem and solution. A careful reader also notices what Source B admits: the picnic area got smaller."}}, {"type": "sort", "kick": "Week 9", "title": "Sort by text structure", "text": "Tap a card, then tap its text structure. Look for the signal words.", "buckets": ["Cause &amp; effect", "Problem &amp; solution", "Sequence", "Compare &amp; contrast"], "items": [{"text": "Because the road was icy, school started two hours late.", "b": 0, "why": "“Because” tells why something happened.", "hint": "Find the word that tells WHY."}, {"text": "The bike rack was always full. To fix it, the school added a second rack.", "b": 1, "why": "A problem (a full rack) and a fix (a second rack).", "hint": "Is something being fixed?"}, {"text": "First, crack the eggs. Next, whisk them. Finally, pour them in the pan.", "b": 2, "why": "First, next, finally: time order.", "hint": "Look at the first word of each sentence."}, {"text": "Both frogs and toads lay eggs in water. However, toads have dry, bumpy skin.", "b": 3, "why": "“Both” shows alike; “however” shows different.", "hint": "Two animals, alike and different."}, {"text": "Kids kept returning library books late. The answer was a reminder text the day before.", "b": 1, "why": "A problem (late books) and a solution (reminder text).", "hint": "What was the answer to the trouble?"}, {"text": "The storm knocked down power lines. As a result, the town was dark for a day.", "b": 0, "why": "“As a result” shows an effect.", "hint": "What happened BECAUSE of the storm?"}, {"text": "Unlike a canoe, a kayak has a closed top.", "b": 3, "why": "“Unlike” shows a difference between two things.", "hint": "Two boats are being compared."}, {"text": "At 6:00 the alarm rang. Then Kai fed the dog. After that, he caught the bus.", "b": 2, "why": "Then, after that: events in time order.", "hint": "Is it telling what happened in order?"}], "done": "Cause and effect: because, as a result. Problem and solution: problem, fix, answer. Sequence: first, then, finally. Compare and contrast: both, however, unlike.", "notes": {"do": "He says the signal word out loud before each tap.", "ask": "“So” can show cause and effect. Can a problem-and-solution piece also have causes in it?", "listen": "Yes. Then ask what the MAIN pattern is: is the piece mostly about fixing a problem?"}}, {"type": "tap", "kick": "Exit ticket", "title": "Words from memory", "text": "No peeking. Type the word.", "items": [{"type": "fill", "q": "The key moment in a story when a character's feelings start to shift is the ________ ________.", "answers": ["turning point", "the turning point", "a turning point", "turningpoint"], "why": "That is the <b>turning point</b>.", "no": "Two words. Losing Sam at the fair was Lena's.", "hint": "It starts with t-u-r-n."}, {"type": "fill", "q": "A word problem that takes more than one step to solve is a ________ problem.", "answers": ["multi-step", "multistep", "multi step", "multi-step problem", "multistep problem", "multi step problem", "multiple-step", "multiple step"], "why": "It is a <b>multi-step</b> problem: do one step at a time, in order.", "no": "It means “more than one step.”", "hint": "It starts with m-u-l-t-i."}, {"type": "fill", "q": "Multiplication and division undo each other. They are ________ operations.", "answers": ["inverse", "inverse operations"], "why": "They are <b>inverse</b> operations. That is why you can check division by multiplying.", "no": "It means “opposite, undoing.”", "hint": "It starts with i-n-v."}], "notes": {"do": "A missed word is said three times, spelled out loud, then typed again.", "listen": "Spelling: t-u-r-n-i-n-g p-o-i-n-t, m-u-l-t-i (with a hyphen), i-n-v-e-r-s-e."}}, {"type": "learn", "kick": "Wrap-up", "title": "Your Checkpoint game plan", "text": "You presented your Feast Report and reviewed all eight Unit 2 skills.", "steps": [{"text": "<b>Math:</b> estimate first, work on paper, then type. Write the 0, write the check, count the decimal places, use simplest form."}, {"text": "<b>Two-step questions:</b> underline what the question asks for: used or left, total or change."}, {"text": "<b>Reading:</b> start → turning point → end; what each side cares about; why it was written; the signal words."}, {"text": "<b>This week:</b> the after-class lesson tonight, then Practice and the Packet. The Checkpoint is on Monday."}], "tip": "Only your first try earns points on the Checkpoint. Slow and right beats fast and wrong.", "notes": {"do": "Open the course page together and read this week's task list, one day at a time. Have him pack the Feast Report poster to take home (or keep it at the schoolhouse if he wants it on the wall).", "say": "Tonight: the after-class lesson and Show What You Know. Monday: the real Checkpoint. Print the Pre/Post sheet before you start it.", "ask": "What will you do before you type every math answer on Monday?", "listen": "Work it on paper and check it with an estimate."}}], "win": "You showed off your Feast Report and reviewed all eight Unit 2 skills. You're ready for the Checkpoint!", "prev": "bb-ethan-L04", "prevTitle": "Lesson 4"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>in
