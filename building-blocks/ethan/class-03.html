<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ethan · Lesson 3: Sophia&#x27;s Garden Plot and Ravi&#x27;s Newsletter</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L03", "label": "Lesson 3", "title": "Sophia's Garden Plot and Ravi's Newsletter", "goal": "I can add and subtract fractions with unlike denominators, write my answer in simplest form, and tell why an author wrote a piece.", "date": "2026-11-04", "mastery": 85, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Sophia's Garden Plot and Ravi's Newsletter", "text": "Sophia is planning a community garden plot. Tomatoes need <b>1/3</b> of it and peppers need <b>1/4</b>. Those denominators do not match! Today you learn to add and subtract fractions with <b>unlike denominators</b>. Then you read Ravi's neighborhood newsletter and figure out <b>why</b> each piece was written.", "visual": {"kind": "emoji", "text": "🌱🍅🫑📰"}, "notes": {"do": "Before class: check his Lesson 2 Show What You Know score (Formspree). Set out fraction strips: 1 whole bar, 2 halves, 3 thirds, 4 fourths, 6 sixths and 12 twelfths (28 pieces). Also three highlighters (three colors), whiteboard and marker, pencil and paper. Math runs 9:30–10:05 (35 min); reading runs 10:05–10:30 (25 min).", "say": "Two jobs today. First 35 minutes: fractions that do not share a denominator. Last 25 minutes: a newsletter, and the reason behind every piece in it.", "ask": "What do you remember about adding fractions like 1/5 + 2/5?", "listen": "Add the numerators and keep the denominator: 3/5. If he adds the 5s too (3/10), note it: today's lesson fixes that."}}, {"type": "talk", "kick": "Math Talk", "title": "Sophia's plan", "text": "Tomatoes need <b>1/3</b> of the plot. Peppers need <b>1/4</b>.", "visual": {"kind": "bigtext", "text": "1/3 + 1/4 = ?", "sub": "tomatoes + peppers"}, "prompts": ["Which needs more space, the tomatoes or the peppers? How do you know?", "Do tomatoes and peppers together use <b>more</b> or <b>less</b> than half the plot? Make an estimate.", "Why can't Sophia just add the tops and add the bottoms?"], "starters": ["The tomatoes need more because …", "My estimate is … because …", "You can't add the bottoms because …"], "notes": {"do": "2 to 3 minutes. Write his estimate (more or less than half) in the corner of the whiteboard. We check it at 9:46.", "ask": "Which piece is bigger: one of 3 equal pieces, or one of 4 equal pieces?", "listen": "1/3 is bigger: fewer pieces means bigger pieces. For the estimate, any reasoned guess is fine; the exact answer (7/12) is a little more than half."}}, {"type": "tap", "kick": "Warm-up", "title": "Lessons 1 and 2, then fractions", "text": "Paper first, then type.", "items": [{"type": "fill", "q": "Lesson 1 skill. Stack it: <b>53 × 24 = ____</b>", "answers": ["1,272", "1272"], "why": "53 × 4 = 212 and 53 × 20 = 1,060. 212 + 1,060 = <b>1,272</b>.", "no": "Ones row: 53 × 4. Tens row: write the 0, then 53 × 2. Add.", "hint": "53 × 4 = 212."}, {"type": "fill", "q": "Lesson 2 skill: <b>714 ÷ 6 = ____</b>", "answers": ["119", "119 R0", "119 remainder 0"], "why": "7 ÷ 6 → 1 (1 × 6 = 6), 1 left. Bring down 1: 11 ÷ 6 → 1 (1 × 6 = 6), 5 left. Bring down 4: 54 ÷ 6 → 9 (9 × 6 = 54), 0 left. <b>119</b>. Check: 6 × 119 = 714.", "no": "Divide, multiply, subtract, bring down. Write the check.", "hint": "7 ÷ 6 → 1, 1 left. Bring down the 1: 11."}, {"type": "fill", "q": "Multiples of 3: 3, 6, 9, 12. Multiples of 4: 4, 8, 12. What is the first number on BOTH lists?", "answers": ["12"], "why": "<b>12</b> is on both lists. It is the smallest number that both 3 and 4 divide into evenly.", "no": "Look for a number that is on both lists.", "hint": "It is the last number on each list."}, {"type": "fill", "q": "Same denominators, like Pathways Week 3: <b>2/5 + 1/5 = ____</b>", "answers": ["3/5"], "why": "The pieces are the same size (fifths), so add the numerators: 2 + 1 = 3. Keep the denominator: <b>3/5</b>.", "no": "Add the numerators. Keep the denominator.", "hint": "The answer is in fifths.", "placeholder": "Example: 3/4"}], "notes": {"do": "He answers out loud, writes on paper, then types. Circle the 12 on the whiteboard: it is today's common denominator.", "say": "Adding fractions is easy when the pieces are the same size. Today we make the pieces the same size first.", "ask": "Why is 2/5 + 1/5 not 3/10?", "listen": "Fifths plus fifths are still fifths. The denominator names the size of the pieces; it does not get added."}}, {"type": "vocab", "kick": "Word Power", "title": "Math words for today", "text": "Tap each card to flip it. Read the word, the meaning and the example out loud.", "words": [{"word": "numerator", "pos": "noun", "meaning": "The top number in a fraction. It counts the pieces you have.", "example": "In 3/4, the <b>numerator</b> is 3.", "emoji": "⬆️"}, {"word": "denominator", "pos": "noun", "meaning": "The bottom number in a fraction. It tells how many equal pieces make 1 whole.", "example": "In 3/4, the <b>denominator</b> is 4.", "emoji": "⬇️"}, {"word": "unlike denominators", "pos": "noun", "meaning": "Fractions whose bottom numbers are different.", "example": "1/3 and 1/4 have <b>unlike denominators</b>: 3 and 4.", "emoji": "🔀"}, {"word": "common denominator", "pos": "noun", "meaning": "A denominator that two or more fractions can share.", "example": "12 is a <b>common denominator</b> for 1/3 and 1/4.", "emoji": "🤝"}, {"word": "equivalent fraction", "pos": "noun", "meaning": "A fraction that names the same amount, written with different numbers.", "example": "1/3 and 4/12 are <b>equivalent fractions</b>.", "emoji": "🟰"}, {"word": "estimate", "pos": "noun", "meaning": "A smart, quick guess made by rounding first.", "example": "1/3 and 1/4 are each less than 1/2, so my <b>estimate</b> is that 1/3 + 1/4 is less than 1.", "emoji": "🎯"}, {"word": "mixed number", "pos": "noun", "meaning": "A whole number and a fraction together.", "example": "1 1/4 is a <b>mixed number</b>: 1 whole and 1/4 more.", "emoji": "🥧"}], "notes": {"do": "He reads each card aloud, then covers it and says the meaning in his own words.", "say": "You will type these from memory at the end of class and all week. Pathways Week 8 asks you to TYPE common denominator, denominator and estimate.", "ask": "Which number is the numerator in 3/4? What does the denominator tell you?", "listen": "Numerator on top (3), denominator on the bottom (4): how many equal pieces make 1 whole. Have him spell denominator out loud (d-e-n-o-m-i-n-a-t-o-r)."}}, {"type": "learn", "kick": "Hands-on", "title": "Equivalent fractions with strips", "text": "Lay the <b>1/3</b> strip under the whole bar. How many <b>twelfths</b> cover exactly the same length?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 490 214\" width=\"100%\" style=\"max-width:490px;display:block;margin:auto\" font-family=\"Fredoka,Arial,sans-serif\"><text x=\"56\" y=\"25\" text-anchor=\"end\" font-size=\"17\" fill=\"#0A1F3D\">1</text><rect x=\"64.0\" y=\"2\" width=\"420.0\" height=\"34\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"56\" y=\"67\" text-anchor=\"end\" font-size=\"17\" fill=\"#0A1F3D\">1/3</text><rect x=\"64.0\" y=\"44\" width=\"140.0\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"134.0\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\">1/3</text><rect x=\"204.0\" y=\"44\" width=\"140.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"274.0\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/3</text><rect x=\"344.0\" y=\"44\" width=\"140.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"414.0\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/3</text><text x=\"56\" y=\"109\" text-anchor=\"end\" font-size=\"17\" fill=\"#0A1F3D\">4/12</text><rect x=\"64.0\" y=\"86\" width=\"35.0\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"81.5\" y=\"108\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"99.0\" y=\"86\" width=\"35.0\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"116.5\" y=\"108\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"134.0\" y=\"86\" width=\"35.0\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"151.5\" y=\"108\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"169.0\" y=\"86\" width=\"35.0\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"186.5\" y=\"108\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"204.0\" y=\"86\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"221.5\" y=\"108\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"239.0\" y=\"86\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"256.5\" y=\"108\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"274.0\" y=\"86\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"291.5\" y=\"108\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"309.0\" y=\"86\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"326.5\" y=\"108\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"344.0\" y=\"86\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"361.5\" y=\"108\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"379.0\" y=\"86\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"396.5\" y=\"108\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"414.0\" y=\"86\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"431.5\" y=\"108\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"449.0\" y=\"86\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"466.5\" y=\"108\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><text x=\"56\" y=\"151\" text-anchor=\"end\" font-size=\"17\" fill=\"#0A1F3D\">1/4</text><rect x=\"64.0\" y=\"128\" width=\"105.0\" height=\"34\" fill=\"#10AC84\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"116.5\" y=\"150\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\">1/4</text><rect x=\"169.0\" y=\"128\" width=\"105.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"221.5\" y=\"150\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/4</text><rect x=\"274.0\" y=\"128\" width=\"105.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"326.5\" y=\"150\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/4</text><rect x=\"379.0\" y=\"128\" width=\"105.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"431.5\" y=\"150\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/4</text><text x=\"56\" y=\"193\" text-anchor=\"end\" font-size=\"17\" fill=\"#0A1F3D\">3/12</text><rect x=\"64.0\" y=\"170\" width=\"35.0\" height=\"34\" fill=\"#10AC84\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"81.5\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"99.0\" y=\"170\" width=\"35.0\" height=\"34\" fill=\"#10AC84\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"116.5\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"134.0\" y=\"170\" width=\"35.0\" height=\"34\" fill=\"#10AC84\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"151.5\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"169.0\" y=\"170\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"186.5\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"204.0\" y=\"170\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"221.5\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"239.0\" y=\"170\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"256.5\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"274.0\" y=\"170\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"291.5\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"309.0\" y=\"170\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"326.5\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"344.0\" y=\"170\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"361.5\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"379.0\" y=\"170\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"396.5\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"414.0\" y=\"170\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"431.5\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"449.0\" y=\"170\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"466.5\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text></svg>"}, "steps": [{"text": "<b>4</b> twelfths cover the 1/3 strip exactly. So <b>1/3 = 4/12</b>. Same length, same amount."}, {"text": "On paper: 3 × 4 = 12, so multiply the numerator by 4 too: 1 × 4 = 4. <b>1/3 = 4/12</b>."}, {"text": "Now the <b>1/4</b> strip: <b>3</b> twelfths cover it. 4 × 3 = 12 and 1 × 3 = 3, so <b>1/4 = 3/12</b>."}, {"text": "1/3 and 4/12 are <b>equivalent fractions</b>. The pieces got smaller, so you need more of them. The amount did not change."}], "tip": "Multiply the numerator AND the denominator by the same number. Then the fraction keeps its value.", "notes": {"do": "Hands-on: he lays the whole bar, the 1/3 strip and the twelfths on the table and counts the twelfths that match. Then the 1/4 strip. He writes each equation on paper.", "say": "Renaming a fraction is like trading one big piece for smaller pieces of the same total size.", "ask": "Why do we multiply the top by 4 too, and not just the bottom?", "listen": "If only the bottom changes, the pieces get smaller but you keep only 1 of them, so the amount shrinks. 1/12 is much less than 1/3."}}, {"type": "tap", "kick": "Your turn", "title": "Rename the fractions", "text": "Write each one on paper first. Use the strips if you want to check.", "items": [{"type": "fill", "q": "Rename it as an equivalent fraction. <b>3/4 = ____/12</b> Type the numerator.", "answers": ["9", "9/12"], "why": "4 × 3 = 12, so multiply the numerator by 3 too: 3 × 3 = 9. <b>3/4 = 9/12</b>.", "no": "What do you multiply 4 by to get 12? Multiply the numerator by the same number.", "hint": "4 × 3 = 12. Now do 3 × 3.", "placeholder": "Type a number"}, {"type": "fill", "q": "Rename it as an equivalent fraction. <b>2/3 = ____/12</b> Type the numerator.", "answers": ["8", "8/12"], "why": "3 × 4 = 12, so multiply the numerator by 4 too: 2 × 4 = 8. <b>2/3 = 8/12</b>.", "no": "What do you multiply 3 by to get 12? Multiply the numerator by the same number.", "hint": "3 × 4 = 12. Now do 2 × 4.", "placeholder": "Type a number"}, {"type": "fill", "q": "Rename it as an equivalent fraction. <b>2/5 = ____/10</b> Type the numerator.", "answers": ["4", "4/10"], "why": "5 × 2 = 10, so multiply the numerator by 2 too: 2 × 2 = 4. <b>2/5 = 4/10</b>.", "no": "What do you multiply 5 by to get 10? Multiply the numerator by the same number.", "hint": "5 × 2 = 10. Now do 2 × 2.", "placeholder": "Type a number"}], "notes": {"do": "He checks 3/4 = 9/12 with the strips (3 fourths, 9 twelfths), then does the other two on paper only.", "ask": "For 2/3 = ____/12, what did you multiply by? Why that number?", "listen": "3 × 4 = 12, so multiply by 4: 2 × 4 = 8. If he types 4 (the multiplier) instead of 8, ask: 4 what? Multiply the numerator by 4."}}, {"type": "learn", "kick": "Learn", "title": "Adding with unlike denominators: 1/3 + 1/4", "text": "Back to Sophia's plot. The denominators 3 and 4 are <b>unlike</b>, so the pieces are different sizes.", "visual": {"kind": "bigtext", "text": "1/3 + 1/4", "sub": "tomatoes + peppers"}, "steps": [{"text": "<b>1. Find a common denominator.</b> Multiples of 3: 3, 6, 9, 12. Multiples of 4: 4, 8, 12. Use the first number on both lists: <b>12</b>."}, {"text": "<b>2. Rename.</b> 1/3 = 4/12 and 1/4 = 3/12 (from the strips)."}, {"text": "<b>3. Add or subtract the numerators. Keep the denominator.</b> 4/12 + 3/12 = <b>7/12</b>.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 490 130\" width=\"100%\" style=\"max-width:490px;display:block;margin:auto\" font-family=\"Fredoka,Arial,sans-serif\"><text x=\"56\" y=\"25\" text-anchor=\"end\" font-size=\"17\" fill=\"#0A1F3D\">1</text><rect x=\"64.0\" y=\"2\" width=\"420.0\" height=\"34\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"56\" y=\"67\" text-anchor=\"end\" font-size=\"17\" fill=\"#0A1F3D\">7/12</text><rect x=\"64.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#8E44AD\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"81.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"99.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#8E44AD\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"116.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"134.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#8E44AD\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"151.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"169.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#8E44AD\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"186.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"204.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#8E44AD\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"221.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"239.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#8E44AD\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"256.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"274.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#8E44AD\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"291.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"309.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"326.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"344.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"361.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"379.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"396.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"414.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"431.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"449.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"466.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><text x=\"56\" y=\"109\" text-anchor=\"end\" font-size=\"17\" fill=\"#0A1F3D\">1/2</text><rect x=\"64.0\" y=\"86\" width=\"210.0\" height=\"34\" fill=\"#DB2F30\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"169.0\" y=\"108\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\">1/2</text><rect x=\"274.0\" y=\"86\" width=\"210.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"379.0\" y=\"108\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/2</text></svg>"}}, {"text": "<b>4. Simplify.</b> 7 and 12 can't both be divided by the same number, so 7/12 is already in simplest form."}, {"text": "<b>Then check with an estimate.</b> Half the plot is 6/12. 7/12 is a little more than 6/12, so tomatoes and peppers use a little more than half. Was your 9:30 estimate right?"}], "tip": "Never add the denominators. 1/3 + 1/4 is NOT 2/7: 2/7 is even less than 1/3 by itself, and adding more can't make the amount smaller.", "notes": {"do": "He builds 4 twelfths + 3 twelfths with the strips and counts 7 twelfths. Then he lays them next to the 1/2 strip to see 7/12 is a little more than half.", "say": "Four steps: common denominator, rename, add or subtract, simplify. Then check with an estimate.", "ask": "Why is 2/7 impossible for 1/3 + 1/4?", "listen": "The answer must be bigger than each part. 2/7 is smaller than 1/3, so it can't be right. Look back at his estimate from 9:30 and praise any reasoning."}}, {"type": "tap", "kick": "Your turn", "title": "Add them", "text": "Write the four steps on paper. Then type.", "items": [{"type": "fill", "q": "What is the smallest common denominator for <b>1/2</b> and <b>1/3</b>?", "answers": ["6"], "why": "Multiples of 2: 2, 4, 6. Multiples of 3: 3, 6. The first number on both lists is <b>6</b>.", "no": "List the multiples of 2 and of 3.", "hint": "It is less than 10."}, {"type": "fill", "q": "<b>1/2 + 1/3 = ____</b> Type it in simplest form.", "answers": ["5/6"], "why": "Multiples of 2: 2, 4, 6. Multiples of 3: 3, 6. The common denominator is <b>6</b>. 1/2 = 3/6 and 1/3 = 2/6. 3/6 + 2/6 = 5/6. <b>5/6</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "9 is a multiple of 3, so you only rename one fraction. <b>2/3 + 1/9 = ____</b> Type it in simplest form.", "answers": ["7/9"], "why": "9 is a multiple of 3, so the common denominator is <b>9</b>. 2/3 = 6/9. 6/9 + 1/9 = 7/9. <b>7/9</b>", "no": "Did you add the bottom numbers too? Never do that. Only one fraction needs renaming: 9 is a multiple of 3, so 1/9 stays as it is and you rename 2/3. Then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}], "notes": {"do": "He leads 1/2 + 1/3 with the strips (1 half = 3 sixths, 1 third = 2 sixths), then does 2/3 + 1/9 on paper only.", "ask": "In 2/3 + 1/9, why don't you rename the 1/9?", "listen": "9 is already a multiple of 3, so 9 is the common denominator. Only 2/3 changes: 2/3 = 6/9. 6/9 + 1/9 = 7/9."}}, {"type": "learn", "kick": "Learn", "title": "Simplest form, and more than 1 whole", "text": "Pathways wants every answer in <b>simplest form</b>: the smallest numbers that name the same amount.", "visual": {"kind": "bigtext", "text": "3/6 = 1/2", "sub": "divide the numerator and the denominator by 3"}, "steps": [{"text": "<b>Simplify.</b> 1/6 + 1/3 = 1/6 + 2/6 = 3/6. Both 3 and 6 can be divided by 3: <b>3/6 = 1/2</b>."}, {"text": "<b>Use the smallest common denominator.</b> With 12 for 1/2 + 1/3 you get 6/12 + 4/12 = 10/12, and then you must simplify: 10/12 = 5/6. With 6 you get 5/6 right away."}, {"text": "<b>More than 1 whole?</b> Sophia wants beans on 1/2 of the plot too. 1/3 + 1/4 + 1/2 = 4/12 + 3/12 + 6/12 = 13/12."}, {"text": "12/12 is 1 whole, so 13/12 is 1 whole and 1/12 more: <b>13/12 = 1 1/12</b>, a <b>mixed number</b>. That is MORE than the whole plot, so the beans do not fit!"}], "tip": "Before you type, ask: can the numerator and denominator both be divided by the same number? Is the numerator bigger than the denominator?", "notes": {"do": "Strips: 1 sixth + 2 sixths = 3 sixths, laid next to the 1/2 strip. Then he stacks 4 twelfths + 3 twelfths + 6 twelfths: there are only 12 twelfths, so he runs out. That is why 13/12 is more than 1 whole.", "say": "Pathways marks 10/12 wrong when it wants 5/6. Simplest form every time, unless the question says otherwise.", "ask": "How do you know 13/12 is more than 1 whole?", "listen": "The numerator (13) is bigger than the denominator (12). 12/12 = 1, plus 1/12 more."}}, {"type": "tap", "kick": "Try it", "title": "Simplify and use mixed numbers", "text": "Paper first. Then type.", "items": [{"type": "fill", "q": "Simplify: <b>6/8 = ____</b> Type it in simplest form.", "answers": ["3/4"], "why": "Both 6 and 8 can be divided by 2: 6 ÷ 2 = 3 and 8 ÷ 2 = 4. <b>6/8 = 3/4</b>.", "no": "What number divides both 6 and 8?", "hint": "Divide the numerator and the denominator by 2.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>1/4 + 1/12 = ____</b> Type it in simplest form.", "answers": ["1/3"], "why": "12 is a multiple of 4, so the common denominator is <b>12</b>. 1/4 = 3/12. 3/12 + 1/12 = 4/12. Simplify: divide the numerator and the denominator by 4. 4/12 = 1/3. <b>1/3</b>", "no": "Did you add the bottom numbers too? Never do that. Only one fraction needs renaming: 12 is a multiple of 4, so 1/12 stays as it is and you rename 1/4. Then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>3/4 + 1/2 = ____</b> Type it as a mixed number in simplest form, like 1 1/2.", "answers": ["1 1/4", "1-1/4", "1 and 1/4"], "why": "4 is a multiple of 2, so the common denominator is <b>4</b>. 1/2 = 2/4. 3/4 + 2/4 = 5/4. 5/4 is more than 1 whole (4/4 = 1): 5/4 = 1 1/4. <b>1 1/4</b>", "no": "Did you add the bottom numbers too? Never do that. Only one fraction needs renaming: 4 is a multiple of 2, so 3/4 stays as it is and you rename 1/2. Then add only the numerators and keep the denominator. Simplify, and because the answer is more than 1 whole, type it as a mixed number (whole number, space, fraction), not as a fraction whose top number is bigger than its bottom number.", "placeholder": "Example: 1 1/2"}], "notes": {"do": "Hands off. He writes each step. For 3/4 + 1/2 he says out loud whether the answer is more than 1 whole BEFORE he types.", "ask": "How did you get 1/3 from 4/12?", "listen": "Divide 4 and 12 by 4. For 3/4 + 1/2: 3/4 + 2/4 = 5/4 = 1 1/4. Watch for him typing 5/4 when the question asks for a mixed number, or 4/12 when it asks for simplest form."}}, {"type": "learn", "kick": "Learn", "title": "Subtract, what's left, and which is bigger", "text": "The same common-denominator trick works for subtracting and comparing.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 490 172\" width=\"100%\" style=\"max-width:490px;display:block;margin:auto\" font-family=\"Fredoka,Arial,sans-serif\"><text x=\"56\" y=\"25\" text-anchor=\"end\" font-size=\"17\" fill=\"#0A1F3D\">1/4</text><rect x=\"64.0\" y=\"2\" width=\"105.0\" height=\"34\" fill=\"#10AC84\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"116.5\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\">1/4</text><rect x=\"169.0\" y=\"2\" width=\"105.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"221.5\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/4</text><rect x=\"274.0\" y=\"2\" width=\"105.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"326.5\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/4</text><rect x=\"379.0\" y=\"2\" width=\"105.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"431.5\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/4</text><text x=\"56\" y=\"67\" text-anchor=\"end\" font-size=\"17\" fill=\"#0A1F3D\">3/12</text><rect x=\"64.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#10AC84\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"81.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"99.0\" y=\"44\" width=\"35.0\" height=\"34\" fill=\"#10AC84\" stroke=\"#0A1F3D\" stroke-width= 35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"466.5\" y=\"66\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><text x=\"56\" y=\"109\" text-anchor=\"end\" font-size=\"17\" fill=\"#0A1F3D\">1/6</text><rect x=\"64.0\" y=\"86\" width=\"70.0\" height=\"34\" fill=\"#E67E22\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"99.0\" y=\"108\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\">1/6</text><rect x=\"134.0\" y=\"86\" width=\"70.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"169.0\" y=\"108\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/6</text><rect x=\"204.0\" y=\"86\" width=\"70.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"239.0\" y=\"108\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/6</text><rect x=\"274.0\" y=\"86\" width=\"70.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"309.0\" y=\"108\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/6</text><rect x=\"344.0\" y=\"86\" width=\"70.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"379.0\" y=\"108\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/6</text><rect x=\"414.0\" y=\"86\" width=\"70.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"449.0\" y=\"108\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">1/6</text><text x=\"56\" y=\"151\" text-anchor=\"end\" font-size=\"17\" fill=\"#0A1F3D\">2/12</text><rect x=\"64.0\" y=\"128\" width=\"35.0\" height=\"34\" fill=\"#E67E22\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"81.5\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"99.0\" y=\"128\" width=\"35.0\" height=\"34\" fill=\"#E67E22\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"116.5\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#FFFFFF\">1/12</text><rect x=\"134.0\" y=\"128\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"151.5\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"169.0\" y=\"128\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"186.5\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"204.0\" y=\"128\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"221.5\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"239.0\" y=\"128\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"256.5\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"274.0\" y=\"128\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"291.5\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"309.0\" y=\"128\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"326.5\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"344.0\" y=\"128\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"361.5\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"379.0\" y=\"128\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"396.5\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"414.0\" y=\"128\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"431.5\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text><rect x=\"449.0\" y=\"128\" width=\"35.0\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"466.5\" y=\"150\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b6578\">1/12</text></svg>"}, "steps": [{"text": "<b>How much MORE do tomatoes need than peppers?</b> 1/3 − 1/4 = 4/12 − 3/12 = <b>1/12</b>."}, {"text": "<b>What's left for herbs?</b> The whole plot is 1 = 12/12. Tomatoes and peppers use 7/12. 12/12 − 7/12 = <b>5/12</b>."}, {"text": "<b>Estimate with 1/2.</b> Half the plot is 6/12. 5/12 is less than 6/12, so the herbs get less than half."}, {"text": "<b>Which is bigger, 1/4 or 1/6?</b> 1/4 = 3/12 and 1/6 = 2/12, so <b>1/4</b> is bigger. 6 is a bigger number than 4, but sixths are SMALLER pieces than fourths."}], "tip": "To compare, rename both with a common denominator. Then the bigger numerator wins.", "notes": {"do": "Strips: he lays 1 fourth next to 1 sixth and sees the fourth is longer. Then 3 twelfths next to 2 twelfths.", "say": "More pieces in the whole means smaller pieces. Do not let the bigger denominator fool you.", "ask": "Which is bigger, 1/8 or 1/5? How do you know without any work?", "listen": "1/5: same numerator, and fifths are bigger pieces than eighths."}}, {"type": "tap", "kick": "Try it", "title": "Subtract and compare", "text": "Paper first. Then type.", "items": [{"type": "fill", "q": "<b>1/2 − 1/5 = ____</b> Type it in simplest form.", "answers": ["3/10"], "why": "Multiples of 2: 2, 4, 6, 8, 10. Multiples of 5: 5, 10. The common denominator is <b>10</b>. 1/2 = 5/10 and 1/5 = 2/10. 5/10 − 2/10 = 3/10. <b>3/10</b>", "no": "Did you subtract the bottom numbers too? Never do that. Rename both fractions with a common denominator, then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>1 − 3/8 = ____</b> Type it in simplest form.", "answers": ["5/8"], "why": "One whole is 8/8. 8/8 − 3/8 = 5/8. <b>5/8</b>", "no": "Write 1 whole as 8/8 first, then subtract only the numerators and keep the 8. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Which is bigger, <b>2/3</b> or <b>3/4</b>? Type the bigger fraction.", "answers": ["3/4"], "why": "Common denominator 12: 2/3 = 8/12 and 3/4 = 9/12. 9/12 is more than 8/12, so <b>3/4</b> is bigger.", "no": "Rename both with a common denominator. Then compare the numerators.", "hint": "Use 12: 2/3 = 8/12. What is 3/4 in twelfths?", "placeholder": "Example: 3/4"}], "notes": {"do": "He writes each step. For 1 − 3/8 he writes 1 = 8/8 first.", "ask": "How did you write 1 whole for 1 − 3/8?", "listen": "1 = 8/8, and 8/8 − 3/8 = 5/8. For 2/3 vs 3/4: 8/12 vs 9/12, so 3/4."}}, {"type": "tap", "kick": "Find the mistake", "title": "Be the checker", "text": "Each one has a mistake. Find it.", "items": [{"q": "Someone wrote: <b>1/4 + 2/3 = 3/7</b>. What went wrong?", "choices": ["They added the numerators AND the denominators. It is 3/12 + 8/12 = 11/12.", "Nothing. 3/7 is right.", "They should have subtracted", "3/7 is right but not in simplest form"], "a": 0, "why": "Never add the denominators. 2/3 alone is more than 1/2, but 3/7 is less than 1/2, so 3/7 can't be right. 1/4 + 2/3 = 3/12 + 8/12 = <b>11/12</b>.", "no": [null, "Estimate: 2/3 by itself is more than 1/2, but 3/7 is less than 1/2. Adding can't make it smaller.", "The question is an addition. The mistake is HOW they added.", "3/7 can't be simplified, and it is not the right amount anyway: it is less than 2/3."]}, {"q": "Someone said: <b>1/6 is bigger than 1/4, because 6 is bigger than 4</b>. What is wrong?", "choices": ["Nothing. 1/6 is bigger.", "They are equal, because both numerators are 1", "Sixths are smaller pieces than fourths, so 1/4 is bigger: 3/12 is more than 2/12", "You can't compare fractions with unlike denominators"], "a": 2, "why": "More pieces in the whole means smaller pieces. 1/4 = 3/12 and 1/6 = 2/12, so <b>1/4</b> is bigger.", "no": ["Look at the strips: the 1/6 piece is shorter than the 1/4 piece.", "Same numerator does not mean same amount: one fourth and one sixth are different sizes.", null, "You can: rename both as twelfths (3/12 and 2/12)."]}, {"q": "Someone wrote: <b>1/2 + 1/8 = 1/8 + 1/8 = 2/8</b>. What went wrong?", "choices": ["They should have used 16 as the denominator", "They changed the denominator of 1/2 but not the numerator. 1/2 = 4/8, so it is 4/8 + 1/8 = 5/8.", "Nothing. 2/8 is right.", "2/8 is right, but it should be simplified to 1/4"], "a": 1, "why": "1/2 is not 1/8. When you multiply the denominator by 4, multiply the numerator by 4 too: 1/2 = 4/8. 4/8 + 1/8 = <b>5/8</b>.", "no": ["8 already works, because 8 is a multiple of 2. The mistake is in renaming 1/2.", null, "2/8 is less than 1/2 by itself. Adding 1/8 has to make it MORE than 1/2.", "Simplifying 2/8 does not help: 2/8 is the wrong amount. 1/2 was renamed wrong."]}], "notes": {"do": "He says which step went wrong for each one, and proves it with an estimate, the strips (fourths, sixths and twelfths are in the kit) or a quick drawing. The kit has no eighths, so for 1/2 + 1/8 he draws a bar cut into 8 parts and shades 4 of them.", "say": "These are the three big fraction mistakes: adding the denominators, letting a big denominator fool you, and renaming only the bottom number.", "ask": "How can an estimate catch the first and the last mistake?", "listen": "In both, the answer is smaller than one of the parts, which can't happen when you add."}}, {"type": "tap", "kick": "Exit ticket", "title": "Math check", "text": "On your own. Paper first, then type.", "items": [{"type": "fill", "q": "<b>3/5 + 1/4 = ____</b> Type it in simplest form.", "answers": ["17/20"], "why": "Multiples of 5: 5, 10, 15, 20. Multiples of 4: 4, 8, 12, 16, 20. The common denominator is <b>20</b>. 3/5 = 12/20 and 1/4 = 5/20. 12/20 + 5/20 = 17/20. <b>17/20</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>5/6 − 1/3 = ____</b> Type it in simplest form.", "answers": ["1/2"], "why": "6 is a multiple of 3, so the common denominator is <b>6</b>. 1/3 = 2/6. 5/6 − 2/6 = 3/6. Simplify: divide the numerator and the denominator by 3. 3/6 = 1/2. <b>1/2</b>", "no": "Did you subtract the bottom numbers too? Never do that. Only one fraction needs renaming: 6 is a multiple of 3, so 5/6 stays as it is and you rename 1/3. Then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}], "notes": {"do": "Hands off. Note his first answers. Then switch to reading (10:05).", "listen": "17/20 and 1/2. Both right on the first try, in simplest form, means he is ready for Pathways Week 8 Math on Tuesday. Watch for 3/6 (not simplified) on the second one."}}, {"type": "vocab", "kick": "Word Power", "title": "Reading words for today", "text": "Tap each card. Read the word, the meaning and the example out loud.", "words": [{"word": "author's purpose", "pos": "noun", "meaning": "The reason a writer chose to write a piece: usually to inform, persuade, or entertain.", "example": "The <b>author's purpose</b> of a weather report is to inform.", "emoji": "✍️"}, {"word": "inform", "pos": "verb", "meaning": "To give facts or explain something clearly.", "example": "A weather report <b>informs</b>: rain on Tuesday, sunny on Wednesday.", "emoji": "📰"}, {"word": "persuade", "pos": "verb", "meaning": "To convince someone to think or act a certain way.", "example": "A toy ad tries to <b>persuade</b> you to buy the toy.", "emoji": "📣"}, {"word": "entertain", "pos": "verb", "meaning": "To amuse or interest the reader, often through humor or story.", "example": "A knock-knock joke is there to <b>entertain</b> you.", "emoji": "😂"}, {"word": "point of view", "pos": "noun", "meaning": "The perspective a writer sees a topic from: what the writer believes matters most.", "example": "A writer who wants a longer recess has the <b>point of view</b> that kids need time to play.", "emoji": "👀"}, {"word": "evidence", "pos": "noun", "meaning": "Specific facts or details that support a point.", "example": "“Recess is only 15 minutes long” is <b>evidence</b> for a longer recess.", "emoji": "🔎"}], "notes": {"do": "He reads each card aloud and covers it. Extra time on persuade and point of view: Pathways asks him to type inform, persuade, author's purpose and evidence.", "say": "Now we switch to reading. Every piece in Ravi's newsletter was written for a reason.", "ask": "What is the difference between inform and persuade?", "listen": "Inform gives facts. Persuade tries to get you to think or do something."}}, {"type": "tap", "kick": "Read", "title": "Why writers write", "text": "Read both pieces out loud.", "visual": {"kind": "passage", "text": "<b>Why Writers Write</b><br>Every piece of writing has a purpose. A news article aims to INFORM you with facts. An ad or an opinion letter aims to PERSUADE you to think or act a certain way. A joke or story aims to ENTERTAIN you. Noticing the purpose helps you read more carefully — an ad written to sell something reads very differently than a report written to simply explain what happened.<br><br><b>Newsletter Notice: The Park Cleanup</b><br>“Join us Saturday at 9am for the annual Maple Street Park cleanup! Bring gloves if you have them — we'll supply trash bags and water. Last year, volunteers collected over 200 pounds of litter in just two hours.”"}, "items": [{"type": "fill", "q": "The park cleanup notice gives the day, the time and what to bring. Its purpose is to ________. Type one word.", "answers": ["inform", "to inform", "informs", "informing"], "why": "It gives facts and details, so its purpose is to <b>inform</b>.", "no": "Does it give facts, try to convince you, or make you laugh?", "hint": "It starts with i-n-f."}, {"type": "fill", "q": "How many pounds of litter did volunteers collect last year? Type the number.", "answers": ["200", "200 pounds", "200 lbs", "over 200", "over 200 pounds", "more than 200", "more than 200 pounds", "over 200 pounds of litter", "200 pounds of litter", "two hundred", "two hundred pounds", "over two hundred", "over two hundred pounds", "more than two hundred"], "why": "The notice says volunteers collected “over <b>200</b> pounds of litter in just two hours.”", "no": "Look at the last sentence of the notice.", "hint": "It is a 3-digit number."}, {"q": "Why does knowing the purpose help you as a reader?", "choices": ["It tells you how long the piece is", "It helps you read more carefully", "It means you can skip every ad", "It proves every ad is false"], "a": 1, "why": "The passage says: “Noticing the purpose helps you read more carefully.”", "no": ["The purpose is about WHY it was written, not its length.", null, "The passage never says to skip ads. It says an ad reads differently.", "The passage never says ads are false."]}], "notes": {"do": "He reads aloud and highlights facts in the cleanup notice in color 1 (inform).", "ask": "Which words in the notice are facts you could check?", "listen": "Saturday at 9am, Maple Street Park, trash bags and water supplied, over 200 pounds last year."}}, {"type": "tap", "kick": "Read", "title": "A letter to the editor", "text": "Read the crosswalk letter out loud.", "visual": {"kind": "passage", "text": "<b>Reader's Letter</b><br>“Our neighborhood REALLY needs a crosswalk near the elementary school. I've watched kids dash across that street every single morning, and cars don't always slow down. Please, everyone — sign the petition at the library and let's get this crosswalk built before someone gets hurt.”"}, "items": [{"type": "fill", "q": "What is the author's purpose of the crosswalk letter? Type one word.", "answers": ["persuade", "to persuade", "persuades", "persuading"], "why": "The writer wants readers to act (sign the petition), so the purpose is to <b>persuade</b>.", "no": "Is the writer trying to get you to DO something?", "hint": "It starts with p-e-r-s."}, {"q": "Which detail is <b>evidence</b> the writer uses to support the letter?", "choices": ["“Please, everyone — sign the petition”", "“Join us Saturday at 9am”", "“Our neighborhood REALLY needs a crosswalk”", "“I've watched kids dash across that street every single morning, and cars don't always slow down”"], "a": 3, "why": "It is a specific detail the writer saw: kids dashing across while cars don't always slow down. That supports the point.", "no": ["That is what the writer asks you to DO, not a fact that supports the point.", "That is from the park cleanup notice, not this letter.", "That is the writer's opinion. Evidence is what backs it up.", null]}, {"type": "fill", "q": "Where can readers sign the petition? Type the place.", "answers": ["library", "the library", "at the library", "in the library", "a library"], "why": "The letter says: “sign the petition at the <b>library</b>.”", "no": "Look at the last sentence.", "hint": "It is a building full of books."}], "notes": {"do": "He highlights persuasive words in color 2 (REALLY, needs, Please, everyone) and evidence in color 1.", "ask": "What does the writer want you to DO? Which words tell you?", "listen": "Sign the petition at the library. “Please, everyone” and “let's get this crosswalk built.”"}}, {"type": "learn", "kick": "Learn", "title": "Purpose and point of view", "text": "Purpose and point of view work together, but they are not the same thing.", "visual": {"kind": "bigtext", "text": "purpose = WHY · point of view = WHAT they believe"}, "steps": [{"text": "<b>Purpose = WHY</b> the author wrote it. The crosswalk letter: to <b>persuade</b>."}, {"text": "<b>Point of view = WHAT</b> the writer believes matters most. The crosswalk letter: student safety should come first."}, {"text": "<b>Clue words.</b> Inform: facts, days, times, numbers. Persuade: please, should, needs, best, favorite. Entertain: jokes, riddles, funny stories."}, {"text": "<b>Ravi's sections.</b> Inform goes in <b>News</b>. Persuade goes in <b>Opinions</b>. Entertain goes in <b>Fun &amp; Games</b>."}, {"text": "<b>Two purposes at once.</b> A piece can inform AND persuade. Then ask: what is its MAIN job?"}], "tip": "Ask two questions: WHY did they write it? WHAT do they believe?", "notes": {"do": "Write PURPOSE = WHY and POINT OF VIEW = WHAT on the whiteboard. He gives one example of each from the crosswalk letter.", "say": "Purpose is the job the writing does. Point of view is the belief behind it.", "ask": "What is the crosswalk writer's point of view, in your own words?", "listen": "Kids' safety crossing the street matters most."}}, {"type": "tap", "kick": "Read", "title": "Two more pieces", "text": "Read the joke and the bakery spotlight.", "visual": {"kind": "passage", "text": "<b>Neighborhood Joke Corner</b><br>“Why did the squirrel bring a ladder to the block party? Because he heard the snacks were on a whole new level!”<br><br><b>Business Spotlight</b><br>“New this month: Ravi's family bakery is now open Saturdays 8am-2pm at 214 Maple Street. Try their cinnamon rolls, voted a neighborhood favorite three years running.”"}, "items": [{"type": "fill", "q": "What is the author's purpose of the squirrel joke? Type one word.", "answers": ["entertain", "to entertain", "entertains", "entertaining"], "why": "A joke is there to make you laugh, so its purpose is to <b>entertain</b>.", "no": "Does it give facts, try to convince you, or make you laugh?", "hint": "It starts with e-n-t."}, {"q": "Which words in the bakery spotlight try to <b>persuade</b> you?", "choices": ["“now open Saturdays 8am-2pm”", "“at 214 Maple Street”", "“Try their cinnamon rolls, voted a neighborhood favorite three years running”", "“Why did the squirrel bring a ladder”"], "a": 2, "why": "“Try” tells you to do something, and “favorite” makes the rolls sound great. That is persuading.", "no": ["Those are the hours: a plain fact that informs.", "That is the address: a plain fact that informs.", null, "That is from the joke, not the bakery spotlight."]}, {"type": "fill", "q": "What time does the bakery close on Saturdays? Type the time.", "answers": ["2pm", "2 pm", "2", "2:00", "2:00 pm", "2 o'clock", "at 2pm", "at 2", "two", "two pm", "two o'clock", "2 in the afternoon"], "why": "The spotlight says “Saturdays 8am-<b>2pm</b>.”", "no": "Look for the hours.", "hint": "It closes in the afternoon."}], "notes": {"do": "He highlights the joke in color 3 (entertain). In the bakery spotlight he highlights facts in color 1 and persuasive words in color 2: it has both.", "ask": "The bakery spotlight has facts AND persuasion. What is its MAIN purpose?", "listen": "To persuade readers to visit the bakery. The hours and address inform, but the piece exists to bring in customers."}}, {"type": "sort", "kick": "Ravi's job", "title": "Sort the newsletter", "text": "Tap a card, then tap the section where it belongs.", "buckets": ["News (inform)", "Opinions (persuade)", "Fun &amp; Games (entertain)"], "items": [{"text": "Park cleanup notice", "b": 0, "why": "It gives facts: the day, the time and what to bring.", "hint": "Does it give facts, try to convince you, or make you laugh?"}, {"text": "Crosswalk letter", "b": 1, "why": "It tries to get readers to sign the petition.", "hint": "What does the writer want readers to DO?"}, {"text": "Squirrel joke", "b": 2, "why": "It is there to make you laugh.", "hint": "Why would someone write a joke?"}, {"text": "A report on how much rain fell last month", "b": 0, "why": "A report gives facts.", "hint": "Is it trying to convince you of anything?"}, {"text": "A poster that says “Vote for a new playground!”", "b": 1, "why": "It tells readers what to do and wants them to agree.", "hint": "Look at the word Vote."}, {"text": "A funny story about a dog who ate a birthday cake", "b": 2, "why": "A funny story is written to entertain.", "hint": "Funny stories are written to …"}], "done": "Inform goes in News, persuade goes in Opinions, entertain goes in Fun &amp; Games.", "notes": {"do": "He sorts all six and says the purpose out loud for each one before he taps.", "ask": "Why does the crosswalk letter go in Opinions and not News?", "listen": "It tries to convince readers to act. News just reports facts."}}, {"type": "tap", "kick": "Exit ticket", "title": "Words from memory", "text": "No word list. Type the word.", "items": [{"type": "fill", "q": "In 5/8, the 8 is the ________.", "answers": ["denominator", "the denominator", "a denominator"], "why": "The bottom number is the <b>denominator</b>.", "no": "It is the bottom number.", "hint": "It starts with d-e-n-o-m."}, {"type": "fill", "q": "The reason a writer chose to write a piece is the author's ________.", "answers": ["purpose", "author's purpose", "authors purpose", "the purpose"], "why": "That is the author's <b>purpose</b>.", "no": "Inform, persuade or entertain: this word names the reason.", "hint": "It starts with p-u-r."}, {"type": "fill", "q": "To convince someone to think or act a certain way is to ________.", "answers": ["persuade", "to persuade"], "why": "That is to <b>persuade</b>.", "no": "The crosswalk letter does this.", "hint": "It starts with p-e-r-s."}], "notes": {"do": "No peeking at the vocab slides. A missed word is said three times, spelled out loud, then typed again.", "listen": "Spelling counts: d-e-n-o-m-i-n-a-t-o-r, p-u-r-p-o-s-e, p-e-r-s-u-a-d-e."}}, {"type": "learn", "kick": "Wrap-up", "title": "Two big skills", "text": "You made unlike fractions work together, and you read for the author's purpose.", "steps": [{"text": "<b>Unlike denominators:</b> find a common denominator, rename, then add or subtract the numerators."}, {"text": "<b>Rename:</b> multiply the numerator AND the denominator by the same number."}, {"text": "<b>Finish:</b> simplest form. More than 1 whole? Write a mixed number."}, {"text": "<b>Check:</b> estimate with 1/2 and 1. Never add the denominators."}, {"text": "<b>Reading:</b> purpose = WHY (inform, persuade, entertain). Point of view = WHAT the writer believes."}], "tip": "Slow and right beats fast and wrong. Check simplest form before you type.", "notes": {"do": "Open the course page together and read this week's task list, one day at a time.", "say": "Tonight: the after-class lesson and Show What You Know. A little each day after that. Thursday: Pathways Week 8 Reading. Tuesday: Pathways Week 8 Math.", "ask": "Say the steps for 1/3 + 1/4 without looking.", "listen": "Common denominator 12, rename to 4/12 and 3/12, add to 7/12, simplify (7/12 already is), then check with an estimate: a little more than half."}}], "win": "You made unlike fractions work together and figured out why every newsletter piece was written. Sophia's garden plot is planned!", "prev": "bb-ethan-L02", "prevTitle": "Lesson 2"});</script></body></html>
