<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan · Lesson 2: Deja&#x27;s Food Drive and the Class Pet Vote</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L02", "label": "Lesson 2", "title": "Deja's Food Drive and the Class Pet Vote", "goal": "I can divide with long division, check with multiplication, explain what a remainder means, and compare two viewpoints using evidence from the text.", "date": "2026-10-28", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "Deja's Food Drive: On Your Own", "text": "In class you learned long division and how to compare two viewpoints. Now you do it on your own. Keep paper and a pencil next to you. Work every division problem on paper and write the check.", "visual": {"kind": "emoji", "text": "🥫➗🐹"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["What are the four steps of long division? What do you do after the last step?", "Deja packs 170 cans in boxes of 24: 170 ÷ 24 = 7 R2. Why can a remainder mean <b>round up</b> one time and <b>drop it</b> another time?", "What is the difference between <b>compare</b> and <b>contrast</b>? Use Malia and Theo."], "starters": ["The four steps are …", "It depends on the question, because …", "Compare means … For example, …"]}, {"type": "vocab", "kick": "Word Power", "title": "Review your words", "text": "Say the meaning out loud first. Then flip the card to check yourself.", "words": [{"word": "dividend", "pos": "noun", "meaning": "The number being divided. It goes inside the long division box.", "example": "In 552 ÷ 24 = 23, the <b>dividend</b> is 552.", "emoji": "📦"}, {"word": "divisor", "pos": "noun", "meaning": "The number you are dividing BY. It goes outside the box.", "example": "In 552 ÷ 24 = 23, the <b>divisor</b> is 24.", "emoji": "🚪"}, {"word": "quotient", "pos": "noun", "meaning": "The answer to a division problem.", "example": "In 552 ÷ 24 = 23, the <b>quotient</b> is 23.", "emoji": "➗"}, {"word": "remainder", "pos": "noun", "meaning": "What is left over when a number does not divide evenly. It must be smaller than the divisor.", "example": "17 ÷ 5 = 3 R2. The <b>remainder</b> is 2.", "emoji": "🥫"}, {"word": "multiple", "pos": "noun", "meaning": "The answer when you multiply a number by 1, 2, 3, and so on.", "example": "24, 48, 72 and 96 are <b>multiples</b> of 24.", "emoji": "🔢"}, {"word": "viewpoint", "pos": "noun", "meaning": "The way a person sees or feels about something, based on what matters most to them.", "example": "Malia's <b>viewpoint</b> is that a hamster would teach responsibility.", "emoji": "👀"}, {"word": "compare", "pos": "verb", "meaning": "To look at how two or more things are the SAME.", "example": "When I <b>compare</b> Malia and Theo, I see they both care about the class.", "emoji": "🟰"}, {"word": "contrast", "pos": "verb", "meaning": "To look at how two or more things are DIFFERENT.", "example": "When I <b>contrast</b> them, Malia wants a hamster and Theo wants a fish tank.", "emoji": "↔️"}, {"word": "reasoning", "pos": "noun", "meaning": "The thinking or logic behind why someone believes something.", "example": "Theo's <b>reasoning</b>: a hamster needs care every day, even on breaks.", "emoji": "🧠"}, {"word": "evidence", "pos": "noun", "meaning": "Specific facts or details that support a viewpoint.", "example": "\"A few kids in our class are allergic to fur\" is <b>evidence</b>.", "emoji": "🔎"}, {"word": "persuasive", "pos": "adjective", "meaning": "Meant to convince the reader to agree.", "example": "Malia's piece is <b>persuasive</b> writing: she wants your vote.", "emoji": "📣"}, {"word": "compromise", "pos": "noun", "meaning": "A plan where each side gives up a little so both can agree.", "example": "A fish tank is a <b>compromise</b>: a class pet with no fur.", "emoji": "🤝"}]}, {"type": "learn", "kick": "Remember", "title": "Divide, Multiply, Subtract, Bring down, Check", "text": "<b>569 ÷ 24</b>. Multiples of 24: 24, 48, 72, 96, 120.", "visual": {"kind": "longdiv", "text": "      23 R17\n    ____\n24 ) 569\n    -48\n    ---\n      89\n     -72\n     ---\n      17"}, "tip": "Check: 24 × 23 + 17 = 552 + 17 = 569. ✅ The remainder 17 is smaller than 24."}, {"type": "tap", "kick": "Try it", "title": "One-digit divisors", "text": "Paper first. Write the check under each one.", "items": [{"type": "fill", "q": "<b>846 ÷ 6 = ____</b>", "answers": ["141", "141 R0", "141 remainder 0"], "why": "8 ÷ 6 → 1 (1 × 6 = 6), 2 left. Bring down 4: 24 ÷ 6 → 4 (4 × 6 = 24), 0 left. Bring down 6: 6 ÷ 6 → 1 (1 × 6 = 6), 0 left. <b>141</b>. Check: 6 × 141 = 846.", "no": "Start with 8. Divide, multiply, subtract, bring down.", "hint": "8 ÷ 6 → 1, 2 left. Bring down 4: 24.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "<b>925 ÷ 4 = ____</b> Type it like 5 R2.", "answers": ["231 R1", "231 r 1", "231r1", "231 remainder 1", "231 rem 1", "231 R 1", "231 remainder of 1", "231 with 1 left over", "231 with 1 left"], "why": "9 ÷ 4 → 2 (2 × 4 = 8), 1 left. Bring down 2: 12 ÷ 4 → 3 (3 × 4 = 12), 0 left. Bring down 5: 5 ÷ 4 → 1 (1 × 4 = 4), 1 left. <b>231 R1</b>. Check: 4 × 231 + 1 = 925.", "no": "9 ÷ 4 → 2, 1 left. Bring down the 2.", "hint": "12 ÷ 4 → 3. Then bring down the 5.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "Check it: <b>4 × 231 + 1 = ____</b>", "answers": ["925"], "why": "4 × 231 = 924, and 924 + 1 = <b>925</b>. ✅", "no": "Multiply 231 × 4 first, then add the remainder.", "hint": "231 × 4 = 924."}]}, {"type": "tap", "kick": "Try it", "title": "Two-digit divisors", "text": "Make the multiples list first.", "items": [{"type": "fill", "q": "Multiples of 28: 28, 56, 84, ____", "answers": ["112"], "why": "84 + 28 = <b>112</b>. Also 28 × 4 = 112.", "no": "Add 28 to 84.", "hint": "84 + 28."}, {"type": "fill", "q": "<b>672 ÷ 28 = ____</b>", "answers": ["24", "24 R0", "24 remainder 0"], "why": "67 ÷ 28 → 2 (2 × 28 = 56), 11 left. Bring down 2: 112 ÷ 28 → 4 (4 × 28 = 112), 0 left. <b>24</b>. Check: 28 × 24 = 672.", "no": "How many 28s fit in 67? Use your list.", "hint": "56 fits in 67. 67 − 56 = 11. Bring down the 2.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "<b>815 ÷ 32 = ____</b>", "answers": ["25 R15", "25 r 15", "25r15", "25 remainder 15", "25 rem 15", "25 R 15", "25 remainder of 15", "25 with 15 left over", "25 with 15 left"], "why": "81 ÷ 32 → 2 (2 × 32 = 64), 17 left. Bring down 5: 175 ÷ 32 → 5 (5 × 32 = 160), 15 left. <b>25 R15</b>. Check: 32 × 25 + 15 = 815.", "no": "Multiples of 32: 32, 64, 96, 128, 160 …", "hint": "81 ÷ 32 → 2 (64), 17 left. Bring down the 5.", "placeholder": "Example: 5 R2"}]}, {"type": "tap", "kick": "Use the remainder", "title": "What does it mean?", "text": "Divide, then read the question again.", "items": [{"type": "fill", "q": "Each meal kit needs <b>3</b> cans. Deja has <b>50</b> cans. How many <b>FULL</b> meal kits can she make?", "answers": ["16", "16 kits", "16 meal kits"], "why": "50 ÷ 3 = 16 R2. Only full kits count, so drop the remainder: <b>16</b> kits.", "no": "Only full kits count. What do you do with the remainder?", "hint": "3 × 16 = 48."}, {"type": "fill", "q": "Boxes hold <b>24</b> cans. Deja has <b>200</b> cans. How many boxes does she need to pack <b>ALL</b> of them?", "answers": ["9", "9 boxes"], "why": "200 ÷ 24 = 8 R8. Eight boxes leave 8 cans out, so round up: <b>9</b> boxes.", "no": "Every can needs a box. Round up or drop it?", "hint": "24 × 8 = 192. 200 − 192 = 8 cans still need a box."}, {"q": "Deja splits <b>29</b> cans equally among <b>4</b> pantries. 29 ÷ 4 = 7 R1. What does the <b>1</b> mean?", "choices": ["Each pantry gets 1 can", "1 can is left over after every pantry gets 7", "1 pantry gets no cans", "Deja needs 1 more pantry"], "a": 1, "why": "Each pantry gets 7 cans (28 cans). <b>1 can is left over</b>.", "no": ["Each pantry gets 7, the quotient.", null, "Every pantry gets 7 cans.", "The remainder is cans, not pantries."]}]}, {"type": "tap", "kick": "Find the mistake", "title": "Be the checker", "text": "Check each one on paper. Then choose.", "items": [{"q": "Someone wrote: <b>658 ÷ 7 = 93 R7</b>. What went wrong?", "choices": ["Nothing. 93 R7 is right.", "7 × 93 is too big", "The remainder 7 equals the divisor, so one more 7 fits. It is 94.", "They should have divided 7 by 658"], "a": 2, "why": "A remainder can never equal the divisor. 7 × 94 = 658, so <b>94</b>.", "no": ["The remainder 7 is the same as the divisor 7. Another 7 fits.", "7 × 93 = 651, which fits in 658.", null, "658 is divided BY 7."]}, {"q": "Someone wrote: <b>852 ÷ 4 = 21 R1</b>. What went wrong?", "choices": ["The 2 should be a 3", "They forgot to bring down the 2. The check gives 4 × 21 + 1 = 85, not 852.", "The remainder should be 4", "Nothing. 21 R1 is right."], "a": 1, "why": "After 5 − 4 = 1, bring down the 2 to make 12. 12 ÷ 4 = 3. So <b>213</b>.", "no": ["8 ÷ 4 = 2 is right. The mistake is at the end.", null, "A remainder of 4 is never OK when dividing by 4.", "Check: 4 × 21 + 1 = 85. That is not 852."]}]}, {"type": "tap", "kick": "Read", "title": "The leftover cans: Jalen", "text": "Read Jalen's piece. Then answer.", "visual": {"kind": "passage", "text": "<i>Deja's class split 569 cans among 24 pantries: 23 cans each, with 17 cans left over. Two classmates wrote about the 17 extra cans.</i><br><br><b>Jalen writes:</b><br>“We should give the 17 extra cans to the 17 pantries with the longest lines right now. Those pantries feed the most families, so they run out first. Mr. Ortiz from the Elm Street pantry told our class his shelves were empty by Thursday last month. Cans sitting in a closet don't feed anybody.”"}, "items": [{"type": "fill", "q": "How many pantries does Jalen want to give an extra can to? Type the number.", "answers": ["17", "17 pantries"], "why": "Jalen writes: 'give the 17 extra cans to the <b>17</b> pantries with the longest lines.'", "no": "Look at his first sentence.", "hint": "It is the same as the number of leftover cans."}, {"q": "What does Jalen care about MOST?", "choices": ["Keeping every pantry's share exactly equal", "Getting food to families who need it right now", "Saving cans for next month", "Making the boxes full"], "a": 1, "why": "He wants the busiest pantries to get cans 'right now' because 'cans sitting in a closet don't feed anybody.'", "no": ["Jalen never talks about equal shares. Look at his last sentence.", null, "Jalen says cans in a closet don't feed anybody. He does not want to wait.", "He never talks about boxes."]}, {"type": "fill", "q": "Jalen wants the extra cans to go to the pantries with the longest ________. Type the word.", "answers": ["lines", "longest lines"], "why": "Jalen writes: 'the 17 pantries with the longest <b>lines</b>.'", "no": "Look at his first sentence.", "hint": "People wait in these."}]}, {"type": "tap", "kick": "Read", "title": "The leftover cans: Rosa", "text": "Now read Rosa's piece.", "visual": {"kind": "passage", "text": "<i>Deja's class split 569 cans among 24 pantries: 23 cans each, with 17 cans left over. Two classmates wrote about the 17 extra cans.</i><br><br><b>Rosa writes:</b><br>“We promised every pantry an equal share, and we should keep that promise. If 17 pantries get an extra can, 7 pantries get nothing extra, and that isn't fair to them. Let's put the 17 cans in a next-month bin. Next month's drive will add more cans, and then every pantry can get an equal extra share.”"}, "items": [{"q": "What does Rosa care about MOST?", "choices": ["Getting cans out today", "Which pantry has the longest line", "Keeping the promise of an equal share for every pantry", "Mr. Ortiz's empty shelves"], "a": 2, "why": "She starts with 'We promised every pantry an equal share' and says giving only 17 pantries extra 'isn't fair.'", "no": ["That is Jalen's viewpoint.", "Rosa never mentions lines.", null, "That is Jalen's evidence."]}, {"type": "fill", "q": "Rosa says that if 17 pantries get an extra can, how many pantries get nothing extra? Type the number.", "answers": ["7", "7 pantries"], "why": "24 − 17 = <b>7</b>, so 7 pantries get nothing extra. Rosa writes '7 pantries get nothing extra.'", "no": "There are 24 pantries in all. 17 get one.", "hint": "24 − 17."}, {"q": "Rosa wants to put the 17 cans in a next-month bin. Why?", "choices": ["So the cans can be thrown away", "So next month, with more cans, every pantry can get an equal extra share", "So Jalen wins", "Because 17 cans is not enough for one pantry"], "a": 1, "why": "She writes that next month's drive 'will add more cans, and then every pantry can get an equal extra share.'", "no": ["She wants to save them, not waste them.", null, "She never says that.", "Each pantry already got 23. The problem is 17 is less than 24 pantries."]}]}, {"type": "tap", "kick": "Compare and contrast", "title": "Jalen and Rosa", "text": "Read both pieces. Then answer.", "visual": {"kind": "passage", "text": "<i>Deja's class split 569 cans among 24 pantries: 23 cans each, with 17 cans left over. Two classmates wrote about the 17 extra cans.</i><br><br><b>Jalen writes:</b><br>“We should give the 17 extra cans to the 17 pantries with the longest lines right now. Those pantries feed the most families, so they run out first. Mr. Ortiz from the Elm Street pantry told our class his shelves were empty by Thursday last month. Cans sitting in a closet don't feed anybody.”<br><br><b>Rosa writes:</b><br>“We promised every pantry an equal share, and we should keep that promise. If 17 pantries get an extra can, 7 pantries get nothing extra, and that isn't fair to them. Let's put the 17 cans in a next-month bin. Next month's drive will add more cans, and then every pantry can get an equal extra share.”"}, "items": [{"q": "How are Jalen and Rosa ALIKE?", "choices": ["Both want the 17 cans given out today", "Both want the cans to help families and both care about the pantries", "Both mention Mr. Ortiz", "Both want to throw the cans away"], "a": 1, "why": "That is a <b>comparison</b>: neither wants to waste a can, and both are thinking about the pantries.", "no": ["Rosa wants to wait until next month.", null, "Only Jalen mentions Mr. Ortiz.", "Neither one says that."]}, {"q": "Which sentence <b>contrasts</b> Jalen and Rosa?", "choices": ["Jalen focuses on need right now, while Rosa focuses on keeping the shares equal", "Both of them wrote about the 17 cans", "Both of them care about the pantries", "Each of them gives a reason"], "a": 0, "why": "<b>While</b> is a contrast clue word. Jalen: need now. Rosa: equal shares.", "no": [null, "That is something they share. That is comparing.", "That is something they share. That is comparing.", "That is true of both. Look for a difference."]}, {"type": "fill", "q": "Who uses a real person's story as evidence, Jalen or Rosa? Type the name.", "answers": ["Jalen"], "why": "<b>Jalen</b> tells what Mr. Ortiz from the Elm Street pantry said about his empty shelves.", "no": "Which piece mentions someone by name?", "hint": "Look for Mr. Ortiz."}]}, {"type": "recall", "kick": "Remember", "title": "From Lesson 1", "items": [{"type": "fill", "q": "<b>47 × 26 = ____</b>", "answers": ["1,222", "1222"], "why": "47 × 6 = 282 and 47 × 20 = 940. 282 + 940 = <b>1,222</b>.", "no": "Ones row, then write the 0 for the tens row, then add.", "hint": "47 × 6 = 282."}, {"type": "fill", "q": "Round to the nearest ten. Estimate <b>71 × 39</b>: 70 × 40 = ____", "answers": ["2,800", "2800"], "why": "7 × 4 = 28, then two zeros: <b>2,800</b>.", "no": "7 × 4 = 28. Then count the zeros.", "hint": "7 tens × 4 tens = 28 hundreds."}, {"q": "Someone found <b>43 × 25</b> with the rows 215 and 86, and got 301. What went wrong?", "choices": ["43 × 5 should be 205", "The second row needs a 0: 43 × 20 = 860", "The rows were added wrong", "Nothing. 301 is right."], "a": 1, "why": "The 2 in 25 is 2 tens, so the second row is 860. 215 + 860 = <b>1,075</b>.", "no": ["3 × 5 = 15 (write 5, regroup 1). 4 × 5 = 20, then 20 + 1 = 21. 215 is right.", null, "215 + 86 is 301. The adding is fine; the second row is wrong.", "Estimate: 40 × 30 = 1,200. 301 is far too small."]}]}, {"type": "tap", "kick": "Word Power", "title": "Use your words", "text": "Type the word from memory.", "items": [{"type": "fill", "q": "In 569 ÷ 24 = 23 R17, the number 17 is the ________.", "answers": ["remainder", "the remainder", "a remainder"], "why": "17 is left over, so it is the <b>remainder</b>.", "no": "It is what is left over.", "hint": "It starts with r-e-m."}, {"type": "fill", "q": "In 569 ÷ 24 = 23 R17, the number 569 is the ________.", "answers": ["dividend", "the dividend", "a dividend"], "why": "569 is being divided, so it is the <b>dividend</b>.", "no": "It is the number that goes inside the box.", "hint": "It starts with d-i-v-i-d-e."}, {"type": "fill", "q": "24, 48, 72 and 96 are each a ________ of 24.", "answers": ["multiple", "the multiple", "a multiple", "multiples"], "why": "Each one is a <b>multiple</b> of 24: 24 × 1, 24 × 2, 24 × 3, 24 × 4.", "no": "You get them by multiplying 24 by 1, 2, 3, 4.", "hint": "It starts with m-u-l."}, {"type": "fill", "q": "The way a person sees or feels about something is their ________.", "answers": ["viewpoint", "the viewpoint", "a viewpoint", "point of view"], "why": "That is their <b>viewpoint</b>.", "no": "Malia and Theo each have a different one.", "hint": "It starts with v-i-e-w."}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "<b>936 ÷ 4 = ____</b>", "answers": ["234", "234 R0", "234 remainder 0"], "why": "9 ÷ 4 → 2 (2 × 4 = 8), 1 left. Bring down 3: 13 ÷ 4 → 3 (3 × 4 = 12), 1 left. Bring down 6: 16 ÷ 4 → 4 (4 × 4 = 16), 0 left. <b>234</b>. Check: 4 × 234 = 936.", "no": "Start with 9. Divide, multiply, subtract, bring down.", "hint": "9 ÷ 4 → 2, 1 left. Bring down the 3.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "<b>587 ÷ 5 = ____</b> Type it like 5 R2.", "answers": ["117 R2", "117 r 2", "117r2", "117 remainder 2", "117 rem 2", "117 R 2", "117 remainder of 2", "117 with 2 left over", "117 with 2 left"], "why": "5 ÷ 5 → 1 (1 × 5 = 5), 0 left. Bring down 8: 8 ÷ 5 → 1 (1 × 5 = 5), 3 left. Bring down 7: 37 ÷ 5 → 7 (7 × 5 = 35), 2 left. <b>117 R2</b>. Check: 5 × 117 + 2 = 587.", "no": "Start with 5. Keep going until there is nothing left to bring down.", "hint": "5 ÷ 5 → 1. Bring down 8: 8 ÷ 5 → 1, 3 left.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "Deja got <b>461 ÷ 3 = 153 R2</b>. Check it with multiplication: <b>3 × 153 + 2 = ____</b>", "answers": ["461"], "why": "3 × 153 = 459, and 459 + 2 = <b>461</b>. It matches, so 153 R2 is right.", "no": "Multiply 153 × 3 first, then add the remainder.", "hint": "153 × 3 = 459."}, {"type": "fill", "q": "<b>788 ÷ 32 = ____</b>", "answers": ["24 R20", "24 r 20", "24r20", "24 remainder 20", "24 rem 20", "24 R 20", "24 remainder of 20", "24 with 20 left over", "24 with 20 left"], "why": "78 ÷ 32 → 2 (2 × 32 = 64), 14 left. Bring down 8: 148 ÷ 32 → 4 (4 × 32 = 128), 20 left. <b>24 R20</b>. Check: 32 × 24 + 20 = 788.", "no": "Multiples of 32: 32, 64, 96, 128 … How many 32s fit in 78?", "hint": "78 − 64 = 14. Bring down the 8: 148.", "placeholder": "Example: 5 R2"}, {"q": "A van holds <b>9</b> boxes of food. <b>40</b> boxes must be delivered. How many van trips are needed?", "choices": ["4", "5", "4 R4", "36"], "a": 1, "why": "40 ÷ 9 = 4 R4. Four trips leave 4 boxes behind, so round up: <b>5</b> trips.", "no": ["Four trips carry 36 boxes. 4 boxes would be left behind.", null, "You can't make 4 R4 trips. Every box needs a trip, so round up.", "36 is the number of boxes 4 trips carry."]}, {"type": "fill", "q": "In 875 ÷ 35 = 25, the number 35 is the ________.", "answers": ["divisor", "the divisor", "a divisor"], "why": "35 is the number you divide BY, so it is the <b>divisor</b>.", "no": "It is the number you divide BY. It goes outside the box.", "hint": "It starts with d-i-v-i-s."}, {"q": "Which detail from Theo's piece is a FACT about the class, not just a feeling?", "visual": {"kind": "passage", "text": "<b>Theo writes (against the hamster):</b><br>“I love animals, but a classroom isn't the best place for one. Someone has to remember to feed it every single day, including weekends and school breaks. A few kids in our class are allergic to fur, too. I think we should get a class fish tank instead. It's calming, and nobody's allergic to fish.”"}, "choices": ["A few kids in our class are allergic to fur", "I love animals", "A fish tank is calming", "A classroom isn't the best place for one"], "a": 0, "why": "Allergies are a real fact about students in the class. That is strong <b>evidence</b>.", "no": [null, "That is how Theo feels.", "That is Theo's opinion about fish tanks.", "That is Theo's viewpoint, not a fact that proves it."]}, {"q": "Which sentence <b>compares</b> Malia and Theo (tells how they are ALIKE)?", "visual": {"kind": "passage", "text": "<b>Malia writes (for the hamster):</b><br>“A class hamster would teach us real responsibility. We'd take turns feeding it, cleaning its cage, and learning about how animals live. My cousin's class had a guinea pig, and everyone learned so much about caring for something besides themselves. It made the whole class feel closer, too.”<br><br><b>Theo writes (against the hamster):</b><br>“I love animals, but a classroom isn't the best place for one. Someone has to remember to feed it every single day, including weekends and school breaks. A few kids in our class are allergic to fur, too. I think we should get a class fish tank instead. It's calming, and nobody's allergic to fish.”"}, "choices": ["Malia wants a hamster, but Theo wants a fish tank", "Both care about the class and both want some kind of class pet", "Malia mentions her cousin; Theo mentions allergies", "Malia focuses on learning; Theo focuses on daily care"], "a": 1, "why": "To compare is to find what is the SAME. Both care about the class, and both want a pet (a hamster or fish).", "no": ["That shows a difference. That is a contrast.", null, "Those are two different details. That is a contrast.", "That shows a difference. That is a contrast."]}, {"type": "fill", "q": "Mr. Ortiz said his pantry shelves were empty by which day last month? Type the day.", "visual": {"kind": "passage", "text": "<i>Deja's class split 569 cans among 24 pantries: 23 cans each, with 17 cans left over. Two classmates wrote about the 17 extra cans.</i><br><br><b>Jalen writes:</b><br>“We should give the 17 extra cans to the 17 pantries with the longest lines right now. Those pantries feed the most families, so they run out first. Mr. Ortiz from the Elm Street pantry told our class his shelves were empty by Thursday last month. Cans sitting in a closet don't feed anybody.”"}, "answers": ["Thursday", "Thurs", "on Thursday", "by Thursday"], "why": "Jalen 91 − 86 = 5. Bring down the 7: 57.", "placeholder": "Example: 5 R2"}, {"q": "Deja has <b>75</b> granola bars. Each snack bag gets <b>8</b> bars. Only <b>FULL</b> bags are handed out. How many bags are handed out?", "choices": ["9", "10", "3", "9 R3"], "a": 0, "why": "75 ÷ 8 = 9 R3. Only full bags count, so drop the remainder: <b>9</b> bags.", "no": [null, "A 10th bag would have only 3 bars. It is not full.", "3 is the number of bars left over.", "You can't hand out 9 R3 bags. Use the remainder to decide."]}, {"type": "fill", "q": "The number being divided, the one that goes inside the long division box, is the ________.", "answers": ["dividend", "the dividend", "a dividend"], "why": "That is the <b>dividend</b>.", "no": "It is the biggest number in the problem.", "hint": "It starts with d-i-v-i-d-e."}, {"q": "Which detail does Malia use as a REAL example to support her viewpoint?", "visual": {"kind": "passage", "text": "<b>Malia writes (for the hamster):</b><br>“A class hamster would teach us real responsibility. We'd take turns feeding it, cleaning its cage, and learning about how animals live. My cousin's class had a guinea pig, and everyone learned so much about caring for something besides themselves. It made the whole class feel closer, too.”"}, "choices": ["Hamsters are cute", "Her cousin's class had a guinea pig, and everyone learned so much", "Everyone always votes yes on pets", "Malia just wants one"], "a": 1, "why": "It is a real class pet that actually worked. That is strong <b>evidence</b>.", "no": ["Malia never says that, and it would only be a feeling.", null, "That is not in her piece.", "That is a wish, not evidence."]}, {"q": "Which sentence shows how Jalen's and Rosa's plans are DIFFERENT?", "visual": {"kind": "passage", "text": "<i>Deja's class split 569 cans among 24 pantries: 23 cans each, with 17 cans left over. Two classmates wrote about the 17 extra cans.</i><br><br><b>Jalen writes:</b><br>“We should give the 17 extra cans to the 17 pantries ey left.", "She can't buy 14: 14 × $3 = $42.", null, "$3 is the price of one juice box."]}, {"type": "fill", "q": "What is left over when a number does not divide evenly is the ________.", "answers": ["remainder", "the remainder", "a remainder"], "why": "That is the <b>remainder</b>.", "no": "It comes after the R.", "hint": "It starts with r-e-m."}, {"q": "Which is Jalen's STRONGEST evidence?", "visual": {"kind": "passage", "text": "<i>Deja's class split 569 cans among 24 pantries: 23 cans each, with 17 cans left over. Two classmates wrote about the 17 extra cans.</i><br><br><b>Jalen writes:</b><br>“We should give the 17 extra cans to the 17 pantries with the longest lines right now. Those pantries feed the most families, so they run out first. Mr. Ortiz from the Elm Street pantry told our class his shelves were empty by Thursday last month. Cans sitting in a closet don't feed anybody.”"}, "choices": ["Cans sitting in a closet don't feed anybody", "We should give the cans out right now", "Mr. Ortiz said his Elm Street shelves were empty by Thursday last month", "Jalen likes the pantries with long lines"], "a": 2, "why": "It is a specific fact from a real person who runs a pantry. That is strong <b>evidence</b>.", "no": ["That is a strong saying, but it is an opinion, not a fact you can check.", "That is his viewpoint. Evidence is what supports it.", null, "Jalen never says that."]}, {"q": "Which statement shows how Malia's and Theo's viewpoints are DIFFERENT?", "visual": {"kind": "passage", "text": "<b>Malia writes (for the hamster):</b><br>“A class hamster would teach us real responsibility. We'd take turns feeding it, cleaning its cage, and learning about how animals live. My cousin's class had a guinea pig, and everyone learned so much about caring for something besides themselves. It made the whole class feel closer, too.”<br><br><b>Theo writes (against the hamster):</b><br>“I love animals, but a classroom isn't the best place for one. Someone has to remember to feed it every single day, including weekends and school breaks. A few kids in our class are allergic to fur, too. I think we should get a class fish tank instead. It's calming, and nobody's allergic to fish.”"}, "choices": ["Both care about the class", "Malia focuses on what the class would learn, while Theo focuses on daily care and allergies", "Both wrote about a class pet", "Both like animals"], "a": 1, "why": "That is a <b>contrast</b>. <b>While</b> is a clue word for a difference.", "no": ["That is the same for both. That is comparing.", null, "That is the same for both. That is comparing.", "That is the same for both. That is comparing."]}, {"type": "fill", "q": "Malia says a class pet made her cousin's whole class feel ________. Type the word.", "visual": {"kind": "passage", "text": "<b>Malia writes (for the hamster):</b><br>“A class hamster would teach us real responsibility. We'd take turns feeding it, cleaning its cage, and learning about how animals live. My cousin's class had a guinea pig, and everyone learned so much about caring for something besides themselves. It made the whole class feel closer, too.”"}, "answers": ["closer", "closer together"], "why": "Malia writes: 'It made the whole class feel <b>closer</b>, too.'", "no": "Look at her last sentence.", "hint": "It means more like friends."}, {"type": "fill", "q": "Malia wants a hamster. Theo wants no fur. A class fish tank gives each side part of what it wants. That kind of plan is a ________.", "answers": ["compromise", "the compromise", "a compromise"], "why": "That is a <b>compromise</b>.", "no": "Both sides get some of what they want.", "hint": "It starts with c-o-m-p-r-o."}]]}], "win": "You split the cans fairly, checked every answer and weighed both viewpoints. Deja's food drive is ready to deliver!", "prev": "bb-ethan-L01", "prevTitle": "Lesson 1"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;co
