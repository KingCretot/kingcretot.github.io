<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan · Lesson 5: Feast Report and the Unit 2 Checkpoint</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L05", "label": "Lesson 5", "title": "Feast Report and the Unit 2 Checkpoint", "goal": "I can share my Feast Report and use every Unit 2 skill (multiplying, long division, fractions, decimals and four reading skills) to get ready for the Unit 2 Checkpoint.", "date": "2026-12-09", "mastery": 85, "color": "#C9A84C", "slides": [{"type": "hello", "title": "Unit 2 Review: On Your Own", "text": "In class you showed your Feast Report and reviewed all of Unit 2. Now you practice each skill on your own. Keep paper and a pencil next to you. Work every math problem on paper first.", "visual": {"kind": "emoji", "text": "🏆🧮📖✏️"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["How do you check that 966 ÷ 42 = 23? Use the words <b>inverse operations</b>.", "How do you know $3.35 × 6 can't be $201.00?", "What was Lena's <b>turning point</b>, and how did she change?"], "starters": ["I check it by …", "My estimate is …, so …", "At the start Lena …, but at the end …"]}, {"type": "vocab", "kick": "Word Power", "title": "Review your words", "text": "Say the meaning out loud first. Then flip the card to check yourself.", "words": [{"word": "simplest form", "pos": "noun", "meaning": "A fraction written with the smallest numbers possible. The numerator and the denominator can't both be divided by the same number (except 1).", "example": "6/8 in <b>simplest form</b> is 3/4.", "emoji": "✂️"}, {"word": "multi-step problem", "pos": "noun", "meaning": "A word problem that takes more than one step to solve. You do the steps one at a time, in order.", "example": "Finding the total and then the change from $10 is a <b>multi-step problem</b>.", "emoji": "🪜"}, {"word": "inverse operations", "pos": "noun", "meaning": "Two operations that undo each other, like multiplication and division.", "example": "42 × 23 = 966, so 966 ÷ 42 = 23. Multiplication and division are <b>inverse operations</b>.", "emoji": "🔄"}, {"word": "character change", "pos": "noun", "meaning": "How a character's feelings, beliefs or actions are different at the end of a story than at the start.", "example": "Lena's <b>character change</b>: annoyed by her brother at the start, glad to have him along at the end.", "emoji": "🦋"}, {"word": "turning point", "pos": "noun", "meaning": "The key moment in a story when a character's feelings or choices start to shift.", "example": "Losing Sam at the fair is the <b>turning point</b> for Lena.", "emoji": "↪️"}, {"word": "gradual", "pos": "adjective", "meaning": "Happening slowly, in small steps, not all at once.", "example": "Owen's change was <b>gradual</b>: week by week he joined in more.", "emoji": "🐢"}, {"word": "inference", "pos": "noun", "meaning": "Something you figure out from clues in the text, when the writer doesn't say it straight out.", "example": "Her heart was pounding, so my <b>inference</b> is that Lena was scared.", "emoji": "🕵️"}]}, {"type": "learn", "kick": "Remember", "title": "One rule for each week", "text": "Before you start, read the rule for each week out loud.", "visual": {"kind": "bigtext", "text": "Estimate · Paper · Check", "sub": "every math problem"}, "steps": [{"text": "<b>Week 6, multiply:</b> ones row, then write the 0 and do the tens row. Add. Is it close to your estimate?"}, {"text": "<b>Week 7, divide:</b> divide, multiply, subtract, bring down. The remainder is smaller than the divisor. Check by multiplying."}, {"text": "<b>Week 8, fractions:</b> common denominator, rename, add or subtract the numerators, simplest form."}, {"text": "<b>Week 9, decimals:</b> multiply like whole numbers, count the decimal places, put the point back. Money has two decimal places."}, {"text": "<b>Reading:</b> start → turning point → end. What does each side care about? Why was it written? Which signal words?"}], "tip": "Two-step problem? Underline what it asks for before you start."}, {"type": "tap", "kick": "Try it", "title": "Weeks 6 and 7: multiply and divide", "text": "Paper first. Then type.", "items": [{"type": "fill", "q": "<b>76 × 48 = ____</b>", "answers": ["3,648", "3648"], "why": "76 × 8 = 608 and 76 × 40 = 3,040. 608 + 3,040 = <b>3,648</b>. Estimate: 80 × 50 = 4,000, so 3,648 is reasonable.", "no": "Ones row first. Then write the 0 for the tens row and multiply by the tens digit. Add the rows.", "hint": "76 × 8 = 608."}, {"type": "fill", "q": "<b>912 ÷ 38 = ____</b>", "answers": ["24", "24 R0", "24 remainder 0"], "why": "91 ÷ 38 → 2 (2 × 38 = 76), 15 left. Bring down 2: 152 ÷ 38 → 4 (4 × 38 = 152), 0 left. <b>24</b>. Check: 38 × 24 = 912.", "no": "Divide, multiply, subtract, bring down. Then write the check: divisor × quotient (+ remainder).", "hint": "Multiples of 38: 38, 76, 114, 152, 190."}, {"type": "fill", "q": "<b>95 ÷ 22 = ____</b> Type it like 5 R2.", "answers": ["4 R7", "4 r 7", "4r7", "4 remainder 7", "4 rem 7", "4 R 7", "4 remainder of 7", "4 with 7 left over", "4 with 7 left"], "why": "95 ÷ 22 → 4 (4 × 22 = 88), 7 left. <b>4 R7</b>. Check: 22 × 4 + 7 = 95.", "no": "Divide, multiply, subtract, bring down. Then write the check: divisor × quotient (+ remainder).", "hint": "Multiples of 22: 22, 44, 66, 88, 110.", "placeholder": "Example: 5 R2"}]}, {"type": "tap", "kick": "Try it", "title": "Week 8: fractions", "text": "Four steps on paper. Then type.", "items": [{"type": "fill", "q": "<b>4/5 − 1/3 = ____</b> Type it in simplest form.", "answers": ["7/15"], "why": "Multiples of 5: 5, 10, 15. Multiples of 3: 3, 6, 9, 12, 15. The common denominator is <b>15</b>. 4/5 = 12/15 and 1/3 = 5/15. 12/15 − 5/15 = 7/15. <b>7/15</b>", "no": "Did you subtract the bottom numbers too? Never do that. Rename both fractions with a common denominator, then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>2/3 + 5/8 = ____</b> Type it as a mixed number in simplest form, like 1 1/2.", "answers": ["1 7/24", "1-7/24", "1 and 7/24"], "why": "Multiples of 3: 3, 6, 9, 12, 15, 18, 21, 24. Multiples of 8: 8, 16, 24. The common denominator is <b>24</b>. 2/3 = 16/24 and 5/8 = 15/24. 16/24 + 15/24 = 31/24. 31/24 is more than 1 whole (24/24 = 1): <b>1 7/24</b>", "no": "Rename both with a common denominator, then add only the numerators. 31/24 is more than 1 whole, so write it as a mixed number (whole number, space, fraction).", "hint": "Use 24: 2/3 = 16/24 and 5/8 = 15/24.", "placeholder": "Example: 1 1/2"}, {"type": "fill", "q": "Which is bigger, <b>3/4</b> or <b>7/9</b>? Type the bigger fraction.", "answers": ["7/9"], "why": "Common denominator 36: 3/4 = 27/36 and 7/9 = 28/36. 28/36 is more than 27/36, so <b>7/9</b> is bigger.", "no": "Rename both with a common denominator. Then compare the numerators.", "hint": "Use 36: 3/4 = 27/36. What is 7/9 in thirty-sixths?", "placeholder": "Example: 3/4"}]}, {"type": "tap", "kick": "Try it", "title": "Week 9: decimals", "text": "Multiply, count the decimal places, then estimate.", "items": [{"type": "fill", "q": "Sweet corn costs <b>$1.95</b> a bag. You buy <b>6</b> bags. What do they cost?", "answers": ["11.70", "11.7", "$11.70", "$11.7"], "why": "Ignore the decimal point: 195 × 6 = 1,170. 1.95 has 2 decimal places, so the answer has 2: <b>$11.70</b>. Estimate: $1.95 is about $2, and $2 × 6 = $12. $11.70 is reasonable.", "no": "Multiply like whole numbers first. Then count the digits after the decimal point and put it back. Check with an estimate.", "hint": "195 × 6 = 1,170.", "placeholder": "Example: 4.50"}, {"type": "fill", "q": "Type 3/5 as a decimal: <b>3/5 = ____</b>", "answers": ["0.6", "0.60", ".6", ".60"], "why": "3/5 = 6/10, and 6 tenths is <b>0.6</b>. (1/5 = 0.2, so 3/5 is three of those: 0.2 + 0.2 + 0.2 = 0.6.)", "no": "Think: how many tenths is 3/5? Each fifth is 2 tenths.", "hint": "1/5 = 0.2. 3/5 is three of those.", "placeholder": "Example: 0.5"}, {"type": "fill", "q": "A puppy eats <b>0.8</b> kilograms of food a day. How many kilograms does it eat in <b>7</b> days?", "answers": ["5.60", "5.6"], "why": "Ignore the decimal point: 8 × 7 = 56. 0.8 has 1 decimal place, so the answer has 1: <b>5.6</b>. Estimate: 0.8 is close to 1, and 1 × 7 = 7. 5.6 is a little less than 7, so it is reasonable.", "no": "Multiply like whole numbers first. Then count the digits after the decimal point and put it back. Check with an estimate.", "hint": "8 × 7 = 56.", "placeholder": "Example: 2.4"}]}, {"type": "tap", "kick": "Two skills at once", "title": "Two-step problems", "text": "Underline what the question asks for. Then work it on paper.", "items": [{"type": "fill", "q": "A tray has <b>24</b> cookies. The family eats <b>1/8</b> of them on Saturday and <b>1/3</b> of them on Sunday. How many cookies are <b>left</b>?", "answers": ["13", "13 cookies", "thirteen"], "why": "1/8 + 1/3 = 3/24 + 8/24 = 11/24 eaten. 11/24 of 24 is 11 cookies eaten. Left: 24 − 11 = <b>13</b>.", "no": "Add the fractions. Find that fraction of 24. Then subtract from 24.", "hint": "1/8 + 1/3 = 11/24. 24 ÷ 24 = 1.", "placeholder": "Type a number"}, {"type": "fill", "q": "4 lb of potatoes at <b>$1.15</b> a pound and half a pound of butter at <b>$5.40</b> a pound. What is the <b>total</b>?", "answers": ["7.30", "7.3", "$7.30", "$7.3"], "why": "Potatoes: $1.15 × 4 = $4.60. Butter: half of $5.40 = $2.70. Total: $4.60 + $2.70 = <b>$7.30</b>.", "no": "Find each cost first. Then add, with the decimal points lined up.", "hint": "Potatoes cost $4.60.", "placeholder": "Example: 4.50"}]}, {"type": "tap", "kick": "Find the mistake", "title": "Be the checker", "text": "Each one has a mistake. Find it.", "items": [{"q": "Someone wrote <b>58 × 34</b> as <b>232 + 174 = 406</b>. What went wrong?", "choices": ["Nothing. 58 × 4 = 232 and 58 × 3 = 174, so 406 is right.", "They should have added: 58 + 34 = 92 is the answer.", "The ones row is wrong. 58 × 4 = 242, so it is 242 + 174 = 416.", "They forgot the 0 in the tens row. It is 1,740, so 1,972."], "a": 3, "why": "58 × 4 = 232 is right, but the tens row is 58 × 30 = 1,740, not 174. 232 + 1,740 = <b>1,972</b>. Estimate: 60 × 30 = 1,800.", "no": ["The 3 in 34 means 30. Estimate: 60 × 30 = 1,800, so 406 is much too small.", "Adding gives 92. This is a multiplication problem.", "58 × 4 = 232. The ones row is right.", null]}, {"q": "Someone wrote <b>0.3 × 7 = 21</b>. What went wrong?", "choices": ["The decimal point is missing. 0.3 × 7 = 2.1.", "Nothing. 3 × 7 = 21, so 0.3 × 7 = 21 too.", "Two decimal places are needed, so it should be 0.21.", "They should have added: 0.3 + 7 = 7.3 is the answer."], "a": 0, "why": "3 × 7 = 21, and 0.3 has 1 decimal place: <b>2.1</b>. Estimate: 0.3 is less than 1, so the answer is less than 7.", "no": [null, "0.3 is less than 1, so 0.3 × 7 must be less than 7.", "0.3 has only 1 decimal place, so the answer has 1.", "This is multiplying, not adding."]}]}, {"type": "tap", "kick": "Read", "title": "Week 6 skill: The New Kid", "text": "Read the story. Then answer.", "visual": {"kind": "passage", "text": "<b>The New Kid</b><br>On his first day at Oak Ridge School, Owen ate lunch alone and kept his eyes on his tray. When Coach Rivera asked who wanted to try out for the soccer team, Owen stared at the floor. That afternoon, a ball rolled to his feet at recess. Without thinking, he kicked it back: a perfect pass. “Whoa! Play with us!” shouted a girl named Tasha. Owen played until the bell. Week by week he joined in more. By the end of the month, he was saving seats at lunch for Tasha and the others, and his name was on the soccer team list."}, "items": [{"q": "What is the TURNING POINT in Owen's story?", "choices": ["Owen eats lunch alone and keeps his eyes on his tray", "Owen's perfect pass, and Tasha's “Play with us!”", "Coach Rivera asks who wants to try out for soccer", "Owen's name is on the soccer team list"], "a": 1, "why": "The perfect pass and Tasha's “Play with us!” are when things start to shift for Owen.", "no": ["That is how he is at the START.", null, "Owen stares at the floor then. Nothing has changed yet.", "That is the END, after the change."]}, {"q": "The story says “Week by week he joined in more.” What does that show about Owen's change?", "choices": ["It happened all at once, in a single day", "It never really happened at all", "It was gradual: slow, in small steps", "It was Coach Rivera's idea, not Owen's"], "a": 2, "why": "“Week by week” means slowly, a little at a time. The change was <b>gradual</b>.", "no": ["“Week by week” means it took time.", "By the end he saves seats and joins the team, so he did change.", null, "The coach only asked once. Owen's own choices changed him."]}, {"type": "fill", "q": "At the end, Owen's name is on which team's list? Type the sport.", "answers": ["soccer", "the soccer team", "soccer team"], "why": "“His name was on the <b>soccer</b> team list.”", "no": "Look at the last sentence.", "hint": "Coach Rivera coaches it."}]}, {"type": "tap", "kick": "Read", "title": "Week 9 skill: two sources", "text": "Read both sources. Look for the signal words.", "visual": {"kind": "passage", "text": "<b>Source A · Kids' Science Magazine</b><br>Both honeybees and bumblebees carry pollen from flower to flower. However, they live very differently. Honeybees live in huge hives of thousands of bees, and a hive can last for years. Unlike honeybees, most bumblebees live in small nests of fewer than 200 bees, and a nest lasts only one summer.<br><br><b>Source B · Garden Club Newsletter</b><br>First, our club counted the bees in the school garden in the spring: only 14. Next, we planted three rows of lavender and clover. Finally, we counted again at the end of the summer and found 61 bees, most of them bumblebees."}, "items": [{"type": "fill", "q": "What text structure does <b>Source B</b> use? Type it.", "answers": ["sequence", "a sequence", "sequencing", "time order", "order", "chronological order", "chronological"], "why": "“First,” “Next” and “Finally” put the events in time order: <b>sequence</b>.", "no": "Look at the first word of each sentence.", "hint": "First, next, finally."}, {"q": "What text structure does <b>Source A</b> use?", "choices": ["Sequence", "Problem and its solution", "Compare and contrast", "Cause and effect"], "a": 2, "why": "“Both,” “However” and “Unlike” show how honeybees and bumblebees are alike and different: <b>compare and contrast</b>.", "no": ["Source A has no first, next or finally.", "Source A doesn't fix any problem.", null, "Source A doesn't explain why something happened."]}, {"q": "Which is the STRONGEST conclusion using BOTH sources?", "choices": ["Honeybees are better than bumblebees, because Source A says their hives are huge and last for years", "Flowers raised the garden's bees from 14 to 61, mostly bumblebees, which live in small nests", "Only Source B matters", "Bees only like lavender"], "a": 1, "why": "It uses a fact from each source and connects them: Source B's new bees were mostly bumblebees, the small-nest bees Source A describes.", "no": ["Neither source says one kind is better. A big hive doesn't make a bee better.", null, "Source A tells you about the bumblebees that showed up.", "The club planted lavender AND clover. Neither source says bees like only lavender."]}]}, {"type": "tap", "kick": "Word Power", "title": "Use your words", "text": "Type the word from memory.", "items": [{"type": "fill", "q": "6/8 written as 3/4 is in ________ ________.", "answers": ["simplest form", "its simplest form", "simplest"], "why": "3/4 is 6/8 in <b>simplest form</b>.", "no": "Two words. The smallest numbers possible.", "hint": "It starts with s-i-m."}, {"type": "fill", "q": "Something you figure out from clues in the text is an ________.", "answers": ["inference", "an inference", "inferences"], "why": "That is an <b>inference</b>.", "no": "Lena's pounding heart let you make one.", "hint": "It starts with i-n-f-e-r."}, {"type": "fill", "q": "Happening slowly, in small steps, not all at once, is ________.", "answers": ["gradual", "gradually"], "why": "That is <b>gradual</b>.", "no": "Owen's change was this.", "hint": "It starts with g-r-a."}, {"type": "fill", "q": "How a character is different at the end of a story than at the start is called ________ ________.", "answers": ["character change", "a character change", "change"], "why": "That is <b>character change</b>.", "no": "Two words. The first is character.", "hint": "It starts with c-h-a-r."}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Week 6. <b>68 × 47 = ____</b>", "answers": ["3,196", "3196"], "why": "68 × 7 = 476 and 68 × 40 = 2,720. 476 + 2,720 = <b>3,196</b>.", "no": "Ones row first. Then write the 0 for the tens row and multiply by the tens digit. Add the rows.", "hint": "68 × 7 = 476."}, {"type": "fill", "q": "Week 7. <b>851 ÷ 37 = ____</b>", "answers": ["23", "23 R0", "23 remainder 0"], "why": "85 ÷ 37 → 2 (2 × 37 = 74), 11 left. Bring down 1: 111 ÷ 37 → 3 (3 × 37 = 111), 0 left. <b>23</b>. Check: 37 × 23 = 851.", "no": "Divide, multiply, subtract, bring down. Then write the check: divisor × quotient (+ remainder).", "hint": "Multiples of 37: 37, 74, 111, 148, 185."}, {"type": "fill", "q": "Week 8. <b>5/8 + 1/6 = ____</b> Type it in simplest form.", "answers": ["19/24"], "why": "Multiples of 8: 8, 16, 24. Multiples of 6: 6, 12, 18, 24. The common denominator is <b>24</b>. 5/8 = 15/24 and 1/6 = 4/24. 15/24 + 4/24 = 19/24. <b>19/24</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Week 9. Pears cost <b>$3.55</b> a pound. A customer buys <b>4</b> pounds. What do the pears cost?", "answers": ["14.20", "14.2", "$14.20", "$14.2"], "why": "Ignore the decimal point: 355 × 4 = 1,420. 3.55 has 2 decimal places, so the answer has 2: <b>$14.20</b>. Estimate: $3.55 is between $3.50 and $4. $3.50 × 4 = $14 and $4 × 4 = $16, so $14.20 is reasonable.", "no": "Multiply like whole numbers first. Then count the digits after the decimal point and put it back. Check with an estimate.", "hint": "355 × 4 = 1,420.", "placeholder": "Example: 4.50"}, {"type": "fill", "q": "Week 9. Grapes cost <b>$3.40</b> a pound. A customer asks for <b>half a pound</b>. What does it cost?", "answers": ["1.70", "1.7", "$1.70", "$1.7"], "why": "Half a pound is 0.5 lb, so it costs half the price: $3.40 ÷ 2 = <b>$1.70</b>. Same as $3.40 × 0.5.", "no": "Half a pound costs half the price of a whole pound.", "hint": "Half of $3.40.", "placeholder": "Example: 4.50"}, {"type": "fill", "q": "Two skills. A 60-row garden is <b>3/10</b> corn and <b>1/4</b> beans. The rest is empty. How many rows are <b>empty</b>?", "answers": ["27", "27 rows", "twenty-seven", "twenty seven"], "why": "3/10 + 1/4 = 6/20 + 5/20 = 11/20 planted. 11/20 of 60: 60 ÷ 20 = 3, and 3 × 11 = 33 rows. Empty: 60 − 33 = <b>27</b>.", "no": "Add the fractions. Find that fraction of 60. Then subtract from 60.", "hint": "3/10 + 1/4 = 11/20. 60 ÷ 20 = 3.", "placeholder": "Type a number"}, {"q": "How has Ruby CHANGED from the start to the end?", "choices": ["She still rushes and thinks math is boring", "She went from rushing through math to checking her work twice", "She quit running the store", "She learned to count coins with her grandpa, so she has not changed"], "a": 1, "why": "At the start she rushes and calls math “boring.” At the end she checks every answer twice and asks for harder problems.", "no": ["Look at the last sentence: she checks every answer twice.", null, "Nothing says she quit.", "Counting coins is HOW she changed, not proof that she didn't."], "visual": {"kind": "passage", "text": "<b>Ruby Runs the Store</b><br>At the start of the school year, Ruby said math was “boring” and rushed through every worksheet. Then her class opened a pretend store, and Ruby was picked to run the cash box. On the first day she gave a customer the wrong change, and the line got long. That night she practiced counting change with her grandpa's coin jar. By winter break, Ruby checked every answer twice and asked her teacher for harder money problems."}}, {"q": "What do Ana and Mr. Lee AGREE on?", "choices": ["The pool should stay closed all summer", "Kids need a safe place to swim", "Lifeguards should not have to go to school", "The weather is too cold to swim"], "a": 1, "why": "Mr. Lee writes, “I want kids to have a safe place to swim, too.” Both want that.", "no": ["Mr. Lee only worries about opening EARLY, not all summer.", null, "Nobody says that. The lifeguards' classes are just a fact.", "Ana says it is already hot."], "visual": {"kind": "passage", "text": "<b>Open the Pool Early?</b><br><b>Ana writes:</b> “The town pool should open a month early this year. It is already hot, and kids need a safe place to cool off and swim.”<br><br><b>Mr. Lee, the pool manager, writes:</b> “I want kids to have a safe place to swim, too. But most of our lifeguards are still in high school, and their classes don't end until next month. Without enough lifeguards on duty, opening early would not be safe.”"}}, {"q": "What is the author's purpose of “Don't Miss It!”?", "choices": ["To inform readers of the festival's hours and where to park", "To entertain with a joke", "To persuade readers to come to the festival", "To tell a story about a scarecrow"], "a": 2, "why": "“The best event of the whole year,” “the tastiest” and “you'll be sorry if you miss it” try to get readers to come: <b>persuade</b>.", "no": ["It gives no hours and no parking. It is trying to convince you.", "There is no joke in it.", null, "There is no story and no scarecrow."], "visual": {"kind": "passage", "text": "<b>Don't Miss It!</b><br>“Come to the Lakeside Harvest Festival! The pie contest is the best event of the whole year, and the apple cider is the tastiest in the county. Bring your friends, because you'll be sorry if you miss it!”"}}, {"type": "fill", "q": "What text structure does <b>The Lunch Line</b> use? Type it.", "answers": ["problem and solution", "problem & solution", "problem/solution", "problem solution", "problem-solution", "problems and solutions"], "why": "“A big problem” and “To solve it” name a problem and a fix: <b>problem and solution</b>.", "no": "Look for the words problem and solve.", "hint": "Problem and …", "visual": {"kind": "passage", "text": "<b>The Lunch Line</b><br>At Pine Hill School, the lunch line was a big problem. Students waited up to fifteen minutes for their food, and some had only five minutes left to eat. To solve it, the school opened a second serving window on the other side of the cafeteria. Now most students get their lunch in about five minutes."}}], [{"type": "fill", "q": "Week 6. <b>73 × 36 = ____</b>", "answers": ["2,628", "2628"], "why": "73 × 6 = 438 and 73 × 30 = 2,190. 438 + 2,190 = <b>2,628</b>.", "no": "Ones row first. Then write the 0 for the tens row and multiply by the tens digit. Add the rows.", "hint": "73 × 6 = 438."}, {"type": "fill", "q": "Week 7. <b>806 ÷ 31 = ____</b>", "answers": ["26", "26 R0", "26 remainder 0"], "why": "80 ÷ 31 → 2 (2 × 31 = 62), 18 left. Bring down 6: 186 ÷ 31 → 6 (6 × 31 = 186), 0 left. <b>26</b>. Check: 31 × 26 = 806.", "no": "Divide, multiply, subtract, bring down. Then write the check: divisor × quotient (+ remainder).", "hint": "Multiples of 31: 31, 62, 93, 124, 155."}, {"type": "fill", "q": "Week 8. <b>7/10 − 1/4 = ____</b> Type it in simplest form.", "answers": ["9/20"], "why": "Multiples of 10: 10, 20. Multiples of 4: 4, 8, 12, 16, 20. The common denominator is <b>20</b>. 7/10 = 14/20 and 1/4 = 5/20. 14/20 − 5/20 = 9/20. <b>9/20</b>", "no": "Did you subtract the bottom numbers too? Never do that. Rename both fractions with a common denominator, then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Week 9. Each piece of ribbon is <b>2.8</b> meters long. How many meters are <b>6</b> pieces?", "answers": ["16.80", "16.8"], "why": "Ignore the decimal point: 28 × 6 = 168. 2.8 has 1 decimal place, so the answer has 1: <b>16.8</b>. Estimate: 2.8 is about 3, and 3 × 6 = 18. 16.8 is reasonable.", "no": "Multiply like whole numbers first. Then count the digits after the decimal point and put it back. Check with an estimate.", "hint": "28 × 6 = 168.", "placeholder": "Example: 2.4"}, {"type": "fill", "q": "Week 9. Cheddar cheese costs <b>$5.60</b> a pound. A customer asks for <b>half a pound</b>. What does it cost?", "answers": ["2.80", "2.8", "$2.80", "$2.8"], "why": "Half a pound is 0.5 lb, so it costs half the price: $5.60 ÷ 2 = <b>$2.80</b>. Same as $5.60 × 0.5.", "no": "Half a pound costs half the price of a whole pound.", "hint": "Half of $5.60.", "placeholder": "Example: 4.50"}, {"type": "fill", "q": "Two skills. A baker makes <b>48</b> cupcakes. <b>5/12</b> are vanilla and <b>1/3</b> are chocolate. The rest are lemon. How many are <b>lemon</b>?", "answers": ["12", "12 cupcakes", "twelve"], "why": "5/12 + 1/3 = 5/12 + 4/12 = 9/12 vanilla or chocolate. 9/12 of 48: 48 ÷ 12 = 4, and 4 × 9 = 36. Lemon: 48 − 36 = <b>12</b>.", "no": "Add the fractions. Find that fraction of 48. Then subtract from 48.", "hint": "5/12 + 1/3 = 9/12. 48 ÷ 12 = 4.", "placeholder": "Type a number"}, {"q": "Which words BEST describe how Mateo feels about working with a partner at the END?", "choices": ["Sure that he works faster alone", "Bored with the science fair", "Jealous of Priya", "Glad to have Priya's help"], "a": 3, "why": "At the end he tells the judges, “Priya and I fixed it together,” and asks her to be his partner again. He is glad to have her help.", "no": ["That is how he felt at the START.", "Nothing in the story shows he is bored.", "He thanks Priya and wants to work with her again.", null], "visual": {"kind": "passage", "text": "<b>Mateo's Volcano</b><br>Mateo didn't want a partner for the science fair. “I work faster alone,” he told Ms. Park. But his volcano kept leaking, and the night before the fair, it fell apart. The next morning, his classmate Priya showed him how to build a stronger base out of clay. At the fair, Mateo told the judges, “Priya and I fixed it together.” Then he asked her to be his partner again next year."}}, {"q": "What is Ms. Hart's MAIN concern about building the skate park?", "choices": ["Kids should not be allowed to skate at all", "A skate park would be much too noisy for neighbors", "This year's money is already spent on roads", "The parking lot is too small for skaters"], "a": 2, "why": "She writes that the skate park costs $200,000 and “this year's money is already spent on fixing roads.” That is her main concern.", "no": ["She agrees kids need a safe place to skate.", "She never mentions noise.", null, "Lily is the one who talks about the parking lot, and size is not the problem."], "visual": {"kind": "passage", "text": "<b>A Skate Park for Our Town?</b><br><b>Lily writes:</b> “Our town should build a skate park. Right now, kids skate in the grocery store parking lot, and cars drive right past them.”<br><br><b>Ms. Hart, from the town council, writes:</b> “I agree that kids need a safe place to skate. But a skate park costs about $200,000, and this year's money is already spent on fixing roads. Let's raise money this year and build it next spring.”"}}, {"q": "Why did the writer write Harvest Festival News?", "choices": ["To persuade readers to enter the pie contest", "To inform readers about the festival", "To entertain with a funny story", "To compare two festivals"], "a": 1, "why": "It gives plain facts: the day, the time, the place, the parking and when the pie contest starts. That <b>informs</b>.", "no": ["It tells when the contest starts, but it never tries to talk you into entering.", null, "Nothing in it is funny.", "It is about only one festival."], "visual": {"kind": "passage", "text": "<b>Harvest Festival News</b><br>“The Lakeside Harvest Festival is this Saturday from 10am to 4pm at Lakeside Park. Parking is free in the north lot. The pie contest starts at noon in the big white tent.”"}}, {"type": "fill", "q": "What text structure does <b>Shady Main Street</b> use? Type it.", "answers": ["cause and effect", "cause & effect", "cause/effect", "cause effect", "cause-effect", "cause and affect", "causes and effects"], "why": "“Because” and “As a result” tell why something happened and what happened next: <b>cause and effect</b>.", "no": "Look for the words because and as a result.", "hint": "Cause and …", "visual": {"kind": "passage", "text": "<b>Shady Main Street</b><br>Three years ago, the town planted forty oak trees along Main Street. Because the trees now shade the sidewalks, the street stays much cooler on summer afternoons. As a result, more families walk to the shops instead of driving."}}], [{"type": "fill", "q": "Week 6. <b>59 × 38 = ____</b>", "answers": ["2,242", "2242"], "why": "59 × 8 = 472 and 59 × 30 = 1,770. 472 + 1,770 = <b>2,242</b>.", "no": "Ones row first. Then write the 0 for the tens row and multiply by the tens digit. Add the rows.", "hint": "59 × 8 = 472."}, {"type": "fill", "q": "Week 7. <b>667 ÷ 23 = ____</b>", "answers": ["29", "29 R0", "29 remainder 0"], "why": "66 ÷ 23 → 2 (2 × 23 = 46), 20 left. Bring down 7: 207 ÷ 23 → 9 (9 × 23 = 207), 0 left. <b>29</b>. Check: 23 × 29 = 667.", "no": "Divide, multiply, subtract, bring down. Then write the check: divisor × quotient (+ remainder).", "hint": "Multiples of 23: 23, 46, 69, 92, 115."}, {"type": "fill", "q": "Week 8. <b>2/3 + 1/5 = ____</b> Type it in simplest form.", "answers": ["13/15"], "why": "Multiples of 3: 3, 6, 9, 12, 15. Multiples of 5: 5, 10, 15. The common denominator is <b>15</b>. 2/3 = 10/15 and 1/5 = 3/15. 10/15 + 3/15 = 13/15. <b>13/15</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Week 9. Apples cost <b>$1.45</b> a pound. A customer buys <b>5</b> pounds. What do the apples cost?", "answers": ["7.25", "$7.25"], "why": "Ignore the decimal point: 145 × 5 = 725. 1.45 has 2 decimal places, so the answer has 2: <b>$7.25</b>. Estimate: $1.45 is about $1.50, and $1.50 × 5 = $7.50. $7.25 is reasonable.", "no": "Multiply like whole numbers first. Then count the digits after the decimal point and put it back. Check with an estimate.", "hint": "145 × 5 = 725.", "placeholder": "Example: 4.50"}, {"type": "fill", "q": "Week 9. Cherries cost <b>$4.90</b> a pound. A customer asks for <b>half a pound</b>. What does it cost?", "answers": ["2.45", "$2.45"], "why": "Half a pound is 0.5 lb, so it costs half the price: $4.90 ÷ 2 = <b>$2.45</b>. Same as $4.90 × 0.5.", "no": "Half a pound costs half the price of a whole pound.", "hint": "Half of $4.90.", "placeholder": "Example: 4.50"}, {"type": "fill", "q": "Two skills. <b>40</b> students go on a field trip. <b>1/5</b> ride in vans and <b>3/8</b> ride the bus. The rest walk. How many students <b>walk</b>?", "answers": ["17", "17 students", "seventeen"], "why": "1/5 + 3/8 = 8/40 + 15/40 = 23/40 ride. 23/40 of 40 is 23 students. Walk: 40 − 23 = <b>17</b>.", "no": "Add the fractions. Find that fraction of 40. Then subtract from 40.", "hint": "1/5 + 3/8 = 23/40.", "placeholder": "Type a number"}, {"q": "How has Owen CHANGED from the start to the end?", "choices": ["He went from eating alone to having friends and a team", "He is still eating lunch alone and keeping his eyes on his tray", "He became the soccer coach's helper", "He stopped playing soccer after the first week"], "a": 0, "why": "At the start he eats alone and stares at the floor. At the end he saves seats for friends and his name is on the team list.", "no": [null, "At the end he saves seats for Tasha and the others.", "Coach Rivera is the coach. Owen joins the team as a player.", "His name is on the soccer team list at the end."], "visual": {"kind": "passage", "text": "<b>The New Kid</b><br>On his first day at Oak Ridge School, Owen ate lunch alone and kept his eyes on his tray. When Coach Rivera asked who wanted to try out for the soccer team, Owen stared at the floor. That afternoon, a ball rolled to his feet at recess. Without thinking, he kicked it back: a perfect pass. “Whoa! Play with us!” shouted a girl named Tasha. Owen played until the bell. Week by week he joined in more. By the end of the month, he was saving seats at lunch for Tasha and the others, and his name was on the soccer team list."}}, {"q": "Why does Ms. Grant plan for each group leader to carry a school tablet and a phone?", "choices": ["She wants to take all of the zoo photos for the reports herself", "She doesn't care about safety", "Students still get photos and help, but fewer phones get lost", "Marco asked her to"], "a": 2, "why": "It is a compromise: students still get photos and a way to call for help, which Marco wanted, without the problems she lists.", "no": ["The group leaders take the photos, for the whole group.", "She writes, “I want students to be safe.”", null, "Marco asked for every student to bring a phone. Her plan is different."], "visual": {"kind": "passage", "text": "<b>Phones on the Field Trip?</b><br><b>Marco writes:</b> “Students should be allowed to bring phones on the zoo field trip. We could take photos for our animal reports, and if anyone gets separated, they could call a teacher right away.”<br><br><b>Ms. Grant, the fifth-grade teacher, writes:</b> “I want students to be safe and to bring back great photos, too. But phones get dropped, lost, and checked during the animal talks. So each group leader will carry a school tablet for photos and a phone for emergencies.”"}}, {"q": "Which piece was written mainly to <b>entertain</b>?", "choices": ["Harvest Festival News, with the hours and parking", "Don't Miss It!, about the pie contest", "A list of festival rules", "Festival Funnies, the scarecrow joke"], "a": 3, "why": "A joke is written to make you laugh: <b>entertain</b>.", "no": ["Hours and parking are facts that inform.", "That piece tries to get you to come: persuade.", "Rules give information.", null], "visual": {"kind": "passage", "text": "<b>Festival Funnies</b><br>“Why did the scarecrow win a prize at the festival? Because he was outstanding in his field!”"}}, {"type": "fill", "q": "What text structure does <b>Gators and Crocs</b> use? Type it.", "answers": ["compare and contrast", "compare & contrast", "compare/contrast", "compare contrast", "compare-contrast", "comparing and contrasting"], "why": "“Both,” “However” and “Unlike” show how alligators and crocodiles are alike and different: <b>compare and contrast</b>.", "no": "Look for the words both, however and unlike.", "hint": "Compare and …", "visual": {"kind": "passage", "text": "<b>Gators and Crocs</b><br>Both alligators and crocodiles live in Florida, and both are reptiles with powerful jaws. However, an alligator has a wide, rounded snout, while a crocodile's snout is long and pointed. Unlike alligators, which live mostly in fresh water, Florida's crocodiles are usually found in salty water near the coast."}}]]}], "win": "You showed off your Feast Report and reviewed all eight Unit 2 skills. You're ready for the Checkpoint!", "prev": "bb-ethan-L04", "prevTitle": "Lesson 4"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflow
