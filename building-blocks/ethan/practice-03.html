<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan · Practice 3</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Sophia&#x27;s Garden Plot and Ravi&#x27;s Newsletter</h1><p style="margin:0 0 12px;color:#5b6578">Three tries on each one. Only your first try counts. Work every fraction problem on paper, then type the answer in simplest form.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Ethan", "label": "Lesson 3", "title": "Sophia's Garden Plot and Ravi's Newsletter", "mastery": 85, "color": "#8E44AD", "questions": [{"type": "fill", "q": "Lesson 1 review. <b>47 × 23 = ____</b>", "answers": ["1,081", "1081"], "why": "47 × 3 = 141 and 47 × 20 = 940. 141 + 940 = <b>1,081</b>.", "no": "Ones row, then write the 0 for the tens row, then add.", "hint": "47 × 3 = 141."}, {"type": "fill", "q": "Lesson 2 review. <b>923 ÷ 7 = ____</b> Type it like 5 R2.", "answers": ["131 R6", "131 r 6", "131r6", "131 remainder 6", "131 rem 6", "131 R 6", "131 remainder of 6", "131 with 6 left over", "131 with 6 left"], "why": "9 ÷ 7 → 1 (1 × 7 = 7), 2 left. Bring down 2: 22 ÷ 7 → 3 (3 × 7 = 21), 1 left. Bring down 3: 13 ÷ 7 → 1 (1 × 7 = 7), 6 left. <b>131 R6</b>. Check: 7 × 131 + 6 = 923.", "no": "Start with 9. Divide, multiply, subtract, bring down.", "hint": "Write the check: divisor × quotient + remainder.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "Rename it as an equivalent fraction. <b>3/8 = ____/24</b> Type the numerator.", "answers": ["9", "9/24"], "why": "8 × 3 = 24, so multiply the numerator by 3 too: 3 × 3 = 9. <b>3/8 = 9/24</b>.", "no": "What do you multiply 8 by to get 24? Multiply the numerator by the same number.", "hint": "8 × 3 = 24. Now do 3 × 3.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>1/3 + 3/7 = ____</b> Type it in simplest form.", "answers": ["16/21"], "why": "Multiples of 3: 3, 6, 9, 12, 15, 18, 21. Multiples of 7: 7, 14, 21. The common denominator is <b>21</b>. 1/3 = 7/21 and 3/7 = 9/21. 7/21 + 9/21 = 16/21. <b>16/21</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>5/6 − 3/8 = ____</b> Type it in simplest form.", "answers": ["11/24"], "why": "Multiples of 6: 6, 12, 18, 24. Multiples of 8: 8, 16, 24. The common denominator is <b>24</b>. 5/6 = 20/24 and 3/8 = 9/24. 20/24 − 9/24 = 11/24. <b>11/24</b>", "no": "Did you subtract the bottom numbers too? Never do that. Rename both fractions with a common denominator, then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>2/3 + 5/6 = ____</b> Type it as a mixed number in simplest form, like 1 1/2.", "answers": ["1 1/2", "1-1/2", "1 and 1/2"], "why": "6 is a multiple of 3, so the common denominator is <b>6</b>. 2/3 = 4/6. 4/6 + 5/6 = 9/6. 9/6 is more than 1 whole (6/6 = 1): 9/6 = 1 3/6 = 1 1/2 (divide the 3 and the 6 by 3). <b>1 1/2</b>", "no": "Did you add the bottom numbers too? Never do that. Only one fraction needs renaming: 6 is a multiple of 3, so 5/6 stays as it is and you rename 2/3. Then add only the numerators and keep the denominator. Simplify, and because the answer is more than 1 whole, type it as a mixed number (whole number, space, fraction), not as a fraction whose top number is bigger than its bottom number.", "placeholder": "Example: 1 1/2"}, {"q": "Sophia's corn uses <b>5/7</b> of a row. Her beans use <b>3/4</b> of a row. Which uses more of the row?", "choices": ["The corn (5/7)", "The beans (3/4)", "They use the same amount", "You can't compare fractions with unlike denominators"], "a": 1, "why": "Common denominator 28: 5/7 = 20/28 and 3/4 = 21/28. 21/28 is more than 20/28, so <b>3/4</b> is bigger.", "no": ["Rename both with the common denominator 28: 5/7 = 20/28 and 3/4 = 21/28. 20/28 is less, so 5/7 is the smaller one.", null, "Renamed with a common denominator, the numerators are different.", "You can: rename both with a common denominator."]}, {"q": "Someone wrote: <b>3/5 + 1/3 = 4/8</b>. What went wrong?", "choices": ["They added the numerators AND the denominators. It is 9/15 + 5/15 = 14/15.", "Nothing. 4/8 is right.", "4/8 is right, but it should be simplified to 1/2", "They should have used 8 as the common denominator"], "a": 0, "why": "Never add the denominators. 3/5 by itself is more than 1/2, but 4/8 is exactly 1/2. 3/5 + 1/3 = 9/15 + 5/15 = <b>14/15</b>.", "no": [null, "Estimate: 3/5 alone is more than 1/2, and 4/8 is only 1/2. Adding 1/3 must make it bigger than 3/5.", "Simplifying does not fix it: 4/8 is the wrong amount.", "8 is not a multiple of 5 or of 3. Use 15."]}, {"q": "Which section of Ravi's newsletter should the crosswalk letter go in?", "visual": {"kind": "passage", "text": "<b>Reader's Letter</b><br>“Our neighborhood REALLY needs a crosswalk near the elementary school. I've watched kids dash across that street every single morning, and cars don't always slow down. Please, everyone — sign the petition at the library and let's get this crosswalk built before someone gets hurt.”"}, "choices": ["News", "Opinions", "Fun &amp; Games", "Business Spotlight"], "a": 1, "why": "It tries to persuade readers to sign a petition, so it goes in <b>Opinions</b>.", "no": ["News reports facts. This letter tries to get readers to act.", null, "It is not a joke or a game.", "It is not about a business."]}, {"type": "fill", "q": "On what day is the park cleanup? Type the day.", "visual": {"kind": "passage", "text": "<b>Newsletter Notice: The Park Cleanup</b><br>“Join us Saturday at 9am for the annual Maple Street Park cleanup! Bring gloves if you have them — we'll supply trash bags and water. Last year, volunteers collected over 200 pounds of litter in just two hours.”"}, "answers": ["Saturday", "on Saturday", "this Saturday", "Sat", "Saturday at 9am", "Saturday at 9", "Saturday morning"], "why": "The notice says: “Join us <b>Saturday</b> at 9am.”", "no": "Look at the first sentence.", "hint": "It is a weekend day."}, {"q": "The bakery spotlight blends two purposes. Which two?", "visual": {"kind": "passage", "text": "<b>Business Spotlight</b><br>“New this month: Ravi's family bakery is now open Saturdays 8am-2pm at 214 Maple Street. Try their cinnamon rolls, voted a neighborhood favorite three years running.”"}, "choices": ["Inform and persuade", "Inform and entertain", "Persuade and entertain", "Only entertain"], "a": 0, "why": "The hours and address <b>inform</b>. “Try their cinnamon rolls, voted a neighborhood favorite” <b>persuades</b>.", "no": [null, "There is nothing funny in it. Look for the part that tries to get you to visit.", "There is nothing funny in it. Look for plain facts.", "It is not a joke. It has facts and it tries to get you to visit."]}, {"type": "fill", "q": "The author's ________ is WHY a writer wrote a piece.", "answers": ["purpose", "author's purpose"], "why": "The author's <b>purpose</b> is the reason: inform, persuade or entertain.", "no": "It names the reason.", "hint": "It starts with p-u-r."}], "id": "ethan-L03", "sets": [[{"type": "fill", "q": "Lesson 1 review. <b>47 × 23 = ____</b>", "answers": ["1,081", "1081"], "why": "47 × 3 = 141 and 47 × 20 = 940. 141 + 940 = <b>1,081</b>.", "no": "Ones row, then write the 0 for the tens row, then add.", "hint": "47 × 3 = 141."}, {"type": "fill", "q": "Lesson 2 review. <b>923 ÷ 7 = ____</b> Type it like 5 R2.", "answers": ["131 R6", "131 r 6", "131r6", "131 remainder 6", "131 rem 6", "131 R 6", "131 remainder of 6", "131 with 6 left over", "131 with 6 left"], "why": "9 ÷ 7 → 1 (1 × 7 = 7), 2 left. Bring down 2: 22 ÷ 7 → 3 (3 × 7 = 21), 1 left. Bring down 3: 13 ÷ 7 → 1 (1 × 7 = 7), 6 left. <b>131 R6</b>. Check: 7 × 131 + 6 = 923.", "no": "Start with 9. Divide, multiply, subtract, bring down.", "hint": "Write the check: divisor × quotient + remainder.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "Rename it as an equivalent fraction. <b>3/8 = ____/24</b> Type the numerator.", "answers": ["9", "9/24"], "why": "8 × 3 = 24, so multiply the numerator by 3 too: 3 × 3 = 9. <b>3/8 = 9/24</b>.", "no": "What do you multiply 8 by to get 24? Multiply the numerator by the same number.", "hint": "8 × 3 = 24. Now do 3 × 3.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>1/3 + 3/7 = ____</b> Type it in simplest form.", "answers": ["16/21"], "why": "Multiples of 3: 3, 6, 9, 12, 15, 18, 21. Multiples of 7: 7, 14, 21. The common denominator is <b>21</b>. 1/3 = 7/21 and 3/7 = 9/21. 7/21 + 9/21 = 16/21. <b>16/21</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>5/6 − 3/8 = ____</b> Type it in simplest form.", "answers": ["11/24"], "why": "Multiples of 6: 6, 12, 18, 24. Multiples of 8: 8, 16, 24. The common denominator is <b>24</b>. 5/6 = 20/24 and 3/8 = 9/24. 20/24 − 9/24 = 11/24. <b>11/24</b>", "no": "Did you subtract the bottom numbers too? Never do that. Rename both fractions with a common denominator, then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>2/3 + 5/6 = ____</b> Type it as a mixed number in simplest form, like 1 1/2.", "answers": ["1 1/2", "1-1/2", "1 and 1/2"], "why": "6 is a multiple of 3, so the common denominator is <b>6</b>. 2/3 = 4/6. 4/6 + 5/6 = 9/6. 9/6 is more than 1 whole (6/6 = 1): 9/6 = 1 3/6 = 1 1/2 (divide the 3 and the 6 by 3). <b>1 1/2</b>", "no": "Did you add the bottom numbers too? Never do that. Only one fraction needs renaming: 6 is a multiple of 3, so 5/6 stays as it is and you rename 2/3. Then add only the numerators and keep the denominator. Simplify, and because the answer is more than 1 whole, type it as a mixed number (whole number, space, fraction), not as a fraction whose top number is bigger than its bottom number.", "placeholder": "Example: 1 1/2"}, {"q": "Sophia's corn uses <b>5/7</b> of a row. Her beans use <b>3/4</b> of a row. Which uses more of the row?", "choices": ["The corn (5/7)", "The beans (3/4)", "They use the same amount", "You can't compare fractions with unlike denominators"], "a": 1, "why": "Common denominator 28: 5/7 = 20/28 and 3/4 = 21/28. 21/28 is more than 20/28, so <b>3/4</b> is bigger.", "no": ["Rename both with the common denominator 28: 5/7 = 20/28 and 3/4 = 21/28. 20/28 is less, so 5/7 is the smaller one.", null, "Renamed with a common denominator, the numerators are different.", "You can: rename both with a common denominator."]}, {"q": "Someone wrote: <b>3/5 + 1/3 = 4/8</b>. What went wrong?", "choices": ["They added the numerators AND the denominators. It is 9/15 + 5/15 = 14/15.", "Nothing. 4/8 is right.", "4/8 is right, but it should be simplified to 1/2", "They should have used 8 as the common denominator"], "a": 0, "why": "Never add the denominators. 3/5 by itself is more than 1/2, but 4/8 is exactly 1/2. 3/5 + 1/3 = 9/15 + 5/15 = <b>14/15</b>.", "no": [null, "Estimate: 3/5 alone is more than 1/2, and 4/8 is only 1/2. Adding 1/3 must make it bigger than 3/5.", "Simplifying does not fix it: 4/8 is the wrong amount.", "8 is not a multiple of 5 or of 3. Use 15."]}, {"q": "Which section of Ravi's newsletter should the crosswalk letter go in?", "visual": {"kind": "passage", "text": "<b>Reader's Letter</b><br>“Our neighborhood REALLY needs a crosswalk near the elementary school. I've watched kids dash across that street every single morning, and cars don't always slow down. Please, everyone — sign the petition at the library and let's get this crosswalk built before someone gets hurt.”"}, "choices": ["News", "Opinions", "Fun &amp; Games", "Business Spotlight"], "a": 1, "why": "It tries to persuade readers to sign a petition, so it goes in <b>Opinions</b>.", "no": ["News reports facts. This letter tries to get readers to act.", null, "It is not a joke or a game.", "It is not about a business."]}, {"type": "fill", "q": "On what day is the park cleanup? Type the day.", "visual": {"kind": "passage", "text": "<b>Newsletter Notice: The Park Cleanup</b><br>“Join us Saturday at 9am for the annual Maple Street Park cleanup! Bring gloves if you have them — we'll supply trash bags and water. Last year, volunteers collected over 200 pounds of litter in just two hours.”"}, "answers": ["Saturday", "on Saturday", "this Saturday", "Sat", "Saturday at 9am", "Saturday at 9", "Saturday morning"], "why": "The notice says: “Join us <b>Saturday</b> at 9am.”", "no": "Look at the first sentence.", "hint": "It is a weekend day."}, {"q": "The bakery spotlight blends two purposes. Which two?", "visual": {"kind": "passage", "text": "<b>Business Spotlight</b><br>“New this month: Ravi's family bakery is now open Saturdays 8am-2pm at 214 Maple Street. Try their cinnamon rolls, voted a neighborhood favorite three years running.”"}, "choices": ["Inform and persuade", "Inform and entertain", "Persuade and entertain", "Only entertain"], "a": 0, "why": "The hours and address <b>inform</b>. “Try their cinnamon rolls, voted a neighborhood favorite” <b>persuades</b>.", "no": [null, "There is nothing funny in it. Look for the part that tries to get you to visit.", "There is nothing funny in it. Look for plain facts.", "It is not a joke. It has facts and it tries to get you to visit."]}, {"type": "fill", "q": "The author's ________ is WHY a writer wrote a piece.", "answers": ["purpose", "author's purpose"], "why": "The author's <b>purpose</b> is the reason: inform, persuade or entertain.", "no": "It names the reason.", "hint": "It starts with p-u-r."}], [{"type": "fill", "q": "Lesson 1 review. <b>58 × 34 = ____</b>", "answers": ["1,972", "1972"], "why": "58 × 4 = 232 and 58 × 30 = 1,740. 232 + 1,740 = <b>1,972</b>.", "no": "Ones row, then write the 0 for the tens row, then add.", "hint": "58 × 4 = 232."}, {"type": "fill", "q": "Lesson 2 review. <b>781 ÷ 4 = ____</b> Type it like 5 R2.", "answers": ["195 R1", "195 r 1", "195r1", "195 remainder 1", "195 rem 1", "195 R 1", "195 remainder of 1", "195 with 1 left over", "195 with 1 left"], "why": "7 ÷ 4 → 1 (1 × 4 = 4), 3 left. Bring down 8: 38 ÷ 4 → 9 (9 × 4 = 36), 2 left. Bring down 1: 21 ÷ 4 → 5 (5 × 4 = 20), 1 left. <b>195 R1</b>. Check: 4 × 195 + 1 = 781.", "no": "Start with 7. Divide, multiply, subtract, bring down.", "hint": "Write the check: divisor × quotient + remainder.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "Rename it as an equivalent fraction. <b>5/7 = ____/28</b> Type the numerator.", "answers": ["20", "20/28"], "why": "7 × 4 = 28, so multiply the numerator by 4 too: 5 × 4 = 20. <b>5/7 = 20/28</b>.", "no": "What do you multiply 7 by to get 28? Multiply the numerator by the same number.", "hint": "7 × 4 = 28. Now do 5 × 4.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>2/9 + 1/6 = ____</b> Type it in simplest form.", "answers": ["7/18"], "why": "Multiples of 9: 9, 18. Multiples of 6: 6, 12, 18. The common denominator is <b>18</b>. 2/9 = 4/18 and 1/6 = 3/18. 4/18 + 3/18 = 7/18. <b>7/18</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>11/12 − 1/4 = ____</b> Type it in simplest form.", "answers": ["2/3"], "why": "12 is a multiple of 4, so the common denominator is <b>12</b>. 1/4 = 3/12. 11/12 − 3/12 = 8/12. Simplify: divide the numerator and the denominator by 4. 8/12 = 2/3. <b>2/3</b>", "no": "Did you subtract the bottom numbers too? Never do that. Only one fraction needs renaming: 12 is a multiple of 4, so 11/12 stays as it is and you rename 1/4. Then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>3/4 + 7/12 = ____</b> Type it as a mixed number in simplest form, like 1 1/2.", "answers": ["1 1/3", "1-1/3", "1 and 1/3"], "why": "12 is a multiple of 4, so the common denominator is <b>12</b>. 3/4 = 9/12. 9/12 + 7/12 = 16/12. 16/12 is more than 1 whole (12/12 = 1): 16/12 = 1 4/12 = 1 1/3 (divide the 4 and the 12 by 4). <b>1 1/3</b>", "no": "Did you add the bottom numbers too? Never do that. Only one fraction needs renaming: 12 is a multiple of 4, so 7/12 stays as it is and you rename 3/4. Then add only the numerators and keep the denominator. Simplify, and because the answer is more than 1 whole, type it as a mixed number (whole number, space, fraction), not as a fraction whose top number is bigger than its bottom number.", "placeholder": "Example: 1 1/2"}, {"q": "Sophia's squash uses <b>2/3</b> of a bed. Her melons use <b>7/10</b> of a bed. Which uses more of the bed?", "choices": ["They use the same amount", "The squash (2/3)", "The melons (7/10)", "You can't compare fractions with unlike denominators"], "a": 2, "why": "Common denominator 30: 2/3 = 20/30 and 7/10 = 21/30. 21/30 is more than 20/30, so <b>7/10</b> is bigger.", "no": ["Renamed with a common denominator, the numerators are different.", "Rename both with the common denominator 30: 2/3 = 20/30 and 7/10 = 21/30. 20/30 is less, so 2/3 is the smaller one.", null, "You can: rename both with a common denominator."]}, {"q": "Someone wrote: <b>1/4 + 5/12 = 6/12</b>. What went wrong?", "choices": ["They should have used 16 as the common denominator", "Nothing. 6/12 is right.", "6/12 is right, but it should be simplified to 1/2", "They changed 1/4 to twelfths but forgot to change its numerator. 1/4 = 3/12, so it is 8/12 = 2/3."], "a": 3, "why": "1/4 is not 1/12. Multiply the numerator by 3 too: 1/4 = 3/12. 3/12 + 5/12 = 8/12, and 8/12 = <b>2/3</b> in simplest form.", "no": ["12 works: 12 is a multiple of 4. The mistake is in renaming 1/4.", "6/12 is exactly 1/2, but 1/4 + 5/12 is more than 1/2.", "Simplifying does not fix it: 6/12 is the wrong amount.", null]}, {"q": "Which section of Ravi's newsletter should Riddle Corner go in?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">More from Ravi's newsletter</span><br><b>Riddle Corner</b><br>“What has keys but can't open a single door? A piano! What has hands but can't clap? A clock!”"}, "choices": ["News", "Opinions", "Business Spotlight", "Fun &amp; Games"], "a": 3, "why": "Riddles are there to entertain, so they go in <b>Fun &amp; Games</b>.", "no": ["News reports facts. Riddles are for fun.", "Riddle Corner does not try to convince anyone.", "It is not about a business.", null]}, {"type": "fill", "q": "What time does the library open on Saturday? Type the time.", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">More from Ravi's newsletter</span><br><b>Library News</b><br>“The Maple Street library will close early, at 3pm, this Friday so the staff can paint the reading room. It will open at the usual time, 10am, on Saturday. Books due on Friday can go in the drop box by the front door.”"}, "answers": ["10am", "10 am", "10", "10:00", "10:00 am", "10 o'clock", "at 10am", "at 10", "ten", "ten am", "ten o'clock", "10 in the morning"], "why": "Library News says it “will open at the usual time, <b>10am</b>, on Saturday.”", "no": "Look at the second sentence.", "hint": "It is in the morning."}, {"q": "What is the fountain writer's <b>point of view</b>?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">More from Ravi's newsletter</span><br><b>Reader's Letter: Fix the Fountain</b><br>“The water fountain at Maple Street Park has been broken since June. On hot days, the kids at the playground have nothing to drink. Last Saturday afternoon, I counted 30 kids on the playground! Please come to the neighborhood meeting on Monday night and vote to fix the fountain.”"}, "choices": ["The park should close on hot days", "Kids at the park need water, so the fountain should be fixed", "Neighborhood meetings are too long", "The playground needs more kids"], "a": 1, "why": "The writer says kids “have nothing to drink” on hot days and asks readers to “vote to fix the fountain.”", "no": ["The writer wants the fountain fixed, not the park closed.", null, "The letter never says the meetings are too long.", "The writer counted 30 kids to show many kids use the park."]}, {"type": "fill", "q": "A piece that gives facts, like Library News, is written to ________.", "answers": ["inform", "to inform"], "why": "Facts <b>inform</b> the reader.", "no": "News articles do this.", "hint": "It starts with i-n-f."}], [{"type": "fill", "q": "Lesson 1 review. <b>66 × 27 = ____</b>", "answers": ["1,782", "1782"], "why": "66 × 7 = 462 and 66 × 20 = 1,320. 462 + 1,320 = <b>1,782</b>.", "no": "Ones row, then write the 0 for the tens row, then add.", "hint": "66 × 7 = 462."}, {"type": "fill", "q": "Lesson 2 review. <b>647 ÷ 3 = ____</b> Type it like 5 R2.", "answers": ["215 R2", "215 r 2", "215r2", "215 remainder 2", "215 rem 2", "215 R 2", "215 remainder of 2", "215 with 2 left over", "215 with 2 left"], "why": "6 ÷ 3 → 2 (2 × 3 = 6), 0 left. Bring down 4: 4 ÷ 3 → 1 (1 × 3 = 3), 1 left. Bring down 7: 17 ÷ 3 → 5 (5 × 3 = 15), 2 left. <b>215 R2</b>. Check: 3 × 215 + 2 = 647.", "no": "Start with 6. Divide, multiply, subtract, bring down.", "hint": "Write the check: divisor × quotient + remainder.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "Rename it as an equivalent fraction. <b>2/9 = ____/36</b> Type the numerator.", "answers": ["8", "8/36"], "why": "9 × 4 = 36, so multiply the numerator by 4 too: 2 × 4 = 8. <b>2/9 = 8/36</b>.", "no": "What do you multiply 9 by to get 36? Multiply the numerator by the same number.", "hint": "9 × 4 = 36. Now do 2 × 4.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>3/10 + 1/4 = ____</b> Type it in simplest form.", "answers": ["11/20"], "why": "Multiples of 10: 10, 20. Multiples of 4: 4, 8, 12, 16, 20. The common denominator is <b>20</b>. 3/10 = 6/20 and 1/4 = 5/20. 6/20 + 5/20 = 11/20. <b>11/20</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>4/5 − 3/10 = ____</b> Type it in simplest form.", "answers": ["1/2"], "why": "10 is a multiple of 5, so the common denominator is <b>10</b>. 4/5 = 8/10. 8/10 − 3/10 = 5/10. Simplify: divide the numerator and the denominator by 5. 5/10 = 1/2. <b>1/2</b>", "no": "Did you subtract the bottom numbers too? Never do that. Only one fraction needs renaming: 10 is a multiple of 5, so 3/10 stays as it is and you rename 4/5. Then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>9/10 + 1/2 = ____</b> Type it as a mixed number in simplest form, like 1 1/2.", "answers": ["1 2/5", "1-2/5", "1 and 2/5"], "why": "10 is a multiple of 2, so the common denominator is <b>10</b>. 1/2 = 5/10. 9/10 + 5/10 = 14/10. 14/10 is more than 1 whole (10/10 = 1): 14/10 = 1 4/10 = 1 2/5 (divide the 4 and the 10 by 2). <b>1 2/5</b>", "no": "Did you add the bottom numbers too? Never do that. Only one fraction needs renaming: 10 is a multiple of 2, so 9/10 stays as it is and you rename 1/2. Then add only the numerators and keep the denominator. Simplify, and because the answer is more than 1 whole, type it as a mixed number (whole number, space, fraction), not as a fraction whose top number is bigger than its bottom number.", "placeholder": "Example: 1 1/2"}, {"q": "Sophia's lettuce uses <b>5/12</b> of a bed. Her carrots use <b>3/8</b> of a bed. Which uses more of the bed?", "choices": ["The carrots (3/8)", "They use the same amount", "The lettuce (5/12)", "You can't compare fractions with unlike denominators"], "a": 2, "why": "Common denominator 24: 5/12 = 10/24 and 3/8 = 9/24. 10/24 is more than 9/24, so <b>5/12</b> is bigger.", "no": ["Rename both with the common denominator 24: 3/8 = 9/24 and 5/12 = 10/24. 9/24 is less, so 3/8 is the smaller one.", "Renamed with a common denominator, the numerators are different.", null, "You can: rename both with a common denominator."]}, {"q": "Someone wrote: <b>7/8 − 1/2 = 6/6</b>. What went wrong?", "choices": ["Nothing. 6/6 is right.", "They should have added", "They subtracted the numerators AND the denominators. It is 7/8 − 4/8 = 3/8.", "6/6 is right, but it should be written as 1"], "a": 2, "why": "Never subtract the denominators. 6/6 is 1 whole, which is MORE than 7/8, and taking some away can't make it bigger. 7/8 − 1/2 = 7/8 − 4/8 = <b>3/8</b>.", "no": ["6/6 is 1 whole. That is more than 7/8, but the problem takes something away.", "It is a subtraction problem. The mistake is HOW they subtracted.", null, "6/6 is the wrong amount, however you write it."]}, {"q": "Which section of Ravi's newsletter should the park cleanup notice go in?", "visual": {"kind": "passage", "text": "<b>Newsletter Notice: The Park Cleanup</b><br>“Join us Saturday at 9am for the annual Maple Street Park cleanup! Bring gloves if you have them — we'll supply trash bags and water. Last year, volunteers collected over 200 pounds of litter in just two hours.”"}, "choices": ["Opinions", "News", "Fun &amp; Games", "Business Spotlight"], "a": 1, "why": "It gives facts (the day, the time, what to bring), so it goes in <b>News</b>.", "no": ["It does not argue for an opinion. It gives event facts.", null, "It is not a joke or a game.", "It is not about a business."]}, {"type": "fill", "q": "Where will the dog wash be? Type the place.", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">More from Ravi's newsletter</span><br><b>School News: Dog Wash</b><br>“The fifth graders at Maple Street Elementary will wash dogs this Saturday from 10am to 1pm at the fire station. Each wash costs $5, and every dollar buys new books for the school library. Bring your muddy pup! Your dog gets clean, and our school gets books. Everybody wins!”"}, "answers": ["fire station", "the fire station", "at the fire station", "a fire station", "the firestation"], "why": "The piece says the dog wash is “at the <b>fire station</b>.”", "no": "Look at the first sentence.", "hint": "Fire trucks live there."}, {"q": "The crosswalk writer says “cars don't always slow down.” Why is this good <b>evidence</b>?", "visual": {"kind": "passage", "text": "<b>Reader's Letter</b><br>“Our neighborhood REALLY needs a crosswalk near the elementary school. I've watched kids dash across that street every single morning, and cars don't always slow down. Please, everyone — sign the petition at the library and let's get this crosswalk built before someone gets hurt.”"}, "choices": ["It is a joke to make readers laugh", "It is a real detail the writer saw that shows the street can be dangerous", "It gives the library's hours", "It proves cars are never allowed there"], "a": 1, "why": "The writer has watched kids dash across “every single morning.” A real, specific detail like that supports the point that a crosswalk is needed.", "no": ["Nothing in the letter is a joke.", null, "The letter never gives the library's hours.", "The letter says cars don't ALWAYS slow down. It never says cars are not allowed."]}, {"type": "fill", "q": "A riddle or a funny story is written to ________ the reader.", "answers": ["entertain", "to entertain"], "why": "Riddles and funny stories <b>entertain</b>.", "no": "Riddle Corner does this.", "hint": "It starts with e-n-t."}]]});</script></body></html>
