<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan · Practice 2</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Deja&#x27;s Food Drive and the Class Pet Vote</h1><p style="margin:0 0 12px;color:#5b6578">Three tries on each one. Only your first try counts. Work every division problem on paper, write the check, then type carefully.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Ethan", "label": "Lesson 2", "title": "Deja's Food Drive and the Class Pet Vote", "mastery": 85, "color": "#10AC84", "questions": [{"type": "fill", "q": "Lesson 1 review. <b>26 × 18 = ____</b>", "answers": ["468"], "why": "26 × 8 = 208 and 26 × 10 = 260. 208 + 260 = <b>468</b>.", "no": "Ones row, then write the 0 for the tens row, then add.", "hint": "26 × 8 = 208."}, {"type": "fill", "q": "<b>645 ÷ 5 = ____</b>", "answers": ["129", "129 R0", "129 remainder 0"], "why": "6 ÷ 5 → 1 (1 × 5 = 5), 1 left. Bring down 4: 14 ÷ 5 → 2 (2 × 5 = 10), 4 left. Bring down 5: 45 ÷ 5 → 9 (9 × 5 = 45), 0 left. <b>129</b>. Check: 5 × 129 = 645.", "no": "Start with 6. Divide, multiply, subtract, bring down.", "hint": "6 ÷ 5 → 1, 1 left. Bring down the 4: 14.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "<b>538 ÷ 4 = ____</b> Type it like 5 R2.", "answers": ["134 R2", "134 r 2", "134r2", "134 remainder 2", "134 rem 2", "134 R 2", "134 remainder of 2", "134 with 2 left over", "134 with 2 left"], "why": "5 ÷ 4 → 1 (1 × 4 = 4), 1 left. Bring down 3: 13 ÷ 4 → 3 (3 × 4 = 12), 1 left. Bring down 8: 18 ÷ 4 → 4 (4 × 4 = 16), 2 left. <b>134 R2</b>. Check: 4 × 134 + 2 = 538.", "no": "Start with 5. Keep going until nothing is left to bring down.", "hint": "5 ÷ 4 → 1, 1 left. Bring down 3: 13.", "placeholder": "Example: 5 R2"}, {"q": "Which multiplication checks <b>437 ÷ 6 = 72 R5</b>?", "choices": ["72 + 6 + 5", "6 × 72 + 5", "6 × 72 − 5", "6 × 5 + 72"], "a": 1, "why": "Divisor × quotient + remainder: 6 × 72 + 5 = 432 + 5 = <b>437</b>. ✅", "no": ["Adding does not undo division. Multiply the divisor and quotient.", null, "Add the remainder back. Do not subtract it.", "Multiply the divisor by the quotient (72), not by the remainder."]}, {"type": "fill", "q": "The dividend is smaller than the divisor. <b>9 ÷ 12 = ____</b> Type it like 5 R2.", "answers": ["0 R9", "0 r 9", "0r9", "0 remainder 9", "0 rem 9", "0 R 9", "0 remainder of 9", "0 with 9 left over", "0 with 9 left"], "why": "12 does not fit into 9 even once, so the quotient is <b>0</b> and all 9 are left over: <b>0 R9</b>. Check: 12 × 0 + 9 = 9.", "no": "How many 12s fit in 9?", "hint": "12 is bigger than 9, so none fit. Everything is left over.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "<b>896 ÷ 28 = ____</b>", "answers": ["32", "32 R0", "32 remainder 0"], "why": "89 ÷ 28 → 3 (3 × 28 = 84), 5 left. Bring down 6: 56 ÷ 28 → 2 (2 × 28 = 56), 0 left. <b>32</b>. Check: 28 × 32 = 896.", "no": "Multiples of 28: 28, 56, 84, 112. How many 28s fit in 89?", "hint": "89 − 84 = 5. Bring down the 6: 56. 28 × 2 = 56.", "placeholder": "Example: 5 R2"}, {"q": "Someone wrote: <b>83 ÷ 6 = 12 R11</b>. What went wrong?", "choices": ["The remainder 11 is bigger than 6, so another 6 fits. It is 13 R5.", "6 × 12 is not 72", "Nothing. 12 R11 is right.", "They should have divided 6 by 83"], "a": 0, "why": "A remainder must be smaller than the divisor. 6 × 13 = 78, and 83 − 78 = 5. So <b>13 R5</b>.", "no": [null, "6 × 12 = 72 is right. Look at the remainder.", "The check works, but 11 is bigger than 6. Another 6 fits.", "83 is divided BY 6."]}, {"type": "fill", "q": "A bus holds <b>32</b> students. <b>140</b> students go on a field trip. How many buses are needed?", "answers": ["5", "5 buses"], "why": "140 ÷ 32 = 4 R12. Four buses leave 12 students behind, so round up: <b>5</b> buses.", "no": "Every student needs a seat. Round up or drop it?", "hint": "32 × 4 = 128. 140 − 128 = 12 students still need a seat."}, {"q": "Theo writes that someone must feed the hamster “every single day, including weekends and school breaks.” Why is this STRONG evidence?", "visual": {"kind": "passage", "text": "<b>Theo writes (against the hamster):</b><br>“I love animals, but a classroom isn't the best place for one. Someone has to remember to feed it every single day, including weekends and school breaks. A few kids in our class are allergic to fur, too. I think we should get a class fish tank instead. It's calming, and nobody's allergic to fish.”"}, "choices": ["It is a practical fact about what caring for a hamster really takes", "It shows Theo does not like animals", "It is a story about Theo's cousin", "It makes hamsters sound cute"], "a": 0, "why": "It is a real, practical fact the class would have to deal with. That makes it strong <b>evidence</b>.", "no": [null, "Theo says 'I love animals.'", "Theo never mentions a cousin. Malia does.", "It is about work, not cuteness."]}, {"type": "fill", "q": "Malia says students would take turns feeding the hamster and cleaning its ________. Type the word.", "answers": ["cage", "its cage", "the cage", "cages"], "why": "Malia writes: 'We'd take turns feeding it, cleaning its <b>cage</b>.'", "no": "Look at her second sentence.", "hint": "It is where a hamster lives."}, {"q": "Which pair of details shows a <b>contrast</b> between Malia and Theo?", "visual": {"kind": "passage", "text": "<b>Malia writes (for the hamster):</b><br>“A class hamster would teach us real responsibility. We'd take turns feeding it, cleaning its cage, and learning about how animals live. My cousin's class had a guinea pig, and everyone learned so much about caring for something besides themselves. It made the whole class feel closer, too.”<br><br><b>Theo writes (against the hamster):</b><br>“I love animals, but a classroom isn't the best place for one. Someone has to remember to feed it every single day, including weekends and school breaks. A few kids in our class are allergic to fur, too. I think we should get a class fish tank instead. It's calming, and nobody's allergic to fish.”"}, "choices": ["Both like animals / Both care about the class", "Malia: a pet teaches responsibility / Theo: a pet needs care every day, even on breaks", "Both wrote about a class vote / Both gave reasons", "Malia wants a pet / Theo also wants a pet"], "a": 1, "why": "Malia sees what a pet would teach. Theo sees the daily work. That is a <b>difference</b>.", "no": ["Those are the same for both. That is comparing.", null, "Those are the same for both. That is comparing.", "That shows they are alike. That is comparing."]}, {"type": "fill", "q": "In 864 ÷ 36 = 24, the number 24 is the ________.", "answers": ["quotient", "the quotient", "a quotient"], "why": "24 is the answer, so it is the <b>quotient</b>.", "no": "It is the answer to a division problem.", "hint": "It starts with q-u-o."}], "id": "ethan-L02", "sets": [[{"type": "fill", "q": "Lesson 1 review. <b>26 × 18 = ____</b>", "answers": ["468"], "why": "26 × 8 = 208 and 26 × 10 = 260. 208 + 260 = <b>468</b>.", "no": "Ones row, then write the 0 for the tens row, then add.", "hint": "26 × 8 = 208."}, {"type": "fill", with q-u-o."}], [{"type": "fill", "q": "Lesson 1 review. <b>34 × 27 = ____</b>", "answers": ["918"], "why": "34 × 7 = 238 and 34 × 20 = 680. 238 + 680 = <b>918</b>.", "no": "Ones row, then write the 0 for the tens row, then add.", "hint": "34 × 7 = 238."}, {"type": "fill", "q": "<b>744 ÷ 6 = ____</b>", "answers": ["124", "124 R0", "124 remainder 0"], "why": "7 ÷ 6 → 1 (1 × 6 = 6), 1 left. Bring down 4: 14 ÷ 6 → 2 (2 × 6 = 12), 2 left. Bring down 4: 24 ÷ 6 → 4 (4 × 6 = 24), 0 left. <b>124</b>. Check: 6 × 124 = 744.", "no": "Start with 7. Divide, multiply, subtract, bring down.", "hint": "7 ÷ 6 → 1, 1 left. Bring down the 4: 14.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "<b>869 ÷ 7 = ____</b> Type it like 5 R2.", "answers": ["124 R1", "124 r 1", "124r1", "124 remainder 1", "124 rem 1", "124 R 1", "124 remainder of 1", "124 with 1 left over", "124 with 1 left"], "why": "8 ÷ 7 → 1 (1 × 7 = 7), 1 left. Bring down 6: 16 ÷ 7 → 2 (2 × 7 = 14), 2 left. Bring down 9: 29 ÷ 7 → 4 (4 × 7 = 28), 1 left. <b>124 R1</b>. Check: 7 × 124 + 1 = 869.", "no": "Start with 8. Keep going until nothing is left to bring down.", "hint": "8 ÷ 7 → 1, 1 left. Bring down 6: 16.", "placeholder": "Example: 5 R2"}, {"q": "Which multiplication checks <b>389 ÷ 7 = 55 R4</b>?", "choices": ["7 × 55 − 4", "55 + 7 + 4", "7 × 4 + 55", "7 × 55 + 4"], "a": 3, "why": "Divisor × quotient + remainder: 7 × 55 + 4 = 385 + 4 = <b>389</b>. ✅", "no": ["Add the remainder back. Do not subtract it.", "Adding does not undo division. Multiply the divisor and quotient.", "Multiply the divisor by the quotient (55), not by the remainder.", null]}, {"type": "fill", "q": "The dividend is smaller than the divisor. <b>15 ÷ 32 = ____</b> Type it like 5 R2.", "answers": ["0 R15", "0 r 15", "0r15", "0 remainder 15", "0 rem 15", "0 R 15", "0 remainder of 15", "0 with 15 left over", "0 with 15 left"], "why": "32 does not fit into 15 even once, so the quotient is <b>0</b> and all 15 are left over: <b>0 R15</b>. Check: 32 × 0 + 15 = 15.", "no": "How many 32s fit in 15?", "hint": "32 is bigger than 15, so none fit. Everything is left over.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "<b>754 ÷ 26 = ____</b>", "answers": ["29", "29 R0", "29 remainder 0"], "why": "75 ÷ 26 → 2 (2 × 26 = 52), 23 left. Bring down 4: 234 ÷ 26 → 9 (9 × 26 = 234), 0 left. <b>29</b>. Check: 26 × 29 = 754.", "no": "Multiples of 26: 26, 52, 78. How many 26s fit in 75?", "hint": "75 − 52 = 23. Bring down the 4: 234. 26 × 9 = 234.", "placeholder": "Example: 5 R2"}, {"q": "Someone wrote: <b>476 ÷ 4 = 11 R3</b>. What went wrong?", "choices": ["The first 1 should be a 2", "The remainder should be 4", "Nothing. 11 R3 is right.", "They forgot to bring down the 6. The check gives 4 × 11 + 3 = 47, not 476."], "a": 3, "why": "After 7 − 4 = 3, bring down the 6 to make 36. 36 ÷ 4 = 9. So <b>119</b>.", "no": ["4 ÷ 4 = 1 is right. The mistake is at the end.", "A remainder of 4 is never OK when dividing by 4.", "Check: 4 × 11 + 3 = 47. That is not 476.", null]}, {"type": "fill", "q": "Deja's class must carry <b>100</b> cans. Each crate holds <b>12</b> cans. How many crates do they need to carry <b>ALL</b> the cans?", "answers": ["9", "9 crates"], "why": "100 ÷ 12 = 8 R4. Eight crates leave 4 cans behind, so round up: <b>9</b> crates.", "no": "Every can needs a crate. Round up or drop it?", "hint": "12 × 8 = 96. 100 − 96 = 4 cans still need a crate."}, {"q": "Which is Rosa's strongest evidence that giving the cans to only 17 pantries is unfair?", "visual": {"kind": "passage", "text": "<i>Deja's class split 569 cans among 24 pantries: 23 cans each, with 17 cans left over. Two classmates wrote about the 17 extra cans.</i><br><br><b>Rosa writes:</b><br>“We promised every pantry an equal share, and we should keep that promise. If 17 pantries get an extra can, 7 pantries get nothing extra, and that isn't fair to them. Let's put the 17 cans in a next-month bin. Next month's drive will add more cans, and then every pantry can get an equal extra share.”"}, "choices": ["Next month's drive will add more cans", "If 17 pantries get an extra can, 7 pantries get nothing extra", "Let's put the cans in a bin", "Rosa likes things to be equal"], "a": 1, "why": "It is a math fact anyone can check: 24 − 17 = 7 pantries left out. That is strong <b>evidence</b>.", "no": ["That is her plan, not proof that the other plan is unfair.", null, "That is her plan, not evidence.", "Rosa never says that, and it would only be a feeling."]}, {"type": "fill", "q": "Rosa wants to put the 17 cans in a bin for next ________. Type the word.", "answers": ["month", "next month"], "why": "Rosa writes: 'Let's put the 17 cans in a next-<b>month</b> bin.'", "no": "Look at her third sentence.", "hint": "It is longer than a week."}, {"q": "Jalen and Rosa disagree. What do they BOTH want?", "visual": {"kind": "passage", "text": "<i>Deja's class split 569 cans among 24 pantries: 23 cans each, with 17 cans left over. Two classmates wrote about the 17 extra cans.</i><br><br><b>Jalen writes:</b><br>“We should give the 17 extra cans to the 17 pantries with the longest lines right now. Those pantries feed the most families, so they run out first. Mr. Ortiz from the Elm Street pantry told our class his shelves were empty by Thursday last month. Cans sitting in a closet don't feed anybody.”<br><br><b>Rosa writes:</b><br>“We promised every pantry an equal share, and we should keep that promise. If 17 pantries get an extra can, 7 pantries get nothing extra, and that isn't fair to them. Let's put the 17 cans in a next-month bin. Next month's drive will add more cans, and then every pantry can get an equal extra share.”"}, "choices": ["To give the cans out today", "To save the cans for next month", "For the cans to end up helping families at the pantries", "To ask Mr. Ortiz"], "a": 2, "why": "That is a <b>comparison</b>: they agree the cans should help the pantries. They disagree about when and how.", "no": ["Only Jalen wants that.", "Only Rosa wants that.", null, "Neither one says that."]}, {"type": "fill", "q": "To look at how two things are DIFFERENT is to ________ them.", "answers": ["contrast"], "why": "To <b>contrast</b> is to find the differences.", "no": "It is the opposite of compare.", "hint": "It starts with c-o-n."}], [{"type": "fill", "q": "Lesson 1 review. <b>45 × 32 = ____</b>", "answers": ["1,440", "1440"], "why": "45 × 2 = 90 and 45 × 30 = 1,350. 90 + 1,350 = <b>1,440</b>.", "no": "Ones row, then write the 0 for the tens row, then add.", "hint": "45 × 2 = 90."}, {"type": "fill", "q": "<b>984 ÷ 8 = ____</b>", "answers": ["123", "123 R0", "123 remainder 0"], "why": "9 ÷ 8 → 1 (1 × 8 = 8), 1 left. Bring down 8: 18 ÷ 8 → 2 (2 × 8 = 16), 2 left. Bring down 4: 24 ÷ 8 → 3 (3 × 8 = 24), 0 left. <b>123</b>. Check: 8 × 123 = 984.", "no": "Start with 9. Divide, multiply, subtract, bring down.", "hint": "9 ÷ 8 → 1, 1 left. Bring down the 8: 18.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "<b>755 ÷ 6 = ____</b> Type it like 5 R2.", "answers": ["125 R5", "125 r 5", "125r5", "125 remainder 5", "125 rem 5", "125 R 5", "125 remainder of 5", "125 with 5 left over", "125 with 5 left"], "why": "7 ÷ 6 → 1 (1 × 6 = 6), 1 left. Bring down 5: 15 ÷ 6 → 2 (2 × 6 = 12), 3 left. Bring down 5: 35 ÷ 6 → 5 (5 × 6 = 30), 5 left. <b>125 R5</b>. Check: 6 × 125 + 5 = 755.", "no": "Start with 7. Keep going until nothing is left to bring down.", "hint": "7 ÷ 6 → 1, 1 left. Bring down 5: 15.", "placeholder": "Example: 5 R2"}, {"q": "Which multiplication checks <b>615 ÷ 8 = 76 R7</b>?", "choices": ["8 × 76 + 7", "76 + 8 + 7", "8 × 7 + 76", "8 × 76 − 7"], "a": 0, "why": "Divisor × quotient + remainder: 8 × 76 + 7 = 608 + 7 = <b>615</b>. ✅", "no": [null, "Adding does not undo division. Multiply the divisor and quotient.", "Multiply the divisor by the quotient (76), not by the remainder.", "Add the remainder back. Do not subtract it."]}, {"type": "fill", "q": "The dividend is smaller than the divisor. <b>13 ÷ 21 = ____</b> Type it like 5 R2.", "answers": ["0 R13", "0 r 13", "0r13", "0 remainder 13", "0 rem 13", "0 R 13", "0 remainder of 13", "0 with 13 left over", "0 with 13 left"], "why": "21 does not fit into 13 even once, so the quotient is <b>0</b> and all 13 are left over: <b>0 R13</b>. Check: 21 × 0 + 13 = 13.", "no": "How many 21s fit in 13?", "hint": "21 is bigger than 13, so none fit. Everything is left over.", "placeholder": "Example: 5 R2"}, {"type": "fill", "q": "<b>943 ÷ 41 = ____</b>", "answers": ["23", "23 R0", "23 remainder 0"], "why": "94 ÷ 41 → 2 (2 × 41 = 82), 12 left. Bring down 3: 123 ÷ 41 → 3 (3 × 41 = 123), 0 left. <b>23</b>. Check: 41 × 23 = 943.", "no": "Multiples of 41: 41, 82, 123. How many 41s fit in 94?", "hint": "94 − 82 = 12. Bring down the 3: 123. 41 × 3 = 123.", "placeholder": "Example: 5 R2"}, {"q": "Someone wrote: <b>774 ÷ 18 = 42 R18</b>. What went wrong?", "choices": ["18 × 42 is too big", "Nothing. 42 R18 is right.", "The remainder equals the divisor, so one more 18 fits. It is 43.", "They should round down to 42"], "a": 2, "why": "A remainder of 18 means another full 18 fits. 18 × 43 = 774, so <b>43</b>.", "no": ["18 × 42 = 756, which fits in 774.", "A remainder can never equal the divisor.", null, "Rounding is not the problem. Another whole 18 fits."]}, {"type": "fill", "q": "Each table at the food drive dinner seats <b>6</b> people. <b>75</b> people are coming. How many tables are needed?", "answers": ["13", "13 tables"], "why": "75 ÷ 6 = 12 R3. Twelve tables leave 3 people standing, so round up: <b>13</b> tables.", "no": "Everyone needs a seat. Round up or drop it?", "hint": "6 × 12 = 72. 75 − 72 = 3 people still need a seat."}, {"q": "Malia's cousin's class had a guinea pig, not a hamster. Why does her example still support her viewpoint?", "visual": {"kind": "passage", "text": "<b>Malia writes (for the hamster):</b><br>“A class hamster would teach us real responsibility. We'd take turns feeding it, cleaning its cage, and learning about how animals live. My cousin's class had a guinea pig, and everyone learned so much about caring for something besides themselves. It made the whole class feel closer, too.”"}, "choices": ["Guinea pigs and hamsters are the same animal", "It proves nobody in her class is allergic", "It shows a small class pet really did help students learn to care for something", "It does not support her viewpoint at all"], "a": 2, "why": "Both are small furry class pets. The example shows a class pet <b>worked</b> in a real class.", "no": ["They are different animals, but both are small class pets.", "It says nothing about allergies in Malia's class.", null, "It is a real example of a class pet that worked, so it does support her."]}, {"type": "fill", "q": "Jalen says cans sitting in a ________ don't feed anybody. Type the word.", "answers": ["closet", "a closet", "the closet"], "why": "Jalen writes: 'Cans sitting in a <b>closet</b> don't feed anybody.'", "no": "Look at his last sentence.", "hint": "It is a place to store things."}, {"q": "Which plan is a <b>compromise</b> between Jalen and Rosa?", "visual": {"kind": "passage", "text": "<i>Deja's class split 569 cans among 24 pantries: 23 cans each, with 17 cans left over. Two classmates wrote about the 17 extra cans.</i><br><br><b>Jalen writes:</b><br>“We should give the 17 extra cans to the 17 pantries with the longest lines right now. Those pantries feed the most families, so they run out first. Mr. Ortiz from the Elm Street pantry told our class his shelves were empty by Thursday last month. Cans sitting in a closet don't feed anybody.”<br><br><b>Rosa writes:</b><br>“We promised every pantry an equal share, and we should keep that promise. If 17 pantries get an extra can, 7 pantries get nothing extra, and that isn't fair to them. Let's put the 17 cans in a next-month bin. Next month's drive will add more cans, and then every pantry can get an equal extra share.”"}, "choices": ["Give all 17 cans away today and never think about it again", "Keep all 17 cans and give out nothing", "Give the 17 cans now to pantries that ran out last month, and give the other 7 pantries extras first next month", "Throw the 17 cans away so nobody fights"], "a": 2, "why": "Jalen gets cans out now. Rosa gets every pantry an equal extra in the end. Each side gives a little.", "no": ["That is only Jalen's plan.", "That is not even Rosa's plan: she wants to share them next month.", null, "That wastes food and helps no one."]}, {"type": "fill", "q": "Writing that tries to convince the reader to agree is called ________ writing.", "answers": ["persuasive"], "why": "That is <b>persuasive</b> writing, like Malia's and Theo's pieces.", "no": "Malia and Theo each want your vote.", "hint": "It starts with p-e-r-s."}]]});</script></body></html>
