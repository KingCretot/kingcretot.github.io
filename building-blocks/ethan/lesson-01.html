<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan · Lesson 1: Malik&#x27;s Mural: Multiplying Big Numbers</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L01", "label": "Lesson 1", "title": "Malik's Mural: Multiplying Big Numbers", "goal": "I can estimate first, then multiply 2-digit and 3-digit numbers by 2-digit numbers step by step and check my answer.", "date": "2026-10-21", "mastery": 85, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Malik's Mural: On Your Own", "text": "In class you learned to multiply big numbers step by step. Now you do it on your own. Keep paper and a pencil next to you. Work every problem on paper first.", "visual": {"kind": "emoji", "text": "🎨🧱✖️"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["Why do you <b>estimate</b> before you multiply?", "In 18 × 13, why does the second row start with a <b>0</b>?", "What is a <b>partial product</b>? Give an example."], "starters": ["I estimate first because …", "The 0 is there because …", "A partial product is …"]}, {"type": "vocab", "kick": "Word Power", "title": "Review your words", "text": "Say the meaning out loud first. Then flip the card to check yourself.", "words": [{"word": "factor", "pos": "noun", "meaning": "A number you multiply.", "example": "In 18 × 13 = 234, the <b>factors</b> are 18 and 13.", "emoji": "✖️"}, {"word": "product", "pos": "noun", "meaning": "The answer to a multiplication problem.", "example": "234 is the <b>product</b> of 18 and 13.", "emoji": "🎯"}, {"word": "partial product", "pos": "noun", "meaning": "One piece of a multiplication problem. You find each piece, then add the pieces.", "example": "In 18 × 13, the <b>partial products</b> are 54 and 180.", "emoji": "🧩"}, {"word": "estimate", "pos": "noun or verb", "meaning": "A smart guess you make by rounding first. It tells you about how big the answer should be.", "example": "To <b>estimate</b> 18 × 13, I round to 20 × 10 = 200.", "emoji": "🔍"}, {"word": "regroup", "pos": "verb", "meaning": "To carry extra value into the next place-value column when a column makes 10 or more.", "example": "8 × 4 = 32, so I write the 2 and <b>regroup</b> the 3 tens.", "emoji": "🔁"}, {"word": "standard algorithm", "pos": "noun", "meaning": "The stacked, step-by-step way to multiply bigger numbers on paper.", "example": "The <b>standard algorithm</b> does the same math as the area model, just stacked.", "emoji": "📐"}, {"word": "quotient", "pos": "noun (review)", "meaning": "The answer to a division problem.", "example": "In 432 ÷ 36 = 12, the <b>quotient</b> is 12.", "emoji": "➗"}]}, {"type": "learn", "kick": "Remember", "title": "Estimate, ones row, tens row, add, check", "text": "<b>18 × 13</b>. Estimate: 20 × 10 = 200.", "visual": {"kind": "longdiv", "text": "   18\n × 13\n-----\n   54  ← 18 × 3\n+ 180  ← 18 × 10\n-----\n  234"}, "tip": "234 is close to 200, so it is reasonable. Do these same steps on every problem."}, {"type": "tap", "kick": "Try it", "title": "Estimate first", "text": "Round each factor to the nearest ten.", "items": [{"type": "fill", "q": "Estimate <b>38 × 21</b>: 40 × 20 = ____", "answers": ["800"], "why": "40 × 20 = <b>800</b>.", "no": "4 × 2 = 8. Then count the zeros.", "hint": "4 tens × 2 tens = 8 hundreds."}, {"type": "fill", "q": "Estimate <b>63 × 49</b>: 60 × 50 = ____", "answers": ["3,000", "3000"], "why": "6 × 5 = 30, then two more zeros: <b>3,000</b>.", "no": "6 × 5 = 30. Now add the zeros from 60 and 50.", "hint": "6 tens × 5 tens = 30 hundreds."}, {"q": "Estimate: 30 × 30 = 900. Which answer for <b>29 × 31</b> is reasonable?", "choices": ["60", "899", "8,990", "290"], "a": 1, "why": "899 is very close to 900.", "no": ["60 is 29 + 31. That is adding.", null, "8,990 is about ten times too big. Look for an extra zero.", "290 is only 29 × 10. It is missing a piece."]}]}, {"type": "tap", "kick": "Try it", "title": "Partial products: 43 × 15", "text": "Estimate: 40 × 20 = 800. Stack it on paper first.", "visual": {"kind": "longdiv", "text": "   43\n × 15\n -----\n    ?\n +  ?\n -----\n    ?"}, "items": [{"type": "fill", "q": "First partial product: <b>43 × 5 = ____</b>", "answers": ["215"], "why": "3 × 5 = 15 (write 5, regroup 1). 4 × 5 = 20, plus the regrouped 1 makes 21. <b>215</b>.", "no": "Multiply 43 by the ones digit, 5.", "hint": "3 × 5 = 15. Write 5, regroup 1."}, {"type": "fill", "q": "Second partial product: <b>43 × 10 = ____</b>", "answers": ["430"], "why": "Write the 0, then 43: <b>430</b>.", "no": "The 1 in 15 is 1 ten. Write the 0 first.", "hint": "43 tens = 430."}, {"type": "fill", "q": "<b>43 × 15 = ____</b>", "answers": ["645"], "why": "215 + 430 = <b>645</b>. It is less than 800 because we rounded 15 up to 20, but it is in the hundreds, so it is about the right size.", "no": "Add the two rows.", "hint": "215 + 430."}]}, {"type": "tap", "kick": "Try it", "title": "Regroup carefully: 46 × 27", "text": "Estimate: 50 × 30 = 1,500. Write the small regrouped numbers on your paper.", "items": [{"type": "fill", "q": "First partial product: <b>46 × 7 = ____</b>", "answers": ["322"], "why": "6 × 7 = 42 (write 2, regroup 4). 4 × 7 = 28, plus the regrouped 4 makes 32. <b>322</b>.", "no": "Multiply first, then add the regrouped number.", "hint": "6 × 7 = 42. Write 2, regroup 4."}, {"type": "fill", "q": "Second partial product: <b>46 × 20 = ____</b>", "answers": ["920"], "why": "Write the 0. 46 × 2 = 92. <b>920</b>.", "no": "Write the 0 first. Then 46 × 2.", "hint": "Cross out the old regrouped 4 before you start this row."}, {"type": "fill", "q": "<b>46 × 27 = ____</b>", "answers": ["1,242", "1242"], "why": "322 + 920 = <b>1,242</b>. Close to 1,500.", "no": "Add the rows one column at a time.", "hint": "322 + 920: 2 ones, 4 tens, 12 hundreds."}]}, {"type": "tap", "kick": "Try it", "title": "Three digits: 214 × 23", "text": "Estimate: 210 × 20 = 4,200. Keep every digit in its column.", "items": [{"type": "fill", "q": "First partial product: <b>214 × 3 = ____</b>", "answers": ["642"], "why": "4 × 3 = 12 (write 2, regroup 1). 1 × 3 = 3, plus the regrouped 1 makes 4. 2 × 3 = 6. <b>642</b>.", "no": "Multiply each digit of 214 by 3, ones first.", "hint": "4 × 3 = 12. Write 2, regroup 1."}, {"type": "fill", "q": "Second partial product: <b>214 × 20 = ____</b>", "answers": ["4,280", "4280"], "why": "Write the 0. 214 × 2 = 428. <b>4,280</b>.", "no": "Write the 0, then multiply 214 by 2.", "hint": "214 × 2 = 428."}, {"type": "fill", "q": "<b>214 × 23 = ____</b>", "answers": ["4,922", "4922"], "why": "642 + 4,280 = <b>4,922</b>. Close to 4,200.", "no": "Add the two rows.", "hint": "642 + 4,280."}]}, {"type": "tap", "kick": "Find the mistake", "title": "Be the checker", "text": "Check each row on paper. Then choose.", "items": [{"q": "Someone wrote: <b>35 × 24 = 140 + 70 = 210</b>. What went wrong?", "choices": ["35 × 4 should be 120", "The rows were added wrong", "The second row needs a 0: 35 × 20 = 700", "Nothing. 210 is right."], "a": 2, "why": "The 2 in 24 is 2 tens, so the second row is 700. 140 + 700 = 840.", "no": ["5 × 4 = 20 (write 0, regroup 2). 3 × 4 = 12, plus the regrouped 2 makes 14. 140 is right.", "140 + 70 is 210. The adding is fine; a row is wrong.", null, "Estimate: 40 × 20 = 800. 210 is far too small."]}, {"q": "Someone wrote: <b>58 × 16 = 308 + 580 = 888</b>. What went wrong?", "choices": ["58 × 10 should be 58", "58 × 6 should be 348. The regrouped 4 was never added.", "The rows were added wrong", "Nothing. 888 is right."], "a": 1, "why": "8 × 6 = 48: write 8, regroup 4. 5 × 6 = 30, plus the regrouped 4 makes 34. So 58 × 6 = 348, and 348 + 580 = 928.", "no": ["58 × 10 = 580. It needs the 0.", null, "308 + 580 is 888. The adding is fine; the first row is wrong.", "Check 58 × 6 again: 8 × 6 = 48. Where did the 4 go?"]}]}, {"type": "tap", "kick": "Mural problems", "title": "Malik's mural", "text": "Estimate, solve on paper, then type just the number.", "items": [{"type": "fill", "q": "Malik's class paints <b>16</b> mural panels. Each panel uses <b>45</b> tiles. How many tiles?", "answers": ["720", "720 tiles"], "why": "45 × 16 = 270 + 450 = <b>720</b> tiles.", "no": "16 equal panels of 45. Multiply 45 × 16.", "hint": "45 × 6 = 270. 45 × 10 = 450."}, {"type": "fill", "q": "The art club buys <b>23</b> jars of paint. Each jar costs <b>$14</b>. How many dollars?", "answers": ["$322", "322", "322 dollars"], "why": "14 × 23 = 42 + 280 = <b>$322</b>.", "no": "23 jars at $14 each. Multiply.", "hint": "14 × 3 = 42. 14 × 20 = 280."}, {"type": "fill", "q": "A bigger mural uses <b>18</b> panels. Each panel has <b>125</b> tiles. How many tiles?", "answers": ["2,250", "2250", "2,250 tiles", "2250 tiles"], "why": "125 × 18 = 1,000 + 1,250 = <b>2,250</b> tiles.", "no": "Multiply 125 × 18.", "hint": "125 × 8 = 1,000. 125 × 10 = 1,250."}]}, {"type": "recall", "kick": "Remember", "title": "From earlier lessons", "items": [{"type": "fill", "q": "A paintbrush costs <b>$2.50</b>. A sponge costs <b>$1.75</b>. How much for both?", "answers": ["$4.25", "4.25", "4.25 dollars"], "why": "$2.50 + $1.75 = <b>$4.25</b>. Line up the decimal points: 50 cents + 75 cents = $1.25, and $1.25 + $3 = $4.25.", "no": "Line up the decimal points. Add the cents first.", "hint": "50 + 75 = 125 cents, which is $1.25.", "placeholder": "Example: 3.10"}, {"type": "fill", "q": "Malik's sketch has <b>12</b> squares. The mural has <b>6 times as many</b> squares. How many squares does the mural have?", "answers": ["72", "72 squares"], "why": "6 times as many as 12 means 12 × 6 = <b>72</b>.", "no": "Times as many means multiply.", "hint": "12 × 6."}, {"q": "Malik puts <b>50</b> tiles into rows of <b>8</b>. How many full rows, and how many tiles are left over?", "choices": ["6 rows, 2 left over", "7 rows, 6 left over", "6 rows, 0 left over", "5 rows, 10 left over"], "a": 0, "why": "8 × 6 = 48, and 50 − 48 = 2. So 6 full rows with 2 left over.", "no": [null, "8 × 7 = 56, which is more than 50 tiles.", "8 × 6 = 48, not 50. Two tiles are left.", "10 left over is enough for another row of 8."]}]}, {"type": "tap", "kick": "Word Power", "title": "Use your words", "text": "Type the word from memory.", "items": [{"type": "fill", "q": "A smart guess you make by rounding first is an ________.", "answers": ["estimate"], "why": "An <b>estimate</b> tells you about how big the answer should be.", "no": "It is the first step before you multiply.", "hint": "It starts with e-s-t."}, {"type": "fill", "q": "The answer to <b>18 × 13</b> is 234. The number 234 is the ________.", "answers": ["product"], "why": "234 is the <b>product</b>.", "no": "It is the answer to a multiplication problem.", "hint": "It starts with p-r-o."}, {"type": "fill", "q": "The stacked, step-by-step way to multiply is called the standard ________.", "answers": ["algorithm"], "why": "It is the <b>standard algorithm</b>.", "no": "It starts with a-l-g.", "hint": "algo…"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Round to the nearest ten. Estimate <b>41 × 29</b>: 40 × 30 = ____", "answers": ["1,200", "1200"], "why": "40 × 30 = <b>1,200</b>.", "no": "4 × 3 = 12. Then count the zeros.", "hint": "4 tens × 3 tens = 12 hundreds."}, {"q": "Estimate: 30 × 30 = 900. Which answer for <b>33 × 28</b> is reasonable?", "choices": ["9,240", "924", "264", "61"], "a": 1, "why": "924 is close to 900.", "no": ["9,240 is about ten times too big. Look for an extra zero.", null, "264 is only 33 × 8. The tens row is missing.", "61 is 33 + 28. That is adding."]}, {"q": "Which two partial products build <b>36 × 24</b>?", "choices": ["144 and 72", "144 and 720", "124 and 720", "720 and 1,440"], "a": 1, "why": "36 × 4 = 144 and 36 × 20 = 720. Total: 864.", "no": ["The second row needs a 0: 36 × 20 = 720.", null, "36 × 4: 6 × 4 = 24, write 4, regroup 2. 3 × 4 = 12, plus the regrouped 2 makes 14. So 144.", "1,440 is 36 × 40. The tens digit of 24 is 2."]}, {"type": "fill", "q": "In <b>47 × 36</b>, what is the second partial product, <b>47 × 30</b>?", "answers": ["1,410", "1410"], "why": "Write the 0. 47 × 3 = 141. <b>1,410</b>.", "no": "Write the 0 first, then multiply 47 × 3.", "hint": "47 × 3 = 141."}, {"type": "fill", "q": "<b>58 × 23 = ____</b>", "answers": ["1,334", "1334"], "why": "58 × 3 = 174 and 58 × 20 = 1,160. 174 + 1,160 = <b>1,334</b>.", "no": "Ones row, then the 0 and the tens row, then add.", "hint": "58 × 3 = 174."}, {"type": "fill", "q": "<b>124 × 32 = ____</b>", "answers": ["3,968", "3968"], "why": "124 × 2 = 248 and 124 × 30 = 3,720. 248 + 3,720 = <b>3,968</b>.", "no": "Ones row: 124 × 2. Tens row: 0, then 124 × 3.", "hint": "124 × 3 = 372."}, {"q": "Someone wrote: <b>63 × 25 = 315 + 126 = 441</b>. What went wrong?", "choices": ["The second row needs a 0: 63 × 20 = 1,260", "63 × 5 should be 305", "The rows should be subtracted", "Nothing. 441 is right."], "a": 0, "why": "The 2 in 25 is 2 tens, so the second row is 1,260. 315 + 1,260 = 1,575.", "no": [null, "3 × 5 = 15 (write 5, regroup 1). 6 × 5 = 30, plus the regrouped 1 makes 31. 315 is right.", "You always add the partial products.", "Estimate: 60 × 30 = 1,800. 441 is far too small."]}, {"type": "fill", "q": "Malik's next mural is <b>32</b> tiles across and <b>19</b> tiles down. How many tiles?", "answers": ["608", "608 tiles"], "why": "32 × 19 = 288 + 320 = <b>608</b> tiles.", "no": "Tiles across × tiles down.", "hint": "32 × 9 = 288. 32 × 10 = 320."}, {"type": "fill", "q": "Each box holds <b>144</b> tiles. The school orders <b>15</b> boxes. How many tiles?", "answers": ["2,160", "2160", "2,160 tiles", "2160 tiles"], "why": "144 × 15 = 720 + 1,440 = <b>2,160</b> tiles.", "no": "Multiply 144 × 15.", "hint": "144 × 5 = 720. 144 × 10 = 1,440."}, {"type": "fill", "q": "A number being multiplied is called a ________.", "answers": ["factor", "factors"], "why": "A <b>factor</b> is a number you multiply.", "no": "In 6 × 7, 6 and 7 are both one of these.", "hint": "It starts with f."}], [{"type": "fill", "q": "Round to the nearest ten. Estimate <b>59 × 31</b>: 60 × 30 = ____", "answers": ["1,800", "1800"], "why": "60 × 30 = <b>1,800</b>.", "no": "6 × 3 = 18. Then count the zeros.", "hint": "6 tens × 3 tens = 18 hundreds."}, {"q": "Estimate: 30 × 40 = 1,200. Which answer for <b>27 × 42</b> is reasonable?", "choices": ["69", "108", "11,340", "1,134"], "a": 3, "why": "1,134 is close to 1,200.", "no": ["69 is 27 + 42. That is adding.", "108 is only 27 × 4. The 4 is really 40, and 27 × 2 is missing.", "11,340 is about ten times too big. Look for an extra zero.", null]}, {"q": "Which two partial products build <b>45 × 23</b>?", "choices": ["125 and 900", "135 and 90", "135 and 900", "1,350 and 900"], "a": 2, "why": "45 × 3 = 135 and 45 × 20 = 900. Total: 1,035.", "no": ["45 × 3: 5 × 3 = 15, write 5, regroup 1. 4 × 3 = 12, plus the regrouped 1 makes 13. So 135.", "The second row needs a 0: 45 × 20 = 900.", null, "1,350 is 45 × 30. The ones digit of 23 is 3, so the first row is 45 × 3."]}, {"type": "fill", "q": "In <b>56 × 43</b>, what is the second partial product, <b>56 × 40</b>?", "answers": ["2,240", "2240"], "why": "Write the 0. 56 × 4 = 224. <b>2,240</b>.", "no": "Write the 0 first, then multiply 56 × 4.", "hint": "56 × 4 = 224."}, {"type": "fill", "q": "<b>67 × 24 = ____</b>", "answers": ["1,608", "1608"], "why": "67 × 4 = 268 and 67 × 20 = 1,340. 268 + 1,340 = <b>1,608</b>.", "no": "Ones row, then the 0 and the tens row, then add.", "hint": "67 × 4 = 268."}, {"type": "fill", "q": "<b>213 × 26 = ____</b>", "answers": ["5,538", "5538"], "why": "213 × 6 = 1,278 and 213 × 20 = 4,260. 1,278 + 4,260 = <b>5,538</b>.", "no": "Ones row: 213 × 6. Tens row: 0, then 213 × 2.", "hint": "213 × 6 = 1,278."}, {"q": "Someone wrote: <b>74 × 18 = 562 + 740 = 1,302</b>. What went wrong?", "choices": ["74 × 10 should be 74", "74 × 8 should be 592. The regrouped 3 was never added.", "The rows were added wrong", "Nothing. 1,302 is right."], "a": 1, "why": "4 × 8 = 32: write 2, regroup 3. 7 × 8 = 56, plus the regrouped 3 makes 59. So 74 × 8 = 592, and 592 + 740 = 1,332.", "no": ["74 × 10 = 740. It needs the 0.", null, "562 + 740 is 1,302. The adding is fine; the first row is wrong.", "Check 74 × 8 again: 4 × 8 = 32. Where did the 3 go?"]}, {"type": "fill", "q": "The mural's sky has <b>28</b> rows with <b>17</b> tiles in each row. How many sky tiles?", "answers": ["476", "476 tiles"], "why": "28 × 17 = 196 + 280 = <b>476</b> tiles.", "no": "28 equal rows of 17. Multiply.", "hint": "28 × 7 = 196. 28 × 10 = 280."}, {"type": "fill", "q": "A tile-setter lays <b>135</b> tiles every hour. How many tiles in <b>12</b> hours?", "answers": ["1,620", "1620", "1,620 tiles", "1620 tiles"], "why": "135 × 12 = 270 + 1,350 = <b>1,620</b> tiles.", "no": "Multiply 135 × 12.", "hint": "135 × 2 = 270. 135 × 10 = 1,350."}, {"type": "fill", "q": "One piece of a multiplication problem, found before you add the pieces together, is a ________ ________.", "answers": ["partial product", "partial products"], "why": "It is a <b>partial product</b>.", "no": "Two words. The second word is the answer to a multiplication problem.", "hint": "It starts with p-a-r-t."}], [{"type": "fill", "q": "Round to the nearest ten. Estimate <b>72 × 19</b>: 70 × 20 = ____", "answers": ["1,400", "1400"], "why": "70 × 20 = <b>1,400</b>.", "no": "7 × 2 = 14. Then count the zeros.", "hint": "7 tens × 2 tens = 14 hundreds."}, {"q": "Estimate: 60 × 30 = 1,800. Which answer for <b>62 × 28</b> is reasonable?", "choices": ["17,360", "90", "1,736", "496"], "a": 2, "why": "1,736 is close to 1,800.", "no": ["17,360 is about ten times too big. Look for an extra zero.", "90 is 62 + 28. That is adding.", null, "496 is only 62 × 8. The tens row, 62 × 20, is missing."]}, {"q": "Which two partial products build <b>64 × 35</b>?", "choices": ["320 and 1,920", "320 and 192", "300 and 1,920", "3,200 and 1,920"], "a": 0, "why": "64 × 5 = 320 and 64 × 30 = 1,920. Total: 2,240.", "no": [null, "The second row needs a 0: 64 × 30 = 1,920.", "64 × 5: 4 × 5 = 20, write 0, regroup 2. 6 × 5 = 30, plus the regrouped 2 makes 32. So 320.", "3,200 is 64 × 50. The ones digit of 35 is 5, so the first row is 64 × 5."]}, {"type": "fill", "q": "In <b>85 × 27</b>, what is the second partial product, <b>85 × 20</b>?", "answers": ["1,700", "1700"], "why": "Write the 0. 85 × 2 = 170. <b>1,700</b>.", "no": "Write the 0 first, then multiply 85 × 2.", "hint": "85 × 2 = 170."}, {"type": "fill", "q": "<b>49 × 36 = ____</b>", "answers": ["1,764", "1764"], "why": "49 × 6 = 294 and 49 × 30 = 1,470. 294 + 1,470 = <b>1,764</b>.", "no": "Ones row, then the 0 and the tens row, then add.", "hint": "49 × 6 = 294."}, {"type": "fill", "q": "<b>306 × 24 = ____</b>", "answers": ["7,344", "7344"], "why": "306 × 4 = 1,224 and 306 × 20 = 6,120. 1,224 + 6,120 = <b>7,344</b>.", "no": "Ones row: 306 × 4. Tens row: 0, then 306 × 2. Keep the 0 in 306 in its column.", "hint": "306 × 4 = 1,224."}, {"q": "Someone wrote: <b>52 × 34 = 208 + 1,560 = 1,668</b>. What went wrong?", "choices": ["52 × 4 should be 200", "Nothing. 1,668 is right.", "52 × 30 should be 156", "The rows were added wrong: 208 + 1,560 = 1,768"], "a": 3, "why": "52 × 4 = 208 and 52 × 30 = 1,560 are both right. 208 + 1,560 = 1,768.", "no": ["2 × 4 = 8 and 5 × 4 = 20. 208 is right.", "Add the rows again, one column at a time.", "52 × 30 needs the 0: 1,560 is right.", null]}, {"type": "fill", "q": "Malik's class makes <b>24</b> small mural panels. Each panel has <b>36</b> tiles. How many tiles?", "answers": ["864", "864 tiles"], "why": "36 × 24 = 144 + 720 = <b>864</b> tiles.", "no": "24 equal panels of 36. Multiply.", "hint": "36 × 4 = 144. 36 × 20 = 720."}, {"type": "fill", "q": "The school orders <b>18</b> boxes of tiles. Each box holds <b>225</b> tiles. How many tiles?", "answers": ["4,050", "4050", "4,050 tiles", "4050 tiles"], "why": "225 × 18 = 1,800 + 2,250 = <b>4,050</b> tiles.", "no": "Multiply 225 × 18.", "hint": "225 × 8 = 1,800. 225 × 10 = 2,250."}, {"type": "fill", "q": "When a column makes 10 or more, you ________ the extra value into the next column.", "answers": ["regroup", "carry"], "why": "You <b>regroup</b>, or carry, the extra value.", "no": "It means carrying to the next place-value column.", "hint": "It starts with r-e."}]]}], "win": "You estimated, stacked, regrouped and checked. Malik's mural is ready to order!", "prev": null, "prevTitle": ""});</script></body></html>
