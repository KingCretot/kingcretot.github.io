<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan · Lesson 6: The Dairy Farm Schedule and The Night the Calf Came Early</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L06", "label": "Lesson 6", "title": "The Dairy Farm Schedule and The Night the Calf Came Early", "goal": "I can find factor pairs, tell prime from composite numbers, use the LCM and the GCF to plan a schedule and pack crates, and punctuate dialogue correctly.", "date": "2026-12-09", "mastery": 85, "color": "#16A085", "slides": [{"type": "hello", "title": "The Dairy Farm Schedule: On Your Own", "text": "In class you found factor pairs, sorted prime and composite numbers, used the LCM and the GCF, and punctuated dialogue. Now you do it on your own. Keep paper and a pencil next to you. Write the factor pairs or multiples on paper before you type.", "visual": {"kind": "emoji", "text": "🐄📅📦💬"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["How do you know when you have found ALL the factor pairs of a number?", "Why is 87 composite even though it is odd?", "When do you need the LCM, and when do you need the GCF?", "Where does the comma go when the tag comes first? When it comes last?"], "starters": ["I can stop when …", "87 is composite because …", "I use the LCM when … I use the GCF when …", "Tag first, the comma goes … Tag last, it goes …"]}, {"type": "vocab", "kick": "Word Power", "title": "Review your words", "text": "Say the meaning out loud first. Then flip the card to check yourself.", "words": [{"word": "factor pair", "pos": "noun", "meaning": "Two whole numbers whose product is the number.", "example": "6 × 7 = 42, so 6 and 7 are a <b>factor pair</b> of 42.", "emoji": "👯"}, {"word": "prime number", "pos": "noun", "meaning": "A number greater than 1 whose only factors are 1 and the number itself.", "example": "61 is a <b>prime number</b>. Only 1 × 61 makes it.", "emoji": "💎"}, {"word": "composite number", "pos": "noun", "meaning": "A whole number with more factors than just 1 and itself.", "example": "42 is a <b>composite number</b>: 1, 2, 3, 6, 7, 14, 21 and 42 all divide it.", "emoji": "🧱"}, {"word": "divisible", "pos": "adjective", "meaning": "A number is divisible by another number when dividing leaves a remainder of 0.", "example": "42 is <b>divisible</b> by 7, because 42 ÷ 7 = 6 with nothing left over.", "emoji": "✂️"}, {"word": "common multiple", "pos": "noun", "meaning": "A number that is on the multiples list of two numbers.", "example": "24 and 48 are <b>common multiples</b> of 8 and 12.", "emoji": "🤝"}, {"word": "least common multiple (LCM)", "pos": "noun", "meaning": "The first (smallest) number that shows up on both multiples lists.", "example": "The <b>LCM</b> of 8 and 12 is 24: the first day the truck and the vet come together.", "emoji": "📅"}, {"word": "greatest common factor (GCF)", "pos": "noun", "meaning": "The largest number that divides both numbers evenly.", "example": "The <b>GCF</b> of 28 and 42 is 14: the most identical crates with nothing left over.", "emoji": "📦"}, {"word": "narrative", "pos": "noun", "meaning": "Writing that tells a story: characters, a setting, a problem and what happens.", "example": "A <b>narrative</b> about fixing a roof before a storm has a problem and a solution.", "emoji": "📖"}, {"word": "dialogue", "pos": "noun", "meaning": "The exact lines the characters speak in a story.", "example": "“Hold the ladder,” Grandma said. The part inside the marks is <b>dialogue</b>.", "emoji": "💬"}, {"word": "quotation marks", "pos": "noun", "meaning": "The pair of marks “ ” at the start and end of a character’s spoken words.", "example": "<b>Quotation marks</b> hug the words: “We did it!”", "emoji": "❝"}, {"word": "dialogue tag", "pos": "noun", "meaning": "The short phrase next to a quote that names who spoke, such as <i>Mom said</i>.", "example": "In “Is it raining?” Darius asked, the <b>dialogue tag</b> is <i>Darius asked</i>.", "emoji": "🏷️"}, {"word": "speaker", "pos": "noun", "meaning": "The character whose words are inside the quotation marks.", "example": "When Grandma answers Darius, the <b>speaker</b> changes, so a new paragraph starts.", "emoji": "🗣️"}, {"word": "strong tag", "pos": "noun", "meaning": "A tag verb that shows HOW the words were said, like whispered or groaned.", "example": "“It's wobbly!” she groaned. <i>Groaned</i> is a <b>strong tag</b>. Use them only once in a while.", "emoji": "💪"}]}, {"type": "learn", "kick": "Remember", "title": "Pairs, LCM, GCF, dialogue", "text": "One example of each skill.", "visual": {"kind": "longdiv", "text": "1 × 50\n2 × 25\n5 × 10"}, "steps": [{"text": "<b>Factors of 50:</b> 1 × 50, 2 × 25, 5 × 10. 3, 4, 6 and 7 do not work, and 8 × 8 = 64 is more than 50, so there are no new pairs after 7. Factors: 1, 2, 5, 10, 25, 50."}, {"text": "<b>LCM of 6 and 14:</b> skip-count by 14: 14 (÷ 6? no), 28 (no), 42 (yes). LCM = <b>42</b>."}, {"text": "<b>GCF of 30 and 45:</b> shared factors 1, 3, 5, 15. GCF = <b>15</b>."}, {"text": "<b>Dialogue:</b> Uncle Ray said, “Measure twice.” · “Measure twice,” Uncle Ray said. · “Did you measure?” he asked."}], "tip": "Lining up again: LCM. Most identical groups: GCF."}, {"type": "tap", "kick": "Try it", "title": "Factors and primes", "text": "Write the pairs on paper first.", "items": [{"type": "fill", "q": "What are <b>ALL</b> the factors of <b>63</b>? List them smallest to largest.", "answers": ["1, 3, 7, 9, 21, 63", "1,3,7,9,21,63", "1 3 7 9 21 63", "1, 3, 7, 9, 21 and 63"], "why": "Pairs: 1 × 63, 3 × 21, 7 × 9. Factors: <b>1, 3, 7, 9, 21, 63</b>.", "no": "Start at 1 × the number. Test 2, 3, 4, 5… in order. Write both numbers of every pair that works. Stop when the pairs meet.", "hint": "6 + 3 = 9, so 3 and 9 both work. Try 7 too.", "placeholder": "Example: 1, 2, 4, 8"}, {"type": "fill", "q": "How many factors does <b>81</b> have? Type the number.", "answers": ["5", "five"], "why": "Pairs: 1 × 81, 3 × 27, 9 × 9. Count 9 once: 1, 3, 9, 27, 81 = <b>5</b> factors.", "no": "List the pairs. In 9 × 9, count 9 only once.", "hint": "9 × 9 = 81.", "placeholder": "Type a number"}, {"q": "Which cow ID number is <b>prime</b>?", "choices": ["69", "77", "83", "93"], "a": 2, "why": "83: not even, 8 + 3 = 11 (not a multiple of 3), does not end in 0 or 5, and 83 ÷ 7 = 11 R6. <b>83 is prime.</b>", "no": ["6 + 9 = 15, so 3 divides it: 69 = 3 × 23.", "77 = 7 × 11.", null, "9 + 3 = 12, so 3 divides it: 93 = 3 × 31."]}]}, {"type": "tap", "kick": "Try it", "title": "Divisibility and the LCM", "text": "Use the rules. Skip-count by the bigger number.", "items": [{"type": "fill", "q": "What is the <b>smallest digit</b> you can write in the blank to make <b>5 _ 2</b> divisible by 3?", "answers": ["2", "two"], "why": "5 + 2 = 7. Try 0 (7), 1 (8), 2 (9). 9 is a multiple of 3, so the digit is <b>2</b>: 522 ÷ 3 = 174.", "no": "Add the digits you have. What do you need to add to reach a multiple of 3?", "hint": "5 + 2 = 7. The next multiple of 3 is 9.", "placeholder": "Type one digit"}, {"type": "fill", "q": "LCM of <b>9</b> and <b>12</b> = ____", "answers": ["36"], "why": "Multiples of 12: 12 (÷ 9? no), 24 (no), 36 (yes). The LCM is <b>36</b>.", "no": "List the multiples of the bigger number: ×1, ×2, ×3… Stop at the first one the smaller number also divides evenly.", "hint": "12, 24, 36 … which one can 9 divide?", "placeholder": "Type a number"}, {"type": "fill", "q": "Dad waters the tomatoes every <b>6</b> days and fertilizes them every <b>15</b> days. He did both today. In how many days will he do both on the same day again?", "answers": ["30", "30 days"], "why": "Multiples of 15: 15 (÷ 6? no), 30 (÷ 6? yes). The LCM is <b>30</b> days.", "no": "List the multiples of the bigger number: ×1, ×2, ×3… Stop at the first one the smaller number also divides evenly.", "hint": "15, 30 … which one can 6 divide?", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Try it", "title": "The GCF", "text": "List the factors. Circle the shared ones.", "items": [{"type": "fill", "q": "GCF of <b>24</b> and <b>40</b> = ____", "answers": ["8"], "why": "Factors of 24: 1, 2, 3, 4, 6, 8, 12, 24. Factors of 40: 1, 2, 4, 5, 8, 10, 20, 40. The GCF is <b>8</b>.", "no": "List the factors of each number. Circle the factors they share. The biggest one you circled is the GCF.", "hint": "Is 8 a factor of both?", "placeholder": "Type a number"}, {"type": "fill", "q": "Mom has <b>18</b> cupcakes and <b>27</b> cookies. She puts them on identical plates with nothing left over. What is the greatest number of plates?", "answers": ["9", "9 plates"], "why": "Factors of 18: 1, 2, 3, 6, 9, 18. Factors of 27: 1, 3, 9, 27. The GCF is <b>9</b> plates.", "no": "List the factors of each number. Circle the factors they share. The biggest one you circled is the GCF.", "hint": "Which is the biggest number that divides 18 AND 27?", "placeholder": "Type a number"}, {"type": "fill", "q": "Same plates: how many <b>cookies</b> go on each plate?", "answers": ["3", "3 cookies"], "why": "27 cookies ÷ 9 plates = <b>3</b> cookies on each plate (and 18 ÷ 9 = 2 cupcakes).", "no": "Divide the cookies by the number of plates.", "hint": "27 ÷ 9 = ?", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Read", "title": "The Wobbly Bench", "text": "Read the story. Then answer.", "visual": {"kind": "passage", "text": "<b>The Wobbly Bench</b><br><b>1</b> Uncle Ray dropped a stack of rough boards on the porch. “Today we build a bench for the garden,” he said.<br><b>2</b> “From those?” Lucia asked, frowning. “They look like firewood.”<br><b>3</b> “Every bench starts as boards,” Uncle Ray said. “Measure twice, cut once.”<br><b>4</b> Lucia measured each leg and marked it in pencil. But when they stood the bench up, it rocked back and forth. “It’s wobbly!” she groaned. “I ruined it.”<br><b>5</b> Uncle Ray knelt down and looked closely. “One leg is a little long. That’s an easy fix,” he said. He sanded the leg until the bench stood flat.<br><b>6</b> Lucia sat down carefully. Nothing moved. “Can we build a table next?” she asked with a grin."}, "items": [{"type": "fill", "q": "Which word in paragraph 4 is the <b>strong tag</b> that shows Lucia is upset? Type it.", "answers": ["groaned"], "why": "“It’s wobbly!” she <b>groaned</b>. <i>Groaned</i> shows she is upset and disappointed.", "no": "Look at the word right after the closing quotation mark in paragraph 4.", "hint": "It is not said or asked."}, {"q": "How does Lucia change from the start to the end?", "choices": ["She doubts the boards, then wants to build more", "She starts out excited, then gets bored and wants to stop", "She is angry with Uncle Ray from the beginning to the end", "She starts confident, then becomes scared of using tools"], "a": 0, "why": "At the start she says the boards “look like firewood.” At the end she asks, “Can we build a table next?” Her dialogue shows the <b>change</b>.", "no": [null, "At the end she wants to build a table, so she is not bored.", "She grins at the end, so she is not angry the whole time.", "She was doubtful at the start, not confident, and she is happy at the end."]}, {"q": "In paragraph 2, Lucia says two sentences. Why are both in <b>one</b> paragraph?", "choices": ["Uncle Ray says the second sentence, so it stays with his words", "Short sentences always go together in one paragraph", "The same speaker, Lucia, says both sentences", "A new paragraph starts only when the setting changes"], "a": 2, "why": "“From those?” and “They look like firewood.” are both <b>Lucia’s</b> words. One speaker stays in one paragraph until someone new talks.", "no": ["Both sentences are Lucia’s. Uncle Ray does not talk until paragraph 3.", "Paragraphs are about speakers, not sentence length.", null, "The setting does not decide it. A new speaker does."]}]}, {"type": "tap", "kick": "Edit", "title": "Punctuation detective", "text": "Check every comma, capital and end mark.", "items": [{"q": "Which sentence is punctuated correctly?", "choices": ["Lucia asked, “can we paint it?”", "Lucia asked, “Can we paint it?”", "Lucia asked “Can we paint it?”", "Lucia asked, “Can we paint it”?"], "a": 1, "why": "Tag first: comma after <i>asked</i>, capital <b>C</b>, question mark inside.", "no": ["The first spoken word needs a capital: Can.", null, "Tag first needs a comma after asked.", "The question mark belongs inside the closing quotation mark."]}, {"type": "fill", "q": "Uncle Ray said “Hand me the saw.” What mark is missing after <b>said</b>? Type the name of the mark.", "answers": ["comma", "a comma"], "why": "Tag first needs a <b>comma</b> after the tag: Uncle Ray said, “Hand me the saw.”", "no": "Tag first: what comes right after the tag?", "hint": "It is the same mark that goes inside when the tag comes last."}, {"type": "fill", "q": "“Watch out__” Lucia yelled. She is shouting. What end mark goes in the blank, inside the quotation marks? Type its name.", "answers": ["exclamation point", "exclamation mark", "exclamation", "an exclamation point", "exclamation points"], "why": "A shout gets an <b>exclamation point</b>, inside the marks: “Watch out!” Lucia yelled.", "no": "She yelled. What mark shows strong feeling?", "hint": "It is not a period or a question mark."}]}, {"type": "tap", "kick": "Word Power", "title": "Use your words", "text": "Type the word from memory.", "items": [{"type": "fill", "q": "15 has the factors 1, 3, 5 and 15. It has more than two factors, so it is a ________ number.", "answers": ["composite", "composite number"], "why": "More than two factors means <b>composite</b>.", "no": "It is the opposite of prime.", "hint": "It starts with c-o-m."}, {"type": "fill", "q": "In <i>“Hand me the saw,” Uncle Ray said</i>, the curly marks around <i>Hand me the saw</i> are called ________ marks.", "answers": ["quotation", "quotation marks", "quote", "quote marks", "quotes"], "why": "They are <b>quotation</b> marks. They show the exact words Uncle Ray said.", "no": "They go around the exact words a character says.", "hint": "It starts with q-u-o."}, {"type": "fill", "q": "Rule: every time the ________ changes, start a new paragraph. Type the Word Power word.", "answers": ["speaker", "the speaker"], "why": "New <b>speaker</b>, new paragraph.", "no": "It is the character who is talking.", "hint": "It starts with s-p-e.", "placeholder": "Type one word"}, {"type": "fill", "q": "24, 48 and 72 are on the multiples list of 8 AND of 12. They are ________ multiples of 8 and 12.", "answers": ["common"], "why": "They are <b>common</b> multiples. The smallest one, 24, is the LCM.", "no": "It means shared.", "hint": "It starts with c-o-m-m."}]}, {"type": "recall", "kick": "Remember", "title": "Unit 2 skills", "text": "Keep these sharp. Unit 3 uses all of them.", "items": [{"type": "fill", "q": "Week 6: <b>72 × 46 = ____</b>", "answers": ["3,312", "3312"], "why": "72 × 6 = 432 and 72 × 40 = 2,880. 432 + 2,880 = <b>3,312</b>.", "no": "Ones row, then write the 0 for the tens row, then add carefully.", "hint": "72 × 6 = 432.", "placeholder": "Type a number"}, {"type": "fill", "q": "Week 7: <b>756 ÷ 28 = ____</b>", "answers": ["27", "27 R0", "27 remainder 0"], "why": "75 ÷ 28 → 2 (2 × 28 = 56), 19 left. Bring down 6: 196 ÷ 28 → 7 (7 × 28 = 196), 0 left. <b>27</b>. Check: 28 × 27 = 756.", "no": "28 does not go into 7, so start with 75.", "hint": "75 ÷ 28 → 2.", "placeholder": "Type a number"}, {"type": "fill", "q": "Week 8: <b>2/5 + 3/8 = ____</b> Type it in simplest form.", "answers": ["31/40"], "why": "Common denominator 40: 2/5 = 16/40 and 3/8 = 15/40. 16/40 + 15/40 = <b>31/40</b>.", "no": "Rename both in fortieths, then add only the numerators.", "hint": "2/5 = 16/40.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Week 9: <b>4.5 × 1.2 = ____</b>", "answers": ["5.4", "5.40"], "why": "45 × 12 = 540. 2 decimal places → 5.40 = <b>5.4</b>. Estimate: 5 × 1 = 5. ✅", "no": "Multiply without the points, then count the decimal places in both factors.", "hint": "45 × 12 = 540.", "placeholder": "Example: 2.5"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "What are <b>ALL</b> the factors of <b>56</b>? List them smallest to largest.", "answers": ["1, 2, 4, 7, 8, 14, 28, 56", "1,2,4,7,8,14,28,56", "1 2 4 7 8 14 28 56", "1, 2, 4, 7, 8, 14, 28 and 56"], "why": "Pairs: 1 × 56, 2 × 28, 4 × 14, 7 × 8. Factors: <b>1, 2, 4, 7, 8, 14, 28, 56</b>.", "no": "Start at 1 × the number. Test 2, 3, 4, 5… in order. Write both numbers of every pair that works. Stop when the pairs meet.", "hint": "56 is even. Try 2, 4, 7 and 8.", "placeholder": "Example: 1, 2, 4, 8"}, {"type": "fill", "q": "How many factors does <b>49</b> have? Type the number.", "answers": ["3", "three"], "why": "Pairs: 1 × 49, 7 × 7. Count 7 once: 1, 7, 49 = <b>3</b> factors.", "no": "List the pairs. In 7 × 7, count 7 only once.", "hint": "7 × 7 = 49.", "placeholder": "Type a number"}, {"q": "Which cow ID number is <b>composite</b>?", "choices": ["113", "119", "127", "131"], "a": 1, "why": "119 ÷ 7 = 17, so <b>119 = 7 × 17</b>. It has more than two factors.", "no": ["113 is prime: 2, 3, 5 and 7 do not divide it.", null, "127 is prime: 2, 3, 5, 7 and 11 do not divide it.", "131 is prime: 2, 3, 5, 7 and 11 do not divide it."]}, {"type": "fill", "q": "LCM of <b>6</b> and <b>16</b> = ____", "answers": ["48"], "why": "Multiples of 16: 16 (÷ 6? no), 32 (no), 48 (yes). The LCM is <b>48</b>.", "no": "List the multiples of the bigger number: ×1, ×2, ×3… Stop at the first one the smaller number also divides evenly.", "hint": "16, 32, 48 …", "placeholder": "Type a number"}, {"type": "fill", "q": "GCF of <b>24</b> and <b>60</b> = ____", "answers": ["12"], "why": "Factors of 24: 1, 2, 3, 4, 6, 8, 12, 24. 60 ÷ 12 = 5, so 12 is shared. The GCF is <b>12</b>.", "no": "List the factors of each number. Circle the factors they share. The biggest one you circled is the GCF.", "hint": "Is 12 a factor of 60?", "placeholder": "Type a number"}, {"type": "fill", "q": "Nadia stacks <b>20</b> hay bales and <b>35</b> bags of feed into identical piles, with nothing left over, using the greatest number of piles. How many bags of <b>feed</b> are in each pile?", "answers": ["7", "7 bags"], "why": "The GCF of 20 and 35 is 5 piles. 35 ÷ 5 = <b>7</b> bags of feed in each pile (and 4 hay bales).", "no": "Two steps: find the GCF (the number of piles). Then divide the feed by it.", "hint": "Factors of 20 and 35 both include 5.", "placeholder": "Type a number"}, {"q": "Clyde has an idea. Which sentence is punctuated correctly?", "choices": ["“Let’s build a fort.” Clyde said.", "“Let’s build a fort”, Clyde said.", "“let’s build a fort,” Clyde said.", "“Let’s build a fort,” Clyde said."], "a": 3, "why": "Tag last: comma <b>inside</b> the closing mark, capital on the first spoken word.", "no": ["A period ends it too early. Use a comma, because the tag finishes the sentence.", "The comma belongs inside the closing quotation mark.", "The first spoken word, Let’s, needs a capital.", null]}, {"type": "fill", "q": "Who is the speaker in paragraph 2? Type the name.", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Read the story</span><br><b>The Cardboard Castle</b><br><b>1</b> Clyde dragged a giant box into the living room. “Let’s build a castle,” he said.<br><b>2</b> “That box is too small for a castle,” Joyce said, crossing her arms.<br><b>3</b> Ethan picked up the scissors. “Not if we cut a door and two windows,” he said. “Then it’s a castle for both of you.”<br><b>4</b> Joyce peeked through the new window. “Can I be the queen?” she whispered."}, "answers": ["Joyce"], "why": "Paragraph 2: “That box is too small for a castle,” <b>Joyce</b> said.", "no": "Look at the dialogue tag in paragraph 2.", "hint": "It is Ethan’s sister.", "placeholder": "Type a name"}, {"q": "Why does paragraph 3 start a new paragraph?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Read the story</span><br><b>The Cardboard Castle</b><br><b>1</b> Clyde dragged a giant box into the living room. “Let’s build a castle,” he said.<br><b>2</b> “That box is too small for a castle,” Joyce said, crossing her arms.<br><b>3</b> Ethan picked up the scissors. “Not if we cut a door and two windows,” he said. “Then it’s a castle for both of you.”<br><b>4</b> Joyce peeked through the new window. “Can I be the queen?” she whispered."}, "choices": ["A new speaker, Ethan, starts talking", "The story jumps ahead to the next day in the living room", "Ethan picks up the scissors, and every action needs a new paragraph", "Ethan is the narrator, so his words always get their own paragraph"], "a": 0, "why": "Joyce talks in paragraph 2, and <b>Ethan</b> talks in paragraph 3. New speaker, new paragraph.", "no": [null, "It is the same afternoon in the living room.", "Actions do not each need a paragraph. The rule is about speakers: Joyce talked, now Ethan talks.", "A narrator tells this story, not Ethan. The reason is a new speaker."]}, {"type": "fill", "q": "“Let’s build a castle,” Clyde said. The words <i>Let’s build a castle</i> are ________, because a character says them out loud.", "answers": ["dialogue", "dialog"], "why": "They are <b>dialogue</b>: the exact words Clyde says.", "no": "It is the Word Power word for the words characters speak.", "hint": "It starts with d-i-a."}], [{"type": "fill", "q": "What are <b>ALL</b> the factors of <b>52</b>? List them smallest to largest.", "answers": ["1, 2, 4, 13, 26, 52", "1,2,4,13,26,52", "1 2 4 13 26 52", "1, 2, 4, 13, 26 and 52"], "why": "Pairs: 1 × 52, 2 × 26, 4 × 13. Factors: <b>1, 2, 4, 13, 26, 52</b>.", "no": "Start at 1 × the number. Test 2, 3, 4, 5… in order. Write both numbers of every pair that works. Stop when the pairs meet.", "hint": "3, 5, 6 and 7 do not work. Try 4.", "placeholder": "Example: 1, 2, 4, 8"}, {"type": "fill", "q": "How many factors does <b>100</b> have? Type the number.", "answers": ["9", "nine"], "why": "Pairs: 1 × 100, 2 × 50, 4 × 25, 5 × 20, 10 × 10. Count 10 once: <b>9</b> factors.", "no": "List the pairs. In 10 × 10, count 10 only once.", "hint": "There are 5 pairs.", "placeholder": "Type a number"}, {"q": "Use the rule for 3. Which number is divisible by 3?", "choices": ["412", "415", "417", "419"], "a": 2, "why": "4 + 1 + 7 = 12, and 12 is a multiple of 3, so <b>417</b> is divisible by 3 (417 ÷ 3 = 139).", "no": ["4 + 1 + 2 = 7. 7 is not a multiple of 3.", "4 + 1 + 5 = 10. 10 is not a multiple of 3.", null, "4 + 1 + 9 = 14. 14 is not a multiple of 3."]}, {"type": "fill", "q": "LCM of <b>9</b> and <b>15</b> = ____", "answers": ["45"], "why": "Multiples of 15: 15 (÷ 9? no), 30 (no), 45 (yes). The LCM is <b>45</b>.", "no": "List the multiples of the bigger number: ×1, ×2, ×3… Stop at the first one the smaller number also divides evenly.", "hint": "15, 30, 45 …", "placeholder": "Type a number"}, {"type": "fill", "q": "GCF of <b>32</b> and <b>56</b> = ____", "answers": ["8"], "why": "Factors of 32: 1, 2, 4, 8, 16, 32. 56 ÷ 8 = 7 but 56 ÷ 16 = 3 R8. The GCF is <b>8</b>.", "no": "List the factors of each number. Circle the factors they share. The biggest one you circled is the GCF.", "hint": "Is 16 a factor of 56?", "placeholder": "Type a number"}, {"type": "fill", "q": "Ethan sweeps the porch every <b>5</b> days and washes the windows every <b>15</b> days. He did both today. In how many days will he do both on the same day again?", "answers": ["15", "15 days"], "why": "15 is already a multiple of 5 (5 × 3), so the LCM is <b>15</b>. 75 is a common multiple, but not the first.", "no": "List the multiples of the bigger number: ×1, ×2, ×3… Stop at the first one the smaller number also divides evenly.", "hint": "Is 15 on the 5s list?", "placeholder": "Type a number"}, {"q": "Dad is looking for the tape measure. Which sentence is punctuated correctly?", "choices": ["Dad asked, “who has the tape measure?”", "Dad asked, “Who has the tape measure?”", "Dad asked “Who has the tape measure?”", "Dad asked, “Who has the tape measure”?"], "a": 1, "why": "Tag first: comma after <i>asked</i>, capital <b>W</b>, question mark inside.", "no": ["The first spoken word needs a capital: Who.", null, "Tag first needs a comma after asked.", "The question mark belongs inside the closing quotation mark."]}, {"type": "fill", "q": "In paragraph 1, which word in the tag tells <b>how</b> Dad spoke? Type it.", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Read the story</span><br><b>The Lost Tape Measure</b><br><b>1</b> “Has anyone seen the tape measure?” Dad called from the garage.<br><b>2</b> “I used it to measure my bed,” Clyde said slowly. “Then I put it somewhere.”<br><b>3</b> Dad sighed. “Somewhere is not a place,” he said with a small smile.<br><b>4</b> “Found it!” Ethan shouted from under the couch."}, "answers": ["called"], "why": "“Has anyone seen the tape measure?” Dad <b>called</b> from the garage. He spoke loudly so people in the house could hear.", "no": "Look right after the closing quotation mark in paragraph 1.", "hint": "He is far away in the garage.", "placeholder": "Type one word"}, {"q": "Dad says, “Somewhere is not a place,” with a small smile. What does this show about him?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Read the story</span><br><b>The Lost Tape Measure</b><br><b>1</b> “Has anyone seen the tape measure?” Dad called from the garage.<br><b>2</b> “I used it to measure my bed,” Clyde said slowly. “Then I put it somewhere.”<br><b>3</b> Dad sighed. “Somewhere is not a place,” he said with a small smile.<br><b>4</b> “Found it!” Ethan shouted from under the couch."}, "choices": ["He is furious and wants to punish Clyde for losing the tool", "He thinks the tape measure is not important enough to look for", "He does not understand what Clyde means by the word somewhere", "He is a little frustrated but keeps his sense of humor"], "a": 3, "why": "He sighs (a little frustrated), but he jokes and smiles. His dialogue <b>shows his character</b>.", "no": ["He smiles, so he is not furious.", "He was looking for it, so it matters to him.", "He understands. That is why he makes the joke.", null]}, {"type": "fill", "q": "“The paint is still wet!” Joyce warned. <i>Warned</i> shows HOW she said it, so it is a ________ tag.", "answers": ["strong", "strong tag"], "why": "<i>Warned</i> is a <b>strong</b> tag. It shows how Joyce spoke better than plain <i>said</i>.", "no": "It is the opposite of a plain tag like said.", "hint": "It starts with s-t-r."}], [{"type": "fill", "q": "What are <b>ALL</b> the factors of <b>44</b>? List them smallest to largest.", "answers": ["1, 2, 4, 11, 22, 44", "1,2,4,11,22,44", "1 2 4 11 22 44", "1, 2, 4, 11, 22 and 44"], "why": "Pairs: 1 × 44, 2 × 22, 4 × 11. Factors: <b>1, 2, 4, 11, 22, 44</b>.", "no": "Start at 1 × the number. Test 2, 3, 4, 5… in order. Write both numbers of every pair that works. Stop when the pairs meet.", "hint": "3, 5, 6 and 7 do not work. Try 4.", "placeholder": "Example: 1, 2, 4, 8"}, {"type": "fill", "q": "How many factors does <b>90</b> have? Type the number.", "answers": ["12", "twelve"], "why": "Pairs: 1 × 90, 2 × 45, 3 × 30, 5 × 18, 6 × 15, 9 × 10. 6 pairs = <b>12</b> factors.", "no": "List the pairs. Don’t forget 3, 6 and 9.", "hint": "There are 6 pairs.", "placeholder": "Type a number"}, {"q": "Which cow ID number is <b>prime</b>?", "choices": ["147", "153", "161", "149"], "a": 3, "why": "149: not even, 1 + 4 + 9 = 14 (not a multiple of 3), does not end in 0 or 5, and 7 and 11 do not divide it. <b>149 is prime.</b>", "no": ["1 + 4 + 7 = 12, so 3 divides it: 147 = 3 × 49.", "1 + 5 + 3 = 9, so 3 divides it: 153 = 9 × 17.", "161 = 7 × 23.", null]}, {"type": "fill", "q": "LCM of <b>12</b> and <b>18</b> = ____", "answers": ["36"], "why": "Multiples of 18: 18 (÷ 12? no), 36 (yes). The LCM is <b>36</b>.", "no": "List the multiples of the bigger number: ×1, ×2, ×3… Stop at the first one the smaller number also divides evenly.", "hint": "18, 36 …", "placeholder": "Type a number"}, {"type": "fill", "q": "GCF of <b>42</b> and <b>70</b> = ____", "answers": ["14"], "why": "Factors of 42: 1, 2, 3, 6, 7, 14, 21, 42. 70 ÷ 14 = 5. The GCF is <b>14</b>.", "no": "List the factors of each number. Circle the factors they share. The biggest one you circled is the GCF.", "hint": "Both are multiples of 7 and both are even.", "placeholder": "Type a number"}, {"type": "fill", "q": "Nadia packs <b>48</b> cups of yogurt and <b>60</b> cups of pudding into identical boxes, with nothing left over. What is the greatest number of boxes?", "answers": ["12", "12 boxes"], "why": "Factors of 48: 1, 2, 3, 4, 6, 8, 12, 16, 24, 48. 60 ÷ 12 = 5. The GCF is <b>12</b> boxes (4 yogurt and 5 pudding in each).", "no": "List the factors of each number. Circle the factors they share. The biggest one you circled is the GCF.", "hint": "Is 12 a factor of both?", "placeholder": "Type a number"}, {"q": "Mom needs the brush right away. Which sentence is punctuated correctly?", "choices": ["“Hand me the brush”! Mom said.", "“Hand me the brush!” mom said.", "“Hand me the brush!” Mom said.", "“Hand me the brush!,” Mom said."], "a": 2, "why": "The exclamation point goes <b>inside</b> and takes the place of the comma. Mom is a name, so it keeps its capital.", "no": ["The exclamation point belongs inside the closing quotation mark.", "Mom is used as a name here, so it needs a capital.", null, "The exclamation point takes the place of the comma. Do not use both."]}, {"type": "fill", "q": "Who solves the problem? Type the name of the speaker in paragraph 4.", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Read the story</span><br><b>Painting the Mailbox</b><br><b>1</b> Mom set two cans of paint on the porch. “Blue or green for the mailbox?” she asked.<br><b>2</b> “Green, like a frog!” Joyce said, bouncing on her toes.<br><b>3</b> Ethan shook his head. “Blue would match the shutters,” he said.<br><b>4</b> “Then we paint the box blue and the flag green,” Mom said. “Everybody wins.”"}, "answers": ["Mom", "mom", "his mom", "the mom"], "why": "Paragraph 4: “Then we paint the box blue and the flag green,” <b>Mom</b> said.", "no": "Look at the tag in paragraph 4.", "hint": "She asked the question in paragraph 1.", "placeholder": "Type a name"}, {"q": "How are Joyce’s and Ethan’s viewpoints different?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Read the story</span><br><b>Painting the Mailbox</b><br><b>1</b> Mom set two cans of paint on the porch. “Blue or green for the mailbox?” she asked.<br><b>2</b> “Green, like a frog!” Joyce said, bouncing on her toes.<br><b>3</b> Ethan shook his head. “Blue would match the shutters,” he said.<br><b>4</b> “Then we paint the box blue and the flag green,” Mom said. “Everybody wins.”"}, "choices": ["Both of them want the mailbox painted blue to match the shutters", "Joyce picks green; Ethan picks blue to match the shutters", "Joyce wants blue like the shutters, and Ethan wants green like a frog", "Neither of them cares what color the mailbox ends up being"], "a": 1, "why": "Joyce: “Green, like a frog!” Ethan: “Blue would match the shutters.” Their dialogue shows two <b>viewpoints</b>.", "no": ["Only Ethan wants blue. Joyce says, “Green, like a frog!”", null, "That is backwards. Check who says each color.", "They both care. They want different colors."]}, {"type": "fill", "q": "Painting the Mailbox has characters, a setting, a problem and a solution. It is a ________. Type the Word Power word, not <i>story</i>.", "answers": ["narrative", "a narrative"], "why": "That is a <b>narrative</b>.", "no": "It is the Word Power word for writing that tells a story.", "hint": "It starts with n-a-r."}]]}], "win": "You found every factor, planned Nadia's calendar, and punctuated dialogue like an editor. Unit 3 is off to a strong start!", "prev": "bb-ethan-L05", "prevTitle": "Lesson 5"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeigh
