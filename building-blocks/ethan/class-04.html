<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ethan · Lesson 4: Elena&#x27;s Market Stand and The Sleep Study</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L04", "label": "Lesson 4", "title": "Elena's Market Stand and The Sleep Study", "goal": "I can multiply decimals and put the decimal point in the right place, line up decimal points to total an order and make change, and tell how a nonfiction text is built.", "date": "2026-11-11", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Elena's Market Stand and The Sleep Study", "text": "Elena helps run her family's vegetable stand at the farmers market. Almost nothing weighs a whole number of pounds, so she multiplies <b>decimals</b> all day while customers wait. Today you learn where the <b>decimal point</b> goes when you multiply, and how to line up decimal points to total an order and count back change. Then you read two sources about sleep and figure out how each one is <b>built</b>.", "visual": {"kind": "emoji", "text": "🥕⚖️💵😴"}, "notes": {"do": "Before class: check his Lesson 3 Show What You Know score and his Pathways Week 8 Math score (Formspree). Set out play money (one $20 bill, one $10, one $5, five $1 bills, 4 quarters, 10 dimes, 2 nickels, 20 pennies), grid paper, three highlighters, whiteboard and marker, pencil and paper. Write Elena's specials on the whiteboard: apples $1.30 per pound, mushrooms $4.60 per pound, pecans $7.40 per pound, honey $4.35 a jar. Math runs 9:30–10:05 (35 min); reading runs 10:05–10:30 (25 min).", "say": "Two jobs today. First 35 minutes: multiplying decimals and putting the point in the right place. Last 25 minutes: two sources about sleep, and how each one is organized.", "ask": "Where do you see decimals in real life?", "listen": "Money ($4.35), weights on a scale (2.6 lb), gas prices, sports times. Any real example is fine."}}, {"type": "talk", "kick": "Math Talk", "title": "Elena's first customer", "text": "A customer's apples weigh <b>2.6 pounds</b>. Apples cost <b>$1.30 per pound</b>.", "visual": {"kind": "bigtext", "text": "2.6 × $1.30 = ?", "sub": "pounds × price per pound"}, "prompts": ["Why does Elena MULTIPLY here, and not add?", "Round both numbers. About how much will the apples cost? More or less than $3?", "Which answer makes sense: $338, $33.80 or $3.38? How do you know without multiplying?"], "starters": ["She multiplies because …", "My estimate is about … because …", "It has to be … because …"], "notes": {"do": "2 to 3 minutes. Write his estimate in the corner of the whiteboard. We check it at 9:48.", "ask": "If apples were $1 per pound, what would 2.6 pounds cost?", "listen": "$2.60. So $1.30 per pound must cost a bit more than that: about $3. $338 and $33.80 are far too big. Any reasoned estimate near $3 is great; the exact answer is $3.38."}}, {"type": "tap", "kick": "Warm-up", "title": "Lessons 1, 2 and 3, then decimals", "text": "Paper first, then type.", "items": [{"type": "fill", "q": "Lesson 1 skill. Stack it: <b>64 × 23 = ____</b>", "answers": ["1,472", "1472"], "why": "64 × 3 = 192 and 64 × 20 = 1,280. 192 + 1,280 = <b>1,472</b>.", "no": "Ones row: 64 × 3. Tens row: write the 0, then 64 × 2. Add.", "hint": "64 × 3 = 192."}, {"type": "fill", "q": "Lesson 2 skill: <b>928 ÷ 8 = ____</b>", "answers": ["116", "116 R0", "116 remainder 0"], "why": "9 ÷ 8 → 1 (1 × 8 = 8), 1 left. Bring down 2: 12 ÷ 8 → 1 (1 × 8 = 8), 4 left. Bring down 8: 48 ÷ 8 → 6 (6 × 8 = 48), 0 left. <b>116</b>. Check: 8 × 116 = 928.", "no": "Divide, multiply, subtract, bring down. Write the check.", "hint": "9 ÷ 8 → 1, 1 left. Bring down the 2: 12."}, {"type": "fill", "q": "Lesson 3 skill: <b>2/3 + 1/6 = ____</b> Type it in simplest form.", "answers": ["5/6"], "why": "6 is a multiple of 3, so the common denominator is <b>6</b>. 2/3 = 4/6. 4/6 + 1/6 = <b>5/6</b>.", "no": "Rename 2/3 in sixths, then add only the numerators and keep the denominator.", "hint": "2/3 = 4/6.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "New today. In <b>4.38</b>, which digit is in the <b>tenths</b> place, the first place after the decimal point?", "answers": ["3"], "why": "The first place after the decimal point is tenths. In 4.38 that digit is <b>3</b> (and the 8 is in the hundredths place).", "no": "Find the decimal point. Look at the first digit to its right.", "hint": "It is not the 4: the 4 is in the ones place.", "placeholder": "Type a digit"}], "notes": {"do": "He answers out loud, writes on paper, then types. If the Lesson 3 score was under 85, spend 2 extra minutes on one more fraction problem here.", "say": "Every skill from Lessons 1 to 3 comes back in Lesson 5, the Unit 2 Checkpoint. Today's multiplying uses your Lesson 1 stacking.", "ask": "In 4.38, what is the 8 worth?", "listen": "8 hundredths (8 cents if it were money). If he says 8 tenths, point to the second place after the decimal point."}}, {"type": "vocab", "kick": "Word Power", "title": "Math words for today", "text": "Tap each card to flip it. Read the word, the meaning and the example out loud.", "words": [{"word": "decimal", "pos": "noun", "meaning": "A number that uses a decimal point to show parts of a whole.", "example": "2.6 pounds is a <b>decimal</b>: 2 whole pounds and 6 tenths of a pound.", "emoji": "🔢"}, {"word": "decimal point", "pos": "noun", "meaning": "The dot that separates the whole number from the parts of a whole.", "example": "In $4.35, the <b>decimal point</b> sits between the 4 dollars and the 35 cents.", "emoji": "📍"}, {"word": "tenths", "pos": "noun", "meaning": "The first place after the decimal point. 10 tenths make 1 whole.", "example": "In 2.6, the 6 is in the <b>tenths</b> place. A dime is one tenth of a dollar.", "emoji": "🪙"}, {"word": "hundredths", "pos": "noun", "meaning": "The second place after the decimal point. 100 hundredths make 1 whole.", "example": "In $4.35, the 5 is in the <b>hundredths</b> place. A penny is one hundredth of a dollar.", "emoji": "💯"}, {"word": "decimal places", "pos": "noun", "meaning": "The number of digits after the decimal point.", "example": "3.38 has 2 <b>decimal places</b>. 20.4 has 1.", "emoji": "👉"}, {"word": "per", "pos": "preposition", "meaning": "For each one.", "example": "Apples cost $1.30 <b>per</b> pound: $1.30 for each pound.", "emoji": "⚖️"}, {"word": "reasonable", "pos": "adjective", "meaning": "Makes sense, because it is close to your estimate.", "example": "3.38 is a <b>reasonable</b> answer for 2.6 × 1.3, because 3 × 1 = 3.", "emoji": "✅"}], "notes": {"do": "He reads each card aloud, then covers it and says the meaning in his own words.", "say": "Pathways Week 9 asks you to TYPE tenths and hundredths. Per and reasonable come back all week.", "ask": "What does per mean in “$1.30 per pound”? What makes an answer reasonable?", "listen": "For each pound. Reasonable means it makes sense: close to the estimate. Have him spell hundredths out loud (h-u-n-d-r-e-d-t-h-s)."}}, {"type": "learn", "kick": "Hands-on", "title": "Tenths and hundredths are money", "text": "Lay out <b>$2.45</b>: 2 one-dollar bills, 4 dimes and 5 pennies.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 480 150\" width=\"100%\" style=\"max-width:480px;display:block;margin:auto\" font-family=\"Fredoka,Arial,sans-serif\"><rect x=\"20\" y=\"6\" width=\"120\" height=\"38\" fill=\"#0A1F3D\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"80.0\" y=\"32\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\">Ones</text><rect x=\"20\" y=\"44\" width=\"120\" height=\"66\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"80.0\" y=\"92\" text-anchor=\"middle\" font-size=\"40\" fill=\"#0A1F3D\">2</text><circle cx=\"160.0\" cy=\"100\" r=\"7\" fill=\"#DB2F30\"/><rect x=\"180\" y=\"6\" width=\"130\" height=\"38\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"245.0\" y=\"32\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\">Tenths</text><rect x=\"180\" y=\"44\" width=\"130\" height=\"66\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"245.0\" y=\"92\" text-anchor=\"middle\" font-size=\"40\" fill=\"#2E86DE\">4</text><rect x=\"310\" y=\"6\" width=\"150\" height=\"38\" fill=\"#10AC84\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"385.0\" y=\"32\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\">Hundredths</text><rect x=\"310\" y=\"44\" width=\"150\" height=\"66\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"2\"/><text x=\"385.0\" y=\"92\" text-anchor=\"middle\" font-size=\"40\" fill=\"#10AC84\">5</text><text x=\"240.0\" y=\"140\" text-anchor=\"middle\" font-size=\"17\" fill=\"#5b6578\">$2.45 = 2 dollars + 4 dimes + 5 pennies</text></svg>"}, "steps": [{"text": "<b>1 dollar = 10 dimes</b>, so a dime is one <b>tenth</b> of a dollar: $0.10. <b>1 dollar = 100 pennies</b>, so a penny is one <b>hundredth</b>: $0.01."}, {"text": "<b>0.4 = 0.40.</b> 4 dimes and 40 pennies are the same money. A 0 at the END, after the decimal point, does not change the amount."}, {"text": "<b>Fractions are decimals too.</b> A quarter is 1/4 of a dollar: <b>1/4 = 0.25</b>. Two quarters: 1/2 = 0.5. Three quarters: 3/4 = 0.75."}, {"text": "<b>Know these by heart</b> (Pathways asks them): 1/2 = 0.5 · 1/4 = 0.25 · 3/4 = 0.75 · 1/10 = 0.1 · 1/5 = 0.2"}, {"text": "<b>At the stand:</b> “Half a pound” is 0.5 lb. “A quarter pound” is 0.25 lb. The scale always shows decimals."}], "tip": "Tenths are dimes. Hundredths are pennies. A zero at the end after the point changes nothing.", "notes": {"do": "Hands-on: he builds $2.45 with play money, then trades 1 dime for 10 pennies and says the amount is still $2.45. Then 4 quarters make $1, so 1 quarter is 1/4 of a dollar.", "say": "A decimal is just a fraction with 10 or 100 equal pieces. Money already taught you this.", "ask": "Which is more money: 0.5 of a dollar or 0.45 of a dollar?", "listen": "0.5: that is 50 cents, and 0.45 is 45 cents. If he picks 0.45 because 45 is bigger than 5, have him build both with coins."}}, {"type": "tap", "kick": "Your turn", "title": "Read the decimals", "text": "Use the coins if you want to check.", "items": [{"type": "fill", "q": "Elena has <b>2 dimes and 3 pennies</b>. Type that amount as a decimal: <b>$____</b>", "answers": ["0.23", "$0.23", ".23"], "why": "2 dimes = 2 tenths and 3 pennies = 3 hundredths: <b>$0.23</b>.", "no": "Dimes go in the tenths place. Pennies go in the hundredths place.", "hint": "It is less than $1, so it starts with 0.", "placeholder": "Example: 0.50"}, {"type": "fill", "q": "Type <b>2/5</b> as a decimal: <b>2/5 = ____</b>", "answers": ["0.4", ".4", "0.40"], "why": "1/5 = 0.2, so 2/5 = 0.2 + 0.2 = <b>0.4</b>. (2/5 = 4/10, which is 4 tenths.)", "no": "Start from 1/5 = 0.2. How much is two of them?", "hint": "1/5 = 0.2.", "placeholder": "Example: 0.5"}, {"q": "Which is more: <b>0.45</b> or <b>0.5</b>?", "choices": ["0.45, because it has more digits after the decimal point", "They are equal, because both are about one half", "0.5, because 0.5 = 0.50, which is 50 hundredths"], "a": 2, "why": "Write both with 2 decimal places: 0.50 and 0.45. 50 hundredths is more, so <b>0.5</b> is more (50 cents beats 45 cents).", "no": ["More digits does not mean more. 0.45 is 45 cents and 0.5 is 50 cents.", "Both are close to one half, but 0.5 = 0.50, which is 5 hundredths more than 0.45.", null]}], "notes": {"do": "He checks the first one with coins, then does the other two in his head and says why.", "ask": "How did you know 2/5 is 0.4?", "listen": "1/5 = 0.2, and two of them make 0.4. Or 2/5 = 4/10 = 4 tenths. Watch for 0.25 (mixing up 2/5 with 1/4) or 2.5."}}, {"type": "learn", "kick": "Learn", "title": "Decimal × whole number", "text": "Each basket of peaches weighs <b>3.4 pounds</b>. Elena sells <b>6 baskets</b>. How many pounds is that?", "visual": {"kind": "bigtext", "text": "3.4 × 6 = ?", "sub": "pounds per basket × baskets"}, "steps": [{"text": "<b>1. Estimate.</b> 3.4 is about 3, and 3 × 6 = 18. The answer should be near <b>18</b>."}, {"text": "<b>2. Multiply without the point.</b> 34 × 6 = <b>204</b>. (Your Lesson 1 stacking.)"}, {"text": "<b>3. Count the decimal places in the factors.</b> 3.4 has 1. 6 has 0. That is <b>1</b> in all."}, {"text": "<b>4. Put the point back</b> 1 place from the right: 204 → <b>20.4</b> pounds. Near 18, so it is <b>reasonable</b>. ✅", "visual": {"kind": "longdiv", "text": "   3.4\n×    6\n------\n  20.4"}}, {"text": "<b>Money works the same way.</b> Honey is $4.35 a jar. 3 jars: 435 × 3 = 1,305. 4.35 has 2 decimal places → <b>$13.05</b>. Estimate: 4 × 3 = 12. ✅", "visual": {"kind": "longdiv", "text": "   4.35\n×     3\n-------\n  13.05"}}], "tip": "When you multiply, line the numbers up on the RIGHT. Do not line up the decimal points. Count the places instead.", "notes": {"do": "He works 34 × 6 and 435 × 3 on grid paper, one digit per square, then counts the decimal places out loud and moves the point.", "say": "Four steps: estimate, multiply without the point, count the decimal places, put the point back. Then check: is it reasonable?", "ask": "Why can't 3.4 × 6 be 204 or 2.04?", "listen": "The estimate is 18. 204 is far too big and 2.04 is far too small. The estimate tells you where the point goes."}}, {"type": "tap", "kick": "Your turn", "title": "Multiply and place the point", "text": "Estimate, multiply, count the places. Paper first.", "items": [{"type": "fill", "q": "<b>4.7 × 3 = ____</b>", "answers": ["14.1"], "why": "Estimate: 5 × 3 = 15. 47 × 3 = 141. 4.7 has 1 decimal place → <b>14.1</b>. Near 15. ✅", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "47 × 3 = 141.", "placeholder": "Example: 2.5"}, {"type": "fill", "q": "Peaches cost <b>$2.85 per pound</b>. A customer buys <b>2 pounds</b>. <b>$2.85 × 2 = $____</b>", "answers": ["5.70", "$5.70", "5.7", "$5.7"], "why": "Estimate: 3 × 2 = 6. 285 × 2 = 570. 2.85 has 2 decimal places → <b>$5.70</b>. Near 6. ✅", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "285 × 2 = 570.", "placeholder": "Example: 2.50"}, {"type": "fill", "q": "<b>0.6 × 9 = ____</b>", "answers": ["5.4"], "why": "6 × 9 = 54. 0.6 has 1 decimal place → <b>5.4</b>. 0.6 is less than 1, so the answer must be less than 9. ✅", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "6 × 9 = 54. Now put the point back.", "placeholder": "Example: 2.5"}], "notes": {"do": "He says his estimate out loud BEFORE he multiplies each one.", "ask": "For 0.6 × 9, why must the answer be less than 9?", "listen": "0.6 is less than 1 whole, so you get less than 9 wholes. Watch for 54 (no point) and 0.54 (too many places)."}}, {"type": "learn", "kick": "Learn", "title": "Decimal × decimal: Elena's apples", "text": "Back to the first customer: <b>2.6 pounds × $1.30 per pound</b>. $1.30 = $1.3 (the end zero changes nothing).", "visual": {"kind": "bigtext", "text": "2.6 × 1.3 = ?", "sub": "your estimate is on the whiteboard"}, "steps": [{"text": "<b>1. Estimate.</b> 2.6 is about 3 and 1.3 is about 1, so about <b>$3</b>."}, {"text": "<b>2. Multiply without the points.</b> 26 × 13 = 338.", "visual": {"kind": "longdiv", "text": "    26\n×   13\n------\n    78  ← 26 × 3\n+  260  ← 26 × 10\n------\n   338"}}, {"text": "<b>3. Count ALL the decimal places.</b> 2.6 has 1 and 1.3 has 1: <b>2</b> in all. 338 → <b>3.38</b>. The apples cost <b>$3.38</b>. Near $3. ✅ Was your 9:30 estimate close?"}, {"text": "<b>Half a pound = × 0.5.</b> Mushrooms are $4.60 per pound. 0.5 × 4.60: 5 × 460 = 2,300, 3 places → 2.300 = <b>$2.30</b>. That is just half of $4.60!"}, {"text": "<b>A quarter pound = × 0.25.</b> 0.25 × $8.40 is a quarter of $8.40: $8.40 ÷ 4 = <b>$2.10</b>. (25 × 84 = 2,100 with 3 places → 2.100 = 2.1.)"}], "tip": "Multiplying by a decimal less than 1 (like 0.5) makes the answer SMALLER than the number you started with.", "notes": {"do": "He works 26 × 13 on grid paper and counts the places. For half a pound, he splits $4.60 in play money into two equal piles ($2.30 each).", "say": "Count the decimal places in BOTH factors and add them. 1 + 1 = 2 places.", "ask": "Why is half a pound of mushrooms less than $4.60?", "listen": "You are buying less than 1 pound, so you pay less than the price of 1 pound. × 0.5 is the same as taking half."}}, {"type": "tap", "kick": "Your turn", "title": "Decimal × decimal", "text": "Estimate first. Count ALL the decimal places.", "items": [{"type": "fill", "q": "<b>1.2 × 2.5 = ____</b>", "answers": ["3", "3.0", "3.00"], "why": "Estimate: 1 × 3 = 3. 12 × 25 = 300. 1.2 has 1 place and 2.5 has 1: 2 places → 3.00 = <b>3</b>.", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "12 × 25 = 300. Put the point 2 places from the right.", "placeholder": "Example: 2.5"}, {"type": "fill", "q": "Pecans cost <b>$7.40 per pound</b>. A customer wants <b>half a pound</b>. <b>0.5 × $7.40 = $____</b>", "answers": ["3.70", "$3.70", "3.7", "$3.7"], "why": "Half of $7.40 is <b>$3.70</b>. (5 × 740 = 3,700 with 3 places → 3.700 = 3.70.)", "no": "× 0.5 means half. What is half of $7.40?", "hint": "Half of $7 is $3.50. Half of 40 cents is 20 cents.", "placeholder": "Example: 2.50"}, {"type": "fill", "q": "<b>2.3 × 1.4 = ____</b>", "answers": ["3.22"], "why": "Estimate: 2 × 1 = 2, a bit more. 23 × 14 = 322. 1 + 1 = 2 decimal places → <b>3.22</b>. ✅", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "23 × 14 = 322.", "placeholder": "Example: 2.5"}], "notes": {"do": "Hands off. He writes the estimate, the whole-number product and the place count for each.", "ask": "In 1.2 × 2.5, how many decimal places, and why is the answer just 3?", "listen": "2 places: 300 → 3.00, and the zeros at the end change nothing, so 3. Watch for 30 or 0.3, and for 3.22 typed as 32.2 (only 1 place counted)."}}, {"type": "learn", "kick": "Learn", "title": "Line up the points: total and change", "text": "The customer buys apples ($3.38), half a pound of mushrooms ($2.30) and a jar of honey ($4.35). She pays with a <b>$20 bill</b>.", "visual": {"kind": "longdiv", "text": "   3.38\n   2.30\n+  4.35\n-------\n  10.03"}, "steps": [{"text": "<b>To ADD or SUBTRACT, line up the decimal points</b>: ones under ones, tenths under tenths, hundredths under hundredths. Total: <b>$10.03</b>."}, {"text": "<b>Write $20 as 20.00</b> so every place has a digit. Then subtract, regrouping across the zeros.", "visual": {"kind": "longdiv", "text": "  20.00\n- 10.03\n-------\n   9.97"}}, {"text": "<b>Change: $9.97.</b> Check by adding: 10.03 + 9.97 = 20.00. ✅"}, {"text": "<b>Or count up, like a real vendor:</b> $10.03 → $11.00 is 97 cents. $11 → $20 is $9. 97 cents + $9 = <b>$9.97</b>."}], "tip": "Multiply: line up on the right and count places. Add or subtract: line up the decimal points.", "notes": {"do": "Role-play: you are the customer and hand him the play $20 bill. He counts up out loud as he hands back change: 2 pennies make $10.05, 2 dimes make $10.25, 3 quarters make $11, four $1 bills make $15, and the $5 makes $20. Then he adds up what he handed back: $9.97.", "say": "Adding and subtracting money is the one time you line up the decimal points.", "ask": "Why do we write 20 as 20.00?", "listen": "So there is a digit in every place to subtract from. 20 has a hidden decimal point after the 0."}}, {"type": "tap", "kick": "Your turn", "title": "Totals and change", "text": "Line up the points on grid paper. Then type.", "items": [{"type": "fill", "q": "Line up the points: <b>4.75 + 2.6 = ____</b>", "answers": ["7.35"], "why": "Write 2.6 as 2.60 under 4.75 with the points lined up: 4.75 + 2.60 = <b>7.35</b>.", "no": "Line up the decimal points, one digit under the other. Fill empty places with 0. Then add or subtract from the right, and put the point straight down.", "hint": "Write 2.6 as 2.60.", "placeholder": "Example: 2.50"}, {"type": "fill", "q": "<b>15 − 6.45 = ____</b>", "answers": ["8.55"], "why": "Write 15 as 15.00. 15.00 − 6.45 = <b>8.55</b>. Check: 6.45 + 8.55 = 15.00. ✅", "no": "Line up the decimal points, one digit under the other. Fill empty places with 0. Then add or subtract from the right, and put the point straight down.", "hint": "Write 15 as 15.00, then regroup across the zeros.", "placeholder": "Example: 2.50"}, {"type": "fill", "q": "An order costs <b>$6.85</b>. The customer pays with a <b>$10 bill</b>. How much change? <b>$____</b>", "answers": ["3.15", "$3.15"], "why": "Count up: $6.85 → $7.00 is 15 cents, and $7 → $10 is $3. Change: <b>$3.15</b>. Or 10.00 − 6.85 = 3.15.", "no": "Line up the decimal points, one digit under the other. Fill empty places with 0. Then add or subtract from the right, and put the point straight down.", "hint": "Count up from $6.85 to $7, then to $10.", "placeholder": "Example: 2.50"}], "notes": {"do": "He lines up each one on grid paper (one digit per square, the point on a line). For the change, he counts up with play money.", "ask": "What answer do you get if you line up 4.75 and 2.6 on the right instead of by the points?", "listen": "5.01, which is wrong: the 6 tenths got added to the hundredths. The estimate (5 + 3 = 8) catches it."}}, {"type": "tap", "kick": "Find the mistake", "title": "Be the checker", "text": "Each one has a mistake. Find it.", "items": [{"q": "Someone wrote: <b>2.4 × 0.3 = 7.2</b>. What went wrong?", "choices": ["Nothing. 7.2 is right, because 24 × 3 = 72.", "2 decimal places in all, so it is 0.72.", "They forgot the point. It should be 72.", "They should have added instead: 2.4 + 0.3 = 2.7"], "a": 1, "why": "2.4 has 1 decimal place and 0.3 has 1: 2 in all. 72 → <b>0.72</b>. Estimate: 0.3 is less than 1, so the answer must be less than 2.4. 7.2 is too big.", "no": ["24 × 3 = 72 is right, but 0.3 is less than 1 whole, so the answer must be LESS than 2.4. 7.2 is more.", null, "72 has no decimal point at all. Count the places in both factors.", "The problem says ×. The mistake is where the point went."]}, {"q": "Someone added <b>3.5 + 1.25</b> like this and got <b>1.60</b>. What went wrong?", "visual": {"kind": "longdiv", "text": "   3.5\n+ 1.25\n------\n  1.60   ✗"}, "choices": ["They lined up the last digits. It is 4.75.", "Nothing. 1.60 is right, because 35 + 125 = 160.", "They lost the point. It should be 160.", "1.60 is right, but it must be written as 1.6 instead."], "a": 0, "why": "The 5 in 3.5 is 5 TENTHS, so it goes under the 2 in 1.25. 3.50 + 1.25 = <b>4.75</b>. Estimate: 3 + 1 = 4, and 1.60 is less than 3.5 by itself.", "no": [null, "Adding can't give an answer smaller than 3.5. Estimate: 3 + 1 = 4.", "160 is even further off. The real mistake is how they lined up the numbers: 3.50 + 1.25.", "1.6 is the same wrong amount. Line up the decimal points."]}, {"q": "Someone found the change from $20 for an $8.65 order: <b>$20.00 − $8.65 = $11.45</b>. What went wrong?", "choices": ["Nothing. Check: 11.45 + 8.65 = 20.00.", "They forgot a regroup in the ones. It is $12.35.", "You can't take 8.65 from 20, so they should have added.", "They forgot a regroup in the tenths. It is $11.35."], "a": 3, "why": "Regroup across the zeros: 20.00 becomes 19 ones, 9 tenths and 10 hundredths. 10 − 5 = 5, 9 − 6 = 3, 19 − 8 = 11: <b>$11.35</b>. Check: 8.65 + 11.35 = 20.00, but 8.65 + 11.45 = 20.10.", "no": ["Add it carefully: 8.65 + 11.45 = 20.10, not 20.00.", "The ones did regroup: 20 became 19 ones, and 19 − 8 = 11. Check: 8.65 + 12.35 = 21.00.", "You can: write 20 as 20.00 and regroup. Change means subtract.", null]}], "notes": {"do": "He says which step went wrong for each one and proves it with an estimate, or by adding back for the change. For the second one, he rewrites it on grid paper with the points lined up.", "say": "These are the three big decimal mistakes: the point in the wrong place, lining up the wrong digits, and losing a regroup.", "ask": "Which check catches each mistake: an estimate or adding back?", "listen": "An estimate catches the first two. Adding back catches the change mistake."}}, {"type": "tap", "kick": "Exit ticket", "title": "Math check", "text": "On your own. Paper first, then type.", "items": [{"type": "fill", "q": "<b>1.4 × 2.5 = ____</b>", "answers": ["3.5", "3.50"], "why": "Estimate: 1 × 3 = 3. 14 × 25 = 350. 2 decimal places → 3.50 = <b>3.5</b>.", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "placeholder": "Example: 2.5"}, {"type": "fill", "q": "A customer buys <b>2 jars of honey at $4.35 each</b> and pays with a <b>$10 bill</b>. How much change? <b>$____</b>", "answers": ["1.30", "$1.30", "1.3", "$1.3"], "why": "Honey: $4.35 × 2 = $8.70. Change: $10.00 − $8.70 = <b>$1.30</b>. Count up: $8.70 → $9 is 30 cents, $9 → $10 is $1.", "no": "Two steps: first multiply to find the cost, then subtract it from $10.00.", "placeholder": "Example: 2.50"}], "notes": {"do": "Hands off. Note his first answers. Then switch to reading (10:05).", "listen": "3.5 and $1.30. Both right on the first try means he is ready for Pathways Week 9 Math (Monday on his task list). Watch for 35 (no point) and $8.70 (stopped after step one)."}}, {"type": "vocab", "kick": "Word Power", "title": "Reading words for today", "text": "Tap each card. Read the word, the meaning and the example out loud.", "words": [{"word": "text structure", "pos": "noun", "meaning": "The pattern a writer uses to organize information.", "example": "Sequence is a <b>text structure</b>: it puts events in time order.", "emoji": "🏗️"}, {"word": "cause and effect", "pos": "noun", "meaning": "A text structure that tells WHY something happens and WHAT happens because of it.", "example": "“Because it rained, fewer customers came” is <b>cause and effect</b>.", "emoji": "⛈️"}, {"word": "problem and solution", "pos": "noun", "meaning": "A text structure that names a problem, then tells how it was fixed.", "example": "“The stand ran out of quarters. To fix it, Dad brought a roll from the bank” is <b>problem and solution</b>.", "emoji": "🔧"}, {"word": "sequence", "pos": "noun", "meaning": "A text structure that tells events or steps in time order.", "example": "“First wash, next weigh, finally sell” is a <b>sequence</b>.", "emoji": "1️⃣"}, {"word": "signal words", "pos": "noun", "meaning": "Words that hint at the text structure.", "example": "<b>Because</b> and <b>as a result</b> are <b>signal words</b> for cause and effect.", "emoji": "🚦"}, {"word": "source", "pos": "noun", "meaning": "A text, study, or person that information comes from.", "example": "A science magazine article is a <b>source</b> for a report.", "emoji": "📄"}, {"word": "synthesize", "pos": "verb", "meaning": "To combine ideas from more than one source into one bigger understanding.", "example": "When you use Source A AND Source B in one sentence, you <b>synthesize</b>.", "emoji": "🧩"}], "notes": {"do": "He reads each card aloud and covers it. Extra time on synthesize and text structure: Pathways asks him to type both.", "say": "Now we switch to reading. You are writing a report on whether middle schools should start later. You have two sources, and they are built in two different ways.", "ask": "How is text structure different from author's purpose (Lesson 3)?", "listen": "Purpose is WHY the author wrote it. Structure is HOW the information is organized."}}, {"type": "learn", "kick": "Learn", "title": "How nonfiction is built", "text": "Writers organize facts in a pattern. Spot the pattern and the piece gets easier to understand and remember.", "visual": {"kind": "bigtext", "text": "structure = HOW it is organized", "sub": "signal words are the clues"}, "steps": [{"text": "<b>Cause and effect</b> (because, so, as a result): “Because it rained all morning, fewer customers came. As a result, Elena had 20 pounds of tomatoes left.”"}, {"text": "<b>Problem and solution</b> (problem, to solve, to fix): “The stand kept running out of quarters. To fix it, Elena's dad brought a roll of quarters from the bank.”"}, {"text": "<b>Sequence</b> (first, next, then, finally): “First, Elena unloads the truck. Next, she sets up the scale. Finally, she writes the prices on the board.”"}, {"text": "<b>Compare and contrast</b> (both, however, unlike): “Both apples and peaches are sold by the pound. However, peaches cost more.”"}, {"text": "<b>Careful:</b> one signal word is not enough. Ask what the WHOLE piece does: explain why, fix a problem, give steps, or show alike and different."}], "tip": "Ask: does it explain WHY, FIX a problem, give STEPS in order, or show ALIKE and DIFFERENT?", "notes": {"do": "Write the four structures on the whiteboard with their signal words. He makes up one sentence about his own family for any two of them.", "say": "Last week was WHY an author writes. This week is HOW the writing is built.", "ask": "Make up a cause-and-effect sentence about Joyce or Clyde.", "listen": "Any sentence with a real cause and result, like “Clyde stayed up late, so he was grumpy at breakfast.”"}}, {"type": "tap", "kick": "Read", "title": "Source A", "text": "Read Source A out loud. Highlight the signal words.", "visual": {"kind": "passage", "text": "<b>Source A · Science Magazine for Students</b><br><b>Why Teens Are So Tired</b><br>“As children reach their early teens, their internal body clock naturally shifts later. Because of this shift, most teens do not feel sleepy until around 11pm — even when they get in bed earlier. As a result, a student who must wake at 6am to catch the bus often gets seven hours of sleep instead of the nine that doctors recommend. Over weeks, that missing sleep adds up, and students report more trouble focusing in their morning classes.”"}, "items": [{"type": "fill", "q": "Source A says teens' body clocks shift ________. Type one word.", "answers": ["later", "late"], "why": "“Their internal body clock naturally shifts <b>later</b>.” That is the CAUSE in Source A.", "no": "Look at the first sentence.", "hint": "It is the opposite of earlier."}, {"type": "fill", "q": "A student who wakes at 6am gets about how many hours of sleep? Type the number.", "answers": ["7", "seven", "7 hours", "seven hours", "about 7", "about seven"], "why": "Source A says the student “often gets <b>seven</b> hours of sleep instead of the nine that doctors recommend.”", "no": "Look for the word hours.", "hint": "It is 2 less than what doctors recommend."}, {"q": "Which sentence could be added to the END of Source A and keep its text structure?", "choices": ["First, teens wake up. Next, they eat breakfast.", "To solve this, one town bought new buses for its schools.", "As a result, many students do worse on tests.", "Both teens and their parents like to sleep in on weekends."], "a": 2, "why": "Source A is <b>cause and effect</b>: it explains why teens are tired and what results. “As a result, many tired students do worse on morning tests” adds another effect.", "no": ["That is a sequence (first, next). Source A explains causes and effects.", "That is a solution. Source A never offers a fix.", null, "That compares two groups. Source A explains why teens are tired and what happens next."]}], "notes": {"do": "He reads aloud and highlights the signal words (Because of this shift, As a result) in color 1. Then he answers.", "ask": "What is the cause in Source A, and what are the effects?", "listen": "Cause: the body clock shifts later. Effects: not sleepy until 11pm, only about 7 hours of sleep, trouble focusing in morning classes."}}, {"type": "tap", "kick": "Read", "title": "Source B", "text": "Read Source B out loud. Highlight the signal words.", "visual": {"kind": "passage", "text": "<b>Source B · School Board Newsletter</b><br><b>One District's Answer</b><br>“Our district faced a real problem: too many students were arriving to first period exhausted and unfocused. To solve it, the board moved the middle school start time from 7:30am to 8:20am. To make the change work, bus routes were rescheduled and after-school practices were shortened by fifteen minutes. Since the switch, first-period attendance has improved, though some families say the later dismissal makes evening schedules tighter.”"}, "items": [{"type": "fill", "q": "What is the new middle school start time? Type the time.", "answers": ["8:20", "8:20am", "8:20 am", "8:20 a.m.", "820", "8:20 in the morning", "twenty after eight"], "why": "“The board moved the middle school start time from 7:30am to <b>8:20am</b>.”", "no": "Look for the word moved.", "hint": "It is the second time in that sentence."}, {"q": "What TWO changes made the new start time work?", "choices": ["Lunch got longer and buses were canceled for the year", "New bus routes and practices fifteen minutes shorter", "School started earlier and practices got fifteen minutes longer", "First period was canceled and families drove kids to school"], "a": 1, "why": "“To make the change work, <b>bus routes were rescheduled and after-school practices were shortened by fifteen minutes</b>.”", "no": ["Source B never mentions lunch, and the buses kept running on new routes.", null, "School started LATER, and practices got SHORTER.", "First period stayed. Its attendance improved."]}, {"type": "fill", "q": "Math link: how many minutes LATER does school start now? From 7:30 to 8:20 is ____ minutes.", "answers": ["50", "fifty", "50 minutes", "fifty minutes"], "why": "7:30 → 8:00 is 30 minutes, and 8:00 → 8:20 is 20 minutes. 30 + 20 = <b>50</b> minutes.", "no": "Count up from 7:30 to 8:00, then to 8:20.", "hint": "7:30 to 8:00 is 30 minutes.", "placeholder": "Type a number"}], "notes": {"do": "He highlights the signal words (problem, To solve it) in color 2 and the downside (some families say evening schedules are tighter) in color 3.", "ask": "What is the problem in Source B, and what is the solution?", "listen": "Problem: students arriving to first period exhausted. Solution: start at 8:20am instead of 7:30am. So the structure is problem and solution."}}, {"type": "learn", "kick": "Learn", "title": "Synthesize: two sources, one answer", "text": "Your report question: <b>Should middle schools start later?</b> Neither source answers it alone.", "visual": {"kind": "bigtext", "text": "A = WHY · B = WHAT HAPPENED"}, "steps": [{"text": "<b>1. What does each source give you?</b> Source A explains WHY teens are tired (cause and effect). Source B shows what happened when one district acted (problem and solution)."}, {"text": "<b>2. Find where they connect.</b> Source A's effect (tired in morning classes) is Source B's problem (exhausted in first period)."}, {"text": "<b>3. Use both in one sentence.</b> “Teens' body clocks shift later, so many miss sleep (Source A). When one district started 50 minutes later, first-period attendance improved (Source B).”"}, {"text": "<b>4. Be honest about the downside.</b> Add Source B's tradeoff: “…but some families had tighter evenings.” A fair report does not pretend every source agrees."}], "tip": "Name the source in parentheses. Then the reader knows where each idea came from.", "notes": {"do": "He says his own synthesized sentence out loud, then writes it on paper. Check: does it use something from BOTH sources and name them?", "say": "Synthesize means you build something new from two sources, like using two ingredients in one recipe.", "ask": "Why is the downside part of a strong report?", "listen": "A fair report shows the whole picture. Leaving out the tradeoff makes it one-sided."}}, {"type": "sort", "kick": "Structure sort", "title": "How is it built?", "text": "Tap a card, then tap its text structure.", "buckets": ["Cause and effect", "Problem and solution", "Sequence", "Compare and contrast"], "items": [{"text": "Clyde stayed up late watching a movie. As a result, he was grumpy at breakfast.", "b": 0, "why": "Staying up late (cause) made him grumpy (effect).", "hint": "Look for “as a result.”"}, {"text": "Joyce kept losing her shoes. To fix it, Mom put a basket by the door.", "b": 1, "why": "A problem (lost shoes) and a fix (the basket).", "hint": "Is something being fixed?"}, {"text": "First, wash the carrots. Next, tie them in bunches. Finally, set them on ice.", "b": 2, "why": "Steps in time order: first, next, finally.", "hint": "Look at the first word of each sentence."}, {"text": "Both stands sell honey. However, Elena's jars are bigger.", "b": 3, "why": "Both shows alike; however shows different.", "hint": "Look for “both” and “however.”"}, {"text": "Because the frost came early, the squash crop was small this year.", "b": 0, "why": "The early frost (cause) made a small crop (effect).", "hint": "Look for “because.”"}, {"text": "The market had no shade. To solve it, the town put up a big tent.", "b": 1, "why": "No shade is the problem; the tent is the solution.", "hint": "Look for “to solve it.”"}, {"text": "Before bed, Ethan brushes his teeth, then reads for 15 minutes, and last, turns off the light.", "b": 2, "why": "Steps in time order: before, then, last.", "hint": "Do the steps happen in order?"}, {"text": "Dad and Ethan both like pancakes, but unlike Ethan, Dad adds blueberries.", "b": 3, "why": "It shows how Dad and Ethan are alike and different.", "hint": "Look for “both” and “unlike.”"}], "done": "Cause and effect explains why. Problem and solution fixes something. Sequence gives steps in order. Compare and contrast shows alike and different.", "notes": {"do": "He sorts all eight and says the signal words out loud before each tap.", "ask": "The Clyde card has no “because.” How did you still know it was cause and effect?", "listen": "“As a result” is a signal too, and the card tells why something happened."}}, {"type": "tap", "kick": "Exit ticket", "title": "Words from memory", "text": "No word list. Type the word.", "items": [{"type": "fill", "q": "In <b>6.25</b>, the 5 is in the ________ place.", "answers": ["hundredths", "hundredth", "the hundredths", "hundreths"], "why": "The second place after the decimal point is the <b>hundredths</b> place.", "no": "It is the SECOND place after the decimal point.", "hint": "It starts with h-u-n."}, {"type": "fill", "q": "Because, first, however and to solve it are ________ words. They hint at the text structure.", "answers": ["signal", "signal words"], "why": "They are <b>signal</b> words.", "no": "Like a traffic signal, they tell you what is coming.", "hint": "It starts with s-i-g."}, {"type": "fill", "q": "To combine ideas from two sources into one answer is to ________.", "answers": ["synthesize", "synthesise", "synthesizing", "synthesis"], "why": "That is to <b>synthesize</b>.", "no": "You did this with Source A and Source B.", "hint": "It starts with s-y-n."}], "notes": {"do": "No peeking at the vocab slides. A missed word is said three times, spelled out loud, then typed again.", "listen": "Spelling counts: h-u-n-d-r-e-d-t-h-s, s-i-g-n-a-l, s-y-n-t-h-e-s-i-z-e. The lesson accepts hundreths, but Pathways does not."}}, {"type": "learn", "kick": "Wrap-up", "title": "Two big skills", "text": "You put every decimal point in the right place, and you read for how a text is built.", "steps": [{"text": "<b>Multiply:</b> estimate, multiply without the points, count ALL the decimal places, put the point back."}, {"text": "<b>Add or subtract:</b> line up the decimal points. Write $20 as 20.00."}, {"text": "<b>Check:</b> is it reasonable? Is it close to your estimate? For change, add back."}, {"text": "<b>Reading:</b> cause and effect, problem and solution, sequence, compare and contrast. Synthesize = use both sources."}, {"text": "<b>Next:</b> no class for a few weeks. You lead the Ferguson Family Feast Planner, and it is full of decimals!"}], "tip": "Before you type: is the decimal point in the right place? Check it with your estimate.", "notes": {"do": "Open the course page together and read this week's task list, one day at a time. Then open the Feast Planner page and read “What it is” together.", "say": "Tonight: the after-class lesson and Show What You Know. Thursday: Pathways Week 9 Reading, and the Feast Planner starts. Monday: Pathways Week 9 Math. After that, it is the Feast Planner until Lesson 5.", "ask": "Say the steps for 2.6 × 1.3 without looking.", "listen": "Estimate about 3, multiply 26 × 13 = 338, count 2 decimal places, 3.38. Reasonable."}}], "win": "You put every decimal point in the right place and pulled two sources together. Elena's stand is closed out for the day!", "prev": "bb-ethan-L03", "prevTitle": "Lesson 3"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
