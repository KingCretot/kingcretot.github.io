<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan · Lesson 7: The Houston Apartment Build and Building Up Houston</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L07", "label": "Lesson 7", "title": "The Houston Apartment Build and Building Up Houston", "goal": "I can find equivalent fractions, simplify a fraction in one step with the GCF, convert between improper fractions and mixed numbers, and build an informative paragraph with a topic sentence, details, transitions and a concluding sentence.", "date": "2027-01-06", "mastery": 85, "color": "#D35400", "slides": [{"type": "hello", "title": "The Houston Apartment Build: On Your Own", "text": "In class you renamed fractions, simplified them with the GCF, converted between improper fractions and mixed numbers, and built paragraphs. Now you do it on your own. Keep paper and a pencil next to you. Work every fraction on paper first.", "visual": {"kind": "emoji", "text": "🏗️🧱📐📝"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["Why is 3/8 equal to 9/24, but NOT equal to 4/9?", "How do you simplify 30/42 in one step? How do you know 5/7 is done?", "How is 19/4 the same as 4 3/4? Where did the 3 come from?", "What are the four parts of an informative paragraph?"], "starters": ["3/8 = 9/24 because … but 4/9 …", "I divide by … because …", "19 ÷ 4 = … so …", "First comes the … then …"]}, {"type": "vocab", "kick": "Word Power", "title": "Review your words", "text": "Say the meaning out loud first. Then flip the card to check yourself.", "words": [{"word": "improper fraction", "pos": "noun", "meaning": "A fraction whose numerator is equal to or bigger than its denominator. It is 1 whole or more.", "example": "19/4 is an <b>improper fraction</b>: 19 fourths is more than 1 whole foot.", "emoji": "🔝"}, {"word": "simplify", "pos": "verb", "meaning": "To rename a fraction with smaller numbers by dividing the numerator and the denominator by the same number.", "example": "<b>Simplify</b> 30/42: divide both by 6 to get 5/7.", "emoji": "✂️"}, {"word": "convert", "pos": "verb", "meaning": "To change a number into a different form that has the same value.", "example": "<b>Convert</b> 19/4 to a mixed number: 4 3/4.", "emoji": "🔄"}, {"word": "unit fraction", "pos": "noun", "meaning": "A fraction with 1 as its numerator.", "example": "Each short pipe is 1/6 foot long. 1/6 is a <b>unit fraction</b>.", "emoji": "📏"}, {"word": "informative writing", "pos": "noun", "meaning": "Nonfiction writing whose job is to explain a real topic and give the reader true facts about it.", "example": "An article about how tower cranes work is <b>informative writing</b>.", "emoji": "📰"}, {"word": "topic sentence", "pos": "noun", "meaning": "The sentence that states what the whole paragraph is about. Writers usually put it first.", "example": "“A tower crane is the tallest tool on a building site” is a <b>topic sentence</b>.", "emoji": "🏷️"}, {"word": "supporting detail", "pos": "noun", "meaning": "A sentence that proves or explains the main idea with a fact, an example or a reason.", "example": "“Each morning, the operator climbs up inside the tower to the cab” is a <b>supporting detail</b> about the crane.", "emoji": "🧱"}, {"word": "transition", "pos": "noun", "meaning": "A connecting word or phrase, such as first, however or as a result, that shows how the next idea links to the one before.", "example": "“<b>Next</b>, the crew sets the window in place.” Next is a <b>transition</b>.", "emoji": "🚪"}, {"word": "concluding sentence", "pos": "noun", "meaning": "The final sentence of a paragraph. It says the main idea again with different words to close the paragraph.", "example": "“Careful steps like these keep every apartment dry” is a <b>concluding sentence</b>.", "emoji": "🎀"}, {"word": "off-topic", "pos": "adjective", "meaning": "Not about the main idea, so it does not belong in the paragraph.", "example": "“The crane operator's favorite color is green” is <b>off-topic</b> in a paragraph about how cranes work.", "emoji": "🚫"}]}, {"type": "learn", "kick": "Remember", "title": "Simplify, then convert", "text": "<b>54/12</b> as a mixed number in simplest form", "visual": {"kind": "bigtext", "text": "54/12 = 9/2 = 4 1/2", "sub": "GCF of 54 and 12 is 6"}, "steps": [{"text": "<b>1. Find the GCF.</b> Factors of 12: 1, 2, 3, 4, 6, 12. 6 is a factor of 54 (6 × 9 = 54), and 12 is not. GCF = <b>6</b>."}, {"text": "<b>2. Simplify.</b> 54 ÷ 6 = 9 and 12 ÷ 6 = 2. <b>54/12 = 9/2.</b>"}, {"text": "<b>3. Convert.</b> 9 ÷ 2 = 4 R1. <b>9/2 = 4 1/2.</b> (Or convert first: 54/12 = 4 6/12, and 6/12 = 1/2. Same answer.)"}, {"text": "<b>Going the other way:</b> 2 5/8 = 2 × 8 + 5 = 16 + 5 = 21 eighths. <b>2 5/8 = 21/8.</b>"}], "tip": "Equivalent: multiply or divide top and bottom by the same number. Simplify: divide by the GCF. Convert: divide, or whole × denominator + numerator."}, {"type": "tap", "kick": "Try it", "title": "Equivalent fractions", "text": "What was the number multiplied by? Do the same to the other number.", "items": [{"type": "fill", "q": "<b>7/8 = ____/40</b> Type the missing numerator.", "answers": ["35", "35/40"], "why": "8 × 5 = 40, so multiply the numerator by 5 too: 7 × 5 = 35. <b>7/8 = 35/40</b>.", "no": "What do you multiply 8 by to get 40? Multiply the numerator by that same number.", "hint": "8 × 5 = 40.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>3/7 = 27/____</b> Type the missing denominator.", "answers": ["63", "27/63"], "why": "3 × 9 = 27, so multiply the denominator by 9 too: 7 × 9 = 63. <b>3/7 = 27/63</b>.", "no": "This time the numerator changed. What do you multiply 3 by to get 27? Do the same to the denominator.", "hint": "3 × 9 = 27.", "placeholder": "Type a number"}, {"q": "Which fraction is equivalent to <b>15/35</b>?", "choices": ["5/7", "14/34", "3/7", "3/5"], "a": 2, "why": "The GCF of 15 and 35 is 5. 15 ÷ 5 = 3 and 35 ÷ 5 = 7. <b>15/35 = 3/7</b>.", "no": ["That divides the top by 3 and the bottom by 5. Divide both by the SAME number.", "That subtracts 1 from both. Subtracting changes the amount.", null, "That divides the top by 5 and the bottom by 7. Divide both by the SAME number."]}]}, {"type": "tap", "kick": "Try it", "title": "Simplify it", "text": "List the factors. Divide by the GCF.", "items": [{"type": "fill", "q": "Simplify in one step with the GCF: <b>27/45 = ____</b>", "answers": ["3/5"], "why": "Factors of 27: 1, 3, 9, 27. Factors of 45: 1, 3, 5, 9, 15, 45. The GCF is <b>9</b>. 27 ÷ 9 = 3 and 45 ÷ 9 = 5. <b>3/5</b>", "no": "Find the greatest common factor of the numerator and the denominator. Divide BOTH by it. Then check: do the new numbers share any factor except 1?", "hint": "The GCF of 27 and 45 is 9.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "To simplify <b>40/56</b> in ONE step, divide the numerator and the denominator by ____.", "answers": ["8"], "why": "Factors of 40: 1, 2, 4, 5, <b>8</b>, 10, 20, 40. Factors of 56: 1, 2, 4, 7, <b>8</b>, 14, 28, 56. The GCF is <b>8</b>, and 40/56 = 5/7.", "no": "Find the GREATEST factor that 40 and 56 share. 2 and 4 work, but they are not the greatest.", "hint": "It is less than 10.", "placeholder": "Type a number"}, {"q": "Which fraction can still be <b>simplified</b>?", "choices": ["8/15", "14/35", "9/20", "11/12"], "a": 1, "why": "14 and 35 share the factor 7: 14/35 = <b>2/5</b>. The others share no factor except 1.", "no": ["8 = 2 × 2 × 2 and 15 = 3 × 5. Only 1 is common, so it is in simplest form.", null, "9 = 3 × 3 and 20 = 2 × 2 × 5. Only 1 is common, so it is in simplest form.", "11 and 12 share only 1. It is in simplest form."]}]}, {"type": "tap", "kick": "Try it", "title": "Convert it", "text": "Type a mixed number with a space: 4 5/6.", "items": [{"type": "fill", "q": "Change it to a mixed number: <b>29/6 = ____</b>", "answers": ["4 5/6", "4-5/6", "4 and 5/6"], "why": "29 ÷ 6 = 4 R5. The quotient 4 is the whole number. The remainder 5 is the new numerator, and the denominator stays 6. <b>4 5/6</b>", "no": "Divide the numerator by the denominator. The quotient is the whole number, the remainder is the new numerator, and the denominator stays the same. Type a space between the whole number and the fraction.", "hint": "29 ÷ 6 = 4 R5.", "placeholder": "Example: 2 1/3"}, {"type": "fill", "q": "Change it to an improper fraction: <b>7 3/4 = ____/4</b> Type the numerator.", "answers": ["31", "31/4"], "why": "7 wholes = 7 × 4 = 28 fourths. Add the 3 more: 28 + 3 = 31. <b>7 3/4 = 31/4</b>.", "no": "Multiply the whole number by the denominator first (7 × 4), then add the numerator. The denominator stays 4.", "hint": "7 × 4 = 28.", "placeholder": "Type a number"}, {"q": "Which is <b>44/6</b> as a mixed number in simplest form?", "choices": ["7 2/6", "6 2/7", "7 1/2", "7 1/3"], "a": 3, "why": "44 ÷ 6 = 7 R2, so 44/6 = 7 2/6. Simplify the fraction part: 2/6 = 1/3. <b>7 1/3</b>", "no": ["7 2/6 is the right amount, but 2/6 is not in simplest form.", "The quotient and the denominator got mixed up. 44 ÷ 6 = 7 R2, and the denominator stays 6 before you simplify.", "2/6 is not 1/2. Divide 2 and 6 by 2: 1/3.", null]}]}, {"type": "tap", "kick": "Try it", "title": "Two-step jobs", "text": "Underline what the question asks for.", "items": [{"type": "fill", "q": "A kitchen floor is covered with <b>64 tiles</b>. <b>40</b> of them are blue, and every other tile is white. What fraction of the tiles are <b>white</b>? Type it in simplest form.", "answers": ["3/8"], "why": "Step 1: 64 − 40 = 24 white tiles, so 24/64. Step 2: the GCF of 24 and 64 is 8. 24 ÷ 8 = 3 and 64 ÷ 8 = 8. <b>3/8</b>", "no": "Two steps. First subtract to find how many are white. Then write that number over 64 and divide both by the GCF.", "hint": "64 − 40 = 24.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Mr. Nguyen joins <b>27 pieces of pipe</b> into one straight line. Every piece is <b>1/6 foot long</b>. How long is the line? Type a mixed number in simplest form.", "answers": ["4 1/2", "4-1/2", "4 and 1/2", "4 1/2 feet", "4 1/2 ft", "4-1/2 feet", "4-1/2 ft", "4 and 1/2 feet", "4 and 1/2 ft"], "why": "27 pieces of 1/6 = 27/6 feet. 27 ÷ 6 = 4 R3, so 27/6 = 4 3/6. 3/6 simplifies to 1/2 (divide both by 3). <b>4 1/2 feet</b>", "no": "Write it as an improper fraction first (27/6). Then divide to make a mixed number, and simplify the fraction part.", "hint": "27 ÷ 6 = 4 R3.", "placeholder": "Example: 2 1/3"}, {"type": "fill", "q": "A steel bar must be <b>5 2/3 feet</b> long. Darnell's chart counts thirds. How many thirds is that? <b>5 2/3 = ____/3</b>", "answers": ["17", "17/3"], "why": "5 wholes = 5 × 3 = 15 thirds. Add the 2 more: 15 + 2 = 17. <b>5 2/3 = 17/3</b>.", "no": "Multiply the whole number by the denominator first (5 × 3), then add the numerator. The denominator stays 3.", "hint": "5 × 3 = 15.", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Read", "title": "Painting Day", "text": "Read the paragraph. Then answer.", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Another informative paragraph</span><br><b>Painting Day</b><br>(1) Painting the apartments is one of the last big jobs before families move in. (2) First, the painters cover the floors with cloths so no drops land on the new tiles. (3) Next, they fill small holes in the walls and sand them smooth. (4) For example, every nail hole left by the wall crew gets filled. (5) The building across the street has a red roof. (6) Then, the painters roll on two coats of paint. (7) Fresh paint makes each apartment look clean and ready for its new family."}, "items": [{"q": "Which sentence is the <b>topic sentence</b>?", "choices": ["(2) First, the painters cover the floors with cloths.", "(6) Then, the painters roll on two coats of paint.", "(1) Painting the apartments is one of the last big jobs.", "(7) Fresh paint makes each apartment look clean and ready."], "a": 2, "why": "Every other sentence tells about painting the apartments. <b>Sentence 1</b> tells that main idea.", "no": ["That is the first STEP, a supporting detail. It starts with a transition.", "That is a later step, a supporting detail.", null, "That is the concluding sentence. It wraps up the paragraph."]}, {"type": "fill", "q": "Which sentence is <b>off-topic</b>? Type its number.", "answers": ["5", "five", "sentence 5", "(5)"], "why": "<b>Sentence 5</b> is about a roof across the street, not about painting the apartments.", "no": "Find the sentence that is not about painting.", "hint": "It is in the middle of the paragraph.", "placeholder": "Type a number"}, {"q": "How does sentence 7 work as the <b>concluding sentence</b>?", "choices": ["It gives an example of how the wall crew fills nail holes.", "It adds a new topic: the building across the street.", "It tells the first step the painters take before painting.", "It sums up the main idea about painting in new words."], "a": 3, "why": "“Fresh paint makes each apartment look clean and ready for its new family” sums up why painting matters. It <b>wraps up the main idea</b>.", "no": ["The example is in sentence 4.", "The roof is the off-topic sentence. A conclusion never adds a new topic.", "The first step is sentence 2.", null]}]}, {"type": "tap", "kick": "Try it", "title": "Transitions and conclusions", "text": "Pick the transition whose job fits.", "items": [{"q": "Choose the best transition: <b>Big glass windows let in lots of sunlight. ____, they can make a room very hot in the summer.</b>", "choices": ["However", "For example", "First", "As a result"], "a": 0, "why": "The second idea is a problem that is DIFFERENT from the first good idea. That is a contrast: <b>However</b>.", "no": [null, "A hot room is not an example of sunlight coming in. It is a difference.", "First starts a list of steps. There are no steps here.", "The sunlight is good news and the heat is bad news. Use a contrast word."]}, {"type": "fill", "q": "Type the transition that fits: <b>The elevator was not working yet. ____, the painters carried their buckets up the stairs.</b>", "answers": ["as a result", "therefore", "consequently", "because of this", "because of that", "for this reason", "so"], "why": "They carried the buckets BECAUSE the elevator was not working. That is an effect: <b>As a result</b>.", "no": "Is the second idea an example, a difference, or a result of the first?", "hint": "It is the transition for an effect."}, {"q": "Pick the best <b>concluding sentence</b>: “Electricians have an important job in a new building. First, they run wires through the walls. Next, they put in outlets and light switches. They also connect every apartment to the main power box. ____”", "choices": ["First, they run wires through the walls of every apartment.", "Some electricians drive white vans with ladders on the roof.", "Thanks to electricians, every light works on move-in day.", "However, plumbers fix leaky pipes in the kitchens and bathrooms."], "a": 2, "why": "It wraps up the main idea (the electricians' important job) in new words. That is a <b>concluding sentence</b>.", "no": ["That repeats a detail from the paragraph. It does not wrap it up.", "That is off-topic: vans are not part of the job.", null, "That starts a new topic about plumbers."]}]}, {"type": "tap", "kick": "Word Power", "title": "Use your words", "text": "Type the word from memory.", "items": [{"type": "fill", "q": "23/6 names more than 3 wholes. Its top number is bigger than its bottom number, so 23/6 is an ________ fraction.", "answers": ["improper", "improper fraction"], "why": "It is an <b>improper</b> fraction.", "no": "It is the opposite of proper.", "hint": "It starts with i-m-p."}, {"type": "fill", "q": "1/6, 1/4 and 1/8 all have 1 as the numerator. Each one is a ________ fraction.", "answers": ["unit", "unit fraction"], "why": "Each one is a <b>unit</b> fraction.", "no": "Think of one single unit.", "hint": "It starts with u-n."}, {"type": "fill", "q": "To change 29/6 into 4 5/6 is to ________ it to a mixed number.", "answers": ["convert", "convert it", "converting"], "why": "To change a number to a different form with the same value is to <b>convert</b> it.", "no": "It means change the form, not the amount.", "hint": "It starts with c-o-n-v."}, {"type": "fill", "q": "The sentences in a paragraph that prove or explain the topic sentence are its supporting ________.", "answers": ["details", "detail", "sentences", "sentence"], "why": "They are supporting <b>details</b>.", "no": "They are the facts, examples and reasons that rest on the topic sentence.", "hint": "It starts with d-e-t."}]}, {"type": "recall", "kick": "Remember", "title": "Lessons 3, 4 and 6", "text": "Keep these skills sharp.", "items": [{"type": "fill", "q": "Lesson 3: <b>7/10 − 1/6 = ____</b> Type it in simplest form.", "answers": ["8/15"], "why": "Common denominator 30: 7/10 = 21/30 and 1/6 = 5/30. 21/30 − 5/30 = 16/30. Simplify with the GCF, 2: <b>8/15</b>.", "no": "Rename both with a common denominator, subtract only the numerators, then simplify.", "hint": "Use 30.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Lesson 4: <b>1.8 × 3.5 = ____</b>", "answers": ["6.3", "6.30"], "why": "Estimate: 2 × 3.5 = 7, a bit less. 18 × 35 = 630. 2 decimal places → 6.30 = <b>6.3</b>.", "no": "Multiply without the decimal points, then count the decimal places in BOTH factors.", "hint": "18 × 35 = 630.", "placeholder": "Example: 2.5"}, {"type": "fill", "q": "Lesson 6: the least common multiple (LCM) of <b>9 and 12</b> is ____.", "answers": ["36"], "why": "Skip-count by the bigger number: 12, 24, <b>36</b>. 24 is not a multiple of 9, but 36 is (9 × 4 = 36). The LCM is <b>36</b>.", "no": "Skip-count by 12 and stop at the first number 9 also goes into.", "hint": "It is between 30 and 40.", "placeholder": "Type a number"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "<b>5/8 = ____/48</b> Type the missing numerator.", "answers": ["30", "30/48"], "why": "8 × 6 = 48, so multiply the numerator by 6 too: 5 × 6 = 30. <b>5/8 = 30/48</b>.", "no": "What do you multiply 8 by to get 48? Multiply the numerator by that same number.", "hint": "8 × 6 = 48.", "placeholder": "Type a number"}, {"type": "fill", "q": "Simplify in one step with the GCF: <b>21/28 = ____</b>", "answers": ["3/4"], "why": "Factors of 21: 1, 3, 7, 21. Factors of 28: 1, 2, 4, 7, 14, 28. The GCF is <b>7</b>. 21 ÷ 7 = 3 and 28 ÷ 7 = 4. <b>3/4</b>", "no": "Find the greatest common factor of the numerator and the denominator. Divide BOTH by it. Then check: do the new numbers share any factor except 1?", "hint": "The GCF of 21 and 28 is 7.", "placeholder": "Example: 3/4"}, {"q": "To simplify <b>48/60</b> in ONE step, divide the numerator and the denominator by:", "choices": ["12", "6", "4", "24"], "a": 0, "why": "Factors of 48: 1, 2, 3, 4, 6, 8, 12, 16, 24, 48. Factors of 60: 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60. The GCF is <b>12</b>: 48/60 = 4/5.", "no": [null, "6 gives 8/10, which still simplifies. 6 is not the greatest.", "4 gives 12/15, which still simplifies.", "24 is a factor of 48, but not of 60 (60 ÷ 24 is not a whole number)."]}, {"type": "fill", "q": "Change it to a mixed number: <b>17/3 = ____</b>", "answers": ["5 2/3", "5-2/3", "5 and 2/3"], "why": "17 ÷ 3 = 5 R2. The quotient 5 is the whole number. The remainder 2 is the new numerator, and the denominator stays 3. <b>5 2/3</b>", "no": "Divide the numerator by the denominator. The quotient is the whole number, the remainder is the new numerator, and the denominator stays the same. Type a space between the whole number and the fraction.", "hint": "17 ÷ 3 = 5 R2.", "placeholder": "Example: 2 1/3"}, {"type": "fill", "q": "Change it to an improper fraction: <b>4 5/6 = ____/6</b> Type the numerator.", "answers": ["29", "29/6"], "why": "4 wholes = 4 × 6 = 24 sixths. Add the 5 more: 24 + 5 = 29. <b>4 5/6 = 29/6</b>.", "no": "Multiply the whole number by the denominator first (4 × 6), then add the numerator. The denominator stays 6.", "hint": "4 × 6 = 24.", "placeholder": "Type a number"}, {"type": "fill", "q": "A hallway floor is covered with <b>56 tiles</b>. <b>35</b> of them are blue, and every other tile is white. What fraction of the tiles are <b>white</b>? Type it in simplest form.", "answers": ["3/8"], "why": "Step 1: 56 − 35 = 21 white tiles, so 21/56. Step 2: the GCF of 21 and 56 is 7. 21 ÷ 7 = 3 and 56 ÷ 7 = 8. <b>3/8</b>", "no": "Two steps. First subtract to find how many are white. Then write that number over 56 and divide both by the GCF.", "hint": "56 − 35 = 21.", "placeholder": "Example: 3/4"}, {"q": "Which sentence is the <b>topic sentence</b>?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Practice paragraph</span><br><b>Rooftop Gardens</b><br>(1) Some new apartment buildings have gardens on their roofs. (2) First, workers cover the roof with a waterproof layer so water cannot leak into the apartments below. (3) Next, they spread a special soil that weighs much less than regular dirt. (4) My uncle's truck is painted bright red. (5) As a result of this careful work, people who live in the building can grow tomatoes and flowers high above the street."}, "choices": ["(2) First, workers cover the roof with a waterproof layer.", "(5) As a result of this careful work, people can grow tomatoes and flowers.", "(1) Some new apartment buildings have gardens on their roofs.", "(3) Next, they spread a special soil."], "a": 2, "why": "Every other sentence tells about rooftop gardens. <b>Sentence 1</b> tells that main idea.", "no": ["That is the first step, a supporting detail.", "That is the last sentence. It shows the result.", null, "That is a step, a supporting detail."]}, {"q": "What job does <b>Next</b> do in sentence 3?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Practice paragraph</span><br><b>Rooftop Gardens</b><br>(1) Some new apartment buildings have gardens on their roofs. (2) First, workers cover the roof with a waterproof layer so water cannot leak into the apartments below. (3) Next, they spread a special soil that weighs much less than regular dirt. (4) My uncle's truck is painted bright red. (5) As a result of this careful work, people who live in the building can grow tomatoes and flowers high above the street."}, "choices": ["It gives an example of the soil.", "It shows the order of the steps.", "It shows a contrast with step 1.", "It shows an effect of the first step."], "a": 1, "why": "First, then Next: the steps go in order. <b>Next shows order.</b>", "no": ["For example gives an example. Next tells what comes after the first step.", null, "A contrast would need a word like however. Nothing here is different or surprising.", "As a result shows an effect. Next just tells the next step."]}, {"q": "Which sentence is <b>off-topic</b>?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Practice paragraph</span><br><b>Rooftop Gardens</b><br>(1) Some new apartment buildings have gardens on their roofs. (2) First, workers cover the roof with a waterproof layer so water cannot leak into the apartments below. (3) Next, they spread a special soil that weighs much less than regular dirt. (4) My uncle's truck is painted bright red. (5) As a result of this careful work, people who live in the building can grow tomatoes and flowers high above the street."}, "choices": ["Sentence 1", "Sentence 3", "Sentence 5", "Sentence 4"], "a": 3, "why": "<b>Sentence 4</b> is about a truck, not about rooftop gardens.", "no": ["Sentence 1 is the topic sentence.", "Sentence 3 is a step in making the garden.", "Sentence 5 wraps up the paragraph.", null]}, {"type": "fill", "q": "9/2 is 9 halves, which is more than 1 whole. A fraction that is 1 whole or more is an ________ fraction.", "answers": ["improper", "improper fraction"], "why": "It is an <b>improper</b> fraction.", "no": "It is the opposite of proper.", "hint": "It starts with i-m-p."}], [{"type": "fill", "q": "<b>3/7 = ____/35</b> Type the missing numerator.", "answers": ["15", "15/35"], "why": "7 × 5 = 35, so multiply the numerator by 5 too: 3 × 5 = 15. <b>3/7 = 15/35</b>.", "no": "What do you multiply 7 by to get 35? Multiply the numerator by that same number.", "hint": "7 × 5 = 35.", "placeholder": "Type a number"}, {"type": "fill", "q": "Simplify in one step with the GCF: <b>18/45 = ____</b>", "answers": ["2/5"], "why": "Factors of 18: 1, 2, 3, 6, 9, 18. Factors of 45: 1, 3, 5, 9, 15, 45. The GCF is <b>9</b>. 18 ÷ 9 = 2 and 45 ÷ 9 = 5. <b>2/5</b>", "no": "Find the greatest common factor of the numerator and the denominator. Divide BOTH by it. Then check: do the new numbers share any factor except 1?", "hint": "The GCF of 18 and 45 is 9.", "placeholder": "Example: 3/4"}
