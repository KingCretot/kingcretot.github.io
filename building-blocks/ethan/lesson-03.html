<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan · Lesson 3: Sophia&#x27;s Garden Plot and Ravi&#x27;s Newsletter</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L03", "label": "Lesson 3", "title": "Sophia's Garden Plot and Ravi's Newsletter", "goal": "I can add and subtract fractions with unlike denominators, write my answer in simplest form, and tell why an author wrote a piece.", "date": "2026-11-04", "mastery": 85, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Sophia's Garden Plot: On Your Own", "text": "In class you learned to add and subtract fractions with unlike denominators, and to find an author's purpose. Now you do it on your own. Keep paper and a pencil next to you. Work every fraction problem on paper first.", "visual": {"kind": "emoji", "text": "🌱🍅🫑📰"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["What are the steps for adding 1/3 + 1/4? Why is the answer not 2/7?", "Why is 1/4 bigger than 1/6, even though 6 is bigger than 4?", "What is the difference between an author's <b>purpose</b> and a writer's <b>point of view</b>? Use the crosswalk letter."], "starters": ["First I find …, then I …", "1/4 is bigger because …", "Purpose means … Point of view means …"]}, {"type": "vocab", "kick": "Word Power", "title": "Review your words", "text": "Say the meaning out loud first. Then flip the card to check yourself.", "words": [{"word": "numerator", "pos": "noun", "meaning": "The top number in a fraction. It counts the pieces you have.", "example": "In 3/4, the <b>numerator</b> is 3.", "emoji": "⬆️"}, {"word": "denominator", "pos": "noun", "meaning": "The bottom number in a fraction. It tells how many equal pieces make 1 whole.", "example": "In 3/4, the <b>denominator</b> is 4.", "emoji": "⬇️"}, {"word": "unlike denominators", "pos": "noun", "meaning": "Fractions whose bottom numbers are different.", "example": "1/3 and 1/4 have <b>unlike denominators</b>: 3 and 4.", "emoji": "🔀"}, {"word": "common denominator", "pos": "noun", "meaning": "A denominator that two or more fractions can share.", "example": "12 is a <b>common denominator</b> for 1/3 and 1/4.", "emoji": "🤝"}, {"word": "equivalent fraction", "pos": "noun", "meaning": "A fraction that names the same amount, written with different numbers.", "example": "1/3 and 4/12 are <b>equivalent fractions</b>.", "emoji": "🟰"}, {"word": "estimate", "pos": "noun", "meaning": "A smart, quick guess made by rounding first.", "example": "1/3 and 1/4 are each less than 1/2, so my <b>estimate</b> is that 1/3 + 1/4 is less than 1.", "emoji": "🎯"}, {"word": "mixed number", "pos": "noun", "meaning": "A whole number and a fraction together.", "example": "1 1/4 is a <b>mixed number</b>: 1 whole and 1/4 more.", "emoji": "🥧"}, {"word": "author's purpose", "pos": "noun", "meaning": "The reason a writer chose to write a piece: usually to inform, persuade, or entertain.", "example": "The <b>author's purpose</b> of a weather report is to inform.", "emoji": "✍️"}, {"word": "inform", "pos": "verb", "meaning": "To give facts or explain something clearly.", "example": "A weather report <b>informs</b>: rain on Tuesday, sunny on Wednesday.", "emoji": "📰"}, {"word": "persuade", "pos": "verb", "meaning": "To convince someone to think or act a certain way.", "example": "A toy ad tries to <b>persuade</b> you to buy the toy.", "emoji": "📣"}, {"word": "entertain", "pos": "verb", "meaning": "To amuse or interest the reader, often through humor or story.", "example": "A knock-knock joke is there to <b>entertain</b> you.", "emoji": "😂"}, {"word": "point of view", "pos": "noun", "meaning": "The perspective a writer sees a topic from: what the writer believes matters most.", "example": "A writer who wants a longer recess has the <b>point of view</b> that kids need time to play.", "emoji": "👀"}, {"word": "evidence", "pos": "noun", "meaning": "Specific facts or details that support a point.", "example": "“Recess is only 15 minutes long” is <b>evidence</b> for a longer recess.", "emoji": "🔎"}]}, {"type": "learn", "kick": "Remember", "title": "Common denominator, rename, add, simplify", "text": "<b>1/6 + 3/4</b>", "visual": {"kind": "bigtext", "text": "1/6 + 3/4 = 11/12", "sub": "2/12 + 9/12"}, "steps": [{"text": "<b>1. Common denominator.</b> Multiples of 6: 6, 12. Multiples of 4: 4, 8, 12. Use <b>12</b>."}, {"text": "<b>2. Rename.</b> 1/6 = 2/12 and 3/4 = 9/12. Multiply the numerator AND the denominator by the same number."}, {"text": "<b>3. Add the numerators.</b> 2/12 + 9/12 = <b>11/12</b>. Keep the denominator."}, {"text": "<b>4. Simplify.</b> 11 and 12 can't both be divided by the same number, and 11/12 is less than 1 whole, so <b>11/12</b> is done."}, {"text": "<b>Then check with an estimate.</b> 3/4 by itself is more than 1/2, so the answer must be more than 1/2. 11/12 is. ✅"}], "tip": "Simplest form every time. If the numerator is bigger than the denominator, write a mixed number."}, {"type": "tap", "kick": "Try it", "title": "Rename and add", "text": "Paper first. Then type.", "items": [{"type": "fill", "q": "Rename it as an equivalent fraction. <b>5/6 = ____/12</b> Type the numerator.", "answers": ["10", "10/12"], "why": "6 × 2 = 12, so multiply the numerator by 2 too: 5 × 2 = 10. <b>5/6 = 10/12</b>.", "no": "What do you multiply 6 by to get 12? Multiply the numerator by the same number.", "hint": "6 × 2 = 12. Now do 5 × 2.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>1/3 + 2/5 = ____</b> Type it in simplest form.", "answers": ["11/15"], "why": "Multiples of 3: 3, 6, 9, 12, 15. Multiples of 5: 5, 10, 15. The common denominator is <b>15</b>. 1/3 = 5/15 and 2/5 = 6/15. 5/15 + 6/15 = 11/15. <b>11/15</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>3/8 + 1/2 = ____</b> Type it in simplest form.", "answers": ["7/8"], "why": "8 is a multiple of 2, so the common denominator is <b>8</b>. 1/2 = 4/8. 3/8 + 4/8 = 7/8. <b>7/8</b>", "no": "Did you add the bottom numbers too? Never do that. Only one fraction needs renaming: 8 is a multiple of 2, so 3/8 stays as it is and you rename 1/2. Then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}]}, {"type": "tap", "kick": "Try it", "title": "Simplest form and mixed numbers", "text": "Ask yourself: can I simplify? Is it more than 1 whole?", "items": [{"type": "fill", "q": "Simplify: <b>10/15 = ____</b> Type it in simplest form.", "answers": ["2/3"], "why": "Both 10 and 15 can be divided by 5: 10 ÷ 5 = 2 and 15 ÷ 5 = 3. <b>10/15 = 2/3</b>.", "no": "What number divides both 10 and 15?", "hint": "Divide the numerator and the denominator by 5.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>1/10 + 2/5 = ____</b> Type it in simplest form.", "answers": ["1/2"], "why": "10 is a multiple of 5, so the common denominator is <b>10</b>. 2/5 = 4/10. 1/10 + 4/10 = 5/10. Simplify: divide the numerator and the denominator by 5. 5/10 = 1/2. <b>1/2</b>", "no": "Did you add the bottom numbers too? Never do that. Only one fraction needs renaming: 10 is a multiple of 5, so 1/10 stays as it is and you rename 2/5. Then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>5/6 + 1/2 = ____</b> Type it as a mixed number in simplest form, like 1 1/2.", "answers": ["1 1/3", "1-1/3", "1 and 1/3"], "why": "6 is a multiple of 2, so the common denominator is <b>6</b>. 1/2 = 3/6. 5/6 + 3/6 = 8/6. 8/6 is more than 1 whole (6/6 = 1): 8/6 = 1 2/6 = 1 1/3 (divide the 2 and the 6 by 2). <b>1 1/3</b>", "no": "Did you add the bottom numbers too? Never do that. Only one fraction needs renaming: 6 is a multiple of 2, so 5/6 stays as it is and you rename 1/2. Then add only the numerators and keep the denominator. Simplify, and because the answer is more than 1 whole, type it as a mixed number (whole number, space, fraction), not as a fraction whose top number is bigger than its bottom number.", "placeholder": "Example: 1 1/2"}]}, {"type": "tap", "kick": "Try it", "title": "Subtract, what's left, and compare", "text": "Paper first. Then type.", "items": [{"type": "fill", "q": "<b>3/4 − 1/3 = ____</b> Type it in simplest form.", "answers": ["5/12"], "why": "Multiples of 4: 4, 8, 12. Multiples of 3: 3, 6, 9, 12. The common denominator is <b>12</b>. 3/4 = 9/12 and 1/3 = 4/12. 9/12 − 4/12 = 5/12. <b>5/12</b>", "no": "Did you subtract the bottom numbers too? Never do that. Rename both fractions with a common denominator, then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "A garden plot is 1 whole. Beans use <b>2/5</b> of it. What fraction of the plot is left? <b>1 − 2/5 = ____</b> Type it in simplest form.", "answers": ["3/5"], "why": "One whole is 5/5. 5/5 − 2/5 = 3/5. <b>3/5</b>", "no": "Write 1 whole as 5/5 first, then subtract only the numerators and keep the 5. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Which is bigger, <b>3/8</b> or <b>1/3</b>? Type the bigger fraction.", "answers": ["3/8"], "why": "Common denominator 24: 3/8 = 9/24 and 1/3 = 8/24. 9/24 is more than 8/24, so <b>3/8</b> is bigger.", "no": "Rename both with a common denominator. Then compare the numerators.", "hint": "Multiples of 8: 8, 16, 24. Multiples of 3: 3, 6, … 24. Use 24.", "placeholder": "Example: 3/4"}]}, {"type": "tap", "kick": "Read", "title": "More of Ravi's newsletter", "text": "Read both pieces. Then answer.", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">More from Ravi's newsletter</span><br><b>Library News</b><br>“The Maple Street library will close early, at 3pm, this Friday so the staff can paint the reading room. It will open at the usual time, 10am, on Saturday. Books due on Friday can go in the drop box by the front door.”<br><br><span style=\"font-size:15px;color:#5b6578\">More from Ravi's newsletter</span><br><b>Riddle Corner</b><br>“What has keys but can't open a single door? A piano! What has hands but can't clap? A clock!”"}, "items": [{"type": "fill", "q": "What time will the library close this Friday? Type the time.", "answers": ["3pm", "3 pm", "3", "3:00", "3:00 pm", "3 o'clock", "at 3pm", "at 3", "three", "three pm", "three o'clock", "3 in the afternoon"], "why": "Library News says the library “will close early, at <b>3pm</b>, this Friday.”", "no": "Look at the first sentence of Library News.", "hint": "It is in the afternoon."}, {"q": "What is the author's purpose of Library News?", "choices": ["To persuade readers to paint the reading room", "To entertain with a joke", "To inform readers about the library's hours", "To sell books"], "a": 2, "why": "It gives facts: the library closes at 3pm Friday and opens at 10am Saturday. That <b>informs</b>.", "no": ["The staff is painting. Readers are not asked to do anything.", "There is no joke in Library News. The riddles are a different piece.", null, "Nothing in it sells anything."]}, {"type": "fill", "q": "What is the author's purpose of Riddle Corner? Type one word.", "answers": ["entertain", "to entertain", "entertains", "entertaining"], "why": "Riddles are there for fun, so the purpose is to <b>entertain</b>.", "no": "Do riddles give facts, try to convince you, or make you smile?", "hint": "It starts with e-n-t."}]}, {"type": "tap", "kick": "Read", "title": "Two purposes at once", "text": "Read the Dog Wash piece. Then answer.", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">More from Ravi's newsletter</span><br><b>School News: Dog Wash</b><br>“The fifth graders at Maple Street Elementary will wash dogs this Saturday from 10am to 1pm at the fire station. Each wash costs $5, and every dollar buys new books for the school library. Bring your muddy pup! Your dog gets clean, and our school gets books. Everybody wins!”"}, "items": [{"q": "What is the MAIN purpose of the Dog Wash piece?", "choices": ["To persuade readers to bring their dogs to the dog wash", "To entertain with a funny story about a dog", "To inform readers about how to wash a dog at home", "To warn readers about muddy dogs"], "a": 0, "why": "“Bring your muddy pup!” and “Everybody wins!” try to get readers to come. It informs too, but its main job is to <b>persuade</b>.", "no": [null, "There is no funny story. It asks readers to come.", "It never explains how to wash a dog.", "It does not warn anyone. It invites readers."]}, {"type": "fill", "q": "How much does each dog wash cost? Type the amount.", "answers": ["$5", "5", "5 dollars", "five dollars", "five", "$5 each", "5 dollars each", "five dollars each", "$5 a wash"], "why": "The piece says: “Each wash costs <b>$5</b>.”", "no": "Look for the dollar sign.", "hint": "It is less than $10."}, {"q": "Which detail mostly <b>informs</b> (gives a plain fact)?", "choices": ["“Bring your muddy pup!”", "“Everybody wins!”", "“this Saturday from 10am to 1pm at the fire station”", "“Your dog gets clean, and our school gets books.”"], "a": 2, "why": "The day, the time and the place are plain facts. They <b>inform</b>.", "no": ["That tells readers what to do. It persuades.", "That is a cheer to get readers excited. It persuades.", null, "That tells readers why they should come. It persuades."]}]}, {"type": "tap", "kick": "Word Power", "title": "Use your words", "text": "Type the word from memory.", "items": [{"type": "fill", "q": "1/3 and 1/4 can both be renamed as twelfths, so 12 is a ________ for them.", "answers": ["common denominator", "the common denominator", "a common denominator", "common denominators"], "why": "A denominator that both fractions can share is a <b>common denominator</b>.", "no": "It is two words. The second word is denominator.", "hint": "It starts with c-o-m."}, {"type": "fill", "q": "A smart, quick guess you make by rounding first, like “a little more than 1/2,” is called an ________.", "answers": ["estimate", "the estimate", "an estimate", "estimation"], "why": "A smart, quick guess made by rounding is an <b>estimate</b>.", "no": "You check your answer with one of these.", "hint": "It starts with e-s-t."}, {"type": "fill", "q": "2/3 and 8/12 name the same amount. They are ________ fractions.", "answers": ["equivalent", "equivalent fractions"], "why": "Fractions that name the same amount are <b>equivalent</b> fractions.", "no": "It means equal in value.", "hint": "It starts with e-q-u."}, {"type": "fill", "q": "What a writer believes matters most is the writer's ________.", "answers": ["point of view", "pointofview", "point-of-view"], "why": "That is the writer's <b>point of view</b>.", "no": "It is three words.", "hint": "It starts with p-o-i-n-t."}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Rename it as an equivalent fraction. <b>3/5 = ____/20</b> Type the numerator.", "answers": ["12", "12/20"], "why": "5 × 4 = 20, so multiply the numerator by 4 too: 3 × 4 = 12. <b>3/5 = 12/20</b>.", "no": "What do you multiply 5 by to get 20? Multiply the numerator by the same number.", "hint": "5 × 4 = 20. Now do 3 × 4.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>1/4 + 2/7 = ____</b> Type it in simplest form.", "answers": ["15/28"], "why": "Multiples of 4: 4, 8, 12, 16, 20, 24, 28. Multiples of 7: 7, 14, 21, 28. The common denominator is <b>28</b>. 1/4 = 7/28 and 2/7 = 8/28. 7/28 + 8/28 = 15/28. <b>15/28</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>1/12 + 2/3 = ____</b> Type it in simplest form.", "answers": ["3/4"], "why": "12 is a multiple of 3, so the common denominator is <b>12</b>. 2/3 = 8/12. 1/12 + 8/12 = 9/12. Simplify: divide the numerator and the denominator by 3. 9/12 = 3/4. <b>3/4</b>", "no": "Did you add the bottom numbers too? Never do that. Only one fraction needs renaming: 12 is a multiple of 3, so 1/12 stays as it is and you rename 2/3. Then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Sophia had <b>3/4</b> of a bag of soil. She used <b>1/6</b> of a bag. How much of a bag is left? <b>3/4 − 1/6 = ____</b> Type it in simplest form.", "answers": ["7/12"], "why": "Multiples of 4: 4, 8, 12. Multiples of 6: 6, 12. The common denominator is <b>12</b>. 3/4 = 9/12 and 1/6 = 2/12. 9/12 − 2/12 = 7/12. <b>7/12</b>", "no": "Did you subtract the bottom numbers too? Never do that. Rename both fractions with a common denominator, then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"q": "Which fraction is bigger: <b>5/8</b> or <b>3/5</b>?", "choices": ["5/8", "3/5", "They are equal", "You can't compare them"], "a": 0, "why": "Common denominator 40: 5/8 = 25/40 and 3/5 = 24/40. 25/40 is more than 24/40, so <b>5/8</b> is bigger.", "no": [null, "Rename both with the common denominator 40: 3/5 = 24/40 and 5/8 = 25/40. 24/40 is less, so 3/5 is the smaller one.", "They look alike, but renamed with a common denominator the numerators are different.", "You can: rename both with a common denominator, then compare the numerators."]}, {"type": "fill", "q": "The top number in a fraction, like the 5 in 5/8, is the ________.", "answers": ["numerator", "the numerator", "a numerator"], "why": "The top number is the <b>numerator</b>.", "no": "It counts the pieces you have.", "hint": "It starts with n-u-m."}, {"q": "What is the author's purpose of the fountain letter?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">More from Ravi's newsletter</span><br><b>Reader's Letter: Fix the Fountain</b><br>“The water fountain at Maple Street Park has been broken since June. On hot days, the kids at the playground have nothing to drink. Last Saturday afternoon, I counted 30 kids on the playground! Please come to the neighborhood meeting on Monday night and vote to fix the fountain.”"}, "choices": ["To inform readers about the park's hours", "To persuade readers to vote to fix the fountain", "To entertain with a funny story", "To sell water bottles"], "a": 1, "why": "The writer asks readers to “come to the neighborhood meeting on Monday night and vote to fix the fountain.” That is <b>persuading</b>.", "no": ["The letter never gives the park's hours.", null, "There is no funny story. The writer wants readers to act.", "Nothing in the letter sells anything."]}, {"q": "Which detail is the writer's strongest <b>evidence</b> that kids need the fountain?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">More from Ravi's newsletter</span><br><b>Reader's Letter: Fix the Fountain</b><br>“The water fountain at Maple Street Park has been broken since June. On hot days, the kids at the playground have nothing to drink. Last Saturday afternoon, I counted 30 kids on the playground! Please come to the neighborhood meeting on Monday night and vote to fix the fountain.”"}, "choices": ["“Please come to the neighborhood meeting on Monday night”", "“vote to fix the fountain”", "“Last Saturday afternoon, I counted 30 kids on the playground!”", "“The water fountain at Maple Street Park”"], "a": 2, "why": "It is a specific fact the writer checked: 30 kids were there. That is strong <b>evidence</b>.", "no": ["That is what the writer asks readers to DO, not evidence.", "That is the writer's request, not evidence.", null, "That just names the fountain. It does not support the point."]}, {"type": "fill", "q": "The cleanup leaders will supply two things. What is one of them? Type it.", "visual": {"kind": "passage", "text": "<b>Newsletter Notice: The Park Cleanup</b><br>“Join us Saturday at 9am for the annual Maple Street Park cleanup! Bring gloves if you have them — we'll supply trash bags and water. Last year, volunteers collected over 200 pounds of litter in just two hours.”"}, "answers": ["trash bags", "trash bag", "a trash bag", "bags", "garbage bags", "water", "some water", "trash bags and water", "water and trash bags", "trash bags, water", "water, trash bags", "trash bags & water", "water & trash bags"], "why": "The notice says: “we'll supply <b>trash bags and water</b>.”", "no": "Look for the word supply.", "hint": "Gloves are what YOU bring. What will THEY bring?"}, {"type": "fill", "q": "To amuse or interest the reader, often with humor or a story, is to ________.", "answers": ["entertain", "to entertain"], "why": "That is to <b>entertain</b>.", "no": "Jokes and riddles do this.", "hint": "It starts with e-n-t."}], [{"type": "fill", "q": "Rename it as an equivalent fraction. <b>2/7 = ____/21</b> Type the numerator.", "answers": ["6", "6/21"], "why": "7 × 3 = 21, so multiply the numerator by 3 too: 2 × 3 = 6. <b>2/7 = 6/21</b>.", "no": "What do you multiply 7 by to get 21? Multiply the numerator by the same number.", "hint": "7 × 3 = 21. Now do 2 × 3.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>2/5 + 1/6 = ____</b> Type it in simplest form.", "answers": ["17/30"], "why": "Multiples of 5: 5, 10, 15, 20, 25, 30. Multiples of 6: 6, 12, 18, 24, 30. The common denominator is <b>30</b>. 2/5 = 12/30 and 1/6 = 5/30. 12/30 + 5/30 = 17/30. <b>17/30</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>3/10 + 1/6 = ____</b> Type it in simplest form.", "answers": ["7/15"], "why": "Multiples of 10: 10, 20, 30. Multiples of 6: 6, 12, 18, 24, 30. The common denominator is <b>30</b>. 3/10 = 9/30 and 1/6 = 5/30. 9/30 + 5/30 = 14/30. Simplify: divide the numerator and the denominator by 2. 14/30 = 7/15. <b>7/15</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Sophia's water jug was <b>7/8</b> full. She poured out <b>1/3</b> of a jug on the peppers. How much of a jug is left? <b>7/8 − 1/3 = ____</b> Type it in simplest form.", "answers": ["13/24"], "why": "Multiples of 8: 8, 16, 24. Multiples of 3: 3, 6, 9, 12, 15, 18, 21, 24. The common denominator is <b>24</b>. 7/8 = 21/24 and 1/3 = 8/24. 21/24 − 8/24 = 13/24. <b>13/24</b>", "no": "Did you subtract the bottom numbers too? Never do that. Rename both fractions with a common denominator, then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"q": "Which fraction is bigger: <b>4/7</b> or <b>5/9</b>?", "choices": ["5/9", "4/7", "They are equal", "You can't compare them"], "a": 1, "why": "Common denominator 63: 4/7 = 36/63 and 5/9 = 35/63. 36/63 is more than 35/63, so <b>4/7</b> is bigger.", "no": ["Rename both with the common denominator 63: 5/9 = 35/63 and 4/7 = 36/63. 35/63 is less, so 5/9 is the smaller one.", null, "They look alike, but renamed with a common denominator the numerators are different.", "You can: rename both with a common denominator, then compare the numerators."]}, {"type": "fill", "q": "The bottom number in a fraction, like the 9 in 4/9, is the ________.", "answers": ["denominator", "the denominator", "a denominator"], "why": "The bottom number is the <b>denominator</b>.", "no": "It tells how many equal pieces make 1 whole.", "hint": "It starts with d-e-n-o-m."}, {"q": "What is the MAIN purpose of the bakery spotlight?", "visual": {"kind": "passage", "text": "<b>Business Spotlight</b><br>“New this month: Ravi's family bakery is now open Saturdays 8am-2pm at 214 Maple Street. Try their cinnamon rolls, voted a neighborhood favorite three years running.”"}, "choices": ["To persuade readers to visit the bakery", "To inform readers about the park cleanup", "To entertain with a joke", "To warn readers about the bakery"], "a": 0, "why": "It gives the hours, but “Try their cinnamon rolls, voted a neighborhood favorite” shows its main job: to get readers to visit. That is <b>persuading</b>.", "no": [null, "The park cleanup is a different piece.", "There is no joke in the spotlight.", "It praises the bakery. It does not warn anyone."]}, {"q": "What do the fifth graders want readers to DO?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">More from Ravi's newsletter</span><br><b>School News: Dog Wash</b><br>“The fifth graders at Maple Street Elementary will wash dogs this Saturday from 10am to 1pm at the fire station. Each wash costs $5, and every dollar buys new books for the school library. Bring your muddy pup! Your dog gets clean, and our school gets books. Everybody wins!”"}, "choices": ["Wash their own dogs at home", "Buy books at the library", "Bring their dogs to the dog wash on Saturday", "Paint the fire station"], "a": 2, "why": "They write “Bring your muddy pup!” They want readers to come to the dog wash.", "no": ["The piece invites readers to the fifth graders' dog wash.", "The money buys books for the school library. Readers are not asked to buy books.", null, "The fire station is just where the dog wash is."]}, {"type": "fill", "q": "The crosswalk letter says the crosswalk is needed near the elementary ________. Type the word.", "visual": {"kind": "passage", "text": "<b>Reader's Letter</b><br>“Our neighborhood REALLY needs a crosswalk near the elementary school. I've watched kids dash across that street every single morning, and cars don't always slow down. Please, everyone — sign the petition at the library and let's get this crosswalk built before someone gets hurt.”"}, "answers": ["school", "elementary school", "the elementary school", "the school", "a school"], "why": "The letter says: “a crosswalk near the elementary <b>school</b>.”", "no": "Look at the first sentence.", "hint": "Kids go there to learn."}, {"type": "fill", "q": "To give facts or explain something clearly is to ________.", "answers": ["inform", "to inform"], "why": "That is to <b>inform</b>.", "no": "News articles do this.", "hint": "It starts with i-n-f."}], [{"type": "fill", "q": "Rename it as an equivalent fraction. <b>4/9 = ____/27</b> Type the numerator.", "answers": ["12", "12/27"], "why": "9 × 3 = 27, so multiply the numerator by 3 too: 4 × 3 = 12. <b>4/9 = 12/27</b>.", "no": "What do you multiply 9 by to get 27? Multiply the numerator by the same number.", "hint": "9 × 3 = 27. Now do 4 × 3.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>3/8 + 1/3 = ____</b> Type it in simplest form.", "answers": ["17/24"], "why": "Multiples of 8: 8, 16, 24. Multiples of 3: 3, 6, 9, 12, 15, 18, 21, 24. The common denominator is <b>24</b>. 3/8 = 9/24 and 1/3 = 8/24. 9/24 + 8/24 = 17/24. <b>17/24</b>", "no": "Did you add the bottom numbers too? Never do that. Rename both fractions with a common denominator, then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "<b>5/12 + 1/4 = ____</b> Type it in simplest form.", "answers": ["2/3"], "why": "12 is a multiple of 4, so the common denominator is <b>12</b>. 1/4 = 3/12. 5/12 + 3/12 = 8/12. Simplify: divide the numerator and the denominator by 4. 8/12 = 2/3. <b>2/3</b>", "no": "Did you add the bottom numbers too? Never do that. Only one fraction needs renaming: 12 is a multiple of 4, so 5/12 stays as it is and you rename 1/4. Then add only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Sophia had <b>9/10</b> of a bag of seeds. She planted <b>2/5</b> of a bag. How much of a bag is left? <b>9/10 − 2/5 = ____</b> Type it in simplest form.", "answers": ["1/2"], "why": "10 is a multiple of 5, so the common denominator is <b>10</b>. 2/5 = 4/10. 9/10 − 4/10 = 5/10. Simplify: divide the numerator and the denominator by 5. 5/10 = 1/2. <b>1/2</b>", "no": "Did you subtract the bottom numbers too? Never do that. Only one fraction needs renaming: 10 is a multiple of 5, so 9/10 stays as it is and you rename 2/5. Then subtract only the numerators and keep the denominator. Last, simplify: if the numerator and the denominator can both be divided by the same number, divide them.", "placeholder": "Example: 3/4"}, {"q": "Which fraction is bigger: <b>3/7</b> or <b>2/5</b>?", "choices": ["2/5", "They are equal", "3/7", "You can't compare them"], "a": 2, "why": "Common denominator 35: 3/7 = 15/35 and 2/5 = 14/35. 15/35 is more than 14/35, so <b>3/7</b> is bigger.", "no": ["Rename both with the common denominator 35: 2/5 = 14/35 and 3/7 = 15/35. 14/35 is less, so 2/5 is the smaller one.", "They look alike, but renamed with a common denominator the numerators are different.", null, "You can: rename both with a common denominator, then compare the numerators."]}, {"type": "fill", "q": "Fractions that name the same amount, like 1/2 and 4/8, are ________ fractions.", "answers": ["equivalent", "equivalent fractions"], "why": "They are <b>equivalent</b> fractions.", "no": "It means equal in value.", "hint": "It starts with e-q-u."}, {"q": "Why did the writer write Library News?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">More from Ravi's newsletter</span><br><b>Library News</b><br>“The Maple Street library will close early, at 3pm, this Friday so the staff can paint the reading room. It will open at the usual time, 10am, on Saturday. Books due on Friday can go in the drop box by the front door.”"}, "choices": ["To inform readers that the library closes early Friday and when it opens Saturday", "To persuade readers to read more books", "To entertain readers with a riddle", "To get readers to paint the reading room"], "a": 0, "why": "It gives facts: closing at 3pm Friday, opening at 10am Saturday, and where to return books. That <b>informs</b>.", "no": [null, "It never asks readers to read more.", "The riddles are a different piece.", "The staff paints the room. Readers are not asked to."]}, {"q": "What is the crosswalk writer's <b>point of view</b>?", "visual": {"kind": "passage", "text": "<b>Reader's Letter</b><br>“Our neighborhood REALLY needs a crosswalk near the elementary school. I've watched kids dash across that street every single morning, and cars don't always slow down. Please, everyone — sign the petition at the library and let's get this crosswalk built before someone gets hurt.”"}, "choices": ["Cars should drive faster", "The park needs a cleanup", "The library needs more books", "Kids' safety crossing the street should come first"], "a": 3, "why": "The writer worries about kids dashing across while cars don't always slow down, and wants the crosswalk built “before someone gets hurt.”", "no": ["The writer is worried that cars don't slow down.", "That is the park cleanup notice, not this letter.", "The library is only where the petition is.", null]}, {"type": "fill", "q": "On what day of the week is Ravi's family bakery now open? Type the day.", "visual": {"kind": "passage", "text": "<b>Business Spotlight</b><br>“New this month: Ravi's family bakery is now open Saturdays 8am-2pm at 214 Maple Street. Try their cinnamon rolls, voted a neighborhood favorite three years running.”"}, "answers": ["Saturday", "Saturdays", "on Saturdays", "on Saturday", "Sat", "Saturdays 8am-2pm"], "why": "The spotlight says it is “now open <b>Saturdays</b> 8am-2pm.”", "no": "Look at the first sentence.", "hint": "It is a weekend day."}, {"type": "fill", "q": "Facts or details that back up a point, like “I counted 30 kids,” are called ________.", "answers": ["evidence"], "why": "They are <b>evidence</b>.", "no": "You use it to support a point.", "hint": "It starts with e-v-i."}]]}], "win": "You made unlike fractions work together and figured out why every newsletter piece was written. Sophia's garden plot is planned!", "prev": "bb-ethan-L02", "prevTitle": "Lesson 2"});</script></body></html>
