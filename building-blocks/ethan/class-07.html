<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ethan · Lesson 7: The Houston Apartment Build and Building Up Houston</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L07", "label": "Lesson 7", "title": "The Houston Apartment Build and Building Up Houston", "goal": "I can find equivalent fractions, simplify a fraction in one step with the GCF, convert between improper fractions and mixed numbers, and build an informative paragraph with a topic sentence, details, transitions and a concluding sentence.", "date": "2026-12-16", "mastery": 85, "color": "#D35400", "slides": [{"type": "hello", "title": "The Houston Apartment Build and Building Up Houston", "text": "Amara is helping her aunt's crew build a six-story apartment building in Houston, Texas. Tile patterns, floor plans, pipes and steel bars: every job is a <b>fraction</b> job. Today you learn to rename fractions, <b>simplify</b> them in one step, and <b>convert</b> between improper fractions and mixed numbers. Then you learn how a strong <b>informative paragraph</b> is built, one floor at a time.", "visual": {"kind": "emoji", "text": "🏗️🧱📐📝"}, "notes": {"do": "Before class: check his Lesson 6 Show What You Know score and his Pathways Week 11 Math and Reading scores (Formspree). Set out grid paper, a blue colored pencil, three highlighters, 10 index cards, the whiteboard and a marker. Math runs 9:30–10:05 (35 min); reading runs 10:05–10:30 (25 min).", "say": "Two jobs today. First 35 minutes: fractions at the apartment build. Last 25 minutes: how writers build a paragraph. This is our last lesson of the year, so we finish by opening your Winter Games.", "ask": "What do you think a construction crew measures in parts of a foot?", "listen": "Pipes, tiles, boards, steel bars, windows. Any real example is fine."}}, {"type": "talk", "kick": "Math Talk", "title": "Three hallways", "text": "Diego tiles three hallways. All three have the same length and width. Hallway A: <b>3 of 8</b> big tiles are blue. Hallway B: <b>6 of 16</b> medium tiles are blue. Hallway C: <b>9 of 24</b> small tiles are blue.", "visual": {"kind": "bigtext", "text": "3/8 · 6/16 · 9/24", "sub": "which hallway has the most blue floor?"}, "prompts": ["Hallway C has the most blue tiles. Does it have the most blue FLOOR? Why or why not?", "How are 3 and 8 connected to 6 and 16? To 9 and 24?", "If a fourth hallway had 32 tiles, how many would be blue to match?"], "starters": ["I think … because the tiles are …", "To get from 3/8 to 6/16, you …", "It would need … blue tiles, because …"], "notes": {"do": "2 to 3 minutes. Let him argue it out before slide 5 shows the picture. Write his three fractions on the whiteboard.", "ask": "If you cut every tile in Hallway A in half, how many tiles would there be? How many blue?", "listen": "16 tiles and 6 blue: that is Hallway B. More tiles does not mean more floor; the tiles are smaller. For 32 tiles: 12 blue (3/8 × 4/4)."}}, {"type": "tap", "kick": "Warm-up", "title": "Lessons 3, 4 and 6, then today", "text": "Paper first, then type.", "items": [{"type": "fill", "q": "Lesson 6 skill: the greatest common factor (GCF) of <b>24 and 36</b> is ____.", "answers": ["12"], "why": "Factors of 24: 1, 2, 3, 4, 6, 8, 12, 24. Factors of 36: 1, 2, 3, 4, 6, 9, 12, 18, 36. The greatest one in both lists is <b>12</b>.", "no": "List the factors of each number in pairs. Find the biggest number in BOTH lists.", "hint": "24 = 2 × 12.", "placeholder": "Type a number"}, {"type": "fill", "q": "Lesson 4 skill: <b>2.4 × 3.5 = ____</b>", "answers": ["8.4", "8.40"], "why": "Estimate: 2 × 4 = 8. 24 × 35 = 840. 2 decimal places → 8.40 = <b>8.4</b>.", "no": "Multiply without the decimal points, then count the decimal places in BOTH factors.", "hint": "24 × 35 = 840.", "placeholder": "Example: 2.5"}, {"type": "fill", "q": "Lesson 3 skill: <b>1/6 + 5/12 = ____</b> Type it in simplest form.", "answers": ["7/12"], "why": "12 is a multiple of 6, so the common denominator is <b>12</b>. 1/6 = 2/12. 2/12 + 5/12 = <b>7/12</b>.", "no": "Rename 1/6 in twelfths, then add only the numerators.", "hint": "1/6 = 2/12.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "New today: <b>6/6</b>, <b>9/9</b> and <b>25/25</b> are all equal to ____.", "answers": ["1", "one", "1 whole", "one whole"], "why": "Any number (except 0) over itself is <b>1</b> whole: 6 sixths, 9 ninths, 25 twenty-fifths.", "no": "6 slices of a pizza cut into 6 slices is how much pizza?", "hint": "It is a whole number.", "placeholder": "Type a number"}], "notes": {"do": "He answers out loud, writes on paper, then types. If the Lesson 6 score was under 85, spend 2 extra minutes listing factor pairs for 24 and 36 on the whiteboard; today needs the GCF.", "say": "Today the GCF from Lesson 6 becomes a power tool. And remember: any number over itself is 1.", "ask": "Why is 25/25 the same as 1?", "listen": "25 parts out of 25 is all of it, one whole. That idea is why equivalent fractions work."}}, {"type": "vocab", "kick": "Word Power", "title": "Math words for today", "text": "Tap each card to flip it. Read the word, the meaning and the example out loud.", "words": [{"word": "improper fraction", "pos": "noun", "meaning": "A fraction whose numerator is equal to or bigger than its denominator. It is 1 whole or more.", "example": "19/4 is an <b>improper fraction</b>: 19 fourths is more than 1 whole foot.", "emoji": "🔝"}, {"word": "simplify", "pos": "verb", "meaning": "To rename a fraction with smaller numbers by dividing the numerator and the denominator by the same number.", "example": "<b>Simplify</b> 30/42: divide both by 6 to get 5/7.", "emoji": "✂️"}, {"word": "convert", "pos": "verb", "meaning": "To change a number into a different form that has the same value.", "example": "<b>Convert</b> 19/4 to a mixed number: 4 3/4.", "emoji": "🔄"}, {"word": "unit fraction", "pos": "noun", "meaning": "A fraction with 1 as its numerator.", "example": "Each short pipe is 1/6 foot long. 1/6 is a <b>unit fraction</b>.", "emoji": "📏"}], "notes": {"do": "He reads each card aloud, then covers it and says the meaning in his own words. He writes each word on the front of an index card.", "say": "Pathways Week 12 asks for improper fraction by name. Simplify and convert are the two jobs we do all day.", "ask": "What is the difference between an improper fraction and a mixed number?", "listen": "19/4 is improper (top bigger than bottom); 4 3/4 is a mixed number (a whole number with a fraction beside it). Same amount, two ways to write it."}}, {"type": "learn", "kick": "Hands-on", "title": "Smaller tiles, same blue floor", "text": "The blue tiles in all three hallways stop at the same dashed line.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 480 180\" width=\"100%\" style=\"max-width:480px;display:block;margin:auto\" font-family=\"Fredoka,Arial,sans-serif\"><text x 1F3D\" stroke-width=\"1.5\"/><rect x=\"245.00\" y=\"56\" width=\"25.00\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"270.00\" y=\"56\" width=\"25.00\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"295.00\" y=\"56\" width=\"25.00\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"320.00\" y=\"56\" width=\"25.00\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"345.00\" y=\"56\" width=\"25.00\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"370.00\" y=\"56\" width=\"25.00\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"395.00\" y=\"56\" width=\"25.00\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"420.00\" y=\"56\" width=\"25.00\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"445.00\" y=\"56\" width=\"25.00\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><text x=\"8\" y=\"129\" font-size=\"20\" fill=\"#0A1F3D\">C</text><text x=\"62\" y=\"129\" text-anchor=\"end\" font-size=\"19\" fill=\"#0A1F3D\">9/24</text><rect x=\"70.00\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"86.67\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"103.33\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"120.00\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"136.67\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"153.33\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"170.00\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"186.67\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"203.33\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#2E86DE\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"220.00\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"236.67\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"253.33\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"270.00\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"286.67\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"303.33\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"320.00\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"336.67\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"353.33\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"370.00\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"386.67\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"403.33\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"420.00\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"436.67\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"453.33\" y=\"106\" width=\"16.67\" height=\"34\" fill=\"#FFFFFF\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"220.0\" y1=\"0\" x2=\"220.0\" y2=\"150\" stroke=\"#C9A84C\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><text x=\"240\" y=\"174\" text-anchor=\"middle\" font-size=\"19\" fill=\"#5b6578\">Same hallway, smaller tiles: 3/8 = 6/16 = 9/24</text></svg>"}, "steps": [{"text": "<b>Equal blue floor.</b> 3/8, 6/16 and 9/24 cover the same part of the hallway, so they are <b>equivalent</b>."}, {"text": "<b>A → B: every tile is cut in 2.</b> Twice as many tiles (8 → 16) and twice as many blue (3 → 6). <b>3/8 × 2/2 = 6/16.</b>"}, {"text": "<b>Why it works:</b> 2/2 = 1, 3/3 = 1, any n/n = 1. Multiplying by 1 never changes the amount. A → C: <b>3/8 × 3/3 = 9/24.</b>"}, {"text": "<b>Going back: divide by n/n.</b> 9/24 ÷ 3/3 = 3/8. Diego glues 3 small tiles back into 1 big tile."}, {"text": "<b>Never add!</b> Add 1 to the top and the bottom of 3/8 and you get 4/9. 4/9 is almost half the hallway, so it is MORE blue than 3/8. Not equal."}], "tip": "Same number, top and bottom. Multiply or divide. Never add.", "notes": {"do": "Hands-on: on grid paper he draws Hallway A as 8 boxes, each 2 squares wide, and colors 3 blue. Under it he draws Hallway B the same length as 16 boxes, 1 square each, and colors 6. The blue ends line up.", "say": "An equivalent fraction is the same amount cut into a different number of pieces.", "ask": "What do you multiply 3/8 by to get a denominator of 40?", "listen": "5/5, because 8 × 5 = 40, so 3/8 = 15/40. If he says “add 32,” go back to the tiles: adding makes a different amount."}}, {"type": "tap", "kick": "Your turn", "title": "Equivalent fractions", "text": "Find what the denominator (or numerator) was multiplied by. Do the same to the other number.", "items": [{"type": "fill", "q": "<b>4/9 = ____/36</b> Type the missing numerator.", "answers": ["16", "16/36"], "why": "9 × 4 = 36, so multiply the numerator by 4 too: 4 × 4 = 16. <b>4/9 = 16/36</b>.", "no": "What do you multiply 9 by to get 36? Multiply the numerator by that same number.", "hint": "9 × 4 = 36.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>5/6 = 30/____</b> Type the missing denominator.", "answers": ["36", "30/36"], "why": "5 × 6 = 30, so multiply the denominator by 6 too: 6 × 6 = 36. <b>5/6 = 30/36</b>.", "no": "This time the numerator changed. What do you multiply 5 by to get 30? Do the same to the denominator.", "hint": "5 × 6 = 30.", "placeholder": "Type a number"}, {"q": "Which fraction is <b>NOT</b> equivalent to <b>6/10</b>?", "choices": ["3/5", "12/20", "9/15", "7/11"], "a": 3, "why": "6/10 ÷ 2/2 = 3/5, 6/10 × 2/2 = 12/20, and 3/5 × 3/3 = 9/15: all equal. <b>7/11</b> came from ADDING 1 to the top and bottom, so it is a different amount.", "no": ["6/10 ÷ 2/2 = 3/5. It IS equivalent.", "6/10 × 2/2 = 12/20. It IS equivalent.", "3/5 × 3/3 = 9/15, and 3/5 = 6/10. It IS equivalent.", null]}], "notes": {"do": "He writes the multiplier (×4/4, ×6/6) next to each one before he types.", "ask": "For 5/6 = 30/____, why does the denominator change by 6?", "listen": "5 × 6 = 30 on top, so 6 × 6 = 36 on the bottom. Watch for 31 (adding 25 to the bottom) or 30 typed as the denominator."}}, {"type": "learn", "kick": "Learn", "title": "Simplify in one step with the GCF", "text": "Ms. Patel's floor plan for one level is a grid of <b>42</b> squares: <b>30</b> squares are apartments and 12 are halls and stairs. That makes <b>30/42</b> of the level apartments. Can that fraction be written with smaller numbers?", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 480 244\" width=\"100%\" style=\"max-width:480px;display:block;margin:auto\" font-family=\"Fredoka,Arial,sans-serif\"><rect x=\"135\" y=\"6\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"165\" y=\"6\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"195\" y=\"6\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"225\" y=\"6\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"255\" y=\"6\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"285\" y=\"6\" width=\"30\" height=\"30\" fill=\"#C7CED9\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"315\" y=\"6\" width=\"30\" height=\"30\" fill=\"#C7CED9\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"135\" y=\"36\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"165\" y=\"36\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"195\" y=\"36\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"225\" y=\"36\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"255\" y=\"36\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"285\" y=\"36\" width=\"30\" height=\"30\" fill=\"#C7CED9\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"315\" y=\"36\" width=\"30\" height=\"30\" fill=\"#C7CED9\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"135\" y=\"66\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"165\" y=\"66\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"195\" y=\"66\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"225\" y=\"66\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"255\" y=\"66\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"285\" y=\"66\" width=\"30\" height=\"30\" fill=\"#C7CED9\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"315\" y=\"66\" width=\"30\" height=\"30\" fill=\"#C7CED9\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"135\" y=\"96\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"165\" y=\"96\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"195\" y=\"96\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"225\" y=\"96\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"255\" y=\"96\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"285\" y=\"96\" width=\"30\" height=\"30\" fill=\"#C7CED9\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"315\" y=\"96\" width=\"30\" height=\"30\" fill=\"#C7CED9\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"135\" y=\"126\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"165\" y=\"126\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"195\" y=\"126\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"225\" y=\"126\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"255\" y=\"126\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"285\" y=\"126\" width=\"30\" height=\"30\" fill=\"#C7CED9\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"315\" y=\"126\" width=\"30\" height=\"30\" fill=\"#C7CED9\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"135\" y=\"156\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"165\" y=\"156\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"195\" y=\"156\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"225\" y=\"156\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"255\" y=\"156\" width=\"30\" height=\"30\" fill=\"#C9A84C\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"285\" y=\"156\" width=\"30\" height=\"30\" fill=\"#C7CED9\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><rect x=\"315\" y=\"156\" width=\"30\" height=\"30\" fill=\"#C7CED9\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><text x=\"210.0\" y=\"210\" text-anchor=\"middle\" font-size=\"15\" fill=\"#0A1F3D\">apartments: 30</text><text x=\"315\" y=\"210\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5b6578\">halls: 12</text><text x=\"240\" y=\"234\" text-anchor=\"middle\" font-size=\"18\" fill=\"#5b6578\">30 of 42 squares are apartments: 30/42</text></svg>"}, "steps": [{"text": "<b>Small steps work, slowly.</b> 30/42 ÷ 2/2 = 15/21. Then 15/21 ÷ 3/3 = 5/7. Two steps, and it is easy to stop too early."}, {"text": "<b>One step with the GCF (Lesson 6).</b> Factors of 30: 1, 2, 3, 5, <b>6</b>, 10, 15, 30. Factors of 42: 1, 2, 3, <b>6</b>, 7, 14, 21, 42. The greatest common factor is <b>6</b>."}, {"text": "<b>Divide by 6/6:</b> 30 ÷ 6 = 5 and 42 ÷ 6 = 7. <b>30/42 = 5/7</b> in one step."}, {"text": "<b>Check:</b> 5 and 7 share no factor except 1, so we are done: 5/7 is in simplest form. The grid agrees: 5 of its 7 columns are gold."}, {"text": "<b>To simplify is to divide.</b> The amount never changes. Only the numbers get smaller."}], "tip": "Simplest form: the numerator and the denominator share no factor except 1.", "notes": {"do": "On the whiteboard he lists the factor pairs of 30 and 42 (1 × 30, 2 × 15, 3 × 10, 5 × 6) and circles the GCF. Then he checks the grid: 5 gold columns out of 7.", "say": "Dividing by the GCF gets you to simplest form in ONE step. Any smaller common factor means more steps.", "ask": "If you divided 30/42 by 3/3 first, would you be done?", "listen": "No: 10/14, and 10 and 14 still share 2. That is why the GCF is the fastest."}}, {"type": "tap", "kick": "Your turn", "title": "Simplify it", "text": "List the factors on paper. Divide by the GCF.", "items": [{"type": "fill", "q": "Simplify in one step with the GCF: <b>24/32 = ____</b>", "answers": ["3/4"], "why": "Factors of 24: 1, 2, 3, 4, 6, 8, 12, 24. Factors of 32: 1, 2, 4, 8, 16, 32. The GCF is <b>8</b>. 24 ÷ 8 = 3 and 32 ÷ 8 = 4. <b>3/4</b>", "no": "Find the greatest common factor of the numerator and the denominator. Divide BOTH by it. Then check: do the new numbers share any factor except 1?", "hint": "The GCF of 24 and 32 is 8.", "placeholder": "Example: 3/4"}, {"q": "To simplify <b>36/54</b> in ONE step, divide the numerator and the denominator by:", "choices": ["9", "12", "18", "6"], "a": 2, "why": "Factors of 36: 1, 2, 3, 4, 6, 9, 12, 18, 36. Factors of 54: 1, 2, 3, 6, 9, 18, 27, 54. The GCF is <b>18</b>: 36 ÷ 18 = 2 and 54 ÷ 18 = 3, so 36/54 = 2/3.", "no": ["9 is a common factor, but 36/54 ÷ 9/9 = 4/6, and 4/6 still simplifies. 9 is not the GREATEST.", "12 is a factor of 36, but not of 54 (54 ÷ 12 is not a whole number).", null, "6 gives 6/9, which still simplifies. Look for a greater common factor."]}, {"q": "Which fraction can <b>NOT</b> be simplified any further?", "choices": ["6/16", "15/21", "9/14", "10/35"], "a": 2, "why": "9 = 3 × 3 and 14 = 2 × 7. They share no factor except 1, so <b>9/14</b> is in simplest form.", "no": ["6 and 16 are both even: they share 2. 6/16 = 3/8.", "15 and 21 share 3. 15/21 = 5/7.", null, "10 and 35 share 5. 10/35 = 2/7."]}], "notes": {"do": "Hands off. He lists factors on paper for each one.", "ask": "How do you know 9/14 can't be simplified?", "listen": "The factors of 9 are 1, 3, 9 and the factors of 14 are 1, 2, 7, 14. Only 1 is in both. Watch for 3/4 typed as 6/8 or 12/16 (stopped early)."}}, {"type": "learn", "kick": "Learn", "title": "Improper fractions and mixed numbers", "text": "Mr. Nguyen's measuring tape is marked in fourths of a foot. The drain pipe he just cut is <b>19 fourths</b> long, or <b>19/4 feet</b>. Its numerator is greater than its denominator, which makes it an <b>improper fraction</b>.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 480 132\" width=\"100%\" style=\"max-width:480px;display:block;margin:auto\" font-family=\"Fredoka,Arial,sans-serif\"><line x1=\"30\" y1=\"60\" x2=\"450\" y2=\"60\" stroke=\"#0A1F3D\" stroke-width=\"3\"/><line x1=\"30.0\" y1=\"48\" x2=\"30.0\" y2=\"72\" stroke=\"#0A1F3D\" stroke-width=\"2.5\"/><text x=\"30.0\" y=\"92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">0</text><line x1=\"51.0\" y1=\"54\" x2=\"51.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"72.0\" y1=\"54\" x2=\"72.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"93.0\" y1=\"54\" x2=\"93.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"114.0\" y1=\"48\" x2=\"114.0\" y2=\"72\" stroke=\"#0A1F3D\" stroke-width=\"2.5\"/><text x=\"114.0\" y=\"92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">1</text><line x1=\"135.0\" y1=\"54\" x2=\"135.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"156.0\" y1=\"54\" x2=\"156.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"177.0\" y1=\"54\" x2=\"177.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"198.0\" y1=\"48\" x2=\"198.0\" y2=\"72\" stroke=\"#0A1F3D\" stroke-width=\"2.5\"/><text x=\"198.0\" y=\"92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">2</text><line x1=\"219.0\" y1=\"54\" x2=\"219.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"240.0\" y1=\"54\" x2=\"240.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"261.0\" y1=\"54\" x2=\"261.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"282.0\" y1=\"48\" x2=\"282.0\" y2=\"72\" stroke=\"#0A1F3D\" stroke-width=\"2.5\"/><text x=\"282.0\" y=\"92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">3</text><line x1=\"303.0\" y1=\"54\" x2=\"303.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"324.0\" y1=\"54\" x2=\"324.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"345.0\" y1=\"54\" x2=\"345.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"366.0\" y1=\"48\" x2=\"366.0\" y2=\"72\" stroke=\"#0A1F3D\" stroke-width=\"2.5\"/><text x=\"366.0\" y=\"92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">4</text><line x1=\"387.0\" y1=\"54\" x2=\"387.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"408.0\" y1=\"54\" x2=\"408.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"429.0\" y1=\"54\" x2=\"429.0\" y2=\"66\" stroke=\"#0A1F3D\" stroke-width=\"1.5\"/><line x1=\"450.0\" y1=\"48\" x2=\"450.0\" y2=\"72\" stroke=\"#0A1F3D\" stroke-width=\"2.5\"/><text x=\"450.0\" y=\"92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#0A1F3D\">5</text><rect x=\"30\" y=\"38\" width=\"399.0\" height=\"9\" rx=\"4\" fill=\"#2E86DE\"/><circle cx=\"429.0\" cy=\"60\" r=\"7\" fill=\"#DB2F30\"/><text x=\"429.0\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" fill=\"#DB2F30\">19/4</text><text x=\"240\" y=\"122\" text-anchor=\"middle\" font-size=\"18\" fill=\"#5b6578\">19 fourths of a foot = 4 whole feet and 3/4 of a foot</text></svg>"}, "steps": [{"text": "<b>Improper → mixed: divide.</b> 19 ÷ 4 = 4 R3. The quotient, 4, is the whole feet. The remainder, 3, is the fourths left over. <b>19/4 = 4 3/4.</b>", "visual": {"kind": "longdiv", "text": "   4 R3\n4)19\n -16\n   3"}}, {"text": "<b>Check it on the line:</b> 4 wholes = 16 fourths, plus 3 more fourths = 19 fourths. ✅"}, {"text": "<b>Mixed → improper:</b> Darnell needs a steel bar <b>3 5/6</b> feet long, and his chart counts sixths. 3 wholes = 3 × 6 = 18 sixths. Add the 5: 18 + 5 = 23. <b>3 5/6 = 23/6.</b>"}, {"text": "<b>The denominator never changes</b> when you convert. Fourths stay fourths and sixths stay sixths."}, {"text": "<b>Simplest form counts here too.</b> 26/4 = 6 R2 = 6 2/4, and 2/4 = 1/2, so 26/4 = <b>6 1/2</b>. Always look at the fraction part."}], "tip": "Improper → mixed: divide, and the remainder goes over the same denominator. Mixed → improper: whole × denominator, plus the numerator.", "notes": {"do": "Hands-on: on grid paper he draws a number line from 0 to 5 with 4 squares for each foot, then hops 19 squares from 0 and reads where he lands (4 and 3 more squares).", "say": "Converting uses your Lesson 2 division: the remainder finally has a home. It becomes the numerator.", "ask": "Why does 3 5/6 have 18 sixths before you add the 5?", "listen": "Each whole foot is 6 sixths, and there are 3 wholes: 3 × 6 = 18."}}, {"type": "tap", "kick": "Your turn", "title": "Convert it", "text": "Type a mixed number with a space: 4 3/5.", "items": [{"type": "fill", "q": "Change it to a mixed number: <b>27/5 = ____</b>", "answers": ["5 2/5", "5-2/5", "5 and 2/5"], "why": "27 ÷ 5 = 5 R2. The quotient 5 is the whole number. The remainder 2 is the new numerator, and the denominator stays 5. <b>5 2/5</b>", "no": "Divide the numerator by the denominator. The quotient is the whole number, the remainder is the new numerator, and the denominator stays the same. Type a space between the whole number and the fraction.", "hint": "27 ÷ 5 = 5 R2.", "placeholder": "Example: 2 1/3"}, {"type": "fill", "q": "Change it to an improper fraction: <b>6 2/7 = ____/7</b> Type the numerator.", "answers": ["44", "44/7"], "why": "6 wholes = 6 × 7 = 42 sevenths. Add the 2 more: 42 + 2 = 44. <b>6 2/7 = 44/7</b>.", "no": "Multiply the whole number by the denominator first (6 × 7), then add the numerator. The denominator stays 7.", "hint": "6 × 7 = 42.", "placeholder": "Type a number"}, {"q": "Which is <b>34/8</b> as a mixed number in simplest form?", "choices": ["4 2/8", "4 1/4", "2 4/8", "4 1/2"], "a": 1, "why": "34 ÷ 8 = 4 R2, so 34/8 = 4 2/8. Simplify the fraction part: 2/8 = 1/4. <b>4 1/4</b>", "no": ["4 2/8 is the right amount, but 2/8 is not in simplest form. Divide both by 2.", null, "The quotient and the remainder got switched. 34 ÷ 8 = 4 R2: the 4 is the whole number.", "2/8 is not 1/2. Divide 2 and 8 by 2: 1/4."]}], "notes": {"do": "He says the division out loud for each one (27 ÷ 5 = 5 R2) before he types.", "ask": "For 6 2/7, what two steps did you do?", "listen": "6 × 7 = 42, then 42 + 2 = 44, so 44/7. Watch for 6 × 2 = 12 (multiplying by the numerator) or 15 (adding 6 + 2 + 7)."}}, {"type": "learn", "kick": "Learn", "title": "Two steps for Ms. Okafor", "text": "Ms. Okafor, the project engineer, needs two numbers for her report.", "visual": {"kind": "bigtext", "text": "54 − 36 = 18", "sub": "54 tiles, 36 blue, so 18 white"}, "steps": [{"text": "<b>The lobby:</b> 54 tiles cover the floor. 36 are blue, and every other tile is white. Step 1: 54 − 36 = <b>18</b> white tiles, so 18/54 of the floor is white."}, {"text": "<b>Step 2: simplify with the GCF.</b> Factors of 18: 1, 2, 3, 6, 9, 18. 54 ÷ 18 = 3, so 18 is a factor of 54 too. GCF = 18. <b>18/54 = 1/3</b> of the floor is white."}, {"text": "<b>The pipe:</b> Mr. Nguyen lines up <b>21</b> short pipes, each <b>1/6</b> foot long (a unit fraction). 21 pieces of 1/6 = <b>21/6</b> feet."}, {"text": "<b>Convert, then simplify:</b> 21 ÷ 6 = 3 R3, so 21/6 = 3 3/6. 3/6 = 1/2. The line is <b>3 1/2 feet</b>."}, {"text": "<b>Read the question twice:</b> blue or white? Improper fraction or mixed number? Simplest form?"}], "tip": "Underline what the question asks for before you start.", "notes": {"do": "He works both on paper and underlines “white” and “mixed number” in the question before he starts.", "say": "Pathways' real-world and Boss questions are all two steps like these.", "ask": "What answer do you get if you forget step 1 in the lobby problem?", "listen": "36/54 = 2/3, the BLUE part. The question asked for white."}}, {"type": "tap", "kick": "Your turn", "title": "Two-step jobs", "text": "Underline what the question asks for. Paper first.", "items": [{"type": "fill", "q": "A laundry room floor is covered with <b>45 tiles</b>. <b>27</b> of them are gray, and every other tile is white. What fraction of the tiles are <b>white</b>? Type it in simplest form.", "answers": ["2/5"], "why": "Step 1: 45 − 27 = 18 white tiles, so 18/45. Step 2: the GCF of 18 and 45 is 9. 18 ÷ 9 = 2 and 45 ÷ 9 = 5. <b>2/5</b>", "no": "Two steps. First subtract to find how many are white. Then write that number over 45 and divide both by the GCF.", "hint": "45 − 27 = 18.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Mr. Nguyen joins <b>26 pieces of pipe</b> into one straight line. Every piece is <b>1/8 foot long</b>. How long is the line? Type a mixed number in simplest form.", "answers": ["3 1/4", "3-1/4", "3 and 1/4", "3 1/4 feet", "3 1/4 ft", "3-1/4 feet", "3-1/4 ft", "3 and 1/4 feet", "3 and 1/4 ft"], "why": "26 pieces of 1/8 = 26/8 feet. 26 ÷ 8 = 3 R2, so 26/8 = 3 2/8. 2/8 simplifies to 1/4 (divide both by 2). <b>3 1/4 feet</b>", "no": "Write it as an improper fraction first (26/8). Then divide to make a mixed number, and simplify the fraction part.", "hint": "26 ÷ 8 = 3 R2.", "placeholder": "Example: 2 1/3"}, {"type": "fill", "q": "Darnell has to cut a steel bar <b>4 3/8 feet</b> long. His cutting chart counts eighths. How many eighths is that? <b>4 3/8 = ____/8</b>", "answers": ["35", "35/8"], "why": "4 wholes = 4 × 8 = 32 eighths. Add the 3 more: 32 + 3 = 35. <b>4 3/8 = 35/8</b>.", "no": "Multiply the whole number by the denominator first (4 × 8), then add the numerator. The denominator stays 8.", "hint": "4 × 8 = 32.", "placeholder": "Type a number"}], "notes": {"do": "Hands off. He writes both steps for each one.", "ask": "For the pipe, what improper fraction did you get first?", "listen": "26/8, which is 3 2/8 = 3 1/4. Watch for 3 2/8 (not simplified) and for 18/45 left unsimplified in the first one."}}, {"type": "tap", "kick": "Find the mistake", "title": "Be the checker", "text": "Each one has a mistake. Find it.", "items": [{"q": "Nia wrote <b>2/5 = 3/6</b> because she added 1 to the top and 1 to the bottom. Is she right?", "choices": ["Yes, because she changed both numbers the same way.", "No. 3/6 is one half, but 2/5 is less than half.", "No. She needed to add 2 to both numbers, not 1.", "Yes, because both fractions are less than one whole."], "a": 1, "why": "3/6 is exactly 1/2. Half of 5 is 2 1/2, so 2/5 is less than 1/2. Adding to both numbers changes the amount. A true equivalent: 2/5 × 2/2 = <b>4/10</b>.", "no": ["Changing both numbers the same way only works when you multiply or divide. Adding changed the amount: 3/6 is one half, and 2/5 is less.", null, "Adding 2 gives 4/7, another different amount. Adding never makes an equivalent fraction.", "Many fractions are less than 1 and still not equal. 3/6 is exactly one half, and 2/5 is less than half."]}, {"q": "Marcus divided <b>20/36</b> by 2/2 and got <b>10/18</b>. He says he is finished. What should he do?", "choices": ["Nothing. 10/18 is already in simplest form.", "Stop. 10/18 is fine because 18 is not prime.", "Divide the top by 2 and the bottom by 3: 5/6.", "Keep going. 10 and 18 share 2, so it is 5/9."], "a": 3, "why": "10 and 18 are both even, so they still share 2: 10/18 = <b>5/9</b>. The GCF of 20 and 36 is 4, and 20/36 ÷ 4/4 = 5/9 in one step. He used a common factor, but not the greatest one.", "no": ["10 and 18 are both even, so they share 2. It is not in simplest form.", "Prime or not does not matter. 10 and 18 still share the factor 2.", "Dividing the top and bottom by different numbers changes the amount. Use the same number for both.", null]}, {"q": "Kofi changed <b>5 2/3</b> to the improper fraction <b>10/3</b>. Which check proves he made a mistake?", "choices": ["10/3 = 3 1/3, and 3 1/3 is less than 5 2/3.", "10/3 has a bigger numerator than 5 2/3 does.", "The denominator should be 15, not 3.", "10 is an even number, so it cannot be right."], "a": 0, "why": "Convert back: 10 ÷ 3 = 3 R1, so 10/3 = 3 1/3. That is less than 5 2/3, so 10/3 is wrong. He multiplied 5 × 2. The right way: 5 × 3 = 15 thirds, plus 2 more = <b>17/3</b>.", "no": [null, "Comparing the top numbers does not prove anything here. Convert 10/3 back to a mixed number and compare.", "The denominator stays 3 when you convert. The mistake is in the numerator.", "Even numbers can be numerators. Convert 10/3 back: it is only 3 1/3."]}], "notes": {"do": "He says which step went wrong and proves it: for the first, compare both to 1/2; for the last, convert 10/3 back (3 1/3).", "say": "These are the three big fraction mistakes: adding instead of multiplying, stopping before simplest form, and multiplying by the wrong number when converting.", "ask": "How can converting back catch Kofi's mistake?", "listen": "10 ÷ 3 = 3 R1 = 3 1/3, not 5 2/3. Checking backward catches it."}}, {"type": "tap", "kick": "Exit ticket", "title": "Math check", "text": "On your own. Paper first, then type.", "items": [{"type": "fill", "q": "Simplify in one step with the GCF: <b>32/48 = ____</b>", "answers": ["2/3"], "why": "Factors of 32: 1, 2, 4, 8, 16, 32. Factors of 48: 1, 2, 3, 4, 6, 8, 12, 16, 24, 48. The GCF is <b>16</b>. 32 ÷ 16 = 2 and 48 ÷ 16 = 3. <b>2/3</b>", "no": "Find the greatest common factor of the numerator and the denominator. Divide BOTH by it. Then check: do the new numbers share any factor except 1?", "hint": "The GCF of 32 and 48 is 16.", "placeholder": "Example: 3/4"}, {"type": "fill", "q": "Mr. Nguyen joins <b>22 short pieces of pipe</b> into one straight line. Every piece is <b>1/4 foot long</b>. How long is the line? Type a mixed number in simplest form.", "answers": ["5 1/2", "5-1/2", "5 and 1/2", "5 1/2 feet", "5 1/2 ft", "5-1/2 feet", "5-1/2 ft", "5 and 1/2 feet", "5 and 1/2 ft"], "why": "22 pieces of 1/4 = 22/4 feet. 22 ÷ 4 = 5 R2, so 22/4 = 5 2/4. 2/4 simplifies to 1/2 (divide both by 2). <b>5 1/2 feet</b>", "no": "Write it as an improper fraction first (22/4). Then divide to make a mixed number, and simplify the fraction part.", "hint": "22 ÷ 4 = 5 R2.", "placeholder": "Example: 2 1/3"}], "notes": {"do": "Hands off. Note his first answers. Then switch to reading (10:05).", "listen": "2/3 and 5 1/2. Both right on the first try means he is ready for Pathways Week 12 Math (Saturday on his task list). Watch for 4/6 or 8/12 (stopped early) and 5 2/4."}}, {"type": "vocab", "kick": "Word Power", "title": "Reading words for today", "text": "Tap each card. Read the word, the meaning and the example out loud.", "words": [{"word": "informative writing", "pos": "noun", "meaning": "Nonfiction writing whose job is to explain a real topic and give the reader true facts about it.", "example": "An article about how tower cranes work is <b>informative writing</b>.", "emoji": "📰"}, {"word": "topic sentence", "pos": "noun", "meaning": "The sentence that states what the whole paragraph is about. Writers usually put it first.", "example": "“A tower crane is the tallest tool on a building site” is a <b>topic sentence</b>.", "emoji": "🏷️"}, {"word": "supporting detail", "pos": "noun", "meaning": "A sentence that proves or explains the main idea with a fact, an example or a reason.", "example": "“Each morning, the operator climbs up inside the tower to the cab” is a <b>supporting detail</b> about the crane.", "emoji": "🧱"}, {"word": "transition", "pos": "noun", "meaning": "A connecting word or phrase, such as first, however or as a result, that shows how the next idea links to the one before.", "example": "“<b>Next</b>, the crew sets the window in place.” Next is a <b>transition</b>.", "emoji": "🚪"}, {"word": "concluding sentence", "pos": "noun", "meaning": "The final sentence of a paragraph. It says the main idea again with different words to close the paragraph.", "example": "“Careful steps like these keep every apartment dry” is a <b>concluding sentence</b>.", "emoji": "🎀"}, {"word": "off-topic", "pos": "adjective", "meaning": "Not about the main idea, so it does not belong in the paragraph.", "example": "“The crane operator's favorite color is green” is <b>off-topic</b> in a paragraph about how cranes work.", "emoji": "🚫"}], "notes": {"do": "He reads each card aloud and covers it. Extra time on transition and concluding sentence: Pathways asks him to TYPE both.", "say": "Now we switch to writing. Informative writing teaches facts. Each paragraph holds up one main idea, the way each floor of a building sits on the one below it.", "ask": "How is informative writing different from the persuasive writing in Lesson 2?", "listen": "Informative teaches facts; persuasive tries to change your mind. Have him spell transition and concluding out loud."}}, {"type": "learn", "kick": "Learn", "title": "Every sentence has a job", "text": "Read the model paragraph. Each sentence does one job.", "visual": {"kind": "passage", "text": "<b>Laying a Tile Floor</b><br>A tile setter follows careful steps to lay a floor. First, he sweeps the floor and checks that it is flat. Next, he spreads a sticky layer called mortar and presses each tile into it. He also puts small plastic spacers between the tiles so the lines stay straight. When every tile is set, he fills the gaps with grout. These careful steps give the floor a smooth, even finish that lasts for years."}, "steps": [{"text": "<b>Topic sentence</b> (the foundation): it tells the main idea, and everything rests on it. “A tile setter follows careful steps to lay a floor.”"}, {"text": "<b>Supporting details</b> (the floors): facts and examples that back up the main idea. Sweeping, mortar, spacers, grout."}, {"text": "<b>Transitions</b> (the stairs): First, Next, also, When every tile is set. They guide the reader from one step to the next."}, {"text": "<b>Concluding sentence</b> (the roof): it says the main idea again with different words. “These careful steps give the floor a smooth, even finish that lasts for years.”"}, {"text": "<b>Stay on one idea.</b> Suppose the paragraph also said “Diego’s truck is blue.” That sentence would be <b>off-topic</b>, so the writer crosses it out."}], "tip": "Ask about every sentence: does it back up the topic sentence?", "notes": {"do": "He highlights the paragraph on paper (or points on screen): color 1 = topic sentence, color 2 = transitions, color 3 = concluding sentence.", "say": "The concluding sentence says the main idea again, with different words. It does not add a new topic.", "ask": "Which words in the concluding sentence connect back to the topic sentence?", "listen": "“careful steps” and “floor.” It brings the reader back to the main idea."}}, {"type": "learn", "kick": "Learn", "title": "Transitions have jobs", "text": "A transition tells the reader how the next idea connects to the one before it. Choose a transition by its job.", "visual": {"kind": "bigtext", "text": "order · example · contrast · effect · add", "sub": "five jobs"}, "steps": [{"text": "<b>Order:</b> first, next, then, finally. “First, the crew measures the window opening. Next, they set the window in place.”"}, {"text": "<b>Example:</b> for example. “Builders use many big machines. For example, a bulldozer pushes dirt into piles.”"}, {"text": "<b>Contrast (a difference):</b> however. “Steel beams are very strong. However, they rust if they stay wet.”"}, {"text": "<b>Effect (a result):</b> as a result. “The concrete truck was two hours late. As a result, the crew poured the floor after lunch.”"}, {"text": "<b>Add a detail:</b> also. “The lobby gets new lights. It also gets a tall mirror.”"}, {"text": "<b>Comma rule:</b> when a transition opens a sentence, a comma goes right after it: “Next, they set the window in place.” “However, they rust if they stay wet.”"}], "tip": "Ask: how do the two ideas connect? Order, example, difference, result, or one more detail?", "notes": {"do": "Write the five jobs on the whiteboard as column headings. He adds one transition under each from memory.", "say": "However is NOT just another detail. It means the next idea is different or surprising.", "ask": "“Roofers nail shingles onto the roof. ____, landscapers plant trees by the front door.” Which transition fits?", "listen": "Also (one more detail) or Next (the next job). However does not fit: planting trees is not the opposite of nailing shingles."}}, {"type": "tap", "kick": "Read", "title": "The tallest tool on the site", "text": "Read the article out loud. Highlight the transitions.", "visual": {"kind": "passage", "text": "<b>The Tallest Tool on the Site</b><br>(1) A tower crane is the tallest tool on a building site. (2) It arrives on trucks in pieces, and the crew bolts it together like a giant building set. (3) As the apartment building grows, the crew adds new sections to make the crane taller. (4) Each morning, the operator climbs up inside the tower to the cab, where the controls are.<br><br>(5) Wind is the biggest danger for a tower crane. (6) A small spinning tool on top of the crane measures how fast the wind is blowing. (7) My little brother loves to fly kites at the park. (8) When the wind gets too strong, the operator must stop lifting. (9) As a result, cranes often sit still on stormy days."}, "items": [{"q": "In the second paragraph, which sentence is the <b>topic sentence</b>?", "choices": ["(6) A small spinning tool on top of the crane measures how fast the wind is blowing.", "(5) Wind is the biggest danger for a tower crane.", "(9) As a result, cranes often sit still on stormy days.", "(8) When the wind gets too strong, the operator must stop lifting."], "a": 1, "why": "Every other sentence in the paragraph is about wind and the crane. <b>Sentence 5</b> tells that main idea.", "no": ["That is a supporting detail: one fact about measuring wind.", null, "That is the last sentence. It shows a result of the wind.", "That is a supporting detail about what the operator does."]}, {"type": "fill", "q": "Which sentence is <b>off-topic</b>? Type its number.", "answers": ["7", "seven", "sentence 7", "(7)"], "why": "<b>Sentence 7</b> is about a brother flying kites. It does not tell about tower cranes, so it is off-topic.", "no": "Find the sentence that is not about the crane.", "hint": "It is in the second paragraph.", "placeholder": "Type a number"}, {"type": "fill", "q": "Sentence 9 starts with a transition. Which transition shows the <b>effect</b>? Type it.", "answers": ["as a result"], "why": "“<b>As a result</b>, cranes often sit still on stormy days.” Sitting still is the effect of strong wind.", "no": "Look at the first words of sentence 9.", "hint": "It is three words long."}], "notes": {"do": "He reads aloud, highlights the transitions (As the apartment building grows, Each morning, When, As a result) and crosses out the off-topic sentence.", "ask": "What is the topic sentence of the FIRST paragraph?", "listen": "Sentence 1: a tower crane is the tallest tool on a building site. Everything in paragraph 1 is about the crane itself."}}, {"type": "order", "kick": "Paragraph builder", "title": "Put the paragraph in order", "text": "Amara's notes about putting in a window got mixed up. Tap the sentences in order: topic sentence first, then the steps, then the concluding sentence.", "steps": ["Putting a window into a new apartment takes careful steps.", "First, the crew measures the opening in the wall.", "Next, they set the window in place and check that it is level.", "Then, they seal every edge so rain cannot sneak in.", "Finally, an inspector sprays the window with water to test for leaks.", "Careful steps like these keep every apartment warm and dry."], "why": "Topic sentence first. First, Next, Then and Finally put the details in order. The concluding sentence wraps it up.", "hint": "Which sentence tells the main idea of all the others? Start there.", "notes": {"do": "He reads each sentence out loud as he taps it and names the transition.", "ask": "How did you know which sentence came last?", "listen": "It wraps up the main idea (careful steps) and has no step in it. Finally is the last STEP, not the conclusion."}}, {"type": "sort", "kick": "Paragraph sort", "title": "Does it belong?", "text": "The topic is <b>my jiu-jitsu class</b>. Tap a sentence, then tap its job.", "buckets": ["Topic sentence", "Supporting detail", "Concluding sentence", "Off-topic"], "items": [{"text": "Jiu-jitsu class teaches me much more than how to wrestle.", "b": 0, "why": "It tells the main idea of the whole paragraph.", "hint": "Which sentence could the others all back up?"}, {"text": "First, every student bows before stepping onto the mat.", "b": 1, "why": "A fact about class that backs up the main idea.", "hint": "Is it one step or fact about class?"}, {"text": "Next, we warm up with rolls and stretches.", "b": 1, "why": "Another step in class: a supporting detail.", "hint": "Does it tell what happens in class?"}, {"text": "For example, I learned to stay calm when someone pins me.", "b": 1, "why": "An example of what class teaches.", "hint": "For example is a clue."}, {"text": "The grocery store near my house sells fresh bread.", "b": 3, "why": "It is about a grocery store, not about jiu-jitsu class.", "hint": "Is this about class at all?"}, {"text": "Every class makes me stronger, calmer and more respectful.", "b": 2, "why": "It wraps up the main idea in new words.", "hint": "Does it sum up the whole paragraph?"}, {"text": "Our car needs new tires before winter.", "b": 3, "why": "It has nothing to do with jiu-jitsu class.", "hint": "Does it have anything to do with class?"}, {"text": "We also practice escapes with a partner.", "b": 1, "why": "One more fact about class. Also adds a detail.", "hint": "Also is a clue."}], "done": "Topic sentence = the main idea. Details back it up. The concluding sentence wraps it up. Off-topic sentences come out.", "notes": {"do": "He sorts all eight and says WHY before each tap.", "ask": "The bread sentence might be true. Why does it still not belong?", "listen": "Being true is not enough. It has to back up THIS paragraph's main idea."}}, {"type": "tap", "kick": "Exit ticket", "title": "Words from memory", "text": "No word list. Type the answer.", "items": [{"type": "fill", "q": "Type the transition that fits: <b>The paint was still wet. ____, nobody could hang pictures that day.</b>", "answers": ["as a result", "therefore", "consequently", "because of this", "because of that", "for this reason", "so"], "why": "Nobody could hang pictures BECAUSE the paint was wet. That is an effect: <b>As a result</b>.", "no": "How are the two ideas connected? Is the second one an example, a difference, or a result?", "hint": "It is the transition for an effect."}, {"type": "fill", "q": "Most paragraphs open with the ________ sentence, which states what the whole paragraph is about.", "answers": ["topic", "topic sentence"], "why": "It is the <b>topic</b> sentence.", "no": "It usually comes first in the paragraph.", "hint": "It starts with t-o-p."}, {"type": "fill", "q": "A paragraph closes with a ________ sentence that says its main idea again with different words.", "answers": ["concluding", "concluding sentence", "conclusion", "closing", "ending", "final"], "why": "It is the <b>concluding</b> sentence.", "no": "It concludes, or closes, the paragraph.", "hint": "It starts with c-o-n-c."}], "notes": {"do": "No peeking at the vocab slides. A missed word is said three times, spelled out loud, then typed again.", "listen": "Spelling counts on Pathways: t-o-p-i-c, c-o-n-c-l-u-d-i-n-g."}}, {"type": "learn", "kick": "Wrap-up", "title": "Two big skills, and the last lesson of the year", "text": "You renamed, simplified and converted fractions, and you built paragraphs floor by floor.", "steps": [{"text": "<b>Equivalent:</b> multiply or divide the top and bottom by the same number. Never add."}, {"text": "<b>Simplify:</b> divide by the GCF in one step. Check that nothing else divides both."}, {"text": "<b>Convert:</b> divide to get a mixed number. Whole × denominator + numerator to get an improper fraction."}, {"text": "<b>Paragraphs:</b> topic sentence, supporting details, transitions, concluding sentence. Off-topic sentences come out."}, {"text": "<b>Next:</b> no class for a few weeks. You are the Games Director of the Ferguson Family Winter Games!"}], "tip": "Before you type a fraction: is it in simplest form? Did the question ask for a mixed number?", "notes": {"do": "Open the course page together and read this week's task list, one day at a time. Then open the Winter Games page and read “What it is” and the Respect Rules together.", "say": "Tonight: the after-class lesson and Show What You Know. Thursday: Pathways Week 12 Reading, and the Winter Games family meeting. Friday: Practice, Packet page 1 and your index cards, and the airplane workshop. Saturday: Pathways Week 12 Math. Sunday: Packet page 2, and it is your retake day. After that, it is the Winter Games until our first January lesson.", "ask": "Say how you would simplify 30/42 and convert 19/4, without looking.", "listen": "GCF 6, so 5/7. 19 ÷ 4 = 4 R3, so 4 3/4."}}], "win": "Every fraction in simplest form and every paragraph built floor by floor. Amara's building is ready for inspection, and you are ready for the Winter Games!", "prev": "bb-ethan-L06", "prevTitle": "Lesson 6"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
