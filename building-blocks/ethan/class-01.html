<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Ethan · Lesson 1: Malik&#x27;s Mural: Multiplying Big Numbers</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L01", "label": "Lesson 1", "title": "Malik's Mural: Multiplying Big Numbers", "goal": "I can estimate first, then multiply 2-digit and 3-digit numbers by 2-digit numbers step by step and check my answer.", "date": "2026-10-21", "mastery": 85, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Malik's Mural: Multiplying Big Numbers", "text": "Malik's art class is painting a giant tile mural on the gym wall. The mural is <b>24 tiles across</b> and <b>18 tiles down</b>. Today you learn to find that number fast and get it right every time.", "visual": {"kind": "emoji", "text": "🎨🧱✖️"}, "notes": {"do": "Before class: grid paper (1 cm squares), 2 colored pencils, scissors, whiteboard and marker, pencil and scrap paper. Ethan writes every problem on paper today, even the ones he types.", "say": "Today is all about one big skill: multiplying 2-digit and 3-digit numbers, step by step, so you get it right the first time. Slow is fast today.", "ask": "What do you remember about the area model from Multiplication Mountain?", "listen": "Split a number into tens and ones, multiply each part, add the parts. He knows this idea well; today we connect it to the stacked method."}}, {"type": "talk", "kick": "Math Talk", "title": "Malik's problem", "text": "The mural is <b>24 tiles across</b> and <b>18 tiles down</b>. Malik has to order the exact number of tiles.", "visual": {"kind": "bigtext", "text": "24 × 18 = ?", "sub": "tiles across × tiles down"}, "prompts": ["Why is counting the tiles one by one a bad plan?", "Why should Malik get the <b>exact</b> number and not just a guess?", "What do you think the answer is close to? How did you decide?"], "starters": ["Counting one by one is slow because …", "An exact number matters because …", "I think it is close to … because …"], "notes": {"do": "Let him talk for 2 to 3 minutes. Write his guess for 24 × 18 in the corner of the whiteboard. We come back to it later.", "ask": "If Malik orders too few tiles, what happens? Too many?", "listen": "Too few means the mural is unfinished; too many wastes money. If he says about 400 (20 × 20), praise it: that is an estimate, and we will use it."}}, {"type": "tap", "kick": "Warm-up", "title": "Facts and tens", "text": "Type each answer. These are the building blocks for today.", "items": [{"type": "fill", "q": "<b>7 × 8 = ____</b>", "answers": ["56"], "why": "7 × 8 = <b>56</b>.", "no": "Think 7 × 7 = 49, plus one more 7.", "hint": "5, 6, 7, 8: 56 = 7 × 8."}, {"type": "fill", "q": "<b>40 × 6 = ____</b>", "answers": ["240"], "why": "4 × 6 = 24, so 4 tens × 6 = 24 tens = <b>240</b>.", "no": "40 is 4 tens. Do 4 × 6, then keep the zero.", "hint": "4 × 6 = 24. Now add one zero."}, {"type": "fill", "q": "<b>18 × 10 = ____</b>", "answers": ["180"], "why": "18 tens = <b>180</b>.", "no": "Times 10 makes each digit worth ten times more.", "hint": "18 tens is 180."}, {"type": "fill", "q": "<b>30 × 20 = ____</b>", "answers": ["600"], "why": "3 × 2 = 6, then two zeros: <b>600</b>.", "no": "Do 3 × 2, then count the zeros in both factors.", "hint": "3 × 2 = 6. There are two zeros in 30 and 20."}], "notes": {"do": "He answers out loud first, then types. Fast and confident is the goal.", "ask": "Why does 30 × 20 have two zeros?", "listen": "One zero from 30 and one from 20. 3 tens × 2 tens = 6 hundreds."}}, {"type": "vocab", "kick": "Word Power", "title": "Words for today", "text": "Tap each card to flip it. Read the word, the meaning and the example out loud.", "words": [{"word": "factor", "pos": "noun", "meaning": "A number you multiply.", "example": "In 18 × 13 = 234, the <b>factors</b> are 18 and 13.", "emoji": "✖️"}, {"word": "product", "pos": "noun", "meaning": "The answer to a multiplication problem.", "example": "234 is the <b>product</b> of 18 and 13.", "emoji": "🎯"}, {"word": "partial product", "pos": "noun", "meaning": "One piece of a multiplication problem. You find each piece, then add the pieces.", "example": "In 18 × 13, the <b>partial products</b> are 54 and 180.", "emoji": "🧩"}, {"word": "estimate", "pos": "noun or verb", "meaning": "A smart guess you make by rounding first. It tells you about how big the answer should be.", "example": "To <b>estimate</b> 18 × 13, I round to 20 × 10 = 200.", "emoji": "🔍"}, {"word": "regroup", "pos": "verb", "meaning": "To carry extra value into the next place-value column when a column makes 10 or more.", "example": "8 × 4 = 32, so I write the 2 and <b>regroup</b> the 3 tens.", "emoji": "🔁"}, {"word": "standard algorithm", "pos": "noun", "meaning": "The stacked, step-by-step way to multiply bigger numbers on paper.", "example": "The <b>standard algorithm</b> does the same math as the area model, just stacked.", "emoji": "📐"}, {"word": "quotient", "pos": "noun (review)", "meaning": "The answer to a division problem.", "example": "In 432 ÷ 36 = 12, the <b>quotient</b> is 12.", "emoji": "➗"}], "notes": {"do": "He reads each card aloud, then covers the card and says the meaning in his own words.", "say": "Today you will not pick these words from a list. You will type them from memory, so say each one out loud.", "ask": "Which two words are the answers? (product for multiplying, quotient for dividing.) What is the difference between a product and a partial product?", "listen": "A partial product is one piece; the product is the whole answer after you add the pieces."}}, {"type": "learn", "kick": "Learn", "title": "Estimate first", "text": "Before you multiply, <b>estimate</b>. Round each factor to the nearest ten, then multiply.", "steps": [{"text": "<b>18 × 13</b>. 18 rounds to <b>20</b>. 13 rounds to <b>10</b>."}, {"text": "20 × 10 = <b>200</b>. So 18 × 13 is <b>about 200</b>.", "visual": {"kind": "bigtext", "text": "18 × 13 ≈ 200", "sub": "≈ means about"}}, {"text": "If you get 23 or 2,340, something went wrong. Those are not close to 200."}, {"text": "The estimate is your <b>alarm</b>. If your answer is far away from it, go back and find the mistake."}], "tip": "An estimate is not the answer. It tells you about how big the answer should be.", "notes": {"do": "Click the steps one at a time. Write 18 × 13 ≈ 20 × 10 = 200 on the whiteboard.", "say": "Every problem today starts with an estimate. It takes five seconds and it catches the biggest mistakes.", "ask": "Why is 2,340 not reasonable? Why is 23 not reasonable?", "listen": "2,340 is about ten times too big (an extra zero). 23 is far too small; multiplying 18 by 13 must give more than 18 × 10 = 180."}}, {"type": "tap", "kick": "Try it", "title": "Make an estimate", "items": [{"type": "fill", "q": "Round both factors to the nearest ten. Estimate <b>47 × 22</b>: 50 × 20 = ____", "answers": ["1,000", "1000"], "why": "47 rounds to 50 and 22 rounds to 20. 50 × 20 = <b>1,000</b>.", "no": "5 × 2 = 10. Then count the zeros.", "hint": "5 tens × 2 tens = 10 hundreds."}, {"q": "Malik's notes show four answers for <b>24 × 18</b>. Estimate: 20 × 20 = 400. Which answer is reasonable?", "choices": ["42", "4,320", "432", "192"], "a": 2, "why": "432 is close to the estimate of 400.", "no": ["42 is just 24 + 18. That is adding, not multiplying.", "4,320 is about ten times too big. Look for an extra zero.", null, "192 is only 24 × 8. It leaves out the 24 × 10 piece."]}], "notes": {"do": "He says the estimate out loud before he answers.", "ask": "For the second one, what mistake made 192? What made 4,320?", "listen": "192 = only one partial product (24 × 8). 4,320 = an extra zero. These are the exact mistakes we hunt today."}}, {"type": "learn", "kick": "Learn", "title": "The area model: 18 × 13", "text": "You already know this one. Split both factors: <b>18 = 10 + 8</b> and <b>13 = 10 + 3</b>.", "steps": [{"text": "Draw 2 columns (10 and 8) and 2 rows (10 and 3). That makes <b>4 boxes</b>.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">10</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">8</text><text x=\"36\" y=\"92.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"3\"/><text x=\"131.0\" y=\"93.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0047BA\">?</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"3\"/><text x=\"266.0\" y=\"93.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0047BA\">?</text><text x=\"36\" y=\"181.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">3</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"3\"/><text x=\"131.0\" y=\"182.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0047BA\">?</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"3\"/><text x=\"266.0\" y=\"182.0\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0047BA\">?</text></svg>"}}, {"text": "Multiply each box: 10 × 10 = 100, 8 × 10 = 80, 10 × 3 = 30, 8 × 3 = 24.", "visual": {"kind": "svg", "svg": "<svg viewBox=\"0 0 324 220\" width=\"100%\" style=\"max-width:344px;display:block;margin:auto\" font-family=\"Fredoka,sans-serif\"><text x=\"131.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">10</text><text x=\"266.0\" y=\"24\" text-anchor=\"middle\" font-size=\"20\" fill=\"#5b6578\">8</text><text x=\"36\" y=\"92.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">10</text><rect x=\"46\" y=\"34\" width=\"170\" height=\"104\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"3\"/><text x=\"131.0\" y=\"93.0\" text-anchor=\"middle\" font-size=\"18\" fill=\"#0A1F3D\">100</text><rect x=\"216\" y=\"34\" width=\"100\" height=\"104\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"3\"/><text x=\"266.0\" y=\"93.0\" text-anchor=\"middle\" font-size=\"18\" fill=\"#0A1F3D\">80</text><text x=\"36\" y=\"181.0\" text-anchor=\"end\" font-size=\"20\" fill=\"#5b6578\">3</text><rect x=\"46\" y=\"138\" width=\"170\" height=\"74\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"3\"/><text x=\"131.0\" y=\"182.0\" text-anchor=\"middle\" font-size=\"18\" fill=\"#0A1F3D\">30</text><rect x=\"216\" y=\"138\" width=\"100\" height=\"74\" fill=\"#F3F8FF\" stroke=\"#0047BA\" stroke-width=\"3\"/><text x=\"266.0\" y=\"182.0\" text-anchor=\"middle\" font-size=\"18\" fill=\"#0A1F3D\">24</text></svg>"}}, {"text": "Add each <b>row</b>: top row 100 + 80 = <b>180</b> (that is 18 × 10). Bottom row 30 + 24 = <b>54</b> (that is 18 × 3)."}, {"text": "Those two rows are the <b>partial products</b>.", "visual": {"kind": "area", "b": 18, "split": [10, 3], "show": true}}, {"text": "180 + 54 = <b>234</b>. Check: 234 is close to our estimate of 200. ✅"}], "tip": "18 × 13 = 234. Remember this one. It is our anchor example.", "notes": {"do": "Hands-on: on grid paper he draws an 18 by 13 rectangle, cuts a line after 10 across and 10 down, and colors the 4 pieces. He counts each piece by multiplying.", "say": "Look: the top row is 18 × 10 and the bottom row is 18 × 3. Those two rows are exactly what the stacked method writes down.", "ask": "Which row is 18 × 10? Which row is 18 × 3? How do we know 234 is reasonable?", "listen": "Top row 180, bottom row 54. 234 is close to 200. If he adds only three boxes, have him count the pieces of paper: four."}}, {"type": "learn", "kick": "Learn", "title": "Partial products, stacked", "text": "Now write the same two rows in a stack. Same math, less drawing.", "visual": {"kind": "longdiv", "text": "    18\n  × 13\n------\n    54   ← 18 × 3\n + 180   ← 18 × 10\n------\n   234"}, "steps": [{"text": "<b>Step 1.</b> Multiply 18 by the <b>ones</b> digit, 3: 18 × 3 = <b>54</b>. Write it on the first row."}, {"text": "<b>Step 2.</b> The 1 in 13 is really <b>1 ten</b>. Write a <b>0</b> in the ones place first. Then 18 × 1 = 18 goes in front of it: <b>180</b>."}, {"text": "<b>Step 3.</b> Add the rows: 54 + 180 = <b>234</b>. Same answer as the area model."}], "tip": "The 0 in the second row is not extra. It is there because you are multiplying by tens.", "notes": {"do": "He copies the stack onto paper, with the ones digits lined up in one column. Have him point to the 54 box and the 180 box on his grid paper.", "say": "The first row is the bottom row of the area model. The second row is the top row. The 0 says: this row is tens.", "ask": "What happens if you forget the 0?", "listen": "You get 54 + 18 = 72, which is far from 200. The estimate catches it."}}, {"type": "talk", "kick": "Explain it", "title": "Why the 0?", "text": "Say it in your own words before we go on.", "visual": {"kind": "bigtext", "text": "18 × 13 = 54 + 180 = 234"}, "prompts": ["Why does the second row start with a <b>0</b>?", "Which box or row of the area model matches 54? Which matches 180?", "How does the estimate help you check 234?"], "starters": ["The 0 is there because …", "54 matches …", "234 is reasonable because …"], "notes": {"do": "He explains; you play the confused student. Say: 'I think it should be 54 + 18 = 72.' He has to convince you.", "listen": "We are multiplying by 1 ten, not 1. 18 × 10 = 180. 72 is nowhere near 200."}}, {"type": "tap", "kick": "Guided practice", "title": "Your turn: 24 × 13", "text": "Estimate first: 20 × 10 = 200. Stack it on paper, then type.", "items": [{"type": "fill", "q": "24 × 13: what is the first partial product, <b>24 × 3</b>?", "answers": ["72"], "why": "24 × 3 = <b>72</b>.", "no": "Multiply 24 by the ones digit, 3.", "hint": "4 × 3 = 12 (write 2, regroup 1). 2 × 3 = 6, plus 1 = 7."}, {"type": "fill", "q": "What is the second partial product, <b>24 × 10</b>?", "answers": ["240"], "why": "Write the 0, then 24 × 1 = 24: <b>240</b>.", "no": "The 1 in 13 is 1 ten. Write the 0 first.", "hint": "24 tens = 240."}, {"type": "fill", "q": "Add the rows. <b>24 × 13 = ____</b>", "answers": ["312"], "why": "72 + 240 = <b>312</b>. Close to 200? Yes, it is the right size.", "no": "Add 72 and 240.", "hint": "72 + 240: ones 2, tens 7 + 4 = 11 (regroup), hundreds 2 + 1 = 3."}], "notes": {"do": "He talks through each step out loud as he writes. You only ask questions; you do not write for him.", "ask": "Where did you regroup? Where does the 0 go?", "listen": "In 24 × 3: 4 × 3 = 12, write 2, regroup 1, then 2 × 3 = 6 + 1 = 7. Watch his pencil at the regroup."}}, {"type": "learn", "kick": "Learn", "title": "The standard algorithm: Malik's mural", "text": "Now the real mural: <b>24 × 18</b>. Estimate: 20 × 20 = <b>400</b>. This one needs <b>regrouping</b>.", "visual": {"kind": "longdiv", "text": "    24\n  × 18\n------\n   192   ← 24 × 8\n + 240   ← 24 × 10\n------\n   432"}, "steps": [{"text": "<b>Ones row.</b> 8 × 4 = 32. Write <b>2</b>, regroup the <b>3</b> (write a small 3 above the 2 in 24)."}, {"text": "8 × 2 = 16. Add the regrouped 3: 16 + 3 = <b>19</b>. The first row is <b>192</b>."}, {"text": "<b>Tens row.</b> Cross out the small 3. Write the <b>0</b> first. 1 × 4 = 4, 1 × 2 = 2. The second row is <b>240</b>."}, {"text": "<b>Add the rows.</b> 192 + 240 = <b>432</b>."}, {"text": "<b>Check.</b> 432 is close to 400. ✅ Malik needs <b>432 tiles</b>."}], "tip": "Multiply first, THEN add the regrouped number. Cross it out when you are done with it.", "notes": {"do": "Model it on the whiteboard, slowly, with the small regrouped 3 written in a different color. Then erase and have him do it on paper with you watching his pencil.", "say": "Multiply, then add the little number. Never add first.", "ask": "Why do we cross out the 3 before the tens row? Look back at your guess from the start of class. How close was it?", "listen": "The 3 belongs only to the ones row. If it stays, he may add it again in the tens row (a very common mistake)."}}, {"type": "tap", "kick": "You lead", "title": "Teach me: 26 × 15", "text": "Estimate, stack it on paper, then type each step.", "items": [{"type": "fill", "q": "Estimate <b>26 × 15</b>. Round 26 to 30 and 15 to 20. 30 × 20 = ____", "answers": ["600"], "why": "30 × 20 = <b>600</b>. The answer should be in the hundreds.", "no": "3 × 2 = 6, then two zeros.", "hint": "3 tens × 2 tens = 6 hundreds."}, {"type": "fill", "q": "First partial product: <b>26 × 5 = ____</b>", "answers": ["130"], "why": "6 × 5 = 30 (write 0, regroup 3). 2 × 5 = 10, plus 3 = 13. <b>130</b>.", "no": "Multiply 26 by 5. Watch the regroup.", "hint": "6 × 5 = 30. Write 0, regroup 3."}, {"type": "fill", "q": "Second partial product: <b>26 × 10 = ____</b>", "answers": ["260"], "why": "Write the 0, then 26 × 1 = 26: <b>260</b>.", "no": "The 1 in 15 is 1 ten.", "hint": "26 tens = 260."}, {"type": "fill", "q": "<b>26 × 15 = ____</b>", "answers": ["390"], "why": "130 + 260 = <b>390</b>.", "no": "Add your two rows.", "hint": "130 + 260: 0 ones, 9 tens, 3 hundreds."}], "notes": {"do": "He is the teacher now. He tells you each step and you write exactly what he says on the whiteboard, even if it is wrong. Let him catch it.", "ask": "Is 390 reasonable if our estimate was 600?", "listen": "Yes, it is the right size (hundreds). Rounding both factors up made the estimate high. 3,900 or 39 would not be reasonable."}}, {"type": "learn", "kick": "Learn", "title": "Bigger numbers, same steps: 136 × 12", "text": "A 3-digit factor just means a longer row. Estimate: 140 × 10 = <b>1,400</b>.", "visual": {"kind": "longdiv", "text": "    136\n   × 12\n-------\n    272   ← 136 × 2\n + 1360   ← 136 × 10\n-------\n   1632"}, "steps": [{"text": "<b>Ones row.</b> 136 × 2: 6 × 2 = 12 (write 2, regroup 1). 3 × 2 = 6 + 1 = 7. 1 × 2 = 2. Row: <b>272</b>."}, {"text": "<b>Tens row.</b> Write the 0. 136 × 1 = 136. Row: <b>1,360</b>."}, {"text": "<b>Add.</b> 272 + 1,360 = <b>1,632</b>. Close to 1,400. ✅", "visual": {"kind": "area", "b": 136, "split": [10, 2], "show": true}}], "tip": "Line up the ones. Every digit stays in its own column.", "notes": {"do": "He copies it on paper. If his columns drift, have him turn lined paper sideways so the lines make columns.", "ask": "How many partial products are there? Why only two when 136 has three digits?", "listen": "Two rows because 12 has two digits (ones and tens). The length of each row comes from 136."}}, {"type": "tap", "kick": "Try it", "title": "Your turn: 213 × 14", "text": "Estimate: 210 × 10 = 2,100. Stack it on paper.", "items": [{"type": "fill", "q": "First partial product: <b>213 × 4 = ____</b>", "answers": ["852"], "why": "3 × 4 = 12 (write 2, regroup 1). 1 × 4 = 4 + 1 = 5. 2 × 4 = 8. <b>852</b>.", "no": "Multiply each digit of 213 by 4, starting with the ones.", "hint": "3 × 4 = 12. Write 2, regroup 1."}, {"type": "fill", "q": "<b>213 × 14 = ____</b>", "answers": ["2,982", "2982"], "why": "852 + 2,130 = <b>2,982</b>. Close to 2,100? It is the right size.", "no": "Second row: write the 0, then 213. Add the two rows.", "hint": "852 + 2,130."}], "notes": {"do": "He does it on paper with no help. Watch the ones column line up.", "listen": "Rows 852 and 2,130; total 2,982. If he types 1,065 he forgot the 0 (852 + 213)."}}, {"type": "tap", "kick": "Find the mistake", "title": "Be the checker", "text": "Each problem has one mistake. Find it.", "items": [{"q": "Someone wrote: <b>18 × 13 = 54 + 18 = 72</b>. What went wrong?", "visual": {"kind": "longdiv", "text": "   18\n × 13\n -----\n   54\n + 18\n -----\n   72"}, "choices": ["8 × 3 is not 24", "The second row needs a 0: 18 × 10 = 180", "54 + 18 is not 72", "Nothing. 72 is right."], "a": 1, "why": "The 1 in 13 is 1 ten, so the second row is 180. 54 + 180 = 234.", "no": ["8 × 3 = 24 is right. The mistake is later.", null, "54 + 18 is 72. The adding is fine; the row is wrong.", "Estimate: 20 × 10 = 200. 72 is far too small."]}, {"q": "Someone wrote: <b>34 × 26 = 184 + 680 = 864</b>. What went wrong?", "choices": ["34 × 20 should be 68", "The rows were added wrong", "Nothing. 864 is right.", "34 × 6 should be 204. The regrouped 2 was never added."], "a": 3, "why": "4 × 6 = 24: write 4, regroup 2. 3 × 6 = 18, plus 2 = 20. So 34 × 6 = 204, and 204 + 680 = 884.", "no": ["34 × 20 = 680. It needs the 0.", "184 + 680 is 864. The adding is fine; the first row is wrong.", "Check 34 × 6 again: 4 × 6 = 24. Where did the 2 go?", null]}, {"q": "Someone wrote: <b>47 × 23 = 141 + 940 = 1,181</b>. What went wrong?", "choices": ["The rows were added wrong: 141 + 940 = 1,081", "47 × 3 should be 121", "47 × 20 should be 94", "Nothing. 1,181 is right."], "a": 0, "why": "47 × 3 = 141 and 47 × 20 = 940 are both right. 141 + 940 = 1,081.", "no": [null, "7 × 3 = 21 (write 1, regroup 2). 4 × 3 = 12 + 2 = 14. 141 is right.", "47 × 20 needs the 0: 940 is right.", "Add the rows again, one column at a time."]}], "notes": {"do": "He checks each row himself on paper before choosing. He must say WHICH row is wrong and WHY.", "say": "These are the three mistakes that cost the most points: the missing 0, the forgotten regroup, and adding the rows.", "ask": "Which mistake would the estimate catch? Which ones would it NOT catch?", "listen": "The estimate catches the missing 0 (72 vs 200). It does not catch 864 vs 884 or 1,181 vs 1,081; those are close. For those you have to recheck each step."}}, {"type": "tap", "kick": "Mural problems", "title": "Ordering tiles", "text": "Estimate, stack it on paper, then type just the number.", "items": [{"type": "fill", "q": "Tiles come in boxes of <b>36</b>. Malik orders <b>12</b> boxes. How many tiles is that?", "answers": ["432", "432 tiles"], "why": "36 × 12 = 72 + 360 = <b>432</b> tiles. That is exactly enough for the 24 × 18 mural!", "no": "12 equal boxes of 36. Multiply 36 × 12.", "hint": "36 × 2 = 72. 36 × 10 = 360."}, {"type": "fill", "q": "Each box of tiles costs <b>$19</b>. Malik adds a spare box, so he buys <b>13</b> boxes. How many dollars?", "answers": ["$247", "247", "247 dollars"], "why": "19 × 13 = 57 + 190 = <b>$247</b>.", "no": "13 boxes at $19 each. Multiply.", "hint": "19 × 3 = 57. 19 × 10 = 190."}, {"q": "The art budget is <b>$250</b>. Can Malik buy <b>14</b> boxes at $19 each?", "choices": ["Yes. 14 boxes cost $246.", "No. 14 boxes cost $256.", "Yes. $266 is less than $250.", "No. 14 boxes cost $266, which is $16 too much."], "a": 3, "why": "19 × 14 = 76 + 190 = $266. $266 − $250 = $16 over the budget.", "no": ["Check 19 × 4: 9 × 4 = 36, write 6, regroup 3. 1 × 4 = 4 + 3 = 7. So 76, not 56.", "19 × 4 = 76, not 66. Recheck the regroup.", "$266 is MORE than $250.", null]}], "notes": {"do": "He reads each problem aloud, says the estimate, then solves on paper.", "ask": "What does the 36 × 12 answer tell Mali
