<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan · Lesson 4: Elena&#x27;s Market Stand and The Sleep Study</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "ethan", "studentName": "Ethan", "id": "bb-ethan-L04", "label": "Lesson 4", "title": "Elena's Market Stand and The Sleep Study", "goal": "I can multiply decimals and put the decimal point in the right place, line up decimal points to total an order and make change, and tell how a nonfiction text is built.", "date": "2026-12-02", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Elena's Market Stand: On Your Own", "text": "In class you learned to multiply decimals, line up decimal points to add and subtract, and find a text's structure. Now you do it on your own. Keep paper and a pencil next to you. Work every decimal problem on paper first.", "visual": {"kind": "emoji", "text": "🥕⚖️💵😴"}}, {"type": "talk", "kick": "Say it", "title": "Explain it out loud", "text": "Say these to a grown-up, or say them out loud to yourself.", "prompts": ["Why is 2.4 × 0.3 not 7.2? How does an estimate catch the mistake?", "When do you line up the decimal points, and when do you count decimal places instead?", "How is Source A built? How is Source B built? Name a signal word from each."], "starters": ["It can't be 7.2 because …", "When I add or subtract, I … When I multiply, I …", "Source A is … because … Source B is … because …"]}, {"type": "vocab", "kick": "Word Power", "title": "Review your words", "text": "Say the meaning out loud first. Then flip the card to check yourself.", "words": [{"word": "decimal", "pos": "noun", "meaning": "A number that uses a decimal point to show parts of a whole.", "example": "2.6 pounds is a <b>decimal</b>: 2 whole pounds and 6 tenths of a pound.", "emoji": "🔢"}, {"word": "decimal point", "pos": "noun", "meaning": "The dot that separates the whole number from the parts of a whole.", "example": "In $4.35, the <b>decimal point</b> sits between the 4 dollars and the 35 cents.", "emoji": "📍"}, {"word": "tenths", "pos": "noun", "meaning": "The first place after the decimal point. 10 tenths make 1 whole.", "example": "In 2.6, the 6 is in the <b>tenths</b> place. A dime is one tenth of a dollar.", "emoji": "🪙"}, {"word": "hundredths", "pos": "noun", "meaning": "The second place after the decimal point. 100 hundredths make 1 whole.", "example": "In $4.35, the 5 is in the <b>hundredths</b> place. A penny is one hundredth of a dollar.", "emoji": "💯"}, {"word": "decimal places", "pos": "noun", "meaning": "The number of digits after the decimal point.", "example": "3.38 has 2 <b>decimal places</b>. 20.4 has 1.", "emoji": "👉"}, {"word": "per", "pos": "preposition", "meaning": "For each one.", "example": "Apples cost $1.30 <b>per</b> pound: $1.30 for each pound.", "emoji": "⚖️"}, {"word": "reasonable", "pos": "adjective", "meaning": "Makes sense, because it is close to your estimate.", "example": "3.38 is a <b>reasonable</b> answer for 2.6 × 1.3, because 3 × 1 = 3.", "emoji": "✅"}, {"word": "text structure", "pos": "noun", "meaning": "The pattern a writer uses to organize information.", "example": "Sequence is a <b>text structure</b>: it puts events in time order.", "emoji": "🏗️"}, {"word": "cause and effect", "pos": "noun", "meaning": "A text structure that tells WHY something happens and WHAT happens because of it.", "example": "“Because it rained, fewer customers came” is <b>cause and effect</b>.", "emoji": "⛈️"}, {"word": "problem and solution", "pos": "noun", "meaning": "A text structure that names a problem, then tells how it was fixed.", "example": "“The stand ran out of quarters. To fix it, Dad brought a roll from the bank” is <b>problem and solution</b>.", "emoji": "🔧"}, {"word": "sequence", "pos": "noun", "meaning": "A text structure that tells events or steps in time order.", "example": "“First wash, next weigh, finally sell” is a <b>sequence</b>.", "emoji": "1️⃣"}, {"word": "signal words", "pos": "noun", "meaning": "Words that hint at the text structure.", "example": "<b>Because</b> and <b>as a result</b> are <b>signal words</b> for cause and effect.", "emoji": "🚦"}, {"word": "source", "pos": "noun", "meaning": "A text, study, or person that information comes from.", "example": "A science magazine article is a <b>source</b> for a report.", "emoji": "📄"}, {"word": "synthesize", "pos": "verb", "meaning": "To combine ideas from more than one source into one bigger understanding.", "example": "When you use Source A AND Source B in one sentence, you <b>synthesize</b>.", "emoji": "🧩"}]}, {"type": "learn", "kick": "Remember", "title": "Multiply, then line up", "text": "<b>3.6 × 1.5</b>, then add <b>2.75</b>", "visual": {"kind": "bigtext", "text": "3.6 × 1.5 = 5.4", "sub": "36 × 15 = 540 · 2 decimal places"}, "steps": [{"text": "<b>1. Estimate.</b> 3.6 is about 4 and 1.5 is between 1 and 2, so the answer is between 4 and 8."}, {"text": "<b>2. Multiply without the points.</b> 36 × 15 = 540."}, {"text": "<b>3. Count ALL the decimal places.</b> 1 + 1 = 2. 540 → 5.40 = <b>5.4</b>. Between 4 and 8, so it is reasonable. ✅"}, {"text": "<b>4. Now add 2.75. Line up the points.</b> 5.40 + 2.75 = <b>8.15</b>.", "visual": {"kind": "longdiv", "text": "   5.40\n+  2.75\n-------\n   8.15"}}], "tip": "Multiply: count places. Add or subtract: line up the points."}, {"type": "tap", "kick": "Try it", "title": "Decimal × whole number", "text": "Estimate, multiply, count the places. Paper first.", "items": [{"type": "fill", "q": "<b>5.3 × 4 = ____</b>", "answers": ["21.2"], "why": "Estimate: 5 × 4 = 20. 53 × 4 = 212. 1 decimal place → <b>21.2</b>. ✅", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "53 × 4 = 212.", "placeholder": "Example: 2.5"}, {"type": "fill", "q": "Jam costs <b>$3.65 a jar</b>. A customer buys <b>3 jars</b>. <b>$____</b>", "answers": ["10.95", "$10.95"], "why": "Estimate: 4 × 3 = 12. 365 × 3 = 1,095. 2 decimal places → <b>$10.95</b>. ✅", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "365 × 3 = 1,095.", "placeholder": "Example: 2.50"}, {"type": "fill", "q": "<b>0.7 × 6 = ____</b>", "answers": ["4.2"], "why": "7 × 6 = 42. 1 decimal place → <b>4.2</b>. 0.7 is less than 1, so the answer is less than 6. ✅", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "7 × 6 = 42.", "placeholder": "Example: 2.5"}]}, {"type": "tap", "kick": "Try it", "title": "Decimal × decimal", "text": "Count ALL the decimal places.", "items": [{"type": "fill", "q": "<b>1.5 × 2.2 = ____</b>", "answers": ["3.3", "3.30"], "why": "Estimate: 2 × 2 = 4, a bit less. 15 × 22 = 330. 2 decimal places → 3.30 = <b>3.3</b>.", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "15 × 22 = 330.", "placeholder": "Example: 2.5"}, {"type": "fill", "q": "Walnuts cost <b>$9.60 per pound</b>. A customer wants <b>half a pound</b>. <b>0.5 × $9.60 = $____</b>", "answers": ["4.80", "$4.80", "4.8", "$4.8"], "why": "Half of $9.60 is <b>$4.80</b>.", "no": "× 0.5 means half.", "hint": "Half of $9 is $4.50. Half of 60 cents is 30 cents.", "placeholder": "Example: 2.50"}, {"type": "fill", "q": "Type <b>3/5</b> as a decimal: <b>3/5 = ____</b>", "answers": ["0.6", ".6", "0.60"], "why": "1/5 = 0.2, so 3/5 = 0.2 + 0.2 + 0.2 = <b>0.6</b>. (3/5 = 6/10.)", "no": "Start from 1/5 = 0.2. How much is three of them?", "hint": "1/5 = 0.2.", "placeholder": "Example: 0.5"}]}, {"type": "tap", "kick": "Try it", "title": "Line up the points", "text": "Line up the points on paper. Then type.", "items": [{"type": "fill", "q": "<b>6.4 + 3.75 = ____</b>", "answers": ["10.15"], "why": "Write 6.4 as 6.40. 6.40 + 3.75 = <b>10.15</b>.", "no": "Line up the decimal points, one digit under the other. Fill empty places with 0. Then add or subtract from the right, and put the point straight down.", "hint": "Write 6.4 as 6.40.", "placeholder": "Example: 2.50"}, {"type": "fill", "q": "<b>12 − 4.38 = ____</b>", "answers": ["7.62"], "why": "Write 12 as 12.00. 12.00 − 4.38 = <b>7.62</b>. Check: 4.38 + 7.62 = 12.00. ✅", "no": "Line up the decimal points, one digit under the other. Fill empty places with 0. Then add or subtract from the right, and put the point straight down.", "hint": "Write 12 as 12.00.", "placeholder": "Example: 2.50"}, {"type": "fill", "q": "An order costs <b>$7.45</b>. The customer pays with a <b>$20 bill</b>. How much change? <b>$____</b>", "answers": ["12.55", "$12.55"], "why": "Count up: $7.45 → $8 is 55 cents, $8 → $20 is $12. Change: <b>$12.55</b>.", "no": "Line up the decimal points, one digit under the other. Fill empty places with 0. Then add or subtract from the right, and put the point straight down.", "hint": "Count up from $7.45 to $8, then to $20.", "placeholder": "Example: 2.50"}]}, {"type": "tap", "kick": "Read", "title": "Source C", "text": "Read Source C. Then answer.", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Another source for your sleep report</span><br><b>Source C · Kids' Health Page</b><br><b>Screens Before Bed</b><br>“Many kids use a tablet or a phone right before bed. The bright light from a screen tells the brain that it is still daytime. Because of this, the body makes less of the chemical that helps us feel sleepy. As a result, kids who use a screen in bed often fall asleep about 30 minutes later than kids who read a paper book instead.”"}, "items": [{"type": "fill", "q": "What text structure does Source C use? Type it.", "answers": ["cause and effect", "cause & effect", "cause-and-effect", "cause effect", "cause/effect"], "why": "Source C explains WHY (screen light) and WHAT happens (less of the sleepy chemical, falling asleep later). That is <b>cause and effect</b>.", "no": "Does it explain why, fix a problem, or give steps?", "hint": "Look for “because of this” and “as a result.”"}, {"type": "fill", "q": "Kids who use a screen in bed fall asleep about how many minutes later? Type the number.", "answers": ["30", "thirty", "30 minutes", "thirty minutes", "about 30"], "why": "Source C says “about <b>30</b> minutes later.”", "no": "Look at the last sentence.", "hint": "It is half an hour."}, {"q": "Which is the CAUSE in Source C?", "choices": ["Kids who use screens fall asleep about 30 minutes later", "Bright screen light tells the brain it is daytime", "Some kids read a paper book in bed instead of a tablet", "Kids get tired after a long day at school"], "a": 1, "why": "The screen's bright light comes first and starts everything else. Falling asleep later is the <b>effect</b>.", "no": ["That is the EFFECT, the result at the end.", null, "Reading a paper book is what the other kids do. It is not what causes the problem.", "Source C never says this. It starts with the screen's bright light."]}]}, {"type": "tap", "kick": "Read", "title": "Source D, then synthesize", "text": "Read Source D. Then use it with Source C.", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Another source for your sleep report</span><br><b>Source D · Family Magazine</b><br><b>How to Build a Better Bedtime</b><br>“First, turn off every screen one hour before bed. Next, take a warm bath or shower. Then read a paper book for 15 minutes. Finally, turn off the light at the same time every night, even on weekends.”"}, "items": [{"q": "What text structure does Source D use?", "choices": ["Cause and effect", "Problem and solution", "Compare and contrast", "Sequence"], "a": 3, "why": "First, next, then, finally: the steps are in time order. That is a <b>sequence</b>.", "no": ["It gives no reasons why. It gives steps.", "It never names a problem.", "It does not compare two things.", null]}, {"type": "fill", "q": "What do you do right AFTER you turn off every screen? Type it.", "answers": ["take a warm bath or shower", "bath or shower", "take a bath or shower", "warm bath or shower", "bath", "shower", "take a bath", "take a shower", "a warm bath", "a bath"], "why": "“Next, take a warm <b>bath or shower</b>.”", "no": "Look at the sentence that starts with Next.", "hint": "It uses warm water."}, {"q": "Which sentence <b>synthesizes</b> Source C and Source D?", "choices": ["Source D gives four steps for bedtime, starting with turning off every screen an hour before bed (Source D).", "Kids should never use screens at all, because screens are bad for everyone all day long.", "Screen light makes kids fall asleep later (Source C), so turn screens off an hour before bed (Source D).", "Source C is about screen light and sleep, and Source D is about baths, books and bedtime steps."], "a": 2, "why": "It connects the cause from Source C to the first step in Source D, and names both sources. That is <b>synthesizing</b>.", "no": ["That uses only one source.", "That is an opinion with no source, and neither source says that.", null, "That lists both sources, but it does not connect their ideas."]}]}, {"type": "tap", "kick": "Word Power", "title": "Use your words", "text": "Type the word from memory.", "items": [{"type": "fill", "q": "In $3.45, the dot between the 3 and the 4 is the ________.", "answers": ["decimal point", "the decimal point", "a decimal point", "point"], "why": "That dot is the <b>decimal point</b>.", "no": "It is two words. The second word is point.", "hint": "It starts with d-e-c."}, {"type": "fill", "q": "In 2.6, the 6 is in the ________ place.", "answers": ["tenths", "tenth", "the tenths"], "why": "The first place after the decimal point is the <b>tenths</b> place.", "no": "It is the FIRST place after the decimal point.", "hint": "It starts with t-e-n."}, {"type": "fill", "q": "A text structure that tells steps in time order is a ________.", "answers": ["sequence", "time order"], "why": "That is a <b>sequence</b>.", "no": "First, next, then, finally.", "hint": "It starts with s-e-q."}, {"type": "fill", "q": "Source A, a science magazine article, is one ________ for your report.", "answers": ["source"], "why": "A text that information comes from is a <b>source</b>.", "no": "Where information comes from.", "hint": "It starts with s-o-u."}]}, {"type": "recall", "kick": "Remember", "title": "Lessons 1, 2 and 3", "text": "Keep these skills sharp for Lesson 5.", "items": [{"type": "fill", "q": "Lesson 1: <b>46 × 37 = ____</b>", "answers": ["1,702", "1702"], "why": "46 × 7 = 322 and 46 × 30 = 1,380. 322 + 1,380 = <b>1,702</b>.", "no": "Ones row, then write the 0 for the tens row, then add.", "hint": "46 × 7 = 322."}, {"type": "fill", "q": "Lesson 2: <b>783 ÷ 9 = ____</b>", "answers": ["87", "87 R0", "87 remainder 0"], "why": "7 ÷ 9 is 0, so start with 78. 78 ÷ 9 → 8 (8 × 9 = 72), 6 left. Bring down 3: 63 ÷ 9 → 7 (7 × 9 = 63), 0 left. <b>87</b>. Check: 9 × 87 = 783.", "no": "9 doesn't go into 7, so start with 78. Divide, multiply, subtract, bring down.", "hint": "78 ÷ 9 → 8."}, {"type": "fill", "q": "Lesson 3: <b>5/6 − 1/4 = ____</b> Type it in simplest form.", "answers": ["7/12"], "why": "Common denominator 12: 5/6 = 10/12 and 1/4 = 3/12. 10/12 − 3/12 = <b>7/12</b>.", "no": "Rename both with a common denominator, then subtract only the numerators.", "hint": "Use 12.", "placeholder": "Example: 3/4"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "<b>6.3 × 4 = ____</b>", "answers": ["25.2"], "why": "Estimate: 6 × 4 = 24. 63 × 4 = 252. 1 decimal place → <b>25.2</b>.", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "63 × 4 = 252.", "placeholder": "Example: 2.5"}, {"type": "fill", "q": "Elena sells <b>4 bunches of carrots at $1.85 each</b>. What is the total? <b>$____</b>", "answers": ["7.40", "$7.40", "7.4", "$7.4"], "why": "Estimate: 2 × 4 = 8. 185 × 4 = 740. 2 decimal places → <b>$7.40</b>.", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "185 × 4 = 740.", "placeholder": "Example: 2.50"}, {"type": "fill", "q": "<b>2.4 × 1.5 = ____</b>", "answers": ["3.6", "3.60"], "why": "Estimate: 2 × 2 = 4. 24 × 15 = 360. 2 decimal places → 3.60 = <b>3.6</b>.", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "24 × 15 = 360.", "placeholder": "Example: 2.5"}, {"q": "Where does the decimal point go? <b>0.4 × 3.2 = ?</b>", "choices": ["12.8", "1.28", "0.128", "128"], "a": 1, "why": "4 × 32 = 128. 0.4 has 1 place and 3.2 has 1: 2 places → <b>1.28</b>. Estimate: 0.4 is less than half, and half of 3.2 is 1.6, so the answer is a bit less than 1.6.", "no": ["That counts only 1 decimal place. There are 2 in all.", null, "That is 3 decimal places. Count: 1 + 1 = 2.", "128 has no decimal point. Count the places in both factors."]}, {"type": "fill", "q": "An order costs <b>$11.65</b>. The customer pays with a <b>$20 bill</b>. How much change? <b>$____</b>", "answers": ["8.35", "$8.35"], "why": "Count up: $11.65 → $12 is 35 cents, $12 → $20 is $8. Change: <b>$8.35</b>.", "no": "Line up the decimal points, one digit under the other. Fill empty places with 0. Then add or subtract from the right, and put the point straight down.", "hint": "Count up from $11.65 to $12, then to $20.", "placeholder": "Example: 2.50"}, {"type": "fill", "q": "In <b>5.72</b>, the 2 is in the ________ place.", "answers": ["hundredths", "hundredth", "the hundredths", "hundreths"], "why": "The second place after the decimal point is the <b>hundredths</b> place.", "no": "Count the places after the decimal point.", "hint": "It starts with h-u-n."}, {"q": "What text structure does this source use?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Practice source</span><br><b>The Lunch Line Fix</b><br>“At Palm Elementary, the lunch line was so long that some students had only ten minutes to eat. To solve the problem, the principal opened a second serving window and sent each grade to lunch five minutes apart. Now every student gets at least twenty minutes to eat.”"}, "choices": ["Cause and effect", "Sequence", "Problem and solution", "Compare and contrast"], "a": 2, "why": "It names a problem (only ten minutes to eat) and then the fix (a second window, grades five minutes apart). That is <b>problem and solution</b>.", "no": ["It does more than explain why: it tells how the problem was FIXED.", "It does not give steps in time order.", null, "It does not compare two things."]}, {"q": "Which detail is the SOLUTION?", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Practice source</span><br><b>The Lunch Line Fix</b><br>“At Palm Elementary, the lunch line was so long that some students had only ten minutes to eat. To solve the problem, the principal opened a second serving window and sent each grade to lunch five minutes apart. Now every student gets at least twenty minutes to eat.”"}, "choices": ["A second serving window, and grades going to lunch five minutes apart", "Some students had only ten minutes to eat because the line was so long", "Every student now gets at least twenty minutes to eat lunch", "The lunch line at Palm Elementary was too long for everyone"], "a": 0, "why": "“To solve the problem, the principal <b>opened a second serving window and sent each grade to lunch five minutes apart</b>.”", "no": [null, "That is the problem, not the fix.", "That is the RESULT after the fix, not the fix itself.", "That is the problem, not the fix."]}, {"type": "fill", "q": "Before the fix, some students had how many minutes to eat? Type the number.", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Practice source</span><br><b>The Lunch Line Fix</b><br>“At Palm Elementary, the lunch line was so long that some students had only ten minutes to eat. To solve the problem, the principal opened a second serving window and sent each grade to lunch five minutes apart. Now every student gets at least twenty minutes to eat.”"}, "answers": ["10", "ten", "10 minutes", "ten minutes", "only 10", "only ten"], "why": "“Some students had only <b>ten</b> minutes to eat.”", "no": "Look at the first sentence.", "hint": "It is less than twenty."}, {"type": "fill", "q": "To combine ideas from more than one source into one answer is to ________.", "answers": ["synthesize", "synthesise", "synthesizing", "synthesis"], "why": "That is to <b>synthesize</b>.", "no": "You did this with Source A and Source B.", "hint": "It starts with s-y-n."}], [{"type": "fill", "q": "<b>7.4 × 6 = ____</b>", "answers": ["44.4"], "why": "Estimate: 7 × 6 = 42. 74 × 6 = 444. 1 decimal place → <b>44.4</b>.", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "74 × 6 = 444.", "placeholder": "Example: 2.5"}, {"type": "fill", "q": "Elena sells <b>3 pies at $6.45 each</b>. What is the total? <b>$____</b>", "answers": ["19.35", "$19.35"], "why": "Estimate: 6 × 3 = 18. 645 × 3 = 1,935. 2 decimal places → <b>$19.35</b>.", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "645 × 3 = 1,935.", "placeholder": "Example: 2.50"}, {"type": "fill", "q": "<b>3.5 × 1.2 = ____</b>", "answers": ["4.2", "4.20"], "why": "Estimate: 4 × 1 = 4. 35 × 12 = 420. 2 decimal places → 4.20 = <b>4.2</b>.", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "35 × 12 = 420.", "placeholder": "Example: 2.5"}, {"q": "Where does the decimal point go? <b>0.6 × 0.7 = ?</b>", "choices": ["4.2", "42", "0.042", "0.42"], "a": 3, "why": "6 × 7 = 42. 0.6 has 1 place and 0.7 has 1: 2 places → <b>0.42</b>. Both factors are less than 1, so the answer is less than 1.", "no": ["That counts only 1 place. There are 2 in all.", "42 has no decimal point. Count the places in both factors.", "That is 3 decimal places. Count: 1 + 1 = 2.", null]}, {"type": "fill", "q": "Line up the points: <b>6.5 + 2.75 = ____</b>", "answers": ["9.25"], "why": "Write 6.5 as 6.50. 6.50 + 2.75 = <b>9.25</b>.", arn. <b>Then</b> they load the truck.”", "no": ["Picking comes first, before washing.", "Driving comes AFTER loading the truck.", null, "Waking up is the very start, before picking."]}, {"type": "fill", "q": "By what time is the stand set up? Type the time.", "visual": {"kind": "passage", "text": "<span style=\"font-size:15px;color:#5b6578\">Practice source</span><br><b>Market Morning</b><br>“On market day, Elena's family wakes up at 4:30am. First, they pick the ripest tomatoes and peppers. Next, they wash and weigh everything in the barn. Then they load the truck. Finally, they drive to the market and have the stand set up by 7am.”"}, "answers": ["7", "7am", "7 am", "7:00", "7:00am", "7:00 am", "7 a.m.", "seven", "by 7am", "7 o'clock"], "why": "“…and have the stand set up by <b>7am</b>.”", "no": "Look at the last sentence.", "hint": "It is in the morning, before 8."}, {"type": "fill", "q": "Words like because, first and however that hint at the text structure are called ________ words.", "answers": ["signal", "signal words"], "why": "They are <b>signal</b> words.", "no": "Like a traffic signal, they tell you what is coming.", "hint": "It starts with s-i-g."}], [{"type": "fill", "q": "<b>8.6 × 5 = ____</b>", "answers": ["43", "43.0"], "why": "Estimate: 9 × 5 = 45. 86 × 5 = 430. 1 decimal place → 43.0 = <b>43</b>.", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate.", "hint": "86 × 5 = 430.", "placeholder": "Example: 2.5"}, {"type": "fill", "q": "Elena sells <b>6 bags of apples at $2.35 each</b>. What is the total? <b>$____</b>", "answers": ["14.10", "$14.10", "14.1", "$14.1"], "why": "Estimate: 2 × 6 = 12, a bit more. 235 × 6 = 1,410. 2 decimal places → <b>$14.10</b>.", "no": "Multiply without the decimal points first. Then count the decimal places in BOTH factors and put the point back that many places from the right. Check with an estimate."
