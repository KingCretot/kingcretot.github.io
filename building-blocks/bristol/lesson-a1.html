 boxes of new items to the building.", "🗄️ Stow: workers put each item into a bin on a tall yellow shelf called a pod.", "🛒 Pick: a robot carries the pod to a worker, who takes out the item someone ordered.", "📦 Pack: the item goes in a box or bag, and a machine measures just enough tape.", "🚚 Ship: a machine sticks on the label, and the package slides into the right truck."], "why": "Receive, stow, pick, pack, ship.", "hint": "The item has to come into the building first."}, {"type": "sort", "kick": "Sort it", "title": "Add or multiply?", "text": "Tap a story. Then tap the box.", "buckets": ["✖️ Equal groups: multiply", "➕ Different amounts: add"], "items": [{"text": "5 totes with 4 toys in each", "b": 0, "why": "5 equal groups of 4: 5 × 4 = 20.", "hint": "Is every tote the same?"}, {"text": "7 boxes on one cart and 6 boxes on another", "b": 1, "why": "Different amounts: 7 + 6 = 13.", "hint": "Are the two carts the same?"}, {"text": "6 trucks with 9 packages each", "b": 0, "why": "6 equal groups of 9: 6 × 9 = 54.", "hint": "Each truck has the same number."}, {"text": "8 red bags and 5 blue bags", "b": 1, "why": "Different amounts: 8 + 5 = 13.", "hint": "Two different amounts."}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"q": "What is the tall yellow shelf called?", "choices": ["a pod", "a tote", "a box"], "a": 0, "why": "The tall yellow shelf is a <b>pod</b>.", "no": [null, "A tote is the small yellow tub.", "A box is what the item ships in."]}, {"q": "Which step is first?", "choices": ["receive", "pack", "ship"], "a": 0, "why": "First the items come in: <b>receive</b>.", "no": [null, "Pack comes later.", "Ship is the last step."]}, {"q": "Who brings the pod to the worker?", "choices": ["a robot", "a truck", "a plane"], "a": 0, "why": "A <b>robot</b> carries the pod.", "no": [null, "Trucks work outside.", "Planes fly packages far away."]}, {"type": "fill", "q": "<b>3 totes</b> have <b>6 toys</b> each. How many toys?", "answers": ["18"], "why": "
