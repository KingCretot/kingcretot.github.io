k is about spelling. Two letters can work as a team and make one sound. Today: the ea team.\"", "ask": "\"What are the vowels?\"", "listen": "a, e, i, o, u."}}, {"type": "talk", "kick": "Book Talk", "title": "What's new in my book?", "text": "Think about the book you are reading.", "prompts": ["What happened in your book since Thursday?", "Read one sentence out loud, nice and slow.", "Find a word with <b>e</b> and <b>a</b> side by side."], "starters": ["Since Thursday, …", "My sentence is …", "I found …"], "notes": {"do": "About 6 minutes. She holds the page up to the camera.", "ask": "\"What happened? Read me one sentence.\" \"Did you find a word with e and a side by side?\"", "listen": "Any ea word is a great start (eat, read, each, please). Write it on your whiteboard for later. If she finds none, say: \"You will find lots after today.\""}}, {"type": "recall", "kick": "Remember?", "title": "Last week and math", "items": [{"type": "fill", "q": "We ____ be late. <i>(will not)</i>", "answers": ["won't", "won’t"], "why": "will not → <b>won't</b>.", "no": "The rule-breaker: will changes to wo. Then add n't.", "placeholder": "Type the contraction"}, {"q": "There are <b>6</b> jars. Each jar has <b>7</b> buttons. How many buttons?", "choices": ["13", "42", "48"], "a": 1, "why": "Equal groups: 6 × 7. 5 × 7 = 35. One more 7: <b>42</b>.", "no": ["13 is 6 + 7. Each jar has 7, so multiply.", null, "48 is 6 × 8. Each jar has 7."]}], "notes": {"do": "Zoom: she says the answer and spells won't out loud. You type and tap.", "listen": "w-o-n-apostrophe-t; 42 (the 6s trick: 35 + 7)."}}, {"type": "learn", "kick": "Learn", "title": "What is a vowel team?", "text": "A <b>vowel team</b> is two vowels side by side that make <b>one</b> sound.", "visual": {"kind": "bigtext", "text": "<span style=\"color:#DB2F30\">ea</span>t", "sub": "e and a work together."}, "steps": [{"text": "In <b>eat</b>, the e and the a are a team."}, {"text": "Together they say <b>long e</b>. Long e says its name: <b>E</b>."}, {"text": "Short e is different. It is the sound in <b>bed</b>."}], "tip": "The e does the talking. The a is quiet.", "notes": {"do": "She says long e (\"eee\") and short e (\"eh\") out loud a few times.", "say": "\"Long e says its name, E. Short e says eh, like in bed.\"", "ask": "\"Say eat. Do you hear long e or short e?\"", "listen": "\"Long e.\""}}, {"type": "learn", "kick": "Learn", "title": "ea says long e", "text": "Read each word. Stretch the long e!", "steps": [{"text": "🍎 <b>eat</b>"}, {"text": "📖 <b>read</b> <i>(I like to read.)</i>"}, {"text": "🏖️ <b>beach</b>"}, {"text": "🧼 <b>clean</b>"}, {"text": "💭 <b>dream</b>"}, {"text": "⚽ <b>team</b>"}], "tip": "Hear a long e in the middle of a word? Try <b>ea</b>.", "notes": {"do": "Reveal one word at a time. She reads it, then stretches the long e (\"beeeach\") and spells it out loud.", "ask": "\"Where is the ea in beach? What sound does it make?\"", "listen": "ea in the middle; long e. Use read only in the now sense (I like to read). Do not bring up \"I read it yesterday\" this week."}}, {"type": "learn", "kick": "Fix it", "title": "red or read?", "text": "A student wrote: <i>I like to <b>red</b> books.</i> 🤔", "steps": [{"text": "🟥 <b>red</b> is a color. It has a <b>short e</b>: r-e-d."}, {"text": "📖 <b>read</b> is what you do with a book. It has a <b>long e</b>: r-ea-d."}, {"text": "Say them both: red … reeead. Hear the difference?"}], "tip": "Long e sound? Use the <b>ea</b> team.", "notes": {"do": "She writes red and read on her paper and holds it up.", "say": "\"This is a real mistake that lots of kids make. Now you know how to fix it.\"", "ask": "\"Which one is a color? Which one do you do with a book?\"", "listen": "red is a color (short e); read is with a book (long e, ea)."}}, {"type": "tap", "kick": "We do", "title": "ea or e?", "text": "Say the word. Long e → <b>ea</b>. Short e → <b>e</b>.", "items": [{"type": "fill", "q": "🟥 r__d <i>(a color)</i> <br>What goes in the blank: <b>ea</b> or ng e first. Then try short e.", "notes": {"do": "Reveal one step at a time. She reads head and bread out loud.", "say": "\"ea almost always says long e. A few words are different. When you read, try long e first.\"", "ask": "\"How do you read a new ea word?\"", "listen": "\"Try long e first. If it doesn't make sense, try short e.\""}}, {"type": "sort", "kick": "Sort it", "title": "Long e or short e?", "text": "Read each word out loud. What does the <b>ea</b> say?", "buckets": ["ea says long e (eat)", "ea says short e (head)"], "items": [{"text": "beach", "b": 0, "why": "beach: long e.", "hint": "Say it: beach. Long or short?"}, {"text": "head", "b": 1, "why": "head: short e. One of the few!", "hint": "Say it: head. It rhymes with bed."}, {"text": "clean", "b": 0, "why": "clean: long e.", "hint": "Say it: clean."}, {"text": "bread", "b": 1, "why": "bread: short e. One of the few!", "hint": "Say it: bread. It rhymes with red."}, {"text": "dream", "b": 0, "why": "dream: long e.", "hint": "Say it: dream."}, {"text": "leaf", "b": 0, "why": "leaf: long e.", "hint": "Say it: leaf."}, {"text": "feather", "b": 1, "why": "feather: short e. One of the few!", "hint": "Say it: feather. Does it start like fed?"}, {"text": "team", "b": 0, "why": "team: long e.", "hint": "Say it: team."}], "done": "Most ea words say long e. A few say short e.", "notes": {"do": "She reads each word out loud and names the box. You tap.", "listen": "Long: beach, clean, dream, leaf, team. Short: head, bread, feather."}}, {"type": "tap", "kick": "Try it", "title": "Which spelling is right?", "items": [{"q": "🍑 Which word names this fruit?", "choices": ["pech", "peach", "paech"], "a": 1, "why": "<b>peach</b>: long e, so the ea team.", "no": ["pech has a short e sound. Peach has a long e.", null, "The e comes first in the team: e, then a."]}, {"q": "⚽ My ____ won the game!", "choices": ["taem", "tem", "team"], "a": 2, "why": "<b>team</b>: long e, so the ea team.", "no": ["The e comes first in the team: e, then a.", "tem would say short e. Team has a long e.", null]}, {"q": "🧼 Wash your hands. Get them ____.", "choices": ["clean", "claen", "clen"], "a": 0, "why": "<b>clean</b>: long e, so the ea team.", "no": [null, "The e comes first in the team: e, then a.", "clen would say short e. Clean has a long e."]}], "notes": {"do": "She reads each choice out loud. Then she tells you which one to tap.", "ask": "\"Why is that one wrong?\"", "listen": "peach, team, clean. Two kinds of mistakes: only e (short e), and a before e (ae)."}}, {"type": "talk", "kick": "Hands on", "title": "Build ea words", "text": "Write <b>ea</b> on a sticky note. That is your team!", "prompts": ["On paper, write: <b>s _ t</b>, <b>h _ t</b>, <b>n _ t</b>.", "Put your ea note in each one. Read the new word.", "Now take the note away and write <b>e</b>. Read it again!"], "starters": ["s-ea-t is …", "h-ea-t is …", "With e, it says …"], "notes": {"do": "About 6 minutes. She writes the three frames with a space in the middle, puts the ea sticky note in the space, reads the word, then writes just e and reads that word. She holds each one up to the camera.", "ask": "\"What is the word with ea? What is it with just e?\"", "listen": "seat / set, heat / het (not a word: say so), neat / net. Long e with ea, short e with e. That is the whole idea of the lesson."}}, {"type": "tap", "kick": "Spell it", "title": "Spell the word", "text": "Spell it out loud. Your teacher types it.", "items": [{"type": "fill", "q": "🍃 A ____ fell from the tree. <i>(l _ _ f)</i>", "answers": ["leaf"], "why": "<b>leaf</b>: the <b>ea</b> team says long e.", "no": "Say the word slowly. The long e sound is spelled <b>ea</b>.", "hint": "Fill in the frame l _ _ f. The missing letters are a vowel team.", "placeholder": "Type the word"}, {"type": "fill", "q": "💭 I had a good ____ last night. <i>(dr _ _ m)</i>", "answers": ["dream"], "why": "<b>dream</b>: the <b>ea</b> team says long e.", "no": "Say the word slowly. The long e sound is spelled <b>ea</b>.", "hint": "Fill in the frame dr _ _ m. The missing letters are a vowel team.", "placeholder": "Type the word"}, {"type": "fill", "q": "🦭 The ____ swims in the water. <i>(s _ _ l)</i>", "answers": ["seal"], "why": "<b>seal</b>: the <b>ea</b> team says long e.", "no": "Say the word slowly. The long e sound is spelled <b>ea</b>.", "hint": "Fill in the frame s _ _ l. The missing letters are a vowel team.", "placeholder": "Type the word"}], "notes": {"do": "She spells each word out loud, letter by letter. You type exactly what she says.", "listen": "l-e-a-f, d-r-e-a-m, s-e-a-l. Watch for lef or laef."}}, {"type": "tap", "kick": "Read it", "title": "Which sentence is right?", "items": [{"q": "Read all three. Which one is spelled right?", "choices": ["I like to red books.", "I like to read books.", "I like to reed books."], "a": 1, "why": "You <b>read</b> books. Long e: the ea team.", "no": ["red is a color.", null, "reed is a different word. It is a tall plant that grows by water."]}], "notes": {"do": "She reads all three out loud first.", "listen": "read. She explains red (a color)."}}, {"type": "talk", "kick": "Hands on", "title": "ea hunt in your book", "text": "Look in your book for words with <b>ea</b>.", "prompts": ["Find 2 words with <b>ea</b>. Spell them.", "Read each one. Does the ea say long e or short e?"], "starters": ["I found …", "In …, the ea says …"], "notes": {"do": "About 4 minutes. She hunts and holds up the page.", "listen": "Most will be long e (each, please, eat). If she finds great or break, say: \"Wow, that one is a rule-breaker. It says long a! There are only a few like that.\" If she finds an ea with r (year, near, learn), say: \"The r changes the sound. We will learn those later.\""}}, {"type": "tap", "kick": "Quick check", "title": "Show me", "items": [{"type": "fill", "q": "Read the word <b>head</b>. Does the ea say long e or short e? <br>Type <b>long</b> or <b>short</b>.", "answers": ["short", "short e"], "why": "head: the ea says <b>short e</b>. One of the few!", "no": "Try long e first: heed? Does that name the top of your body?", "placeholder": "long or short"}, {"type": "fill", "q": "☀️ The ____ from the fire keeps us warm. <i>(h _ _ t)</i>", "answers": ["heat"], "why": "<b>heat</b>: the <b>ea</b> team says long e.", "no": "Say the word slowly. The long e sound is spelled <b>ea</b>.", "hint": "Fill in the frame h _ _ t. The missing letters are a vowel team.", "placeholder": "Type the word"}], "notes": {"do": "On her own, no help.", "listen": "short; h-e-a-t."}}, {"type": "talk", "kick": "Wrap-up", "title": "What did you learn?", "prompts": ["What is a <b>vowel team</b>?", "What does the <b>ea</b> team usually say?", "What do you do when long e does not make sense?"], "starters": ["A vowel team is …", "ea usually says …", "I try …"], "notes": {"do": "Stop sharing for the first question. Then share the course page and show tonight's task list.", "say": "\"Tonight: the After-Class Lesson and 10 minutes of reading. Look for ea words! That's all for tonight.\"", "listen": "Two vowels that make one sound; long e; try short e."}}], "win": "Great spelling! The ea team is on your side!", "prev": "bb-bristol-L15", "prevTitle": "Lesson 15"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeig
