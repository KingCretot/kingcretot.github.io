… Then I …", "The problem is …"]}, {"type": "learn", "kick": "Remember", "title": "Two tricks", "text": "Both tricks start with facts you <b>know</b>.", "steps": [{"text": "<b>8s: double the 4s.</b><br>8 × 7: 4 × 7 = 28. Double 28 is <b>56</b>.", "visual": {"kind": "bigtext", "text": "8 × 7 = 56"}}, {"text": "<b>9s: 10s take away one group.</b><br>9 × 7: 10 × 7 = 70. 70 − 7 = <b>63</b>.", "visual": {"kind": "bigtext", "text": "9 × 7 = 63"}}], "tip": "Type your answer. You get <b>3 tries</b>."}, {"type": "tap", "kick": "Try it", "title": "Double the 4s", "items": [{"type": "fill", "q": "4 × 6 = 24. Double it. So <b>8 × 6</b> = ____", "answers": ["48"], "why": "24 + 24: 40 + 8 = <b>48</b>.", "no": "Double 24. Tens: 20 + 20. Ones: 4 + 4.", "hint": "40 + 8 = ?"}, {"type": "fill", "q": "<b>8 × 9</b> = ____", "answers": ["72"], "why": "4 × 9 = 36. Double 36: 60 + 12 = <b>72</b>.", "no": "First find 4 × 9. Then double it.", "hint": "4 × 9 = 36. Double 36."}, {"q": "To find <b>8 × 8</b>, what do you double?", "choices": ["4 × 8 = 32", "8 + 8 = 16", "10 × 8 = 80"], "a": 0, "why": "8 groups is two sets of 4 groups. Double 32 is <b>64</b>.", "no": [null, "8 + 8 is only 2 groups of 8. Start with the 4s.", "10 × 8 is the start for the <b>9s</b> trick."]}]}, {"type": "tap", "kick": "Try it", "title": "Take away one group", "items": [{"type": "fill", "q": "10 × 8 = 80. Take away one group of 8. So <b>9 × 8</b> = ____", "answers": ["72"], "why": "80 − 8 = <b>72</b>.", "no": "Take away 8 from 80.", "hint": "80 − 8 = ?"}, {"type": "fill", "q": "<b>9 × 4</b> = ____", "answers": ["36"], "why": "10 × 4 = 40. 40 − 4 = <b>36</b>.", "no": "Start with 10 × 4.", "hint": "40 take away one group of 4."}, {"q": "Which way finds <b>9 × 6</b>?", "choices": ["10 × 6, then take away 9", "4 × 6, then double it", "10 × 6, then take away 6"], "a": 2, "why": "60 − 6 = <b>54</b>. So 9 × 6 = 54.", "no": ["Each group is 6. Take away 6, not 9.", "That is the 8s trick. It makes 8 × 6.", null]}]}, {"type": "sort", "kick": "Sort it", "title": "Which fact does it help?", "text": "Each card is a step. Does it help find <b>8 × 7</b> or <b>9 × 7</b>?", "buckets": ["8 × 7<br><small>double the 4s</small>", "9 × 7<br><small>10s take away 1 group</small>"], "items": [{"text": "4 × 7 = 28", "b": 0, "why": "4s are the first step for 8s.", "hint": "Is this a 4s fact or a 10s fact?"}, {"text": "10 × 7 = 70", "b": 1, "why": "10s are the first step for 9s.", "hint": "Which trick starts with the 10s?"}, {"text": "28 + 28 = 56", "b": 0, "why": "Double 28 is 8 × 7.", "hint": "Is this doubling or taking away?"}, {"text": "70 − 7 = 63", "b": 1, "why": "One group less than 10 groups is 9 × 7.", "hint": "Is this doubling or taking away?"}, {"text": "4 groups + 4 groups", "b": 0, "why": "8 groups is two sets of 4 groups.", "hint": "4 + 4 = ?"}, {"text": "10 groups − 1 group", "b": 1, "why": "9 groups is one group less than 10.", "hint": "10 − 1 = ?"}], "done": "8 × 7 = 56. 9 × 7 = 63."}, {"type": "order", "kick": "Put in order", "title": "How to do 9 × 8", "text": "Tap the steps in the right order.", "steps": ["Find 10 × 8 = 80", "Take away one group of 8", "80 − 8 = 72", "So 9 × 8 = 72"], "why": "10s first. Take away one group. <b>9 × 8 = 72</b>.", "hint": "The 9s trick starts with the 10s."}, {"type": "tap", "kick": "Fix it", "title": "Spot the slip", "items": [{"type": "fill", "q": "Liz says <b>9 × 6 = 59</b>. That is wrong. Type the right answer: 9 × 6 = ____", "answers": ["54"], "why": "10 × 6 = 60. Take away one group of <b>6</b>: 60 − 6 = <b>54</b>.", "no": "Liz took away 1. Take away a whole group of 6.", "hint": "60 − 6 = ?"}, {"type": "fill", "q": "Marion says <b>8 × 7 = 32</b>. That is wrong. Type the right answer: 8 × 7 = ____", "answers": ["56"], "why": "4 × 7 = 28. Double 28 is <b>56</b>.", "no": "Marion added 4. Double the 4s fact instead.", "hint": "4 × 7 = 28. 28 + 28 = ?"}]}, {"type": "tap", "kick": "Word problems", "title": "Multiply or add?", "items": [{"type": "fill", "q": "Amy has <b>9 bags</b>. <b>Each</b> bag has <b>7 bones</b>. How many bones?", "answers": ["63"], "why": "Equal groups, so multiply. 70 − 7 = <b>63</b>.", "no": "Each bag has 7. Multiply 9 × 7.", "hint": "10 × 7 = 70. Take away one group of 7."}, {"type": "fill", "q": "Ellie has <b>8 stickers</b>. Liz has <b>5 stickers</b>. How many stickers in all?", "answers": ["13"], "why": "8 and 5 are not equal groups. Add: 8 + 5 = <b>13</b>.", "no": "These are two different amounts. Do not multiply.", "hint": "8 + 5 = ?"}, {"type": "fill", "q": "There are <b>9 kids</b>. Each kid has <b>2 socks</b>. Do you multiply or add? Type <b>multiply</b> or <b>add</b>.", "answers": ["multiply", "times", "multiplication"], "why": "9 equal groups of 2. Multiply: 9 × 2 = 18.", "no": "Is every group the same size?", "hint": "Each kid has 2. Same size groups."}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "4 × 8 = 32. So <b>8 × 8</b> = ____", "answers": ["64"], "why": "4 × 8 = 32. Double 32 is <b>64</b>.", "no": "Find 4 × 8. Then double it.", "hint": "4 × 8 = 32. 32 + 32 = ?"}, {"type": "fill", "q": "9 × 9 = ____", "answers": ["81"], "why": "10 × 9 = 90. 90 − 9 = <b>81</b>.", "no": "Start with 10 × 9 = 90.", "hint": "Take away one group of 9."}, {"q": "Which is the <b>8s trick</b> for 8 × 7?", "choices": ["10 × 7, then take away 7", "4 × 7, then add 4", "4 × 7, then double it"], "a": 2, "why": "8 is double 4. So find 4 × 7, then double it.", "no": ["That is the 9s trick. It makes 9 × 7 = 63.", "Double, do not add 4.", null]}, {"q": "Which is the <b>9s trick</b> for 9 × 7?", "choices": ["10 × 7, then take away 9", "10 × 7, then take away 7", "10 × 7, then take away 1"], "a": 1, "why": "Start with 10 × 7 = 70. Take away one group of 7.", "no": ["Each group is 7, so take away 7.", null, "Take away a whole group of 7, not 1."]}, {"type": "fill", "q": "A vet has <b>8 dogs</b>. Each dog gets <b>9 treats</b>. How many treats?", "answers": ["72"], "why": "8 × 9: 4 × 9 = 36. Double 36 is <b>72</b>.", "no": "Every dog gets 9. Multiply.", "hint": "4 × 9 = 36. Double it."}, {"type": "fill", "q": "Ellie plants <b>9 rows</b> of seeds. Each row has <b>6 seeds</b>. How many seeds?", "answers": ["54"], "why": "10 × 6 = 60. 60 − 6 = <b>54</b>.", "no": "Each row has 6. Multiply 9 × 6.", "hint": "60 take away one group of 6."}, {"q": "Marion has <b>9 stamps</b>. Amy gives her <b>8 more</b>. How many stamps now?", "choices": ["17", "72", "1"], "a": 0, "why": "9 and 8 are not equal groups. Add: 9 + 8 = <b>17</b>.", "no": [null, "These are not equal groups. Add.", "1 is 9 − 8. She got more stamps."]}, {"q": "What is <b>8 × 6</b>?", "choices": ["42", "48", "54"], "a": 1, "why": "4 × 6 = 24. Double 24 is <b>48</b>.", "no": ["42 is 7 × 6. Find 4 × 6 and double it.", null, "54 is 9 × 6. This is 8 groups of 6."]}], [{"type": "fill", "q": "<b>8 × 3</b> = ____", "answers": ["24"], "why": "4 × 3 = 12. Double 12 is <b>24</b>.", "no": "Find 4 × 3. Then double it.", "hint": "4 × 3 = 12. 12 + 12 = ?"}, {"type": "fill", "q": "<b>9 × 3</b> = ____", "answers": ["27"], "why": "10 × 3 = 30. 30 − 3 = <b>27</b>.", "no": "Start with 10 × 3 = 30.", "hint": "Take away one group of 3."}, {"q": "Which is the <b>8s trick</b> for 8 × 9?", "choices": ["4 × 9, then double it", "10 × 9, then take away 9", "4 × 9, then add 8"], "a": 0, "why": "4 × 9 = 36. Double 36 is <b>72</b>.", "no": [null, "That is the 9s trick. It makes 9 × 9.", "Double the 36. Do not add 8."]}, {"q": "Liz finds <b>9 × 8</b> like this: 80 − 9. What is wrong?", "choices": ["She should take away 8, not 9.", "She should add 8, not take away.", "Nothing. She is right."], "a": 0, "why": "Each group is 8. 80 − 8 = <b>72</b>.", "no": [null, "Adding makes 11 groups. We need one group less.", "80 − 9 = 71. But 9 × 8 = 72."]}, {"type": "fill", "q": "Amy's mom sees <b>9 dogs</b> every day. How many dogs does she see in <b>5 days</b>?", "answers": ["45"], "why": "5 days, 9 dogs each day: 5 × 9 = 9 × 5. 10 × 5 = 50. 50 − 5 = <b>45</b>.", "no": "She sees 9 dogs each day for 5 days. Multiply.", "hint": "10 × 5 = 50. Take away one group of 5."}, {"type": "fill", "q": "There are <b>8 cats</b>. Each cat has <b>4 legs</b>. How many legs?", "answers": ["32"], "why": "8 × 4: 4 × 4 = 16. Double 16 is <b>32</b>.", "no": "Each cat has 4 legs. Multiply.", "hint": "4 × 4 = 16. Double it."}, {"q": "Marion has <b>8 pens</b>. Liz has <b>9 pens</b>. How many pens in all?", "choices": ["72", "17", "1"], "a": 1, "why": "Two different amounts. Add: 8 + 9 = <b>17</b>.", "no": ["8 and 9 are not equal groups. Add.", null, "1 is 9 − 8. The question asks how many in all."]}, {"q": "There are <b>8 rows</b> of stars. Each row has <b>7 stars</b>. How many stars?", "choices": ["49", "54", "56"], "a": 2, "why": "4 × 7 = 28. Double 28 is <b>56</b>.", "no": ["49 is 7 × 7. There are 8 rows.", "Close! Double 28: 40 + 16 = 56.", null]}], [{"type": "fill", "q": "<b>8 × 5</b> = ____", "answers": ["40"], "why": "4 × 5 = 20. Double 20 is <b>40</b>.", "no": "Find 4 × 5. Then double it.", "hint": "4 × 5 = 20. 20 + 20 = ?"}, {"type": "fill", "q": "4 × 4 = 16. So <b>8 × 4</b> = ____", "answers": ["32"], "why": "4 × 4 = 16. Double 16 is <b>32</b>.", "no": "Find 4 × 4. Then double it.", "hint": "16 + 16 = ?"}, {"q": "Which is the <b>9s trick</b> for 9 × 4?", "choices": ["10 × 4, then take away 1", "4 × 4, then double it", "10 × 4, then take away 4"], "a": 2, "why": "40 − 4 = <b>36</b>.", "no": ["Take away a whole group of 4, not 1.", "That is the 8s trick. It makes 8 × 4.", null]}, {"q": "Ellie finds <b>8 × 6</b> like this: 4 × 6 = 24, then 24 + 4. What is wrong?", "choices": ["She should double 24.", "She should take away 6.", "Nothing. She is right."], "a": 0, "why": "8 is double 4. 24 + 24 = <b>48</b>.", "no": [null, "Taking away is the 9s trick.", "24 + 4 = 28. But 8 × 6 = 48."]}, {"type": "fill", "q": "There are <b>8 kids</b>. Each kid gets <b>7 stickers</b>. How many stickers?", "answers": ["56"], "why": "4 × 7 = 28. Double 28 is <b>56</b>.", "no": "Each kid gets 7. Multiply.", "hint": "4 × 7 = 28. Double it."}, {"type": "fill", "q": "9 × 6 = ____", "answers": ["54"], "why": "10 × 6 = 60. 60 − 6 = <b>54</b>.", "no": "Start with 10 × 6 = 60.", "hint": "Take away one group of 6."}, {"q": "Amy has <b>9 bones</b>. She finds <b>9 more</b>. How many bones now?", "choices": ["81", "18", "0"], "a": 1, "why": "One amount plus another. Add: 9 + 9 = <b>18</b>.", "no": ["That is 9 groups of 9. Here there are just two amounts.", null, "She found more. The number goes up."]}, {"q": "What is <b>9 × 5</b>?", "choices": ["45", "49", "54"], "a": 0, "why": "10 × 5 = 50. 50 − 5 = <b>45</b>.", "no": [null, "49 is 50 − 1. Take away a whole group of 5.", "54 is 9 × 6. This is 9 groups of 5."]}]]}], "win": "You know two big tricks now. 8s and 9s, here you come!", "prev": "bb-bristol-L05", "prevTitle": "Lesson 5"});</script></body></html>
