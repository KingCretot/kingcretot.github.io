<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 6: Tricks for 8s and 9s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L06", "label": "Lesson 6", "title": "Tricks for 8s and 9s", "goal": "I can use my 4s to find 8s, and my 10s to find 9s.", "date": "2026-11-02", "mastery": 85, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Tricks for 8s and 9s", "text": "8s and 9s look big. But you already know the <b>secret</b>. 🤫 Today you use <b>4s</b> and <b>10s</b> to find them.", "visual": {"kind": "emoji", "text": "🐶 8️⃣ 9️⃣"}}, {"type": "talk", "kick": "Book Talk", "title": "Who has a problem?", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["Who is the <b>main character</b>? How do you know?", "What <b>problem</b> does she have?", "What did she do to try to fix it?"], "starters": ["The main character is …", "The problem is …", "She tried to …"]}, {"type": "recall", "kick": "Remember?", "title": "4s and 6s warm-up", "text": "These are from last week. Use your tricks!", "items": [{"q": "Each puppy has <b>4 paws</b>. How many paws on <b>7 puppies</b>?", "visual": {"kind": "emoji", "text": "🐶🐾"}, "choices": ["21", "24", "28"], "a": 2, "why": "7 × 4 is the same as 4 × 7. Double 7 is 14. Double 14 is <b>28</b>.", "no": ["21 is 7 × 3. Each puppy has 4 paws.", "24 is 6 × 4. Count the puppies: 7.", null]}, {"q": "What is <b>6 × 8</b>?", "choices": ["48", "46", "54"], "a": 0, "why": "5 × 8 = 40. One more group of 8: 40 + 8 = <b>48</b>.", "no": [null, "You added 6. Add one more group of <b>8</b>.", "54 is 6 × 9. This is 6 groups of 8."]}, {"q": "Amy has <b>6 bags</b>. <b>Each</b> bag has <b>9 treats</b>. How many treats?", "choices": ["15", "51", "54"], "a": 2, "why": "Equal groups, so multiply. 5 × 9 = 45. One more group of 9: 45 + 9 = <b>54</b>.", "no": ["15 is 6 + 9. Every bag has 9, so multiply.", "You added 6. Add one more group of <b>9</b>.", null]}]}, {"type": "learn", "kick": "Learn", "title": "8 is double 4", "text": "To find <b>8 ×</b> a number, find <b>4 ×</b> first. Then <b>double</b> it.", "steps": [{"text": "<b>Step 1.</b> 4 rows of 3. That is <b>4 × 3 = 12</b>.", "visual": {"kind": "array", "rows": 4, "cols": 3, "emoji": "🟦"}}, {"text": "<b>Step 2.</b> Make another 4 rows. Now there are <b>8 rows</b>.", "visual": {"kind": "array", "rows": 8, "cols": 3, "emoji": "🟦"}}, {"text": "<b>Step 3.</b> Double 12. <b>12 + 12 = 24</b>. So <b>8 × 3 = 24</b>.", "visual": {"kind": "bigtext", "text": "8 × 3 = 24"}}], "tip": "8 groups is just <b>two sets of 4 groups</b>."}, {"type": "learn", "kick": "Learn", "title": "Double a bigger number", "text": "Let's find <b>8 × 6</b>.", "steps": [{"text": "<b>Step 1.</b> Find the 4s fact: <b>4 × 6 = 24</b>.", "visual": {"kind": "array", "rows": 4, "cols": 6, "emoji": "🟩"}}, {"text": "<b>Step 2.</b> Double 24. Double the <b>tens</b>: 20 + 20 = 40."}, {"text": "<b>Step 3.</b> Double the <b>ones</b>: 4 + 4 = 8."}, {"text": "<b>Step 4.</b> Put them together: 40 + 8 = <b>48</b>. So <b>8 × 6 = 48</b>.", "visual": {"kind": "bigtext", "text": "8 × 6 = 48"}}], "tip": "Doubling is adding a number to <b>itself</b>. Tens first, then ones."}, {"type": "tap", "kick": "Try it", "title": "Double the 4s", "items": [{"q": "4 × 7 = 28. So what is <b>8 × 7</b>?", "choices": ["54", "56", "35"], "a": 1, "why": "Double 28: 40 + 16 = <b>56</b>.", "no": ["Close! Double 28 again. 20 + 20 = 40. 8 + 8 = 16. 40 + 16 = 56.", null, "35 is 28 + 7. Double means add <b>28</b> again."]}, {"q": "What is <b>8 × 4</b>?", "choices": ["16", "24", "32"], "a": 2, "why": "4 × 4 = 16. Double 16 is <b>32</b>.", "no": ["16 is 4 × 4. You need to double it one more time.", "24 is 8 × 3. This is 8 groups of <b>4</b>.", null]}, {"q": "There are <b>8 boxes</b>. Each box has <b>8 crayons</b>. How many crayons?", "visual": {"kind": "emoji", "text": "🖍️📦"}, "choices": ["64", "16", "56"], "a": 0, "why": "4 × 8 = 32. Double 32 is <b>64</b>.", "no": [null, "16 is 8 + 8. That is only 2 boxes. There are 8 boxes.", "56 is 7 × 8. Count the boxes again: 8."]}]}, {"type": "learn", "kick": "Learn", "title": "9 is 10 take away 1 group", "text": "10s are easy. So find <b>10 ×</b> first. Then take away <b>one group</b>.", "steps": [{"text": "<b>Step 1.</b> 10 rows of 4. <b>10 × 4 = 40</b>.", "visual": {"kind": "array", "rows": 10, "cols": 4, "emoji": "🟪"}}, {"text": "<b>Step 2.</b> Take away <b>one row of 4</b>. Now there are 9 rows.", "visual": {"kind": "array", "rows": 9, "cols": 4, "emoji": "🟪"}}, {"text": "<b>Step 3.</b> <b>40 − 4 = 36</b>. So <b>9 × 4 = 36</b>.", "visual": {"kind": "bigtext", "text": "9 × 4 = 36"}}], "tip": "Take away <b>one group</b>, not 9 and not 1."}, {"type": "learn", "kick": "Learn", "title": "Try 9 × 7", "text": "Let's find <b>9 × 7</b>.", "steps": [{"text": "<b>Step 1.</b> Start with the 10s: <b>10 × 7 = 70</b>.", "visual": {"kind": "bigtext", "text": "10 × 7 = 70"}}, {"text": "<b>Step 2.</b> Take away one group of <b>7</b>.", "visual": {"kind": "bigtext", "text": "70 − 7", "sub": "take away one group of 7"}}, {"text": "<b>Step 3.</b> <b>70 − 7 = 63</b>. So <b>9 × 7 = 63</b>.", "visual": {"kind": "bigtext", "text": "9 × 7 = 63"}}], "tip": "The group is the number you multiply by. For 9 × 7, the group is <b>7</b>."}, {"type": "tap", "kick": "Try it", "title": "Take away one group", "items": [{"q": "10 × 6 = 60. So what is <b>9 × 6</b>?", "choices": ["51", "54", "59"], "a": 1, "why": "Take away one group of 6: 60 − 6 = <b>54</b>.", "no": ["51 is 60 − 9. Take away a group of <b>6</b>, not 9.", null, "59 is 60 − 1. Take away a whole group of 6."]}, {"q": "What is <b>9 × 8</b>?", "choices": ["71", "64", "72"], "a": 2, "why": "10 × 8 = 80. 80 − 8 = <b>72</b>.", "no": ["71 is 80 − 9. Take away one group of <b>8</b>.", "64 is 8 × 8. Start with 10 × 8 = 80.", null]}, {"q": "Which way finds <b>9 × 5</b>?", "choices": ["10 × 5, then take away 9", "10 × 5, then take away 5", "10 × 5, then add 5"], "a": 1, "why": "50 − 5 = 45. So 9 × 5 = 45.", "no": ["Take away one group. Each group is <b>5</b>, not 9.", null, "Adding makes 11 groups. We need one group <b>less</b>."]}]}, {"type": "sort", "kick": "Sort it", "title": "Which fact does it help?", "text": "Each card is a step. Does it help find <b>8 × 6</b> or <b>9 × 6</b>?", "buckets": ["8 × 6<br><small>double the 4s</small>", "9 × 6<br><small>10s take away 1 group</small>"], "items": [{"text": "4 × 6 = 24", "b": 0, "why": "4s are the first step for 8s.", "hint": "Is this a 4s fact or a 10s fact?"}, {"text": "10 × 6 = 60", "b": 1, "why": "10s are the first step for 9s.", "hint": "Which trick starts with the 10s?"}, {"text": "24 + 24 = 48", "b": 0, "why": "Doubling 24 gives 8 × 6.", "hint": "Is this doubling or taking away?"}, {"text": "60 − 6 = 54", "b": 1, "why": "Taking away one group of 6 gives 9 × 6.", "hint": "Is this doubling or taking away?"}, {"text": "Double it", "b": 0, "why": "8s trick: double the 4s.", "hint": "Which trick doubles?"}, {"text": "Take away one group", "b": 1, "why": "9s trick: one group less than 10.", "hint": "Which trick takes away?"}], "done": "8 × 6 = 48. 9 × 6 = 54."}, {"type": "build", "kick": "Build it", "title": "Ellie's flower pots", "text": "Ellie has <b>9 pots</b>. Each pot has <b>3 flowers</b>. Make the groups.", "groups": 9, "each": 3, "emoji": "🌷", "why": "10 × 3 = 30. Take away one group: 30 − 3 = 27. So <b>9 × 3 = 27</b>.", "hint": "How many pots? How many flowers in each pot?"}, {"type": "tap", "kick": "Word problems", "title": "Multiply or add?", "items": [{"q": "There are <b>9 rows</b> of chairs. Each row has <b>9 chairs</b>. How many chairs?", "choices": ["18", "81", "89"], "a": 1, "why": "9 × 9: 90 − 9 = <b>81</b>.", "no": ["18 is 9 + 9. That is only 2 rows. There are 9 rows.", null, "89 is 90 − 1. Take away one group of <b>9</b>."]}, {"q": "Liz has <b>8 shells</b>. Marion has <b>6 shells</b>. How many shells in all?", "choices": ["48", "2", "14"], "a": 2, "why": "8 and 6 are not equal groups. Add: 8 + 6 = <b>14</b>.", "no": ["8 and 6 are two different groups. Don't multiply. Add.", "2 is 8 − 6. The question asks how many in all.", null]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "4 × 5 = 20. So what is <b>8 × 5</b>?", "choices": ["25", "40", "45"], "a": 1, "why": "Double 20 is 40.", "no": ["25 is 20 + 5. Double means add 20 again.", null, "45 is 9 × 5."]}, {"q": "What is <b>9 × 9</b>?", "choices": ["81", "89", "72"], "a": 0, "why": "10 × 9 = 90. 90 − 9 = 81.", "no": [null, "89 is 90 − 1. Take away one group of 9.", "72 is 9 × 8. This is 9 groups of 9."]}, {"q": "Which is the <b>8s trick</b> for 8 × 7?", "choices": ["10 × 7, then take away 7", "4 × 7, then add 4", "4 × 7, then double it"], "a": 2, "why": "8 is double 4. So find 4 × 7, then double it.", "no": ["That is the 9s trick. It makes 9 × 7 = 63.", "You need to double, not add 4.", null]}, {"q": "Which is the <b>9s trick</b> for 9 × 7?", "choices": ["10 × 7, then take away 9", "10 × 7, then take away 7", "10 × 7, then take away 1"], "a": 1, "why": "Start with 10 × 7 = 70. Take away one group of 7.", "no": ["Each group is 7, so take away 7.", null, "Take away a whole group of 7, not 1."]}, {"q": "A vet has <b>8 dogs</b>. Each dog gets <b>9 treats</b>. How many treats?", "choices": ["17", "72", "63"], "a": 1, "why": "8 × 9: 4 × 9 = 36. Double 36 is 72.", "no": ["17 is 8 + 9. Every dog gets 9, so multiply.", null, "63 is 7 × 9. There are 8 dogs."]}, {"q": "Ellie plants <b>9 rows</b> of seeds. Each row has <b>6 seeds</b>. How many seeds?", "choices": ["15", "60", "54"], "a": 2, "why": "10 × 6 = 60. 60 − 6 = 54.", "no": ["15 is 9 + 6. Each row has 6, so multiply.", "60 is 10 rows. Take away one row of 6.", null]}, {"q": "Marion has <b>9 stamps</b>. Amy gives her <b>8 more</b>. How many stamps now?", "choices": ["17", "72", "1"], "a": 0, "why": "9 and 8 are not equal groups. Add: 9 + 8 = 17.", "no": [null, "These are not equal groups. Add.", "1 is 9 − 8. She got more stamps."]}, {"q": "What is <b>8 × 8</b>?", "choices": ["16", "56", "64"], "a": 2, "why": "4 × 8 = 32. Double 32 is 64.", "no": ["16 is 8 + 8.", "56 is 7 × 8.", null]}]}], "win": "You know two big tricks now. 8s and 9s, here you come!", "prev": "bb-bristol-L05", "prevTitle": "Lesson 5"});</script></body></html>
