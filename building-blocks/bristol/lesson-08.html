<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 8: Prove It: Mixed Facts</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script>window.KCE_READALOUD=true</script><script src="clips.js"></script><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L08", "label": "Lesson 8", "title": "Prove It: Mixed Facts", "goal": "I can solve mixed facts, missing numbers and word problems.", "date": "2026-11-05", "mastery": 85, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Prove It: Mixed Facts", "text": "You mixed all your tricks in class. Now <b>prove it</b> on your own! 🏆", "visual": {"kind": "emoji", "text": "4️⃣ 6️⃣ 7️⃣ 8️⃣ 9️⃣"}}, {"type": "talk", "kick": "Say it", "title": "Say it out loud", "text": "Say each one out loud. Tell a grown-up if one is near.", "prompts": ["Say the trick for <b>7s</b>, <b>8s</b> and <b>9s</b>.", "What is a <b>turn-around fact</b>? Give one.", "Which character in your book is <b>most like you</b>? Why?"], "starters": ["For 7s, I …", "A turn-around fact is …", "I am most like … because …"]}, {"type": "learn", "kick": "Remember", "title": "All your tricks", "text": "<b>4s:</b> double, double. <b>6s:</b> 5s + one group.<br><b>7s:</b> 5s part + 2s part. <b>8s:</b> double the 4s. <b>9s:</b> 10s take away one group.", "steps": [{"text": "<b>Missing number:</b> 8 × ? = 40. Start at 5: 8 × 5 = 40. Yes! It is <b>5</b>.", "visual": {"kind": "bigtext", "text": "8 × 5 = 40"}}, {"text": "<b>Too big?</b> Go down. <b>Too small?</b> Go up."}], "tip": "Type your answer. You get <b>3 tries</b>."}, {"type": "tap", "kick": "Mixed facts", "title": "Use your best trick", "items": [{"type": "fill", "q": "6 × 9 = ____", "answers": ["54"], "why": "Flip it: 9 × 6. 60 − 6 = <b>54</b>.", "no": "Flip it to 9 × 6. Use the 9s trick.", "hint": "10 × 6 = 60. Take away 6."}, {"type": "fill", "q": "8 × 8 = ____", "answers": ["64"], "why": "4 × 8 = 32. Double 32 is <b>64</b>.", "no": "Double the 4s fact.", "hint": "32 + 32 = ?"}, {"type": "fill", "q": "7 × 4 = ____", "answers": ["28"], "why": "5 × 4 = 20. 2 × 4 = 8. 20 + 8 = <b>28</b>.", "no": "5s part + 2s part.", "hint": "20 + 8 = ?"}]}, {"type": "tap", "kick": "Flip it", "title": "Turn-around facts", "items": [{"type": "fill", "q": "4 × 9 = 9 × ____", "answers": ["4", "four"], "why": "Turn-around: 4 × 9 = 9 × <b>4</b>. Both are 36.", "no": "Swap the two numbers.", "hint": "4 × 9 flips to 9 × ?"}, {"type": "fill", "q": "Flip it to use the 9s trick. <b>7 × 9</b> = ____", "answers": ["63"], "why": "7 × 9 = 9 × 7. 70 − 7 = <b>63</b>.", "no": "Think 9 × 7.", "hint": "10 × 7 = 70. Take away 7."}]}, {"type": "tap", "kick": "Missing numbers", "title": "Start at 5", "items": [{"type": "fill", "q": "9 × ____ = 81", "answers": ["9", "nine"], "why": "9 × 9 = <b>81</b>.", "no": "Start at 9 × 5 = 45. Too small. Go up.", "hint": "90 − 9 = 81."}, {"type": "fill", "q": "____ × 6 = 42", "answers": ["7", "seven"], "why": "7 × 6 = <b>42</b>.", "no": "Start at 5 × 6 = 30. Too small. Go up.", "hint": "30, 36, 42…"}, {"type": "fill", "q": "7 × ____ = 56", "answers": ["8", "eight"], "why": "7 × 8 = <b>56</b>.", "no": "Start at 7 × 5 = 35. Go up.", "hint": "5, 6, 7, 8!"}]}, {"type": "sort", "kick": "Sort it", "title": "Same answer, same box", "text": "Find each answer. Put the fact in its box.", "buckets": ["24", "36", "63"], "items": [{"text": "4 × 6", "b": 0, "why": "Double 6 is 12. Double 12 is 24.", "hint": "Use the 4s trick: double, double."}, {"text": "8 × 3", "b": 0, "why": "4 × 3 = 12. Double 12 is 24.", "hint": "Use the 8s trick: double the 4s."}, {"text": "6 × 6", "b": 1, "why": "5 × 6 = 30. One more 6: 36.", "hint": "Use the 6s trick: 5s + one group."}, {"text": "4 × 9", "b": 1, "why": "Flip it: 9 × 4. 40 − 4 = 36.", "hint": "Flip it to 9 × 4."}, {"text": "9 × 7", "b": 2, "why": "70 − 7 = 63.", "hint": "Use the 9s trick: 10s take away one group."}, {"text": "7 × 9", "b": 2, "why": "Turn-around of 9 × 7: 63.", "hint": "It is the turn-around of 9 × 7."}], "done": "Different facts can have the same answer!"}, {"type": "tap", "kick": "Word problems", "title": "Total or one group?", "items": [{"type": "fill", "q": "Amy has <b>45 treats</b>. She puts <b>9</b> in each bag. How many bags?", "answers": ["5", "five"], "why": "9 × 5 = 45. So <b>5 bags</b>.", "no": "45 is the total. 9 × what = 45?", "hint": "Start at 9 × 5."}, {"type": "fill", "q": "Ellie has <b>6 bags</b>. Each bag has <b>9 shells</b>. How many shells?", "answers": ["54"], "why": "6 × 9 = 9 × 6. 60 − 6 = <b>54</b>.", "no": "Each bag has 9. Multiply.", "hint": "Flip it: 9 × 6."}, {"type": "fill", "q": "Liz reads <b>7 pages</b>. Then she reads <b>8 pages</b>. How many pages in all?", "answers": ["15"], "why": "Two amounts. Add: 7 + 8 = <b>15</b>.", "no": "Not equal groups. Add.", "hint": "7 + 8 = ?"}, {"q": "Amy has <b>40 bones</b>. She puts <b>8</b> in each bowl. Which number sentence fits?", "choices": ["40 + 8 = 48", "8 × 5 = 40", "40 − 8 = 32"], "a": 1, "why": "40 is the total. 8 in each bowl. 8 × 5 = 40, so <b>5 bowls</b>.", "no": ["Adding makes more bones. The 40 bones are all of them.", null, "That is one bowl taken away. We need how many bowls."]}]}, {"type": "tap", "kick": "Fix it", "title": "Find the mistake", "items": [{"type": "fill", "q": "Marion says <b>9 × 7 = 56</b>. Type the right answer: 9 × 7 = ____", "answers": ["63"], "why": "70 − 7 = <b>63</b>. 56 is 8 × 7.", "no": "Use the 9s trick.", "hint": "10 × 7 = 70. Take away 7."}, {"type": "fill", "q": "Liz says <b>6 × 8 = 42</b>. Type the right answer: 6 × 8 = ____", "answers": ["48"], "why": "5 × 8 = 40. One more 8: <b>48</b>. 42 is 6 × 7.", "no": "Use the 6s trick: 5s + one group.", "hint": "40 + 8 = ?"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "8 × 4 = ____", "answers": ["32"], "why": "4 × 4 = 16. Double 16 is <b>32</b>.", "no": "Double the 4s fact.", "hint": "16 + 16 = ?"}, {"q": "What is <b>8 × 9</b>?", "choices": ["64", "72", "81"], "a": 1, "why": "4 × 9 = 36. Double 36 is <b>72</b>.", "no": ["64 is 8 × 8. This is 8 groups of 9.", null, "81 is 9 × 9."]}, {"type": "fill", "q": "8 × ____ = 48", "answers": ["6", "six"], "why": "8 × 6 = <b>48</b>.", "no": "Start at 8 × 5 = 40. Too small.", "hint": "Go up one."}, {"q": "You know <b>4 × 9 = 36</b>. Which fact is also 36?", "choices": ["9 × 4", "8 × 4", "9 + 4"], "a": 0, "why": "9 × 4 is the turn-around of 4 × 9.", "no": [null, "8 × 4 is 32.", "9 + 4 is 13. Multiply, do not add."]}, {"type": "fill", "q": "____ × 8 = 64", "answers": ["8", "eight"], "why": "8 × 8 = <b>64</b>.", "no": "Start at 5 × 8 = 40. Go up.", "hint": "Double the 4s: 4 × 8 = 32."}, {"type": "fill", "q": "Marion plants <b>6 rows</b> of tulips. Each row has <b>7 tulips</b>. How many tulips?", "answers": ["42"], "why": "6 × 7: 35 + 7 = <b>42</b>.", "no": "Each row has 7. Multiply.", "hint": "5 × 7 = 35. One more 7."}, {"type": "fill", "q": "Amy has <b>36 dog bones</b>. She puts <b>9</b> in each bag. How many bags?", "answers": ["4", "four"], "why": "9 × 4 = 36, so <b>4 bags</b>.", "no": "36 is the total. 9 × what = 36?", "hint": "Start at 9 × 5 = 45. Too big."}, {"q": "Amy has <b>9 treats</b> in one jar and <b>4 treats</b> in another jar. How many treats?", "choices": ["36", "5", "13"], "a": 2, "why": "Two different amounts, not equal groups. Add: 9 + 4 = <b>13</b>.", "no": ["These are not equal groups. Add.", "5 is 9 − 4. The question asks how many in all.", null]}], [{"type": "fill", "q": "<b>6 × 8</b> = ____", "answers": ["48"], "why": "5 × 8 = 40. One more 8: <b>48</b>. Or flip it: 8 × 6, double 24.", "no": "Use the 6s trick: 5s + one group.", "hint": "40 + 8 = ?"}, {"q": "What is <b>7 × 8</b>?", "choices": ["54", "56", "48"], "a": 1, "why": "5 × 8 = 40. 2 × 8 = 16. 40 + 16 = <b>56</b>.", "no": ["Careful! Say it: 5, 6, 7, 8. 56 = 7 × 8.", null, "48 is 6 × 8. You need one more group of 8."]}, {"type": "fill", "q": "7 × ____ = 63", "answers": ["9", "nine"], "why": "7 × 9 = <b>63</b>.", "no": "Start at 7 × 5 = 35. Go up.", "hint": "45 + 18 = 63."}, {"q": "You know <b>5 × 8 = 40</b>. Which fact is also 40?", "choices": ["8 + 5", "9 × 5", "8 × 5"], "a": 2, "why": "8 × 5 is the turn-around of 5 × 8.", "no": ["8 + 5 is 13. Multiply.", "9 × 5 is 45.", null]}, {"type": "fill", "q": "____ × 4 = 24", "answers": ["6", "six"], "why": "6 × 4 = <b>24</b>.", "no": "Start at 5 × 4 = 20. Too small.", "hint": "Go up one."}, {"type": "fill", "q": "The vet has <b>9 cages</b>. Each cage has <b>3 bunnies</b>. How many bunnies?", "answers": ["27"], "why": "9 × 3: 30 − 3 = <b>27</b>.", "no": "Each cage has 3. Multiply.", "hint": "10 × 3 = 30. Take away 3."}, {"type": "fill", "q": "Liz has <b>56 stickers</b>. She puts <b>8</b> on each page. How many pages?", "answers": ["7", "seven"], "why": "8 × 7 = 56, so <b>7 pages</b>.", "no": "56 is the total. 8 × what = 56?", "hint": "Start at 8 × 5 = 40. Go up."}, {"q": "Ellie has <b>8 red beads</b> and <b>6 blue beads</b>. How many beads?", "choices": ["48", "14", "2"], "a": 1, "why": "Two different amounts. Add: 8 + 6 = <b>14</b>.", "no": ["Not equal groups. Add.", null, "2 is 8 − 6. The question asks how many in all."]}], [{"type": "fill", "q": "9 × 8 = ____", "answers": ["72"], "why": "10 × 8 = 80. 80 − 8 = <b>72</b>.", "no": "Use the 9s trick.", "hint": "80 − 8 = ?"}, {"q": "What is <b>7 × 6</b>?", "choices": ["42", "36", "49"], "a": 0, "why": "5 × 6 = 30. 2 × 6 = 12. 30 + 12 = <b>42</b>.", "no": [null, "36 is 6 × 6.", "49 is 7 × 7."]}, {"type": "fill", "q": "9 × ____ = 54", "answers": ["6", "six"], "why": "9 × 6 = <b>54</b>.", "no": "Start at 9 × 5 = 45. Too small.", "hint": "Go up one."}, {"q": "Which fact has the same answer as <b>4 × 7</b>?", "choices": ["4 + 7", "7 × 4", "8 × 7"], "a": 1, "why": "7 × 4 is the turn-around of 4 × 7. Both are 28.", "no": ["4 + 7 is 11. Multiply.", null, "8 × 7 is 56."]}, {"type": "fill", "q": "____ × 7 = 21", "answers": ["3", "three"], "why": "3 × 7 = <b>21</b>.", "no": "Start at 5 × 7 = 35. Too big. Go down.", "hint": "Go down: 28, then 21."}, {"type": "fill", "q": "Amy's mom has <b>6 rows</b> of jars. Each row has <b>6 jars</b>. How many jars?", "answers": ["36"], "why": "5 × 6 = 30. One more 6: <b>36</b>.", "no": "Each row has 6. Multiply.", "hint": "30 + 6 = ?"}, {"type": "fill", "q": "Marion has <b>63 seeds</b>. She plants <b>9</b> in each pot. How many pots?", "answers": ["7", "seven"], "why": "9 × 7 = 63, so <b>7 pots</b>.", "no": "63 is the total. 9 × what = 63?", "hint": "Start at 9 × 5 = 45. Go up."}, {"q": "Liz has <b>7 green apples</b> and <b>5 red apples</b>. How many apples in all?", "choices": ["35", "2", "12"], "a": 2, "why": "Two different amounts, not equal groups. Add: 7 + 5 = <b>12</b>.", "no": ["These are not equal groups. Add.", "2 is 7 − 5. The question asks how many in all.", null]}]]}], "win": "You proved it! 4s, 6s, 7s, 8s and 9s are yours.", "prev": "bb-bristol-L07", "prevTitle": "Lesson 7
