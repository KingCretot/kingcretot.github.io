<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 8: Prove It: Mixed Facts</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L08", "label": "Lesson 8", "title": "Prove It: Mixed Facts", "goal": "I can solve mixed facts, missing numbers and word problems.", "date": "2026-11-05", "mastery": 85, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Prove It: Mixed Facts", "text": "This week you learned tricks for <b>8s, 9s and 7s</b>. Today you mix them all up. Show what you know! 🏆", "visual": {"kind": "emoji", "text": "4️⃣ 6️⃣ 7️⃣ 8️⃣ 9️⃣"}}, {"type": "talk", "kick": "Book Talk", "title": "Friends who help", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["How do the girls <b>work together</b>?", "Which character is <b>most like you</b>? Why?", "What is one thing you want to find out next?"], "starters": ["The girls work together by …", "I am most like … because …", "I want to find out …"]}, {"type": "recall", "kick": "Remember?", "title": "Tricks from this week", "text": "7s: 5s + 2s. 8s: double the 4s. 9s: 10s take away one group. 6s: 5s + one group.", "items": [{"q": "How many days are in <b>8 weeks</b>?", "visual": {"kind": "emoji", "text": "📅"}, "choices": ["54", "56", "15"], "a": 1, "why": "8 × 7: 4 × 7 = 28. Double 28 is <b>56</b>.", "no": ["Careful! 4 × 7 = 28, and double 28 is 56.", null, "15 is 8 + 7. Each week has 7 days, so multiply."]}, {"q": "What is <b>9 × 8</b>?", "choices": ["72", "71", "64"], "a": 0, "why": "10 × 8 = 80. Take away one group of 8: <b>72</b>.", "no": [null, "71 is 80 − 9. Take away a group of <b>8</b>.", "64 is 8 × 8. This is 9 groups."]}, {"q": "What is <b>6 × 7</b>?", "choices": ["36", "48", "42"], "a": 2, "why": "5 × 7 = 35. One more group of 7: <b>42</b>.", "no": ["36 is 6 × 6. Look again: groups of 7.", "48 is 6 × 8.", null]}]}, {"type": "learn", "kick": "Learn", "title": "Flip it!", "text": "A <b>turn-around fact</b> has the same answer. If one way is hard, <b>flip it</b>.", "steps": [{"text": "<b>6 × 9</b> is 6 rows of 9.", "visual": {"kind": "array", "rows": 6, "cols": 9, "emoji": "🔵"}}, {"text": "Turn it. Now it is <b>9 × 6</b>: 9 rows of 6. Same dots!", "visual": {"kind": "array", "rows": 9, "cols": 6, "emoji": "🔵"}}, {"text": "Use the 9s trick: 10 × 6 = 60. 60 − 6 = 54. So <b>6 × 9 = 54</b>.", "visual": {"kind": "bigtext", "text": "6 × 9 = 9 × 6 = 54"}}], "tip": "Pick the way that uses the trick you like best."}, {"type": "tap", "kick": "Try it", "title": "Turn-around facts", "items": [{"q": "You know <b>7 × 8 = 56</b>. Which other fact is also <b>56</b>?", "choices": ["8 × 7", "6 × 8", "8 + 7"], "a": 0, "why": "Turn-around! 8 × 7 has the same answer: <b>56</b>.", "no": [null, "6 × 8 is 48. Flip the numbers in 7 × 8.", "8 + 7 is 15. A turn-around keeps the ×."]}, {"q": "Flip it! What is <b>3 × 8</b>?", "choices": ["11", "24", "21"], "a": 1, "why": "3 × 8 = 8 × 3. 4 × 3 = 12. Double 12 is <b>24</b>.", "no": ["11 is 3 + 8. Multiply.", null, "21 is 3 × 7. This is groups of 8."]}]}, {"type": "learn", "kick": "Learn", "title": "Find the missing number", "text": "<b>8 × ? = 56</b>. Ask: 8 times <b>what</b> makes 56?", "visual": {"kind": "bigtext", "text": "8 × ? = 56"}, "steps": [{"text": "<b>Start at 5.</b> 8 × 5 = 40. Too small."}, {"text": "<b>Go up one.</b> 8 × 6 = 48. Still too small."}, {"text": "<b>Up one more.</b> 8 × 7 = 56. Yes!"}, {"text": "The missing number is <b>7</b>.", "visual": {"kind": "bigtext", "text": "8 × 7 = 56"}}], "tip": "Start with 5s. You know them fast. Then go up or down."}, {"type": "tap", "kick": "Try it", "title": "Missing numbers", "items": [{"q": "<b>9 × ? = 63</b>", "choices": ["7", "54", "8"], "a": 0, "why": "9 × 7 = 63. The missing number is <b>7</b>.", "no": [null, "54 is 63 − 9. Ask: 9 times what makes 63?", "9 × 8 = 72. That is too big."]}, {"q": "<b>? × 7 = 49</b>", "choices": ["42", "7", "6"], "a": 1, "why": "7 × 7 = 49. The missing number is <b>7</b>.", "no": ["42 is 49 − 7. Ask: what times 7 makes 49?", null, "6 × 7 = 42. That is too small."]}, {"q": "<b>7 × ? = 28</b>", "choices": ["21", "5", "4"], "a": 2, "why": "7 × 4 = 28. The missing number is <b>4</b>.", "no": ["21 is 28 − 7. Ask: 7 times what makes 28?", "7 × 5 = 35. That is too big.", null]}]}, {"type": "sort", "kick": "Sort it", "title": "Same answer, same box", "text": "Find the answer. Put each fact in its box.", "buckets": ["42", "48", "56"], "items": [{"text": "6 × 7", "b": 0, "why": "5 × 7 = 35. One more 7: 42.", "hint": "Use the 6s trick: 5 × 7, then one more 7."}, {"text": "8 × 6", "b": 1, "why": "4 × 6 = 24. Double it: 48.", "hint": "Use the 8s trick: 4 × 6, then double."}, {"text": "7 × 8", "b": 2, "why": "40 + 16 = 56.", "hint": "Use the 7s trick: 5 × 8 and 2 × 8."}, {"text": "7 × 6", "b": 0, "why": "Turn-around of 6 × 7: 42.", "hint": "It is the turn-around of 6 × 7."}, {"text": "6 × 8", "b": 1, "why": "Turn-around of 8 × 6: 48.", "hint": "It is the turn-around of 8 × 6."}, {"text": "8 × 7", "b": 2, "why": "Turn-around of 7 × 8: 56.", "hint": "It is the turn-around of 7 × 8."}], "done": "Each box has a fact and its turn-around."}, {"type": "build", "kick": "Build it", "title": "Treat bowls", "text": "Amy's mom has <b>28 treats</b>. She puts <b>4</b> in each bowl. How many bowls? Make the groups.", "groups": 7, "each": 4, "emoji": "🦴", "why": "7 bowls of 4 is 28. <b>7 × 4 = 28</b>, so there are <b>7 bowls</b>.", "hint": "Each bowl has 4. Keep adding bowls until you have 28 treats."}, {"type": "tap", "kick": "Word problems", "title": "Think first", "text": "Ask: equal groups? Do I know the total or the groups?", "items": [{"q": "The vet has <b>9 cages</b>. Each cage has <b>4 kittens</b>. How many kittens?", "choices": ["13", "36", "32"], "a": 1, "why": "9 × 4: 40 − 4 = <b>36</b>.", "no": ["13 is 9 + 4. Each cage has 4, so multiply.", null, "32 is 8 × 4. There are 9 cages."]}, {"q": "Ellie has <b>42 stickers</b>. She puts <b>7</b> on each page. How many pages?", "choices": ["6", "35", "49"], "a": 0, "why": "7 × ? = 42. 7 × 6 = 42, so <b>6 pages</b>.", "no": [null, "35 is 42 − 7. Ask: 7 times what makes 42?", "49 is 42 + 7. The 42 stickers are the total."]}, {"q": "Liz read <b>8 pages</b> on Monday and <b>9 pages</b> on Tuesday. How many pages?", "choices": ["72", "1", "17"], "a": 2, "why": "Not equal groups. Add: 8 + 9 = <b>17</b>.", "no": ["She did not read 8 groups of 9. Add the two days.", "1 is 9 − 8. The question asks how many in all.", null]}]}, {"type": "tap", "kick": "Fact detective", "title": "Find the mistake", "items": [{"q": "Ellie says <b>7 × 8 = 54</b>. Is she right?", "choices": ["Yes, she is right.", "No. It is 56.", "No. It is 48."], "a": 1, "why": "5 × 8 = 40. 2 × 8 = 16. 40 + 16 = <b>56</b>.", "no": ["Check with the 7s trick: 40 + 16.", null, "48 is 6 × 8."]}, {"q": "Marion says <b>9 × 6 = 51</b>. What did she do wrong?", "choices": ["She forgot to double.", "She is right.", "She took away 9, not 6."], "a": 2, "why": "60 − 9 = 51. She should take away one group of <b>6</b>: 60 − 6 = 54.", "no": ["Doubling is the 8s trick. This is a 9s fact.", "Check: 10 × 6 = 60. Take away one group of 6.", null]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "What is <b>8 × 4</b>?", "choices": ["32", "24", "36"], "a": 0, "why": "4 × 4 = 16. Double 16 is 32.", "no": [null, "24 is 6 × 4.", "36 is 9 × 4."]}, {"q": "What is <b>7 × 9</b>?", "choices": ["56", "63", "72"], "a": 1, "why": "45 + 18 = 63.", "no": ["56 is 7 × 8.", null, "72 is 8 × 9."]}, {"q": "<b>8 × ? = 48</b>", "choices": ["40", "6", "7"], "a": 1, "why": "8 × 6 = 48.", "no": ["40 is 48 − 8. Ask: 8 times what makes 48?", null, "8 × 7 = 56. Too big."]}, {"q": "You know <b>4 × 9 = 36</b>. Which fact is also 36?", "choices": ["9 × 4", "8 × 4", "9 + 4"], "a": 0, "why": "9 × 4 is the turn-around of 4 × 9.", "no": [null, "8 × 4 = 32.", "9 + 4 = 13. A turn-around keeps the ×."]}, {"q": "<b>? × 8 = 64</b>", "choices": ["7", "56", "8"], "a": 2, "why": "8 × 8 = 64.", "no": ["7 × 8 = 56.", "56 is 64 − 8.", null]}, {"q": "Marion plants <b>6 rows</b> of tulips. Each row has <b>7 tulips</b>. How many tulips?", "choices": ["13", "42", "36"], "a": 1, "why": "6 × 7 = 42.", "no": ["13 is 6 + 7. Multiply.", null, "36 is 6 × 6."]}, {"q": "Amy has <b>36 dog bones</b>. She puts <b>9</b> in each bag. How many bags?", "choices": ["4", "27", "45"], "a": 0, "why": "9 × 4 = 36, so 4 bags.", "no": [null, "27 is 36 − 9.", "45 is 36 + 9."]}, {"q": "Amy has <b>9 treats</b> in one jar and <b>4 treats</b> in another jar. How many treats?", "choices": ["36", "5", "13"], "a": 2, "why": "Two different amounts, not equal groups. Add: 9 + 4 = 13.", "no": ["36 is 9 × 4. There are not 9 jars of 4. Add.", "5 is 9 − 4. The question asks how many in all.", null]}]}], "win": "You proved it! 4s, 6s, 7s, 8s and 9s are yours.", "prev": "bb-bristol-L07", "prevTitle": "Lesson 7"});</script></body></html>
