<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Bonus Lesson: Inside Amazon: How a Package Travels</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script>window.KCE_READALOUD=true</script><script src="clips.js"></script><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-A1", "label": "Bonus Lesson", "title": "Inside Amazon: How a Package Travels", "goal": "I can tell the 5 steps a package takes inside Amazon and how it travels the world.", "date": "2026-11-08", "mastery": 85, "color": "#C9A84C", "slides": [{"type": "hello", "title": "Inside Amazon", "text": "On Monday you get to go inside Amazon! 🎉 Today you learn how a package gets from a giant building all the way to someone's front door.", "visual": {"kind": "emoji", "text": "🏭➡️📦➡️🚚➡️🏠"}, "notes": {"do": "Share your screen. This is a bonus lesson to get her ready for Monday's Amazon visit. Today is Zoom, so she types nothing: she says every answer, and you tap or type exactly what she says. Ask Tia before class to set out paper, a pencil, crayons and about 40 beans or counters.", "say": "On Monday you are going somewhere amazing. Today you will be the expert before you even walk in.", "ask": "Have you ever gotten a package from Amazon? What was inside?", "listen": "Any real memory of a delivery. Use it again on slide 4."}}, {"type": "talk", "kick": "Talk about it", "title": "What do you think?", "text": "Make a guess. There is no wrong answer yet.", "prompts": ["Where do you think a package is before it comes to your house?", "Who do you think gets the package ready: people, robots, or both?", "What do you most want to see on Monday?"], "starters": ["I think the package is …", "I think … gets it ready because …", "On Monday I want to see …"], "notes": {"do": "4 minutes. She guesses out loud. Write her guesses on your whiteboard and keep them on camera; you come back to them at the end.", "ask": "Why do you think that?", "listen": "Full sentences using the starters."}}, {"type": "vocab", "kick": "Word Power", "title": "Amazon words", "text": "Tap each card to flip it. Say the word out loud.", "words": [{"word": "package", "pos": "noun", "emoji": "📦", "meaning": "A box or bag that is sent to someone.", "example": "A <b>package</b> came to our door today."}, {"word": "robot", "pos": "noun", "emoji": "🤖", "meaning": "A machine that can move and do a job by itself.", "example": "The <b>robot</b> carries a tall shelf across the floor."}, {"word": "tote", "pos": "noun", "emoji": "🧺", "meaning": "A yellow plastic tub that holds items while they move.", "example": "The worker puts the toy in a yellow <b>tote</b>."}, {"word": "conveyor belt", "pos": "noun", "emoji": "➡️", "meaning": "A moving belt that carries things from place to place.", "example": "The tote rides on the <b>conveyor belt</b>."}, {"word": "deliver", "pos": "verb", "emoji": "🚚", "meaning": "To bring something to the place where it needs to go.", "example": "The driver will <b>deliver</b> the package to our house."}], "notes": {"do": "She tells you which card to flip and reads each word out loud. Then she uses one word in her own sentence about Monday.", "ask": "Use the word tote in a sentence.", "listen": "She can say what a tote is: the yellow tub items ride in."}}, {"type": "learn", "kick": "Learn", "title": "5 steps inside the building", "text": "Amazon calls the giant building a <b>fulfillment center</b>. Every item goes through 5 steps.", "steps": [{"text": "📥 Receive: trucks bring boxes of new items to the building."}, {"text": "🗄️ Stow: workers put each item into a bin on a tall yellow shelf called a pod."}, {"text": "🛒 Pick: a robot carries the pod to a worker, who takes out the item someone ordered."}, {"text": "📦 Pack: the item goes in a box or bag, and a machine measures just enough tape."}, {"text": "🚚 Ship: a machine sticks on the label, and the package slides into the right truck."}], "tip": "Receive, stow, pick, pack, ship.", "notes": {"do": "Read each step with her. Act out the step with your hands on camera: unload, put away, grab, tape, slide. She copies you.", "say": "Receive, stow, pick, pack, ship. Say it with me three times.", "ask": "Which step do you think a robot helps with?", "listen": "Pick: the robot brings the shelf to the worker."}}, {"type": "order", "kick": "Put in order", "title": "What happens first?", "text": "Say the steps in order. Jonathan taps them.", "steps": ["📥 Receive: trucks bring boxes of new items to the building.", "🗄️ Stow: workers put each item into a bin on a tall yellow shelf called a pod.", "🛒 Pick: a robot carries the pod to a worker, who takes out the item someone ordered.", "📦 Pack: the item goes in a box or bag, and a machine measures just enough tape.", "🚚 Ship: a machine sticks on the label, and the package slides into the right truck."], "why": "Receive, stow, pick, pack, ship.", "hint": "The item has to come into the building first.", "notes": {"do": "She says the order from memory; you tap the steps in her order.", "listen": "Receive first, ship last."}}, {"type": "learn", "kick": "Learn", "title": "Robots and people work together", "text": "Robots and people each have their own jobs.", "visual": {"kind": "emoji", "text": "🤖🗄️ ➡️ 🙋‍♀️"}, "steps": [{"text": "Small robots slide under the tall yellow <b>pods</b>, lift them, and carry them across the floor."}, {"text": "The robot brings the pod to a worker. The worker grabs the item and puts it in a yellow <b>tote</b>."}, {"text": "Amazon has about <b>one million</b> robots helping in its buildings around the world!"}], "tip": "Robots carry. People pick.", "notes": {"do": "On Monday she may see the robots behind a fence. Tell her that the robots work in their own fenced space so people stay safe.", "ask": "Why do you think the robot brings the shelf to the person, and not the other way around?", "listen": "Walking takes a long time; the robot saves steps."}}, {"type": "sort", "kick": "Sort it", "title": "Robot job or person job?", "text": "Tap a job. Then tap the box.", "buckets": ["🤖 Robot or machine job", "🙋 Person job"], "items": [{"text": "Carry a tall shelf across the floor", "b": 0, "why": "Robots slide under the pods and carry them.", "hint": "Who lifts the giant shelves?"}, {"text": "Take the right toy out of a bin", "b": 1, "why": "People pick the item with their hands.", "hint": "Who looks at the screen and grabs the item?"}, {"text": "Stick the address label on a box", "b": 0, "why": "A machine sticks the label on as the box rolls by.", "hint": "It happens on the moving belt."}, {"text": "Fix a robot that got stuck", "b": 1, "why": "A worker helps a robot that is stuck.", "hint": "Can a stuck robot fix itself?"}], "notes": {"do": "She tells you the job and the box; you tap.", "listen": "She explains why for at least two of them."}}, {"type": "tap", "kick": "Amazon math", "title": "Totes and boxes", "text": "Say the answer. Jona  "kick": "Your plan", "title": "Before and after the trip", "steps": [{"text": "<b>Tonight:</b> do the After-class lesson. It ends with Show What You Know."}, {"text": "<b>Monday at Amazon:</b> bring your <b>Field Notes</b> (page 1). Fill it in on the trip."}, {"text": "<b>Tuesday:</b> bring your Field Notes to class and tell me what you saw."}], "tip": "Have fun on Monday!", "notes": {"do": "Show her where the Field Notes are on her course page. Ask Tia to print page 1 for the trip.", "say": "I can't wait to hear what you saw.", "ask": "What will you do tonight? What will you bring on Monday?"}}], "win": "You are an Amazon expert now. Have an amazing trip!", "prev": null, "prevTitle": ""});</script><script type="module" src="../../kce-progress/kce-progress.js" data-course="bb-bristol"></script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a
