<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 5: Prove It: 4s and 6s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L05", "label": "Lesson 5", "title": "Prove It: 4s and 6s", "goal": "I can solve 4s and 6s facts, find a missing number, and pick the right operation.", "date": "2026-10-29", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "Prove It: 4s and 6s", "text": "This week you learned two tricks. Today you <b>prove</b> you can use them. 💪", "visual": {"kind": "emoji", "text": "🐾🐾 ✋☝️ 💪"}}, {"type": "talk", "kick": "Book Talk", "title": "Tell it in order", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["Tell the story so far. What happened first, next, then?", "What is the most important clue so far? Why?", "How has Amy changed since the start?"], "starters": ["First, … Next, … Then, …", "The best clue is … because …", "At the start Amy … Now she …"]}, {"type": "recall", "kick": "Remember", "title": "Pick the trick", "items": [{"q": "Which way finds <b>6 × 6</b>?", "choices": ["12 + 12", "30 + 6", "30 + 1"], "a": 1, "why": "5 × 6 = 30. One more group of 6: <b>30 + 6 = 36</b>.", "no": ["12 + 12 is double, double. That is 4 × 6 = 24.", null, "Add one more group of 6, not 1."]}, {"q": "Which way finds <b>4 × 9</b>?", "choices": ["9, 18, 36", "45 + 9", "9, 18, 27"], "a": 0, "why": "Double 9 is 18. Double 18 is <b>36</b>.", "no": [null, "45 + 9 is 6 × 9. This fact is 4 × 9.", "27 is 18 + 9. That is not a double."]}, {"q": "How many stars? <b>8 rows of 4</b>. Turn it around!", "visual": {"kind": "array", "rows": 8, "cols": 4, "emoji": "⭐"}, "choices": ["12", "28", "32"], "a": 2, "why": "8 × 4 is the same as 4 × 8. Double 8 is 16. Double 16 is <b>32</b>.", "no": ["12 is 8 + 4. The rows are equal, so multiply.", "28 is 4 × 7. Count the rows: there are 8.", null]}]}, {"type": "learn", "kick": "Learn", "title": "A number is hiding!", "text": "<b>4 × ? = 24</b>. How many 4s make 24?", "visual": {"kind": "bigtext", "text": "4 × ? = 24"}, "steps": [{"text": "Count by 4s to 24. Each jump is 4.", "visual": {"kind": "numberline", "start": 0, "jump": 4, "jumps": 6}}, {"text": "Now count the <b>jumps</b>: 1, 2, 3, 4, 5, 6. There are <b>6</b> jumps."}, {"text": "So <b>4 × 6 = 24</b>. The hiding number is <b>6</b>."}], "tip": "Count the <b>jumps</b>, not the last number. 24 is where you land. 6 is how many jumps."}, {"type": "learn", "kick": "Learn", "title": "Guess, check, fix", "text": "<b>6 × ? = 42</b>. Try a number. Check it. Fix it.", "visual": {"kind": "bigtext", "text": "6 × ? = 42"}, "steps": [{"text": "<b>Guess 6.</b> 6 × 6 = 36. That is <b>too small</b>."}, {"text": "<b>Try one more: 7.</b> 6 × 7 = 35 + 7 = <b>42</b>. Yes!"}, {"text": "So <b>6 × 7 = 42</b>. The hiding number is <b>7</b>."}], "tip": "Too small? Try a bigger number. Too big? Try a smaller number."}, {"type": "tap", "kick": "Try it", "title": "Find the hiding number", "items": [{"q": "<b>4 × ? = 32</b>", "choices": ["28", "8", "7"], "a": 1, "why": "Double 8 is 16. Double 16 is 32. So <b>4 × 8 = 32</b>.", "no": ["28 is 32 − 4. You need how many 4s make 32.", null, "4 × 7 = 28. That is too small."]}, {"q": "<b>? × 6 = 18</b>", "choices": ["12", "24", "3"], "a": 2, "why": "6, 12, 18. That is 3 sixes. <b>3 × 6 = 18</b>.", "no": ["12 is 18 − 6. How many 6s make 18?", "24 is 18 + 6. How many 6s make 18?", null]}, {"q": "<b>6 × ? = 54</b>", "choices": ["9", "8", "48"], "a": 0, "why": "5 × 9 = 45. 45 + 9 = 54. So <b>6 × 9 = 54</b>.", "no": [null, "6 × 8 = 48. Too small. Try one more.", "48 is 54 − 6. The hiding number is how many 6s."]}]}, {"type": "sort", "kick": "Sort it", "title": "Same answer, same box", "text": "Tap a fact. Then tap the box with its answer.", "buckets": ["24", "36", "48"], "items": [{"text": "4 × 6", "b": 0, "why": "Double 6 is 12, double 12 is 24.", "hint": "It has a 4. Double, double."}, {"text": "6 × 6", "b": 1, "why": "30 + 6 = 36.", "hint": "5 × 6 is 30. Add one more 6."}, {"text": "6 × 8", "b": 2, "why": "40 + 8 = 48.", "hint": "5 × 8 is 40. Add one more 8."}, {"text": "4 × 9", "b": 1, "why": "Double 9 is 18, double 18 is 36.", "hint": "It has a 4. Double, double."}, {"text": "6 × 4", "b": 0, "why": "20 + 4 = 24. Same as 4 × 6!", "hint": "5 × 4 is 20. Add one more 4."}, {"text": "8 × 6", "b": 2, "why": "Turn it around: 6 × 8 = 48.", "hint": "8 × 6 is the same as 6 × 8."}], "done": "Look! 4 × 9 and 6 × 6 are both 36."}, {"type": "learn", "kick": "Learn", "title": "Same numbers, different job", "text": "Both stories have a <b>4</b> and a <b>6</b>. Read carefully!", "steps": [{"text": "<b>Story A:</b> There are 4 puppies. <b>Each</b> puppy has 6 spots. How many spots?", "visual": {"kind": "groups", "groups": 4, "each": 6, "emoji": "🟤"}}, {"text": "<b>Each</b> puppy has 6. Equal groups. <b>Multiply: 4 × 6 = 24</b> spots."}, {"text": "<b>Story B:</b> Amy has 4 puppies. Ellie has 6 puppies. How many puppies?", "visual": {"kind": "uneven", "sets": [4, 6], "emoji": "🐶"}}, {"text": "4 and 6 are not the same. <b>Add: 4 + 6 = 10</b> puppies."}], "tip": "Don't look only at the numbers. Look for <b>each</b> or <b>every</b>. Ask: are the groups equal?"}, {"type": "tap", "kick": "Try it", "title": "Word problems", "text": "Equal groups? Multiply. Not equal? Add.", "items": [{"q": "Six friends each brought 4 apples to the picnic. How many apples?", "choices": ["10", "24", "2"], "a": 1, "why": "6 friends, 4 each. Equal groups: <b>6 × 4 = 24</b>.", "no": ["Each friend brought 4. That is 6 equal groups. Multiply.", null, "Nobody took apples away."]}, {"q": "Amy has 6 dog toys. Ellie has 4 cat toys. How many toys?", "choices": ["24", "10", "2"], "a": 1, "why": "6 and 4 are two different groups. Add: <b>6 + 4 = 10</b>.", "no": ["Amy does not have 6 groups of 4. Add the two amounts.", null, "2 is the difference. The question asks how many toys."]}, {"q": "The vet has 4 cages. There are 9 birds in every cage. How many birds?", "choices": ["13", "32", "36"], "a": 2, "why": "<b>Every</b> cage has 9. Double 9 is 18, double 18 is <b>36</b>.", "no": ["13 is 4 + 9. Every cage has 9, so multiply.", "32 is 4 × 8. Each cage has 9.", null]}]}, {"type": "build", "kick": "Build it", "title": "Snack bowls", "text": "Amy fills <b>6 bowls</b>. She puts <b>8 treats</b> in every bowl. Make the groups.", "groups": 6, "each": 8, "emoji": "🦴", "why": "6 groups of 8. 5 × 8 = 40, plus 8 is <b>48</b>.", "hint": "How many bowls? How many treats in every bowl?"}, {"type": "tap", "kick": "Fix it", "title": "Find the mistake", "items": [{"q": "Theo says <b>6 × 6 = 31</b>. He did 5 × 6 = 30, then 30 + 1. What should he do?", "choices": ["30 + 6 = 36", "30 + 5 = 35", "He is right."], "a": 0, "why": "Add one more <b>group</b> of 6: 30 + 6 = <b>36</b>.", "no": [null, "The extra group has 6, not 5.", "He added 1. He needs one more group of 6."]}, {"q": "Mia says <b>4 × 9 = 18</b>. What did she forget?", "choices": ["To add 4", "To double again", "To add 1"], "a": 1, "why": "Double 9 is 18. Double again: 18 + 18 = <b>36</b>.", "no": ["18 + 4 = 22. That is not 4 × 9.", null, "18 + 1 = 19. That is not 4 × 9."]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "<b>6 × 7 = ?</b>", "choices": ["48", "42", "13"], "a": 1, "why": "5 × 7 = 35. 35 + 7 = 42."}, {"q": "<b>4 × ? = 28</b>", "choices": ["24", "6", "7"], "a": 2, "why": "Double 7 is 14. Double 14 is 28. So 4 × 7 = 28."}, {"q": "<b>6 × ? = 48</b>", "choices": ["8", "42", "9"], "a": 0, "why": "5 × 8 = 40. 40 + 8 = 48. So 6 × 8 = 48."}, {"q": "<b>6 × 9 = ?</b>", "choices": ["45", "56", "54"], "a": 2, "why": "5 × 9 = 45. 45 + 9 = 54."}, {"q": "There are 6 kennels. Every kennel has 6 puppies. How many puppies?", "choices": ["12", "36", "30"], "a": 1, "why": "Equal groups: 6 × 6 = 30 + 6 = 36."}, {"q": "Liz walked 4 dogs on Monday. She walked 7 dogs on Tuesday. How many dogs did she walk?", "choices": ["28", "3", "11"], "a": 2, "why": "4 and 7 are not equal groups. Add: 4 + 7 = 11."}, {"q": "Amy put 24 treats in bags. Each bag has 4 treats. How many bags?", "choices": ["20", "6", "28"], "a": 1, "why": "4 × ? = 24. Count by 4s: 4, 8, 12, 16, 20, 24. That is 6 bags."}, {"q": "Which is the same as <b>6 × 8</b>?", "choices": ["5 × 8 + 8", "5 × 8 + 1", "6 + 8"], "a": 0, "why": "6 groups of 8 is 5 groups of 8 plus one more 8."}]}], "win": "You proved it! 4s and 6s are yours!", "prev": "bb-bristol-L04", "prevTitle": "Lesson 4"});</script></body></html>
