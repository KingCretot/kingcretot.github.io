<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 5: Prove It: 4s and 6s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L05", "label": "Lesson 5", "title": "Prove It: 4s and 6s", "goal": "I can solve 4s and 6s facts, find a missing number, and pick the right operation.", "date": "2026-10-29", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "On Your Own: Prove It", "text": "You proved it in class. Now prove it on your own. 💪", "visual": {"kind": "emoji", "text": "🐾🐾 ✋☝️ 💪"}}, {"type": "talk", "kick": "Book Corner", "title": "Think about your book", "text": "Read each question. Tell a grown-up your answer.", "prompts": ["What was your favorite part this week? Why?", "What question would you ask Amy?"], "starters": ["My favorite part was … because …", "I would ask Amy …"]}, {"type": "recall", "kick": "Remember", "title": "From Lessons 2, 3 and 4", "items": [{"type": "fill", "q": "There are 5 rows. <b>Every</b> row has 10 seats. How many seats?", "answers": ["50", "fifty"], "why": "5 groups of 10: <b>5 × 10 = 50</b>.", "no": "Skip count by 10s, one time for each row.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>4 × 7 = ?</b>", "answers": ["28", "twenty-eight", "twenty eight", "twentyeight"], "why": "Double 7 is 14. Double 14 is <b>28</b>.", "no": "Double, double.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>6 × 8 = ?</b>", "answers": ["48", "forty-eight", "forty eight", "fortyeight"], "why": "5 × 8 = 40. One more 8: <b>48</b>.", "no": "5s plus one more group.", "placeholder": "Type a number"}]}, {"type": "learn", "kick": "Remember", "title": "Find the hiding number", "text": "<b>4 × ? = 20</b>. Count by 4s: 4, 8, 12, 16, 20. Count the jumps: <b>5</b>.", "visual": {"kind": "numberline", "start": 0, "jump": 4, "jumps": 5}, "tip": "Count the <b>jumps</b>, not the last number."}, {"type": "tap", "kick": "Try it", "title": "Hiding numbers", "items": [{"type": "fill", "q": "<b>4 × ? = 12</b>", "answers": ["3", "three"], "why": "4, 8, 12. That is 3 jumps. <b>4 × 3 = 12</b>.", "no": "Count by 4s to 12. How many jumps?", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>6 × ? = 30</b>", "answers": ["5", "five"], "why": "6, 12, 18, 24, 30. That is 5 jumps. <b>6 × 5 = 30</b>.", "no": "Count by 6s to 30. How many jumps?", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>? × 6 = 12</b>", "answers": ["2", "two"], "why": "6, 12. That is 2 sixes. <b>2 × 6 = 12</b>.", "no": "How many 6s make 12?", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Try it", "title": "4s and 6s", "items": [{"type": "fill", "q": "<b>7 × 6 = ?</b>", "answers": ["42", "forty-two", "forty two", "fortytwo"], "why": "Turn it around: 6 × 7. 35 + 7 = <b>42</b>.", "no": "7 × 6 is the same as 6 × 7.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>4 × 3 = ?</b>", "answers": ["12", "twelve"], "why": "Double 3 is 6. Double 6 is <b>12</b>.", "no": "Double, double.", "placeholder": "Type a number"}, {"q": "Which trick helps with <b>8 × 6</b>?", "choices": ["Double, double", "5 × 8 + 8", "Add 8 + 6"], "a": 1, "why": "Turn it around: 6 × 8. 5 × 8 = 40, plus one more 8 is <b>48</b>.", "no": ["Double, double is for 4s. This fact has a 6.", null, "8 + 6 adds. 8 × 6 is 8 groups of 6."]}]}, {"type": "sort", "kick": "Sort it", "title": "Multiply or add?", "text": "Same numbers! Read the words. Tap a card. Then tap the right box.", "buckets": ["✖️ Multiply<br><small>equal groups</small>", "➕ Add<br><small>not equal</small>"], "items": [{"text": "Liz has 6 jars. <b>Each</b> jar has 4 bugs.", "b": 0, "why": "<b>Each</b> jar has 4: 6 × 4 = 24.", "hint": "Find the clue word."}, {"text": "Liz has 6 jars and 4 lids.", "b": 1, "why": "6 jars and 4 lids are not equal groups: 6 + 4 = 10.", "hint": "Is there a clue word?"}, {"text": "There are 4 teams with 6 kids on <b>every</b> team.", "b": 0, "why": "<b>Every</b> team has 6: 4 × 6 = 24.", "hint": "Find the clue word."}, {"text": "Amy ran 4 laps. Then she ran 6 more laps.", "b": 1, "why": "4 and 6 are different: 4 + 6 = 10.", "hint": "Is 4 the same as 6?"}, {"text": "Marion buys 6 packs. There are 4 pens <b>per</b> pack.", "b": 0, "why": "<b>Per</b> pack means each pack: 6 × 4 = 24.", "hint": "What does per mean?"}, {"text": "Ellie has 6 big dogs and 4 small dogs.", "b": 1, "why": "6 and 4 are not equal: 6 + 4 = 10.", "hint": "Does she have the same number of each?"}], "done": "Same numbers, different job. The words decide!"}, {"type": "tap", "kick": "Try it", "title": "Word problems", "items": [{"type": "fill", "q": "Liz has 18 bones. She puts 6 bones in <b>each</b> bowl. How many bowls?", "answers": ["3", "three"], "why": "6 × ? = 18. Count by 6s: 6, 12, 18. That is <b>3</b> bowls.", "no": "How many 6s make 18? Count the jumps.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 6 vases. <b>Each</b> vase has 9 tulips. How many tulips?", "answers": ["54", "fifty-four", "fifty four", "fiftyfour"], "why": "6 × 9: 45 + 9 = <b>54</b>.", "no": "Each vase has 9. Use your 5s, then one more group.", "placeholder": "Type a number"}, {"type": "fill", "q": "Amy has 9 tulips. Ellie has 6 tulips. How many tulips in all?", "answers": ["15", "fifteen"], "why": "9 and 6 are not equal groups. Add: <b>9 + 6 = 15</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}]}, {"type": "build", "kick": "Build it", "title": "Crayon boxes", "text": "Marion has <b>4 boxes</b>. <b>Every</b> box has <b>9 crayons</b>. Make the groups.", "groups": 4, "each": 9, "emoji": "🖍️", "why": "4 groups of 9. Double 9 is 18. Double 18 is <b>36</b>.", "hint": "How many boxes? How many crayons in every box?"}, {"type": "tap", "kick": "Fix it", "title": "Find the mistake", "items": [{"type": "fill", "q": "Mia says the hiding number in <b>6 × ? = 42</b> is 36. She did 42 − 6. What is the hiding number?", "answers": ["7", "seven"], "why": "6 × 7 = 42. The hiding number is <b>7</b>.", "no": "How many 6s make 42? Count the jumps or guess, check and fix.", "placeholder": "Type a number"}, {"q": "Theo says <b>4 × 8 = 28</b>. What is right?", "choices": ["4 × 8 = 32", "4 × 8 = 12", "He is right."], "a": 0, "why": "Double 8 is 16. Double 16 is <b>32</b>.", "no": [null, "12 is 4 + 8. Multiply.", "28 is 4 × 7. Double, double for 4 × 8."]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "<b>6 × 7 = ?</b>", "answers": ["42", "forty-two", "forty two", "fortytwo"], "why": "5 × 7 = 35. 35 + 7 = <b>42</b>.", "no": "Start with 5 × 7.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>4 × ? = 28</b>", "answers": ["7", "seven"], "why": "Double 7 is 14. Double 14 is 28. So <b>4 × 7 = 28</b>.", "no": "How many 4s make 28? Count the jumps.", "placeholder": "Type a number"}, {"q": "<b>6 × ? = 48</b>", "choices": ["8", "42", "9"], "a": 0, "why": "5 × 8 = 40. 40 + 8 = 48. So <b>6 × 8 = 48</b>."}, {"type": "fill", "q": "<b>6 × 9 = ?</b>", "answers": ["54", "fifty-four", "fifty four", "fiftyfour"], "why": "5 × 9 = 45. 45 + 9 = <b>54</b>.", "no": "Start with 5 × 9.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 6 kennels. <b>Every</b> kennel has 6 puppies. How many puppies?", "answers": ["36", "thirty-six", "thirty six", "thirtysix"], "why": "Equal groups: 5 × 6 = 30, plus 6 is <b>36</b>.", "no": "Every kennel has 6. Use your 5s, then one more group.", "placeholder": "Type a number"}, {"q": "Liz walked 4 dogs on Monday. She walked 7 dogs on Tuesday. How many dogs did she walk?", "choices": ["28", "3", "11"], "a": 2, "why": "4 and 7 are not equal groups. Add: <b>4 + 7 = 11</b>."}, {"type": "fill", "q": "Amy put 24 treats in bags. <b>Each</b> bag has 4 treats. How many bags?", "answers": ["6", "six"], "why": "4 × ? = 24. Count by 4s: 4, 8, 12, 16, 20, 24. That is <b>6</b> bags.", "no": "How many 4s make 24? Count the jumps.", "placeholder": "Type a number"}, {"q": "Which is the same as <b>6 × 8</b>?", "choices": ["5 × 8 + 1", "5 × 8 + 8", "6 + 8"], "a": 1, "why": "6 groups of 8 is 5 groups of 8 plus one more 8."}], [{"type": "fill", "q": "<b>4 × 8 = ?</b>", "answers": ["32", "thirty-two", "thirty two", "thirtytwo"], "why": "Double 8 is 16. Double 16 is <b>32</b>.", "no": "Double, double.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>6 × ? = 24</b>", "answers": ["4", "four"], "why": "6, 12, 18, 24. That is 4 jumps. <b>6 × 4 = 24</b>.", "no": "How many 6s make 24? Count the jumps.", "placeholder": "Type a number"}, {"q": "<b>4 × ? = 36</b>", "choices": ["32", "9", "8"], "a": 1, "why": "Double 9 is 18. Double 18 is 36. So <b>4 × 9 = 36</b>."}, {"type": "fill", "q": "<b>8 × 6 = ?</b>", "answers": ["48", "forty-eight", "forty eight", "fortyeight"], "why": "Turn it around: 6 × 8. 40 + 8 = <b>48</b>.", "no": "8 × 6 is the same as 6 × 8.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 4 boats. <b>Every</b> boat has 9 kids. How many kids?", "answers": ["36", "thirty-six", "thirty six", "thirtysix"], "why": "Double 9 is 18. Double 18 is <b>36</b>.", "no": "Every boat has 9. Double, double.", "placeholder": "Type a number"}, {"q": "Ellie read 6 pages. Then she read 8 more pages. How many pages?", "choices": ["14", "48", "2"], "a": 0, "why": "6 and 8 are not equal groups. Add: <b>6 + 8 = 14</b>."}, {"type": "fill", "q": "Marion has 36 beads. She puts 6 on <b>each</b> string. How many strings?", "answers": ["6", "six"], "why": "6 × ? = 36. 5 × 6 = 30, plus 6 is 36. So <b>6</b> strings.", "no": "How many 6s make 36? Guess, check and fix.", "placeholder": "Type a number"}, {"q": "Which way finds <b>7 × 4</b>?", "choices": ["7, 14, 28", "35 + 4", "7 + 4"], "a": 0, "why": "Turn it around: 4 × 7. Double 7 is 14, double 14 is <b>28</b>."}], [{"type": "fill", "q": "<b>6 × 6 = ?</b>", "answers": ["36", "thirty-six", "thirty six", "thirtysix"], "why": "5 × 6 = 30. One more 6: <b>36</b>.", "no": "Start with 5 × 6.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>? × 4 = 40</b>", "answers": ["10", "ten"], "why": "Double 10 is 20. Double 20 is 40. So <b>10 × 4 = 40</b>.", "no": "How many 4s make 40? Count the jumps.", "placeholder": "Type a number"}, {"q": "<b>6 × ? = 60</b>", "choices": ["54", "10", "9"], "a": 1, "why": "5 × 10 = 50. 50 + 10 = 60. So <b>6 × 10 = 60</b>."}, {"type": "fill", "q": "<b>4 × 9 = ?</b>", "answers": ["36", "thirty-six", "thirty six", "thirtysix"], "why": "Double 9 is 18. Double 18 is <b>36</b>.", "no": "Double, double.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 6 shelves. <b>Each</b> shelf has 8 books. How many books?", "answers": ["48", "forty-eight", "forty eight", "fortyeight"], "why": "5 × 8 = 40. One more 8: <b>48</b>.", "no": "Each shelf has 8. Use your 5s, then one more group.", "placeholder": "Type a number"}, {"q": "Amy has 9 pens. Liz has 4 pens. How many pens in all?", "choices": ["36", "13", "5"], "a": 1, "why": "9 and 4 are not equal groups. Add: <b>9 + 4 = 13</b>."}, {"type": "fill", "q": "Ellie has 42 stickers. She puts 6 on <b>each</b> page. How many pages?", "answers": ["7", "seven"], "why": "6 × ? = 42. 5 × 7 = 35, plus 7 is 42. So <b>7</b> pages.", "no": "How many 6s make 42? Guess, check and fix.", "placeholder": "Type a number"}, {"q": "Theo says <b>6 × 8 = 46</b>. What did he do?", "choices": ["He added one more 6, not one more 8.", "He doubled two times.", "He is right."], "a": 0, "why": "5 × 8 = 40. He added 6. He needed one more 8: <b>40 + 8 = 48</b>."}]]}], "win": "You proved it! 4s and 6s are yours!", "prev": "bb-bristol-L04", "prevTitle": "Lesson 4"});</script></body></html>
