<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 5: Prove It: 4s and 6s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L05", "label": "Lesson 5", "title": "Prove It: 4s and 6s", "goal": "I can solve 4s and 6s facts, find a missing number, and pick the right operation.", "date": "2026-10-29", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "On Your Own: Prove It", "text": "You proved it in class. Now prove it on your own. 💪", "visual": {"kind": "emoji", "text": "🐾🐾 ✋☝️ 💪"}}, {"type": "talk", "kick": "Book Corner", "title": "Think about your book", "text": "Read each question. Tell a grown-up your answer.", "prompts": ["What was your favorite part this week? Why?", "What question would you ask Amy?"], "starters": ["My favorite part was … because …", "I would ask Amy …"]}, {"type": "recall", "kick": "Remember", "title": "From Lessons 2, 3 and 4", "items": [{"type": "fill", "q": "3 × 7 = 21. So 7 × 3 = ____", "answers": ["21", "twenty-one", "twentyone"], "why": "Turn-around facts have the same answer: <b>7 × 3 = 21</b>.", "no": "Turn it around. The answer does not change.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 4 tanks. <b>Each</b> tank has 6 fish. How many fish?", "answers": ["24", "twenty-four", "twentyfour"], "why": "4 equal groups of 6. Double 6 is 12. Double 12 is <b>24</b>.", "no": "Each tank has 6. Double, double.", "placeholder": "Type a number"}, {"type": "fill", "q": "5 × 9 = 45. So <b>6 × 9</b> = ____", "answers": ["54", "fifty-four", "fiftyfour"], "why": "45 + one more 9 = <b>54</b>.", "no": "5s plus one more group of 9.", "placeholder": "Type a number"}]}, {"type": "learn", "kick": "Remember", "title": "Find the hiding number", "text": "<b>4 × ? = 20</b>. Count by 4s: 4, 8, 12, 16, 20. Count the jumps: <b>5</b>.", "visual": {"kind": "numberline", "start": 0, "jump": 4, "jumps": 5}, "tip": "Count the <b>jumps</b>, not the last number."}, {"type": "tap", "kick": "Try it", "title": "Hiding numbers", "items": [{"type": "fill", "q": "<b>4 × ? = 12</b>", "answers": ["3", "three"], "why": "4, 8, 12. That is 3 jumps. <b>4 × 3 = 12</b>.", "no": "Count by 4s to 12. How many jumps?", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>6 × ? = 30</b>", "answers": ["5", "five"], "why": "6, 12, 18, 24, 30. That is 5 jumps. <b>6 × 5 = 30</b>.", "no": "Count by 6s to 30. How many jumps?", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>? × 6 = 12</b>", "answers": ["2", "two"], "why": "6, 12. That is 2 sixes. <b>2 × 6 = 12</b>.", "no": "How many 6s make 12?", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Try it", "title": "4s and 6s", "items": [{"type": "fill", "q": "<b>7 × 6 = ?</b>", "answers": ["42", "forty-two", "forty two"], "why": "Turn it around: 6 × 7. 35 + 7 = <b>42</b>.", "no": "7 × 6 is the same as 6 × 7.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>3 × 4 = ?</b>", "answers": ["12", "twelve"], "why": "Turn it around: 4 × 3. Double 3 is 6. Double 6 is <b>12</b>.", "no": "Turn it around: 4 × 3. Double, double.", "placeholder": "Type a number"}, {"q": "Which trick helps with <b>8 × 6</b>?", "choices": ["Double, double", "5 × 8 + 8", "Add 8 + 6"], "a": 1, "why": "Turn it around: 6 × 8. 5 × 8 = 40, plus one more 8 is <b>48</b>.", "no": ["Double, double is for 4s. This fact has a 6.", null, "8 + 6 adds. 8 × 6 is 8 groups of 6."]}]}, {"type": "sort", "kick": "Sort it", "title": "Multiply or add?", "text": "Same numbers! Read the words. Tap a card. Then tap the right box.", "buckets": ["✖️ Multiply<br><small>equal groups</small>", "➕ Add<br><small>not equal</small>"], "items": [{"text": "Liz has 6 jars. <b>Each</b> jar has 4 bugs.", "b": 0, "why": "<b>Each</b> jar has 4: 6 × 4 = 24.", "hint": "Find the clue word."}, {"text": "Liz has 6 red jars and 4 blue jars.", "b": 1, "why": "6 red and 4 blue are not equal groups: 6 + 4 = 10.", "hint": "Is there a clue word?"}, {"text": "There are 4 teams with 6 kids on <b>every</b> team.", "b": 0, "why": "<b>Every</b> team has 6: 4 × 6 = 24.", "hint": "Find the clue word."}, {"text": "Amy ran 4 laps. Then she ran 6 more laps.", "b": 1, "why": "4 and 6 are different: 4 + 6 = 10.", "hint": "Is 4 the same as 6?"}, {"text": "Marion buys 6 packs. There are 4 pens <b>per</b> pack.", "b": 0, "why": "<b>Per</b> pack means each pack: 6 × 4 = 24.", "hint": "What does per mean?"}, {"text": "Ellie has 6 big dogs and 4 small dogs.", "b": 1, "why": "6 and 4 are not equal: 6 + 4 = 10.", "hint": "Does she have the same number of each?"}], "done": "Same numbers, different job. The words decide!"}, {"type": "tap", "kick": "Try it", "title": "Word problems", "items": [{"type": "fill", "q": "Liz has 18 bones. She puts 6 bones in <b>each</b> bowl. How many bowls?", "answers": ["3", "three"], "why": "6 × ? = 18. Count by 6s: 6, 12, 18. That is <b>3</b> bowls.", "no": "How many 6s make 18? Count the jumps.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 6 vases. <b>Each</b> vase has 9 tulips. How many tulips?", "answers": ["54", "fifty-four", "fifty four"], "why": "6 × 9: 45 + 9 = <b>54</b>.", "no": "Each vase has 9. Use your 5s, then one more group.", "placeholder": "Type a number"}, {"type": "fill", "q": "Amy has 9 tulips. Ellie has 6 tulips. How many tulips in all?", "answers": ["15", "fifteen"], "why": "9 and 6 are not equal groups. Add: <b>9 + 6 = 15</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}]}, {"type": "build", "kick": "Build it", "title": "Crayon boxes", "text": "Marion has <b>4 boxes</b>. <b>Every</b> box has <b>9 crayons</b>. Make the groups.", "groups": 4, "each": 9, "emoji": "🖍️", "why": "4 groups of 9. Double 9 is 18. Double 18 is <b>36</b>.", "hint": "Each box is one group. <b>Groups</b> = how many boxes. <b>In each group</b> = crayons in one box."}, {"type": "tap", "kick": "Fix it", "title": "Find the mistake", "items": [{"type": "fill", "q": "Mia says the hiding number in <b>6 × ? = 42</b> is 36. She did 42 − 6. What is the hiding number?", "answers": ["7", "seven"], "why": "6 × 7 = 42. The hiding number is <b>7</b>.", "no": "How many 6s make 42? Count the jumps or guess, check and fix.", "placeholder": "Type a number"}, {"q": "Theo says <b>4 × 8 = 28</b>. What is right?", "choices": ["4 × 8 = 32", "4 × 8 = 12", "He is right."], "a": 0, "why": "Double 8 is 16. Double 16 is <b>32</b>.", "no": [null, "12 is 4 + 8. Multiply.", "28 is 4 × 7. Double, double for 4 × 8."]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "How many ladybugs?", "answers": ["42", "forty-two", "fortytwo"], "why": "7 rows of 6 is the same as 6 × 7. 35 + 7 = <b>42</b>.", "no": "Turn it around: 6 × 7. Start with 5 × 7.", "placeholder": "Type a number", "visual": {"kind": "array", "rows": 7, "cols": 6, "emoji": "🐞"}}, {"type": "fill", "q": "<b>4 × ? = 28</b>", "answers": ["7", "seven"], "why": "Double 7 is 14. Double 14 is 28. So <b>4 × 7 = 28</b>.", "no": "How many 4s make 28? Count the jumps.", "placeholder": "Type a number"}, {"q": "<b>6 × ? = 48</b>", "choices": ["8", "42", "9"], "a": 0, "why": "5 × 8 = 40. 40 + 8 = 48. So <b>6 × 8 = 48</b>.", "no": [null, "42 is 48 − 6. The hiding number is how many 6s.", "6 × 9 = 54. Too big."]}, {"type": "fill", "q": "<b>8 × 4 = ?</b>", "answers": ["32", "thirty-two", "thirtytwo"], "why": "Turn it around: 4 × 8. Double 8 is 16. Double 16 is <b>32</b>.", "no": "Turn it around: 4 × 8. Double, double.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 6 kennels. <b>Every</b> kennel has 6 puppies. How many puppies?", "answers": ["36", "thirty-six", "thirty six"], "why": "Equal groups: 5 × 6 = 30, plus 6 is <b>36</b>.", "no": "Every kennel has 6. Use your 5s, then one more group.", "placeholder": "Type a number"}, {"q": "Liz walked 4 big dogs and 7 small dogs. How many dogs did she walk?", "choices": ["28", "3", "11"], "a": 2, "why": "4 and 7 are not equal groups. Add: <b>4 + 7 = 11</b>.", "no": ["4 and 7 are not equal groups. Add.", "3 is the difference. The question asks how many dogs.", null]}, {"type": "fill", "q": "Amy put 24 treats in bags. <b>Each</b> bag has 4 treats. How many bags?", "answers": ["6", "six"], "why": "4 × ? = 24. Count by 4s: 4, 8, 12, 16, 20, 24. That is <b>6</b> bags.", "no": "How many 4s make 24? Count the jumps.", "placeholder": "Type a number"}, {"q": "Which one equals <b>4 × 9</b>?", "choices": ["45 + 9", "18 + 18", "4 + 9"], "a": 1, "why": "Double 9 is 18. Double 18: 18 + 18 = <b>36</b>.", "no": ["45 + 9 is 6 × 9. This fact has a 4.", null, "4 + 9 adds. 4 × 9 is 4 groups of 9."]}], [{"type": "fill", "q": "<b>7 × 4 = ?</b>", "answers": ["28", "twenty-eight", "twentyeight"], "why": "Turn it around: 4 × 7. Double 7 is 14. Double 14 is <b>28</b>.", "no": "Turn it around: 4 × 7. Double, double.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>6 × ? = 24</b>", "answers": ["4", "four"], "why": "6, 12, 18, 24. That is 4 jumps. <b>6 × 4 = 24</b>.", "no": "How many 6s make 24? Count the jumps.", "placeholder": "Type a number"}, {"q": "<b>4 × ? = 36</b>", "choices": ["32", "9", "8"], "a": 1, "why": "Double 9 is 18. Double 18 is 36. So <b>4 × 9 = 36</b>.", "no": ["32 is 36 − 4. The hiding number is how many 4s.", null, "4 × 8 = 32. Too small."]}, {"type": "fill", "q": "How many daisies?", "answers": ["54", "fifty-four", "fiftyfour"], "why": "6 rows of 9. 5 × 9 = 45, plus 9 is <b>54</b>.", "no": "Cover the last row. 5 rows of 9 is 45.", "placeholder": "Type a number", "visual": {"kind": "array", "rows": 6, "cols": 9, "emoji": "🌼"}}, {"type": "fill", "q": "There are 6 boats. <b>Every</b> boat has 7 kids. How many kids?", "answers": ["42", "forty-two", "fortytwo"], "why": "6 equal groups of 7: 35 + 7 = <b>42</b>.", "no": "Every boat has 7. Use your 5s, then one more group.", "placeholder": "Type a number"}, {"q": "Ellie read 6 pages. Then she read 8 more pages. How many pages?", "choices": ["14", "48", "2"], "a": 0, "why": "6 and 8 are not equal groups. Add: <b>6 + 8 = 14</b>.", "no": [null, "48 is 6 × 8. These are not equal groups. Add.", "2 is the difference. The question asks how many pages."]}, {"type": "fill", "q": "Marion has 36 beads. She puts 6 on <b>each</b> string. How many strings?", "answers": ["6", "six"], "why": "6 × ? = 36. 5 × 6 = 30, plus 6 is 36. So <b>6</b> strings.", "no": "How many 6s make 36? Guess, check and fix.", "placeholder": "Type a number"}, {"q": "Which way finds <b>6 × 8</b>?", "choices": ["8, 16, 32", "40 + 8", "40 + 6"], "a": 1, "why": "5 × 8 = 40. One more group of 8: <b>40 + 8 = 48</b>.", "no": ["Double, double is for 4s. That makes 4 × 8.", null, "The extra group has 8, not 6."]}], [{"type": "fill", "q": "How many puzzle pieces?", "answers": ["48", "forty-eight", "fortyeight"], "why": "8 rows of 6 is the same as 6 × 8. 40 + 8 = <b>48</b>.", "no": "Turn it around: 6 × 8. Start with 5 × 8.", "placeholder": "Type a number", "visual": {"kind": "array", "rows": 8, "cols": 6, "emoji": "🧩"}}, {"type": "fill", "q": "<b>? × 4 = 40</b>", "answers": ["10", "ten"], "why": "Double 10 is 20. Double 20 is 40. So <b>10 × 4 = 40</b>.", "no": "How many 4s make 40? Count the jumps.", "placeholder": "Type a number"}, {"q": "<b>6 × ? = 60</b>", "choices": ["54", "10", "9"], "a": 1, "why": "5 × 10 = 50. 50 + 10 = 60. So <b>6 × 10 = 60</b>.", "no": ["54 is 60 − 6. The hiding number is how many 6s.", null, "6 × 9 = 54. Too small."]}, {"type": "fill", "q": "How many cookies?", "answers": ["36", "thirty-six", "thirtysix"], "why": "4 groups of 9. Double 9 is 18. Double 18 is <b>36</b>.", "no": "4 groups. Double, double.", "placeholder": "Type a number", "visual": {"kind": "groups", "groups": 4, "each": 9, "emoji": "🍪"}}, {"type": "fill", "q": "There are 4 shelves. <b>Each</b> shelf has 8 books. How many books?", "answers": ["32", "thirty-two", "thirtytwo"], "why": "4 equal groups of 8. Double 8 is 16. Double 16 is <b>32</b>.", "no": "Each shelf has 8. Double, double.", "placeholder": "Type a number"}, {"q": "Amy has 9 pens. Liz has 4 pens. How many pens in all?", "choices": ["36", "13", "5"], "a": 1, "why": "9 and 4 are not equal groups. Add: <b>9 + 4 = 13</b>.", "no": ["36 is 9 × 4. These are not equal groups. Add.", null, "5 is the difference. The question asks how many pens."]}, {"type": "fill", "q": "Ellie has 42 stickers. She puts 6 on <b>each</b> page. How many pages?", "answers": ["7", "seven"], "why": "6 × ? = 42. 5 × 7 = 35, plus 7 is 42. So <b>7</b> pages.", "no": "How many 6s make 42? Guess, check and fix.", "placeholder": "Type a number"}, {"q": "Theo says <b>6 × 6 = 35</b>. What did he do?", "choices": ["He added one more 5, not one more 6.", "He doubled two times.", "He is right."], "a": 0, "why": "5 × 6 = 30. He added 5. He needed one more 6: <b>30 + 6 = 36</b>.", "no": [null, "Doubling two times is for 4s. Theo used 5 × 6 = 30, then added 5.", "6 × 6 is 36, not 35."]}]]}], "win": "You proved it! 4s and 6s are yours!", "prev": "bb-bristol-L04", "prevTitle": "Lesson 4"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
