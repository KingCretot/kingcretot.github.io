gs has 4 legs.", "b": 0, "why": "<b>Every</b> frog has 4. 6 × 4.", "hint": "Find the word <b>every</b>."}, {"text": "Marion read 9 pages before lunch and 6 pages after lunch.", "b": 1, "why": "9 and 6 are different amounts that join. 9 + 6.", "hint": "Are 9 and 6 equal groups?"}], "done": "Great detective work!"}, {"type": "tap", "kick": "Shop", "title": "Price tags", "text": "Ask the 3 detective questions. Then type the number.", "items": [{"type": "fill", "q": "Hats cost <b>$9 each</b>. Ellie buys <b>4</b>. What is the total?", "answers": ["36"], "why": "Same price for each hat. 4 × 9 = <b>36</b>.", "no": "Every hat is $9. Multiply. Then check your math.", "hint": "4 × 10 = 40. Take away one 4.", "placeholder": "Type a number"}, {"type": "fill", "q": "Amy has <b>$35</b>. Kites cost <b>$5 each</b>. How many kites can she buy?", "answers": ["7"], "why": "5, 10, 15, 20, 25, 30, 35. That is <b>7</b> jumps.", "no": "Count by 5s until you reach 35. Count the jumps.", "hint": "? × 5 = 35", "placeholder": "Type a number"}, {"type": "fill", "q": "A coat costs <b>$41</b>. A hat costs <b>$16</b>. How much <b>more</b> is the coat?", "answers": ["25"], "why": "Compare: 41 − 16 = <b>25</b>. Check: 25 + 16 = 41.", "no": "How much more means subtract. Then add back to check.", "hint": "Regroup a ten: 11 − 6 in the ones.", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Be the teacher", "title": "Fix the mistake", "text": "Type the right answer.", "items": [{"type": "fill", "q": "Amy says: <i>8 × 4 = 36.</i><br>What is 8 × 4 really?", "answers": ["32"], "why": "Double, double: 8 → 16 → <b>32</b>. 36 is 9 × 4.", "no": "Use double, double. Then check your math.", "hint": "Double 8 is 16. Double 16.", "placeholder": "Type a number"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"q": "Which number sentence matches the picture?", "choices": ["3 × 6 = 18", "5 + 3 + 6 = 14", "3 × 5 = 15"], "a": 1, "why": "The groups are 5, 3 and 6. Not equal, so add: 5 + 3 + , "8 baskets with 3 eggs in each", "3 eggs and 8 more eggs"], "a": 0, "why": "The picture has 3 groups. Each group has 8. 3 × 8 = 24.", "no": [null, "Count the groups in the picture. There are 3.", "The picture shows equal groups, not 3 and 8 more."], "visual": {"kind": "groups", "groups": 3, "each": 8, "emoji": "🥚"}}, {"type": "fill", "q": "____ = 6 × 8", "answers": ["48"], "why": "5 × 8 = 40. One more 8: 48.", "no": "Use the 6s trick: the 5s fact plus one more 8.", "placeholder": "Type a number"}, {"type": "fill", "q": "____ × 9 = 63", "answers": ["7"], "why": "7 × 9 = 63. 10 × 7 = 70. Take away 7: 63.", "no": "What times 9 makes 63?", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 5 bunnies. Each bunny eats 3 carrots. <br>Add, subtract or multiply?", "answers": ["multiply", "multiplication", "times", "x"], "why": "<b>Each</b> bunny eats 3. Equal groups → multiply. 5 × 3 = 15.", "no": "Find the word <b>each</b>.", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "Ellie fills <b>9</b> vases. She puts <b>6</b> tulips in each vase. How many tulips?", "answers": ["54"], "why": "9 × 6. 10 × 6 = 60. Take away one 6: 54.", "no": "Each vase has 6. Multiply. Then check your math.", "placeholder": "Type a number"}, {"type": "fill", "q": "Liz read <b>26</b> pages. Amy read <b>38</b> pages. How many more pages did Amy read?", "answers": ["12"], "why": "Compare: 38 − 26 = 12. Check: 12 + 26 = 38.", "no": "How many more means subtract. Then add back to check.", "placeholder": "Type a number"}, {"type": "fill", "q": "Paint sets cost <b>$9 each</b>. Amy buys <b>3</b>. What is the total?", "answers": ["27"], "why": "3 × 9 = 27. 3 × 10 = 30. Take away 3: 27.", "no": "Every paint set is $9. Multiply. Then check your math.", "placeholder": "Type a number"}, {"q": "Marion buys <b>3 games at $8 each</b>. Ellie buys <b>4 games at $6 each</b>. Who spends more?", "choices": ["Marion", "Ellie", "They spend the same."], "a": 2, "why": "Marion: 3 × 8 = 24
