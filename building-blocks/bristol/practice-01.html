<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Practice 1</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Equal Groups or Not?</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Equal groups → multiply. Not equal → add.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bristol", "label": "Lesson 1", "title": "Equal Groups or Not?", "mastery": 85, "color": "#2E86DE", "questions": [{"q": "Are these groups equal?", "visual": {"kind": "groups", "groups": 3, "each": 6, "emoji": "🧁"}, "choices": ["Yes", "No"], "a": 0, "why": "Each group has 6.", "no": [null, "Count each group. All 3 groups have 6."]}, {"q": "Are these groups equal?", "visual": {"kind": "uneven", "sets": [2, 2, 3, 2], "emoji": "🐟"}, "choices": ["Yes", "No"], "a": 1, "why": "One group has 3.", "no": ["Count the third group. It has 3, not 2.", null]}, {"q": "There are 2 nests. Each nest has 5 eggs. How many eggs?", "visual": {"kind": "groups", "groups": 2, "each": 5, "emoji": "🥚"}, "choices": ["7", "10", "25"], "a": 1, "why": "2 × 5 = 10.", "no": ["7 is 2 + 5. That adds the nests to one nest of eggs.", null, "25 would be 5 nests. There are only 2 nests."]}, {"q": "Marion has 6 crayons. Liz has 3 crayons. How many in all?", "choices": ["9", "18", "3"], "a": 0, "why": "Not equal, so add: 6 + 3 = 9.", "no": [null, "18 is 6 × 3. There are not 6 groups of 3 here.", "3 is 6 − 3. Nobody lost any crayons."]}, {"q": "Which matches: 5 boxes, 3 toys in each box?", "choices": ["5 + 3", "5 × 3", "3 × 3"], "a": 1, "why": "5 equal groups of 3.", "no": ["Every box has 3, so the groups are equal. Multiply.", null, "There are 5 boxes, not 3."]}, {"q": "Which one is <b>NOT</b> equal groups?", "choices": ["4 cars, 4 wheels on each", "3 plates, 2 cookies on each", "A cup with 5 grapes and a cup with 9 grapes"], "a": 2, "why": "5 and 9 are different.", "no": ["Each car has 4 wheels. Those groups are equal.", "Each plate has 2 cookies. Those groups are equal.", null]}, {"q": "4 kids each have 3 balloons. How many balloons?", "choices": ["7", "12", "9"], "a": 1, "why": "4 × 3 = 12.", "no": ["7 is 4 + 3. That adds the kids to one kid's balloons.", null, "9 is only 3 groups of 3. There are 4 kids: 3, 6, 9, 12."]}, {"q": "What is 3 groups of 6?", "visual": {"kind": "groups", "groups": 3, "each": 6, "emoji": "⚽"}, "choices": ["9", "18", "12"], "a": 1, "why": "6, 12, 18. So 3 × 6 = 18.", "no": ["9 is 3 + 6. Count all 3 groups.", null, "12 is only 2 groups of 6. Count all 3 groups."]}, {"q": "Amy walked 4 blocks. Then she walked 6 blocks. How many blocks?", "choices": ["10", "24", "2"], "a": 0, "why": "Different amounts, so add: 4 + 6 = 10.", "no": [null, "24 is 4 × 6. She did not walk 4 groups of 6.", "2 is 6 − 4. The question asks how many in all."]}, {"q": "There are 6 bowls with 4 dog treats in each. Which number sentence fits?", "choices": ["6 + 4 = 10", "6 × 4 = 24", "4 × 4 = 16"], "a": 1, "why": "6 equal groups of 4: 6 × 4 = 24.", "no": ["Every bowl has 4, so the groups are equal. Multiply.", null, "There are 6 bowls, not 4."]}]});</script></body></html>
