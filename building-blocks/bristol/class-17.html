. It is a little tricky: it can say two sounds.\"", "ask": "\"What does the ea team usually say?\"", "listen": "Long e."}}, {"type": "talk", "kick": "Book Talk", "title": "Teams in my book", "text": "Think about the book you are reading.", "prompts": ["What happened in your book since Monday?", "Did you find an <b>ea</b> word? Long e or short e?", "Find a word with <b>oo</b> in your book. Read it."], "starters": ["Since Monday, …", "I found … It says …", "My oo word is …"], "notes": {"do": "About 6 minutes. She shows the page.", "ask": "\"What happened?\" \"Read me your ea word. Long or short e?\" \"Read me your oo word.\"", "listen": "An ea word with the right sound. Write her oo word on the whiteboard; you will sort it later. If she finds door or floor, say: \"That one has a different sound. We learn it later.\""}}, {"type": "recall", "kick": "Remember?", "title": "The ea team", "items": [{"q": "Read: <i>I like to ____ at night.</i>", "choices": ["red", "read", "raed"], "a": 1, "why": "You <b>read</b> a book. Long e: the ea team.", "no": ["red is a color.", null, "The e comes first in the team: e, then a."]}, {"type": "fill", "q": "🍵 A cup of hot ____ <i>(t _ _)</i>", "answers": ["tea"], "why": "<b>tea</b>: long e, so the ea team.", "no": "Say it: tea. Long e. Which team?", "placeholder": "Type the word"}], "notes": {"do": "Check Monday's After-Class score first.", "listen": "read; t-e-a. If she writes te or tee, say: \"This week the long e words use ea.\""}}, {"type": "learn", "kick": "Learn", "title": "Meet the oo team", "text": "<b>oo</b> is a vowel team too. It can say <b>two</b> sounds.", "visual": {"kind": "bigtext", "text": "m<span style=\"color:#DB2F30\">oo</span>n · b<span style=\"color:#DB2F30\">oo</span>k"}, "steps": [{"text": "🌙 <b>The moon sound.</b> Say <b>moon</b>. Your lips make a small, round circle: ooo."}, {"text": "📖 <b>The book sound.</b> Say <b>book</b>. It is short and quick."}, {"text": "Say them both: mooon … book. Hear the difference?"}], "tip": "Two sounds, one spelling: <b>oo</b>.", "notes": {"do": "She says moon and book five times each, then holds up a mirror (or watches you) to see her lips on moon.", "say": "\"We will call them the moon sound and the book sound.\"", "ask": "\"Which one is long and round? Which one is short and quick?\"", "listen": "moon is long and round; book is short and quick."}}, {"type": "learn", "kick": "Learn", "title": "The moon sound", "text": "Read each word. Make your lips round!", "steps": [{"text": "🌙 <b>moon</b>"}, {"text": "🍝 <b>food</b>"}, {"text": "🥄 <b>spoon</b>"}, {"text": "🏫 <b>school</b>"}, {"text": "🧊 <b>cool</b>"}, {"text": "🦁 <b>zoo</b>"}], "tip": "All of these have the moon sound.", "notes": {"do": "Reveal one word at a time. She reads it, then spells it out loud.", "listen": "She spells each one with oo (not u: skule, fud)."}}, {"type": "learn", "kick": "Learn", "title": "The book sound", "text": "Read each word. Short and quick!", "steps": [{"text": "📖 <b>book</b>"}, {"text": "👀 <b>look</b>"}, {"text": "👍 <b>good</b>"}, {"text": "🦶 <b>foot</b>"}, {"text": "🍳 <b>cook</b>"}, {"text": "🪵 <b>wood</b>"}], "tip": "All of these have the book sound.", "notes": {"do": "Reveal one word at a time. She reads it, then spells it out loud.", "listen": "She spells each one with oo (not one o or u: bock, gud, lok)."}}, {"type": "sort", "kick": "Sort it", "title": "Moon sound or book sound?", "text": "Read each word out loud. Tap it. Then tap the box.", "buckets": ["🌙 moon sound", "📖 book sound"], "items": [{"text": "pool", "b": 0, "why": "pool: the moon sound.", "hint": "Say it: pool. Round lips, like moon?"}, {"text": "hook", "b": 1, "why": "hook: the book sound.", "hint": "Say it: hook. Does it rhyme with book?"}, {"text": "boot", "b": 0, "why": "boot: the moon sound.", "hint": "Say it: boot. Round lips, like moon?"}, {"text": "took", "b": 1, "why": "took: the book sound.", "hint": "Say it: took. Does it rhyme with book?"}, {"text": "tooth", "b": 0, "why": "tooth: the moon sound.", "hint": "Say it: tooth. Round lips, like moon?"}, {"text": "hood", "b": 1, "why": "hood: the book sound.", "hint": "Say it: hood. Does it rhyme with good?"}, {"text": "moose", "b": 0, "why": "moose: the moon sound.", "hint": "Say it: moose. Round lips, like moon?"}, {"text": "stood", "b": 1, "why": "stood: the book sound.", "hint": "Say it: stood. Does it rhyme with good?"}], "done": "Two sounds, one team: oo!", "notes": {"do": "She reads each word out loud before she taps.", "ask": "\"Does it sound like moon or like book?\"", "listen": "Moon: pool, boot, tooth, moose. Book: hook, took, hood, stood."}}, {"type": "learn", "kick": "Fix it", "title": "bock or book?", "text": "A student wrote: <i>I read a <b>bock</b>.</i> 🤔", "steps": [{"text": "<b>bock</b> has only one o. It is not the word."}, {"text": "We hear the <b>book sound</b>. That sound is spelled with the <b>oo</b> team: b-oo-k."}, {"text": "Both oo sounds use <b>two</b> o's: m<b>oo</b>n and b<b>oo</b>k."}], "tip": "Hear the moon sound or the book sound? Write <b>oo</b>.", "notes": {"do": "She writes bock on the whiteboard, crosses it out, and writes book under it.", "say": "\"This is a real mistake. Lots of kids make it. Now you know how to fix it.\"", "ask": "\"How many o's does book need? Why?\"", "listen": "Two, because it is the oo team (the book sound)."}}, {"type": "tap", "kick": "Try it", "title": "o or oo?", "text": "Short o, like hot → <b>o</b>. Moon or book sound → <b>oo</b>.", "items": [{"type": "fill", "q": "📖 b__k <i>(you read it)</i> <br>What goes in the blank: <b>o</b> or <b>oo</b>?", "answers": ["oo"], "why": "<b>book</b> has the oo team. Both oo sounds are spelled with two o's.", "no": "Say the word. Do you hear the moon sound or the book sound? Then it is oo. Short o, like hot? Then it is o.", "placeholder": "Type o or oo"}, {"type": "fill", "q": "🔥 h__t <i>(not cold)</i> <br>What goes in the blank: <b>o</b> or <b>oo</b>?", "answers": ["o"], "why": "<b>hot</b> has a short  1, "why": "<b>spoon</b>: the moon sound, spelled oo.", "no": ["spon has one o. The moon sound needs the oo team.", null, "The moon sound is spelled oo here: spoon."]}, {"q": "🏫 We learn at ____.", "choices": ["school", "skool", "scool"], "a": 0, "why": "<b>school</b>: s-c-h, then oo, then l.", "no": [null, "school starts with s-c-h, not s-k.", "school has an h after the c: s-c-h."]}, {"q": "👀 ____ at the bird!", "choices": ["Luk", "Lok", "Look"], "a": 2, "why": "<b>Look</b>: the book sound, spelled oo.", "no": ["The book sound is spelled oo, not u.", "Lok has one o. The book sound needs the oo team.", null]}], "notes": {"do": "She reads every choice out loud before she picks.", "listen": "spoon, school, Look. school is a word to remember: s-c-h-o-o-l."}}, {"type": "tap", "kick": "Spell it", "title": "Spell the word", "items": [{"type": "fill", "q": "🦶 I hurt my ____. <i>(f _ _ t)</i>", "answers": ["foot"], "why": "<b>foot</b>: the <b>oo</b> team.", "no": "Say the word slowly. Spell the sound in the middle with the oo team.", "hint": "Fill in the frame f _ _ t. The missing letters are a vowel team.", "placeholder": "Type the word"}, {"type": "fill", "q": "🌙 The ____ is bright tonight. <i>(m _ _ n)</i>", "answers": ["moon"], "why": "<b>moon</b>: the <b>oo</b> team.", "no": "Say the word slowly. Spell the sound in the middle with the oo team.", "hint": "Fill in the frame m _ _ n. The missing letters are a vowel team.", "placeholder": "Type the word"}, {"type": "fill", "q": "🍳 Dad likes to ____ eggs. <i>(c _ _ k)</i>", "answers": ["cook"], "why": "<b>cook</b>: the <b>oo</b> team.", "no": "Say the word slowly. Spell the sound in the middle with the oo team.", "hint": "Fill in the frame c _ _ k. The missing letters are a vowel team.", "placeholder": "Type the word"}], "notes": {"do": "She writes each word on the whiteboard, then types it.", "listen": "foot, moon, cook. Check the whiteboard for two o's."}}, {"type": "tap", "kick": "Listen", "title": "Which sound?", "items": [{"type": "fill", "q": "Read the word <b>wood</b>. Does the oo sound like moon or like book? <br>Type <b>moon</b> or <b>book</b>.", "answers": ["book"], "why": "<b>wood</b> has the <b>book</b> sound.", "no": "Say moon, then your word. Say book, then your word. Which one matches?", "placeholder": "moon or book"}, {"type": "fill", "q": "Read the word <b>goose</b>. Does the oo sound like moon or like book? <br>Type <b>moon</b> or <b>book</b>.", "answers": ["moon"], "why": "<b>goose</b> has the <b>moon</b> sound.", "no": "Say moon, then your word. Say book, then your word. Which one matches?", "placeholder": "moon or book"}], "notes": {"do": "She reads the word out loud, then says moon and book next to it.", "listen": "wood: book sound. goose: moon sound."}}, {"type": "talk", "kick": "Read it", "title": "Read with oo", "text": "<i>Look at the moon from the pool. It is a good night to cook food!</i>", "prompts": ["Read the sentences out loud.", "Find every <b>oo</b> word. Is it the moon sound or the book sound?"], "starters": ["Look has the … sound.", "moon has the … sound."], "notes": {"do": "She reads, then underlines the oo words on the whiteboard copy you wrote.", "listen": "Look, good, cook: book sound. moon, pool, food: moon sound."}}, {"type": "tap", "kick": "Quick check", "title": "Show me", "items": [{"type": "fill", "q": "📖 I read a fun ____. <i>(b _ _ k)</i>", "answers": ["book"], "why": "<b>book</b>: the <b>oo</b> team.", "no": "Say the word slowly. Spell the sound in the middle with the oo team.", "hint": "Fill in the frame b _ _ k. The missing letters are a vowel team.", "placeholder": "Type the word"}, {"q": "Which word has the <b>moon</b> sound?", "choices": ["good", "cook", "food"], "a": 2, "why": "<b>food</b> has the moon sound.", "no": ["good has the book sound.", "cook has the book sound.", null]}], "notes": {"do": "On her own, no help.", "listen": "b-o-o-k (not bock); food."}}, {"type": "talk", "kick": "Wrap-up", "title": "What did you learn?", "prompts": ["What <b>two</b> sounds can oo make?", "How do you spell <b>book</b>? Why not bock?", "Name a moon word and a book word."], "starters": ["oo can say …", "b-o-o-k, because …", "A moon word is …"], "notes": {"do": "Show the task list on the course page. Tonight and Wednesday are the big homework days.", "say": "\"Tonight: the After-Class Lesson and the Lesson 16 Practice. Wednesday: this Practice, the Lesson 16 Packet, page 1 of this Packet and the reading lesson. Read 10 minutes each day.\"", "listen": "The moon sound and the book sound; two o's because it is the oo team."}}], "win": "Wow! The oo team is on your side too!", "prev": "bb-bristol-L16", "prevTitle": "Lesson 16"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>
