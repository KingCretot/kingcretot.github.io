the families for I, you, he, she, it, we and they. Today: everything mixed, two rule-breakers, and you write your own.\"", "ask": "\"Which letters drop out of will? Of have?\"", "listen": "w and i; h and a."}}, {"type": "talk", "kick": "Book Talk", "title": "Contractions in my book", "text": "Think about the book you are reading.", "prompts": ["What happened in your book this week?", "Find a contraction that is <b>not</b> an n't word. What two words make it?", "Read what a character says. Now say it with <b>no</b> contractions. Does it sound different?"], "starters": ["This week, …", "I found … It means …", "The long way sounds …"], "notes": {"do": "About 6 minutes. She finds a contraction like I'm, it's, you're or I'll in a part where someone talks.", "ask": "\"What two words make it?\" \"Why do you think the author used a contraction there?\"", "listen": "The two words are right. People talk with contractions, so the talking sounds real."}}, {"type": "recall", "kick": "Remember?", "title": "Tuesday's families", "items": [{"q": "Which word means <b>they have</b>?", "choices": ["they're", "they've", "they'll"], "a": 1, "why": "they have → <b>they've</b>.", "no": ["they're means they are.", null, "they'll means they will."]}, {"type": "fill", "q": "Look after the apostrophe. <br><b>you'll</b> = you ____", "answers": ["will"], "why": "you'll is short for <b>you will</b>.", "no": "ll is after the apostrophe. Which word ends with ll?", "placeholder": "Type the word"}], "notes": {"do": "Check Tuesday's After-Class score and Wednesday's packet work first.", "listen": "they've; will. Look at Wednesday's packet for apostrophes in the wrong spot."}}, {"type": "learn", "kick": "Learn", "title": "The rule-breaker: won't", "text": "<b>will not</b> → <b>won't</b>", "visual": {"kind": "bigtext", "text": "will not → won't", "sub": "will changes to wo."}, "steps": [{"text": "won't does <b>not</b> follow the rule."}, {"text": "<b>will</b> changes to <b>wo</b>."}, {"text": "Then add <b>n't</b>, like the not family: <b>won't</b>."}], "tip": "<b>won't</b> means will not. It does not mean <b>want</b>!", "notes": {"do": "She writes will not on the whiteboard, then writes won't under it.", "say": "\"won't is a rule-breaker. You just have to know it.\"", "ask": "\"What does won't mean? Is it the same as want?\"", "listen": "\"will not.\" won't and want sound close. Say both slowly: I won't go. I want to go."}}, {"type": "learn", "kick": "Learn", "title": "Let's go!", "text": "<b>let us</b> → <b>let's</b>", "visual": {"kind": "contraction", "a": "let", "b": "us", "drop": [0], "result": "let's"}, "steps": [{"text": "The <b>u</b> drops out. The apostrophe takes its place."}, {"text": "We say <b>let's</b> when we ask friends to do something with us: <i>Let's play!</i>"}], "tip": "<b>lets</b> with no apostrophe is a different word: <i>Mom lets me play.</i>", "notes": {"do": "She builds let's with a card that says let us and a sticky note over the u.", "ask": "\"Which letter did you cover?\" \"Say a sentence that starts with Let's.\"", "listen": "The u. Any let's sentence that asks someone to do something together."}}, {"type": "tap", "kick": "Try it", "title": "Try the new ones", "items": [{"type": "fill", "q": "The baby ____ go to sleep. <i>(will not)</i>", "answers": ["won't", "won’t"], "why": "will not → <b>won't</b>. won't breaks the rule: will changes to wo, then add n't.", "no": "This is the rule-breaker. will changes to wo. Then add n't.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "____ go to the park! <i>(Let us)</i>", "answers": ["Let's", "Let’s"], "why": "Let us → <b>Let's</b>. The apostrophe takes the place of the <b>u</b>.", "no": "Push <b>Let us</b> together. Take out the <b>u</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"q": "What does <b>won't</b> mean?", "choices": ["want", "will not", "was not"], "a": 1, "why": "won't is short for <b>will not</b>.", "no": ["want sounds close, but it means you wish for something.", null, "was not makes wasn't."]}], "notes": {"do": "She writes each one on the whiteboard, then types it.", "listen": "won't, Let's, will not."}}, {"type": "learn", "kick": "Remember", "title": "All the families", "text": "Look <b>after</b> the apostrophe to find the hiding word.", "steps": [{"text": "<b>n't</b> → not: don't, isn't, aren't, wasn't, didn't, doesn't, can't, won't"}, {"text": "<b>'m</b> → am: I'm · <b>'re</b> → are: you're, we're, they're · <b>'s</b> → is: he's, she's, it's"}, {"text": "<b>'ll</b> → will: I'll, you'll, we'll · <b>'ve</b> → have: I've, we've, they've"}, {"text": "<b>'s</b> in let's → us"}], "tip": "The odd ones: can't (n and o drop out), won't (will changes) and let's (us).", "notes": {"do": "She reads each row out loud. Then you cover the slide and she names one word from each family.", "listen": "One word from each family, from memory."}}, {"type": "sort", "kick": "Sort it", "title": "Which word is hiding?", "text": "Tap a word. Then tap the box with the word that made it.", "buckets": ["not", "am, are or is", "will or have"], "items": [{"text": "I'm", "b": 1, "why": "I'm = I <b>am</b>.", "hint": "Only an m is after the apostrophe."}, {"text": "won't", "b": 0, "why": "won't = will <b>not</b>. It ends with n't.", "hint": "Look at the end: n't."}, {"text": "you'll", "b": 2, "why": "you'll = you <b>will</b>.", "hint": "ll is after the apostrophe."}, {"text": "wasn't", "b": 0, "why": "wasn't = was <b>not</b>.", "hint": "Look at the end: n't."}, {"text": "we'll", "b": 2, "why": "we'll = we <b>will</b>.", "hint": "ll is after the apostrophe."}, {"text": "I've", "b": 2, "why": "I've = I <b>have</b>.", "hint": "ve is after the apostrophe."}, {"text": "it's", "b": 1, "why": "it's = it <b>is</b>.", "hint": "Only an s is after the apostrophe."}, {"text": "they're", "b": 1, "why": "they're = they <b>are</b>.", "hint": "re is after the apostrophe."}, {"text": "can't", "b": 0, "why": "can't = can <b>not</b>.", "hint": "Look at the end: n't."}], "done": "You found every hiding word!", "notes": {"do": "She taps and says the two long words for each one.", "listen": "won't = will not is the tricky one: it goes in the not box."}}, {"type": "talk", "kick": "Hands on", "title": "Contraction cards", "text": "Pick a card. Write the contraction on the whiteboard.", "prompts": ["Pick a card. Read the two words.", "Write the contraction. Where does the apostrophe go?", "Say a sentence with it."], "starters": ["The card says …", "The apostrophe goes …", "My sentence is …"], "notes": {"do": "About 6 minutes. Shuffle the 8 cards from slide 1 (will not, let us, they are, I have, does not, she is, we will, can not). She picks one at a time, writes the contraction on the whiteboard and says a sentence with it.", "ask": "\"Which letters dropped out?\"", "listen": "won't, let's, they're, I've, doesn't, she's, we'll, can't, each with the apostrophe in the right spot. If she writes wo'nt or wont, show her the n't ending again."}}, {"type": "learn", "kick": "Learn", "title": "Which one makes sense?", "text": "Read the sentence the <b>long way</b>. Does it make sense?", "steps": [{"text": "<i>The dog ____ stop barking.</i><br>won't → The dog <b>will not</b> stop barking. ✅<br>want → The dog <b>want</b> stop barking. ❌"}, {"text": "<i>Liz ____ at home. She is at school.</i><br>isn't → Liz <b>is not</b> at home. ✅<br>aren't → Liz <b>are not</b> at home. ❌"}], "tip": "Say it the long way. Your ears will tell you!", "notes": {"do": "She reads each sentence out loud both ways.", "ask": "\"Which one sounds right? Why?\"", "listen": "\"Liz is one girl, so is.\" Let her ears do the work."}}, {"type": "tap", "kick": "Try it", "title": "Pick the one that makes sense", "items": [{"q": "Amy ____ go out. She has a cold.", "choices": ["can't", "isn't", "we'll"], "a": 0, "why": "Amy <b>can not</b> go out. → <b>can't</b>.", "no": [null, "Say it the long way: <i>Amy is not go out.</i> That does not make sense.", "we'll means we w
