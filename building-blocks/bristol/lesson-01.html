iply. Not equal → add."}, {"type": "tap", "kick": "Try it", "title": "Word problems", "items": [{"type": "fill", "q": "There are 3 bags. Each bag has 6 bones. <b>Multiply</b> or <b>add</b>? Type one word.", "answers": ["multiply", "times", "multiplication", "multiplying", "x", "×", "*"], "why": "Each bag has 6. Equal groups, so multiply.", "no": "Is every group the same? Look for <b>each</b> or <b>every</b>.", "placeholder": "multiply or add", "visual": {"kind": "groups", "groups": 3, "each": 6, "emoji": "🦴"}}, {"type": "fill", "q": "3 bags. 6 bones in each bag. How many bones in all?", "answers": ["18", "eighteen"], "why": "6, 12, 18. So <b>3 × 6 = 18</b>.", "no": "Not yet. Count all 3 bags. Each bag has 6.", "hint": "Skip count by 6s: 6, 12, …", "placeholder": "Type a number"}, {"q": "Liz walks 4 puppies. Then she walks 5 more. Which one tells how many puppies in all?", "choices": ["4 × 5", "4 + 5", "5 − 4"], "a": 1, "why": "4 and 5 are not equal groups, so add: <b>4 + 5 = 9</b>.", "no": ["4 × 5 means 4 groups of 5. Liz did not walk 4 groups.", null, "Nobody went away. She walked more."]}]}, {"type": "tap", "kick": "Fix it", "title": "Find the mistake", "items": [{"type": "fill", "q": "There are 6 cats and 3 dogs at the vet. Ellie says 6 × 3 = 18 pets. Oops! How many pets are there?", "answers": ["9", "nine"], "why": "6 and 3 are not equal groups. Add: <b>6 + 3 = 9</b> pets.", "no": "Cats and dogs are not equal groups. Add them.", "hint": "6 + 3 = ?", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 4 vases. Each vase has 5 roses. Liz says 4 + 5 = 9 roses. Oops! How many roses are there?", "answers": ["20", "twenty"], "why": "Each vase has 5. Equal groups: <b>4 × 5 = 20</b> roses.", "no": "Each vase has 5. That is equal groups.", "hint": "Count by 5s: 5, 10, …", "placeholder": "Type a number"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Look at the donuts. Are the groups equal? Type <b>equal</b> or <b>not e
