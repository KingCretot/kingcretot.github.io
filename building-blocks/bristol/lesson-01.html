<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 1: Equal Groups or Not?</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L01", "label": "Lesson 1", "title": "Equal Groups or Not?", "goal": "I can tell if groups are equal, and pick multiply or add.", "date": "2026-10-20", "mastery": 85, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Equal Groups or Not?", "text": "Today you are a <b>group detective</b>. 🔍 You will look at groups and decide: are they <b>equal</b>?", "visual": {"kind": "emoji", "text": "🔍🍪🍪🍪"}}, {"type": "talk", "kick": "Book Talk", "title": "Tell me about your book", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["What happened the last time you read?", "Who was in that part of the story?", "How did Amy feel? What clue tells you?"], "starters": ["Last time, …", "Amy felt … because …", "The clue is …"]}, {"type": "learn", "kick": "Learn", "title": "What are equal groups?", "text": "<b>Equal groups</b> have the <b>same number</b> in every group.", "visual": {"kind": "groups", "groups": 3, "each": 4, "emoji": "🍪", "label": "3 groups. Each group has 4."}, "tip": "Count each group. If every group has the same number, the groups are equal."}, {"type": "learn", "kick": "Learn", "title": "These are NOT equal", "text": "Look! The groups have different numbers.", "visual": {"kind": "uneven", "sets": [4, 2, 5], "emoji": "🐚"}, "tip": "One group has 4. One has 2. One has 5. Not the same, so <b>not equal</b>."}, {"type": "tap", "kick": "Try it", "title": "Equal or not?", "items": [{"q": "Are these groups equal?", "visual": {"kind": "groups", "groups": 4, "each": 3, "emoji": "⭐"}, "choices": ["Yes, equal", "No, not equal"], "a": 0, "why": "Every group has 3 stars.", "no": [null, "Count each group. Do they all have 3?"]}, {"q": "Are these groups equal?", "visual": {"kind": "uneven", "sets": [3, 3, 4], "emoji": "🍓"}, "choices": ["Yes, equal", "No, not equal"], "a": 1, "why": "Two groups have 3, but one group has 4.", "no": ["Count the last group. Does it have 3?", null]}, {"q": "Each bag has 5 marbles. There are 2 bags. Are the groups equal?", "visual": {"kind": "emoji", "text": "👜👜"}, "choices": ["Yes, equal", "No, not equal", "I can't tell"], "a": 0, "why": "The words <b>each bag has 5</b> tell you every group is the same.", "no": [null, "Read it again: <b>each</b> bag has 5.", "The word <b>each</b> is your clue."]}]}, {"type": "learn", "kick": "Learn", "title": "Equal groups? Multiply!", "text": "When groups are equal, you can <b>multiply</b>. It is faster than counting!", "steps": [{"text": "<b>Step 1.</b> How many groups? <b>3</b>", "visual": {"kind": "groups", "groups": 3, "each": 4, "emoji": "🍪"}}, {"text": "<b>Step 2.</b> How many in each group? <b>4</b>"}, {"text": "<b>Step 3.</b> Groups × in each: <b>3 × 4 = 12</b>", "visual": {"kind": "bigtext", "text": "3 × 4 = 12"}}, {"text": "<b>Step 4.</b> Check by skip counting by 4s.", "visual": {"kind": "numberline", "start": 0, "jump": 4, "jumps": 3}}]}, {"type": "build", "kick": "Build it", "title": "Theo's apple bags", "text": "Theo has <b>4 bags</b>. Each bag has <b>6 apples</b>. Make the groups.", "groups": 4, "each": 6, "emoji": "🍎", "why": "4 groups of 6. That is <b>4 × 6 = 24</b> apples.", "hint": "How many bags? How many apples in each bag?"}, {"type": "learn", "kick": "Learn", "title": "Not equal? Add!", "text": "Mia has <b>5 shells</b>. Theo has <b>3 shells</b>. How many in all?", "visual": {"kind": "uneven", "sets": [5, 3], "emoji": "🐚"}, "steps": [{"text": "The groups are <b>not equal</b> (5 and 3)."}, {"text": "So we <b>add</b>: <b>5 + 3 = 8</b> shells.", "visual": {"kind": "bigtext", "text": "5 + 3 = 8"}}], "tip": "You can only multiply when every group is the same."}, {"type": "sort", "kick": "Sort it", "title": "Multiply or add?", "text": "Tap a card. Then tap the right box.", "buckets": ["✖️ Multiply<br><small>equal groups</small>", "➕ Add<br><small>not equal</small>"], "items": [{"text": "3 boxes, 6 crayons in each box", "b": 0, "why": "Each box has 6, so the groups are equal.", "hint": "Every box has 6. Are they equal?"}, {"text": "Amy has 4 dog treats. Ellie has 7 dog treats.", "b": 1, "why": "4 and 7 are not the same.", "hint": "Does Amy have the same number as Ellie?"}, {"text": "5 dogs, 4 legs on each dog", "b": 0, "why": "Every dog has 4 legs.", "hint": "Does every dog have the same number of legs?"}, {"text": "A red bag has 8 beads and a blue bag has 2 beads.", "b": 1, "why": "8 and 2 are different.", "hint": "Do both bags have the same number?"}, {"text": "6 rows of chairs, 3 chairs in each row", "b": 0, "why": "Each row has 3 chairs.", "hint": "Is every row the same?"}, {"text": "Mia picked 9 flowers. Then she picked 6 more.", "b": 1, "why": "9 and 6 are not equal groups.", "hint": "Is 9 the same as 6?"}], "done": "Equal groups → multiply. Not equal → add."}, {"type": "tap", "kick": "Try it", "title": "Word problems", "items": [{"q": "There are 4 tables. Each table has 6 cups. Which matches the problem?", "visual": {"kind": "groups", "groups": 4, "each": 6, "emoji": "🥤"}, "choices": ["4 + 6", "4 × 6", "6 − 4"], "a": 1, "why": "4 equal groups of 6, so <b>4 × 6 = 24</b>.", "no": ["4 + 6 adds the tables to the cups on one table. Every table has 6.", null, "Nobody took cups away."]}, {"q": "Amy found 3 clues on Monday and 5 clues on Tuesday. How many clues?", "visual": {"kind": "uneven", "sets": [3, 5], "emoji": "🔎"}, "choices": ["3 × 5", "3 + 5", "5 × 5"], "a": 1, "why": "3 and 5 are not equal groups, so add: <b>3 + 5 = 8</b>.", "no": ["You can't multiply. 3 and 5 are not the same size.", null, "There are not 5 groups of 5."]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "Are these groups equal?", "visual": {"kind": "uneven", "sets": [6, 6, 5], "emoji": "🍩"}, "choices": ["Yes", "No"], "a": 1, "why": "One group has 5, not 6."}, {"q": "Which one means <b>3 groups of 5</b>?", "choices": ["5 groups with 3 in each", "3 groups with 3 in each", "3 groups with 5 in each"], "a": 2, "why": "3 groups, 5 in each."}, {"q": "There are 5 vases. Each vase has 4 roses. How many roses?", "visual": {"kind": "groups", "groups": 5, "each": 4, "emoji": "🌹"}, "choices": ["20", "9", "16"], "a": 0, "why": "5 × 4 = 20."}, {"q": "Liz has 7 stickers. Ellie has 4 stickers. How many stickers in all?", "choices": ["11", "28", "3"], "a": 0, "why": "Not equal groups, so add: 7 + 4 = 11."}, {"q": "Which problem needs <b>multiply</b>?", "choices": ["Mia has 6 pens and Theo has 2 pens.", "There are 4 tents with 6 kids in each tent.", "Amy read 5 pages, then 9 pages."], "a": 1, "why": "Each tent has 6, so the groups are equal."}, {"q": "6 dogs. Each dog has 2 ears. Which is right?", "choices": ["6 + 2 = 8 ears", "6 − 2 = 4 ears", "6 × 2 = 12 ears"], "a": 2, "why": "6 equal groups of 2: 6 × 2 = 12."}, {"q": "A bag has 3 red balls and 8 blue balls. Which do you do?", "choices": ["Add: 3 + 8", "Multiply: 3 × 8", "Take away: 8 − 3"], "a": 0, "why": "Two groups, 3 and 8, are not equal. Add to find all the balls."}, {"q": "Skip count by 4s: 4, 8, 12, ___. What comes next?", "visual": {"kind": "numberline", "start": 0, "jump": 4, "jumps": 3}, "choices": ["14", "16", "13"], "a": 1, "why": "12 + 4 = 16, so 4 × 4 = 16."}]}], "win": "You are a real group detective!", "prev": null, "prevTitle": ""});</script></body></html>
