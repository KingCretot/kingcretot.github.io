3 before moving on."}}, {"type": "talk", "kick": "Book Talk", "title": "Who helps Amy?", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["Who helps Amy the most? What do they do?", "What is one clue the girls found?", "If you were Amy, what would you do next?"], "starters": ["… helps Amy by …", "One clue is …", "If I were Amy, I would …"], "notes": {"do": "5–6 minutes. Tap the gold button for each strong answer.", "ask": "Who helps Amy the most, and how? What is one clue the girls found? What would you do next as Amy?", "listen": "A named helper with an action, a specific clue from the book, and a reason for her choice."}}, {"type": "recall", "kick": "Remember", "title": "Double, double", "items": [{"type": "fill", "q": "Ellie has 4 boxes. <b>Each</b> box has 7 crayons. How many crayons?", "visual": {"kind": "groups", "groups": 4, "each": 7, "emoji": "🖍️"}, "answers": ["28", "twenty-eight", "twenty eight"], "why": "4 equal groups of 7. Double 7 is 14, double 14 is <b>28</b>.", "no": "Each box has 7. Double, double.", "placeholder": "Type a number"}, {"q": "A picture has <b>4 rows of 9</b> stars. How many stars?", "visual": {"kind": "array", "rows": 4, "cols": 9, "emoji": "⭐"}, "choices": ["32", "13", "36"], "a": 2, "why": "Double 9 is 18. Double 18 is <b>36</b>.", "no": ["32 is 4 × 8. Each row has 9.", "13 is 4 + 9. The rows are equal, so multiply.", null]}], "notes": {"do": "Before she answers, she says the two doubles out loud (\"7, 14, 28\"). Open last night's after-class score on Formspree and note any missed 4s facts.", "listen": "28 and 36. If she gives 14, she stopped after one double: redo it with 4 cups of beans."}}, {"type": "learn", "kick": "Learn", "title": "You know your 5s", "text": "Count by 5s. These facts will help with the 6s.", "visual": {"kind": "bigtext", "text": "5, 10, 15, 20, 25, 30, 35, 40, 45, 50", "sub": "5 × 1 up to 5 × 10"}, "steps": [{"text": "5 × 4 = <b>20</b>"}, {"text": "5 × 7 = <b>35</b>"}, {"text": "5 × 9 = <b>45</b>"}], "tip": "The 5s are the base for the 6s. Make them quick!", "notes": {"do": "Quick oral round before clicking: say 5 × 3, 5 × 8, 5 × 6, 5 × 9. She answers fast.", "ask": "What is 5 × 7? How do you know?", "listen": "Instant 5s. If she has to count from 5 every time, count the 5s together once, touching a finger for each 5."}}, {"type": "learn", "kick": "Learn", "title": "6 groups = 5 groups + 1 more", "text": "<b>6 × 4</b> means <b>6 groups of 4</b>.", "visual": {"kind": "groups", "groups": 6, "each": 4, "emoji": "🐾"}, "steps": [{"text": "Cover one group. Now you see <b>5 groups of 4</b>. 5 × 4 = <b>20</b>. You know that one!", "visual": {"kind": "groups", "groups": 5, "each": 4, "emoji": "🐾"}}, {"text": "Now add back the <b>one more group</b>. It has <b>4</b>.", "visual": {"kind": "groups", "groups": 1, "each": 4, "emoji": "🐾"}}, {"text": "<b>20 + 4 = 24</b>. So <b>6 × 4 = 24</b>.", "visual": {"kind": "bigtext", "text": "6 × 4 = 24", "sub": "20 + 4 = 24"}}], "tip": "6 is 5 and 1 more. So <b>×6</b> is <b>the 5s fact plus one more group</b>.", "notes": {"do": "She makes 6 cups with 4 beans in each. Lay the index card over one cup.", "say": "6 groups is 5 groups and 1 more group. Hide one cup. What is left is a 5s fact.", "ask": "How many cups can you see? How many beans in them? Now lift the card. How many more?", "listen": "\"5 × 4 = 20. Plus 4 more is 24.\" If she says 21, ask: \"How many beans are under the card?\""}}, {"type": "tap", "kick": "Your turn", "title": "Try 6 × 3", "text": "Hide one group. Use your 5s. Then add the group back.", "visual": {"kind": "groups", "groups": 6, "each": 3, "emoji": "🫘"}, "items": [{"type": "fill", "q": "Cover one group. 5 × 3 = ____", "answers": ["15", "fifteen"], "why": "5 groups of 3: <b>5 × 3 = 15</b>.", "no": "Count by 5s three times: 5, 10, 15.", "placeholder": "Type a number"}, {"type": "fill", "q": "Add one more group of 3. 15 + 3 = ____", "answers": ["18", "eighteen"], "why": "15 + 3 = <b>18</b>. So 6 × 3 = 18.", "no": "The last group has 3. Add 3.", "placeholder": "Type a number"}], "notes": {"do": "She builds 6 cups of 3 beans and covers one before she types.", "listen": "15, then 18. If she types 16, she added one bean, not one group."}}, {"type": "learn", "kick": "Learn", "title": "Try it with 6 × 7", "text": "Here are <b>6 rows of 7</b> paw prints.", "visual": {"kind": "array", "rows": 6, "cols": 7, "emoji": "🐾", "label": "6 rows of 7"}, "steps": [{"text": "The top <b>5 rows</b>: 5 × 7 = <b>35</b>."}, {"text": "The last row: <b>one more 7</b>."}, {"text": "<b>35 + 7 = 42</b>. So <b>6 × 7 = 42</b>."}], "tip": "Add one more <b>group</b>, not one more <b>dot</b>. 6 × 7 is 35 + 7, not 35 + 1.", "notes": {"do": "On the whiteboard draw 6 rows of 7 dots. She covers the bottom row with the index card.", "ask": "How many in the top 5 rows? How many in the last row?", "listen": "\"35 on top, 7 more, 42.\""}}, {"type": "learn", "kick": "Watch out", "title": "One more GROUP, not one more", "text": "Theo did <b>6 × 7</b> like this: 35 + 1 = 36. ❌", "steps": [{"text": "The extra group is not 1 bean. It is a whole <b>group of 7</b>.", "visual": {"kind": "groups", "groups": 1, "each": 7, "emoji": "🫘"}}, {"text": "So add 7, not 1: <b>35 + 7 = 42</b> ✅", "visual": {"kind": "bigtext", "text": "35 + 7 = 42"}}], "tip": "Ask: how many are in each group? Add that many.", "notes": {"do": "Make 6 cups of 7 beans and cover one cup with the card.", "say": "This is the mistake most kids make. Theo forgot that the hidden cup has 7 beans in it.", "ask": "How many beans are under the card?", "listen": "\"7.\" Then she fixes Theo's answer: 42."}}, {"type": "tap", "kick": "Your turn", "title": "Fives and one more", "items": [{"q": "<b>6 × 8</b>: 5 × 8 = 40. What is next?", "choices": ["40 + 8 = 48", "40 + 1 = 41", "40 + 6 = 46"], "a": 0, "why": "Add one more group of 8: <b>40 + 8 = 48</b>.", "no": [null, "You added one dot. Add one more <b>group</b> of 8.", "The extra group has 8 in it, not 6."]}, {"type": "fill", "q": "<b>6 × 9 = ?</b>", "answers": ["54", "fifty-four", "fifty four"], "why": "5 × 9 = 45. One more 9: <b>45 + 9 = 54</b>.", "no": "Start with 5 × 9.", "hint": "5 × 9 = 45. Now add 9. 5 + 9 = 14 ones, so regroup.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>6 × 10 = ?</b>", "answers": ["60", "sixty"], "why": "5 × 10 = 50. One more 10: <b>50 + 10 = 60</b>.", "no": "Start with 5 × 10.", "placeholder": "Type a number"}], "notes": {"do": "For each fact she says the 5s fact first, then \"plus one more ___\".", "listen": "48, 54, 60. On 45 + 9 watch the regrouping (she may write 44 or 414)."}}, {"type": "build", "kick": "Build it", "title": "Treat bowls", "text": "Liz sets out <b>6 bowls</b>. She puts <b>6 treats</b> in each bowl. Make the groups.", "groups": 6, "each": 6, "emoji": "🦴", "why": "6 groups of 6. 5 × 6 = 30, plus one more 6: <b>30 + 6 = 36</b>.", "hint": "How many bowls? How many treats in each bowl?", "notes": {"do": "She builds 6 cups of 6 beans first, then sets the buttons on screen.", "ask": "Which cup do you hide? What is 5 × 6? What do you add?", "listen": "\"30 plus one more 6 is 36.\""}}, {"type": "order", "kick": "Put in order", "title": "How to do 6 × 9", "text": "Tap the steps in the right order.", "steps": ["Read the fact: 6 × 9", "Think: 5 × 9 = 45", "Add one more group of 9", "45 + 9 = 54"], "why": "Find the 5s fact, add one more group, then you have the 6s fact.", "hint": "First find the 5s fact.", "notes": {"ask": "Why does \"Add one more group of 9\" come before 45 + 9?", "listen": "\"First you decide what to add, then you add it.\""}}, {"type": "learn", "kick": "Learn", "title": "4s or 6s? Pick the trick", "text": "Look for the <b>4</b> or the <b>6</b>.", "visual": {"kind": "bigtext", "text": "4 → double, double<br>6 → 5s + one more group"}, "steps": [{"text": "<b>4 × 8</b>: double 8 is 16. Double 16 is <b>32</b>."}, {"text": "<b>6 × 8</b>: 5 × 8 = 40. Plus 8 is <b>48</b>."}, {"text": "<b>8 × 6</b>: turn it e?", "visual": {"kind": "groups", "groups": 4, "each": 8, "emoji": "🍪"}, "choices": ["8 × 8", "4 + 8", "4 × 8"], "a": 2, "why": "4 groups with 8 in each: <b>4 × 8 = 32</b>.", "no": ["There are 4 groups, not 8.", "The groups are equal. Multiply.", null]}, {"type": "fill", "q": "How many flowers in all?", "visual": {"kind": "array", "rows": 6, "cols": 8, "emoji": "🌸"}, "answers": ["48", "forty-eight", "forty eight"], "why": "6 rows of 8. 5 × 8 = 40, plus 8 is <b>48</b>.", "no": "Cover the last row. 5 rows of 8 is 40.", "placeholder": "Type a number"}], "notes": {"ask": "How many groups? How many in each? Which trick?", "listen": "30, 4 × 8, 48. On the array she should cover the bottom row with the card."}}, {"type": "tap", "kick": "Your turn", "title": "Word problems", "text": "Equal groups? Multiply. Not equal? Add.", "items": [{"type": "fill", "q": "Amy's mom has 6 cages. <b>Each</b> cage has 3 bunnies. How many bunnies?", "answers": ["18", "eighteen"], "why": "6 equal groups of 3: 15 + 3 = <b>18</b>.", "no": "Each cage has 3. Use your 5s, then one more group.", "placeholder": "Type a number"}, {"q": "There are 4 vans. Each van has 6 dogs. How many dogs?", "choices": ["10", "24", "20"], "a": 1, "why": "4 equal groups of 6. Double 6 is 12, double 12 is <b>24</b>.", "no": ["10 is 4 + 6. Each van has 6, so multiply.", null, "20 is 4 × 5. Each van has 6."]}, {"type": "fill", "q": "6 dogs barked in the morning. 8 dogs barked at night. How many barking dogs?", "answers": ["14", "fourteen"], "why": "6 and 8 are not equal groups. Add: <b>6 + 8 = 14</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}], "notes": {"do": "She reads each one aloud and points to <b>each</b> (or says it is missing) before answering.", "listen": "18, 24, 14. 48 for the barking dogs means she multiplied without a clue word."}}, {"type": "learn", "kick": "Whiteboard", "title": "Fact race", "text": "Write each fact on the whiteboard. Say the trick. Then check.", "steps": [{"text": "4 × 7: 14, <b>28</b>"}, {"text": "6 × 7: 35 + 7 = <b>42</b>"}, {"text": "4 × 9: 18, <b>36</b>"}, {"text": "6 × 9: 45 + 9 = <b>54</b>"}, {"text": "9 × 4: turn it around, <b>36</b>"}], "tip": "4s: double, double. 6s: 5s + one more group.", "notes": {"do": "Say a fact. She writes the trick work and the answer on the whiteboard, then you click to check. Do the row twice if time allows; the second time faster.", "listen": "She writes the work, not only the answer. Note any fact she has to restart."}}, {"type": "learn", "kick": "Wrap-up", "title": "Fives and one more!", "text": "6s = the 5s fact plus <b>one more group</b>.", "visual": {"kind": "bigtext", "text": "35 + 7 = 42", "sub": "6 × 7"}, "tip": "Tonight and Wednesday: check your list. It is a big list, so split it over two days.", "notes": {"do": "Open the course page and read the Lesson 4 task list with her. Show which items are for Tuesday night and which are for Wednesday.", "say": "Thursday is Prove It day: 4s and 6s mixed, hiding numbers, and word problems.", "ask": "What is the trick for 6s? What do you add?", "listen": "\"5s plus one more group. Add the number in each group.\""}}], "win": "Fives and one more! You know your 6s!", "prev": "bb-bristol-L03", "prevTitle": "Lesson 3"});</script></body></html>
