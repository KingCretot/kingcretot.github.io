<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Practice 9</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Word Problem Detective</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Ask the 3 detective questions first!</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bristol", "label": "Lesson 9", "title": "Word Problem Detective", "mastery": 85, "color": "#E67E22", "questions": [{"q": "What kind of story is this?<br><i>There were 12 birds. 5 flew away.</i>", "choices": ["➕ Put together", "➖ Take away", "✖️ Equal groups"], "a": 1, "why": "5 birds went away. Take away.", "no": ["Nothing joins. Birds flew <b>away</b>.", null, "There are no equal groups. Birds left."]}, {"q": "What kind of story is this?<br><i>There are 5 tanks. Each tank has 3 turtles.</i>", "choices": ["➕ Put together", "➖ Take away", "✖️ Equal groups"], "a": 2, "why": "<b>Each</b> tank has 3. Equal groups.", "no": ["Look for the word <b>each</b>. Every tank is the same.", "No turtles went away.", null]}, {"q": "Liz has <b>7</b> hair clips. Amy has <b>9</b> hair clips. How many hair clips in all?", "choices": ["63", "16", "2"], "a": 1, "why": "Different amounts join. 7 + 9 = 16.", "no": ["63 is 7 × 9. The girls have different amounts, so add.", null, "Nothing went away. Put them together."]}, {"q": "There are <b>8</b> tables. Every table has <b>4</b> cups. How many cups?", "choices": ["32", "12", "36"], "a": 0, "why": "8 equal groups of 4. Double 8 is 16. Double 16 is <b>32</b>.", "no": [null, "12 is 8 + 4. <b>Every</b> table has 4, so multiply.", "36 is 9 × 4. There are 8 tables."]}, {"q": "Marion has <b>15</b> ribbons. Ellie has <b>6</b>. How many more does Marion have?", "choices": ["21", "11", "9"], "a": 2, "why": "Compare: 15 − 6 = 9.", "no": ["21 is 15 + 6. <b>How many more</b> means subtract.", "Count up from 6 to 15. That is 9 jumps.", null]}, {"q": "Amy has <b>3 fish tanks</b>. Each tank has <b>9 fish</b>. Which picture fits?", "choices": ["9 tanks with 3 fish in each", "3 tanks with 9 fish in each", "A group of 3 fish and a group of 9 fish"], "a": 1, "why": "3 tanks, 9 fish in each tank.", "no": ["That switches them. How many <b>tanks</b>?", null, "<b>Each</b> tank has 9. That is equal groups."]}, {"q": "<b>6</b> dogs each wear <b>4</b> boots. How many boots?", "choices": ["24", "10", "28"], "a": 0, "why": "6 groups of 4. 6 × 4 = 24.", "no": [null, "10 is 6 + 4. Every dog wears 4 boots.", "28 is 7 × 4. There are 6 dogs."]}, {"q": "Which story needs <b>add</b>?", "choices": ["There are 7 vans with 6 kids in each van.", "Liz had 11 stamps. She used 4.", "Amy saw 8 cats and 5 dogs at the vet."], "a": 2, "why": "8 cats and 5 dogs join. 8 + 5 = 13 animals.", "no": ["<b>Each</b> van has 6. That is multiply.", "She <b>used</b> 4. That is subtract.", null]}, {"q": "A box had <b>16</b> dog treats. The puppy ate <b>9</b>. How many are left?", "choices": ["25", "8", "7"], "a": 2, "why": "Take away: 16 − 9 = 7.", "no": ["25 is 16 + 9. The puppy <b>ate</b> some, so subtract.", "Check: 8 + 9 = 17, not 16. Try again.", null]}, {"q": "There are <b>7</b> rows of carrots in the garden. Each row has <b>7</b> carrots. How many carrots?", "choices": ["14", "49", "42"], "a": 1, "why": "7 × 7 = 49. (7 × 5 = 35 and 7 × 2 = 14. 35 + 14 = 49.)", "no": ["14 is 7 + 7. That is only 2 rows.", null, "42 is 6 × 7. There are 7 rows."]}, {"q": "<i>Ellie buys 5 packs. There are 8 cards in every pack.</i><br>Which words tell you it is <b>equal groups</b>?", "choices": ["Ellie buys", "in every pack", "5 packs"], "a": 1, "why": "<b>In every pack</b> means each pack has the same number: 8.", "no": ["Those words do not tell how many are in each pack.", null, "5 packs tells how many groups. Which words say each pack is the same?"]}]});</script></body></html>
