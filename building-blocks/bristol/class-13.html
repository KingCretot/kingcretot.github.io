<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 13: Contractions: The not Family</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script>window.KCE_READALOUD=true</script><script src="clips.js"></script><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L13", "label": "Lesson 13", "title": "Contractions: The not Family", "goal": "I can push two words together to make a contraction, like don't and can't.", "date": "2026-12-07", "mastery": 85, "color": "#E84393", "slides": [{"type": "hello", "title": "Contractions", "text": "Some words can <b>push together</b>. 🤝<br>Today you learn how!", "visual": {"kind": "emoji", "text": "🤝✏️"}, "notes": {"do": "Share your screen. Check that she has, next to her: 6 paper strips (or index cards cut in half), a marker, 4 sticky notes (or small squares of paper), and her book. Ask Tia to set these out before the lesson.", "say": "\"Today you learn a new kind of word. Two words push together and become one short word.\"", "ask": "\"Have you ever seen a word with a little mark up high in the middle of it?\"", "listen": "Any example is fine (don't, I'm, it's). If she says no, say: \"You will find lots of them today.\""}}, {"type": "talk", "kick": "Book Talk", "title": "Who is talking?", "text": "Think about the book you are reading.", "prompts": ["What happened in your book since our last lesson?", "Find a part where someone <b>talks</b>. Read it out loud.", "How do you know someone is talking?"], "starters": ["Since last time, …", "… says …", "I see marks that …"], "notes": {"do": "About 6 minutes. If she finished <i>Amy and the Missing Puppy</i>, use the book she is reading now. She holds the page up to the camera.", "say": "\"When people talk, they use short words. Today you learn one kind of short word.\"", "ask": "\"Who is talking? What words did they say? How do you know?\"", "listen": "Quotation marks (talking marks) show the words someone says. If she reads the whole page, ask her to read only what the character says."}}, {"type": "recall", "kick": "Remember?", "title": "Math check", "items": [{"q": "There are <b>3</b> vans. Each van has <b>9</b> kids. Which number sentence fits?", "choices": ["3 + 9 = 12", "3 × 9 = 27", "9 × 9 = 81"], "a": 1, "why": "<b>Each</b> van has 9. Equal groups: 3 × 9 = <b>27</b>.", "no": ["Each van has 9. That is equal groups, so multiply.", null, "There are 3 vans, not 9."]}, {"type": "fill", "q": "____ = 7 × 7", "answers": ["49"], "why": "5 × 7 = 35 and 2 × 7 = 14. 35 + 14 = <b>49</b>.", "no": "Use the 7s trick: the 5s fact plus the 2s fact.", "hint": "5 × 7 = 35. 2 × 7 = 14.", "placeholder": "Type a number"}], "notes": {"do": "Zoom: she cannot tap your screen. She says the answer and you tap or type it for her. She names the trick first.", "ask": "\"Equal groups? Which operation?\" \"What is your 7s trick?\"", "listen": "3 × 9 = 27; 49 (35 + 14). If a fact slipped, note it for Tuesday."}}, {"type": "learn", "kick": "Learn", "title": "Two words become one", "text": "Read both sentences. They mean the <b>same</b> thing.", "steps": [{"text": "I <b>do not</b> like rain. <br>I <b>don't</b> like rain."}, {"text": "<b>don't</b> is a <b>contraction</b>. A contraction is two words pushed together into one word.", "visual": {"kind": "bigtext", "text": "do + not = don't"}}, {"text": "Some letters drop out. A little mark takes their place."}], "tip": "We use contractions all the time when we talk.", "notes": {"do": "She reads both sentences out loud.", "say": "\"These mean the same thing. The second one is shorter. Shorter words made from two words are called contractions.\"", "ask": "\"Which sentence is shorter? Which two words made don't?\"", "listen": "\"The second one.\" \"do and not.\" She says the word contraction back to you."}}, {"type": "learn", "kick": "Learn", "title": "Meet the apostrophe", "text": "This mark is an <b>apostrophe</b>.", "visual": {"kind": "bigtext", "text": "don<span style=\"color:#DB2F30\">'</span>t", "sub": "The red mark is the apostrophe."}, "steps": [{"text": "Say it: a-POS-tro-fee."}, {"text": "An apostrophe sits <b>up high</b>, at the top of the letters."}, {"text": "In a contraction, the apostrophe takes the place of the <b>missing letters</b>."}], "tip": "Apostrophe: up high. Comma: down low.", "notes": {"do": "She draws an apostrophe and a comma on paper and holds it up to the camera.", "ask": "\"Where does an apostrophe go: up high or down low?\" \"What does it take the place of?\"", "listen": "Up high, like a comma floating at the top. It takes the place of the missing letters."}}, {"type": "learn", "kick": "Watch me", "title": "Watch it happen", "text": "<b>do not</b> → <b>don't</b>", "steps": [{"text": "1. Write the two words: <b>do not</b>."}, {"text": "2. Take out the <b>o</b> in <b>not</b>.", "visual": {"kind": "contraction", "a": "do", "b": "not", "drop": [1], "result": "don't"}}, {"text": "3. Put an apostrophe where the <b>o</b> was."}, {"text": "4. Push the words together: <b>don't</b>."}], "tip": "The apostrophe goes where the letters were. It does not go at the end.", "notes": {"do": "Hands on, at home: she writes <b>do not</b> on a paper strip with a space between the words. She sticks a sticky note over the o in not, draws an apostrophe on the sticky note, then pushes the two halves together and holds it up.", "say": "\"Watch the o. It drops out, and the apostrophe takes its place.\"", "ask": "\"Which letter did we take out? Where did the apostrophe go?\"", "listen": "\"The o.\" \"Where the o was, between the n and the t.\""}}, {"type": "learn", "kick": "Learn", "title": "The not family", "text": "In each one, the <b>o</b> in <b>not</b> drops out.", "steps": [{"text": "is not → <b>isn't</b>", "visual": {"kind": "contraction", "a": "is", "b": "not", "drop": [1], "result": "isn't"}}, {"text": "are not → <b>aren't</b>", "visual": {"kind": "contraction", "a": "are", "b": "not", "drop": [1], "result": "aren't"}}, {"text": "was not → <b>wasn't</b>", "visual": {"kind": "contraction", "a": "was", "b": "not", "drop": [1], "result": "wasn't"}}, {"text": "did not → <b>didn't</b>", "visual": {"kind": "contraction", "a": "did", "b": "not", "drop": [1], "result": "didn't"}}, {"text": "does not → <b>doesn't</b>", "visual": {"kind": "contraction", "a": "does", "b": "not", "drop": [1], "result": "doesn't"}}], "tip": "Every word in the not family ends with <b>n't</b>.", "notes": {"do": "Reveal one at a time. She reads the two words, then the contraction. She makes <b>isn't</b> and <b>didn't</b> with paper strips and sticky notes, like don't.", "ask": "After each one: \"Which letter dropped out?\"", "listen": "The o every time. Watch for her saying \"doesn't\" as \"does not\" when she reads; have her read the contraction as one word."}}, {"type": "learn", "kick": "Learn", "title": "The odd one: can't", "text": "<b>can not</b> → <b>can't</b>", "steps": [{"text": "We often write <b>can not</b> as one word: <b>cannot</b>."}, {"text": "In <b>can't</b>, <b>two</b> letters drop out: <b>n</b> and <b>o</b>.", "visual": {"kind": "contraction", "a": "can", "b": "not", "drop": [0, 1], "result": "can't"}}, {"text": "So <b>can't</b> has only one n before the apostrophe."}], "tip": "can't: the apostrophe takes the place of <b>n</b> and <b>o</b>.", "notes": {"do": "She writes <b>can not</b> on a strip and covers the n and the o of not with one sticky note, then draws the apostrophe.", "say": "\"can't is the odd one. Two letters drop out, not one.\"", "ask": "\"How many letters did the sticky note cover? Which ones?\"", "listen": "\"Two: n and o.\" If she writes cann't, show her the strip: only one n is left."}}, {"type": "tap", "kick": "We do", "title": "Which letters are gone?", "items": [{"type": "fill", "q": "is not → isn't<br>Which letter is gone?", "answers": ["o"], "why": "The <b>o</b> in not drops out. The apostrophe takes its place.", "no": "Look at <b>not</b>. Which letter is missing in isn't?", "placeholder": "Type the letter"}, {"type": "fill", "q": "can not → can't<br>Which <b>two</b> letters are gone?", "answers": ["n and o", "o and n", "n o", "o n", "no", "on", "n, o", "o, n"], "why": "The <b>n</b> and the <b>o</b> in not drop out.", "no": "Look at <b>not</b>. Two letters are missing in can't. Which ones?", "placeholder": "Type the two letters"}, {"q": "Which shows <b>was not</b> as a contraction?", "choices": ["wasn't", "was'nt", "wasnt'"], "a": 0, "why": "The o drops out. The apostrophe goes where the o was: <b>wasn't</b>.", "no": [null, "The o was between the n and the t. The apostrophe goes there, not before the n.", "The apostrophe does not go at the end. It goes where the o was."]}], "notes": {"do": "Zoom: she says the answer and spells it. You type or tap exactly what she says.", "ask": "\"Show me on your paper strip.\"", "listen": "o; n and o; wasn't. On the last one, she should explain why was'nt is wrong."}}, {"type": "sort", "kick": "Sort it", "title": "Right spot or wrong spot?", "text": "Is the apostrophe where the letters were? Tap a word. Then tap a box.", "buckets": ["✅ Right spot", "❌ Wrong spot"], "items": [{"text": "is'nt", "b": 1, "why": "Wrong spot. The o was between n and t: isn't.", "hint": "The apostrophe takes the place of the o. Where was the o?"}, {"text": "doesn't", "b": 0, "why": "Right spot. The apostrophe is where the o was.", "hint": "Where was the o in does not?"}, {"text": "can't", "b": 0, "why": "Right spot. It takes the place of n and o.", "hint": "can not: the n and o drop out."}, {"text": "isn't", "b": 0, "why": "The o was between n and t. Right spot!", "hint": "Where was the o in is not?"}, {"text": "arent'", "b": 1, "why": "Wrong spot. An apostrophe in a contraction does not go at the end: aren't.", "hint": "Does the apostrophe go at the end?"}, {"text": "aren't", "b": 0, "why": "Right spot. The apostrophe is where the o was.", "hint": "Where was the o in are not?"}, {"text": "does'nt", "b": 1, "why": "Wrong spot. It should be doesn't.", "hint": "The apostrophe goes where the o was, between n and t."}, {"text": "ca'nt", "b": 1, "why": "Wrong spot. It should be can't.", "hint": "can stays whole. The n and o of not drop out."}], "done": "You found every apostrophe!", "notes": {"do": "She reads each word out loud and says \"right spot\" or \"wrong spot\". You tap the word, then the box she names.", "ask": "On each wrong one: \"Where should it go?\"", "listen": "The apostrophe sits between the n and the t in every not word."}}, {"type": "tap", "kick": "Spell it", "title": "Make the contraction", "text": "Say it. Then spell it out loud, letter by letter.", "items": [{"type": "fill", "q": "does not → ____", "answers": ["doesn't", "doesn’t"], "why": "does not → <b>doesn't</b>. The o drops out.", "no": "Write does, then n, apostrophe, t.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "are not → ____", "answers": ["aren't", "aren’t"], "why": "are not → <b>aren't</b>. The o drops out.", "no": "Write are, then n, apostrophe, t.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "did not → ____", "answers": ["didn't", "didn’t"], "why": "did not → <b>didn't</b>. The o drops out.", "no": "Write did, then n, apostrophe, t.", "placeholder": "Type the contraction"}], "notes": {"do": "She spells each one out loud, saying \"apostrophe\" where it goes. You type exactly what she spells.", "ask": "\"Where does the apostrophe go?\"", "listen": "d-o-e-s-n-apostrophe-t; a-r-e-n-apostrophe-t; d-i-d-n-apostrophe-t. Typing ignores the apostrophe, so YOU check the spot from what she says."}}, {"type": "tap", "kick": "Take it apart", "title": "Two words again", "items": [{"type": "fill", "q": "isn't = is ____", "answers": ["not"], "why": "isn't is short for <b>is not</b>.", "no": "Every n't word has the word <b>not</b> in it.", "placeholder": "Type the word"}, {"type": "fill", "q": "wasn't = ____ not", "answers": ["was"], "why": "wasn't is short for <b>was not</b>.", "no": "Look at the letters before n't.", "placeholder": "Type the word"}, {"q": "<b>aren't</b> means:", "choices": ["is not", "am not", "are not"], "a": 2, "why": "aren't = <b>are not</b>.", "no": ["is not makes isn't.", "Look at the letters before n't: a-r-e.", null]}], "notes": {"do": "She answers out loud. You type.", "ask": "\"What word hides at the start of wasn't?\"", "listen": "not; was; are not."}}, {"type": "talk", "kick": "Hands on", "title": "Contraction hunt", "text": "Look in your book for a word that ends with <b>n't</b>.", "prompts": ["Find a word that ends with <b>n't</b>. Spell it.", "What <b>two words</b> make it?", "Read the sentence again with the two words."], "starters": ["I found …", "It means … not.", "The sentence says …"], "notes": {"do": "About 5 minutes. She looks through her book (dialogue is the best place to look) and holds up the page.", "say": "\"Be a contraction hunter. Look in the parts where people talk.\"", "ask": "\"What two words make it? Read the sentence the long way.\"", "listen": "Any n't word. If she finds a word like Amy's, say: \"That apostrophe shows who something belongs to. We will learn that another time. Today we hunt for n't.\" If she finds won't, say: \"That one is special. We learn it on Thursday.\""}}, {"type": "tap", "kick": "Try it", "title": "Pick the contraction", "items": [{"q": "Liz ____ find her shoe. <i>(did not)</i>", "choices": ["doesn't", "didn't", "don't"], "a": 1, "why": "did not → <b>didn't</b>.", "no": ["doesn't means does not.", null, "don't means do not."]}, {"q": "Amy ____ at home. <i>(is not)</i>", "choices": ["isn't", "aren't", "wasn't"], "a": 0, "why": "is not → <b>isn't</b>.", "no": [null, "aren't means are not.", "wasn't means was not."]}, {"q": "The puppies ____ asleep. <i>(are not)</i>", "choices": ["isn't", "can't", "aren't"], "a": 2, "why": "are not → <b>aren't</b>.", "no": ["isn't means is not.", "can't means can not.", null]}], "notes": {"do": "She reads each sentence out loud with the contraction she picks, then you tap it.", "ask": "\"Read it with your word. Does it sound right?\"", "listen": "didn't, isn't, aren't."}}, {"type": "talk", "kick": "Say it", "title": "Say it both ways", "prompts": ["Say: <b>I do not like peas.</b> Now say it with a contraction.", "Say: <b>The dog is not big.</b> Now say it with a contraction.", "Make up your own sentence with <b>can't</b>."], "starters": ["I don't …", "The dog isn't …", "I can't …"], "notes": {"do": "Quick and fun. She says each sentence both ways.", "listen": "I don't like peas. The dog isn't big. Her own can't sentence makes sense."}}, {"type": "tap", "kick": "Quick check", "title": "Show me", "items": [{"type": "fill", "q": "do not → ____", "answers": ["don't", "don’t"], "why": "do not → <b>don't</b>.", "no": "Take out the o in not. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "can't = can ____", "answers": ["not"], "why": "can't is short for <b>can not</b>.", "no": "What word does n't stand for?", "placeholder": "Type the word"}], "notes": {"do": "She answers on her own, with no help. She spells don't out loud.", "listen": "d-o-n-apostrophe-t; not. If she misses either, go back to slide 6 or 8."}}, {"type": "talk", "kick": "Wrap-up", "title": "What did you learn?", "prompts": ["What is a <b>contraction</b>?", "What does the <b>apostrophe</b> do?", "Which contraction has <b>two</b> letters missing?"], "starters": ["A contraction is …", "The apostrophe takes …", "The odd one is …"], "notes": {"do": "Stop sharing for the first question so she answers from memory. Then share the course page and show tonight's task list.", "say": "\"Tonight: the After-Class Lesson and 10 minutes of reading. That's all. Look for n't words when you read!\"", "listen": "Two words pushed together; it takes the place of the missing letters; can't (n and o)."}}], "win": "You did it! You can push words together like a pro!", "prev": "bb-bristol-L12", "prevTitle": "Lesson 12"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overf
