<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 2: Prove It: Find the Groups</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script>window.KCE_READALOUD=true</script><script src="clips.js"></script><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L02", "label": "Lesson 2", "title": "Prove It: Find the Groups", "goal": "I can find the groups in a word problem and write the number sentence.", "date": "2026-10-22", "mastery": 85, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Prove It: Find the Groups", "text": "Today you <b>prove</b> what you know. 🔍 You will find the <b>groups</b> hiding in the words.", "visual": {"kind": "emoji", "text": "🔍🐶📝"}, "notes": {"do": "Before she sits down, set out: about 40 beans, the 6 index cards for the sort (class slide 7), whiteboard and marker, a highlighter, her book.", "say": "Today is <b>Prove It</b> day. On Tuesday you learned that equal groups mean multiply. Today you find the groups that hide inside the words of a story.", "ask": "What does <b>equal groups</b> mean?", "listen": "Every group has the same number. If she says \"groups that are big,\" show 3 cups of 2 beans next to cups of 2, 2, 5."}}, {"type": "talk", "kick": "Book Talk", "title": "Tell me about your book", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["What is the <b>big problem</b> in the story?", "Tell 3 things that happened <b>in order</b>.", "What would you do next if you were Amy?"], "starters": ["The big problem is …", "First, … Next, … Then, …", "If I were Amy, I would …"], "notes": {"do": "5–6 minutes. She answers out loud in full sentences. Tap the gold button for each strong answer.", "ask": "What is the big problem? Tell me 3 things that happened, in order. What would you do next if you were Amy?", "listen": "A clear problem (Ms. Sullivan's puppy, Rufus, is missing, and Amy wants to find him), three events with first, next, then. Push for a reason on the last prompt: \"I would … because …\""}}, {"type": "recall", "kick": "Remember", "title": "From Tuesday", "text": "Equal groups → <b>multiply</b>. Not equal → <b>add</b>.", "items": [{"type": "fill", "q": "Look at the groups. Are they equal? Type <b>equal</b> or <b>not equal</b>.", "visual": {"kind": "uneven", "sets": [5, 5, 4], "emoji": "🐞"}, "answers": ["not equal", "unequal", "not equal groups", "not the same", "unequal groups"], "why": "Two groups have 5. The last group has only 4. So they are <b>not equal</b>.", "no": "Count every group. Do they all have the same number?", "placeholder": "equal or not equal"}, {"type": "fill", "q": "There are 2 trays. <b>Each</b> tray has 10 muffins. Do you multiply or add? Type <b>multiply</b> or <b>add</b>.", "visual": {"kind": "groups", "groups": 2, "each": 10, "emoji": "🧁"}, "answers": ["multiply", "times", "multiplication", "x", "multiplying"], "why": "<b>Each</b> tray has 10, so the groups are equal: <b>2 × 10 = 20</b>.", "no": "Find the clue word. Is every tray the same?", "placeholder": "multiply or add"}, {"q": "Marion found 6 acorns. Amy found 9 acorns. How many acorns?", "visual": {"kind": "uneven", "sets": [6, 9], "emoji": "🌰"}, "choices": ["54", "15", "3"], "a": 1, "why": "6 and 9 are not equal groups, so add: <b>6 + 9 = 15</b>.", "no": ["54 is 6 × 9. There are not 6 groups of 9 here.", null, "3 is 9 − 6. Nobody lost any acorns."]}], "notes": {"do": "First she reads her 2 story cards from Tuesday and says multiply or add for each one. Then she says each answer below out loud and why, then types or taps it herself.", "ask": "How do you know they are not equal? What word tells you the trays are equal?", "listen": "\"The last group has only 4.\" \"Each tray has 10.\" On the acorns, 54 means she multiplied the two numbers she saw: ask, \"Are there 6 groups of 9?\""}}, {"type": "learn", "kick": "Learn", "title": "Clue words: each, every, per", "text": "These words tell you the groups are <b>equal</b>.", "visual": {"kind": "bigtext", "text": "each · every · per", "sub": "They all mean: the same in every group"}, "steps": [{"text": "<b>Read:</b> There are 5 kittens. <b>Every</b> kitten has 2 bows."}, {"text": "<b>How many groups?</b> 5 kittens. <b>How many in each?</b> 2 bows.", "visual": {"kind": "groups", "groups": 5, "each": 2, "emoji": "🎀"}}, {"text": "<b>Write it:</b> 5 × 2 = 10 bows.", "visual": {"kind": "bigtext", "text": "5 × 2 = 10"}}], "tip": "The number of groups comes first. The number in each group comes second.", "notes": {"do": "Write the kitten story on the whiteboard. She highlights <b>every</b>. Then click through the steps.", "say": "These three words are clue words. <b>Each</b>, <b>every</b> and <b>per</b> all tell you every group has the same number.", "ask": "Which number is the groups? Which number is in each group?", "listen": "5 kittens are the groups, 2 bows in each. If she says 2 groups of 5, have her point to one kitten and count its bows."}}, {"type": "tap", "kick": "Your turn", "title": "Find the groups", "text": "The vet has 3 cages. There are 2 puppies in <b>each</b> cage.", "items": [{"type": "fill", "q": "How many <b>groups</b> are there?", "answers": ["3", "three"], "why": "The cages are the groups. There are <b>3</b> cages.", "no": "Count the cages. The cages hold the puppies.", "placeholder": "Type a number"}, {"type": "fill", "q": "How many puppies are in <b>each</b> group?", "answers": ["2", "two"], "why": "<b>Each</b> cage has <b>2</b> puppies.", "no": "Read the sentence with <b>each</b>. How many puppies are in one cage?", "placeholder": "Type a number"}, {"type": "fill", "q": "3 groups of 2 = ____ puppies.", "answers": ["6", "six"], "why": "3 × 2 = 6. Skip count: 2, 4, 6.", "no": "Skip count by 2s three times.", "placeholder": "Type a number"}], "notes": {"do": "Draw 3 cages on the whiteboard. She puts 2 beans in each cage before she types.", "ask": "Point to one group. How many are in it?", "listen": "Groups = 3 (cages), each = 2. If she types 2 for the groups, she took the number of puppies. Ask: \"What holds the puppies?\""}}, {"type": "learn", "kick": "Learn", "title": "Watch out for the trap!", "text": "<b>In all</b> means find the total. It does <b>not</b> always mean multiply.", "visual": {"kind": "uneven", "sets": [4, 3], "emoji": "🐰"}, "steps": [{"text": "<b>Read:</b> Liz has 4 big bunnies and 3 baby bunnies. How many bunnies <b>in all</b>?"}, {"text": "Is there a clue word like <b>each</b>? <b>No.</b> 4 and 3 are not equal groups."}, {"text": "So we <b>add</b>: 4 + 3 = 7 bunnies. Not 4 × 3!", "visual": {"kind": "bigtext", "text": "4 + 3 = 7"}}], "tip": "Ask: are the groups the same size? Then pick multiply or add.", "notes": {"do": "Write the bunny story under the kitten story. She looks for a clue word and finds none.", "say": "<b>In all</b> means find the total. It does not tell you to multiply. You still have to check: are the groups the same size?", "ask": "Is there an each, every or per? Are 4 and 3 the same?", "listen": "\"No clue word, and 4 is not 3, so add.\" If she says 4 × 3, build 4 beans and 3 beans side by side."}}, {"type": "sort", "kick": "Sort it", "title": "Trap or not?", "text": "Look closely. Some cards have the <b>same numbers</b>! Tap a card. Then tap the right box.", "buckets": ["✖️ Multiply<br><small>equal groups</small>", "➕ Add<br><small>not equal</small>"], "items": [{"text": "Ellie has 3 cats. Each cat has 2 bows. How many bows in all?", "b": 0, "why": "<b>Each</b> cat has 2 bows: 3 × 2 = 6.", "hint": "Find the clue word. Does every cat have 2?"}, {"text": "Liz has 3 cats and 2 dogs. How many pets in all?", "b": 1, "why": "3 cats and 2 dogs are not equal groups: 3 + 2 = 5.", "hint": "Is there a clue word like each? Are 3 and 2 the same?"}, {"text": "There are 5 rows of tulips with 10 in every row.", "b": 0, "why": "<b>Every</b> row has 10: 5 × 10 = 50.", "hint": "Does every row have the same number?"}, {"text": "Amy saw 10 dogs in the morning and 5 dogs after lunch.", "b": 1, "why": "10 and 5 are different: 10 + 5 = 15.", "hint": "Did she see the same number both times?"}, {"text": "The vet gives 2 pills per day for 5 days.", "b": 0, "why": "<b>Per</b> day means each day: 5 × 2 = 10 pills.", "hint": "What does per mean?"}, {"text": "Marion has 2 red leashes and 5 blue leashes.", "b": 1, "why": "2 and 5 are not equal: 2 + 5 = 7.", "hint": "Are there 2 red and 2 blue? Look again."}], "done": "Clue word and same size → multiply. Different sizes → add.", "notes": {"do": "Lay the 6 index cards face up. She reads one, says the clue word (or \"no clue word\"), puts it in a Multiply pile or an Add pile, then taps it on screen.", "say": "Some cards use the <b>same numbers</b>. The numbers do not decide. The words decide.", "ask": "This card has a 3 and a 2. So does that one. Why does one multiply and one add?", "listen": "\"Each cat has 2 bows\" (equal) versus \"3 cats and 2 dogs\" (not equal). If she sorts by the numbers, cover the numbers with a finger and reread."}}, {"type": "tap", "kick": "Your turn", "title": "Trap or not?", "items": [{"q": "Amy has 2 bags of dog food and 5 cans of dog food. How many bags and cans in all?", "choices": ["2 × 5 = 10", "2 + 5 = 7", "5 − 2 = 3"], "a": 1, "why": "This is the trap! 2 and 5 are not equal groups, so add: <b>2 + 5 = 7</b>.", "no": ["There are not 2 groups of 5. There are 2 bags and 5 cans.", null, "Nothing was taken away."]}, {"type": "fill", "q": "<b>Each</b> of the 4 girls brings 5 treats to the shelter. How many treats?", "answers": ["20", "twenty"], "why": "<b>Each</b> girl brings 5. That is 4 groups of 5: <b>4 × 5 = 20</b>.", "no": "Every girl brings 5. Skip count by 5s, one time for each girl.", "placeholder": "Type a number"}], "notes": {"ask": "Is this one a trap? How do you know?", "listen": "Bags and cans: no clue word, 2 and 5 are different, so add (7). Girls: <b>each</b> girl brings 5, so 4 × 5 = 20. If she types 9, she added the girls to one girl's treats."}}, {"type": "learn", "kick": "Learn", "title": "Arrays are equal groups", "text": "An <b>array</b> has <b>rows</b>. Every row has the same number.", "visual": {"kind": "array", "rows": 3, "cols": 5, "emoji": "🌷"}, "steps": [{"text": "<b>Count the rows:</b> 3 rows. (A row goes across ➡️.)"}, {"text": "<b>Count one row:</b> 5 in each row."}, {"text": "<b>Multiply:</b> 3 × 5 = 15 tulips. Skip count: 5, 10, 15.", "visual": {"kind": "bigtext", "text": "3 × 5 = 15"}}], "tip": "Each row is one equal group.", "notes": {"do": "She builds 3 rows of 5 beans on the table, then skip counts 5, 10, 15 while sliding a finger across each row.", "say": "An array is equal groups lined up in rows. Each row is one group.", "ask": "How many rows? How many in each row?", "listen": "3 rows, 5 in each. If she counts down the columns, have her slide a finger across ➡️ for each row."}}, {"type": "tap", "kick": "Your turn", "title": "Read the array", "items": [{"q": "Which number sentence matches this array?", "visual": {"kind": "array", "rows": 2, "cols": 6, "emoji": "🌼"}, "choices": ["2 + 6 = 8", "2 × 6 = 12", "6 × 6 = 36"], "a": 1, "why": "2 rows with 6 in each row: <b>2 × 6 = 12</b>.", "no": ["2 + 6 adds the number of rows to one row. Count all the flowers.", null, "There are only 2 rows, not 6."]}, {"type": "fill", "q": "How many bones are in this array?", "visual": {"kind": "array", "rows": 4, "cols": 5, "emoji": "🦴"}, "answers": ["20", "twenty"], "why": "4 rows of 5: 5, 10, 15, 20. So <b>4 × 5 = 20</b>.", "no": "Count the rows. Then skip count by 5s, one time for each row.", "placeholder": "Type a number"}], "notes": {"ask": "Say the rows first, then how many in each row.", "listen": "\"2 rows of 6, 2 × 6 = 12\" and \"4 rows of 5 is 20.\" If she types 9 for the bones, she added the number of rows (4) to the number in one row (5). Have her skip count 5, 10, 15, 20, one count per row."}}, {"type": "learn", "kick": "Learn", "title": "Turn-around facts", "text": "Turn an array on its side. The total stays the <b>same</b>!", "steps": [{"text": "<b>3 rows of 4</b> = 12 apples.", "visual": {"kind": "array", "rows": 3, "cols": 4, "emoji": "🍎"}}, {"text": "Turn it! <b>4 rows of 3</b> = 12 apples.", "visual": {"kind": "array", "rows": 4, "cols": 3, "emoji": "🍎"}}, {"text": "So <b>3 × 4 = 4 × 3</b>. Both are 12.", "visual": {"kind": "bigtext", "text": "3 × 4 = 4 × 3 = 12"}}], "tip": "If you know one fact, you know its turn-around too!", "notes": {"do": "She builds 3 rows of 4 beans on a sheet of paper. Then she turns the paper a quarter turn and counts 4 rows of 3.", "say": "We did not add any beans. We did not take any away. We only turned the paper.", "ask": "Did the total change when we turned it?", "listen": "\"No, it is still 12.\" If she wants to count again, let her: that is the proof."}}, {"type": "tap", "kick": "Your turn", "title": "Turn it around", "items": [{"type": "fill", "q": "3 rows of 5 make 15. How many are in <b>5 rows of 3</b>?", "visual": {"kind": "array", "rows": 5, "cols": 3, "emoji": "🫘"}, "answers": ["15", "fifteen"], "why": "Turn-around facts have the same total: <b>5 × 3 = 15</b>.", "no": "Turn the array. Did any beans go away?", "placeholder": "Type a number"}, {"q": "Which is the turn-around fact for <b>2 × 10</b>?", "choices": ["10 × 2", "2 + 10", "10 × 10"], "a": 0, "why": "Turn it around: <b>10 × 2</b>. Both are 20.", "no": [null, "2 + 10 is adding. A turn-around fact is still multiplying.", "10 × 10 is 100. A turn-around swaps the two numbers."]}], "notes": {"ask": "What is the turn-around fact? Is the total the same?", "listen": "\"5 rows of 3 is still 15.\" On the second item, 10 × 10 means she thinks turn-around changes a number. Show 2 rows of 10 beans and turn the paper."}}, {"type": "build", "kick": "Build it", "title": "The pet store fish", "text": "The pet store has <b>5 fish tanks</b>. There are <b>3 fish</b> in every tank. Make the groups.", "groups": 5, "each": 3, "emoji": "🐠", "why": "5 groups of 3. That is <b>5 × 3 = 15</b> fish.", "hint": "The tanks are the groups. How many fish are in each tank?", "notes": {"do": "She says \"5 groups, 3 in each\" before you click the buttons together. Then she makes the 5 tanks with beans.", "ask": "Which number is the groups? How did you know?", "listen": "\"The tanks are the groups.\" Total 15 (skip count 3, 6, 9, 12, 15 or 5, 10, 15)."}}, {"type": "order", "kick": "Put in order", "title": "Detective steps", "text": "How do you solve a word problem? Tap the steps in order.", "steps": ["Read the whole problem.", "Find the groups and how many in each.", "Equal? Multiply. Not equal? Add.", "Write the number sentence.", "Check: skip count or draw it."], "why": "Read, find, choose, write, check. Use these steps every time!", "hint": "Not that one yet. Another step comes before it.", "notes": {"say": "This is your detective routine. Use it on every word problem, in class and in your packet.", "ask": "Why do we read the whole problem first?", "listen": "\"So we know what is happening before we pick.\" If she starts with \"multiply,\" remind her that we choose only after we find the groups."}}, {"type": "learn", "kick": "Whiteboard", "title": "Write the number sentence", "text": "Listen to each story. Write the <b>number sentence</b> on the whiteboard.", "steps": [{"text": "<b>Story 1:</b> Marion has 2 baskets. <b>Every</b> basket has 9 eggs."}, {"text": "Equal groups. <b>2 × 9 = 18</b> eggs.", "visual": {"kind": "bigtext", "text": "2 × 9 = 18"}}, {"text": "<b>Story 2:</b> Liz picked 10 apples. Ellie picked 2 apples. How many apples in all?"}, {"text": "Not equal. <b>10 + 2 = 12</b> apples.", "visual": {"kind": "bigtext", "text": "10 + 2 = 12"}}, {"text": "<b>Story 3:</b> The vet gives 2 baths <b>per</b> dog. There are 10 dogs."}, {"text": "Equal groups. <b>10 × 2 = 20</b> baths.", "visual": {"kind": "bigtext", "text": "10 × 2 = 20"}}], "tip": "Groups first, then how many in each.", "notes": {"do": "Read each story out loud before you click. She writes on the whiteboard, then you click to show the answer and she checks her own work.", "ask": "Equal or not? Which operation? Which number is the groups?", "listen": "Story 3 is the hard one: the groups (10 dogs) come at the end. If she writes 2 × 10, say: \"The total is right. Which number is the groups?\" Both totals are 20, but she should name the dogs as the groups."}}, {"type": "tap", "kick": "Your turn", "title": "Match the story", "items": [{"q": "Which story matches <b>3 × 10</b>?", "choices": ["Liz has 3 shells and 10 rocks.", "There are 3 vans. Each van has 10 kids.", "There are 10 kids. 3 kids go home."], "a": 1, "why": "3 groups (vans) with 10 in each: <b>3 × 10 = 30</b>.", "no": ["3 shells and 10 rocks are not equal groups. That is 3 + 10.", null, "Kids going home is take away: 10 − 3."]}, {"q": "All three say <b>in all</b>. Which one is the trap where you <b>add</b>?", "choices": ["There are 4 nests with 2 birds in each. How many birds in all?", "Ellie has 4 birds and 2 fish. How many pets in all?", "There are 2 cages with 4 birds in every cage. How many birds in all?"], "a": 1, "why": "4 birds and 2 fish are not equal groups: <b>4 + 2 = 6</b>.", "no": ["This one says <b>each</b>. It is 4 groups of 2, so you multiply.", null, "This one says <b>every</b>. It is 2 groups of 4, so you multiply."]}], "notes": {"do": "She reads every choice out loud before she taps.", "ask": "Name the groups and the number in each for the story you picked.", "listen": "\"3 vans, 10 kids in each.\" On the trap item she should point to <b>each</b> and <b>every</b> in the other two choices."}}, {"type": "learn", "kick": "Wrap-up", "title": "You proved it!", "text": "Today you found the <b>groups</b> hiding in the words.", "visual": {"kind": "bigtext", "text": "each · every · per → ×", "sub": "No clue word and not equal? → +"}, "tip": "Tonight: do the <b>after-class lesson</b>. It ends with <b>Show What You Know</b>.", "notes": {"do": "Open the course page together. Read the task list for Lesson 2 out loud and show her the after-class lesson button.", "say": "You did the hard part with me. Tonight you do it on your own. If you miss Show What You Know, you get brand-new questions when you try again.", "ask": "What are the three clue words? What do you check when a problem says in all?", "listen": "\"Each, every, per.\" \"Are the groups the same size?\""}}], "win": "You proved it! You can find the groups in any story.", "prev": "bb-bristol-L01", "prevTitle": "Lesson 1"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentEl
