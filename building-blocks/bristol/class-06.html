<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 6: Tricks for 8s and 9s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L06", "label": "Lesson 6", "title": "Tricks for 8s and 9s", "goal": "I can use my 4s to find 8s, and my 10s to find 9s.", "date": "2026-11-02", "mastery": 85, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Tricks for 8s and 9s", "text": "8s and 9s look big. But you already know the <b>secret</b>. 🤫 Today you use <b>4s</b> and <b>10s</b> to find them.", "visual": {"kind": "emoji", "text": "🐶 8️⃣ 9️⃣"}, "notes": {"do": "Before you start: she has about 40 beans (or counters), paper, a pencil and her book next to her, on camera. Share your screen. Today is Zoom, so she <b>says</b> every answer and you tap or type exactly what she says.", "say": "Today we learn two tricks for the biggest facts: 8s and 9s. You already know the facts that make them work.", "ask": "Which facts do you know really fast?", "listen": "2s, 5s, 10s, and last week's 4s and 6s. If she leaves out 4s and 6s, remind her: last week you learned double-double for 4s and 5s-plus-one-group for 6s."}}, {"type": "talk", "kick": "Book Talk", "title": "Who has a problem?", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["Who is the <b>main character</b>? How do you know?", "What <b>problem</b> does she have?", "What did she do to try to fix it?"], "starters": ["The main character is …", "The problem is …", "She tried to …"], "notes": {"do": "Book open on camera. Give her time to look back at a page.", "say": "Book first. Tell me about the main character and her problem.", "ask": "Who is the main character? What is her problem? Why is it a problem for her?", "listen": "A full sentence that names Amy and tells the problem in her own words, with <b>because</b>. If she says only one word (\"the puppy\"), ask her to say the whole sentence with a starter."}}, {"type": "recall", "kick": "Remember?", "title": "4s and 6s warm-up", "text": "These are from last week. Use your tricks!", "items": [{"q": "Each puppy has <b>4 paws</b>. How many paws on <b>7 puppies</b>?", "visual": {"kind": "emoji", "text": "🐶🐾"}, "choices": ["21", "24", "28"], "a": 2, "why": "7 × 4 is the same as 4 × 7. Double 7 is 14. Double 14 is <b>28</b>.", "no": ["21 is 7 × 3. Each puppy has 4 paws.", "24 is 6 × 4. Count the puppies: 7.", null]}, {"q": "What is <b>6 × 8</b>?", "choices": ["48", "46", "54"], "a": 0, "why": "5 × 8 = 40. One more group of 8: 40 + 8 = <b>48</b>.", "no": [null, "You added 6. Add one more group of <b>8</b>.", "54 is 6 × 9. This is 6 groups of 8."]}, {"q": "Amy has <b>6 bags</b>. <b>Each</b> bag has <b>9 treats</b>. How many treats?", "choices": ["15", "51", "54"], "a": 2, "why": "Equal groups, so multiply. 5 × 9 = 45. One more group of 9: 45 + 9 = <b>54</b>.", "no": ["15 is 6 + 9. Every bag has 9, so multiply.", "You added 6. Add one more group of <b>9</b>.", null]}], "notes": {"say": "Before you answer, tell me the trick. 4s: double, double. 6s: 5s plus one more group.", "ask": "For 7 puppies with 4 paws: what is double 7? What is double that?", "listen": "\"Double 7 is 14, double 14 is 28.\" If she counts by 4s on her fingers, stop her and ask for the double-double. For 6 × 8: \"5 × 8 is 40, plus one more 8 is 48.\""}}, {"type": "learn", "kick": "Learn", "title": "8 is double 4", "text": "To find <b>8 ×</b> a number, find <b>4 ×</b> first. Then <b>double</b> it.", "steps": [{"text": "<b>Step 1.</b> 4 rows of 3. That is <b>4 × 3 = 12</b>.", "visual": {"kind": "array", "rows": 4, "cols": 3, "emoji": "🟦"}}, {"text": "<b>Step 2.</b> Make another 4 rows. Now there are <b>8 rows</b>.", "visual": {"kind": "array", "rows": 8, "cols": 3, "emoji": "🟦"}}, {"text": "<b>Step 3.</b> Double 12. <b>12 + 12 = 24</b>. So <b>8 × 3 = 24</b>.", "visual": {"kind": "bigtext", "text": "8 × 3 = 24"}}], "tip": "8 groups is just <b>two sets of 4 groups</b>.", "notes": {"do": "On camera she makes 4 rows of 3 beans. Then 4 more rows right under them. Click <b>next step</b> as she builds.", "say": "Look. 4 rows, then 4 more rows. That is 8 rows. 8 groups is two sets of 4 groups.", "ask": "The top part is 4 × 3. What is it? The bottom part is the same. So what is the total?", "listen": "\"12 and 12 is 24.\" Wrong: 16 (she added 4 beans, not 4 more rows of 3). Point to the bottom 4 rows and count them with her."}}, {"type": "tap", "kick": "Quick check", "title": "Two sets of 4", "items": [{"type": "fill", "q": "4 rows and 4 more rows make ____ rows.", "answers": ["8", "eight"], "why": "4 + 4 = <b>8</b>. 8 rows is two sets of 4 rows.", "no": "4 rows, then 4 more rows. 4 + 4 = ?", "hint": "4 rows + 4 rows."}, {"type": "fill", "q": "4 × 5 = 20. Double 20. So <b>8 × 5</b> = ____", "answers": ["40"], "why": "20 + 20 = <b>40</b>. So 8 × 5 = 40.", "no": "Double means add 20 to itself.", "hint": "20 + 20 = ?"}], "notes": {"do": "She says each answer. You type exactly what she says. If she is wrong, let the page say try again.", "ask": "How many rows now? Then: what is double 20?", "listen": "8 rows. 40. If she says 24 for 8 × 5, she added 4. Ask: did we add 4 beans, or 4 whole rows?"}}, {"type": "learn", "kick": "Learn", "title": "Double a bigger number", "text": "Let's find <b>8 × 6</b>.", "steps": [{"text": "<b>Step 1.</b> Find the 4s fact: <b>4 × 6 = 24</b>.", "visual": {"kind": "array", "rows": 4, "cols": 6, "emoji": "🟩"}}, {"text": "<b>Step 2.</b> Double 24. Double the <b>tens</b>: 20 + 20 = 40."}, {"text": "<b>Step 3.</b> Double the <b>ones</b>: 4 + 4 = 8."}, {"text": "<b>Step 4.</b> Put them together: 40 + 8 = <b>48</b>. So <b>8 × 6 = 48</b>.", "visual": {"kind": "bigtext", "text": "8 × 6 = 48"}}], "tip": "Doubling is adding a number to <b>itself</b>. Tens first, then ones.", "notes": {"do": "Whiteboard on camera. Write 24 + 24 in a tens column and a ones column.", "say": "Doubling a big number is easy if we go in two parts. Double the tens. Then double the ones. Then put them together.", "ask": "What is double 20? Double 4? Now put 40 and 8 together.", "listen": "\"40 and 8 is 48.\" Wrong: 44 or 28 (she doubled only one part). Point to the part she skipped."}}, {"type": "tap", "kick": "Your turn", "title": "Double tens, then ones", "text": "Double the <b>tens</b>. Double the <b>ones</b>. Put them together.", "items": [{"type": "fill", "q": "Double <b>16</b>. Tens: 10 + 10 = 20. Ones: 6 + 6 = 12. Together: ____", "answers": ["32"], "why": "20 + 12 = <b>32</b>. So double 16 is 32.", "no": "Add the two parts: 20 and 12.", "hint": "20 + 12 = ?"}, {"type": "fill", "q": "Double <b>28</b>. Tens: 20 + 20 = 40. Ones: 8 + 8 = 16. Together: ____", "answers": ["56"], "why": "40 + 16 = <b>56</b>. So double 28 is 56.", "no": "Add 40 and 16. 16 has a ten in it!", "hint": "40 + 10 = 50. Then 6 more."}, {"type": "fill", "q": "Double <b>36</b> = ____", "answers": ["72"], "why": "Tens: 30 + 30 = 60. Ones: 6 + 6 = 12. 60 + 12 = <b>72</b>.", "no": "Double the tens. Double the ones. Then add.", "hint": "60 + 12 = ?"}], "notes": {"do": "She works each one on paper first, then tells you the answer to type.", "say": "Tens first. Then ones. Then put them together.", "listen": "56 for double 28. Watch for <b>46</b>: she forgot the extra ten in 8 + 8 = 16. Ask: how many tens are in 16?"}}, {"type": "tap", "kick": "Try it", "title": "Double the 4s", "items": [{"q": "4 × 7 = 28. So what is <b>8 × 7</b>?", "choices": ["54", "56", "35"], "a": 1, "why": "Double 28: 40 + 16 = <b>56</b>.", "no": ["Not 54. Double 28: tens first, then ones.", null, "35 is 28 + 7. Double means add <b>28</b> again."]}, {"q": "What is <b>8 × 4</b>?", "choices": ["16", "24", "32"], "a": 2, "why": "4 × 4 = 16. Double 16 is <b>32</b>.", "no": ["16 is 4 × 4. You need to double it one more time.", "24 is 8 × 3. This is 8 groups of <b>4</b>.", null]}, {"q": "There are <b>8 boxes</b>. Each box has <b>8 crayons</b>. How many crayons?", "visual": {"kind": "emoji", "text": "🖍️📦"}, "choices": ["64", "16", "56"], "a": 0, "why": "4 × 8 = 32. Double 32 is <b>64</b>.", "no": [null, "16 is 8 + 8. That is only 2 boxes. There are 8 boxes.", "56 is 7 × 8. Count the boxes again: 8."]}], "notes": {"say": "Now use it. Find the 4s fact. Then double it.", "ask": "Before you answer: what is the 4s fact? What is double that?", "listen": "\"4 × 7 is 28. Double 28 is 56.\" If she picks 54, it is the old 7 × 8 = 54 mistake: make her double 28 out loud, tens then ones."}}, {"type": "learn", "kick": "Learn", "title": "9 is 10 take away 1 group", "text": "10s are easy. So find <b>10 ×</b> first. Then take away <b>one group</b>.", "steps": [{"text": "<b>Step 1.</b> 10 rows of 4. <b>10 × 4 = 40</b>.", "visual": {"kind": "array", "rows": 10, "cols": 4, "emoji": "🟪"}}, {"text": "<b>Step 2.</b> Take away <b>one row of 4</b>. Now there are 9 rows.", "visual": {"kind": "array", "rows": 9, "cols": 4, "emoji": "🟪"}}, {"text": "<b>Step 3.</b> <b>40 − 4 = 36</b>. So <b>9 × 4 = 36</b>.", "visual": {"kind": "bigtext", "text": "9 × 4 = 36"}}], "tip": "Take away <b>one group</b>, not 9 and not 1.", "notes": {"do": "On camera she makes 10 rows of 4 beans. Then she pushes <b>one row</b> away.", "say": "10s are the easiest facts. 9 groups is just one group less than 10 groups.", "ask": "How many beans did you push away: 1 or 4? Why 4?", "listen": "\"4, because one row has 4.\" If she says 1, point at the row: count the beans in it."}}, {"type": "learn", "kick": "Learn", "title": "Try 9 × 7", "text": "Let's find <b>9 × 7</b>.", "steps": [{"text": "<b>Step 1.</b> Start with the 10s: <b>10 × 7 = 70</b>.", "visual": {"kind": "bigtext", "text": "10 × 7 = 70"}}, {"text": "<b>Step 2.</b> Take away one group of <b>7</b>.", "visual": {"kind": "bigtext", "text": "70 − 7", "sub": "take away one group of 7"}}, {"text": "<b>Step 3.</b> <b>70 − 7 = 63</b>. So <b>9 × 7 = 63</b>.", "visual": {"kind": "bigtext", "text": "9 × 7 = 63"}}], "tip": "The group is the number you multiply by. For 9 × 7, the group is <b>7</b>.", "notes": {"do": "Whiteboard: write 10 × 7 = 70, then 70 − 7.", "say": "For 9 × 7, the group is 7. So we take away 7.", "ask": "Which number is in each group? So what do we take away?", "listen": "\"7.\" Wrong: 9 (she takes away the 9) or 1 (she takes away one bean). Ask: how many are in one group?"}}, {"type": "tap", "kick": "Try it", "title": "Take away one group", "items": [{"q": "10 × 6 = 60. So what is <b>9 × 6</b>?", "choices": ["51", "54", "59"], "a": 1, "why": "Take away one group of 6: 60 − 6 = <b>54</b>.", "no": ["51 is 60 − 9. Take away a group of <b>6</b>, not 9.", null, "59 is 60 − 1. Take away a whole group of 6."]}, {"q": "What is <b>9 × 8</b>?", "choices": ["71", "64", "72"], "a": 2, "why": "10 × 8 = 80. 80 − 8 = <b>72</b>.", "no": ["71 is 80 − 9. Take away one group of <b>8</b>.", "64 is 8 × 8. Start with 10 × 8 = 80.", null]}, {"q": "Which way finds <b>9 × 5</b>?", "choices": ["10 × 5, then take away 9", "10 × 5, then take away 5", "10 × 5, then add 5"], "a": 1, "why": "50 − 5 = 45. So 9 × 5 = 45.", "no": ["Take away one group. Each group is <b>5</b>, not 9.", null, "Adding makes 11 groups. We need one group <b>less</b>."]}], "notes": {"say": "Say the 10s fact first. Then say what you take away.", "ask": "For 9 × 8: what is 10 × 8? What is in one group?", "listen": "\"80, take away 8, 72.\" If she picks 71, she took away 9. Go back to the bean rows."}}, {"type": "tap", "kick": "Which trick?", "title": "Double or take away?", "items": [{"q": "This step: <b>24 + 24 = 48</b>. Which fact does it find?", "choices": ["8 × 6", "9 × 6", "4 × 6"], "a": 0, "why": "24 is 4 × 6. Doubling it finds <b>8 × 6 = 48</b>.", "no": [null, "9s take away from the 10s. This step doubles.", "4 × 6 is only 24. Doubling makes 8 groups."]}, {"q": "This step: <b>60 − 6 = 54</b>. Which fact does it find?", "choices": ["8 × 6", "6 × 6", "9 × 6"], "a": 2, "why": "60 is 10 × 6. Take away one group of 6: <b>9 × 6 = 54</b>.", "no": ["8s double the 4s. This step takes away.", "6 × 6 is 36. This step starts at 60.", null]}, {"q": "To find <b>9 × 8</b>, what do you find first?", "choices": ["4 × 8", "10 × 8", "9 × 10"], "a": 1, "why": "9s start with the 10s: 10 × 8 = 80. Then 80 − 8 = <b>72</b>.", "no": ["4 × 8 is the first step for 8 × 8.", null, "Keep the 8. 10 groups of 8 is 10 × 8."]}], "notes": {"say": "Each one is a step. Tell me: is it a <b>double</b> step or a <b>take away</b> step? Then tell me your answer.", "ask": "Which trick starts with the 4s? Which trick starts with the 10s?", "listen": "Doubling goes with 8s. Taking away from the 10s goes with 9s. If she picks 4 × 6 for the first one, ask: how many groups after we double?"}}, {"type": "build", "kick": "Build it", "title": "Ellie's flower pots", "text": "Ellie has <b>9 pots</b>. Each pot has <b>3 flowers</b>. Make the groups.", "groups": 9, "each": 3, "emoji": "🌷", "why": "10 × 3 = 30. Take away one group: 30 − 3 = 27. So <b>9 × 3 = 27</b>.", "hint": "Each <b>pot</b> is one group. Set <b>Groups</b> to the number of pots. Set <b>In each group</b> to the flowers in one pot.", "notes": {"do": "She also makes 9 piles of 3 beans on camera. She tells you the groups and how many in each; you click the + buttons.", "ask": "How many pots? How many in each pot? Which trick finds 9 × 3?", "listen": "\"9 groups of 3. 10 × 3 is 30, take away 3, 27.\""}}, {"type": "learn", "kick": "Say it", "title": "Say the trick, then the answer", "text": "I say a fact. You say the <b>trick</b>. Then you say the <b>answer</b>. Then we check.", "steps": [{"text": "Listen for the fact. Say the trick and the answer <b>first</b>. Then we check here."}, {"text": "<b>8 × 10</b>: 4 × 10 = 40. Double 40 is <b>80</b>.", "visual": {"kind": "bigtext", "text": "8 × 10 = 80"}}, {"text": "<b>9 × 2</b>: 10 × 2 = 20. 20 − 2 = <b>18</b>.", "visual": {"kind": "bigtext", "text": "9 × 2 = 18"}}, {"text": "<b>8 × 9</b>: 4 × 9 = 36. Double 36 is <b>72</b>.", "visual": {"kind": "bigtext", "text": "8 × 9 = 72"}}, {"text": "<b>9 × 5</b>: 10 × 5 = 50. 50 − 5 = <b>45</b>.", "visual": {"kind": "bigtext", "text": "9 × 5 = 45"}}], "tip": "8s: <b>double</b> the 4s. 9s: 10s <b>take away</b> one group.", "notes": {"do": "Say each fact out loud (8 × 10, 9 × 2, 8 × 9, 9 × 5). She says the trick and the answer first. Then click <b>next step</b> to check it.", "say": "I say the fact. You tell me the trick and the answer.", "ask": "Which trick? What is the first fact you find?", "listen": "The trick word first (double, or take away), then the answer. If she just guesses the answer, ask her to show the trick."}}, {"type": "tap", "kick": "Word problems", "title": "Multiply or add?", "items": [{"q": "There are <b>9 rows</b> of chairs. Each row has <b>9 chairs</b>. How many chairs?", "choices": ["18", "81", "89"], "a": 1, "why": "9 × 9: 90 − 9 = <b>81</b>.", "no": ["18 is 9 + 9. That is only 2 rows. There are 9 rows.", null, "89 is 90 − 1. Take away one group of <b>9</b>."]}, {"q": "Liz has <b>8 shells</b>. Marion has <b>6 shells</b>. How many shells in all?", "choices": ["48", "2", "14"], "a": 2, "why": "8 and 6 are not equal groups. Add: 8 + 6 = <b>14</b>.", "no": ["8 and 6 are two different groups. Don't multiply. Add.", "2 is 8 − 6. The question asks how many in all.", null]}, {"q": "The vet has <b>8 bunnies</b>. Each bunny eats <b>3 carrots</b>. How many carrots?", "choices": ["11", "24", "21"], "a": 1, "why": "Equal groups, so multiply. 4 × 3 = 12. Double 12 is <b>24</b>.", "no": ["11 is 8 + 3. Each bunny eats 3, so multiply.", null, "21 is 7 × 3. Count the bunnies: 8."]}], "notes": {"do": "She reads each problem aloud.", "say": "Before you answer, tell me: equal groups or not?", "ask": "Is every group the same size? Which word tells you?", "listen": "\"Each row has 9\" means equal groups: multiply. \"8 shells and 6 shells\" are two different amounts: add."}}, {"type": "learn", "kick": "Wrap-up", "title": "Our two tricks", "text": "<b>8s:</b> find the 4s. Then <b>double</b>.<br><b>9s:</b> find the 10s. Then <b>take away one group</b>.", "visual": {"kind": "bigtext", "text": "8 × 7 = 56<br>9 × 7 = 63"}, "steps": [{"text": "Tonight: do the <b>After-class lesson</b>. It ends with <b>Show What You Know</b>."}, {"text": "Then read your book for <b>10 minutes</b>."}], "tip": "Tonight is short. The practice and the packet come tomorrow.", "notes": {"say": "Great work. Tonight is short: the after-class lesson and 10 minutes of reading. That's it.", "ask": "Tell me the 8s trick. Tell me the 9s trick.", "listen": "\"Double the 4s.\" \"10s take away one group.\" If she mixes them up, say both again with 8 × 7 and 9 × 7.", "do": "Show the task list on the course page. Tell her tomorrow's lesson is in person."}}], "win": "You know two big tricks now. 8s and 9s, here you come!", "prev": "bb-bristol-L05", "prevTitle": "Lesson 5"});</script></body></html>
