<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Practice 2</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Prove It: Find the Groups</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Look for the clue words: each, every, per. Watch out for traps!</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bristol", "label": "Lesson 2", "title": "Prove It: Find the Groups", "mastery": 85, "color": "#2E86DE", "questions": [{"q": "There are 2 plates. Each plate has 6 strawberries. How many strawberries?", "choices": ["8", "12", "4"], "a": 1, "why": "2 groups of 6: 6, 12. So 2 × 6 = 12.", "no": ["8 is 2 + 6. That adds the plates to one plate of strawberries.", null, "4 is 6 − 2. No strawberries were eaten."]}, {"q": "Ellie has 6 cat toys and 2 dog toys. How many toys in all?", "choices": ["8", "12", "4"], "a": 0, "why": "6 and 2 are not equal groups. Add: 6 + 2 = 8.", "no": [null, "12 is 6 × 2. There are not 6 groups of 2 here.", "4 is 6 − 2. Nobody took toys away."]}, {"q": "How many paw prints are in this array?", "visual": {"kind": "array", "rows": 2, "cols": 5, "emoji": "🐾"}, "choices": ["7", "10", "25"], "a": 1, "why": "2 rows of 5: 5, 10. So 2 × 5 = 10.", "no": ["7 is 2 + 5. Count every paw print.", null, "25 would be 5 rows. There are only 2 rows."]}, {"q": "8 × 2 = 16. What is <b>2 × 8</b>?", "choices": ["10", "6", "16"], "a": 2, "why": "Turn-around facts have the same total: 2 × 8 = 16.", "no": ["10 is 8 + 2. Turn-around facts keep the same total.", "6 is 8 − 2. Turn-around facts keep the same total.", null]}, {"q": "There are 3 kennels. Each kennel has 4 dogs. Which tells the number of <b>groups</b>?", "choices": ["3 kennels", "4 dogs", "12 dogs"], "a": 0, "why": "The kennels are the groups. There are 3.", "no": [null, "4 is how many dogs are in <b>each</b> kennel.", "12 is all the dogs, not the groups."]}, {"q": "The pet store puts 2 toys per cage. There are 6 cages. Which number sentence fits?", "choices": ["6 + 2 = 8", "2 × 2 = 4", "6 × 2 = 12"], "a": 2, "why": "<b>Per</b> cage means each cage gets 2. 6 groups of 2: 6 × 2 = 12.", "no": ["Every cage gets 2 toys, so the groups are equal. Multiply.", "There are 6 cages, not 2.", null]}, {"q": "Amy saw 5 puppies on Monday and 10 puppies on Tuesday. How many puppies in all?", "choices": ["50", "15", "5"], "a": 1, "why": "5 and 10 are not equal groups. Add: 5 + 10 = 15.", "no": ["50 is 5 × 10. That is the trap! The groups are not equal.", null, "5 is 10 − 5. The question asks how many in all."]}, {"q": "Which matches this array?", "visual": {"kind": "array", "rows": 4, "cols": 3, "emoji": "⭐"}, "choices": ["4 × 3", "4 + 3", "3 × 3"], "a": 0, "why": "4 rows with 3 in each row: 4 × 3 = 12.", "no": [null, "An array is equal groups. Multiply, don't add.", "Count the rows again. There are 4."]}, {"q": "Which story is <b>NOT</b> equal groups?", "choices": ["There are 4 bikes. Every bike has 2 wheels.", "There are 3 boxes with 10 crayons in each.", "Liz has 2 dogs and 4 cats."], "a": 2, "why": "2 dogs and 4 cats are different amounts.", "no": ["<b>Every</b> bike has 2 wheels. Those groups are equal.", "<b>Each</b> box has 10. Those groups are equal.", null]}, {"q": "Marion has 5 pockets. She has 5 coins in every pocket. How many coins?", "choices": ["25", "10", "20"], "a": 0, "why": "5 groups of 5: 5, 10, 15, 20, 25. So 5 × 5 = 25.", "no": [null, "10 is 5 + 5. That adds the pockets to one pocket of coins.", "20 is only 4 pockets. Skip count 5 times: 5, 10, 15, 20, 25."]}, {"q": "One array has 2 rows of 9. Another has 9 rows of 2. Which is true?", "choices": ["2 rows of 9 has more", "9 rows of 2 has more", "They have the same number"], "a": 2, "why": "2 × 9 = 18 and 9 × 2 = 18. Turn-around facts are the same!", "no": ["Count them both. 2 × 9 = 18 and 9 × 2 = 18.", "Count them both. 9 × 2 = 18 and 2 × 9 = 18.", null]}]});</script></body></html>
