{"text": "<b>won't</b> = will not. It breaks the rule."}, {"text": "<b>let's</b> = let us. The u drops out."}], "tip": "Not sure? Say the sentence the long way."}, {"type": "talk", "kick": "Say it", "title": "Say it out loud", "text": "Say these out loud. You can tell your mom!", "prompts": ["What does <b>won't</b> mean?", "Ask your mom to do something with you. Start with <b>Let's</b>.", "Say a sentence with <b>I've</b>."], "starters": ["won't means …", "Let's …", "I've …"]}, {"type": "tap", "kick": "Your turn", "title": "Make the contraction", "text": "Type the contraction. Put the apostrophe in the right spot.", "items": [{"type": "fill", "q": "The cat ____ eat its food. <i>(will not)</i>", "answers": ["won't", "won’t"], "why": "will not → <b>won't</b>. won't breaks the rule: will changes to wo, then add n't.", "no": "This is the rule-breaker. will changes to wo. Then add n't.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "____ read a story! <i>(Let us)</i>", "answers": ["Let's", "Let’s"], "why": "Let us → <b>Let's</b>. The apostrophe takes the place of the <b>u</b>.", "no": "Push <b>Let us</b> together. Take out the <b>u</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "____ in the garden. <i>(They are)</i>", "answers": ["They're", "They’re"], "why": "They are → <b>They're</b>. The apostrophe takes the place of the <b>a</b>.", "no": "Push <b>They are</b> together. Take out the <b>a</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}]}, {"type": "tap", "kick": "Take it apart", "title": "Two words again", "text": "Type the missing word.", "items": [{"type": "fill", "q": "We won't be late. <br><b>won't</b> = will ____", "answers": ["not"], "why": "won't is short for <b>will not</b>.", "no": "It ends with n't. What word does n't stand for?", "placeholder": "Type the word"}, {"type": "fill", "q": "Let's eat! <br><b>let's</b> = let ____", "answers": ["us"], "why": "let's is short for <b>let us</b>.", "no": "This time the s does not stand for is. Let ___ eat! Who will eat?", "hint": "You and me will eat. That is <b>us</b>.", "placeholder": "Type the word"}, {"type": "fill", "q": "I'm ready. <br><b>I'm</b> = I ____", "answers": ["am"], "why": "I'm is short for <b>I am</b>.", "no": "Only an m is after the apostrophe.", "placeholder": "Type the word"}]}, {"type": "sort", "kick": "Sort it", "title": "Right spot or wrong spot?", "text": "Tap a word. Then tap the right box.", "buckets": ["✅ Right spot", "❌ Wrong spot"], "items": [{"text": "lets'", "b": 1, "why": "Wrong spot. It should be let's.", "hint": "Does the apostrophe go at the end?"}, {"text": "I've", "b": 0, "why": "Right spot. It takes the place of h and a.", "hint": "Where were the h and a in I have?"}, {"text": "won't", "b": 0, "why": "Right spot, between n and t.", "hint": "won't ends with n't. Is the apostrophe between n and t?"}, {"text": "Iv'e", "b": 1, "why": "Wrong spot. It should be I've.", "hint": "The h and a were right after I."}, {"text": "let's", "b": 0, "why": "Right spot. It takes the place of the u.", "hint": "Where was the u in let us?"}, {"text": "wo'nt", "b": 1, "why": "Wrong spot. It should be won't.", "hint": "won't ends with n't. Look at where the apostrophe is."}], "done": "Champion work!"}, {"type": "tap", "kick": "Make sense", "title": "Pick the one that makes sense", "items": [{"q": "The kids ____ ready. They still need their shoes.", "choices": ["isn't", "won't", "aren't"], "a": 2, "why": "The kids <b>are not</b> ready. → <b>aren't</b>.", "no": ["Say it the long way: <i>The kids is not ready.</i> We say <i>the kids are</i>.", "Say it the long way: <i>The kids will not ready.</i> That does not make sense.", null]}, {"q": "____ make a snack. I'm hungry!", "choices": ["Let's", "It's", "Won't"], "a": 0, "why": "<b>Let us</b> make a snack. → <b>Let's</b>.", "no": [null, "Say it the long way: <i>It is make a snack.</i> That does not make sense.", "Say it the long way: <i>Will not  beach today. <i>(They are)</i>", "answers": ["They're", "They’re"], "why": "They are → <b>They're</b>. The apostrophe takes the place of the <b>a</b>.", "no": "Push <b>They are</b> together. Take out the <b>a</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "The soup isn't hot. <br><b>isn't</b> = is ____", "answers": ["not"], "why": "isn't is short for <b>is not</b>.", "no": "What word does n't stand for?", "placeholder": "Type the word"}, {"type": "fill", "q": "What two words make <b>won't</b>? Type them.", "answers": ["will not"], "why": "won't = <b>will not</b>.", "no": "won't is the rule-breaker. It is not want.", "placeholder": "Type two words"}, {"q": "I ____ eat the cake. I am full.", "choices": ["won't", "want", "wasn't"], "a": 0, "why": "I <b>will not</b> eat the cake. → <b>won't</b>.", "no": [null, "want means you wish for something. <i>I want eat</i> does not make sense.", "Say it the long way: <i>I was not eat.</i> That does not make sense."]}, {"q": "Liz wrote: <i>Ill help you.</i> What is right?", "choices": ["Il'l", "I'll", "Ill is right."], "a": 1, "why": "I will → <b>I'll</b>.", "no": ["Two l's stay together after the apostrophe.", null, "Ill with no apostrophe means sick. I will → I'll."]}, {"q": "Which word means <b>let us</b>?", "choices": ["lets", "le'ts", "let's"], "a": 2, "why": "let us → <b>let's</b>.", "no": ["lets with no apostrophe means allows, like <i>Mom lets me play</i>.", "let stays whole. The apostrophe goes after let.", null]}], [{"type": "fill", "q": "Marion ____ share her paints. <i>(will not)</i>", "answers": ["won't", "won’t"], "why": "will not → <b>won't</b>. won't breaks the rule: will changes to wo, then add n't.", "no": "This is the rule-breaker. will changes to wo. Then add n't.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "____ sing a song! <i>(Let us)</i>", "answers": ["Let's", "Let’s"], "why": "Let us → <b>Let's</b>. The apostrophe takes the place of the <b>u<
