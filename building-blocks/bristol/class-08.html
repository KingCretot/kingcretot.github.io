<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 8: Prove It: Mixed Facts</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L08", "label": "Lesson 8", "title": "Prove It: Mixed Facts", "goal": "I can solve mixed facts, missing numbers and word problems.", "date": "2026-11-05", "mastery": 85, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Prove It: Mixed Facts", "text": "This week you learned tricks for <b>8s, 9s and 7s</b>. Today you mix them all up. Show what you know! 🏆", "visual": {"kind": "emoji", "text": "4️⃣ 6️⃣ 7️⃣ 8️⃣ 9️⃣"}, "notes": {"do": "Set out: the fact cards (7s from Tuesday plus 4s, 6s, 8s, 9s), about 60 beans, 9 small cups, whiteboard. Collect the Lesson 6 packet and Lesson 7 packet page 1; glance at Tuesday's Show What You Know score.", "say": "This week you learned 8s, 9s and 7s. Today you prove it. Everything is mixed up.", "ask": "Which trick do you like best? Why?", "listen": "Any trick named with a reason. Note the one she likes least; that is where the slow pile will grow."}}, {"type": "talk", "kick": "Book Talk", "title": "Friends who help", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["How do the girls <b>work together</b>?", "Which character is <b>most like you</b>? Why?", "What is one thing you want to find out next?"], "starters": ["The girls work together by …", "I am most like … because …", "I want to find out …"], "notes": {"do": "Book open.", "say": "Talk about the friends in the story.", "ask": "How do the girls work together? Which one is most like you, and why?", "listen": "A reason with <b>because</b> that comes from the book (something a character did or said), not just \"because I like her\"."}}, {"type": "recall", "kick": "Remember?", "title": "Tricks from this week", "text": "7s: 5s + 2s. 8s: double the 4s. 9s: 10s take away one group. 6s: 5s + one group.", "items": [{"q": "How many days are in <b>8 weeks</b>?", "visual": {"kind": "emoji", "text": "📅"}, "choices": ["54", "56", "15"], "a": 1, "why": "8 × 7: 4 × 7 = 28. Double 28 is <b>56</b>.", "no": ["Careful! 4 × 7 = 28, and double 28 is 56.", null, "15 is 8 + 7. Each week has 7 days, so multiply."]}, {"q": "What is <b>9 × 8</b>?", "choices": ["72", "71", "64"], "a": 0, "why": "10 × 8 = 80. Take away one group of 8: <b>72</b>.", "no": [null, "71 is 80 − 9. Take away a group of <b>8</b>.", "64 is 8 × 8. This is 9 groups."]}, {"q": "What is <b>6 × 7</b>?", "choices": ["36", "48", "42"], "a": 2, "why": "5 × 7 = 35. One more group of 7: <b>42</b>.", "no": ["36 is 6 × 6. Look again: groups of 7.", "48 is 6 × 8.", null]}], "notes": {"say": "Name the trick before you tap.", "ask": "8 weeks: which fact? Which trick?", "listen": "\"8 × 7, double 28, 56.\" \"10 × 8 = 80, take away 8, 72.\" \"5 × 7 = 35, one more 7, 42.\""}}, {"type": "learn", "kick": "Card flip", "title": "Fast pile, slow pile", "text": "I show a card. You say the <b>trick</b>, then the <b>answer</b>.", "visual": {"kind": "emoji", "text": "🃏 ⚡ 🐢"}, "steps": [{"text": "⚡ <b>Fast pile</b>: you knew the trick and the answer right away."}, {"text": "🐢 <b>Slow pile</b>: you had to stop and think. That is OK! We do these again at the end."}], "tip": "Right first. Fast comes with practice.", "notes": {"do": "3 minutes. Shuffle about 20 cards (4s, 6s, 7s, 8s, 9s). Make two piles. Keep the slow pile for the last block.", "say": "Say the trick, then the answer. If you have to think, that card goes in the slow pile. That is not bad. It shows us what to practice.", "listen": "Trick word, then answer. If she says the answer with no trick and it is wrong, slow pile."}}, {"type": "learn", "kick": "Learn", "title": "Flip it!", "text": "A <b>turn-around fact</b> has the same answer. If one way is hard, <b>flip it</b>.", "steps": [{"text": "<b>6 × 9</b> is 6 rows of 9.", "visual": {"kind": "array", "rows": 6, "cols": 9, "emoji": "🔵"}}, {"text": "Turn it. Now it is <b>9 × 6</b>: 9 rows of 6. Same dots!", "visual": {"kind": "array", "rows": 9, "cols": 6, "emoji": "🔵"}}, {"text": "Use the 9s trick: 10 × 6 = 60. 60 − 6 = 54. So <b>6 × 9 = 54</b>.", "visual": {"kind": "bigtext", "text": "6 × 9 = 9 × 6 = 54"}}], "tip": "Pick the way that uses the trick you like best.", "notes": {"do": "She builds 6 rows of 9 beans on a sheet of paper. Then turn the paper a quarter turn.", "say": "Look: same beans. 6 rows of 9 became 9 rows of 6. Nothing went away.", "ask": "Did any beans go away? Which way is easier for you: 6 × 9 or 9 × 6?", "listen": "\"No, it is the same.\" \"9 × 6, because I can do 60 − 6.\""}}, {"type": "tap", "kick": "Try it", "title": "Turn-around facts", "items": [{"q": "You know <b>7 × 8 = 56</b>. Which other fact is also <b>56</b>?", "choices": ["8 × 7", "6 × 8", "8 + 7"], "a": 0, "why": "Turn-around! 8 × 7 has the same answer: <b>56</b>.", "no": [null, "6 × 8 is 48. Flip the numbers in 7 × 8.", "8 + 7 is 15. A turn-around keeps the ×."]}, {"q": "Flip it! What is <b>3 × 8</b>?", "choices": ["11", "24", "21"], "a": 1, "why": "3 × 8 = 8 × 3. 4 × 3 = 12. Double 12 is <b>24</b>.", "no": ["11 is 3 + 8. Multiply.", null, "21 is 3 × 7. This is groups of 8."]}, {"type": "fill", "q": "6 × 8 = 48. So <b>8 × 6</b> = ____", "answers": ["48"], "why": "Turn-around facts have the same answer: <b>48</b>.", "no": "Flip it. Same answer.", "hint": "6 × 8 and 8 × 6 match."}], "notes": {"say": "Flip it if it helps.", "ask": "For 3 × 8: which way is easier, 3 × 8 or 8 × 3?", "listen": "\"8 × 3: 4 × 3 is 12, double is 24.\" On the typed one she should not recompute; praise her if she checks anyway, then show the two facts match."}}, {"type": "learn", "kick": "Learn", "title": "Find the missing number", "text": "<b>8 × ? = 56</b>. Ask: 8 times <b>what</b> makes 56?", "visual": {"kind": "bigtext", "text": "8 × ? = 56"}, "steps": [{"text": "<b>Start at 5.</b> 8 × 5 = 40. Too small."}, {"text": "<b>Go up one.</b> 8 × 6 = 48. Still too small."}, {"text": "<b>Up one more.</b> 8 × 7 = 56. Yes!"}, {"text": "The missing number is <b>7</b>.", "visual": {"kind": "bigtext", "text": "8 × 7 = 56"}}], "tip": "Start with 5s. You know them fast. Then go up or down.", "notes": {"do": "Whiteboard: write 8 × ? = 56. Walk up from 8 × 5 with her, one line at a time.", "say": "Start at 5. You know 5s fast. Then go up one, or down one.", "ask": "Is 40 too small or too big? What next?", "listen": "\"Too small, go up.\" She says too small or too big at every step. If she subtracts (56 − 8 = 48) and says 48, ask: 8 times what?"}}, {"type": "tap", "kick": "Try it", "title": "Missing numbers", "items": [{"q": "<b>9 × ? = 63</b>", "choices": ["7", "54", "8"], "a": 0, "why": "9 × 7 = 63. The missing number is <b>7</b>.", "no": [null, "54 is 63 − 9. Ask: 9 times what makes 63?", "9 × 8 = 72. That is too big."]}, {"q": "<b>? × 7 = 49</b>", "choices": ["42", "7", "6"], "a": 1, "why": "7 × 7 = 49. The missing number is <b>7</b>.", "no": ["42 is 49 − 7. Ask: what times 7 makes 49?", null, "6 × 7 = 42. That is too small."]}, {"q": "<b>7 × ? = 28</b>", "choices": ["21", "5", "4"], "a": 2, "why": "7 × 4 = 28. The missing number is <b>4</b>.", "no": ["21 is 28 − 7. Ask: 7 times what makes 28?", "7 × 5 = 35. That is too big.", null]}], "notes": {"say": "Say 'too small' or 'too big' out loud as you go.", "ask": "For 9 × ? = 63: what is 9 × 5? Too small? Up one?", "listen": "45, 54, 63, so 7. If she picks 54, she subtracted 63 − 9. Ask: 9 times what makes 63?"}}, {"type": "learn", "kick": "Learn", "title": "The total or one group?", "text": "Amy has <b>24 bones</b>. She puts <b>8</b> in each bag. How many bags?", "visual": {"kind": "emoji", "text": "🦴 🛍️"}, "steps": [{"text": "<b>24</b> is the <b>total</b>: all the bones."}, {"text": "<b>8</b> is <b>one group</b>: the bones in each bag."}, {"text": "Ask: <b>8 × what = 24?</b> Start at 8 × 5 = 40. Too big! Go down: 8 × 4 = 32, 8 × 3 = 24."}, {"text": "8 × 3 = 24. So there are <b>3 bags</b>.", "visual": {"kind": "bigtext", "text": "8 × 3 = 24", "sub": "3 bags"}}], "tip": "When you know the <b>total</b> and <b>one group</b>, find the missing number.", "notes": {"do": "She puts 24 beans into cups, 8 in each, to check.", "say": "Some problems give you the total. Then you are looking for the missing number.", "ask": "Is 24 the total, or one group? Is 8 the total, or one group?", "listen": "\"24 is all of them. 8 is in each bag.\" Watch for 24 + 8 = 32 or 24 − 8 = 16: she is using the two numbers without thinking about the story."}}, {"type": "build", "kick": "Build it", "title": "Treat bowls", "text": "Amy's mom has <b>28 treats</b>. She puts <b>4</b> in each bowl. How many bowls? Make the groups.", "groups": 7, "each": 4, "emoji": "🦴", "why": "7 bowls of 4 is 28. <b>7 × 4 = 28</b>, so there are <b>7 bowls</b>.", "hint": "Each bowl has 4. Keep adding bowls until you have 28 treats.", "notes": {"do": "Real beans and cups: she puts 4 in a cup until all 28 are used, then counts the cups. Then she sets the + buttons.", "ask": "How many cups? So 7 × 4 = 28. Which number was missing?", "listen": "\"7 bowls.\" The missing number is the number of groups."}}, {"type": "tap", "kick": "Same answer", "title": "Facts that match", "items": [{"q": "Which fact has the same answer as <b>6 × 7</b>?", "choices": ["6 × 8", "7 × 6", "6 + 7"], "a": 1, "why": "Turn-around! 7 × 6 = 6 × 7 = <b>42</b>.", "no": ["6 × 8 is 48. 6 × 7 is 42.", null, "6 + 7 is 13. Multiply, do not add."]}, {"q": "Which fact is <b>48</b>?", "choices": ["8 × 6", "7 × 7", "9 × 5"], "a": 0, "why": "4 × 6 = 24. Double 24 is <b>48</b>.", "no": [null, "7 × 7 is 49. Close, but not 48.", "9 × 5 is 45."]}, {"q": "Which fact is <b>56</b>?", "choices": ["9 × 6", "8 × 6", "8 × 7"], "a": 2, "why": "4 × 7 = 28. Double 28 is <b>56</b>.", "no": ["9 × 6 is 54.", "8 × 6 is 48.", null]}], "notes": {"say": "Find the answer with a trick, then tap.", "ask": "Which trick will you use for this one?", "listen": "She uses a trick for each fact. If she picks 7 × 7 for 48, have her do 5 × 7 + 2 × 7 out loud."}}, {"type": "tap", "kick": "Word problems", "title": "Think first", "text": "Ask: equal groups? Do I know the total or the groups?", "items": [{"q": "The vet has <b>9 cages</b>. Each cage has <b>4 kittens</b>. How many kittens?", "choices": ["13", "36", "32"], "a": 1, "why": "9 × 4: 40 − 4 = <b>36</b>.", "no": ["13 is 9 + 4. Each cage has 4, so multiply.", null, "32 is 8 × 4. There are 9 cages."]}, {"q": "Ellie has <b>42 stickers</b>. She puts <b>7</b> on each page. How many pages?", "choices": ["6", "35", "49"], "a": 0, "why": "7 × ? = 42. 7 × 6 = 42, so <b>6 pages</b>.", "no": [null, "35 is 42 − 7. Ask: 7 times what makes 42?", "49 is 42 + 7. The 42 stickers are the total."]}, {"q": "Liz read <b>8 pages</b> on Monday and <b>9 pages</b> on Tuesday. How many pages in all?", "choices": ["72", "1", "17"], "a": 2, "why": "Not equal groups. Add: 8 + 9 = <b>17</b>.", "no": ["She did not read 8 groups of 9. Add the two days.", "1 is 9 − 8. The question asks how many in all.", null]}], "notes": {"do": "She reads each problem aloud.", "say": "Ask two questions: equal groups? Do I know the total or the groups?", "ask": "For the stickers: is 42 the total or one group?", "listen": "Kittens: multiply. Stickers: 42 is the total, so 7 × ? = 42, 6 pages. Pages read: two amounts, add. If she says 49 or 35 for the stickers, go back to the beans and cups."}}, {"type": "tap", "kick": "Fact detective", "title": "Find the mistake", "items": [{"type": "fill", "q": "Ellie says <b>7 × 8 = 54</b>. That is wrong. Type the right answer: 7 × 8 = ____", "answers": ["56"], "why": "5 × 8 = 40. 2 × 8 = 16. 40 + 16 = <b>56</b>.", "no": "Use the 7s trick: 5s part + 2s part.", "hint": "5, 6, 7, 8!"}, {"q": "Marion says <b>9 × 6 = 51</b>. What did she do wrong?", "choices": ["She forgot to double.", "She is right.", "She took away 9, not 6."], "a": 2, "why": "60 − 9 = 51. She should take away one group of <b>6</b>: 60 − 6 = 54.", "no": ["Doubling is the 8s trick. This is a 9s fact.", "Check: 10 × 6 = 60. Take away one group of 6.", null]}], "notes": {"say": "A mistake is a clue. Find the right answer with a trick.", "ask": "How do you know 54 is wrong? Prove it.", "listen": "She proves it with a trick (40 + 16, or double 28), not just \"I remember\"."}}, {"type": "learn", "kick": "Your choice", "title": "Pick your trick", "text": "You can pick the trick. Say <b>why</b>.", "steps": [{"text": "<b>6 × 9</b>: flip it to 9 × 6. 60 − 6 = <b>54</b>."}, {"text": "<b>4 × 8</b>: double, double. 8, 16, <b>32</b>."}, {"text": "<b>7 × 7</b>: 5s part + 2s part. 35 + 14 = <b>49</b>."}, {"text": "<b>9 × 8</b>: 10 × 8 = 80. 80 − 8 = <b>72</b>."}], "tip": "Two tricks can both work. Pick the one that is fastest for you.", "notes": {"do": "Write each fact on the whiteboard first. She picks a trick and solves it before you click.", "ask": "Which trick did you pick? Why that one?", "listen": "Any correct trick with a reason. 9 × 8 could also be 8 × 9 (double 36): both are fine."}}, {"type": "tap", "kick": "Word problems", "title": "Think first", "items": [{"type": "fill", "q": "There are <b>4 vases</b>. Each vase has <b>9 flowers</b>. How many flowers?", "answers": ["36"], "why": "4 × 9 = 9 × 4. 40 − 4 = <b>36</b>.", "no": "Each vase has 9. Multiply.", "hint": "Double 9, then double again."}, {"type": "fill", "q": "Liz has <b>32 beads</b>. She puts <b>8</b> on each string. How many strings?", "answers": ["4", "four"], "why": "8 × 4 = 32. So <b>4 strings</b>.", "no": "32 is the total. 8 × what = 32?", "hint": "8 × 5 = 40 is too big. Go down."}, {"q": "Amy walks <b>6 blocks</b> to the park. Then she walks <b>7 blocks</b> home. How many blocks?", "choices": ["42", "13", "1"], "a": 1, "why": "Two amounts, not equal groups. Add: 6 + 7 = <b>13</b>.", "no": ["Not equal groups. She walks 6 and then 7. Add.", null, "1 is 7 − 6. She walked both ways."]}], "notes": {"say": "Read it. Ask: equal groups? Total or groups? Then solve.", "listen": "Vases: multiply, 36. Beads: total given, missing number 4. Blocks: add, 13."}}, {"type": "learn", "kick": "Wrap-up", "title": "Slow pile and your weekend plan", "text": "We do the <b>slow pile</b> one more time. Then your plan.", "visual": {"kind": "emoji", "text": "🐢 ➜ ⚡"}, "steps": [{"text": "<b>Thursday night:</b> the After-class lesson. It ends with Show What You Know."}, {"text": "<b>Friday:</b> the Lesson 8 Practice and Lesson 7 packet page 2."}, {"text": "<b>Saturday:</b> the Lesson 8 packet and Times Table Trail, Lesson 4."}, {"text": "<b>Sunday:</b> Times Table Trail, Lesson 5. <b>Every day:</b> read 15 minutes."}], "tip": "Monday on Zoom we start Word Problem Detective!", "notes": {"do": "Redo the slow-pile cards once. Then open the course page and read the task list with her. Send the Lesson 8 packet home.", "say": "Look how many cards moved to the fast pile this week!", "ask": "Which card is still slow? What trick will you use for it?", "listen": "She names a card and its trick. Write that fact on a sticky note for her to practice."}}], "win": "You proved it! 4s, 6s, 7s, 8s and 9s are yours.", "prev": "bb-bristol-L07", "prevTitle": "Lesson 7"});</script></body></html>
