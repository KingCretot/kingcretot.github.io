<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Practice 6</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Tricks for 8s and 9s</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. 8s: double the 4s. 9s: 10s take away one group.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bristol", "label": "Lesson 6", "title": "Tricks for 8s and 9s", "mastery": 85, "color": "#8E44AD", "questions": [{"q": "4 × 2 = 8. So what is <b>8 × 2</b>?", "choices": ["10", "16", "12"], "a": 1, "why": "Double 8 is 16.", "no": ["10 is 8 + 2. Double 8 instead.", null, "12 is 4 + 8. Double means 8 + 8."]}, {"q": "What is <b>9 × 2</b>?", "choices": ["18", "11", "20"], "a": 0, "why": "10 × 2 = 20. 20 − 2 = 18.", "no": [null, "11 is 9 + 2. Multiply, don't add.", "20 is 10 × 2. Take away one group of 2."]}, {"q": "4 × 9 = 36. So what is <b>8 × 9</b>?", "choices": ["45", "63", "72"], "a": 2, "why": "Double 36: 60 + 12 = 72.", "no": ["45 is 36 + 9. Double means add 36 again.", "63 is 9 × 7.", null]}, {"q": "What is <b>9 × 10</b>?", "choices": ["100", "90", "80"], "a": 1, "why": "10 × 10 = 100. 100 − 10 = 90.", "no": ["100 is 10 × 10. Take away one group of 10.", null, "80 is 8 × 10."]}, {"q": "What is <b>8 × 10</b>?", "choices": ["80", "18", "40"], "a": 0, "why": "4 × 10 = 40. Double 40 is 80.", "no": [null, "18 is 8 + 10. Multiply.", "40 is 4 × 10. Double it."]}, {"q": "10 × 3 = 30. So what is <b>9 × 3</b>?", "choices": ["21", "29", "27"], "a": 2, "why": "30 − 3 = 27.", "no": ["21 is 30 − 9. Take away a group of 3.", "29 is 30 − 1. Take away a whole group of 3.", null]}, {"q": "Which way finds <b>8 × 9</b>?", "choices": ["4 × 9, then double it", "4 × 9, then add 4", "10 × 9, then take away 9"], "a": 0, "why": "8 is double 4. 4 × 9 = 36, double is 72.", "no": [null, "Double, don't add 4.", "That is the 9s trick. 90 − 9 = 81, which is 9 × 9."]}, {"q": "What is <b>4 × 6</b>?", "choices": ["20", "24", "28"], "a": 1, "why": "Double 6 is 12. Double 12 is 24.", "no": ["20 is 4 × 5.", null, "28 is 4 × 7."]}, {"q": "A vet has <b>9 cages</b>. Each cage has <b>2 kittens</b>. How many kittens?", "visual": {"kind": "groups", "groups": 9, "each": 2, "emoji": "🐱"}, "choices": ["11", "16", "18"], "a": 2, "why": "9 × 2 = 18.", "no": ["11 is 9 + 2. Each cage has 2, so multiply.", "16 is 8 × 2. Count the cages: 9.", null]}, {"q": "Amy reads <b>8 pages</b> a day for <b>5 days</b>. How many pages?", "choices": ["13", "40", "45"], "a": 1, "why": "5 × 8 = 40.", "no": ["13 is 8 + 5. She reads 8 pages each day, so multiply.", null, "45 is 9 × 5."]}, {"q": "Liz has <b>9 beads</b>. Ellie has <b>6 beads</b>. How many in all?", "choices": ["15", "54", "3"], "a": 0, "why": "Not equal groups. Add: 9 + 6 = 15.", "no": [null, "These are not equal groups. Add.", "3 is 9 − 6. The question asks how many in all."]}]});</script></body></html>
