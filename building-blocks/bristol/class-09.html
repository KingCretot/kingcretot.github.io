<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 9: Word Problem Detective</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L09", "label": "Lesson 9", "title": "Word Problem Detective", "goal": "I can ask 3 detective questions and pick add, subtract or multiply.", "date": "2026-11-09", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Word Problem Detective", "text": "Amy and her friends look for <b>clues</b>. 🔍 Today <b>you</b> look for clues in <b>word problems</b>!", "visual": {"kind": "emoji", "text": "🔍📖🐶"}, "notes": {"do": "Share your screen. Before you start, check that she has about 20 beans (or coins or blocks), a sheet of paper, a pencil and her book next to her.", "say": "\"Amy and her friends are looking for clues. Today you are a detective too. You will look for clues in math stories.\"", "ask": "\"What does a detective do?\"", "listen": "Looks for clues, asks questions, does not guess. Tie it to math: we will not guess the operation."}}, {"type": "talk", "kick": "Book Talk", "title": "Clues in your book", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["Where did you stop reading?", "The puppy is <b>missing</b>. What clues help the girls look for it?", "If you were Amy, what would you do next?"], "starters": ["I stopped when …", "One clue is …", "If I were Amy, I would …"], "notes": {"do": "Book talk, about 6 minutes. She holds up the page where she stopped.", "ask": "Ask all three prompts. Push for a real clue from the text: \"Show me the sentence.\"", "listen": "A clue that comes from the book (where the puppy was seen, who saw it). If she says \"I don't know\", read one page aloud together and find one clue."}}, {"type": "recall", "kick": "Remember?", "title": "Facts from Weeks 1 to 3", "items": [{"q": "8 × 6 = ?<br><small>Hint: double the 4s fact.</small>", "choices": ["42", "48", "54"], "a": 1, "why": "4 × 6 = 24. Double 24 is <b>48</b>.", "no": ["42 is 7 × 6. Find 4 × 6 first, then double it.", null, "54 is 9 × 6. Find 4 × 6 = 24, then double it."]}, {"q": "9 × 7 = ?<br><small>Hint: 10 sevens, take away one 7.</small>", "choices": ["63", "56", "72"], "a": 0, "why": "10 × 7 = 70. Take away one 7: 70 − 7 = <b>63</b>.", "no": [null, "56 is 8 × 7. You need 9 sevens.", "72 is 9 × 8. Use 10 × 7 = 70, then take away 7."]}, {"q": "There are <b>6 shelves</b>. Each shelf has <b>7 books</b>. Which number sentence fits?", "choices": ["6 + 7 = 13", "7 × 7 = 49", "6 × 7 = 42"], "a": 2, "why": "Each shelf has 7, so the groups are equal. <b>6 × 7 = 42</b>.", "no": ["Adding counts only one shelf of books. Every shelf has 7.", "There are 6 shelves, not 7.", null]}], "notes": {"do": "You tap for her. Before each answer, she says the strategy out loud.", "ask": "\"8 × 6: what is 4 × 6 first?\" \"9 × 7: what is 10 × 7?\" \"Shelves: is every shelf the same?\"", "listen": "Double the 4s for ×8 (24 → 48). 10 sevens take away one 7 for ×9 (70 − 7 = 63). If she guesses, ask for the strategy before the answer."}}, {"type": "learn", "kick": "Why detectives?", "title": "Don't grab the numbers!", "text": "Amy has <b>4 bags</b>. Each bag has <b>6 bones</b>. How many bones?<br>A number grabber says: <b>4 + 6 = 10</b>. 🤔", "steps": [{"text": "Let's draw it. 4 bags. 6 bones in <b>each</b> bag.", "visual": {"kind": "groups", "groups": 4, "each": 6, "emoji": "🦴"}}, {"text": "Count the bones: 6, 12, 18, <b>24</b>. Not 10!"}, {"text": "The numbers were right. The <b>operation</b> was wrong. It is <b>4 × 6 = 24</b>.", "visual": {"kind": "bigtext", "text": "4 × 6 = 24"}}], "tip": "Good detectives read the story first. Then they pick the operation.", "notes": {"do": "Show the story and the 4 + 6 = 10 answer first. Do NOT reveal the steps yet. Have her put out 4 piles of 6 beans on her table and hold them up to the camera.", "say": "\"Someone grabbed the 4 and the 6 and added them. Let's see if 10 is right.\"", "ask": "\"Is 10 bones right? Count your beans. How many?\" Then: \"Were the numbers wrong, or was the plus sign wrong?\"", "listen": "\"24\" and \"the plus was wrong.\" Name the habit gently: \"That is called number grabbing. Today we stop doing it.\""}}, {"type": "learn", "kick": "Learn", "title": "The 3 detective questions", "text": "Before you solve, ask <b>3 questions</b>.", "visual": {"kind": "emoji", "text": "🕵️"}, "steps": [{"text": "<b>1. What is happening?</b> Tell the story in your own words."}, {"text": "<b>2. Are there equal groups?</b> Look for <b>each</b>, <b>every</b> or <b>per</b>."}, {"text": "<b>3. Which operation?</b> ➕ add, ➖ subtract or ✖️ multiply?"}], "tip": "Do not grab the numbers first. Ask the questions first!", "notes": {"do": "Reveal one question at a time. She repeats each question after you. Then say all three together twice with hand signals: 1 finger, 2 fingers, 3 fingers.", "say": "\"Before we solve, we ask 3 questions. Every story. Every time.\"", "ask": "Hide the slide (stop sharing for 10 seconds): \"Tell me the 3 questions.\"", "listen": "All 3 in order, in her words: What is happening? Are the groups equal? Add, subtract or multiply? Repeat until she says them without looking."}}, {"type": "learn", "kick": "Learn", "title": "Three kinds of stories", "text": "Most stories are one of these <b>3 kinds</b>.", "steps": [{"text": "➕ <b>Put together.</b> Two different amounts join.<br>Liz has 6 fish. Marion has 2 fish. How many fish?<br><b>Add:</b> 6 + 2 = 8", "visual": {"kind": "uneven", "sets": [6, 2], "emoji": "🐟"}}, {"text": "➖ <b>Take away or compare.</b> Some go away, or you find <b>how many more</b>.<br>There are 9 kittens. 3 go home. How many are left?<br><b>Subtract:</b> 9 − 3 = 6", "visual": {"kind": "bigtext", "text": "9 − 3 = 6"}}, {"text": "✖️ <b>Equal groups.</b> Every group has the same number.<br>There are 4 pens. Each pen has 5 rabbits.<br><b>Multiply:</b> 4 × 5 = 20", "visual": {"kind": "groups", "groups": 4, "each": 5, "emoji": "🐰"}}], "tip": "Equal groups → ✖️. Different amounts join → ➕. Some go away, or <b>how many more</b> → ➖.", "notes": {"do": "Reveal each kind. After each one she acts it out with her beans on camera: join two piles (add); take some away (subtract); make equal piles (multiply).", "ask": "After the take-away story: \"What did the beans do?\" After equal groups: \"Is every pen the same?\"", "listen": "Join = add, go away or compare = subtract, same in every group = multiply. If she says \"take away\" for the compare idea, accept it and add: \"How many more also means subtract.\""}}, {"type": "build", "kick": "Hands on", "title": "Build the nests", "text": "There are <b>5 nests</b>. Each nest has <b>3 eggs</b>. Make the groups.", "groups": 5, "each": 3, "emoji": "🥚", "why": "5 nests. 3 eggs in each nest. 5 × 3 = <b>15</b> eggs.", "hint": "How many nests? That is the groups. How many eggs in each nest?", "notes": {"do": "She builds it with beans first (5 piles of 3), then tells you the numbers and you set the counters on screen.", "ask": "\"What is happening? Are the groups equal? Which operation?\" Then: \"How many groups? How many in each?\"", "listen": "5 groups, 3 in each, multiply, 15. If she makes 3 groups of 5, ask: \"What are the groups in this story: nests or eggs?\""}}, {"type": "sort", "kick": "Sort it", "title": "What is happening?", "text": "Read the story. Say what is happening. Then pick the box.", "buckets": ["➕ Add", "➖ Subtract", "✖️ Multiply"], "items": [{"text": "Amy's mom has 8 cages. Each cage has 2 rabbits.", "b": 2, "why": "<b>Each</b> cage has 2. Equal groups. 8 × 2.", "hint": "Find the word <b>each</b>. Is every cage the same?"}, {"text": "Ellie had 15 stickers. She gave 6 to Liz.", "b": 1, "why": "Stickers went away. 15 − 6.", "hint": "Did Ellie get stickers or give some away?"}, {"text": "Marion rode her bike 7 miles. Then she rode 4 more miles.", "b": 0, "why": "7 miles and 4 miles join. 7 + 4.", "hint": "Two different amounts join. Nothing goes away."}, {"text": "Liz has 12 crayons. Amy has 5. How many more does Liz have?", "b": 1, "why": "<b>How many more</b> means compare. 12 − 5.", "hint": "<b>How many more</b> asks you to compare."}, {"text": "There are 6 vans. Every van has 4 seats.", "b": 2, "why": "<b>Every</b> van has 4. Equal groups. 6 × 4.", "hint": "Find the word <b>every</b>."}, {"text": "A puppy had 10 treats. It ate 7 of them.", "b": 1, "why": "7 treats are gone. 10 − 7.", "hint": "Did the treats join or go away?"}, {"text": "The club washed 5 dogs in the morning and 8 dogs after lunch.", "b": 0, "why": "5 and 8 are different amounts that join. 5 + 8.", "hint": "Are 5 and 8 equal groups?"}], "done": "Join ➕. Take away or compare ➖. Equal groups ✖️.", "notes": {"do": "She reads each story card aloud and says what is happening in her own words BEFORE she names the box. You tap the card, then the box she names. The three boxes match the 3 kinds of stories from slide 6.", "ask": "\"What is happening?\" then \"Equal groups?\" then \"Which box?\"", "listen": "The crayons card (Liz 12, Amy 5): \"how many more\" means compare, so subtract. The 5 dogs and 8 dogs card: different amounts join, so add (not multiply). If she names the wrong box, tap it anyway so she sees the hint, then ask the 3 questions again."}}, {"type": "learn", "kick": "Watch me", "title": "A detective at work", "text": "Amy's mom checks <b>7 dogs</b>. Each dog gets <b>4 treats</b>. How many treats?", "steps": [{"text": "<b>1. What is happening?</b> Every dog gets some treats."}, {"text": "<b>2. Equal groups?</b> Yes! <b>Each</b> dog gets 4."}, {"text": "<b>3. Which operation?</b> 7 groups of 4 → ✖️", "visual": {"kind": "groups", "groups": 7, "each": 4, "emoji": "🦴"}}, {"text": "<b>Solve.</b> 7 × 4 = <b>28</b> treats.", "visual": {"kind": "bigtext", "text": "7 × 4 = 28"}}, {"text": "<b>Check.</b> Double, double: 7 → 14 → <b>28</b>. ✔"}], "tip": "Draw it! Make 7 circles. Put 4 dots in each circle.", "notes": {"do": "I do. Reveal one step at a time and think out loud. Draw 7 circles with 4 dots each on the Zoom whiteboard (or paper held to the camera).", "say": "\"Watch me be the detective. I ask question 1 … question 2 … question 3. Now I solve. Now I check.\"", "ask": "At the end: \"Why did I not add 7 + 4?\"", "listen": "\"Because each dog gets 4. It is equal groups.\""}}, {"type": "learn", "kick": "We do", "title": "Solve it together", "text": "The vet sees <b>6 cats</b> in the morning. She sees <b>9 cats</b> after lunch. How many cats?", "steps": [{"text": "<b>1. What is happening?</b> Two groups of cats come in. They join."}, {"text": "<b>2. Equal groups?</b> No. 6 and 9 are <b>different</b> amounts.", "visual": {"kind": "uneven", "sets": [6, 9], "emoji": "🐱"}}, {"text": "<b>3. Which operation?</b> Join different amounts → ➕ add."}, {"text": "<b>Solve.</b> 6 + 9 = <b>15</b> cats. <b>Check:</b> 9 + 6 = 15 too. ✔"}], "tip": "Not every story is multiply! Different amounts → add.", "notes": {"do": "We do. She answers each question out loud BEFORE you reveal the step. She draws the picture on her paper and holds it up.", "ask": "\"What is happening?\" \"Are 6 and 9 equal groups?\" \"Which operation?\" \"What is 6 + 9?\"", "listen": "Add, 15. Watch for 6 × 9 = 54: she saw two numbers and multiplied. Ask: \"Is every group the same size?\""}}, {"type": "tap", "kick": "Try it", "title": "What would you draw?", "items": [{"q": "Liz has <b>8 marbles</b>. She loses <b>3</b>. How many are left? What would you draw?", "choices": ["8 marbles with 3 crossed out", "8 marbles and 3 more marbles", "3 groups of 8 marbles"], "a": 0, "why": "She <b>loses</b> 3, so cross 3 out. 8 − 3 = 5.", "no": [null, "She did not get more. She <b>lost</b> 3.", "There are no equal groups. Marbles went away."]}, {"q": "There are <b>3 hutches</b>. Each hutch has <b>6 bunnies</b>. How many bunnies? What would you draw?", "choices": ["A group of 3 bunnies and a group of 6 bunnies", "6 hutches with 3 bunnies in each", "3 hutches with 6 bunnies in each"], "a": 2, "why": "3 groups, 6 in each. 3 × 6 = 18.", "no": ["That picture shows 3 + 6. But <b>each</b> hutch has 6.", "That switches them. How many <b>hutches</b>? 3.", null]}, {"q": "Marion has <b>5 hats</b>. Ellie has <b>7 hats</b>. How many hats in all? What would you draw?", "choices": ["5 groups of 7 hats", "A group of 5 hats and a group of 7 hats", "7 hats with 5 crossed out"], "a": 1, "why": "Two different amounts join: 5 + 7 = 12.", "no": ["There are not 5 groups. Each girl has her own hats.", null, "No hats went away. The story asks how many <b>in all</b>."]}], "notes": {"do": "She reads each story aloud and describes the picture she would draw BEFORE she looks at the choices. You tap.", "ask": "\"Tell me the picture in your head first.\"", "listen": "For the hutches: 3 hutches with 6 in each (not 6 with 3 in each). Ask: \"How many hutches? That is the number of groups.\""}}, {"type": "learn", "kick": "Learn", "title": "Watch out for trap words!", "text": "Some words can trick you. Read the <b>whole</b> story.", "steps": [{"text": "<b>\"In all\"</b> does not always mean add.<br>There are 5 packs. Each pack has 6 pencils. How many pencils <b>in all</b>?<br>Equal groups → <b>5 × 6 = 30</b>", "visual": {"kind": "groups", "groups": 5, "each": 6, "emoji": "✏️"}}, {"text": "<b>\"More\"</b> can mean add <b>or</b> subtract.<br>Liz has 9 pens. She gets 4 <b>more</b>. → <b>add</b>: 9 + 4 = 13"}, {"text": "Liz has 9 pens. Amy has 4 pens. <b>How many more</b> does Liz have? → <b>subtract</b>: 9 − 4 = 5"}], "tip": "<b>How many more</b> asks you to <b>compare</b>. Compare means subtract.", "notes": {"do": "Reveal one step at a time. Show 5 packs of 6 with beans if she needs it.", "say": "\"Some words try to trick us. 'In all' can be add or multiply. 'More' can be add or subtract. So we read the WHOLE story.\"", "ask": "\"Liz gets 4 more pens: do the pens join or do we compare?\" \"How many MORE does Liz have: join or compare?\"", "listen": "Gets more → join → add. How many more → compare → subtract."}}, {"type": "tap", "kick": "Quick check", "title": "Trap or not?", "items": [{"type": "fill", "q": "Marion has <b>11</b> stickers. Ellie has <b>6</b>. How many <b>more</b> does Marion have?<br>Add, subtract or multiply?", "answers": ["subtract", "subtraction", "minus", "take away", "-", "−"], "why": "<b>How many more</b> means compare. 11 − 6 = 5.", "no": "Are the stickers joining, or are we comparing two girls?"}, {"q": "There are <b>5 boxes</b>. Each box has <b>9 crayons</b>. How many crayons <b>in all</b>?", "choices": ["5 + 9 = 14", "5 × 9 = 45", "9 − 5 = 4"], "a": 1, "why": "<b>Each</b> box has 9. Equal groups, so multiply: 5 × 9 = <b>45</b>.", "no": ["<b>In all</b> tricked you. Each box has 9, so it is equal groups.", null, "Nothing goes away. Every box has 9 crayons."]}], "notes": {"do": "Quick check for understanding. She answers out loud; you type or tap what she says.", "ask": "For the first one: \"Is anything joining?\" For the second: \"Does 'in all' mean add here? Why not?\"", "listen": "\"Subtract, because we compare.\" \"Multiply, because each box has 9.\" If she misses either, go back one slide and reread the trap word step."}}, {"type": "order", "kick": "Put in order", "title": "Detective steps", "text": "Tap the steps in the right order.", "steps": ["Read the whole story.", "What is happening?", "Are there equal groups?", "Pick ➕, ➖ or ✖️.", "Draw it and solve.", "Check: does it make sense?"], "why": "That is the detective routine! Read, ask 3 questions, solve, check.", "hint": "What do you do before anything else?", "notes": {"do": "You tap the steps in the order she says them.", "ask": "\"What is the very first thing a detective does?\"", "listen": "Read the whole story first. If she starts with \"pick the operation\", ask: \"How can you pick before you know what is happening?\""}}, {"type": "talk", "kick": "Say it", "title": "Tell me a story", "text": "Make up your own stories. Your teacher will draw them.", "prompts": ["Tell a <b>multiply</b> story for <b>6 × 4</b>.", "Tell an <b>add</b> story for <b>6 + 4</b>.", "Tell a <b>subtract</b> story for <b>10 − 4</b>."], "starters": ["There are 6 … Each one has 4 …", "Amy has … Liz has …", "There were 10 … Then …"], "notes": {"do": "She makes up each story. You draw exactly what she says on the whiteboard, even if it does not match the number sentence.", "ask": "After each story: \"Does my picture show 6 × 4?\"", "listen": "A multiply story needs equal groups (6 bags with 4 in each). If she tells \"6 dogs and 4 cats\" for 6 × 4, draw it and ask: \"Are those equal groups?\""}}, {"type": "tap", "kick": "Try it", "title": "Solve like a detective", "items": [{"q": "The vet has <b>9 boxes</b> of bandages. Each box has <b>6</b> bandages. How many bandages?", "choices": ["15", "54", "45"], "a": 1, "why": "Equal groups: 9 × 6. 10 × 6 = 60. Take away one 6: <b>54</b>.", "no": ["15 is 9 + 6. That counts only one box. Every box has 6.", null, "45 is 9 × 5. Each box has 6, not 5."]}, {"q": "Amy has <b>14</b> dog treats. Ellie has <b>8</b>. How many more does Amy have?", "choices": ["22", "7", "6"], "a": 2, "why": "<b>How many more</b> → compare. 14 − 8 = <b>6</b>.", "no": ["22 is 14 + 8. <b>How many more</b> means subtract.", "Count up from 8 to 14: 9, 10, 11, 12, 13, 14. That is 6, not 7.", null]}, {"q": "Marion picks <b>8</b> apples. Liz picks <b>8</b> apples. Amy picks <b>8</b> apples. How many apples?", "choices": ["24", "16", "11"], "a": 0, "why": "3 girls each pick 8. Equal groups! 3 × 8 = <b>24</b>.", "no": [null, "16 is only 2 girls. Count the girls: 3.", "11 is 8 + 3. There are 3 groups of 8."]}], "notes": {"do": "Guided practice. She reads each story aloud, answers the 3 questions out loud, then tells you the answer. You tap.", "ask": "\"What is happening? Equal groups? Which operation?\" Then the fact strategy: 9 × 6 = 10 sixes take away one 6.", "listen": "54, 6, 24. For the apples, she should see 3 equal groups even with no word \"each\" (8, 8, 8)."}}, {"type": "talk", "kick": "Wrap-up", "title": "What did you learn?", "text": "Tell your teacher.", "prompts": ["Say the <b>3 detective questions</b> from memory.", "Which words tell you the groups are equal?", "What does <b>how many more</b> mean?"], "starters": ["First I ask …", "The words … tell me …", "How many more means …"], "notes": {"do": "Stop sharing so she cannot read the slide for the first prompt. Then share the course page and show her the task list for tonight.", "say": "\"Tonight you do the After-Class Lesson by yourself. Ask the 3 questions on every story. Then read for 10 minutes. That's all for tonight.\"", "listen": "The 3 questions in order; each, every or per; compare, so subtract."}}], "win": "Case closed! You are a real word problem detective!", "prev": "bb-bristol-L08", "prevTitle": "Lesson 8"});</script></body></html>
