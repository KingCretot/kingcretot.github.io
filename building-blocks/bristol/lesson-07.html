<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 7: Sevens: 5 and 2 More</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L07", "label": "Lesson 7", "title": "Sevens: 5 and 2 More", "goal": "I can split 7 into 5 and 2 to find my 7s facts.", "date": "2026-11-03", "mastery": 85, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Sevens: 5 and 2 More", "text": "7 is a tricky number. But <b>7 = 5 + 2</b>. You know your 5s. You know your 2s. So you can do <b>7s</b>! 💪", "visual": {"kind": "emoji", "text": "5️⃣ ➕ 2️⃣ = 7️⃣"}}, {"type": "talk", "kick": "Book Talk", "title": "Tell it in order", "text": "Think about <i>Amy and the Missing Puppy</i>. Tell what happened <b>in order</b>.", "prompts": ["What happened <b>first</b> in the part you read?", "What happened <b>next</b>?", "What do you think will happen <b>at the end</b>? Why?"], "starters": ["First, …", "Next, …", "Then, …", "I think at the end …"]}, {"type": "recall", "kick": "Remember?", "title": "8s, 9s and 6s", "text": "Use your tricks from last lesson and last week.", "items": [{"q": "What is <b>8 × 7</b>?", "choices": ["54", "56", "35"], "a": 1, "why": "4 × 7 = 28. Double 28 is <b>56</b>.", "no": ["Careful! 4 × 7 = 28. Double 28: 40 + 16 = 56.", null, "35 is 5 × 7. Find 4 × 7 and double it."]}, {"q": "What is <b>9 × 6</b>?", "choices": ["54", "51", "59"], "a": 0, "why": "10 × 6 = 60. Take away one group of 6: <b>54</b>.", "no": [null, "51 is 60 − 9. Take away one group of <b>6</b>.", "59 is 60 − 1. Take away a whole group of 6."]}, {"q": "What is <b>6 × 6</b>?", "choices": ["30", "42", "36"], "a": 2, "why": "5 × 6 = 30. One more group of 6: <b>36</b>.", "no": ["30 is 5 × 6. Add one more group of 6.", "42 is 6 × 7.", null]}]}, {"type": "learn", "kick": "Learn", "title": "Split the 7", "text": "Here are <b>7 rows of 4</b>. Let's split them into <b>5 rows</b> and <b>2 rows</b>.", "steps": [{"text": "<b>Step 1.</b> 7 rows of 4. That is <b>7 × 4</b>.", "visual": {"kind": "array", "rows": 7, "cols": 4, "emoji": "🟦"}}, {"text": "<b>Step 2.</b> The top 5 rows: <b>5 × 4 = 20</b>.", "visual": {"kind": "array", "rows": 5, "cols": 4, "emoji": "🟦"}}, {"text": "<b>Step 3.</b> The last 2 rows: <b>2 × 4 = 8</b>.", "visual": {"kind": "array", "rows": 2, "cols": 4, "emoji": "🟨"}}, {"text": "<b>Step 4.</b> Add the parts: <b>20 + 8 = 28</b>. So <b>7 × 4 = 28</b>.", "visual": {"kind": "bigtext", "text": "7 × 4 = 28"}}], "tip": "5 rows + 2 rows = 7 rows. You did not lose any!"}, {"type": "learn", "kick": "Learn", "title": "Try 7 × 6", "text": "Let's find <b>7 × 6</b>. Split 7 into <b>5</b> and <b>2</b>.", "steps": [{"text": "<b>Step 1.</b> 5s part: <b>5 × 6 = 30</b>.", "visual": {"kind": "array", "rows": 5, "cols": 6, "emoji": "🟩"}}, {"text": "<b>Step 2.</b> 2s part: <b>2 × 6 = 12</b>.", "visual": {"kind": "array", "rows": 2, "cols": 6, "emoji": "🟧"}}, {"text": "<b>Step 3.</b> Add: <b>30 + 12 = 42</b>. So <b>7 × 6 = 42</b>.", "visual": {"kind": "bigtext", "text": "7 × 6 = 42"}}], "tip": "Both parts use the <b>same</b> number. For 7 × 6, it is 5 × <b>6</b> and 2 × <b>6</b>."}, {"type": "build", "kick": "Build it", "title": "Puppy toys", "text": "There are <b>7 puppies</b>. Each puppy gets <b>3 toys</b>. Make the groups.", "groups": 7, "each": 3, "emoji": "🧸", "why": "5 × 3 = 15. 2 × 3 = 6. 15 + 6 = 21. So <b>7 × 3 = 21</b>.", "hint": "How many puppies? How many toys for each puppy?"}, {"type": "tap", "kick": "Try it", "title": "5s and 2s make 7s", "items": [{"q": "5 × 8 = 40 and 2 × 8 = 16. What is <b>7 × 8</b>?", "choices": ["54", "48", "56"], "a": 2, "why": "40 + 16 = <b>56</b>. Say it: 5, 6, 7, 8. <b>56 = 7 × 8</b>!", "no": ["54 is a very common mix-up. Add again: 40 + 16 = 56.", "48 is 6 × 8. You need one more group of 8.", null]}, {"q": "What is <b>7 × 7</b>?", "choices": ["49", "42", "47"], "a": 0, "why": "5 × 7 = 35. 2 × 7 = 14. 35 + 14 = <b>49</b>.", "no": [null, "42 is 6 × 7. You need one more group of 7.", "Check the 2s part: 2 × 7 = 14, not 12."]}, {"q": "Which shows <b>7 × 3</b>?", "choices": ["5 × 3 + 2", "5 × 7 + 2 × 7", "5 × 3 + 2 × 3"], "a": 2, "why": "Split the 7. Both parts are groups of 3: 15 + 6 = 21.", "no": ["The 2 rows also have 3 in each. It is 2 × 3, not 2.", "That splits the wrong number. That makes 7 × 7.", null]}]}, {"type": "learn", "kick": "Learn", "title": "A calendar is an array!", "text": "A week has <b>7 days</b>. Each row on a calendar is one week.", "visual": {"kind": "array", "rows": 4, "cols": 7, "emoji": "📅", "label": "4 weeks. 7 days in each week."}, "steps": [{"text": "How many days in <b>4 weeks</b>? That is <b>4 rows of 7</b>."}, {"text": "4 × 7 is the same as <b>7 × 4</b>. We know that one: <b>28</b>!", "visual": {"kind": "bigtext", "text": "4 × 7 = 28"}}], "tip": "A turn-around fact has the same answer. 4 × 7 = 7 × 4."}, {"type": "order", "kick": "Put in order", "title": "How to do 7 × 9", "text": "Tap the steps in the right order.", "steps": ["Split 7 into 5 and 2", "Find both parts: 5 × 9 = 45 and 2 × 9 = 18", "Add the parts: 45 + 18 = 63", "So 7 × 9 = 63"], "why": "5s part, 2s part, then add. <b>7 × 9 = 63</b>.", "hint": "First split the 7. Then find both parts."}, {"type": "sort", "kick": "Sort it", "title": "Good split or not?", "text": "Is the split right? Check both parts.", "buckets": ["✅ Right", "❌ Wrong"], "items": [{"text": "7 × 5 = 25 + 10", "b": 0, "why": "5 × 5 = 25 and 2 × 5 = 10.", "hint": "5 × 5 = 25. 2 × 5 = 10. Are both parts right?"}, {"text": "7 × 3 = 15 + 2", "b": 1, "why": "The 2s part should be 2 × 3 = 6, not 2.", "hint": "What is 2 × 3?"}, {"text": "7 × 9 = 45 + 18", "b": 0, "why": "5 × 9 = 45 and 2 × 9 = 18.", "hint": "5 × 9 = 45. 2 × 9 = 18. Are both parts right?"}, {"text": "7 × 8 = 40 + 14", "b": 1, "why": "2 × 8 is 16, not 14.", "hint": "What is 2 × 8?"}, {"text": "7 × 6 = 35 + 12", "b": 1, "why": "The 5s part should be 5 × 6 = 30, not 35.", "hint": "What is 5 × 6?"}, {"text": "7 × 10 = 50 + 20", "b": 0, "why": "5 × 10 = 50 and 2 × 10 = 20.", "hint": "5 × 10 = 50. 2 × 10 = 20. Are both parts right?"}], "done": "Check both parts. Same number in each part!"}, {"type": "tap", "kick": "Word problems", "title": "Multiply or add?", "items": [{"q": "Amy walks the puppy <b>every day</b> for <b>3 weeks</b>. How many days is that?", "choices": ["10", "24", "21"], "a": 2, "why": "3 weeks, 7 days in each. 3 × 7 = <b>21</b>.", "no": ["10 is 3 + 7. Each week has 7 days, so multiply.", "24 is 3 × 8. A week has 7 days.", null]}, {"q": "Liz has <b>7 jars</b>. She puts <b>6 biscuits</b> in each jar. How many biscuits?", "choices": ["42", "13", "36"], "a": 0, "why": "7 × 6: 30 + 12 = <b>42</b>.", "no": [null, "13 is 7 + 6. Each jar has 6, so multiply.", "36 is 6 × 6. There are 7 jars."]}, {"q": "Ellie has <b>7 ribbons</b>. Marion gives her <b>7 more</b>. How many now?", "choices": ["49", "14", "0"], "a": 1, "why": "This is one group plus another. Add: 7 + 7 = <b>14</b>.", "no": ["Two 7s is not 7 groups of 7. Add them.", null, "0 is 7 − 7. She got more ribbons."]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "What is <b>7 × 8</b>?", "choices": ["48", "54", "56"], "a": 2, "why": "5 × 8 = 40. 2 × 8 = 16. 40 + 16 = 56.", "no": ["48 is 6 × 8.", "54 is a mix-up. 40 + 16 = 56.", null]}, {"q": "Which shows <b>7 × 6</b>?", "choices": ["5 × 6 + 2 × 6", "5 × 6 + 2", "5 × 6 + 6"], "a": 0, "why": "Split 7 into 5 and 2. Both parts are groups of 6.", "no": [null, "The 2s part is 2 × 6, not 2.", "That is only 6 groups of 6."]}, {"q": "What is <b>7 × 7</b>?", "choices": ["42", "49", "47"], "a": 1, "why": "35 + 14 = 49.", "no": ["42 is 6 × 7.", null, "2 × 7 is 14, not 12."]}, {"q": "What is <b>7 × 9</b>?", "choices": ["63", "56", "72"], "a": 0, "why": "45 + 18 = 63.", "no": [null, "56 is 7 × 8.", "72 is 8 × 9."]}, {"q": "How many days are in <b>5 weeks</b>?", "choices": ["12", "35", "30"], "a": 1, "why": "5 × 7 = 35.", "no": ["12 is 5 + 7. Each week has 7 days.", null, "30 is 5 × 6. A week has 7 days."]}, {"q": "There are <b>7 kids</b>. Each kid has <b>6 crayons</b>. How many crayons?", "choices": ["42", "13", "48"], "a": 0, "why": "7 × 6 = 42.", "no": [null, "13 is 7 + 6. Multiply.", "48 is 8 × 6."]}, {"q": "Marion has <b>7 marbles</b>. Ellie has <b>9 marbles</b>. How many in all?", "choices": ["63", "2", "16"], "a": 2, "why": "Not equal groups. Add: 7 + 9 = 16.", "no": ["These are not equal groups. Add.", "2 is 9 − 7.", null]}, {"q": "Which split is <b>wrong</b>?", "choices": ["7 × 4 = 20 + 8", "7 × 6 = 30 + 14", "7 × 7 = 35 + 14"], "a": 1, "why": "2 × 6 is 12, not 14. 7 × 6 = 30 + 12 = 42.", "no": ["5 × 4 = 20 and 2 × 4 = 8. That one is right.", null, "5 × 7 = 35 and 2 × 7 = 14. That one is right."]}]}], "win": "Sevens are no match for you. 5 and 2 more!", "prev": "bb-bristol-L06", "prevTitle": "Lesson 6"});</script></body></html>
