<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 12: Welcome Back: What Do You Remember?</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script>window.KCE_READALOUD=true</script><script src="clips.js"></script><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L12", "label": "Lesson 12", "title": "Welcome Back: What Do You Remember?", "goal": "I can show what I remember about groups, facts and word problems.", "date": "2026-12-03", "mastery": 85, "color": "#C9A84C", "slides": [{"type": "hello", "title": "Welcome Back!", "text": "Welcome back from your break! 🎉<br>First, you show your <b>Thankful Book</b>. <br>Then we find out what you <b>remember</b>.", "visual": {"kind": "emoji", "text": "🫙📖🧠"}, "notes": {"do": "Before she arrives, set out about 40 beans, 6 paper cups, play money ($1 and $5 bills), 5 index cards and the whiteboard. Ask her to put her Thankful Book and her Count the Slips page (page 3 of the project) on the table.", "say": "\"It has been three weeks! Today has two parts. First, your Thankful Book. Then a brain check. There is no new skill today. I want to see what you remember.\"", "ask": "\"Did you bring your book and your Count the Slips page?\"", "listen": "She has both. If page 3 is missing, ask her to tell you the numbers she remembers."}}, {"type": "talk", "kick": "Show and Tell", "title": "My Thankful Book", "text": "Read your book to your teacher. 📖", "prompts": ["Read each page out loud. Show the picture.", "Which page is your <b>favorite</b>? Why?", "Show your <b>Count the Slips</b> page. How many slips were in each pile?"], "starters": ["This page is about …", "My favorite page is … because …", "Each pile had … slips."], "notes": {"do": "About 8 minutes. You are the audience. She reads the whole book out loud (about 3 minutes) and shows each picture. Then she shows page 3 (Count the Slips). Write her pile numbers on the whiteboard for the next slide.", "say": "\"Thank you for reading your book to me. You and your family worked hard on this.\"", "ask": "\"Which page is your favorite? Why?\" \"How many piles did you make? How many slips were in each pile?\"", "listen": "She reads each sentence smoothly and points to the picture. Praise one true thing: a capital letter, a period, a clear picture, a loud voice. Each person wrote one slip a day, so Week 1 piles should have about 5 slips each."}}, {"type": "tap", "kick": "Your slips", "title": "Your slips are math!", "text": "Each person wrote <b>one</b> slip a day for <b>5</b> days.", "items": [{"q": "<b>6</b> piles. Each pile has <b>5</b> slips. Which number sentence finds all the slips?", "choices": ["6 + 5 = 11", "6 × 5 = 30", "5 × 5 = 25"], "a": 1, "why": "6 equal piles of 5. <b>6 × 5 = 30</b> slips.", "no": ["That adds the 6 piles and the 5 slips. Every pile has 5, so multiply.", null, "Count the piles. There are 6, not 5."], "visual": {"kind": "groups", "groups": 6, "each": 5, "emoji": "📝"}}, {"type": "fill", "q": "One day, nobody wrote River's slip. Now his pile has only <b>4</b>. Are the piles equal? <br>Type <b>equal</b> or <b>not equal</b>.", "answers": ["not equal"], "why": "One pile has 4. The others have 5. They are <b>not equal</b>, so you add: 5 + 5 + 5 + 5 + 5 + 4 = 29.", "no": "Count each pile. Do they all have the same number?", "placeholder": "equal or not equal", "visual": {"kind": "uneven", "sets": [5, 5, 5, 5, 5, 4], "emoji": "📝"}}], "notes": {"do": "If she has her real numbers from page 3, use them too. Equal piles: she multiplies. One pile different: she adds.", "ask": "\"Why can we multiply in the first picture?\" \"Why can't we multiply in the second picture?\"", "listen": "\"Every pile has 5.\" \"River's pile is different, so we add.\" If she says 6 × 5 for the second picture, have her count River's pile out loud."}}, {"type": "talk", "kick": "Book Talk", "title": "The end of the story", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["Did you finish the book? How did it end?", "Last time you guessed the ending. Was your guess <b>right</b>?", "What did Amy <b>learn</b> in this story?"], "starters": ["At the end, …", "My guess was … It was right because …", "Amy learned …"], "notes": {"do": "About 5 minutes. At Lesson 11 she guessed how the book would end. If she has not finished, she tells where she is and makes a new guess with a clue.", "ask": "\"How did it end?\" \"Was your guess right? What clue helped you?\" \"What did Amy learn?\"", "listen": "Events in order (first, next, then, at the end). For what Amy learned, accept a lesson in her own words. If she only retells, ask: \"What would Amy do differently next time?\""}}, {"type": "talk", "kick": "Brain check", "title": "What do you remember?", "text": "No looking back! Tell your teacher what you remember. 🧠", "prompts": ["When do you <b>multiply</b>? When do you <b>add</b>?", "Tell your trick for the <b>4s</b>, <b>6s</b>, <b>7s</b>, <b>8s</b> and <b>9s</b>.", "Say the <b>3 detective questions</b>."], "starters": ["I multiply when …", "For the 8s, I …", "First I ask …"], "notes": {"do": "About 4 minutes. Do not teach yet. On the whiteboard, make a quick list and check off what she says with no help: the equal groups rule, each of the 5 fact tricks, and the 3 questions. This is the main thing to find out today.", "say": "\"I want to see what stayed in your brain over the break. It is fine if something slipped. That tells me what to practice.\"", "listen": "Equal groups → multiply, not equal → add. ×4: double, double. ×6: the 5s fact plus one more group. ×7: the 5s fact plus the 2s fact. ×8: double the 4s. ×9: the 10s fact take away one group. What is happening? Equal groups? Which operation? Circle anything she could not say. Spend the most time on those slides."}}, {"type": "learn", "kick": "Remember", "title": "Equal or not?", "text": "Look at the groups <b>first</b>.", "steps": [{"text": "<b>Equal groups:</b> every group has the same number. → ✖️ multiply<br>4 vases. 3 roses in each. 4 × 3 = <b>12</b>", "visual": {"kind": "groups", "groups": 4, "each": 3, "emoji": "🌹"}}, {"text": "<b>Not equal:</b> the groups are different. → ➕ add<br>3 roses, 5 roses, 2 roses. 3 + 5 + 2 = <b>10</b>", "visual": {"kind": "uneven", "sets": [3, 5, 2], "emoji": "🌹"}}], "tip": "Count every group before you choose.", "notes": {"do": "She builds both with beans in cups (4 cups of 3, then cups of 3, 5 and 2) before you reveal each step.", "ask": "\"Can you multiply 3, 5 and 2? Why not?\"", "listen": "\"No. The groups are not the same.\" If she says yes, line the three cups up and have her count each one."}}, {"type": "sort", "kick": "Sort it", "title": "Multiply or add?", "text": "Tap a card. Then tap the right box.", "buckets": ["✖️ Equal groups: multiply", "➕ Not equal: add"], "items": [{"text": "5 plates. Each plate has 4 grapes.", "b": 0, "why": "<b>Each</b> plate has 4. 5 × 4 = 20.", "hint": "Find the word <b>each</b>."}, {"text": "One bag has 6 shells. One has 2. One has 7.", "b": 1, "why": "6, 2 and 7 are different. 6 + 2 + 7 = 15.", "hint": "Do all the bags have the same number?"}, {"text": "8 dogs. Every dog has 4 paws.", "b": 0, "why": "<b>Every</b> dog has 4. 8 × 4 = 32.", "hint": "Find the word <b>every</b>."}, {"text": "Liz has 9 beads. Amy has 5 beads.", "b": 1, "why": "9 and 5 are different. 9 + 5 = 14.", "hint": "Do the girls have the same number?"}, {"text": "3 boxes with 7 crayons in each box.", "b": 0, "why": "7 in <b>each</b> box. 3 × 7 = 21.", "hint": "Is every box the same?"}, {"text": "A red cup has 4 beans. A blue cup has 8 beans.", "b": 1, "why": "4 and 8 are different. 4 + 8 = 12.", "hint": "Are 4 and 8 the same?"}], "done": "You checked every group first!", "notes": {"do": "She reads each card out loud and says \"equal\" or \"not equal\" BEFORE she taps a box.", "ask": "\"Equal or not equal? How do you know?\"", "listen": "The words each and every point to equal groups. Two or three different numbers mean not equal, so add."}}, {"type": "learn", "kick": "Remember", "title": "Fact tricks", "text": "You have a <b>trick</b> for every hard fact.", "steps": [{"text": "<b>× 4:</b> double, double. <br>4 × 8: 8 → 16 → <b>32</b>"}, {"text": "<b>× 6:</b> the 5s fact plus one more group. <br>6 × 9: 45 + 9 = <b>54</b>"}, {"text": "<b>× 7:</b> the 5s fact plus the 2s fact. <br>7 × 7: 35 + 14 = <b>49</b>"}, {"text": "<b>× 8:</b> double the 4s. <br>8 × 8: 4 × 8 = 32. Double 32 is <b>64</b>."}, {"text": "<b>× 9:</b> the 10s fact take away one group. <br>9 × 9: 90 − 9 = <b>81</b>"}], "tip": "Stuck on a fact? Use the trick. Do not count by 1s!", "notes": {"do": "Reveal one trick at a time. She writes each trick on an index card (5 cards). She keeps the cards for the packet.", "say": "\"These are your 5 tricks. Let's put each one on a card.\"", "ask": "Before you reveal each one: \"What is your trick for the 6s? the 7s?\"", "listen": "Check her list from the brain check. A trick she could not say before needs one more example out loud."}}, {"type": "tap", "kick": "Try it", "title": "Facts with tricks", "text": "Say the trick out loud. Then type the answer.", "items": [{"type": "fill", "q": "____ = 6 × 6", "answers": ["36"], "why": "5 × 6 = 30. One more 6: 30 + 6 = <b>36</b>.", "no": "Use the 6s trick: the 5s fact plus one more 6.", "hint": "5 × 6 = 30. Add one more 6.", "placeholder": "Type a number"}, {"type": "fill", "q": "____ = 4 × 7", "answers": ["28"], "why": "Double, double: 7 → 14 → <b>28</b>.", "no": "Use the 4s trick: double 7, then double again.", "hint": "Double 7 is 14. Double 14.", "placeholder": "Type a number"}, {"type": "fill", "q": "____ = 7 × 9", "answers": ["63"], "why": "10 × 7 = 70. Take away one 7: 70 − 7 = <b>63</b>.", "no": "Use the 9s trick: 10 sevens, take away one 7.", "hint": "10 × 7 = 70. Take away 7.", "placeholder": "Type a number"}, {"type": "fill", "q": "____ = 8 × 9", "answers": ["72"], "why": "4 × 9 = 36. Double 36 is <b>72</b>.", "no": "Use the 8s trick: find 4 × 9, then double it.", "hint": "4 × 9 = 36. Double 36.", "placeholder": "Type a number"}], "notes": {"do": "In person: she types on your laptop. She says the trick out loud before she types each answer.", "ask": "\"Which trick did you use?\"", "listen": "36, 28, 63, 72. On 7 × 9 she may use the 7s trick (35 + 28 = 63) or the 9s trick (70 − 7). Both are fine. If she counts by 1s, point to her index card."}}, {"type": "tap", "kick": "Missing number", "title": "Find the missing factor", "text": "What number makes the fact true?", "items": [{"type": "fill", "q": "8 × ____ = 64", "answers": ["8"], "why": "8 × 8 = 64. Check: 4 × 8 = 32. Double 32 is 64.", "no": "What times 8 makes 64?", "hint": "Count by 8s: 8, 16, 24, 32, 40, 48, 56, 64. How many jumps?", "placeholder": "Type a number"}, {"type": "fill", "q": "____ × 9 = 54", "answers": ["6"], "why": "6 × 9 = 54. Check: 10 × 6 = 60. Take away 6: 54.", "no": "What times 9 makes 54?", "hint": "10 sixes is 60. Take away one 6.", "placeholder": "Type a number"}, {"type": "fill", "q": "____ × 4 = 28", "answers": ["7"], "why": "7 × 4 = 28. Double 7 is 14. Double 14 is 28.", "no": "What times 4 makes 28?", "hint": "Count by 4s until you reach 28. How many jumps?", "placeholder": "Type a number"}], "notes": {"do": "She skip counts on her fingers. For ____ × 4 = 28, she can put out 4 cups and add one bean to each cup at a time until there are 28 beans.", "ask": "\"How many jumps did you make?\"", "listen": "8, 6, 7. The answer is the number of jumps, not the last number she says."}}, {"type": "learn", "kick": "Remember", "title": "The detective questions", "text": "Before you solve a story, ask <b>3 questions</b>. 🕵️", "steps": [{"text": "<b>1. What is happening?</b>"}, {"text": "<b>2. Are there equal groups?</b> Look for <b>each</b>, <b>every</b> or <b>per</b>."}, {"text": "<b>3. Which operation?</b> ➕ add, ➖ subtract or ✖️ multiply?"}, {"text": "<i>Marion has 32 stickers. She gives 9 to Ellie.</i><br>Stickers go away → ➖ 32 − 9 = <b>23</b>"}], "tip": "<b>How many more</b> means compare. Compare means subtract.", "notes": {"do": "She says each question before you reveal it. On the last step, she answers all 3 questions out loud before you show the number sentence.", "ask": "\"What is happening to the stickers?\" \"How do we check 32 − 9 = 23?\"", "listen": "\"They go away, so subtract.\" Check: 23 + 9 = 32."}}, {"type": "tap", "kick": "Name it", "title": "Which operation?", "text": "Type <b>add</b>, <b>subtract</b> or <b>multiply</b>.", "items": [{"type": "fill", "q": "Ellie has 6 jars. She puts 5 shells in each jar. How many shells? <br>Add, subtract or multiply?", "answers": ["multiply", "multiplication", "times", "x"], "why": "5 shells in <b>each</b> jar. Equal groups → multiply. 6 × 5 = 30.", "no": "Find the word <b>each</b>. Is every jar the same?", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "Amy picked 14 apples. Liz picked 9 apples. How many more did Amy pick? <br>Add, subtract or multiply?", "answers": ["subtract", "subtraction", "minus", "take away", "-", "−"], "why": "<b>How many more</b> → compare → subtract. 14 − 9 = 5.", "no": "This story compares two girls. What does <b>how many more</b> mean?", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "The club washed 7 dogs on Saturday and 12 dogs on Sunday. How many dogs? <br>Add, subtract or multiply?", "answers": ["add", "addition", "plus", "+"], "why": "7 and 12 are different amounts that join → add. 7 + 12 = 19.", "no": "Are 7 and 12 equal groups? Do they join or go away?", "placeholder": "add, subtract or multiply"}], "notes": {"do": "She reads each story out loud, answers the 3 questions, then types the operation.", "ask": "Only if she is wrong: \"What is happening? Are the groups equal?\"", "listen": "Multiply, subtract, add. The dogs story has two numbers but no equal groups, so it is add."}}, {"type": "learn", "kick": "Remember", "title": "Price tags", "text": "Many things at the <b>same price</b>? Multiply. 🏷️", "steps": [{"text": "<b>How many × price = total.</b><br>Pens cost $3 each. Amy buys 6. 6 × 3 = <b>$18</b>.", "visual": {"kind": "bigtext", "text": "6 × $3 = $18"}}, {"text": "<b>How many can I buy?</b><br>Ellie has $40. Bows cost $5 each. Count by 5s to 40. That is <b>8</b> jumps, so 8 bows.", "visual": {"kind": "numberline", "start": 0, "jump": 5, "jumps": 8}}, {"text": "<b>Who spends more?</b> Find <b>both</b> totals first. Then compare."}], "tip": "The <b>price</b> is for one. The <b>total</b> is for all of them.", "notes": {"do": "She pays for 6 pens at $3 with $1 bills in 6 piles of 3. Then she counts out $40 in $5 bills and counts the bills.", "ask": "\"Is $3 the price or the total?\" \"How many bills did you use for $40?\"", "listen": "$3 is the price, $18 is the total. 8 bills of $5 make $40, so 8 bows."}}, {"type": "build", "kick": "Hands on", "title": "Pay for the stickers", "text": "Sticker sheets cost <b>$4 each</b>. Liz buys <b>7</b> sheets. Make one group of $4 for each sheet.", "groups": 7, "each": 4, "emoji": "💵", "why": "7 groups of $4. 7 × 4 = <b>$28</b>.", "hint": "How many sheets? That is the number of groups. How much is each sheet?", "notes": {"do": "She makes 7 piles of four $1 bills on the table. Then she sets the counters on screen.", "ask": "\"How many groups? How many dollars in each? What is the total?\"", "listen": "7 groups of 4, $28. If she makes 4 groups of 7, ask: \"How many sheets did Liz buy?\""}}, {"type": "tap", "kick": "Try it", "title": "Shop problems", "items": [{"type": "fill", "q": "Notebooks cost <b>$6 each</b>. Marion buys <b>4</b>. What is the total?", "answers": ["24"], "why": "Same price for each notebook. 4 × 6 = <b>24</b>.", "no": "Every notebook is $6. Multiply. Then check your math.", "hint": "Double 6 is 12. Double 12.", "placeholder": "Type a number"}, {"type": "fill", "q": "Liz has <b>$80</b>. Puzzles cost <b>$10 each</b>. How many can she buy?", "answers": ["8"], "why": "10, 20, 30, 40, 50, 60, 70, 80. That is <b>8</b> jumps. 8 × 10 = 80.", "no": "Count by 10s until you reach 80. Count the jumps.", "hint": "? × 10 = 80", "placeholder": "Type a number"}, {"q": "Amy buys <b>5 pens at $3 each</b>. Ellie buys <b>2 books at $7 each</b>. Who spends more?", "choices": ["Ellie", "Amy", "They spend the same."], "a": 1, "why": "Amy: 5 × 3 = 15. Ellie: 2 × 7 = 14. Amy spends $1 more.", "no": ["Ellie spends 2 × 7 = $14. Find Amy's total: 5 × 3.", null, "Find both totals. Are $15 and $14 the same?"]}], "notes": {"do": "She solves each one on the whiteboard first, then answers on the laptop.", "ask": "\"Too big or too small? How can you check?\"", "listen": "$24, 8 puzzles, Amy. On the last one she must find both totals before she picks."}}, {"type": "tap", "kick": "Find the mistake", "title": "Be the teacher", "items": [{"q": "Ellie says: <i>9 × 6 = 56.</i> What is right?", "choices": ["54", "56 is right.", "63"], "a": 0, "why": "10 × 6 = 60. Take away one 6: <b>54</b>.", "no": [null, "56 is 7 × 8. Use 10 × 6 = 60, then take away one 6.", "63 is 9 × 7. Ellie needs 9 sixes, not 9 sevens."]}, {"q": "Liz says: <i>4 bags. 7 apples in each bag. 4 + 7 = 11 apples.</i> What is right?", "choices": ["11 apples is right.", "21 apples", "28 apples"], "a": 2, "why": "Each bag has 7. Equal groups: 4 × 7 = <b>28</b>.", "no": ["Liz added. Each bag has 7, so multiply.", "21 is 3 × 7. There are 4 bags.", null]}], "notes": {"do": "She says what Ellie and Liz did wrong BEFORE she picks.", "ask": "\"What did Ellie do? What did Liz do?\"", "listen": "Ellie used a wrong fact (56 is 7 × 8). Liz added when the groups were equal."}}, {"type": "talk", "kick": "Wrap-up", "title": "What did you keep?", "text": "You did a lot today! 🌟", "prompts": ["What was <b>easy</b> today?", "What do you want to <b>practice</b> more?", "Next lesson is about words like <b>don't</b> and <b>can't</b>. Can you find one in your book?"], "starters": ["… was easy.", "I want to practice …", "I found …"], "notes": {"do": "Show the task list on the course page: tonight the After-Class Lesson; Friday the Practice; Saturday the Packet; Sunday the reading lesson; 15 minutes of reading each day.", "say": "\"You remembered a lot! Monday we start something new on Zoom.\"", "listen": "She names one thing that was easy and one thing to practice. Compare it with your brain-check list."}}], "win": "Welcome back! Your brain kept so much!", "prev": "bb-bristol-L11", "prevTitle": "Lesson 11"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.docume
