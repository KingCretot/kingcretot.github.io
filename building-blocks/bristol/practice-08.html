<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Practice 8</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Prove It: Mixed Facts</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Mixed facts! Pick your best trick.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bristol", "label": "Lesson 8", "title": "Prove It: Mixed Facts", "mastery": 85, "color": "#8E44AD", "questions": [{"q": "What is <b>6 × 7</b>?", "choices": ["42", "36", "48"], "a": 0, "why": "5 × 7 = 35. One more 7: 42.", "no": [null, "36 is 6 × 6.", "48 is 6 × 8."]}, {"q": "What is <b>8 × 8</b>?", "choices": ["16", "64", "56"], "a": 1, "why": "4 × 8 = 32. Double 32 is 64.", "no": ["16 is 8 + 8. Multiply.", null, "56 is 7 × 8."]}, {"q": "What is <b>9 × 4</b>?", "choices": ["39", "32", "36"], "a": 2, "why": "40 − 4 = 36.", "no": ["39 is 40 − 1. Take away a group of 4.", "32 is 8 × 4.", null]}, {"q": "What is <b>7 × 7</b>?", "choices": ["49", "14", "42"], "a": 0, "why": "35 + 14 = 49.", "no": [null, "14 is 7 + 7. Multiply.", "42 is 6 × 7."]}, {"q": "<b>? × 8 = 32</b>", "choices": ["24", "4", "5"], "a": 1, "why": "4 × 8 = 32.", "no": ["24 is 32 − 8. Ask: what times 8 makes 32?", null, "5 × 8 = 40. Too big."]}, {"q": "<b>9 × ? = 72</b>", "choices": ["63", "9", "8"], "a": 2, "why": "9 × 8 = 72.", "no": ["63 is 72 − 9. Ask: 9 times what makes 72?", "9 × 9 = 81. Too big.", null]}, {"q": "<b>? × 7 = 56</b>", "choices": ["8", "49", "6"], "a": 0, "why": "8 × 7 = 56.", "no": [null, "49 is 56 − 7. Ask: what times 7 makes 56?", "6 × 7 = 42. Too small."]}, {"q": "Which fact has the same answer as <b>9 × 7</b>?", "choices": ["9 × 8", "7 × 9", "7 + 9"], "a": 1, "why": "7 × 9 is the turn-around. Both are 63.", "no": ["9 × 8 = 72.", null, "7 + 9 = 16. That adds."]}, {"q": "There are <b>8 tables</b>. Each table has <b>6 cups</b>. How many cups?", "choices": ["14", "42", "48"], "a": 2, "why": "8 × 6: 4 × 6 = 24. Double is 48.", "no": ["14 is 8 + 6. Multiply.", "42 is 7 × 6. There are 8 tables.", null]}, {"q": "Marion has <b>54 stickers</b>. She puts <b>9</b> on each page. How many pages?", "choices": ["6", "45", "63"], "a": 0, "why": "9 × 6 = 54, so 6 pages.", "no": [null, "45 is 54 − 9. Ask: 9 times what makes 54?", "63 is 54 + 9. 54 is the total."]}, {"q": "Amy saw <b>9 dogs</b> and <b>7 cats</b> at the vet. How many animals?", "choices": ["63", "16", "2"], "a": 1, "why": "Not equal groups. Add: 9 + 7 = 16.", "no": ["These are not equal groups. Add.", null, "2 is 9 − 7."]}, {"q": "Liz says <b>8 × 7 = 54</b>. Which is right?", "choices": ["8 × 7 = 48", "8 × 7 = 63", "8 × 7 = 56"], "a": 2, "why": "4 × 7 = 28. Double 28 is 56.", "no": ["48 is 8 × 6.", "63 is 9 × 7.", null]}]});</script></body></html>
