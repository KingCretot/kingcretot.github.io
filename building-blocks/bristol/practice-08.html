<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Practice 8</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Prove It: Mixed Facts</h1><p style="margin:0 0 12px;color:#5b6578">You get 3 tries on each one. Only your first try counts. Mixed facts! Pick your best trick.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bristol", "label": "Lesson 8", "title": "Prove It: Mixed Facts", "mastery": 85, "color": "#8E44AD", "questions": [{"type": "fill", "q": "6 × 7 = ____", "answers": ["42"], "why": "5 × 7 = 35. One more 7: <b>42</b>.", "no": "6s: 5s + one group.", "hint": "35 + 7 = ?"}, {"type": "fill", "q": "3 × 9 = ____", "answers": ["27"], "why": "Flip it: 9 × 3. 30 − 3 = <b>27</b>.", "no": "Flip it to 9 × 3. Use the 9s trick.", "hint": "10 × 3 = 30. Take away 3."}, {"q": "What is <b>9 × 4</b>?", "choices": ["39", "32", "36"], "a": 2, "why": "10 × 4 = 40. 40 − 4 = <b>36</b>.", "no": ["39 is 40 − 1. Take away a whole group of 4.", "32 is 8 × 4.", null]}, {"type": "fill", "q": "Split the 7: <b>7 × 7</b> = ____", "answers": ["49"], "why": "35 + 14 = <b>49</b>.", "no": "5s part + 2s part.", "hint": "35 + 14 = ?"}, {"type": "fill", "q": "____ × 8 = 32", "answers": ["4", "four"], "why": "4 × 8 = <b>32</b>.", "no": "Start at 5 × 8 = 40. Too big. Go down.", "hint": "Go down one."}, {"type": "fill", "q": "9 × ____ = 72", "answers": ["8", "eight"], "why": "9 × 8 = <b>72</b>.", "no": "Start at 9 × 5 = 45. Go up.", "hint": "80 − 8 = 72."}, {"q": "<b>? × 7 = 56</b>", "choices": ["8", "49", "6"], "a": 0, "why": "8 × 7 = <b>56</b>.", "no": [null, "49 is 56 − 7. What times 7 is 56?", "6 × 7 is 42. Too small."]}, {"q": "Which fact has the same answer as <b>9 × 7</b>?", "choices": ["9 × 8", "7 × 9", "7 + 9"], "a": 1, "why": "Turn-around: 7 × 9 = 9 × 7 = 63.", "no": ["9 × 8 is 72.", null, "7 + 9 is 16. Multiply."]}, {"type": "fill", "q": "There are <b>8 tables</b>. Each table has <b>6 cups</b>. How many cups?", "answers": ["48"], "why": "8 × 6: 4 × 6 = 24. Double 24 is <b>48</b>.", "no": "Each table has 6. Multiply.", "hint": "24 + 24 = ?"}, {"type": "fill", "q": "Marion has <b>54 stickers</b>. She puts <b>9</b> on each page. How many pages?", "answers": ["6", "six"], "why": "9 × 6 = 54, so <b>6 pages</b>.", "no": "54 is the total. 9 × what = 54?", "hint": "Start at 9 × 5 = 45. Go up."}, {"type": "fill", "q": "Amy saw <b>9 dogs</b> and <b>7 cats</b> at the vet. How many animals?", "answers": ["16"], "why": "Two amounts. Add: 9 + 7 = <b>16</b>.", "no": "Not equal groups. Add.", "hint": "9 + 7 = ?"}, {"q": "Liz says <b>8 × 7 = 54</b>. Which is right?", "choices": ["8 × 7 = 48", "8 × 7 = 63", "8 × 7 = 56"], "a": 2, "why": "4 × 7 = 28. Double 28 is <b>56</b>.", "no": ["48 is 8 × 6.", "63 is 9 × 7.", null]}]});</script></body></html>
