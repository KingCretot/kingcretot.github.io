mily. Today you learn the families that go with I, you, he, she, it, we and they.\"", "ask": "\"What is a contraction? What does the apostrophe do?\"", "listen": "Two words pushed together; the apostrophe takes the place of the missing letters."}}, {"type": "talk", "kick": "Book Talk", "title": "Hunting in my book", "text": "Think about the book you are reading.", "prompts": ["What happened in your book since Monday?", "Did you find an <b>n't</b> word? What two words make it?", "Find a sentence that starts with <b>I</b>, <b>he</b>, <b>she</b> or <b>they</b>. Read it."], "starters": ["Since Monday, …", "I found … It means …", "The sentence says …"], "notes": {"do": "About 6 minutes. She shows the page with her n't word.", "ask": "\"What two words make it?\" \"Who is he or she in that sentence?\"", "listen": "The two words are right (didn't = did not). She can tell who the he or she is. Say: \"Words like he and she can push together too. Let's see how.\""}}, {"type": "recall", "kick": "Remember?", "title": "The not family", "items": [{"q": "Which one is spelled right?", "choices": ["can't", "cann't", "ca'nt"], "a": 0, "why": "can not → <b>can't</b>. The n and o drop out.", "no": [null, "Only one n is left. The n and o of not drop out.", "can stays whole. The apostrophe goes after can."]}, {"type": "fill", "q": "We ____ go to the park yesterday. <i>(did not)</i>", "answers": ["didn't", "didn’t"], "why": "did not → <b>didn't</b>. The o drops out.", "no": "Take out the o in not. Put in an apostrophe.", "placeholder": "Type the contraction"}], "notes": {"do": "Check Monday's After-Class score first. She spells didn't out loud before she types it.", "ask": "\"Where does the apostrophe go in didn't?\"", "listen": "can't; d-i-d-n-apostrophe-t. If she is shaky, redo one paper strip from Monday."}}, {"type": "learn", "kick": "Learn", "title": "Words for people", "text": "These words take the place of a <b>name</b>.", "visual": {"kind": "bigtext", "text": "I · you · he · she · traction", "a": "he", "b": "is", "drop": [0], "result": "he's"}}, {"text": "she is → <b>she's</b>", "visual": {"kind": "contraction", "a": "she", "b": "is", "drop": [0], "result": "she's"}}, {"text": "it is → <b>it's</b>", "visual": {"kind": "contraction", "a": "it", "b": "is", "drop": [0], "result": "it's"}}], "tip": "Only the <b>s</b> is left after the apostrophe.", "notes": {"do": "Reveal one at a time. She builds she's with the cards.", "ask": "\"What does it's mean?\"", "listen": "\"It is.\" If she asks about its with no apostrophe, say: \"That is a different word. It shows something belongs to it. Today, it's with an apostrophe means it is.\""}}, {"type": "learn", "kick": "Learn", "title": "The will family", "text": "<b>Two</b> letters drop out of <b>will</b>: <b>w</b> and <b>i</b>.", "steps": [{"text": "I will → <b>I'll</b>", "visual": {"kind": "contraction", "a": "I", "b": "will", "drop": [0, 1], "result": "I'll"}}, {"text": "you will → <b>you'll</b>", "visual": {"kind": "contraction", "a": "you", "b": "will", "drop": [0, 1], "result": "you'll"}}, {"text": "we will → <b>we'll</b>", "visual": {"kind": "contraction", "a": "we", "b": "will", "drop": [0, 1], "result": "we'll"}}], "tip": "Two l's stay: <b>'ll</b>.", "notes": {"do": "She covers w and i with one sticky note.", "ask": "\"How many letters did you cover? How many l's are left?\"", "listen": "Two letters (w, i); two l's. Without the apostrophe, I'll looks like ill (sick). That is why the apostrophe matters."}}, {"type": "learn", "kick": "Learn", "title": "The have family", "text": "<b>Two</b> letters drop out of <b>have</b>: <b>h</b> and <b>a</b>.", "steps": [{"text": "I have → <b>I've</b>", "visual": {"kind": "contraction", "a": "I", "b": "have", "drop": [0, 1], "result": "I've"}}, {"text": "we have → <b>we've</b>", "visual": {"kind": "contraction", "a": "we", "b": "have", "drop": [0, 1], "result": "we've"}}, {"text": "they have → <b>they've</b>", "visual": {"kind": "contraction", "a": "they", "b": "h
