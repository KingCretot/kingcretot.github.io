<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 4: Sixes: Fives and One More</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L04", "label": "Lesson 4", "title": "Sixes: Fives and One More", "goal": "I can find 6 times a number with my 5s and one more group.", "date": "2026-10-27", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "Sixes: Fives and One More", "text": "You know your <b>5s</b>. Today they help you with the <b>6s</b>. ✋ + ☝️", "visual": {"kind": "emoji", "text": "✋ + ☝️ = 6"}}, {"type": "talk", "kick": "Book Talk", "title": "Who helps Amy?", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["Who helps Amy the most? What do they do?", "What is one clue the girls found?", "If you were Amy, what would you do next?"], "starters": ["… helps Amy by …", "One clue is …", "If I were Amy, I would …"]}, {"type": "recall", "kick": "Remember", "title": "Double, double", "items": [{"q": "Ellie has 4 boxes. Each box has 7 crayons. How many crayons?", "visual": {"kind": "groups", "groups": 4, "each": 7, "emoji": "🖍️"}, "choices": ["11", "28", "14"], "a": 1, "why": "4 equal groups of 7. Double 7 is 14, double 14 is <b>28</b>.", "no": ["11 is 4 + 7. Each box has 7, so multiply.", null, "14 is only 2 boxes. Double again!"]}, {"q": "A picture has <b>4 rows of 9</b> stars. How many stars?", "visual": {"kind": "array", "rows": 4, "cols": 9, "emoji": "⭐"}, "choices": ["32", "13", "36"], "a": 2, "why": "Double 9 is 18. Double 18 is <b>36</b>.", "no": ["32 is 4 × 8. Each row has 9.", "13 is 4 + 9. The rows are equal, so multiply.", null]}]}, {"type": "learn", "kick": "Learn", "title": "6 groups = 5 groups + 1 more", "text": "<b>6 × 4</b> means <b>6 groups of 4</b>.", "visual": {"kind": "groups", "groups": 6, "each": 4, "emoji": "🐾"}, "steps": [{"text": "Cover one group. Now you see <b>5 groups of 4</b>. 5 × 4 = <b>20</b>. You know that one!", "visual": {"kind": "groups", "groups": 5, "each": 4, "emoji": "🐾"}}, {"text": "Now add back the <b>one more group</b>. It has <b>4</b>.", "visual": {"kind": "groups", "groups": 1, "each": 4, "emoji": "🐾"}}, {"text": "<b>20 + 4 = 24</b>. So <b>6 × 4 = 24</b>.", "visual": {"kind": "bigtext", "text": "6 × 4 = 20 + 4 = 24"}}], "tip": "6 is 5 and 1 more. So <b>×6</b> is <b>the 5s fact plus one more group</b>."}, {"type": "learn", "kick": "Learn", "title": "Try it with 6 × 7", "text": "Here are <b>6 rows of 7</b> paw prints.", "visual": {"kind": "array", "rows": 6, "cols": 7, "emoji": "🐾", "label": "6 rows of 7"}, "steps": [{"text": "The top <b>5 rows</b>: 5 × 7 = <b>35</b>."}, {"text": "The last row: <b>one more 7</b>."}, {"text": "<b>35 + 7 = 42</b>. So <b>6 × 7 = 42</b>."}], "tip": "Add one more <b>group</b>, not one more <b>dot</b>. 6 × 7 is 35 + 7, not 35 + 1."}, {"type": "tap", "kick": "Try it", "title": "Fives and one more", "items": [{"q": "<b>6 × 8</b>: 5 × 8 = 40. What is next?", "choices": ["40 + 8 = 48", "40 + 1 = 41", "40 + 6 = 46"], "a": 0, "why": "Add one more group of 8: <b>40 + 8 = 48</b>.", "no": [null, "You added one dot. Add one more <b>group</b> of 8.", "The extra group has 8 in it, not 6."]}, {"q": "<b>6 × 9 = ?</b>", "choices": ["46", "54", "56"], "a": 1, "why": "5 × 9 = 45. One more 9: <b>45 + 9 = 54</b>.", "no": ["46 is 45 + 1. Add a whole group of 9.", null, "56 is 7 × 8. Check: 45 + 9. 5 + 9 = 14 ones, regroup."]}, {"q": "<b>6 × 3 = ?</b>", "choices": ["9", "15", "18"], "a": 2, "why": "5 × 3 = 15. One more 3: <b>15 + 3 = 18</b>.", "no": ["9 is 6 + 3. Multiply!", "15 is only 5 groups. Add one more group of 3.", null]}]}, {"type": "build", "kick": "Build it", "title": "Treat bowls", "text": "Liz sets out <b>6 bowls</b>. She puts <b>6 treats</b> in each bowl. Make the groups.", "groups": 6, "each": 6, "emoji": "🦴", "why": "6 groups of 6. 5 × 6 = 30, plus one more 6: <b>30 + 6 = 36</b>.", "hint": "How many bowls? How many treats in each bowl?"}, {"type": "order", "kick": "Put in order", "title": "How to do 6 × 9", "text": "Tap the steps in the right order.", "steps": ["Read the fact: 6 × 9", "Think: 5 × 9 = 45", "Add one more group of 9", "45 + 9 = 54"], "why": "Find the 5s fact, add one more group, then you have the 6s fact.", "hint": "First find the 5s fact."}, {"type": "sort", "kick": "Sort it", "title": "Which trick?", "text": "Tap a fact. Is it a <b>4s</b> fact or a <b>6s</b> fact?", "buckets": ["🐾🐾 Double, double<br><small>4s facts</small>", "✋☝️ 5s + one more<br><small>6s facts</small>"], "items": [{"text": "4 × 7", "b": 0, "why": "It has a 4. Double 7 is 14, double 14 is 28.", "hint": "Look for the 4 or the 6."}, {"text": "6 × 3", "b": 1, "why": "It has a 6. 5 × 3 = 15, plus 3 is 18.", "hint": "Look for the 4 or the 6."}, {"text": "8 × 4", "b": 0, "why": "Turn it around: 4 × 8. Double 8 is 16, double 16 is 32.", "hint": "8 × 4 is the same as 4 × 8."}, {"text": "9 × 6", "b": 1, "why": "Turn it around: 6 × 9. 45 + 9 = 54.", "hint": "9 × 6 is the same as 6 × 9."}, {"text": "4 × 9", "b": 0, "why": "Double 9 is 18, double 18 is 36.", "hint": "Which number is 4 or 6?"}, {"text": "7 × 6", "b": 1, "why": "Turn it around: 6 × 7. 35 + 7 = 42.", "hint": "Which number is 4 or 6?"}], "done": "4s: double, double. 6s: 5s plus one more group."}, {"type": "tap", "kick": "Try it", "title": "Read the picture", "items": [{"q": "How many in all?", "visual": {"kind": "groups", "groups": 6, "each": 5, "emoji": "🍓"}, "choices": ["11", "30", "25"], "a": 1, "why": "6 groups of 5. 5 × 5 = 25, plus one more 5 is <b>30</b>.", "no": ["11 is 6 + 5. These are 6 equal groups.", null, "25 is only 5 groups. Count the groups again."]}, {"q": "Which fact matches the picture?", "visual": {"kind": "groups", "groups": 4, "each": 8, "emoji": "🍪"}, "choices": ["8 × 8", "4 + 8", "4 × 8"], "a": 2, "why": "4 groups with 8 in each: <b>4 × 8 = 32</b>.", "no": ["There are 4 groups, not 8.", "The groups are equal. Multiply.", null]}, {"q": "How many in all?", "visual": {"kind": "array", "rows": 6, "cols": 8, "emoji": "🌸"}, "choices": ["48", "40", "14"], "a": 0, "why": "6 rows of 8. 5 × 8 = 40, plus 8 is <b>48</b>.", "no": [null, "40 is 5 rows. Add the last row of 8.", "14 is 6 + 8. Multiply."]}]}, {"type": "tap", "kick": "Try it", "title": "Word problems", "text": "Equal groups? Multiply. Not equal? Add.", "items": [{"q": "Amy's mom has 6 cages. Each cage has 3 bunnies. How many bunnies?", "choices": ["18", "9", "3"], "a": 0, "why": "6 equal groups of 3: <b>6 × 3 = 18</b>.", "no": [null, "9 is 6 + 3. Each cage has 3, so multiply.", "3 is 6 − 3. Nobody took bunnies away."]}, {"q": "There are 4 vans. Each van has 6 dogs. How many dogs?", "choices": ["10", "24", "20"], "a": 1, "why": "4 equal groups of 6. Double 6 is 12, double 12 is <b>24</b>.", "no": ["10 is 4 + 6. Each van has 6, so multiply.", null, "20 is 4 × 5. Each van has 6."]}, {"q": "6 dogs barked in the morning. 8 dogs barked at night. How many barking dogs?", "choices": ["48", "2", "14"], "a": 2, "why": "6 and 8 are not equal groups. Add: <b>6 + 8 = 14</b>.", "no": ["There are not 6 groups of 8. Add the two amounts.", "2 is the difference. The question asks how many in all.", null]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "<b>6 × 4 = ?</b>", "choices": ["10", "24", "20"], "a": 1, "why": "5 × 4 = 20. One more 4: 24."}, {"q": "<b>6 × 8</b> is 5 × 8 plus ___.", "choices": ["one more 8", "one more 1", "one more 6"], "a": 0, "why": "6 groups of 8 is 5 groups of 8 and one more group of 8."}, {"q": "<b>6 × 7 = ?</b>", "choices": ["36", "13", "42"], "a": 2, "why": "5 × 7 = 35. 35 + 7 = 42."}, {"q": "How many in all?", "visual": {"kind": "groups", "groups": 6, "each": 9, "emoji": "🫐"}, "choices": ["54", "45", "15"], "a": 0, "why": "6 groups of 9. 45 + 9 = 54."}, {"q": "There are 6 nests. Each nest has 6 eggs. How many eggs?", "choices": ["30", "36", "12"], "a": 1, "why": "6 equal groups of 6: 5 × 6 = 30, plus 6 is 36."}, {"q": "There are 4 tables. Each table has 8 cupcakes. How many cupcakes?", "choices": ["12", "16", "32"], "a": 2, "why": "Double 8 is 16. Double 16 is 32."}, {"q": "Liz has 6 stickers. Amy gives her 9 more. How many stickers does Liz have now?", "choices": ["54", "15", "3"], "a": 1, "why": "6 and 9 are not equal groups. Add: 6 + 9 = 15."}, {"q": "Which fact is <b>wrong</b>?", "choices": ["6 × 9 = 56", "6 × 6 = 36", "4 × 6 = 24"], "a": 0, "why": "6 × 9 = 45 + 9 = 54, not 56."}]}], "win": "Fives and one more! You know your 6s!", "prev": "bb-bristol-L03", "prevTitle": "Lesson 3"});</script></body></html>
