<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 4: Sixes: Fives and One More</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L04", "label": "Lesson 4", "title": "Sixes: Fives and One More", "goal": "I can find 6 times a number with my 5s and one more group.", "date": "2026-10-27", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "On Your Own: Sixes", "text": "You learned the 6s in class. Now use your <b>5s</b> on your own. ✋ + ☝️", "visual": {"kind": "emoji", "text": "✋ + ☝️ = 6"}}, {"type": "talk", "kick": "Book Corner", "title": "Think about your book", "text": "Read each question. Tell a grown-up your answer.", "prompts": ["Where does the story happen? Tell one place.", "Where would you look for a lost puppy? Why?"], "starters": ["The story happens at …", "I would look … because …"]}, {"type": "recall", "kick": "Remember", "title": "From Lessons 2 and 3", "items": [{"type": "fill", "q": "<b>4 × 8 = ?</b>", "answers": ["32", "thirty-two", "thirty two"], "why": "Double 8 is 16. Double 16 is <b>32</b>.", "no": "Double, double.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 3 rows. <b>Every</b> row has 10 chairs. How many chairs?", "answers": ["30", "thirty"], "why": "3 groups of 10: <b>3 × 10 = 30</b>.", "no": "Skip count by 10s, one time for each row.", "placeholder": "Type a number"}]}, {"type": "learn", "kick": "Remember", "title": "Fives and one more", "text": "<b>6 × 2</b>: 5 × 2 = 10. One more 2. 10 + 2 = 12.", "visual": {"kind": "bigtext", "text": "10 + 2 = 12", "sub": "6 × 2"}, "tip": "Add one more <b>group</b>, not one more dot."}, {"type": "tap", "kick": "Try it", "title": "5s first", "items": [{"type": "fill", "q": "<b>6 × 4</b>. 5 × 4 = 20. Add one more 4. 20 + 4 = ____", "answers": ["24", "twenty-four", "twenty four"], "why": "20 + 4 = <b>24</b>. So 6 × 4 = 24.", "no": "Add the 4.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>6 × 7</b>. First, 5 × 7 = ____", "answers": ["35", "thirty-five", "thirty five"], "why": "5 × 7 = <b>35</b>.", "no": "Count by 5s seven times.", "placeholder": "Type a number"}, {"type": "fill", "q": "Now add one more 7. 35 + 7 = ____", "answers": ["42", "forty-two", "forty two"], "why": "35 + 7 = <b>42</b>. So 6 × 7 = 42.", "no": "5 + 7 = 12 ones. Regroup!", "placeholder": "Type a number"}]}, {"type": "build", "kick": "Build it", "title": "Shell boxes", "text": "Marion fills <b>6 boxes</b>. She puts <b>9 shells</b> in each box. Make the groups.", "groups": 6, "each": 9, "emoji": "🐚", "why": "6 groups of 9. 5 × 9 = 45, plus 9 is <b>54</b>.", "hint": "Each box is one group. <b>Groups</b> = how many boxes. <b>In each group</b> = shells in one box."}, {"type": "tap", "kick": "Try it", "title": "6s facts", "items": [{"type": "fill", "q": "5 × 6 = 30. So <b>6 × 6</b> = ____", "answers": ["36", "thirty-six", "thirtysix"], "why": "30 + one more 6 = <b>36</b>.", "no": "Add one more 6 to 30.", "placeholder": "Type a number"}, {"type": "fill", "q": "5 × 8 = 40. So <b>6 × 8</b> = ____", "answers": ["48", "forty-eight", "fortyeight"], "why": "40 + one more 8 = <b>48</b>.", "no": "Add one more 8 to 40.", "placeholder": "Type a number"}, {"q": "Which is the same as <b>6 × 9</b>?", "choices": ["5 × 9 + 1", "5 × 9 + 9", "6 + 9"], "a": 1, "why": "5 groups of 9 plus one more group of 9: 45 + 9 = <b>54</b>.", "no": ["Add one more <b>group</b> of 9, not 1.", null, "6 + 9 adds. 6 × 9 is 6 groups of 9."]}]}, {"type": "sort", "kick": "Sort it", "title": "Which trick?", "text": "Tap a fact. Is it a <b>4s</b> fact or a <b>6s</b> fact?", "buckets": ["🐾🐾 Double, double<br><small>4s facts</small>", "✋☝️ 5s + one more<br><small>6s facts</small>"], "items": [{"text": "4 × 3", "b": 0, "why": "Double 3 is 6. Double 6 is 12.", "hint": "Look for the 4 or the 6."}, {"text": "6 × 5", "b": 1, "why": "5 × 5 = 25. Plus 5 is 30.", "hint": "Look for the 4 or the 6."}, {"text": "3 × 6", "b": 1, "why": "Turn it around: 6 × 3. 15 + 3 = 18.", "hint": "3 × 6 is the same as 6 × 3."}, {"text": "10 × 4", "b": 0, "why": "Turn it around: 4 × 10. Double 10 is 20. Double 20 is 40.", "hint": "10 × 4 is the same as 4 × 10."}, {"text": "6 × 10", "b": 1, "why": "5 × 10 = 50. Plus 10 is 60.", "hint": "Which number is 4 or 6?"}, {"text": "9 × 4", "b": 0, "why": "Turn it around: 4 × 9. Double 9 is 18. Double 18 is 36.", "hint": "Which number is 4 or 6?"}], "done": "4s: double, double. 6s: 5s plus one more group."}, {"type": "tap", "kick": "Try it", "title": "Word problems", "text": "Equal groups? Multiply. Not equal? Add.", "items": [{"type": "fill", "q": "There are 6 vases. <b>Each</b> vase has 4 roses. How many roses?", "answers": ["24", "twenty-four", "twenty four"], "why": "6 equal groups of 4: 20 + 4 = <b>24</b>.", "no": "Each vase has 4. Use your 5s, then one more group.", "placeholder": "Type a number"}, {"type": "fill", "q": "Amy has 6 pens. Ellie has 9 pens. How many pens in all?", "answers": ["15", "fifteen"], "why": "6 and 9 are not equal groups. Add: <b>6 + 9 = 15</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}, {"q": "Which story matches <b>6 × 5</b>?", "choices": ["There are 6 cats and 5 dogs.", "There are 6 bags. Each bag has 5 apples.", "There are 6 apples. Amy eats 5."], "a": 1, "why": "6 groups (bags) with 5 in each: <b>6 × 5 = 30</b>.", "no": ["6 cats and 5 dogs are not equal groups. That is 6 + 5.", null, "Eating apples is take away: 6 − 5."]}]}, {"type": "tap", "kick": "Fix it", "title": "Find the mistake", "items": [{"type": "fill", "q": "Theo says <b>6 × 8 = 41</b>. He did 40 + 1. What is 6 × 8 really?", "answers": ["48", "forty-eight", "forty eight"], "why": "Add one more <b>group</b> of 8: 40 + 8 = <b>48</b>.", "no": "The extra group has 8 in it, not 1.", "placeholder": "Type a number"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "<b>3 × 6 = ?</b>", "answers": ["18", "eighteen"], "why": "Turn it around: 6 × 3. 5 × 3 = 15. One more 3: <b>18</b>.", "no": "3 × 6 is the same as 6 × 3. Start with 5 × 3.", "placeholder": "Type a number"}, {"q": "<b>6 × 8</b> is 5 × 8 plus ___.", "choices": ["one more 1", "one more 8", "one more 6"], "a": 1, "why": "6 groups of 8 is 5 groups of 8 and one more group of 8.", "no": ["Add one more <b>group</b> of 8, not 1.", null, "Each group has 8, so add 8, not 6."]}, {"type": "fill", "q": "<b>6 × 7 = ?</b>", "answers": ["42", "forty-two", "forty two"], "why": "5 × 7 = 35. 35 + 7 = <b>42</b>.", "no": "Start with 5 × 7.", "placeholder": "Type a number"}, {"type": "fill", "q": "How many in all?", "visual": {"kind": "groups", "groups": 6, "each": 9, "emoji": "🫐"}, "answers": ["54", "fifty-four", "fifty four"], "why": "6 groups of 9. 45 + 9 = <b>54</b>.", "no": "Cover one group. 5 × 9 is 45.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 6 nests. <b>Each</b> nest has 6 eggs. How many eggs?", "answers": ["36", "thirty-six", "thirty six"], "why": "6 equal groups of 6: 30 + 6 = <b>36</b>.", "no": "Each nest has 6. Use your 5s, then one more group.", "placeholder": "Type a number"}, {"q": "There are 4 tables. <b>Each</b> table has 8 cupcakes. How many cupcakes?", "choices": ["12", "16", "32"], "a": 2, "why": "Double 8 is 16. Double 16 is <b>32</b>.", "no": ["12 is 4 + 8. Each table has 8, so multiply.", "16 is only one double. Double again.", null]}, {"type": "fill", "q": "Liz has 6 stickers. Amy gives her 9 more. How many stickers does Liz have now?", "answers": ["15", "fifteen"], "why": "6 and 9 are not equal groups. Add: <b>6 + 9 = 15</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}, {"q": "Liz wrote <b>6 × 5 = 31</b>. What is wrong?", "choices": ["Nothing. She is right.", "It should be <b>35</b>.", "It should be <b>30</b>."], "a": 2, "why": "5 × 5 = 25. One more group of 5: 25 + 5 = <b>30</b>, not 31.", "no": ["5 × 5 = 25. Add one more group of 5, not 6.", "35 is 7 × 5. Start with 5 × 5 = 25.", null]}], [{"type": "fill", "q": "<b>6 × 6 = ?</b>", "answers": ["36", "thirty-six", "thirty six"], "why": "5 × 6 = 30. One more 6: <b>36</b>.", "no": "Start with 5 × 6.", "placeholder": "Type a number"}, {"q": "<b>6 × 10</b> is 5 × 10 plus ___.", "choices": ["one more 1", "one more 6", "one more 10"], "a": 2, "why": "6 groups of 10 is 5 groups of 10 and one more group of 10.", "no": ["Add one more <b>group</b> of 10, not 1.", "Each group has 10, so add 10, not 6.", null]}, {"type": "fill", "q": "<b>8 × 6 = ?</b>", "answers": ["48", "forty-eight", "fortyeight"], "why": "Turn it around: 6 × 8. 5 × 8 = 40. One more 8: <b>48</b>.", "no": "8 × 6 is the same as 6 × 8. Start with 5 × 8.", "placeholder": "Type a number"}, {"type": "fill", "q": "How many cherries in all?", "visual": {"kind": "groups", "groups": 6, "each": 7, "emoji": "🍒"}, "answers": ["42", "forty-two", "forty two"], "why": "6 groups of 7. 35 + 7 = <b>42</b>.", "no": "Cover one group. 5 × 7 is 35.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 6 cars. <b>Each</b> car has 4 wheels. How many wheels?", "answers": ["24", "twenty-four", "twenty four"], "why": "6 equal groups of 4: 20 + 4 = <b>24</b>.", "no": "Each car has 4. Use your 5s, then one more group.", "placeholder": "Type a number"}, {"q": "There are 4 plates. <b>Each</b> plate has 9 grapes. How many grapes?", "choices": ["36", "13", "18"], "a": 0, "why": "Double 9 is 18. Double 18 is <b>36</b>.", "no": [null, "13 is 4 + 9. Each plate has 9, so multiply.", "18 is only one double. Double again."]}, {"type": "fill", "q": "Marion has 6 fish. Liz has 8 fish. How many fish in all?", "answers": ["14", "fourteen"], "why": "6 and 8 are not equal groups. Add: <b>6 + 8 = 14</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}, {"q": "Marion wrote <b>6 × 9 = 55</b>. What is wrong?", "choices": ["It should be <b>54</b>.", "It should be <b>46</b>.", "Nothing. She is right."], "a": 0, "why": "5 × 9 = 45. 45 + 9 = <b>54</b>, not 55.", "no": [null, "46 is 45 + 1. Add one more group of 9.", "Check the ones: 5 + 9 = 14. The answer ends in 4."]}], [{"type": "fill", "q": "<b>9 × 6 = ?</b>", "answers": ["54", "fifty-four", "fiftyfour"], "why": "Turn it around: 6 × 9. 5 × 9 = 45. One more 9: <b>54</b>.", "no": "9 × 6 is the same as 6 × 9. Start with 5 × 9.", "placeholder": "Type a number"}, {"q": "Which is the same as <b>6 × 7</b>?", "choices": ["5 × 7 + 1", "6 + 7", "5 × 7 + 7"], "a": 2, "why": "5 groups of 7 plus one more group of 7: 35 + 7 = <b>42</b>.", "no": ["Add one more <b>group</b> of 7, not 1.", "6 + 7 adds. 6 × 7 is 6 groups of 7.", null]}, {"type": "fill", "q": "<b>10 × 6 = ?</b>", "answers": ["60", "sixty"], "why": "Turn it around: 6 × 10. 5 × 10 = 50. One more 10: <b>60</b>.", "no": "10 × 6 is the same as 6 × 10. Start with 5 × 10.", "placeholder": "Type a number"}, {"type": "fill", "q": "How many stars are in this array?", "visual": {"kind": "array", "rows": 6, "cols": 5, "emoji": "⭐"}, "answers": ["30", "thirty"], "why": "6 rows of 5. 25 + 5 = <b>30</b>.", "no": "Cover the last row. 5 rows of 5 is 25.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 6 boxes. <b>Every</b> box has 8 crayons. How many crayons?", "answers": ["48", "forty-eight", "forty eight"], "why": "6 equal groups of 8: 40 + 8 = <b>48</b>.", "no": "Every box has 8. Use your 5s, then one more group.", "placeholder": "Type a number"}, {"q": "There are 4 bags. <b>Every</b> bag has 7 rolls. How many rolls?", "choices": ["11", "28", "14"], "a": 1, "why": "Double 7 is 14. Double 14 is <b>28</b>.", "no": ["11 is 4 + 7. Every bag has 7, so multiply.", null, "14 is only one double. Double again."]}, {"type": "fill", "q": "Ellie has 4 hats. Amy has 6 hats. How many hats in all?", "answers": ["10", "ten"], "why": "4 and 6 are not equal groups. Add: <b>4 + 6 = 10</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}, {"q": "Mia says <b>6 × 3 = 16</b>. What did she do wrong?", "choices": ["She added 1, not one more group of 3.", "She added one more group of 5.", "She is right."], "a": 0, "why": "5 × 3 = 15. She added 1. She needed one more group of 3: <b>15 + 3 = 18</b>.", "no": [null, "One more group of 5 would make 20. That is not 16.", "5 × 3 = 15. One more group of 3 is 18, not 16."]}]]}], "win": "Fives and one more! You know your 6s!", "prev": "bb-bristol-L03", "prevTitle": "Lesson 3"});</script></body></html>
