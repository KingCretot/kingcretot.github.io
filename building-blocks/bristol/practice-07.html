 the 8s trick: double the 4s.", "hint": "32 + 32 = ?"}, {"q": "What is <b>9 × 6</b>?", "choices": ["54", "59", "48"], "a": 0, "why": "10 × 6 = 60. 60 − 6 = <b>54</b>.", "no": [null, "59 is 60 − 1. Take away a whole group of 6.", "48 is 8 × 6. This is 9 groups of 6."]}, {"q": "Owen has <b>7 toy trucks</b>. He gets <b>4 more</b>. How many trucks now?", "choices": ["28", "11", "3"], "a": 1, "why": "Not equal groups. Add: 7 + 4 = <b>11</b>.", "no": ["28 is 7 × 4. He just got 4 more trucks. Add.", null, "3 is 7 − 4. He got more, so the number goes up."]}], [{"type": "fill", "q": "5 × 9 = 45 and 2 × 9 = 18. So <b>7 × 9</b> = ____", "answers": ["63", "sixty-three", "sixty three"], "why": "45 + 18 = <b>63</b>.", "no": "Add the two parts.", "hint": "45 + 18 = ?"}, {"type": "fill", "q": "4 × 7 = ____", "answers": ["28", "twenty-eight", "twenty eight"], "why": "Flip it: 7 × 4. 20 + 8 = <b>28</b>.", "no": "Flip it to 7 × 4. Then 5s part + 2s part.", "hint": "5 × 4 = 20. 2 × 4 = 8."}, {"q": "What is <b>7 × 7</b>?", "choices": ["14", "49", "42"], "a": 1, "why": "5 × 7 = 35. 2 × 7 = 14. 35 + 14 = <b>49</b>.", "no": ["14 is 7 + 7. Multiply.", null, "42 is 6 × 7. You need one more group of 7."]}, {"type": "fill", "q": "A pack has <b>6 juice boxes</b>. How many juice boxes in <b>7 packs</b>?", "answers": ["42", "forty-two", "forty two"], "why": "7 × 6: 30 + 12 = <b>42</b>.", "no": "7 packs, 6 in each. Multiply 7 × 6.", "hint": "5 × 6 = 30. 2 × 6 = 12."}, {"type": "fill", "q": "8 × 7 = ____", "answers": ["56", "fifty-six", "fifty six"], "why": "Flip it: 7 × 8. 40 + 16 = <b>56</b>.", "no": "Flip it to 7 × 8. Then 5s part + 2s part.", "hint": "5, 6, 7, 8!"}, {"q": "Which shows <b>7 × 8</b>?", "choices": ["5 × 8 + 2 × 2", "5 × 8 + 2 × 8", "5 × 8 + 8"], "a": 1, "why": "Split 7 into 5 and 2. Both parts are groups of 8: 40 + 16 = 56.", "no": ["The 2s part is 2 groups of 8: 2 × 8, not 2 × 2.", null, "That is only 6 groups of 8."]}, {"type": "fill", "q": "How many days are in <b>4 weeks</b>?
