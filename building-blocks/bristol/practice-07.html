<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Practice 7</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Sevens: 5 and 2 More</h1><p style="margin:0 0 12px;color:#5b6578">You get 3 tries on each one. Only your first try counts. For 7s: 5s part + 2s part.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bristol", "label": "Lesson 7", "title": "Sevens: 5 and 2 More", "mastery": 85, "color": "#8E44AD", "questions": [{"type": "fill", "q": "5 × 3 = 15 and 2 × 3 = 6. So <b>7 × 3</b> = ____", "answers": ["21"], "why": "15 + 6 = <b>21</b>.", "no": "Add the two parts.", "hint": "15 + 6 = ?"}, {"type": "fill", "q": "7 × 5 = ____", "answers": ["35"], "why": "5 × 5 = 25. 2 × 5 = 10. 25 + 10 = <b>35</b>.", "no": "5s part + 2s part.", "hint": "25 + 10 = ?"}, {"q": "What is <b>7 × 10</b>?", "choices": ["17", "77", "70"], "a": 2, "why": "50 + 20 = <b>70</b>.", "no": ["17 is 7 + 10. Multiply.", "77 is 7 tens and 7 ones. 7 groups of 10 is 70.", null]}, {"type": "fill", "q": "Each spider has <b>8 legs</b>. How many legs on <b>7 spiders</b>?", "answers": ["56"], "why": "7 × 8: 40 + 16 = <b>56</b>.", "no": "7 spiders, 8 legs each. Multiply 7 × 8.", "hint": "5, 6, 7, 8!"}, {"type": "fill", "q": "7 × 6 = ____", "answers": ["42"], "why": "30 + 12 = <b>42</b>.", "no": "5 × 6 and 2 × 6. Then add.", "hint": "30 + 12 = ?"}, {"q": "Which shows <b>7 × 4</b>?", "choices": ["5 × 4 + 2 × 4", "5 × 4 + 2", "5 + 4 + 2 + 4"], "a": 0, "why": "Split 7 into 5 and 2. Both parts are groups of 4: 20 + 8 = 28.", "no": [null, "The 2s part is 2 × 4, not 2.", "Multiply each part. Do not add."]}, {"type": "fill", "q": "How many days are in <b>6 weeks</b>? ____", "answers": ["42"], "why": "6 × 7 = 7 × 6 = <b>42</b>.", "no": "6 weeks, 7 days in each.", "hint": "30 + 12 = ?"}, {"type": "fill", "q": "Amy walks the puppy <b>7 times</b>. Each walk is <b>9 blocks</b>. How many blocks?", "answers": ["63"], "why": "7 × 9: 45 + 18 = <b>63</b>.", "no": "Each walk is 9. Multiply.", "hint": "5 × 9 = 45. 2 × 9 = 18."}, {"type": "fill", "q": "8 × 6 = ____", "answers": ["48"], "why": "4 × 6 = 24. Double 24 is <b>48</b>.", "no": "Use the 8s trick: double the 4s.", "hint": "24 + 24 = ?"}, {"q": "What is <b>9 × 9</b>?", "choices": ["72", "81", "89"], "a": 1, "why": "10 × 9 = 90. 90 − 9 = <b>81</b>.", "no": ["72 is 9 × 8. This is 9 groups of 9.", null, "89 is 90 − 1. Take away a whole group of 9."]}, {"q": "Ellie has <b>7 pens</b>. Liz has <b>8 pens</b>. How many pens in all?", "choices": ["56", "15", "1"], "a": 1, "why": "Not equal groups. Add: 7 + 8 = <b>15</b>.", "no": ["These are two different amounts. Add.", null, "1 is 8 − 7. The question asks how many in all."]}]});</script></body></html>
