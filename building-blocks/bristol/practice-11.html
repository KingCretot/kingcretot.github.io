s": ["54"], "why": "6 × 9. 6 × 10 = 60. Take away one 6: <b>54</b>.", "no": "Each cage is $9, so multiply. Then check your math.", "hint": "10 sixes is 60. Take away one 6.", "placeholder": "Type a number"}, {"type": "fill", "q": "Amy had <b>$34</b>. She spent <b>$19</b>. How much is left?", "answers": ["15"], "why": "She spent money, so subtract. 34 − 19 = 15. Check: 15 + 19 = 34.", "no": "She <b>spent</b> money. Subtract. Then check your math.", "hint": "Regroup a ten: 14 − 9 in the ones.", "placeholder": "Type a number"}, {"type": "fill", "q": "A cat bed is <b>$23</b>. A cat tree is <b>$38</b>. Liz buys both. What does she pay?", "answers": ["61"], "why": "Add: 23 + 38 = 61. 3 + 8 = 11, so carry the ten.", "no": "She buys <b>both</b>, so add. Then check your math.", "hint": "Did you carry the ten? 3 + 8 = 11.", "placeholder": "Type a number"}, {"q": "Which of these stories is a <b>multiply</b> story?", "choices": ["Marion pays $7 for a ball and $4 for a bone.", "There are 8 rabbits. Each one eats 3 carrots.", "A rope is $12. A ball is $5. How much more is the rope?"], "a": 1, "why": "Each rabbit eats 3. Equal groups: 8 × 3 = 24.", "no": ["Two different prices. That is add.", null, "<b>How much more</b> means compare. That is subtract."]}, {"q": "Collars are <b>$7 each</b>. Amy buys <b>7</b>. What is the total?", "choices": ["$14", "$42", "$49"], "a": 2, "why": "7 × 7. 7 × 5 = 35 and 7 × 2 = 14. 35 + 14 = <b>49</b>.", "no": ["$14 is 7 + 7. That is only 2 collars.", "$42 is 6 × 7. Amy buys 7 collars.", null]}, {"q": "Which list shows only <b>multiples of 5</b>?", "choices": ["15, 25, 35", "12, 15, 20", "5, 10, 14"], "a": 0, "why": "Skip count by 5s and you land on 15, 25 and 35.", "no": [null, "12 is not a multiple of 5.", "14 is not a multiple of 5."]}, {"type": "fill", "q": "Treats cost <b>$4 a bag</b>. Liz pays <b>$24</b>. How many bags did she buy?", "answers": ["6"], "why": "4 × 6 = 24. Skip count by 4: 4, 8, 12, 16, 20, 24. 6 jumps.", "no": "Skip count by 4s
