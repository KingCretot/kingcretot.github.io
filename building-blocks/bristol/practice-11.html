<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Practice 11</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Detective Challenge</h1><p style="margin:0 0 12px;color:#5b6578">Two tries on each one. Use your detective checklist on every story.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bristol", "label": "Lesson 11", "title": "Detective Challenge", "mastery": 85, "color": "#E67E22", "questions": [{"q": "Tickets to the pet show cost <b>$10 each</b>. The family buys <b>5</b>. What is the total?", "choices": ["$15", "$50", "$60"], "a": 1, "why": "5 × 10 = 50.", "no": ["$15 is 10 + 5. Each ticket is $10, so multiply.", null, "$60 would be 6 tickets."]}, {"q": "Kitten toys cost <b>$5 each</b>. Ellie has <b>$30</b>. How many can she buy?", "choices": ["6", "5", "30"], "a": 0, "why": "5, 10, 15, 20, 25, 30. That is 6 jumps.", "no": [null, "5 toys cost $25. Keep counting to 30.", "$30 is her money. Count the jumps of 5."]}, {"q": "Bird cages cost <b>$9 each</b>. The shop sells <b>6</b>. What is the total?", "choices": ["$15", "$56", "$54"], "a": 2, "why": "6 × 9. 6 × 10 = 60. Take away one 6: <b>54</b>.", "no": ["$15 is 9 + 6. Each cage is $9, so multiply.", "$56 is 7 × 8. Try 10 sixes, take away one 6.", null]}, {"q": "Amy had <b>$34</b>. She spent <b>$19</b>. How much is left?", "choices": ["$15", "$25", "$53"], "a": 0, "why": "She spent money, so subtract. 34 − 19 = 15. Check: 15 + 19 = 34.", "no": [null, "You may have done 9 − 4 in the ones. Regroup a ten: 14 − 9 = 5.", "$53 is 34 + 19. She <b>spent</b> money, so subtract."]}, {"q": "A cat bed is <b>$23</b>. A cat tree is <b>$38</b>. Liz buys both. What does she pay?", "choices": ["$51", "$61", "$15"], "a": 1, "why": "Add: 23 + 38 = 61. 3 + 8 = 11, so carry the ten.", "no": ["Did you carry the ten? 3 + 8 = 11.", null, "$15 is 38 − 23. She buys <b>both</b>, so add."]}, {"q": "Which story needs <b>multiply</b>?", "choices": ["Marion pays $7 for a ball and $4 for a bone.", "There are 8 rabbits. Each one eats 3 carrots.", "A rope is $12. A ball is $5. How much more is the rope?"], "a": 1, "why": "Each rabbit eats 3. Equal groups: 8 × 3 = 24.", "no": ["Two different prices. That is add.", null, "<b>How much more</b> means compare. That is subtract."]}, {"q": "Collars are <b>$7 each</b>. Amy buys <b>7</b>. What is the total?", "choices": ["$14", "$42", "$49"], "a": 2, "why": "7 × 7. 7 × 5 = 35 and 7 × 2 = 14. 35 + 14 = <b>49</b>.", "no": ["$14 is 7 + 7. That is only 2 collars.", "$42 is 6 × 7. Amy buys 7 collars.", null]}, {"q": "Which list shows only <b>multiples of 5</b>?", "choices": ["15, 25, 35", "12, 15, 20", "5, 10, 14"], "a": 0, "why": "Skip count by 5s and you land on 15, 25 and 35.", "no": [null, "12 is not a multiple of 5.", "14 is not a multiple of 5."]}, {"q": "Treats cost <b>$4 a bag</b>. Liz pays <b>$24</b>. How many bags did she buy?", "choices": ["20", "6", "7"], "a": 1, "why": "4 × 6 = 24. Skip count by 4: 4, 8, 12, 16, 20, 24. 6 jumps.", "no": ["20 is 24 − 4. The question asks <b>how many bags</b>.", null, "7 bags cost 4 × 7 = $28."]}, {"q": "Ellie says: <i>5 brushes at $8 each is $13.</i> What is right?", "choices": ["$13 is right.", "$40", "$45"], "a": 1, "why": "Every brush is $8, so multiply. 5 × 8 = 40.", "no": ["Ellie added 5 + 8. Same price for each brush means multiply.", null, "$45 is 5 × 9. The price is $8."]}, {"q": "Amy buys <b>4 bags at $6 each</b>. Marion buys <b>3 bags at $9 each</b>. Who spends more?", "choices": ["Amy", "They spend the same.", "Marion"], "a": 2, "why": "Amy: 4 × 6 = 24. Marion: 3 × 9 = 27. Marion spends more.", "no": ["Amy spends 4 × 6 = $24. Find Marion's total: 3 × 9.", "Find both totals. Are $24 and $27 the same?", null]}, {"q": "Leashes are <b>$10 each</b>. Ellie buys <b>3</b>. She pays <b>$30</b>. Which numbers are the <b>factors</b>?", "choices": ["10 and 30", "30 and 3", "10 and 3"], "a": 2, "why": "You multiply the price by how many: 10 × 3 = 30. The factors are <b>10 and 3</b>.", "no": ["30 is the <b>product</b>, the total she pays.", "30 is the product. Which two numbers do you multiply?", null]}]});</script></body></html>
