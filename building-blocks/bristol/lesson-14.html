<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 14: Contraction Families</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script>window.KCE_READALOUD=true</script><script src="clips.js"></script><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L14", "label": "Lesson 14", "title": "Contraction Families", "goal": "I can make contractions like I'm, they're, she's, I'll and we've.", "date": "2026-12-08", "mastery": 85, "color": "#E84393", "slides": [{"type": "hello", "title": "Contraction Families: On Your Own", "text": "You met the contraction families with Jonathan. Now practice <b>on your own</b>! ✏️", "visual": {"kind": "emoji", "text": "👨‍👩‍👧⭐"}}, {"type": "learn", "kick": "Remember", "title": "The families", "text": "The apostrophe takes the place of the missing letters.", "steps": [{"text": "<b>am:</b> I'm · <b>are:</b> you're, we're, they're"}, {"text": "<b>is:</b> he's, she's, it's"}, {"text": "<b>will:</b> I'll, you'll, we'll · <b>have:</b> I've, we've, they've"}], "tip": "Look after the apostrophe: s → is, re → are, ll → will, ve → have."}, {"type": "talk", "kick": "Say it", "title": "Say it out loud", "text": "Say these out loud. You can tell your mom!", "prompts": ["Say <b>we are</b>, <b>I will</b> and <b>they have</b> as contractions.", "Which two letters drop out of <b>will</b>?", "Tell your mom a sentence with <b>she's</b>."], "starters": ["we're, …", "The … and … drop out.", "She's …"]}, {"type": "tap", "kick": "Your turn", "title": "Make the contraction", "text": "Type the contraction. Put the apostrophe in the right spot.", "items": [{"type": "fill", "q": "____ playing tag. <i>(They are)</i>", "answers": ["They're", "They’re"], "why": "They are → <b>They're</b>. The apostrophe takes the place of the <b>a</b>.", "no": "Push <b>They are</b> together. Take out the <b>a</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "____ feed the fish. <i>(I will)</i>", "answers": ["I'll", "I’ll"], "why": "I will → <b>I'll</b>. The apostrophe takes the place of the <b>w</b> and <b>i</b>.", "no": "Push <b>I will</b> together. Take out the <b>w</b> and <b>i</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "____ a good painter. <i>(He is)</i>", "answers": ["He's", "He’s"], "why": "He is → <b>He's</b>. The apostrophe takes the place of the <b>i</b>.", "no": "Push <b>He is</b> together. Take out the <b>i</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}]}, {"type": "tap", "kick": "Take it apart", "title": "Two words again", "text": "Type the missing word.", "items": [{"type": "fill", "q": "We'll bake a cake. <br><b>we'll</b> = we ____", "answers": ["will"], "why": "we'll is short for <b>we will</b>.", "no": "Look after the apostrophe: ll. Which word ends with ll?", "placeholder": "Type the word"}, {"type": "fill", "q": "You're funny. <br><b>you're</b> = you ____", "answers": ["are"], "why": "you're is short for <b>you are</b>.", "no": "Look after the apostrophe: re. Which word ends with re?", "placeholder": "Type the word"}, {"type": "fill", "q": "We've got a puppy. <br><b>we've</b> = we ____", "answers": ["have"], "why": "we've is short for <b>we have</b>.", "no": "Look after the apostrophe: ve. Which word ends with ve?", "placeholder": "Type the word"}]}, {"type": "sort", "kick": "Sort it", "title": "Which word is hiding?", "text": "Tap a word. Then tap the box with the word that made it.", "buckets": ["am or are", "is", "have"], "items": [{"text": "I've", "b": 2, "why": "I've = I <b>have</b>.", "hint": "ve is after the apostrophe."}, {"text": "I'm", "b": 0, "why": "I'm = I <b>am</b>.", "hint": "Only an m is after the apostrophe."}, {"text": "she's", "b": 1, "why": "she's = she <b>is</b>.", "hint": "Only an s is after the apostrophe."}, {"text": "it's", "b": 1, "why": "it's = it <b>is</b>.", "hint": "Only an s is after the apostrophe."}, {"text": "they've", "b": 2, "why": "they've = they <b>have</b>.", "hint": "ve is after the apostrophe."}, {"text": "we're", "b": 0, "why": "we're = we <b>are</b>.", "hint": "re is after the apostrophe."}], "done": "You found every hiding word!"}, {"type": "tap", "kick": "Fix it", "title": "Right spot", "items": [{"q": "Ellie wrote <b>is'nt</b>. What is the right way?", "choices": ["isnt'", "isn't", "is'nt is right."], "a": 1, "why": "The o was between n and t: <b>isn't</b>.", "no": ["The apostrophe does not go at the end.", null, "The o dropped out between n and t. Put the apostrophe there."]}, {"q": "Liz wrote <b>theyr'e</b>. What is the right way?", "choices": ["they're", "theyre", "theyr'e is right."], "a": 0, "why": "The a drops out right after they: <b>they're</b>.", "no": [null, "A contraction needs an apostrophe.", "The a was right after they. The apostrophe goes there."]}]}, {"type": "tap", "kick": "Make sense", "title": "Pick the right one", "items": [{"q": "Mom is in the kitchen. ____ making soup.", "choices": ["She's", "He's", "She'll"], "a": 0, "why": "Mom is a she. She is → <b>She's</b> making soup.", "no": [null, "He's is for a boy or a man.", "She'll means she will. <i>She will making soup</i> does not make sense."]}, {"q": "My brothers are outside. ____ playing ball.", "choices": ["We're", "They've", "They're"], "a": 2, "why": "They are → <b>They're</b> playing ball.", "no": ["We're means we are. The story is about my brothers, so use they.", "They've means they have. <i>They have playing</i> does not make sense.", null]}]}, {"type": "recall", "kick": "Remember?", "title": "Math check", "items": [{"type": "fill", "q": "8 × ____ = 56", "answers": ["7"], "why": "8 × 7 = 56. 4 × 7 = 28. Double 28 is 56.", "no": "What times 8 makes 56?", "hint": "Remember 5, 6, 7, 8: 56 = 7 × 8.", "placeholder": "Type a number"}, {"type": "fill", "q": "Ellie had <b>52</b> cards. She gave away <b>25</b>. How many are left?", "answers": ["27"], "why": "She gave some away, so subtract. 52 − 25 = <b>27</b>. Check: 27 + 25 = 52.", "no": "Cards went away. Subtract. Then add back to check.", "hint": "Regroup a ten: 12 − 5 in the ones.", "placeholder": "Type a number"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "____ going to the zoo. <i>(We are)</i>", "answers": ["We're", "We’re"], "why": "We are → <b>We're</b>. The apostrophe takes the place of the <b>a</b>.", "no": "Push <b>We are</b> together. Take out the <b>a</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "____ help you clean up. <i>(I will)</i>", "answers": ["I'll", "I’ll"], "why": "I will → <b>I'll</b>. The apostrophe takes the place of the <b>w</b> and <b>i</b>.", "no": "Push <b>I will</b> together. Take out the <b>w</b> and <b>i</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "____ a fast runner. <i>(She is)</i>", "answers": ["She's", "She’s"], "why": "She is → <b>She's</b>. The apostrophe takes the place of the <b>i</b>.", "no": "Push <b>She is</b> together. Take out the <b>i</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "They've seen the movie. <br><b>they've</b> = they ____", "answers": ["have"], "why": "they've is short for <b>they have</b>.", "no": "Look after the apostrophe: ve.", "placeholder": "Type the word"}, {"type": "fill", "q": "What two words make <b>I'm</b>?", "answers": ["I am"], "why": "I'm = <b>I am</b>.", "no": "Only an m is after the apostrophe. Which word ends with m?", "placeholder": "Type two words"}, {"q": "Tap the word with the apostrophe in the right spot.", "choices": ["they'are", "the'yre", "they're"], "a": 2, "why": "The a drops out right after they: <b>they're</b>.", "no": ["The a in are drops out. Only re stays.", "they stays whole. The apostrophe goes after they.", null]}, {"q": "Mom says, \"____ proud of you!\" <i>(I am)</i>", "choices": ["I'm", "I'll", "I've"], "a": 0, "why": "I am → <b>I'm</b>.", "no": [null, "I'll means I will.", "I've means I have."]}, {"q": "Which word means <b>we have</b>?", "choices": ["we're", "we've", "we'll"], "a": 1, "why": "we have → <b>we've</b>.", "no": ["we're means we are.", null, "we'll means we will."]}], [{"type": "fill", "q": "____ coming to my party. <i>(They are)</i>", "answers": ["They're", "They’re"], "why": "They are → <b>They're</b>. The apostrophe takes the place of the <b>a</b>.", "no": "Push <b>They are</b> together. Take out the <b>a</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "____ been to the beach. <i>(We have)</i>", "answers": ["We've", "We’ve"], "why": "We have → <b>We've</b>. The apostrophe takes the place of the <b>h</b> and <b>a</b>.", "no": "Push <b>We have</b> together. Take out the <b>h</b> and <b>a</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "____ raining outside. <i>(It is)</i>", "answers": ["It's", "It’s"], "why": "It is → <b>It's</b>. The apostrophe takes the place of the <b>i</b>.", "no": "Push <b>It is</b> together. Take out the <b>i</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "You'll love this book. <br><b>you'll</b> = you ____", "answers": ["will"], "why": "you'll is short for <b>you will</b>.", "no": "Look after the apostrophe: ll.", "placeholder": "Type the word"}, {"type": "fill", "q": "What two words make <b>he's</b>?", "answers": ["he is"], "why": "he's = <b>he is</b>.", "no": "Only an s is after the apostrophe. Which word ends with s?", "placeholder": "Type two words"}, {"q": "Tap the right way to write <b>I will</b>.", "choices": ["Ill", "I'll", "Il'l"], "a": 1, "why": "The w and i drop out: <b>I'll</b>.", "no": ["Ill with no apostrophe means sick. A contraction needs an apostrophe.", null, "Two l's stay together after the apostrophe: 'll."]}, {"q": "\"____ my sister,\" said Liz. <i>(She is)</i>", "choices": ["He's", "She'll", "She's"], "a": 2, "why": "She is → <b>She's</b>.", "no": ["He's means he is.", "She'll means she will.", null]}, {"q": "____ late! Hurry up! <i>(You are)</i>", "choices": ["You're", "Your", "You'll"], "a": 0, "why": "You are → <b>You're</b>.", "no": [null, "Your shows something belongs to you, like <i>your coat</i>.", "You'll means you will."]}], [{"type": "fill", "q": "____ happy to see you. <i>(I am)</i>", "answers": ["I'm", "I’m"], "why": "I am → <b>I'm</b>. The apostrophe takes the place of the <b>a</b>.", "no": "Push <b>I am</b> together. Take out the <b>a</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "____ find the lost cat. <i>(We will)</i>", "answers": ["We'll", "We’ll"], "why": "We will → <b>We'll</b>. The apostrophe takes the place of the <b>w</b> and <b>i</b>.", "no": "Push <b>We will</b> together. Take out the <b>w</b> and <b>i</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "____ the tallest boy in my class. <i>(He is)</i>", "answers": ["He's", "He’s"], "why": "He is → <b>He's</b>. The apostrophe takes the place of the <b>i</b>.", "no": "Push <b>He is</b> together. Take out the <b>i</b>. Put in an apostrophe.", "placeholder": "Type the contraction"}, {"type": "fill", "q": "I've read this book. <br><b>I've</b> = I ____", "answers": ["have"], "why": "I've is short for <b>I have</b>.", "no": "Look after the apostrophe: ve.", "placeholder": "Type the word"}, {"type": "fill", "q": "What two words make <b>you're</b>?", "answers": ["you are"], "why": "you're = <b>you are</b>.", "no": "re is after the apostrophe. Which word ends with re?", "placeholder": "Type two words"}, {"q": "Find the word that means <b>we are</b>.", "choices": ["we're", "were", "we'r"], "a": 0, "why": "The a drops out: <b>we're</b>.", "no": [null, "were is a different word, like <i>we were at home</i>. It has no apostrophe.", "Only the a drops out. The e stays: we're."]}, {"q": "The dogs are hungry. ____ barking. <i>(They are)</i>", "choices": ["They've", "They're", "They'll"], "a": 1, "why": "They are → <b>They're</b>.", "no": ["They've means they have.", null, "They'll means they will."]}, {"q": "Which word means <b>she will</b>?", "choices": ["she's", "we'll", "she'll"], "a": 2, "why": "she will → <b>she'll</b>.", "no": ["she's means she is.", "we'll means we will.", null]}]]}], "win": "Great job! You know all the contraction families!", "prev": "bb-bristol-L13", "prevTitle": "Lesson 13"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b
