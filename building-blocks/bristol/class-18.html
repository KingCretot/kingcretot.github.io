<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 18: Spelling Team Champion</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script>window.KCE_READALOUD=true</script><script>window.KCE_RA_NOQ=true</script><script src="clips.js"></script><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L18", "label": "Lesson 18", "title": "Spelling Team Champion", "goal": "I can spell words with ea and oo, and pick the right team.", "date": "2026-12-17", "mastery": 85, "color": "#00A8A8", "slides": [{"type": "hello", "title": "Spelling Team Champion", "text": "Today you <b>prove</b> it! 🏆<br>The ea team and the oo team, all mixed up.", "visual": {"kind": "emoji", "text": "🏆🏖️🌙📖"}, "notes": {"do": "Keep Tuesday's oo cards. Write these on 8 more index cards: beach, read, dream, clean, school, food, book, look. Whiteboard ready.", "say": "\"This is our last lesson before the winter break. Today you show me you can spell with both teams.\"", "ask": "\"What does ea usually say? What two sounds can oo say?\"", "listen": "Long e; the moon sound and the book sound."}}, {"type": "talk", "kick": "Book Talk", "title": "Teams in my book", "text": "Think about the book you are reading.", "prompts": ["What happened in your book this week?", "Find one <b>ea</b> word and one <b>oo</b> word. Read them.", "What do you hope happens next?"], "starters": ["This week, …", "My ea word is … My oo word is …", "I hope …"], "notes": {"do": "About 6 minutes.", "ask": "\"Long e or short e? Moon sound or book sound?\"", "listen": "She names the right sound for each word and gives a hope for what happens next with a reason."}}, {"type": "recall", "kick": "Remember?", "title": "Tuesday's oo team", "items": [{"q": "Read <b>hook</b>. Which word has the same oo sound?", "choices": ["moon", "foot", "pool"], "a": 1, "why": "<b>hook</b> and <b>foot</b> have the book sound.", "no": ["moon has the moon sound.", null, "pool has the moon sound."]}, {"type": "fill", "q": "🛏️ I clean my ____ on Saturday. <i>(r _ _ m)</i>", "answers": ["room"], "why": "<b>room</b>: the <b>oo</b> team.", "no": "Say the word slowly. Which team makes the middle sound: ea or oo?", "hint": "Fill in the frame r _ _ m.", "placeholder": "Type the word"}], "notes": {"do": "Check Tuesday's After-Class score and Wednesday's packets first.", "listen": "foot; r-o-o-m."}}, {"type": "learn", "kick": "Remember", "title": "Two teams", "text": "Two vowel teams. Three sounds.", "steps": [{"text": "<b>ea</b> → long e: eat, beach, team. A few say short e: head, bread."}, {"text": "<b>oo</b> → the moon sound: moon, food, school."}, {"text": "<b>oo</b> → the book sound: book, look, good."}], "tip": "Short e, like bed, or short o, like hot? Just <b>one</b> letter.", "notes": {"do": "She reads each row, then covers the slide and says one word for each sound.", "listen": "One word for each of the three sounds, from memory."}}, {"type": "learn", "kick": "Learn", "title": "Which team?", "text": "Listen to the <b>middle</b> sound. Then pick.", "steps": [{"text": "🦷 t__th: moon sound → <b>oo</b> → tooth"}, {"text": "🍑 p__ch: long e → <b>ea</b> → peach"}, {"text": "🛏️ b__d: short e → just <b>e</b> → bed"}, {"text": "🔥 h__t: short o → just <b>o</b> → hot"}], "tip": "Say it slowly. Stretch the middle sound.", "notes": {"do": "She says each word, stretches the middle sound, and says the team before you reveal it.", "listen": "oo, ea, e, o."}}, {"type": "tap", "kick": "Try it", "title": "Pick the team", "items": [{"type": "fill", "q": "🧹 br__m <i>(you sweep with it)</i> <br>What goes in the blank: <b>ea</b>, <b>oo</b>, <b>e</b> or <b>o</b>?", "answers": ["oo"], "why": "<b>broom</b> has an oo sound. That is the <b>oo</b> team.", "no": "Say the word slowly. Long e → ea. Moon or book sound → oo. Short e or short o → one letter.", "placeholder": "Type ea, oo, e or o"}, {"type": "fill", "q": "🍂 l__f <i>(it falls in the fall)</i> <br>What goes in the blank: <b>ea</b>, <b>oo</b>, <b>e</b> or <b>o</b>?", "answers": ["ea"], "why": "<b>leaf</b> has a long e sound. That is the <b>ea</b> team.", "no": "Say the word slowly. Long e → ea. Moon or book sound → oo. Short e or short o → one letter.", "placeholder": "Type ea, oo, e or o"}, {"type": "fill", "q": "🐱 p__t <i>(an animal that lives with you)</i> <br>What goes in the blank: <b>ea</b>, <b>oo</b>, <b>e</b> or <b>o</b>?", "answers": ["e"], "why": "<b>pet</b> has a short e sound, like bed. That is just <b>e</b>.", "no": "Say the word slowly. Long e → ea. Moon or book sound → oo. Short e or short o → one letter.", "placeholder": "Type ea, oo, e or o"}, {"type": "fill", "q": "🏃 j__g <i>(run slowly)</i> <br>What goes in the blank: <b>ea</b>, <b>oo</b>, <b>e</b> or <b>o</b>?", "answers": ["o"], "why": "<b>jog</b> has a short o sound, like hot. That is just <b>o</b>.", "no": "Say the word slowly. Long e → ea. Moon or book sound → oo. Short e or short o → one letter.", "placeholder": "Type ea, oo, e or o"}], "notes": {"do": "She types on your laptop. She says the middle sound before she types.", "listen": "oo, ea, e, o."}}, {"type": "sort", "kick": "Sort it", "title": "Three sounds", "text": "Read each word out loud. Tap it. Then tap the box.", "buckets": ["ea: long e", "oo: moon sound", "oo: book sound"], "items": [{"text": "team", "b": 0, "why": "team: long e.", "hint": "Say it: team. Long e?"}, {"text": "zoo", "b": 1, "why": "zoo: the moon sound.", "hint": "Say it: zoo. Round lips, like moon?"}, {"text": "cook", "b": 2, "why": "cook: the book sound.", "hint": "Say it: cook. Does it rhyme with book?"}, {"text": "peach", "b": 0, "why": "peach: long e.", "hint": "Say it: peach. Long e?"}, {"text": "food", "b": 1, "why": "food: the moon sound.", "hint": "Say it: food. Round lips, like moon?"}, {"text": "good", "b": 2, "why": "good: the book sound.", "hint": "Say it: good. Short and quick, like book?"}, {"text": "clean", "b": 0, "why": "clean: long e.", "hint": "Say it: clean. Long e?"}, {"text": "spoon", "b": 1, "why": "spoon: the moon sound.", "hint": "Say it: spoon. Does it rhyme with moon?"}, {"text": "foot", "b": 2, "why": "foot: the book sound.", "hint": "Say it: foot. Short and quick, like book?"}], "done": "Three sounds, two teams!", "notes": {"do": "She reads each word out loud before she taps.", "listen": "ea: team, peach, clean. Moon: zoo, food, spoon. Book: cook, good, foot."}}, {"type": "talk", "kick": "Hands on", "title": "Spelling relay", "text": "Your teacher reads a word. You write it!", "prompts": ["Listen to the word and the sentence.", "Write the word on the whiteboard.", "Flip the card. Did you spell it right?"], "starters": ["I hear …", "I need the … team.", "I spelled it …"], "notes": {"do": "About 7 minutes. Shuffle the 8 new cards (beach, read, dream, clean, school, food, book, look). Read each word, use it in a sentence, read it again. She writes it on the whiteboard, then flips the card to check. Put any misses in a pile and do them again at the end.", "say": "\"This is like the spelling test Mom will give you at home.\"", "listen": "All 8 spelled right. For school, check s-c-h. For read, check ea (not red)."}}, {"type": "tap", "kick": "Try it", "title": "Which spelling is right?", "items": [{"q": "🌙 What do you see in the night sky?", "choices": ["mean", "moon", "mon"], "a": 1, "why": "<b>moon</b>: the moon sound, spelled oo.", "no": ["mean has the ea team, so it says long e, like clean. The picture is the moon.", null, "mon has one o. The moon sound needs the oo team."]}, {"q": "🍑 Which spelling names this fruit?", "choices": ["peach", "pooch", "pech"], "a": 0, "why": "<b>peach</b>: long e, spelled ea.", "no": [null, "pooch is a word for a dog! The fruit has a long e: peach.", "pech would say short e. Peach has a long e."]}, {"q": "⚽ We play on the same ____.", "choices": ["toom", "tem", "team"], "a": 2, "why": "<b>team</b>: long e, spelled ea.", "no": ["toom would have the moon sound. Team has a long e.", "tem would say short e. Team has a long e.", null]}], "notes": {"do": "She reads each choice out loud before she picks.", "listen": "moon, peach, team. The wrong choices mix up the two teams."}}, {"type": "learn", "kick": "Read it", "title": "Read and find the teams", "text": "<i>Liz and Amy read a good book at the beach.</i>", "steps": [{"text": "<b>read</b>: ea, long e."}, {"text": "<b>good</b> and <b>book</b>: oo, the book sound."}, {"text": "<b>beach</b>: ea, long e."}], "tip": "Reading tip: ea → try long e first. oo → try both sounds.", "notes": {"do": "She reads the sentence out loud, then names each team word before you reveal it.", "listen": "read, good, book, beach, each with the right sound."}}, {"type": "tap", "kick": "Fix it", "title": "Fix the word", "items": [{"type": "fill", "q": "<i>We ate fod at noon.</i> <br>The word <b>fod</b> is spelled wrong. How do you spell it?", "answers": ["food"], "why": "<b>food</b>: the <b>oo</b> team.", "no": "Say the word. Which team do you hear: ea (long e) or oo (moon or book)?", "placeholder": "Type the word"}, {"type": "fill", "q": "<i>I like to red at night.</i> <br>The word <b>red</b> is spelled wrong. How do you spell it?", "answers": ["read"], "why": "<b>read</b>: the <b>ea</b> team.", "no": "Say the word. Which team do you hear: ea (long e) or oo (moon or book)?", "placeholder": "Type the word"}, {"type": "fill", "q": "<i>Wipe your feet so the floor stays clen.</i> <br>The word <b>clen</b> is spelled wrong. How do you spell it?", "answers": ["clean"], "why": "<b>clean</b>: the <b>ea</b> team.", "no": "Say the word. Which team do you hear: ea (long e) or oo (moon or book)?", "placeholder": "Type the word"}], "notes": {"do": "She writes the fixed word on the whiteboard, then types it.", "listen": "food, read, clean."}}, {"type": "tap", "kick": "Spell it", "title": "Spell the word", "items": [{"type": "fill", "q": "💭 Last night I had a ____ about a dragon. <i>(dr _ _ m)</i>", "answers": ["dream"], "why": "<b>dream</b>: the <b>ea</b> team.", "no": "Say the word slowly. Which team makes the middle sound: ea or oo?", "hint": "Fill in the frame dr _ _ m.", "placeholder": "Type the word"}, {"type": "fill", "q": "🏫 The bus takes me to ____. <i>(sch _ _ l)</i>", "answers": ["school"], "why": "<b>school</b>: the <b>oo</b> team.", "no": "Say the word slowly. Which team makes the middle sound: ea or oo?", "hint": "Fill in the frame sch _ _ l.", "placeholder": "Type the word"}, {"type": "fill", "q": "🍳 Can you help me ____ dinner? <i>(c _ _ k)</i>", "answers": ["cook"], "why": "<b>cook</b>: the <b>oo</b> team.", "no": "Say the word slowly. Which team makes the middle sound: ea or oo?", "hint": "Fill in the frame c _ _ k.", "placeholder": "Type the word"}], "notes": {"do": "Whiteboard first, then typed.", "listen": "dream, school, cook."}}, {"type": "tap", "kick": "Listen", "title": "Which sound?", "items": [{"type": "fill", "q": "Read the word <b>feather</b>. Does the ea say long e or short e? <br>Type <b>long</b> or <b>short</b>.", "answers": ["short", "short e"], "why": "<b>feather</b>: the ea says short e. One of the few!", "no": "Try long e first: feether? That is not the word. Try short e.", "placeholder": "long or short"}, {"type": "fill", "q": "Read the word <b>noon</b>. Does the oo sound like moon or like book? <br>Type <b>moon</b> or <b>book</b>.", "answers": ["moon"], "why": "<b>noon</b> has the moon sound.", "no": "Say moon, then noon. Say book, then noon. Which one matches?", "placeholder": "moon or book"}], "notes": {"do": "She reads each word out loud first.", "listen": "short; moon."}}, {"type": "talk", "kick": "Write it", "title": "Write your own", "text": "Write on the whiteboard.", "prompts": ["Write a sentence with an <b>ea</b> word.", "Write a sentence with a <b>moon</b> word and a <b>book</b> word.", "Read your sentences out loud."], "starters": ["I eat …", "I look at the moon …", "My sentence says …"], "notes": {"do": "About 4 minutes. Check spelling, the capital letter and the period.", "listen": "Each team word is spelled right."}}, {"type": "tap", "kick": "Quick check", "title": "Show me", "items": [{"type": "fill", "q": "🥄 Pass me a ____, please. <i>(sp _ _ n)</i>", "answers": ["spoon"], "why": "<b>spoon</b>: the <b>oo</b> team.", "no": "Say the word slowly. Which team makes the middle sound: ea or oo?", "hint": "Fill in the frame sp _ _ n.", "placeholder": "Type the word"}, {"q": "Which word has the <b>long e</b> sound?", "choices": ["bread", "beach", "book"], "a": 1, "why": "<b>beach</b> has a long e.", "no": ["bread is one of the few ea words that say short e.", null, "book has the book sound."]}], "notes": {"do": "On her own, no help.", "listen": "s-p-o-o-n; beach."}}, {"type": "talk", "kick": "Wrap-up", "title": "Your break plan", "text": "Winter break is here! ❄️", "prompts": ["What is the <b>first</b> thing you will do after class?", "You are the <b>Reporter</b> and <b>Pet Columnist</b> for the Holiday Gazett
