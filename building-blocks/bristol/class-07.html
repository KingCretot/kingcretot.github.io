<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 7: Sevens: 5 and 2 More</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L07", "label": "Lesson 7", "title": "Sevens: 5 and 2 More", "goal": "I can split 7 into 5 and 2 to find my 7s facts.", "date": "2026-11-03", "mastery": 85, "color": "#8E44AD", "slides": [{"type": "hello", "title": "Sevens: 5 and 2 More", "text": "7 is a tricky number. But <b>7 = 5 + 2</b>. You know your 5s. You know your 2s. So you can do <b>7s</b>! 💪", "visual": {"kind": "emoji", "text": "5️⃣ ➕ 2️⃣ = 7️⃣"}, "notes": {"do": "Set out: beans (two colors if you have them), a ruler or paper strip, a calendar page, whiteboard, the 7s index cards. Collect last night's Show What You Know score from the course page.", "say": "Yesterday you learned 8s and 9s. Today we beat the trickiest number: 7.", "ask": "Tell me yesterday's two tricks.", "listen": "\"8s: double the 4s. 9s: 10s take away one group.\" If she mixes them, say both again with 8 × 6 and 9 × 6 before you go on."}}, {"type": "talk", "kick": "Book Talk", "title": "Tell it in order", "text": "Think about <i>Amy and the Missing Puppy</i>. Tell what happened <b>in order</b>.", "prompts": ["What happened <b>first</b> in the part you read?", "What happened <b>next</b>?", "What do you think will happen <b>at the end</b>? Why?"], "starters": ["First, …", "Next, …", "Then, …", "I think at the end …"], "notes": {"do": "Book open. Let her look back at the pages she read.", "say": "Tell me what happened, in order. Use First, Next, Then.", "ask": "What happened before that? What happened after?", "listen": "Events in the right order with time words. If she jumps around, ask: what happened before that? Then let her try again."}}, {"type": "recall", "kick": "Remember?", "title": "8s, 9s and 6s", "text": "Use your tricks from last lesson and last week.", "items": [{"q": "What is <b>8 × 7</b>?", "choices": ["54", "56", "35"], "a": 1, "why": "4 × 7 = 28. Double 28 is <b>56</b>.", "no": ["Careful! 4 × 7 = 28. Double 28: 40 + 16 = 56.", null, "35 is 5 × 7. Find 4 × 7 and double it."]}, {"q": "What is <b>9 × 6</b>?", "choices": ["54", "51", "59"], "a": 0, "why": "10 × 6 = 60. Take away one group of 6: <b>54</b>.", "no": [null, "51 is 60 − 9. Take away one group of <b>6</b>.", "59 is 60 − 1. Take away a whole group of 6."]}, {"q": "What is <b>6 × 6</b>?", "choices": ["30", "42", "36"], "a": 2, "why": "5 × 6 = 30. One more group of 6: <b>36</b>.", "no": ["30 is 5 × 6. Add one more group of 6.", "42 is 6 × 7.", null]}], "notes": {"say": "Name the trick, then tap.", "ask": "Which trick is this one: double the 4s, 10s take away a group, or 5s plus a group?", "listen": "8 × 7: double 28 is 56. 9 × 6: 60 − 6 = 54. 6 × 6: 30 + 6 = 36. If 7 × 8 = 54 shows up, fix it now with the double."}}, {"type": "learn", "kick": "Learn", "title": "Split the 7", "text": "Here are <b>7 rows of 4</b>. Let's split them into <b>5 rows</b> and <b>2 rows</b>.", "steps": [{"text": "<b>Step 1.</b> 7 rows of 4. That is <b>7 × 4</b>.", "visual": {"kind": "array", "rows": 7, "cols": 4, "emoji": "🟦"}}, {"text": "<b>Step 2.</b> The top 5 rows: <b>5 × 4 = 20</b>.", "visual": {"kind": "array", "rows": 5, "cols": 4, "emoji": "🟦"}}, {"text": "<b>Step 3.</b> The last 2 rows: <b>2 × 4 = 8</b>.", "visual": {"kind": "array", "rows": 2, "cols": 4, "emoji": "🟨"}}, {"text": "<b>Step 4.</b> Add the parts: <b>20 + 8 = 28</b>. So <b>7 × 4 = 28</b>.", "visual": {"kind": "bigtext", "text": "7 × 4 = 28"}}], "tip": "5 rows + 2 rows = 7 rows. You did not lose any!", "notes": {"do": "Before you click: she builds 7 rows of 4 beans on the table. Lay the ruler under row 5. Then click through the steps as she counts.", "say": "7 rows is 5 rows and 2 rows. You know 5s. You know 2s.", "ask": "How many in the top part? In the bottom part? Together?", "listen": "\"20 and 8, so 28.\" Ask: did we lose any beans when we put the ruler down? (No: 5 rows + 2 rows = 7 rows.)"}}, {"type": "tap", "kick": "Quick check", "title": "Top part, bottom part", "text": "Look at your beans. 7 rows of 4. Ruler under row 5.", "items": [{"type": "fill", "q": "The top part is 5 rows of 4. 5 × 4 = ____", "answers": ["20"], "why": "5 × 4 = <b>20</b>.", "no": "Count by 5s four times.", "hint": "5, 10, 15, 20"}, {"type": "fill", "q": "The bottom part is 2 rows of 4. 2 × 4 = ____", "answers": ["8", "eight"], "why": "2 × 4 = <b>8</b>.", "no": "Double 4.", "hint": "4 + 4 = ?"}, {"type": "fill", "q": "20 + 8 = 28. So <b>7 × 4</b> = ____", "answers": ["28"], "why": "Top part plus bottom part: <b>28</b>. So 7 × 4 = 28.", "no": "Add the two parts.", "hint": "20 + 8 = ?"}], "notes": {"do": "She types each answer herself (in person). Let her point to the beans as she answers.", "ask": "Show me the top part. Show me the bottom part.", "listen": "20, 8, 28. If she types 9 for the top, she added 5 + 4. Point to the top part: 5 rows with 4 in each. Count it with her by 5s: 5, 10, 15, 20."}}, {"type": "learn", "kick": "Learn", "title": "Try 7 × 6", "text": "Let's find <b>7 × 6</b>. Split 7 into <b>5</b> and <b>2</b>.", "steps": [{"text": "<b>Step 1.</b> 5s part: <b>5 × 6 = 30</b>.", "visual": {"kind": "array", "rows": 5, "cols": 6, "emoji": "🟩"}}, {"text": "<b>Step 2.</b> 2s part: <b>2 × 6 = 12</b>.", "visual": {"kind": "array", "rows": 2, "cols": 6, "emoji": "🟧"}}, {"text": "<b>Step 3.</b> Add: <b>30 + 12 = 42</b>. So <b>7 × 6 = 42</b>.", "visual": {"kind": "bigtext", "text": "7 × 6 = 42"}}], "tip": "Both parts use the <b>same</b> number. For 7 × 6, it is 5 × <b>6</b> and 2 × <b>6</b>.", "notes": {"do": "She builds 7 rows of 6 beans. Ruler under row 5 again.", "say": "Same split. The 6 stays the same in both parts.", "ask": "What is 5 × 6? What is 2 × 6? Put them together.", "listen": "\"30 and 12 is 42.\" Wrong: 35 + 14 = 49 (she used 7 in both parts, which is 7 × 7). Point: how many beans in each row? 6, in both parts."}}, {"type": "build", "kick": "Build it", "title": "Puppy toys", "text": "There are <b>7 puppies</b>. Each puppy gets <b>3 toys</b>. Make the groups.", "groups": 7, "each": 3, "emoji": "🧸", "why": "5 × 3 = 15. 2 × 3 = 6. 15 + 6 = 21. So <b>7 × 3 = 21</b>.", "hint": "Each <b>puppy</b> is one group. Set <b>Groups</b> to the number of puppies. Set <b>In each group</b> to the toys for one puppy.", "notes": {"do": "She sets out 7 piles of 3 beans first, then taps the + buttons to match.", "ask": "How many puppies? How many toys for each? Now split: 5 piles and 2 piles.", "listen": "\"15 and 6, so 21.\""}}, {"type": "tap", "kick": "Try it", "title": "5s and 2s make 7s", "items": [{"q": "5 × 8 = 40 and 2 × 8 = 16. What is <b>7 × 8</b>?", "choices": ["54", "48", "56"], "a": 2, "why": "40 + 16 = <b>56</b>. Say it: 5, 6, 7, 8. <b>56 = 7 × 8</b>!", "no": ["Not 54. Add the parts again: 40 + 16.", "48 is 6 × 8. You need one more group of 8.", null]}, {"q": "What is <b>7 × 7</b>?", "choices": ["49", "42", "47"], "a": 0, "why": "5 × 7 = 35. 2 × 7 = 14. 35 + 14 = <b>49</b>.", "no": [null, "42 is 6 × 7. You need one more group of 7.", "Check the 2s part: 2 × 7 = 14, not 12."]}, {"q": "Which shows <b>7 × 3</b>?", "choices": ["5 × 3 + 2", "5 × 7 + 2 × 7", "5 × 3 + 2 × 3"], "a": 2, "why": "Split the 7. Both parts are groups of 3: 15 + 6 = 21.", "no": ["The 2 rows also have 3 in each. It is 2 × 3, not 2.", "Both parts need groups of 3. 5 × 7 + 2 × 7 = 49. That is 7 × 7.", null]}], "notes": {"say": "Say both parts out loud. Then tap.", "ask": "For 7 × 8: what is 5 × 8? 2 × 8? Now say it with me: 5, 6, 7, 8. 56 = 7 × 8.", "listen": "\"40 and 16 is 56.\" If she picks 54, say the 5, 6, 7, 8 pattern together and write it on the whiteboard."}}, {"type": "learn", "kick": "Careful", "title": "Split the 7. Keep the other number.", "text": "For <b>7 × 6</b>, split the <b>7</b>. The <b>6</b> stays in both parts.", "steps": [{"text": "✅ 7 × 6 → 5 × <b>6</b> and 2 × <b>6</b>. 30 + 12 = <b>42</b>.", "visual": {"kind": "bigtext", "text": "5 × 6 + 2 × 6 = 42"}}, {"text": "❌ Not 5 × 7 and 2 × 7. That makes 35 + 14 = 49. That is <b>7 × 7</b>!", "visual": {"kind": "bigtext", "text": "5 × 7 + 2 × 7 = 49", "sub": "this is 7 × 7, not 7 × 6"}}], "tip": "Ask: how many rows? How many in <b>each</b> row? Only the rows get split.", "notes": {"do": "Build 7 rows of 6 again. Lay the ruler across the rows, never down a row.", "say": "The ruler only splits the rows. Every row still has 6.", "ask": "Why is 49 wrong for 7 × 6?", "listen": "\"Because each row has 6, not 7.\" or \"49 is 7 × 7.\" Either shows she sees it."}}, {"type": "order", "kick": "Put in order", "title": "How to do 7 × 9", "text": "Tap the steps in the right order.", "steps": ["Split 7 into 5 and 2", "Find both parts: 5 × 9 = 45 and 2 × 9 = 18", "Add the parts: 45 + 18 = 63", "So 7 × 9 = 63"], "why": "5s part, 2s part, then add. <b>7 × 9 = 63</b>.", "hint": "First split the 7. Then find both parts.", "notes": {"say": "Say each step out loud before you tap it.", "ask": "What comes first: split, find parts, or add?", "listen": "Split, 45 and 18, add to 63. If she starts with adding, ask: add what? We need the parts first."}}, {"type": "learn", "kick": "Learn", "title": "A calendar is an array!", "text": "A week has <b>7 days</b>. Each row on a calendar is one week.", "visual": {"kind": "array", "rows": 4, "cols": 7, "emoji": "📅", "label": "4 weeks. 7 days in each week."}, "steps": [{"text": "How many days in <b>4 weeks</b>? That is <b>4 rows of 7</b>."}, {"text": "4 × 7 is the same as <b>7 × 4</b>. We know that one: <b>28</b>!", "visual": {"kind": "bigtext", "text": "4 × 7 = 28"}}], "tip": "A turn-around fact has the same answer. 4 × 7 = 7 × 4.", "notes": {"do": "Hand her the calendar page. She counts the days in the first 4 rows (weeks).", "say": "Every row on a calendar is one week: 7 days. A calendar is an array of 7s!", "ask": "How many rows did you count? How many in each row? So which fact is it?", "listen": "\"4 rows of 7, 4 × 7 = 28.\" Then she flips it: 7 × 4 = 28 too."}}, {"type": "tap", "kick": "Your turn", "title": "Weeks and days", "text": "Each week has <b>7 days</b>.", "items": [{"type": "fill", "q": "How many days are in <b>10 weeks</b>? ____", "answers": ["70"], "why": "10 × 7 = <b>70</b>.", "no": "10 weeks. 7 days in each.", "hint": "10 groups of 7."}, {"type": "fill", "q": "How many days are in <b>9 weeks</b>? ____", "answers": ["63"], "why": "9 × 7: 70 − 7 = <b>63</b>. Or 5s part + 2s part: 45 + 18 = 63.", "no": "9 weeks, 7 days in each.", "hint": "10 weeks is 70. Take away one week."}], "notes": {"ask": "Which trick did you use for 9 weeks?", "listen": "Either works: 10s take away one group (70 − 7) or split the 7 (45 + 18). Praise her for choosing."}}, {"type": "tap", "kick": "Check the split", "title": "Right or wrong?", "items": [{"q": "Liz writes <b>7 × 3 = 15 + 2</b>. What is wrong?", "choices": ["The 2s part should be 2 × 3 = 6.", "The 5s part should be 5 × 7.", "Nothing. It is right."], "a": 0, "why": "2 rows of 3 is 6, not 2. 15 + 6 = <b>21</b>.", "no": [null, "Split the 7. The 5s part is 5 × 3 = 15. That part is right.", "15 + 2 = 17. But 7 × 3 = 21."]}, {"q": "Ellie writes <b>7 × 8 = 40 + 14</b>. What is wrong?", "choices": ["The 5s part should be 35.", "Nothing. It is right.", "The 2s part should be 2 × 8 = 16."], "a": 2, "why": "2 × 8 = 16. 40 + 16 = <b>56</b>.", "no": ["5 × 8 = 40. That part is right.", "40 + 14 = 54. But 7 × 8 = 56.", null]}, {"q": "Which split is <b>right</b> for 7 × 5?", "choices": ["35 + 10", "25 + 10", "25 + 2"], "a": 1, "why": "5 × 5 = 25. 2 × 5 = 10. 25 + 10 = <b>35</b>.", "no": ["35 is the answer, not the 5s part. 5 × 5 = 25.", null, "The 2s part is 2 × 5 = 10, not 2."]}], "notes": {"do": "She checks each part on the whiteboard before she taps.", "ask": "Check the 5s part. Is it right? Now check the 2s part.", "listen": "She finds which part is wrong, not just that it is wrong."}}, {"type": "learn", "kick": "Card flip", "title": "Say both parts", "text": "I flip a card. You say the <b>5s part</b>, the <b>2s part</b>, and the <b>answer</b>. Then we check the hard ones here.", "visual": {"kind": "emoji", "text": "🃏 7️⃣"}, "steps": [{"text": "Cards first. Then click to check these four."}, {"text": "<b>7 × 3</b>: 15 + 6 = <b>21</b>"}, {"text": "<b>7 × 7</b>: 35 + 14 = <b>49</b>"}, {"text": "<b>7 × 8</b>: 40 + 16 = <b>56</b> (5, 6, 7, 8!)"}, {"text": "<b>7 × 9</b>: 45 + 18 = <b>63</b>"}], "tip": "5s part + 2s part. Same number in both parts.", "notes": {"do": "Use the 7s index cards (7 × 3 to 7 × 9), shuffled. She says both parts and the answer for each card. Put any slow card aside for Thursday. After the cards, click through the steps to check 7 × 3, 7 × 7, 7 × 8 and 7 × 9 together.", "say": "Fast is good. Right is better. Say both parts every time.", "listen": "Both parts, then the total. If she skips the parts and guesses, ask for the parts again."}}, {"type": "tap", "kick": "Word problems", "title": "Multiply or add?", "items": [{"q": "Amy walks the puppy <b>every day</b> for <b>3 weeks</b>. How many days is that?", "choices": ["10", "24", "21"], "a": 2, "why": "3 weeks, 7 days in each. 3 × 7 = <b>21</b>.", "no": ["10 is 3 + 7. Each week has 7 days, so multiply.", "24 is 3 × 8. A week has 7 days.", null]}, {"q": "Liz has <b>7 jars</b>. She puts <b>6 biscuits</b> in each jar. How many biscuits?", "choices": ["42", "13", "36"], "a": 0, "why": "7 × 6: 30 + 12 = <b>42</b>.", "no": [null, "13 is 7 + 6. Each jar has 6, so multiply.", "36 is 6 × 6. There are 7 jars."]}, {"q": "Ellie has <b>7 ribbons</b>. Marion gives her <b>7 more</b>. How many now?", "choices": ["49", "14", "0"], "a": 1, "why": "This is one group plus another. Add: 7 + 7 = <b>14</b>.", "no": ["Two 7s is not 7 groups of 7. Add them.", null, "0 is 7 − 7. She got more ribbons."]}], "notes": {"do": "She reads each problem aloud.", "say": "Before you tap: equal groups or not?", "ask": "For the ribbons: are there 7 equal groups, or just two amounts?", "listen": "Weeks and jars are equal groups: multiply. \"7 ribbons and 7 more\" is two amounts: add (14). If she says 49, she multiplied because both numbers are 7."}}, {"type": "learn", "kick": "Wrap-up", "title": "Your plan before Thursday", "text": "<b>7s:</b> 5s part + 2s part. 7 × 6 = 30 + 12 = <b>42</b>.", "steps": [{"text": "<b>Tonight:</b> the After-class lesson (it ends with Show What You Know) and the Lesson 6 Practice."}, {"text": "<b>Wednesday:</b> the Lesson 7 Practice, the Lesson 6 packet, and Lesson 7 packet page 1."}, {"text": "<b>Every night:</b> read your book for 10 minutes."}], "tip": "Thursday: bring the Lesson 6 packet and page 1 of the Lesson 7 packet.", "notes": {"do": "Open the course page and read the task list with her. Put the two packets in her folder.", "say": "This is a two-night list. Do the first part tonight and the rest tomorrow.", "ask": "What will you do tonight? What will you do tomorrow?", "listen": "She can say tonight's two items and Wednesday's three."}}], "win": "Sevens are no match for you. 5 and 2 more!", "prev": "bb-bristol-L06", "prevTitle": "Lesson 6"});</script></body></html>
