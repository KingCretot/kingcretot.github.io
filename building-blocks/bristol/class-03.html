<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 3: Fours: Double, Double</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L03", "label": "Lesson 3", "title": "Fours: Double, Double", "goal": "I can find 4 times a number by doubling two times.", "date": "2026-10-26", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "Fours: Double, Double", "text": "You know your <b>2s</b>. Today they help you with the <b>4s</b>. 🐾", "visual": {"kind": "emoji", "text": "🐾🐾 + 🐾🐾"}, "notes": {"do": "Share your screen on this class lesson page. Ask her to hold up to the camera: about 40 beans (or cereal pieces), a sheet of paper, a pencil, and a folded paper card for covering rows.", "say": "Today you learn a trick for the 4s. You already know your 2s, and the 2s will do the hard work.", "ask": "What is 2 × 6? What is 2 × 9?", "listen": "Quick answers (12, 18). If she hesitates on 2s, slow the doubling part down today."}}, {"type": "talk", "kick": "Book Talk", "title": "The missing puppy", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["What is the big problem in the story?", "What has Amy done so far to fix it?", "What do you think will happen next? Why?"], "starters": ["The problem is …", "So far, Amy …", "I think … because …"], "notes": {"do": "5–6 minutes. She answers out loud. Tap the gold button for each strong answer.", "ask": "What is the big problem? What has Amy done so far to fix it? What do you think will happen next, and why?", "listen": "A full sentence for each, and a reason with \"because\" on the prediction."}}, {"type": "recall", "kick": "Remember", "title": "From last week", "items": [{"type": "fill", "q": "There are 5 baskets. <b>Each</b> basket has 3 kittens. How many kittens?", "visual": {"kind": "groups", "groups": 5, "each": 3, "emoji": "🐱"}, "answers": ["15", "fifteen"], "why": "Each basket has 3, so the groups are equal. <b>5 × 3 = 15</b>.", "no": "Each basket has 3. Skip count by 3s, one time for each basket.", "placeholder": "Type a number"}, {"q": "An array has <b>2 rows of 5</b>. Which array has the <b>same</b> number?", "visual": {"kind": "array", "rows": 2, "cols": 5, "emoji": "🌼"}, "choices": ["2 rows of 7", "5 rows of 5", "5 rows of 2"], "a": 2, "why": "Turn it around! 2 × 5 = 10 and 5 × 2 = 10.", "no": ["2 rows of 7 is 14, not 10.", "5 rows of 5 is 25, not 10.", null]}, {"type": "fill", "q": "Liz has 4 balls. Marion has 5 balls. How many balls in all?", "visual": {"kind": "uneven", "sets": [4, 5], "emoji": "🎾"}, "answers": ["9", "nine"], "why": "4 and 5 are not equal groups, so add: <b>4 + 5 = 9</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}], "notes": {"do": "On Zoom she says her answer out loud; you type or tap it on the shared screen. Before each answer she says equal groups or not.", "listen": "15, 5 rows of 2, and 9. If she says 20 for the balls, she multiplied without a clue word: ask, \"Does every girl have the same number?\""}}, {"type": "learn", "kick": "Learn", "title": "What is a double?", "text": "<b>Double</b> means add a number to itself. It is the same as <b>× 2</b>.", "visual": {"kind": "bigtext", "text": "double 7 = 7 + 7 = 14"}, "steps": [{"text": "Double 3: 3 + 3 = <b>6</b>. That is 2 × 3."}, {"text": "Double 10: 10 + 10 = <b>20</b>. That is 2 × 10."}, {"text": "Double 12: 12 + 12 = <b>24</b>. Add the ones, then the tens."}], "tip": "You already know your 2s. Every 2s fact is a double!", "notes": {"do": "She makes a pile of 3 beans and another pile of 3 beans on camera: double 3.", "say": "Doubling is just your 2s. 2 × 7 and double 7 are the same thing.", "ask": "What is double 12? Say the ones first, then the tens.", "listen": "\"2 plus 2 is 4 ones, 1 plus 1 is 2 tens, 24.\""}}, {"type": "tap", "kick": "Warm up", "title": "Doubling", "text": "Double means add a number to itself.", "items": [{"type": "fill", "q": "What is <b>double 7</b>?", "answers": ["14", "fourteen"], "why": "Double 7 is <b>7 + 7 = 14</b>.", "no": "Double means 7 + 7.", "placeholder": "Type a number"}, {"type": "fill", "q": "What is <b>double 14</b>?", "answers": ["28", "twenty-eight", "twenty eight"], "why": "<b>14 + 14 = 28</b>. 4 + 4 = 8 ones, 1 + 1 = 2 tens.", "no": "Add the ones: 4 + 4. Then the tens: 1 + 1.", "placeholder": "Type a number"}, {"q": "What is <b>double 18</b>?", "choices": ["26", "216", "36"], "a": 2, "why": "<b>18 + 18</b>: 8 + 8 = 16 ones. Regroup 10 ones as 1 ten. 1 + 1 + 1 = 3 tens. So <b>36</b>.", "no": ["You forgot to regroup. 8 + 8 = 16, so carry 1 ten.", "16 ones is 1 ten and 6 ones. Carry the ten. Don't write 16.", null]}], "notes": {"do": "On Zoom she says her answer out loud; you type or tap it on the shared screen. On double 18 she writes 18 + 18 on her paper, tens over tens, and holds it up.", "ask": "On double 18: what do we do with 16 ones?", "listen": "\"Regroup: 1 ten and 6 ones.\" 26 or 216 means she did not regroup."}}, {"type": "learn", "kick": "Learn", "title": "4 groups = 2 groups + 2 groups", "text": "<b>4 × 3</b> means <b>4 groups of 3</b>.", "visual": {"kind": "groups", "groups": 4, "each": 3, "emoji": "🦴"}, "steps": [{"text": "Split the 4 groups into <b>2 groups</b> and <b>2 more groups</b>.", "visual": {"kind": "groups", "groups": 2, "each": 3, "emoji": "🦴"}}, {"text": "<b>2 × 3 = 6</b>. You know that one!"}, {"text": "The other 2 groups are 6 too. <b>Double</b> 6: <b>6 + 6 = 12</b>.", "visual": {"kind": "bigtext", "text": "4 × 3 = 12"}}], "tip": "4 is 2 and 2. So <b>×4</b> is <b>double, then double again</b>.", "notes": {"do": "She makes 4 piles of 3 beans on camera. Then she pushes 2 piles to one side.", "say": "4 groups is 2 groups and 2 more groups. The 2 groups are a 2s fact. The other side is the same, so we double it.", "ask": "How many beans in the 2 piles on the left? On the right? All together?", "listen": "\"6 and 6, so 12.\" Then she says the fact: 4 × 3 = 12."}}, {"type": "learn", "kick": "Learn", "title": "Double, double: 4 × 6", "text": "Let's find <b>4 × 6</b>.", "visual": {"kind": "array", "rows": 4, "cols": 6, "emoji": "🐾", "label": "4 rows of 6"}, "steps": [{"text": "<b>Double 1:</b> 2 × 6 = <b>12</b>. That is the top 2 rows."}, {"text": "<b>Double 2:</b> double 12. <b>12 + 12 = 24</b>. That is all 4 rows."}, {"text": "So <b>4 × 6 = 24</b>.", "visual": {"kind": "bigtext", "text": "6 → 12 → 24", "sub": "double, double"}}], "tip": "Say it out loud: <b>double 6 is 12, double 12 is 24</b>.", "notes": {"do": "She makes 4 rows of 6 beans on her paper and covers the bottom 2 rows with the folded card.", "say": "The top half is 2 × 6. The bottom half is the same. So double it.", "ask": "How many in the top 2 rows? Now lift the card. How many in all?", "listen": "\"12 on top, 12 under the card, 24.\""}}, {"type": "tap", "kick": "Your turn", "title": "Try 4 × 5", "text": "Use <b>double, double</b> for <b>4 × 5</b>.", "items": [{"type": "fill", "q": "First double: double 5 = ____", "answers": ["10", "ten"], "why": "Double 5 is <b>10</b>. That is 2 × 5.", "no": "5 + 5", "placeholder": "Type a number"}, {"type": "fill", "q": "Now double again: double 10 = ____", "answers": ["20", "twenty"], "why": "Double 10 is <b>20</b>. That is all 4 groups.", "no": "10 + 10", "placeholder": "Type a number"}, {"type": "fill", "q": "So 4 × 5 = ____", "answers": ["20", "twenty"], "why": "Double, double: 5, 10, <b>20</b>. And your 5s say 4 × 5 = 20 too!", "no": "What did you get after the second double?", "placeholder": "Type a number"}], "notes": {"do": "On Zoom she says her answer out loud; you type or tap it on the shared screen. ", "say": "You already know 4 × 5 from your 5s. Look: the trick gives the same answer. That is how we know it works.", "listen": "10, 20, 20. If she says 10 for 4 × 5, she stopped after one double."}}, {"type": "learn", "kick": "Learn", "title": "Check it on a number line", "text": "<b>4 × 8</b> is 4 jumps of 8.", "visual": {"kind": "numberline", "start": 0, "jump": 8, "jumps": 4}, "steps": [{"text": "After <b>2 jumps</b> you are at <b>16</b>. That is 2 × 8."}, {"text": "2 more jumps is 16 more. <b>16 + 16 = 32</b>."}, {"text": "So <b>4 × 8 = 32</b>. The halfway number, doubled!"}], "tip": "You can also count by 4s: 4, 8, 12, 16, 20, 24, 28, 32. That is 8 jumps of 4. Same answer!", "notes": {"do": "Click through the steps slowly. She counts the jumps on her fingers.", "ask": "Where are we after 2 jumps? What do the other 2 jumps add?", "listen": "\"16 after 2 jumps, 16 more is 32.\" If she says 24, she counted 3 jumps: count them together on fingers."}}, {"type": "order", "kick": "Put in order", "title": "How to do 4 × 7", "text": "Tap the steps in the right order.", "steps": ["Read the fact: 4 × 7", "Think: 2 × 7 = 14", "Double 14: 14 + 14 = 28", "Say it: 4 × 7 = 28"], "why": "Read it, find the 2s fact, double it, then say the whole fact.", "hint": "Start by reading the fact. Next, find the 2s fact. Then double it.", "notes": {"do": "On Zoom she says her answer out loud; you type or tap it on the shared screen. She tells you which step comes next; you tap it.", "ask": "Why do we find 2 × 7 first?", "listen": "\"Because 4 is 2 and 2. Find the 2s, then double.\""}}, {"type": "build", "kick": "Build it", "title": "Dog bowls at the vet", "text": "Amy's mom fills <b>4 bowls</b>. She puts <b>4 treats</b> in each bowl. Make the groups.", "groups": 4, "each": 4, "emoji": "🦴", "why": "4 groups of 4. Double 4 is 8. Double 8 is 16. <b>4 × 4 = 16</b>.", "hint": "Each bowl is one group. <b>Groups</b> = how many bowls. <b>In each group</b> = treats in one bowl.", "notes": {"do": "She makes 4 piles of 4 beans at home and tells you \"4 groups, 4 in each\"; you click the buttons and Check.", "ask": "Double 4 is? Double that is?", "listen": "\"8, then 16.\""}}, {"type": "tap", "kick": "Your turn", "title": "Use double, double", "items": [{"type": "fill", "q": "<b>4 × 9 = ?</b>", "answers": ["36", "thirty-six", "thirty six"], "why": "Double 9 is 18. Double 18 is <b>36</b>.", "no": "Find double 9 first.", "hint": "Double 9 is 18. Now double 18.", "placeholder": "Type a number"}, {"q": "Which shows <b>double, double</b> for <b>4 × 8</b>?", "choices": ["8, 16, 24", "4, 8, 16", "8, 16, 32"], "a": 2, "why": "Start at 8. Double it: 16. Double again: <b>32</b>.", "no": ["16 + 8 is not a double. 16 doubled is 32.", "Start with the 8, not the 4. 4, 8, 16 is doubling 4.", null]}, {"type": "fill", "q": "<b>4 × 7 = ?</b>", "answers": ["28", "twenty-eight", "twenty eight"], "why": "Double 7 is 14. Double 14 is <b>28</b>.", "no": "Did you double two times?", "placeholder": "Type a number"}], "notes": {"do": "On Zoom she says her answer out loud; you type or tap it on the shared screen. Before every answer she says the two doubles out loud (\"9, 18, 36\").", "listen": "36, \"8, 16, 32\", 28. 18 for 4 × 9 means one double only."}}, {"type": "learn", "kick": "Learn", "title": "Turn it around", "text": "<b>7 × 4</b> is the same as <b>4 × 7</b>. So use double, double!", "visual": {"kind": "array", "rows": 7, "cols": 4, "emoji": "🐾", "label": "7 rows of 4"}, "steps": [{"text": "Turn it around: <b>7 × 4 = 4 × 7</b>."}, {"text": "Double 7 is 14. Double 14 is 28."}, {"text": "So <b>7 × 4 = 28</b>.", "visual": {"kind": "bigtext", "text": "7 × 4 = 28"}}], "tip": "See a 4 on either side? Think <b>double, double</b>.", "notes": {"say": "Remember turn-around facts from last week? The 4 can be first or second.", "ask": "What is 9 × 4? Which trick?", "listen": "\"Double, double: 9, 18, 36.\""}}, {"type": "sort", "kick": "Sort it", "title": "Same answer, same box", "text": "Tap a card. Then tap the box with its answer.", "buckets": ["24", "28", "32"], "items": [{"text": "4 × 6", "b": 0, "why": "Double 6 is 12. Double 12 is 24.", "hint": "Double 6. Then double again."}, {"text": "double 14", "b": 1, "why": "14 + 14 = 28.", "hint": "Add 14 + 14."}, {"text": "4 × 8", "b": 2, "why": "Double 8 is 16. Double 16 is 32.", "hint": "Double 8. Then double again."}, {"text": "double 12", "b": 0, "why": "12 + 12 = 24.", "hint": "Add 12 + 12."}, {"text": "7 × 4", "b": 1, "why": "Turn it around: 4 × 7. Double 7 is 14, double 14 is 28.", "hint": "7 × 4 is the same as 4 × 7."}, {"text": "double 16", "b": 2, "why": "16 + 16 = 32.", "hint": "6 + 6 = 12 ones. Regroup!"}], "done": "Double, double gives the 4s fact every time.", "notes": {"do": "On Zoom she says her answer out loud; you type or tap it on the shared screen. She picks a card, says its answer, and tells you which box.", "ask": "Which card shares the box with 4 × 6? Why?", "listen": "\"Double 12,\" because 4 × 6 is double 12. She should see that 4 × 8 and double 16 are the same."}}, {"type": "tap", "kick": "Your turn", "title": "Word problems", "text": "Equal groups? Multiply. Not equal? Add.", "items": [{"type": "fill", "q": "Marion has 4 bags. <b>Each</b> bag has 8 dog bones. How many bones?", "visual": {"kind": "groups", "groups": 4, "each": 8, "emoji": "🦴"}, "answers": ["32", "thirty-two", "thirty two"], "why": "4 equal groups of 8. Double 8 is 16, double 16 is <b>32</b>.", "no": "Each bag has 8. Double, double.", "placeholder": "Type a number"}, {"q": "Ellie fed 4 big dogs and 6 small dogs. How many dogs did she feed?", "visual": {"kind": "uneven", "sets": [4, 6], "emoji": "🐕"}, "choices": ["24", "10", "2"], "a": 1, "why": "4 and 6 are different amounts. Add: <b>4 + 6 = 10</b>.", "no": ["There are not 4 groups of 6. There is one group of 4 and one group of 6.", null, "2 is 6 − 4. No dogs went away. Put the two groups together."]}], "notes": {"do": "On Zoom she says her answer out loud; you type or tap it on the shared screen. She reads each one aloud and says equal or not before answering.", "listen": "32 and 10. 24 for the dogs means she multiplied 4 and 6 without a clue word."}}, {"type": "learn", "kick": "Paper", "title": "Show me on paper", "text": "Write each fact on your paper. Show <b>both doubles</b>. Hold it up!", "steps": [{"text": "Get your paper and pencil. Listen for the first fact."}, {"text": "<b>4 × 3</b> → 3, 6, <b>12</b>"}, {"text": "<b>4 × 6</b> → 6, 12, <b>24</b>"}, {"text": "<b>4 × 9</b> → 9, 18, <b>36</b>"}, {"text": "<b>4 × 8</b> → 8, 16, <b>32</b>"}, {"text": "<b>4 × 10</b> → 10, 20, <b>40</b>"}], "tip": "Write three numbers: the number, double it, double again.", "notes": {"do": "Say one fact at a time. She writes the three numbers, holds the paper up to the camera, then you click to show the answer.", "listen": "Three numbers each time. Watch for 4 × 9 written as 9, 18, 27 (adding 9, not doubling). 4 × 10 should be quick: 10, 20, 40."}}, {"type": "learn", "kick": "Wrap-up", "title": "Double, double!", "text": "4s = double, then double again.", "visual": {"kind": "bigtext", "text": "7 → 14 → 28", "sub": "4 × 7"}, "tip": "Tonight: do the <b>after-class lesson</b> and read for 10 minutes. That's all!", "notes": {"do": "Share the course page. Show the Lesson 3 task list: only two things tonight.", "say": "Tomorrow we meet in person and learn the 6s. They use your 5s. Your practice and packet for today come on Tuesday's list.", "ask": "What is the trick for 4s?", "listen": "\"Double, double.\""}}], "win": "Double, double! You are a 4s star!", "prev": "bb-bristol-L02", "prevTitle": "Lesson 2"});</script></body></html>
