<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Practice 3</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Fours: Double, Double</h1><p style="margin:0 0 12px;color:#5b6578">Three tries on each one. Only your first try counts. For 4s: double, then double again.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bristol", "label": "Lesson 3", "title": "Fours: Double, Double", "mastery": 85, "color": "#10AC84", "questions": [{"type": "fill", "q": "What is <b>double 8</b>?", "answers": ["16", "sixteen"], "why": "8 + 8 = <b>16</b>.", "no": "Double means 8 + 8.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>4 × 4 = ?</b>", "answers": ["16", "sixteen"], "why": "Double 4 is 8. Double 8 is <b>16</b>.", "no": "Double 4. Then double again.", "placeholder": "Type a number"}, {"q": "How many paws? <b>4 rows of 6</b>.", "visual": {"kind": "array", "rows": 4, "cols": 6, "emoji": "🐾"}, "choices": ["20", "10", "24"], "a": 2, "why": "Double 6 is 12. Double 12 is 24.", "no": ["20 is 4 × 5. Each row has 6.", "10 is 4 + 6. The rows are equal, so multiply.", null]}, {"q": "Which shows double, double for <b>4 × 5</b>?", "choices": ["5, 10, 15", "5, 10, 20", "4, 8, 16"], "a": 1, "why": "Start at 5. Double: 10. Double again: 20.", "no": ["10 + 5 is not a double. Double 10 is 20.", null, "Start with the 5, not the 4."]}, {"type": "fill", "q": "What is <b>double 16</b>?", "answers": ["32", "thirty-two", "thirty two"], "why": "6 + 6 = 12 ones. Regroup. 1 + 1 + 1 = 3 tens. <b>32</b>.", "no": "Add the ones first. Regroup!", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>4 × 9 = ?</b>", "answers": ["36", "thirty-six", "thirty six"], "why": "Double 9 is 18. Double 18 is <b>36</b>.", "no": "Double 9. Then double again.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 4 kittens. <b>Each</b> kitten has 4 paws. How many paws?", "visual": {"kind": "groups", "groups": 4, "each": 4, "emoji": "🐾"}, "answers": ["16", "sixteen"], "why": "4 groups of 4. Double 4 is 8. Double 8 is <b>16</b>.", "no": "Each kitten has 4. Double, double.", "placeholder": "Type a number"}, {"type": "fill", "q": "Marion has 4 ribbons. Ellie has 10 ribbons. How many ribbons in all?", "answers": ["14", "fourteen"], "why": "4 and 10 are not equal groups. Add: <b>4 + 10 = 14</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}, {"type": "fill", "q": "Count by 4s: 20, 24, 28, ____", "answers": ["32", "thirty-two", "thirty two"], "why": "28 + 4 = <b>32</b>.", "no": "Add 4 to the last number.", "placeholder": "Type a number"}, {"q": "Which is the same as <b>4 × 7</b>?", "choices": ["7 + 7", "14 + 14", "4 + 7"], "a": 1, "why": "2 × 7 = 14. Double it: 14 + 14 = 28.", "no": ["7 + 7 is only 2 × 7.", null, "4 + 7 adds. 4 × 7 is 4 groups of 7."]}, {"q": "Theo says <b>4 × 8 = 16</b>. What did he do?", "choices": ["He doubled only one time.", "He added 4 + 8.", "He is right."], "a": 0, "why": "Double 8 is 16. He had to double again: 32.", "no": [null, "4 + 8 = 12, not 16.", "16 is 2 × 8. 4 × 8 = 32."]}]});</script></body></html>
