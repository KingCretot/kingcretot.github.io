<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 5: Prove It: 4s and 6s</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L05", "label": "Lesson 5", "title": "Prove It: 4s and 6s", "goal": "I can solve 4s and 6s facts, find a missing number, and pick the right operation.", "date": "2026-10-29", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "Prove It: 4s and 6s", "text": "This week you learned two tricks. Today you <b>prove</b> you can use them. 💪", "visual": {"kind": "emoji", "text": "🐾🐾 ✋☝️ 💪"}, "notes": {"do": "Set out: about 50 beans, 6 small cups, the 8 flash cards (4 × 6, 6 × 6, 6 × 8, 4 × 9, 6 × 4, 8 × 6, 4 × 7, 6 × 7), whiteboard and marker, her book.", "say": "This week you learned two tricks. Today you prove you can use them, find a hiding number, and pick the right operation.", "ask": "What are the two tricks?", "listen": "\"4s: double, double. 6s: 5s plus one more group.\""}}, {"type": "talk", "kick": "Book Talk", "title": "Tell it in order", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["Tell the story so far. What happened first, next, then?", "What is the most important clue so far? Why?", "How has Amy changed since the start?"], "starters": ["First, … Next, … Then, …", "The best clue is … because …", "At the start Amy … Now she …"], "notes": {"do": "5–6 minutes. Retelling in order is her strength; let her lead, then push on the harder prompts.", "ask": "Tell the story so far in order. What is the most important clue, and why? How has Amy changed?", "listen": "First, next, then with real events; a clue with a reason; a change from the start (worried → hopeful, or alone → with friends)."}}, {"type": "learn", "kick": "Warm up", "title": "Flash round", "text": "Your teacher shows a card. Say the <b>trick</b>, then the <b>answer</b>.", "visual": {"kind": "bigtext", "text": "4 × 6 · 6 × 6 · 6 × 8 · 4 × 9<br>6 × 4 · 8 × 6 · 4 × 7 · 6 × 7"}, "tip": "4s: double, double. 6s: 5s + one more group.", "notes": {"do": "Show each index card. She says the trick first, then the answer. Put any card she has to think hard about in a \"again\" pile and repeat those at the end.", "listen": "24, 36, 48, 36, 24, 48, 28, 42. For 8 × 6 she should turn it around to 6 × 8."}}, {"type": "recall", "kick": "Remember", "title": "Pick the trick", "items": [{"q": "Which way finds <b>6 × 6</b>?", "choices": ["12 + 12", "30 + 6", "30 + 1"], "a": 1, "why": "5 × 6 = 30. One more group of 6: <b>30 + 6 = 36</b>.", "no": ["12 + 12 is double, double. That is 4 × 6 = 24.", null, "Add one more group of 6, not 1."]}, {"q": "Which way finds <b>4 × 9</b>?", "choices": ["9, 18, 36", "45 + 9", "9, 18, 27"], "a": 0, "why": "Double 9 is 18. Double 18 is <b>36</b>.", "no": [null, "45 + 9 is 6 × 9. This fact is 4 × 9.", "27 is 18 + 9. That is not a double."]}, {"type": "fill", "q": "How many stars? <b>8 rows of 4</b>. Turn it around!", "visual": {"kind": "array", "rows": 8, "cols": 4, "emoji": "⭐"}, "answers": ["32", "thirty-two", "thirty two"], "why": "8 × 4 is the same as 4 × 8. Double 8 is 16. Double 16 is <b>32</b>.", "no": "Turn it around: 4 × 8. Double, double.", "placeholder": "Type a number"}], "notes": {"ask": "Why is 12 + 12 wrong for 6 × 6?", "listen": "\"12 + 12 is double, double. That is for 4s.\" 32 for the stars."}}, {"type": "learn", "kick": "Learn", "title": "A number is hiding!", "text": "<b>4 × ? = 24</b>. How many 4s make 24?", "visual": {"kind": "bigtext", "text": "4 × ? = 24"}, "steps": [{"text": "Count by 4s to 24. Each jump is 4.", "visual": {"kind": "numberline", "start": 0, "jump": 4, "jumps": 6}}, {"text": "Now count the <b>jumps</b>: 1, 2, 3, 4, 5, 6. There are <b>6</b> jumps."}, {"text": "So <b>4 × 6 = 24</b>. The hiding number is <b>6</b>."}], "tip": "Count the <b>jumps</b>, not the last number. 24 is where you land. 6 is how many jumps.", "notes": {"do": "Click one step at a time. She counts the jumps on her fingers.", "say": "When a number is hiding, count how many 4s it takes to reach 24.", "ask": "Where do we land? How many jumps did it take?", "listen": "\"We land on 24. It took 6 jumps.\" If she says 24 is the answer, point back to the question mark: it stands for the number of jumps."}}, {"type": "learn", "kick": "Hands-on", "title": "Fill the cups", "text": "You have <b>30 beans</b>. Put <b>6</b> in each cup. How many cups do you fill?", "visual": {"kind": "bigtext", "text": "6 × ? = 30"}, "steps": [{"text": "Fill one cup with 6. Then another. Keep going until the beans are gone."}, {"text": "You filled <b>5 cups</b>.", "visual": {"kind": "groups", "groups": 5, "each": 6, "emoji": "🫘"}}, {"text": "So <b>6 × 5 = 30</b>. The hiding number is <b>5</b>.", "visual": {"kind": "bigtext", "text": "6 × 5 = 30"}}], "tip": "The hiding number is how many <b>groups</b>.", "notes": {"do": "Count out exactly 30 beans with her. She fills cups of 6 until the beans run out.", "ask": "How many cups? Write the fact with the hiding number.", "listen": "\"5 cups. 6 × 5 = 30.\""}}, {"type": "learn", "kick": "Learn", "title": "Guess, check, fix", "text": "<b>6 × ? = 42</b>. Try a number. Check it. Fix it.", "visual": {"kind": "bigtext", "text": "6 × ? = 42"}, "steps": [{"text": "<b>Guess 6.</b> 6 × 6 = 36. That is <b>too small</b>."}, {"text": "<b>Try one more: 7.</b> 6 × 7: 35 + 7 = <b>42</b>. Yes!"}, {"text": "So <b>6 × 7 = 42</b>. The hiding number is <b>7</b>."}], "tip": "Too small? Try a bigger number. Too big? Try a smaller number.", "notes": {"do": "She says each guess out loud and \"too small\" or \"too big\" before you click.", "ask": "6 × 6 is 36. Is 42 more or less? So should the next guess be bigger or smaller?", "listen": "\"Bigger. Try 7.\""}}, {"type": "tap", "kick": "Your turn", "title": "Find the hiding number", "items": [{"type": "fill", "q": "<b>4 × ? = 32</b>", "answers": ["8", "eight"], "why": "Double 8 is 16. Double 16 is 32. So <b>4 × 8 = 32</b>.", "no": "How many 4s make 32? Count the jumps.", "hint": "Count by 4s: 4, 8, 12 … until you land on 32. Count the jumps.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>? × 6 = 18</b>", "answers": ["3", "three"], "why": "6, 12, 18. That is 3 sixes. <b>3 × 6 = 18</b>.", "no": "Count by 6s to 18. How many jumps?", "placeholder": "Type a number"}, {"q": "<b>6 × ? = 54</b>", "choices": ["9", "8", "48"], "a": 0, "why": "5 × 9 = 45. 45 + 9 = 54. So <b>6 × 9 = 54</b>.", "no": [null, "6 × 8 = 48. Too small. Try one more.", "48 is 54 − 6. The hiding number is how many 6s."]}], "notes": {"do": "She can use beans and cups or count jumps on her fingers.", "listen": "8, 3, 9. If she types 28 or 12, she subtracted: ask, \"Does 4 × 28 make 32?\""}}, {"type": "sort", "kick": "Sort it", "title": "Same answer, same box", "text": "Tap a fact. Then tap the box with its answer.", "buckets": ["24", "36", "48"], "items": [{"text": "4 × 6", "b": 0, "why": "Double 6 is 12, double 12 is 24.", "hint": "It has a 4. Double, double."}, {"text": "6 × 6", "b": 1, "why": "30 + 6 = 36.", "hint": "5 × 6 is 30. Add one more 6."}, {"text": "6 × 8", "b": 2, "why": "40 + 8 = 48.", "hint": "5 × 8 is 40. Add one more 8."}, {"text": "4 × 9", "b": 1, "why": "Double 9 is 18, double 18 is 36.", "hint": "It has a 4. Double, double."}, {"text": "6 × 4", "b": 0, "why": "20 + 4 = 24. Same as 4 × 6!", "hint": "5 × 4 is 20. Add one more 4."}, {"text": "8 × 6", "b": 2, "why": "Turn it around: 6 × 8 = 48.", "hint": "8 × 6 is the same as 6 × 8."}], "done": "Look! 4 × 9 and 6 × 6 are both 36.", "notes": {"do": "She says the answer and the trick before she taps each card.", "say": "Look at the 36 box: 4 × 9 and 6 × 6. The answer alone does not tell you the fact.", "listen": "She notices that two different facts can have the same answer."}}, {"type": "learn", "kick": "Learn", "title": "Same numbers, different job", "text": "Both stories have a <b>4</b> and a <b>6</b>. Read carefully!", "steps": [{"text": "<b>Story A:</b> There are 4 puppies. <b>Each</b> puppy has 6 spots. How many spots?", "visual": {"kind": "groups", "groups": 4, "each": 6, "emoji": "🟤"}}, {"text": "<b>Each</b> puppy has 6. Equal groups. <b>Multiply: 4 × 6 = 24</b> spots."}, {"text": "<b>Story B:</b> Amy has 4 puppies. Ellie has 6 puppies. How many puppies?", "visual": {"kind": "uneven", "sets": [4, 6], "emoji": "🐶"}}, {"text": "4 and 6 are not the same. <b>Add: 4 + 6 = 10</b> puppies."}], "tip": "Don't look only at the numbers. Look for <b>each</b> or <b>every</b>. Ask: are the groups equal?", "notes": {"do": "Build Story A with 4 cups of 6 beans, and Story B with a pile of 4 and a pile of 6.", "say": "Same numbers. Different job. The words decide, not the numbers.", "ask": "Which story has the clue word? Which one adds?", "listen": "\"Story A says each, so multiply. Story B has no clue word and the groups are different, so add.\""}}, {"type": "tap", "kick": "Your turn", "title": "Word problems", "text": "Equal groups? Multiply. Not equal? Add.", "items": [{"type": "fill", "q": "Six friends <b>each</b> brought 4 apples to the picnic. How many apples?", "answers": ["24", "twenty-four", "twenty four"], "why": "6 friends, 4 each. Equal groups: <b>6 × 4 = 24</b>.", "no": "Each friend brought 4. That is 6 equal groups.", "placeholder": "Type a number"}, {"q": "Amy has 6 dog toys. Ellie has 4 cat toys. How many toys?", "choices": ["24", "10", "2"], "a": 1, "why": "6 and 4 are two different groups. Add: <b>6 + 4 = 10</b>.", "no": ["Amy does not have 6 groups of 4. Add the two amounts.", null, "2 is the difference. The question asks how many toys."]}, {"type": "fill", "q": "The vet has 4 cages. There are 9 birds in <b>every</b> cage. How many birds?", "answers": ["36", "thirty-six", "thirty six"], "why": "<b>Every</b> cage has 9. Double 9 is 18, double 18 is <b>36</b>.", "no": "Every cage has 9. Double, double.", "placeholder": "Type a number"}], "notes": {"do": "Before answering she points to <b>each</b> or <b>every</b>, or says it is missing.", "listen": "24, 10, 36."}}, {"type": "build", "kick": "Build it", "title": "Snack bowls", "text": "Amy fills <b>6 bowls</b>. She puts <b>8 treats</b> in every bowl. Make the groups.", "groups": 6, "each": 8, "emoji": "🦴", "why": "6 groups of 8. 5 × 8 = 40, plus 8 is <b>48</b>.", "hint": "How many bowls? How many treats in every bowl?", "notes": {"do": "She builds 6 cups of 8 beans first, then sets the buttons.", "ask": "Which trick? What is 5 × 8?", "listen": "\"5s plus one more: 40 plus 8 is 48.\""}}, {"type": "learn", "kick": "Learn", "title": "A hiding number in a story", "text": "Liz has <b>28 stickers</b>. She puts <b>4</b> on each page. How many pages?", "visual": {"kind": "bigtext", "text": "4 × ? = 28"}, "steps": [{"text": "What do we know? <b>4</b> on each page. <b>28</b> in all."}, {"text": "Write it: <b>4 × ? = 28</b>. The hiding number is the pages."}, {"text": "Count by 4s to 28. Count the jumps.", "visual": {"kind": "numberline", "start": 0, "jump": 4, "jumps": 7}}, {"text": "7 jumps. So <b>4 × 7 = 28</b>. Liz fills <b>7 pages</b>.", "visual": {"kind": "bigtext", "text": "7 pages"}}], "tip": "The total is in the story. The hiding number is how many groups.", "notes": {"do": "Act it out: 28 beans, 4 on each sheet of paper (or in each cup) until they run out.", "ask": "Is 28 the answer? What does the question ask for?", "listen": "\"No, 28 is all the stickers. It asks how many pages: 7.\" If she adds 28 + 4 or multiplies 28 × 4, go back to the beans."}}, {"type": "tap", "kick": "Fix it", "title": "Find the mistake", "items": [{"q": "Theo says <b>6 × 6 = 31</b>. He did 5 × 6 = 30, then 30 + 1. What should he do?", "choices": ["30 + 6 = 36", "30 + 5 = 35", "He is right."], "a": 0, "why": "Add one more <b>group</b> of 6: 30 + 6 = <b>36</b>.", "no": [null, "The extra group has 6, not 5.", "He added 1. He needs one more group of 6."]}, {"type": "fill", "q": "Mia says <b>4 × 9 = 18</b>. What is 4 × 9 really?", "answers": ["36", "thirty-six", "thirty six"], "why": "Double 9 is 18. Double again: 18 + 18 = <b>36</b>.", "no": "Mia doubled only one time.", "placeholder": "Type a number"}], "notes": {"ask": "Tell me in your own words what Theo did wrong. What did Mia forget?", "listen": "\"Theo added 1 instead of a group of 6.\" \"Mia only doubled once.\""}}, {"type": "learn", "kick": "Whiteboard", "title": "Prove it on the board", "text": "Write each one on the whiteboard. Then check.", "steps": [{"text": "? × 4 = 20 → <b>5</b>"}, {"text": "6 × ? = 36 → <b>6</b>"}, {"text": "? × 6 = 60 → <b>10</b>"}, {"text": "Liz has 6 bags with 7 marbles in <b>each</b>. → <b>6 × 7 = 42</b>"}, {"text": "Amy has 6 marbles. Ellie has 7 marbles. → <b>6 + 7 = 13</b>"}], "tip": "Hiding number: count the jumps. Story: look for <b>each</b> or <b>every</b>.", "notes": {"do": "Read each one aloud. She writes her answer and the fact on the whiteboard, then you click to check.", "listen": "The last two use the same numbers: one multiplies, one adds. This is the skill the whole first two weeks built."}}, {"type": "learn", "kick": "Wrap-up", "title": "You proved it!", "text": "4s and 6s are yours. You can find a hiding number too!", "visual": {"kind": "emoji", "text": "🐾🐾 ✋☝️ 💪"}, "tip": "This weekend: check your list. It has the after-class lesson, practice, packets, reading and Times Table Trail.", "notes": {"do": "Repeat any flash cards from the \"again\" pile. Then open the course page and read the Lesson 5 task list together.", "say": "Next week: 7s, 8s and 9s. The 8s are built on your 4s, so keep doubling.", "ask": "How do you find a hiding number?", "listen": "\"Count the jumps\" or \"guess, check and fix.\""}}], "win": "You proved it! 4s and 6s are yours!", "prev": "bb-bristol-L04", "prevTitle": "Lesson 4"});</script></body></html>
