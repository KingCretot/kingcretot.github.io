<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 1: Equal Groups or Not?</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L01", "label": "Lesson 1", "title": "Equal Groups or Not?", "goal": "I can tell if groups are equal, and pick multiply or add.", "date": "2026-10-20", "mastery": 85, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Equal Groups or Not?", "text": "Today you are a <b>group detective</b>. 🔍 You will look at groups and decide: are they <b>equal</b>?", "visual": {"kind": "emoji", "text": "🔍🍪🍪🍪"}, "notes": {"do": "Before she sits down: bowl of about 40 beans, 6 cups, whiteboard and marker, 2 index cards, her book. Put this class lesson on the big screen.", "say": "Today you are a group detective. Detectives look for clues. Our clue today is a question: are the groups <b>equal</b>?", "ask": "What does a detective do?", "listen": "Looks for clues, solves a mystery. Tie it to her book: Amy is a detective too, looking for the missing puppy."}}, {"type": "talk", "kick": "Book Talk", "title": "Tell me about your book", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["What happened the last time you read?", "Who was in that part of the story?", "How did Amy feel? What clue tells you?"], "starters": ["Last time, …", "Amy felt … because …", "The clue is …"], "notes": {"do": "0:00–0:07. Let her talk first. Write 3 words she says on the whiteboard. Tap the star button for a full-sentence answer.", "say": "Tell me what happened, in order. Start with <i>First</i>.", "ask": "Who was there? How did Amy feel? What did Amy do or say that shows that?", "listen": "Real events from the book in order (first, then, last). If she says only <i>she was sad</i>, push: what words in the book show it?"}}, {"type": "learn", "kick": "Hands-on", "title": "Which cups are fair?", "text": "3 puppies get treats. Count the treats in each cup. Which set is <b>fair</b>?", "visual": {"kind": "compare", "emoji": "🦴", "sets": [{"label": "Set A", "groups": [4, 4, 4]}, {"label": "Set B", "groups": [4, 2, 5]}]}, "notes": {"do": "0:07–0:17. Set A: 3 cups with 4 beans each. Set B: 3 cups with 4, 2 and 5 beans. Put them side by side next to the screen. Do not say the word equal yet.", "ask": "These are treats for 3 puppies. Which set is fair? How do you know?", "listen": "Right: <i>Set A, every cup has 4.</i> If she picks Set B, count each cup out loud with her: 4, 2, 5. Ask: is that fair to the puppy with only 2?"}}, {"type": "learn", "kick": "Learn", "title": "What are equal groups?", "text": "<b>Equal groups</b> have the <b>same number</b> in every group.", "visual": {"kind": "groups", "groups": 3, "each": 4, "emoji": "🍪", "label": "3 groups. Each group has 4."}, "tip": "Count each group. If every group has the same number, the groups are equal.", "notes": {"say": "The fair set has <b>equal groups</b>. Equal groups have the same number in every group. Say it with me.", "ask": "How many groups? How many in each group?", "listen": "<i>3 groups, 4 in each.</i> If she says 12, she counted all of them. Ask again: how many in <b>one</b> group?"}}, {"type": "learn", "kick": "Learn", "title": "These are NOT equal", "text": "Look! The groups have different numbers.", "visual": {"kind": "uneven", "sets": [4, 2, 5], "emoji": "🐚"}, "tip": "One group has 4. One has 2. One has 5. Not the same, so <b>not equal</b>.", "notes": {"do": "Point to Set B on the table, then the screen.", "say": "These groups are not equal. One has 4, one has 2, one has 5.", "ask": "Here is 1 more bean for Set B. Move the beans so every cup has the same number.", "listen": "Set B now has 12 beans. She should end with <i>4, 4, 4</i> and count each cup to check. Praise the checking, not the speed."}}, {"type": "tap", "kick": "Try it", "title": "Equal or not?", "items": [{"type": "fill", "q": "Are these groups equal? Type <b>equal</b> or <b>not equal</b>.", "answers": ["equal", "yes", "same", "equal groups"], "why": "Every group has 3 stars.", "no": "Count every group. Is each group the same?", "placeholder": "equal or not equal", "visual": {"kind": "groups", "groups": 4, "each": 3, "emoji": "⭐"}}, {"type": "fill", "q": "Are these groups equal? Type <b>equal</b> or <b>not equal</b>.", "answers": ["not equal", "notequal", "unequal", "not equel", "no", "not the same", "not equal groups"], "why": "Two groups have 3, but one group has 4.", "no": "Count the last group. Does it have 3?", "placeholder": "equal or not equal", "visual": {"kind": "uneven", "sets": [3, 3, 4], "emoji": "🍓"}}, {"type": "fill", "q": "Each bag has 5 marbles. There are 2 bags. Are the groups equal? Type <b>equal</b> or <b>not equal</b>.", "answers": ["equal", "yes", "same", "equal groups"], "why": "The words <b>each bag has 5</b> tell you every group is the same.", "no": "Read it again: <b>each</b> bag has 5.", "placeholder": "equal or not equal"}], "notes": {"do": "She types each answer. Before she types, she says how she knows.", "ask": "How do you know? Show me with your finger.", "listen": "For the last one there is no picture. She should point to the word <b>each</b>. If she guesses, ask: does every bag have the same number?"}}, {"type": "learn", "kick": "Clue words", "title": "Each and every", "text": "The words <b>each</b> and <b>every</b> tell you the groups are the same.", "steps": [{"text": "<b>Each</b> bag has 5 marbles. → Every bag has 5. <b>Equal!</b>"}, {"text": "<b>Every</b> dog has 4 legs. → <b>Equal!</b>"}, {"text": "Amy has 3 treats. Ellie has 6 treats. → 3 and 6 are different. <b>Not equal.</b>"}], "tip": "When you read, circle <b>each</b> and <b>every</b>.", "notes": {"do": "0:17–0:30. Write the 3 sentences on the whiteboard. She circles <b>each</b> and <b>every</b>. Reveal one step at a time.", "say": "Each and every are detective clues. They tell you every group has the same number.", "ask": "Is there a clue word in the last sentence? So how do we know?", "listen": "<i>No clue word. 3 and 6 are different, so not equal.</i>"}}, {"type": "learn", "kick": "Learn", "title": "Equal groups? Multiply!", "text": "When groups are equal, you can <b>multiply</b>. It is faster than counting!", "steps": [{"text": "<b>Step 1.</b> How many groups? <b>3</b>", "visual": {"kind": "groups", "groups": 3, "each": 4, "emoji": "🍪"}}, {"text": "<b>Step 2.</b> How many in each group? <b>4</b>"}, {"text": "<b>Step 3.</b> Groups × in each: <b>3 × 4 = 12</b>", "visual": {"kind": "bigtext", "text": "3 × 4 = 12"}}, {"text": "<b>Step 4.</b> Check by skip counting by 4s.", "visual": {"kind": "numberline", "start": 0, "jump": 4, "jumps": 3}}], "notes": {"do": "Put Set A (3 cups of 4) back in front of her.", "say": "When groups are equal, we can multiply. Multiply means groups times how many in each. 3 groups of 4 is 3 times 4.", "ask": "What does the 3 mean? What does the 4 mean? Count the beans to check.", "listen": "<i>3 is the cups (groups). 4 is the beans in each cup.</i> She counts 4, 8, 12 by touching each cup."}}, {"type": "learn", "kick": "Learn", "title": "Which number is the groups?", "text": "<b>3 groups of 5</b> and <b>5 groups of 3</b> look different.", "steps": [{"text": "<b>3 groups of 5</b>: 3 cups, 5 in each cup.", "visual": {"kind": "groups", "groups": 3, "each": 5, "emoji": "🫘"}}, {"text": "<b>5 groups of 3</b>: 5 cups, 3 in each cup.", "visual": {"kind": "groups", "groups": 5, "each": 3, "emoji": "🫘"}}, {"text": "The number before <b>groups</b> tells how many cups."}], "tip": "Say it: <b>groups</b> first, then <b>in each</b>.", "notes": {"do": "She builds 3 groups of 5 with beans. Then she builds 5 groups of 3 next to it.", "say": "The number before the word groups tells how many cups. The number after <i>of</i> tells how many in each cup.", "ask": "Which one has more cups? Which one has more beans in each cup?", "listen": "<i>5 groups of 3 has more cups. 3 groups of 5 has more in each cup.</i> If she mixes them up, point to the word groups and ask: how many cups?"}}, {"type": "build", "kick": "Build it", "title": "Theo's apple bags", "text": "Theo has <b>4 bags</b>. Each bag has <b>6 apples</b>. Make the groups.", "groups": 4, "each": 6, "emoji": "🍎", "why": "4 groups of 6. That is <b>4 × 6 = 24</b> apples.", "hint": "How many bags? How many apples in each bag?", "notes": {"do": "First she builds it with 4 cups and 6 beans in each. Then she uses the buttons on the screen and taps Check.", "say": "4 groups of 6 is 4 times 6. Count the beans with me: 6, 12, 18, 24.", "ask": "Which number is the groups? Which number is in each?", "listen": "<i>4 bags is the groups, 6 apples in each.</i> Watch for 6 groups of 4. It is not wrong to count beans one by one today."}}, {"type": "learn", "kick": "Learn", "title": "Not equal? Add!", "text": "Mia has <b>5 shells</b>. Theo has <b>3 shells</b>. How many in all?", "visual": {"kind": "uneven", "sets": [5, 3], "emoji": "🐚"}, "steps": [{"text": "The groups are <b>not equal</b> (5 and 3)."}, {"text": "So we <b>add</b>: <b>5 + 3 = 8</b> shells.", "visual": {"kind": "bigtext", "text": "5 + 3 = 8"}}], "tip": "You can only multiply when every group is the same.", "notes": {"do": "0:30–0:40. Make one cup of 5 and one cup of 3.", "say": "These groups are not equal, so we cannot multiply. We add.", "ask": "Why can't we say 2 groups of 5? Why not 2 groups of 3?", "listen": "<i>Because one cup has 5 and one has 3. They are not the same.</i>"}}, {"type": "learn", "kick": "Watch out", "title": "Same numbers, different job", "text": "Both stories say <b>in all</b>. Only one has equal groups.", "steps": [{"text": "<b>5 cats.</b> Each cat has <b>4 legs</b>. How many legs in all?", "visual": {"kind": "groups", "groups": 5, "each": 4, "emoji": "🐾"}}, {"text": "Equal groups → <b>5 × 4 = 20</b> legs."}, {"text": "<b>5 cats</b> and <b>4 dogs</b>. How many pets in all?", "visual": {"kind": "emoji", "text": "🐱🐱🐱🐱🐱 │ 🐶🐶🐶🐶"}}, {"text": "Not equal groups → <b>5 + 4 = 9</b> pets."}], "tip": "<b>In all</b> does not mean multiply. Look for <b>equal groups</b>.", "notes": {"do": "Reveal one step at a time. Read both stories out loud. She decides multiply or add before you reveal each answer.", "say": "Same numbers, 5 and 4. Different job. Detectives look at the groups, not just the numbers.", "ask": "In the cat story, what is a group? In the pet story, are there equal groups?", "listen": "Cat story: <i>each cat is a group of 4 legs.</i> Pet story: <i>5 and 4 are not the same, so add.</i> If she says multiply for both, ask her to draw the pets."}}, {"type": "tap", "kick": "Sort it", "title": "Multiply or add?", "text": "Read each one out loud. Equal groups → multiply. Not equal → add.", "items": [{"type": "fill", "q": "3 boxes, 6 crayons in each box. <b>Multiply</b> or <b>add</b>? Type one word.", "answers": ["multiply", "times", "multiplication", "multiplying", "x", "×", "*"], "why": "Each box has 6, so the groups are equal.", "no": "Is every group the same? Look for <b>each</b> or <b>every</b>.", "placeholder": "multiply or add"}, {"type": "fill", "q": "Amy has 4 dog treats. Ellie has 7 dog treats. <b>Multiply</b> or <b>add</b>? Type one word.", "answers": ["add", "plus", "addition", "adding", "+"], "why": "4 and 7 are not the same.", "no": "Are the groups the same size? If not, you can't multiply.", "placeholder": "multiply or add"}, {"type": "fill", "q": "4 plates, 2 tacos on every plate. <b>Multiply</b> or <b>add</b>? Type one word.", "answers": ["multiply", "times", "multiplication", "multiplying", "x", "×", "*"], "why": "Every plate has 2 tacos.", "no": "Look for the clue word <b>every</b>.", "placeholder": "multiply or add"}, {"type": "fill", "q": "A red bag has 8 beads and a blue bag has 2 beads. <b>Multiply</b> or <b>add</b>? Type one word.", "answers": ["add", "plus", "addition", "adding", "+"], "why": "8 and 2 are different.", "no": "Are the groups the same size? If not, you can't multiply.", "placeholder": "multiply or add"}, {"type": "fill", "q": "6 rows of chairs, 3 chairs in each row. <b>Multiply</b> or <b>add</b>? Type one word.", "answers": ["multiply", "times", "multiplication", "multiplying", "x", "×", "*"], "why": "Each row has 3 chairs.", "no": "Is every group the same? Look for <b>each</b> or <b>every</b>.", "placeholder": "multiply or add"}, {"type": "fill", "q": "Mia picked 9 flowers. Then she picked 6 more. <b>Multiply</b> or <b>add</b>? Type one word.", "answers": ["add", "plus", "addition", "adding", "+"], "why": "9 and 6 are not equal groups.", "no": "Are the groups the same size? If not, you can't multiply.", "placeholder": "multiply or add"}], "notes": {"do": "Before each one, she reads it out loud and says her clue. Make a T-chart on the whiteboard (Multiply | Add) and write each story's numbers in the right side.", "ask": "Equal or not equal? What is your clue?", "listen": "She names the clue word (<i>each, every</i>) or says the two numbers are different. A right answer with no reason does not count: ask her why."}}, {"type": "tap", "kick": "Together", "title": "Solve it together", "items": [{"type": "fill", "q": "There are 4 tables. Each table has 6 cups. <b>Multiply</b> or <b>add</b>? Type one word.", "answers": ["multiply", "times", "multiplication", "multiplying", "x", "×", "*"], "why": "Each table has 6 cups. Equal groups, so multiply.", "no": "Is every group the same? Look for <b>each</b> or <b>every</b>.", "placeholder": "multiply or add", "visual": {"kind": "groups", "groups": 4, "each": 6, "emoji": "🥤"}}, {"type": "fill", "q": "4 tables. 6 cups on each table. How many cups in all?", "answers": ["24", "twenty-four", "twenty four"], "why": "4 groups of 6: 6, 12, 18, 24. So <b>4 × 6 = 24</b>.", "no": "Did you add 4 + 6? There are 4 tables. Each one has 6 cups. Count all the cups.", "hint": "Skip count the cups: 6, 12, …", "placeholder": "Type a number"}, {"q": "Amy found 3 clues on Monday and 5 clues on Tuesday. Which matches?", "choices": ["3 × 5", "5 × 5", "3 + 5"], "a": 2, "why": "3 and 5 are not equal groups, so add: <b>3 + 5 = 8</b>.", "no": ["You can't multiply. 3 and 5 are not the same size.", "There are not 5 groups of 5.", null], "visual": {"kind": "uneven", "sets": [3, 5], "emoji": "🔎"}}], "notes": {"do": "0:40–0:52. She reads each one out loud, then answers. Use the whiteboard to draw the cups if she is stuck.", "ask": "What are the groups? Equal or not? So multiply or add?", "listen": "She asks the questions in order before she types. If she types 10 for the cups, ask: how many cups are on <b>one</b> table? How many tables?"}}, {"type": "learn", "kick": "Hands-on", "title": "Make your own story", "text": "Card 1: make an <b>equal groups</b> story. Card 2: make a <b>not equal</b> story. Use Amy, Ellie, Liz or Marion!", "visual": {"kind": "emoji", "text": "🃏🃏"}, "notes": {"do": "Give her 2 index cards. Card 1: she writes an equal-groups story, builds it with beans and solves it with ×. Card 2: a not-equal story, solved with +. Keep both cards for Thursday.", "say": "You be the teacher now. Make a story for me to solve.", "ask": "How do I know your groups are equal? Which number is the groups?", "listen": "The equal story has the same number in every group (often with <i>each</i> or <i>every</i>). If her equal story uses two different numbers, build it with beans and let her see the cups are not the same."}}, {"type": "order", "kick": "Detective steps", "title": "What does a detective do first?", "text": "Tap the steps in the right order.", "steps": ["Read the story.", "Find the groups.", "Ask: equal or not equal?", "Multiply or add. Then solve."], "why": "Read, find the groups, decide if they are equal, then pick multiply or add.", "hint": "You can't find the groups before you read the story.", "notes": {"say": "Every word problem, every time: read, find the groups, equal or not, then multiply or add.", "ask": "Why do we ask <i>equal or not</i> before we pick the operation?", "listen": "<i>Because we can only multiply equal groups.</i>"}}, {"type": "tap", "kick": "Quick check", "title": "On your own", "items": [{"type": "fill", "q": "Liz has 2 bags. Each bag has 10 bows. How many bows?", "answers": ["20", "twenty"], "why": "2 equal groups of 10: <b>2 × 10 = 20</b>.", "no": "Did you add 2 + 10? Each bag has 10. Count both bags.", "hint": "Count by 10s: 10, …", "placeholder": "Type a number"}, {"type": "fill", "q": "Marion has 6 stickers. Liz has 7 stickers. How many stickers in all?", "answers": ["13", "thirteen"], "why": "6 and 7 are not equal, so add: <b>6 + 7 = 13</b>.", "no": "The groups are not equal, so add 6 and 7.", "placeholder": "Type a number"}], "notes": {"do": "0:52–0:57. No help on these two. Watch her work.", "say": "Show me you can do it alone. Read, find the groups, equal or not.", "listen": "Both right on the first try: she is ready for the after-class lesson. If she misses one, go back to the bean cups for that story before you wrap up."}}, {"type": "learn", "kick": "Wrap-up", "title": "What you learned today", "text": "<b>Equal</b> groups → <b>multiply</b>. <b>Not equal</b> → <b>add</b>.", "steps": [{"text": "Tonight: do the <b>After-class lesson</b> on your own."}, {"text": "It ends with <b>Show What You Know</b>. You need <b>85</b>."}, {"text": "Read your book for 15 minutes."}], "tip": "The big clue words are <b>each</b> and <b>every</b>.", "notes": {"do": "0:57–1:00. Open the course page and show her the task list. Hand her the printed packet.", "ask": "What are the two clue words? What do you do when the groups are not equal?", "listen": "<i>Each and every. Not equal, so add.</i>"}}], "win": "You are a real group detective!", "prev": null, "prevTitle": ""});</script></body></html>
