<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Practice 4</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Sixes: Fives and One More</h1><p style="margin:0 0 12px;color:#5b6578">Three tries on each one. Only your first try counts. 6s: use your 5s, then add one more group.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bristol", "label": "Lesson 4", "title": "Sixes: Fives and One More", "mastery": 85, "color": "#10AC84", "questions": [{"type": "fill", "q": "<b>6 × 3 = ?</b>", "answers": ["18", "eighteen"], "why": "15 + 3 = <b>18</b>.", "no": "5 × 3 is 15. Add one more 3.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>6 × 6 = ?</b>", "answers": ["36", "thirty-six", "thirty six", "thirtysix"], "why": "5 × 6 = 30. One more 6: <b>36</b>.", "no": "5 × 6 is 30. Add one more 6.", "placeholder": "Type a number"}, {"q": "<b>6 × 9</b>: 5 × 9 = 45. Add one more 9. What do you get?", "choices": ["46", "54", "55"], "a": 1, "why": "45 + 9 = 54.", "no": ["You added 1, not 9.", null, "Check the ones: 5 + 9 = 14. The ones digit is 4."]}, {"type": "fill", "q": "<b>6 × 8 = ?</b>", "answers": ["48", "forty-eight", "forty eight", "fortyeight"], "why": "5 × 8 = 40. 40 + 8 = <b>48</b>.", "no": "5 × 8 is 40. Add one more 8.", "placeholder": "Type a number"}, {"q": "Which fact matches the picture?", "visual": {"kind": "groups", "groups": 6, "each": 4, "emoji": "🐟"}, "choices": ["4 × 4", "6 + 4", "6 × 4"], "a": 2, "why": "6 groups with 4 in each.", "no": ["Count the groups. There are 6.", "The groups are equal. Multiply.", null]}, {"q": "Which fact uses <b>double, double</b>?", "choices": ["6 × 9", "4 × 9", "5 × 9"], "a": 1, "why": "Double, double is the trick for 4s.", "no": ["6s use 5s plus one more group.", null, "You already know 5s. Double, double is for 4s."]}, {"type": "fill", "q": "<b>9 × 6 = ?</b>", "answers": ["54", "fifty-four", "fifty four", "fiftyfour"], "why": "Turn it around: 6 × 9. 5 × 9 = 45. 45 + 9 = <b>54</b>.", "no": "9 × 6 is the same as 6 × 9.", "placeholder": "Type a number"}, {"type": "fill", "q": "Marion packs 6 boxes. <b>Each</b> box has 7 bones. How many bones?", "answers": ["42", "forty-two", "forty two", "fortytwo"], "why": "6 × 7: 35 + 7 = <b>42</b>.", "no": "Each box has 7. Use your 5s, then one more box.", "placeholder": "Type a number"}, {"type": "fill", "q": "Ellie has 4 bags. <b>Each</b> bag has 9 apples. How many apples?", "answers": ["36", "thirty-six", "thirty six", "thirtysix"], "why": "Double 9 is 18. Double 18 is <b>36</b>.", "no": "It has a 4. Double, double.", "placeholder": "Type a number"}, {"type": "fill", "q": "Amy saw 6 cats and 7 dogs at the vet. How many animals?", "answers": ["13", "thirteen"], "why": "6 and 7 are different groups. Add: <b>6 + 7 = 13</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}, {"q": "Theo says 6 × 7 = 36. He did 5 × 7 = 35, then added 1. What is right?", "choices": ["35 + 6 = 41", "35 + 7 = 42", "35 + 1 = 36"], "a": 1, "why": "Add one more group of 7: 42.", "no": ["The extra group has 7, not 6.", null, "That is Theo's mistake. Add a whole group of 7."]}]});</script></body></html>
