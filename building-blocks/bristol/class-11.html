<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 11: Detective Challenge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script>window.KCE_READALOUD=true</script><script src="clips.js"></script><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L11", "label": "Lesson 11", "title": "Detective Challenge", "goal": "I can solve mixed word problems and money problems on my own.", "date": "2026-11-12", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Detective Challenge", "text": "Today you <b>prove</b> it. You solve tricky stories all by yourself! 🕵️", "visual": {"kind": "emoji", "text": "🕵️🏷️✅"}, "notes": {"do": "Set out the play money ($1, $5, $10 bills), the price-tag cards from Tuesday, 3–4 toys and the whiteboard.", "say": "\"This week you learned to be a word problem detective. Today you PROVE it. I will help less and less as we go.\"", "ask": "\"What are the 3 detective questions?\"", "listen": "All three from memory. If she stalls, give the first word of each (What … Are … Which …)."}}, {"type": "talk", "kick": "Book Talk", "title": "The story so far", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["Tell me the story so far. What happened <b>first</b>, <b>next</b> and <b>then</b>?", "Who helps look for the puppy?", "How do you think the story will end? What clue makes you think so?"], "starters": ["First, … Next, … Then, …", "… helps because …", "I think it will end … because …"], "notes": {"do": "Book talk, about 6 minutes. Retelling in order is her strength; let her lead.", "ask": "\"First, next, then?\" \"Who helps?\" \"How will it end? What clue makes you think so?\"", "listen": "Signal words in order (first, next, then) and a prediction tied to a clue. If she gives a prediction without a clue, ask: \"What part of the book made you think that?\""}}, {"type": "recall", "kick": "Remember?", "title": "Facts and shop review", "items": [{"q": "7 × 8 = ?<br><small>Hint: double the 4s fact.</small>", "choices": ["54", "56", "63"], "a": 1, "why": "7 × 4 = 28. Double 28 is <b>56</b>.", "no": ["54 is 6 × 9. It is a common mix-up with 7 × 8!", null, "63 is 7 × 9. Find 7 × 4, then double it."]}, {"q": "4 × ? = 36", "choices": ["9", "8", "32"], "a": 0, "why": "4 × 9 = 36. Check: double 9 is 18. Double 18 is 36.", "no": [null, "4 × 8 = 32, not 36.", "32 is 36 − 4. You need the number that times 4 makes 36."]}, {"q": "Brushes cost <b>$6 each</b>. Ellie buys <b>7</b>. What is the total?", "choices": ["$13", "$48", "$42"], "a": 2, "why": "7 × 6. 7 × 5 = 35. Add one more 7: 35 + 7 = <b>42</b>.", "no": ["$13 is 6 + 7. Every brush costs $6, so multiply.", "$48 is 8 × 6. She buys 7 brushes.", null]}], "notes": {"do": "Check Tuesday's After-Class score and Wednesday's work first. She names the strategy before answering.", "ask": "\"7 × 8: double which fact?\" \"4 × ? = 36: what times 4 makes 36?\" \"7 brushes at $6: how do you find 7 × 6?\"", "listen": "56 (double 28), 9 (double 9 is 18, double 18 is 36), $42 (35 + 7). If she says 54 for 7 × 8, have her say \"5, 6, 7, 8: 56 = 7 × 8.\""}}, {"type": "learn", "kick": "Learn", "title": "Detective checklist", "text": "Use this for <b>every</b> story today.", "steps": [{"text": "🔍 <b>What is happening?</b> Say it in your own words."}, {"text": "✖️ <b>Same price or equal groups?</b> → multiply."}, {"text": "➕ <b>Different things put together?</b> → add."}, {"text": "➖ <b>Spend, take away or compare?</b> → subtract."}, {"text": "✅ <b>Check.</b> Is the answer too big or too small?"}], "tip": "The total for many things at the same price is <b>bigger</b> than the price. If your total is small, look again!", "notes": {"do": "She reads the checklist aloud once. Copy it onto an index card she keeps next to her for the rest of the lesson.", "say": "\"Today you use this checklist on every story. The last step is new: check if your answer makes sense.\"", "ask": "\"If 8 collars cost $7 each, could the total be $15? Too big or too small?\"", "listen": "\"Too small. 8 collars cost more than that.\""}}, {"type": "tap", "kick": "Try it", "title": "Warm-up cases", "items": [{"q": "The club sells <b>9</b> dog scarves. Each one is <b>$4</b>. How much money does the club get?", "choices": ["$13", "$36", "$32"], "a": 1, "why": "Same price for each scarf. 9 × 4: double 9 is 18, double 18 is <b>36</b>.", "no": ["$13 is 9 + 4. Each scarf is $4, so multiply.", null, "$32 is 8 × 4. The club sells 9 scarves."]}, {"q": "Amy has <b>$50</b>. She buys a bed for <b>$27</b>. How much money is left?", "choices": ["$23", "$77", "$33"], "a": 0, "why": "She spends money, so subtract. 50 − 27 = <b>23</b>. Check: 23 + 27 = 50.", "no": [null, "$77 is 50 + 27. She <b>spends</b> money, so subtract.", "Check: 33 + 27 = 60, not 50. Regroup a ten and try again."]}, {"q": "Ellie buys <b>8</b> packs of cards at <b>$6</b> each. Which number sentence finds the total?", "choices": ["8 + 6 = 14", "8 × 6 = 42", "8 × 6 = 48"], "a": 2, "why": "Same price for every pack. 8 × 6 = 48 (4 × 6 = 24, double it).", "no": ["Every pack costs $6. That is equal groups, so multiply.", "8 × 6 is not 42. 7 × 6 = 42. Double 4 × 6 instead.", null]}], "notes": {"do": "She solves each case on the whiteboard first, then answers. Point to the checklist card on each one.", "ask": "On $50 − $27: \"Too big or too small? How can you check?\"", "listen": "$36, $23 (check: 23 + 27 = 50), 8 × 6 = 48. On the last item she must reject 8 × 6 = 42: the operation is right but the fact is wrong."}}, {"type": "tap", "kick": "Name it", "title": "Which operation?", "text": "These are tricky! Read the <b>whole</b> story. Then name the operation.", "items": [{"type": "fill", "q": "Marion spent $9 on Monday and $8 on Tuesday. How much did she spend in all?<br>Add, subtract or multiply?", "answers": ["add", "addition", "plus", "+"], "why": "Different amounts on two days, so add. 9 + 8 = 17.", "no": "Is it the same amount each day?", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "There are 5 shelves. Each shelf holds 7 cans. How many cans in all?<br>Add, subtract or multiply?", "answers": ["multiply", "multiplication", "times", "x"], "why": "<b>Each</b> shelf holds 7. Equal groups. 5 × 7.", "no": "Find the word <b>each</b>.", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "A hat costs $14. A scarf costs $9. How much less is the scarf?<br>Add, subtract or multiply?", "answers": ["subtract", "subtraction", "minus", "take away", "-", "−"], "why": "<b>How much less</b> → compare. 14 − 9.", "no": "<b>Less</b> asks you to compare two prices.", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "Ellie had $30. She paid $8 for a book. How much does she have now?<br>Add, subtract or multiply?", "answers": ["subtract", "subtraction", "minus", "take away", "-", "−"], "why": "She paid money, so it goes away. 30 − 8.", "no": "Did Ellie get money or pay money?", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "Liz bought 6 stickers for $2 each.<br>Add, subtract or multiply?", "answers": ["multiply", "multiplication", "times", "x"], "why": "Same price for each sticker. 6 × 2.", "no": "Does every sticker cost the same?", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "Amy saved $12. Then her mom gave her $5.<br>Add, subtract or multiply?", "answers": ["add", "addition", "plus", "+"], "why": "$12 and $5 join together. 12 + 5.", "no": "Is money joining or going away?", "placeholder": "add, subtract or multiply"}], "notes": {"do": "She reads each story aloud, names the operation without help, then types it on your laptop herself. Do not hint until she has answered.", "ask": "Only if she is wrong: \"What is happening? Is it the same amount each time?\"", "listen": "The trap is Marion's $9 and $8 \"in all\": different amounts, so add (not multiply). How much less is compare, so subtract."}}, {"type": "learn", "kick": "Learn", "title": "How many can I buy?", "text": "Liz has <b>$35</b>. Toy mice cost <b>$5 each</b>. How many can she buy?", "steps": [{"text": "Skip count by 5 until you reach 35.", "visual": {"kind": "numberline", "start": 0, "jump": 5, "jumps": 7}}, {"text": "Count the <b>jumps</b>: 7 jumps."}, {"text": "7 × 5 = 35. She can buy <b>7</b> toy mice.", "visual": {"kind": "bigtext", "text": "? × $5 = $35", "sub": "The missing factor is 7."}}], "tip": "The answer is the number of <b>jumps</b>, not the last number you say.", "notes": {"do": "Reveal step by step. Hand her $35 in $5 bills. She \"buys\" toy mice one bill at a time and lines up a toy (or index card) for each bill.", "say": "\"Now the question changes. We know the money. We find how many things we can buy.\"", "ask": "\"How many bills did you use? How many mice did you get? Are those the same number?\"", "listen": "7 bills, 7 mice. The answer is the number of jumps, not 35."}}, {"type": "build", "kick": "Hands on", "title": "How many bows?", "text": "Bows cost <b>$4 each</b>. Liz has <b>$24</b>. Make one group of $4 for each bow. Use all $24.", "groups": 6, "each": 4, "emoji": "💵", "why": "6 groups of $4 make $24. Liz can buy <b>6</b> bows. 6 × 4 = 24.", "hint": "Each group is $4. Keep making groups until you reach $24. Count the groups.", "notes": {"do": "Give her 24 $1 bills. She makes piles of $4 until the money is gone, then sets the counters on screen.", "ask": "\"How many piles? What does each pile buy? So how many bows?\" Then write ? × 4 = 24 and ask what the missing factor is.", "listen": "6 piles, 6 bows, the missing factor is 6. If she answers 24, ask: \"Is 24 bows or dollars?\""}}, {"type": "tap", "kick": "Try it", "title": "How many?", "items": [{"q": "Leashes cost <b>$10 each</b>. Ellie has <b>$60</b>. How many leashes can she buy?", "choices": ["6", "60", "7"], "a": 0, "why": "10, 20, 30, 40, 50, 60. That is <b>6</b> jumps. 6 × 10 = 60.", "no": [null, "$60 is her money. Count the jumps of 10.", "7 leashes would cost $70. Count the jumps again."]}, {"q": "Bones cost <b>$4 each</b>. Marion pays <b>$32</b>. How many bones did she buy?", "choices": ["28", "8", "9"], "a": 1, "why": "4 × 8 = 32. Skip count by 4: 4, 8, 12, 16, 20, 24, 28, 32. <b>8</b> jumps.", "no": ["28 is 32 − 4. The question asks <b>how many bones</b>.", null, "9 bones would cost 4 × 9 = $36."]}], "notes": {"do": "Guided practice. She uses play money on the first one, then tries the second with skip counting only.", "ask": "\"How many jumps did you make?\"", "listen": "6 leashes; 8 bones. If she says 28 on the second, she subtracted 4: ask \"How many bones?\""}}, {"type": "learn", "kick": "Watch me", "title": "Does my answer make sense?", "text": "Detectives check their answers. Ask: <b>too big</b> or <b>too small</b>?", "steps": [{"text": "<b>9 bags at $5 each.</b> Is $14 right? 🤔 No! 3 bags already cost $15. 9 bags cost <b>much more</b>. 9 × 5 = <b>$45</b>."}, {"text": "<b>A cage is $43. A mat is $18. How much more is the cage?</b> I got $35. Check: 35 + 18 = 53. Not 43! ❌"}, {"text": "Try again: 43 − 18 = <b>25</b>. Check: 25 + 18 = 43. ✔", "visual": {"kind": "bigtext", "text": "25 + 18 = 43 ✔"}}], "tip": "Many things at the same price → the total is <b>much bigger</b> than the price. After you subtract, <b>add back</b> to check.", "notes": {"do": "Model the thinking out loud on the whiteboard. On the second step, make the regrouping mistake on purpose (43 − 18: you write 35 because you did 8 − 3) and let her catch it with the add-back check.", "say": "\"I made a mistake on purpose. Can you find it?\"", "ask": "\"Is $14 too big or too small for 9 bags? Why?\" \"How do we check a subtraction?\"", "listen": "\"Too small: 3 bags already cost $15, so 9 bags cost way more.\" \"Add back: 25 + 18 should make 43.\""}}, {"type": "tap", "kick": "Find the mistake", "title": "Be the teacher", "items": [{"q": "Liz says: <i>9 bags at $5 each. 9 + 5 = $14.</i> What is the right total?", "choices": ["$14 is right.", "$45", "$40"], "a": 1, "why": "Same price for 9 bags, so multiply. 9 × 5 = <b>45</b>.", "no": ["Liz added. Every bag costs $5, so multiply.", null, "$40 is 8 × 5. There are 9 bags."]}, {"q": "Amy says: <i>A cage is $16. A bed is $9. The cage costs $25 more.</i> What is right?", "choices": ["The cage costs $7 more.", "The cage costs $25 more.", "The cage costs $9 more."], "a": 0, "why": "<b>How much more</b> → compare. 16 − 9 = <b>7</b>.", "no": [null, "$25 is 16 + 9. <b>More</b> here means compare, so subtract.", "$9 is the price of the bed, not the difference."]}, {"q": "Ellie says: <i>8 collars at $7 each is $54.</i> What is right?", "choices": ["$54 is right.", "$15", "$56"], "a": 2, "why": "8 × 7. Double the 4s: 4 × 7 = 28. Double 28 is <b>56</b>.", "no": ["54 is 6 × 9. Check 8 × 7 with double the 4s.", "$15 is 8 + 7. Every collar is $7, so multiply.", null]}], "notes": {"do": "She is the teacher. For each one she says what the student did wrong BEFORE she picks the right answer.", "ask": "\"What did Liz do? What did Amy do? What did Ellie do?\"", "listen": "Liz added instead of multiplying; Amy added instead of comparing; Ellie used the right operation but the wrong fact (54 is 6 × 9)."}}, {"type": "talk", "kick": "Say it", "title": "Get ready for the Trading Post", "text": "Soon you take <b>Pathways Week 7 Math</b> again with Jonathan. You will <b>type</b> some answers. Let's practice the words.", "prompts": ["Say and <b>spell</b> each word out loud: <b>price</b>, <b>total</b>, <b>factor</b>, <b>product</b>, <b>multiple</b>.", "Use <b>price</b> and <b>total</b> in one sentence about a pet shop.", "Name 3 <b>multiples</b> of 10. Then name 3 <b>multiples</b> of 5."], "starters": ["P-R-I-C-E spells price.", "The price is … so the total is …", "Multiples of 10 are …"], "notes": {"do": "She says and spells each word out loud. You write what she spells exactly as she says it, then she checks your writing against the slide.", "say": "\"In Pathways you will type these words, and only your first try counts. Let's get the spelling right now.\"", "ask": "\"Name 3 multiples of 10. Now 3 multiples of 5.\"", "listen": "price, total, factor, product, multiple, all spelled right. Multiples: any skip-count landing spots (10, 20, 30; 5, 10, 15)."}}, {"type": "tap", "kick": "Try it", "title": "Math words", "items": [{"q": "Hats are <b>$5 each</b>. Amy buys <b>4</b>. She pays <b>$20</b>. Which number is the <b>price</b>?", "choices": ["$5", "4", "$20"], "a": 0, "why": "The price is what <b>one</b> hat costs: $5.", "no": [null, "4 is how many hats she buys.", "$20 is the <b>total</b>, what she pays for all of them."]}, {"q": "Which list shows only <b>multiples of 10</b>?", "choices": ["10, 15, 20", "20, 40, 60", "5, 10, 15"], "a": 1, "why": "Skip count by 10s: 10, 20, 30, 40, 50, 60. You land on 20, 40 and 60.", "no": ["15 is a multiple of 5, but not of 10.", null, "5 and 15 are multiples of 5, not of 10."]}, {"q": "In <b>9 × 4 = 36</b>, what is 36 called?", "choices": ["a factor", "the price", "the product"], "a": 2, "why": "The answer when you multiply is the <b>product</b>.", "no": ["The factors are 9 and 4. They are the numbers you multiply.", "Price is what one thing costs. This is a fact, not a price tag.", null]}], "notes": {"do": "Quick check for understanding. She answers and explains each one.", "ask": "\"Why is $20 not the price?\" \"Why is 15 not a multiple of 10?\" \"What are the factors in 9 × 4 = 36?\"", "listen": "Price is for one hat; 15 is not a 10s landing spot; factors 9 and 4, product 36."}}, {"type": "talk", "kick": "Get ready", "title": "Your Pathways game plan", "text": "You will take <b>Pathways Week 7 Math</b> again with Jonathan. Here is your plan.", "prompts": ["For money answers, type <b>only the number</b>: <b>30</b>, not $30.", "Only your <b>first try</b> counts. Read the question out loud. Check before you press Check.", "Use your detective checklist on every story."], "starters": ["I will type only …", "Before I press Check, I …", "First I ask …"], "notes": {"do": "Go over the plan so she knows what to expect. Explain that she starts the retake only after she gets 85 on today's Show What You Know (in the After-Class Lesson).", "say": "\"Pathways counts your first try. So slow down, read it out loud, and check your answer. Money answers are just the number.\"", "ask": "\"What do you type for thirty dollars?\" \"What do you do before you press Check?\"", "listen": "\"30\" with no dollar sign; read it out loud, use the checklist, check the spelling."}}, {"type": "talk", "kick": "Wrap-up", "title": "Your plan for the break", "text": "There is a long break before your next lesson. 🍂", "prompts": ["What is the <b>first</b> thing you will do after class?", "When you see <b>each</b> or <b>every</b> with a price, what do you do?", "What is one thing you will read about in your book?"], "starters": ["First I will …", "I will multiply because …", "I want to find out …"], "notes": {"do": "Show the task list on the course page. It is split by week. Point out the Lesson 10 Packet page 2 and the Times Table Trail link.", "say": "\"First the After-Class Lesson and Show What You Know. Then Pathways with me. After that, one week at a time.\"", "listen": "She can name the first task and says \"multiply\" for each or every with a price."}}], "win": "Case closed! You are ready for the Trading Post!", "prev": "bb-bristol-L10", "prevTitle": "Lesson 10"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
