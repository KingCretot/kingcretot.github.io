<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 11: Detective Challenge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L11", "label": "Lesson 11", "title": "Detective Challenge", "goal": "I can solve mixed word problems and money problems on my own.", "date": "2026-11-12", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Detective Challenge: On Your Own", "text": "You proved it in class. Now solve the cases <b>on your own</b>! 🕵️", "visual": {"kind": "emoji", "text": "🕵️🏷️⭐"}}, {"type": "learn", "kick": "Remember", "title": "Detective checklist", "text": "Use it on every story.", "steps": [{"text": "🔍 What is happening?"}, {"text": "✖️ Same price or equal groups → multiply. ➕ Different things → add. ➖ Spend or compare → subtract."}, {"text": "✅ Check: too big or too small? After you subtract, <b>add back</b>."}], "tip": "How many can I buy? Count the <b>jumps</b>, not the last number."}, {"type": "talk", "kick": "Say it", "title": "Say it out loud", "text": "Say these out loud. You can tell your mom!", "prompts": ["Spell <b>price</b>, <b>total</b>, <b>factor</b>, <b>product</b> and <b>multiple</b>.", "Say the detective checklist.", "Name 3 <b>multiples</b> of 5."], "starters": ["P-R-I-C-E …", "First I ask …", "Multiples of 5 are …"]}, {"type": "tap", "kick": "Solve it", "title": "Mixed cases", "text": "Type the number.", "items": [{"type": "fill", "q": "Scarves cost <b>$7 each</b>. Ellie buys <b>5</b>. What is the total?", "answers": ["35"], "why": "Same price for each scarf. 5 × 7 = <b>35</b>.", "no": "Every scarf is $7. Multiply.", "hint": "Skip count by 5s, 7 times.", "placeholder": "Type a number"}, {"type": "fill", "q": "Liz has <b>$40</b>. She buys a toy for <b>$23</b>. How much is left?", "answers": ["17"], "why": "She spends money, so subtract. 40 − 23 = <b>17</b>. Check: 17 + 23 = 40.", "no": "She <b>spends</b> money. Subtract.", "hint": "Regroup a ten. Then add back to check.", "placeholder": "Type a number"}, {"type": "fill", "q": "A puppy bed is <b>$19</b>. A blanket is <b>$15</b>. Amy buys both. What does she pay?", "answers": ["34"], "why": "Two different things, so add. 19 + 15 = <b>34</b>.", "no": "She buys <b>both</b>. Different things → add.", "hint": "9 + 5 = 14. Carry the ten.", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Solve it", "title": "How many can I buy?", "items": [{"type": "fill", "q": "Hats cost <b>$10 each</b>. Marion has <b>$50</b>. How many hats can she buy?", "answers": ["5"], "why": "10, 20, 30, 40, 50. That is <b>5</b> jumps. 5 × 10 = 50.", "no": "Count the jumps of 10, not the dollars.", "hint": "? × 10 = 50", "placeholder": "Type a number"}, {"type": "fill", "q": "Bows cost <b>$4 each</b>. Ellie pays <b>$36</b>. How many bows did she buy?", "answers": ["9"], "why": "4 × 9 = 36. Double 9 is 18. Double 18 is 36. <b>9</b> bows.", "no": "The question asks how many <b>bows</b>.", "hint": "? × 4 = 36. Try double, double.", "placeholder": "Type a number"}]}, {"type": "sort", "kick": "Sort it", "title": "Which operation?", "text": "Read the <b>whole</b> story. Tap it. Then tap the right box.", "buckets": ["✖️ Multiply", "➕ Add", "➖ Subtract"], "items": [{"text": "Liz earned $7 walking dogs and $8 washing cars. How much did she earn?", "b": 1, "why": "$7 and $8 are different amounts. They join. 7 + 8.", "hint": "Is it the same amount each time?"}, {"text": "There are 4 tables. Each table has 9 cups.", "b": 0, "why": "<b>Each</b> table has 9. 4 × 9.", "hint": "Find the word <b>each</b>."}, {"text": "A leash is $15. A collar is $8. How much less is the collar?", "b": 2, "why": "<b>How much less</b> → compare. 15 − 8.", "hint": "<b>Less</b> asks you to compare."}, {"text": "Amy had $25. She bought a book for $9.", "b": 2, "why": "She paid money. It goes away. 25 − 9.", "hint": "Did Amy get money or pay money?"}, {"text": "Marion buys 3 bags of food for $8 each.", "b": 0, "why": "Same price for each bag. 3 × 8.", "hint": "Does every bag cost the same?"}, {"text": "Ellie has 16 stickers. Her mom gives her 7 more.", "b": 1, "why": "7 more stickers join. 16 + 7.", "hint": "Are stickers joining or going away?"}], "done": "Case closed! You read every story carefully."}, {"type": "tap", "kick": "Be the teacher", "title": "Fix the mistake", "text": "Type the right answer.", "items": [{"type": "fill", "q": "Amy says: <i>7 packs at $6 each is $13.</i><br>What is the right total?", "answers": ["42"], "why": "Amy added. Same price for each pack, so multiply. 7 × 6 = <b>42</b>.", "no": "Every pack is $6. Multiply, do not add.", "hint": "5 sixes is 30. Add 2 more sixes.", "placeholder": "Type a number"}, {"type": "fill", "q": "Liz says: <i>A bed is $20. A mat is $12. The bed is $32 more.</i><br>How much more is the bed really?", "answers": ["8"], "why": "Liz added. <b>How much more</b> means compare. 20 − 12 = <b>8</b>.", "no": "How much more means subtract.", "hint": "Count up from 12 to 20.", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Math words", "title": "Word check", "items": [{"type": "fill", "q": "Skip count by 10s: 10, 20, 30. These numbers are ____ of 10.", "answers": ["multiples", "multiple"], "why": "Numbers you land on when you skip count are <b>multiples</b>.", "no": "What do we call the numbers you land on when you skip count?", "hint": "It starts with <b>m</b>: m _ l t i p l e s", "placeholder": "Type the word"}, {"q": "Bows are <b>$6 each</b>. Liz buys <b>5</b>. She pays <b>$30</b>. Which number is the <b>total</b>?", "choices": ["$6", "5", "$30"], "a": 2, "why": "The total is what she pays for <b>all</b> of them: $30.", "no": ["$6 is the <b>price</b> of one bow.", "5 is how many bows she buys.", null]}]}, {"type": "recall", "kick": "Remember?", "title": "Fact check", "items": [{"type": "fill", "q": "4 × ____ = 32", "answers": ["8"], "why": "4 × 8 = 32. Double 8 is 16. Double 16 is 32.", "no": "What times 4 makes 32?", "hint": "Try double, double with 8.", "placeholder": "Type a number"}, {"type": "fill", "q": "____ × 7 = 63", "answers": ["9"], "why": "9 × 7 = 63. Check: 10 sevens is 70. Take away one 7: 63. ✔", "no": "What times 7 makes 63?", "hint": "Try 9: 10 sevens, take away one 7.", "placeholder": "Type a number"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Birdhouses cost <b>$10 each</b>. The club buys <b>9</b>. What is the total?", "answers": ["90"], "why": "9 × 10 = 90.", "no": "Every birdhouse is $10. Multiply.", "placeholder": "Type a number"}, {"type": "fill", "q": "Collars cost <b>$9 each</b>. Liz buys <b>4</b>. What is the total?", "answers": ["36"], "why": "4 × 9. 4 × 10 = 40. Take away one 4: 36.", "no": "Every collar is $9. Multiply.", "placeholder": "Type a number"}, {"type": "fill", "q": "Marion has <b>$45</b>. Bird toys cost <b>$5 each</b>. How many can she buy?", "answers": ["9"], "why": "Skip count by 5 to 45: 9 jumps. 9 × 5 = 45.", "no": "Count the jumps, not the dollars.", "placeholder": "Type a number"}, {"type": "fill", "q": "A bed costs <b>$42</b>. A blanket costs <b>$18</b>. How much <b>more</b> is the bed?", "answers": ["24"], "why": "Compare: 42 − 18 = 24. Check: 24 + 18 = 42.", "no": "How much more means subtract. Then add back to check.", "placeholder": "Type a number"}, {"type": "fill", "q": "Ellie buys a leash for <b>$16</b> and a bowl for <b>$9</b>. What does she pay?", "answers": ["25"], "why": "Two different things, so add. 16 + 9 = 25.", "no": "Two different things. Add.", "placeholder": "Type a number"}, {"q": "Amy buys <b>3 toys at $8 each</b>. Liz buys <b>5 toys at $5 each</b>. Who spends more?", "choices": ["Amy", "Liz", "They spend the same."], "a": 1, "why": "Amy: 3 × 8 = 24. Liz: 5 × 5 = 25. Liz spends $1 more.", "no": ["Amy spends 3 × 8 = $24. Find Liz's total: 5 × 5.", null, "Find both totals. Are $24 and $25 the same?"]}, {"q": "Bones are <b>$4 each</b>. Ellie pays <b>$28</b> for 7 bones. What is the <b>$28</b>?", "choices": ["the price", "the number of bones", "the total"], "a": 2, "why": "$28 is what she pays for all 7 bones. That is the total.", "no": ["The price is for <b>one</b> bone: $4.", "7 is the number of bones.", null]}, {"q": "Liz says: <i>6 bags of treats at $9 each is $15.</i> What is right?", "choices": ["$54", "$15 is right.", "$63"], "a": 0, "why": "Same price for each bag, so multiply. 6 × 9 = 54.", "no": [null, "Liz added 6 + 9. Every bag is $9, so multiply.", "$63 is 7 × 9. There are 6 bags."]}], [{"type": "fill", "q": "Bird feeders cost <b>$10 each</b>. Amy buys <b>6</b>. What is the total?", "answers": ["60"], "why": "6 × 10 = 60.", "no": "Every feeder is $10. Multiply.", "placeholder": "Type a number"}, {"type": "fill", "q": "Bags of hay cost <b>$8 each</b>. The club buys <b>7</b>. What is the total?", "answers": ["56"], "why": "7 × 8. 7 × 4 = 28. Double 28: 56.", "no": "Every bag is $8. Multiply.", "placeholder": "Type a number"}, {"type": "fill", "q": "Ellie has <b>$70</b>. Collars cost <b>$10 each</b>. How many collars can she buy?", "answers": ["7"], "why": "Skip count by 10 to 70: 7 jumps. 7 × 10 = 70.", "no": "Count the jumps, not the dollars.", "placeholder": "Type a number"}, {"type": "fill", "q": "A fish tank is <b>$53</b>. A lamp is <b>$27</b>. How much <b>more</b> is the tank?", "answers": ["26"], "why": "Compare: 53 − 27 = 26. Check: 26 + 27 = 53.", "no": "How much more means subtract. Then add back to check.", "placeholder": "Type a number"}, {"type": "fill", "q": "Liz buys a cage for <b>$38</b> and a mat for <b>$15</b>. What does she pay?", "answers": ["53"], "why": "Two different things, so add. 38 + 15 = 53.", "no": "Two different things. Add.", "placeholder": "Type a number"}, {"q": "Marion buys <b>4 bags at $7 each</b>. Ellie buys <b>3 bags at $9 each</b>. Who spends more?", "choices": ["Ellie", "They spend the same.", "Marion"], "a": 2, "why": "Marion: 4 × 7 = 28. Ellie: 3 × 9 = 27. Marion spends $1 more.", "no": ["Ellie spends 3 × 9 = $27. Find Marion's total: 4 × 7.", "Find both totals. Are $28 and $27 the same?", null]}, {"q": "Treats are <b>$6 a bag</b>. Amy buys 5 bags for <b>$30</b>. What is the <b>$6</b>?", "choices": ["the total", "the price", "the number of bags"], "a": 1, "why": "$6 is what <b>one</b> bag costs. That is the price.", "no": ["The total is for all 5 bags: $30.", null, "5 is the number of bags."]}, {"q": "Ellie says: <i>9 brushes at $4 each is $13.</i> What is right?", "choices": ["$36", "$13 is right.", "$32"], "a": 0, "why": "Same price for each brush, so multiply. 9 × 4 = 36.", "no": [null, "Ellie added 9 + 4. Every brush is $4, so multiply.", "$32 is 8 × 4. There are 9 brushes."]}], [{"type": "fill", "q": "Dog coats cost <b>$10 each</b>. The shelter buys <b>8</b>. What is the total?", "answers": ["80"], "why": "8 × 10 = 80.", "no": "Every coat is $10. Multiply.", "placeholder": "Type a number"}, {"type": "fill", "q": "Fish bowls cost <b>$6 each</b>. Liz buys <b>8</b>. What is the total?", "answers": ["48"], "why": "8 × 6. 4 × 6 = 24. Double 24: 48.", "no": "Every bowl is $6. Multiply.", "placeholder": "Type a number"}, {"type": "fill", "q": "Amy has <b>$50</b>. Rubber ducks cost <b>$5 each</b>. How many ducks can she buy?", "answers": ["10"], "why": "Skip count by 5 to 50: 10 jumps. 10 × 5 = 50.", "no": "Count the jumps, not the dollars.", "placeholder": "Type a number"}, {"type": "fill", "q": "A scooter is <b>$61</b>. A helmet is <b>$29</b>. How much <b>more</b> is the scooter?", "answers": ["32"], "why": "Compare: 61 − 29 = 32. Check: 32 + 29 = 61.", "no": "How much more means subtract. Then add back to check.", "placeholder": "Type a number"}, {"type": "fill", "q": "Marion buys a bed for <b>$27</b> and a bowl for <b>$18</b>. What does she pay?", "answers": ["45"], "why": "Two different things, so add. 27 + 18 = 45.", "no": "Two different things. Add.", "placeholder": "Type a number"}, {"q": "Liz buys <b>2 toys at $9 each</b>. Amy buys <b>3 toys at $6 each</b>. Who spends more?", "choices": ["They spend the same.", "Liz", "Amy"], "a": 0, "why": "Liz: 2 × 9 = 18. Amy: 3 × 6 = 18. They spend the same.", "no": [null, "Liz spends 2 × 9 = $18. Find Amy's total: 3 × 6.", "Amy spends 3 × 6 = $18. Find Liz's total: 2 × 9."]}, {"q": "Hats are <b>$7 each</b>. Ellie buys 6 hats. She pays <b>$42</b>. What is the <b>$42</b>?", "choices": ["the price", "the total", "the number of hats"], "a": 1, "why": "$42 is what she pays for all 6 hats. That is the total.", "no": ["The price is for <b>one</b> hat: $7.", null, "6 is the number of hats."]}, {"q": "Marion says: <i>8 bowls at $5 each is $13.</i> What is right?", "choices": ["$13 is right.", "$35", "$40"], "a": 2, "why": "Same price for each bowl, so multiply. 8 × 5 = 40.", "no": ["Marion added 8 + 5. Every bowl is $5, so multiply.", "$35 is 7 × 5. There are 8 bowls.", null]}]]}], "win": "Case closed! You are ready for the Trading Post!", "prev": "bb-bristol-L10", "prevTitle": "Lesson 10"});</script></body></html>
