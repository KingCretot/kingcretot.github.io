<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 11: Detective Challenge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L11", "label": "Lesson 11", "title": "Detective Challenge", "goal": "I can solve mixed word problems and money problems on my own.", "date": "2026-11-12", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Detective Challenge", "text": "Today you <b>prove</b> it. You solve tricky stories all by yourself! 🕵️", "visual": {"kind": "emoji", "text": "🕵️🏷️✅"}}, {"type": "talk", "kick": "Book Talk", "title": "The story so far", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["Tell me the story so far. What happened <b>first</b>, <b>next</b> and <b>then</b>?", "Who helps look for the puppy?", "How do you think the story will end? What clue makes you think so?"], "starters": ["First, … Next, … Then, …", "… helps because …", "I think it will end … because …"]}, {"type": "recall", "kick": "Remember?", "title": "Facts and shop review", "items": [{"q": "7 × 8 = ?<br><small>Hint: double the 4s fact.</small>", "choices": ["54", "56", "63"], "a": 1, "why": "7 × 4 = 28. Double 28 is <b>56</b>.", "no": ["54 is 6 × 9. It is a common mix-up with 7 × 8!", null, "63 is 7 × 9. Find 7 × 4, then double it."]}, {"q": "4 × ? = 36", "choices": ["9", "8", "32"], "a": 0, "why": "4 × 9 = 36. Check: double 9 is 18. Double 18 is 36.", "no": [null, "4 × 8 = 32, not 36.", "32 is 36 − 4. You need the number that times 4 makes 36."]}, {"q": "Brushes cost <b>$6 each</b>. Ellie buys <b>7</b>. What is the total?", "choices": ["$13", "$48", "$42"], "a": 2, "why": "7 × 6. 7 × 5 = 35. Add one more 7: 35 + 7 = <b>42</b>.", "no": ["$13 is 6 + 7. Every brush costs $6, so multiply.", "$48 is 8 × 6. She buys 7 brushes.", null]}]}, {"type": "learn", "kick": "Learn", "title": "Detective checklist", "text": "Use this for <b>every</b> story today.", "steps": [{"text": "🔍 <b>What is happening?</b> Say it in your own words."}, {"text": "✖️ <b>Same price or equal groups?</b> → multiply."}, {"text": "➕ <b>Different things put together?</b> → add."}, {"text": "➖ <b>Spend, take away or compare?</b> → subtract."}, {"text": "✅ <b>Check.</b> Is the answer too big or too small?"}], "tip": "The total for many things at the same price is <b>bigger</b> than the price. If your total is small, look again!"}, {"type": "tap", "kick": "Try it", "title": "Warm-up cases", "items": [{"q": "The club sells <b>9</b> dog scarves. Each one is <b>$4</b>. How much money does the club get?", "choices": ["$13", "$36", "$32"], "a": 1, "why": "Same price for each scarf. 9 × 4: double 9 is 18, double 18 is <b>36</b>.", "no": ["$13 is 9 + 4. Each scarf is $4, so multiply.", null, "$32 is 8 × 4. The club sells 9 scarves."]}, {"q": "Amy has <b>$50</b>. She buys a bed for <b>$27</b>. How much money is left?", "choices": ["$23", "$77", "$33"], "a": 0, "why": "She spends money, so subtract. 50 − 27 = <b>23</b>. Check: 23 + 27 = 50.", "no": [null, "$77 is 50 + 27. She <b>spends</b> money, so subtract.", "Check: 33 + 27 = 60, not 50. Regroup a ten and try again."]}, {"q": "Ellie buys <b>8</b> packs of cards at <b>$6</b> each. Which number sentence finds the total?", "choices": ["8 + 6 = 14", "8 × 6 = 42", "8 × 6 = 48"], "a": 2, "why": "Same price for every pack. 8 × 6 = 48 (4 × 6 = 24, double it).", "no": ["Every pack costs $6. That is equal groups, so multiply.", "8 × 6 is not 42. 7 × 6 = 42. Double 4 × 6 instead.", null]}]}, {"type": "sort", "kick": "Sort it", "title": "Which operation?", "text": "These are tricky! Read the <b>whole</b> story.", "buckets": ["✖️ Multiply", "➕ Add", "➖ Subtract"], "items": [{"text": "Marion spent $9 on Monday and $8 on Tuesday. How much did she spend in all?", "b": 1, "why": "Different amounts on two days, so add. 9 + 8 = 17.", "hint": "Is it the same amount each day?"}, {"text": "There are 5 shelves. Each shelf holds 7 cans. How many cans in all?", "b": 0, "why": "<b>Each</b> shelf holds 7. Equal groups. 5 × 7.", "hint": "Find the word <b>each</b>."}, {"text": "A hat costs $14. A scarf costs $9. How much less is the scarf?", "b": 2, "why": "<b>How much less</b> → compare. 14 − 9.", "hint": "<b>Less</b> asks you to compare two prices."}, {"text": "Ellie had $30. She paid $8 for a book. How much does she have now?", "b": 2, "why": "She paid money, so it goes away. 30 − 8.", "hint": "Did Ellie get money or pay money?"}, {"text": "Liz bought 6 stickers for $2 each.", "b": 0, "why": "Same price for each sticker. 6 × 2.", "hint": "Does every sticker cost the same?"}, {"text": "Amy saved $12. Then her mom gave her $5.", "b": 1, "why": "$12 and $5 join together. 12 + 5.", "hint": "Is money joining or going away?"}], "done": "Great sorting! Read the whole story every time."}, {"type": "learn", "kick": "Learn", "title": "How many can I buy?", "text": "Liz has <b>$35</b>. Toy mice cost <b>$5 each</b>. How many can she buy?", "steps": [{"text": "Skip count by 5 until you reach 35.", "visual": {"kind": "numberline", "start": 0, "jump": 5, "jumps": 7}}, {"text": "Count the <b>jumps</b>: 7 jumps."}, {"text": "7 × 5 = 35. She can buy <b>7</b> toy mice.", "visual": {"kind": "bigtext", "text": "? × $5 = $35", "sub": "The missing factor is 7."}}], "tip": "The answer is the number of <b>jumps</b>, not the last number you say."}, {"type": "tap", "kick": "Try it", "title": "How many?", "items": [{"q": "Leashes cost <b>$10 each</b>. Ellie has <b>$60</b>. How many leashes can she buy?", "choices": ["6", "60", "7"], "a": 0, "why": "10, 20, 30, 40, 50, 60. That is <b>6</b> jumps. 6 × 10 = 60.", "no": [null, "$60 is her money. Count the jumps of 10.", "7 leashes would cost $70. Count the jumps again."]}, {"q": "Bones cost <b>$4 each</b>. Marion pays <b>$32</b>. How many bones did she buy?", "choices": ["28", "8", "9"], "a": 1, "why": "4 × 8 = 32. Skip count by 4: 4, 8, 12, 16, 20, 24, 28, 32. <b>8</b> jumps.", "no": ["28 is 32 − 4. The question asks <b>how many bones</b>.", null, "9 bones would cost 4 × 9 = $36."]}]}, {"type": "tap", "kick": "Find the mistake", "title": "Be the teacher", "items": [{"q": "Liz says: <i>9 bags at $5 each. 9 + 5 = $14.</i> What is the right total?", "choices": ["$14 is right.", "$45", "$40"], "a": 1, "why": "Same price for 9 bags, so multiply. 9 × 5 = <b>45</b>.", "no": ["Liz added. Every bag costs $5, so multiply.", null, "$40 is 8 × 5. There are 9 bags."]}, {"q": "Amy says: <i>A cage is $16. A bed is $9. The cage costs $25 more.</i> What is right?", "choices": ["The cage costs $7 more.", "The cage costs $25 more.", "The cage costs $9 more."], "a": 0, "why": "<b>How much more</b> → compare. 16 − 9 = <b>7</b>.", "no": [null, "$25 is 16 + 9. <b>More</b> here means compare, so subtract.", "$9 is the price of the bed, not the difference."]}, {"q": "Ellie says: <i>8 collars at $7 each is $54.</i> What is right?", "choices": ["$54 is right.", "$15", "$56"], "a": 2, "why": "8 × 7. Double the 4s: 4 × 7 = 28. Double 28 is <b>56</b>.", "no": ["54 is 6 × 9. Check 8 × 7 with double the 4s.", "$15 is 8 + 7. Every collar is $7, so multiply.", null]}]}, {"type": "talk", "kick": "Say it", "title": "Get ready for the Trading Post", "text": "Soon you take <b>Pathways Week 7 Math</b> again with Jonathan. You will <b>type</b> some answers. Let's practice the words.", "prompts": ["Say and <b>spell</b> each word out loud: <b>price</b>, <b>total</b>, <b>factor</b>, <b>product</b>, <b>multiple</b>.", "Use <b>price</b> and <b>total</b> in one sentence about a pet shop.", "Name 3 <b>multiples</b> of 10. Then name 3 <b>multiples</b> of 5."], "starters": ["P-R-I-C-E spells price.", "The price is … so the total is …", "Multiples of 10 are …"]}, {"type": "tap", "kick": "Try it", "title": "Math words", "items": [{"q": "Hats are <b>$5 each</b>. Amy buys <b>4</b>. She pays <b>$20</b>. Which number is the <b>price</b>?", "choices": ["$5", "4", "$20"], "a": 0, "why": "The price is what <b>one</b> hat costs: $5.", "no": [null, "4 is how many hats she buys.", "$20 is the <b>total</b>, what she pays for all of them."]}, {"q": "Which list shows only <b>multiples of 10</b>?", "choices": ["10, 15, 20", "20, 40, 60", "5, 10, 15"], "a": 1, "why": "Skip count by 10s: 10, 20, 30, 40, 50, 60. You land on 20, 40 and 60.", "no": ["15 is a multiple of 5, but not of 10.", null, "5 and 15 are multiples of 5, not of 10."]}, {"q": "In <b>9 × 4 = 36</b>, what is 36 called?", "choices": ["a factor", "the price", "the product"], "a": 2, "why": "The answer when you multiply is the <b>product</b>.", "no": ["The factors are 9 and 4. They are the numbers you multiply.", "Price is what one thing costs. This is a fact, not a price tag.", null]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "Birdhouses cost <b>$10 each</b>. The club buys <b>9</b>. What is the total?", "choices": ["$19", "$90", "$80"], "a": 1, "why": "9 × 10 = 90."}, {"q": "Collars cost <b>$9 each</b>. Liz buys <b>4</b>. What is the total?", "choices": ["$36", "$13", "$32"], "a": 0, "why": "4 × 9. 4 × 10 = 40. Take away one 4: 36."}, {"q": "Marion has <b>$45</b>. Bird toys cost <b>$5 each</b>. How many can she buy?", "choices": ["8", "45", "9"], "a": 2, "why": "Skip count by 5 to 45: 9 jumps. 9 × 5 = 45."}, {"q": "A bed costs <b>$42</b>. A blanket costs <b>$18</b>. How much <b>more</b> is the bed?", "choices": ["$60", "$24", "$36"], "a": 1, "why": "Compare: 42 − 18 = 24. Check: 24 + 18 = 42."}, {"q": "Ellie buys a leash for <b>$16</b> and a bowl for <b>$9</b>. What does she pay?", "choices": ["$25", "$7", "$15"], "a": 0, "why": "Two different things, so add. 16 + 9 = 25."}, {"q": "Amy buys <b>3 toys at $8 each</b>. Liz buys <b>5 toys at $5 each</b>. Who spends more?", "choices": ["Amy", "Liz", "They spend the same."], "a": 1, "why": "Amy: 3 × 8 = 24. Liz: 5 × 5 = 25. Liz spends $1 more."}, {"q": "Bones are <b>$4 each</b>. Ellie pays <b>$28</b> for 7 bones. What is the <b>$28</b>?", "choices": ["the total", "the price", "the number of bones"], "a": 0, "why": "$28 is what she pays for all 7 bones. That is the total."}, {"q": "Liz says: <i>6 bags of treats at $9 each is $15.</i> What is right?", "choices": ["$63", "$15 is right.", "$54"], "a": 2, "why": "Same price for each bag, so multiply. 6 × 9 = 54."}]}], "win": "Case closed! You are ready for the Trading Post!", "prev": "bb-bristol-L10", "prevTitle": "Lesson 10"});</script></body></html>
