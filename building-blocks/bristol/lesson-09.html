<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 9: Word Problem Detective</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L09", "label": "Lesson 9", "title": "Word Problem Detective", "goal": "I can ask 3 detective questions and pick add, subtract or multiply.", "date": "2026-11-09", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Word Problem Detective", "text": "Amy and her friends look for <b>clues</b>. 🔍 Today <b>you</b> look for clues in <b>word problems</b>!", "visual": {"kind": "emoji", "text": "🔍📖🐶"}}, {"type": "talk", "kick": "Book Talk", "title": "Clues in your book", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["Where did you stop reading?", "The puppy is <b>missing</b>. What clues help the girls look for it?", "If you were Amy, what would you do next?"], "starters": ["I stopped when …", "One clue is …", "If I were Amy, I would …"]}, {"type": "recall", "kick": "Remember?", "title": "Facts from Weeks 1 to 3", "items": [{"q": "8 × 6 = ?<br><small>Hint: double the 4s fact.</small>", "choices": ["42", "48", "54"], "a": 1, "why": "4 × 6 = 24. Double 24 is <b>48</b>.", "no": ["42 is 7 × 6. Find 4 × 6 first, then double it.", null, "54 is 9 × 6. Find 4 × 6 = 24, then double it."]}, {"q": "9 × 7 = ?<br><small>Hint: 10 sevens, take away one 7.</small>", "choices": ["63", "56", "72"], "a": 0, "why": "10 × 7 = 70. Take away one 7: 70 − 7 = <b>63</b>.", "no": [null, "56 is 8 × 7. You need 9 sevens.", "72 is 9 × 8. Use 10 × 7 = 70, then take away 7."]}, {"q": "There are <b>6 shelves</b>. Each shelf has <b>7 books</b>. Which number sentence fits?", "choices": ["6 + 7 = 13", "7 × 7 = 49", "6 × 7 = 42"], "a": 2, "why": "Each shelf has 7, so the groups are equal. <b>6 × 7 = 42</b>.", "no": ["Adding counts only one shelf of books. Every shelf has 7.", "There are 6 shelves, not 7.", null]}]}, {"type": "learn", "kick": "Learn", "title": "The 3 detective questions", "text": "Before you solve, ask <b>3 questions</b>.", "visual": {"kind": "emoji", "text": "🕵️"}, "steps": [{"text": "<b>1. What is happening?</b> Tell the story in your own words."}, {"text": "<b>2. Are there equal groups?</b> Look for <b>each</b>, <b>every</b> or <b>per</b>."}, {"text": "<b>3. Which operation?</b> ➕ add, ➖ subtract or ✖️ multiply?"}], "tip": "Do not grab the numbers first. Ask the questions first!"}, {"type": "learn", "kick": "Learn", "title": "Three kinds of stories", "text": "Most stories are one of these <b>3 kinds</b>.", "steps": [{"text": "➕ <b>Put together.</b> Two different amounts join.<br>Liz has 6 fish. Marion has 2 fish. How many fish?<br><b>Add:</b> 6 + 2 = 8", "visual": {"kind": "uneven", "sets": [6, 2], "emoji": "🐟"}}, {"text": "➖ <b>Take away or compare.</b> Some go away, or you find <b>how many more</b>.<br>There are 9 kittens. 3 go home. How many are left?<br><b>Subtract:</b> 9 − 3 = 6", "visual": {"kind": "bigtext", "text": "9 − 3 = 6"}}, {"text": "✖️ <b>Equal groups.</b> Every group has the same number.<br>There are 4 pens. Each pen has 5 rabbits.<br><b>Multiply:</b> 4 × 5 = 20", "visual": {"kind": "groups", "groups": 4, "each": 5, "emoji": "🐰"}}], "tip": "Equal groups → ✖️. Different amounts join → ➕. Some go away, or <b>how many more</b> → ➖."}, {"type": "sort", "kick": "Sort it", "title": "What is happening?", "text": "Tap a story. Then tap the right box.", "buckets": ["➕ Add<br><small>put together</small>", "➖ Subtract<br><small>take away or compare</small>", "✖️ Multiply<br><small>equal groups</small>"], "items": [{"text": "Amy's mom has 8 cages. Each cage has 2 rabbits.", "b": 2, "why": "<b>Each</b> cage has 2. Equal groups.", "hint": "Find the word <b>each</b>. Is every cage the same?"}, {"text": "Ellie had 15 stickers. She gave 6 to Liz.", "b": 1, "why": "Stickers went away. Subtract.", "hint": "Did Ellie get stickers or give some away?"}, {"text": "Marion rode her bike 7 miles. Then she rode 4 more miles.", "b": 0, "why": "7 miles and 4 miles join together. Add.", "hint": "Two different amounts join. Nothing goes away."}, {"text": "Liz has 12 crayons. Amy has 5. How many more does Liz have?", "b": 1, "why": "<b>How many more</b> means compare. 12 − 5.", "hint": "<b>How many more</b> asks you to compare."}, {"text": "There are 6 vans. Every van has 4 seats.", "b": 2, "why": "<b>Every</b> van has 4. Equal groups.", "hint": "Find the word <b>every</b>."}, {"text": "A puppy had 10 treats. It ate 7 of them.", "b": 1, "why": "7 treats are gone. Subtract.", "hint": "Did the treats join or go away?"}, {"text": "The club washed 5 dogs in the morning and 8 dogs after lunch.", "b": 0, "why": "5 and 8 are different amounts that join. Add.", "hint": "Are 5 and 8 equal groups?"}], "done": "Ask: What is happening? Then pick ➕, ➖ or ✖️."}, {"type": "learn", "kick": "Watch me", "title": "A detective at work", "text": "Amy's mom checks <b>7 dogs</b>. Each dog gets <b>4 treats</b>. How many treats?", "steps": [{"text": "<b>1. What is happening?</b> Every dog gets some treats."}, {"text": "<b>2. Equal groups?</b> Yes! <b>Each</b> dog gets 4."}, {"text": "<b>3. Which operation?</b> 7 groups of 4 → ✖️", "visual": {"kind": "groups", "groups": 7, "each": 4, "emoji": "🦴"}}, {"text": "<b>Solve.</b> 7 × 4 = <b>28</b> treats.", "visual": {"kind": "bigtext", "text": "7 × 4 = 28"}}, {"text": "<b>Check.</b> Double, double: 7 → 14 → <b>28</b>. ✔"}], "tip": "Draw it! Make 7 circles. Put 4 dots in each circle."}, {"type": "tap", "kick": "Try it", "title": "Which picture fits?", "items": [{"q": "Liz has <b>8 marbles</b>. She loses <b>3</b>. How many are left? Which picture fits?", "choices": ["8 marbles with 3 crossed out", "8 marbles and 3 more marbles", "3 groups of 8 marbles"], "a": 0, "why": "She <b>loses</b> 3, so cross 3 out. 8 − 3 = 5.", "no": [null, "She did not get more. She <b>lost</b> 3.", "There are no equal groups. Marbles went away."]}, {"q": "There are <b>3 hutches</b>. Each hutch has <b>6 bunnies</b>. How many bunnies? Which picture fits?", "choices": ["A group of 3 bunnies and a group of 6 bunnies", "6 hutches with 3 bunnies in each", "3 hutches with 6 bunnies in each"], "a": 2, "why": "3 groups, 6 in each. 3 × 6 = 18.", "no": ["That picture shows 3 + 6. But <b>each</b> hutch has 6.", "That switches them. How many <b>hutches</b>? 3.", null]}, {"q": "Marion has <b>5 hats</b>. Ellie has <b>7 hats</b>. How many hats in all? Which picture fits?", "choices": ["5 groups of 7 hats", "A group of 5 hats and a group of 7 hats", "7 hats with 5 crossed out"], "a": 1, "why": "Two different amounts join: 5 + 7 = 12.", "no": ["There are not 5 groups. Each girl has her own hats.", null, "No hats went away. The story asks how many <b>in all</b>."]}]}, {"type": "learn", "kick": "Learn", "title": "Watch out for trap words!", "text": "Some words can trick you. Read the <b>whole</b> story.", "steps": [{"text": "<b>\"In all\"</b> does not always mean add.<br>There are 5 packs. Each pack has 6 pencils. How many pencils <b>in all</b>?<br>Equal groups → <b>5 × 6 = 30</b>", "visual": {"kind": "groups", "groups": 5, "each": 6, "emoji": "✏️"}}, {"text": "<b>\"More\"</b> can mean add <b>or</b> subtract.<br>Liz has 9 pens. She gets 4 <b>more</b>. → <b>add</b>: 9 + 4 = 13"}, {"text": "Liz has 9 pens. Amy has 4 pens. <b>How many more</b> does Liz have? → <b>subtract</b>: 9 − 4 = 5"}], "tip": "<b>How many more</b> asks you to <b>compare</b>. Compare means subtract."}, {"type": "order", "kick": "Put in order", "title": "Detective steps", "text": "Tap the steps in the right order.", "steps": ["Read the whole story.", "What is happening?", "Are there equal groups?", "Pick ➕, ➖ or ✖️.", "Draw it and solve.", "Check: does it make sense?"], "why": "That is the detective routine! Read, ask 3 questions, solve, check.", "hint": "What do you do before anything else?"}, {"type": "talk", "kick": "Say it", "title": "Tell me a story", "text": "Make up your own stories. Your teacher will draw them.", "prompts": ["Tell a <b>multiply</b> story for <b>6 × 4</b>.", "Tell an <b>add</b> story for <b>6 + 4</b>.", "Tell a <b>subtract</b> story for <b>10 − 4</b>."], "starters": ["There are 6 … Each one has 4 …", "Amy has … Liz has …", "There were 10 … Then …"]}, {"type": "tap", "kick": "Try it", "title": "Solve like a detective", "items": [{"q": "The vet has <b>9 boxes</b> of bandages. Each box has <b>6</b> bandages. How many bandages?", "choices": ["15", "54", "45"], "a": 1, "why": "Equal groups: 9 × 6. 10 × 6 = 60. Take away one 6: <b>54</b>.", "no": ["15 is 9 + 6. That counts only one box. Every box has 6.", null, "45 is 9 × 5. Each box has 6, not 5."]}, {"q": "Amy has <b>14</b> dog treats. Ellie has <b>8</b>. How many more does Amy have?", "choices": ["22", "7", "6"], "a": 2, "why": "<b>How many more</b> → compare. 14 − 8 = <b>6</b>.", "no": ["22 is 14 + 8. <b>How many more</b> means subtract.", "Count up from 8 to 14: 9, 10, 11, 12, 13, 14. That is 6, not 7.", null]}, {"q": "Marion picks <b>8</b> apples. Liz picks <b>8</b> apples. Amy picks <b>8</b> apples. How many apples?", "choices": ["24", "16", "11"], "a": 0, "why": "3 girls each pick 8. Equal groups! 3 × 8 = <b>24</b>.", "no": [null, "16 is only 2 girls. Count the girls: 3.", "11 is 8 + 3. There are 3 groups of 8."]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "Ellie has <b>6 bags</b>. There are <b>8 marbles</b> in each bag. How many marbles in all?", "choices": ["14", "48", "42"], "a": 1, "why": "6 equal groups of 8. 6 × 8 = 48."}, {"q": "Liz had <b>17</b> stickers. She gave <b>9</b> to Amy. How many does Liz have now?", "choices": ["8", "26", "12"], "a": 0, "why": "She gave some away, so subtract. 17 − 9 = 8."}, {"q": "Which story needs <b>subtract</b>?", "choices": ["There are 4 cats. Each cat has 2 bowls.", "Amy has 12 pens. Marion has 7. How many more does Amy have?", "Liz walked 6 dogs. Then she walked 5 more dogs."], "a": 1, "why": "<b>How many more</b> means compare. 12 − 7 = 5."}, {"q": "<b>7 kids</b> each bring <b>4 cans</b> of dog food. Which number sentence fits?", "choices": ["7 + 4 = 11", "7 − 4 = 3", "7 × 4 = 28"], "a": 2, "why": "Each kid brings 4. 7 equal groups of 4: 7 × 4 = 28."}, {"q": "Which story matches this picture?", "visual": {"kind": "groups", "groups": 3, "each": 7, "emoji": "🐶"}, "choices": ["7 pens with 3 puppies in each pen", "3 puppies and 7 more puppies", "3 pens with 7 puppies in each pen"], "a": 2, "why": "The picture has 3 groups. Each group has 7."}, {"q": "Marion, Ellie, Liz and Amy each have <b>9</b> ribbons. How many ribbons?", "choices": ["36", "13", "27"], "a": 0, "why": "4 girls, 9 each. 4 × 9 = 36."}, {"q": "Amy read <b>28</b> pages on Monday. She read <b>16</b> pages on Tuesday. How many pages did she read?", "choices": ["12", "44", "34"], "a": 1, "why": "Different amounts join, so add. 28 + 16 = 44."}, {"q": "Ellie says: <i>8 vases. Each vase has 6 flowers. So 8 + 6 = 14 flowers.</i> What did she do wrong?", "choices": ["Nothing. 14 flowers is right.", "She should subtract: 8 − 6 = 2", "She added. Equal groups means multiply: 8 × 6 = 48"], "a": 2, "why": "Each vase has 6 flowers. That is equal groups. 8 × 6 = 48."}]}], "win": "Case closed! You are a real word problem detective!", "prev": "bb-bristol-L08", "prevTitle": "Lesson 8"});</script></body></html>
