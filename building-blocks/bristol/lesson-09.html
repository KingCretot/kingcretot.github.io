<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 9: Word Problem Detective</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L09", "label": "Lesson 9", "title": "Word Problem Detective", "goal": "I can ask 3 detective questions and pick add, subtract or multiply.", "date": "2026-11-09", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Detective Practice", "text": "You learned the <b>3 detective questions</b> with Jonathan. Now be a detective <b>on your own</b>! 🔍", "visual": {"kind": "emoji", "text": "🕵️📝🐾"}}, {"type": "learn", "kick": "Remember", "title": "The 3 detective questions", "text": "Ask these before you solve.", "steps": [{"text": "<b>1. What is happening?</b>"}, {"text": "<b>2. Are there equal groups?</b> Look for <b>each</b>, <b>every</b>, <b>per</b>."}, {"text": "<b>3. Which operation?</b> ➕ join different amounts · ➖ take away or compare · ✖️ equal groups"}], "tip": "<b>How many more</b> means compare. Compare means subtract."}, {"type": "talk", "kick": "Say it", "title": "Say it out loud", "text": "Say these out loud. You can tell your mom!", "prompts": ["Say the <b>3 detective questions</b> without looking.", "Tell an <b>equal groups</b> story about puppies.", "Tell a <b>take away</b> story about treats."], "starters": ["First I ask …", "There are … Each one has …", "There were … Then …"]}, {"type": "tap", "kick": "Your turn", "title": "Name the operation", "text": "Type <b>add</b>, <b>subtract</b> or <b>multiply</b>.", "items": [{"type": "fill", "q": "There are <b>4 kennels</b>. Each kennel has <b>5 puppies</b>. How many puppies?<br>Which operation?", "answers": ["multiply", "multiplication", "times", "x", "×"], "why": "<b>Each</b> kennel has 5. Equal groups → multiply. 4 × 5 = 20.", "no": "Look for the word <b>each</b>. Is every kennel the same?", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "Ellie picked <b>9</b> apples. Liz picked <b>6</b> apples. How many apples did they pick?<br>Which operation?", "answers": ["add", "addition", "plus", "+"], "why": "9 and 6 are different amounts. They join → add. 9 + 6 = 15.", "no": "Are 9 and 6 equal groups? Do they join or go away?", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "Marion had <b>16</b> balloons. <b>7</b> popped. How many are left?<br>Which operation?", "answers": ["subtract", "subtraction", "minus", "take away", "-", "−"], "why": "7 balloons went away → subtract. 16 − 7 = 9.", "no": "Did balloons join, or did some go away?", "placeholder": "add, subtract or multiply"}]}, {"type": "sort", "kick": "Sort it", "title": "Add, subtract or multiply?", "text": "Tap a story. Then tap the right box.", "buckets": ["➕ Add", "➖ Subtract", "✖️ Multiply"], "items": [{"text": "There are 3 bikes. Each bike has 2 wheels.", "b": 2, "why": "<b>Each</b> bike has 2. Equal groups.", "hint": "Find the word <b>each</b>."}, {"text": "Amy found 8 shells. Then she found 6 more.", "b": 0, "why": "She found <b>more</b>. 8 and 6 join. Add.", "hint": "Did shells join or go away?"}, {"text": "Liz has 20 grapes. Ellie has 12. How many more does Liz have?", "b": 1, "why": "<b>How many more</b> → compare → subtract.", "hint": "This story compares two girls."}, {"text": "Every one of the 5 kittens drinks 2 bowls of milk.", "b": 2, "why": "<b>Every</b> kitten drinks 2. Equal groups.", "hint": "Find the word <b>every</b>."}, {"text": "There were 14 kids at the park. 5 went home.", "b": 1, "why": "5 kids left. Take away.", "hint": "Did kids come or go?"}, {"text": "Marion has 4 red pens and 9 blue pens.", "b": 0, "why": "4 and 9 are different amounts. They join. Add.", "hint": "Are 4 and 9 equal groups?"}], "done": "Great detective work! Equal groups ✖️, join ➕, take away or compare ➖."}, {"type": "tap", "kick": "Solve it", "title": "Find the answer", "text": "Ask the 3 questions. Then type the answer.", "items": [{"type": "fill", "q": "There are <b>4 cages</b>. Each cage has <b>7 birds</b>. How many birds?", "answers": ["28"], "why": "Equal groups: 4 × 7. Double 7 is 14. Double 14 is <b>28</b>.", "no": "Each cage has 7. Make 4 groups of 7.", "hint": "Double, double: 7 → 14 → ?", "placeholder": "Type a number"}, {"type": "fill", "q": "Ellie had <b>25</b> beads. She used <b>9</b> on a bracelet. How many are left?", "answers": ["16"], "why": "She used some, so subtract. 25 − 9 = <b>16</b>. Check: 16 + 9 = 25.", "no": "She <b>used</b> beads. They went away.", "hint": "25 − 9. Take 10, then add 1 back.", "placeholder": "Type a number"}, {"type": "fill", "q": "Liz has <b>13</b> stickers. Amy has <b>8</b>. How many more does Liz have?", "answers": ["5"], "why": "<b>How many more</b> → compare. 13 − 8 = <b>5</b>.", "no": "How many more means compare. Subtract.", "hint": "Count up from 8 to 13.", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Picture it", "title": "Which picture fits?", "items": [{"q": "There are <b>2 bowls</b>. Each bowl has <b>9 fish snacks</b>. Which picture fits?", "choices": ["9 bowls with 2 snacks in each", "2 bowls with 9 snacks in each", "A bowl of 2 snacks and a bowl of 9 snacks"], "a": 1, "why": "2 bowls. 9 snacks in <b>each</b> bowl. 2 × 9 = 18.", "no": ["That switches them. How many <b>bowls</b>?", null, "<b>Each</b> bowl has 9. The bowls are equal."]}, {"q": "Amy had <b>11</b> marbles. She gave <b>4</b> to Liz. Which picture fits?", "choices": ["11 marbles and 4 more marbles", "4 groups of 11 marbles", "11 marbles with 4 crossed out"], "a": 2, "why": "She <b>gave away</b> 4, so cross them out. 11 − 4 = 7.", "no": ["Amy did not get more. She <b>gave</b> 4 away.", "There are no equal groups here.", null]}]}, {"type": "tap", "kick": "Trap words", "title": "Read the whole story", "items": [{"type": "fill", "q": "There are <b>7 packs</b>. Each pack has <b>3 bows</b>. How many bows <b>in all</b>?", "answers": ["21"], "why": "<b>In all</b> does not always mean add. Each pack has 3. 7 × 3 = <b>21</b>.", "no": "Each pack has 3. Is it equal groups?", "hint": "Skip count by 3s, 7 times.", "placeholder": "Type a number"}, {"type": "fill", "q": "Marion has <b>17</b> crayons. Liz has <b>9</b>. How many <b>more</b> does Marion have?", "answers": ["8"], "why": "<b>How many more</b> → compare. 17 − 9 = <b>8</b>.", "no": "Compare the two girls. Subtract.", "hint": "Count up from 9 to 17.", "placeholder": "Type a number"}, {"q": "Which words tell you to <b>compare</b>?", "choices": ["in all", "how many more", "each"], "a": 1, "why": "<b>How many more</b> asks you to compare. Then you subtract.", "no": ["<b>In all</b> can mean add or multiply. It does not compare.", null, "<b>Each</b> tells you the groups are equal."]}]}, {"type": "recall", "kick": "Remember?", "title": "Fact check", "items": [{"type": "fill", "q": "8 × ____ = 72", "answers": ["9"], "why": "8 × 9 = 72. Check: 10 eights is 80. Take away one 8: 72. ✔", "no": "What times 8 makes 72? Try 9.", "hint": "10 × 8 = 80. 80 − 8 = ?", "placeholder": "Type a number"}, {"type": "fill", "q": "____ × 8 = 56", "answers": ["7"], "why": "7 × 8 = 56. Remember 5, 6, 7, 8: 56 = 7 × 8.", "no": "What times 8 makes 56?", "hint": "Double the 4s: 7 × 4 = 28. Double 28.", "placeholder": "Type a number"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Ellie has <b>6 bags</b>. There are <b>8 marbles</b> in each bag. How many marbles in all?", "answers": ["48"], "why": "6 equal groups of 8. 6 × 8 = 48.", "no": "Each bag has 8. Is it equal groups?", "placeholder": "Type a number"}, {"type": "fill", "q": "Liz had <b>17</b> stickers. She gave <b>9</b> to Amy. How many does Liz have now?", "answers": ["8"], "why": "She gave some away, so subtract. 17 − 9 = 8.", "no": "Did stickers join or go away?", "placeholder": "Type a number"}, {"q": "Which story needs <b>subtract</b>?", "choices": ["There are 4 cats. Each cat has 2 bowls.", "Amy has 12 pens. Marion has 7. How many more does Amy have?", "Liz walked 6 dogs. Then she walked 5 more dogs."], "a": 1, "why": "<b>How many more</b> means compare. 12 − 7 = 5.", "no": ["<b>Each</b> cat has 2. That is multiply.", null, "She walked 5 <b>more</b>. They join. That is add."]}, {"q": "<b>7 kids</b> each bring <b>4 cans</b> of dog food. Which number sentence fits?", "choices": ["7 + 4 = 11", "7 − 4 = 3", "7 × 4 = 28"], "a": 2, "why": "Each kid brings 4. 7 equal groups of 4: 7 × 4 = 28.", "no": ["Each kid brings 4. That is equal groups.", "No cans go away.", null]}, {"q": "Which story matches this picture?", "visual": {"kind": "groups", "groups": 3, "each": 7, "emoji": "🐶"}, "choices": ["3 pens with 7 puppies in each pen", "7 pens with 3 puppies in each pen", "3 puppies and 7 more puppies"], "a": 0, "why": "The picture has 3 groups. Each group has 7.", "no": [null, "Count the groups in the picture. There are 3.", "The picture shows equal groups."]}, {"type": "fill", "q": "Marion, Ellie, Liz and Amy each have <b>9</b> ribbons. How many ribbons?", "answers": ["36"], "why": "4 girls, 9 each. 4 × 9 = 36.", "no": "Count the girls. Each one has 9.", "placeholder": "Type a number"}, {"type": "fill", "q": "Amy read <b>28</b> pages on Monday. She read <b>16</b> pages on Tuesday. How many pages did she read?", "answers": ["44"], "why": "Different amounts join, so add. 28 + 16 = 44.", "no": "28 and 16 are different. Do they join?", "placeholder": "Type a number"}, {"type": "fill", "q": "Ellie says: <i>8 vases. Each vase has 7 flowers. So 8 + 7 = 15 flowers.</i><br>How many flowers are there really?", "answers": ["56"], "why": "Each vase has 7. Equal groups, so multiply. 8 × 7 = 56.", "no": "Ellie added. Each vase has 7, so multiply.", "placeholder": "Type a number"}], [{"type": "fill", "q": "There are <b>7 tanks</b>. Each tank has <b>6 fish</b>. How many fish?", "answers": ["42"], "why": "7 equal groups of 6. 7 × 6 = 42.", "no": "Each tank has 6. Is it equal groups?", "placeholder": "Type a number"}, {"type": "fill", "q": "Marion had <b>23</b> crayons. She lost <b>8</b>. How many are left?", "answers": ["15"], "why": "She lost some, so subtract. 23 − 8 = 15.", "no": "Did crayons join or go away?", "placeholder": "Type a number"}, {"q": "Which story should you solve with <b>add</b>?", "choices": ["There are 5 boxes with 4 cups in each.", "Ellie had 14 cards. She gave away 6.", "Liz has 9 red beads and 7 blue beads."], "a": 2, "why": "9 red and 7 blue are different amounts that join. 9 + 7 = 16.", "no": ["4 cups in <b>each</b> box. That is multiply.", "She gave cards away. That is subtract.", null]}, {"q": "There are <b>9 bikes</b>. Every bike has <b>2 wheels</b>. Which number sentence fits?", "choices": ["9 × 2 = 18", "9 + 2 = 11", "9 − 2 = 7"], "a": 0, "why": "<b>Every</b> bike has 2. 9 equal groups of 2: 9 × 2 = 18.", "no": [null, "Every bike has 2 wheels. That is equal groups.", "No wheels go away."]}, {"q": "Look at the picture. Which story fits it?", "visual": {"kind": "groups", "groups": 4, "each": 6, "emoji": "🐱"}, "choices": ["6 baskets with 4 kittens in each", "4 baskets with 6 kittens in each", "4 kittens and 6 more kittens"], "a": 1, "why": "The picture has 4 groups. Each group has 6.", "no": ["Count the groups in the picture. There are 4.", null, "The picture shows equal groups."]}, {"type": "fill", "q": "Each of the <b>4</b> Critter Club girls brings <b>8</b> dog treats. How many treats?", "answers": ["32"], "why": "4 girls, 8 each. 4 × 8 = 32.", "no": "Each girl brings 8. Is it equal groups?", "placeholder": "Type a number"}, {"type": "fill", "q": "Liz counted <b>37</b> birds in the morning and <b>26</b> birds after lunch. How many birds did she count?", "answers": ["63"], "why": "Different amounts join, so add. 37 + 26 = 63.", "no": "37 and 26 are different. Do they join?", "placeholder": "Type a number"}, {"type": "fill", "q": "Marion says: <i>9 cages. Each cage has 4 mice. So 9 + 4 = 13 mice.</i><br>How many mice are there really?", "answers": ["36"], "why": "Each cage has 4. Equal groups, so multiply. 9 × 4 = 36.", "no": "Marion added. Each cage has 4, so multiply.", "placeholder": "Type a number"}], [{"type": "fill", "q": "There are <b>8 vans</b>. Each van has <b>7 kids</b>. How many kids?", "answers": ["56"], "why": "8 equal groups of 7. 8 × 7 = 56.", "no": "Each van has 7. Is it equal groups?", "placeholder": "Type a number"}, {"type": "fill", "q": "The vet had <b>31</b> bandages. She used <b>14</b>. How many are left?", "answers": ["17"], "why": "She used some, so subtract. 31 − 14 = 17.", "no": "Did bandages join or go away?", "placeholder": "Type a number"}, {"q": "Which story should you solve with <b>multiply</b>?", "choices": ["Amy has 6 hats and 8 scarves.", "There are 6 hutches. Each hutch has 3 rabbits.", "Liz had 18 bows. She lost 6."], "a": 1, "why": "<b>Each</b> hutch has 3. Equal groups: 6 × 3 = 18.", "no": ["Hats and scarves are different amounts. That is add.", null, "She lost bows. That is subtract."]}, {"q": "There are <b>5 plates</b>. Every plate has <b>9 grapes</b>. Which number sentence fits?", "choices": ["5 + 9 = 14", "9 × 9 = 81", "5 × 9 = 45"], "a": 2, "why": "<b>Every</b> plate has 9. 5 equal groups of 9: 5 × 9 = 45.", "no": ["Every plate has 9. That is equal groups.", "There are 5 plates, not 9.", null]}, {"q": "Which story does this picture show?", "visual": {"kind": "groups", "groups": 5, "each": 4, "emoji": "🐦"}, "choices": ["5 nests with 4 birds in each", "4 nests with 5 birds in each", "5 birds and 4 more birds"], "a": 0, "why": "The picture has 5 groups. Each group has 4.", "no": [null, "Count the groups in the picture. There are 5.", "The picture shows equal groups."]}, {"type": "fill", "q": "Amy fills <b>9</b> bowls. She puts <b>6</b> scoops in every bowl. How many scoops?", "answers": ["54"], "why": "9 bowls, 6 each. 9 × 6 = 54.", "no": "Every bowl has 6. Is it equal groups?", "placeholder": "Type a number"}, {"type": "fill", "q": "Ellie read <b>45</b> pages last week and <b>38</b> pages this week. How many pages did she read?", "answers": ["83"], "why": "Different amounts join, so add. 45 + 38 = 83.", "no": "45 and 38 are different. Do they join?", "placeholder": "Type a number"}, {"type": "fill", "q": "Liz says: <i>7 rows. Each row has 9 carrots. So 7 + 9 = 16 carrots.</i><br>How many carrots are there really?", "answers": ["63"], "why": "Each row has 9. Equal groups, so multiply. 7 × 9 = 63.", "no": "Liz added. Each row has 9, so multiply.", "placeholder": "Type a number"}]]}], "win": "Case closed! You are a real word problem detective!", "prev": "bb-bristol-L08", "prevTitle": "Lesson 8"});</script></body></html>
