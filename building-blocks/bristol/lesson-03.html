<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 3: Fours: Double, Double</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L03", "label": "Lesson 3", "title": "Fours: Double, Double", "goal": "I can find 4 times a number by doubling two times.", "date": "2026-10-26", "mastery": 85, "color": "#10AC84", "slides": [{"type": "hello", "title": "Fours: Double, Double", "text": "You know your <b>2s</b>. Today they help you with the <b>4s</b>. 🐾", "visual": {"kind": "emoji", "text": "🐾🐾 + 🐾🐾"}}, {"type": "talk", "kick": "Book Talk", "title": "The missing puppy", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["What is the big problem in the story?", "What has Amy done so far to fix it?", "What do you think will happen next? Why?"], "starters": ["The problem is …", "So far, Amy …", "I think … because …"]}, {"type": "recall", "kick": "Remember", "title": "From last week", "items": [{"q": "There are 5 baskets. Each basket has 3 kittens. Which number sentence fits?", "visual": {"kind": "groups", "groups": 5, "each": 3, "emoji": "🐱"}, "choices": ["5 + 3 = 8", "5 × 3 = 15", "3 × 3 = 9"], "a": 1, "why": "Each basket has 3, so the groups are equal. 5 groups of 3 is <b>5 × 3 = 15</b>.", "no": ["5 + 3 adds the baskets and the kittens. Count the kittens: there are 15.", null, "There are 5 baskets, not 3."]}, {"q": "An array has <b>2 rows of 5</b>. Which array has the <b>same</b> number?", "visual": {"kind": "array", "rows": 2, "cols": 5, "emoji": "🌼"}, "choices": ["2 rows of 7", "5 rows of 5", "5 rows of 2"], "a": 2, "why": "Turn it around! 2 × 5 = 10 and 5 × 2 = 10.", "no": ["2 rows of 7 is 14, not 10.", "5 rows of 5 is 25, not 10.", null]}, {"q": "Liz has 4 leashes. Marion has 5 leashes. How many leashes in all?", "visual": {"kind": "uneven", "sets": [4, 5], "emoji": "🦮"}, "choices": ["9", "20", "1"], "a": 0, "why": "4 and 5 are not equal groups, so add: <b>4 + 5 = 9</b>.", "no": [null, "20 is 4 × 5. But there are not 4 groups of 5. Add the two amounts.", "1 is what is left if you take away. Nobody took leashes away."]}]}, {"type": "learn", "kick": "Learn", "title": "4 groups = 2 groups + 2 groups", "text": "<b>4 × 3</b> means <b>4 groups of 3</b>.", "visual": {"kind": "groups", "groups": 4, "each": 3, "emoji": "🦴"}, "steps": [{"text": "Split the 4 groups into <b>2 groups</b> and <b>2 more groups</b>.", "visual": {"kind": "groups", "groups": 2, "each": 3, "emoji": "🦴"}}, {"text": "<b>2 × 3 = 6</b>. You know that one!"}, {"text": "The other 2 groups are 6 too. <b>Double</b> 6: <b>6 + 6 = 12</b>.", "visual": {"kind": "bigtext", "text": "4 × 3 = 12"}}], "tip": "4 is 2 and 2. So <b>×4</b> is <b>double, then double again</b>."}, {"type": "tap", "kick": "Warm up", "title": "Doubling", "text": "Double means add a number to itself.", "items": [{"q": "What is <b>double 7</b>?", "choices": ["49", "14", "9"], "a": 1, "why": "Double 7 is <b>7 + 7 = 14</b>.", "no": ["49 is 7 × 7. Double means 2 × 7.", null, "9 is 7 + 2. Double means 7 + 7."]}, {"q": "What is <b>double 14</b>?", "choices": ["28", "24", "18"], "a": 0, "why": "<b>14 + 14 = 28</b>. 4 + 4 = 8 ones, 1 + 1 = 2 tens.", "no": [null, "Check the tens: 1 ten + 1 ten = 2 tens. Check the ones: 4 + 4 = 8.", "18 is 14 + 4. Double means 14 + 14."]}, {"q": "What is <b>double 18</b>?", "choices": ["26", "216", "36"], "a": 2, "why": "<b>18 + 18</b>: 8 + 8 = 16 ones. Regroup 10 ones as 1 ten. 1 + 1 + 1 = 3 tens. So <b>36</b>.", "no": ["You forgot to regroup. 8 + 8 = 16, so carry 1 ten.", "16 ones is 1 ten and 6 ones. Carry the ten. Don't write 16.", null]}]}, {"type": "learn", "kick": "Learn", "title": "Double, double: 4 × 6", "text": "Let's find <b>4 × 6</b>.", "visual": {"kind": "array", "rows": 4, "cols": 6, "emoji": "🐾", "label": "4 rows of 6"}, "steps": [{"text": "<b>Double 1:</b> 2 × 6 = <b>12</b>. That is the top 2 rows."}, {"text": "<b>Double 2:</b> double 12. <b>12 + 12 = 24</b>. That is all 4 rows."}, {"text": "So <b>4 × 6 = 24</b>.", "visual": {"kind": "bigtext", "text": "6 → 12 → 24", "sub": "double, double"}}], "tip": "Say it out loud: <b>double 6 is 12, double 12 is 24</b>."}, {"type": "learn", "kick": "Learn", "title": "Check it on a number line", "text": "<b>4 × 8</b> is 4 jumps of 8.", "visual": {"kind": "numberline", "start": 0, "jump": 8, "jumps": 4}, "steps": [{"text": "After <b>2 jumps</b> you are at <b>16</b>. That is 2 × 8."}, {"text": "2 more jumps is 16 more. <b>16 + 16 = 32</b>."}, {"text": "So <b>4 × 8 = 32</b>. The halfway number, doubled!"}], "tip": "You can also count by 4s: 4, 8, 12, 16, 20, 24, 28, 32. That is 8 jumps of 4. Same answer!"}, {"type": "order", "kick": "Put in order", "title": "How to do 4 × 7", "text": "Tap the steps in the right order.", "steps": ["Read the fact: 4 × 7", "Think: 2 × 7 = 14", "Double 14: 14 + 14 = 28", "Say it: 4 × 7 = 28"], "why": "Read it, find the 2s fact, double it, then say the whole fact.", "hint": "First find the 2s fact. Then double it."}, {"type": "build", "kick": "Build it", "title": "Dog bowls at the vet", "text": "Amy's mom fills <b>4 bowls</b>. She puts <b>4 treats</b> in each bowl. Make the groups.", "groups": 4, "each": 4, "emoji": "🦴", "why": "4 groups of 4. Double 4 is 8. Double 8 is 16. <b>4 × 4 = 16</b>.", "hint": "How many bowls? How many treats in each bowl?"}, {"type": "tap", "kick": "Try it", "title": "Use double, double", "items": [{"q": "<b>4 × 9 = ?</b>", "choices": ["18", "36", "32"], "a": 1, "why": "Double 9 is 18. Double 18 is <b>36</b>.", "no": ["18 is only the first double. That is 2 × 9. Double again!", null, "32 is 4 × 8. Count the 9s again."]}, {"q": "Which shows <b>double, double</b> for <b>4 × 8</b>?", "choices": ["8, 16, 24", "4, 8, 16", "8, 16, 32"], "a": 2, "why": "Start at 8. Double it: 16. Double again: <b>32</b>.", "no": ["16 + 8 is not a double. 16 doubled is 32.", "Start with the 8, not the 4. 4, 8, 16 is doubling 4.", null]}, {"q": "<b>4 × 7 = ?</b>", "choices": ["14", "28", "24"], "a": 1, "why": "Double 7 is 14. Double 14 is <b>28</b>.", "no": ["You stopped after one double. Double 14 too!", null, "24 is 4 × 6. Check: 14 + 14 = ?"]}]}, {"type": "sort", "kick": "Sort it", "title": "Same answer, same box", "text": "Tap a card. Then tap the box with its answer.", "buckets": ["24", "28", "32"], "items": [{"text": "4 × 6", "b": 0, "why": "Double 6 is 12. Double 12 is 24.", "hint": "Double 6. Then double again."}, {"text": "double 14", "b": 1, "why": "14 + 14 = 28.", "hint": "Add 14 + 14."}, {"text": "4 × 8", "b": 2, "why": "Double 8 is 16. Double 16 is 32.", "hint": "Double 8. Then double again."}, {"text": "double 12", "b": 0, "why": "12 + 12 = 24.", "hint": "Add 12 + 12."}, {"text": "7 × 4", "b": 1, "why": "Turn it around: 4 × 7. Double 7 is 14, double 14 is 28.", "hint": "7 × 4 is the same as 4 × 7."}, {"text": "double 16", "b": 2, "why": "16 + 16 = 32.", "hint": "6 + 6 = 12 ones. Regroup!"}], "done": "Double, double gives the 4s fact every time."}, {"type": "tap", "kick": "Try it", "title": "Word problems", "text": "Equal groups? Multiply. Not equal? Add.", "items": [{"q": "Marion has 4 bags. Each bag has 8 dog bones. How many bones?", "visual": {"kind": "groups", "groups": 4, "each": 8, "emoji": "🦴"}, "choices": ["32", "12", "16"], "a": 0, "why": "4 equal groups of 8. Double 8 is 16, double 16 is <b>32</b>.", "no": [null, "12 is 4 + 8. Each bag has 8, so the groups are equal. Multiply.", "16 is only 2 bags. There are 4 bags."]}, {"q": "Ellie fed 4 dogs in the morning. She fed 6 dogs after lunch. How many dogs?", "visual": {"kind": "uneven", "sets": [4, 6], "emoji": "🐕"}, "choices": ["24", "10", "2"], "a": 1, "why": "4 and 6 are different amounts. Add: <b>4 + 6 = 10</b>.", "no": ["There are not 4 groups of 6. There is one group of 4 and one group of 6.", null, "Nobody left. Put the two groups together."]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "<b>4 × 3 = ?</b>", "visual": {"kind": "array", "rows": 4, "cols": 3, "emoji": "🐾"}, "choices": ["12", "7", "16"], "a": 0, "why": "Double 3 is 6. Double 6 is 12."}, {"q": "For <b>4 × 9</b>, Liz says: double 9 is 18. What is next?", "choices": ["Add 4 to 18", "Double 18", "Stop. The answer is 18."], "a": 1, "why": "Double again: 18 + 18 = 36."}, {"q": "<b>4 × 7 = ?</b>", "choices": ["24", "11", "28"], "a": 2, "why": "Double 7 is 14. Double 14 is 28."}, {"q": "Count by 4s: 16, 20, 24, ___", "choices": ["26", "28", "30"], "a": 1, "why": "24 + 4 = 28."}, {"q": "The vet has 4 shelves. Each shelf has 6 jars. How many jars?", "choices": ["24", "10", "12"], "a": 0, "why": "4 equal groups of 6: 4 × 6 = 24."}, {"q": "Which is the same as <b>4 × 8</b>?", "choices": ["8 + 8", "16 + 16", "4 + 8"], "a": 1, "why": "2 × 8 = 16. Double it: 16 + 16 = 32."}, {"q": "Liz washed 4 dogs. Then she washed 9 more dogs. How many dogs did she wash?", "choices": ["13", "36", "5"], "a": 0, "why": "4 and 9 are not equal groups. Add: 4 + 9 = 13."}, {"q": "Which fact is <b>wrong</b>?", "choices": ["4 × 6 = 24", "4 × 8 = 32", "4 × 7 = 24"], "a": 2, "why": "4 × 7 = 28, not 24."}]}], "win": "Double, double! You are a 4s star!", "prev": "bb-bristol-L02", "prevTitle": "Lesson 2"});</script></body></html>
