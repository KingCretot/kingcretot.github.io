itle": "From Lesson 2", "items": [{"type": "fill", "q": "There are 4 cages. <b>Every</b> cage has 2 birds. How many birds?", "visual": {"kind": "groups", "groups": 4, "each": 2, "emoji": "🐦"}, "answers": ["8", "eight"], "why": "4 groups of 2: <b>4 × 2 = 8</b>.", "no": "Every cage has 2. Skip count by 2s, one time for each cage.", "placeholder": "Type a number"}, {"type": "fill", "q": "Ellie has 10 red beads and 4 green beads. To find how many in all, do you multiply or add? Type <b>multiply</b> or <b>add</b>.", "answers": ["add", "plus", "addition", "+", "adding"], "why": "10 and 4 are not equal groups, so <b>add</b>: 10 + 4 = 14.", "no": "Is there a clue word? Is 10 the same as 4?", "placeholder": "multiply or add"}]}, {"type": "learn", "kick": "Remember", "title": "Double, double", "text": "<b>4 × 6</b>: double 6 is 12. Double 12 is 24.", "visual": {"kind": "bigtext", "text": "6 → 12 → 24", "sub": "4 × 6 = 24"}, "tip": "Find the 2s fact. Then double it."}, {"type": "tap", "kick": "Try it", "title": "Doubles", "items": [{"type": "fill", "q": "What is <b>double 8</b>?", "answers": ["16", "sixteen"], "why": "8 + 8 = <b>16</b>.", "no": "Double means 8 + 8.", "placeholder": "Type a number"}, {"type": "fill", "q": "What is <b>double 9</b>?", "answers": ["18", "eighteen"], "why": "9 + 9 = <b>18</b>.", "no": "Double means 9 + 9.", "placeholder": "Type a number"}, {"type": "fill", "q": "What is <b>double 16</b>?", "answers": ["32", "thirty-two", "thirty two"], "why": "16 + 16: 6 + 6 = 12 ones. Regroup. 1 + 1 + 1 = 3 tens. <b>32</b>.", "no": "Add the ones first: 6 + 6 = 12. Regroup!", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Try it", "title": "Two doubles", "items": [{"type": "fill", "q": "<b>4 × 3</b>. Double 3 is 6. Double 6 is ____.", "answers": ["12", "twelve"], "why": "6 + 6 = <b>12</b>. So 4 × 3 = 12.", "no": "Double 6 means 6 + 6.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>4 × 7</b>. First, double 7 is ____.", "answers": ["14", "fourteen"], "why": "7 + 7 = <b>14</b>.", "no": "Double 7 means 7 + 7.", "placeholder": "Type a number"}, {"type": "fill", "q": "Now double 14. So 4 × 7 = ____.", "answers": ["28", "twenty-eight", "twenty eight"], "why": "14 + 14 = <b>28</b>. So 4 × 7 = 28.", "no": "Add 14 + 14. Ones first.", "placeholder": "Type a number"}]}, {"type": "order", "kick": "Put in order", "title": "How to do 4 × 9", "text": "Tap the steps in the right order.", "steps": ["Read the fact: 4 × 9", "Think: 2 × 9 = 18", "Double 18: 18 + 18 = 36", "Say it: 4 × 9 = 36"], "why": "Read it, find the 2s fact, double it, then say the whole fact.", "hint": "Start by reading the fact. Next, find the 2s fact. Then double it."}, {"type": "build", "kick": "Build it", "title": "Seed rows", "text": "Marion plants <b>4 rows</b>. She puts <b>8 seeds</b> in each row. Make the groups.", "groups": 4, "each": 8, "emoji": "🌱", "why": "4 groups of 8. Double 8 is 16. Double 16 is <b>32</b>.", "hint": "Each row is one group. <b>Groups</b> = how many rows. <b>In each group</b> = seeds in one row."}, {"type": "tap", "kick": "Try it", "title": "4s facts", "items": [{"type": "fill", "q": "<b>4 × 10 = ?</b>", "answers": ["40", "forty"], "why": "Double 10 is 20. Double 20 is <b>40</b>.", "no": "Double 10. Then double again.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>6 × 4 = ?</b>", "answers": ["24", "twenty-four", "twenty four"], "why": "Turn it around: 4 × 6. Double 6 is 12. Double 12 is <b>24</b>.", "no": "6 × 4 is the same as 4 × 6.", "placeholder": "Type a number"}, {"q": "Which shows double, double for <b>4 × 9</b>?", "choices": ["9, 18, 27", "9, 18, 36", "4, 8, 16"], "a": 1, "why": "Start at 9. Double: 18. Double again: <b>36</b>.", "no": ["18 + 9 is not a double. Double 18 is 36.", null, "Start with the 9, not the 4."]}]}, {"type": "tap", "kick": "Try it", "title": "Word problems", "text": "Equal groups? Multiply. Not equal? Add.", "items": [{"type": "fill", "q": "There are 4 dogs. <b>Each</b> dog has 7 spots. How many spots?", "answers": ["28", "twenty-eight", "twenty eight"], "why": "4 equal groups of 7. Double 7 is 14. Double 14 is <b>28</b>.", "no": "Each dog has 7. Double, double.", "placeholder": "Type a number"}, {"type": "fill", "q": "Amy has 4 hats. Liz has 3 hats. How many hats in all?", "answers": ["7", "seven"], "why": "4 and 3 are not equal groups. Add: <b>4 + 3 = 7</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "<b>4 × 3 = ?</b>", "visual": {"kind": "array", "rows": 4, "cols": 3, "emoji": "🐾"}, "answers": ["12", "twelve"], "why": "Double 3 is 6. Double 6 is <b>12</b>.", "no": "Double 3. Then double again.", "placeholder": "Type a number"}, {"q": "For <b>4 × 9</b>, Liz says: double 9 is 18. What is next?", "choices": ["Add 4 to 18", "Double 18", "Stop. The answer is 18."], "a": 1, "why": "Double again: <b>18 + 18 = 36</b>.", "no": ["Adding 4 is not a double. 18 + 4 = 22, not 4 × 9.", null, "18 is only 2 × 9. You need 4 groups. Double again."]}, {"type": "fill", "q": "<b>4 × 7 = ?</b>", "answers": ["28", "twenty-eight", "twenty eight"], "why": "Double 7 is 14. Double 14 is <b>28</b>.", "no": "Double 7. Then double again.", "placeholder": "Type a number"}, {"type": "fill", "q": "Count by 4s: 16, 20, 24, ____", "answers": ["28", "twenty-eight", "twenty eight"], "why": "24 + 4 = <b>28</b>.", "no": "Add 4 to the last number.", "placeholder": "Type a number"}, {"type": "fill", "q": "The vet has 4 shelves. <b>Each</b> shelf has 6 jars. How many jars?", "answers": ["24", "twenty-four", "twenty four"], "why": "4 equal groups of 6: double 6 is 12, double 12 is <b>24</b>.", "no": "Each shelf has 6. Double, double.", "placeholder": "Type a number"}, {"q": "Which is the same as <b>4 × 8</b>?", "choices": ["16 + 16", "8 + 8", "4 + 8"], "a": 0, "why": "2 × 8 = 16. Double it: <b>16 + 16 = 32</b>.", "no": [null, "8 + 8 is only 2 × 8. Double that again.", "4 + 8 adds. 4 × 8 means 4 groups of 8."]}, {"type": "fill", "q": "Liz washed 4 dogs. Then she washed 9 more dogs. How many dogs did she wash?", "answers": ["13", "thirteen"], "why": "4 and 9 are not equal groups. Add: <b>4 + 9 = 13</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}, {"q": "Liz wrote <b>4 × 7 = 24</b>. What is wrong?", "choices": ["Nothing. She is right.", "It should be <b>28</b>.", "It should be <b>14</b>."], "a": 1, "why": "Double 7 is 14. Double 14 is <b>28</b>. So 4 × 7 = 28, not 24.", "no": ["24 is 4 × 6. Double 7, then double again.", null, "14 is only double 7. Double again."]}], [{"type": "fill", "q": "<b>4 × 6 = ?</b>", "visual": {"kind": "array", "rows": 4, "cols": 6, "emoji": "🌸"}, "answers": ["24", "twenty-four", "twenty four"], "why": "Double 6 is 12. Double 12 is <b>24</b>.", "no": "Double 6. Then double again.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>4 × 9</b>: double 9 is 18. Double 18 is ____.", "answers": ["36", "thirty-six", "thirty six"], "why": "18 + 18 = <b>36</b>. So 4 × 9 = 36.", "no": "Add 18 + 18. Regroup the ones!", "placeholder": "Type a number"}, {"q": "Which shows double, double for <b>4 × 7</b>?", "choices": ["7, 14, 21", "4, 8, 16", "7, 14, 28"], "a": 2, "why": "Start at 7. Double: 14. Double again: <b>28</b>.", "no": ["14 + 7 is not a double. Double 14 is 28.", "Start with the 7, not the 4.", null]}, {"type": "fill", "q": "Count by 4s: 24, 28, 32, ____", "answers": ["36", "thirty-six", "thirty six"], "why": "32 + 4 = <b>36</b>.", "no": "Add 4 to the last number.", "placeholder": "Type a number"}, {"type": "fill", "q": "Amy's mom has 4 cages. <b>Each</b> cage has 8 mice. How many mice?", "answers": ["32", "thirty-two", "thirty two"], "why": "4 equal groups of 8: double 8 is 16, double 16 is <b>32</b>.", "no": "Each cage has 8. Double, double.", "placeholder": "Type a number"}, {"q": "Which is the same as <b>4 × 6</b>?", "choices": ["6 + 6", "12 + 12", "4 + 6"], "a": 1, "why": "2 × 6 = 12. Double it: <b>12 + 12 = 24</b>.", "no": ["6 + 6 is only 2 × 6. Double that again.", null, "4 + 6 adds. 4 × 6 means 4 groups of 6."]}, {"type": "fill", "q": "Ellie has 4 stickers. Marion gives her 7 more. How many stickers does Ellie have now?", "answers": ["11", "eleven"], "why": "4 and 7 are not equal groups. Add: <b>4 + 7 = 11</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}, {"q": "Mia says <b>4 × 9 = 18</b>. What did she do?", "choices": ["She doubled only one time.", "She added 9 + 9 + 9.", "She is right."], "a": 0, "why": "Double 9 is 18. She had to double again: <b>36</b>.", "no": [null, "9 + 9 + 9 = 27, not 18.", "4 × 9 is not 18. Double 18 to get 4 groups."]}], [{"type": "fill", "q": "<b>4 × 10 = ?</b>", "answers": ["40", "forty"], "why": "Double 10 is 20. Double 20 is <b>40</b>.", "no": "Double 10. Then double again.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>9 × 4 = ?</b>", "answers": ["36", "thirty-six", "thirty six"], "why": "Turn it around: 4 × 9. Double 9 is 18, double 18 is <b>36</b>.", "no": "9 × 4 is the same as 4 × 9.", "placeholder": "Type a number"}, {"q": "For <b>4 × 6</b>, Amy says: double 6 is 12. What is next?", "choices": ["Double 12", "Add 6 to 12", "Stop. The answer is 12."], "a": 0, "why": "Double again: <b>12 + 12 = 24</b>.", "no": [null, "Adding 6 is not a double. 12 + 6 = 18.", "12 is only 2 × 6. You need 4 groups. Double again."]}, {"type": "fill", "q": "Count by 4s: 8, 12, 16, ____", "answers": ["20", "twenty"], "why": "16 + 4 = <b>20</b>.", "no": "Add 4 to the last number.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 4 trays. <b>Every</b> tray has 7 cupcakes. How many cupcakes?", "answers": ["28", "twenty-eight", "twenty eight"], "why": "4 equal groups of 7: double 7 is 14, double 14 is <b>28</b>.", "no": "Every tray has 7. Double, double.", "placeholder": "Type a number"}, {"q": "Which is the same as <b>4 × 9</b>?", "choices": ["9 + 9", "4 + 9", "18 + 18"], "a": 2, "why": "2 × 9 = 18. Double it: <b>18 + 18 = 36</b>.", "no": ["9 + 9 is only 2 × 9. Double that again.", "4 + 9 adds. 4 × 9 means 4 groups of 9.", null]}, {"type": "fill", "q": "Marion has 8 books. Liz has 4 books. How many books in all?", "answers": ["12", "twelve"], "why": "8 and 4 are not equal groups. Add: <b>8 + 4 = 12</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}, {"q": "Amy wrote <b>4 × 6 = 20</b>. What is wrong?", "choices": ["It should be <b>12</b>.", "Nothing. She is right.", "It should be <b>24</b>."], "a": 2, "why": "Double 6 is 12. Double 12 is <b>24</b>. So 4 × 6 = 24, not 20.", "no": ["12 is only double 6. Double again.", "20 is 4 × 5. Double 6, then double again.", null]}]]}], "win": "Double, double! You are a 4s star!", "prev": "bb-bristol-L02", "prevTitle": "Lesson 2"});</script></body></html>
