<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 10: Price Tags and Totals</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L10", "label": "Lesson 10", "title": "Price Tags and Totals", "goal": "I can find the total cost when things have the same price.", "date": "2026-11-10", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Price Tags and Totals", "text": "Pretend the Critter Club has a <b>pet shop sale</b>. 🏷️ Today you find out what things <b>cost</b>!", "visual": {"kind": "emoji", "text": "🏷️💵🐶"}}, {"type": "talk", "kick": "Book Talk", "title": "What happened next?", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["What happened in the part you read since Monday?", "What <b>clue</b> did you find? Tell me about it.", "If Amy could buy one thing for the puppy, what should it be? Why?"], "starters": ["In my reading, …", "The clue was …", "Amy should buy … because …"]}, {"type": "recall", "kick": "Remember?", "title": "Detective review", "items": [{"q": "Liz has <b>16</b> beads. Marion has <b>9</b> beads. How many more does Liz have?", "choices": ["25", "7", "8"], "a": 1, "why": "<b>How many more</b> → compare. 16 − 9 = <b>7</b>.", "no": ["25 is 16 + 9. <b>How many more</b> means subtract.", null, "Check: 8 + 9 = 17, not 16. Count up from 9 to 16."]}, {"q": "6 × 9 = ?<br><small>Hint: 10 groups, take away one.</small>", "choices": ["54", "56", "63"], "a": 0, "why": "10 × 6 = 60. Take away one 6: 60 − 6 = <b>54</b>.", "no": [null, "56 is 7 × 8. Try 10 × 6 = 60, then take away 6.", "63 is 7 × 9. There are 6 nines here."]}, {"q": "Which story is <b>equal groups</b>?", "choices": ["Amy has 5 hats and 3 scarves.", "Ellie had 9 bows. She lost 2.", "There are 6 cages with 3 birds in each."], "a": 2, "why": "Each cage has 3 birds. Equal groups → multiply.", "no": ["5 and 3 are different amounts. That is add.", "She <b>lost</b> 2. That is subtract.", null]}]}, {"type": "learn", "kick": "Learn", "title": "What is a price?", "text": "The <b>price</b> is what <b>one</b> thing costs.", "visual": {"kind": "bigtext", "text": "🦴 $4 each", "sub": "Each bone costs 4 dollars."}, "steps": [{"text": "<b>$4 each</b> means one bone costs 4 dollars."}, {"text": "<b>$4 per bone</b> means the same thing."}, {"text": "<b>$4 a bone</b> means the same thing too!"}], "tip": "<b>each</b>, <b>per</b> and <b>a</b> tell you every one costs the same. That is equal groups!"}, {"type": "vocab", "kick": "Words", "title": "Shop words", "text": "Tap each card to flip it. Say the word. Then <b>spell</b> it out loud.", "words": [{"word": "price", "pos": "noun", "meaning": "What <b>one</b> thing costs.", "example": "The <b>price</b> of a ball is $5.", "emoji": "🏷️"}, {"word": "total", "pos": "noun", "meaning": "The whole amount, all put together.", "example": "3 balls at $5 each. The <b>total</b> is $15.", "emoji": "💰"}, {"word": "factor", "pos": "noun", "meaning": "A number you multiply.", "example": "In 3 × 5, the <b>factors</b> are 3 and 5.", "emoji": "✖️"}, {"word": "product", "pos": "noun", "meaning": "The answer when you multiply.", "example": "In 3 × 5 = 15, the <b>product</b> is 15.", "emoji": "🎯"}, {"word": "multiple", "pos": "noun", "meaning": "A number you land on when you skip count.", "example": "10, 15 and 20 are <b>multiples</b> of 5.", "emoji": "🦘"}]}, {"type": "learn", "kick": "Learn", "title": "Skip count the money", "text": "Collars cost <b>$5 each</b>. Ellie buys <b>6</b> collars.", "steps": [{"text": "Make one jump of 5 for each collar.", "visual": {"kind": "numberline", "start": 0, "jump": 5, "jumps": 6}}, {"text": "6 jumps land on <b>30</b>. So 6 × 5 = <b>30</b>. The total is <b>$30</b>.", "visual": {"kind": "bigtext", "text": "6 × $5 = $30"}}, {"text": "Now $10 each. Ellie buys 4 leashes: 10, 20, 30, 40. The total is <b>$40</b>.", "visual": {"kind": "numberline", "start": 0, "jump": 10, "jumps": 4}}], "tip": "Each jump is one thing you buy. The last number is the total."}, {"type": "tap", "kick": "Try it", "title": "Count the money", "items": [{"q": "Fish food costs <b>$5 a box</b>. Amy buys <b>7</b> boxes. What is the total?", "choices": ["$12", "$35", "$30"], "a": 1, "why": "Skip count 7 jumps: 5, 10, 15, 20, 25, 30, <b>35</b>. 7 × 5 = 35.", "no": ["$12 is 5 + 7. Each box costs $5. Skip count 7 times.", null, "$30 is only 6 jumps. Count the boxes: 7."]}, {"q": "Each bag of hay costs <b>$10</b>. The club buys <b>8</b> bags. What is the total?", "choices": ["$80", "$18", "$70"], "a": 0, "why": "8 jumps of 10: 10, 20, 30, 40, 50, 60, 70, <b>80</b>.", "no": [null, "$18 is 10 + 8. Each bag costs $10.", "$70 is 7 bags. Count again: 8 bags."]}, {"q": "Liz counts her $5 bills: 5, 10, 15, 20, 25, 30, 35, 40, 45. How many bills does she have?", "choices": ["45", "8", "9"], "a": 2, "why": "Count the jumps, not the last number. There are <b>9</b> numbers, so 9 bills.", "no": ["$45 is how much money. The question asks how many <b>bills</b>.", "Point to each number as you count. There are 9.", null]}]}, {"type": "learn", "kick": "Learn", "title": "Price × how many", "text": "When every thing costs the same, <b>multiply</b>.", "visual": {"kind": "bigtext", "text": "how many × price = total", "sub": "Price × how many works too. It is the same total!"}, "steps": [{"text": "Toy mice cost <b>$4 each</b>. Marion buys <b>6</b>.", "visual": {"kind": "groups", "groups": 6, "each": 4, "emoji": "💵", "label": "6 toy mice. $4 for each one."}}, {"text": "<b>6 × 4</b>. Double 6 is 12. Double 12 is <b>24</b>."}, {"text": "The total is <b>$24</b>.", "visual": {"kind": "bigtext", "text": "6 × $4 = $24"}}], "tip": "The price and the how many are the <b>factors</b>. The total is the <b>product</b>."}, {"type": "build", "kick": "Build it", "title": "Ellie's dog toys", "text": "Dog toys cost <b>$6 each</b>. Ellie buys <b>3</b>. Make one group of $6 for each toy.", "groups": 3, "each": 6, "emoji": "💵", "why": "3 groups of $6. 3 × 6 = <b>$18</b>.", "hint": "Make one group for each toy. Put $6 in each group."}, {"type": "learn", "kick": "Learn", "title": "Not every money story is ✖️", "text": "Ask the detective questions first.", "steps": [{"text": "✖️ <b>Same price, many things.</b> 5 bowls at $3 each → 5 × 3 = <b>$15</b>"}, {"text": "➕ <b>Different things together.</b> A leash is $9. A collar is $6. Buy both → 9 + 6 = <b>$15</b>"}, {"text": "➖ <b>Compare costs.</b> A bed is $12. A blanket is $7. How much <b>more</b> is the bed? 12 − 7 = <b>$5</b>"}], "tip": "Is it the same price for each thing? Then multiply. If not, add or compare."}, {"type": "sort", "kick": "Sort it", "title": "Multiply, add or subtract?", "text": "Tap a money story. Then tap the right box.", "buckets": ["✖️ Multiply<br><small>same price, many things</small>", "➕ Add<br><small>different things</small>", "➖ Subtract<br><small>spend or compare</small>"], "items": [{"text": "4 brushes at $5 each. What is the total?", "b": 0, "why": "Every brush is $5. 4 × 5.", "hint": "Does every brush cost the same?"}, {"text": "A ball is $3 and a rope toy is $8. What do both cost?", "b": 1, "why": "Two different prices join. 3 + 8.", "hint": "Are the prices the same?"}, {"text": "A cage is $20. A bed is $14. How much more is the cage?", "b": 2, "why": "<b>How much more</b> → compare. 20 − 14.", "hint": "This asks you to compare two prices."}, {"text": "Liz has $15. She spends $6. How much is left?", "b": 2, "why": "She <b>spends</b> money, so it goes away. 15 − 6.", "hint": "Does Liz get money or spend it?"}, {"text": "Every bag of treats is $7. Amy buys 3 bags.", "b": 0, "why": "Every bag is $7. 3 × 7.", "hint": "Find the word <b>every</b>."}, {"text": "Ellie buys a $10 net and a $5 bowl.", "b": 1, "why": "Two different things, two different prices. 10 + 5.", "hint": "Is it many things at the same price?"}], "done": "Same price → ✖️. Different things → ➕. Spend or compare → ➖."}, {"type": "tap", "kick": "Try it", "title": "Shop problems", "items": [{"q": "Collars cost <b>$8 each</b>. Marion buys <b>4</b>. What is the total?", "choices": ["$12", "$32", "$36"], "a": 1, "why": "4 × 8. Double 8 is 16. Double 16 is <b>32</b>.", "no": ["$12 is 8 + 4. She buys 4 collars at $8 each.", null, "$36 is 4 × 9. The price is $8."]}, {"q": "A dog bed costs <b>$15</b>. A cat bed costs <b>$9</b>. How much <b>more</b> is the dog bed?", "choices": ["$6", "$24", "$5"], "a": 0, "why": "Compare: 15 − 9 = <b>6</b>.", "no": [null, "$24 is 15 + 9. <b>How much more</b> means subtract.", "Check: 5 + 9 = 14, not 15."]}, {"q": "Amy buys <b>3 bags of food at $7 each</b>. Liz buys <b>4 toys at $5 each</b>. Who spends more?", "choices": ["Liz spends more.", "They spend the same.", "Amy spends more."], "a": 2, "why": "Amy: 3 × 7 = $21. Liz: 4 × 5 = $20. $21 is more.", "no": ["Liz spends 4 × 5 = $20. Now find Amy's total: 3 × 7.", "Find both totals. Are $21 and $20 the same?", null]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "Leashes cost <b>$9 each</b>. Ellie buys <b>5</b>. What is the total?", "choices": ["$14", "$45", "$40"], "a": 1, "why": "5 × 9. 10 × 5 = 50. Take away one 5: <b>45</b>."}, {"q": "A bowl costs <b>$6</b>. A brush costs <b>$8</b>. Liz buys one of each. What does she pay?", "choices": ["$14", "$48", "$2"], "a": 0, "why": "Two different things, so add. 6 + 8 = 14."}, {"q": "Marion has <b>7</b> ten-dollar bills. How much money is that?", "choices": ["$17", "$60", "$70"], "a": 2, "why": "Skip count by 10, 7 times: 10, 20, 30, 40, 50, 60, 70."}, {"q": "Bags of seed cost <b>$4 each</b>. The club buys <b>7</b> bags. Which number sentence finds the total?", "choices": ["7 + 4 = 11", "7 × 4 = 28", "7 × 7 = 49"], "a": 1, "why": "Same price for every bag. 7 × 4 = 28."}, {"q": "A cage is <b>$18</b>. A bed is <b>$9</b>. How much <b>more</b> is the cage?", "choices": ["$27", "$8", "$9"], "a": 2, "why": "Compare: 18 − 9 = 9."}, {"q": "Amy buys <b>2 brushes at $8 each</b>. Ellie buys <b>3 combs at $6 each</b>. Who spends more?", "choices": ["Amy", "Ellie", "They spend the same."], "a": 1, "why": "Amy: 2 × 8 = 16. Ellie: 3 × 6 = 18. Ellie spends more."}, {"q": "In <b>6 × $5 = $30</b>, which number is the <b>product</b>?", "choices": ["6", "5", "30"], "a": 2, "why": "The product is the answer when you multiply: 30."}, {"q": "Which number is a <b>multiple</b> of 5?", "choices": ["45", "32", "54"], "a": 0, "why": "Skip count by 5s: 5, 10, 15, … 40, 45. You land on 45."}]}], "win": "Great shopping! You found every total like a pro!", "prev": "bb-bristol-L09", "prevTitle": "Lesson 9"});</script></body></html>
