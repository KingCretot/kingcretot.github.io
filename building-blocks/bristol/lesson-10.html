<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 10: Price Tags and Totals</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"teacherView": false, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L10", "label": "Lesson 10", "title": "Price Tags and Totals", "goal": "I can find the total cost when things have the same price.", "date": "2026-11-10", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Shop Practice", "text": "You ran the pet shop with Jonathan. Now find the totals <b>on your own</b>! 🏷️", "visual": {"kind": "emoji", "text": "🏷️💵🐾"}}, {"type": "learn", "kick": "Remember", "title": "Money detective", "text": "Ask: is it the <b>same price</b> for each thing?", "steps": [{"text": "✖️ <b>Same price, many things</b> → multiply. 3 balls at $5 each: 3 × 5 = $15"}, {"text": "➕ <b>Different things together</b> → add."}, {"text": "➖ <b>Spend or compare</b> → subtract."}], "tip": "The <b>price</b> is for one. The <b>total</b> is for all."}, {"type": "talk", "kick": "Say it", "title": "Say it out loud", "text": "Say these out loud. You can tell your mom!", "prompts": ["Read this tag three ways: <b>🦴 $6 each</b>.", "Spell <b>price</b> and <b>total</b> out loud.", "Tell a shop story where you <b>multiply</b>."], "starters": ["$6 each, $6 per …, $6 a …", "P-R-I-C-E", "Every … costs …"]}, {"type": "tap", "kick": "Your turn", "title": "Count the money", "text": "Type the number.", "items": [{"type": "fill", "q": "Toy balls cost <b>$5 each</b>. Liz buys <b>9</b>. What is the total?", "answers": ["45"], "why": "9 jumps of 5: 5, 10, 15, 20, 25, 30, 35, 40, <b>45</b>.", "no": "Each ball is $5. Skip count by 5, 9 times.", "hint": "Count 9 jumps of 5 on your fingers.", "placeholder": "Type a number"}, {"type": "fill", "q": "Ellie has <b>8</b> ten-dollar bills. How much money is that?", "answers": ["80"], "why": "Skip count by 10, 8 times: 10, 20 … <b>80</b>.", "no": "Each bill is $10. Skip count by 10s.", "hint": "10, 20, 30 … count 8 bills.", "placeholder": "Type a number"}, {"type": "fill", "q": "Marion counts her $5 bills: 5, 10, 15, 20, 25, 30, 35. How many bills does she have?", "answers": ["7"], "why": "Count the numbers, not the last one. There are <b>7</b>.", "no": "The question asks how many <b>bills</b>, not how many dollars.", "hint": "Touch each number as you count.", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Your turn", "title": "Price × how many", "items": [{"type": "fill", "q": "Brushes cost <b>$4 each</b>. Amy buys <b>7</b>. What is the total?", "answers": ["28"], "why": "7 × 4. Double 7 is 14. Double 14 is <b>28</b>.", "no": "Every brush is $4. Multiply.", "hint": "Double, double: 7 → 14 → ?", "placeholder": "Type a number"}, {"type": "fill", "q": "Fish nets are <b>$9 each</b>. Liz buys <b>3</b>. What is the total?", "answers": ["27"], "why": "3 × 9. 3 × 10 = 30. Take away one 3: <b>27</b>.", "no": "Every net is $9. Multiply.", "hint": "3 × 10 = 30. Take away 3.", "placeholder": "Type a number"}]}, {"type": "sort", "kick": "Sort it", "title": "Multiply, add or subtract?", "text": "Tap a money story. Then tap the right box.", "buckets": ["✖️ Multiply<br><small>same price</small>", "➕ Add<br><small>different things</small>", "➖ Subtract<br><small>spend or compare</small>"], "items": [{"text": "5 hats at $4 each.", "b": 0, "why": "Every hat is $4. 5 × 4.", "hint": "Does every hat cost the same?"}, {"text": "A rope is $7 and a ball is $5. Buy both.", "b": 1, "why": "Two different things. 7 + 5.", "hint": "Are the prices the same?"}, {"text": "Amy has $18. She spends $9.", "b": 2, "why": "She <b>spends</b> money. It goes away. 18 − 9.", "hint": "Does Amy get money or spend it?"}, {"text": "Every pack of seeds is $6. Liz buys 4.", "b": 0, "why": "<b>Every</b> pack is $6. 4 × 6.", "hint": "Find the word <b>every</b>."}, {"text": "A tank is $25. A net is $8. How much more is the tank?", "b": 2, "why": "<b>How much more</b> → compare. 25 − 8.", "hint": "This compares two prices."}, {"text": "Marion buys a $12 cage and a $9 bowl.", "b": 1, "why": "Two different things. 12 + 9.", "hint": "Is it many things at one price?"}], "done": "Same price ✖️. Different things ➕. Spend or compare ➖."}, {"type": "tap", "kick": "Shop words", "title": "Type the word", "text": "Use these words: <b>price</b>, <b>total</b>, <b>product</b>. Spell carefully!", "items": [{"type": "fill", "q": "Bows are <b>$3 each</b>. The $3 is the ____.", "answers": ["price"], "why": "The <b>price</b> is what one bow costs.", "no": "What one thing costs is the …", "placeholder": "Type the word"}, {"type": "fill", "q": "In <b>5 × 8 = 40</b>, the 40 is the ____.", "answers": ["product"], "why": "The answer when you multiply is the <b>product</b>.", "no": "The answer to a multiplication is the …", "hint": "It starts with <b>p</b> and ends with <b>t</b>: p _ _ _ _ _ t", "placeholder": "Type the word"}, {"type": "fill", "q": "Ellie pays <b>$14</b> for all her things. The $14 is the ____.", "answers": ["total"], "why": "The whole amount for all of it is the <b>total</b>.", "no": "The whole amount, all put together, is the …", "placeholder": "Type the word"}]}, {"type": "tap", "kick": "Compare", "title": "Who spends more?", "items": [{"q": "Amy buys <b>4 bows at $5 each</b>. Liz buys <b>2 hats at $9 each</b>. Who spends more?", "choices": ["Liz", "They spend the same.", "Amy"], "a": 2, "why": "Amy: 4 × 5 = $20. Liz: 2 × 9 = $18. Amy spends more.", "no": ["Liz spends 2 × 9 = $18. Find Amy's total: 4 × 5.", "Find both totals. Are $20 and $18 the same?", null]}, {"type": "fill", "q": "A bed costs <b>$17</b>. A blanket costs <b>$9</b>. How much <b>more</b> is the bed?", "answers": ["8"], "why": "Compare: 17 − 9 = <b>8</b>.", "no": "<b>How much more</b> means subtract.", "hint": "Count up from 9 to 17.", "placeholder": "Type a number"}]}, {"type": "recall", "kick": "Remember?", "title": "Fact check", "items": [{"type": "fill", "q": "6 × 6 = ____", "answers": ["36"], "why": "5 sixes is 30. One more 6: 30 + 6 = <b>36</b>.", "no": "Think 5 × 6 = 30. Then add one more 6.", "hint": "30 + 6 = ?", "placeholder": "Type a number"}, {"type": "fill", "q": "6 × ____ = 54", "answers": ["9"], "why": "6 × 9 = 54. Check: 10 sixes is 60. Take away one 6: 54. ✔", "no": "What times 6 makes 54?", "hint": "Try 9: 10 sixes, take away one 6.", "placeholder": "Type a number"}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "Leashes cost <b>$9 each</b>. Ellie buys <b>5</b>. What is the total?", "answers": ["45"], "why": "5 × 9. 10 × 5 = 50. Take away one 5: 45.", "no": "Every leash is $9. Multiply.", "placeholder": "Type a number"}, {"type": "fill", "q": "A bowl costs <b>$6</b>. A brush costs <b>$8</b>. Liz buys one of each. What does she pay?", "answers": ["14"], "why": "Two different things, so add. 6 + 8 = 14.", "no": "Two different things. Do they join?", "placeholder": "Type a number"}, {"type": "fill", "q": "Marion has <b>7</b> ten-dollar bills. How much money is that?", "answers": ["70"], "why": "Skip count by 10, 7 times: 10, 20, 30, 40, 50, 60, 70.", "no": "Each bill is $10. Skip count by 10s.", "placeholder": "Type a number"}, {"q": "Bags of seed cost <b>$4 each</b>. The club buys <b>7</b> bags. Which number sentence finds the total?", "choices": ["7 + 4 = 11", "7 × 4 = 28", "7 × 7 = 49"], "a": 1, "why": "Same price for every bag. 7 × 4 = 28.", "no": ["Every bag costs $4. That is multiply.", null, "The price is $4, not $7."]}, {"type": "fill", "q": "A cage is <b>$18</b>. A bed is <b>$9</b>. How much <b>more</b> is the cage?", "answers": ["9"], "why": "Compare: 18 − 9 = 9.", "no": "<b>How much more</b> means subtract.", "placeholder": "Type a number"}, {"q": "Amy buys <b>2 brushes at $8 each</b>. Ellie buys <b>3 combs at $6 each</b>. Who spends more?", "choices": ["Ellie", "Amy", "They spend the same."], "a": 0, "why": "Amy: 2 × 8 = 16. Ellie: 3 × 6 = 18. Ellie spends more.", "no": [null, "Amy spends 2 × 8 = $16. Find Ellie's total: 3 × 6.", "Find both totals. Are $16 and $18 the same?"]}, {"type": "fill", "q": "In <b>6 × $5 = $30</b>, what is the <b>product</b>?", "answers": ["30"], "why": "The product is the answer when you multiply: 30.", "no": "The product is the answer, not a factor.", "placeholder": "Type a number"}, {"q": "Which number is a <b>multiple</b> of 5?", "choices": ["32", "54", "45"], "a": 2, "why": "Skip count by 5s: 5, 10, 15, … 40, 45. You land on 45.", "no": ["32 ends in 2. Multiples of 5 end in 0 or 5.", "54 ends in 4. Multiples of 5 end in 0 or 5.", null]}], [{"type": "fill", "q": "Bird toys cost <b>$7 each</b>. Liz buys <b>6</b>. What is the total?", "answers": ["42"], "why": "6 × 7. 5 sevens is 35. One more 7: 42.", "no": "Every toy is $7. Multiply.", "placeholder": "Type a number"}, {"type": "fill", "q": "A collar costs <b>$9</b>. A tag costs <b>$7</b>. Amy buys one of each. What does she pay?", "answers": ["16"], "why": "Two different things, so add. 9 + 7 = 16.", "no": "Two different things. Do they join?", "placeholder": "Type a number"}, {"type": "fill", "q": "Ellie has <b>9</b> five-dollar bills. How much money is that?", "answers": ["45"], "why": "Skip count by 5, 9 times: 5, 10, 15, 20, 25, 30, 35, 40, 45.", "no": "Each bill is $5. Skip count by 5s.", "placeholder": "Type a number"}, {"q": "Leashes cost <b>$8 each</b>. Marion buys <b>3</b>. Which number sentence finds the total?", "choices": ["3 × 8 = 24", "3 + 8 = 11", "8 × 8 = 64"], "a": 0, "why": "Same price for every leash. 3 × 8 = 24.", "no": [null, "Every leash costs $8. That is multiply.", "She buys 3 leashes, not 8."]}, {"type": "fill", "q": "A cat tree is <b>$21</b>. A cat bed is <b>$13</b>. How much <b>more</b> is the cat tree?", "answers": ["8"], "why": "Compare: 21 − 13 = 8.", "no": "<b>How much more</b> means subtract.", "placeholder": "Type a number"}, {"q": "Liz buys <b>3 balls at $5 each</b>. Ellie buys <b>2 ropes at $8 each</b>. Who spends more?", "choices": ["Liz", "They spend the same.", "Ellie"], "a": 2, "why": "Liz: 3 × 5 = 15. Ellie: 2 × 8 = 16. Ellie spends more.", "no": ["Liz spends 3 × 5 = $15. Find Ellie's total: 2 × 8.", "Find both totals. Are $15 and $16 the same?", null]}, {"type": "fill", "q": "In <b>8 × $3 = $24</b>, what is the <b>product</b>?", "answers": ["24"], "why": "The product is the answer when you multiply: 24.", "no": "The product is the answer, not a factor."}, {"q": "Which number is a <b>multiple</b> of 10?", "choices": ["15", "50", "55"], "a": 1, "why": "Skip count by 10s: 10, 20, 30, 40, 50. You land on 50.", "no": ["15 is a multiple of 5, not of 10.", null, "55 is a multiple of 5, not of 10."]}], [{"type": "fill", "q": "Dog beds cost <b>$8 each</b>. The shelter buys <b>6</b>. What is the total?", "answers": ["48"], "why": "6 × 8. 6 × 4 = 24. Double 24: 48.", "no": "Every bed is $8. Multiply.", "placeholder": "Type a number"}, {"type": "fill", "q": "Ellie buys a bowl for <b>$7</b> and a brush for <b>$5</b>. What does she pay?", "answers": ["12"], "why": "Two different things, so add. 7 + 5 = 12.", "no": "Two different things. Do they join?", "placeholder": "Type a number"}, {"type": "fill", "q": "Liz has <b>6</b> ten-dollar bills. How much money is that?", "answers": ["60"], "why": "Skip count by 10, 6 times: 10, 20, 30, 40, 50, 60.", "no": "Each bill is $10. Skip count by 10s.", "placeholder": "Type a number"}, {"q": "Fish food costs <b>$5 a box</b>. Amy buys <b>9</b> boxes. Which number sentence finds the total?", "choices": ["9 + 5 = 14", "5 × 5 = 25", "9 × 5 = 45"], "a": 2, "why": "Same price for every box. 9 × 5 = 45.", "no": ["Every box costs $5. That is multiply.", "She buys 9 boxes, not 5.", null]}, {"type": "fill", "q": "A cage is <b>$25</b>. A mat is <b>$16</b>. How much <b>more</b> is the cage?", "answers": ["9"], "why": "Compare: 25 − 16 = 9.", "no": "<b>How much more</b> means subtract.", "placeholder": "Type a number"}, {"q": "Marion buys <b>4 bows at $6 each</b>. Amy buys <b>3 hats at $8 each</b>. Who spends more?", "choices": ["Marion", "They spend the same.", "Amy"], "a": 1, "why": "Marion: 4 × 6 = 24. Amy: 3 × 8 = 24. They spend the same.", "no": ["Marion spends 4 × 6 = $24. Find Amy's total: 3 × 8.", null, "Amy spends 3 × 8 = $24. Find Marion's total: 4 × 6."]}, {"type": "fill", "q": "In <b>7 × $4 = $28</b>, what is the <b>product</b>?", "answers": ["28"], "why": "The product is the answer when you multiply: 28.", "no": "The product is the answer, not a factor.", "placeholder": "Type a number"}, {"q": "Liz skip counts by 5s. Which number will she land on?", "choices": ["42", "35", "53"], "a": 1, "why": "5, 10, 15, 20, 25, 30, 35. 35 is a <b>multiple</b> of 5.", "no": ["42 ends in 2. Skip counting by 5 lands on numbers ending in 0 or 5.", null, "53 ends in 3. Skip counting by 5 lands on numbers ending in 0 or 5."]}]]}], "win": "Great shopping! You found every total like a pro!", "prev": "bb-bristol-L09", "prevTitle": "Lesson 9"});</script></body></html>
