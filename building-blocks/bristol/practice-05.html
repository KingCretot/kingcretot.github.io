30. 30 + 6 = 36. So 6 × 6 = 36.", "no": [null, "30 is 36 − 6. How many 6s make 36?", "6 × 7 = 42. Too big."]}, {"q": "<b>? × 4 = 36</b>", "choices": ["8", "32", "9"], "a": 2, "why": "Double 9 is 18. Double 18 is 36. So 9 × 4 = 36.", "no": ["8 × 4 = 32. Too small. Try one more.", "32 is 36 − 4. How many 4s make 36?", null]}, {"q": "<b>6 × 9 = ?</b>", "choices": ["46", "54", "15"], "a": 1, "why": "45 + 9 = 54.", "no": ["46 is 45 + 1. Add a whole group of 9.", null, "15 is 6 + 9. Multiply."]}, {"q": "There are 4 benches. 7 kids sit on each bench. How many kids?", "choices": ["28", "11", "14"], "a": 0, "why": "Double 7 is 14. Double 14 is 28.", "no": [null, "11 is 4 + 7. Each bench has 7, so multiply.", "14 is only 2 benches. Double again."]}, {"q": "Marion has 6 red beads and 9 blue beads. How many beads?", "choices": ["54", "15", "3"], "a": 1, "why": "Two different groups. Add: 6 + 9 = 15.", "no": ["There are not 6 groups of 9. Add.", null, "3 is the difference. The question asks how many beads."]}, {"q": "Ellie has 30 stickers. She puts 6 on every page. How many pages?", "choices": ["24", "5", "36"], "a": 1, "why": "6 × ? = 30. 6 × 5 = 30. So 5 pages.", "no": ["24 is 30 − 6. How many 6s make 30?", null, "36 is 30 + 6. How many 6s make 30?"]}, {"q": "Which story needs <b>multiply</b>?", "choices": ["Liz has 4 dogs and 6 cats.", "There are 6 bowls with 4 fish in each.", "Amy read 6 pages, then 4 more."], "a": 1, "why": "Each bowl has 4. Equal groups: 6 × 4 = 24.", "no": ["4 dogs and 6 cats are different groups. Add.", null, "6 pages and 4 pages are different. Add."]}, {"q": "Which is the same as <b>6 × 4</b>?", "choices": ["4 × 4 + 1", "6 + 4", "5 × 4 + 4"], "a": 2, "why": "5 groups of 4 plus one more 4: 20 + 4 = 24.", "no": ["That is 17. You need 5 groups of 4 plus one more 4.", "6 + 4 adds. 6 × 4 is 6 groups of 4.", null]}, {"q": "Liz says <b>4 × 8 = 24</b>. What is right?", "choices": ["She is right.", "4 × 8 = 32", "4 × 8 = 12"], "a": 1, "why": "Double 8 is 16. Double 16 is 32.", "no": ["24 is 4 × 6.", null, "12 is 4 + 8."]}]});</script></body></html>
