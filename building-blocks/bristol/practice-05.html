<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Practice 5</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div></div><h1 style="color:#0A1F3D;margin:4px 0 2px;font-size:28px">📝 Practice: Prove It: 4s and 6s</h1><p style="margin:0 0 12px;color:#5b6578">Three tries on each one. Only your first try counts. 4s: double, double. 6s: 5s + one more. Hiding number: count the jumps.</p><div id="stage"></div></div><script src="../bb.js"></script><script>BBPractice({"studentName": "Bristol", "label": "Lesson 5", "title": "Prove It: 4s and 6s", "mastery": 85, "color": "#10AC84", "questions": [{"type": "fill", "q": "<b>4 × 6 = ?</b>", "answers": ["24", "twenty-four", "twenty four", "twentyfour"], "why": "Double 6 is 12. Double 12 is <b>24</b>.", "no": "Double, double.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>6 × 8 = ?</b>", "answers": ["48", "forty-eight", "forty eight", "fortyeight"], "why": "5 × 8 = 40. 40 + 8 = <b>48</b>.", "no": "5s plus one more group.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>4 × ? = 16</b>", "answers": ["4", "four"], "why": "4, 8, 12, 16. That is 4 jumps. <b>4 × 4 = 16</b>.", "no": "Count by 4s to 16. How many jumps?", "placeholder": "Type a number"}, {"q": "<b>6 × ? = 36</b>", "choices": ["6", "30", "7"], "a": 0, "why": "5 × 6 = 30. 30 + 6 = 36. So 6 × 6 = 36.", "no": [null, "30 is 36 − 6. How many 6s make 36?", "6 × 7 = 42. Too big."]}, {"type": "fill", "q": "<b>? × 4 = 36</b>", "answers": ["9", "nine"], "why": "Double 9 is 18. Double 18 is 36. So <b>9 × 4 = 36</b>.", "no": "How many 4s make 36? Guess, check and fix.", "placeholder": "Type a number"}, {"type": "fill", "q": "<b>6 × 9 = ?</b>", "answers": ["54", "fifty-four", "fifty four", "fiftyfour"], "why": "45 + 9 = <b>54</b>.", "no": "5s plus one more group.", "placeholder": "Type a number"}, {"type": "fill", "q": "There are 4 benches. 7 kids sit on <b>each</b> bench. How many kids?", "answers": ["28", "twenty-eight", "twenty eight", "twentyeight"], "why": "Double 7 is 14. Double 14 is <b>28</b>.", "no": "Each bench has 7. Double, double.", "placeholder": "Type a number"}, {"q": "Marion has 6 red beads and 9 blue beads. How many beads?", "choices": ["54", "15", "3"], "a": 1, "why": "Two different groups. Add: 6 + 9 = 15.", "no": ["There are not 6 groups of 9. Add.", null, "3 is the difference. The question asks how many beads."]}, {"type": "fill", "q": "Ellie has 30 stickers. She puts 6 on <b>every</b> page. How many pages?", "answers": ["5", "five"], "why": "6 × ? = 30. 6 × 5 = 30. So <b>5</b> pages.", "no": "How many 6s make 30? Count the jumps.", "placeholder": "Type a number"}, {"q": "Which story needs <b>multiply</b>?", "choices": ["Liz has 4 dogs and 6 cats.", "There are 6 bowls with 4 fish in each.", "Amy read 6 pages, then 4 more."], "a": 1, "why": "Each bowl has 4. Equal groups: 6 × 4 = 24.", "no": ["4 dogs and 6 cats are different groups. Add.", null, "6 pages and 4 pages are different. Add."]}, {"q": "Which is the same as <b>6 × 4</b>?", "choices": ["4 × 4 + 1", "6 + 4", "5 × 4 + 4"], "a": 2, "why": "5 groups of 4 plus one more 4: 20 + 4 = 24.", "no": ["That is 17. You need 5 groups of 4 plus one more 4.", "6 + 4 adds. 6 × 4 is 6 groups of 4.", null]}, {"q": "Liz says <b>4 × 8 = 24</b>. What is right?", "choices": ["She is right.", "4 × 8 = 32", "4 × 8 = 12"], "a": 1, "why": "Double 8 is 16. Double 16 is 32.", "no": ["24 is 4 × 6.", null, "12 is 4 + 8."]}]});</script></body></html>
