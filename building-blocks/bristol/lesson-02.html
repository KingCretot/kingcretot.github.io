 Make the groups.", "groups": 4, "each": 2, "emoji": "🐟", "why": "4 groups of 2. That is <b>4 × 2 = 8</b> goldfish.", "hint": "The bowls are the groups. How many fish in each bowl?"}, {"type": "tap", "kick": "Try it", "title": "Turn it around", "items": [{"type": "fill", "q": "2 rows of 5 make 10. How many are in <b>5 rows of 2</b>?", "visual": {"kind": "array", "rows": 5, "cols": 2, "emoji": "🌼"}, "answers": ["10", "ten"], "why": "Turn-around facts have the same total: <b>5 × 2 = 10</b>.", "no": "Turning an array does not add or take away any.", "placeholder": "Type a number"}, {"type": "fill", "q": "10 × 3 = 30. So 3 × 10 = ____.", "answers": ["30", "thirty"], "why": "Turn-around facts have the same total: <b>3 × 10 = 30</b>.", "no": "It is the same two numbers, turned around.", "placeholder": "Type a number"}]}, {"type": "tap", "kick": "Try it", "title": "Word problems", "text": "Find the clue word. Then decide.", "items": [{"type": "fill", "q": "Liz has 3 jars. There are 5 treats per jar. Do you multiply or add? Type <b>multiply</b> or <b>add</b>.", "answers": ["multiply", "times", "multiplication", "x", "multiplying"], "why": "<b>Per</b> jar means each jar has 5. Equal groups: <b>3 × 5 = 15</b>.", "no": "What does <b>per</b> mean?", "placeholder": "multiply or add"}, {"type": "fill", "q": "Amy has 3 bones. Marion has 5 bones. How many bones in all?", "answers": ["8", "eight"], "why": "3 and 5 are not equal groups. Add: <b>3 + 5 = 8</b>.", "no": "Is there a clue word? Are the groups the same size?", "placeholder": "Type a number"}, {"q": "Which story matches <b>2 × 5</b>?", "choices": ["There are 2 dogs and 5 cats.", "There are 5 dogs. 2 dogs go home.", "There are 2 dogs. Each dog has 5 toys."], "a": 2, "why": "2 groups (dogs) with 5 in each: <b>2 × 5 = 10</b>.", "no": ["2 dogs and 5 cats are not equal groups. That is 2 + 5.", "Dogs going home is take away: 5 − 2.", null]}]}, {"type": "check", "title": "Show What You Know", "sets": [[{"type": "fill", "q": "The s
