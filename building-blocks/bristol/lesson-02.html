<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bristol · Lesson 2: Prove It: Find the Groups</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script src="../bb.js"></script><script>BBLesson({"student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L02", "label": "Lesson 2", "title": "Prove It: Find the Groups", "goal": "I can find the groups in a word problem and write the number sentence.", "date": "2026-10-22", "mastery": 85, "color": "#2E86DE", "slides": [{"type": "hello", "title": "Prove It: Find the Groups", "text": "Today you <b>prove</b> what you know. 🔍 You will find the <b>groups</b> hiding in the words.", "visual": {"kind": "emoji", "text": "🔍🐶📝"}}, {"type": "talk", "kick": "Book Talk", "title": "Tell me about your book", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["What is the <b>big problem</b> in the story?", "Tell 3 things that happened <b>in order</b>.", "What would you do next if you were Amy?"], "starters": ["The big problem is …", "First, … Next, … Then, …", "If I were Amy, I would …"]}, {"type": "recall", "kick": "Remember", "title": "From last lesson", "text": "Equal groups → <b>multiply</b>. Not equal → <b>add</b>.", "items": [{"q": "Are these groups equal?", "visual": {"kind": "uneven", "sets": [5, 5, 4], "emoji": "🐞"}, "choices": ["Yes, equal", "No, not equal"], "a": 1, "why": "Two groups have 5. The last group has only 4.", "no": ["Count the last group. Does it have 5?", null]}, {"q": "There are 2 plates. Each plate has 10 grapes. What do you do?", "visual": {"kind": "groups", "groups": 2, "each": 10, "emoji": "🍇"}, "choices": ["Multiply: 2 × 10", "Add: 2 + 10"], "a": 0, "why": "<b>Each</b> plate has 10, so the groups are equal: <b>2 × 10 = 20</b>.", "no": [null, "2 + 10 adds the plates to one plate of grapes. Both plates have 10."]}, {"q": "Marion found 6 acorns. Amy found 9 acorns. How many acorns?", "visual": {"kind": "uneven", "sets": [6, 9], "emoji": "🌰"}, "choices": ["54", "15", "3"], "a": 1, "why": "6 and 9 are not equal groups, so add: <b>6 + 9 = 15</b>.", "no": ["54 is 6 × 9. There are not 6 groups of 9 here.", null, "3 is 9 − 6. Nobody lost any acorns."]}]}, {"type": "learn", "kick": "Learn", "title": "Clue words: each, every, per", "text": "These words tell you the groups are <b>equal</b>.", "visual": {"kind": "bigtext", "text": "each · every · per", "sub": "They all mean: the same in every group"}, "steps": [{"text": "<b>Read:</b> There are 5 kittens. <b>Every</b> kitten has 2 bows."}, {"text": "<b>How many groups?</b> 5 kittens. <b>How many in each?</b> 2 bows.", "visual": {"kind": "groups", "groups": 5, "each": 2, "emoji": "🎀"}}, {"text": "<b>Write it:</b> 5 × 2 = 10 bows.", "visual": {"kind": "bigtext", "text": "5 × 2 = 10"}}], "tip": "The number of groups comes first. The number in each group comes second."}, {"type": "learn", "kick": "Learn", "title": "Watch out for the trap!", "text": "<b>In all</b> means find the total. It does <b>not</b> always mean multiply.", "visual": {"kind": "uneven", "sets": [4, 3], "emoji": "🐰"}, "steps": [{"text": "<b>Read:</b> Liz has 4 big bunnies and 3 baby bunnies. How many bunnies <b>in all</b>?"}, {"text": "Is there a clue word like <b>each</b>? <b>No.</b> 4 and 3 are not equal groups."}, {"text": "So we <b>add</b>: 4 + 3 = 7 bunnies. Not 4 × 3!", "visual": {"kind": "bigtext", "text": "4 + 3 = 7"}}], "tip": "Ask: are the groups the same size? Then pick multiply or add."}, {"type": "tap", "kick": "Try it", "title": "Find the groups", "items": [{"q": "The vet has 3 cages. There are 2 puppies in each cage. How many <b>groups</b> are there?", "choices": ["2", "3", "6"], "a": 1, "why": "The cages are the groups. There are <b>3</b> cages.", "no": ["2 is how many puppies are in <b>each</b> cage.", null, "6 is how many puppies in all. The question asks for groups."]}, {"q": "Amy has 2 bags of dog food and 5 cans of dog food. How many bags and cans in all?", "choices": ["2 × 5 = 10", "2 + 5 = 7", "5 − 2 = 3"], "a": 1, "why": "This is the trap! 2 and 5 are not equal groups, so add: <b>2 + 5 = 7</b>.", "no": ["There are not 2 groups of 5. There are 2 bags and 5 cans.", null, "Nothing was taken away."]}, {"q": "Each of the 4 girls brings 5 treats to the shelter. How many treats?", "choices": ["20", "9", "1"], "a": 0, "why": "<b>Each</b> girl brings 5. That is 4 groups of 5: <b>4 × 5 = 20</b>.", "no": [null, "9 is 4 + 5. That adds the girls to one girl's treats. Every girl brings 5.", "1 is 5 − 4. Nobody took treats away."]}]}, {"type": "learn", "kick": "Learn", "title": "Arrays are equal groups", "text": "An <b>array</b> has <b>rows</b>. Every row has the same number.", "visual": {"kind": "array", "rows": 3, "cols": 5, "emoji": "🌷"}, "steps": [{"text": "<b>Count the rows:</b> 3 rows. (A row goes across ➡️.)"}, {"text": "<b>Count one row:</b> 5 in each row."}, {"text": "<b>Multiply:</b> 3 × 5 = 15 tulips. Skip count: 5, 10, 15.", "visual": {"kind": "bigtext", "text": "3 × 5 = 15"}}], "tip": "Each row is one equal group."}, {"type": "tap", "kick": "Try it", "title": "Read the array", "items": [{"q": "Which number sentence matches this array?", "visual": {"kind": "array", "rows": 2, "cols": 6, "emoji": "🌼"}, "choices": ["2 + 6 = 8", "2 × 6 = 12", "6 × 6 = 36"], "a": 1, "why": "2 rows with 6 in each row: <b>2 × 6 = 12</b>.", "no": ["2 + 6 adds the number of rows to one row. Count all the flowers.", null, "There are only 2 rows, not 6."]}, {"q": "How many bones are in this array?", "visual": {"kind": "array", "rows": 4, "cols": 5, "emoji": "🦴"}, "choices": ["9", "25", "20"], "a": 2, "why": "4 rows of 5: 5, 10, 15, 20. So <b>4 × 5 = 20</b>.", "no": ["9 is 4 + 5. That adds one row to the number of rows.", "25 would be 5 rows. Count the rows again: 4.", null]}]}, {"type": "learn", "kick": "Learn", "title": "Turn-around facts", "text": "Turn an array on its side. The total stays the <b>same</b>!", "steps": [{"text": "<b>3 rows of 4</b> = 12 apples.", "visual": {"kind": "array", "rows": 3, "cols": 4, "emoji": "🍎"}}, {"text": "Turn it! <b>4 rows of 3</b> = 12 apples.", "visual": {"kind": "array", "rows": 4, "cols": 3, "emoji": "🍎"}}, {"text": "So <b>3 × 4 = 4 × 3</b>. Both are 12.", "visual": {"kind": "bigtext", "text": "3 × 4 = 4 × 3 = 12"}}], "tip": "If you know one fact, you know its turn-around too!"}, {"type": "sort", "kick": "Sort it", "title": "Trap or not?", "text": "Look closely. Some cards have the <b>same numbers</b>! Tap a card. Then tap the right box.", "buckets": ["✖️ Multiply<br><small>equal groups</small>", "➕ Add<br><small>not equal</small>"], "items": [{"text": "Ellie has 3 cats. Each cat has 2 bows. How many bows in all?", "b": 0, "why": "<b>Each</b> cat has 2 bows: 3 × 2 = 6.", "hint": "Find the clue word. Does every cat have 2?"}, {"text": "Liz has 3 cats and 2 dogs. How many pets in all?", "b": 1, "why": "3 cats and 2 dogs are not equal groups: 3 + 2 = 5.", "hint": "Is there a clue word like each? Are 3 and 2 the same?"}, {"text": "There are 5 rows of tulips with 10 in every row.", "b": 0, "why": "<b>Every</b> row has 10: 5 × 10 = 50.", "hint": "Rows in a garden are like an array."}, {"text": "Amy saw 10 dogs in the morning and 5 dogs after lunch.", "b": 1, "why": "10 and 5 are different: 10 + 5 = 15.", "hint": "Did she see the same number both times?"}, {"text": "The vet gives 2 pills per day for 5 days.", "b": 0, "why": "<b>Per</b> day means each day: 5 × 2 = 10 pills.", "hint": "What does per mean?"}, {"text": "Marion has 2 red leashes and 5 blue leashes.", "b": 1, "why": "2 and 5 are not equal: 2 + 5 = 7.", "hint": "Are there 2 red and 2 blue? Look again."}], "done": "Clue word and same size → multiply. Different sizes → add."}, {"type": "build", "kick": "Build it", "title": "The pet store fish", "text": "The pet store has <b>5 fish tanks</b>. There are <b>3 fish</b> in every tank. Make the groups.", "groups": 5, "each": 3, "emoji": "🐠", "why": "5 groups of 3. That is <b>5 × 3 = 15</b> fish.", "hint": "The tanks are the groups. How many fish are in each tank?"}, {"type": "order", "kick": "Put in order", "title": "Detective steps", "text": "How do you solve a word problem? Tap the steps in order.", "steps": ["Read the whole problem.", "Find the groups and how many in each.", "Equal? Multiply. Not equal? Add.", "Write the number sentence.", "Check: skip count or draw it."], "why": "Read, find, choose, write, check. Use these steps every time!", "hint": "You have to read the problem before anything else."}, {"type": "tap", "kick": "Try it", "title": "Match the story", "items": [{"q": "Which story matches <b>3 × 10</b>?", "choices": ["Liz has 3 shells and 10 rocks.", "There are 3 vans. Each van has 10 kids.", "There are 10 kids. 3 kids go home."], "a": 1, "why": "3 groups (vans) with 10 in each: <b>3 × 10 = 30</b>.", "no": ["3 shells and 10 rocks are not equal groups. That is 3 + 10.", null, "Kids going home is take away: 10 − 3."]}, {"q": "Both say <b>in all</b>. Which one is the trap where you <b>add</b>?", "choices": ["There are 4 nests with 2 birds in each. How many birds in all?", "Ellie has 4 birds and 2 fish. How many pets in all?"], "a": 1, "why": "4 birds and 2 fish are not equal groups: <b>4 + 2 = 6</b>.", "no": ["This one says <b>each</b>. It is 4 groups of 2, so you multiply.", null]}]}, {"type": "check", "title": "Show What You Know", "questions": [{"q": "The shelter has 2 kennels. There are 8 kittens in every kennel. How many kittens?", "choices": ["10", "16", "6"], "a": 1, "why": "<b>Every</b> kennel has 8: 2 × 8 = 16."}, {"q": "Ellie has 5 goldfish and 3 turtles. How many pets in all?", "choices": ["8", "15", "2"], "a": 0, "why": "5 and 3 are not equal groups. Add: 5 + 3 = 8."}, {"q": "Which number sentence matches this array?", "visual": {"kind": "array", "rows": 5, "cols": 4, "emoji": "🍓"}, "choices": ["4 × 4 = 16", "5 + 4 = 9", "5 × 4 = 20"], "a": 2, "why": "5 rows with 4 in each row: 5 × 4 = 20."}, {"q": "4 rows of 6 chairs make 24 chairs. How many chairs are in <b>6 rows of 4</b>?", "choices": ["10", "24", "2"], "a": 1, "why": "It is the turn-around fact. The total stays the same: 6 × 4 = 4 × 6 = 24."}, {"q": "Which story matches <b>4 × 5</b>?", "choices": ["Amy has 4 bones. She gets 5 more.", "There are 4 dogs. Each dog has 5 spots.", "There are 4 dogs and 5 cats."], "a": 1, "why": "4 groups (dogs) with 5 in each: 4 × 5 = 20."}, {"q": "Liz walks 3 dogs every day for 4 days. How many dog walks is that?", "choices": ["7", "1", "12"], "a": 2, "why": "4 days with 3 walks each day: 4 × 3 = 12."}, {"q": "Which word problem needs <b>add</b>?", "choices": ["Marion has 10 pens and Liz has 3 pens. How many pens in all?", "There are 4 tables with 5 cups on each table.", "There are 10 bikes with 2 wheels per bike."], "a": 0, "why": "10 and 3 are not equal groups, so add: 10 + 3 = 13."}, {"q": "A garden has 4 rows. Every row has 10 carrots. How many carrots?", "choices": ["14", "30", "40"], "a": 2, "why": "4 rows of 10: 10, 20, 30, 40. So 4 × 10 = 40."}]}], "win": "You proved it! You can find the groups in any story.", "prev": "bb-bristol-L01", "prevTitle": "Lesson 1"});</script></body></html>
