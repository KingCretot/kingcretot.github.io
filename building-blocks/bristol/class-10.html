<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Lesson · Bristol · Lesson 10: Price Tags and Totals</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bb.css"></head><body><div class="top"><span class="wm">KingCretot Experience</span><span class="tg"><span class="e">EDUCATE.</span> <span class="m">EMPOWER.</span> <span class="x">EXCEL.</span></span></div><div class="tri"><span class="b"></span><span class="g"></span><span class="r"></span></div><div class="stage"><div class="bar"><a href="index.html" style="font-family:Fredoka,sans-serif;text-decoration:none">🏠</a><div class="prog"><i id="pi"></i></div><span class="stars" id="stars">⭐ 0</span></div><div id="stage"></div></div><div class="nav"><button class="back" id="back">⬅ Back</button><button class="next" id="next">Next ➜</button></div><script>window.KCE_READALOUD=true</script><script src="clips.js"></script><script src="../bb.js"></script><script>BBLesson({"teacherView": true, "student": "bristol", "studentName": "Bristol", "id": "bb-bristol-L10", "label": "Lesson 10", "title": "Price Tags and Totals", "goal": "I can find the total cost when things have the same price.", "date": "2026-11-10", "mastery": 85, "color": "#E67E22", "slides": [{"type": "hello", "title": "Price Tags and Totals", "text": "Pretend the Critter Club has a <b>pet shop sale</b>. 🏷️ Today you find out what things <b>cost</b>!", "visual": {"kind": "emoji", "text": "🏷️💵🐶"}, "notes": {"do": "Before she arrives, set up the shop: 5–6 toys with index-card price tags ($4 each, $5 each, $6 each, $10 each), play money in piles by bill, 3 paper plates, whiteboard.", "say": "\"Today the Critter Club has a pet shop sale. You are the shopkeeper. You will find out what things cost.\"", "ask": "\"Have you ever paid for something at a store? What did you need to know?\"", "listen": "The price, how many, how much money. Write PRICE and HOW MANY on the whiteboard."}}, {"type": "talk", "kick": "Book Talk", "title": "What happened next?", "text": "Think about <i>Amy and the Missing Puppy</i>.", "prompts": ["What happened in the part you read since Monday?", "What <b>clue</b> did you find? Tell me about it.", "If Amy could buy one thing for the puppy, what should it be? Why?"], "starters": ["In my reading, …", "The clue was …", "Amy should buy … because …"], "notes": {"do": "Book talk, about 6 minutes. She shows you the clue she found (Monday's reading task).", "ask": "All three prompts. For the last one, push for a reason from the story: \"Why would the puppy need that?\"", "listen": "A clue from the text and a reason with \"because\". If her retell jumps around, ask: \"What happened first? Next?\""}}, {"type": "recall", "kick": "Remember?", "title": "Detective review", "items": [{"q": "Liz has <b>16</b> beads. Marion has <b>9</b> beads. How many more does Liz have?", "choices": ["25", "7", "8"], "a": 1, "why": "<b>How many more</b> → compare. 16 − 9 = <b>7</b>.", "no": ["25 is 16 + 9. <b>How many more</b> means subtract.", null, "Check: 8 + 9 = 17, not 16. Count up from 9 to 16."]}, {"q": "6 × 9 = ?<br><small>Hint: 10 groups, take away one.</small>", "choices": ["54", "56", "63"], "a": 0, "why": "10 × 6 = 60. Take away one 6: 60 − 6 = <b>54</b>.", "no": [null, "56 is 7 × 8. Try 10 × 6 = 60, then take away 6.", "63 is 7 × 9. There are 6 nines here."]}, {"q": "Which story is <b>equal groups</b>?", "choices": ["Amy has 5 hats and 3 scarves.", "Ellie had 9 bows. She lost 2.", "There are 6 cages with 3 birds in each."], "a": 2, "why": "Each cage has 3 birds. Equal groups → multiply.", "no": ["5 and 3 are different amounts. That is add.", "She <b>lost</b> 2. That is subtract.", null]}], "notes": {"do": "Glance at Monday's After-Class Lesson score first. She says the 3 detective questions out loud on the first item before answering.", "ask": "\"How many more: join or compare?\" \"6 × 9: what is 10 × 6?\" \"Which story has equal groups? Prove it.\"", "listen": "7 (compare, subtract), 54, the cages. If she picks 25 on the first item, she is still number grabbing: go back to the 3 questions."}}, {"type": "learn", "kick": "Learn", "title": "What is a price?", "text": "The <b>price</b> is what <b>one</b> thing costs.", "visual": {"kind": "bigtext", "text": "🦴 $4 each", "sub": "Each bone costs 4 dollars."}, "steps": [{"text": "<b>$4 each</b> means one bone costs 4 dollars."}, {"text": "<b>$4 per bone</b> means the same thing."}, {"text": "<b>$4 a bone</b> means the same thing too!"}], "tip": "<b>each</b>, <b>per</b> and <b>a</b> tell you every one costs the same. That is equal groups!", "notes": {"do": "Hand her a toy with a $4 tag. She reads the tag three ways: $4 each, $4 per bone, $4 a bone. Then she reads two more tags the same way.", "say": "\"The price is what ONE thing costs. Each, per and a all mean the same thing: every one costs the same.\"", "ask": "\"If one bone is $4, what does a second bone cost?\"", "listen": "\"$4 too. They all cost the same.\" That is the equal-groups idea in money."}}, {"type": "vocab", "kick": "Words", "title": "Shop words", "text": "Tap each card to flip it. Say the word. Then <b>spell</b> it out loud.", "words": [{"word": "price", "pos": "noun", "meaning": "What <b>one</b> thing costs.", "example": "The <b>price</b> of a ball is $5.", "emoji": "🏷️"}, {"word": "total", "pos": "noun", "meaning": "The whole amount, all put together.", "example": "3 balls at $5 each. The <b>total</b> is $15.", "emoji": "💰"}, {"word": "factor", "pos": "noun", "meaning": "A number you multiply.", "example": "In 3 × 5, the <b>factors</b> are 3 and 5.", "emoji": "✖️"}, {"word": "product", "pos": "noun", "meaning": "The answer when you multiply.", "example": "In 3 × 5 = 15, the <b>product</b> is 15.", "emoji": "🎯"}, {"word": "multiple", "pos": "noun", "meaning": "A number you land on when you skip count.", "example": "10, 15 and 20 are <b>multiples</b> of 5.", "emoji": "🦘"}], "notes": {"do": "Flip each card. She says the word, spells it out loud, and you write it on the whiteboard as she spells. She copies price and total on an index card to keep.", "say": "\"Pathways asks you to TYPE some of these words, so spelling counts.\"", "ask": "\"In 3 × 5 = 15, which numbers are the factors? Which is the product?\"", "listen": "Factors 3 and 5, product 15. Watch the spellings: price (not prise), total, factor, product, multiple."}}, {"type": "learn", "kick": "Learn", "title": "Skip count the money", "text": "Collars cost <b>$5 each</b>. Ellie buys <b>6</b> collars.", "steps": [{"text": "Make one jump of 5 for each collar.", "visual": {"kind": "numberline", "start": 0, "jump": 5, "jumps": 6}}, {"text": "6 jumps land on <b>30</b>. So 6 × 5 = <b>30</b>. The total is <b>$30</b>.", "visual": {"kind": "bigtext", "text": "6 × $5 = $30"}}, {"text": "Now $10 each. Ellie buys 4 leashes: 10, 20, 30, 40. The total is <b>$40</b>.", "visual": {"kind": "numberline", "start": 0, "jump": 10, "jumps": 4}}], "tip": "Each jump is one thing you buy. The last number is the total.", "notes": {"do": "Hands on. She \"buys\" 6 collars: she lays one $5 bill next to each collar and counts out loud 5, 10, 15 … Then 4 leashes with $10 bills.", "ask": "\"How many bills did you lay down? What did you land on?\"", "listen": "6 bills, $30; 4 bills, $40. She must tell apart HOW MANY bills (jumps) and HOW MUCH money (last number)."}}, {"type": "tap", "kick": "Try it", "title": "Count the money", "items": [{"q": "Fish food costs <b>$5 a box</b>. Amy buys <b>7</b> boxes. What is the total?", "choices": ["$12", "$35", "$30"], "a": 1, "why": "Skip count 7 jumps: 5, 10, 15, 20, 25, 30, <b>35</b>. 7 × 5 = 35.", "no": ["$12 is 5 + 7. Each box costs $5. Skip count 7 times.", null, "$30 is only 6 jumps. Count the boxes: 7."]}, {"q": "Each bag of hay costs <b>$10</b>. The club buys <b>8</b> bags. What is the total?", "choices": ["$80", "$18", "$70"], "a": 0, "why": "8 jumps of 10: 10, 20, 30, 40, 50, 60, 70, <b>80</b>.", "no": [null, "$18 is 10 + 8. Each bag costs $10.", "$70 is 7 bags. Count again: 8 bags."]}, {"q": "Liz counts her $5 bills: 5, 10, 15, 20, 25, 30, 35, 40, 45. How many bills does she have?", "choices": ["45", "8", "9"], "a": 2, "why": "Count the jumps, not the last number. There are <b>9</b> numbers, so 9 bills.", "no": ["$45 is how much money. The question asks how many <b>bills</b>.", "Point to each number as you count. There are 9.", null]}], "notes": {"do": "Guided practice. She reads each one aloud and counts with real bills before answering.", "ask": "On the last item: \"Does the question ask how many dollars or how many bills?\"", "listen": "$35, $80, 9 bills. If she says 45 on the last one, have her touch each number as she counts."}}, {"type": "learn", "kick": "Learn", "title": "Price × how many", "text": "When every thing costs the same, <b>multiply</b>.", "visual": {"kind": "bigtext", "text": "how many × price = total", "sub": "Price × how many works too. It is the same total!"}, "steps": [{"text": "Toy mice cost <b>$4 each</b>. Marion buys <b>6</b>.", "visual": {"kind": "groups", "groups": 6, "each": 4, "emoji": "💵", "label": "6 toy mice. $4 for each one."}}, {"text": "<b>6 × 4</b>. Double 6 is 12. Double 12 is <b>24</b>."}, {"text": "The total is <b>$24</b>.", "visual": {"kind": "bigtext", "text": "6 × $4 = $24"}}], "tip": "The price and the how many are the <b>factors</b>. The total is the <b>product</b>.", "notes": {"do": "Reveal step by step. Write the frame on the whiteboard: how many × price = total. She puts $4 on each of 6 plates (use the 3 plates twice, or draw circles).", "say": "\"When every thing costs the same, we multiply. The price and the how-many are the factors. The total is the product.\"", "ask": "\"Which number is the price? Which is how many? What is 6 × 4? How do you know?\"", "listen": "Double 6 is 12, double 12 is 24. If she says 10, she added: point to each plate and ask what is on it."}}, {"type": "build", "kick": "Build it", "title": "Ellie's dog toys", "text": "Dog toys cost <b>$6 each</b>. Ellie buys <b>3</b>. Make one group of $6 for each toy.", "groups": 3, "each": 6, "emoji": "💵", "why": "3 groups of $6. 3 × 6 = <b>$18</b>.", "hint": "Make one group for each toy. Put $6 in each group.", "notes": {"do": "She pays for 3 toys at $6 with $1 bills on 3 plates, then sets the groups on screen.", "ask": "\"How many groups? How many dollars in each group? Which numbers are the factors? What is the product?\"", "listen": "3 groups of 6, $18. Factors 3 and 6, product 18. If she makes 6 groups of 3, ask: \"How many toys did you buy?\""}}, {"type": "talk", "kick": "Hands on", "title": "Shop role-play", "text": "Your teacher is the customer. You are the shopkeeper. 🧾", "prompts": ["\"I want <b>4</b> balls. They are <b>$5 each</b>. What do I pay?\"", "\"I want <b>7</b> bones. They are <b>$4 each</b>. What do I pay?\"", "\"I have <b>$10 bills</b>. I want <b>5</b> leashes at <b>$10 each</b>. How many bills do I give you?\""], "starters": ["Every … costs … so I multiply …", "The total is …", "You give me … bills."], "notes": {"do": "You play the customer with the real toys and play money. She writes each number sentence on the whiteboard before she says the total. Add one or two of your own orders if time allows.", "ask": "After each order: \"What is the price? How many? Which operation? What is the total?\"", "listen": "4 × 5 = $20; 7 × 4 = $28 (double 7 is 14, double 14 is 28); 5 bills, $50. If she adds the price and the how-many, lay one tag on each item and ask: \"Does every ball cost $5?\""}}, {"type": "learn", "kick": "Learn", "title": "Not every money story is ✖️", "text": "Ask the detective questions first.", "steps": [{"text": "✖️ <b>Same price, many things.</b> 5 bowls at $3 each → 5 × 3 = <b>$15</b>"}, {"text": "➕ <b>Different things together.</b> A leash is $9. A collar is $6. Buy both → 9 + 6 = <b>$15</b>"}, {"text": "➖ <b>Compare costs.</b> A bed is $12. A blanket is $7. How much <b>more</b> is the bed? 12 − 7 = <b>$5</b>"}], "tip": "Is it the same price for each thing? Then multiply. If not, add or compare.", "notes": {"do": "Reveal one step at a time. Act each one out with the toys: two of the same toy (multiply), two different toys (add), hold up two toys side by side (compare).", "say": "\"Money stories still need the detective questions. Not every money story is multiply.\"", "ask": "\"A leash is $9 and a collar is $6. Is that the same price for each thing?\"", "listen": "\"No, they are different things, so add.\" For the bed and blanket: \"how much more\" means compare, so subtract."}}, {"type": "tap", "kick": "Name it", "title": "Multiply, add or subtract?", "text": "Read the story. Say what is happening. Then name the operation.", "items": [{"type": "fill", "q": "4 brushes at $5 each. What is the total?<br>Add, subtract or multiply?", "answers": ["multiply", "multiplication", "times", "x"], "why": "Every brush is $5. 4 × 5.", "no": "Does every brush cost the same?", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "A ball is $3 and a rope toy is $8. What do both cost?<br>Add, subtract or multiply?", "answers": ["add", "addition", "plus", "+"], "why": "Two different prices join. 3 + 8.", "no": "Are the prices the same?", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "A cage is $20. A bed is $14. How much more is the cage?<br>Add, subtract or multiply?", "answers": ["subtract", "subtraction", "minus", "take away", "-", "−"], "why": "<b>How much more</b> → compare. 20 − 14.", "no": "This asks you to compare two prices.", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "Liz has $15. She spends $6. How much is left?<br>Add, subtract or multiply?", "answers": ["subtract", "subtraction", "minus", "take away", "-", "−"], "why": "She <b>spends</b> money, so it goes away. 15 − 6.", "no": "Does Liz get money or spend it?", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "Every bag of treats is $7. Amy buys 3 bags.<br>Add, subtract or multiply?", "answers": ["multiply", "multiplication", "times", "x"], "why": "Every bag is $7. 3 × 7.", "no": "Find the word <b>every</b>.", "placeholder": "add, subtract or multiply"}, {"type": "fill", "q": "Ellie buys a $10 net and a $5 bowl.<br>Add, subtract or multiply?", "answers": ["add", "addition", "plus", "+"], "why": "Two different things, two different prices. 10 + 5.", "no": "Is it many things at the same price?", "placeholder": "add, subtract or multiply"}], "notes": {"do": "She reads each money story aloud, names the operation, then types it on your laptop herself (spelling counts). On the whiteboard, keep three columns: ✖️ same price, ➕ different things, ➖ spend or compare, and write each story's number sentence in its column.", "ask": "\"Is it the same price for each thing? Are two different things joining? Is money spent or compared?\"", "listen": "Watch the spend story (Liz has $15, spends $6): subtract, because money goes away."}}, {"type": "learn", "kick": "Watch me", "title": "Who spends more?", "text": "Ellie buys <b>3 leashes at $6 each</b>. Marion buys <b>4 collars at $4 each</b>. Who spends more?", "steps": [{"text": "<b>Ellie:</b> 3 × $6 = <b>$18</b>", "visual": {"kind": "groups", "groups": 3, "each": 6, "emoji": "💵", "label": "3 leashes. $6 for each one."}}, {"text": "<b>Marion:</b> 4 × $4 = <b>$16</b>", "visual": {"kind": "groups", "groups": 4, "each": 4, "emoji": "💵", "label": "4 collars. $4 for each one."}}, {"text": "<b>Compare:</b> $18 is more than $16. <b>Ellie</b> spends more. 18 − 16 = <b>$2</b> more."}], "tip": "Find <b>both</b> totals first. Then compare.", "notes": {"do": "Model it on the whiteboard: two boxes, one for each girl. Find each total, then compare. Then let her lay out the money for each girl to prove it.", "say": "\"The girl with more things does not always spend more. We have to find both totals.\"", "ask": "Before revealing: \"Who do you think spends more? Why?\" After: \"How much more?\"", "listen": "Ellie, $2 more. If she guesses Marion because Marion buys more things, point to both totals: Ellie buys fewer things but spends more."}}, {"type": "tap", "kick": "Try it", "title": "Shop problems", "items": [{"q": "Collars cost <b>$8 each</b>. Marion buys <b>4</b>. What is the total?", "choices": ["$12", "$32", "$36"], "a": 1, "why": "4 × 8. Double 8 is 16. Double 16 is <b>32</b>.", "no": ["$12 is 8 + 4. She buys 4 collars at $8 each.", null, "$36 is 4 × 9. The price is $8."]}, {"q": "A dog bed costs <b>$15</b>. A cat bed costs <b>$9</b>. How much <b>more</b> is the dog bed?", "choices": ["$6", "$24", "$5"], "a": 0, "why": "Compare: 15 − 9 = <b>6</b>.", "no": [null, "$24 is 15 + 9. <b>How much more</b> means subtract.", "Check: 5 + 9 = 14, not 15."]}, {"q": "Amy buys <b>3 bags of food at $7 each</b>. Liz buys <b>4 toys at $5 each</b>. Who spends more?", "choices": ["Liz spends more.", "They spend the same.", "Amy spends more."], "a": 2, "why": "Amy: 3 × 7 = $21. Liz: 4 × 5 = $20. $21 is more.", "no": ["Liz spends 4 × 5 = $20. Now find Amy's total: 3 × 7.", "Find both totals. Are $21 and $20 the same?", null]}], "notes": {"do": "Guided practice. She solves each one on the whiteboard first, then answers. She says the operation out loud before the total.", "ask": "\"Same price, different things, or compare?\" On the last one: \"What are both totals?\"", "listen": "$32 (double, double), $6 (compare), Amy ($21 vs $20)."}}, {"type": "tap", "kick": "Quick check", "title": "Shop words", "items": [{"type": "fill", "q": "Bones are <b>$4 each</b>. Ellie buys <b>7</b>. She pays <b>$28</b>.<br>The $4 is the ____.", "answers": ["price"], "why": "The <b>price</b> is what <b>one</b> thing costs: $4.", "no": "What does <b>one</b> bone cost? What is that called?", "placeholder": "Type the word"}, {"type": "fill", "q": "In <b>7 × $5 = $35</b>, what is the <b>product</b>?", "answers": ["35"], "why": "The product is the answer when you multiply: <b>35</b>.", "no": "The product is the answer after the = sign.", "placeholder": "Type a number"}, {"q": "Which numbers are all <b>multiples of 10</b>?", "choices": ["10, 25, 30", "30, 50, 70", "5, 10, 20"], "a": 1, "why": "Skip count by 10s: 10, 20, 30, 40, 50, 60, 70. You land on 30, 50 and 70.", "no": ["25 is a multiple of 5, but not of 10.", null, "5 is not a multiple of 10."]}], "notes": {"do": "Quick check for understanding. She answers out loud and spells the word. You type what she says.", "ask": "\"Spell price.\" \"What do we call the answer to a multiplication?\" \"Skip count by 10s and tell me which list you land on.\"", "listen": "price (spelled right), 35, the second list. If she misses the word, go back to the vocab cards (class slide 5)."}}, {"type": "talk", "kick": "Wrap-up", "title": "Tell me what you learned", "text": "Tell your teacher.", "prompts": ["When do you <b>multiply</b> in a money story?", "What is the <b>price</b>? What is the <b>total</b>?", "Spell <b>product</b> out loud."], "starters": ["I multiply when …", "The price is … The total is …", "P-R-O-D-U-C-T"], "notes": {"do": "Show the task list on the course page. Walk through it with her: tonight and Wednesday.", "say": "\"Tonight: the After-Class Lesson and Monday's Practice. Wednesday: today's Practice, Monday's Packet and page 1 of today's Packet. Read 10 minutes each night.\"", "listen": "Same price for every thing → multiply. Price = one thing; total = all of it."}}], "win": "Great shopping! You found every total like a pro!", "prev": "bb-bristol-L09", "prevTitle": "Lesson 9"});</script><div id="kce-legal" style="display:block;clear:both;box-sizing:border-box;width:100%;margin:0;padding:10px 16px;background:#0A1F3D;color:#C9A84C;font:12px/1.4 Arial,sans-serif;text-align:center">&copy; 2026 KingCretot Experience. All rights reserved. Licensed for KCE students only. Do not copy, share or distribute.</div><script>(function(){var e=document.getElementById("kce-legal");if(!e)return;function place(){var r=document.documentElement,b=document.body,t=null,best=0,a=b?b.getElementsByTagName("*"):[];for(var i=0;i<a.length;i++){var x=a[i];if(x===e||e.contains(x))continue;if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>innerHeight*0.5&&x.clientWidth>innerWidth*0.5){var o=getComputedStyle(x).overflowY;if((o==="auto"||o==="scroll")&&x.clientHeight*x.clientWidth>best){best=x.clientHeight*x.clientWidth;t=x}}}if(!t&&b){var bs=getComputedStyle(b),hs=getComputedStyle(r);if(/(hidden|clip)/.test(hs.overflowY)||(/(auto|scroll)/.test(bs.overflowY)&&b.scrollHeight>b.clientHeight+1))t=b;else t=r}if(t&&e.parentNode!==t)t.appendChild(e);var h=0;for(var j=0;j<a.length;j++){var s=getComputedStyle(a[j]);if(s.position==="fixed"&&s.display!=="none"&&s.visibility!=="hidden"&&!e.contains(a[j])){var q=a[j].getBoundingClientRect();if(q.height>0&&q.height<200&&q.bottom>=innerHeight-2&&q.width>innerWidth*0.5)h=Math.max(h,q.height)}}e.style.marginBottom=h?h+"px":"0"}if(document.readyState==="complete")setTimeout(place,50);else addEventListener("load",function(){setTimeout(place,50)})})();</script>
