    '<p><span class="pn">1</span>At the Riverside Rams’ Scouting Combine, players worked in pairs. One partner did push-ups while the other counted out loud. Coach Rivera was busy timing sprints at the other end of the field, so partners reported the scores to him later.</p>' +
